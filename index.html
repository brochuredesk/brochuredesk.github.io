<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>/* Testers with the pass go straight to the working site. */try{if(localStorage.getItem("bd-open")==="1")location.replace("/home/"+location.search+location.hash)}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BrochureDesk: coming soon</title>
<meta name="description" content="Listing brochures and matching marketing from one listing link. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Nunito+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{color-scheme:dark;--bg:#1a1917;--fg:#f1ede4;--muted:#9a948a;--accent:#d8c4a0;--deep:#7a2e2a}
*,*::before,*::after{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:'Nunito Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:hidden}
.sheet{position:fixed;left:50%;top:50%;width:min(62vmin,520px);aspect-ratio:11/8.5;border:1px solid rgba(216,196,160,.16);transform-origin:center}
.s1{transform:translate(-50%,-50%) rotate(-9deg)}
.s2{transform:translate(-50%,-50%) rotate(5deg);border-color:rgba(216,196,160,.1)}
.s3{transform:translate(-50%,-50%) rotate(-2deg);background:linear-gradient(135deg,rgba(122,46,42,.22),rgba(122,46,42,0) 60%)}
main{position:relative;text-align:center;max-width:640px}
.soon{font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:500;font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--accent)}
h1{font-family:'Libre Caslon Display',Georgia,serif;font-weight:400;font-size:clamp(46px,11vw,112px);line-height:1;letter-spacing:-.01em;margin:22px 0 20px}
p{font-size:clamp(16px,2.4vw,19px);line-height:1.6;color:var(--muted)}
a{color:var(--fg);text-decoration-color:var(--accent);text-underline-offset:4px}
.mail{margin-top:30px;font-size:15px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:drift 14s ease-in-out infinite alternate}.s2{animation-delay:-5s}.s3{animation-delay:-9s}@keyframes drift{to{margin-top:-10px}}}
</style>
</head>
<body>
<div class="sheet s1" aria-hidden="true"></div><div class="sheet s2" aria-hidden="true"></div><div class="sheet s3" aria-hidden="true"></div>
<main>
  <div class="soon">Coming soon</div>
  <h1>BrochureDesk</h1>
  <p>Listing brochures and matching marketing from one listing link.</p>
  <p class="mail"><a href="mailto:support@brochuredesk.com">support@brochuredesk.com</a></p>
</main>
</body>
</html>
