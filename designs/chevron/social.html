<script>
// this set's own carousel slide (owner 11/18/2026: hints of the main design on every slide); replaces the shared strip slide
(function(){
  const SS = window.SocialSet, esc = s => Ivory.esc(s);
  const rect = (x, y, w, h, css) => `<div class="abs" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${h}pt;${css}"></div>`;
  const txt = (slot, t, x, y, w, h, size, min, css) => `<div class="abs nw" data-slot="${slot}" data-lines="1" data-fit="${size},${min}" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${h}pt;font-size:${size}pt;line-height:${h}pt;${css}">${esc(t)}</div>`;
  const caps = (L, tr) => `text-transform:uppercase;letter-spacing:${tr}pt;`;
  SS.slide = (D, L, W, H) => {
    const bd = Object.assign({bg: L.page, ink: L.ink, accent: L.accent}, L.band || {}), id = D.piece.photo, word = SS.M, addr = D.listing.address;
    const photo = st => OHL.photo(D, id, st);
    const S = (D, L, W, H, X) => { const st = 108, y = H - st, d = 30; let h = X.rect(0, 0, W, H, `background:${L.page}`);
   const cut = [[0, 0], [1, 0], [1, 1 - d/(y + d*.5)], [.5, 1], [0, 1 - d/(y + d*.5)]], ph = y + d*.5;
   h += OHL.maskedPhoto(D, D.piece.photo, `left:0;top:0;width:${W}pt;height:${ph}pt`, cut);
   const e = 8, p = `0,${(ph - d + e).toFixed(1)} ${W/2},${(ph + e).toFixed(1)} ${W},${(ph - d + e).toFixed(1)}`;
   h += `<svg class="abs" style="left:0;top:0;width:${W}pt;height:${H}pt;overflow:visible;pointer-events:none" viewBox="0 0 ${W} ${H}"><polyline points="${p}" fill="none" stroke="var(--ss-acc)" stroke-width="2.2"/></svg>`;
   const ry = ph + 20; h += X.rect(W/2 - 70, ry, 58, 1, 'background:var(--ss-acc)') + X.rect(W/2 + 12, ry, 58, 1, 'background:var(--ss-acc)') + X.rect(W/2 - 4.5, ry - 4, 9, 9, 'background:var(--ss-acc);transform:rotate(45deg)');
   h += X.txt('moment', X.word, 30, ry + 10, W - 60, 26, 18, 17, `font-family:${L.labelFont || L.display};font-weight:700;${X.caps(L, 3)}color:var(--ss-acc);text-align:center`);
   h += X.txt('address', X.addr, 30, ry + 38, W - 60, 34, 26, 17.5, `font-family:${L.display};font-weight:700;color:${L.ink};text-align:center`);
   return h; };
    return S(D, L, W, H, {bd, photo, word, addr, rect, txt, caps});
  };
})();
</script><!-- b1soc slide -->
<script src="cv-social.js"></script>
<!-- Just Listed and Just Sold social sets in this set's look (templates/_shared/socialset.js); the look is in socials.json.
     The brand kit's main / accent / dark colors (data.brand.colors) set the field and accents, as the set's other pieces do. -->

<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
SocialSet.start(D => {
  const c = (D.brand || {}).colors || {}, r = document.documentElement.style;
  const rgb = h => { h = String(h||'').replace('#',''); if(h.length===3) h = h.split('').map(x=>x+x).join(''); const n = parseInt(h,16); return [n>>16&255, n>>8&255, n&255]; };
  const lum = h => { const v = rgb(h).map(q => { q/=255; return q <= .03928 ? q/12.92 : Math.pow((q+.055)/1.055, 2.4); }); return .2126*v[0] + .7152*v[1] + .0722*v[2]; };
  const con = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); };
  const on = bg => con(bg, '#ffffff') >= con(bg, '#161616') ? '#ffffff' : '#161616';
  const dark = c.dark || '#10282b', main = c.main || '#1f6f6b', acc0 = c.accent || '#e8b84d';
  const acc = con(acc0, dark) >= 3 ? acc0 : on(dark);
  r.setProperty('--ss-page', dark); r.setProperty('--ss-anchor', acc0); r.setProperty('--ss-main', main); r.setProperty('--ss-dark', dark); r.setProperty('--ss-ink', on(dark)); r.setProperty('--ss-acc', acc); r.setProperty('--ss-band', main); r.setProperty('--ss-bandink', on(main)); r.setProperty('--ss-bandacc', con(acc0, main) >= 3 ? acc0 : on(main));
  // Just Sold: Chevron's own layouts (cv-social.js, owner 11/18/2026); Just Listed keeps its approved layout and V-cut slide
  if(D.piece && D.piece.moment === 'js'){ SocialSet.portrait = CVSold.portrait; SocialSet.landscape = CVSold.landscape; SocialSet.slide = CVSold.slide; }
});
</script>

<script>
// Chevron's signature on every social image (owner's one-package rule): the hero's foot is cut into B46B's wide V, drawn again as the
// gold echo in the field under it, as on the cover and the postcards. Only when the whole house stays inside the cut (OHL.polyFits),
// shallower until it does, else a straight edge. Carousel slides keep their own layout.
window.brochureReady = window.brochureReady.then(() => {
  const D = JSON.parse(document.getElementById('brochure-data').textContent || '{}'), pg = document.querySelector('.page');
  if(!pg || !D.piece || D.piece.shape === 'slide') return;
  const P = pg.getBoundingClientRect(), pt = v => v*0.75;
  const ph = [...pg.querySelectorAll('.photo')].map(e => [e, e.getBoundingClientRect()]).sort((a, b) => b[1].width*b[1].height - a[1].width*a[1].height)[0];
  if(!ph) return; const [el, r] = ph, w = pt(r.width), h = pt(r.height), id = el.dataset.photo || (Object.keys(D.photos || {}).find(k => (el.querySelector('img') || {}).src && el.querySelector('img').src.endsWith(String((D.photos[k] || {}).src || '').split('/').pop())));
  // the cut only where the photo's foot meets the field (not the card's foot)
  if(r.bottom > P.bottom - 4) return;
  let d = Math.min(0.12, 26/h), cut = null;
  for(; d >= 0.03; d -= 0.01){ const c = [[0, 0], [1, 0], [1, 1 - d], [0.5, 1], [0, 1 - d]]; if(!id || OHL.polyFits(D, id, w, h, c, 0.015)){ cut = c; break; } }
  if(!cut) return;
  el.style.clipPath = `polygon(${cut.map(([x, y]) => `${(x*100).toFixed(2)}% ${(y*100).toFixed(2)}%`).join(',')})`;
  el.dataset.poly = cut.map(q => q.join(' ')).join(',');
  const x0 = pt(r.left - P.left), y0 = pt(r.top - P.top), off = Math.max(6, w*0.018), sw = Math.max(1.6, w*0.006);
  const pts = [[x0, y0 + h*(1 - d)], [x0 + w/2, y0 + h], [x0 + w, y0 + h*(1 - d)]].map(([x, y]) => `${x.toFixed(2)},${(y + off).toFixed(2)}`).join(' ');
  pg.insertAdjacentHTML('beforeend', `<svg class="cv-echo" style="position:absolute;left:0;top:0;width:${pt(P.width)}pt;height:${pt(P.height)}pt;overflow:visible;pointer-events:none" viewBox="0 0 ${pt(P.width)} ${pt(P.height)}"><polyline points="${pts}" fill="none" stroke="var(--ss-acc)" stroke-width="${sw}" stroke-linejoin="miter" stroke-miterlimit="10"/></svg>`);
});
</script>










<!-- b1soc logo -->
<script>
const LANDFIX = () => false;
window.brochureReady = window.brochureReady.then(async () => {
  const D = JSON.parse(document.getElementById('brochure-data').textContent || '{}'), pg = document.querySelector('.page');
  if(!pg || !D.piece || (D.piece.moment !== 'js' && D.piece.shape !== 'square')) return;
  // a logo set under the agent's lines (not beside them) is centered on those lines, as the shared freespace check wants
  // (measured as the shared freespace check does: the logo's drawn ink, the agent's text lines above it that it overlaps)
  const lines = [...pg.querySelectorAll('[data-slot^="agent."]')].flatMap(e => { const out = [], tw = document.createTreeWalker(e, NodeFilter.SHOW_TEXT);
    for(let n = tw.nextNode(); n; n = tw.nextNode()){ if(!n.textContent.trim()) continue; const rg = document.createRange(); rg.selectNodeContents(n); for(const q of rg.getClientRects()) if(q.width > .5) out.push(q); } return out; });
  await Promise.all([...pg.querySelectorAll('.logo img')].map(i => (i.decode ? i.decode() : Promise.resolve()).catch(() => 0)));
  const LAND = (D.piece.shape === 'wide' || D.piece.shape === 'gbp') && LANDFIX(D, pg);
  if(!LAND) pg.querySelectorAll('.logo').forEach(lg => { const im = lg.querySelector('img'); if(!im || !im.naturalWidth) return;
    for(let k = 0; k < 4; k++){
      const q = im.getBoundingClientRect(), ar = im.naturalWidth/im.naturalHeight, dw = Math.min(q.width, q.height*ar), dh = dw/ar;
      const pos = (getComputedStyle(im).objectPosition || '50% 50%').split(' ')[0], fx = /%/.test(pos) ? parseFloat(pos)/100 : .5;
      const T = {l: q.left + (q.width - dw)*fx, r: q.left + (q.width - dw)*fx + dw, t: q.top + (q.height - dh)/2};
      const U = lines.filter(o => o.bottom <= T.t + 1 && T.t - o.bottom < pg.getBoundingClientRect().height*.25 && o.right > T.l && o.left < T.r);
      if(!U.length) return; if(U.some(o => o.bottom > T.t + 1)) return;
      const dx = (Math.min(...U.map(o => o.left)) + Math.max(...U.map(o => o.right)))/2 - (T.l + T.r)/2; if(Math.abs(dx) < 1) return;
      const cur = /translateX\(([-\d.]+)px\)/.exec(lg.style.transform || ''); lg.style.transform = `translateX(${((cur ? parseFloat(cur[1]) : 0) + dx).toFixed(2)}px)`;
    } });
  if(D.piece.shape === 'slide') return;
  const P = pg.getBoundingClientRect(), pt = v => v*0.75, acc = getComputedStyle(document.documentElement).getPropertyValue('--ss-acc').trim();
  const photos = [...pg.querySelectorAll('.photo')].map(e => [e, e.getBoundingClientRect()]).sort((a, b) => b[1].width*b[1].height - a[1].width*a[1].height);
  if(!photos.length) return;
  const [el, r] = photos[0], w = pt(r.width), h = pt(r.height), x0 = pt(r.left - P.left), y0 = pt(r.top - P.top);
  const texts = [...pg.querySelectorAll('.nw,.wr,.cc')].filter(t => (t.textContent || '').trim()).map(t => t.getBoundingClientRect());
  const clear = (x, y, ww, hh, pad) => !texts.some(t => { const a = {l: pt(t.left - P.left) - pad, t: pt(t.top - P.top) - pad, r: pt(t.right - P.left) + pad, b: pt(t.bottom - P.top) + pad};
    return x < a.r && x + ww > a.l && y < a.b && y + hh > a.t; });
  const atFoot = r.bottom > P.bottom - 4, atTop = r.top < P.top + 4, atL = r.left < P.left + 4, atR = r.right > P.right - 4;
  const svg = inner => pg.insertAdjacentHTML('beforeend', `<svg class="sig" style="position:absolute;left:0;top:0;width:${pt(P.width)}pt;height:${pt(P.height)}pt;overflow:visible;pointer-events:none" viewBox="0 0 ${pt(P.width)} ${pt(P.height)}">${inner}</svg>`);
  const box = (x, y, ww, hh, css) => pg.insertAdjacentHTML('beforeend', `<div class="abs sig" style="left:${x}pt;top:${y}pt;width:${ww}pt;height:${hh}pt;pointer-events:none;${css}"></div>`);
  const id = el.dataset.photo || '';
  const SIG = () => {
   if(!/^(post|square|pin)$/.test(D.piece.shape)) return;
   const hb = pt(r.bottom - P.top), H0 = pt(P.height), W0 = pt(P.width), R = e => { const q = e.getBoundingClientRect(); return {e, t: pt(q.top - P.top), b: pt(q.bottom - P.top)}; };
   const kids = [...pg.children].filter(e => { const q = e.getBoundingClientRect(); return pt(q.top - P.top) >= hb - .5 && pt(q.width) < W0*.95 && pt(q.height) > 0; }).map(R).sort((a, b) => a.t - b.t);
   if(!kids.length) return;
   // rows: items whose heights overlap ride together
   const rows = []; kids.forEach(k => { const w = rows.find(rw => k.t < rw.b - .5 && k.b > rw.t + .5); if(w){ w.items.push(k); w.t = Math.min(w.t, k.t); w.b = Math.max(w.b, k.b); } else rows.push({t: k.t, b: k.b, items: [k]}); });
   rows.sort((a, b) => a.t - b.t);
   const used = rows.reduce((s, rw) => s + rw.b - rw.t, 0), free = H0 - hb - used, cap = H0*.028;
   // room past an even 2.8% gap goes to the house photo (taller frame) when the whole house still fits; the seam marks move with it
   let grow = Math.max(0, free - cap*(rows.length + 1)), top = hb;
   if(grow > 2){
     const ph = [...pg.querySelectorAll('.photo')].filter(e => Math.abs(pt(e.getBoundingClientRect().bottom - P.top) - hb) < 1.5);
     const H1 = h + grow, cutOK = !id || !window.OHL || !OHL.houseInFrame || (() => { const b = OHL.houseInFrame(D, id, w, H1); return !b || (b.left >= .015 && b.right <= .985); })();
     if(!cutOK) grow = 0;
     if(grow > 2){
       ph.forEach(e => e.style.height = (pt(e.getBoundingClientRect().height) + grow) + 'pt');
       pg.querySelectorAll('.sig, .cv-echo').forEach(e => { const q = e.getBoundingClientRect(), t = pt(q.top - P.top);
         if(e.tagName.toLowerCase() === 'svg') e.style.transform = `translateY(${grow}pt)`; else if(t >= hb - 16 && t <= hb + 16) e.style.top = (parseFloat(e.style.top) + grow) + 'pt'; });
       top = hb + grow;
     }
   }
   const gap = (H0 - top - used)/(rows.length + 1);
   if(gap < 1) return;
   let y = top + gap; rows.forEach(rw => { const dy = y - rw.t; rw.items.forEach(k => { const t = parseFloat(k.e.style.top); if(!isNaN(t)) k.e.style.top = (t + dy) + 'pt'; else k.e.style.transform = `translateY(${dy}pt)`; }); y += rw.b - rw.t + gap; });
   // a gap taller than 2% of the card (its type boxes carry leading, so the ink gap runs larger) gets the set's own short accent rule at its middle (the hairline the set runs between blocks)
   if(gap > H0*.02){ const ow = Math.max(40, W0*.16); let yy = top; rows.forEach((rw, i) => { if(i) pg.insertAdjacentHTML('beforeend', `<div class="abs sig" style="left:${(W0 - ow)/2}pt;top:${yy + gap/2 - .7}pt;width:${ow}pt;height:1.4pt;background:var(--ss-anchor);pointer-events:none"></div>`); yy += gap + rw.b - rw.t; }); }
 };
  SIG();
});
</script><!-- b1soc logo -->
</body>
