<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · fxs-14 postcards</title>
<link rel="stylesheet" href="fxs14.css">
<script src="fxs14.js"></script>
<script src="../engine/baths.js"></script>
<script src="../engine/agentcard.js"></script>
<!--
  BrochureDesk · fxs-14 · Just Listed and Just Sold postcards.
  data.piece.card = "listed" | "sold", data.piece.size = "6x11" (trim 792 x 432 pt) | "6x9" (648 x 432 pt), data.piece.side = "front" | "back".
  Print adds 0.125 in (9 pt) bleed. The agent's brand color (brand.accent) is the field on both sides; boxes are white.
  Front: the whole house (roof to steps) on the right with a one-line-or-two caption and a white box under it, the status stacked large on the left over the address,
  the fact rows and the brokerage logo (Just Listed) or the agent's name and number and the logo (Just Sold). No price, no QR.
  Back: status line, interior photos with captions, a white box (the write-up, or the steps), the standard contact card (templates/_shared/agentcard.js,
  band preset, which carries the back's one logo), the fine print. The right 289.5 pt (4.02 in) is the mail vendor's: return address, postage and address
  zones; drawn as guides on proofs and left clear in print.
  Copy comes from data.sw.pc.{jl|js}.{front|back} as a lead plus whole sentences; fxs14.js picks the sentences that fill each box.
-->
<style>
  /* the FX14 hand on a postcard: white frame, a taupe block, Pinyon Script status, white underlined labels, hairline white boxes; tokens in fxs14-tokens.css */
  .pc-col{position:absolute;display:flex;flex-direction:column}
  .pc-wbox{background:transparent;border:var(--fx-rule-w) solid var(--fx-rule);color:var(--fx-soft);padding:10pt 14pt 9pt;display:flex;flex-direction:column;overflow:hidden}
  .pc-wbox .k{font:var(--fx-label-w) 8.5pt/11pt var(--fx-font);letter-spacing:var(--fx-label-track);text-transform:uppercase;color:var(--fx-on);white-space:nowrap;overflow:hidden;margin-bottom:3pt;text-decoration:underline;text-decoration-thickness:.75pt;text-underline-offset:3pt;align-self:flex-start}
  .pc-wbox .p{font-family:var(--fx-font);overflow:hidden;color:var(--fx-soft)}
  .pc-wbox .p b{font-weight:700;color:var(--fx-on)}
  .pc-bstatus{position:absolute;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
  .pc-bstatus .st{font:700 10.5pt/1 var(--fx-font);letter-spacing:2.4pt;color:var(--fx-on);text-transform:uppercase}
  .pc-bstatus .ln{flex:1;height:var(--fx-rule-w);background:var(--fx-rule);margin:0 10pt;min-width:16pt}
  .pc-bstatus .ad{font:400 16pt/1 var(--fx-script);color:var(--fx-on);padding-bottom:3pt}
  .pc-steps .it{display:flex;gap:8pt;align-items:baseline;white-space:nowrap;overflow:hidden}
  .pc-steps .bx{width:4pt;height:4pt;border-radius:50%;background:var(--fx-on);flex:none;transform:translateY(-1pt)}
  .pc-call{font:400 15pt/16pt var(--fx-script);color:var(--fx-on);white-space:nowrap;overflow:hidden}
  .pc-disc{position:absolute;font-size:6pt;line-height:10pt;color:var(--fx-soft);overflow:hidden;white-space:nowrap}
  .pc-ret{position:absolute;font:500 9pt/11pt var(--fx-font);letter-spacing:.2pt;color:var(--fx-on);overflow:hidden;height:34pt}
  .pc-ret b{font-weight:700;letter-spacing:1.4pt;text-transform:uppercase;color:var(--fx-ink)}
  .cap .a{font-weight:400}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const esc = SW.esc, b = D.brand || {}, A = D.agent || {}, L = D.listing, P = D.piece || {};
  document.body.dataset.mode = D.mode || 'email';
  await SW.setup(D);
  const sold = P.card === 'sold', big = P.size === '6x11', front = P.side === 'front';
  const W = big ? 792 : 648, H = 432;
  const K = ((D.sw || {}).pc || {})[sold ? 'js' : 'jl'] || {};
  const hsSrc = A.headshot && ((D.photos||{})[A.headshot] ? D.photos[A.headshot].src : A.headshot) || '';
  const statusWord = sold ? 'Just Sold' : 'Just Listed';
  const issues = [];
  const logo = (cls, src, area, maxh, style) => `<div class="logo ${cls}" data-area="${area}" data-maxh="${maxh}" style="${style||''}">${src ? `<img src="${esc(src)}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage||'')}</span>`}</div>`;
  const CL = big ? 13.5 : 12.5, CF = big ? 'font-size:10.9pt;line-height:13.5pt;' : '';   // the 6x11 sets its type up from the 6x9 (11 pt against 9.5), not the same size with more room
  const cap = (c, slot, lines, extra, min) => (c = (c.photo ? FXS.augment(D, c) : c), `<div class="cap" style="height:${5 + lines*CL}pt;${extra||''}"><div class="a" data-min="${min || 2}" data-slot="${slot}" data-narrow="12" data-nstep="6" data-lh="${CL}" data-lines="${lines}" data-lead="${esc(c.lead||'')}" data-s='${esc(JSON.stringify([].concat(c.s||[]))).replace(/'/g,'&#39;')}' style="height:${lines*CL}pt;${CF}"></div></div>`);
  let h = '';

  if(front){
    // The FX14 hand on a postcard front. A white frame top and side, the whole house in it, a taupe block around it with the status in Pinyon Script.
    // JL: "Just Listed" in script beside the house, the horizontal address, three facts; under the house the caption ("Front.", the draws) and the agent and logo along the foot.
    // JS: sells the agent: "Just Sold" in the same script lockup, the name and phone big on the left, the house on the right with the agent's own note, the logo.
    const M = 12, F = K.front || {}, hh = big ? 292 : 290, hw = big ? 470 : 358;
    const hx = sold ? W - M - hw : M;
    const draws = list => { const w = x => /gated|roof|pergola|deck|park|garage|island|stone|corner|pool/i.test([].concat(x)[0]) ? 0 : 1; return (list || []).map((x, i) => [w(x), i, x]).sort((p, q) => p[0] - q[0] || p[1] - q[1]).map(t => t[2]); };
    const capC = sold ? {lead: '', s: (F.note || {}).s || (F.cap || {}).s} : (F.caption ? {lead: F.caption.lead, s: F.caption.s.concat(draws((F.about || {}).s || []))} : {lead: 'Front.', s: draws((F.about || {}).s || (F.cap || {}).s)});
    const norm = x => String(x).toLowerCase().replace(/[^a-z0-9 ]/g, '').slice(0, 40), allAlts = list => [].concat(...(list || []).map(x => [].concat(x)));
    const backSet = new Set([].concat(allAlts(((K.back || {}).about || {}).s), ...((K.back || {}).photos || []).map(c => allAlts(c.s)), allAlts((K.back || {}).steps6), allAlts((K.back || {}).steps)).map(norm));
    const backAll = allAlts(((K.back || {}).about || {}).s).map(String);   // the back's About box
    if(capC.s){ const kept = capC.s.filter(x => ![].concat(x).some(a => backSet.has(norm(a)))); if(kept.length >= 2) capC.s = kept; }
    // the caption's own first sentence stays; a later one that says a fact the back's About box says (the deck and pergola, in other words) drops out
    if(capC.s && capC.s.length > 2){ const tail = capC.s.slice(1).filter(x => ![].concat(x).some(a => backAll.some(b => SW.sameFact(String(a), b)))); if(tail.length >= 1) capC.s = [capC.s[0]].concat(tail); }
    const roomIds = [...new Set([].concat(((D.sw||{}).back||{}).photos||[], ((D.sw||{}).left||{}).photos||[]).map(c => c.photo))].filter(id => (D.photos||{})[id] && !(D.photos[id]||{}).fullHouse && id !== F.cap.photo).slice(0, 2);
    h += sold ? `<div class="taupe" style="left:-9pt;top:${M}pt;width:${W - M + 9}pt;bottom:-9pt"></div>` : `<div class="taupe" style="left:${M}pt;top:${M}pt;right:-9pt;bottom:-9pt"></div>`;
    h += SW.heroHtml(D, F.cap.photo, hx, M, hw, hh, 'front.hero', F.side || roomIds);
    const capLines = 3, CLs = big ? 13.5 : 12.5, IN = 16;   // Just Listed front: the caption and the agent sit 16 pt in from the taupe's left edge (owner 11/7/2026, FXS-14 p11/p13: both were too close to the left)
    h += cap(capC, 'front.hero', capLines, `position:absolute;left:${sold ? hx : hx + IN}pt;top:${M + hh + 8}pt;width:${sold ? hw : hw - IN}pt;padding-top:0`, sold ? 2 : 3);
    const foot = H - 60;
    const status = (cx0, cw, y0) => { const sz = FXS.fitSize('Listed', "font-family:'Pinyon Script'", cw, big ? 66 : 58, 40), top = y0;
      return {html: `<div class="script" style="left:${cx0}pt;top:${top}pt;width:${cw}pt;height:${sz*1.1}pt;font-size:${sz}pt;line-height:${sz*1.1}pt" data-slot="front.status" data-lines="1">Just</div><div class="script" style="left:${cx0 + 14}pt;top:${top + sz*.82}pt;width:${cw}pt;height:${sz*1.1}pt;font-size:${sz}pt;line-height:${sz*1.1}pt" data-slot="front.status2" data-lines="1">${sold ? 'Sold' : 'Listed'}</div>`, bottom: top + sz*.82 + sz*1.05, sz}; };
    if(!sold){
      const cx0 = M + hw + 28, cw = W - 20 - cx0, st = status(cx0, cw, M + 2);
      h += st.html;
      const ay = st.bottom + 4, st1 = FXS.street(L.address), full = String(L.address).toUpperCase();
      const aS = FXS.fitSize(full, "font-family:Montserrat;font-weight:700;letter-spacing:1.5pt", cw, big ? 12.5 : 11.5, 8.5);
      h += `<div class="abs" style="left:${cx0}pt;top:${ay}pt;width:${cw}pt;height:${aS*1.4}pt;font:700 ${aS}pt/${aS*1.4}pt var(--fx-font);letter-spacing:1.5pt;color:var(--fx-on);white-space:nowrap;overflow:hidden" data-slot="front.address" data-lines="1">${esc(full)}</div>`;
      h += `<div class="abs" style="left:${cx0}pt;top:${ay + aS*1.4 + 1}pt;width:${cw}pt;font:600 ${big ? 9.5 : 8.5}pt/12pt var(--fx-font);letter-spacing:2pt;color:var(--fx-soft);white-space:nowrap;overflow:hidden" data-slot="front.place" data-lines="1">${esc((FXS.hood(L) ? FXS.hood(L) + ' · ' : '') + L.city.toUpperCase() + ' ' + (L.zip || ''))}</div>`;
      const fy = ay + aS*1.4 + 20, facts = FXS.statItems(L).slice(0, 3), fh = Math.min(24, (M + hh - 6 - fy)/3);
      facts.forEach((t, i) => { h += `<div class="abs hr" style="left:${cx0}pt;top:${fy + i*fh}pt;width:${cw}pt"></div><div class="abs" style="left:${cx0}pt;top:${fy + i*fh + (fh - 17)/2}pt;width:${cw}pt;height:18pt;display:flex;align-items:baseline;white-space:nowrap" data-slot="front.fact.${i}" data-lines="1">${FXS.statHtml(t, big ? 17 : 16, big ? 8.5 : 8, 1.6)}</div>`; });
      h += `<div class="abs hr" style="left:${cx0}pt;top:${fy + 3*fh}pt;width:${cw}pt"></div>`;
      { const hy = fy + 3*fh + 12, capAll = JSON.stringify(capC.s || []).toLowerCase(), noun = /garage|fenc|deck|pergola|gated|roof|patio|pool|balcon|turf|porch|window|floor|ceiling|trees|park|stair/, tg = FXS.tagFacts(D).tags.filter(t => FXS.width(t, 'font-family:Montserrat;font-weight:400;font-size:10pt') < cw - 14).filter(t => { const n = noun.exec(t.toLowerCase()); return !(n && capAll.includes(n[0])) && ![].concat(...(capC.s || []).map(x => [].concat(x))).some(s => SW.sameFact(t, s)); }).filter((t, i, arr) => !arr.slice(0, i).some(u => SW.sameFact(t, u))), nTag = Math.max(0, Math.min(4, tg.length, Math.floor((foot - 14 - hy - 18)/16)));
        if(nTag >= 2){ h += `<div class="abs" style="left:${cx0}pt;top:${hy}pt">${FXS.label('Highlights', 'front.hl.k')}</div>` + FXS.bullets(tg.slice(0, nTag), cx0 + 2, hy + 22, cw, 16, 'front.hl', nTag, 10).html; } }
      h += `<div class="abs hr" style="left:${M + IN}pt;top:${foot - 8}pt;width:${W - M - 20 - IN}pt"></div>`;
      h += `<div class="abs" style="left:${M + IN}pt;top:${foot}pt;width:330pt"><div style="font:400 ${big ? 21 : 19}pt/${big ? 25 : 23}pt var(--fx-serif);color:var(--fx-on);white-space:nowrap" data-slot="agent.name" data-lines="1">${esc(A.name||'')}</div><div style="font:600 ${big ? 15 : 14}pt/19pt var(--fx-font);color:var(--fx-on);white-space:nowrap" data-slot="agent.phone" data-lines="1">${esc(A.phone||'')}</div></div>`;
      h += FXS.logoW(D, W - 20 - 170, foot - 2, 170, 40, 'flex-end');
    } else {
      const cx0 = M + 14, cw = W - M - hw - 16 - cx0 - 6, st = status(cx0, cw, M + 2);
      h += st.html;
      const ns = FXS.fitSize(A.name || '', "font-family:'Libre Baskerville'", cw, big ? 30 : 25, 15), ps = FXS.fitSize(A.phone || '', "font-family:Montserrat;font-weight:700", cw, big ? 32 : 27, 15), ny = st.bottom + 2;
      h += `<div class="abs" style="left:${cx0}pt;top:${ny}pt;width:${cw}pt"><div style="font:400 ${ns}pt/${ns*1.2}pt var(--fx-serif);color:var(--fx-on);white-space:nowrap" data-slot="agent.name" data-lines="1">${esc(A.name||'')}</div><div style="font:600 9pt/12pt var(--fx-font);letter-spacing:3pt;color:var(--fx-soft);margin-top:2pt" data-slot="agent.desig" data-lines="1" data-fine="1">REALTOR®</div><div style="font:700 ${ps}pt/${ps*1.2}pt var(--fx-font);color:var(--fx-on);white-space:nowrap;margin-top:4pt" data-slot="agent.phone" data-lines="1">${esc(A.phone||'')}</div></div>`;
      const sy = ny + ns*1.2 + 2 + 12 + 4 + ps*1.2 + 10, full = String(L.address).toUpperCase(), aS = FXS.fitSize(full, "font-family:Montserrat;font-weight:700;letter-spacing:1.5pt", cw, 12, 8.5);
      h += `<div class="abs hr" style="left:${cx0}pt;top:${sy}pt;width:${cw}pt"></div><div class="abs" style="left:${cx0}pt;top:${sy + 7}pt;width:${cw}pt;font:700 ${aS}pt/${aS*1.4}pt var(--fx-font);letter-spacing:1.5pt;color:var(--fx-on);white-space:nowrap;overflow:hidden" data-slot="front.address" data-lines="1">${esc(full)}</div>`;
      h += `<div class="abs" style="left:${cx0}pt;top:${sy + 7 + aS*1.4}pt;width:${cw}pt;font:400 ${big ? 11 : 10}pt/14pt var(--fx-font);color:var(--fx-soft);white-space:nowrap;overflow:hidden" data-slot="front.facts" data-lines="1">${esc(FXS.statItems(L).slice(0, 3).join(' · '))}</div>`;
      const gt = sy + 7 + aS*1.4 + 22, gb = foot - 14, ssz = Math.min(FXS.fitSize('Thinking about', "font-family:'Pinyon Script'", cw, big ? 44 : 38, 24), (gb - gt)/2.15), tot = ssz*2.1;
      h += `<div class="script" style="left:${cx0}pt;top:${gt + (gb - gt - tot)/2}pt;width:${cw}pt;font-size:${ssz}pt;line-height:${ssz*1.05}pt;height:${ssz*1.1}pt" data-slot="front.cta1" data-lines="1">Thinking about</div><div class="script" style="left:${cx0 + 22}pt;top:${gt + (gb - gt - tot)/2 + ssz*1.0}pt;width:${cw}pt;font-size:${ssz}pt;line-height:${ssz*1.05}pt;height:${ssz*1.1}pt" data-slot="front.cta2" data-lines="1">selling?</div>`;
      h += `<div class="abs hr" style="left:${cx0}pt;top:${foot - 8}pt;width:${W - M - 20 - 6}pt"></div>`;
      h += FXS.logoW(D, W - 20 - 170, foot - 2, 170, 40, 'flex-end');
    }
  } else {
    // ---------------- BACK (round 5, the owner's edge-to-edge rule): the taupe field runs to every edge; only the postage box, the address block and the barcode strip sit on light panels (luminance 243; vendors print black ink and USPS needs a light field there) ----------------
    // zones (pt, trim coordinates): postage 84 x 98.25 top right, address block 240 x 112.5, barcode strip 342 x 45 bottom right, all clear of art and type
    const dx = W - 648, X = 30, G = 10, B = K.back || {};
    const Z = {postage: [552 + dx, 12, 84, 98.25], address: [405 + dx, 187.5, 240, 112.5], barcode: [306 + dx, 387, 342, 45]};
    window.__zones = Z; window.__cardX = 30;
    const PL = Z.barcode[0] - 8, cardH = 85.5, cardY = 301;
    h += `<div class="taupe" style="left:-9pt;top:-9pt;width:${W + 18}pt;height:${H + 18}pt"></div>`;
    const pnl = (x, y, w, hh) => `<div class="abs mailp" data-mail-panel="1" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${hh}pt;background:var(--fx-mail)"></div>`;
    h += pnl(Z.postage[0] - 6, -9, W + 9 - (Z.postage[0] - 6), Z.postage[1] + Z.postage[3] + 6 + 9);
    h += pnl(Z.address[0] - 6, Z.address[1] - 6, W + 9 - (Z.address[0] - 6), 301 - (Z.address[1] - 6));
    h += pnl(Z.barcode[0] - 8, 386.5, W + 9 - (Z.barcode[0] - 8), H - 386.5 + 9);
    const rx = Z.address[0], lw = rx - 14 - X;          // right column starts at the address block's left edge; the left zone is everything left of it
    const rw = Z.postage[0] - 12 - rx;                 // the return address: left of the postage box
    h += `<div class="pc-bstatus" style="left:${X}pt;top:10pt;width:${lw}pt;height:36pt" data-slot="back.status" data-lines="1" data-small="1"><span class="st" style="font:400 30pt/1 var(--fx-script);letter-spacing:0;text-transform:none;padding:2pt 0 4pt 2pt;overflow:visible">${esc(statusWord)}</span><span class="ln"></span></div>`;
    // the set's signature in the taupe between the postage box and the address block: the street in white script
    { const gy0 = Z.postage[1] + Z.postage[3] + 6 + 4, gy1 = Z.address[1] - 6 - 4, gx = rx, gw = W - 22 - gx, st = FXS.street(L.address), ss = FXS.fitSize(st, "font-family:'Pinyon Script'", gw, 40, 24), hh2 = ss*1.25;
      h += `<div class="script" style="left:${gx}pt;top:${gy0 + (gy1 - gy0 - hh2)/2}pt;width:${gw}pt;height:${hh2}pt;font-size:${ss}pt;line-height:${hh2}pt;white-space:nowrap;overflow:visible;text-align:left" data-slot="back.signature" data-lines="1">${esc(st)}</div>`; }
    const phH = big ? 85.5 : 86, capLines = 4, py = 56;
    const ps = (B.photos || []);
    let rowH = '', bx = py, bh = 0;
    if(!sold){
      const n = lw > 330 ? 3 : 2, lp = ps.slice(0, n), pw = (lw - G*(n - 1))/n;
      lp.forEach((c, i) => { const x = X + i*(pw + G);
        rowH += `<div class="abs" style="left:${x}pt;top:${py}pt;width:${pw}pt;height:${phH}pt">${SW.photo(D, c.photo, 'position:absolute;inset:0', 'back.photo'+i)}</div>`;
        rowH += cap(c, 'back.photo'+i, 5, `position:absolute;left:${x}pt;top:${py + phH}pt;width:${pw}pt;padding-top:5pt`); });
      bx = py + phH + 5 + 5*CL + 10; bh = 292 - bx;
    } else { bx = py; bh = 292 - py; }
    h += `<div class="row" style="position:absolute;left:0;top:0;width:${W}pt;height:${H}pt;display:block;pointer-events:none">${rowH}</div>`;
    // return address beside the postage box, on the taupe, right-justified to the postage panel's edge
    const ret = [b.brokerage || ''].concat([].concat(b.returnAddress || b.address || []).flatMap(a => String(a).split('\n'))).filter(Boolean).slice(0, 3);
    h += `<div class="pc-ret" data-small="1" data-fine="1" data-slot="back.return" style="left:${rx}pt;top:18pt;width:${rw}pt;text-align:right;color:var(--fx-on)"><b style="color:var(--fx-on)">${esc(ret[0] || '')}</b>${ret.slice(1).map(t => '<br>' + esc(t)).join('')}</div>`;
    if(!sold){
      const capNorm = new Set(ps.flatMap(c => [].concat(...(c.s || []).map(x => [].concat(x)))).map(x => String(x).toLowerCase().replace(/[^a-z0-9 ]/g, '').slice(0, 40)));
      const capAlts = ps.flatMap(c => FXS.augment(D, c).s.flatMap(x => [].concat(x))), aboutC = B.about && B.about.s ? Object.assign({}, B.about, {s: (() => { const kept = B.about.s.filter(x => ![].concat(x).some(a => capAlts.some(cs => SW.sameFact(a, cs)) || capNorm.has(String(a).toLowerCase().replace(/[^a-z0-9 ]/g, '').slice(0, 40)))); return kept.length >= 2 ? kept : B.about.s; })()}) : B.about;
      const lh = big ? 16 : 15, lines = Math.floor((bh - 11 - 11 - 3 - 9)/lh), pad = (bh - 14 - lines*lh)/2;
      h += `<div class="pc-wbox" data-want="${lines}" data-bh="${bh}" data-lh="${lh}" style="position:absolute;left:${X}pt;top:${bx}pt;width:${lw}pt;height:${bh}pt;padding-top:${pad}pt;padding-bottom:${pad}pt"><div class="k" data-slot="back.box.k" data-lines="1">About this home</div>${SW.para(aboutC, 'back.box', lines, 'p', `font-size:${big ? 13.5 : 12.25}pt`, lh).replace('data-lines="' + lines + '"', 'data-lines="' + lines + '" data-try="' + Array.from({length: lines - 2}, (_, i) => lines - i).join(',') + '"')}</div>`;
    } else {
      // the standard Just Sold back (owner 11/7): no room photos or captions; "Here's how I'd start" with six long bullets, two columns on the 6x11, the call line at the foot
      const steps = (B.stepsLong || B.help || B.steps6 || []).slice(0, 6), sfs = big ? 12 : 10.6, slh = sfs*(big ? 1.3 : 1.36), cols = big ? 2 : 1;
      if(steps.length < 6) issues.push({slot: 'back.steps', kind: 'fewer-than-six-bullets', detail: `${steps.length} bullets; the Just Sold back carries six`});
      const per = Math.ceil(steps.length/cols), item = (e, i) => `<div class="it" style="white-space:normal;align-items:flex-start;gap:8pt"><span class="bx" style="margin-top:${slh*.42}pt"></span><div class="stp" style="flex:1" data-slot="back.step${i}" data-try="${big ? "3,2,4" : "2,3,1"}" data-lines="${big ? 3 : 2}" data-lh="${slh}" data-narrow="24" data-nstep="3" data-s='${esc(JSON.stringify([e])).replace(/'/g, '&#39;')}'></div></div>`;

        <div class="k" style="flex:none;margin-bottom:0" data-slot="back.box.k" data-lines="1">Here’s how I’d start</div>

    }
    // the standard postcard contact card (owner 11/7): full width on the taupe under the address block, above the barcode strip; agent left, the one logo and the office lines right
    h += ContactCard.html([X, cardY, W - 2*X, cardH], Object.assign({}, A, {headshot: hsSrc}), Object.assign({}, b, {logo: b.logoOnDark || b.logo}), {postcard: true, fine: '', bottomGap: 0.5, grow: 0, fieldAccent: true, s: {inlineLabel: true, desigInline: true, pad: [8, 16, 7], hsGap: 12, hsW: 70, name: 21, nameFloor: 14, phone: 15, label: 8, line: 9.5, rowGap: 12, panelW: 170, panelPad: [4, 8], panelGap: 2, office: 8, officeLH: 1.1, logo: {wide: [96, 22], square: [26, 26], tall: [28, 28]}}});
    // the approved two-line disclaimer, bottom left beside the barcode strip, at the largest size that fits (8 pt down to 6)
    h += `<div class="pc-disc" id="pcdisc" style="left:${X}pt;top:392pt;width:${PL - 12 - X}pt;height:${2*10}pt" data-slot="back.fine" data-lines="2" data-fine="1"><div>Information deemed reliable but not guaranteed.</div><div>Not intended to solicit property listed with a broker.</div></div>`;
    // proof guides for the mail vendor's zones (left clear in print)
    if((D.mode || 'email') !== 'print'){
      const gb = (z, extra) => `left:${z[0]}pt;top:${z[1]}pt;width:${z[2]}pt;height:${z[3]}pt;${extra||''}`;
      h += `<div class="mg mg-stamp" style="${gb(Z.postage)}">Postage<br><span style="text-transform:none">mail vendor</span></div>
        <div class="mg mg-addr" style="${gb(Z.address)}">${[0,1,2,3].map(i => `<div class="aline" style="left:12pt;right:12pt;top:${28 + i*17.25}pt"></div>`).join('')}<div class="gl" style="left:12pt;bottom:9pt">Address block · filled by the mail vendor</div></div>
        <div class="mg mg-bar" style="${gb(Z.barcode)}"><div class="gl" style="left:0;right:0;top:50%;text-align:center;transform:translateY(-50%)">Barcode strip · keep clear</div></div>`;
    }
  }

  const f = SW.frame(D, W, H, h);
  document.getElementById('pages').innerHTML = f.html;
  window.pieceSize = {W: f.W, H: f.H, bleed: f.bleed};
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  SW.fill();
  if(!front && sold) fitSteps();
  SW.fitLogos();
  ContactCard.fit(document);
  
  // the About box is sized to its content: a write-up that sets in fewer lines than planned does not leave an empty strip at the foot of its box
  if(!front && !sold){ const bx0 = document.querySelector('.pc-wbox[data-want]'), p0 = bx0 && bx0.querySelector('[data-slot="back.box"]');
    if(bx0 && p0){ const n0 = SW.lines(p0).n, want = +bx0.dataset.want; if(n0 < want) bx0.style.height = (+bx0.dataset.bh - (want - n0)*(+bx0.dataset.lh)) + 'pt'; } }
  if(!front) fitDisc();
  issues.push(...SW.focus(D));
  if(!front){ issues.push(...mailCheck()); issues.push(...panelCheck(), ...backCheck()); }
  // the sold front's box and the listed boxes are checked like every paragraph: whole sentences, the last line at least 3/4 full
  window.brochureCheck = () => SW.check(D, issues);
  window.photoPlacements = SW.placements;

  // ---- the Just Sold front: the facts sit centered between the address and the agent's name, measured on the letters (ink, from the font's own metrics) ----
  function ink(el, noPunct){ const c = (ink.c || (ink.c = document.createElement('canvas').getContext('2d'))); let top = Infinity, bot = -Infinity;
    const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); let nd; const rg = document.createRange();
    while((nd = w.nextNode())){ const t = nd.textContent.trim(); if(!t) continue; const cs = getComputedStyle(nd.parentElement);
      c.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`; const m = c.measureText(t.replace(/\s+/g, ' '));
      let txt = cs.textTransform === 'uppercase' ? t.toUpperCase() : t; const m2 = c.measureText(txt), m3 = noPunct ? c.measureText(txt.replace(/[,.]/g, '')) : m2;   // a comma's tail is not a letter
      rg.selectNodeContents(nd); const qs = [...rg.getClientRects()].filter(q => q.width > 1); if(!qs.length) continue;
      const first = qs[0], last = qs[qs.length - 1];
      top = Math.min(top, first.top + m2.fontBoundingBoxAscent - m2.actualBoundingBoxAscent);
      bot = Math.max(bot, last.top + m2.fontBoundingBoxAscent + m3.actualBoundingBoxDescent); }
    return [top, bot]; }
  function centerFacts(){
    const col = document.querySelector('.pc-col'), addr = col.querySelector('.pc-addr'), st = col.querySelector('.pc-stats'), nm = col.querySelector('[data-slot="agent.name"]');
    const k = 72/96, g = 12;   // g: the gap from each hairline to the letters beside it, start value
    const rows = [...st.querySelectorAll('.r')]; if(!rows.length) return;
    const set = (mt, mb) => { st.style.marginTop = mt + 'pt'; st.style.marginBottom = mb + 'pt'; };
    set(0, 0);
    const aib = ink(addr)[1], nit = ink(nm)[0], ab = addr.getBoundingClientRect().bottom, ag = col.querySelector('.pc-agent').getBoundingClientRect().top;
    let mt = (aib + g/k - ab) * k, mb = (ag - (nit - g/k)) * k; mt = Math.max(2, mt); mb = Math.max(0, mb); set(mt, mb);
    for(let i = 0; i < 6; i++){
      const ft = ink(rows[0], 1)[0], fb = ink(rows[rows.length - 1], 1)[1], A = ft - aib, B = nit - fb, d = (B - A)/2*k;
      if(Math.abs(B - A)*k < 0.05) break;
      mt += d; mb -= d; set(mt, mb);
    }
    const ft = ink(rows[0], 1)[0], fb = ink(rows[rows.length - 1], 1)[1];
    window.__facts = {aboveFacts: +((ft - aib)*k).toFixed(2), belowFacts: +((nit - fb)*k).toFixed(2)};
  }
  function fitDisc(){ const el = document.getElementById('pcdisc'); if(!el) return; let fs = 8;
    const ok = () => [...el.children].every(c => { const r = document.createRange(); r.selectNodeContents(c); return r.getBoundingClientRect().width <= el.clientWidth; });
    for(; fs > 6; fs -= .25){ el.style.fontSize = fs + 'pt'; if(ok()) break; }
    el.style.fontSize = Math.max(6, fs) + 'pt'; el.dataset.fs = el.style.fontSize; }
  // owner 11/7 back rule: the standard contact card runs full width, and the light mail panels stay around the three postal zones (they never grow into a plain light block)
  // owner 11/7: the Just Sold back's six bullets are long (8 words or more) and the box is at least 85% filled with text (heading, bullet lines, call line against the box's inner height)
  function jsCheck(){ const out = [], box = document.querySelector('.sheet .pc-wbox'); if(!box) return out;
    const items = [...box.querySelectorAll('.stp, .hb .tx')], hOf = el => { const r = document.createRange(); r.selectNodeContents(el); return [...r.getClientRects()].reduce((m, q) => Math.max(m, q.bottom), 0) - [...r.getClientRects()].reduce((m, q) => Math.min(m, q.top), 1e9); };
    items.forEach((el, i) => { const w = el.textContent.trim().split(/\s+/).filter(Boolean).length; if(w < 8) out.push({slot: 'back.step' + i, kind: 'js-bullet-too-short', detail: `${w} words: "${el.textContent.trim()}"`}); });
    if(items.length < 6) out.push({slot: 'back.steps', kind: 'fewer-than-six-bullets', detail: items.length + ' bullets'});
    const cs = getComputedStyle(box), inner = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom), line = el => { const r = document.createRange(); r.selectNodeContents(el); const rs = [...r.getClientRects()].filter(q => q.width > 1); const lh = parseFloat(getComputedStyle(el).lineHeight) || 0; const rows = new Set(rs.map(q => Math.round(q.top))).size; return rows*lh; };
    let used = items.reduce((n, el) => n + line(el), 0); const k = box.querySelector('.k'), call = box.querySelector('.pc-call'); if(k) used += parseFloat(getComputedStyle(k).lineHeight) || 11; if(call) used += parseFloat(getComputedStyle(call).lineHeight) || 16;
    const fill = used/inner; window.__jsFill = +fill.toFixed(2);
    if(fill < .85) out.push({slot: 'back.steps', kind: 'js-box-under-85', detail: `the Just Sold box is ${Math.round(fill*100)}% full (85% minimum)`});
    return out; }
  // the Just Sold bullets take the largest size at which every one sets in full lines inside the box, then the leading opens until the box is at least 85% filled
  function fitSteps(){ const box = document.getElementById('stepsbox'), list = document.getElementById('stepslist'); if(!box || !list) return;
    const stp = [...list.querySelectorAll('.stp')], its = [...list.querySelectorAll('.it')], fits = () => box.scrollHeight <= box.clientHeight + .5;
    const okLines = () => stp.every(e => { const L = SW.lines(e); return L.n === 1 || L.fill >= .76; });
    const apply = (fs, m) => { list.style.fontSize = fs + 'pt'; list.style.lineHeight = (fs*m) + 'pt'; stp.forEach(e => { e.dataset.lh = fs*m; }); its.forEach(it => { it.querySelector('.bx').style.marginTop = (fs*m*.42) + 'pt'; }); SW.fill(); };
    const sizes = big ? [13.5, 13, 12.5, 12, 11.5, 11, 10.5, 10, 9.5] : [13, 12.5, 12.25, 12, 11.75, 11.5, 11.25, 11, 10.75, 10.5, 10.25, 10, 9.75, 9.5];
    for(const fs of sizes){ apply(fs, 1.25); if(!(okLines() && fits())) continue;
      for(let m = 1.25; m <= 1.7; m += .03){ apply(fs, m); if(!fits() || !okLines()){ apply(fs, m - .03); break; } jsCheck(); if(window.__jsFill >= .87) break; }
      return; }
    apply(sizes[sizes.length - 1], 1.25); }
  function backCheck(){ const out = [], pt = v => v*72/96, sh = document.querySelector('.sheet').getBoundingClientRect(), X0 = window.__cardX || 30;
    const cc = document.querySelector('.sheet .cc');
    if(!cc) out.push({slot: 'back.card', kind: 'no-contact-card', detail: 'the back has no standard contact card'});
    else { const r = cc.getBoundingClientRect(), l = pt(r.left - sh.left), rr = pt(r.right - sh.left), Wt = pt(sh.width) - 18;
      if(l > X0 + 1 || rr < Wt - X0 - 1) out.push({slot: 'back.card', kind: 'card-not-full-width', detail: `card spans ${l.toFixed(0)}-${rr.toFixed(0)} pt of ${Wt.toFixed(0)}`}); }
    let area = 0; document.querySelectorAll('.sheet [data-mail-panel]').forEach(el => { const r = el.getBoundingClientRect(); const w = Math.min(pt(r.right - sh.left) - 9, pt(sh.width) - 18) - Math.max(pt(r.left - sh.left) - 9, 0), h = Math.min(pt(r.bottom - sh.top) - 9, 432) - Math.max(pt(r.top - sh.top) - 9, 0); area += Math.max(0, w)*Math.max(0, h); });
    if(area > .25*(pt(sh.width) - 18)*432) out.push({slot: 'back.panels', kind: 'light-block-too-big', detail: `mail panels cover ${(100*area/((pt(sh.width) - 18)*432)).toFixed(0)}% of the card`});
    if(sold) out.push(...jsCheck());
    return out; }
  // nothing but the proof guides may sit in the mail vendor's zones (postage, address block, barcode strip)
  function lum(c){ const m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(c); return m ? .2126*m[1] + .7152*m[2] + .0722*m[3] : 0; }
  function panelCheck(){ const out = [], Z = window.__zones, sh = document.querySelector('.sheet').getBoundingClientRect(), pt = v => v*72/96;
    const panels = [...document.querySelectorAll('.mailp')].map(p => { const r = p.getBoundingClientRect(); return {l: pt(r.left - sh.left), t: pt(r.top - sh.top), r: pt(r.right - sh.left), b: pt(r.bottom - sh.top), lum: lum(getComputedStyle(p).backgroundColor)}; });
    if(!panels.length) out.push({slot: 'back.panel', kind: 'mail-panel-missing', detail: 'no light panel under the mail zones'});
    ['postage', 'address', 'barcode'].forEach(k => { const z = Z[k], p = panels.find(q => q.l <= z[0] + .5 && q.t <= z[1] + .5 && q.r >= z[0] + z[2] - .5 && q.b >= z[1] + z[3] - .5);
      if(!p) out.push({slot: 'back.' + k, kind: 'mail-zone-not-light', detail: `the ${k} zone is not fully on a light panel`});
      else if(p.lum < 200) out.push({slot: 'back.' + k, kind: 'mail-zone-not-light', detail: `the ${k} panel's luminance is ${Math.round(p.lum)} (200 minimum): vendors print black ink and USPS needs a light field`}); });
    // the taupe runs to every edge: nothing outside the three panels is light
    return out; }
  // the Just Sold bullets: each takes the longest wording that sets in 3 lines (2 on the 6x9) so the six read as full sentences
  function fitHelp(){
    const hbs = [...document.querySelectorAll('.hb')], grid = document.querySelector('.pc-help'), call = grid.parentElement.querySelector('.pc-call');
    const pick = maxL => hbs.forEach(el => { const tx = el.querySelector('.tx'), alts = JSON.parse(el.dataset.alts).slice().sort((p, q) => q.length - p.length); let best = null, bf = -1;
      for(const a of alts){ tx.textContent = a; const L = SW.lines(tx); if(L.n > maxL) continue; if(L.n === 1 || L.fill >= .76){ best = a; bf = 9; break; } if(L.fill > bf){ best = a; bf = L.fill; } }
      tx.textContent = best || alts[alts.length - 1]; });
    const over = () => Math.max(...hbs.map(e => e.getBoundingClientRect().bottom)) > call.getBoundingClientRect().top - 5 || grid.parentElement.scrollHeight > grid.parentElement.clientHeight + .5;
    const bad = () => hbs.filter(el => { const L = SW.lines(el.querySelector('.tx')); return L.n > 1 && L.fill < .75; });
    // the bullets take the largest size at which all six set in full lines (last line 3/4 full) inside the box: no empty band under the heading
    const base = big ? 8.5 : 8, top = big ? 15 : 12; let bestCfg = null;
    const apply = fs => hbs.forEach(el => { el.style.fontSize = fs + 'pt'; el.style.lineHeight = (fs*1.32) + 'pt'; el.querySelector('.bx').style.marginTop = (fs*1.32/2 - 2) + 'pt'; });
    // every size is tried; the one whose bullets keep the fullest wording (then the larger type) wins, all six on full last lines inside the box
    for(let fs = top; fs >= base; fs -= .25) for(const maxL of (big ? [3, 2] : [3, 2])){
      apply(fs); pick(maxL); if(over() || bad().length) continue;
      const len = hbs.reduce((n, el) => n + el.querySelector('.tx').textContent.length, 0), sc = fs*1000 + len;
      if(!bestCfg || sc > bestCfg.sc) bestCfg = {fs, maxL, sc}; }
    if(bestCfg){ apply(bestCfg.fs); pick(bestCfg.maxL); } else { apply(base); pick(3); }
    { const bxel = grid.parentElement; if(over() || bxel.scrollHeight > bxel.clientHeight + .5) issues.push({slot: 'back.steps', kind: 'steps-overflow', detail: 'the six bullets and the call line do not fit their box'}); }
    hbs.forEach(el => { const tx = el.querySelector('.tx'), L = SW.lines(tx); delete el.dataset.slot;
      if(L.n > 1 && L.fill < .75) issues.push({slot: 'back.step' + el.dataset.help, kind: 'last-line-short', detail: `last line is ${Math.round(L.fill*100)}% full (75% minimum): "${tx.textContent.slice(-24)}"`}); });
  }
  function mailCheck(){ const out = [], Z = window.__zones, pt = v => v*72/96, sh = document.querySelector('.sheet').getBoundingClientRect();
    const hit = (r, z) => pt(r.left - sh.left) < z[0] + z[2] - .5 && pt(r.right - sh.left) > z[0] + .5 && pt(r.top - sh.top) < z[1] + z[3] - .5 && pt(r.bottom - sh.top) > z[1] + .5;
    document.querySelectorAll('.sheet .ph, .sheet .pc-wbox, .sheet .cap, .sheet .cc, .sheet .pc-ret, .sheet .pc-bstatus, .sheet .pc-disc').forEach(el => {
      const r = el.getBoundingClientRect(); for(const k in Z) if(hit(r, Z[k])) out.push({slot: el.dataset.slot || el.className, kind: 'in-mail-zone', zone: k}); });
    return out; }
})();
