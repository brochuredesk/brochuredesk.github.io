<script>window.Ivory = window.Ivory || {esc: s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))};</script>
<script src="an-fo.js"></script>
<!--
  BrochureDesk · Angle · Just Listed and Just Sold postcards (the hand of the approved Open House library flyer P17 Angle).
  data.piece.card = "listed" | "sold", data.piece.size = "6x11" (trim 792 x 432 pt) | "6x9" (648 x 432 pt), data.piece.side = "front" | "back".
  Print adds 0.125 in (9 pt) bleed. The brand's main color is the field on both sides.
  Front: the whole house edge to edge on one side, its inner edge leaning (as far as the house allows) with the accent stripe along it;
  on the field JUST / LISTED or JUST / SOLD stacked in tall condensed caps, the street; Just Listed adds the facts as big numerals and two or
  three specific highlights (dated improvements first) on leaning marks, then the agent and the one logo; Just Sold puts the street right under
  the status, the seller question on a leaning tag, the agent's note on the dark panel sized to its text, the agent (about half the status's
  size) and the logo, never the house's features. A house too wide for a side panel goes across the top with its foot on the slant and the
  lockup in three columns under it. No price, no QR.
  Back: the status in condensed caps with a leaning accent bar, room photos with captions and "About this home" (Just Listed) or the six steps
  (Just Sold) on the brand's dark panel, the street in condensed caps between the postage box and the address block, and the set's signature:
  the dark band leaning up behind the standard contact card with the accent stripe along it, both ending at the mail vendor's light panels.
  The right 4.02 in is the mail vendor's: return address, postage and address zones; drawn as guides on proofs and left clear in print.
-->
<style>
  /* the Angle hand on a postcard: the main field, condensed caps, leaning accent marks, the dark panels and band; tokens in an-tokens.css */
  .pc-col{position:absolute;display:flex;flex-direction:column}
  .pc-wbox{background:var(--an-deep);color:var(--an-on-deep);padding:10pt 16pt 9pt;display:flex;flex-direction:column;overflow:hidden;--fx-on:var(--an-on-deep);--fx-soft:var(--an-on-deep);--fx-rule:rgba(255,255,255,.28)}
  .pc-wbox .k{font:600 8.6pt/11pt var(--an-font);letter-spacing:2.4pt;text-transform:uppercase;color:var(--cc-accent);white-space:nowrap;overflow:hidden;margin-bottom:3pt;align-self:flex-start}
  .pc-wbox .p{font-family:var(--an-font);font-weight:400;overflow:hidden;color:var(--an-on-deep)}
  .pc-wbox .p b{font-weight:600;color:var(--an-on-deep)}
  .pc-bstatus{position:absolute;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
  .pc-bstatus .st{font:700 30pt/1 var(--an-cond);letter-spacing:.4pt;color:var(--an-on);text-transform:uppercase}
  .pc-bstatus .ln{flex:1;height:8pt;background:var(--an-tag);transform:skewX(-14deg);margin:0 6pt 0 14pt;min-width:16pt}
  .pc-steps .it{display:flex;gap:8pt;align-items:baseline;white-space:nowrap;overflow:hidden}
  .pc-steps .bx{width:22pt;height:16pt;transform:skewX(-14deg) translateY(-3pt);background:var(--an-tag);flex:none;display:flex;align-items:center;justify-content:center}
  .pc-steps .bx i{font:700 12pt/1 var(--an-cond);font-style:normal;color:var(--an-on-accent);transform:skewX(14deg)}
  #stepsbox{background:transparent!important;padding-left:0!important;padding-right:0!important}
  #stepsbox .stp{color:var(--an-on)}
  .pc-call{font:700 13pt/16pt var(--an-cond);letter-spacing:.3pt;text-transform:uppercase;color:var(--cc-accent);white-space:nowrap;overflow:hidden}
  .pc-disc{position:absolute;font-size:6pt;line-height:10pt;color:var(--fx-soft);overflow:hidden;white-space:nowrap}
  .pc-ret{position:absolute;font:500 9pt/11pt var(--fx-font);letter-spacing:.2pt;color:var(--fx-on);overflow:hidden;height:34pt}
  .pc-ret b{font-weight:700;letter-spacing:1.4pt;text-transform:uppercase;color:var(--an-on)}
  .cap .a{font-weight:400}
  /* owner 11/16: the postcard contact block in two tight rows: name | cell, email and web on one line; the logo beside the office lines */
  .cc-post .cc-lines{display:flex;column-gap:12pt;align-items:baseline}
  .cc-post .cc-contact{align-items:baseline!important}
  .cc-post .cc-panel{flex-direction:row!important;align-items:center!important;justify-content:flex-end!important;text-align:left!important}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const esc = SW.esc, b = D.brand || {}, A = D.agent || {}, L = D.listing, P = D.piece || {};
  document.body.dataset.mode = D.mode || 'email';
  await SW.setup(D);
  const sold = P.card === 'sold', big = P.size === '6x11', front = P.side === 'front';
  const W = big ? 792 : 648, H = 432;
  const K = ((D.sw || {}).pc || {})[sold ? 'js' : 'jl'] || {};
  const hsSrc = A.headshot && ((D.photos||{})[A.headshot] ? D.photos[A.headshot].src : A.headshot) || '';
  const statusWord = sold ? 'Just Sold' : 'Just Listed';
  const issues = [];
  const logo = (cls, src, area, maxh, style) => `<div class="logo ${cls}" data-area="${area}" data-maxh="${maxh}" style="${style||''}">${src ? `<img src="${esc(src)}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage||'')}</span>`}</div>`;
  const CL = big ? 13.5 : 12.5, CF = big ? 'font-size:10.9pt;line-height:13.5pt;' : '';   // the 6x11 sets its type up from the 6x9 (11 pt against 9.5), not the same size with more room
  const cap = (c, slot, lines, extra, min) => (c = (c.photo ? FXS.augment(D, c) : c), `<div class="cap" style="height:${5 + lines*CL}pt;${extra||''}"><div class="a" data-min="${min || 2}" data-slot="${slot}" data-narrow="0" data-nstep="6" data-lh="${CL}" data-lines="${lines}" data-lead="${esc(c.lead||'')}" data-s='${esc(JSON.stringify([].concat(c.s||[]))).replace(/'/g,'&#39;')}' style="height:${lines*CL}pt;${CF}"></div></div>`);
  let h = '';

  if(front){
    // ---- Angle front: P17's sign-in header grown to a whole card. The whole house fills one side edge to edge, its inner edge leaning on the
    // tags' slant with the accent stripe along it; on the brand's main field the status in tall stacked condensed caps (the mailbox test: JUST
    // LISTED and the house read at arm's length), then the street. Just Listed: the facts as big numerals and two or three specific highlights
    // on leaning accent marks, the agent and the one logo at the foot. Just Sold: the street right under JUST SOLD, the seller question on a
    // leaning tag, the agent's note on the dark panel sized to its text, the agent (about half the status's size) and the logo. No price. ----
    const F = K.front || {}, k = big ? 1.12 : 1, pid = (F.cap || {}).photo || 'front', ST = 8, M = 30;
    const capC = sold ? {lead: '', s: (F.note || {}).s || []} : null;
    let PW = big ? 372 : 300; while(PW < W*(big ? 0.68 : 0.58) && !SW.fits(D, pid, PW + 1, H + 18)) PW += 6;
    const stacked = !SW.fits(D, pid, PW + 1, H + 18);
    // a little more width when it lets the inner edge lean (the set's signature) without touching the house
    if(!stacked){ const kd = sold ? 'right' : 'left'; let p2 = PW; while(p2 < PW + 48 && p2 < W*(big ? 0.66 : 0.6) && AN.maxCut(D, pid, p2 + 9, H + 18, kd, null, 10) < 30) p2 += 6; if(AN.maxCut(D, pid, p2 + 9, H + 18, kd, null, 10) >= 30) PW = p2; }
    const word = sold ? 'Just Sold' : 'Just Listed', [w1, w2] = word.toUpperCase().split(' ');
    const ad = String(L.address || ''), place = [FXS.hood(L), FXS.placeLine(L)].filter(Boolean).join('  ·  ');
    const COND = "font-family:'Asap Condensed';font-weight:700;letter-spacing:.4pt;text-transform:uppercase";
    const hl = () => { if((F.highlights || []).length) return F.highlights.slice(); const tg = FXS.tagFacts(D).tags.filter((t, i, a) => !a.slice(0, i).some(u => SW.sameFact(t, u))); return tg.filter(t => /\b(19|20)\d\d\b/.test(t)).concat(tg.filter(t => !/\b(19|20)\d\d\b/.test(t)).sort((a, b) => b.length - a.length)); };
    const facts = () => FXS.statItems(L).filter(t => !/^Built/.test(t)).map(x => FXS.statParts(x)).map(p => ({n: p.n, l: String(p.l).replace(/^Bedrooms?$/i, L.beds == 1 ? 'Bed' : 'Beds')}));
    const factRow = (x, y, w, nf0) => { const its = facts(), lfOf = nf => Math.max(8.6, Math.min(Math.max(8.6, 8.5*k), nf*0.4)), gOf = nf => nf*0.85;
      const wOf = (p, nf) => FXS.width(p.n, `font-family:'Asap Condensed';font-weight:700;font-size:${nf}pt`) + 5 + FXS.width(p.l.toUpperCase(), `font-family:Outfit;font-weight:600;font-size:${lfOf(nf)}pt;letter-spacing:1.6pt`) + 2;
      let nf = nf0; for(; nf > 12; nf -= 0.5){ if(its.reduce((a, p) => a + wOf(p, nf), 0) + gOf(nf)*(its.length - 1) <= w) break; }
      const lf = lfOf(nf), gap = gOf(nf); let xx = x, o = '';
      its.forEach((p, i) => { const ww = wOf(p, nf); o += `<div class="abs fo-fact" style="left:${xx}pt;top:${y}pt;width:${ww + 2}pt;height:${nf0*1.2}pt;white-space:nowrap;display:flex;align-items:baseline" data-slot="front.fact${i}" data-lines="1"><span class="fo-fn" style="font-size:${nf}pt;line-height:${nf0*1.2}pt">${esc(p.n)}</span><span class="fo-fl" style="font-size:${lf}pt;margin-left:5pt">${esc(p.l.toUpperCase())}</span></div>`;
        xx += ww + gap; if(i < its.length - 1) o += `<div class="abs" style="left:${xx - gap/2}pt;top:${y + 3}pt;width:1.2pt;height:${nf0*1.2 - 5}pt;background:var(--an-accent);transform:skewX(-14deg)"></div>`; });
      return {html: o, h: nf0*1.2}; };
    // the lockup, built as a stack and spread over the column's height (no empty band): [html(y), height] pairs
    const stack = (items, y0, y1, minGap) => { const tot = items.reduce((a, it) => a + it[1], 0), g = Math.max(minGap, (y1 - y0 - tot)/Math.max(1, items.length - 1)); let y = y0, o = ''; items.forEach(([f, hh]) => { o += f(y); y += hh + g; }); return o; };
    if(!stacked && sold){
      // ---- Just Sold: its own composition, not the Just Listed card mirrored. The brand's dark band runs across the foot (its head leaning,
      // the accent stripe along it) and carries the agent and the logo; above it the house stands on the right, its inner edge leaning; on
      // the field JUST SOLD sits on a big leaning accent slab, the street right under it in white, the seller question in the accent and
      // the agent's note beside the accent bar. No features. ----
      const BV = 10, BT = H - (big ? 86 : 82), PB = BT - BV - 6 - 6, FH = PB + 9;
      let PWs = big ? 380 : 300; while(PWs < W*(big ? 0.6 : 0.56) && !SW.fits(D, pid, PWs + 9, FH)) PWs += 6;
      const PX = W - PWs, FW = PWs + 9, v = Math.min(56, Math.max(0, AN.maxCut(D, pid, FW, FH, 'left', null, 10))), vv = v >= 22 ? v : 0;
      h += AN.photo(D, pid, PX, -9, FW, FH, 'front.hero', 'left', vv.toFixed(2));
      h += vv ? `<div class="an-stripe" data-shape="vslab" data-sv="${vv.toFixed(2)},${ST}" style="left:${PX - ST}pt;top:-9pt;width:${vv + ST}pt;height:${FH}pt"></div>` : `<div class="an-stripe" style="left:${PX - ST}pt;top:-9pt;width:${ST}pt;height:${FH}pt"></div>`;
      h += `<div class="an-band" data-shape="top" data-sv="${BV}" style="left:-9pt;top:${BT - BV}pt;width:${W + 18}pt;height:${H + 9 - (BT - BV)}pt"></div>` + AN.stripe(-9, BT - 6, W + 18, BV, 6);
      const TX0 = M, TX1 = PX - ST - 16, TW = TX1 - TX0, top = 24, bot = PB - 4;
      // the slab: JUST SOLD in the on-accent condensed caps on a leaning accent block
      const ss = FXS.fitSize('JUST SOLD', COND, TW - 40, 64*k, 30), sh = ss*1.12, d = sh*Math.tan(14*Math.PI/180)/2;
      const as = FXS.fitSize(ad.toUpperCase(), COND, TW, 32*k, 15), ps = Math.min(9*k, FXS.fitSize(place.toUpperCase(), 'font-family:Outfit;font-weight:600;letter-spacing:2.2pt', TW, 9*k, 8)), qs = FXS.fitSize('THINKING ABOUT SELLING?', COND, TW, 19*k, 12);
      const nlh = 13.5*k, nn = 3, its = [
        [y => `<div class="an-tag" data-edges="${[[TX0 + d, y, TX0 - d, y + sh], [TX0 + TW - 6 + d, y, TX0 + TW - 6 - d, y + sh]].map(a => a.map(q => q.toFixed(2)).join(' ')).join(';')}" style="left:${TX0}pt;top:${y}pt;width:${TW - 6}pt;height:${sh}pt;padding-left:${14 + d}pt"><span style="font:700 ${ss}pt/1 var(--an-cond);letter-spacing:.5pt;width:${TW - 30}pt" data-slot="front.status" data-lines="1">JUST SOLD</span></div>`, sh],
        [y => `<div class="abs fo-addr an-street" style="left:${TX0 - 1}pt;top:${y}pt;width:${TW + 2}pt;height:${as*1.08}pt;font-size:${as}pt;line-height:${as*1.08}pt" data-slot="front.address" data-lines="1">${esc(ad)}</div><div class="abs fo-place" style="left:${TX0}pt;top:${y + as*1.08 + 2}pt;width:${TW}pt;height:${ps*1.3}pt;font-size:${ps}pt;line-height:${ps*1.3}pt" data-slot="front.place" data-lines="1">${esc(place)}</div>`, as*1.08 + 2 + ps*1.3],
        [y => `<div class="abs fo-addr" style="left:${TX0}pt;top:${y}pt;width:${TW}pt;height:${qs*1.1}pt;font-size:${qs}pt;line-height:${qs*1.1}pt;color:var(--an-accent)" data-slot="front.cta" data-lines="1">Thinking about selling?</div>`, qs*1.1],
        [y => { const N = ((F.note || {}).s || []).map(x => [].concat(x)), L2 = N.map(a => a.find(t => FXS.width(t, 'font-family:Outfit;font-weight:400;font-size:' + 11*k + 'pt') <= TW - 16) || a[a.length - 1]), nf = Math.min(13.5*k, ...L2.map(t => FXS.fitSize(t, 'font-family:Outfit;font-weight:400', TW - 16, 13.5*k, 9)));
          return FO.bar(TX0, y, L2.length*nf*1.45, 'front.note') + L2.map((t, j) => `<div class="abs" style="left:${TX0 + 14}pt;top:${y + j*nf*1.45}pt;width:${TW - 14}pt;height:${nf*1.45}pt;font:400 ${nf}pt/${nf*1.45}pt var(--an-font);color:var(--an-on);white-space:nowrap;overflow:hidden" data-slot="front.note${j ? '.' + j : ''}" data-lines="1">${esc(t)}</div>`).join(''); }, 2*13.5*k*1.45]];
      { const tot = its.reduce((a, it) => a + it[1], 0), g = Math.max(24, bot - top - tot), W3 = [0.34, 0.5, 0.16]; let y = top; its.forEach(([f, hh], q) => { h += f(y); y += hh + (q < 3 ? Math.max(q === 2 ? 8 : 12, g*W3[q]) : 0); }); }
      // the band: the agent (about half the status's size or less) and the one logo
      const nm = Math.min(ss*0.45, FXS.fitSize(A.name || '', "font-family:'Asap Condensed';font-weight:700", W*0.32, 24*k, 14)), by0 = BT + 4, bh = H - 14 - by0;
      h += `<div class="abs" style="left:${M}pt;top:${by0 + (bh - nm*1.1 - 15*k)/2}pt;width:${W*0.5}pt;white-space:nowrap"><div style="font:700 ${nm}pt/${nm*1.1}pt var(--an-cond);color:var(--an-on-deep)" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</div><div style="font:600 ${12.5*k}pt/${15*k}pt var(--an-font);color:var(--an-on-deep)" data-slot="agent.phone" data-lines="1"><span style="color:var(--cc-accent);font-size:${8.5*k}pt;letter-spacing:2pt;margin-right:8pt">CALL / TEXT</span>${esc(A.phone || '')}</div></div>`;
      h += FXS.logo(D, W - M - W*0.3, by0 + (bh - 32*k)/2, W*0.3, 32*k, 'flex-end');
    } else if(!stacked){
      // the house panel: as narrow as the whole house allows, bleeding off three edges; its inner edge leans like the tags, as far as the house allows
      const PX = sold ? -9 : W - PW, FW = PW + 9, FH = H + 18, kind = sold ? 'right' : 'left', v = Math.min(62, Math.max(0, AN.maxCut(D, pid, FW, FH, kind, null, 10))), vv = v >= 24 ? v : 0;
      h += AN.photo(D, pid, PX, -9, FW, FH, 'front.hero', kind, vv.toFixed(2));
      // the accent stripe along the leaning edge (on the field's side)
      const ex = sold ? PX + FW - vv : PX;   // the edge's foot (its top is vv to the right)
      if(vv) h += `<div class="an-stripe" data-shape="vslab" data-sv="${vv.toFixed(2)},${ST}" style="left:${sold ? ex : ex - ST}pt;top:-9pt;width:${vv + ST}pt;height:${FH}pt"></div>`;
      else h += `<div class="an-stripe" style="left:${sold ? PX + FW : PX - ST}pt;top:-9pt;width:${ST}pt;height:${FH}pt"></div>`;
      const TX0 = sold ? PX + FW + ST + 16 : M, TX1 = sold ? W - M : PX - ST - 16, TW = TX1 - TX0;
      const lsW = FXS.fitSize(w2, COND, TW, (sold ? 104 : 92)*k, 40);
      const build = ls => { const lh = ls*0.9, its = [];
      its.push([y => `<div class="abs fo-place" style="left:${TX0}pt;top:${y}pt;width:${TW}pt;font-size:${Math.min(9.5*k, FXS.fitSize(place.toUpperCase(), 'font-family:Outfit;font-weight:600;letter-spacing:2.2pt', TW, 9.5*k, 8))}pt" data-slot="front.place" data-lines="1">${esc(place)}</div>`, 12]);
      its.push([y => `<div class="abs fo-addr" style="left:${TX0 - 2}pt;top:${y}pt;width:${TW + 4}pt;height:${lh*2 + ls*0.12}pt;font-size:${ls}pt;line-height:${lh}pt;white-space:normal" data-slot="front.status" data-lines="2">${esc(w1)}<br><span style="color:var(--an-accent)">${esc(w2)}</span></div>`, lh*2 + ls*0.06]);
      const as = FXS.fitSize(ad.toUpperCase(), COND, TW, (sold ? 30 : 26)*k, 15);
      its.push([y => `<div class="abs fo-addr an-street" style="left:${TX0 - 1}pt;top:${y}pt;width:${TW + 2}pt;height:${as*1.08}pt;font-size:${as}pt;line-height:${as*1.08}pt;color:var(--an-on)" data-slot="front.address" data-lines="1">${esc(ad)}</div>`, as*1.08]);
      if(!sold){
        const fr = factRow(TX0, 0, TW, 22*k); its.push([y => factRow(TX0, y, TW, 22*k).html, fr.h]);
        const tg = hl().filter(t => FXS.width(t, `font-family:Outfit;font-weight:500;font-size:${11.5*k}pt`) <= TW - 20).slice(0, 3), rh = 19*k;
        its.push([y => tg.map((t, i) => `<div class="abs" style="left:${TX0}pt;top:${y + i*rh}pt;width:${TW}pt;height:${rh}pt;display:flex;align-items:center;gap:9pt;font:500 ${11.5*k}pt/${rh}pt var(--an-font);color:var(--an-on);white-space:nowrap;overflow:hidden" data-slot="front.hl.${i}" data-lines="1"><span style="display:block;width:4.5pt;height:${11*k}pt;background:var(--an-tag);transform:skewX(-14deg);flex:none"></span>${esc(t)}</div>`).join(''), tg.length*rh]);
        // the foot: the agent and the one logo
        const nm = FXS.fitSize(A.name || '', "font-family:'Asap Condensed';font-weight:700", TW*0.55, 19*k, 13);
        its.push([y => `<div class="an-hair" style="left:${TX0}pt;top:${y}pt;width:${TW}pt"></div><div class="abs" style="left:${TX0}pt;top:${y + 9}pt;width:${TW*0.58}pt"><div style="font:700 ${nm}pt/${nm*1.15}pt var(--an-cond);color:var(--an-on);white-space:nowrap" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</div><div style="font:600 ${12*k}pt/${15*k}pt var(--an-font);color:var(--an-on);white-space:nowrap" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</div></div>` + FXS.logo(D, TX0 + TW*0.6, y + 9, TW*0.4, 32*k, 'flex-end'), 9 + Math.max(nm*1.15 + 15*k, 32*k)]);
      } else {
        const tq = AN.tag('Thinking about selling?', 0, 0, 'front.cta', {fs: 10.5*k, h: 24*k, track: 1.6});
        its.push([y => AN.tag('Thinking about selling?', TX0 + 4, y, 'front.cta', {fs: 10.5*k, h: 24*k, track: 1.6}).html, 24*k]);
        // the agent's note on the brand's dark panel, sized to its text
        const nlh = 13.5*k, nn = 3;
