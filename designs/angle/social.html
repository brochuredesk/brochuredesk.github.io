<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>angle social set</title>
<link rel="stylesheet" href="an-tokens.css">
<script src="../engine/baths.js"></script>
<script src="../engine/ivory.js"></script>
<script src="../engine/ohlib.js"></script>
<script src="../engine/ohemail.js"></script>
<script src="../engine/carousel.js"></script>
<script src="../engine/factrepeat.js"></script>
<script src="../engine/socialset.js"></script>
<script src="an-social.js"></script>
<!-- Angle's Just Listed and Just Sold social sets (owner 11/18/2026). The shared engine (templates/_shared/socialset.js) loads the
     fonts and the data and runs the checks; the layouts are Angle's own (an-social.js): the main color as the field, every photo cut on
     the one slant with the thick accent stripe along the cut, JUST / LISTED stacked white over the accent, JUST SOLD on the leaning
     accent slab, the facts parted by leaning slashes, the dark foot band with its leaning head carrying the agent. The colors come
     from the agent's brand kit exactly as the set's print pieces read them (AN.colors / AN.brand in an.js). -->
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
SocialSet.__portrait = SocialSet.portrait; SocialSet.__landscape = SocialSet.landscape;
SocialSet.portrait = ANSocial.portrait; SocialSet.landscape = ANSocial.landscape; SocialSet.slide = ANSocial.slide;
SocialSet.start(D => {
  const b = D.brand || {}, c = b.colors || {}, r = document.documentElement.style;
  const rgb = h => { h = String(h||'').replace('#',''); if(h.length===3) h = h.split('').map(x=>x+x).join(''); const n = parseInt(h,16); return [n>>16&255, n>>8&255, n&255]; };
  const lum = h => { const v = rgb(h).map(q => { q/=255; return q <= .03928 ? q/12.92 : Math.pow((q+.055)/1.055, 2.4); }); return .2126*v[0] + .7152*v[1] + .0722*v[2]; };
  const con = (a, z) => { const x = lum(a), y = lum(z); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); };
  const on = bg => con(bg, '#ffffff') >= con(bg, '#161616') ? '#ffffff' : '#161616';
  const read = (fg, bg, k) => con(fg, bg) >= (k || 3) ? fg : on(bg);
  const mix = (a, z, t) => { const p = rgb(a), q = rgb(z); return '#' + p.map((v, i) => Math.round(v + (q[i] - v)*t).toString(16).padStart(2, '0')).join(''); };
  // as AN.colors / AN.brand (an.js): the kit's main is the field, the accent the tags, stripes and small caps where it reads, the dark
  // the leaning foot band that carries the agent
  const main = c.main || b.accent || '#2f4a3a', dark = c.dark || b.ink || '#1c1c1c', accent = c.accent || b.accent2 || main;
  const tag = con(accent, main) >= 1.8 ? accent : con(dark, main) >= 1.8 ? dark : on(main);
  const deep = con(dark, main) >= 1.25 ? dark : mix(main, '#000000', .35);
  r.setProperty('--an-main', main); r.setProperty('--an-on', on(main)); r.setProperty('--an-accent', read(accent, main)); r.setProperty('--an-tag', tag); r.setProperty('--an-on-accent', on(tag));
  r.setProperty('--an-deep', deep); r.setProperty('--an-on-deep', on(deep)); r.setProperty('--an-deep-accent', read(accent, deep));
  r.setProperty('--an-rule', on(main) === '#ffffff' ? 'rgba(255,255,255,.35)' : 'rgba(0,0,0,.35)');
});
</script>
</body>
</html>
