<!doctype html>
<html lang="en">
<head>
<meta charset="usg-8">
<title>BrochureDesk · Soft Geometry postcards</title>
<link rel="stylesheet" href="sg.css">
<link rel="stylesheet" href="sg-fo.css">
<script src="sg.js"></script>
<script src="../engine/baths.js"></script>
<script src="../engine/agentcard.js"></script>
<script src="../engine/factrepeat.js"></script>
<script>window.Ivory = window.Ivory || {esc: s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))};</script>
<script src="sg-fo.js"></script>
<!--
  BrochureDesk · Soft Geometry · Just Listed and Just Sold postcards (the hand of the approved Open House library flyer B01).
  data.piece.card = "listed" | "sold", data.piece.size = "6x11" (trim 792 x 432 pt) | "6x9" (648 x 432 pt), data.piece.side = "front" | "back".
  Print adds 0.125 in (9 pt) bleed. The agent's brand color (brand.accent) is the field on both sides; boxes are white.
  Front: the whole house (roof to steps) on the right with a one-line-or-two caption and a white box under it, the status stacked large on the left over the address,
  the fact rows and the brokerage logo (Just Listed) or the agent's name and number and the logo (Just Sold). No price, no QR.
  Back: status line, interior photos with captions, a white box (the write-up, or the steps), the standard contact card (templates/_shared/agentcard.js,
  band preset, which carries the back's one logo), the fine print. The right 289.5 pt (4.02 in) is the mail vendor's: return address, postage and address
  zones; drawn as guides on proofs and left clear in print.
  Copy comes from data.sw.pc.{jl|js}.{front|back} as a lead plus whole sentences; sg.js picks the sentences that fill each box.
-->
<style>
  /* the FX14 hand on a postcard: white frame, a taupe block, Pinyon Script status, white underlined labels, hairline white boxes; tokens in sg-tokens.css */
  .pc-col{position:absolute;display:flex;flex-direction:column}
  .pc-wbox{background:var(--sg-lift);color:var(--fx-soft);padding:10pt 16pt 9pt;display:flex;flex-direction:column;overflow:hidden}
  .pc-wbox:after{content:"";position:absolute;inset:4.5pt;border:1pt solid color-mix(in srgb, var(--sg-accent) 78%, transparent);pointer-events:none}
  .pc-wbox.lt{background:#fff;color:#2c2c2c}
  .pc-wbox.lt:after{border-color:var(--sg-box-line)}
  .pc-wbox.lt .k{color:var(--sg-ink-accent)}
  .pc-wbox.lt .p{color:#161616}
  .pc-wbox .k{font:500 8.6pt/11pt var(--sg-font);letter-spacing:3.4pt;text-transform:uppercase;color:var(--sg-accent);white-space:nowrap;overflow:hidden;margin-bottom:3pt;align-self:flex-start}
  .pc-wbox .p{font-family:var(--sg-serif);font-weight:500;overflow:hidden;color:var(--fx-on)}
  .pc-wbox .p b{font-weight:700;color:var(--fx-on)}
  .pc-bstatus{position:absolute;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
  .pc-bstatus .st{font:700 10.5pt/1 var(--fx-font);letter-spacing:2.4pt;color:var(--fx-on);text-transform:uppercase}
  .pc-bstatus .ln{flex:1;height:1.2pt;background:var(--sg-accent);margin:0 12pt;min-width:16pt}
  .pc-bstatus .ad{font:500 16pt/1 var(--sg-serif);color:var(--fx-on);padding-bottom:3pt}
  .pc-steps .it{display:flex;gap:8pt;align-items:baseline;white-space:nowrap;overflow:hidden}
  .pc-steps .bx{width:4pt;height:4pt;transform:translateY(-1pt) rotate(45deg);background:var(--sg-accent);flex:none}
  .pc-call{font:500 13pt/16pt var(--sg-serif);color:var(--sg-accent);white-space:nowrap;overflow:hidden}
  .pc-disc{position:absolute;font-size:6pt;line-height:10pt;color:var(--fx-soft);overflow:hidden;white-space:nowrap}
  .pc-ret{position:absolute;font:500 9pt/11pt var(--fx-font);letter-spacing:.2pt;color:var(--fx-on);overflow:hidden;height:34pt}
  .pc-ret b{font-weight:700;letter-spacing:1.4pt;text-transform:uppercase;color:var(--fx-ink)}
  .cap .a{font-weight:400}
  .pc-wbox.bare{background:none}
  .pc-wbox.bare:after{display:none}
  .pc-wbox.bare .k{color:var(--sg-accent);font-weight:700;letter-spacing:3pt}
  .pc-steps .bx{width:17pt;height:17pt;border-radius:50%;background:var(--sg-main);transform:none;color:#fff;font:700 9.5pt/17pt Urbanist;text-align:center;flex:none}
  .pc-disc{color:rgba(255,255,255,.75)}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const esc = SW.esc, b = D.brand || {}, A = D.agent || {}, L = D.listing, P = D.piece || {};
  document.body.dataset.mode = D.mode || 'email';
  await SW.setup(D);
  const sold = P.card === 'sold', big = P.size === '6x11', front = P.side === 'front';
  const W = big ? 792 : 648, H = 432;
  const K = ((D.sw || {}).pc || {})[sold ? 'js' : 'jl'] || {};
  const hsSrc = A.headshot && ((D.photos||{})[A.headshot] ? D.photos[A.headshot].src : A.headshot) || '';
  const statusWord = sold ? 'Just Sold' : 'Just Listed';
  const issues = [];
  const logo = (cls, src, area, maxh, style) => `<div class="logo ${cls}" data-area="${area}" data-maxh="${maxh}" style="${style||''}">${src ? `<img src="${esc(src)}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage||'')}</span>`}</div>`;
  const CL = big ? 13.5 : 12.5, CF = big ? 'font-size:10.9pt;line-height:13.5pt;' : '';   // the 6x11 sets its type up from the 6x9 (11 pt against 9.5), not the same size with more room
  const cap = (c, slot, lines, extra, min) => (c = (c.photo ? FXS.augment(D, c) : c), `<div class="cap" style="height:${5 + lines*CL}pt;${extra||''}"><div class="a" data-min="${min || 2}" data-nopair="1" data-slot="${slot}" data-narrow="0" data-nstep="6" data-lh="${CL}" data-lines="${lines}" data-lead="${esc(c.lead||'')}" data-s='${esc(JSON.stringify([].concat(c.s||[]))).replace(/'/g,'&#39;')}' style="height:${lines*CL}pt;${CF}"></div></div>`);
  let h = '';

  if(front){
    // The FX14 hand on a postcard front. A white frame top and side, the whole house in it, a taupe block around it with the status in Pinyon Script.
    // JL: "Just Listed" in script beside the house, the horizontal address, three facts; under the house the caption ("Front.", the draws) and the agent and logo along the foot.
    // JS: sells the agent: "Just Sold" in the same script lockup, the name and phone big on the left, the house on the right with the agent's own note, the logo.
    const F = K.front || {};
    const draws = list => { const w = x => /gated|roof|pergola|deck|park|garage|island|stone|corner|pool/i.test([].concat(x)[0]) ? 0 : 1; return (list || []).map((x, i) => [w(x), i, x]).sort((p, q) => p[0] - q[0] || p[1] - q[1]).map(t => t[2]); };
    const capC = sold ? {lead: '', s: (F.note || {}).s || (F.cap || {}).s} : (F.caption ? {lead: F.caption.lead, s: F.caption.s.concat(draws((F.about || {}).s || []))} : {lead: 'Front.', s: draws((F.about || {}).s || (F.cap || {}).s)});
    const norm = x => String(x).toLowerCase().replace(/[^a-z0-9 ]/g, '').slice(0, 40), allAlts = list => [].concat(...(list || []).map(x => [].concat(x)));
    const backSet = new Set([].concat(allAlts(((K.back || {}).about || {}).s), ...((K.back || {}).photos || []).map(c => allAlts(c.s)), allAlts((K.back || {}).steps6), allAlts((K.back || {}).steps)).map(norm));
    const backAll = allAlts(((K.back || {}).about || {}).s).map(String);   // the back's About box
    if(capC.s){ const kept = capC.s.filter(x => ![].concat(x).some(a => backSet.has(norm(a)))); if(kept.length >= 2) capC.s = kept; }
    // the caption's own first sentence stays; a later one that says a fact the back's About box says (the deck and pergola, in other words) drops out
    if(capC.s && capC.s.length > 2){ const tail = capC.s.slice(1).filter(x => ![].concat(x).some(a => backAll.some(b => SW.sameFact(String(a), b)))); if(tail.length >= 1) capC.s = [capC.s[0]].concat(tail); }
    const roomIds = [...new Set([].concat(((D.sw||{}).back||{}).photos||[], ((D.sw||{}).left||{}).photos||[]).map(c => c.photo))].filter(id => (D.photos||{})[id] && !(D.photos[id]||{}).fullHouse && id !== F.cap.photo).slice(0, 2);
    // ---- Soft Geometry fronts (P04). Two cards in one hand. Just Listed: the dark field, the house bleeding off the top, the right and the foot;
    // "Just / listed" in the sign-in sheet's two tones as large as the column allows, the sunburst beside the short word, the accent wedge
    // holding the street and the facts, three highlights on small sunbursts, the agent and the logo on the foot. Just Sold: the paper card,
    // the house in soft corners, "Just / sold" in ink and the main color with the sunburst, the street, the seller question and a two-line
    // note, the agent and the logo on the dark foot with its slanted top. ----
    const k = big ? 1.12 : 1, pid = FO.heroId(D, F.cap.photo);
    const place = [FXS.hood(L), FXS.placeLine(L)].filter(Boolean).join('  ·  '), ad = String(L.address || ''), cq = 'Thinking about selling?';
    const factsT = FXS.statItems(L).filter(t => !/^Built/.test(t)).join('  ·  ').toUpperCase();
    const capsFit = (t, w, max, wt, tracks) => { for(const ls of tracks){ const fs = FXS.fitSize(t, `font-family:Urbanist;font-weight:${wt};letter-spacing:${ls}pt`, w, max, 8.5); if(FXS.width(t, `font-family:Urbanist;font-weight:${wt};letter-spacing:${ls}pt;font-size:${fs}pt`) <= w - 6) return {fs: Math.max(8.5, fs), ls}; } return {fs: 8.5, ls: tracks[tracks.length - 1]}; };
    const nameW = ns => FXS.width(A.name || '', `font-family:Urbanist;font-weight:700;font-size:${ns}pt`), phoneW = ns => FXS.width(A.phone || '', `font-family:Urbanist;font-weight:600;font-size:${ns*0.78}pt`);
    const desT = A.designation ? (A.nar || /realtor/i.test(A.designation) ? 'REALTOR®' : A.designation) : '';
    // the agent's line (name, designation, phone) and the one logo on the dark: one row
    const agentRow = (x, y, w, ns, hh) => { const desW = desT ? FXS.width(desT, `font-family:Urbanist;font-weight:600;letter-spacing:2pt;font-size:${8.6*k}pt`) + 9*k : 0, pw = phoneW(ns), lw = Math.max(96*k, Math.min(150*k, w*0.3));
      let des = !!desT && nameW(ns) + desW + 16*k + pw <= w - lw - 16*k;
      if(nameW(ns) + 16*k + pw > w - lw - 16*k){   // a narrow column: the name over the phone, the logo beside them
        const n2 = Math.min(ns, 14*k), bw = Math.max(nameW(n2), phoneW(n2)), lw2 = Math.min(150*k, w - bw - 18*k);
        return `<div class="abs" style="left:${x}pt;top:${y + hh/2 - n2*1.18}pt;width:${bw + 4}pt;white-space:nowrap;color:#fff;font-family:Urbanist"><div style="font-weight:700;font-size:${n2}pt;line-height:${n2*1.2}pt" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</div><div style="font-weight:600;font-size:${n2*0.82}pt;line-height:${n2*1.15}pt" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</div></div>` + FXS.logo(D, x + w - lw2, y - 2, lw2, hh + 4, 'flex-end'); }
      return `<div class="abs" style="left:${x}pt;top:${y + (hh - ns*1.25)/2}pt;width:${w - lw - 12}pt;white-space:nowrap;line-height:${ns*1.25}pt;color:#fff"><span style="font-weight:700;font-size:${ns}pt;font-family:Urbanist" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</span>${des ? `<span style="font-weight:600;font-size:${8.6*k}pt;letter-spacing:2pt;color:var(--sg-accent);margin-left:${9*k}pt" data-slot="agent.desig" data-lines="1">${esc(desT)}</span>` : ''}<span style="font-weight:600;font-size:${ns*0.78}pt;margin-left:${16*k}pt" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</span></div>` + FXS.logo(D, x + w - lw, y, lw, hh, 'flex-end'); };
    const photoAt = (x, y, w, hh, extra) => `<div class="abs" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${hh}pt${extra || ''}">${SW.photo(D, pid, 'position:absolute;inset:0', 'front.hero')}</div>`;
    const mini = (cx, cy, r) => SG.burst(cx, cy, r*0.38, r, {n: 12, w: Math.max(1.2, r*0.16)});
    if(!sold){
      h += `<div class="abs" style="left:-9pt;top:-9pt;width:${W + 18}pt;height:${H + 18}pt;background:var(--sg-dark)"></div>`;
      let PW = Math.round(W*0.46); while(PW < W*0.67 && !SW.fits(D, pid, PW + 9, H + 18)) PW += 6;
      if(!SW.fits(D, pid, PW + 9, H + 18)){
        // a wide house (the one-story) runs across the top, bleeding off three edges; under it the status on the left over the agent, the
        // accent wedge with the street and facts and the highlights on the right
        let SH = 210; while(SH < H*0.72 && !SW.fits(D, pid, W + 18, SH + 9)) SH += 4;
        h += photoAt(-9, -9, W + 18, SH + 9);
        const y0 = SH + 16, TX0 = 30, CWl = Math.round((W - 60)*0.55), RX = TX0 + CWl + 22, RW = W - 30 - RX, fy = H - 22 - 26*k;
        { const css = f => `font-family:Urbanist;font-weight:700;letter-spacing:${-f*0.018}pt;font-size:${f}pt`, room = fy - 10 - y0; let f = Math.min(58*k, room*0.92); while(f > 24 && FXS.width('Just listed', css(f)) > CWl - 4) f -= 0.5;
          h += `<div class="sg-disp" style="left:${TX0 - 2}pt;top:${y0 + (room - f)/2 - 2}pt;width:${CWl}pt;height:${f}pt;font-size:${f}pt;line-height:${f}pt;letter-spacing:${-f*0.018}pt" data-slot="front.status" data-lines="1">Just <span class="two">listed</span></div>`; }
        h += `<div class="abs" style="left:${TX0}pt;top:${fy - 7}pt;width:${CWl}pt;height:1pt;background:rgba(255,255,255,.3)"></div>` + agentRow(TX0, fy, CWl, 13.5*k, 26*k);
        const as = FXS.fitSize(ad, 'font-family:Urbanist;font-weight:700;letter-spacing:-.3pt', RW - 24, 19*k, 12), cf = capsFit(factsT, RW - 26, 9*k, 600, [1.4, .9, .5, .2]), WH = as*1.2 + cf.fs*1.4 + 16*k;
        h += SG.wedge(RX - 8, y0, W + 9 - RX + 8, WH, {lean: 14});
        h += `<div class="sg-wtxt" style="left:${RX + 10}pt;top:${y0 + 7*k}pt;width:${RW - 24}pt;height:${as*1.2}pt;font-weight:700;font-size:${as}pt;line-height:${as*1.2}pt;letter-spacing:-.3pt" data-slot="front.address" data-lines="1">${esc(ad)}</div>`;
        h += `<div class="sg-wtxt" style="left:${RX + 8}pt;top:${y0 + 7*k + as*1.2 + 1}pt;width:${RW - 26}pt;height:${cf.fs*1.4}pt;font-weight:600;font-size:${cf.fs}pt;line-height:${cf.fs*1.4}pt;letter-spacing:${cf.ls}pt" data-slot="front.facts" data-lines="1">${esc(factsT)}</div>`;
        const hy = y0 + WH + 8, hlT0 = ((F.highlights && F.highlights.length) ? F.highlights : FXS.tagFacts(D).tags).filter(t => FXS.width(t, `font-family:Urbanist;font-weight:600;font-size:${11*k}pt`) <= RW - 22*k), hlT = hlT0.slice(0, Math.max(1, Math.min(3, Math.floor((H - 20 - hy)/(16*k))))), rh = Math.min(20*k, (H - 20 - hy)/Math.max(1, hlT.length)), hs = Math.min(11.5*k, rh*0.62);
        hlT.forEach((t, i) => { const yy = hy + i*rh; h += mini(RX + 6*k, yy + rh/2, 5.5*k) + `<div class="abs" style="left:${RX + 18*k}pt;top:${yy}pt;width:${RW - 18*k}pt;height:${rh}pt;font-family:Urbanist;font-weight:600;font-size:${hs}pt;line-height:${rh}pt;color:#fff;white-space:nowrap;overflow:hidden" data-slot="front.hl.${i}" data-lines="1">${esc(t)}</div>`; });
      } else {
      const PX = W - PW; h += photoAt(PX, -9, PW + 9, H + 18);
      const TX0 = 30, TX1 = PX - 24, TW = TX1 - TX0; let y = 26;
      const ce = capsFit(place.toUpperCase(), TW, 9*k, 600, [3.2, 2.4, 1.6, 1]); h += `<div class="sg-eye" style="left:${TX0}pt;top:${y}pt;width:${TW}pt;font-size:${ce.fs}pt;letter-spacing:${ce.ls}pt" data-slot="front.place" data-lines="1">${esc(place.toUpperCase())}</div>`; y += 16*k;
      const fy0 = H - 26 - 30*k, stackH = 12*k + (22*k*1.2 + 9.4*k*1.4 + 20*k) + 14*k + 3*24*k + 10, dmax = Math.min(82*k, (fy0 - y - stackH)/1.96);
      const dsp = SG.disp('Just', 'listed', TX0 - 2, y, TW, dmax, 36, 'front.status', {lh: 0.98}); h += dsp.html;
      { const jw = FXS.width('Just', `font-family:Urbanist;font-weight:700;letter-spacing:${-dsp.fs*0.018}pt;font-size:${dsp.fs}pt`), r = Math.min(dsp.fs*0.42, (TX1 - (TX0 + jw + 18))/2 - 2); if(r > 14) h += SG.burst(TX0 + jw + 18 + r, y + dsp.fs*0.5, r*0.36, r, {w: Math.max(2, r*0.075)}); }
      y += dsp.h + 12*k;
      // the accent wedge: the street over the facts (the sign-in sheet's header block), bleeding off the left edge
      const as = FXS.fitSize(ad, 'font-family:Urbanist;font-weight:700;letter-spacing:-.3pt', TW - 30, 22*k, 13), cf = capsFit(factsT, TW - 34, 9.4*k, 600, [1.6, 1.1, .6, .2]), WH = as*1.2 + cf.fs*1.4 + 20*k;
      h += SG.wedge(-9, y, TX1 - 4 + 9, WH, {lean: 18});
      h += `<div class="sg-wtxt" style="left:${TX0}pt;top:${y + 9*k}pt;width:${TW - 30}pt;height:${as*1.2}pt;font-weight:700;font-size:${as}pt;line-height:${as*1.2}pt;letter-spacing:-.3pt" data-slot="front.address" data-lines="1">${esc(ad)}</div>`;
      h += `<div class="sg-wtxt" style="left:${TX0}pt;top:${y + 9*k + as*1.2 + 2}pt;width:${TW - 34}pt;height:${cf.fs*1.4}pt;font-weight:600;font-size:${cf.fs}pt;line-height:${cf.fs*1.4}pt;letter-spacing:${cf.ls}pt" data-slot="front.facts" data-lines="1">${esc(factsT)}</div>`;
      y += WH + 14*k;
      const fy = H - 26 - 30*k, hlT = ((F.highlights && F.highlights.length) ? F.highlights : FXS.tagFacts(D).tags).filter(t => FXS.width(t, `font-family:Urbanist;font-weight:600;font-size:${12*k}pt`) <= TW - 22*k).slice(0, 3);
      const room = fy - 10 - y, rh = Math.min(24*k, room/Math.max(1, hlT.length)), hs = Math.min(13*k, rh*0.6);
      hlT.forEach((t, i) => { const yy = y + i*rh; h += mini(TX0 + 6*k, yy + rh/2, 6*k) + `<div class="abs" style="left:${TX0 + 18*k}pt;top:${yy}pt;width:${TW - 18*k}pt;height:${rh}pt;font-family:Urbanist;font-weight:600;font-size:${hs}pt;line-height:${rh}pt;color:#fff;white-space:nowrap;overflow:hidden" data-slot="front.hl.${i}" data-lines="1">${esc(t)}</div>`; });
      h += `<div class="abs" style="left:${TX0}pt;top:${fy - 8}pt;width:${TW}pt;height:1pt;background:rgba(255,255,255,.3)"></div>` + agentRow(TX0, fy, TW, 15*k, 30*k);
      }
    } else {
      // JUST SOLD: the paper card
      const FT = H - 92*k;   // the dark foot's slanted top (left); it rises 12 pt to the right
      h += `<div class="abs" style="left:-9pt;top:-9pt;width:${W + 18}pt;height:${H + 18}pt;background:var(--sg-paper)"></div>` + SG.poly([[-9, FT + 6], [W + 9, FT - 8], [W + 9, FT - 4], [-9, FT + 10]], 'var(--sg-wedge)') + SG.foot(-9, W + 9, FT + 10, FT - 4, H);
      const PY = 26, PHh = FT - 18 - PY; let PWi = Math.round(PHh*(big ? 1.34 : 1.05)); while(PWi < W*0.5 && !SW.fits(D, pid, PWi, PHh)) PWi += 6;
      h += `<div class="sg-soft">${photoAt(28, PY, PWi, PHh)}</div>`;
      const TX0 = 28 + PWi + 26, TX1 = W - 30, TW = TX1 - TX0; let y = PY - 2;
      const ce = capsFit(place.toUpperCase(), TW, 9*k, 700, [3, 2.2, 1.4, .8]); h += `<div class="sg-eye" style="left:${TX0}pt;top:${y}pt;width:${TW}pt;font-size:${ce.fs}pt;letter-spacing:${ce.ls}pt;color:var(--sg-pmain);font-weight:700" data-slot="front.place" data-lines="1">${esc(place.toUpperCase())}</div>`; y += 15*k;
      const dsp = SG.disp('Just', 'sold', TX0 - 2, y, TW, 64*k, 40, 'front.status', {lh: 0.96}); h += `<div class="sg-pp">${dsp.html}</div>`;
      { const jw = FXS.width('Just', `font-family:Urbanist;font-weight:700;letter-spacing:${-dsp.fs*0.018}pt;font-size:${dsp.fs}pt`), r = Math.min(dsp.fs*0.56, (TX1 - (TX0 + jw + 16))/2 - 2); if(r > 14) h += SG.burst(TX0 + jw + 16 + r, y + dsp.fs*0.55, r*0.34, r, {w: Math.max(2.2, r*0.07)}); }

    const items = [...box.querySelectorAll('.stp, .hb .tx')], hOf = el => { const r = document.createRange(); r.selectNodeContents(el); return [...r.getClientRects()].reduce((m, q) => Math.max(m, q.bottom), 0) - [...r.getClientRects()].reduce((m, q) => Math.min(m, q.top), 1e9); };
    items.forEach((el, i) => { const w = el.textContent.trim().split(/\s+/).filter(Boolean).length; if(w < 8) out.push({slot: 'back.step' + i, kind: 'js-bullet-too-short', detail: `${w} words: "${el.textContent.trim()}"`}); });
    if(items.length < 6) out.push({slot: 'back.steps', kind: 'fewer-than-six-bullets', detail: items.length + ' bullets'});
    const cs = getComputedStyle(box), inner = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom), line = el => { const r = document.createRange(); r.selectNodeContents(el); const rs = [...r.getClientRects()].filter(q => q.width > 1); const lh = parseFloat(getComputedStyle(el).lineHeight) || 0; const rows = new Set(rs.map(q => Math.round(q.top))).size; return rows*lh; };
    let used = items.reduce((n, el) => n + line(el), 0); const k = box.querySelector('.k'), call = box.querySelector('.pc-call'); if(k) used += parseFloat(getComputedStyle(k).lineHeight) || 11; if(call) used += parseFloat(getComputedStyle(call).lineHeight) || 16;
    const fill = used/inner; window.__jsFill = +fill.toFixed(2);
    if(fill < .85) out.push({slot: 'back.steps', kind: 'js-box-under-85', detail: `the Just Sold box is ${Math.round(fill*100)}% full (85% minimum)`});
    return out; }
  // the Just Sold bullets take the largest size at which every one sets in full lines inside the box, then the leading opens until the box is at least 85% filled
  function fitSteps(){ const box = document.getElementById('stepsbox'), list = document.getElementById('stepslist'); if(!box || !list) return;
    if(false){   // 6x11: one column, every step one full line, the largest size from 15.5 pt down to the 6x9's x1.08; the box is sized to its content, set on the card's top, the call to action centered above it
      const stp = [...list.querySelectorAll('.stp')], its = [...list.querySelectorAll('.it')];
      let best = null;
      for(let fs = 15.5; fs >= 14.1 - 1e-6; fs -= 0.1){ list.style.fontSize = fs + 'pt'; const lh = fs*1.62; list.style.lineHeight = lh + 'pt'; stp.forEach(e => { e.dataset.lh = lh; }); its.forEach(it => { it.querySelector('.bx').style.marginTop = (lh*.42) + 'pt'; }); SW.fill();
        if(stp.every(e => SW.lines(e).n === 1)){ const fill = Math.min(...stp.map(e => (e.getBoundingClientRect().width ? (() => { const r = document.createRange(); r.selectNodeContents(e); const q = [...r.getClientRects()]; return q.length ? (Math.max(...q.map(x => x.right)) - Math.min(...q.map(x => x.left)))/list.getBoundingClientRect().width : 0; })() : 0))); best = {fs, lh, fill}; break; } }
      if(!best) return;
      box.style.justifyContent = 'flex-start'; box.style.gap = '8pt'; box.style.height = 'auto';
      const hpt = box.getBoundingClientRect().height*0.75, bottom = parseFloat(box.style.top) + (+box.dataset.bh0 || 0), top0 = parseFloat(box.style.top), end = top0 + parseFloat(box.dataset.bh0 || 0);
      const boxBottom = 282, newTop = boxBottom - hpt; box.style.top = newTop + 'pt'; box.style.height = hpt + 'pt';
      const cta = document.getElementById('jscta'), st = document.querySelector('[data-slot="back.status"]'), sb = parseFloat(st.style.top) + parseFloat(st.style.height), room = newTop - sb;
      if(cta && room >= 30){ const cs = Math.min(21, room - 12); cta.style.display = ''; cta.style.fontSize = cs + 'pt'; cta.style.lineHeight = (cs*1.3) + 'pt'; cta.style.height = (cs*1.3) + 'pt'; cta.style.top = (sb + (room - cs*1.3)/2) + 'pt'; }
      return; }
    const stp = [...list.querySelectorAll('.stp')], its = [...list.querySelectorAll('.it')], fits = () => box.scrollHeight <= box.clientHeight + .5;
    const okLines = () => stp.every(e => { const L = SW.lines(e); return L.n === 1 || (L.fill >= .9 && L.min >= .8); });
    const apply = (fs, m) => { list.style.fontSize = fs + 'pt'; list.style.lineHeight = (fs*m) + 'pt'; stp.forEach(e => { e.dataset.lh = fs*m; }); its.forEach(it => { it.querySelector('.bx').style.marginTop = ((fs*m - 17)/2) + 'pt'; }); SW.fill(); };
    const sizes = []; for(let f = big ? 15.5 : 13; f >= 9.5 - 1e-6; f -= 0.1) sizes.push(+f.toFixed(2));
    for(const fs of sizes){ apply(fs, 1.25); if(!(okLines() && fits())) continue;
      for(let m = 1.25; m <= 1.7; m += .03){ apply(fs, m); if(!fits() || !okLines()){ apply(fs, m - .03); break; } jsCheck(); if(window.__jsFill >= .87) break; }
      return; }
    apply(sizes[sizes.length - 1], 1.25); }
  function backCheck(){ const out = [], pt = v => v*72/96, sh = document.querySelector('.sheet').getBoundingClientRect(), X0 = window.__cardX || 30;
    const cc = document.querySelector('.sheet .cc');
    if(!cc) out.push({slot: 'back.card', kind: 'no-contact-card', detail: 'the back has no standard contact card'});
    else { const r = cc.getBoundingClientRect(), l = pt(r.left - sh.left), rr = pt(r.right - sh.left), Wt = pt(sh.width) - 18;
      if(l > X0 + 1 || rr < Wt - X0 - 1) out.push({slot: 'back.card', kind: 'card-not-full-width', detail: `card spans ${l.toFixed(0)}-${rr.toFixed(0)} pt of ${Wt.toFixed(0)}`}); }
    let area = 0; document.querySelectorAll('.sheet [data-mail-panel]').forEach(el => { const r = el.getBoundingClientRect(); const w = Math.min(pt(r.right - sh.left) - 9, pt(sh.width) - 18) - Math.max(pt(r.left - sh.left) - 9, 0), h = Math.min(pt(r.bottom - sh.top) - 9, 432) - Math.max(pt(r.top - sh.top) - 9, 0); area += Math.max(0, w)*Math.max(0, h); });
    if(area > .25*(pt(sh.width) - 18)*432) out.push({slot: 'back.panels', kind: 'light-block-too-big', detail: `mail panels cover ${(100*area/((pt(sh.width) - 18)*432)).toFixed(0)}% of the card`});
    if(sold) out.push(...jsCheck());
    return out; }
  // nothing but the proof guides may sit in the mail vendor's zones (postage, address block, barcode strip)
  function lum(c){ const m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(c); return m ? .2126*m[1] + .7152*m[2] + .0722*m[3] : 0; }
  function panelCheck(){ const out = [], Z = window.__zones, sh = document.querySelector('.sheet').getBoundingClientRect(), pt = v => v*72/96;
    const panels = [...document.querySelectorAll('.mailp')].map(p => { const r = p.getBoundingClientRect(); return {l: pt(r.left - sh.left), t: pt(r.top - sh.top), r: pt(r.right - sh.left), b: pt(r.bottom - sh.top), lum: lum(getComputedStyle(p).backgroundColor)}; });
    if(!panels.length) out.push({slot: 'back.panel', kind: 'mail-panel-missing', detail: 'no light panel under the mail zones'});
    ['postage', 'address', 'barcode'].forEach(k => { const z = Z[k], p = panels.find(q => q.l <= z[0] + .5 && q.t <= z[1] + .5 && q.r >= z[0] + z[2] - .5 && q.b >= z[1] + z[3] - .5);
      if(!p) out.push({slot: 'back.' + k, kind: 'mail-zone-not-light', detail: `the ${k} zone is not fully on a light panel`});
      else if(p.lum < 200) out.push({slot: 'back.' + k, kind: 'mail-zone-not-light', detail: `the ${k} panel's luminance is ${Math.round(p.lum)} (200 minimum): vendors print black ink and USPS needs a light field`}); });
    // the taupe runs to every edge: nothing outside the three panels is light
    return out; }
  // the Just Sold bullets: each takes the longest wording that sets in 3 lines (2 on the 6x9) so the six read as full sentences
  function fitHelp(){
    const hbs = [...document.querySelectorAll('.hb')], grid = document.querySelector('.pc-help'), call = grid.parentElement.querySelector('.pc-call');
    const pick = maxL => hbs.forEach(el => { const tx = el.querySelector('.tx'), alts = JSON.parse(el.dataset.alts).slice().sort((p, q) => q.length - p.length); let best = null, bf = -1;
      for(const a of alts){ tx.textContent = a; const L = SW.lines(tx); if(L.n > maxL) continue; if(L.n === 1 || L.fill >= .76){ best = a; bf = 9; break; } if(L.fill > bf){ best = a; bf = L.fill; } }
      tx.textContent = best || alts[alts.length - 1]; });
    const over = () => Math.max(...hbs.map(e => e.getBoundingClientRect().bottom)) > call.getBoundingClientRect().top - 5 || grid.parentElement.scrollHeight > grid.parentElement.clientHeight + .5;
    const bad = () => hbs.filter(el => { const L = SW.lines(el.querySelector('.tx')); return L.n > 1 && L.fill < .75; });
    // the bullets take the largest size at which all six set in full lines (last line 3/4 full) inside the box: no empty band under the heading
    const base = big ? 8.5 : 8, top = big ? 15 : 12; let bestCfg = null;
    const apply = fs => hbs.forEach(el => { el.style.fontSize = fs + 'pt'; el.style.lineHeight = (fs*1.32) + 'pt'; el.querySelector('.bx').style.marginTop = (fs*1.32/2 - 2) + 'pt'; });
    // every size is tried; the one whose bullets keep the fullest wording (then the larger type) wins, all six on full last lines inside the box
    for(let fs = top; fs >= base; fs -= .25) for(const maxL of (big ? [3, 2] : [3, 2])){
      apply(fs); pick(maxL); if(over() || bad().length) continue;
      const len = hbs.reduce((n, el) => n + el.querySelector('.tx').textContent.length, 0), sc = fs*1000 + len;
      if(!bestCfg || sc > bestCfg.sc) bestCfg = {fs, maxL, sc}; }
    if(bestCfg){ apply(bestCfg.fs); pick(bestCfg.maxL); } else { apply(base); pick(3); }
    { const bxel = grid.parentElement; if(over() || bxel.scrollHeight > bxel.clientHeight + .5) issues.push({slot: 'back.steps', kind: 'steps-overflow', detail: 'the six bullets and the call line do not fit their box'}); }
    hbs.forEach(el => { const tx = el.querySelector('.tx'), L = SW.lines(tx); delete el.dataset.slot;
      if(L.n > 1 && L.fill < .75) issues.push({slot: 'back.step' + el.dataset.help, kind: 'last-line-short', detail: `last line is ${Math.round(L.fill*100)}% full (75% minimum): "${tx.textContent.slice(-24)}"`}); });
  }
  function mailCheck(){ const out = [], Z = window.__zones, pt = v => v*72/96, sh = document.querySelector('.sheet').getBoundingClientRect();
    const hit = (r, z) => pt(r.left - sh.left) < z[0] + z[2] - .5 && pt(r.right - sh.left) > z[0] + .5 && pt(r.top - sh.top) < z[1] + z[3] - .5 && pt(r.bottom - sh.top) > z[1] + .5;
    document.querySelectorAll('.sheet .ph, .sheet .pc-wbox, .sheet .cap, .sheet .cc, .sheet .pc-ret, .sheet .pc-bstatus, .sheet .pc-disc').forEach(el => {
      const r = el.getBoundingClientRect(); for(const k in Z) if(hit(r, Z[k])) out.push({slot: el.dataset.slot || el.className, kind: 'in-mail-zone', zone: k}); });
    return out; }
})();
