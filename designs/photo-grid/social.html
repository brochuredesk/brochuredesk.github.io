<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>photo-grid social set</title>
<link rel="stylesheet" href="pg-tokens.css">
<script src="../engine/baths.js"></script>
<script src="../engine/ivory.js"></script>
<script src="../engine/ohlib.js"></script>
<script src="../engine/ohemail.js"></script>
<script src="../engine/carousel.js"></script>
<script src="../engine/factrepeat.js"></script>
<script src="../engine/socialset.js"></script>
<script src="pg-social.js"></script>
<!-- Photo Grid's Just Listed and Just Sold social sets (owner 11/18/2026). The shared engine (templates/_shared/socialset.js) loads the
     data and runs the checks; the layouts are Photo Grid's own (pg-social.js): the paper as the page, the grid of tiles set in from
     the trim, the main-color tile with the stacked Plex Condensed word and the ruled facts, the dark street tile, the tint tile for
     who to call, the white cell. The colors come from the agent's brand kit exactly as the set's print pieces read them (PG.colors /
     PG.brand in pg.js). -->
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
SocialSet.portrait = PGSocial.portrait; SocialSet.landscape = PGSocial.landscape; SocialSet.slide = PGSocial.slide;
// the layouts measure their words: every face and weight they set is loaded before the engine lays out
Promise.all(['500 12px Manrope', '600 12px Manrope', '700 12px Manrope', "700 20px 'Plex Condensed'"].map(f => document.fonts.load(f).catch(() => 0))).then(() => SocialSet.start(D => {
  const b = D.brand || {}, c = b.colors || {}, r = document.documentElement.style;
  const rgb = h => { h = String(h||'').replace('#',''); if(h.length===3) h = h.split('').map(x=>x+x).join(''); const n = parseInt(h,16); return [n>>16&255, n>>8&255, n&255]; };
  const lum = h => { const v = rgb(h).map(q => { q/=255; return q <= .03928 ? q/12.92 : Math.pow((q+.055)/1.055, 2.4); }); return .2126*v[0] + .7152*v[1] + .0722*v[2]; };
  const con = (a, x) => { const p = lum(a), q = lum(x); return (Math.max(p,q)+.05)/(Math.min(p,q)+.05); };
  const on = bg => con(bg, '#ffffff') >= con(bg, '#161616') ? '#ffffff' : '#161616';
  const readable = (fg, bg, min) => con(fg, bg) >= (min || 3) ? fg : on(bg);
  const mix = (a, x, t) => { const p = rgb(a), q = rgb(x); return '#' + p.map((v, i) => Math.round(v + (q[i] - v)*t).toString(16).padStart(2, '0')).join(''); };
  // as PG.colors / PG.brand (pg.js): the paper as the page, tiles of the main color with the accent where it reads on it, the dark tile,
  // the main color as ink on the white cell and the tint tile
  const main = c.main || b.accent || '#2f4a3a', dark = c.dark || b.ink || '#1c1c1c', accent = c.accent || b.accent2 || main, paper = b.paper || mix(main, '#ffffff', .93);
  const onM = on(main), onD = on(dark), mink = readable(main, '#ffffff', 4.5) === main ? main : readable(dark, '#ffffff', 4.5);
  r.setProperty('--pg-main', main); r.setProperty('--pg-dark', dark); r.setProperty('--pg-accent', accent); r.setProperty('--pg-paper', paper);
  r.setProperty('--pg-on-main', onM); r.setProperty('--pg-on-dark', onD); r.setProperty('--pg-acc-main', readable(accent, main)); r.setProperty('--pg-acc-dark', readable(accent, dark));
  r.setProperty('--pg-main-ink', mink); r.setProperty('--pg-line', mink); r.setProperty('--pg-tint', mix(main, '#ffffff', .86));
  r.setProperty('--pg-rule-on', onM === '#ffffff' ? 'rgba(255,255,255,.45)' : 'rgba(0,0,0,.4)'); r.setProperty('--pg-rule-ond', onD === '#ffffff' ? 'rgba(255,255,255,.45)' : 'rgba(0,0,0,.4)');
}));
</script>
</body>
</html>
