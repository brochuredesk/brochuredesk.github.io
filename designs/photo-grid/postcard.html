<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · Photo Grid postcards</title>
<link rel="stylesheet" href="pg.css">
<link rel="stylesheet" href="pg-fo.css">
<script src="pg.js"></script>
<script src="../engine/baths.js"></script>
<script src="../engine/agentcard.js"></script>
<script src="../engine/factrepeat.js"></script>
<script>window.Ivory = window.Ivory || {esc: s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))};</script>
<script src="pg-fo.js"></script>
<!--
  BrochureDesk · Photo Grid · Just Listed and Just Sold postcards (the hand of the approved Open House library flyer B01).
  data.piece.card = "listed" | "sold", data.piece.size = "6x11" (trim 792 x 432 pt) | "6x9" (648 x 432 pt), data.piece.side = "front" | "back".
  Print adds 0.125 in (9 pt) bleed. The agent's brand color (brand.accent) is the field on both sides; boxes are white.
  Front: the whole house (roof to steps) on the right with a one-line-or-two caption and a white box under it, the status stacked large on the left over the address,
  the fact rows and the brokerage logo (Just Listed) or the agent's name and number and the logo (Just Sold). No price, no QR.
  Back: status line, interior photos with captions, a white box (the write-up, or the steps), the standard contact card (templates/_shared/agentcard.js,
  band preset, which carries the back's one logo), the fine print. The right 289.5 pt (4.02 in) is the mail vendor's: return address, postage and address
  zones; drawn as guides on proofs and left clear in print.
  Copy comes from data.sw.pc.{jl|js}.{front|back} as a lead plus whole sentences; pg.js picks the sentences that fill each box.
-->
<style>
  /* B14 on a postcard: tiles and white cells; tokens in pg-tokens.css. Font properties one by one. */
  .pc-wbox{background:#fff;box-shadow:inset 0 0 0 .9pt var(--pg-line);color:#222;display:flex;flex-direction:column;overflow:hidden;--fx-on:#161616;--fx-soft:#2a2f31}
  .pc-wbox .k{font-family:var(--pg-cond);font-weight:700;font-size:10pt;line-height:12pt;letter-spacing:1.2pt;text-transform:uppercase;color:var(--pg-main-ink);white-space:nowrap;overflow:hidden;margin-bottom:3pt;align-self:flex-start}
  .pc-wbox .p{font-family:var(--pg-font);font-weight:500;overflow:hidden;color:#222}
  .pc-wbox .p b{font-weight:700;color:var(--fx-on)}
  .pc-bstatus{position:absolute;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
  .pc-steps .it{display:flex;gap:8pt;align-items:baseline;white-space:nowrap;overflow:hidden}
  .pc-steps .bx{width:5pt;height:5pt;transform:translateY(-1pt);background:var(--pg-main);flex:none}
  .pc-steps .bx.chip{display:block}
  .pc-steps{font-family:var(--pg-font);font-weight:500}
  .pc-call{font-family:var(--pg-cond);font-weight:700;font-size:13pt;line-height:16pt;letter-spacing:.4pt;text-transform:uppercase;color:var(--pg-main-ink);white-space:nowrap;overflow:hidden}
  .pc-disc{position:absolute;font-family:var(--pg-font);font-weight:500;font-size:6pt;line-height:10pt;overflow:hidden;white-space:nowrap}
  .pc-ret{position:absolute;font-family:var(--pg-font);font-weight:500;font-size:9pt;line-height:11pt;letter-spacing:.2pt;overflow:hidden;height:34pt}
  .pc-ret b{font-weight:700;letter-spacing:1.4pt;text-transform:uppercase}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const esc = SW.esc, b = D.brand || {}, A = D.agent || {}, L = D.listing, P = D.piece || {};
  document.body.dataset.mode = D.mode || 'email';
  await SW.setup(D);
  const sold = P.card === 'sold', big = P.size === '6x11', front = P.side === 'front';
  const W = big ? 792 : 648, H = 432;
  const K = ((D.sw || {}).pc || {})[sold ? 'js' : 'jl'] || {};
  const hsSrc = A.headshot && ((D.photos||{})[A.headshot] ? D.photos[A.headshot].src : A.headshot) || '';
  const statusWord = sold ? 'Just Sold' : 'Just Listed';
  const issues = [];
  const logo = (cls, src, area, maxh, style) => `<div class="logo ${cls}" data-area="${area}" data-maxh="${maxh}" style="${style||''}">${src ? `<img src="${esc(src)}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage||'')}</span>`}</div>`;
  const CL = big ? 13.5 : 12.5, CF = big ? 'font-size:10.4pt;line-height:13.5pt;' : '';   // the 6x11 sets its type up from the 6x9 (11 pt against 9.5), not the same size with more room
  const cap = (c, slot, lines, extra, min) => (c = (c.photo ? FXS.augment(D, c) : c), `<div class="cap" style="height:${5 + lines*CL}pt;${extra||''}"><div class="a" data-min="${min || 2}" data-slot="${slot}" data-narrow="0" data-nstep="6" data-lh="${CL}" data-lines="${lines}" data-lead="${esc(c.lead||'')}" data-s='${esc(JSON.stringify([].concat(c.s||[]))).replace(/'/g,'&#39;')}' style="height:${lines*CL}pt;${CF}"></div></div>`);
  let h = '';

  if(front){
    // The FX14 hand on a postcard front. A white frame top and side, the whole house in it, a taupe block around it with the status in Pinyon Script.
    // JL: "Just Listed" in script beside the house, the horizontal address, three facts; under the house the caption ("Front.", the draws) and the agent and logo along the foot.
    // JS: sells the agent: "Just Sold" in the same script lockup, the name and phone big on the left, the house on the right with the agent's own note, the logo.
    const F = K.front || {};
    const draws = list => { const w = x => /gated|roof|pergola|deck|park|garage|island|stone|corner|pool/i.test([].concat(x)[0]) ? 0 : 1; return (list || []).map((x, i) => [w(x), i, x]).sort((p, q) => p[0] - q[0] || p[1] - q[1]).map(t => t[2]); };
    const capC = sold ? (() => { const ns = (F.note || {}).s || (F.cap || {}).s || [], i = ns.findIndex(x => /^I just helped sell/.test([].concat(x)[0])); return i < 0 ? {lead: '', s: ns} : {lead: [].concat(ns[i]).sort((p, q) => p.length - q.length)[0], s: ns.filter((_, j) => j !== i)};  })() : (F.caption ? {lead: F.caption.lead, s: F.caption.s.concat(draws((F.about || {}).s || []))} : {lead: 'Front.', s: draws((F.about || {}).s || (F.cap || {}).s)});
    const norm = x => String(x).toLowerCase().replace(/[^a-z0-9 ]/g, '').slice(0, 40), allAlts = list => [].concat(...(list || []).map(x => [].concat(x)));
    const backSet = new Set([].concat(allAlts(((K.back || {}).about || {}).s), ...((K.back || {}).photos || []).map(c => allAlts(c.s)), allAlts((K.back || {}).steps6), allAlts((K.back || {}).steps)).map(norm));
    const backAll = allAlts(((K.back || {}).about || {}).s).map(String);   // the back's About box
    if(capC.s){ const kept = capC.s.filter(x => ![].concat(x).some(a => backSet.has(norm(a)))); if(kept.length >= 2) capC.s = kept; }
    // the caption's own first sentence stays; a later one that says a fact the back's About box says (the deck and pergola, in other words) drops out
    if(capC.s && capC.s.length > 2){ const tail = capC.s.slice(1).filter(x => ![].concat(x).some(a => backAll.some(b => SW.sameFact(String(a), b)))); if(tail.length >= 1) capC.s = [capC.s[0]].concat(tail); }
    const roomIds = [...new Set([].concat(((D.sw||{}).back||{}).photos||[], ((D.sw||{}).left||{}).photos||[]).map(c => c.photo))].filter(id => (D.photos||{})[id] && !(D.photos[id]||{}).fullHouse && id !== F.cap.photo).slice(0, 2);
    // ---- Photo Grid fronts: B14's grid on a card (16 pt margins, 8 pt gutters). ----
    // Just Listed: the whole house as the big 3:2 tile, the main-color column beside it with the status stacked in Plex Condensed caps,
    // the facts as numeral rows and who to call; under the house the dark tile with the street and two or three specific highlights
    // (and, on the 6x9, the kitchen as a second tile).
    // Just Sold (its own composition, not the Just Listed mirrored): JUST SOLD on one line across a main-color band with the street right
    // under it; below, the house, the seller question with the agent's note in a white cell sized to its text, and who to call on the dark tile.
    const k = big ? 1.12 : 1, pid = F.cap.photo, M = 16, g = 8, tile = FO.tileH, cap_ = FO.CAPB - FO.CAPT;
    const hood = FXS.hood(L), placeL = FXS.placeLine(L);
    const pht = (id, x, y, w, hh, slot, tight) => `<div class="abs" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${hh}pt">${SW.photo(D, id, 'position:absolute;inset:0', slot).replace('<div class="ph"', tight ? '<div class="ph" data-tight="1"' : '<div class="ph"')}</div>`;
    const logoRev = (x, y, w, hh, just) => { const src = PG.logoRev(D), ko = !(b.logoKnockout || b.logoOnDark); return `<div class="abs logo" data-area="${w*hh}" data-maxh="${hh}" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${hh}pt;justify-content:${just || 'flex-start'}">${src ? `<img src="${esc(src)}" alt="" style="${ko ? 'filter:brightness(0) invert(1)' : ''}">` : `<span class="word" style="color:#fff" data-slot="broker.name" data-lines="1">${esc(b.brokerage || '')}</span>`}</div>`; };
    const tg0 = FXS.tagFacts(D).tags.filter((t, i, arr) => !arr.slice(0, i).some(u => SW.sameFact(t, u))).sort((a, b2) => (/\b(19|20)\d\d\b/.test(b2) ? 1 : 0) - (/\b(19|20)\d\d\b/.test(a) ? 1 : 0));
    const tg = (F.highlights && F.highlights.length ? F.highlights : tg0);   // the listing's own specific highlights when the writer gives them
    const hl = (x, y, w, n, fs, rh) => tg.filter(t => FXS.width(t, `font-family:Manrope;font-weight:600;font-size:${fs}pt`) < w - 16).slice(0, n).map((t, i) => `<div class="abs" style="left:${x}pt;top:${y + i*rh}pt;width:${w}pt;height:${rh}pt;display:flex;align-items:center;gap:8pt;white-space:nowrap;overflow:hidden;font-family:var(--pg-font);font-weight:600;font-size:${fs}pt;line-height:${rh}pt;color:var(--pg-on-dark)" data-slot="front.hl.${i}" data-lines="1"><span style="width:5pt;height:5pt;background:var(--pg-acc-dark);flex:none"></span>${esc(t)}</div>`).join('');
    const street = String(L.address || '');
    if(!sold){
      // Design pass 11/15: the house leads (the biggest tile); JUST LISTED gets the head of the main-color column with room around it, the
      // facts drop to one quiet line under it, who to call at the column's foot; under the house the dark tile with the street and the highlights.
      const CWd = big ? 300 : 196, HW = W - 2*M - g - CWd, HH = Math.round(HW/1.5), CX = M + HW + g, BY = M + HH + g, BH = H - M - BY, tx = CX + 16, tw = CWd - 32;
      h += pht(pid, M, M, HW, HH, 'front.hero', true) + tile('main', CX, M, CWd, HH);
      let y = M + 16;
      h += FO.eb(hood || placeL, tx, y, tw, 'front.place', 'acc-main', `font-size:${8.6*k}pt`); y += 12 + 14;
      const parts = FO.factParts(L).filter(p => !/built/i.test(p.l)).slice(0, 3), frh = 25*k, fblock = parts.length*frh, avail = M + HH - 14 - fblock - 14 - 3 - 14 - y;
      let s = 36; for(let q = big ? 96 : 72; q >= 36; q -= 0.5) if(['JUST', 'LISTED'].every(t => FO.hlW(t, q) <= tw) && q*(cap_ + FO.PITCH) <= avail){ s = q; break; }
      const st = FO.stack(['Just', 'Listed'], tx - s*0.02, y, s, 'front.status', 'on-main', tw + 20); h += st.html;
      h += FO.bar(tx, st.y + 13);
      const fy0 = M + HH - 14 - fblock;
      h += parts.map((p, i) => { const ry = fy0 + i*frh; return `<div class="abs" style="left:${tx}pt;top:${ry}pt;width:${tw}pt;height:1pt;background:var(--pg-rule-on)"></div><div class="abs" style="left:${tx}pt;top:${ry + 1}pt;width:${tw}pt;height:${frh - 1}pt;display:flex;align-items:center;justify-content:space-between;white-space:nowrap" data-slot="front.fact.${i}" data-lines="1"><span style="font-family:var(--pg-cond);font-weight:700;font-size:${17*k}pt;line-height:${frh - 1}pt;color:var(--pg-acc-main)">${p.n}</span><span style="font-family:var(--pg-font);font-weight:700;font-size:8.6pt;line-height:${frh - 1}pt;letter-spacing:1.6pt;text-transform:uppercase;color:var(--pg-on-main)">${esc(p.l)}</span></div>`; }).join('');
      // who to call on the light tint tile under the column: the name, the phone, the brand-color logo
      h += tile('tint', CX, BY, CWd, BH);
      const ns = 15*k, ay = BY + (BH - (ns*1.2 + 15*k + 10 + 26*k))/2;
      h += `<div class="abs" style="left:${tx}pt;top:${ay}pt;width:${tw}pt"><div style="font-family:var(--pg-font);font-weight:700;font-size:${ns}pt;line-height:${ns*1.2}pt;color:var(--pg-ink);white-space:nowrap" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</div><div style="font-family:var(--pg-font);font-weight:700;font-size:${11*k}pt;line-height:${15*k}pt;color:var(--pg-main-ink);white-space:nowrap" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</div></div>` + logo('', PG.logoSrc(D), tw*26*k, 26*k, `position:absolute;left:${tx}pt;top:${ay + ns*1.2 + 15*k + 10}pt;width:${tw}pt;height:${26*k}pt;justify-content:flex-start`);
      // under the house: the street large on the dark tile, the highlights beside it (the listing's own story, left-aligned)
      const dx = M + 16, dw = HW - 32, aw = dw*0.46, ss = FXS.fitSize(street.toUpperCase(), "font-family:'Plex Condensed';font-weight:700;letter-spacing:.3pt", aw, big ? 30 : 26, 15), m2 = /^(\S+)\s+(.+)$/.exec(street), two = ss < (big ? 24 : 21) && m2, SL = two ? [m2[1], m2[2]] : [street], ss2 = two ? Math.min(big ? 30 : 26, FXS.fitSize(m2[2].toUpperCase(), "font-family:'Plex Condensed';font-weight:700;letter-spacing:.3pt", aw, big ? 30 : 26, 15)) : ss;
      h += tile('dark', M, BY, HW, BH);
      const ah = (SL.length - 1)*ss2*FO.PITCH + ss2*cap_ + 5 + 12, a = FO.stack(SL, dx, BY + (BH - ah)/2, ss2, 'front.address', 'on-dark', aw + 10);
      h += a.html + FO.eb(placeL, dx, a.y + 5, aw, 'front.city', 'acc-dark', `font-size:${8.6*k}pt`);
      const hx = dx + aw + 18, hw2 = dw - aw - 18, hfs = big ? 11.4 : 10.4, hrh = Math.min(big ? 20 : 19, (BH - 20)/3);
      h += `<div class="abs" style="left:${hx - 9}pt;top:${BY + 12}pt;width:1pt;height:${BH - 24}pt;background:var(--pg-rule-on)"></div>`;
      h += hl(hx + 4, BY + (BH - 3*hrh)/2, hw2 - 4, 3, hfs, hrh);
    } else {
      // Just Sold (its own composition): JUST SOLD on one line across the main band with the street right under it; the house under the band;
      // beside it ONE white cell: the seller question, the note that names the sale, a rule, and who to call set quietly in the main ink.
      const bw = W - 2*M, tx = M + 18, tw = bw - 36;
      let s = 60; for(let q = big ? 150 : 140; q >= 60; q -= 0.5) if(FO.hlW('JUST SOLD', q) <= tw){ s = q; break; }
      const sf = 19*k, BHt = 15 + s*cap_ + 11 + sf*1.2 + 12;
      h += tile('main', M, M, bw, BHt);
      const st = FO.stack(['Just Sold'], tx - s*0.03, M + 15, s, 'front.status', 'on-main', tw + 30); h += st.html;
      h += `<div class="abs" style="left:${tx}pt;top:${st.y + 9}pt;width:${tw}pt;height:${sf*1.2}pt;font-family:var(--pg-cond);font-weight:700;font-size:${sf}pt;line-height:${sf*1.2}pt;letter-spacing:1.2pt;text-transform:uppercase;color:var(--pg-acc-main);white-space:nowrap;overflow:hidden" data-slot="front.address" data-lines="1">${esc(street)}<span style="color:var(--pg-on-main);font-family:var(--pg-font);font-weight:700;font-size:${8.6*k}pt;letter-spacing:2pt;margin-left:14pt">${esc([hood, placeL].filter(Boolean).join('  ·  '))}</span></div>`;
      const ry = M + BHt + g, rh = H - M - ry; let hw = big ? 440 : Math.round(rh*1.4);   /* owner 11/16: narrower hero, wider seller cell; the 6x11 hero stays 1.15x+ the 6x9's area (scale check) */ while(hw > rh*1.5 && !SW.fits(D, pid, hw, rh)) hw -= 6; const cx = M + hw + g, cw = W - M - cx;
      h += pht(pid, M, ry, hw, rh, 'front.hero', true);
      // Owner 11/16 (Book 3 p23/p25): the boxes swap sizes. The "Thinking about selling?" cell takes most of the column, its heading and note
      // set bigger with more of the note, the whole block centered top to bottom in the cell; who to call sits in a short tint tile under it,
      // the box cut down to its contact (the contact's own type sizes unchanged).
      const ns = 16*k, AB = ns*1.2 + 12 + 15*k, AH = Math.round(AB + 20), nh = rh - AH - g, ay = ry + nh + g, ah = AH;
      const qf = FXS.fitSize('THINKING ABOUT SELLING?', "font-family:'Plex Condensed';font-weight:700;letter-spacing:.4pt", cw - 28, 24*k, 14), nf = big ? 13.75 : 11, lh = big ? 18.7 : 15, top0 = 14 + qf*1.2 + 8, n = Math.max(3, Math.floor((nh - top0 - 14)/lh));
      h += `<div class="pg-t cell" id="notebox" data-top="${top0}" style="left:${cx}pt;top:${ry}pt;width:${cw}pt;height:${nh}pt"></div>`;
      h += `<div class="abs" id="notehead" style="left:${cx + 14}pt;top:${ry + 14}pt;width:${cw - 28}pt;height:${qf*1.2}pt;font-family:var(--pg-cond);font-weight:700;font-size:${qf}pt;line-height:${qf*1.2}pt;letter-spacing:.4pt;text-transform:uppercase;color:var(--pg-main-ink);white-space:nowrap" data-slot="front.cta" data-lines="1">Thinking about selling?</div>`;
      h += `<div class="abs cap"><div class="a" style="position:absolute;left:${cx + 14}pt;top:${ry + top0}pt;width:${cw - 28}pt;height:${n*lh}pt;font-size:${nf}pt;line-height:${lh}pt;color:#222" data-slot="front.note" data-lead="${esc(capC.lead || '')}" data-lh="${lh}" data-lines="${n}" data-min="3" data-narrow="0" data-flexh="1" data-measures="1,0.95,0.9,0.85" data-malign="left" ${FXS.sd(capC.s || [])}></div></div>`;
      h += `<div class="pg-t tint" id="agenttile" style="left:${cx}pt;top:${ay}pt;width:${cw}pt;height:${ah}pt"></div>`;
      h += `<div class="abs" id="agentblk" style="left:${cx + 14}pt;top:${ay + 10}pt;width:${cw - 28}pt;height:${AB}pt"><div style="font-family:var(--pg-font);font-weight:700;font-size:${ns}pt;line-height:${ns*1.2}pt;color:var(--pg-ink);white-space:nowrap" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</div><div style="font-family:var(--pg-font);font-weight:700;font-size:8.6pt;line-height:12pt;letter-spacing:1.6pt;text-transform:uppercase;color:var(--pg-main-ink);white-space:nowrap" data-slot="agent.phone.label" data-lines="1">${esc(A.phoneLabel || 'Call / Text')}</div><div style="font-family:var(--pg-font);font-weight:700;font-size:${12*k}pt;line-height:${15*k}pt;color:var(--pg-main-ink);white-space:nowrap" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</div></div>` + logo('', PG.logoSrc(D), (cw - 28)*0.4*28*k, 28*k, `position:absolute;left:${cx + 14 + (cw - 28)*0.6}pt;top:${ay + 10}pt;width:${(cw - 28)*0.4}pt;height:${28*k}pt;justify-content:flex-end`).replace('class="logo ', 'id="agentlogo" class="logo ');
    }
  } else {
    // ---------------- BACK: the main color runs to every edge (the owner's edge-to-edge rule); only the postage box, the address block and the
    // barcode strip sit on light panels. The content side is Photo Grid's own: tiles and white cells on the field, the field as the gutter. ----------------
    // zones (pt, trim coordinates): postage 84 x 98.25 top right, address block 240 x 112.5, barcode strip 342 x 45 bottom right, all clear of art and type
    const dx = W - 648, X = 22, G = 8, B = K.back || {}, tile = FO.tileH, k = big ? 1.1 : 1;
    const Z = {postage: [552 + dx, 12, 84, 98.25], address: [405 + dx, 187.5, 240, 112.5], barcode: [306 + dx, 387, 342, 45]};
    window.__zones = Z; window.__cardX = 30;
    const PL = Z.barcode[0] - 8, cardH = 44, cardY = Z.address[1] + Z.address[3] + 4 + 8;   // owner 11/16: the contact block about half its old height (one compact row)
    h += `<div class="taupe" style="left:-9pt;top:-9pt;width:${W + 18}pt;height:${H + 18}pt"></div>`;
    const pnl = (x, y, w, hh) => `<div class="abs mailp" data-mail-panel="1" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${hh}pt;background:var(--fx-mail)"></div>`;
    // owner 11/16: the design runs edge to edge across the whole back, mail side included; the postage box, address block and barcode
    // strip are only small clear markups set into it (4 pt of light around each zone), never a light half or a dead strip
    h += pnl(Z.postage[0] - 4, Z.postage[1] - 4, Z.postage[2] + 8, Z.postage[3] + 8);
    h += pnl(Z.address[0] - 4, Z.address[1] - 4, Math.min(W + 9, Z.address[0] + Z.address[2] + 4) - (Z.address[0] - 4), Z.address[3] + 8);
    h += pnl(Z.barcode[0] - 4, Z.barcode[1] - 4, W + 9 - (Z.barcode[0] - 4), H + 9 - (Z.barcode[1] - 4));
    const rx = Z.address[0], lw = rx - 16 - X;          // the content side: everything left of the address block
    const rw = Z.postage[0] - 12 - rx;                 // the return address: left of the postage box
    const TOPY = 18, BOTY = Z.address[1] + Z.address[3] + 4, CH = BOTY - TOPY;   // the content grid now runs down to the address markup's foot

  // the Just Sold bullets take the largest size at which every one sets in full lines inside the box, then the leading opens until the box is at least 85% filled
