<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · Ruled Editorial postcards</title>
<link rel="stylesheet" href="re.css">
<link rel="stylesheet" href="re-fo.css">
<script src="re.js"></script>
<script src="../engine/baths.js"></script>
<script src="../engine/agentcard.js"></script>
<script src="../engine/factrepeat.js"></script>
<script>window.Ivory = window.Ivory || {esc: s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))};</script>
<script src="re-fo.js"></script>
<!--
  BrochureDesk · Ruled Editorial · Just Listed and Just Sold postcards (the hand of the approved Open House library flyer B01).
  data.piece.card = "listed" | "sold", data.piece.size = "6x11" (trim 792 x 432 pt) | "6x9" (648 x 432 pt), data.piece.side = "front" | "back".
  Print adds 0.125 in (9 pt) bleed. The agent's brand color (brand.accent) is the field on both sides; boxes are white.
  Front: the whole house (roof to steps) on the right with a one-line-or-two caption and a white box under it, the status stacked large on the left over the address,
  the fact rows and the brokerage logo (Just Listed) or the agent's name and number and the logo (Just Sold). No price, no QR.
  Back: status line, interior photos with captions, a white box (the write-up, or the steps), the standard contact card (templates/_shared/agentcard.js,
  band preset, which carries the back's one logo), the fine print. The right 289.5 pt (4.02 in) is the mail vendor's: return address, postage and address
  zones; drawn as guides on proofs and left clear in print.
  Copy comes from data.sw.pc.{jl|js}.{front|back} as a lead plus whole sentences; re.js picks the sentences that fill each box.
-->
<style>
  /* the FX14 hand on a postcard: white frame, a taupe block, Pinyon Script status, white underlined labels, hairline white boxes; tokens in re-tokens.css */
  .pc-col{position:absolute;display:flex;flex-direction:column}
  .pc-wbox{background:var(--re-lift);color:var(--fx-soft);padding:10pt 16pt 9pt;display:flex;flex-direction:column;overflow:hidden}
  .pc-wbox:after{content:"";position:absolute;inset:4.5pt;border:1pt solid color-mix(in srgb, var(--re-accent) 78%, transparent);pointer-events:none}
  .pc-wbox.lt{background:#fff;color:#2c2c2c}
  .pc-wbox.lt:after{border-color:var(--re-box-line)}
  .pc-wbox.lt .k{color:var(--re-ink-accent)}
  .pc-wbox.lt .p{color:#161616}
  .pc-wbox .k{font:500 8.6pt/11pt var(--re-font);letter-spacing:3.4pt;text-transform:uppercase;color:var(--re-accent);white-space:nowrap;overflow:hidden;margin-bottom:3pt;align-self:flex-start}
  .pc-wbox .p{font-family:var(--re-serif);font-weight:500;overflow:hidden;color:var(--fx-on)}
  .pc-wbox .p b{font-weight:700;color:var(--fx-on)}
  .pc-bstatus{position:absolute;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
  .pc-bstatus .st{font:700 10.5pt/1 var(--fx-font);letter-spacing:2.4pt;color:var(--fx-on);text-transform:uppercase}
  .pc-bstatus .ln{flex:1;height:1.2pt;background:var(--re-accent);margin:0 12pt;min-width:16pt}
  .pc-bstatus .ad{font:500 16pt/1 var(--re-serif);color:var(--fx-on);padding-bottom:3pt}
  .pc-steps .it{display:flex;gap:8pt;align-items:baseline;white-space:nowrap;overflow:hidden}
  .pc-steps .bx{width:4pt;height:4pt;transform:translateY(-1pt) rotate(45deg);background:var(--re-accent);flex:none}
  .pc-call{font:500 13pt/16pt var(--re-serif);color:var(--re-accent);white-space:nowrap;overflow:hidden}
  .pc-disc{position:absolute;font-size:6pt;line-height:10pt;color:var(--fx-soft);overflow:hidden;white-space:nowrap}
  .pc-ret{position:absolute;font:500 9pt/11pt var(--fx-font);letter-spacing:.2pt;color:var(--fx-on);overflow:hidden;height:34pt}
  .pc-ret b{font-weight:700;letter-spacing:1.4pt;text-transform:uppercase;color:var(--fx-ink)}
  .cap .a{font-weight:400}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const esc = SW.esc, b = D.brand || {}, A = D.agent || {}, L = D.listing, P = D.piece || {};
  document.body.dataset.mode = D.mode || 'email';
  await SW.setup(D);
  const sold = P.card === 'sold', big = P.size === '6x11', front = P.side === 'front';
  const W = big ? 792 : 648, H = 432;
  const K = ((D.sw || {}).pc || {})[sold ? 'js' : 'jl'] || {};
  const hsSrc = A.headshot && ((D.photos||{})[A.headshot] ? D.photos[A.headshot].src : A.headshot) || '';
  const statusWord = sold ? 'Just Sold' : 'Just Listed';
  const issues = [];
  const logo = (cls, src, area, maxh, style) => `<div class="logo ${cls}" data-area="${area}" data-maxh="${maxh}" style="${style||''}">${src ? `<img src="${esc(src)}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage||'')}</span>`}</div>`;
  const CL = big ? 13.5 : 12.5, CF = big ? 'font-size:10.6pt;line-height:13.5pt;' : 'font-size:9.6pt;line-height:12.5pt;';   // the 6x11 sets its type up from the 6x9 (11 pt against 9.5), not the same size with more room
  const cap = (c, slot, lines, extra, min) => (c = (c.photo ? FXS.augment(D, c) : c), `<div class="cap" style="height:${5 + lines*CL}pt;${extra||''}"><div class="a" data-min="${min || 2}" data-nopair="1" data-slot="${slot}" data-narrow="0" data-nstep="6" data-lh="${CL}" data-lines="${lines}" data-lead="${esc(c.lead||'')}" data-s='${esc(JSON.stringify([].concat(c.s||[]))).replace(/'/g,'&#39;')}' style="height:${lines*CL}pt;${CF}"></div></div>`);
  let h = '';

  // ---------------- Ruled Editorial postcards (P01's hand) ----------------
  const G = 12, k = big ? 1.12 : 1, PM = 24, pid = FO.heroId(D, ((K.front || {}).cap || {}).photo || 'front'), ad = String(L.address || ''), place = FO.place(L);
  const agentNameCss = ns => `font-family:Epilogue;font-weight:600;letter-spacing:-.01em;font-size:${ns}pt`;
  const photoAt = (x, y, w, hh, slot) => `<div class="abs" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${hh}pt">${SW.photo(D, pid, 'position:absolute;inset:0', slot || 'front.hero')}</div>`;
  // the agent and the one logo on one row: Epilogue name, Hanken phone, the kit's logo flush right
  const agentRow = (x, y, w, hh, ns, mid) => { const pw = FXS.width(A.phone || '', `font-family:Hanken;font-weight:600;font-size:${ns*0.8}pt`), nw = FXS.width(A.name || '', agentNameCss(ns)), bw = nw + 14*k + pw, lx = x + bw + 18*k;
    return `<div class="abs" style="left:${x}pt;top:${y + (hh - ns*1.25)/2}pt;width:${bw + 4}pt;height:${ns*1.25}pt;white-space:nowrap;line-height:${ns*1.25}pt"><span style="font-family:var(--re-display);font-weight:600;font-size:${ns}pt;letter-spacing:-.01em;color:var(--re-ink)" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</span><span style="font-family:var(--re-font);font-weight:600;font-size:${ns*0.8}pt;color:var(--re-main);margin-left:${14*k}pt" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</span></div>` + FXS.logo(D, lx, y + 2, x + w - lx, hh - 4, 'flex-end') + (mid && (A.email || A.web) ? `<div class="abs" id="agentmid" data-slot="agent.contact" data-lines="2" style="left:${lx}pt;top:${y + (hh - 2*ns*0.62*1.25)/2}pt;width:${x + w - lx}pt;height:${2*ns*0.62*1.25}pt;font-family:var(--re-font);font-weight:500;font-size:${ns*0.62}pt;line-height:${ns*0.62*1.25}pt;color:var(--re-ink);white-space:nowrap"><span style="display:inline-block">${[A.email, A.web].filter(Boolean).map(esc).join('<br>')}</span></div>` : ''); };
  const street = (t, x, y, w, max, slot, grp) => { const fs = FXS.fitSize(t, 'font-family:Epilogue;font-weight:600;letter-spacing:-.012em', w, max, 12); return {fs, html: `<div class="re-street"${grp ? ` data-center="${grp}"` : ''} style="left:${x}pt;top:${y}pt;width:${w}pt;height:${fs*1.25}pt;font-size:${fs}pt;line-height:${fs*1.25}pt" data-slot="${slot}" data-lines="1">${esc(t)}</div>`}; };
  const placeLn = (t, x, y, w, slot, max, grp) => { let f = max || 9*k; while(f > 8.6 && FXS.width(t.toUpperCase(), `font-family:Hanken;font-weight:600;letter-spacing:2pt;font-size:${f}pt`) > w - 4) f -= 0.2; return `<div class="re-place"${grp ? ` data-center="${grp}"` : ''} style="left:${x}pt;top:${y}pt;width:${w}pt;height:${f*1.4}pt;font-size:${f}pt;line-height:${f*1.4}pt" data-slot="${slot}" data-lines="1">${esc(t.toUpperCase())}</div>`; };
  const hlLine = (t, x, y, w, s, al, slot) => `<div class="re-hl" style="left:${x - (al === 'left' ? 0.06*s : 0)}pt;top:${y + 0.04*s}pt;width:${w + 0.06*s}pt;height:${0.96*s}pt;font-size:${s}pt;line-height:${0.923*s}pt;text-align:${al}" data-slot="${slot}" data-lines="1">${esc(t.toUpperCase())}</div>`;

  if(front){
    const F = K.front || {};
    if(!sold){
      // ---------- JUST LISTED: P01's headline is the card. JUST on line one, LISTED flush right on line two with the neighborhood as the
      // join, between three rules; the street, the facts justified, the house's real story in three ruled rows; the agent and the logo at
      // the foot. The house bleeds off the top, the side and the foot. ----------
      let PW = Math.round(W*0.47); while(PW < W*0.64 && !SW.fits(D, pid, PW + 9, H + 18)) PW += 6;
      const side = SW.fits(D, pid, PW + 9, H + 18), hls = (F.highlights || FXS.tagFacts(D).tags || []).slice(0, 3);
      const jn = FXS.hood(L) ? FO.twoLines(FXS.hood(L)) : [], jw = j => j.length ? Math.max(...j.map(t => FXS.width(t, `font-family:Hanken;font-weight:500;font-size:${11*k}pt`))) + 14 : 0;
      if(side){
        const PX = W - PW, TX0 = PM, TX1 = PX - 22*k, TW = TX1 - TX0;
        h += photoAt(PX, -9, PW + 9, H + 18);
        const s = Math.min(FO.hlSize(['JUST', 'LISTED'], [TW - jw(jn), TW], 92*k, 40), (H - PM - 38*k - PM - 150*k)/2), dk = FO.deck({y: PM, s, l1: 'Just', l2: 'Listed', join: jn, joinTop: true, jmax: 12*k, slot: 'front.status', x0: TX0, x1: TX1});
        h += dk.html; let y = dk.y + 9*k;
        const st = street(ad, TX0, y, TW, 25*k, 'front.address'); h += st.html; y += st.fs*1.25 + 3;
        h += placeLn(FXS.placeLine(L), TX0, y, TW, 'front.place', 9*k); y += 9*k*1.4 + 7*k;
        h += FO.factsLine(L, TX0, y, TW, 'front.facts', 10*k); y += 10*k*1.4 + 7*k;
        const fy = H - PM - 30*k; h += FO.rule(TX0, y, TW); y += 1.2;
        const rh = (fy - 8 - y)/Math.max(1, hls.length), hf = Math.min(13.5*k, rh*0.6);
        hls.forEach((t, i) => { const yy = y + i*rh; if(i) h += `<div class="re-hair" style="left:${TX0}pt;top:${yy}pt;width:${TW}pt"></div>`;
          let f = hf; while(f > 9 && FXS.width(t, `font-family:Hanken;font-weight:600;font-size:${f}pt`) > TW - 22*k) f -= 0.25;
          h += `<div class="abs" style="left:${TX0}pt;top:${yy + rh/2 - 0.6}pt;width:${12*k}pt;height:1.2pt;background:var(--re-ink)"></div><div class="abs" style="left:${TX0 + 20*k}pt;top:${yy + (rh - f*1.3)/2}pt;width:${TW - 20*k}pt;height:${f*1.3}pt;font-family:var(--re-font);font-weight:600;font-size:${f}pt;line-height:${f*1.3}pt;color:var(--re-ink);white-space:nowrap;overflow:hidden" data-slot="front.hl.${i}" data-lines="1">${esc(t)}</div>`; });
        h += FO.rule(TX0, fy - 8, TW) + agentRow(TX0, fy, TW, 30*k, 15*k);
      } else {
        // a wide house runs across the top; the headline deck and the facts in two columns under it
        let SH = 210; while(SH < H*0.74 && !SW.fits(D, pid, W + 18, SH + 9)) SH += 4;
        h += photoAt(-9, -9, W + 18, SH + 9);
        const y0 = SH + 12, cW = Math.round((W - 2*PM)*0.52), cR = PM + cW + 22, rW = W - PM - cR, avail = H - PM - y0;
        const s = Math.min(avail/2.02, FO.hlSize(['JUST', 'LISTED'], [cW, cW - jw(jn)], 80*k, 30)), dk = FO.deck({y: y0, s, l1: 'Just', l2: 'Listed', join: jn, jmax: 11*k, slot: 'front.status', x0: PM, x1: PM + cW});
        h += dk.html + FO.vrule(cR - 11, y0, H - PM - y0);
        let y = y0 + 2; const st = street(ad, cR, y, rW, 20*k, 'front.address'); h += st.html; y += st.fs*1.25 + 2;
        h += FO.factsLine(L, cR, y, rW, 'front.facts', 9.5*k); y += 9.5*k*1.4 + 5;
        const fy = H - PM - 26*k, nh = Math.max(1, Math.min(hls.length, Math.floor((fy - 6 - y)/(17*k)))), rh = (fy - 6 - y)/nh;
        hls.slice(0, nh).forEach((t, i) => { const yy = y + i*rh; let f = Math.min(11.5*k, rh*0.62); while(f > 9 && FXS.width(t, `font-family:Hanken;font-weight:600;font-size:${f}pt`) > rW - 18*k) f -= 0.25;
          h += `<div class="re-hair" style="left:${cR}pt;top:${yy}pt;width:${rW}pt"></div><div class="abs" style="left:${cR}pt;top:${yy + rh/2 - 0.6}pt;width:${10*k}pt;height:1.2pt;background:var(--re-ink)"></div><div class="abs" style="left:${cR + 16*k}pt;top:${yy + (rh - f*1.3)/2}pt;width:${rW - 16*k}pt;height:${f*1.3}pt;font-family:var(--re-font);font-weight:600;font-size:${f}pt;line-height:${f*1.3}pt;color:var(--re-ink);white-space:nowrap;overflow:hidden" data-slot="front.hl.${i}" data-lines="1">${esc(t)}</div>`; });
        h += FO.rule(cR, fy - 4, rW) + agentRow(cR, fy, rW, 26*k, 12.5*k);
      }
    } else {
      // ---------- JUST SOLD: its own card. JUST SOLD on one line across the whole card between two rules (the deck at full width); under
      // it the house as a picture on the left margin and, beside it, the street, the place and the note in P01's white event box (two lines
      // that name the sale); the agent and the logo on the foot rule. No house features. ----------
      // owner 11/17 (Q2: no cap on JUST SOLD): the line runs the card's full measure, as large as leaves the house at least 190 pt tall
      // On the 6x11 the line leaves the house at least 214 pt tall (its type and photo scale up from the 6x9's) and the neighborhood, P01's
      // join, takes the room it leaves at the end of the band
      const jn = big && FXS.hood(L) ? FO.twoLines(FXS.hood(L)).filter(Boolean) : [], jf = 12*k, jwd = jn.length ? Math.max(...jn.map(t => FXS.width(t, `font-family:Hanken;font-weight:500;font-size:${jf}pt`))) + 18 : 0;
      const TW = W - 2*PM, s = Math.min((H - 2*PM - 30*k - 12 - 12*k - (big ? 214 : 190))/0.9, FO.hlSize(['JUST SOLD'], [TW - jwd], 170, 40)), dk = FO.deck({y: PM, s, l1: 'Just Sold', slot: 'front.status', x0: PM, x1: W - PM});
      h += dk.html; const y0 = dk.y + 12*k, fy = H - PM - 30*k, PHh = fy - 12 - y0;
      const jx0 = PM + FO.hlW('JUST SOLD', s) + 12, jrw = Math.max(jwd, W - PM - jx0);   // centered in the room the line leaves
      jn.forEach((q, i) => { h += `<div class="re-join" style="left:${jx0}pt;top:${PM + 0.45*s - jn.length*jf*0.6 + i*jf*1.2}pt;width:${jrw}pt;height:${jf*1.2}pt;font-size:${jf}pt;line-height:${jf*1.2}pt;text-align:center" data-slot="front.status.join${i}" data-lines="1">${esc(q)}</div>`; });
      let PWi = Math.round(W*(big ? 0.55 : 0.44));
      if(!SW.fits(D, pid, PWi, PHh)){ let w = PWi; while(w > W*0.4 && !SW.fits(D, pid, w, PHh)) w -= 6; if(SW.fits(D, pid, w, PHh)) PWi = w; else { PWi = Math.round(W*0.44); while(PWi < W*0.6 && !SW.fits(D, pid, PWi, PHh)) PWi += 6; } }   // a tall house: the frame narrows until the whole house fits
      h += photoAt(PM, y0, PWi, PHh);
      // owner 11/17 (p36, p38): the note's white card is made bigger to fill the room beside the house; the address moves up, centered
      // between the rule over it and the card (RE.centerHeads)
      const cx = PM + PWi + 24*k, cw = W - PM - cx; let y = dk.y + 8*k;
      const st = street(ad, cx, y, cw, 32*k, 'front.address', 'addr'); h += st.html; y += st.fs*1.25 + 2;
      h += placeLn(place.join('  ·  '), cx, y, cw, 'front.place', 9*k, 'addr'); y += 9*k*1.4 + 14*k;
      // the note: its two-sentence wordings, and each with one more of the note's own true sentences, so a big card can take a longer note
      const extra = ((F.note || {}).s || []).slice(2).map(x => [].concat(x)[0]).filter(Boolean), base2 = [].concat(F.note2 || ((F.note || {}).s || []).slice(0, 2).join(' '));
      const alts = base2.concat(...base2.map(a => extra.map(e => a + ' ' + e)).map(l => l.filter(t => !SW.sameFactIn(t) && !SW.rep5(t)))), nfs = 13.5*k, nlh = nfs*1.4, nH = fy - 12 - y;
      h += `<div class="re-card" id="notebox" style="left:${cx}pt;top:${y}pt;width:${cw}pt;height:${nH}pt"></div>`;
      h += `<div class="abs" style="left:${cx + 14}pt;top:${y + 12}pt;width:${cw - 28}pt;font-family:var(--re-display);font-weight:600;font-size:${16*k}pt;line-height:${20*k}pt;color:var(--re-ink);white-space:nowrap;overflow:hidden" data-slot="front.cta" data-lines="1">Thinking about selling?</div>`;
      h += `<div class="abs cap" style="left:0;top:0"><div class="a" style="position:absolute;left:${cx + 14}pt;top:${y + 12 + 20*k + 6}pt;width:${cw - 28}pt;height:${3*nlh}pt;font-size:${nfs}pt;line-height:${nlh}pt" data-nofit="1" data-slot="front.note" data-lh="${nlh}" data-lines="3" data-try="4,3,2" data-min="2" data-narrow="0" data-flexh="1" ${FXS.sd([alts])}></div></div>`;
      h += FO.rule(PM, fy - 8, TW) + agentRow(PM, fy, TW, 30*k, 15*k, true);
    }
  } else {
    // ---------------- BACK (owner 11/16: the design runs edge to edge, the mail side included; the address block, postage box and barcode
    // strip are small clear markups; the contact block about half its old height). P01's ink rules run across the whole card from bleed to
    // bleed, breaking only around the three mail markups, which are P01's white event boxes with the thin ink line. ----------------
    const dx = W - 648, B = K.back || {};
    const Z = {postage: [552 + dx, 12, 84, 98.25], address: [405 + dx, 187.5, 240, 112.5], barcode: [306 + dx, 387, 342, 45]};
    window.__zones = Z; window.__cardX = PM;
    const P = {};
    Object.keys(Z).forEach(q => { const z = Z[q]; P[q] = [z[0] - 4, z[1] - 4, z[0] + z[2] + 4, z[1] + z[3] + 4]; });
    P.barcode[2] = W + 9; P.barcode[3] = H + 9;
    h += `<div class="taupe" style="left:-9pt;top:-9pt;width:${W + 18}pt;height:${H + 18}pt"></div>`;
        h += `<div class="abs re-tintf" style="left:-9pt;top:-9pt;width:${W + 18}pt;height:${H + 18}pt"></div>`;   // the whole back on the card tint (P01's contact band color): the mail markups read as white event boxes set into it
    Object.keys(P).forEach(q => { const p = P[q]; h += `<div class="abs mailp re-card" data-mail-panel="1" style="left:${p[0]}pt;top:${p[1]}pt;width:${p[2] - p[0]}pt;height:${p[3] - p[1]}pt"></div>`; });
    // a rule from bleed to bleed at y, broken 6 pt short of any mail markup it meets
    const xrule = (y, x0, x1) => { x0 = x0 == null ? -9 : x0; x1 = x1 == null ? W + 9 : x1; let spans = [[x0, x1]];
      Object.values(P).forEach(p => { if(y + 1.2 < p[1] - 0.5 || y > p[3] + 0.5) return; spans = spans.flatMap(([a, c]) => (p[2] + 6 <= a || p[0] - 6 >= c) ? [[a, c]] : [[a, Math.min(c, p[0] - 6)], [Math.max(a, p[2] + 6), c]]); });
      return spans.filter(([a, c]) => c - a > 14).map(([a, c]) => FO.rule(a, y, c - a)).join(''); };
    const rx = Z.address[0], MX = P.address[0] - 12, rw = Z.postage[0] - 12 - rx;   // MX: the right edge of the main column
    // the masthead: the status as P01's huge caps line between rules, the full street under it with the place
    const s = Math.min(big ? 50 : 44, FO.hlSize([statusWord], [MX - PM], big ? 50 : 44, 24));
    h += xrule(PM - 2) + hlLine(statusWord, PM, PM - 2, MX - PM, s, 'left', 'back.status');
    let y = PM - 2 + s; h += xrule(y);
    const st = street(ad, PM, y + 7, Math.min(MX - PM, 300*k), 20*k, 'back.signature', 'addr'); h += st.html;

  function fitSteps(){ const box = document.getElementById('stepsbox'), list = document.getElementById('stepslist'); if(!box || !list) return;
    if(big){   // 6x11: one column, every step one full line, the largest size from 15.5 pt down to the 6x9's x1.08; the box is sized to its content, set on the card's top, the call to action centered above it
      const stp = [...list.querySelectorAll('.stp')], its = [...list.querySelectorAll('.it')];
      let best = null;
      for(let fs = 15.5; fs >= 14.1 - 1e-6; fs -= 0.1){ list.style.fontSize = fs + 'pt'; const lh = fs*1.62; list.style.lineHeight = lh + 'pt'; stp.forEach(e => { e.dataset.lh = lh; }); its.forEach(it => { it.querySelector('.bx').style.marginTop = (lh*.42) + 'pt'; }); SW.fill();
        if(stp.every(e => SW.lines(e).n === 1)){ const fill = Math.min(...stp.map(e => (e.getBoundingClientRect().width ? (() => { const r = document.createRange(); r.selectNodeContents(e); const q = [...r.getClientRects()]; return q.length ? (Math.max(...q.map(x => x.right)) - Math.min(...q.map(x => x.left)))/list.getBoundingClientRect().width : 0; })() : 0))); best = {fs, lh, fill}; break; } }
      if(!best) return;
      box.style.justifyContent = 'flex-start'; box.style.gap = '8pt'; box.style.height = 'auto';
      const hpt = box.getBoundingClientRect().height*0.75, bottom = parseFloat(box.style.top) + (+box.dataset.bh0 || 0), top0 = parseFloat(box.style.top), end = top0 + parseFloat(box.dataset.bh0 || 0);
      const boxBottom = 282, newTop = boxBottom - hpt; box.style.top = newTop + 'pt'; box.style.height = hpt + 'pt';
      const cta = document.getElementById('jscta'), st = document.querySelector('[data-slot="back.status"]'), sb = parseFloat(st.style.top) + parseFloat(st.style.height), room = newTop - sb;
      if(cta && room >= 30){ const cs = Math.min(21, room - 12); cta.style.display = ''; cta.style.fontSize = cs + 'pt'; cta.style.lineHeight = (cs*1.3) + 'pt'; cta.style.height = (cs*1.3) + 'pt'; cta.style.top = (sb + (room - cs*1.3)/2) + 'pt'; }
      return; }
    const stp = [...list.querySelectorAll('.stp')], its = [...list.querySelectorAll('.it')], fits = () => box.scrollHeight <= box.clientHeight + .5;
    const okLines = () => stp.every(e => { const L = SW.lines(e); return L.n === 1 || (L.fill >= .9 && L.min >= .8); });
    const apply = (fs, m) => { list.style.fontSize = fs + 'pt'; list.style.lineHeight = (fs*m) + 'pt'; stp.forEach(e => { e.dataset.lh = fs*m; }); its.forEach(it => { it.querySelector('.bx').style.marginTop = (fs*m*.42) + 'pt'; }); SW.fill(); };
    const sizes = []; for(let f = big ? 13.5 : 13; f >= 9.5 - 1e-6; f -= 0.1) sizes.push(+f.toFixed(2));
    for(const fs of sizes){ apply(fs, 1.25); if(!(okLines() && fits())) continue;
      for(let m = 1.25; m <= 1.7; m += .03){ apply(fs, m); if(!fits() || !okLines()){ apply(fs, m - .03); break; } jsCheck(); if(window.__jsFill >= .87) break; }
      return; }
    apply(sizes[sizes.length - 1], 1.25); }
  function backCheck(){ const out = [], pt = v => v*72/96, sh = document.querySelector('.sheet').getBoundingClientRect(), X0 = window.__cardX || 30;
    const cc = document.querySelector('.sheet .cc');
    if(!cc) out.push({slot: 'back.card', kind: 'no-contact-card', detail: 'the back has no standard contact card'});
    else { const r = cc.getBoundingClientRect(), l = pt(r.left - sh.left), rr = pt(r.right - sh.left), Wt = pt(sh.width) - 18;
      if(l > X0 + 1 || rr < Wt - X0 - 1) out.push({slot: 'back.card', kind: 'card-not-full-width', detail: `card spans ${l.toFixed(0)}-${rr.toFixed(0)} pt of ${Wt.toFixed(0)}`}); }
    let area = 0; document.querySelectorAll('.sheet [data-mail-panel]').forEach(el => { const r = el.getBoundingClientRect(); const w = Math.min(pt(r.right - sh.left) - 9, pt(sh.width) - 18) - Math.max(pt(r.left - sh.left) - 9, 0), h = Math.min(pt(r.bottom - sh.top) - 9, 432) - Math.max(pt(r.top - sh.top) - 9, 0); area += Math.max(0, w)*Math.max(0, h); });
    if(area > .25*(pt(sh.width) - 18)*432) out.push({slot: 'back.panels', kind: 'light-block-too-big', detail: `mail panels cover ${(100*area/((pt(sh.width) - 18)*432)).toFixed(0)}% of the card`});
    if(sold) out.push(...jsCheck());
    return out; }
  // nothing but the proof guides may sit in the mail vendor's zones (postage, address block, barcode strip)
  function lum(c){ const m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(c); return m ? .2126*m[1] + .7152*m[2] + .0722*m[3] : 0; }
  function panelCheck(){ const out = [], Z = window.__zones, sh = document.querySelector('.sheet').getBoundingClientRect(), pt = v => v*72/96;
    const panels = [...document.querySelectorAll('.mailp')].map(p => { const r = p.getBoundingClientRect(); return {l: pt(r.left - sh.left), t: pt(r.top - sh.top), r: pt(r.right - sh.left), b: pt(r.bottom - sh.top), lum: lum(getComputedStyle(p).backgroundColor)}; });
    if(!panels.length) out.push({slot: 'back.panel', kind: 'mail-panel-missing', detail: 'no light panel under the mail zones'});
    ['postage', 'address', 'barcode'].forEach(k => { const z = Z[k], p = panels.find(q => q.l <= z[0] + .5 && q.t <= z[1] + .5 && q.r >= z[0] + z[2] - .5 && q.b >= z[1] + z[3] - .5);
      if(!p) out.push({slot: 'back.' + k, kind: 'mail-zone-not-light', detail: `the ${k} zone is not fully on a light panel`});
      else if(p.lum < 200) out.push({slot: 'back.' + k, kind: 'mail-zone-not-light', detail: `the ${k} panel's luminance is ${Math.round(p.lum)} (200 minimum): vendors print black ink and USPS needs a light field`}); });
    // the taupe runs to every edge: nothing outside the three panels is light
    return out; }
  // the Just Sold bullets: each takes the longest wording that sets in 3 lines (2 on the 6x9) so the six read as full sentences
  function fitHelp(){
    const hbs = [...document.querySelectorAll('.hb')], grid = document.querySelector('.pc-help'), call = grid.parentElement.querySelector('.pc-call');
    const pick = maxL => hbs.forEach(el => { const tx = el.querySelector('.tx'), alts = JSON.parse(el.dataset.alts).slice().sort((p, q) => q.length - p.length); let best = null, bf = -1;
      for(const a of alts){ tx.textContent = a; const L = SW.lines(tx); if(L.n > maxL) continue; if(L.n === 1 || L.fill >= .76){ best = a; bf = 9; break; } if(L.fill > bf){ best = a; bf = L.fill; } }
      tx.textContent = best || alts[alts.length - 1]; });
    const over = () => Math.max(...hbs.map(e => e.getBoundingClientRect().bottom)) > call.getBoundingClientRect().top - 5 || grid.parentElement.scrollHeight > grid.parentElement.clientHeight + .5;
    const bad = () => hbs.filter(el => { const L = SW.lines(el.querySelector('.tx')); return L.n > 1 && L.fill < .75; });
    // the bullets take the largest size at which all six set in full lines (last line 3/4 full) inside the box: no empty band under the heading
    const base = big ? 8.5 : 8, top = big ? 15 : 12; let bestCfg = null;
    const apply = fs => hbs.forEach(el => { el.style.fontSize = fs + 'pt'; el.style.lineHeight = (fs*1.32) + 'pt'; el.querySelector('.bx').style.marginTop = (fs*1.32/2 - 2) + 'pt'; });
    // every size is tried; the one whose bullets keep the fullest wording (then the larger type) wins, all six on full last lines inside the box
    for(let fs = top; fs >= base; fs -= .25) for(const maxL of (big ? [3, 2] : [3, 2])){
      apply(fs); pick(maxL); if(over() || bad().length) continue;
      const len = hbs.reduce((n, el) => n + el.querySelector('.tx').textContent.length, 0), sc = fs*1000 + len;
      if(!bestCfg || sc > bestCfg.sc) bestCfg = {fs, maxL, sc}; }
    if(bestCfg){ apply(bestCfg.fs); pick(bestCfg.maxL); } else { apply(base); pick(3); }
    { const bxel = grid.parentElement; if(over() || bxel.scrollHeight > bxel.clientHeight + .5) issues.push({slot: 'back.steps', kind: 'steps-overflow', detail: 'the six bullets and the call line do not fit their box'}); }
    hbs.forEach(el => { const tx = el.querySelector('.tx'), L = SW.lines(tx); delete el.dataset.slot;
      if(L.n > 1 && L.fill < .75) issues.push({slot: 'back.step' + el.dataset.help, kind: 'last-line-short', detail: `last line is ${Math.round(L.fill*100)}% full (75% minimum): "${tx.textContent.slice(-24)}"`}); });
  }
  function mailCheck(){ const out = [], Z = window.__zones, pt = v => v*72/96, sh = document.querySelector('.sheet').getBoundingClientRect();
    const hit = (r, z) => pt(r.left - sh.left) < z[0] + z[2] - .5 && pt(r.right - sh.left) > z[0] + .5 && pt(r.top - sh.top) < z[1] + z[3] - .5 && pt(r.bottom - sh.top) > z[1] + .5;
    document.querySelectorAll('.sheet .ph, .sheet .pc-wbox, .sheet .cap, .sheet .cc, .sheet .pc-ret, .sheet .pc-bstatus, .sheet .pc-disc').forEach(el => {
      const r = el.getBoundingClientRect(); for(const k in Z) if(hit(r, Z[k])) out.push({slot: el.dataset.slot || el.className, kind: 'in-mail-zone', zone: k}); });
    return out; }
})();
