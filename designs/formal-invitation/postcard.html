<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · Formal Invitation postcards</title>
<link rel="stylesheet" href="fi.css">
<link rel="stylesheet" href="fi-fo.css">
<script src="fi.js"></script>
<script src="../engine/baths.js"></script>
<script src="../engine/agentcard.js"></script>
<script src="../engine/factrepeat.js"></script>
<script>window.Ivory = window.Ivory || {esc: s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))};</script>
<script src="fi-fo.js"></script>
<!--
  BrochureDesk · Formal Invitation · Just Listed and Just Sold postcards (the hand of the approved Open House library flyer B01).
  data.piece.card = "listed" | "sold", data.piece.size = "6x11" (trim 792 x 432 pt) | "6x9" (648 x 432 pt), data.piece.side = "front" | "back".
  Print adds 0.125 in (9 pt) bleed. The agent's brand color (brand.accent) is the field on both sides; boxes are white.
  Front: the whole house (roof to steps) on the right with a one-line-or-two caption and a white box under it, the status stacked large on the left over the address,
  the fact rows and the brokerage logo (Just Listed) or the agent's name and number and the logo (Just Sold). No price, no QR.
  Back: status line, interior photos with captions, a white box (the write-up, or the steps), the standard contact card (templates/_shared/agentcard.js,
  band preset, which carries the back's one logo), the fine print. The right 289.5 pt (4.02 in) is the mail vendor's: return address, postage and address
  zones; drawn as guides on proofs and left clear in print.
  Copy comes from data.sw.pc.{jl|js}.{front|back} as a lead plus whole sentences; fi.js picks the sentences that fill each box.
-->
<style>
  /* B03's hand on a card (tokens in fi-tokens.css): the paper, main-color blocks edged by accent strips, EB Garamond capitals, the double hairline */
  .pc-col{position:absolute;display:flex;flex-direction:column}
  .pc-hl{position:absolute;display:flex;align-items:center;gap:10pt;font-family:var(--fi-cap);font-weight:500;color:var(--fi-on);white-space:nowrap;overflow:hidden}
  .pc-hl:before{content:"";width:4pt;height:4pt;transform:rotate(45deg);background:var(--fi-strip);flex:none}
  /* the back's card: the invitation card itself (white, the hairline set inside its edge), type in the main color */
  .pc-wbox{background:var(--fi-card);color:var(--fi-ink);padding:10pt 18pt 9pt;display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box;--fx-on:var(--fi-ink);--fx-soft:#262b34}
  .pc-wbox{box-shadow:0 0 0 .6pt var(--fi-rule)}
  .pc-wbox:after{content:"";position:absolute;inset:5pt;border:.75pt solid var(--fi-strip);pointer-events:none}
  .pc-wbox .k{font:600 8.8pt/11pt var(--fi-sans);letter-spacing:3.2pt;text-transform:uppercase;color:var(--fi-accp);white-space:nowrap;overflow:hidden;margin-bottom:3pt;align-self:center}
  .pc-about{position:absolute;font-family:var(--fi-cap);font-weight:500;color:#262b34;text-align:center;overflow:hidden}
  .pc-bstatus{position:absolute;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
  .pc-bstatus .st{font:600 10.5pt/1 var(--fi-cap);letter-spacing:3pt;color:var(--fi-ink);text-transform:uppercase}
  .pc-bstatus .ln{flex:1;height:4pt;border-top:1pt solid var(--fi-strip);border-bottom:1pt solid var(--fi-strip);margin:0 0 0 14pt;min-width:16pt;box-sizing:border-box}
  .pc-steps .it{display:flex;gap:6pt;align-items:baseline;white-space:nowrap;overflow:hidden}
  .pc-steps .bx{width:19pt;flex:none;margin-top:0!important;font:600 8.6pt/1 var(--fi-sans);letter-spacing:1pt;color:var(--fi-accp);text-align:right;padding-right:4pt}   /* the sign-in sheet's Roman numerals count the steps */
  .pc-steps .stp{font-family:var(--fi-cap);font-weight:500;color:#262b34}
  .pc-call{font:500 13pt/16pt var(--fi-cap);color:var(--fi-ink);white-space:nowrap;overflow:hidden;align-self:center}
  .pc-disc{position:absolute;font-size:6pt;line-height:10pt;color:var(--fx-soft);overflow:hidden;white-space:nowrap}
  .pc-ret{position:absolute;font:500 9pt/11pt var(--fi-sans);letter-spacing:.2pt;color:var(--fi-ink);overflow:hidden;height:34pt}
  .pc-ret b{font-weight:700;letter-spacing:1.4pt;text-transform:uppercase;color:var(--fi-ink)}
  .cap .a{font-weight:500}
  /* the back's compact contact row (owner 11/16): on the navy foot band, email and web side by side, the logo beside the office lines */
  .pc-back .cc .cc-lines{display:flex;column-gap:12pt}
  .pc-back .cc .cc-panel{flex-direction:row;align-items:center;column-gap:10pt}
  .pc-back .cc .cc-panel > div:last-child{text-align:left}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const esc = SW.esc, b = D.brand || {}, A = D.agent || {}, L = D.listing, P = D.piece || {};
  document.body.dataset.mode = D.mode || 'email';
  await SW.setup(D);
  const sold = P.card === 'sold', big = P.size === '6x11', front = P.side === 'front';
  const W = big ? 792 : 648, H = 432;
  const K = ((D.sw || {}).pc || {})[sold ? 'js' : 'jl'] || {};
  const hsSrc = A.headshot && ((D.photos||{})[A.headshot] ? D.photos[A.headshot].src : A.headshot) || '';
  const statusWord = sold ? 'Just Sold' : 'Just Listed';
  const issues = [];
  const logo = (cls, src, area, maxh, style) => `<div class="logo ${cls}" data-area="${area}" data-maxh="${maxh}" style="${style||''}">${src ? `<img src="${esc(src)}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage||'')}</span>`}</div>`;
  const CL = big ? 13.5 : 12.5, CF = big ? 'font-size:11.5pt;line-height:13.5pt;' : 'font-size:10.5pt;line-height:12.5pt;';   // EB Garamond sets a size up from a sans   // the 6x11 sets its type up from the 6x9 (11 pt against 9.5), not the same size with more room
  const cap = (c, slot, lines, extra, min) => (c = (c.photo ? FXS.augment(D, c) : c), `<div class="cap" style="height:${5 + lines*CL}pt;${extra||''}"><div class="a" data-min="${min || 2}" data-slot="${slot}" data-narrow="0" data-nstep="6" data-lh="${CL}" data-lines="${lines}" data-lead="${esc(c.lead||'')}" data-s='${esc(JSON.stringify([].concat(c.s||[]))).replace(/'/g,'&#39;')}' style="height:${lines*CL}pt;${CF}"></div></div>`);
  let h = '';

  if(front){
    // The FX14 hand on a postcard front. A white frame top and side, the whole house in it, a taupe block around it with the status in Pinyon Script.
    // JL: "Just Listed" in script beside the house, the horizontal address, three facts; under the house the caption ("Front.", the draws) and the agent and logo along the foot.
    // JS: sells the agent: "Just Sold" in the same script lockup, the name and phone big on the left, the house on the right with the agent's own note, the logo.
    const F = K.front || {};
    const draws = list => { const w = x => /gated|roof|pergola|deck|park|garage|island|stone|corner|pool/i.test([].concat(x)[0]) ? 0 : 1; return (list || []).map((x, i) => [w(x), i, x]).sort((p, q) => p[0] - q[0] || p[1] - q[1]).map(t => t[2]); };
    const capC = sold ? {lead: '', s: (F.note || {}).s || (F.cap || {}).s} : (F.caption ? {lead: F.caption.lead, s: F.caption.s.concat(draws((F.about || {}).s || []))} : {lead: 'Front.', s: draws((F.about || {}).s || (F.cap || {}).s)});
    const norm = x => String(x).toLowerCase().replace(/[^a-z0-9 ]/g, '').slice(0, 40), allAlts = list => [].concat(...(list || []).map(x => [].concat(x)));
    const backSet = new Set([].concat(allAlts(((K.back || {}).about || {}).s), ...((K.back || {}).photos || []).map(c => allAlts(c.s)), allAlts((K.back || {}).steps6), allAlts((K.back || {}).steps)).map(norm));
    const backAll = allAlts(((K.back || {}).about || {}).s).map(String);   // the back's About box
    if(capC.s){ const kept = capC.s.filter(x => ![].concat(x).some(a => backSet.has(norm(a)))); if(kept.length >= 2) capC.s = kept; }
    // the caption's own first sentence stays; a later one that says a fact the back's About box says (the deck and pergola, in other words) drops out
    if(capC.s && capC.s.length > 2){ const tail = capC.s.slice(1).filter(x => ![].concat(x).some(a => backAll.some(b => SW.sameFact(String(a), b)))); if(tail.length >= 1) capC.s = [capC.s[0]].concat(tail); }
    const roomIds = [...new Set([].concat(((D.sw||{}).back||{}).photos||[], ((D.sw||{}).left||{}).photos||[]).map(c => c.photo))].filter(id => (D.photos||{})[id] && !(D.photos[id]||{}).fullHouse && id !== F.cap.photo).slice(0, 2);
    // ---- Formal Invitation front: B03's invitation block on a card. The whole house edge to edge on one side; on the other a main-color
    // panel edged by the accent strip where it meets the photo. Just Listed: the place, JUST / LISTED stacked as the one display moment
    // in EB Garamond capitals, the double hairline, the street, the facts, three specific highlights left-aligned, the agent and the logo.
    // Just Sold: JUST SOLD (about twice the agent's name), the street right under it, the seller question, the agent's note sized to its
    // text, who to call, the logo. A wide house that needs more than 60% of the card goes across the top and the panel becomes the band under it. ----
    const k = big ? 1.12 : 1, pid = F.cap.photo;
    const hp = (D.photos || {})[pid] || {}, sideFits = pw => !(hp.box && hp.w && hp.h) || FO.tightOf(hp, pw + 9, H + 18, 3, 13, pw - 3, H + 3, 1).ok;   // the whole house inside the trim, not only inside the bleed
    let PW = big ? 430 : 340; while(PW < W*(big ? 0.66 : 0.62) && !sideFits(PW)) PW += 6;
    const stacked = !sold && !sideFits(PW); let SH = big ? 222 : 214; while(stacked && SH < H*0.74 && !SW.fits(D, pid, W + 18, SH + 9)) SH += 4;
    const word = sold ? 'Just Sold' : 'Just Listed', place = [FXS.hood(L), FXS.placeLine(L)].filter(Boolean).join('  ·  ').toUpperCase(), ad = String(L.address || '');
    // highlights: few and specific, a dated improvement first (lesson 6)
    const hlAll = FXS.tagFacts(D).tags.filter((t, i, arr) => !arr.slice(0, i).some(u => SW.sameFact(t, u))), rk = t => /\b(19|20)\d\d\b/.test(t) ? 0 : /\bnew\b|replaced|reworked|updated|remodel|renovat/i.test(t) ? 1 : 2, hl = hlAll.map((t, i) => [rk(t), i, t]).sort((p, q) => p[0] - q[0] || p[1] - q[1]).map(x => x[2]);
    let o = '';
    if(sold){
      // ---- Just Sold (design pass 11/15): not the Just Listed card turned around. A navy strip runs along the foot of the whole card
      // with the seller question, the agent's note, the agent and the one logo; above it the house, whole, and beside it the status
      // on the white invitation card with its inset hairline: JUST SOLD (three times the agent's name), the double hairline, the
      // street in gold. No house features anywhere. ----
      const SY = big ? 334 : 338, CWp = big ? 248 : 216, cxm = CWp/2, IWd = CWp - 52;
      h += FO.withTight(`<div class="abs" style="left:${CWp}pt;top:-9pt;width:${W + 9 - CWp}pt;height:${SY - 5 + 9}pt">${SW.photo(D, pid, 'position:absolute;inset:0', 'front.hero')}</div>`, FO.tightAttr(10, 13, W - CWp - 12, SY - 5 + 9 - 6, 1.3, 'b'));
      h += `<div class="fi-card" style="left:-9pt;top:-9pt;width:${CWp + 9}pt;height:${SY - 5 + 9}pt"></div><div class="abs" style="left:13pt;top:13pt;width:${CWp - 26}pt;height:${SY - 5 - 26}pt;border:.75pt solid var(--fi-strip);box-sizing:border-box"></div><style>.sheet > .fi-card:after{display:none}</style>`;
      const ls = Math.min(FXS.fitSize('JUST', "font-family:'EB Garamond';font-weight:600;letter-spacing:4pt", IWd - 6, 58*k, 34), 58*k), lh = ls*1.0, as = FXS.fitSize(ad, "font-family:'EB Garamond';font-weight:500", IWd, 21*k, 13), hood = String(FXS.hood(L) || '').toUpperCase();
      const GH = 12 + 12 + 2*lh + 10 + 4 + 12 + as*1.25, y0 = (SY - 5 - GH)/2 + 2;
      let c = `<div class="abs fi-eyebrow" style="left:26pt;top:${y0}pt;width:${IWd}pt;text-align:center;font-size:${8.8*k}pt;letter-spacing:3pt;color:var(--fi-accp)" data-slot="front.place" data-lines="1">${esc(hood)}</div>`;
      c += `<div class="abs fi-label" style="left:${26 + 2}pt;top:${y0 + 24}pt;width:${IWd}pt;height:${2*lh}pt;font-size:${ls}pt;line-height:${lh}pt;letter-spacing:4pt;text-align:center;white-space:normal;overflow:visible" data-slot="front.status" data-lines="2">Just<br>Sold</div>`;
      c += `<div class="fi-dbl" style="left:${cxm - 44}pt;top:${y0 + 24 + 2*lh + 10}pt;width:88pt;border-color:var(--fi-strip)"></div>`;
      c += `<div class="abs fi-serif" style="left:26pt;top:${y0 + 24 + 2*lh + 26}pt;width:${IWd}pt;height:${as*1.25}pt;font-size:${as}pt;line-height:${as*1.25}pt;text-align:center;color:var(--fi-accp)" data-slot="front.address" data-lines="1">${esc(ad)}</div>`;
      h += `<div class="fi-ink">${c}</div>`;
      h += FI.band(-9, W + 9, SY, H + 9 - SY, {bottom: false});
      // the strip: the question and the note on the left, a hairline, the agent and the logo on the right
      const TX0 = 30, nf = big ? 11.7 : 10.75, NW = 334*nf/10.75, RX = TX0 + NW + 22, RW = W - 30 - RX, cq = 'Thinking about selling?', cs2 = 18.5*k, lh2 = nf*1.3;   // the note's measure grows with its type, so both sizes break their lines alike
      o += `<div class="abs fi-serif" style="left:${TX0}pt;top:${SY + 8}pt;width:${NW}pt;height:${cs2*1.25}pt;font-size:${cs2}pt;line-height:${cs2*1.25}pt;color:var(--fi-on)" data-slot="front.cta" data-lines="1">${cq}</div>`;
      o += `<div class="abs cap"><div class="a" style="position:absolute;left:${TX0}pt;top:${SY + 8 + cs2*1.25 + 2}pt;width:${NW}pt;height:${3*lh2}pt;font-size:${nf}pt;line-height:${lh2}pt;color:var(--fi-soft)" data-slot="front.note" data-lh="${lh2}" data-lines="3" data-min="3" data-narrow="0" ${FXS.sd(capC.s || [])}></div></div>`;
      o += `<div class="abs" style="left:${RX - 11}pt;top:${SY + 14}pt;width:1pt;height:${H - SY - 30}pt;background:var(--fi-rule-on)"></div>`;
      const ns = Math.min(ls/3, 18*k), my = SY + (H - SY)/2;
      o += `<div class="abs" style="left:${RX + 4}pt;top:${my - (ns*1.2 + 15*k)/2 - 1}pt;width:${RW*0.56}pt"><div style="font:500 ${ns}pt/${ns*1.2}pt var(--fi-cap);color:var(--fi-on);white-space:nowrap" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</div><div style="font:600 ${10.5*k}pt/${15*k}pt var(--fi-sans);letter-spacing:.8pt;color:var(--fi-acc);white-space:nowrap" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</div></div>`;
      o += FXS.logo(D, RX + RW*0.56, my - 20, RW*0.44, 40, 'flex-end');
      h += `<div class="fi-on">${o}</div>`;
    } else if(!stacked){
      const PX = sold ? -9 : W - PW, SX = sold ? PW : W - PW - 5;   // the photo, and the accent strip between it and the panel
      h += FO.withTight(`<div class="abs" style="left:${PX}pt;top:-9pt;width:${PW + 9}pt;height:${H + 18}pt">${SW.photo(D, pid, 'position:absolute;inset:0', 'front.hero')}</div>`, FO.tightAttr(3, 13, PW - 3, H + 9 - 6, 1.3, 'b'));
      h += `<div class="fi-band" style="left:${sold ? PW + 5 : -9}pt;top:-9pt;width:${sold ? W + 9 - PW - 5 : W - PW + 4}pt;height:${H + 18}pt"></div><div class="fi-strip" style="left:${SX}pt;top:-9pt;width:5pt;height:${H + 18}pt"></div>`;
      const TX0 = sold ? PW + 5 + 26 : 30, TX1 = sold ? W - 30 : W - PW - 5 - 26, TW = TX1 - TX0, footY = H - 62;
      let y = 0;
      o += `<div class="abs fi-eyebrow" style="left:${TX0}pt;top:${y}pt;width:${TW}pt;font-size:${FXS.fitSize(place, "font-family:'Josefin Sans';font-weight:600;letter-spacing:3pt", TW, 8.8*k, 8.5)}pt;letter-spacing:3pt;color:var(--fi-acc)" data-slot="front.place" data-lines="1">${esc(place)}</div>`; y += 18;
      if(!sold){
        const ls = Math.min(FXS.fitSize('LISTED', "font-family:'EB Garamond';font-weight:600;letter-spacing:3pt", TW, 66*k, 34), 66*k), lh = ls*0.98;
        o += `<div class="abs fi-label" style="left:${TX0 - ls*0.04}pt;top:${y}pt;width:${TW + ls*0.04}pt;height:${2*lh}pt;font-size:${ls}pt;line-height:${lh}pt;letter-spacing:3pt;color:var(--fi-on);white-space:normal" data-slot="front.status" data-lines="2">Just<br>Listed</div>`; y += 2*lh + 8;
        o += `<div class="fi-dbl" style="left:${TX0}pt;top:${y}pt;width:96pt;border-color:var(--fi-acc)"></div>`; y += 14;
        const as = FXS.fitSize(ad, "font-family:'EB Garamond';font-weight:500", TW, 25*k, 15);
        o += `<div class="abs fi-serif" style="left:${TX0}pt;top:${y}pt;width:${TW}pt;height:${as*1.2}pt;font-size:${as}pt;line-height:${as*1.2}pt;color:var(--fi-on)" data-slot="front.address" data-lines="1">${esc(ad)}</div>`; y += as*1.2 + 2;
        const fx = FXS.statItems(L).filter(t => !/^Built/.test(t)).join('  ·  ').toUpperCase(), fs = FXS.fitSize(fx, "font-family:'Josefin Sans';font-weight:600;letter-spacing:1.4pt", TW, 9*k, 8.5);
        o += `<div class="abs fi-caps" style="left:${TX0}pt;top:${y}pt;width:${TW}pt;height:14pt;font-size:${fs}pt;line-height:14pt;letter-spacing:1.4pt;color:var(--fi-acc)" data-slot="front.facts" data-lines="1">${esc(fx)}</div>`; y += 24;
        const hs = 12.5*k, tg = hl.filter(t => FXS.width(t, `font-family:'EB Garamond';font-weight:500;font-size:${hs}pt`) <= TW - 16), nT = Math.max(2, Math.min(3, tg.length, Math.floor((footY - 14 - y)/(18*k)))), rh = Math.max(18*k, Math.min(27*k, (footY - 34 - y)/nT));
        tg.slice(0, nT).forEach((t, i) => { o += `<div class="abs pc-hl" style="left:${TX0}pt;top:${y + i*rh}pt;width:${TW}pt;height:${rh}pt;font-size:${hs}pt;line-height:${rh}pt" data-slot="front.hl.${i}" data-lines="1">${esc(t)}</div>`; }); y += nT*rh;
      } else {
        const ls = jsSize(), lh = ls*0.98;   // JUST / SOLD stacked, the card's one display moment (about 2.5x the agent's name)
        o += `<div class="abs fi-label" style="left:${TX0 - ls*0.04}pt;top:${y}pt;width:${TW + ls*0.04}pt;height:${2*lh}pt;font-size:${ls}pt;line-height:${lh}pt;letter-spacing:3pt;color:var(--fi-on);white-space:normal" data-slot="front.status" data-lines="2">Just<br>Sold</div>`; y += 2*lh + 4;
        const as = FXS.fitSize(ad, "font-family:'EB Garamond';font-weight:500", TW, 22*k, 14);
        o += `<div class="abs fi-serif" style="left:${TX0}pt;top:${y}pt;width:${TW}pt;height:${as*1.2}pt;font-size:${as}pt;line-height:${as*1.2}pt;color:var(--fi-acc)" data-slot="front.address" data-lines="1">${esc(ad)}</div>`; y += as*1.2 + 8;
        o += `<div class="fi-dbl" style="left:${TX0}pt;top:${y}pt;width:96pt;border-color:var(--fi-acc)"></div>`; y += 14;
        const cq = 'Thinking about selling?', cs2 = FXS.fitSize(cq, "font-family:'EB Garamond';font-weight:500", TW, 21*k, 14);
        o += `<div class="abs fi-serif" style="left:${TX0}pt;top:${y}pt;width:${TW}pt;height:${cs2*1.25}pt;font-size:${cs2}pt;line-height:${cs2*1.25}pt;color:var(--fi-on)" data-slot="front.cta" data-lines="1">${cq}</div>`; y += cs2*1.25 + 6;
        const lh2 = 14.5*k, room = footY - 18 - y, n = Math.max(3, Math.min(5, Math.floor(room/lh2)));
        o += `<div class="abs cap"><div class="a" style="position:absolute;left:${TX0}pt;top:${y}pt;width:${TW}pt;height:${n*lh2}pt;font-size:${11.5*k}pt;line-height:${lh2}pt" data-slot="front.note" data-lh="${lh2}" data-lines="${n}" data-min="3" data-narrow="0" data-flexh="1" ${FXS.sd(capC.s || [])}></div></div>`; y += n*lh2;
      }
      // the lockup is centered top to bottom in the room above the foot (no empty band); the foot: a hairline, the agent and the one logo
      const off = Math.max(26, (footY - 12 - y)/2);
      h += `<div class="fi-on"><div class="abs" style="left:0;top:${off}pt;width:0;height:0" data-lockup="1">${o}</div>`;
      h += `<div class="abs" style="left:${TX0}pt;top:${footY - 6}pt;width:${TW}pt;height:1pt;background:var(--fi-rule-on)"></div>`;
      const ns = sold ? Math.min(jsSize()*0.42, 21*k) : 16*k;
      h += `<div class="abs" style="left:${TX0}pt;top:${footY + 4}pt;width:${TW*0.56}pt"><div style="font:500 ${ns}pt/${ns*1.2}pt var(--fi-cap);color:var(--fi-on);white-space:nowrap" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</div><div style="font:600 ${11*k}pt/${15*k}pt var(--fi-sans);letter-spacing:.8pt;color:var(--fi-acc);white-space:nowrap" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</div></div>`;
