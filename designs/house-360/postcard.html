<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · House in 360 postcard</title>
<link rel="stylesheet" href="house-360.css">
<script src="house-360.js"></script>
<script src="../engine/setpieces.js"></script>
<!--
  House in 360 · Just Listed and Just Sold postcards. data.piece: card "listed" | "sold", size "6x9" (trim 648 x 432 pt) |
  "6x11" (trim 792 x 432 pt), side "front" | "back". Print adds 0.125 in (9 pt) bleed (TrimBox set by the renderer).

  Front: the whole house (roof to steps) bleeds off the top and left, as on the fold-over cover. Beside it, the status in the
  serif over a thin rule, the address and city, state and ZIP, and one interior (Just Listed) or the agent's name and number
  (Just Sold). Under it, the facts row between thin rules and a write-up (Just Listed), or what the agent did for this
  sale and the invitation (Just Sold).
  Back (10/29 postcard rules, docs/context/product.md): the green field and a pale-green edge line run across the whole back.
  The return address and the status line across the top; captioned photos in one row (the fold-over's serif captions, same
  line count), one of them beside the address block under the return address; the white board under the postage box with a
  short line in the serif; a write-up (Just Listed) or two uncaptioned interiors, what the agent does for sellers and what the
  first meeting is like (Just Sold). Then the postcard contact card (templates/_shared/agentcard.js, postcard true) full
  width under the address block and above the barcode strip, carrying the back's one logo, and the two-line disclaimer
  beside the barcode strip. Mail zones: templates/_shared/setpieces.js SP.mail (the Just Listed library's).
  No price, no QR, no photo numbers, no "virtually staged". Copy: data.copy.pc.jl / data.copy.pc.js.
-->
<style>
  .cc{--cc-paper:#17403a;--cc-ink:#ffffff;--cc-muted:#d3e5dd;--cc-accent:#a9d6c5;--cc-line:rgba(255,255,255,.42)}
  .st{font:400 46pt/48pt var(--font-display);letter-spacing:-.8pt;color:var(--ink);white-space:nowrap;overflow:hidden}
  .ad{font:400 22pt/25pt var(--font-display);letter-spacing:-.2pt;color:var(--ink);overflow:hidden}
  .ab{font-size:10.5pt;line-height:15pt;color:var(--text)}
  .flist div{font:700 8.5pt/17pt var(--font-body);letter-spacing:1.3pt;text-transform:uppercase;color:var(--ink);white-space:nowrap;overflow:hidden;border-top:.7pt solid var(--line)}
  .flist div:last-child{border-bottom:.7pt solid var(--line)}
  .bst{display:flex;align-items:baseline;gap:10pt;white-space:nowrap;overflow:hidden}
  .bst .s{font:400 22pt/26pt var(--font-display);color:var(--ink)}
  .bst .a{font:700 8.5pt/10pt var(--font-body);letter-spacing:1.4pt;text-transform:uppercase;color:var(--accent)}
  .ret{font:400 8pt/10pt var(--font-body);color:var(--text);white-space:nowrap;overflow:hidden}
  .ret b{font-weight:700;letter-spacing:.8pt;text-transform:uppercase;color:var(--ink)}
  .ctx{font-size:9pt;line-height:11.5pt;color:var(--text)}
  .svc{display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
  .svc .it{display:flex;gap:6pt;align-items:baseline;font:400 9.5pt/12pt var(--font-body);color:var(--ink)}
  .svc .it i{width:4pt;height:4pt;background:var(--accent);flex:none;transform:translateY(-1.5pt)}
  .bigb{font:400 14pt/16pt var(--font-display);color:var(--board-ink);overflow:hidden}
  .subb{font:600 8.5pt/10.5pt var(--font-body);color:#2f6d5d;overflow:hidden;margin-top:4pt}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SP.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="color:#fff;padding:20pt">No data injected.</p>'; return; }
  const esc = SP.esc, L = D.listing, A = D.agent || {};
  const issues = await SP.ready(D);
  const sold = D.piece.card === 'sold', big = D.piece.size === '6x11', front = D.piece.side === 'front';
  const PCall = ((D.copy || {}).pc || {}), C = (sold ? PCall.js : PCall.jl) || {};
  document.body.dataset.mode = D.mode || 'email';
  const W = big ? 792 : 648, H = 432, M = 24, status = sold ? 'Just Sold' : 'Just Listed';
  let h = '';

  if(front){
    // ---------- front ----------
    const pw = big ? 500 : 410, ph = 310, cx = pw + 20, cw = W - M - cx;
    h += SP.photo(D, C.hero || 'front', -9, -9, pw + 9, ph + 9, 'front.hero');
    // owner 10/30: the 6x11 fronts get a bigger status and address (the 6x9 Just Sold front stays as approved)
    const sfs = big ? 54 : 48, slh = big ? 52 : 50, rt = big ? 142 : 140, afs = big ? 26 : 22, alh = afs + 3, pfs = big ? 11 : 8.5;
    h += `<div class="abs kick" style="left:${cx}pt;top:22pt;width:${cw}pt;height:10pt" data-slot="front.kick" data-lines="1">${esc(sold ? 'Recently sold' : 'New on the market')}</div>`;
    h += `<div class="abs st" style="left:${cx - 2}pt;top:34pt;width:${cw + 2}pt;height:${2*slh}pt;font-size:${sfs}pt;line-height:${slh}pt;white-space:normal" data-slot="status" data-lines="2">${esc(status.split(' ')[0])}<br>${esc(status.split(' ')[1])}</div>`;
    h += `<div class="rule" style="left:${cx}pt;top:${rt}pt;width:${cw}pt"></div>`;
    // the address, city, state and ZIP, then the facts (Just Listed) or the agent (Just Sold), bottom on the photo's foot
    const bot = ph - 9, ft = rt + 10 + alh + 6 + (big ? 14 : 10) + 9;   // the facts start under the address block
    const fl = SP.stats(L, {lot: true}), rowH = (bot - ft)/fl.length, ffs = Math.min(13, rowH*0.58);
    const tail = !sold
      ? `<div class="abs flist" style="left:0;top:${ft - rt - 10}pt;width:${cw}pt;height:${bot - ft}pt;display:flex;flex-direction:column">${fl.map((t, i) => `<div style="flex:1;display:flex;align-items:center;font-size:${ffs}pt;line-height:${ffs + 2}pt" data-slot="front.fact${i}" data-lines="1">${esc(t)}</div>`).join('')}</div>`
      : `<div><div style="font:400 ${big ? 28 : 19}pt/${big ? 32 : 22}pt var(--font-display);color:var(--ink);white-space:nowrap;overflow:hidden" data-slot="agent.name" data-lines="1" data-fit="14">${esc(A.name || '')}</div>
         <div style="font:700 ${big ? 20 : 14}pt/${big ? 25 : 18}pt var(--font-body);color:var(--accent);letter-spacing:.4pt;white-space:nowrap;overflow:hidden" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</div></div>`;
    h += `<div class="abs" style="left:${cx}pt;top:${rt + 10}pt;width:${cw}pt;height:${bot - rt - 10}pt;display:flex;flex-direction:column;justify-content:space-between">
      <div><div class="ad" style="font-size:${afs}pt;line-height:${alh}pt" data-slot="address" data-lines="2">${esc(L.address)}</div><div class="kick" style="margin-top:${big ? 6 : 5}pt;height:${big ? 14 : 10}pt;font-size:${pfs}pt;line-height:${big ? 14 : 10}pt" data-slot="place" data-lines="1">${esc(SP.placeZip(L).toUpperCase())}</div></div>${tail}</div>`;
    // long street names (owner 10/31): a street on two lines pushes the facts down, and the facts give up rows ("Built in"
    // first) so every row keeps its height
    if(!sold) SP.afterAddress(() => {
      const pl = document.querySelector('[data-slot="place"]'), fl = document.querySelector('.flist'); if(!pl || !fl) return;
      const px = 96/72, need = (pl.getBoundingClientRect().bottom + 9*px - fl.getBoundingClientRect().top)/px;
      if(need <= 0.5) return;
      const rowH = parseFloat(fl.style.height)/fl.children.length;
      fl.style.top = parseFloat(fl.style.top) + need + 'pt'; fl.style.height = parseFloat(fl.style.height) - need + 'pt';
      SP.trimRows(fl, () => parseFloat(fl.style.height)/[...fl.children].filter(r => r.style.display !== 'none').length >= rowH*0.9);
    });
    const nl = sold ? 3 : 4, lh = 18, fs = big ? 13 : 12.5;
    h += `<div class="rule" style="left:${M}pt;top:${ph + 6}pt;width:${W - 2*M}pt"></div>`;
    h += `<div class="abs ab" style="left:${M}pt;top:${ph + 14}pt;width:${W - 2*M}pt;height:${nl*lh}pt;font-size:${fs}pt;line-height:${lh}pt" data-slot="${sold ? 'front.sold' : 'front.about'}" data-para="1" data-min="${nl}" data-fillbox="1">${esc(big ? C.front11 : C.front9)}</div>`;
    if(sold) h += `<div class="abs" style="left:${M}pt;top:${ph + 14 + nl*lh + 8}pt;width:${W - 2*M}pt;height:24pt;font:400 20pt/24pt var(--font-display);color:var(--accent);white-space:nowrap;overflow:hidden" data-slot="sold.cta" data-lines="1">${esc(C.cta || 'Thinking about selling? Let’s talk.')}</div>`;
  } else {
    // ---------- back ----------
    const Z = SP.mail(W), X = M, LZ = Z.zA[0] - 12, rW = Z.zP[0] - 12 - Z.zA[0], pTop = 56;
    h += `<div class="abs" data-blk="1" style="left:-9pt;top:-9pt;width:${W + 18}pt;height:13pt;background:var(--accent)"></div>`;
    // the return address over the photo beside the address block; the status line across the left
    const ret = SP.returnLines(D);
    h += `<div class="abs ret" style="left:${Z.zA[0]}pt;top:16pt;width:${rW}pt;height:32pt;text-align:right" data-slot="return" data-lines="3"><b>${esc(ret[0] || '')}</b>${ret.slice(1).map(r => '<br>' + esc(r)).join('')}</div>`;
    h += `<div class="abs bst" style="left:${X}pt;top:16pt;width:${LZ - X}pt;height:28pt" data-slot="back.status" data-lines="1"><span class="s">${esc(status)}</span><span class="a">${esc(L.address)}</span></div>`;
    h += `<div class="rule" style="left:${X}pt;top:47pt;width:${LZ - X}pt"></div>`;
    const cap = (c, x, y, w, slot, row) => `<div class="abs cap" style="left:${x}pt;top:${y + 4}pt;width:${w}pt"><div class="nm sm" data-slot="${slot}.t" data-lines="1">${esc(c.t)}</div></div>
      <div class="abs ctx" style="left:${x}pt;top:${y + 21}pt;width:${w}pt" data-slot="${slot}" data-cap="1" data-row="${row}" data-para="1" data-min="3">${esc(c.a)}</div>`;
    let g = '';
    if(!sold){
      // one row of captioned photos: the left zone, and one beside the address block under the return address
      const bk = C.back || [], n = big ? 4 : 3, items = bk.slice(0, n), rItem = bk[4], gap = 10, ph = 72;
      const pw = (LZ - X - (n - 1)*gap)/n;
      items.forEach((c, i) => { const x = X + i*(pw + gap); g += SP.photo(D, c.id, x, pTop, pw, ph, 'back.photo' + i); h += cap(c, x, pTop + ph, pw, 'back.cap' + i, 'back'); });
      if(rItem){ g += SP.photo(D, rItem.id, Z.zA[0], pTop, rW, ph, 'back.photoR'); h += cap(rItem, Z.zA[0], pTop + ph, rW, 'back.capR', 'back'); }
      const ty = pTop + ph + 21 + 4*11.5 + 12;
      h += `<div class="abs ab" style="left:${X}pt;top:${ty}pt;width:${LZ - X}pt;height:${Math.floor((Z.cardY - 8 - ty)/15)*15}pt" data-slot="back.about" data-para="1" data-min="3" data-fillbox="1">${esc(big ? C.about11 : C.about9)}</div>`;
    } else {
      // two interiors, no captions; what the agent does for sellers beside them; what the first meeting is like under them
      const ids = C.photos || [], gap = 10, pw = (LZ - X - gap)/2, ph = 118;
      ids.slice(0, 2).forEach((id, i) => { g += SP.photo(D, id, X + i*(pw + gap), pTop, pw, ph, 'back.photo' + i); });
      h += `<div class="abs kick" style="left:${Z.zA[0]}pt;top:${pTop}pt;width:${rW}pt;height:10pt" data-slot="sold.servicesLabel" data-lines="1">${esc(C.servicesLabel || 'What I do for sellers')}</div>`;
      h += `<div class="abs svc" style="left:${Z.zA[0]}pt;top:${pTop + 16}pt;width:${rW}pt;height:${Z.zP[1] + Z.zP[3] + 66 - pTop - 16}pt">${(C.services || []).map((s, i) => `<div class="it"><i></i><span data-slot="sold.svc${i}" data-lines="3">${esc(s)}</span></div>`).join('')}</div>`;
      const my = pTop + ph + 12;
      h += `<div class="abs kick" style="left:${X}pt;top:${my}pt;width:${LZ - X}pt;height:10pt" data-slot="sold.meetLabel" data-lines="1">${esc(C.meetLabel || 'When we meet')}</div>`;
      h += `<div class="abs ab" style="left:${X}pt;top:${my + 15}pt;width:${LZ - X}pt;height:60pt" data-slot="sold.meet" data-para="1" data-min="3" data-fillbox="1">${esc(big ? C.meet11 : C.meet9)}</div>`;
      h += `<div class="abs" style="left:${X}pt;top:${my + 81}pt;width:${LZ - X}pt;height:22pt;font:400 17pt/22pt var(--font-display);color:var(--accent);white-space:nowrap;overflow:hidden" data-slot="sold.call" data-lines="1">${esc(C.call || 'Call or text me anytime.')}</div>`;
    }
    h += `<div class="abs" data-gapcheck="back.photos" style="left:0;top:0">${g}</div>`;
    // the white board under the postage box, bleeding off the right edge
    const sl = C.slab || {};
    h += `<div class="board" data-blk="1" style="left:${Z.zP[0]}pt;top:${Z.zP[1] + Z.zP[3] + 8}pt;width:${W - Z.zP[0] + 9}pt;height:${Z.zA[1] - Z.zP[1] - Z.zP[3] - 16}pt;padding:6pt 18pt 6pt 9pt;display:flex;flex-direction:column;justify-content:center"><div class="bigb" data-slot="slab.big" data-lines="3">${esc(sl.big || '')}</div></div>`;
    // the card: full width under the address block, above the barcode strip
    h += SP.postCard(D, Z, W);
    h += SP.fine(D, X, 396, Z.zB[0] - 12 - X, 'var(--text)');
    h += SP.mailGuides(D, Z);
  }

  await SP.finish(D, W, H, h, issues);
})();
</script>
</body>
</html>
