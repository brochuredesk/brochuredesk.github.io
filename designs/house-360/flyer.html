<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · House in 360 two-sided flyer</title>
<link rel="stylesheet" href="house-360.css">
<script src="house-360.js"></script>
<script src="../engine/setpieces.js"></script>
<script src="../engine/baths.js"></script>
<!--
  House in 360 · optional two-sided 8.5 x 11 listing flyer (trim 612 x 792 pt; print: 0.25 in white margin around the green
  field, content on the 36 pt column like the Open House flyer). data.piece.side = "front" | "back".
  Same family as the fold-over: the deep green field, the white serif address and titles, pale-green tracked kickers, thin
  light rules, serif room names over small sans text, the white board under the plan (or the floor-by-floor room list when
  the listing has no plan), and the standard contact card.

  FRONT  The whole house across the top, the place line, the address in the serif and a rule, then the write-up (two photo
         columns wide) beside the brokerage logo and the details grid (five ruled rows when the listing has a lot size,
         otherwise four that grow to fill the same height), both ending on the line the paragraph ends on. Three
         captioned rooms under them, then the agent card with the brokerage's office lines on the card's own lines.
  BACK   Header (address and place, the writer's headline, the one brokerage logo), a rule. A white board down the left:
         the listing's own floor plan placed as given (plan version), or the rooms floor by floor with sizes (no-plan
         version). Down the right: four captioned rooms in two rows and a paragraph that ends on the board's bottom line.

  Rules (product.md "Two-sided 8.5x11 flyer rules" 10/28 and the owner's Round 4 standing rules 11/1/2026): one brokerage logo per
  side; no listing price, no QR, no "virtually staged"; room sizes in feet only (18' x 12'), the plan image as given; the half
  bath's ½ at full size (BD.baths); text fills its space and lines up with the photo and rule edges; a row of captions runs
  the same number of lines; photos soak up the slack.

  Data:  companion.flyer = {
    headline, kicker?,
    desc: {head, text: [sentence, ...]},                 the write-up (the template keeps the sentences that fill the box)
    front: {hero: id, photos: [id x3]},
    photos: {id: {title, sentences: [..]}},              caption pools; the template picks the sentences that fill each box
    plan:   {kicker?, grid: [id x4], para: {label, text: [..]}, planNote?},
    noplan: {kicker?, grid: [id x4], para: {label, text: [..]}, floors: [{n, text: [..], rooms: [[name, size]]}]}}
  Anything missing is built from the fold-over's copy in data.copy.
-->
<style>
  .fgrid{position:absolute;display:flex;flex-direction:column;border-top:.7pt solid var(--line)}
  .fgrid > div{flex:1 1 0;display:flex;align-items:center;border-bottom:.7pt solid var(--line);font:700 9.5pt/1.2 var(--font-body);letter-spacing:1.3pt;text-transform:uppercase;color:var(--ink);white-space:nowrap;overflow:hidden}
  .fgrid.four > div{font-size:11pt}
  .addr2{font:400 34pt/40pt var(--font-display);letter-spacing:-.3pt;white-space:nowrap;overflow:hidden;color:var(--ink)}
  .cap.fl .nm{font-size:12.5pt}
  .cap.fl.sm .nm{font-size:11.5pt}
  .fl-fine{font:400 6pt/8pt var(--font-body);color:var(--muted);white-space:nowrap;overflow:hidden}
  .fl-head{font:400 27pt/32pt var(--font-display);letter-spacing:-.2pt;color:var(--ink);white-space:nowrap;overflow:hidden}
  .fl-board-note{position:absolute;font:400 7pt/9pt var(--font-body);color:#4c5f5a;overflow:hidden}
  .floorlist .sm{margin-top:3pt;font-size:9pt;line-height:12pt}
  .floorlist td{font-size:9pt;line-height:12pt}
  .cc-block{position:absolute;white-space:nowrap;color:var(--ink)}
  .cc-block .ol{position:absolute;left:0;white-space:nowrap}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SP.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="color:#fff;padding:20pt">No data injected.</p>'; return; }
  H3.fitMode = false;
  const esc = SP.esc, pt = SP.pt, L = D.listing, A = D.agent || {}, b = D.brand || {}, C = D.copy || {}, CP = D.companion || {}, FL = CP.flyer || {};
  const issues = await SP.ready(D);
  await H3.cardReady;
  document.body.dataset.mode = D.mode || 'email';
  const front = (D.piece || {}).side !== 'back';
  const hasPlan = !!(D.plan && D.plan.levels && D.plan.levels.length);
  const X = 36, W = 540, BOT = 650, CARD_Y = 664, CARD_H = 92, G = 12;
  const P = D.photos || {};
  const has = id => id && SP.src(D, id);

  // ---------- measuring (the page's own fonts) ----------
  const ms = document.createElement('div');
  ms.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;white-space:normal;overflow:visible;font-family:var(--font-body)';
  document.body.appendChild(ms);
  const mcache = {};
  const measure = (text, w, fs, lh, wt) => {
    const key = [text, w, fs, lh, wt].join('|'); if(mcache[key]) return mcache[key];
    ms.style.width = w + 'pt'; ms.style.fontSize = fs + 'pt'; ms.style.lineHeight = lh + 'pt'; ms.style.fontWeight = wt || 400; ms.textContent = text;
    const rg = document.createRange(); rg.selectNodeContents(ms);
    const rows = []; [...rg.getClientRects()].filter(r => r.width > .5).forEach(r => { const row = rows.find(x => Math.abs(x.top - r.top) < lh*.5); if(row) row.right = Math.max(row.right, r.right); else rows.push({top: r.top, right: r.right}); });
    const box = ms.getBoundingClientRect(), last = rows.length ? rows[rows.length-1] : null;
    return mcache[key] = {lines: rows.length, last: last && box.width ? Math.min(1, (last.right - box.left)/box.width) : 0};
  };
  // room sizes in feet only, inches dropped and never rounded: 18' x 12' (the owner, Round 4, 11/1/2026)
  const feetOnly = t => String(t).replace(/(\d+)(?:\.\d+)?(?:'\s?\d+(?:\.\d+)?"?)?'?\s*x\s*(\d+)(?:\.\d+)?(?:'\s?\d+(?:\.\d+)?"?)?'?/g, "$1' x $2'");
  const sentences = s => (Array.isArray(s) ? s : String(s || '').match(/[^.!?]+[.!?]+["”’)]*|[^.!?]+$/g) || []).map(x => feetOnly(x).trim()).filter(Boolean);
  const subsets = arr => { const n = Math.min(arr.length, 9), out = [];
    for(let m = 1; m < (1 << n); m++){ const pick = []; for(let i = 0; i < n; i++) if(m & (1 << i)) pick.push(arr[i]); out.push({m, pick}); }
    return out.sort((a, c) => (a.m & -a.m) - (c.m & -c.m) || c.pick.length - a.pick.length || a.m - c.m); };
  const FILLS = [.8, .745];   // the last line at least 4/5 full, else just over the checks' 73%
  const fitOne = (sents, f, n, fill) => { let best = null;
    for(const {pick} of subsets(sents)){ const t = pick.join(' '), r = measure(t, f.w, f.fs, f.lh, f.wt);
      if(r.lines === n && r.last >= fill) return {text: t, lines: n, last: r.last};
      if(r.lines === n && (!best || r.last > best.last)) best = {text: t, lines: n, last: r.last}; }
    return best; };
  const fillBox = (src, f, ns) => { const sents = sentences(src); if(!sents.length) return {text: '', lines: 0, last: 0, ok: false};
    let fall = null;
    for(const fill of FILLS) for(const n of ns){ const r = fitOne(sents, f, n, fill); if(r && r.last >= fill) return Object.assign(r, {ok: true}); if(r && (!fall || r.last > fall.last)) fall = r; }
    if(fall) return Object.assign(fall, {ok: false});
    const t = sents.join(' '), r = measure(t, f.w, f.fs, f.lh, f.wt); return {text: t, lines: r.lines, last: r.last, ok: false}; };
  const fillRow = (items, f, ns) => {
    const fw = Array.isArray(f) ? f : items.map(() => f), sn = items.map(sentences);
    for(const fill of FILLS) for(const n of ns){
      const rs = sn.map((s, i) => s.length ? fitOne(s, fw[i], n, fill) : null);
      if(rs.every(r => r && r.last >= fill)) return {rs, n, ok: true}; }
    let best = null;
    for(const n of ns){ const rs = sn.map((s, i) => s.length ? (fitOne(s, fw[i], n, 0) || fillBox(s, fw[i], [n])) : {text: '', lines: 0, last: 0});
      const bad = rs.filter(r => r.lines !== n || r.last < FILLS[1]).length; if(!best || bad < best.bad) best = {rs, n, bad}; }
    return {rs: best.rs, n: best.n, ok: false}; };

  // ---------- the fold-over's copy, by photo (the fallback) ----------
  const ALL = {};
  { const add = arr => (arr || []).forEach(it => { if(it && it.id && !ALL[it.id]) ALL[it.id] = it; });
    add((C.back || {}).photos); add((C.top || {}).leads); add((C.top || {}).smalls); add((C.bottom || {}).items); }
  const FP = FL.photos || {};
  const titleOf = id => (FP[id] && FP[id].title) || (ALL[id] && ALL[id].name) || '';
  const poolOf = id => (FP[id] && (FP[id].sentences || FP[id].body)) || (ALL[id] && ALL[id].text) || '';
  const fallbackIds = [...(((C.top || {}).leads) || []), ...(((C.top || {}).smalls) || []), ...(((C.bottom || {}).items) || []), ...(((C.back || {}).photos) || [])].map(i => i.id).filter(has);
  const used = new Set();
  const hero = (FL.front && FL.front.hero && has(FL.front.hero)) ? FL.front.hero : ((C.front || {}).photo || Object.keys(P)[0]);
  used.add(hero);
  const pick = (writer, n) => { const out = []; (writer || []).filter(has).forEach(i => { if(out.length < n && !used.has(i)){ used.add(i); out.push(i); } });
    for(const i of fallbackIds){ if(out.length >= n) break; if(!used.has(i)){ used.add(i); out.push(i); } } return out; };

  // ---------- small builders ----------
  const capHTML = (id, slot, x, y, w, r, small) =>
    `<div class="cap fl abs${small ? ' sm' : ''}" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${17 + r.lines*11}pt">
      <div class="nm" data-slot="${slot}.name" data-lines="1" data-fit="10">${esc(titleOf(id))}</div>
      <div class="tx" data-slot="${slot}.text" data-para="1" data-min="2" data-lines="${r.lines}" style="height:${r.lines*11}pt">${esc(r.text)}</div></div>`;
  const capTotal = n => 6 + 17 + n*11;
  const kick = (t, x, y, w, slot, extra) => `<div class="abs kick" style="left:${x}pt;top:${y}pt;width:${w}pt;height:10pt;${extra || ''}" data-slot="${slot}" data-lines="1">${esc(t)}</div>`;
  const rule = (x, y, w) => `<div class="rule" style="left:${x}pt;top:${y}pt;width:${w}pt"></div>`;
  const placeLine = ((C.front || {}).kicker) || [L.city, L.state, L.zip].filter(Boolean).join(', ');
  const fine = ((D.copy || {}).pc || {}).fineprint || FL.fineprint || 'Information deemed reliable but not guaranteed.';
  let h = '';
  const fitlog = [];

  // the agent card with the brokerage's own lines (no second logo) at its right, set on the card's name, REALTOR and phone lines
  const officeLines = (cardW, OW) => {
    const offL = [].concat(b.address || []).flatMap(a => String(a).split('\n')).map(x => x.trim()).filter(Boolean).slice(0, 2);
    const hs = SP.headshot(D);
    let s = ContactCardHTML(cardW, hs);
    s += `<div class="abs" style="left:${X + cardW}pt;top:${CARD_Y}pt;width:1pt;height:${CARD_H}pt;background:var(--line)"></div>`;
    s += `<div id="offblk" class="cc-block" style="left:${X + cardW + 14}pt;top:${CARD_Y}pt;width:${OW - 14}pt;height:${CARD_H}pt">`
      + (b.phone ? `<div class="ol" data-at="name" data-slot="broker.phone" data-lines="1" style="font:400 13pt/16pt var(--font-body)">${esc(b.officeLabel || 'Office')} <b style="font-weight:700">${esc(b.phone)}</b></div>` : '')
      + offL.map(t => `<div class="ol" data-at="desig" data-slot="broker.address" data-lines="1" style="font:400 9pt/11pt var(--font-body)">${esc(t)}</div>`).join('')
      + (b.web ? `<div class="ol" data-at="phone" data-slot="broker.web" data-lines="1" style="font:400 13pt/16pt var(--font-body)">${esc(b.web)}</div>` : '') + `</div>`;
    return s;
  };
  const ContactCardHTML = (cardW, hs) => ContactCard.html([X, CARD_Y, cardW, CARD_H], Object.assign({}, A, {headshot: hs}), b, {layout: 'panel', size: 'mid', brokerage: false, fieldAccent: true, bottomGap: 0.5, grow: 0});

  if(front){
    // ================= FRONT =================
    const trio = pick(FL.front && FL.front.photos, 3);
    const pvs = pick((FL.front && FL.front.previews) || (C.front || {}).previews, 3);   // the fold-over cover's three previews, stacked beside the whole house
    // details grid: beds, baths (the ½ at full size), square feet, year built, then the lot size when there is one
    const bt = BD.baths(L), rows = [];
    if(L.beds) rows.push(`${Number(L.beds).toLocaleString('en-US')} ${L.beds == 1 ? 'Bedroom' : 'Bedrooms'}`);
    if(L.baths || L.halfBaths){ rows.push(bt.main); if(bt.half) rows.push(bt.half); }
    if(L.sqft) rows.push(`${Number(L.sqft).toLocaleString('en-US')} Square Feet`);
    const yb = L.yearBuilt || L.year, lot = SP.lotText(L);
    if(yb) rows.push(`Built in ${yb}`); else if(L.stories) rows.push(L.stories == 1 ? 'One Story' : `${L.stories} Stories`);
    if(lot) rows.push(lot);
    // hero: as tall as the whole house needs, soaking up what is left
    const hp = P[hero] || {w: 3, h: 2}, asp = hp.w / hp.h, bx = hp.box;
    const need = bx ? Math.min(1, (bx[3] - bx[1]) + 0.012) : (SP.fullHouse(D, hero) ? 0.8 : 0.6);
    const colW = 2*172 + G, rx = X + colW + G, rw = 172;
    const Hneed = Math.round(Math.max(190, colW*need/asp + 2));
    const descSrc = (FL.desc && FL.desc.text) || FL.desc || ((C.front || {}).intro || '');
    const DF = {w: colW, fs: 10, lh: 14, wt: 400};
    const CF = trio.map(() => ({w: 172, fs: 8.5, lh: 11, wt: 400}));
    // every (write-up lines, caption lines) pair that leaves the photos at least 68 pt: take the one with the most text
    let layout = null, bestL = null, bestScore = -1;
    for(const dn of [8, 7, 6, 5, 4]){
      const d1 = fillBox(descSrc, DF, [dn]), th = d1.lines*14;
      for(const n of [5, 4, 3, 2]){
        const fr = fillRow(trio.map(poolOf), CF, [n]), ch = capTotal(n);
        const fixedTop = 14 + 84 + th + 14;                      // gap, place line to write-up, text, gap
        const Hp0 = 116, Hh0 = BOT - ch - Hp0 - 36 - fixedTop;
        const Hh = Math.min(280, Hh0); let Hp = BOT - ch - (36 + Hh + fixedTop);
        if(Hp > 150) Hp = 150;
        if(Hh < Hneed || Hp < 100) continue;
        const L1 = {n, cr: fr.rs, Hp, Hh, d1, th}, score = d1.lines + 3*n;
        // a fallback keeps the caption row even if it can (owner 10/29: side-by-side captions run the same number of lines)
        const even = new Set(fr.rs.filter(r => r && r.lines).map(r => r.lines)).size <= 1;
        if(fr.ok && d1.ok){ if(score > bestScore){ bestScore = score; layout = L1; } }
        else if(!bestL || (even && !bestL.even)) bestL = Object.assign(L1, {even});
      }
    }
    if(!layout) layout = bestL || (() => { const d1 = fillBox(descSrc, DF, [5]), n = 2; return {n, cr: fillRow(trio.map(poolOf), CF, [n]).rs, Hp: 64, Hh: Hneed, d1, th: d1.lines*14}; })();
    fitlog.push(['front', layout === bestL ? 'best' : 'ok', layout.n, layout.d1.lines]);
    const {cr, Hp, Hh, d1, th} = layout;
    const y1 = 36 + Hh + 14, S = y1 + 84 + th, py = S + 14;
    h += SP.photo(D, hero, X, 36, colW, Hh, 'front.hero');
    { const ph = (Hh - 2*G)/3; pvs.forEach((id, i) => { h += SP.photo(D, id, rx, 36 + i*(ph + G), rw, ph, `front.preview${i}`); }); }
    h += kick(placeLine.toUpperCase(), X, y1, colW, 'front.place');
    h += `<div class="abs addr2" id="addr" style="left:${X - 1}pt;top:${y1 + 12}pt;width:${colW}pt;height:40pt" data-slot="address" data-lines="1" data-fit="22">${esc(L.address)}</div>`;
    h += rule(X, y1 + 58, colW);
    h += kick(((FL.desc && FL.desc.head) || (C.front || {}).introHead || 'About the house').toUpperCase(), X, y1 + 70, colW, 'front.aboutHead');
    h += `<div class="abs body" style="left:${X}pt;top:${y1 + 84}pt;width:${colW}pt;height:${th}pt" data-slot="front.about" data-para="1" data-min="4" data-fillbox="1" data-lines="${d1.lines}">${esc(d1.text)}</div>`;
    h += H3.logo(D, rx, y1, rw, 38, 'flex-end');
    h += `<div class="fgrid${rows.length <= 4 ? ' four' : ''}" style="left:${rx}pt;top:${y1 + 48}pt;width:${rw}pt;height:${S - (y1 + 48)}pt">${rows.map((t, i) => `<div data-slot="front.facts${i}" data-lines="1"><span>${t}</span></div>`).join('')}</div>`;
    h += trio.map((id, i) => { const x = X + i*(172 + G);
      return SP.photo(D, id, x, py, 172, Hp, `front.photo${i}`) + capHTML(id, `front.cap${i}`, x, py + Hp + 6, 172, cr[i], false); }).join('');
    h += officeLines(W - 170, 170);
    h += `<div class="abs fl-fine" style="left:${X}pt;top:764pt;width:${W}pt;height:8pt" data-slot="fineprint" data-fine="1" data-lines="1">${esc(fine)}</div>`;
    document.body.dataset.layout = 'front';
    document.body.dataset.geom = JSON.stringify({Hh, Hp, th, rows: rows.length, capLines: layout.n, descLines: d1.lines});
  } else {
    // ================= BACK =================
    const BK = FL[hasPlan ? 'plan' : 'noplan'] || {};
    const place = SP.placeZip(L);
    const headline = FL.headline || (C.back || {}).title || 'The House, Room by Room';
    h += kick(`${L.address} · ${place}`.toUpperCase(), X, 36, 380, 'back.kicker');
    h += `<div class="abs fl-head" style="left:${X}pt;top:50pt;width:380pt;height:34pt" data-slot="back.title" data-lines="1" data-fit="20">${esc(headline)}</div>`;
    h += H3.logo(D, X + W - 150, 34, 150, 40, 'flex-end');
    h += rule(X, 90, W);
    const TOP = 102, bw = 232, rx = X + bw + G, rw = W - bw - G, gw = (rw - G)/2, avail = BOT - TOP;
    const grid = pick(BK.grid, 4);
    const para = BK.para || FL.para || {label: 'Around the house', text: ((C.back || {}).para || '')};
    const PF = {w: rw, fs: 10, lh: 14, wt: 400};
    // the right column: two rows of two captioned rooms, then a paragraph; the photos take what the text leaves
    const f142 = {w: gw, fs: 8.5, lh: 11, wt: 400};
    let best = null;
    search: for(const [nA, nB, pl] of [[5,5,5],[6,6,5],[5,5,6],[6,6,6],[5,5,4],[4,4,5],[6,6,4],[7,7,4],[4,4,4],[5,5,3],[6,6,3],[7,7,3],[4,4,6],[7,7,5]]){
      const rA = fillRow(grid.slice(0, 2).map(poolOf), f142, [nA]), rB = fillRow(grid.slice(2, 4).map(poolOf), f142, [nB]), pr = fillBox(para.text, PF, [pl]);
      const textH = 10 + 6 + pl*14, Hs = (avail - capTotal(nA) - capTotal(nB) - 12 - 14 - textH)/2;
      if(Hs < 104) continue;
      const cand = {nA, nB, pl, rA, rB, pr, Hs, textH, ok: rA.ok && rB.ok && pr.ok};
      if(cand.ok && Hs <= 152){ best = cand; break search; }
      if(!best || (cand.ok && !best.ok)) best = cand;
    }
    if(!best){ const rA = fillRow(grid.slice(0, 2).map(poolOf), f142, [5]), rB = fillRow(grid.slice(2, 4).map(poolOf), f142, [5]), pr = fillBox(para.text, PF, [4]); best = {nA: 5, nB: 5, pl: 4, rA, rB, pr, Hs: 100, textH: 10 + 6 + 56, ok: false}; }
    fitlog.push(['right', best.nA, best.nB, best.pl, best.ok]);
    const Hs = best.Hs;
    let y = TOP;
    [[0, best.rA, best.nA], [2, best.rB, best.nB]].forEach(([o, r, n], ri) => {
      grid.slice(o, o + 2).forEach((id, i) => { const x = rx + i*(gw + G);
        h += SP.photo(D, id, x, y, gw, Hs, `back.photo${o + i}`) + capHTML(id, `back.cap${o + i}`, x, y + Hs + 6, gw, r.rs[i], true); });
      y += Hs + capTotal(n) + 12;
    });
    // y now sits at the paragraph's label; re-anchor it so the paragraph ends on the board's bottom line
    const ty = BOT - best.textH;
    h += `<div data-gapcheck="back.photos" style="position:absolute;left:0;top:0"></div>`;
    h += kick((para.label || 'Around the house').toUpperCase(), rx, ty, rw, 'back.paraHead');
    h += `<div class="abs body" style="left:${rx}pt;top:${ty + 16}pt;width:${rw}pt;height:${best.pr.lines*14}pt" data-slot="back.para" data-para="1" data-min="3" data-fillbox="1" data-lines="${best.pr.lines}">${esc(best.pr.text)}</div>`;

    // the white board down the left
    h += `<div class="board" style="left:${X}pt;top:${TOP}pt;width:${bw}pt;height:${avail}pt"></div>`;
    if(hasPlan){
      const pl = H3.plan(D, {x: X + 12, y: TOP + 12, w: bw - 24, h: avail - 12 - 34, gap: 18});
      issues.push(...pl.issues); h += pl.html;
      h += `<div class="fl-board-note" style="left:${X + 12}pt;width:${bw - 24}pt;top:${TOP + avail - 28}pt;height:18pt" data-slot="back.planNote" data-fine="1" data-lines="2">${esc(BK.planNote || 'Approximate; not to scale. Buyer to verify room sizes.')}</div>`;
      document.body.dataset.layout = 'back-plan';
    } else {
      const fl = (BK.floors || (C.top || {}).floors || []).slice(0, 4), n = fl.length, bwI = bw - 24, TF = {w: bwI, fs: 9, lh: 12, wt: 400};
      const nrows = fl.reduce((a, f) => a + f.rooms.length, 0);
      const fixed = 1.2 + 5 + 16 + 3 + 3;                          // rule, pad, name, gaps above the text and the table
      const pools = fl.map(f => sentences(f.text));
      const rs = fl.map(() => null), ns = fl.map(() => 3);
      const feasible = (i, k) => { const r = fillBox(pools[i], TF, [k]); return r.ok ? r : null; };
      const total = pad => n*fixed + ns.reduce((a, k) => a + k*12, 0) + nrows*(12 + 2*pad);
      const room = avail - 24 - (n - 1)*8;
      fl.forEach((f, i) => { const k0 = [3, 2, 4, 5, 6].find(k => feasible(i, k)); if(k0) ns[i] = k0; });
      let grew = true;
      while(grew){ grew = false;
        for(let i = 0; i < n; i++){ if(total(1.5) + 12 > room) break; if(ns[i] < 9 && feasible(i, ns[i] + 1)){ ns[i]++; grew = true; } } }
      // what is left goes into the rows' spacing (never more than 5 pt a side), the rest between the floors
      const rowPad = Math.max(1.5, Math.min(5, 1.5 + (room - total(1.5))/(2*nrows)));
      fl.forEach((f, i) => { rs[i] = fillBox(pools[i], TF, [ns[i]]); });
      fitlog.push(['floors', ns.join(','), rs.map(r => r.ok).join(','), +rowPad.toFixed(2)]);
      h += `<div class="floorlist" style="left:${X + 12}pt;top:${TOP + 12}pt;width:${bwI}pt;height:${avail - 24}pt;display:flex;flex-direction:column;justify-content:space-between">${fl.map((f, i) => {
        const r = rs[i];
        return `<div class="f"><div class="fn" data-slot="back.floor${i}.name" data-lines="1">${esc(f.n)}${f.tag ? `<span>${esc(f.tag)}</span>` : ''}</div>
          <div class="sm" data-slot="back.floor${i}.text" data-para="1" data-min="2" data-lines="${r.lines}" style="height:${r.lines*12}pt">${esc(r.text)}</div>
          <table>${f.rooms.map(rm => `<tr><td data-slot="back.floor${i}.room" style="padding:${rowPad}pt 0">${esc(rm[0])}</td><td data-slot="back.floor${i}.size" style="padding:${rowPad}pt 0">${esc(feetOnly(rm[1]))}</td></tr>`).join('')}</table></div>`; }).join('')}</div>`;
      document.body.dataset.layout = 'back-photos';
    }
    h += officeLines(W - 170, 170);
    h += `<div class="abs fl-fine" style="left:${X}pt;top:764pt;width:${W}pt;height:8pt" data-slot="fineprint" data-fine="1" data-lines="1">${esc(fine)}</div>`;
    document.body.dataset.geom = JSON.stringify({Hs, capLines: [best.nA, best.nB], paraLines: best.pr.lines});
  }

  document.body.dataset.fitlog = JSON.stringify(fitlog);
  await SP.finish(D, 612, 792, h, issues, async () => {
    H3.fitLogos();
    document.querySelectorAll('.logo img').forEach(i => { i.dataset.optional = '1'; });
    // the office lines sit on the agent card's own lines: the office phone on the name's line, the address on the
    // REALTOR line, the website on the phone line
    const blk = document.getElementById('offblk'), cc = document.querySelector('.cc[data-contactcard]');
    if(blk && cc){ const k = 96/72, bb = blk.getBoundingClientRect(), rows = {name: '.cc-name', desig: '.cc-desig', phone: '.cc-phone'};
      blk.querySelectorAll('.ol').forEach(el => { const t = cc.querySelector(rows[el.dataset.at]); if(!t) return;
        const r = t.getBoundingClientRect(), mid = (r.top + r.bottom)/2 - bb.top;
        el.style.top = ((mid - el.offsetHeight/2)/k) + 'pt'; }); }
    // sizes in feet only: the plan's own room labels too
    document.querySelectorAll('.plan-room span').forEach(e => { e.textContent = feetOnly(e.textContent); });
  });
  // logos: one per side (the brand's logo, or its name set in type when it has none)
  const prev = window.brochureCheck;
  window.brochureCheck = () => { const out = prev();
    const k = [...document.querySelectorAll('.logo img, .logo [data-slot="broker.name"], .cc-logo img, .cc-brkname')].filter(e => e.offsetParent).length;
    if(k !== 1) out.push({slot: 'logo', kind: 'logo-count', found: k, want: 1});
    return out; };
})();
</script>
