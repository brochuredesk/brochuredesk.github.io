<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · The Split Edition postcard</title>
<link rel="stylesheet" href="split-edition.css">
<script src="../engine/baths.js"></script>
<script src="../engine/setpieces.js"></script>
<!--
  The Split Edition · Just Listed and Just Sold postcards. data.piece: card "listed" | "sold", size "6x9" (trim 648 x 432 pt) |
  "6x11" (trim 792 x 432 pt), side "front" | "back". Print adds 0.125 in (9 pt) bleed (TrimBox set by the renderer).

  Front: the fold-over cover's split. A white column on the left holds a burgundy kicker, the status in the serif over a
  thin rule, the address in the serif with city, state and ZIP, and the fold-over's 2 x 2 fact grid (serif values over
  burgundy small caps, hairline cross) on Just Listed, or the agent's name and number on Just Sold. The whole house fills the
  right side to the bleed, and a burgundy rule runs out under it to the trim, as it does between the cover's photos. Under
  the rule a write-up (Just Listed) or what the agent did for this sale and the invitation (Just Sold).
  Back: a burgundy band across the top edge carries the design over the mail side. The status line and a hairline across
  the left, the return address over the address block; Just Listed: captioned photos in one row with the fold-over's serif
  captions (same line count), one beside the address block, then a write-up; Just Sold: two interiors, "How I'd start" in
  burgundy-square steps (four on the 6x9, six on the 6x11), when we meet, the invitation and the agent's number. A rose
  block under a burgundy rule sits under the postage box with one line in the serif. The postcard contact card
  (templates/_shared/agentcard.js, postcard true) runs full width under the address block and above the barcode strip
  under a burgundy rule; it carries the back's one logo, and the two-line disclaimer sits beside the barcode strip.
  Mail zones: templates/_shared/setpieces.js SP.mail. No price, no QR, no photo numbers, no "virtually staged".
  Copy: data.copy.pc.jl / data.copy.pc.js.
-->
<style>
  .cc{--cc-paper:#ffffff;--cc-ink:#201c1d;--cc-muted:#76696c;--cc-accent:#8f2430;--cc-line:rgba(143,36,48,.38)}
  .st{font:400 46pt/48pt var(--font-display);letter-spacing:-.8pt;color:var(--ink);white-space:nowrap;overflow:hidden}
  .ad{font:400 21pt/25pt var(--font-display);letter-spacing:-.2pt;color:var(--ink);white-space:nowrap;overflow:hidden;font-variant-numeric:oldstyle-nums}
  .ab{font-size:13pt;line-height:18pt;color:var(--text)}
  .gcell{overflow:hidden;border-top:.7pt solid var(--line);padding-top:5pt}
  .gcell.r{border-left:.7pt solid var(--line);padding-left:11pt}
  .gv{font:400 24pt/27pt var(--font-display);color:var(--ink);white-space:nowrap;overflow:hidden;letter-spacing:-.2pt}
  .gl{font:700 8pt/10pt var(--font-body);letter-spacing:1.1pt;text-transform:uppercase;color:var(--accent);white-space:nowrap;overflow:hidden}
  .bst{display:flex;align-items:baseline;gap:10pt;white-space:nowrap;overflow:hidden}
  .bst .s{font:400 26pt/30pt var(--font-display);letter-spacing:-.3pt;color:var(--ink)}
  .bst .a{font:700 8.5pt/10pt var(--font-body);letter-spacing:1.4pt;text-transform:uppercase;color:var(--accent)}
  .ret{font:400 8pt/10pt var(--font-body);color:var(--text);white-space:nowrap;overflow:hidden}
  .ret b{font-weight:700;letter-spacing:.8pt;text-transform:uppercase;color:var(--ink)}
  .cap .nm{height:17pt;white-space:nowrap;overflow:hidden;font:500 12.5pt/17pt var(--font-display);color:var(--ink);letter-spacing:-.05pt}
  .ctx{font-size:9pt;line-height:11.5pt;color:var(--text)}
  .steps{display:grid;grid-auto-flow:column;column-gap:16pt;row-gap:4pt;list-style:none;overflow:hidden}
  .steps li{font:600 10pt/13pt var(--font-body);color:var(--ink);position:relative;padding-left:11pt;overflow:hidden}
  .steps.b li{font-size:11pt;line-height:14pt}
  .steps li:before{content:"";position:absolute;left:0;top:4pt;width:4.5pt;height:4.5pt;background:var(--accent)}
  .board{position:absolute;background:var(--soft);border-top:1.4pt solid var(--accent)}
  .bigb{font:400 15pt/17pt var(--font-display);color:var(--accent);flex:none}
  .cta{font:400 16pt/19pt var(--font-display);color:var(--ink);overflow:hidden}
</style>
</head>
<body data-mode="email">
<script src="capfit.js"></script>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SP.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const esc = SP.esc, L = D.listing, A = D.agent || {};
  const issues = await SP.ready(D);
  const sold = D.piece.card === 'sold', big = D.piece.size === '6x11', front = D.piece.side === 'front';
  const PCall = ((D.copy || {}).pc || {}), C = (sold ? PCall.js : PCall.jl) || {};
  document.body.dataset.mode = D.mode || 'email';
  const W = big ? 792 : 648, H = 432, M = 24, status = sold ? 'Just Sold' : 'Just Listed';
  let h = '';

  if(front){
    // ---------- front ----------
    const PX = big ? 262 : 244, ph = 304, cw = PX - M - 16;
    h += SP.photo(D, C.hero || 'front', PX, -9, W + 9 - PX, ph + 9, 'front.hero');
    const sfs = big ? 50 : 46, slh = sfs + 2, afs = big ? 22 : 21, kfs = big ? 9.5 : 8.5, pfs = big ? 10 : 8.5;
    // the fold-over's 2 x 2 fact grid: bedrooms, baths, square feet, then the lot, else the year, else the stories
    const B = BD.bathNum(L), lot = String(SP.lotText(L)).match(/^([\d,.]+)\s*(.*)$/), yr = L.yearBuilt || L.year;
    const G = [];
    if(L.beds) G.push([L.beds, L.beds == 1 ? 'Bedroom' : 'Bedrooms']);
    if(L.baths) G.push([B.num, B.label]);
    if(L.sqft) G.push([Number(L.sqft).toLocaleString('en-US'), 'Square Feet']);
    if(lot) G.push([lot[1], lot[2] || 'Sq Ft Lot']); else if(yr) G.push([yr, 'Year Built']); else if(L.stories) G.push([L.stories, L.stories == 1 ? 'Story' : 'Stories']);
    const grid = `<div style="flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;margin-top:${big ? 8 : 9}pt">${G.slice(0, 4).map((g, i) =>
      `<div class="gcell${i % 2 ? ' r' : ''}"><div class="gv" style="font-size:${big ? 23 : 24}pt;line-height:${big ? 25 : 27}pt" data-slot="front.fact${i}.v" data-lines="1">${g[0]}</div><div class="gl" data-slot="front.fact${i}.l" data-lines="1">${esc(g[1])}</div></div>`).join('')}</div>`;
    const nfs = big ? 28 : 20, tail = sold
      ? `<div style="margin-top:auto"><div style="font:400 ${nfs}pt/${nfs + 4}pt var(--font-display);letter-spacing:-.2pt;color:var(--ink);white-space:nowrap;overflow:hidden" data-slot="agent.name" data-lines="1" data-fit="14">${esc(A.name || '')}</div>
         ${A.nar ? `<div class="kick" style="font-size:${kfs}pt;margin-top:2pt" data-slot="agent.desig" data-lines="1">REALTOR®</div>` : ''}
         <div style="font:700 ${big ? 21 : 15}pt/${big ? 26 : 19}pt var(--font-body);color:var(--accent);letter-spacing:.3pt;white-space:nowrap;overflow:hidden;margin-top:3pt" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</div></div>`
      : grid;
    h += `<div class="abs" style="left:${M}pt;top:22pt;width:${cw}pt;height:${ph - 22 - 9}pt;display:flex;flex-direction:column">
      <div class="kick" style="height:11pt;font-size:${kfs}pt;line-height:11pt;flex:none" data-slot="front.kick" data-lines="1">${esc(sold ? 'Recently sold' : 'New on the market')}</div>
      <div class="st" style="font-size:${sfs}pt;line-height:${slh}pt;height:${2*slh}pt;flex:none;margin-top:4pt;white-space:nowrap" data-slot="status" data-lines="2">${esc(status.split(' ')[0])}<br>${esc(status.split(' ')[1])}</div>
      <div style="height:1.2pt;background:var(--accent);margin:${big ? 6 : 7}pt 0 ${big ? 8 : 10}pt;flex:none"></div>
      <div class="ad" style="font-size:${afs}pt;line-height:${afs + 4}pt;flex:none" data-slot="address" data-lines="1">${esc(L.address)}</div>
      <div class="kick" style="margin-top:${big ? 5 : 4}pt;height:12pt;font-size:${pfs}pt;line-height:12pt;flex:none" data-slot="place" data-lines="1">${esc(SP.placeZip(L).toUpperCase())}</div>
      ${tail}</div>`;
    // the burgundy rule runs out under the photo to the trim, as between the cover's photos
    h += `<div class="abs" style="left:${M}pt;top:${ph}pt;width:${W + 9 - M}pt;height:1.4pt;background:var(--accent)"></div>`;
    const nl = sold ? 3 : 5, lh = big ? 19.5 : 18, fs = big ? 14.2 : 13;
    h += `<div class="abs ab" style="left:${M}pt;top:${ph + 12}pt;width:${W - 2*M}pt;height:${nl*lh}pt;font-size:${fs}pt;line-height:${lh}pt" data-slot="${sold ? 'front.sold' : 'front.about'}" data-para="1"${big ? ' data-nobal="1"' : ''} data-min="${nl}" data-fillbox="1">${esc(big ? C.front11 : C.front9)}</div>`;
    if(sold) h += `<div class="abs" style="left:${M}pt;top:${ph + 12 + nl*lh + 10}pt;width:${W - 2*M}pt;height:30pt;font:400 ${big ? 25 : 22}pt/30pt var(--font-display);letter-spacing:-.2pt;color:var(--accent);white-space:nowrap;overflow:hidden" data-slot="sold.cta" data-lines="1">${esc(C.cta || 'Thinking about selling? Let’s talk.')}</div>`;
  } else {
    // ---------- back ----------
    const Z = SP.mail(W), X = M, LZ = Z.zA[0] - 12, rW = Z.zP[0] - 12 - Z.zA[0], pTop = 58;
    h += `<div class="abs" data-blk="1" style="left:-9pt;top:-9pt;width:${W + 18}pt;height:15pt;background:var(--accent)"></div>`;
    const ret = SP.returnLines(D);
    h += `<div class="abs ret" style="left:${Z.zA[0]}pt;top:16pt;width:${rW}pt;height:32pt;text-align:right">${ret.slice(0, 3).map((r, i) => i ? `<span data-slot="return${i}" data-lines="1" style="display:block">${esc(r)}</span>` : `<b data-slot="return0" data-lines="1" style="display:block">${esc(r)}</b>`).join('')}</div>`;
    h += `<div class="abs bst" style="left:${X}pt;top:16pt;width:${LZ - X}pt;height:32pt"><span class="s" data-slot="back.status.s" style="font-size:${big ? 28 : 26}pt">${esc(status)}</span><span class="a" data-slot="back.status.a">${esc(L.address)}</span></div>`;
    h += `<div class="rule" style="left:${X}pt;top:50pt;width:${LZ - X}pt;height:1.2pt;background:var(--accent)"></div>`;
    const cfs = big ? 9.5 : 9, clh = big ? 12 : 11.5;
    const cap = (c, x, y, w, slot, row) => `<div class="abs cap" style="left:${x}pt;top:${y + 4}pt;width:${w}pt"><div class="nm" data-slot="${slot}.t" data-lines="1"${big ? ' style="font-size:13.5pt"' : ''}>${esc(c.t)}</div></div>
      <div class="abs ctx" style="left:${x}pt;top:${y + 22}pt;width:${w}pt;font-size:${cfs}pt;line-height:${clh}pt" data-slot="${slot}" data-cap="1" data-row="${row}" data-para="1" data-min="3">${esc(big && c.a11 ? c.a11 : c.a)}</div>`;
    let g = '';
    if(!sold){
      // one row of captioned photos: the left zone, and one beside the address block under the return address
      const bk = C.back || [], n = big ? 4 : 3, items = bk.slice(0, n), rItem = bk[4], gap = 10, ph = 72;
      const pw = (LZ - X - (n - 1)*gap)/n;
      items.forEach((c, i) => { const x = X + i*(pw + gap); g += SP.photo(D, c.id, x, pTop, pw, ph, 'back.photo' + i); h += cap(c, x, pTop + ph, pw, 'back.cap' + i, 'back'); });
      if(rItem){ g += SP.photo(D, rItem.id, Z.zA[0], pTop, rW, ph, 'back.photoR'); h += cap(rItem, Z.zA[0], pTop + ph, rW, 'back.capR', 'back'); }
      const ty = pTop + ph + 22 + 3*clh + 10, afs = big ? 12.5 : 10.5, alh = big ? 16 : 15;
      h += `<div class="abs ab" style="left:${X}pt;top:${ty}pt;width:${LZ - X}pt;height:${Math.floor((Z.cardY - 10 - ty)/alh)*alh}pt;font-size:${afs}pt;line-height:${alh}pt" data-slot="back.about" data-para="1"${big ? ' data-nobal="1"' : ''} data-min="3" data-fillbox="1">${esc(big ? C.about11 : C.about9)}</div>`;
    } else {
      const ids = C.photos || [], gap = 10, pw = (LZ - X - gap)/2, ph = big ? 84 : 86;
      ids.slice(0, 2).forEach((id, i) => { g += SP.photo(D, id, X + i*(pw + gap), pTop, pw, ph, 'back.photo' + i); });
      // the invitation, the agent's number: the column beside the photos, under a burgundy rule
      h += `<div class="rule" style="left:${Z.zA[0]}pt;top:${pTop}pt;width:${rW}pt;height:1.2pt;background:var(--accent)"></div>`;
      h += `<div class="abs cta" style="left:${Z.zA[0]}pt;top:${pTop + 8}pt;width:${rW - 6}pt;height:76pt;font-size:${big ? 17 : 16}pt;line-height:19pt" data-slot="sold.call" data-lines="4">${esc(C.call || '')}</div>`;
      h += `<div class="abs kick" style="left:${Z.zA[0]}pt;top:${pTop + 88}pt;width:${rW}pt;height:11pt" data-slot="sold.callLabel" data-lines="1">Call or text</div>`;
      h += `<div class="abs" style="left:${Z.zA[0]}pt;top:${pTop + 100}pt;width:${rW}pt;height:24pt;font:700 ${big ? 20 : 18}pt/24pt var(--font-body);color:var(--accent);letter-spacing:.3pt;white-space:nowrap;overflow:hidden" data-slot="agent.phone" data-lines="1" data-fit="14">${esc(A.phone || '')}</div>`;
      const sy = pTop + ph + 12, st = (big ? C.steps11 : C.steps9) || [], cols = big ? 3 : 2, rows = Math.ceil(st.length/cols);
      h += `<div class="abs kick" style="left:${X}pt;top:${sy}pt;width:${LZ - X}pt;height:11pt" data-slot="sold.stepsLabel" data-lines="1">${esc(C.stepsLabel || 'How I’d start')}</div>`;
      h += `<ul class="abs steps${big ? ' b' : ''}" style="left:${X}pt;top:${sy + 17}pt;width:${LZ - X}pt;height:${rows*(big ? 28 : 26) + (rows - 1)*4}pt;grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr)">${st.map((s, i) => `<li data-slot="sold.step${i}" data-lines="2" data-para="1" data-nobal="1" data-min="2">${esc(s)}</li>`).join('')}</ul>`;
      const my = sy + 17 + rows*(big ? 28 : 26) + (rows - 1)*4 + (big ? 5 : 8), mlh = big ? 14 : 12.5;
      h += `<div class="abs kick" style="left:${X}pt;top:${my}pt;width:${LZ - X}pt;height:11pt" data-slot="sold.meetLabel" data-lines="1">${esc(C.meetLabel || 'When we meet')}</div>`;
      h += `<div class="abs ab" style="left:${X}pt;top:${my + 13}pt;width:${LZ - X}pt;height:${Math.floor((Z.cardY - 8 - my - 13)/mlh)*mlh}pt;font-size:${big ? 11.5 : 10}pt;line-height:${mlh}pt" data-slot="sold.meet" data-para="1" data-min="3" data-fillbox="1">${esc(big ? C.meet11 : C.meet9)}</div>`;
    }
    h += `<div class="abs" data-gapcheck="back.photos" style="left:0;top:0">${g}</div>`;
    // the rose block under the postage box, under a burgundy rule, bleeding off the right edge
    const sl = C.slab || {};
    h += `<div class="board" data-blk="1" style="left:${Z.zP[0]}pt;top:${Z.zP[1] + Z.zP[3] + 8}pt;width:${W - Z.zP[0] + 9}pt;height:${Z.zA[1] - Z.zP[1] - Z.zP[3] - 16}pt;padding:7pt 18pt 6pt 10pt;display:flex;flex-direction:column;justify-content:center"><div class="bigb">${String(sl.big || '').split(/\s+/).filter(Boolean).reduce((a, w) => { const l = a[a.length - 1]; if(l && l.length + w.length < 10) a[a.length - 1] = l + ' ' + w; else a.push(w); return a; }, []).map((c, i) => `<div data-slot="slab.big${i}" data-lines="1">${esc(c)}</div>`).join('')}</div></div>`;
    h += `<div class="rule" style="left:${X}pt;top:${Z.cardY - 4}pt;width:${W - 2*M}pt;height:1.2pt;background:var(--accent)"></div>`;
    h += SP.postCard(D, Z, W);
    h += SP.fine(D, X, 396, Z.zB[0] - 12 - X, 'var(--text)');
    h += SP.mailGuides(D, Z);
  }

  await SP.finish(D, W, H, h, issues);
})();
</script>
</body>
</html>
