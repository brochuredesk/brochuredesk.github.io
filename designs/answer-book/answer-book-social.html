<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Answer Book Open House socials</title>
<link rel="stylesheet" href="../engine/ohlib.css">
<script src="../engine/ivory.js"></script>
<script src="../engine/ohlib.js"></script>
<script src="../engine/factrepeat.js"></script>
<script src="../engine/baths.js"></script>
<script src="../engine/setpage.js"></script>
<!--
  Answer Book's own Open House socials (owner 11/2/2026, Full Lineup review Q2; Just Listed and Just Sold keep their existing socials).
  Built on the set's signature, the question and its answer: a gold dash and a short buyer question over the answer, set beside the room
  photos, on warm paper with Manrope and deep teal. Gold Tab (open-house-a): the gold tab with the label, the big Manrope date, the time,
  a hairline, the house, the address, the facts as one line between hairlines, then the question and its answer beside two interiors, and
  the card under the heavy teal rule. Dark Callout (open-house-b): the full-width teal callout band with the gold date, the house with a
  teal facts column beside it, the address, then a question and its answer beside the room it is about (a second when there is room).
  Stories bleed the house off the top edge and a strip of rooms off the bottom; the square puts the house on top and the callout under
  it; the wide shapes put the words on the left and a tall photo off the right edge. The questions and answers are the package's own
  Open House copy (copy.pc.oh); nothing is written here. REALTOR(R) cases: what's served and the notes between two hairlines.
-->
<style>
  @font-face{font-family:'Manrope';font-weight:500;src:url(../../fonts/pool/manrope-latin-500-normal.woff2) format('woff2')}
  @font-face{font-family:'Manrope';font-weight:600;src:url(../../fonts/pool/manrope-latin-600-normal.woff2) format('woff2')}
  @font-face{font-family:'Manrope';font-weight:700;src:url(../../fonts/pool/manrope-latin-700-normal.woff2) format('woff2')}
  @font-face{font-family:'Source Sans 3';font-weight:400;src:url(../../fonts/pool/source-sans-3-latin-400-normal.woff2) format('woff2')}
  @font-face{font-family:'Source Sans 3';font-weight:600;src:url(../../fonts/pool/source-sans-3-latin-600-normal.woff2) format('woff2')}
  @font-face{font-family:'Source Sans 3';font-weight:700;src:url(../../fonts/pool/source-sans-3-latin-700-normal.woff2) format('woff2')}
  :root{--paper:#f4f1e9;--ink:#22383a;--txt:#3e4f50;--kick:#3b5c59;--gold:#d6a943;--dark:#22393b;--ond:#f4f1e9;--line:rgba(34,56,58,.28)}
  *{box-sizing:border-box;margin:0;padding:0}
  .page{font-family:'Source Sans 3';color:var(--ink)}
  .t{position:absolute;white-space:nowrap;overflow:hidden}
  .w{white-space:normal}
</style>
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
SP.start(['700 10pt "Manrope"', '600 10pt "Manrope"', '500 10pt "Manrope"', '400 10pt "Source Sans 3"', '600 10pt "Source Sans 3"', '700 10pt "Source Sans 3"'], D => {
  const esc = Ivory.esc, K = SP.K, L = D.listing, A = D.agent || {};
  const kind = SP.kind(D), shape = D.piece.shape, E = OHL.event(D);
  if(E.time) E.time = E.time.replace(/(\d)\s+(am|pm)\b/gi, '$1 $2');
  const [W, H] = [D.piece.px[0]*K, D.piece.px[1]*K];
  const FL = SP.floor(shape), FE = FL.event, FB = FL.body, FS = FL.small;
  const r1 = SP.r1, T = SP.T, rect = SP.rect, wd = SP.width, fit = SP.fitSize;
  const hero = OHL.hero(D, 'straight'), V = D.piece.of === 'open-house-b' ? 'b' : 'a', DARK = V === 'b';
  const rooms = OHL.photos(D).filter(id => id !== hero && !Ivory.fullHouse(D, id));
  const hs = OHL.cardMode(D) === 'headshot' && !!A.headshot;
  const MF = "font-family:'Manrope'", SS = "font-family:'Source Sans 3'", GOLD = 'var(--gold)', INK = 'var(--ink)', TXT = 'var(--txt)';
  const isOH = true;
  const SAFE = shape === 'story' ? 93.75 : 0, short = /^(square|gbp|wide)$/.test(shape), G0 = 5;
  const MG = r1(Math.max(12, W*.045)), CW = W - 2*MG;
  let TIGHT = false, dateSz = 99;
  const hair = (x, y, w, c, t) => rect(x, y, w, t || .75, `background:${c || 'var(--line)'}`);
  const PC = ((D.copy || {}).pc || {}).oh || {}, okId = id => id && (D.photos || {})[id] && id !== hero;
  // the questions and answers: the package's own Open House copy. Gold Tab: one question with two interiors; Dark Callout: the captions.
  const QA = (() => {
    const out = [];
    if(V === 'a' && PC.a && PC.a.q && PC.a.text){ const ids = (PC.a.photos || []).filter(okId); out.push({q: PC.a.q, a: PC.a.text, ids: ids.length ? ids : rooms.slice(0, 2)}); }
    if(V === 'b' && PC.b && PC.b.caps) PC.b.caps.filter(c => c.q && c.a && okId(c.id)).forEach(c => out.push({q: c.q, a: c.a, ids: [c.id]}));
    if(!out.length){   // no question copy on this package: the package's room captions answer on their own
      rooms.slice(0, V === 'a' ? 2 : 2).forEach((id, i) => { const t = SP.caption(D, id)[0]; if(t && (V === 'b' || i === 0)) out.push({q: '', a: SP.caption(D, id).join(' '), ids: V === 'a' ? rooms.slice(0, 2) : [id]}); });
    }
    return out;
  })();

  // ---- parts ----------------------------------------------------------------------------------------------------------------------------
  // the event. Gold Tab: the gold tab with the label, the big date, the time, a hairline. Dark Callout: a full-width teal band (gold dash and label, gold date, time)
  const head = (w, k) => {
    const parts = [], tabPad = 9;
    const lab = E.label.toUpperCase(), lcss = `font-weight:700;${SS};letter-spacing:${TIGHT ? .06 : .16}em`, ls0 = r1(Math.max(FE, (short ? 11 : 15)*k));
    let ls = fit(lab, lcss, DARK ? w - 22 : w - 2*tabPad, ls0, FE), lines = [lab];
    if(wd(lab, `${lcss};font-size:${ls}pt`) > (DARK ? w - 22 : w - 2*tabPad)){ lines = OHL.labelLines(E.label, 2).map(t => t.toUpperCase()); ls = Math.min(ls0, ...lines.map(t => fit(t, lcss, DARK ? w - 22 : w - 2*tabPad, ls0, FE))); }
    const lh = r1(ls*(TIGHT ? 1.25 : 1.55)), labH = lines.length*lh + (DARK ? 0 : 2*(TIGHT ? 2 : 4)), tw = Math.max(...lines.map(t => wd(t, `${lcss};font-size:${ls}pt`))) + 2*tabPad;
    const ink = DARK ? GOLD : INK, onInk = DARK ? 'var(--ond)' : INK;
    const dcss = `font-weight:500;${MF};letter-spacing:-.5pt`, big = r1(Math.max(FE*1.6, 48*k)), s1 = fit(E.long, dcss, w, big, FE);
    let dh = 0, dparts = [];
    if(wd(E.long, `${dcss};font-size:${s1}pt`) <= w && s1 >= (TIGHT ? FE : Math.min(big*.72, FE*1.1))){ dateSz = s1; dh = r1(s1*(TIGHT ? 1.12 : 1.22)); dparts.push({h: dh, f: (x, y) => T(`${dcss};font-size:${s1}pt;color:${ink};text-align:left`, esc(E.long), x, y, w, dh, 'data-slot="oh.date" data-lines="1"')}); }
    else {
      const sd = fit(E.monthDay || E.long, dcss, w, big, FE), hd = r1(sd*(TIGHT ? 1.12 : 1.22)); dateSz = sd;
      if(E.weekday){ const sw = Math.max(FE, r1(sd*.4)), hw = r1(sw*(TIGHT ? 1.2 : 1.45)); dparts.push({h: hw, f: (x, y) => T(`font-weight:600;${SS};font-size:${sw}pt;letter-spacing:.16em;text-transform:uppercase;color:${DARK ? onInk : 'var(--kick)'};text-align:left`, esc(E.weekday), x, y, w, hw, 'data-slot="oh.day" data-lines="1"')}); }
      dparts.push({h: hd, f: (x, y) => T(`${dcss};font-size:${sd}pt;color:${ink};text-align:left`, esc(E.monthDay || E.long), x, y, w, hd, 'data-slot="oh.date" data-lines="1"')});
    }
    if(E.time){ const tcss = `font-weight:600;${SS}`, st = fit(E.time, tcss, w, r1(Math.max(FE*1.15, 24*k)), FE), ht = r1(st*(TIGHT ? 1.2 : 1.4));
      dparts.push({h: ht, f: (x, y) => T(`${tcss};font-size:${st}pt;color:${onInk};text-align:left`, esc(E.time), x, y, w, ht, 'data-slot="oh.time" data-lines="1"')}); }
    const dH = dparts.reduce((a, p) => a + p.h, 0), padT = DARK ? (TIGHT ? 6 : 12) : 0, gapL = TIGHT ? 2 : 6;
    if(DARK) return {h: padT + labH + gapL + dH + padT + 2, band: true, draw: (x, y) => { let o = rect(0, y, W, padT*2 + labH + gapL + dH + 2, 'background:var(--dark)');   // the band bleeds to the top edge and the sides
        let yy = y + padT; o += rect(x, yy + (lh - 2)/2, 10, 2, 'background:var(--gold)') + lines.map((t, i) => T(`${lcss};font-size:${ls}pt;color:var(--ond);text-align:left`, esc(t), x + 16, yy + i*lh, w - 16, lh, 'data-slot="oh.label" data-lines="1" data-bg="#22393b"')).join(''); yy += labH + gapL;
        dparts.forEach(p => { o += p.f(x, yy).replace('data-slot', 'data-bg="#22393b" data-slot'); yy += p.h; }); return o; }};
    return {h: labH + gapL + dH + 9, draw: (x, y) => { let o = rect(x, y, tw, labH, 'background:var(--gold)') + lines.map((t, i) => T(`${lcss};font-size:${ls}pt;color:var(--ink);text-align:left`, esc(t), x + tabPad, y + (TIGHT ? 2 : 4) + i*lh, tw - tabPad, lh, 'data-slot="oh.label" data-lines="1" data-bg="#d6a943"')).join('');
      let yy = y + labH + gapL; dparts.forEach(p => { o += p.f(x, yy); yy += p.h; }); return o + hair(x, yy + 4, w, 'var(--ink)', 1); }};
  };
  // what's served and the notes: between two hairlines, a gold dash before each line
  const noteBox = (w, k) => {
    const items = [E.refreshments && [E.refreshments, true, 'oh.refreshments'], E.note && [E.note, false, 'oh.note']].filter(Boolean); if(!items.length) return null;
    const s = r1(Math.max(FB, FB*1.1*k)), lh = r1(s*(TIGHT ? 1.2 : 1.32)), pad = TIGHT ? 3 : r1(Math.max(5, s*.5)), iw = w - 16, ps = items.map(([text, bold, slot]) => { const css = `font:${bold ? 700 : 400} ${s}pt/${lh}pt 'Source Sans 3'`; let bw = iw, m = SP.para(text, css, bw); const n0 = m.n;
      if(n0 > 1 && m.fill < .75) for(let f = .98; f >= .6; f -= .02){ const m2 = SP.para(text, css, iw*f); if(m2.n > n0) break; if(m2.n === n0 && m2.fill >= .75){ bw = iw*f; break; } }
      return {text, bold, slot, bw, n: n0}; });
    const h = ps.reduce((a, q) => a + q.n*lh + 2*pad, 0);
    return {h, draw: (x, y) => { let yy = y, o = '';
      ps.forEach((q, i) => { o += hair(x, yy, w, i ? 'var(--line)' : 'var(--ink)', i ? .75 : 1.25); yy += pad; o += rect(x, yy + lh/2 - 1, 7, 1.7, 'background:var(--gold)') +
        `<div class="abs w" style="left:${x + 14}pt;top:${yy}pt;width:${q.bw}pt;height:${q.n*lh + 3}pt;font:${q.bold ? 700 : 400} ${s}pt/${lh}pt 'Source Sans 3';color:var(--ink)" data-slot="${q.slot}" data-lines="${q.n}">${esc(q.text)}</div>`; yy += q.n*lh + pad; });
      o += hair(x, y + h - 1, w, 'var(--ink)', 1.25); return o.replace('<div class="abs"', '<div class="abs" data-box="oh.box"'); }};
  };
  const addrNum = (L.address.match(/^\s*(\d+[A-Za-z-]*)\s+(.*)$/) || [null, '', L.address]);
  const address = (w, k, max, light) => {
    const css = `font-weight:500;${MF};letter-spacing:-.4pt`, cap = Math.min(max*k, dateSz - 1), s = fit(L.address, css, w, r1(Math.max(FE*1.1, cap)), FE), col = light ? 'var(--ond)' : INK;
    const cs = Math.max(FS, r1(10*k)), ccss = `font-weight:600;${SS};letter-spacing:.18em`, city = OHL.place(L).toUpperCase(), cH = r1(cs*1.7), cOK = wd(city, `${ccss};font-size:${cs}pt`) <= w;
    const cityHtml = (x, y) => cOK ? T(`${ccss};font-size:${cs}pt;color:${light ? 'var(--gold)' : 'var(--kick)'};text-align:left`, esc(city), x, y, w, cH, 'data-slot="place" data-small="1" data-lines="1"') : '';
    if(wd(L.address, `${css};font-size:${s}pt`) <= w){ const h = r1(s*1.25); return {h: h + (cOK ? cH : 0), one: true, draw: (x, y) => T(`${css};font-size:${s}pt;color:${col};text-align:left`, esc(L.address), x, y, w, h, 'data-slot="address" data-lines="1"') + cityHtml(x, y + h)}; }
    const st = addrNum[2], s2 = fit(st, css, w, r1(Math.max(FE*1.1, cap*.85)), FE), h = r1(s2*1.25);
    return {h: h*2 + (cOK ? cH : 0), bad: wd(st, `${css};font-size:${s2}pt`) > w, draw: (x, y) => T(`${css};font-size:${s2}pt;color:${col};text-align:left`, esc(addrNum[1]), x, y, w, h, 'data-slot="address" data-lines="1"') + T(`${css};font-size:${s2}pt;color:${col};text-align:left`, esc(st), x, y + h, w, h, 'data-slot="address" data-lines="1"') + cityHtml(x, y + 2*h)};
  };
  // the facts as one line between hairlines (Gold Tab): the value in Manrope, the label after it
  const factLine = (w, k) => {
    const f = SP.facts(D); if(!f.length) return null;
    const lab = ([lb, v, key]) => key === 'year' ? 'Built in' : lb, txt = f.map(it => it[1] + ' ' + lab(it)), vs = Math.max(FB*1.1, r1(15*k));
    const wOne = t => wd(t, `font-weight:600;${SS};font-size:${vs}pt`);
    const ws = txt.map(wOne), total = ws.reduce((a, t) => a + t, 0), one = total + (f.length - 1)*10 <= w, per = one ? f.length : Math.ceil(f.length/2), rws = Math.ceil(f.length/per), lh = r1(vs*1.5), cw = w/per;
    if(!one && ws.some(t => t > cw - 4)) return null;
    const sp = one ? (w - total)/Math.max(1, f.length - 1) : 0, xs = one ? ws.map((_, i) => ws.slice(0, i).reduce((a, t) => a + t, 0) + i*sp) : null, h = rws*lh + 10;
    return {h, draw: (x, y) => hair(x, y, w, 'var(--ink)', 1) + hair(x, y + h - 1, w, 'var(--line)') + f.map(([lb, v, key], i) => { const cx = x + (one ? xs[i] : (i % per)*cw), cy = y + 5 + Math.floor(i/per)*lh;
      const t = key === 'year' ? `<span style="font-weight:400;color:var(--txt)">Built in</span> <b style="font-weight:700">${esc(v)}</b>` : `<b style="font-weight:700">${v}</b> <span style="font-weight:400;color:var(--txt)">${esc(lb)}</span>`;
      return T(`${SS};font-size:${vs}pt;color:var(--ink);text-align:left`, t, cx, cy, (one ? ws[i] + 6 : cw), lh, `data-slot="fact.${key}" data-lines="1"`); }).join('')};
  };
  // the facts as a teal column (Dark Callout): the gold Manrope number over its small caps label, hairlines between
  const factCol = (w, h, k) => {
    const f = SP.facts(D); if(!f.length) return null;
    const lcss = `font-weight:600;${SS};letter-spacing:.1em;text-transform:uppercase`, l2 = Math.max(FS, r1(9.5*k)), rh = h/f.length, lh = r1(l2*1.4), vs = Math.min(r1(rh - lh - 8), r1(Math.max(FB*1.5, 28*k))), pad = 10;
    if(vs < FB*1.05 || f.some(([lb]) => wd(lb.toUpperCase(), `${lcss};font-size:${l2}pt`) > w - 2*pad)) return null;
    return {draw: (x, y) => rect(x, y, w, h, 'background:var(--dark)') + f.map(([lb, v, key], i) => { const cy = y + i*rh + (rh - lh - r1(vs*1.15))/2;
      return (i ? hair(x + pad, y + i*rh, w - 2*pad, 'rgba(244,241,233,.25)') : '') + T(`font-weight:500;${MF};font-size:${vs}pt;color:var(--gold);text-align:left`, v, x + pad, cy, w - 2*pad, r1(vs*1.15), `data-slot="fact.${key}" data-lines="1"`) +
        T(`${lcss};font-size:${l2}pt;color:var(--ond);text-align:left`, esc(lb), x + pad, cy + r1(vs*1.15), w - 2*pad, lh, 'data-small="1"'); }).join('')};
  };
  // a question over its answer: the gold dash and the question in Source Sans 600, the answer in body type (a last line at least 3/4 full)
  const qaText = (qa, w, k, maxN) => {
    const as = Math.max(FB, r1(FB*1.22*k)), lh = r1(as*1.38), hasQ = !!qa.q;
    const qs = hasQ ? fit(qa.q, `font-weight:700;${SS}`, w - 16, Math.max(FB, r1(FB*1.25*k)), FB) : FB, qh = hasQ ? r1(qs*1.5) : 0;
    if(hasQ && wd(qa.q, `font-weight:700;${SS};font-size:${qs}pt`) + 16 > w) return null;
    const css = `font:400 ${as}pt/${lh}pt 'Source Sans 3';text-align:left`, sents = String(qa.a).trim().split(/(?<=[.!?])\s+(?=[A-Z0-9])/).filter(t => t && !SP.VAGUE.test(t)), r = SP.fillText(sents, css, w, maxN, true, .6);
    if(!r) return null;
    return {h: qh + r.n*lh + 3, draw: (x, y) => (hasQ ? rect(x, y + qh*.5 - 1, 7, 1.7, 'background:var(--gold)') + T(`font-weight:700;${SS};font-size:${qs}pt;color:var(--ink);text-align:left`, esc(qa.q), x + 14, y, w - 14, qh, 'data-slot="oh.q" data-lines="1"') : '') +
      `<div class="abs w" style="left:${x}pt;top:${y + qh}pt;width:${r.w}pt;height:${r.n*lh + 3}pt;font:400 ${as}pt/${lh}pt 'Source Sans 3';color:${TXT};text-align:left" data-slot="listing.body" data-lines="${r.n}">${esc(r.text)}</div>`};
  };
  // the question and answer beside its room photos: text on one side, one or two photos on the other
  const qaRow = (qa, w, k, o) => {
    o = o || {}; const ids = qa.ids.slice(0, o.nPhotos || (V === 'a' ? 2 : 1)); if(!ids.length) return null;
    const pw = r1(w*(o.photoFrac || (ids.length > 1 ? .44 : .38))), tw = w - pw - 12, tx = qaText(qa, tw, k, o.maxN || 9); if(!tx) return null;
    const ph = Math.max(tx.h, o.minH || 0), left = V === 'b' && !o.photoRight;
    return {h: ph, draw: (x, y) => { const px = left ? x : x + w - pw, ttx = left ? x + pw + 12 : x; let s = tx.draw(ttx, y + (ph - tx.h)/2);
      if(ids.length > 1){ const g = G0, hh = (ph - g)/2; ids.forEach((id, i) => { s += OHL.photo(D, id, `left:${px}pt;top:${y + i*(hh + g)}pt;width:${pw}pt;height:${hh}pt`); }); }
      else s += OHL.photo(D, ids[0], `left:${px}pt;top:${y}pt;width:${pw}pt;height:${ph}pt`);
      return s; }};
  };
  // the card: name in Manrope, REALTOR(R), CALL / TEXT, the phone; a heavy teal rule over it, the one logo on the right
  const agent = (w, k, o) => {
    o = o || {};
    const hsd = hs && !o.nohs ? r1(Math.min(w*.2, 52)) : 0, tx = hsd ? hsd + 10 : 0, tw = w - tx;
    const ncss = `font-weight:500;${MF}`, nS = fit(A.name || '', ncss, tw, r1(Math.max(FB*1.5, 26*k)), FB);
    const nH = r1(nS*(TIGHT ? 1.15 : 1.25)), nar = A.nar || /realtor/i.test(A.designation || ''), dS = Math.max(FS, r1(9.5*k)), dH = r1(dS*(TIGHT ? 1.25 : 1.55));
    const lab = A.phoneLabel || 'Call / Text'; let pS = r1(Math.max(FB*1.15, 18*k));
    const lcss = `font-weight:600;${SS};letter-spacing:.12em;text-transform:uppercase`, lS = Math.max(FS, r1(9.5*k));
    const oneLine = () => wd(lab.toUpperCase(), `${lcss};font-size:${lS}pt`) + 8 + wd(A.phone || '', `font-weight:700;${SS};font-size:${pS}pt`) <= tw;
    while(!oneLine() && pS > FB) pS = r1(pS - .5);
    const stack = !oneLine(), pH = r1(pS*(TIGHT ? 1.2 : 1.3)), lH = r1(lS*(TIGHT ? 1.25 : 1.5)), ch = nH + (nar ? dH : 0) + (stack ? lH : 0) + pH, h = Math.max(ch, hsd);
    const col = o.light ? 'var(--ond)' : INK, sub = o.light ? 'var(--gold)' : 'var(--kick)';
    return {h, bad: wd(A.name || '', `${ncss};font-size:${nS}pt`) > tw || wd(A.phone || '', `font-weight:700;${SS};font-size:${pS}pt`) > tw, draw: (x, y) => {
      let s = '';
      if(hsd) s += `<div class="abs" style="left:${x}pt;top:${y + (h - hsd)/2}pt;width:${hsd}pt;height:${hsd}pt;border-radius:50%;overflow:hidden"><img src="${esc(A.headshot)}" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></div>`;
      let yy = y + (h - ch)/2;
      s += T(`${ncss};font-size:${nS}pt;color:${col};text-align:left`, esc(A.name || ''), x + tx, yy, tw, nH, 'data-slot="agent.name" data-lines="1"'); yy += nH;
      if(nar){ s += T(`${lcss};font-size:${dS}pt;color:${sub};text-align:left`, 'REALTOR®', x + tx, yy, tw, dH, 'data-slot="agent.desig" data-small="1" data-lines="1"'); yy += dH; }
      if(stack){ s += T(`${lcss};font-size:${lS}pt;color:${sub};text-align:left`, esc(lab), x + tx, yy, tw, lH, 'data-small="1"'); yy += lH; }
      s += T(`font-weight:700;${SS};font-size:${pS}pt;color:${col};text-align:left`, `${stack ? '' : `<span data-small="1" style="${lcss};font-size:${lS}pt;color:${sub};margin-right:8pt">${esc(lab)}</span>`}${esc(A.phone || '')}`, x + tx, yy, tw, pH, 'data-slot="agent.phone" data-lines="1"');
