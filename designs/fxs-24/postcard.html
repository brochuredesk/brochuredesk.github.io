<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · fxs-24 postcards</title>
<link rel="stylesheet" href="fxs24.css">
<script src="fxs24.js"></script>
<script src="../engine/baths.js"></script>
<script src="../engine/agentcard.js"></script>
<!--
  BrochureDesk · fxs-24 · Just Listed and Just Sold postcards.
  data.piece.card = "listed" | "sold", data.piece.size = "6x11" (trim 792 x 432 pt) | "6x9" (648 x 432 pt), data.piece.side = "front" | "back".
  Print adds 0.125 in (9 pt) bleed. The agent's brand color (brand.accent) is the field on both sides; boxes are white.
  Front: the whole house (roof to steps) on the right with a one-line-or-two caption and a white box under it, the status stacked large on the left over the address,
  the fact rows and the brokerage logo (Just Listed) or the agent's name and number and the logo (Just Sold). No price, no QR.
  Back: status line, interior photos with captions, a white box (the write-up, or the steps), the standard contact card (templates/_shared/agentcard.js,
  band preset, which carries the back's one logo), the fine print. The right 289.5 pt (4.02 in) is the mail vendor's: return address, postage and address
  zones; drawn as guides on proofs and left clear in print.
  Copy comes from data.sw.pc.{jl|js}.{front|back} as a lead plus whole sentences; fxs24.js picks the sentences that fill each box.
-->
<style>
  /* the FX24 hand on a postcard: warm white card, vertical address, gold underlined labels, Cormorant italic, hairlines; tokens in fxs24-tokens.css */
  .pc-col{position:absolute;display:flex;flex-direction:column}
  .pc-wbox{background:var(--fx-tint);border:var(--fx-rule-w) solid var(--fx-rule);border-top:1.5pt solid var(--fx-blue);color:var(--fx-ink);padding:10pt 14pt 9pt;display:flex;flex-direction:column;overflow:hidden}
  .pc-wbox .k{font:var(--fx-label-w) 8.5pt/11pt var(--fx-font);letter-spacing:var(--fx-label-track);text-transform:uppercase;color:var(--fx-accent);white-space:nowrap;overflow:hidden;margin-bottom:3pt;text-decoration:underline;text-decoration-thickness:.75pt;text-underline-offset:3pt;align-self:flex-start}
  .pc-wbox .p{font-family:var(--fx-font);overflow:hidden;color:var(--fx-text)}
  .pc-wbox .p b{font-weight:700;color:var(--fx-ink)}
  .pc-bstatus{position:absolute;display:flex;align-items:center;white-space:nowrap;overflow:hidden;background:var(--fx-blue)}
  .pc-bstatus .st{font:700 12pt/1 var(--fx-font);letter-spacing:2.2pt;color:#fff;text-transform:uppercase}
  .pc-bstatus .ln{flex:1;height:var(--fx-rule-w);background:var(--fx-rule-on);margin:0 10pt;min-width:16pt}
  .pc-bstatus .ad{font:600 11pt/1 var(--fx-font);letter-spacing:1.6pt;color:#fff;text-transform:uppercase;padding-right:12pt}
  .pc-steps .it{display:flex;gap:8pt;align-items:baseline;white-space:nowrap;overflow:hidden}
  .pc-steps .bx{width:4pt;height:4pt;border-radius:50%;background:var(--fx-accent);flex:none;transform:translateY(-1pt)}
  .pc-call{font:600 12pt/15pt var(--fx-font);color:var(--fx-blue);white-space:nowrap;overflow:hidden}
  .pc-disc{position:absolute;font-size:6pt;line-height:10pt;color:var(--fx-mute);overflow:hidden;white-space:nowrap}
  .pc-ret{position:absolute;font:500 9pt/11pt var(--fx-font);letter-spacing:.2pt;color:var(--fx-text);overflow:hidden;height:34pt}
  .pc-ret b{font-weight:700;letter-spacing:1.4pt;text-transform:uppercase;color:var(--fx-ink)}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const esc = SW.esc, b = D.brand || {}, A = D.agent || {}, L = D.listing, P = D.piece || {};
  document.body.dataset.mode = D.mode || 'email';
  await SW.setup(D);
  const sold = P.card === 'sold', big = P.size === '6x11', front = P.side === 'front';
  const W = big ? 792 : 648, H = 432;
  const K = ((D.sw || {}).pc || {})[sold ? 'js' : 'jl'] || {};
  const hsSrc = A.headshot && ((D.photos||{})[A.headshot] ? D.photos[A.headshot].src : A.headshot) || '';
  const statusWord = sold ? 'Just Sold' : 'Just Listed';
  const issues = [];
  const logo = (cls, src, area, maxh, style) => `<div class="logo ${cls}" data-area="${area}" data-maxh="${maxh}" style="${style||''}">${src ? `<img src="${esc(src)}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage||'')}</span>`}</div>`;
  const CL = big ? 13.5 : 12.5, CF = big ? 'font-size:10.9pt;line-height:13.5pt;' : '';   // the 6x11 sets its type up from the 6x9 (11 pt against 9.5), not the same size with more room
  const cap = (c, slot, lines, extra) => `<div class="cap" style="height:${5 + lines*CL}pt;${extra||''}"><div class="a" data-slot="${slot}" data-narrow="30" data-nstep="3" data-lh="${CL}" data-lines="${lines}" data-lead="${esc(c.lead||'')}" data-s='${esc(JSON.stringify([].concat(c.s||[]))).replace(/'/g,'&#39;')}' style="height:${lines*CL}pt;${CF}"></div></div>`;
  let h = '';

  if(front){
    // The FX24 hand on a postcard front. Just Listed: the street in the blue header bar, the whole house (with two rooms beside it when the frame is wider than the house),
    // the blue panel beside it with JUST LISTED in 38 pt caps over the four stats, the caption under the exterior (opens "Front.", the draws), the agent and the one logo on the blue footer.
    // Just Sold sells the agent: JUST SOLD in the header bar at the same 38 pt, the agent's name and number big on a blue panel at the left, the house and the agent's own note at the right.
    const F = K.front || {}, SS = big ? 38 : 34, M = 24;
    const draws = list => { const w = x => /gated|roof|pergola|deck|park|garage|island|stone|corner|pool/i.test([].concat(x)[0]) ? 0 : 1; return (list || []).map((x, i) => [w(x), i, x]).sort((p, q) => p[0] - q[0] || p[1] - q[1]).map(t => t[2]); };
    const capC = sold ? {lead: '', s: (F.note || {}).s || (F.cap || {}).s} : (F.caption ? {lead: F.caption.lead, s: [].concat(F.caption.s, ((F.cap || {}).s || []).filter(x => !F.caption.s.some(c => [].concat(c).some(a => SW.sameFact(a, [].concat(x)[0]) || /stone/i.test(a) && /stone/i.test([].concat(x)[0])))))}   /* owner 11/7: the front's own facts too, so the write-up can fill (never one fact twice) */ : {lead: 'Front.', s: draws((F.about || {}).s || (F.cap || {}).s)});
    const norm = x => String(x).toLowerCase().replace(/[^a-z0-9 ]/g, '').slice(0, 40), allAlts = list => [].concat(...(list || []).map(x => [].concat(x)));
    const backSet = new Set([].concat(allAlts(((K.back || {}).about || {}).s), ...((K.back || {}).photos || []).map(c => allAlts(c.s)), allAlts((K.back || {}).steps6), allAlts((K.back || {}).steps)).map(norm));
    if(capC.s){ const kept = capC.s.filter(x => ![].concat(x).some(a => backSet.has(norm(a)))); if(kept.length >= 2) capC.s = kept; }
    const roomIds = [...new Set([].concat(((D.sw||{}).back||{}).photos||[], ((D.sw||{}).left||{}).photos||[]).map(c => c.photo))].filter(id => (D.photos||{})[id] && !(D.photos[id]||{}).fullHouse && id !== F.cap.photo).slice(0, 2);
    const capS = (c, slot, lines, extra) => `<div class="cap" style="height:${5 + lines*CL}pt;${extra||''}"><div class="a" data-slot="${slot}" data-narrow="30" data-nstep="3" data-lh="${CL}" data-lines="${lines}" data-lead="${esc(c.lead||'')}" data-s='${esc(JSON.stringify([].concat(c.s||[]))).replace(/'/g,'&#39;')}' style="height:${lines*CL}pt;${CF}"></div></div>`;
    const capJ = (c, slot, lines, fs, lh, extra) => `<div class="cap capj" style="height:${5 + lines*lh}pt;${extra||''}"><div class="a" data-slot="${slot}" data-narrow="0" data-minfill="0.9" data-lh="${lh}" data-lines="${lines}" data-lead="${esc(c.lead||'')}" data-s='${esc(JSON.stringify([].concat(c.s||[])))}' style="font-size:${fs}pt;line-height:${lh}pt;text-align:justify"></div></div>`;
    const foot = 368, capLines = 3;
    if(!sold){
      h += FXS.header(L, {x: -9, y: -9, w: W + 18, h: 63, tx: 0, tw: W, vy: 0, vh: 54, max: big ? 24 : 21, min: 13, pad: 40});
      const HY = 57, lhJ0 = big ? 16.75 : 15.5, HH = foot - 6 - (HY + 8) - 3*lhJ0 - 2, PW = big ? 250 : 222, hw = W - PW - 3;   // owner 11/7: the photo takes the room down to a three-line write-up (no blank band)
      h += SW.heroHtml(D, F.cap.photo, 0, HY, hw, HH, 'front.hero', F.side || roomIds);
      h += `<div class="bluecard" style="left:${hw + 3}pt;top:${HY}pt;width:${PW + 9}pt;height:${441 - HY}pt"></div>`;
      const px = hw + 3 + 22, pw = PW - 22 - 18;
      h += `<div class="abs" style="left:${px}pt;top:${HY + 12}pt;width:${pw}pt;height:${SS*2.15}pt;font:700 ${SS}pt/${SS*1.08}pt var(--fx-font);letter-spacing:.08em;color:#fff;white-space:nowrap;text-transform:uppercase" data-slot="front.status" data-lines="2">Just<br>Listed</div>`;
      const fy = HY + 12 + SS*2.15 + 6, rows = FXS.statRows(L).slice(0, 4);
      h += FXS.factRows(rows, px, fy, pw, foot - 10 - fy, 'front.fact', {padY: 2, np: 17, fs: 9.5, rpad: 0}) + `<div class="hr on" style="left:${px}pt;top:${fy}pt;width:${pw}pt"></div>`;
      // owner 11/7 (p6): the write-up fills the white under the photo, bigger, justified to the photo's edge
      { const ty = HY + HH + 8, lhJ = lhJ0, fsJ = big ? 13 : 11.75, nJ = Math.max(3, Math.floor((foot - 6 - ty)/lhJ)); h += capJ(capC, 'front.hero', nJ, fsJ, lhJ, `position:absolute;left:${M}pt;top:${ty}pt;width:${hw - M - 12}pt;padding-top:0`); }
      h += FXS.footBar(foot, W, 432, hw + 3);
      h += `<div class="abs agentline" style="left:${M}pt;top:${foot + 9}pt;width:330pt"><div class="n" style="font:600 ${big ? 20 : 19}pt/24pt var(--fx-font)" data-slot="agent.name" data-lines="1">${esc(A.name||'')}</div><div class="p" style="font:700 14pt/19pt var(--fx-font)" data-slot="agent.phone" data-lines="1"><i>CELL</i>${esc(A.phone||'')}</div></div>`;
      h += FXS.logoOn(D, px, foot + 10, pw, 42, 'flex-start');
    } else {
      const SS = big ? 50 : 44;   // owner 11/7: "Just Sold" always outsizes the agent info
      h += `<div class="bar" style="left:-9pt;top:-9pt;width:${W + 18}pt;height:${SS*1.3 + 16 + 9}pt"></div>`;   // owner 11/7 (no blank space): the bar fits its heading
      h += `<div class="abs" style="left:0;top:10pt;width:${W}pt;height:${SS*1.3}pt;font:700 ${SS}pt/${SS*1.3}pt var(--fx-font);letter-spacing:.14em;padding-left:.14em;color:#fff;text-align:center;white-space:nowrap;text-transform:uppercase" data-slot="front.status" data-lines="1">Just Sold</div>`;
      const HY = SS*1.3 + 16 + 3, LP = big ? 262 : 232, nameParts = String(A.name || '').split(/\s+/), nm = nameParts.length > 1 ? [nameParts[0], nameParts.slice(1).join(' ')] : [A.name || ''], iw = LP - 22 - 14;
      h += `<div class="bluecard" style="left:-9pt;top:${HY}pt;width:${LP + 9}pt;height:${441 - HY}pt"></div>`;
      const ns = Math.min(...nm.map(t => FXS.fitSize(t, "font-family:Montserrat;font-weight:700", iw, big ? 32 : 28, 18)));
      let yy = HY + 16;
      h += `<div class="abs agentline" style="left:22pt;top:${yy}pt;width:${iw}pt"><div class="n" style="font:700 ${ns}pt/${ns*1.1}pt var(--fx-font);white-space:normal" data-slot="agent.name" data-lines="${nm.length}">${nm.map(esc).join('<br>')}</div></div>`; yy += nm.length*ns*1.1 + 4;
      h += `<div class="abs agentline" style="left:22pt;top:${yy}pt;width:${iw}pt"><div class="d" data-slot="agent.desig" data-lines="1" data-fine="1">REALTOR®</div></div>`; yy += 11 + 10;
      const ps = FXS.fitSize(A.phone || '', "font-family:Montserrat;font-weight:700", iw, big ? 26 : 23, 16);
      h += `<div class="abs agentline" style="left:22pt;top:${yy}pt;width:${iw}pt"><div class="p" style="font:700 ${ps}pt/${ps*1.2}pt var(--fx-font)" data-slot="agent.phone" data-lines="1">${esc(A.phone||'')}</div></div>`; yy += ps*1.2 + 12;
      h += `<div class="hr on" style="left:22pt;top:${yy}pt;width:${iw}pt"></div>`;
      // owner 11/7: a Just Sold card never lists the house's features: a seller call to action, centered in the room above the address
      { const ay0 = 441 - 9 - 64 - 12, cta = (SW.data().companion || {}).justSold || {}, ch = cta.ctaHead || 'Thinking about selling?', cl = cta.ctaNext || cta.ctaShort || 'Call or text me anytime.';
        const chs = FXS.fitSize(ch, "font-family:Montserrat;font-weight:700", iw, big ? 22 : 19, 13), bh = chs*1.25*2 + 6 + 20, by = yy + Math.max(10, (ay0 - yy - bh)/2);
        h += `<div class="abs" style="left:22pt;top:${by}pt;width:${iw}pt;height:${bh}pt;color:#fff" data-slot="front.cta" data-lines="3"><div style="font:700 ${chs}pt/${chs*1.25}pt var(--fx-font);white-space:normal">${esc(ch)}</div><div style="margin-top:6pt;font:500 ${big ? 12 : 11}pt/18pt var(--fx-font);color:var(--fx-on-blue-soft);white-space:nowrap">${esc(cl)}</div></div>`; }
      const addrT = FXS.addr(L).toUpperCase(), as = FXS.fitSize(addrT, "font-family:Montserrat;font-weight:700;letter-spacing:.1em", iw, 13, 9);
      h += `<div class="abs" style="left:22pt;top:${441 - 9 - 64}pt;width:${iw}pt;height:${as*1.4}pt;font:700 ${as}pt/${as*1.4}pt var(--fx-font);letter-spacing:.1em;color:#fff;white-space:nowrap;overflow:hidden" data-slot="front.address" data-lines="1">${esc(addrT)}</div>`;
      h += `<div class="abs" style="left:22pt;top:${441 - 9 - 64 + as*1.4 + 2}pt;width:${iw}pt;height:14pt;font:500 9pt/14pt var(--fx-font);letter-spacing:.16em;color:var(--fx-on-blue-soft);white-space:nowrap;overflow:hidden" data-slot="front.place" data-lines="1">${esc(FXS.placeCaps(L))}</div>`;
      const hx = LP + 3 + 18, hw = W - hx - M, HH = big ? 214 : 206;
      h += SW.heroHtml(D, F.cap.photo, hx, HY + 14, hw, HH, 'front.hero', F.side || roomIds);
      // owner 11/7 (p8): the agent's note in type about twice the old size, filling the white down to the logo, justified to the photo's edge
      { const ty = HY + 14 + HH + 8, lhJ = big ? 19.5 : 18, fsJ = big ? 14.75 : 13.5, nJ = Math.max(2, Math.floor((432 - 42 - 12 - ty)/lhJ)); h += capJ(capC, 'front.hero', nJ, fsJ, lhJ, `position:absolute;left:${hx}pt;top:${ty}pt;width:${hw}pt;padding-top:0`); }
      h += FXS.logo(D, W - M - 170, 432 - 42 - 8, 170, 38, 'flex-end');
    }
  } else {
    // ---------------- BACK (round 2d, the owner 10/29: the navy runs across the whole back; mail zones as in the Just Listed library, scaled to pt) ----------------
    // zones (pt, trim coordinates): postage 84 x 98.25 top right, address block 240 x 112.5, barcode strip 342 x 45 bottom right, all clear of art and type
    const dx = W - 648, X = 30, G = 10, B = K.back || {};
    const Z = {postage: [552 + dx, 12, 84, 98.25], address: [405 + dx, 187.5, 240, 112.5], barcode: [306 + dx, 387, 342, 45]};
    window.__zones = Z; window.__cardX = 40;
    // owner 11/7: the royal blue runs to every edge of the card (the set's header bar becomes the deep band across the top); only the postage box, the address block and the barcode strip sit on light panels (the tint, luminance 242)
    const onBlue = '--fx-text:#e3ebf8;--fx-ink:#ffffff;--fx-mute:#c9d6ec';
    h += `<div class="abs" style="left:-9pt;top:-9pt;width:${W + 18}pt;height:${H + 18}pt;background:var(--fx-blue)"></div>`;
    const pnl = (x, y, w, hh) => `<div class="abs mailp" data-mail-panel="1" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${hh}pt;background:var(--fx-tint)"></div>`;
    h += pnl(Z.postage[0] - 6, -9, W + 9 - (Z.postage[0] - 6), Z.postage[1] + Z.postage[3] + 6 + 9);
    h += pnl(Z.address[0] - 6, Z.address[1] - 6, W + 9 - (Z.address[0] - 6), 301 - (Z.address[1] - 6));
    h += pnl(Z.barcode[0] - 8, 386.5, W + 9 - (Z.barcode[0] - 8), H - 386.5 + 9);
    const rx = Z.address[0], lw = rx - G - X;          // right column starts at the address block's left edge; the left zone is everything left of it
    const rw = Z.postage[0] - 12 - rx;                 // the photo under the return address: left of the postage box
    const short = String(L.address||'').replace(/\s+(street|st\.?|avenue|ave\.?|drive|dr\.?|road|rd\.?|lane|ln\.?|boulevard|blvd\.?|court|ct\.?|way|place|pl\.?)$/i, '');
    h += `<div class="pc-bstatus" data-fine="1" style="left:-9pt;top:-9pt;width:${Z.postage[0] - 6 + 9}pt;height:${9 + 38}pt;padding:9pt ${Z.postage[0] - 6 - (rx - 10)}pt 0 ${X + 9}pt;background:var(--fx-blue-deep)" data-slot="back.status" data-lines="1"><span class="st">${esc(statusWord)}</span><span class="ln"></span><span class="ad">${esc(sold && big ? L.address : short)}</span></div>`;
    const n = big ? 4 : 3, phH = big ? 85.5 : 86, capLines = sold ? 4 : 5, py = 56;   // equal photo columns, all ending at the gray box's right edge
    const ps = (B.photos || []);
    const lp = ps.slice(0, n), rp = null, pw = (lw - G*(n - 1))/n;
    let rowH = '';
    (sold ? [] : lp).forEach((c, i) => { const x = X + i*(pw + G);
      rowH += `<div class="abs" style="left:${x}pt;top:${py}pt;width:${pw}pt;height:${phH}pt">${SW.photo(D, c.photo, 'position:absolute;inset:0', 'back.photo'+i)}</div>`;
      rowH += cap(c, 'back.photo'+i, capLines, `position:absolute;left:${x}pt;top:${py + phH}pt;width:${pw}pt;padding-top:5pt`); });
    if(rp){ rowH += `<div class="abs" style="left:${rx}pt;top:${py}pt;width:${rw}pt;height:${phH}pt">${SW.photo(D, rp.photo, 'position:absolute;inset:0', 'back.photo'+n)}</div>`;
      rowH += cap(rp, 'back.photo'+n, capLines, `position:absolute;left:${rx}pt;top:${py + phH}pt;width:${rw}pt;padding-top:5pt`); }
    h += `<div class="row" style="${'--fx-text:#e3ebf8;--fx-ink:#ffffff;'}position:absolute;left:0;top:0;width:${W}pt;height:${H}pt;display:block;pointer-events:none">${rowH}</div>`;
    // the set's signature on the blue between the postage box and the address block: the three facts (Just Listed), the neighborhood in tracked bold caps like the header (Just Sold)
    { const gy0 = Z.postage[1] + Z.postage[3] + 6 + 5, gy1 = Z.address[1] - 6 - 5, gx = rx, gw = W - 22 - gx;
      if(!sold){ const its = FXS.statItems(L).slice(0, 3).map(FXS.statParts), ns = big ? 21 : 19;
        h += `<div class="abs" style="left:${gx}pt;top:${gy0 + 6}pt;width:${gw}pt;height:${gy1 - gy0 - 12}pt;display:flex;border-top:.75pt solid rgba(255,255,255,.4);border-bottom:.75pt solid rgba(255,255,255,.4)">${its.map((p, i) => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;${i ? 'border-left:.75pt solid rgba(255,255,255,.4)' : ''}"><div style="font:700 ${ns}pt/1.05 var(--fx-font);color:#fff;white-space:nowrap" data-slot="back.stat.${i}" data-lines="1">${esc(p.n)}</div><div style="font:600 6.5pt/1.2 var(--fx-font);letter-spacing:1.2pt;text-transform:uppercase;color:#e3ebf8;white-space:nowrap;margin-top:2pt" data-slot="back.stat.l${i}" data-lines="1" data-fine="1">${esc(p.l)}</div></div>`).join('')}</div>`; }
      else if(L.neighborhood){ const nb = String(L.neighborhood).toUpperCase(), ss = FXS.fitSize(nb, "font-family:Montserrat;font-weight:700;letter-spacing:.2em", gw, 18, 11);
        h += `<div class="abs" style="left:${gx}pt;top:${gy0}pt;width:${gw}pt;height:${gy1 - gy0}pt;display:flex;align-items:center;font:700 ${ss}pt/1.2 var(--fx-font);letter-spacing:.2em;color:#fff;white-space:nowrap" data-slot="back.signature" data-lines="1">${esc(nb)}</div>`; } }
    // return address beside the postage box, right-justified to the right edge of the far-right photo below it (the owner 10/30 standing rule)
    const ret = [b.brokerage || ''].concat([].concat(b.returnAddress || b.address || []).flatMap(a => String(a).split('\n'))).filter(Boolean).slice(0, 3);
    h += `<div class="pc-ret" data-fine="1" data-slot="back.return" style="color:#e3ebf8;left:${rx}pt;top:18pt;width:${rw}pt;text-align:right"><b style="color:#fff">${esc(ret[0] || '')}</b>${ret.slice(1).map(t => '<br>' + esc(t)).join('')}</div>`;
    // the write-up (Just Listed) or the steps (Just Sold) under the photos, left zone only
    const capNorm = new Set(ps.flatMap(c => [].concat(...(c.s || []).map(x => [].concat(x)))).map(x => String(x).toLowerCase().replace(/[^a-z0-9 ]/g, '').slice(0, 40)));
    const aboutC = B.about && B.about.s ? Object.assign({}, B.about, {s: (() => { const kept = B.about.s.filter(x => ![].concat(x).some(a => capNorm.has(String(a).toLowerCase().replace(/[^a-z0-9 ]/g, '').slice(0, 40)))); return kept.length >= 2 ? kept : B.about.s; })()}) : B.about;
    const cardH = 85.5, cardY = 301;
    const bx = sold ? py : py + phH + 5 + capLines*CL + 10, bh = 292 - bx;
    if(!sold){
      const lh = 16, lines = Math.floor((bh - 11 - 11 - 3 - 9)/lh), pad = (bh - 14 - lines*lh)/2;

  const f = SW.frame(D, W, H, h);

  if(!front && sold){ const bx_ = document.getElementById('stepsbox'); if(bx_ && bx_.scrollHeight > bx_.clientHeight + .5) issues.push({slot: 'back.steps', kind: 'steps-overflow', detail: 'the steps do not fit their box'}); }

  window.photoPlacements = SW.placements;

  // ---- the Just Sold front: the facts sit centered between the address and the agent's name, measured on the letters (ink, from the font's own metrics) ----
  function ink(el, noPunct){ const c = (ink.c || (ink.c = document.createElement('canvas').getContext('2d'))); let top = Infinity, bot = -Infinity;
    const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); let nd; const rg = document.createRange();
    while((nd = w.nextNode())){ const t = nd.textContent.trim(); if(!t) continue; const cs = getComputedStyle(nd.parentElement);

    set(0, 0);

    let mt = (aib + g/k - ab) * k, mb = (ag - (nit - g/k)) * k; mt = Math.max(2, mt); mb = Math.max(0, mb); set(mt, mb);

  }
  function fitDisc(){ const el = document.getElementById('pcdisc'); if(!el) return; let fs = 8;

    for(; fs > 6; fs -= .25){ el.style.fontSize = fs + 'pt'; if(ok()) break; }

  // owner 11/7 back rule: the standard contact card runs full width, and the light mail panels stay around the three postal zones (they never grow into a plain light block)
  // owner 11/7: the Just Sold back's six bullets are long (8 words or more) and the box is at least 85% filled with text (heading, bullet lines, call line against the box's inner height)
  function jsCheck(){ const out = [], box = document.querySelector('.sheet .pc-wbox'); if(!box) return out;
    const items = [...box.querySelectorAll('.stp, .hb .tx')], hOf = el => { const r = document.createRange(); r.selectNodeContents(el); return [...r.getClientRects()].reduce((m, q) => Math.max(m, q.bottom), 0) - [...r.getClientRects()].reduce((m, q) => Math.min(m, q.top), 1e9); };
    items.forEach((el, i) => { const w = el.textContent.trim().split(/\s+/).filter(Boolean).length; if(w < 8) out.push({slot: 'back.step' + i, kind: 'js-bullet-too-short', detail: `${w} words: "${el.textContent.trim()}"`}); });
    if(items.length < 6) out.push({slot: 'back.steps', kind: 'fewer-than-six-bullets', detail: items.length + ' bullets'});
    const cs = getComputedStyle(box), inner = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom), line = el => { const r = document.createRange(); r.selectNodeContents(el); const rs = [...r.getClientRects()].filter(q => q.width > 1); const lh = parseFloat(getComputedStyle(el).lineHeight) || 0; const rows = new Set(rs.map(q => Math.round(q.top))).size; return rows*lh; };

  // the Just Sold bullets take the largest size at which every one sets in full lines inside the box, then the leading opens until the box is at least 85% filled
  function fitSteps(){ const box = document.getElementById('stepsbox'), list = document.getElementById('stepslist'); if(!box || !list) return;
    const stp = [...list.querySelectorAll('.stp')], its = [...list.querySelectorAll('.it')], fits = () => box.scrollHeight <= box.clientHeight + .5;
    const okLines = () => stp.every(e => { const L = SW.lines(e); return L.n === 1 || L.fill >= .76; });
    const apply = (fs, m) => { list.style.fontSize = fs + 'pt'; list.style.lineHeight = (fs*m) + 'pt'; stp.forEach(e => { e.dataset.lh = fs*m; }); its.forEach(it => { it.querySelector('.bx').style.marginTop = (fs*m*.42) + 'pt'; }); SW.fill(); };
