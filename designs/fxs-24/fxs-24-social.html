<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · FX extras · FX24 socials</title>
<link rel="stylesheet" href="fx.css">
<link rel="stylesheet" href="fxs24-tokens.css">
<link rel="stylesheet" href="fxs24-marks.css">
<script src="fxs24-tk.js"></script>
<script src="fxs24.js"></script>
<script src="../engine/ivory.js"></script>
<script src="../engine/ohlib.js"></script>
<script src="../engine/factrepeat.js"></script>
<script src="fxpage.js"></script>
<script src="fxs24-patch.js"></script>
<!--
  fxs-24 socials: Open House, Just Listed and Just Sold in every size, plus the carousel slides. One page; it draws by FXP.kind(D) and D.piece.shape.
  The flyer's pieces carry through, doing the same job: the royal blue header bar (the street on Open House pieces, JUST LISTED / JUST SOLD at 45 pt on the others);
  the whole house in one hero box beside the blue fact list; the event on a blue band (label, the weekday directly above the date on its left edge, the date at 41 pt bold,
  the time at 60% of that on one line); the REALTOR(R) perks on a tinted card; a strip of rooms with their names; the agent and the one logo on the blue footer.
  Just Sold sells the agent: the name and number big on a blue panel beside the house. No new copy.
-->
<style>
  .abs{position:absolute}
  .photo{position:absolute;overflow:hidden;background:#d6dde8}
</style>
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
FXS.hookCheck();
FXP.start(['800 20pt "Montserrat"', '700 20pt "Montserrat"', '600 20pt "Montserrat"', '500 20pt "Montserrat"', '400 20pt "Montserrat"'], D => {
  const esc = Ivory.esc, L = D.listing, C = D.companion || {}, A = D.agent || {};
  const kind = FXP.kind(D), shape = D.piece.shape, {W, H} = FXP.size(D), F = FXP.floor(shape); F.ev = F.event;
  const E = OHL.event(D), hero = OHL.hero(D, 'straight');
  if(E.time) E.time = E.time.replace(/(\d)\s+(am|pm)\b/gi, '$1 $2');
  const MONT = "font-family:'Montserrat'", m = Math.round(W*.04), BLUE = 'var(--fx-blue)', SOFT = 'var(--fx-on-blue-soft)';
  const front = [], tiny = [];
  const hsOn = OHL.cardMode(D) === 'headshot' && !!A.headshot;
  const ADDR = FXS.addr(L).toUpperCase();
  const wdt = (t, css, rich) => { const m = document.createElement('span'); m.style.cssText = `position:absolute;left:-9999pt;visibility:hidden;white-space:nowrap;${css}`; if(rich) m.innerHTML = t; else m.textContent = t; document.body.appendChild(m); const w = m.getBoundingClientRect().width*.75; m.remove(); return w; };
  // text that fits: the biggest size from max to min at which it runs in <= lines lines in width w. o.rich: html for the body
  const T = o => { const r = T0(o); return o.parts && r.n >= 99 ? T0(Object.assign({}, o, {parts: null, lines: Math.max(o.lines || 1, 3)})) : r; };
  const T0 = o => {
    if(o.slot === 'place') return {html: '', h: 0, s: 0, n: 0, w: 0, ok: true};
    const lines = o.lines || 1, lhk = o.lh || 1.15, txt = o.parts ? o.parts.join(' ') : o.text;
    const css = s => `${MONT};${o.css};font-size:${s}pt;line-height:${(s*lhk).toFixed(2)}pt`;
    const cnt = s => o.rich ? (wdt(o.rich, css(s), true) <= o.w + .3 ? 1 : 99) : o.parts ? (o.parts.every(p => FXP.width(p, css(s)) <= o.w + .3) ? o.parts.length : 99) : FXP.lines(txt, css(s), o.w);
    let s = o.max, n = cnt(s);
    while(n > lines && s > o.min){ s -= .5; n = cnt(s); }
    if(s < o.min) s = o.min;
    n = cnt(s);
    const nn = Math.min(n, 99), h = Math.ceil(nn*s*lhk*100)/100 + 1.4 + (nn > 1 ? 2.5 : 0);
    const wid = nn === 1 ? (o.rich ? wdt(o.rich, css(s), true) : FXP.width(txt, css(s))) : o.w;
    const body = o.rich || (o.parts ? o.parts.map(esc).join('<br>') : esc(txt));
    const html = `<div class="abs" style="left:${o.x}pt;top:${o.y}pt;width:${o.w}pt;height:${h}pt;${css(s)};text-align:${o.align || 'left'};white-space:${nn === 1 ? 'nowrap' : 'normal'};overflow:hidden"${o.small ? ' data-small="1"' : ''} data-slot="${o.slot}" data-lines="${nn}">${body}</div>`;
    return {html, h, s, n: nn, w: wid, ok: n <= lines};
  };
  const caps = (wt, tr, col) => `font-weight:${wt};letter-spacing:${tr}em;text-transform:uppercase;color:${col}`;

  const rect = (x, y, w, h, css) => `<div class="abs" aria-hidden="true" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${h}pt;${css || ''}"></div>`;
  const pic = (id, x, y, w, h, css) => OHL.photo(D, id, `left:${x}pt;top:${y}pt;width:${w}pt;height:${h}pt;${css || ''}`);
  const roomsAll = () => OHL.photos(D).filter(id => id !== hero && !Ivory.fullHouse(D, id) && !/^(stair|foyer|hall|closet|laundry)/.test(id)).filter((id, i, arr) => arr.findIndex(o => FXP.fam(o) === FXP.fam(id) || FXS.labelFor(o) === FXS.labelFor(id) || FXS.roomGroup(o) === FXS.roomGroup(id)) === i);
  const used = new Set([hero]);
  // the hero: one box, a cover crop set on the house; the whole house must be inside it
  const heroBox = (id, x, y, w, h, bias) => {
    const P = D.photos[id] || {}, mm = P.house, src = Ivory.src(D, id); let pos = '50% 0%', zoom = null;
    if(mm && P.w && P.h){
      let sc = Math.max(w/P.w, h/P.h); const cl = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
      if(bias != null && P.cropLeft != null) sc = Math.max(sc, w/((1 - P.cropLeft)*P.w));   // the photo's own crop: start past a neighbor's turret, zoomed to fill the frame
      const iw = P.w*sc, ih = P.h*sc;
      let ox = cl((mm.left + mm.right)/2*iw - w/2, 0, Math.max(0, iw - w)); const oy = cl((mm.top + mm.bottom)/2*ih - h/2, 0, Math.max(0, ih - h));
      if(bias != null && P.cropLeft != null){ ox = Math.min(P.cropLeft*iw, Math.max(0, iw - w)); zoom = {iw, ih, ox, oy}; }
      pos = `${iw > w ? (ox/(iw - w)*100).toFixed(1) : 50}% ${ih > h ? (oy/(ih - h)*100).toFixed(1) : 0}%`;
      if(mm.left*iw - ox < -.5 || mm.right*iw - ox > w + .5 || mm.top*ih - oy < -.5 || mm.bottom*ih - oy > h + .5) tiny.push({slot: 'front', kind: 'hero-house-cut', detail: `the hero box ${Math.round(w)} x ${Math.round(h)} pt does not hold the whole house`});
    }
    const img = src ? (zoom ? `<img src="${esc(src)}" alt="" style="position:absolute;max-width:none;width:${zoom.iw}pt;height:${zoom.ih}pt;left:${-zoom.ox}pt;top:${-zoom.oy}pt">` : `<img src="${esc(src)}" alt="" style="width:100%;height:100%;object-fit:cover;object-position:${pos}">`) : '';
    return `<div class="photo" data-photo="${esc(id)}" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${h}pt">${img}</div>`;
  };
  const minHero = w => Math.ceil(w*.56);   // tall enough for the whole house of every sample house
  // the header bar: tracked bold caps white on the blue, one line, never under the phone floor
  const hbar = (text, slot, maxS, trk, h0, bw, pf, dn) => { bw = bw || W; let tr = trk || .16, t;
    for(; tr >= .02; tr -= .02){ t = T({slot, text, css: caps(700, tr.toFixed(2), '#fff'), x: 0, y: 0, w: bw - m, max: maxS, min: F.ev, lh: 1.1, align: 'center'}); if(t.ok && t.n === 1) break; }
    const pad = Math.max(7, Math.round(t.s*(pf || .45))), h = Math.max(h0 || 0, Math.ceil(t.h) + 2*pad);
    const t2 = T({slot, text, css: caps(700, tr.toFixed(2), '#fff'), x: m/2 + tr*t.s/2, y: (h - t.h)/2 + (dn || 0)*t.s, w: bw - m, max: t.s, min: t.s, lh: 1.1, align: 'center', lines: t.n});
    return {h, html: rect(0, 0, bw, h, `background:${BLUE}`) + t2.html}; };
  // the blue fact list: four stats (numerals 17 pt or more), then real selling facts when the panel has the room
  const statPanel = (x, y, w, h, bleed) => {
    const np = Math.max(17, F.body*1.35), rows = FXS.statRows(L).slice(0, 4), pitch = h/rows.length, pad = Math.round(w*.12);
    let out = rect(x, y, w + (bleed || 0), h, `background:${BLUE}`);
    rows.forEach((r, i) => { const ry = y + i*pitch;
      out += `<div class="abs" style="left:${x + pad}pt;top:${ry}pt;width:${w - 2*pad}pt;height:${pitch}pt;display:flex;align-items:center;white-space:nowrap;color:#fff;overflow:hidden" data-small="1" data-slot="fact.${i}" data-lines="1"><span style="display:flex;align-items:baseline"><b style="${MONT};font-weight:700;font-size:${np}pt;margin-right:${F.small*.5}pt">${esc(r.n)}</b><span style="${MONT};font-weight:500;font-size:${F.small}pt;letter-spacing:.07em;text-transform:uppercase">${esc(r.l)}</span></span></div>`;
      if(i) out += rect(x + pad, ry, w - 2*pad, .75, 'background:var(--fx-rule-on)'); });
    return out; };
  // a horizontal stat band (tall shapes): the four stats across
  const statBand = (x, y, w, h) => { const np = Math.max(17, F.body*1.35), rows = FXS.statRows(L).slice(0, 4), cw = w/rows.length;
    let out = rect(x, y, w, h, `background:${BLUE}`);
    rows.forEach((r, i) => { out += `<div class="abs" style="left:${x + i*cw}pt;top:${y}pt;width:${cw}pt;height:${h}pt;display:flex;flex-direction:column;align-items:center;justify-content:center;white-space:nowrap;color:#fff;${i ? 'border-left:.75pt solid rgba(255,255,255,.28);' : ''}" data-small="1" data-slot="fact.${i}" data-lines="2"><b style="${MONT};font-weight:700;font-size:${np}pt;line-height:1.1">${esc(r.n)}</b><span style="${MONT};font-weight:500;font-size:${F.small}pt;letter-spacing:.05em;text-transform:uppercase;line-height:1.3">${esc(r.l)}</span></div>`; });
    return out; };
  // the event on a blue band: label, weekday directly above the date on its left edge, the date at 41 pt, the time at 60% of it; the perks card under it on a REALTOR(R) piece
  const evBand = (x, y, w, o) => { o = o || {}; const px = Math.round(w*.045), iw = w - 2*px, out = []; let yy = y + (o.top == null ? 10 : o.top);
    const lab = T({slot: 'oh.label', text: E.label.toUpperCase(), css: caps(700, .14, '#fff'), x: x + px, y: yy, w: iw, max: F.ev*1.25, min: F.ev, lh: 1.15}); out.push(lab.html); yy += lab.h + 4;
    const wk = T({slot: 'oh.weekday', text: E.weekday.toUpperCase(), css: caps(600, .28, SOFT), x: x + px, y: yy, w: iw, max: o.center ? F.body*1.5 : F.body*1.05, min: F.body, lh: 1.15, small: 1}); out.push(wk.html); yy += wk.h + 1;
    const dt = T({slot: 'oh.date', text: String(E.monthDay || E.long), css: `font-weight:700;color:#fff`, x: x + px - 1, y: yy, w: iw + 1, max: o.dmax || 41.25, min: F.ev, lh: 1.08}); out.push(dt.html); yy += dt.h + 2;
    let tmw = 0; if(E.time){ const tm = T({slot: 'oh.time', text: E.time, css: `font-weight:700;color:#fff`, x: x + px, y: yy, w: iw, max: Math.max(dt.s*.6, F.ev), min: F.ev, lh: 1.15}); out.push(tm.html); yy += tm.h; tmw = tm.w; }
    yy += o.bot == null ? 11 : o.bot;
    // o.center: the block of lines (still flush left with each other) sits centered on the band, so neither half of the band is left empty
    // owner review 11/8 (FXS-24 p18): every line under "Public Open House" is centered on its own, not flush left as a block
    if(o.center && lab.n === 1 && dt.n === 1){ const ws = [lab.w, wk.w, dt.w - 1, tmw], wrap = (h, d) => `<div style="position:absolute;left:${d}pt;top:0">${h}</div>`;
      return {h: yy - y, html: out.map((h, i) => wrap(h, Math.max(0, (iw - ws[i])/2))).join('')}; }
    return {h: yy - y, html: out.join('')}; };
  const perksCard = (x, y, w) => { const items = [[E.refreshments, 'oh.refreshments', 700], [E.note, 'oh.note', 600]].filter(i => i[0]); if(!items.length) return {h: 0, html: ''};
    const px = 10, py = 7, rows = []; let yy = y + py;
    items.forEach(([t, slot, wt]) => { const r = T({slot, text: t, css: `font-weight:${wt};color:var(--fx-ink)`, x: x + px, y: yy, w: w - 2*px, max: Math.max(F.body*1.1, 13), min: F.body, lines: 3, lh: 1.2, align: 'left'}); rows.push(r.html); yy += r.h + 2; });
    const h = yy - 2 + py - y;
    return {h, html: `<div class="abs" data-box="oh.box" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${h}pt;background:var(--fx-tint);border:.75pt solid var(--fx-rule);border-top:1.5pt solid ${BLUE}"></div>` + rows.join('')}; };
  // the horizontal address block on a white field: the street in caps, the place in blue, one line of real selling facts
  const addrBlock = (x, y, w, o) => { o = o || {}; const out = []; let yy = y;
    const ad = T({slot: 'address', text: ADDR, css: caps(700, .1, 'var(--fx-ink)'), x, y: yy, w, max: o.max || F.ev*1.35, min: F.ev, lh: 1.15, align: o.align || 'left'}); out.push(ad.html); yy += ad.h + 2;
    const pl = T({slot: 'place', text: FXS.placeCaps(L), css: caps(600, .18, BLUE), x, y: yy, w, max: Math.max(F.small*1.15, 11), min: F.small, lh: 1.2, small: 1, align: o.align || 'left'}); out.push(pl.html); yy += pl.h;
    if(o.facts){ const sf = FXS.sellingRows(D, 9999, 8).map(r => r.l); let line = ''; for(const t of sf){ const c = line ? line + ' · ' + t : t; if(wdt(c, `${MONT};font-weight:600;font-size:${F.small}pt;letter-spacing:.06em`) <= w) line = c; else break; }
      if(line){ const t0 = T({slot: 'x', text: line, css: caps(600, .06, 'var(--fx-text)'), x, y: 0, w, max: F.small*1.1, min: F.small, lh: 1.2, small: 1}); yy = o.factsY ? o.factsY(yy, t0.h) : yy + 4;
        const fl = T({slot: 'sellfacts', text: line, css: caps(600, .06, 'var(--fx-text)'), x, y: yy, w, max: F.small*1.1, min: F.small, lh: 1.2, small: 1, align: o.align || 'left'}); out.push(fl.html); yy += fl.h; } }
    return {h: yy - y, html: out.join('')}; };
  // the strip of n rooms with their names (never the cover's rooms twice)
  const strip = (x, y, w, h, n, pick, lc) => { const ids = (pick || roomsAll().filter(i => !used.has(i))).slice(0, n); if(ids.length < 2) return {h: 0, html: ''};
    const g = 6, pw = (w - (ids.length - 1)*g)/ids.length; let out = '';
    const names = ids.map(id => FXS.labelFor(id).replace(/\.$/, '')), cs = (tr, up) => `${MONT};font-weight:600;font-size:${F.small}pt;letter-spacing:${tr}em;${up ? 'text-transform:uppercase' : ''}`;
    const fit = (tr, up) => names.every(nm => wdt(up ? nm.toUpperCase() : nm, cs(tr, up)) <= pw - 1);
    let tr = .06, up = true; if(!fit(tr, up)){ tr = 0; if(!fit(tr, up)){ up = false; } }   // the full room name always prints: tighter, then title case
    if(new Set(ids.map(id => FXS.roomGroup(id))).size < ids.length) tiny.push({slot: 'strip', kind: 'strip-same-room', detail: 'two photos in the strip show the same room'});
    ids.forEach((id, i) => { used.add(id); out += pic(id, x + i*(pw + g), y, pw, h);
      const nm = up ? names[i].toUpperCase() : names[i];
      if(wdt(nm, cs(tr, up)) > pw - 1) tiny.push({slot: 'strip.label' + i, kind: 'strip-label-truncated', detail: `"${nm}" does not fit its ${Math.round(pw)} pt column`});
      out += T({slot: 'strip.label' + i, text: nm, css: `font-weight:600;letter-spacing:${tr}em;${up ? 'text-transform:uppercase;' : ''}color:${lc || BLUE}`, x: x + i*(pw + g), y: y + h + 3, w: pw, max: F.small, min: F.small, lh: 1.2, small: 1, lines: 1}).html; });
    window.__strip = (window.__strip || []).concat(ids.map((id, i) => ({id, name: names[i]})));
    return {h: h + 3 + F.small*1.3, html: out}; };
  // the blue footer: the agent (headshot when there is one) and the one logo in white
  const footH = (compact) => Math.ceil(Math.max(F.body*1.5, 19)*1.1 + (compact ? 0 : F.small*1.3) + Math.max(F.body*1.2, 15.5)*1.15 + 22);
  const footRowH = () => Math.ceil(Math.max(Math.max(F.body*1.5, 19)*1.1, Math.max(F.body*1.2, 15.5)*1.15) + 20);
  const footer = (y, h, o) => { o = o || {}; const FW = o.w || W; const hs = hsOn && !o.noHs ? Math.round(h*(o.row ? .66 : .72)) : 0, tx = m + (hs ? hs + 9 : 0), lw = Math.min(FW*(o.row ? .27 : .34), h*(o.row ? 3.2 : 3.6)), tw = FW - m - (o.noLogo ? 0 : Math.max(lw, (o.logoH || 0)*3.4) + 14) - tx, out = [];
    out.push(rect(0, y, FW, H - y, `background:${BLUE}`));
    if(hs) out.push(`<div class="abs" style="left:${m}pt;top:${y + (h - hs)/2}pt;width:${hs}pt;height:${hs}pt;overflow:hidden"><img src="${esc(Ivory.src(D, A.headshot) || A.headshot)}" alt="" style="width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block"></div>`);
    const ns = Math.max(F.body*1.5, 19), ps = Math.max(F.body*1.2, 15.5);
    if(o.logoOnly){ out.length = 1; const lh2 = Math.min(h*.62, lw/3.4); out.push(OHL.logo(D, 'dark', `left:${m}pt;top:${y + (h - lh2)/2}pt;width:${Math.min(FW*.5, lh2*3.4)}pt;height:${lh2}pt;justify-content:flex-start`)); return {html: out.join(''), h}; }
    const nm = T({slot: 'agent.name', text: A.name || '', css: 'font-weight:700;color:#fff', x: tx, y: 0, w: tw, max: o.ns || ns, min: F.body, lh: 1.1}), ph = T({slot: 'agent.phone', text: A.phone || '', css: 'font-weight:600;color:#fff', x: tx, y: 0, w: tw, max: o.ps || ps, min: F.body, lh: 1.15});
    const upv = o.up || 0;
    if(o.row){ let done = false;
      for(let sz = o.ns || ns; sz >= F.body && !done; sz -= .5){ const psz = Math.max(F.body, sz*.9), nm1 = T({slot: 'agent.name', text: A.name || '', css: 'font-weight:700;color:#fff', x: tx, y: 0, w: tw, max: sz, min: sz, lh: 1.1}), ph1 = T({slot: 'agent.phone', text: A.phone || '', css: 'font-weight:600;color:#fff', x: tx, y: 0, w: tw, max: psz, min: psz, lh: 1.15});
        if(nm1.n === 1 && ph1.n === 1 && nm1.w + ph1.w + 22 <= tw){ const mid = y + h/2; done = true;
          out.push(nm1.html.replace(/top:[\d.]+pt/, `top:${mid - nm1.h/2}pt`), ph1.html.replace(/left:[\d.]+pt/, `left:${tx + nm1.w + 22}pt`).replace(/top:[\d.]+pt/, `top:${mid - ph1.h/2}pt`)); } }
      if(done){ if(!o.noLogo) out.push(OHL.logo(D, 'dark', `left:${FW - m - lw}pt;top:${y + (h - Math.min(h*.6, lw/3.4))/2}pt;width:${lw}pt;height:${Math.min(h*.6, lw/3.4)}pt;justify-content:flex-end`)); return {html: out.join(''), h}; } }
    const showD = !o.compact && !!(A.nar || /realtor/i.test(A.designation || '')), dsH = showD ? F.small*1.3 : 0, tot = nm.h + dsH + ph.h + 2, ty = y + (h - upv - tot)/2;
    out.push(T({slot: 'agent.name', text: A.name || '', css: 'font-weight:700;color:#fff', x: tx, y: ty, w: tw, max: nm.s, min: nm.s, lh: 1.1}).html);
    if(showD) out.push(T({slot: 'agent.desig', text: 'REALTOR®', css: caps(500, .3, SOFT), x: tx, y: ty + nm.h, w: tw, max: F.small, min: F.small, lh: 1.2, small: 1}).html);
    out.push(T({slot: 'agent.phone', text: A.phone || '', css: 'font-weight:600;color:#fff', x: tx, y: ty + nm.h + dsH + 2, w: tw, max: ph.s, min: ph.s, lh: 1.15}).html);
    if(!o.noLogo){ const lgh = o.logoH || Math.min(h*.6, lw/3.4), lgw = o.logoH ? Math.max(lw, o.logoH*3.4) : lw; out.push(OHL.logo(D, 'dark', `left:${FW - m - lgw}pt;top:${y + (h - lgh)/2}pt;width:${lgw}pt;height:${lgh}pt;justify-content:flex-end`)); }
    return {html: out.join(''), h}; };

  // the story's agent bar (owner review 11/8): name and phone about 2x, the logo 1.5x. Two rows on the blue: the headshot, the name and the phone; then a rule, REALTOR(R) left and the logo right
  const footBig = (nsB, psB, lgB) => { const pad = 12, cw = W - 2*m, hs = hsOn ? Math.round(nsB*1.1 + psB*1.15 + 6) : 0, tx = m + (hs ? hs + 12 : 0), tw = W - m - tx;
    const nm = T({slot: 'agent.name', text: A.name || '', css: 'font-weight:700;color:#fff', x: tx, y: 0, w: tw, max: nsB, min: F.body, lh: 1.1}), ph = T({slot: 'agent.phone', text: A.phone || '', css: 'font-weight:700;color:#fff', x: tx, y: 0, w: tw, max: psB, min: F.body, lh: 1.15});

      else if(ad){ const fs = el => parseFloat(getComputedStyle(el).fontSize); if(mo.getBoundingClientRect().top >= ad.getBoundingClientRect().top - .5) tiny.push({slot: 'moment', kind: 'lockup-not-above-address', detail: 'the lockup sits below the address'}); if(fs(mo) < fs(ad)*1.4) tiny.push({slot: 'moment', kind: 'lockup-too-small', detail: `lockup ${(fs(mo)*.75).toFixed(1)} pt against the address ${(fs(ad)*.75).toFixed(1)} pt`}); } }
    document.querySelectorAll('[data-slot="caption"]').forEach(el => { const px = parseFloat(getComputedStyle(el).fontSize), want = CAPCS*96/72; if(Math.abs(px - want) > .6) tiny.push({slot: 'caption', kind: 'caption-size-differs', detail: `caption is ${(px*72/96).toFixed(1)} pt, the carousel's one size is ${CAPCS.toFixed(1)} pt`}); }); (window.__strip || []).forEach((r, i) => { const el = document.querySelector(`[data-slot="strip.label${i}"]`); if(!el) return; if(el.textContent.trim().toLowerCase() !== r.name.toLowerCase()) tiny.push({slot: 'strip.label' + i, kind: 'strip-label-mismatch', detail: `"${el.textContent.trim()}" is not the room name "${r.name}"`}); if(el.scrollWidth > el.clientWidth + 1) tiny.push({slot: 'strip.label' + i, kind: 'strip-label-truncated', detail: r.name}); }); };
  return {W, H, issues: tiny, after, html: `<div class="page" data-page="${esc(D.piece.id)}" style="position:relative;overflow:hidden;width:${W}pt;height:${H}pt;background:var(--fx-paper)">${front.join('')}</div>`};
});
</script>
