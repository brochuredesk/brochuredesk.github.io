<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · Garden Serif postcards</title>
<link rel="stylesheet" href="gs.css">
<link rel="stylesheet" href="gs-fo.css">
<script src="gs.js"></script>
<script src="../engine/baths.js"></script>
<script src="../engine/agentcard.js"></script>
<script src="../engine/factrepeat.js"></script>
<script>window.Ivory = window.Ivory || {esc: s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))};</script>
<script src="gs-fo.js"></script>
<!--
  BrochureDesk · Garden Serif · Just Listed and Just Sold postcards (the hand of the approved Open House library flyer P10).
  data.piece.card = "listed" | "sold", data.piece.size = "6x11" (792 x 432 pt) | "6x9" (648 x 432 pt), data.piece.side = "front" | "back". Print adds 9 pt bleed.
  Fronts: Just Listed, the house to a seam with the charcoal an L around it (status column, agent strip); Just Sold, the house full height
  beside the ruled lockup, the question and the note on the pale card. Backs: the charcoal and its slate foot band run the full width; the
  mail zones are small light markups. Copy comes from data.sw.pc.{jl|js}.{front|back}; gs.js picks the sentences that fill each box.
-->
<style>
  /* Garden Serif postcards; tokens in gs-tokens.css. Font properties one by one. */
  .pc-col{position:absolute;display:flex;flex-direction:column}
  .pc-wbox{background:var(--gs-lift);color:var(--fx-soft);padding:10pt 16pt 9pt;display:flex;flex-direction:column;overflow:hidden}
  .pc-wbox.ruled{background:transparent;border-top:1.5pt solid var(--gs-accent);border-bottom:1.5pt solid var(--gs-accent)}
  .pc-wbox .k{font-family:var(--gs-font);font-weight:500;font-size:8.8pt;line-height:12pt;letter-spacing:3.4pt;text-transform:uppercase;color:var(--gs-accent);white-space:nowrap;overflow:hidden;margin-bottom:3pt;align-self:flex-start}
  .pc-wbox .p{font-family:var(--gs-serif);font-style:italic;font-weight:700;overflow:hidden;color:var(--fx-on)}
  .pc-bstatus{position:absolute;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
  .pc-bstatus .st{font-family:var(--gs-serif);font-style:italic;font-weight:700;font-size:24pt;line-height:1;letter-spacing:-.5pt;color:var(--fx-on);text-transform:uppercase;overflow:visible}
  .pc-bstatus .ln{flex:1;height:1.2pt;background:var(--gs-accent);margin:0 12pt;min-width:16pt}
  .pc-bstatus .ad{font-family:var(--gs-serif);font-style:italic;font-weight:700;font-size:16pt;line-height:1;color:var(--fx-on)}
  .pc-steps .it{display:flex;gap:12pt;align-items:flex-start;white-space:normal;overflow:hidden;border-top:1.5pt solid var(--gs-rule);padding:1.5pt 0}
  .pc-steps .it:first-child{border-top:0}
  .pc-steps .stp{min-width:0}
  .pc-steps .bx{flex:none;line-height:1.1;width:14pt;text-align:center;font-family:var(--gs-serif);font-style:italic;font-weight:700;font-size:1.3em;color:var(--gs-accent)}
  .pc-call{font-family:var(--gs-serif);font-style:italic;font-weight:700;font-size:13pt;line-height:16pt;color:var(--gs-accent);white-space:nowrap;overflow:hidden}
  .pc-disc{position:absolute;font-size:6pt;line-height:10pt;color:var(--fx-soft);overflow:hidden;white-space:nowrap}
  .pc-ret{position:absolute;font-family:var(--fx-font);font-weight:500;font-size:9pt;line-height:11pt;letter-spacing:.2pt;color:var(--fx-on);overflow:hidden;height:34pt}
  .pc-ret b{font-weight:700;letter-spacing:1.4pt;text-transform:uppercase;color:var(--fx-ink)}
  .gs-jcaps{position:absolute;font-family:var(--gs-font);font-weight:600;font-size:10pt;line-height:14pt;letter-spacing:1.8pt;text-transform:uppercase;color:var(--gs-accent);white-space:nowrap;overflow:hidden}
  .cap .a{font-weight:400}
  /* the back's compact contact row (owner 11/16): on the slate foot band, email and web side by side */
  .pc-back .cc{background:transparent}
  .pc-back .cc .cc-lines{display:flex;column-gap:12pt}
  .pc-back .cc .cc-panel{flex-direction:row;align-items:center;column-gap:10pt}
  .pc-back .cc .cc-panel > div:last-child{text-align:left}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const esc = SW.esc, b = D.brand || {}, A = D.agent || {}, L = D.listing, P = D.piece || {};
  document.body.dataset.mode = D.mode || 'email';
  await SW.setup(D);
  const sold = P.card === 'sold', big = P.size === '6x11', front = P.side === 'front';
  const W = big ? 792 : 648, H = 432;
  const K = ((D.sw || {}).pc || {})[sold ? 'js' : 'jl'] || {};
  const hsSrc = A.headshot && ((D.photos||{})[A.headshot] ? D.photos[A.headshot].src : A.headshot) || '';
  const statusWord = sold ? 'Just Sold' : 'Just Listed';
  const issues = [];
  const logo = (cls, src, area, maxh, style) => `<div class="logo ${cls}" data-area="${area}" data-maxh="${maxh}" style="${style||''}">${src ? `<img src="${esc(src)}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage||'')}</span>`}</div>`;
  const CL = big ? 13.5 : 12.5, CF = big ? 'font-size:10.9pt;line-height:13.5pt;' : '';   // the 6x11 sets its type up from the 6x9 (11 pt against 9.5), not the same size with more room
  const cap = (c, slot, lines, extra, min) => (c = (c.photo ? FXS.augment(D, c) : c), `<div class="cap" style="height:${5 + lines*CL}pt;${extra||''}"><div class="a" data-min="${min || 2}" data-nopair="1" data-slot="${slot}" data-narrow="0" data-nstep="6" data-lh="${CL}" data-lines="${lines}" data-lead="${esc(c.lead||'')}" data-s='${esc(JSON.stringify([].concat(c.s||[]))).replace(/'/g,'&#39;')}' style="height:${lines*CL}pt;${CF}"></div></div>`);
  let h = '';

  if(front){
    // The FX14 hand on a postcard front. A white frame top and side, the whole house in it, a taupe block around it with the status in Pinyon Script.
    // JL: "Just Listed" in script beside the house, the horizontal address, three facts; under the house the caption ("Front.", the draws) and the agent and logo along the foot.
    // JS: sells the agent: "Just Sold" in the same script lockup, the name and phone big on the left, the house on the right with the agent's own note, the logo.
    const F = K.front || {};
    const draws = list => { const w = x => /gated|roof|pergola|deck|park|garage|island|stone|corner|pool/i.test([].concat(x)[0]) ? 0 : 1; return (list || []).map((x, i) => [w(x), i, x]).sort((p, q) => p[0] - q[0] || p[1] - q[1]).map(t => t[2]); };
    const capC = sold ? {lead: '', s: (F.note || {}).s || (F.cap || {}).s} : (F.caption ? {lead: F.caption.lead, s: F.caption.s.concat(draws((F.about || {}).s || []))} : {lead: 'Front.', s: draws((F.about || {}).s || (F.cap || {}).s)});
    const norm = x => String(x).toLowerCase().replace(/[^a-z0-9 ]/g, '').slice(0, 40), allAlts = list => [].concat(...(list || []).map(x => [].concat(x)));
    const backSet = new Set([].concat(allAlts(((K.back || {}).about || {}).s), ...((K.back || {}).photos || []).map(c => allAlts(c.s)), allAlts((K.back || {}).steps6), allAlts((K.back || {}).steps)).map(norm));
    const backAll = allAlts(((K.back || {}).about || {}).s).map(String);   // the back's About box
    if(capC.s){ const kept = capC.s.filter(x => ![].concat(x).some(a => backSet.has(norm(a)))); if(kept.length >= 2) capC.s = kept; }
    // the caption's own first sentence stays; a later one that says a fact the back's About box says (the deck and pergola, in other words) drops out
    if(capC.s && capC.s.length > 2){ const tail = capC.s.slice(1).filter(x => ![].concat(x).some(a => backAll.some(b => SW.sameFact(String(a), b)))); if(tail.length >= 1) capC.s = [capC.s[0]].concat(tail); }
    const roomIds = [...new Set([].concat(((D.sw||{}).back||{}).photos||[], ((D.sw||{}).left||{}).photos||[]).map(c => c.photo))].filter(id => (D.photos||{})[id] && !(D.photos[id]||{}).fullHouse && id !== F.cap.photo && !((K.back || {}).photos || []).some(c => c.photo === id || SW.space(D, c.photo) === SW.space(D, id))).slice(0, 2);
    // ---- Garden Serif fronts. Two different cards in one hand.
    // Just Listed: the house across the top right from the bleed down to one straight seam, the charcoal an L around it (the column of words
    // and the agent's strip under the seam); the neighborhood in the seam tab; JUST / LISTED in the flyer's tracked Crimson capitals,
    // the thin accent rule, the street, the facts, the highlights on ruled lines. A wide house runs across the whole top instead.
    // Just Sold: the house full height on the left, its edge a gold rule; on the right, centered, JUST SOLD and the street between two
    // accent rules (the sign-in sheet's ruled lockup), the question, the note on the pale card, the agent over the logo. No house features.
    const k = big ? 1.12 : 1, pid = FO.heroId(D, F.cap.photo);
    const word = sold ? 'Just Sold' : 'Just Listed', hood = FXS.hood(L), city = FXS.placeLine(L), ad = String(L.address || '');
    const crimC = "font-family:'Libre Baskerville';font-weight:600;letter-spacing:3pt", facts = FXS.statItems(L).filter(t => !/^Built/.test(t)).join('  ·  ').toUpperCase();
    const capsFit = (t, w, max, wt, tracks) => { for(const ls of tracks){ const fs = FXS.fitSize(t, `font-family:Instrument Sans;font-weight:${wt};letter-spacing:${ls}pt`, w, max, 8.5); if(FXS.width(t, `font-family:Instrument Sans;font-weight:${wt};letter-spacing:${ls}pt;font-size:${fs}pt`) <= w - 12) return {fs: Math.max(8.5, fs), ls}; } return {fs: 8.5, ls: tracks[tracks.length - 1]}; };
    const factsLine = (x, y, w, al) => { let ft = facts, c = capsFit(ft, w, 10.5*k, 600, [1.8, 1.2, 0.7, 0.3]); if(FXS.width(ft, `font-family:Instrument Sans;font-weight:600;letter-spacing:${c.ls}pt;font-size:${c.fs}pt`) > w - 12){ ft = facts.replace(/\s+·\s+/g, ' · '); c = capsFit(ft, w, 10*k, 600, [1.2, 0.7, 0.3, 0, -0.2]); } return `<div class="abs gs-jcaps" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${14*k}pt;font-size:${c.fs}pt;line-height:${14*k}pt;letter-spacing:${c.ls}pt${al ? ';text-align:' + al + ';text-indent:' + c.ls + 'pt' : ''}" data-slot="front.facts" data-lines="1">${esc(ft)}</div>`; };
    const icapsC = "font-family:'Libre Baskerville';font-style:italic;font-weight:700;letter-spacing:-0.5pt;text-transform:uppercase", italC = "font-family:'Libre Baskerville';font-style:italic;font-weight:700";
    const status = (t, x, y, w, fs, slot, al) => `<div class="abs gs-icaps" style="left:${x}pt;top:${y}pt;width:${w + 4}pt;height:${fs*1.1}pt;font-size:${fs}pt;line-height:${fs*1.1}pt${al ? ';text-align:' + al : ''}" data-slot="${slot}" data-lines="1">${esc(t)}</div>`;
    const serif = (t, x, y, w, fs, slot, extra) => `<div class="abs gs-ital" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${fs*1.25}pt;font-size:${fs}pt;line-height:${fs*1.25}pt;${extra || ''}" data-slot="${slot}" data-lines="1">${esc(t)}</div>`;
    const HF = big ? 13.7 : 12.6;   // the highlights' type (owner 11/17: more of them, set bigger, down to the agent's line)
    const tags = w => { const tg = [].concat(((K.front || {}).highlights || []), FXS.tagFacts(D).tags).filter(t => FXS.width(t, `font-family:Instrument Sans;font-weight:500;font-size:${HF}pt`) < w - 16*k - 4).filter((t, i, arr) => !arr.slice(0, i).some(u => SW.sameFact(t, u))); const sc = t => (/\b(19|20)\d\d\b/.test(t) ? 4 : 0) + (/\d/.test(t) ? 1 : 0) + Math.min(t.length, 30)/30; return tg.map((t, i) => [sc(t), i, t]).sort((a, b) => b[0] - a[0] || a[1] - b[1]).map(x => x[2]); };
    // a highlight on the sign-in sheet's ruled line: a short accent dash, the fact, a hairline under it
    const hl = (t, i, x, y, w, rh) => `<div class="abs" style="left:${x}pt;top:${y + rh/2 - 0.6}pt;width:${8*k}pt;height:1.2pt;background:var(--gs-accent)"></div><div class="abs" style="left:${x + 16*k}pt;top:${y}pt;width:${w - 16*k}pt;height:${rh}pt;font-weight:500;font-size:${HF}pt;line-height:${rh}pt;font-family:var(--gs-font);color:var(--gs-on);white-space:nowrap;overflow:hidden" data-slot="front.hl.${i}" data-lines="1">${esc(t)}</div><div class="gs-hair" style="left:${x}pt;top:${y + rh - 1}pt;width:${w}pt"></div>`;
    const note = (x, y, w, n, lh, fs, pad) => { fs = fs || 10*k; pad = pad || 13; return `<div class="gs-lt"><div class="gs-card" id="notebox" data-pad="${pad}" style="${sold ? 'background:color-mix(in srgb, var(--gs-dark) 16%, #fff);' : ''}left:${x}pt;top:${y}pt;width:${w}pt;height:${n*lh + 2*pad}pt"></div><div class="abs cap"><div class="a" style="position:absolute;left:${x + 16}pt;top:${y + pad}pt;width:${w - 32}pt;height:${n*lh}pt;font-size:${fs}pt;line-height:${lh}pt;color:var(--fx-soft)" data-slot="front.note" data-j3="1" data-maxh="${n*lh}" data-lh="${lh}" data-lines="${n}" data-min="3" data-narrow="0" data-flexh="1" ${FXS.sd(capC.s || [])}></div></div></div>`; };
    const nameW = ns => FXS.width(A.name || '', `font-family:'Libre Baskerville';font-style:italic;font-weight:700;letter-spacing:0pt;font-size:${ns}pt`), phoneW = ns => FXS.width(A.phone || '', `font-family:Instrument Sans;font-weight:600;font-size:${ns*0.74}pt`);
    const desT = A.designation ? (A.nar || /realtor/i.test(A.designation) ? 'REALTOR®' : A.designation) : '', DS = 8.6*k, desW = desT ? FXS.width(desT, `font-family:Instrument Sans;font-weight:500;letter-spacing:2pt;font-size:${DS}pt`) + 9*k : 0;
    const nameSpan = ns => `<span style="font-style:italic;font-weight:700;font-size:${ns}pt;line-height:${ns*1.25}pt;font-family:var(--gs-serif);letter-spacing:0pt;color:var(--gs-on)" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</span>`;
    const desSpan = ns => `<span style="font-weight:500;font-size:${DS}pt;line-height:${ns*1.25}pt;font-family:var(--gs-font);letter-spacing:2pt;color:var(--gs-accent);margin-left:${9*k}pt" data-slot="agent.desig" data-lines="1">${esc(desT)}</span>`;
    const phoneSpan = (ns, ml) => `<span style="font-weight:600;font-size:${ns*0.74}pt;line-height:${ns*1.1}pt;font-family:var(--gs-font);color:var(--gs-on)${ml ? `;margin-left:${ml}pt` : ''}" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</span>`;
    // the agent's one line (name, REALTOR(R), phone) and the one logo at the far end, centered top to bottom in a strip of height hh
    const agentStrip = (x, y, w, ns, hh) => { const bw = nameW(ns) + desW + 18*k + phoneW(ns), lw = Math.min(150*k, w - bw - 24);
      return `<div class="abs" style="left:${x}pt;top:${y + (hh - ns*1.25)/2}pt;width:${bw + 6}pt;white-space:nowrap;line-height:${ns*1.25}pt">${nameSpan(ns)}${desT ? desSpan(ns) : ''}${phoneSpan(ns, 18*k)}</div>` + FXS.logo(D, x + w - lw, y + 2, lw, hh - 4, 'flex-end'); };
    // the agent at the foot of a column: the name in Libre italic over REALTOR(R) and the phone, the one logo at the column's far end
    const agentFoot = (x, y, w, hh) => { let ns = 15*k; const rowW = () => Math.max(nameW(ns), desW + phoneW(ns) + 4); while(ns > 11 && rowW() > w*0.62) ns -= 0.5; const bw = rowW(), lw = Math.min(118*k, w - bw - 16);
      return `<div class="abs" style="left:${x}pt;top:${y + (hh - ns*1.25 - ns*0.95)/2}pt;width:${bw + 6}pt;white-space:nowrap"><div style="line-height:${ns*1.25}pt">${nameSpan(ns)}</div><div style="line-height:${ns*0.95}pt">${phoneSpan(ns)}${desT ? desSpan(ns*0.8) : ''}</div></div>` + FXS.logo(D, x + w - lw, y + 1, lw, hh - 2, 'flex-end'); };
    const photoAt = (x, y, w, hh) => `<div class="abs" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${hh}pt">${SW.photo(D, pid, 'position:absolute;inset:0', 'front.hero')}</div>`;
    const cq = 'Thinking about selling?';

    // Garden Serif fronts: two cards in one hand. Both carry the rail (the status words repeated up a thin rule along the outer edge).
    // Just Listed: railed on the left; the house bleeding off the top, right and foot, the round room photo laid over its top left corner
    // (over the sky, never the house); JUST / LISTED in the bold italic capitals stacked as large as the column allows, the street in
    // Libre italic, the facts in champagne caps, the highlights on short champagne dashes, the agent's line and the logo at the foot.
    // Just Sold: railed on the right; the house full height on the left; JUST SOLD centered over the street, the question in champagne
    // italic, the note on the blush card sized to its text, the agent and the logo. No house features. A wide house runs across the top.
    const RX = 40, RT = 26, CX0 = 56;
    if(!sold){
      h += GS.rail('left', word + (hood ? ' · ' + hood : ''), {rx: RX, tx: RT, y0: 18, y1: H - 18, fs: 8.6*Math.min(k, 1.06)});
      let PW = big ? 420 : 330; while(PW < W*0.66 && !SW.fits(D, pid, PW + 9, H + 18)) PW += 6;
      const side = SW.fits(D, pid, PW + 9, H + 18), d = (big ? 132 : 116);
      if(side){
        const PX = W - PW, TW = PX - 22 - CX0, parts = []; let y = 24;
        h += photoAt(PX, -9, PW + 9, H + 18);
        // owner 11/23 (p7): on the 6x11 the round room moves off the words (it ran into LISTED's D); four places to pick from (data.jlCircle):
        // 'br' the card's bottom right corner, part of the circle off the trim (default) | 'tr' the top right corner, part off the trim |
        // 'bl' inside the photo's bottom left corner | 'bm' the photo's foot, middle, half off the trim
        const cpos = big ? ((D.piece || {}).jlCircle || D.jlCircle || 'br') : 'word', room = roomIds[0], dc = big && cpos !== 'word' ? 150 : d;
        if(room){ const at = {word: [PX + d*0.08, 22 + d/2], br: [W - dc*0.32, H - dc*0.32], tr: [W - dc*0.32, dc*0.32], bl: [PX + dc/2 + 16, H - dc/2 - 16], bm: [PX + PW/2, H - dc*0.3]}[cpos] || [PX + d*0.08, 22 + d/2];
          const sky = cpos === 'word';
          h += GS.circ(D, room, at[0], at[1], dc, 'front.circle', sky ? {over: 'front.hero', ring: 5, shrink: cpos === 'tr' ? 'tr' : 'tl'} : {ring: 5}).replace('class="gs-circ"', `class="gs-circ" data-rise="0"${cpos === 'br' || cpos === 'tr' || cpos === 'bm' ? ' data-bleed="1"' : ''}`); }
        const cw = TW - (room ? d*0.42 + 8 : 0),   /* the words keep their approved size (and the five bullets under them) wherever the round room sits */ ls = Math.min(FXS.fitSize('LISTED', icapsC, cw, 66*k, 30), 70*k), lh1 = ls*1.0;
        const js = Math.min(ls*1.2, FXS.fitSize('JUST', icapsC, cw - 4, ls*1.2, ls));   /* owner 11/17 fill: JUST set up to run out under LISTED's width (no empty corner beside it) */
        const lex = Math.max(0, Math.min(ls*0.3, (TW - 6 - 0.15*ls - FXS.width('LISTED', `${icapsC};font-size:${ls}pt`))/6)), jex = Math.max(0, Math.min(js*0.3, (Math.min(FXS.width('LISTED', `${icapsC};font-size:${ls}pt`) + 5*lex, cw - 4) - FXS.width('JUST', `${icapsC};font-size:${js}pt`))/3));   /* LISTED tracked out to the column, JUST to LISTED */   /* JUST tracked out to LISTED's width */
        parts.push(status('Just', CX0, y, cw + 40, js, 'front.status').replace('style="left:', `style="letter-spacing:${(-0.5 + jex).toFixed(2)}pt;left:`) + status('Listed', CX0, y + js*1.16, TW + 40, ls, 'front.status2').replace('style="left:', `style="letter-spacing:${(-0.5 + lex).toFixed(2)}pt;left:`)); y += js*1.16 + lh1 + 14;   // owner 11/23 (p6, p7): more space between JUST and LISTED (the J's tail hit the L)
        const as = FXS.fitSize(ad, italC, TW, 21*k, 13); parts.push(serif(ad, CX0, y, TW, as, 'front.address')); y += as*1.3 + 2;
        parts.push(factsLine(CX0, y, TW)); y += 14*k + 12*k;
        const foot = H - 22 - 30*k - 10, rh = big ? 22*k : 24, nT = Math.max(2, Math.min(6, Math.floor((foot - 8 - y)/rh)));
        tags(TW).slice(0, nT).forEach((t, i) => { parts.push(hl(t, i, CX0, y, TW, rh)); y += rh; });
        h += `<div class="abs" id="lock" data-bottom="${y}" data-foot="${foot}" style="left:0;top:0;width:0;height:0">${parts.join('')}</div>`;
        h += `<div class="gs-hair" style="left:${CX0}pt;top:${H - 22 - 30*k - 6}pt;width:${TW}pt"></div>` + agentFoot(CX0, H - 22 - 30*k, TW, 30*k);
      } else {
        // a wide house runs across the top from the rail to the bleed, the round room over its top right corner; the words under it
        let SH = big ? 214 : 206; while(SH < H*0.72 && !SW.fits(D, pid, W + 9 - CX0 + 6, SH + 9)) SH += 4;
        h += photoAt(CX0 - 6, -9, W + 15 - CX0, SH + 9);

    hbs.forEach(el => { const tx = el.querySelector('.tx'), L = SW.lines(tx); delete el.dataset.slot;
      if(L.n > 1 && L.fill < .75) issues.push({slot: 'back.step' + el.dataset.help, kind: 'last-line-short', detail: `last line is ${Math.round(L.fill*100)}% full (75% minimum): "${tx.textContent.slice(-24)}"`}); });
  }
  function mailCheck(){ const out = [], Z = window.__zones, pt = v => v*72/96, sh = document.querySelector('.sheet').getBoundingClientRect();
    const hit = (r, z) => pt(r.left - sh.left) < z[0] + z[2] - .5 && pt(r.right - sh.left) > z[0] + .5 && pt(r.top - sh.top) < z[1] + z[3] - .5 && pt(r.bottom - sh.top) > z[1] + .5;
    // owner 11/16: the photo band runs under the postage box; the light markup laid over it (z-index above the photo) covers the whole zone, so only
    // type, boxes and cards count as in the zone, and a photo counts only where no light markup covers that zone
    const covered = k => [...document.querySelectorAll('.sheet .mailp')].some(p => { const r = p.getBoundingClientRect(), z = Z[k]; return pt(r.left - sh.left) <= z[0] + .5 && pt(r.top - sh.top) <= z[1] + .5 && pt(r.right - sh.left) >= z[0] + z[2] - .5 && pt(r.bottom - sh.top) >= z[1] + z[3] - .5 && +getComputedStyle(p).zIndex >= 4; });
    document.querySelectorAll('.sheet .ph, .sheet .pc-wbox, .sheet .cap, .sheet .cc, .sheet .pc-ret, .sheet .pc-bstatus, .sheet .pc-disc').forEach(el => {
      const r = el.getBoundingClientRect(); for(const k in Z) if(hit(r, Z[k]) && !(el.classList.contains('ph') && covered(k))) out.push({slot: el.dataset.slot || el.className, kind: 'in-mail-zone', zone: k}); });
    return out; }
})();
</script>
