<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · Diagonal postcards</title>
<link rel="stylesheet" href="cd.css">
<link rel="stylesheet" href="cd-fo.css">
<script src="cd.js"></script>
<script src="../engine/baths.js"></script>
<script src="../engine/agentcard.js"></script>

<script>window.Ivory = window.Ivory || {esc: s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))};</script>
<script src="cd-fo.js"></script>
<!--
  BrochureDesk · Diagonal · Just Listed and Just Sold postcards, in the hand of the approved Open House library flyer P13 Diagonal
  (templates/oh-library/p13-diagonal.html) and its sign-in sheet: the kit's paper, photos as prints in white mats, the main-color band
  with the one giant word, Jost throughout, facts centered with short rules, the brokerage logo where the flyer puts it.
  data.piece.card = "listed" | "sold", data.piece.size = "6x11" (trim 792 x 432 pt) | "6x9" (648 x 432 pt), data.piece.side = "front" | "back".
  FRONTS. Just Listed: the house print, the logo top right over the house's real story (short rules between), the agent; the band across
  the foot with JUST LISTED in giant caps | the street and the place. Just Sold, its own card: the band across the head with JUST SOLD and
  the street; the house print laid over the band's edge; the seller question, the note on the white mat, who to call and the logo.
  BACKS (the owner 11/16: the design runs through the whole card): the band runs across the head, down the mail side and across the foot;
  the postage box, the address block and the barcode strip are small white markups set into it; the paper shows in the window it frames
  (two captioned prints, or the six steps on the white mat); the contact card half its old height in one row. No price, no QR.
-->
<style>
  div.pc-wbox{position:absolute;background:#fff;box-sizing:border-box}
  .pc-steps .it{position:absolute;display:flex;align-items:flex-start}
  .pc-steps .num{position:absolute;display:flex;align-items:center;justify-content:center;font-family:var(--cd-font);font-weight:700;color:var(--cd-main-ink)}
  .pc-steps .stp{font-family:var(--cd-font);font-weight:400;color:#1b1b1b;overflow:hidden}
  .pc-disc{position:absolute;font-size:7.5pt;line-height:10pt;font-weight:500;color:var(--fx-soft);overflow:hidden;white-space:nowrap}
  .pc-ret{position:absolute;font-family:var(--cd-font);font-weight:400;font-size:8.6pt;line-height:11pt;color:var(--fx-on);overflow:hidden;height:36pt}
  .pc-ret b{font-weight:700;letter-spacing:1.4pt;text-transform:uppercase}
  .mailp{position:absolute;background:#fff}
  .cap .a{font-weight:400}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const esc = SW.esc, b = D.brand || {}, A = D.agent || {}, L = D.listing, P = D.piece || {};
  document.body.dataset.mode = D.mode || 'email';
  await SW.setup(D);
  const sold = P.card === 'sold', big = P.size === '6x11', front = P.side === 'front';
  const W = big ? 792 : 648, H = 432, k = big ? 1.12 : 1;
  const K = ((D.sw || {}).pc || {})[sold ? 'js' : 'jl'] || {};
  const hsSrc = A.headshot && ((D.photos||{})[A.headshot] ? D.photos[A.headshot].src : A.headshot) || '';
  const word = sold ? 'Just Sold' : 'Just Listed';
  const issues = [];
  const place = [FXS.hood(L), FXS.placeLine(L).replace(/\s+\d{5}(-\d{4})?$/, '')].filter(Boolean).join('  ·  ').toUpperCase(), ad = String(L.address || '');
  // reversed caps never under 8.6 pt: a line that does not fit gives up tracking before it gives up size
  const capsFit = (t, w, max, wt, tracks) => { for(const ls of tracks){ const fs = FXS.fitSize(t, `font-family:Jost;font-weight:${wt};letter-spacing:${ls}pt`, w, max, 8.6); if(FXS.width(t, `font-family:Jost;font-weight:${wt};letter-spacing:${ls}pt;font-size:${fs}pt`) <= w - 12) return {fs: Math.max(8.6, fs), ls}; } return {fs: 8.6, ls: tracks[tracks.length - 1]}; };
  const placeLine = (x, y, w, al, slot, max) => { const c = capsFit(place, w, max || 9.5*k, 600, [3, 2.2, 1.4, 0.8]); return `<div class="cd-place" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${13*k}pt;font-size:${c.fs}pt;line-height:${13*k}pt;letter-spacing:${c.ls}pt;text-align:${al || 'center'}" data-slot="${slot || 'front.place'}" data-lines="1">${esc(place)}</div>`; };
  const disp = (t, x, y, w, fs, slot, al) => `<div class="cd-disp" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${fs*1.08}pt;font-size:${fs}pt;line-height:${fs*1.08}pt;letter-spacing:${Math.min(3, fs*0.05)}pt;text-align:${al || 'center'}" data-slot="${slot}" data-lines="1">${esc(t)}</div>`;
  const street = (x, y, w, max, min, slot, al) => { const fs = FXS.fitSize(ad, 'font-family:Jost;font-weight:600', w - 4, max, min); return {fs, html: `<div class="cd-street" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${fs*1.2}pt;font-size:${fs}pt;line-height:${fs*1.2}pt;text-align:${al || 'center'}" data-slot="${slot || 'front.address'}" data-lines="1">${esc(ad)}</div>`}; };
  const dispFit = (t, w, max, min) => { let f = max; while(f > min && FXS.width(t.toUpperCase(), `font-family:Jost;font-weight:700;letter-spacing:${Math.min(3, f*0.05)}pt;font-size:${f}pt`) > w - 4) f -= 0.5; return f; };
  const desT = A.designation ? (A.nar || /realtor/i.test(A.designation) ? 'REALTOR®' : A.designation) : '';
  let h = '';

  const BF = 'font-family:Jost';
  const wMax = id => { const p = (D.photos || {})[id] || {}; return hh => p.maxW && p.w && p.h ? hh*(p.w/p.h)*p.maxW : Infinity; };
  const wordW = (t, f) => FXS.width(String(t).toUpperCase(), `${BF};font-weight:700;letter-spacing:-.5pt;font-size:${f}pt`);
  const fitWord = (t, w, max, min) => { let f = max; while(f > min && wordW(t, f) > w - 4) f -= 0.5; return f; };
  // the two-tone word on one line: the first word in the page's type color, the rest in the accent (P22's sign-in sheet)
  const twoOne = (a, b2, x, y, f, slot, al) => `<div class="cd-two" style="left:${x}pt;top:${y}pt;width:${wordW(a + ' ' + b2, f) + 8}pt;height:${f*1.02}pt;font-size:${f}pt;line-height:${f*1.02}pt;text-align:${al || 'left'}" data-slot="${slot}" data-lines="1">${esc(a.toUpperCase())} <span class="a2">${esc(b2.toUpperCase())}</span></div>`;
  const agentLine = (x, y, w, al, onDark) => { const ns = Math.min(17*k, FXS.fitSize(A.name || '', `${BF};font-weight:700`, w, 17*k, 11)), c1 = onDark ? 'var(--cd-on-dark)' : 'var(--cd-on)', c2 = onDark ? 'var(--cd-gold-dark)' : 'var(--cd-accent)';
    return {h: ns*1.2 + 15*k, html: `<div class="abs" style="left:${x}pt;top:${y}pt;width:${w}pt;text-align:${al || 'left'};white-space:nowrap">`
      + `<div style="${BF};font-weight:700;font-size:${ns}pt;line-height:${ns*1.2}pt;color:${c1}" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</div>`
      + `<div style="line-height:${15*k}pt">${desT ? `<span style="${BF};font-weight:600;font-size:${8.6*k}pt;letter-spacing:1.6pt;color:${c2};margin-right:10pt" data-slot="agent.desig" data-lines="1">${esc(desT)}</span>` : ''}<span style="${BF};font-weight:600;font-size:${13*k}pt;color:${c1}" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</span></div></div>`}; };
  const koLogo = (x, y, w, hh, just) => { const src = CD.logoSrc(D); return `<div class="abs logo" data-area="${w*hh}" data-maxh="${hh}" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${hh}pt;justify-content:${just || 'center'}">${src ? `<img src="${esc(src)}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage || '')}</span>`}</div>`; };

  const kitLogo = (x, y, w, hh, just) => { const src = CD.logoPaper(D); return `<div class="abs logo" data-area="${w*hh}" data-maxh="${hh}" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${hh}pt;justify-content:${just || 'center'}">${src ? `<img src="${esc(src)}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage || '')}</span>`}</div>`; };
  const wideTwo = (t1, t2, x, y, w, f, slot, wt) => { const lh = +(f*1.04).toFixed(2); return CD.wide(t1, x, y, w, f, lh, slot, {max: f*0.6, wt}) + CD.wide(t2, x, y + lh, w, f, lh, slot + '.2', {max: f*0.6, wt}); };
  const agentInk = (x, y, w, al, nmax) => { const ns = Math.min(nmax || 17*k, FXS.fitSize(A.name || '', `${BF};font-weight:600`, w, nmax || 17*k, 11));
    const aw = Math.max(FXS.width(A.name || '', `${BF};font-weight:600;font-size:${ns}pt`), (desT ? FXS.width(desT, `${BF};font-weight:500;font-size:${8.6*k}pt;letter-spacing:1.6pt`) + 10 + desT.length*1.6 : 0) + FXS.width(A.phone || '', `${BF};font-weight:600;font-size:${13*k}pt`));
    return {ns, aw, h: ns*1.2 + 15*k, html: `<div class="abs" style="left:${x}pt;top:${y}pt;width:${w}pt;text-align:${al || 'left'};white-space:nowrap">`
      + `<div style="${BF};font-weight:600;font-size:${ns}pt;line-height:${ns*1.2}pt;color:var(--cd-on)" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</div>`
      + `<div style="line-height:${15*k}pt">${desT ? `<span style="${BF};font-weight:500;font-size:${8.6*k}pt;letter-spacing:1.6pt;color:var(--cd-accent);margin-right:10pt" data-slot="agent.desig" data-lines="1">${esc(desT)}</span>` : ''}<span style="${BF};font-weight:600;font-size:${13*k}pt;color:var(--cd-accent)" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</span></div></div>`}; };
  const hood = FXS.hood(L), city = FXS.placeLine(L).replace(/\s+\d{5}(-\d{4})?$/, '');
  // the Just Sold note (owner 11/17): the note's own sentences in order (the first two always: the sale and what their home could bring; each later one in or out, any of its wordings),
  // set at the size and length that fill the box best: three lines or more, every line full (86%+ before justifying, so the word gaps stay even; the last 90%+)
  // returns every candidate, best first (the strictest pass first); the first is placed, and after layout fixNote() keeps the first one
  // the browser really sets in its counted lines with the last line 91%+ full
  function noteFill(S, w, room, css, fmax, fmin, lhK){ const all = []; let pass = 0; for(const [lf, of, f0] of [[0.93, 0.86, fmin], [0.92, 0.8, fmin], [0.92, 0.8, fmin - 0.75], [0.85, 0.7, fmin - 0.75]]) all.push(...noteFill1(S, w, room, css, fmax, f0, lhK, lf, of).map(c => Object.assign(c, {sc: c.sc - 6*pass})).filter(c => !all.some(a => a.t === c.t && a.fs === c.fs))), pass++; all.sort((a, b) => b.sc - a.sc); return all.length ? all : null; }
  function noteFill1(S, w, room, css, fmax, fmin, lhK, lf, of){ const sets = (S || []).map(x => [].concat(x)), cands = [];
    const walk = (i, acc) => { if(i === sets.length){ if(acc.length) cands.push(acc.join(' ')); return; } if(i > 1) walk(i + 1, acc); sets[i].forEach(a => walk(i + 1, acc.concat(a))); };
    if(sets.length) walk(0, []);
    const ok = cands.filter(t => (t.match(/\btoo\b/gi) || []).length < 2 && (t.match(/\bready\b/gi) || []).length < 2 && !SW.sameFactIn(t) && !SW.rep5(t)); const best = [];
    for(let fs = fmax; fs >= fmin - 1e-6; fs -= 0.25){ const lh = fs*lhK, nmax = Math.floor((room + 0.5)/lh); if(nmax < 3) continue;
      ok.forEach(t => { const Lw = FO.wrapLines(t, `${css};font-size:${fs}pt`, w - 1), n = Lw.length;   // the note box is set 2 pt narrower (w - 2) and wrapLines breaks past w - 2: the same breaks as the browser
        if(n < 3 || n > nmax || Lw[n - 1] < lf*w || Lw.slice(0, -1).some(x => x < of*w)) return;
        best.push({sc: Math.min(1, n*lh/room)*100 + fs*5, t, n, fs, lh}); }); }
    return best.sort((a, b) => b.sc - a.sc).slice(0, 80); }

  if(front){
    const F = K.front || {}, pid = FO.heroId(D, (F.cap || {}).photo || 'front');
    const hls = (F.highlights || FXS.tagFacts(D).tags || []).slice(0, 4), m = 22;
    if(!sold){
      // ---------- JUST LISTED: the sign-in sheet's header laid on the card. The kit's dark slab holds the top right with the street in white
      // caps, the gold rule and the place (the sign-in sheet's welcome block); its foot on the set's slant. Under the white channel the house
      // fills the right of the card to the bleed, its top cut on the same slant. On the white field at left: JUST / LISTED as P45's display
      // word, spread to one measure; the facts with their line icons; the real highlights; the agent and the logo. ----------
      const mw = wMax(pid); let PX = Math.round(W*0.4); const yF = 120*(big ? 1.04 : 1), foot = CD.y(W + 9, yF), top = CD.y(W + 9, yF + FO.GAP);
      while(PX > W*0.3 && !SW.fits(D, pid, W + 9 - PX, H + 9 - top(W + 9))) PX -= 6;
      while(W + 9 - PX > mw(H + 9 - top(W + 9)) && PX < W*0.5) PX += 4;
      // owner 11/17 (fill rule): where the column is much wider than its longest highlight needs, the house widens toward it (still whole, still 300 ppi)
      { const hlW = Math.max(...hls.map(t => FXS.width(t, `${BF};font-weight:500;font-size:${(big ? 13.5 : 11.5)*k}pt`))) + 22, PXd = m + 20 + Math.max(hlW + 24, W*0.27);
        while(PX - 6 > Math.max(PXd, W*0.3) && SW.fits(D, pid, W + 9 - (PX - 6), H + 9 - top(W + 9)) && W + 9 - (PX - 6) <= mw(H + 9 - top(W + 9))) PX -= 6; }
      const SXs = PX + 26;
      h += CD.field(SXs, W + 9, foot(SXs), foot(W + 9), 'above', -9, 'var(--cd-dark)');
      h += CD.cut(D, pid, PX, top(W + 9), W + 9 - PX, H + 9 - top(W + 9), 'front.hero', 'top', top(PX), top(W + 9));
      { const bx = SXs + 24, bw = W - m - bx, sf = Math.min(38*k, FXS.fitSize(ad.toUpperCase(), `${BF};font-weight:500;letter-spacing:2pt`, bw, 38*k, 12))   /* a short street sets larger across the band (owner 11/17 fill rule) */, cf = 15*k, bh = sf*1.2 + 10 + 12 + cf*1.4, by = m - 2 + Math.max(0, (foot(W - m) - 18 - (m - 2) - bh)/2);
        h += `<div class="cd-band"><div class="cd-addr" style="left:${bx}pt;top:${by}pt;width:${bw}pt;height:${sf*1.2}pt;font-size:${sf}pt;line-height:${sf*1.2}pt;letter-spacing:2pt" data-slot="front.address" data-lines="1">${esc(ad.toUpperCase())}</div><div class="cd-grule" style="left:${bx}pt;top:${by + sf*1.2 + 9}pt;width:36pt"></div>`;
        const pc = capsFit(place, bw, cf, 500, [2.6, 2, 1.4, .8]); h += `<div class="cd-place" style="left:${bx}pt;top:${by + sf*1.2 + 22}pt;width:${bw}pt;height:${cf*1.4}pt;font-size:${pc.fs}pt;line-height:${cf*1.4}pt;letter-spacing:${pc.ls}pt" data-slot="front.place" data-lines="1">${esc(place)}</div></div>`; }
      // the white field
      const cw = PX - 20 - m;
      const ag0 = agentInk(m, 0, cw*0.62, 'left', big ? 21*k : 0), lgH = (big ? 38 : 30)*k, stack = cw - ag0.aw - 14 < 100*k,   // the 6x11: the logo beside the agent, its column's full width in use
        footY = H - m - ag0.h - (stack ? lgH + 8 : 0), ag = agentInk(m, footY, big && stack ? cw : cw*0.62, big && stack ? 'center' : 'left', big ? 21*k : 0);   // the 6x11: the agent and the logo under it centered in the column
      const fl = CD.factSix(L).filter(f => /bed|bath|area/.test(f[0])).slice(0, 3);
      let frh = (big ? 19 : 17)*k, hf = Math.min(...hls.map(t => FXS.fitSize(t, `${BF};font-weight:500`, cw - 22, (big ? 13.5 : 11.5)*k, 8.6))), hp = hf*1.6;   // the 6x11's wide column: bigger rows that reach across it
      let fc = 1; const blockOf = () => Math.ceil(fl.length/fc)*frh + 10 + hls.length*hp;   // fc: the facts in one column, or two side by side when they are short
      // owner 11/17 (p34): the facts and highlights always fit above the agent; the rows tighten first, then the display word gives up size
      let wf = Math.min(78*k, CD.wideFit(['Listed'], cw, 80*k, 36, 3, 400)); const yOf = f => 16 + f*0.2 + 2*(+(f*1.04).toFixed(2)) + 8;
      // the highlights and facts grow toward the photo where the column has the height for it (the fill rule: no empty strip beside them)
      { const fitH = f => Math.min(...hls.map(t => FXS.fitSize(t, `${BF};font-weight:500`, cw - 22, f, 8.6))), base = hf;
        for(let f = 16*k; f > base + 0.1; f -= 0.25){ const g = fitH(f), sv = [hf, hp, frh]; hf = g; hp = g*1.6; frh = Math.max(frh, g*1.5);
          if(yOf(wf*0.66) + blockOf() <= footY - 12) break; [hf, hp, frh] = sv; } }   // the display word may give up to a third so the rows can reach across the column
      while(yOf(wf) + blockOf() > footY - 12 && hp > hf*1.4){ hp -= 0.25; frh = Math.max(15*k, frh - 0.2); }
      while(wf > 40 && yOf(wf) + blockOf() > footY - 12) wf -= 1;
      const wlh = +(wf*1.04).toFixed(2), sty = 16 + wf*0.2; h += wideTwo('Just', 'Listed', m, sty, cw, wf, 'front.status', 400);
      // the rows open up (and the facts set larger) into room the column still has, so no empty band sits around the block (owner 11/17 fill rule)
      let fMax = Math.max((big ? 13.5 : 11.5)*k, hf*1.12); { const y0 = sty + 2*wlh + 8; for(let i = 0; i < 40 && footY - 10 - y0 - blockOf() > 12; i++){ if(hp < hf*2.1) hp += 0.5; if(frh < hf*2.0) frh += 0.5; if(fMax < hf*1.45) fMax += 0.15; if(hp >= hf*2.1 && frh >= hf*2.0) break; } }
      { const fw = Math.max(...fl.map(f => FXS.width(f[1], `font-family:Jost;font-weight:500;font-size:${fMax}pt`))) + Math.max(14*k, hf*1.3) + 9;
        if(fl.length > 2 && 2*fw + 10 <= cw*1.35 && 2*fw + 10 >= cw*0.7) fc = 2; }   // owner 11/17 fill rule: short facts run two to a row across the column, not a narrow stack with empty room beside it
      const y = sty + 2*wlh + 8, blockH = blockOf(), by2 = y + Math.max(0, (footY - 10 - y - blockH)/2);
      if(by2 + blockH > footY - 4) issues.push({slot: 'front.hl', kind: 'text-overlap', detail: 'the highlights run into the agent'});
      // owner 11/17 (fill rule, "centered when appropriate"): where the facts and highlights are much narrower than the column, the block
      // (still left-aligned inside) is centered side to side in it
      const fF = CD.facts(fl, 0, 0, cw, 1, frh, 'x', {ic: Math.max(14*k, hf*1.3), max: fMax, min: 8.6}).fs, icW = Math.max(14*k, hf*1.3) + 9;
      const bW = Math.max(...hls.map(t => 22 + FXS.width(t, `${BF};font-weight:500;font-size:${hf}pt`)), ...fl.map(f => icW + FXS.width(f[1], `font-family:Jost;font-weight:500;font-size:${fF}pt`))), bx = m + (cw - bW > 0.15*cw ? (cw - bW)/2 : 0);
      h += CD.facts(fl, fc > 1 ? m : bx, by2, fc > 1 ? cw : cw - (bx - m), fc, frh, 'front.fact', {ic: Math.max(14*k, hf*1.3), max: fMax, min: 8.6}).html;
      const hy = by2 + Math.ceil(fl.length/fc)*frh + 10;
      hls.forEach((t, i) => { h += `<div class="cd-mk" style="left:${bx + 4}pt;top:${hy + i*hp + hp/2 - 0.75}pt;width:8pt;height:1.5pt"></div><div class="abs" style="left:${bx + 22}pt;top:${hy + i*hp}pt;width:${cw - 22 - (bx - m)}pt;height:${hp}pt;${BF};font-weight:500;font-size:${hf}pt;line-height:${hp}pt;color:var(--cd-on);white-space:nowrap" data-slot="front.hl.${i}" data-lines="1">${esc(t)}</div>`; });
      h += ag.html + (stack ? kitLogo(m, footY + ag.h + 8, big ? cw : Math.max(ag.aw, 110*k), lgH, 'center') : kitLogo(m + ag.aw + 14, footY + (ag.h - lgH)/2, cw - ag.aw - 14, lgH, 'center'));
    } else {
      // ---------- JUST SOLD, its own card: the kit's dark slab runs across the whole head of the card, its foot on the set's slant, with
      // JUST SOLD in P45's display caps in white and the street under it in gold; under the white channel the house holds the lower left,
      // its top cut on the slant; on the white field at right the seller question, the note in the sign-in sheet's tinted panel (sized to

  if(front){ const lock = document.getElementById('lock'); if(lock){ const t0 = +lock.dataset.top, room = +lock.dataset.foot - t0, used = +lock.dataset.bottom; lock.style.top = (t0 + Math.max(0, (room - used)/2)) + 'pt'; }
    const lk = document.getElementById('lockL'); if(lk){ /* the left column of the Just Sold front sits centered between the photo's shoulder and the foot */ } }
  SW.fitLogos();
  ContactCard.fit(document);
  if(!front) fitDisc();
  issues.push(...SW.focus(D)); issues.push(...CD.slashFix(D));
  if(!front){ issues.push(...mailCheck(), ...panelCheck(), ...backCheck()); }
  window.brochureCheck = () => SW.check(D, issues);
  window.photoPlacements = SW.placements;

  function fitDisc(){ const el = document.getElementById('pcdisc'); if(!el) return; let fs = 8;
    const ok = () => [...el.children].every(c => { const r = document.createRange(); r.selectNodeContents(c); return r.getBoundingClientRect().width <= el.clientWidth; });
    for(; fs > 7.5; fs -= .25){ el.style.fontSize = fs + 'pt'; if(ok()) break; }
    el.style.fontSize = Math.max(7.5, fs) + 'pt'; }
  // the six steps: the largest size (12 pt down to 8.6) at which each sets in two lines or fewer inside the box, then the rows spread to fill it
  // the six steps: one column on the 6x9; two columns of three on the 6x11 (each step two full lines, owner 11/1); the largest size
  // (20 pt down to 8.6) at which each sets in two lines or fewer and the column fits, then the rows spread to fill it
  function fitSteps(){ const L = document.getElementById('stepslist'); if(!L) return; const x = +L.dataset.x, y0 = +L.dataset.y, w0 = +L.dataset.w, yB = +L.dataset.b, its = [...L.querySelectorAll('.it')], sq = 18*k, tx = sq + 10, NC = big ? 2 : 1, cg = 20, w = (w0 - (NC - 1)*cg)/NC, per = Math.ceil(its.length/NC);
    const colOf = i => Math.floor(i/per);
    let best = null;
    for(let fs = big ? 20*k : 10.4; fs >= 8.6 - 1e-6; fs -= 0.2){ const lh = fs*1.3, tot = Array(NC).fill(0); const ns = its.map((it, i) => { const s = it.querySelector('.stp'); s.style.cssText = `position:absolute;left:${tx}pt;top:0;width:${w - tx}pt;font-size:${fs}pt;line-height:${lh}pt`; const n = SW.lines(s).n; tot[colOf(i)] += n*lh; return n; });
      if(ns.every(n => n <= 2) && tot.every(t => t + (per - 1)*3 <= yB - y0)){ best = {fs, lh, ns, tot}; break; } }
    if(!best) best = {fs: 8.6, lh: 11.2, ns: its.map(() => 2), tot: Array(NC).fill(per*22.4)};
    const yF = +L.dataset.gb - 10 - 19;   // owner 11/17: the rows spread to fill the tinted area down to the call line above the card
    for(let c = 0; c < NC; c++){ const gap = Math.min(big ? 30 : 16, (Math.max(yB, yF) - y0 - best.tot[c])/Math.max(1, per - 1)); let y = y0;
      its.forEach((it, i) => { if(colOf(i) !== c) return; const s = it.querySelector('.stp'), n = best.ns[i]; s.style.fontSize = best.fs + 'pt'; s.style.lineHeight = best.lh + 'pt'; s.style.height = (n*best.lh) + 'pt'; s.dataset.lines = n;
        it.style.left = (x + c*(w + cg)) + 'pt'; it.style.top = y + 'pt'; it.style.width = w + 'pt'; it.style.height = (n*best.lh) + 'pt';
        const q = it.querySelector('.cd-sq'); q.style.top = (best.lh/2 - sq/2) + 'pt';
        y += n*best.lh + gap; }); }
    // owner 11/17 (p37/p39): the call line follows the steps, and the kicker, the steps and the call move down as one block, centered top to
    // bottom between the top of the tinted area and the top of the contact card
    const kick = document.getElementById('jskick'), call = document.getElementById('jscall'), gt = +L.dataset.gt, gb = +L.dataset.gb;
    const sb = Math.max(...its.map(it => parseFloat(it.style.top) + parseFloat(it.style.height)));
    if(call) call.style.top = (sb + 5) + 'pt';
    const bt = kick ? parseFloat(kick.style.top) : y0, bbm = (call ? sb + 5 + 14 : sb), d = Math.max(0, (gt + gb)/2 - (bt + bbm)/2);
    [kick, call].concat(its).forEach(el => { if(el) el.style.top = (parseFloat(el.style.top) + d) + 'pt'; }); }
  function backCheck(){ const out = [], pt = v => v*72/96, sh = document.querySelector('.sheet').getBoundingClientRect(), X0 = window.__cardX || 30;
    const cc = document.querySelector('.sheet .cc');
    if(!cc) out.push({slot: 'back.card', kind: 'no-contact-card', detail: 'the back has no standard contact card'});
    else { const r = cc.getBoundingClientRect(), l = pt(r.left - sh.left), rr = pt(r.right - sh.left), Wt = pt(sh.width) - 18;
      if(l > X0 + 1 || rr < Wt - X0 - 1) out.push({slot: 'back.card', kind: 'card-not-full-width', detail: `card spans ${l.toFixed(0)}-${rr.toFixed(0)} pt of ${Wt.toFixed(0)}`}); }
    let area = 0; document.querySelectorAll('.sheet [data-mail-panel]').forEach(el => { const r = el.getBoundingClientRect(); const w = Math.min(pt(r.right - sh.left) - 9, pt(sh.width) - 18) - Math.max(pt(r.left - sh.left) - 9, 0), hh = Math.min(pt(r.bottom - sh.top) - 9, 432) - Math.max(pt(r.top - sh.top) - 9, 0); area += Math.max(0, w)*Math.max(0, hh); });
    if(area > .25*(pt(sh.width) - 18)*432) out.push({slot: 'back.panels', kind: 'light-block-too-big', detail: `mail panels cover ${(100*area/((pt(sh.width) - 18)*432)).toFixed(0)}% of the card`});
    if(sold) out.push(...jsCheck());
    return out; }
  // owner 11/7: the Just Sold back's six bullets are long (8 words or more) and the box is at least 85% filled with text
  function jsCheck(){ const out = [], box = document.getElementById('stepsbox'); if(!box) return [{slot: 'back.steps', kind: 'steps-missing'}];
    const items = [...document.querySelectorAll('.stp')];
    items.forEach((el, i) => { const w = el.textContent.trim().split(/\s+/).filter(Boolean).length; if(w < 8) out.push({slot: 'back.step' + i, kind: 'js-bullet-too-short', detail: `${w} words: "${el.textContent.trim()}"`}); });
    if(items.length < 6) out.push({slot: 'back.steps', kind: 'fewer-than-six-bullets', detail: items.length + ' bullets'});
    const bh = +box.dataset.bh || box.getBoundingClientRect().height*0.75, used = items.reduce((n, el) => n + SW.lines(el).n*parseFloat(el.style.lineHeight), 0) + 11 + 14 + 18;
    window.__jsFill = +(used/(bh - 20)).toFixed(2);
    if(used/(bh - 20) < .85) out.push({slot: 'back.steps', kind: 'js-box-under-85', detail: `the Just Sold box is ${Math.round(100*used/(bh - 20))}% full (85% minimum)`});
    return out; }
  function lum(c){ const m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(c); return m ? .2126*m[1] + .7152*m[2] + .0722*m[3] : 0; }
  function panelCheck(){ const out = [], Z = window.__zones, sh = document.querySelector('.sheet').getBoundingClientRect(), pt = v => v*72/96;
    const panels = [...document.querySelectorAll('.mailp')].map(p => { const r = p.getBoundingClientRect(); return {l: pt(r.left - sh.left), t: pt(r.top - sh.top), r: pt(r.right - sh.left), b: pt(r.bottom - sh.top), lum: lum(getComputedStyle(p).backgroundColor)}; });
    if(!panels.length) out.push({slot: 'back.panel', kind: 'mail-panel-missing', detail: 'no light panel under the mail zones'});
    ['postage', 'address', 'barcode'].forEach(k => { const z = Z[k], p = panels.find(q => q.l <= z[0] + .5 && q.t <= z[1] + .5 && q.r >= z[0] + z[2] - .5 && q.b >= z[1] + z[3] - .5);
      if(!p) out.push({slot: 'back.' + k, kind: 'mail-zone-not-light', detail: `the ${k} zone is not fully on a light panel`});
      else if(p.lum < 200) out.push({slot: 'back.' + k, kind: 'mail-zone-not-light', detail: `the ${k} panel's luminance is ${Math.round(p.lum)} (200 minimum)`}); });
    return out; }
  // nothing but the proof guides may sit in the mail vendor's zones (postage, address block, barcode strip)
  function mailCheck(){ const out = [], Z = window.__zones, pt = v => v*72/96, sh = document.querySelector('.sheet').getBoundingClientRect();
    const hit = (r, z) => pt(r.left - sh.left) < z[0] + z[2] - .5 && pt(r.right - sh.left) > z[0] + .5 && pt(r.top - sh.top) < z[1] + z[3] - .5 && pt(r.bottom - sh.top) > z[1] + .5;
    document.querySelectorAll('.sheet .ph, .sheet .pc-wbox, .sheet .cap, .sheet .cc, .sheet .pc-ret, .sheet .pc-disc, .sheet [data-slot^="back."]').forEach(el => {
      const r = el.getBoundingClientRect(); for(const k in Z) if(hit(r, Z[k])) out.push({slot: el.dataset.slot || el.className, kind: 'in-mail-zone', zone: k}); });
    return out; }
})();
</script>
