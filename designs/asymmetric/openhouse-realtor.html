<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · Open house library · Asymmetric</title>
<link rel="stylesheet" href="../engine/ohlib.css">
<script src="../engine/ivory.js"></script>
<script src="../engine/ohlib.js"></script>
<script src="../engine/factrepeat.js"></script>
<!--
  Asymmetric (from reference P18). Trim 612 x 792 pt. Public or REALTOR(R).
  The owner: "also awesome looking." A narrow left column with the event wording stacked in the main color over a tall room
  photo and the listing facts; a wide right column with the house (a block of the main color offset behind it, an
  accent triangle at its corner), the writer's kicker and paragraph, and the date and time large. A band of the main
  color across the foot carries the address and the agent card (the logo is in the card's brokerage panel).
  Event box (the owner 10/30): what's served and the notes sit in a light main-color tint box with a thin main edge under the
  date and time (12 pt); the write-up gives up a line or two for it.
  Type: Red Hat Display (headline, date, address), Outfit (details).
-->
<style>
  .sheet{background:var(--paper);color:var(--ink)}
  .hl{font:700 44pt/44pt 'Red Hat Display';text-transform:uppercase;white-space:nowrap;overflow:hidden;color:var(--main-on-paper);letter-spacing:-.3pt}
  .kick{font:700 19pt/23pt 'Red Hat Display'}
  .body{font:400 12pt/16.5pt Outfit}
  .wd{font:600 12pt/14pt Outfit;letter-spacing:3pt;text-transform:uppercase;color:var(--accent-on-paper);white-space:nowrap}
  .date{font:700 46pt/52pt 'Red Hat Display';white-space:nowrap;overflow:hidden;color:var(--main-on-paper)}
  .time{font:500 28pt/34pt 'Red Hat Display';white-space:nowrap;overflow:hidden}
  .evb{font:500 12pt/16pt Outfit;color:var(--ink)}
  .evb.b{font-weight:600}
  .fact{position:absolute;display:flex;align-items:center;gap:8pt;font:600 10.5pt/13pt Outfit;white-space:nowrap;overflow:hidden}
  .band{position:absolute;left:0;width:612pt;background:var(--main)}
  .band~.on{color:var(--on-main)}
  .addr{font:700 29pt/35pt 'Red Hat Display';white-space:nowrap;overflow:hidden}
  .place{font:400 9.5pt/12pt Outfit;letter-spacing:1.4pt;text-transform:uppercase;white-space:nowrap;overflow:hidden;opacity:.9}
  .oh-agent-name{font-family:'Red Hat Display';font-weight:700}
  .oh-agent{font-family:Outfit}
  .fine{font:400 6.6pt/8pt Outfit;white-space:nowrap;opacity:.65}
</style>
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
OHL.start(['700 10pt "Red Hat Display"', '500 10pt "Red Hat Display"', '400 10pt Outfit', '600 10pt Outfit'], D => {
  const esc = Ivory.esc, L = D.listing, C = D.companion || {}, k = OHL.colors(D);
  const E = OHL.event(D), hero = OHL.hero(D, 'straight');
  const room = OHL.photos(D).find(id => id !== hero && /kitchen|living/i.test(D.photos[id].tags||'')) || OHL.photos(D).find(id => id !== hero && !Ivory.fullHouse(D, id));
  let h = '';
  // right: the house, a main-color block offset behind it, an accent triangle at its top-left corner
  const RX = 222, RW = 360;
  // A house that reaches lower in its photo than the 240 pt frame shows gets a taller frame, never taller than the
  // photo's own shape (11/16/2026, carried from B11: a four-story townhome in a 4:3 photo was cut at the bottom). The
  // block behind it grows with it and the write-up under it gives up the lines. Houses that fit today are unchanged.
  let RH = 240;
  { const P = (D.photos||{})[hero] || {}, hb = OHL.houseInFrame(D, hero, RW, RH);
    if(Ivory.fullHouse(D, hero) && hb && P.house && hb.bottom - .002 > 1)
      RH = Math.max(RH, Math.min(300, Math.floor(RW*P.h/P.w), Math.ceil(P.house.bottom*RW*P.h/P.w + 6))); }
  // the taller frame starts up to 8 pt higher and the gap under it tightens (26 down to 12), so the write-up under it
  // keeps every line it has with the 240 pt frame (owner 11/16: never fewer lines than the normal flyer)
  const XR = RH - 240, PT = 30 - Math.min(8, XR), GU = 26 - Math.max(0, Math.min(14, XR - 8));
  h += `<div class="abs" style="left:${RX+16}pt;top:${PT+16}pt;width:${RW}pt;height:${RH}pt;background:var(--main)"></div>`;
  h += `<svg class="abs" style="left:${RX-18}pt;top:${PT-18}pt;width:44pt;height:44pt" viewBox="0 0 44 44"><polygon points="0,0 44,0 0,44" fill="var(--accent)"/></svg>`;
  h += OHL.photo(D, hero, `left:${RX}pt;top:${PT}pt;width:${RW}pt;height:${RH}pt`);
  // left: headline, tall room, facts
  const lines = OHL.labelLines(E.label);
  lines.forEach((t, i) => h += `<div class="abs hl" style="left:30pt;top:${34 + i*44}pt;width:176pt;height:48pt" data-slot="oh.label" data-lines="1">${esc(t)}</div>`);
  // (11/16/2026, owner: "fix the P18 gap too") the room photo starts just under the headline and runs down to the facts,
  // which sit at the foot of the column (f.after sets its top and height once the headline is stacked)
  h += OHL.photo(D, room, `left:30pt;top:150pt;width:176pt;height:320pt`, 'lroom');
  // right, under the photo: kicker, paragraph, date and time
  let y = PT + RH + GU;   // the write-up moves up under the house (the owner 10/30 evening)
  const mid0 = h.length, y0 = y;
  const kick = String((C.listing||{}).kicker || '').trim();
  if(kick){ h += `<div class="abs kick" style="left:${RX}pt;top:${y}pt;width:${RW}pt;height:24pt;white-space:nowrap;overflow:hidden" data-slot="kicker" data-lines="1">${esc(kick)}</div>`; y += 30; }
  const evBox = (y, pY) => Ivory.eventBox([[E.refreshments,'oh.refreshments','evb b'],[E.note,'oh.note','evb']], RX, y, RW, 16, 3,
    {bg:'color-mix(in srgb, var(--main) 11%, #fff)', line:'var(--main)', lineW:1, padX:14, padY:pY || 10, anchor:0, scale:((D.openHouse||{}).box||{}).w});
  const evH = evBox(0).h;
  const bandTop = 626, needed = 16 + 14 + 52 + 34 + (evH ? evH + 8 : 0);
  // the write-up fills the room down to the date as a full paragraph (owner 10/27/2026)
  // beds, baths, square feet, then two more under the left photo (the owner 10/30 evening): year built and lot size; the write-up
  // never repeats a shown fact, so when the year would cost the paragraph its best sentence, the lot and one story go there instead
  const six = OHL.factSix(L), noYear = six.filter(f => f[0] !== 'cal'), roomPt = bandTop - 8 - needed - y - 16, roomLines = Math.floor(roomPt/16.5);   // the write-up may run to 8 pt above the band's margin (owner 11/16: no paper left under the event box)
  // the write-up: at least three full lines across the column, last line 90%+, justified (owner 11/16); type 12 to 13.5 pt.
  // The most lines that fit win (more write-up); without such a pick, the old picker.
  const pool = (() => { const m = ((C.postcard || {}).master || []).length ? C.postcard.master : String((C.listing || {}).body || '').trim().split(/(?<=[.!?])\s+(?=[A-Z0-9"“])/);
    return m.map(t => String(t).trim()).filter(Boolean); })();
  const fullW = shown => {
    const pl = pool.filter(t => !(window.FactRepeat && FactRepeat.repeats(t, shown).length));
    let q = null;
    for(const fs of [12, 12.5, 13, 13.5]){
      const lh = Math.round(fs*16.5/12*2)/2, z = 'bz' + Math.round(fs*10);
      if(!document.getElementById(z)){ const st = document.createElement('style'); st.id = z; st.textContent = `.body.${z}{font-size:${fs}pt;line-height:${lh}pt}`; document.head.appendChild(st); }
      for(let mask = 1, kk = Math.min(pl.length, 10); mask < (1 << kk); mask += 2){
        const text = pl.filter((_, i) => mask & (1 << i)).join(' '), m = OHL.measure('body ' + z, text, RW, lh);
        if(m.n < 3 || m.n*lh > roomPt || m.fill < .9) continue;
        const sc = m.n*lh*10 + text.length*.01 - fs*.1 + m.fill;
        if(!q || sc > q.sc) q = {text, n: m.n, fill: m.fill, sc, lh, z, j: 1};
      }
    }
    return q;
  };
  const tryF = fs => fullW(fs.slice(0, 5).map(f => f[1])) || OHL.writeup(D, 'body', RW, 16.5, roomLines, fs.slice(0, 5).map(f => f[1]), {narrow: true});
  const wA = tryF(six), wB = tryF(noYear), useB = noYear.length >= 5 && wB.n*(wB.lh || 16.5) > wA.n*(wA.lh || 16.5), wu = useB ? wB : wA;
  let factsHtml = '';
  const fl = (useB ? noYear : six).slice(0, 5), factTop = bandTop - 36 - (fl.length - 1)*25;   // the facts end 18 pt above the band
  fl.forEach(([ic, t], i) => factsHtml += `<div class="fact" style="left:30pt;top:${factTop + i*25}pt;width:176pt;height:18pt"><span style="color:var(--main-on-paper)">${OHL.icon(ic, 16)}</span><span data-slot="fact.${i}" data-lines="1">${esc(t)}</span></div>`);
  const body = wu.text, bn = wu.n, bw = wu.w || RW, blh = wu.lh || 16.5;
  if(body && y + bn*blh + 16 + needed <= bandTop - 8){ h += `<div class="abs body${wu.z ? ' ' + wu.z : ''}" style="left:${RX}pt;top:${y}pt;width:${bw}pt;height:${bn*blh+4}pt${wu.j ? ';text-align:justify' : ''}" data-slot="listing.body" data-lines="${bn}">${esc(body)}</div>`; y += bn*blh + 16; }
  if(E.weekday){ h += `<div class="abs wd" style="left:${RX}pt;top:${y}pt;width:${RW}pt;height:14pt" data-slot="oh.weekday" data-lines="1">${esc(E.weekday)}</div>`; }
  y += 17;
  h += `<div class="abs date" style="left:${RX}pt;top:${y}pt;width:${RW}pt;height:52pt" data-fit="46,30" data-slot="oh.date" data-lines="1">${esc(E.weekday ? E.monthDay : E.long)}</div>`;
  y += 53;
  if(E.time) h += `<div class="abs time" style="left:${RX}pt;top:${y}pt;width:${RW}pt;height:34pt" data-slot="oh.time" data-lines="1">${esc(E.time)}</div>`;
  y += 40;
  let evl = evBox(y + 2);
  // (owner 11/16) when the room under the box is too short for a row of photos, the box grows to the foot of the column
  // with its lines centered top to bottom in it, so no paper is left above the band
  { const left = bandTop - 18 - (y + 2 + evl.h); if(evl.h && left > 0 && left - 14 < 56) evl = evBox(y + 2, 10 + left/2); }
  h += evl.html; y += evl.h + 2;
  // the room left under the date (or the event box) down to the band takes more of the listing's own room photos: two side
  // by side, or one across the column when only one is left (never the house or the left photo again; owner 11/16)
  { const more = OHL.photos(D).filter(id => id !== hero && id !== room && !Ivory.fullHouse(D, id)), top = y + 14, ph = bandTop - 18 - top;
    if(ph >= 56 && more.length){
      if(more.length >= 2){ const w2 = (RW - 10)/2;
        h += OHL.photo(D, more[0], `left:${RX}pt;top:${top}pt;width:${w2}pt;height:${ph}pt`) + OHL.photo(D, more[1], `left:${RX + w2 + 10}pt;top:${top}pt;width:${w2}pt;height:${ph}pt`); }
      else h += OHL.photo(D, more[0], `left:${RX}pt;top:${top}pt;width:${RW}pt;height:${ph}pt`);
      y = bandTop - 18;
    } }
  const issues = y > bandTop - 12 ? [{slot:'oh.note', kind:'overflow', detail:'the event runs into the band'}] : [];
  const shift = Math.max(0, Math.min(12, (bandTop - 14 - y)/2));
  h = h.slice(0, mid0) + `<div class="abs" style="left:0;top:${shift}pt;width:612pt;height:0">` + h.slice(mid0) + `</div>`;
  h += factsHtml;
  // the band: address, then the agent card with the brokerage panel
  h += `<div class="band" style="top:${bandTop}pt;height:${792-bandTop}pt"></div>`;
  h += `<div class="abs on addr" style="left:30pt;top:${bandTop+10}pt;width:552pt;height:35pt" data-slot="address" data-lines="1">${esc(L.address)}</div>`;
  h += `<div class="abs on place" style="left:30pt;top:${bandTop+47}pt;width:360pt;height:12pt" data-slot="place" data-lines="1">${esc(OHL.place(L))}</div>`;
  h += `<div class="abs on" style="left:30pt;top:${bandTop+68}pt;width:552pt;height:.8pt;background:currentColor;opacity:.35"></div>`;
  h += OHL.contact(D, {x:30, y:bandTop+78, w:552, h:60, tone:OHL.toneOn(k.main), logoW:180, logoH:46, nameSize:18, phoneSize:12, lineSize:9, color:'var(--on-main)'}).replace('class="abs oh-agent"', 'class="abs on oh-agent"');
  h += `<div class="abs on fine" style="left:30pt;top:780pt;width:552pt;height:8pt;text-align:right" data-slot="fineprint" data-lines="1" data-fine="1">${esc(C.fineprint || 'Information deemed reliable but not guaranteed.')}</div>`;
  const f = OHL.frame(D, h);
  f.issues = issues;
  f.after = () => {
    const st = OHL.stack([...document.querySelectorAll('.hl')], 44, 24, 34, 1.0), el = document.querySelector('.photo.lroom');
    if(el){ const t = Math.ceil(st.bottom + 16); el.style.top = t + 'pt'; el.style.height = (factTop - 18 - t) + 'pt'; }
  };
  return f;
});
</script>
</body>
</html>
