<script>window.Ivory = window.Ivory || {esc: s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))};</script>
<script src="gl-fo.js"></script>
<!--
  BrochureDesk · Gallery Line · Just Listed and Just Sold postcards (the hand of the approved Open House library flyer B02).
  data.piece.card = "listed" | "sold", data.piece.size = "6x11" (trim 792 x 432 pt) | "6x9" (648 x 432 pt), data.piece.side = "front" | "back".
  Print adds 0.125 in (9 pt) bleed. Both sides: the paper above, the agent's main color below, the accent seam between.
  Front: the whole house hung across the seam inside an 18 pt margin; the status stacked large in Spectral capitals on the paper with
  the street under it; Just Listed: facts, two or three highlights (a dated one first), agent and logo on the field; Just Sold: the
  seller question, the agent's note in a panel sized to its text, the agent's name (half the status size) and the logo. A house too
  wide for a side panel goes across the top, the band under it. No price, no QR.
  Back: status line on the paper, room photos hung across the seam with their captions, a paper panel (the write-up, or the steps),
  the street large between the postage box and the address block, the standard contact card (templates/_shared/agentcard.js), the
  fine print. The seam ends at the postage panel. The right 289.5 pt (4.02 in) is the mail vendor's: return address, postage and
  address zones; drawn as guides on proofs and left clear in print.
-->
<style>
  /* Gallery Line on a postcard: paper panels (the sign-in sheet's table), dash bullets, Spectral status; tokens in gl-tokens.css */
  .pc-col{position:absolute;display:flex;flex-direction:column}
  .pc-wbox{background:var(--gl-paper);color:#333;padding:10pt 16pt 9pt;display:flex;flex-direction:column;overflow:hidden;--fx-on:#161616;--fx-soft:#333;--fx-rule:rgba(0,0,0,.16);--gl-lbl:var(--gl-boxk)}
  .pc-wbox .k{font:600 8.4pt/11pt var(--gl-font);letter-spacing:3pt;text-transform:uppercase;color:var(--gl-boxk);white-space:nowrap;overflow:hidden;margin-bottom:3pt;align-self:flex-start}
  .pc-wbox .p{font-family:var(--gl-serif);font-weight:500;overflow:hidden;color:#222}
  .pc-wbox .p b{font-weight:700;color:var(--fx-on)}
  .gl-hl{position:absolute;display:flex;align-items:center;gap:9pt;font:500 11pt/17pt var(--gl-font);color:var(--gl-on);white-space:nowrap;overflow:hidden}
  .gl-hl:before{content:"";width:10pt;height:1.3pt;background:var(--gl-acc);flex:none}
  .pc-bstatus{position:absolute;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
  .pc-bstatus .st{font:700 10.5pt/1 var(--fx-font);letter-spacing:2.4pt;color:var(--fx-on);text-transform:uppercase}
  .pc-bstatus .ln{flex:1;height:1.2pt;background:var(--gl-seam);margin:0 12pt;min-width:16pt}
  .pc-bstatus .ad{font:500 16pt/1 var(--gl-serif);color:var(--fx-on);padding-bottom:3pt}
  .pc-steps .it{display:flex;gap:8pt;align-items:baseline;white-space:nowrap;overflow:hidden}
  .pc-steps .bx{width:9pt;height:1.3pt;transform:translateY(-3pt);background:var(--gl-boxk);flex:none}
  .pc-wbox.open{background:transparent;padding-left:0!important;padding-right:0!important;--fx-on:var(--gl-on);--fx-soft:var(--gl-soft-on);--fx-rule:rgba(255,255,255,.38)}
  .pc-wbox.open .k{color:var(--gl-acc)}
  .pc-wbox.open .p{color:var(--gl-on)}
  .pc-wbox.open .pc-call{color:var(--gl-on)}
  .pc-steps .bx.num{margin-top:0!important;width:20pt;height:auto;transform:none;background:none;font:500 1.05em/inherit var(--gl-serif);color:var(--gl-acc);letter-spacing:.5pt}
  .pc-call{font:500 13pt/16pt var(--gl-serif);color:#161616;white-space:nowrap;overflow:hidden}
  .pc-disc{position:absolute;font-size:8pt;line-height:10pt;font-weight:400;color:color-mix(in srgb, #ffffff 84%, var(--gl-acc));overflow:hidden;white-space:nowrap}
  .pc-ret{position:absolute;font:500 9pt/11pt var(--fx-font);letter-spacing:.2pt;color:var(--fx-on);overflow:hidden;height:34pt}
  .pc-ret b{font-weight:700;letter-spacing:1.4pt;text-transform:uppercase;color:var(--fx-ink)}
  .cap .a{font-weight:400}
  /* owner 11/16: the postcard contact block in two tight rows: name | cell, email and web on one line; the logo beside the office lines */
  .cc-post{background:transparent!important}
  .cc-post .cc-lines{display:flex;column-gap:12pt;align-items:baseline}
  .cc-post .cc-contact{align-items:baseline!important}
  .cc-post .cc-panel{flex-direction:row!important;align-items:center!important;justify-content:flex-end!important;text-align:left!important}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const esc = SW.esc, b = D.brand || {}, A = D.agent || {}, L = D.listing, P = D.piece || {};
  document.body.dataset.mode = D.mode || 'email';
  await SW.setup(D);
  const sold = P.card === 'sold', big = P.size === '6x11', front = P.side === 'front';
  const W = big ? 792 : 648, H = 432;
  const K = ((D.sw || {}).pc || {})[sold ? 'js' : 'jl'] || {};
  const hsSrc = A.headshot && ((D.photos||{})[A.headshot] ? D.photos[A.headshot].src : A.headshot) || '';
  const statusWord = sold ? 'Just Sold' : 'Just Listed';
  const issues = [];
  const logo = (cls, src, area, maxh, style) => `<div class="logo ${cls}" data-area="${area}" data-maxh="${maxh}" style="${style||''}">${src ? `<img src="${esc(src)}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage||'')}</span>`}</div>`;
  const CL = big ? 14 : 12.5, CF = big ? 'font-size:11.2pt;line-height:14pt;' : '';   // owner 11/16 (p9): three captions side by side on the 6x11 set at 11.2 pt (x1.17 the 6x9) so their lines justify without wide gaps   // 11/16: the 6x11 caption a step bigger (the scale check measures it after the fitter's steps)   // the 6x11 sets its type up from the 6x9 (11 pt against 9.5), not the same size with more room
  const cap = (c, slot, lines, extra, min) => (c = (c.photo ? FXS.augment(D, c) : c), `<div class="cap" style="height:${5 + lines*CL}pt;${extra||''}"><div class="a" data-min="${min || 2}" data-slot="${slot}" data-narrow="0" data-nstep="6" data-lh="${CL}" data-lines="${lines}" data-lead="${esc(c.lead||'')}" data-s='${esc(JSON.stringify([].concat(c.s||[]))).replace(/'/g,'&#39;')}' style="height:${lines*CL}pt;${CF}"></div></div>`);
  let h = '';

  if(front){
    // The FX14 hand on a postcard front. A white frame top and side, the whole house in it, a taupe block around it with the status in Pinyon Script.
    // JL: "Just Listed" in script beside the house, the horizontal address, three facts; under the house the caption ("Front.", the draws) and the agent and logo along the foot.
    // JS: sells the agent: "Just Sold" in the same script lockup, the name and phone big on the left, the house on the right with the agent's own note, the logo.
    const F = K.front || {};
    const draws = list => { const w = x => /gated|roof|pergola|deck|park|garage|island|stone|corner|pool/i.test([].concat(x)[0]) ? 0 : 1; return (list || []).map((x, i) => [w(x), i, x]).sort((p, q) => p[0] - q[0] || p[1] - q[1]).map(t => t[2]); };
    const capC = sold ? {lead: '', s: (F.note || {}).s || (F.cap || {}).s} : (F.caption ? {lead: F.caption.lead, s: F.caption.s.concat(draws((F.about || {}).s || []))} : {lead: 'Front.', s: draws((F.about || {}).s || (F.cap || {}).s)});
    const norm = x => String(x).toLowerCase().replace(/[^a-z0-9 ]/g, '').slice(0, 40), allAlts = list => [].concat(...(list || []).map(x => [].concat(x)));
    const backSet = new Set([].concat(allAlts(((K.back || {}).about || {}).s), ...((K.back || {}).photos || []).map(c => allAlts(c.s)), allAlts((K.back || {}).steps6), allAlts((K.back || {}).steps)).map(norm));
    const backAll = allAlts(((K.back || {}).about || {}).s).map(String);   // the back's About box
    if(capC.s){ const kept = capC.s.filter(x => ![].concat(x).some(a => backSet.has(norm(a)))); if(kept.length >= 2) capC.s = kept; }
    // the caption's own first sentence stays; a later one that says a fact the back's About box says (the deck and pergola, in other words) drops out
    if(capC.s && capC.s.length > 2){ const tail = capC.s.slice(1).filter(x => ![].concat(x).some(a => backAll.some(b => SW.sameFact(String(a), b)))); if(tail.length >= 1) capC.s = [capC.s[0]].concat(tail); }
    const roomIds = [...new Set([].concat(((D.sw||{}).back||{}).photos||[], ((D.sw||{}).left||{}).photos||[]).map(c => c.photo))].filter(id => (D.photos||{})[id] && !(D.photos[id]||{}).fullHouse && id !== F.cap.photo).slice(0, 2);
    // ---- Gallery Line front: B02's gallery wall on a card. The paper above, the main color below, the accent seam between; the whole
    // house hung across the seam (inside an 18 pt margin, never bled); the status word stacked large in wide Spectral capitals on the
    // paper (the mailbox test: JUST LISTED and the house, nothing else, at arm's length). Just Listed: the street and the place on the
    // paper, then on the field the facts, two or three dated or specific highlights set flush left, the agent and the one logo.
    // Just Sold: JUST SOLD about twice the agent's name, the street right under it, the seller question, the agent's note sized to its
    // text, who to call. No house features on Just Sold. ----
    const k = big ? 1.12 : 1, pid = F.cap.photo, M = 18, T0 = 26;
    let PW = big ? 400 : 322; while(PW < W*(big ? 0.62 : 0.6) && !SW.fits(D, pid, PW, H - 2*M)) PW += 6;
    const wideOK = (() => { let sh = big ? 236 : 226; while(sh < H*0.66 && !SW.fits(D, pid, W - 2*M, sh)) sh += 4; return SW.fits(D, pid, W - 2*M, sh); })();
    const stacked = sold ? wideOK : !SW.fits(D, pid, PW, H - 2*M);   // Just Sold is its own composition (the house across the top, the band under it), not the Just Listed card mirrored
    const word = sold ? 'Just Sold' : 'Just Listed', ad = String(L.address || ''), place = [FXS.hood(L), FXS.placeLine(L)].filter(Boolean).join('  ·  ').toUpperCase();
    const STAT = "font-family:Spectral;font-weight:500;letter-spacing:3pt";
    const tags = () => { const all = FXS.tagFacts(D).tags.filter((t, i, arr) => !arr.slice(0, i).some(u => SW.sameFact(t, u))); return all.filter(t => /\b(19|20)\d\d\b/.test(t)).concat(all.filter(t => !/\b(19|20)\d\d\b/.test(t))); };
    const foot = (x0, w, y) => { let f = `<div class="gl-hair" style="left:${x0}pt;top:${y - 9}pt;width:${w}pt"></div>`;
      if(!sold) f += `<div class="abs" style="left:${x0}pt;top:${y}pt;width:${w*0.56}pt"><div style="font:500 ${15*k}pt/${19*k}pt var(--gl-serif);color:var(--gl-on);white-space:nowrap" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</div><div style="font:600 ${12*k}pt/${16*k}pt var(--gl-font);color:var(--gl-on);white-space:nowrap" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</div></div>`;
      return f + FXS.logo(D, sold ? x0 + w*0.5 : x0 + w*0.56, y - 1, sold ? w*0.5 : w*0.44, 34, 'flex-end'); };
    if(!stacked && !sold){
      // owner 11/16 (Book 3 p6/p8: "only three little bullets"): JUST / LISTED as large as the column and the field allow, then on the
      // field the facts and five or six highlights set large (13 pt and up on the 6x9) so the list fills the field down to the agent line.
      // The status size, the bullet count and the bullet size are solved together: the largest status at which five or six bullets still
      // set at 13 pt or more (x1.12 on the 6x11); the bullet block is centered between the facts and the foot.
      // the agent line moves under the house when the whole house still shows in a frame 46 pt shorter: the left column is then the
      // field from the facts to the foot, all of it for the highlights
      const PHr = H - 2*M - 46; let PWr = PW, fr = false; while(PWr <= W*(big ? 0.64 : 0.62)){ if(SW.fits(D, pid, PWr, PHr)){ fr = true; break; } PWr += 6; } if(fr) PW = PWr;
      const PX = W - M - PW, TX0 = T0, TX1 = PX - 22, TW = TX1 - TX0, fy = H - 56, BB = fr ? H - 20 : fy - 9;
      const ef = FXS.fitSize(place, "font-family:Jost;font-weight:500;letter-spacing:3pt", TW, 8.6*k, 8);
      const as = FXS.fitSize(ad, "font-family:Spectral;font-weight:500", TW, 21*k, 14);
      const lsMax = Math.min(FXS.fitSize('LISTED', STAT, TW, 76*k, 34), FXS.fitSize('JUST', STAT, TW, 76*k, 34));
      const tg0 = tags(), HL = 1.42, fit = fs => tg0.filter(t => FXS.width(t, `font-family:Jost;font-weight:500;font-size:${fs}pt`) < TW - 24);
      const geo = ls => { const SY = 30 + 16 + 2*ls + 8 + as*1.25 + 14, top = SY + 12 + 14 + 6; return {SY, top, R: BB - top}; };
      let pick = null;
      for(const floor of [14*k, 13*k, 12*k, 11*k]){ for(let ls = lsMax; ls >= 52*k && !pick; ls -= 1){ const g = geo(ls);
          for(const n of [6, 5]){ const fs = Math.min(14.6*k, g.R/(n*1.55)); if(fs < floor) continue; const tg = fit(fs); if(tg.length >= n){ pick = {ls, n, fs, g, tg: tg.slice(0, n)}; break; } } }
        if(pick) break; }
      if(!pick){ const ls = Math.min(lsMax, 58), g = geo(ls), tg = fit(11*k), n = Math.max(2, Math.min(6, tg.length)); pick = {ls, n, fs: Math.min(15.5*k, g.R/(n*HL)), g, tg: tg.slice(0, n)}; }
      const {ls, g} = pick, slh = ls*1.0, SY = g.SY;
      let y = 30, p = '', f = '';
      p += `<div class="abs gl-eyebrow" style="left:${TX0}pt;top:${y}pt;width:${TW}pt;font-size:${ef}pt;letter-spacing:3pt;color:var(--gl-ink)" data-slot="front.place" data-lines="1">${esc(place)}</div>`; y += 16;
      p += `<div class="abs gl-label" style="left:${TX0 - 2}pt;top:${y}pt;width:${TW + 4}pt;height:${2*slh}pt;font-size:${ls}pt;line-height:${slh}pt;letter-spacing:3pt;white-space:normal" data-slot="front.status" data-lines="2">JUST<br>LISTED</div>`; y += 2*slh + 8;
      p += `<div class="abs gl-serif" style="left:${TX0}pt;top:${y}pt;width:${TW}pt;height:${as*1.25}pt;font-size:${as}pt;line-height:${as*1.25}pt;color:var(--gl-ink)" data-slot="front.address" data-lines="1">${esc(ad)}</div>`;
      window.__SY = SY; h += fr ? GL.field(SY, W, H) : GL.field(SY, W, H, {sx: -9, sw: PX + 9});
      h += `<div class="abs" style="left:${PX}pt;top:${M}pt;width:${PW}pt;height:${fr ? PHr : H - 2*M}pt">${SW.photo(D, pid, 'position:absolute;inset:0', 'front.hero')}</div>`;
      const fx = FXS.statItems(L).filter(t => !/^Built/.test(t)).join('  ·  ').toUpperCase(), fsx = FXS.fitSize(fx, "font-family:Jost;font-weight:600;letter-spacing:1.6pt", TW, 10.5*k, 8.6);
      f += `<div class="abs gl-caps" style="left:${TX0}pt;top:${SY + 12}pt;width:${TW}pt;height:14pt;font-size:${fsx}pt;line-height:14pt;letter-spacing:1.6pt" data-slot="front.facts" data-lines="1">${esc(fx)}</div>`;
      // ruled rows (the set's list: a short dash, 1 pt rules between), spread to fill the field from the facts to the agent line
      const rh = g.R/pick.n, y1 = g.top;
      pick.tg.forEach((t, i) => { if(i) f += `<div class="gl-hair" style="left:${TX0}pt;top:${y1 + i*rh}pt;width:${TW}pt"></div>`; f += `<div class="abs gl-hl" style="left:${TX0}pt;top:${y1 + i*rh}pt;width:${TW}pt;height:${rh}pt;font-size:${pick.fs}pt;line-height:${rh}pt;gap:${(pick.fs*0.8).toFixed(1)}pt" data-slot="front.hl.${i}" data-lines="1">${esc(t)}</div>`; });
      if(!fr) f += foot(TX0, TW, fy);
      else { const sy = M + PHr, sh = H - sy, cy = sy + sh/2, ns = 15*k, ps = 12.5*k;   // the agent line under the house, centered top to bottom in the strip
        f += `<div class="abs" style="left:${PX}pt;top:${cy - ns*0.7}pt;width:${PW*0.62}pt;height:${ns*1.4}pt;display:flex;align-items:baseline;gap:12pt;white-space:nowrap"><span style="font:500 ${ns}pt/${ns*1.4}pt var(--gl-serif);color:var(--gl-on)" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</span><span style="font:600 ${ps}pt/${ns*1.4}pt var(--gl-font);color:var(--gl-on)" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</span></div>`;
        f += FXS.logo(D, PX + PW*0.62, cy - 14, PW*0.38, 28, 'flex-end'); }
      h += p + `<div class="gl-on">${f}</div>`;
    } else if(stacked && !sold){
      // owner 11/16 (Book 3 p6): a wide house (the 1-story) on the Just Listed front. The whole house hangs at the top left inside the margin,
      // across the seam; JUST / LISTED stacked on the paper at its right with the place and the street; under the seam at the right the
      // facts as B02 figures over their keys and the agent; under the house five or six highlights set large across its width.
      const PWw = Math.round((W - 2*M)*(big ? 0.62 : 0.64)); let SHw = Math.round(PWw*0.36); while(SHw < H*0.6 && !SW.fits(D, pid, PWw, SHw)) SHw += 3;
      const RX = M + PWw + 22, RW = W - T0 - RX, PB = M + SHw;
      let etr = 2.4; while(etr > 1 && FXS.width(place, `font-family:Jost;font-weight:500;letter-spacing:${etr}pt;font-size:8pt`) > RW) etr -= 0.2; const ef = FXS.fitSize(place, `font-family:Jost;font-weight:500;letter-spacing:${etr}pt`, RW, 8.6*k, 8);
      let ls = Math.min(FXS.fitSize('LISTED', STAT, RW, 60*k, 30), FXS.fitSize('JUST', STAT, RW, 60*k, 30));
      const as = FXS.fitSize(ad, "font-family:Spectral;font-weight:500", RW, 21*k, 12);
      const geo = l => { const st = 30 + 15, ab = st + 2*l + 6, FY = Math.max(ab + as*1.25 + 14, M + SHw*0.55); return {st, ab, FY}; };
      while(ls > 30 && geo(ls).FY > PB - 24) ls -= 1;
      const G = geo(ls), FY = G.FY; window.__SY = FY;
      h += GL.field(FY, W, H) + `<div class="abs" style="left:${M}pt;top:${M}pt;width:${PWw}pt;height:${SHw}pt">${SW.photo(D, pid, 'position:absolute;inset:0', 'front.hero')}</div>`;
      let p = '', f = '';
      p += `<div class="abs gl-eyebrow" style="left:${RX}pt;top:30pt;width:${RW}pt;font-size:${ef}pt;letter-spacing:${etr.toFixed(1)}pt;color:var(--gl-ink)" data-slot="front.place" data-lines="1">${esc(place)}</div>`;
      p += `<div class="abs gl-label" style="left:${RX - 2}pt;top:${G.st}pt;width:${RW + 4}pt;height:${2*ls}pt;font-size:${ls}pt;line-height:${ls}pt;letter-spacing:3pt;white-space:normal" data-slot="front.status" data-lines="2">JUST<br>LISTED</div>`;
      p += `<div class="abs gl-serif" style="left:${RX}pt;top:${G.ab}pt;width:${RW}pt;height:${as*1.25}pt;font-size:${as}pt;line-height:${as*1.25}pt;color:var(--gl-ink)" data-slot="front.address" data-lines="1">${esc(ad)}</div>`;
      // the facts as B02 figures over tracked keys, stacked in the right column from the seam to the foot, ruled between
      const st3 = FXS.statItems(L).filter(t => !/^Built/.test(t)).map(FXS.statParts), fTop = FY + 10, fBot = H - 18, frh = (fBot - fTop)/Math.max(1, st3.length), nfs = Math.min(30*k, frh*0.6);
      st3.forEach((q, i) => { const y = fTop + i*frh;
        if(i) f += `<div class="gl-hair" style="left:${RX}pt;top:${y}pt;width:${RW}pt"></div>`;
        f += `<div class="abs" style="left:${RX}pt;top:${y}pt;width:${RW}pt;height:${frh}pt;display:flex;align-items:center;gap:9pt;white-space:nowrap" data-slot="front.facts.${i}" data-lines="1"><span style="font:500 ${nfs}pt/1 var(--gl-serif);color:var(--gl-on)">${esc(q.n)}</span><span style="font:600 ${9*k}pt/1 var(--gl-font);letter-spacing:1.8pt;text-transform:uppercase;color:var(--gl-acc)">${esc(q.l)}</span></div>`; });
      f += `<div class="gl-vhair" style="left:${RX - 11}pt;top:${PB + 14}pt;height:${H - 32 - PB}pt"></div>`;
      // under the house: five or six highlights in two ruled columns, set as large as the band allows; the agent and the logo at the foot
      const agH = 36*k, tg0 = tags(), top = PB + 12, R = H - 18 - agH - 14 - top, cw = (PWw - 8 - 24)/2; let pk = null;
      for(const n of [6, 4]){ for(let fs = 17*k; fs >= 11*k && !pk; fs -= 0.25){ const rows = n/2; if(rows*fs*1.7 > R) continue; const tg = tg0.filter(t => FXS.width(t, `font-family:Jost;font-weight:500;font-size:${fs}pt`) < cw - fs*1.6); if(tg.length >= n) pk = {n, fs, rows, tg: tg.slice(0, n)}; } if(pk) break; }
      if(pk){ const rh = R/pk.rows; pk.tg.forEach((t, i) => { const c = Math.floor(i/pk.rows), r = i % pk.rows, x = M + 8 + c*(cw + 24), y = top + r*rh;

    { const nm = document.querySelector('[data-slot="back.label1.name"]'), tx = document.querySelector('.cap .a[data-slot="back.label1"]'); if(nm && tx){ const rl = nm.nextElementSibling && nm.nextElementSibling.classList.contains('gl-rule') ? nm.nextElementSibling : null;
      const k = 0.75, sh = nm.offsetParent.getBoundingClientRect(), r = document.createRange(); r.selectNodeContents(tx); const q = [...r.getClientRects()].filter(x => x.width > 1); if(!q.length) return;
      const top = (nm.getBoundingClientRect().top - sh.top)*k, bot = (Math.max(...q.map(x => x.bottom)) - sh.top)*k, lo = (window.__FYb || 0) + 8, hi = parseFloat(ab.style.top) - 8, d2 = lo + Math.max(0, (hi - lo - (bot - top))/2) - top;
      if(Math.abs(d2) > 0.5) [nm, rl, tx].filter(Boolean).forEach(e => { e.style.top = (parseFloat(e.style.top) + d2) + 'pt'; }); } } }
  function fitSteps(){ const box = document.getElementById('stepsbox'), list = document.getElementById('stepslist'); if(!box || !list) return;
    if(big){   // 6x11: one column, every step one full line, the largest size from 15.5 pt down to the 6x9's x1.08; the box is sized to its content, set on the card's top, the call to action centered above it
      const stp = [...list.querySelectorAll('.stp')], its = [...list.querySelectorAll('.it')];
      let best = null;
      for(let fs = 15.5; fs >= 14.1 - 1e-6; fs -= 0.1){ list.style.fontSize = fs + 'pt'; const lh = fs*1.62; list.style.lineHeight = lh + 'pt'; stp.forEach(e => { e.dataset.lh = lh; }); its.forEach(it => { it.querySelector('.bx').style.marginTop = (lh*.42) + 'pt'; }); SW.fill();
        if(stp.every(e => SW.lines(e).n === 1)){ const fill = Math.min(...stp.map(e => (e.getBoundingClientRect().width ? (() => { const r = document.createRange(); r.selectNodeContents(e); const q = [...r.getClientRects()]; return q.length ? (Math.max(...q.map(x => x.right)) - Math.min(...q.map(x => x.left)))/list.getBoundingClientRect().width : 0; })() : 0))); best = {fs, lh, fill}; break; } }
      if(!best) return;
      box.style.justifyContent = 'flex-start'; box.style.gap = '8pt'; box.style.height = 'auto';
      const hpt = box.getBoundingClientRect().height*0.75, bottom = parseFloat(box.style.top) + (+box.dataset.bh0 || 0), top0 = parseFloat(box.style.top), end = top0 + parseFloat(box.dataset.bh0 || 0);
      const boxBottom = window.__foot, newTop = boxBottom - hpt; box.style.top = newTop + 'pt'; box.style.height = hpt + 'pt';
      const cta = document.getElementById('jscta'), st = document.querySelector('[data-slot="back.address"]'), sb = Math.max(parseFloat(st.style.top) + parseFloat(st.style.height), (window.__FYb || 0) + 4), room = newTop - sb;
      if(cta && room >= 30){ const cs = Math.min(21, room - 12); cta.style.display = ''; cta.style.fontSize = cs + 'pt'; cta.style.lineHeight = (cs*1.3) + 'pt'; cta.style.height = (cs*1.3) + 'pt'; cta.style.top = (sb + (room - cs*1.3)/2) + 'pt'; }
      return; }
    const stp = [...list.querySelectorAll('.stp')], its = [...list.querySelectorAll('.it')], fits = () => box.scrollHeight <= box.clientHeight + .5;
    const okLines = () => stp.every(e => { const L = SW.lines(e); return L.n === 1 || (L.fill >= .9 && L.min >= .8); });
    const apply = (fs, m) => { list.style.fontSize = fs + 'pt'; list.style.lineHeight = (fs*m) + 'pt'; stp.forEach(e => { e.dataset.lh = fs*m; }); its.forEach(it => { it.querySelector('.bx').style.marginTop = (fs*m*.42) + 'pt'; }); SW.fill(); };
    const sizes = []; for(let f = big ? 13.5 : 14.5; f >= 9.5 - 1e-6; f -= 0.1) sizes.push(+f.toFixed(2));
    for(const fs of sizes){ apply(fs, 1.25); if(!(okLines() && fits())) continue;
      for(let m = 1.25; m <= 1.7; m += .03){ apply(fs, m); if(!fits() || !okLines()){ apply(fs, m - .03); break; } jsCheck(); if(window.__jsFill >= .87) break; }
      return; }
    apply(sizes[sizes.length - 1], 1.25); }
  function backCheck(){ const out = [], pt = v => v*72/96, sh = document.querySelector('.sheet').getBoundingClientRect(), X0 = window.__cardX || 30;
    const cc = document.querySelector('.sheet .cc');
    if(!cc) out.push({slot: 'back.card', kind: 'no-contact-card', detail: 'the back has no standard contact card'});
    else { const r = cc.getBoundingClientRect(), l = pt(r.left - sh.left), rr = pt(r.right - sh.left), Wt = pt(sh.width) - 18;
      if(l > X0 + 1 || rr < Wt - X0 - 1) out.push({slot: 'back.card', kind: 'card-not-full-width', detail: `card spans ${l.toFixed(0)}-${rr.toFixed(0)} pt of ${Wt.toFixed(0)}`}); }
    let area = 0; document.querySelectorAll('.sheet [data-mail-panel]').forEach(el => { const r = el.getBoundingClientRect(); const w = Math.min(pt(r.right - sh.left) - 9, pt(sh.width) - 18) - Math.max(pt(r.left - sh.left) - 9, 0), h = Math.min(pt(r.bottom - sh.top) - 9, 432) - Math.max(pt(r.top - sh.top) - 9, 0); area += Math.max(0, w)*Math.max(0, h); });
    if(area > .25*(pt(sh.width) - 18)*432) out.push({slot: 'back.panels', kind: 'light-block-too-big', detail: `mail panels cover ${(100*area/((pt(sh.width) - 18)*432)).toFixed(0)}% of the card`});
    if(sold) out.push(...jsCheck());
    return out; }
  // nothing but the proof guides may sit in the mail vendor's zones (postage, address block, barcode strip)
  function lum(c){ const m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(c); return m ? .2126*m[1] + .7152*m[2] + .0722*m[3] : 0; }
  function panelCheck(){ const out = [], Z = window.__zones, sh = document.querySelector('.sheet').getBoundingClientRect(), pt = v => v*72/96;
    const panels = [...document.querySelectorAll('.mailp')].map(p => { const r = p.getBoundingClientRect(); return {l: pt(r.left - sh.left), t: pt(r.top - sh.top), r: pt(r.right - sh.left), b: pt(r.bottom - sh.top), lum: lum(getComputedStyle(p).backgroundColor)}; });
    if(!panels.length) out.push({slot: 'back.panel', kind: 'mail-panel-missing', detail: 'no light panel under the mail zones'});
    ['postage', 'address', 'barcode'].forEach(k => { const z = Z[k], p = panels.find(q => q.l <= z[0] + .5 && q.t <= z[1] + .5 && q.r >= z[0] + z[2] - .5 && q.b >= z[1] + z[3] - .5);
      if(!p) out.push({slot: 'back.' + k, kind: 'mail-zone-not-light', detail: `the ${k} zone is not fully on a light panel`});
      else if(p.lum < 200) out.push({slot: 'back.' + k, kind: 'mail-zone-not-light', detail: `the ${k} panel's luminance is ${Math.round(p.lum)} (200 minimum): vendors print black ink and USPS needs a light field`}); });
    // the taupe runs to every edge: nothing outside the three panels is light
    return out; }
  // the Just Sold bullets: each takes the longest wording that sets in 3 lines (2 on the 6x9) so the six read as full sentences
  function fitHelp(){
    const hbs = [...document.querySelectorAll('.hb')], grid = document.querySelector('.pc-help'), call = grid.parentElement.querySelector('.pc-call');
    const pick = maxL => hbs.forEach(el => { const tx = el.querySelector('.tx'), alts = JSON.parse(el.dataset.alts).slice().sort((p, q) => q.length - p.length); let best = null, bf = -1;
      for(const a of alts){ tx.textContent = a; const L = SW.lines(tx); if(L.n > maxL) continue; if(L.n === 1 || L.fill >= .76){ best = a; bf = 9; break; } if(L.fill > bf){ best = a; bf = L.fill; } }
      tx.textContent = best || alts[alts.length - 1]; });
    const over = () => Math.max(...hbs.map(e => e.getBoundingClientRect().bottom)) > call.getBoundingClientRect().top - 5 || grid.parentElement.scrollHeight > grid.parentElement.clientHeight + .5;
    const bad = () => hbs.filter(el => { const L = SW.lines(el.querySelector('.tx')); return L.n > 1 && L.fill < .75; });
    // the bullets take the largest size at which all six set in full lines (last line 3/4 full) inside the box: no empty band under the heading
    const base = big ? 8.5 : 8, top = big ? 15 : 12; let bestCfg = null;
    const apply = fs => hbs.forEach(el => { el.style.fontSize = fs + 'pt'; el.style.lineHeight = (fs*1.32) + 'pt'; el.querySelector('.bx').style.marginTop = (fs*1.32/2 - 2) + 'pt'; });
    // every size is tried; the one whose bullets keep the fullest wording (then the larger type) wins, all six on full last lines inside the box
    for(let fs = top; fs >= base; fs -= .25) for(const maxL of (big ? [3, 2] : [3, 2])){
      apply(fs); pick(maxL); if(over() || bad().length) continue;
      const len = hbs.reduce((n, el) => n + el.querySelector('.tx').textContent.length, 0), sc = fs*1000 + len;
      if(!bestCfg || sc > bestCfg.sc) bestCfg = {fs, maxL, sc}; }
    if(bestCfg){ apply(bestCfg.fs); pick(bestCfg.maxL); } else { apply(base); pick(3); }
    { const bxel = grid.parentElement; if(over() || bxel.scrollHeight > bxel.clientHeight + .5) issues.push({slot: 'back.steps', kind: 'steps-overflow', detail: 'the six bullets and the call line do not fit their box'}); }
    hbs.forEach(el => { const tx = el.querySelector('.tx'), L = SW.lines(tx); delete el.dataset.slot;
      if(L.n > 1 && L.fill < .75) issues.push({slot: 'back.step' + el.dataset.help, kind: 'last-line-short', detail: `last line is ${Math.round(L.fill*100)}% full (75% minimum): "${tx.textContent.slice(-24)}"`}); });
  }
  function mailCheck(){ const out = [], Z = window.__zones, pt = v => v*72/96, sh = document.querySelector('.sheet').getBoundingClientRect();
    const hit = (r, z) => pt(r.left - sh.left) < z[0] + z[2] - .5 && pt(r.right - sh.left) > z[0] + .5 && pt(r.top - sh.top) < z[1] + z[3] - .5 && pt(r.bottom - sh.top) > z[1] + .5;
    document.querySelectorAll('.sheet .ph, .sheet .pc-wbox, .sheet .cap, .sheet .cc, .sheet .pc-ret, .sheet .pc-bstatus, .sheet .pc-disc').forEach(el => {
      const r = el.getBoundingClientRect(); for(const k in Z) if(hit(r, Z[k])) out.push({slot: el.dataset.slot || el.className, kind: 'in-mail-zone', zone: k}); });
    return out; }
