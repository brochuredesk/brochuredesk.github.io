<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · Agent Preview postcards</title>
<link rel="stylesheet" href="ap.css">
<link rel="stylesheet" href="ap-fo.css">
<script src="ap.js"></script>
<script src="../engine/baths.js"></script>
<script src="../engine/agentcard.js"></script>
<script src="../engine/factrepeat.js"></script>
<script>window.Ivory = window.Ivory || {esc: s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))};</script>
<script src="ap-fo.js"></script>
<!--
  BrochureDesk · Agent Preview · Just Listed and Just Sold postcards (the hand of the approved Open House library flyer B01).
  data.piece.card = "listed" | "sold", data.piece.size = "6x11" (trim 792 x 432 pt) | "6x9" (648 x 432 pt), data.piece.side = "front" | "back".
  Print adds 0.125 in (9 pt) bleed. The agent's brand color (brand.accent) is the field on both sides; boxes are white.
  Front: the whole house (roof to steps) on the right with a one-line-or-two caption and a white box under it, the status stacked large on the left over the address,
  the fact rows and the brokerage logo (Just Listed) or the agent's name and number and the logo (Just Sold). No price, no QR.
  Back: status line, interior photos with captions, a white box (the write-up, or the steps), the standard contact card (templates/_shared/agentcard.js,
  band preset, which carries the back's one logo), the fine print. The right 289.5 pt (4.02 in) is the mail vendor's: return address, postage and address
  zones; drawn as guides on proofs and left clear in print.
  Copy comes from data.sw.pc.{jl|js}.{front|back} as a lead plus whole sentences; ap.js picks the sentences that fill each box.
-->
<style>
  /* the FX14 hand on a postcard: white frame, a taupe block, Pinyon Script status, white underlined labels, hairline white boxes; tokens in ap-tokens.css */
  .pc-col{position:absolute;display:flex;flex-direction:column}
  .pc-wbox{background:transparent;color:var(--fx-soft);padding:10pt 16pt 9pt;display:flex;flex-direction:column;overflow:hidden}
  .pc-wbox:after{content:"";position:absolute;inset:0;border:1.2pt solid var(--ap-accent);pointer-events:none}
  .pc-wbox.lt{background:var(--ap-paper);color:var(--ap-paper-text);--fx-on:var(--ap-paper-ink);--fx-soft:var(--ap-paper-text)}
  .pc-wbox.lt:after{border-color:var(--ap-paper-accent)}
  .pc-wbox.lt .k{color:var(--ap-paper-main)}
  .pc-wbox.lt .p{color:var(--ap-paper-ink)}
  .pc-wbox .k{font-family:var(--ap-font);font-weight:700;font-size:8.6pt;line-height:11pt;letter-spacing:2.6pt;text-transform:uppercase;color:var(--ap-accent);white-space:nowrap;overflow:hidden;margin-bottom:3pt;align-self:flex-start}
  .pc-wbox .p{font-family:var(--ap-font);font-weight:400;overflow:hidden;color:var(--fx-on)}
  .pc-wbox .p b{font-weight:700;color:var(--fx-on)}
  .pc-bstatus{position:absolute;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
  .pc-bstatus .st{font:700 10.5pt/1 var(--fx-font);letter-spacing:2.4pt;color:var(--fx-on);text-transform:uppercase}
  .pc-bstatus .ln{flex:1;height:1.2pt;background:var(--ap-accent);margin:0 12pt;min-width:16pt}
  .pc-bstatus .ad{font:500 16pt/1 var(--ap-serif);color:var(--fx-on);padding-bottom:3pt}
  .pc-steps .it{display:flex;gap:8pt;align-items:baseline;white-space:nowrap;overflow:hidden}
  .pc-steps .bx{flex:none}
  .pc-steps .num{width:16pt;font-family:var(--ap-serif);font-weight:500;color:var(--ap-paper-accent);text-align:center}
  .pc-steps .it{border-bottom:.8pt solid var(--ap-paper-rule)}
  .pc-steps .it:last-child{border-bottom:0}
  .pc-call{font:500 13pt/16pt var(--ap-serif);color:var(--ap-accent);white-space:nowrap;overflow:hidden}
  .pc-disc{position:absolute;font-size:6pt;line-height:10pt;color:var(--fx-soft);overflow:hidden;white-space:nowrap}
  .pc-ret{position:absolute;font:500 9pt/11pt var(--fx-font);letter-spacing:.2pt;color:var(--fx-on);overflow:hidden;height:34pt}
  .pc-ret b{font-weight:700;letter-spacing:1.4pt;text-transform:uppercase;color:var(--fx-ink)}
  .cap .a{font-weight:400}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const esc = SW.esc, b = D.brand || {}, A = D.agent || {}, L = D.listing, P = D.piece || {};
  document.body.dataset.mode = D.mode || 'email';
  await SW.setup(D);
  const sold = P.card === 'sold', big = P.size === '6x11', front = P.side === 'front';
  const W = big ? 792 : 648, H = 432;
  const K = ((D.sw || {}).pc || {})[sold ? 'js' : 'jl'] || {};
  const hsSrc = A.headshot && ((D.photos||{})[A.headshot] ? D.photos[A.headshot].src : A.headshot) || '';
  const statusWord = sold ? 'Just Sold' : 'Just Listed';
  const issues = [];
  const logo = (cls, src, area, maxh, style) => `<div class="logo ${cls}" data-area="${area}" data-maxh="${maxh}" style="${style||''}">${src ? `<img src="${esc(src)}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage||'')}</span>`}</div>`;
  const CL = big ? 13.5 : 12.5, CF = big ? 'font-size:10.9pt;line-height:13.5pt;' : '';   // the 6x11 sets its type up from the 6x9 (11 pt against 9.5), not the same size with more room
  const cap = (c, slot, lines, extra, min) => (c = (c.photo ? FXS.augment(D, c) : c), `<div class="cap" style="height:${5 + lines*CL}pt;${extra||''}"><div class="a" data-min="${min || 2}" data-nopair="1" data-slot="${slot}" data-narrow="0" data-nstep="6" data-lh="${CL}" data-lines="${lines}" data-lead="${esc(c.lead||'')}" data-s='${esc(JSON.stringify([].concat(c.s||[]))).replace(/'/g,'&#39;')}' style="height:${lines*CL}pt;${CF}"></div></div>`);
  let h = '';

  if(front){
    // The FX14 hand on a postcard front. A white frame top and side, the whole house in it, a taupe block around it with the status in Pinyon Script.
    // JL: "Just Listed" in script beside the house, the horizontal address, three facts; under the house the caption ("Front.", the draws) and the agent and logo along the foot.
    // JS: sells the agent: "Just Sold" in the same script lockup, the name and phone big on the left, the house on the right with the agent's own note, the logo.
    const F = K.front || {};
    const draws = list => { const w = x => /gated|roof|pergola|deck|park|garage|island|stone|corner|pool/i.test([].concat(x)[0]) ? 0 : 1; return (list || []).map((x, i) => [w(x), i, x]).sort((p, q) => p[0] - q[0] || p[1] - q[1]).map(t => t[2]); };
    const capC = sold ? {lead: '', s: (F.note || {}).s || (F.cap || {}).s} : (F.caption ? {lead: F.caption.lead, s: F.caption.s.concat(draws((F.about || {}).s || []))} : {lead: 'Front.', s: draws((F.about || {}).s || (F.cap || {}).s)});
    const norm = x => String(x).toLowerCase().replace(/[^a-z0-9 ]/g, '').slice(0, 40), allAlts = list => [].concat(...(list || []).map(x => [].concat(x)));
    const backSet = new Set([].concat(allAlts(((K.back || {}).about || {}).s), ...((K.back || {}).photos || []).map(c => allAlts(c.s)), allAlts((K.back || {}).steps6), allAlts((K.back || {}).steps)).map(norm));
    const backAll = allAlts(((K.back || {}).about || {}).s).map(String);   // the back's About box
    if(capC.s){ const kept = capC.s.filter(x => ![].concat(x).some(a => backSet.has(norm(a)))); if(kept.length >= 2) capC.s = kept; }
    // the caption's own first sentence stays; a later one that says a fact the back's About box says (the deck and pergola, in other words) drops out
    if(capC.s && capC.s.length > 2){ const tail = capC.s.slice(1).filter(x => ![].concat(x).some(a => backAll.some(b => SW.sameFact(String(a), b)))); if(tail.length >= 1) capC.s = [capC.s[0]].concat(tail); }
    const roomIds = [...new Set([].concat(((D.sw||{}).back||{}).photos||[], ((D.sw||{}).left||{}).photos||[]).map(c => c.photo))].filter(id => (D.photos||{})[id] && !(D.photos[id]||{}).fullHouse && id !== F.cap.photo).slice(0, 2);
    // ---- Agent Preview fronts, design pass 11/15 (the mailbox test). Two different cards. Just Listed: the house bleeds off three edges
    // and is the hero; JUST / LISTED stacked as large as the column allows, flush left with the street, the facts and three specific highlights
    // on small accent marks (no box); the agent and the one logo along the foot; the closed frame holds the words and never crosses the photo.
    // Just Sold: the house is a picture inside the closed frame; the words centered. A dusk glow runs where the field meets the photo. ----
    const k = big ? 1.12 : 1, FRI = 22, pid = FO.heroId(D, F.cap.photo);
    const word = sold ? 'Just Sold' : 'Just Listed', place = [FXS.hood(L), FXS.placeLine(L)].filter(Boolean).join('  ·  ').toUpperCase(), ad = String(L.address || '');
    const tenor = "font-family:Spectral;letter-spacing:3pt", facts = FXS.statItems(L).filter(t => !/^Built/.test(t)).join('  ·  ').toUpperCase();
    // reversed caps never under 8.5 pt: a line that does not fit at its size gives up tracking before it gives up size
    const capsFit = (t, w, max, wt, tracks) => { for(const ls of tracks){ const fs = FXS.fitSize(t, `font-family:Manrope;font-weight:${wt};letter-spacing:${ls}pt`, w, max, 8.5); if(FXS.width(t, `font-family:Manrope;font-weight:${wt};letter-spacing:${ls}pt;font-size:${fs}pt`) <= w - 12) return {fs: Math.max(8.5, fs), ls}; } return {fs: 8.5, ls: tracks[tracks.length - 1]}; };
    const eyebrow = (x, y, w, al) => { const c = capsFit(place, w, 8.8*k, 500, [3, 2.2, 1.4, 0.8]); return `<div class="abs ap-eyebrow" style="left:${x}pt;top:${y}pt;width:${w}pt;font-size:${c.fs}pt;line-height:${12*k}pt;letter-spacing:${c.ls}pt${al ? ';text-align:' + al : ''}" data-slot="front.place" data-lines="1">${esc(place)}</div>`; };
    const factsLine = (x, y, w, al) => { let ft = facts, c = capsFit(ft, w, 10*k, 600, [1.8, 1.2, 0.7, 0.3]); if(FXS.width(ft, `font-family:Manrope;font-weight:600;letter-spacing:${c.ls}pt;font-size:${c.fs}pt`) > w - 12){ ft = facts.replace(/\s+·\s+/g, ' · '); c = capsFit(ft, w, 10*k, 600, [1.2, 0.7, 0.3, 0, -0.2]); }   /* a narrow column: the facts close up before they shrink under 8.5 pt */ return `<div class="abs ap-caps" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${14*k}pt;font-size:${c.fs}pt;line-height:${14*k}pt;letter-spacing:${c.ls}pt${al ? ';text-align:' + al : ''}" data-slot="front.facts" data-lines="1">${esc(ft)}</div>`; };
    const status = (t, x, y, w, fs, slot, al) => `<div class="abs ap-label" style="left:${x}pt;top:${y}pt;width:${w + 4}pt;height:${fs*1.04}pt;font-size:${fs}pt;line-height:${fs*1.04}pt;letter-spacing:3pt;overflow:visible${al ? ';text-align:' + al : ''}" data-slot="${slot}" data-lines="1">${esc(t)}</div>`;
    const serif = (t, x, y, w, fs, slot, extra) => `<div class="abs ap-serif" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${fs*1.25}pt;font-size:${fs}pt;line-height:${fs*1.25}pt;${extra || ''}" data-slot="${slot}" data-lines="1">${esc(t)}</div>`;
    // the highlights: real selling facts, the specific ones first (a dated improvement beats a plain feature), one per line on a small accent mark
    const tags = w => { const tg = FXS.tagFacts(D).tags.filter(t => FXS.width(t, `font-family:Manrope;font-weight:500;font-size:${11.5*k}pt`) < w - 16).filter((t, i, arr) => !arr.slice(0, i).some(u => SW.sameFact(t, u))); const sc = t => (/\b(19|20)\d\d\b/.test(t) ? 4 : 0) + (/\d/.test(t) ? 1 : 0) + Math.min(t.length, 30)/30; return tg.map((t, i) => [sc(t), i, t]).sort((a, b) => b[0] - a[0] || a[1] - b[1]).map(x => x[2]); };
    const hl = (t, i, x, y, w, rh) => `<div class="abs" style="left:${x}pt;top:${y + rh/2 - 2.5*k}pt;width:${5*k}pt;height:${5*k}pt;transform:rotate(45deg);background:var(--ap-accent)"></div><div class="abs" style="left:${x + 15*k}pt;top:${y}pt;width:${w - 15*k}pt;height:${rh}pt;font-weight:500;font-size:${11.5*k}pt;line-height:${rh}pt;font-family:var(--ap-font);color:var(--ap-on);white-space:nowrap;overflow:hidden" data-slot="front.hl.${i}" data-lines="1">${esc(t)}</div>`;
    const note = (x, y, w, n, lh, fs, pad) => { fs = fs || 10*k; pad = pad || 13; return `<div class="ap-lt"><div class="ap-wbox lt" id="notebox" data-pad="${pad}" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${n*lh + 2*pad}pt"></div><div class="abs cap"><div class="a" style="position:absolute;left:${x + 15}pt;top:${y + pad}pt;width:${w - 30}pt;height:${n*lh}pt;font-size:${fs}pt;line-height:${lh}pt;color:var(--fx-soft)" data-slot="front.note" data-lh="${lh}" data-lines="${n}" data-min="3" data-narrow="0" data-flexh="1" ${FXS.sd(capC.s || [])}></div></div></div>`; };   // the Just Sold note is the card's one light moment: B01's white card
    const nameW = ns => FXS.width(A.name || '', `font-family:Spectral;letter-spacing:.8pt;font-size:${ns}pt`), phoneW = ns => FXS.width(A.phone || '', `font-family:Manrope;font-weight:600;font-size:${ns*0.74}pt`);
    const desT = A.designation ? (A.nar || /realtor/i.test(A.designation) ? 'REALTOR®' : A.designation) : '', DS = 8.5*k, desW = desT ? FXS.width(desT, `font-family:Manrope;font-weight:500;letter-spacing:2pt;font-size:${DS}pt`) + 9*k : 0, LOGO_MIN = 104*k;
    const nameSpan = ns => `<span style="font-weight:500;font-size:${ns}pt;line-height:${ns*1.25}pt;font-family:var(--ap-label);letter-spacing:.8pt;color:var(--ap-on)" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</span>`;
    const desSpan = ns => `<span style="font-weight:700;font-size:${DS}pt;line-height:${ns*1.25}pt;font-family:var(--ap-font);letter-spacing:2pt;color:var(--ap-accent);margin-left:${9*k}pt" data-slot="agent.desig" data-lines="1">${esc(desT)}</span>`;
    const phoneSpan = (ns, ml) => `<span style="font-weight:600;font-size:${ns*0.74}pt;line-height:${ns*1.1}pt;font-family:var(--ap-font);color:var(--ap-on)${ml ? `;margin-left:${ml}pt` : ''}" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</span>`;
    // the agent and the one logo, tied together: beside each other on one row, or (a narrow column) the logo under the agent's line
    const footStacks = (w, ns) => w - Math.max(nameW(ns), phoneW(ns)) - 20*k < LOGO_MIN;
    const agentRow = (x, y, w, ns, hh, oneLine, under) => { const nw = nameW(ns), pw = phoneW(ns);
      let des = !!desT, bw = oneLine ? nw + desW + 16*k + pw : Math.max(nw + desW, pw); if(des && (under ? nw + desW + 14*k + pw > w : w - bw - 20*k < LOGO_MIN)){ des = false; bw = oneLine ? nw + 16*k + pw : Math.max(nw, pw); }
      if(under){ const th = ns*1.25, lh2 = hh - th - 7*k, lw2 = Math.min(w, nw + (des ? desW : 0) + 14*k + pw); return `<div class="abs" style="left:${x}pt;top:${y}pt;width:${w}pt;white-space:nowrap;line-height:${th}pt">${nameSpan(ns)}${des ? desSpan(ns) : ''}${phoneSpan(ns, 14*k)}</div>` + FXS.logo(D, x, y + th + 7*k, lw2, lh2, 'center'); }   // the logo sits centered under the agent's line: one block
      const th = oneLine ? ns*1.25 : ns*2.35, lx = x + bw + 20*k;
      return `<div class="abs" style="left:${x}pt;top:${y + (hh - th)/2}pt;width:${bw + 4}pt;white-space:nowrap">${oneLine ? `<div style="line-height:${ns*1.25}pt">${nameSpan(ns)}${des ? desSpan(ns) : ''}${phoneSpan(ns, 16*k)}</div>` : `<div style="line-height:${ns*1.25}pt">${nameSpan(ns)}${des ? desSpan(ns) : ''}</div><div style="line-height:${ns*1.1}pt">${phoneSpan(ns)}</div>`}</div>` + FXS.logo(D, lx, y, x + w - lx, hh, 'flex-end'); };
    const photoAt = (x, y, w, hh) => `<div class="abs" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${hh}pt">${SW.photo(D, pid, 'position:absolute;inset:0', 'front.hero')}</div>`;
    const cq = 'Thinking about selling?';

    // ---- Agent Preview fronts (B26). Two compositions in one hand. JUST LISTED: the status runs across the whole card as one display line
    // (Spectral capitals, LISTED in the accent), the house under it as a matted print (B26's gold mat), and beside the print the place, the
    // street, the facts in B26's ticket stood on end, two or three specific highlights and the agent with the logo.
    // JUST SOLD: the house across the top settling into the field (B26's fade, grained), then everything centered on one axis: JUST SOLD
    // (about twice the agent's name), the street right under it, the seller question, the note on B26's paper panel, the agent and logo. ----
    const M = 24, hlO = (t, i, x, y, w, rh) => `<div class="abs" style="left:${x + 1}pt;top:${y + rh/2 - 3*k}pt;width:${6*k}pt;height:${6*k}pt;transform:rotate(45deg);border:1.2pt solid var(--ap-accent);box-sizing:border-box"></div><div class="abs" style="left:${x + 16*k}pt;top:${y}pt;width:${w - 16*k}pt;height:${rh}pt;font-weight:500;font-size:${11*k}pt;line-height:${rh}pt;font-family:var(--ap-font);color:var(--ap-on);white-space:nowrap;overflow:hidden" data-slot="front.hl.${i}" data-lines="1">${esc(t)}</div>`;
    // the facts ticket stood on end: one row a fact, the value in Spectral, its label in the accent caps, thin accent rules between rows
    const vticket = (x, y, w, rh, cells) => { let q = `<div class="ap-ticket" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${rh*cells.length}pt"></div>`;
      cells.forEach((c, i) => { const ry = y + i*rh; if(i) q += `<div class="abs" style="left:${x + 10}pt;top:${ry}pt;width:${w - 20}pt;height:1pt;background:var(--ap-accent);opacity:.55"></div>`;
        const vs = Math.min(19*k, rh*0.66), vw = FXS.width(String(c.v), `font-family:Spectral;font-weight:500;font-size:${vs}pt`);
        q += `<div class="abs ap-tv" style="left:${x + 12}pt;top:${ry + (rh - vs*1.2)/2}pt;width:${vw + 4}pt;height:${vs*1.2}pt;font-size:${vs}pt;line-height:${vs*1.2}pt" data-slot="front.facts.${i}" data-lines="1">${esc(c.v)}</div>`;
        q += `<div class="abs ap-tk" style="left:${x + 12 + vw + 12}pt;top:${ry + (rh - 12)/2 + 1}pt;width:${w - 36 - vw}pt;height:12pt;font-size:8.6pt;line-height:12pt;letter-spacing:2pt" data-slot="front.facts.${i}.k" data-lines="1">${esc(String(c.k).toUpperCase())}</div>`; });
      return q; };
    if(!sold){
      const ws = AP.dfit('JUST LISTED', W - 2*M, 72*k, 40), sy = M - ws*0.06;
      h += AP.display('Just Listed', M, sy, W - 2*M, ws, 'front.status', {lh: 1.04});
      const PY = sy + ws*1.04 + 12, PB = H - M - 5, PHh = PB - PY; let PW = Math.round(Math.max(PHh*1.18, W*(big ? 0.58 : 0.5) - 20)); while(PW < W*0.66 && !SW.fits(D, pid, PW, PHh)) PW += 6;
      h += photoAt(M + 5, PY, PW, PHh) + `<i class="ap-matq" style="display:none" data-for="front.hero" data-g="5" data-sides="tlbr"></i>`;
      const TX0 = M + 5 + PW + 5 + 20, TX1 = W - M, TW = TX1 - TX0, parts = []; let y = PY - 5;
      parts.push(AP.eyebrow(place, TX0, y, TW - 6, 'front.place', {al: 'left', fs: 8.8*k, ls: 2.6})); y += 15*k;
      const as = FXS.fitSize(ad, "font-family:Spectral;font-weight:500", TW, 23*k, 14); parts.push(serif(ad, TX0, y, TW, as, 'front.address')); y += as*1.25 + 4;
      parts.push(`<div class="ap-rule" style="left:${TX0}pt;top:${y}pt;width:${44*k}pt"></div>`); y += 12*k;
      const cells = AP.factCells(L, {built: false}), rh = 27*k; parts.push(vticket(TX0, y, TW, rh, cells)); y += rh*cells.length + 12*k;
      const nsF = 15*k, footH = (nsF*1.25 + nsF*1.1) + 8*k + 30*k, fy = PB - footH, hlh = 17*k, nT = Math.max(0, Math.min(3, Math.floor((fy - 10 - y)/hlh)));
      tags(TW).slice(0, nT).forEach((t, i) => { parts.push(hlO(t, i, TX0, y, TW, hlh)); y += hlh; });
      h += `<div class="abs" id="lock" data-bottom="${y}" data-foot="${fy - 2}" data-top="${PY - 5}" style="left:0;top:0;width:0;height:0">${parts.join('')}</div>`;
      h += `<div class="ap-hair" style="left:${TX0}pt;top:${fy - 6}pt;width:${TW}pt"></div>`;
      h += `<div class="abs" style="left:${TX0}pt;top:${fy}pt;width:${TW}pt;white-space:nowrap"><div style="line-height:${nsF*1.25}pt">${nameSpan(nsF)}</div><div style="line-height:${nsF*1.1}pt">${phoneSpan(nsF)}${desT && FXS.width(A.phone || '', `font-family:Manrope;font-weight:600;font-size:${nsF*0.74}pt`) + desW + 12 < TW ? desSpan(nsF*0.8) : ''}</div></div>`;
      h += FXS.logo(D, TX0, fy + nsF*2.35 + 6*k, TW, 28*k, 'flex-start');

  // ---- the Just Sold front: the facts sit centered between the address and the agent's name, measured on the letters (ink, from the font's own metrics) ----

  // the About box ends just under its last line: the room it frees goes to the photos above it (they grow down, captions and box move with them)
  function aboutSnug(){ const bx0 = document.querySelector('.pc-wbox[data-want]'), p0 = bx0 && bx0.querySelector('[data-slot="back.box"]'); if(!bx0 || !p0) return;

  function pcSnug(){ const caps = [...document.querySelectorAll('.cap .a[data-slot^="back.photo"]')]; if(!caps.length) return;

  // owner 11/7: the Just Sold back's six bullets are long (8 words or more) and the box is at least 85% filled with text (heading, bullet lines, call line against the box's inner height)
  function jsCheck(){ const out = [], box = document.querySelector('.sheet .pc-wbox'); if(!box) return out;

  // the Just Sold bullets take the largest size at which every one sets in full lines inside the box, then the leading opens until the box is at least 85% filled
  function fitSteps(){ const box = document.getElementById('stepsbox'), list = document.getElementById('stepslist'); if(!box || !list) return;
    if(false){   // (owner 11/16: the steps box keeps its full height on both sizes; the fit below fills it) 6x11: one column, every step one full line, the largest size from 15.5 pt down to the 6x9's x1.08; the box is sized to its content, set on the card's top, the call to action centered above it
      const stp = [...list.querySelectorAll('.stp')], its = [...list.querySelectorAll('.it')];
      let best = null;
      for(let fs = 15.5; fs >= 14.1 - 1e-6; fs -= 0.1){ list.style.fontSize = fs + 'pt'; const lh = fs*1.62; list.style.lineHeight = lh + 'pt'; stp.forEach(e => { e.dataset.lh = lh; });  SW.fill();
        if(stp.every(e => SW.lines(e).n === 1)){ const fill = Math.min(...stp.map(e => (e.getBoundingClientRect().width ? (() => { const r = document.createRange(); r.selectNodeContents(e); const q = [...r.getClientRects()]; return q.length ? (Math.max(...q.map(x => x.right)) - Math.min(...q.map(x => x.left)))/list.getBoundingClientRect().width : 0; })() : 0))); best = {fs, lh, fill}; break; } }

      const hpt = box.getBoundingClientRect().height*0.75, bottom = parseFloat(box.style.top) + (+box.dataset.bh0 || 0), top0 = parseFloat(box.style.top), end = top0 + parseFloat(box.dataset.bh0 || 0);
      const boxBottom = 338, newTop = boxBottom - hpt; box.style.top = newTop + 'pt'; box.style.height = hpt + 'pt';
      const cta = document.getElementById('jscta'), st = document.querySelector('[data-slot="back.status"]'), sb = parseFloat(st.style.top) + parseFloat(st.style.height), room = newTop - sb;
      if(cta && room >= 30){ const cs = Math.min(21, room - 12); cta.style.display = ''; cta.style.fontSize = cs + 'pt'; cta.style.lineHeight = (cs*1.3) + 'pt'; cta.style.height = (cs*1.3) + 'pt'; cta.style.top = (sb + (room - cs*1.3)/2) + 'pt'; }
      return; }
    const stp = [...list.querySelectorAll('.stp')], its = [...list.querySelectorAll('.it')], fits = () => box.scrollHeight <= box.clientHeight + .5;
    const okLines = () => stp.every(e => { const L = SW.lines(e); return L.n === 1 || (L.fill >= .9 && L.min >= .8); });
    const apply = (fs, m) => { list.style.fontSize = fs + 'pt'; list.style.lineHeight = (fs*m) + 'pt'; stp.forEach(e => { e.dataset.lh = fs*m; });  SW.fill(); };
    const sizes = []; for(let f = big ? 16 : 14.5; f >= 9.5 - 1e-6; f -= 0.1) sizes.push(+f.toFixed(2));
    for(const fs of sizes){ apply(fs, 1.25); if(!(okLines() && fits())) continue;
      for(let m = 1.25; m <= 2.1; m += .03){ apply(fs, m); if(!fits() || !okLines()){ apply(fs, m - .03); break; } jsCheck(); if(window.__jsFill >= .87) break; }
      return; }
    apply(sizes[sizes.length - 1], 1.25); }
  function backCheck(){ const out = [], pt = v => v*72/96, sh = document.querySelector('.sheet').getBoundingClientRect(), X0 = window.__cardX || 30;
    const cc = document.querySelector('.sheet .cc');

      if(l > X0 + 1 || rr < Wt - X0 - 1) out.push({slot: 'back.card', kind: 'card-not-full-width', detail: `card spans ${l.toFixed(0)}-${rr.toFixed(0)} pt of ${Wt.toFixed(0)}`}); }

    if(area > .25*(pt(sh.width) - 18)*432) out.push({slot: 'back.panels', kind: 'light-block-too-big', detail: `mail panels cover ${(100*area/((pt(sh.width) - 18)*432)).toFixed(0)}% of the card`});

  // nothing but the proof guides may sit in the mail vendor's zones (postage, address block, barcode strip)
  function lum(c){ const m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(c); return m ? .2126*m[1] + .7152*m[2] + .0722*m[3] : 0; }
  function panelCheck(){ const out = [], Z = window.__zones, sh = document.querySelector('.sheet').getBoundingClientRect(), pt = v => v*72/96;
    const panels = [...document.querySelectorAll('.mailp')].map(p => { const r = p.getBoundingClientRect(); return {l: pt(r.left - sh.left), t: pt(r.top - sh.top), r: pt(r.right - sh.left), b: pt(r.bottom - sh.top), lum: lum(getComputedStyle(p).backgroundColor)}; });

      for(const a of alts){ tx.textContent = a; const L = SW.lines(tx); if(L.n > maxL) continue; if(L.n === 1 || L.fill >= .76){ best = a; bf = 9; break; } if(L.fill > bf){ best = a; bf = L.fill; } }

    const apply = fs => hbs.forEach(el => { el.style.fontSize = fs + 'pt'; el.style.lineHeight = (fs*1.32) + 'pt'; el.querySelector('.bx').style.marginTop = (fs*1.32/2 - 2) + 'pt'; });
