<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · The Map Room two-sided flyer</title>
<link rel="stylesheet" href="map-room.css">
<script src="../engine/planink.js"></script>
<script src="../engine/planrooms.js"></script>
<script src="map-room.js"></script>
<script src="../engine/setpieces.js"></script>
<script src="../engine/baths.js"></script>
<!--
  The Map Room · two-sided 8.5 x 11 listing flyer (trim 612 x 792 pt; print: 18 pt white margin). data.piece.side = "front" | "back".
  Same family as the fold-over: white field, navy serif headings, mid-blue tracked labels, the blue hairline under the
  header, square blue bullets and the navy tag. The plan is the map and the rooms are its legend: the agent's own plan
  (placed as given, never redrawn) on the pale-blue board, the legend table of room sizes beside it, and the "Around"
  distance row. Rules (product.md, two-sided flyer rules 10/28 and the owner's Round 4 review 11/1/2026): one brokerage
  logo per side (the shared contact card carries it, the office lines lined up with the card's lines); the front shows the
  whole house; backs carry as much real detail as fits; no price, no QR code, no staging labels; room sizes in feet only
  (18' x 12'); the half bath's 1/2 at full size (BD.baths); every text box is filled and runs edge to edge with the photos
  and rules around it; the details grid shows a fifth line (lot size) when the listing has one, otherwise its four lines
  grow to fill the space.

  FRONT   whole-house photo with two more beside it, the address, the write-up on the left, the details grid on the right
          (under the two photos), three captioned photos, the card.
  BACK    with a plan (data.plan): the pale board with the plan at the left, the room-size legend, one captioned photo and the
          Around row at the right. Without a plan: the board holds a photo and the rooms floor by floor; two captioned photos
          and the Around row at the right.

  Copy: data.companion.flyer = {
    front: {hero, stack: [id, id], intro: [sentence | [short, long], ...], caps: [{id, name, tag, text: [..]} x3]},
    back:  {tag, around: {head, items: [{d, u, p}]},
            plan:   {kicker, title, photo: {id, name, tag, text}},
            noplan: {kicker, title, panel: {id, name, tag, text}, photos: [{id, name, tag, text} x2]},
            floors: [{label, rooms: [[name, size]]}]}}
  A text list is a run of sentences; the first is always used, a later one is used only when the box needs it, and a
  sentence given as [short, long] is tried both ways; the search keeps the combination that fills its box with the last
  line 3/4 full.
-->
<style>
  .cc{--cc-paper:#ffffff;--cc-ink:#1d3557;--cc-muted:#5b6b82;--cc-accent:#1f6391;--cc-line:rgba(29,53,87,.22)}
  .fl-addr{font:400 36pt/40pt var(--font-display);letter-spacing:-.5pt;color:var(--ink);white-space:nowrap;overflow:hidden}
  .fl-fine{font:400 6pt/8pt var(--font-body);color:var(--muted);white-space:nowrap;overflow:hidden}
  .dg{position:absolute}
  .dg .r{position:absolute;left:0;right:0;display:flex;justify-content:space-between;align-items:center;border-top:.6pt solid var(--line)}
  .dg .r:first-child{border-top:1.2pt solid var(--accent)}
  .dg .l{font:700 8pt/10pt var(--font-body);letter-spacing:1.1pt;text-transform:uppercase;color:var(--accent);white-space:nowrap}
  .dg .v{font:400 17pt/20pt var(--font-display);color:var(--ink);white-space:nowrap}
  .dg .end{position:absolute;left:0;right:0;height:.6pt;background:var(--line)}
  .board{position:absolute;background:var(--band)}
  .lg{position:absolute}
  .lg table{width:100%;border-collapse:collapse;border-bottom:.6pt solid var(--line)}
  .lg td{font:500 9pt/12pt var(--font-body);border-top:.6pt solid var(--line);color:var(--text);white-space:nowrap;vertical-align:middle}
  .lg tr:first-child td{border-top:1.2pt solid var(--accent)}
  .lg td:first-child{font-weight:700;color:var(--ink);overflow:hidden}
  .lg td:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700}
  .lg tr.hd td{font:700 8pt/10pt var(--font-body);letter-spacing:1.2pt;text-transform:uppercase;color:var(--accent);text-align:left;border-top:1.2pt solid var(--accent);vertical-align:bottom;padding-bottom:3pt}
  .lg tr.hd:first-child td{border-top:1.2pt solid var(--accent)}
  .strip{display:flex}
  .strip > div{flex:1 1 auto;min-width:0;border-left:.8pt solid var(--line);padding-left:8pt}
  .strip > div:first-child{border-left:0;padding-left:0}
  .fl-pill{white-space:nowrap}
</style>
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SP.data(), esc = SP.esc;
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const L = D.listing, FL = (D.companion || {}).flyer || {}, P = D.photos || {};
  const issues = await SP.ready(D);
  document.body.dataset.mode = D.mode || 'email';
  const side = (D.piece || {}).side === 'back' ? 'back' : 'front';
  const hasPlan = !!(D.plan && D.plan.levels && D.plan.levels.length);
  const X0 = 36, CW = 540, BOT = 656, CARD_Y = 672, CARD_H = 80;
  const CAPSTYLE = 'font-size:9pt;line-height:12pt', BODYSTYLE = 'font-size:10pt;line-height:14pt';

  // ---------- copy ----------
  // room sizes in feet only, inches dropped and never rounded (owner Round 4, 11/1/2026): 18' x 12'
  const feetOnly = t => String(t == null ? '' : t).replace(/(\d+)(?:\.\d+)?(?:'\s?\d+(?:\.\d+)?"?)?'?\s*[x×]\s*(\d+)(?:\.\d+)?(?:'\s?\d+(?:\.\d+)?"?)?'?/g, "$1' x $2'");
  const beats = x => [].concat(x == null ? [] : x).map(b => [].concat(b).map(feetOnly));
  const pending = [];
  // every combination of the optional sentences at n lines; best = last line 77 to 100% full
  const search = (el, bl, n) => {
    const lo = 0.77, O = bl.map((v, i) => i === 0 ? v : [null, ...v]), idx = O.map(() => 0); let best = null, near = null, count = 0;
    for(;;){
      const t = idx.map((k, i) => O[i][k]).filter(Boolean).join(' ');
      el.textContent = t; const [k, fill] = MR.lineFill(el);
      if(k === n){
        if(fill >= lo && fill <= 1){ const sc = fill - 0.3*Math.abs(fill - 0.9) + 0.0005*t.length; if(!best || sc > best.sc) best = {t, sc}; }
        if(!near || fill > near.fill) near = {t, fill};
      }
      if(++count > 6000) break;
      let j = O.length - 1; while(j >= 0 && ++idx[j] === O[j].length){ idx[j] = 0; j--; } if(j < 0) break;
    }
    return {best, near};
  };
  const probe = (w, style) => { const m = document.createElement('div'); m.style.cssText = `position:absolute;left:-9999pt;top:0;visibility:hidden;width:${w}pt;height:auto;font-family:var(--font-body);${style}`; document.body.appendChild(m); return m; };
  // the first of the candidate line counts that every list can fill
  const commonN = (lists, w, style, ns) => { const m = probe(w, style); let pick = null;
    for(const n of ns){ if(lists.every(b => search(m, beats(b), n).best)){ pick = n; break; } } m.remove(); return pick; };
  const para = (slot, bl, x, y, w, n, o) => { o = o || {}; pending.push({slot, bl: beats(bl)});
    return `<div class="abs ${o.cls || 'body'}" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${n*(o.lh || 14)}pt;font-size:${o.fs || 10}pt;line-height:${o.lh || 14}pt;color:var(--text)" data-slot="${slot}" data-lines="${n}" data-para="1" data-min="${n}"${o.fill ? ' data-fillbox="1"' : ''}></div>`; };
  const cap = (c, slot, x, y, w, n, row) => { pending.push({slot: slot + '.text', bl: beats(c.text)});
    return `<div class="cap abs" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${33 + n*12}pt">
      <div class="nm" data-slot="${slot}.name" data-lines="1">${esc(c.name)}</div>
      <div class="sz" data-slot="${slot}.size" data-lines="1">${esc(feetOnly(c.tag || ''))}</div>
      <div class="tx" data-slot="${slot}.text" data-lines="${n}" data-cap="1" data-row="${row}" data-para="1" data-min="${n}" style="height:${n*12}pt"></div></div>`; };
  const capH = n => 33 + n*12;

  // ---------- the details grid (legend style): four lines grow to fill; a fifth is lot size ----------
  const num = v => Number(v).toLocaleString('en-US');
  const gridRows = () => {
    const r = [], bn = BD.bathNum(L);
    if(L.beds) r.push(['Bedrooms', String(L.beds)]);
    if(L.baths || L.halfBaths) r.push([bn.label, bn.num]);
    if(bn.half) r.push(['Half baths', bn.half.replace(/\D+/g, '')]);
    if(L.sqft) r.push(['Square feet', num(L.sqft)]);
    if(L.yearBuilt || L.year) r.push(['Year built', String(L.yearBuilt || L.year)]);
    const lot = String(L.lotSize || '').replace(/\s*lot$/i, '').replace(/Sq Ft/i, 'sq ft');
    if(lot) r.push(['Lot size', lot]);
    return r.slice(0, 5);
  };
  const detailGrid = (x, y, w, h) => { const rows = gridRows(), rh = h/rows.length;
    return `<div class="dg" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${h}pt">` +
      rows.map((r, i) => `<div class="r" style="top:${(i*rh).toFixed(2)}pt;height:${rh.toFixed(2)}pt"><span class="l" data-slot="front.grid${i}.l" data-lines="1">${esc(r[0])}</span><span class="v" data-slot="front.grid${i}.v" data-lines="1">${r[1]}</span></div>`).join('') +
      `<div class="end" style="top:${h}pt"></div></div>`; };

  // ---------- the room legend ----------
  const legendH = (floors, pitch) => floors.reduce((a, f) => a + (floors.length > 1 ? 21 : 0) + f.rooms.length*pitch, 0);
  const legend = (floors, x, y, w, pitch, slot) => { let k = 0;
    const rows = floors.map(f => (floors.length > 1 ? `<tr class="hd" style="height:21pt"><td colspan="2" data-slot="${slot}.floor${k}" data-lines="1">${esc(f.label)}</td></tr>` : '') +
      f.rooms.map(r => { const i = k++; return `<tr style="height:${pitch}pt"><td data-slot="${slot}.room${i}" data-lines="1">${esc(r[0])}</td><td data-slot="${slot}.size${i}" data-lines="1">${esc(feetOnly(r[1]))}</td></tr>`; }).join('')).join('');
    return `<div class="lg" style="left:${x}pt;top:${y}pt;width:${w}pt"><table>${rows}</table></div>`; };

  // ---------- the Around row (a few real places, or real facts of the house) ----------
  const strip = (A, x, y, w) => { const items = (A.items || []).slice(0, 3);
    return `<div class="abs kick" style="left:${x}pt;top:${y}pt;width:${w}pt;height:10pt" data-slot="back.aroundhead" data-lines="1">${esc(A.head || '')}</div>` +
      `<div class="abs strip" style="left:${x}pt;top:${y + 14}pt;width:${w}pt;height:34pt">${items.map((q, i) => `<div class="around"><div class="d" data-slot="back.near${i}.d" data-lines="1">${esc(q.d)}${q.u ? `<small>${esc(q.u)}</small>` : ''}</div><div class="p" data-slot="back.near${i}.p" data-lines="1">${esc(q.p)}</div></div>`).join('')}</div>`; };
  const STRIP_H = 48;

  const fine = side === 'back' && hasPlan ? 'Information deemed reliable but not guaranteed. The floor plan and room sizes are approximate and not to scale.' : (side === 'back' ? 'Information deemed reliable but not guaranteed. Room sizes are approximate.' : 'Information deemed reliable but not guaranteed.');
  // the footer: the agent card at the left; the brokerage's office lines at the right, level with the card's own lines
  // (office phone on the name line, website on the phone line, same size), set off by a hairline. The one logo is up top.
  const OW = 172, b = D.brand || {};
  const footer = () => SP.card(D, [X0, CARD_Y, CW - OW, CARD_H], {layout: 'panel', size: 'mid', brokerage: false, fine: '', grow: 0, s: {desigInline: true}}) +
    `<div class="abs" style="left:${X0 + CW - OW}pt;top:${CARD_Y}pt;width:1pt;height:${CARD_H}pt;background:var(--line)"></div>` +
    `<div id="offblk" class="abs" style="left:${X0 + CW - OW + 14}pt;top:${CARD_Y}pt;width:${OW - 14}pt;height:${CARD_H}pt;white-space:nowrap;color:var(--ink)">` +
    (b.phone ? `<div class="ol" data-at="name" data-slot="broker.phone" data-lines="1" style="font:400 13pt/16pt var(--font-body)">${esc(b.officeLabel || 'Office')} <b style="font-weight:700">${esc(b.phone)}</b></div>` : '') +
    (b.web ? `<div class="ol" data-at="phone" data-slot="broker.web" data-lines="1" style="font:400 13pt/16pt var(--font-body)">${esc(b.web)}</div>` : '') + `</div>` +
    `<div class="abs fl-fine" style="left:${X0}pt;top:${CARD_Y + CARD_H + 8}pt;width:${CW}pt;height:8pt" data-slot="fineprint" data-lines="1" data-fine="1">${esc(fine)}</div>`;
  const logo = (x, y, w, hh, al) => MR.logo(D, x, y, w, hh, al).replace(' data-slot="broker.logo"', '');

  let h = '', after = () => {};

  // ======================================= FRONT =======================================
  if(side === 'front'){
    const FBOT = 752;   // no contact card or brokerage logo on a flyer front (owner 11/10/2026): the page runs down to the fine print
    const K = FL.front || {}, caps = (K.caps || []).slice(0, 3), stack = (K.stack || []).slice(0, 2), heroId = K.hero || 'hero';
    const GAP = 12, CAPW = (CW - 2*GAP)/3, LW = 352, RX = X0 + LW + 10, RW = X0 + CW - RX;
    const capN = commonN(caps.map(c => c.text), CAPW, CAPSTYLE, [3, 4, 5]) || 3;
    let pick = null;
    outer: for(const PH of [104, 100, 96, 92, 108, 88]) for(const N of [7, 8, 6, 9]){
      const capTop = FBOT - capH(capN) - 6 - PH, wb = capTop - 14, HH = wb - N*14 - 120;
      if(HH >= 232 && HH <= 360 && commonN([K.intro], LW, BODYSTYLE, [N])){ pick = {PH, N, capTop, wb, HH}; break outer; }
    }
    if(!pick){ const PH = 96, N = 7, capTop = FBOT - capH(capN) - 6 - PH, wb = capTop - 14; pick = {PH, N, capTop, wb, HH: wb - N*14 - 120}; }
    const {PH, N, capTop, wb, HH} = pick, sh = (HH - 10)/2;
    let ph = SP.photo(D, heroId, X0, 36, LW, HH, 'front.hero');
    stack.forEach((id, i) => { ph += SP.photo(D, id, RX, 36 + i*(sh + 10), RW, sh, 'front.stack' + i); });
    h += `<div class="abs" data-gapcheck="front.photos" style="left:0;top:0">${ph}</div>`;
    const AB = 36 + HH + 12;
    h += `<div class="abs kick" style="left:${X0}pt;top:${AB}pt;width:${LW}pt;height:10pt" data-slot="front.kicker" data-lines="1">${esc((K.kicker || SP.placeZip(L)).toUpperCase())}</div>`;
    h += `<div class="abs fl-addr" style="left:${X0 - 1}pt;top:${AB + 14}pt;width:${LW + 2}pt;height:40pt" data-slot="address" data-lines="1">${esc(L.address)}</div>`;
    h += MR.rule(X0, AB + 60, LW);
    h += para('front.about', K.intro, X0, AB + 72, LW, N, {fill: true});
    h += detailGrid(RX, AB, RW, wb - AB);
    // three captioned photos
    let row = '', cw = CAPW;
    caps.forEach((c, i) => { const x = X0 + i*(cw + GAP); row += SP.photo(D, c.id, x, capTop, cw, PH, 'front.cap' + i); });
    h += `<div class="abs" data-gapcheck="front.row" style="left:0;top:0">${row}</div>`;
    caps.forEach((c, i) => { h += cap(c, `front.cap${i}`, X0 + i*(cw + GAP), capTop + PH + 6, cw, capN, 'front'); });
    h += `<div class="abs fl-fine" style="left:${X0}pt;top:762pt;width:${CW}pt;height:8pt" data-slot="fineprint" data-lines="1" data-fine="1">${esc(fine)}</div>`;
  }

  // ======================================= BACK =======================================
  else {
    const B = FL.back || {}, V = (hasPlan ? B.plan : B.noplan) || {}, TOP = 92, HB = BOT - TOP;
    h += `<div class="abs kick" style="left:${X0}pt;top:34pt;width:${CW - 140}pt;height:10pt" data-slot="back.kicker" data-lines="1">${esc((V.kicker || '').toUpperCase())}</div>`;
    h += logo(X0 + CW - 150, 22, 150, 30, 'flex-end');
    h += `<div class="abs title one" style="left:${X0}pt;top:50pt;width:${CW - 160}pt;height:34pt" data-slot="back.title" data-lines="1" data-fit="20">${esc(V.title || '')}</div>`;
    h += MR.rule(X0, 84, CW);
    const floors0 = (B.floors || []).map(f => ({label: f.label, rooms: f.rooms.map(r => [r[0], r[1]])}));
    // beside the plan, the room sizes are the plan's own names and sizes (owner 11/13/2026, captions round 3 Q2); floor i of the list
    // reads floor i of the plan
    const floors = hasPlan && window.PlanRooms ? floors0.map((f, i) => ({label: f.label, rooms: (floors0.length === (D.plan.levels || []).length ? PlanRooms.floor(D, f.rooms.map(r => ({name: r[0], size: r[1]})), i) : PlanRooms.match(D, f.rooms.map(r => ({name: r[0], size: r[1]})))).map(q => [q.name, q.size])})) : floors0;
    const stripY = BOT - STRIP_H;

    if(hasPlan){
      // the pale board: the agent's plan as given, one scale, sized to the board
      const pr = MR.plan(D, {x: 0, y: 0, w: 276, h: HB - 24}), PW = Math.max(230, Math.min(300, Math.round((pr.used ? pr.used.w : 240) + 24)));
      const RX = X0 + PW + 16, RW = X0 + CW - RX;
      h += `<div class="board" style="left:${X0}pt;top:${TOP}pt;width:${PW}pt;height:${HB}pt"></div>`;
      const pl = MR.plan(D, {x: X0 + 12, y: TOP + 12, w: PW - 24, h: HB - 24}); issues.push(...pl.issues); h += pl.html;
      // the legend, then one captioned photo that takes the rest of the column
      const pitch = floors.length > 1 ? 15.5 : 17, lh = legendH(floors, pitch), ly = TOP + 14;
      h += `<div class="abs kick" style="left:${RX}pt;top:${TOP}pt;width:${RW}pt;height:10pt" data-slot="back.legendhead" data-lines="1">${esc(B.legendHead || 'Room sizes')}</div>`;
      h += legend(floors, RX, ly, RW, pitch, 'back');
      const rTop = ly + lh + 14, rBot = stripY - 14, ph = V.photo || {};
      let best = null;
      for(const n of [6, 5, 7, 4, 8, 9]){ const pH = rBot - rTop - 6 - capH(n), a = RW/pH; if(pH >= 90 && a >= 1.2 && a <= 2.6 && commonN([ph.text], RW, CAPSTYLE, [n])){ const sc = Math.abs(a - 1.75); if(!best || sc < best.sc) best = {n, pH, sc}; } }
      if(!best){ const n = 6; best = {n, pH: rBot - rTop - 6 - capH(n)}; }
      h += SP.photo(D, ph.id, RX, rTop, RW, best.pH, 'back.photo');
      h += cap(ph, 'back.photo', RX, rTop + best.pH + 6, RW, best.n, 'back');
      h += strip(B.around || {}, RX, stripY, RW);
    } else {
      // the pale board: a photo, then the rooms floor by floor
      const PW = 262, RX = X0 + PW + 16, RW = X0 + CW - RX, pn = V.panel || {}, iw = PW - 24;
      h += `<div class="board" style="left:${X0}pt;top:${TOP}pt;width:${PW}pt;height:${HB}pt"></div>`;
      const pitch = 17, lh = legendH(floors, pitch);
      let best = null;
      for(const n of [6, 5, 7, 4, 8]){ const pH = HB - 24 - lh - 14 - 6 - capH(n), a = iw/pH; if(pH >= 90 && a >= 0.95 && a <= 2.2 && commonN([pn.text], iw, CAPSTYLE, [n])){ const sc = Math.abs(a - 1.3); if(!best || sc < best.sc) best = {n, pH, sc}; } }
      if(!best){ const n = 6; best = {n, pH: HB - 24 - lh - 14 - 6 - capH(n)}; }
      h += SP.photo(D, pn.id, X0 + 12, TOP + 12, iw, best.pH, 'back.panel');
      h += cap(pn, 'back.panel', X0 + 12, TOP + 12 + best.pH + 6, iw, best.n, 'panel');
      h += legend(floors, X0 + 12, TOP + HB - 12 - lh, iw, pitch, 'back');
      // two captioned photos and the Around row
      const ps = (V.photos || []).slice(0, 2), region = stripY - 14 - TOP, each = (region - 14)/2;
      let pb = null;
      for(const n of [5, 6, 4, 7]){ const pH = each - 6 - capH(n), a = RW/pH; if(pH >= 90 && a >= 1.3 && a <= 2.6 && commonN(ps.map(p => p.text), RW, CAPSTYLE, [n])){ const sc = Math.abs(a - 1.8); if(!pb || sc < pb.sc) pb = {n, pH, sc}; } }
      if(!pb){ const n = 5; pb = {n, pH: each - 6 - capH(n)}; }
      let g = ''; ps.forEach((p, i) => { g += SP.photo(D, p.id, RX, TOP + i*(each + 14), RW, pb.pH, 'back.photo' + i); });
      h += `<div class="abs" data-gapcheck="back.photos" style="left:0;top:0">${g}</div>`;
      ps.forEach((p, i) => { h += cap(p, `back.photo${i}`, RX, TOP + i*(each + 14) + pb.pH + 6, RW, pb.n, 'right'); });
      h += strip(B.around || {}, RX, stripY, RW);
    }
    h += footer();
  }

  after = async () => {
    MR.fitLogos();
    { const blk = document.getElementById('offblk'), cc = document.querySelector('.cc[data-contactcard]');
      if(blk && cc){ const k = 96/72, bb = blk.getBoundingClientRect(), rows = {name: '.cc-name', phone: '.cc-phone'};
        blk.querySelectorAll('.ol').forEach(el => { const t = cc.querySelector(rows[el.dataset.at]); if(!t) return;
          const r = t.getBoundingClientRect(), mid = (r.top + r.bottom)/2 - bb.top;
          el.style.position = 'absolute'; el.style.left = '0'; el.style.top = ((mid - el.offsetHeight/2)/k) + 'pt'; }); } }
    // the street keeps every word: the line steps down to a floor to fit (own fit, so the shared suffix drop never runs)
    document.querySelectorAll('.fl-addr').forEach(el => { let sz = parseFloat(getComputedStyle(el).fontSize)*72/96; while(el.scrollWidth > el.clientWidth + .5 && sz > 22){ sz -= .5; el.style.fontSize = sz + 'pt'; } });
    for(const p of pending){
      const el = document.querySelector(`[data-slot="${p.slot}"]`); if(!el) continue;
      const n = +el.dataset.lines, {best, near} = search(el, p.bl, n);
      el.textContent = best ? best.t : near ? near.t : p.bl.map(o => o[0]).join(' ');
      if(!best) issues.push({slot: p.slot, kind: 'copy-does-not-fit', lines: n, detail: near ? `closest fill ${Math.round(near.fill*100)}%` : 'no combination reaches the line count'});
    }
    pending.length = 0;
  };
  await SP.finish(D, 612, 792, h, issues, after);
  if(window.PlanInk) PlanInk.applyAll(D, false);   // owner 11/10/2026 (p2): the listing plan's background is clear
})();
</script>
