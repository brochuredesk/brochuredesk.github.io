<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · Marquee fold-over</title>
<link rel="stylesheet" href="mq.css">
<link rel="stylesheet" href="mq-fo.css">
<script src="mq.js"></script>
<script>window.Ivory = {esc: s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))};</script>
<script src="plan.js"></script>
<script src="planink.js"></script>
<script src="../engine/baths.js"></script>
<script src="../engine/factrepeat.js"></script>
<script src="../engine/agentcard.js"></script>
<script src="mq-fo.js"></script>
<script src="mq-layout.js"></script>
<!--
  BrochureDesk · Marquee · 11 x 17 fold-over: one sheet folded once down the middle into four upright 8.5 x 11 panels,
  0.125 in (9 pt) bleed, text 0.5 in clear of the fold. The hand is the approved Open House library flyer B01 Marquee
  (templates/oh-library/b01-marquee*.html): the agent's brand-kit dark color as the field, B01's closed hairline frame drawn
  over everything on every panel, accent eyebrows, WorkSans caps headings over a short accent rule, WorkSans address and numerals,
  WorkSans body, photos edge to edge under the frame, and B01's white box with a thin accent line for the lists.
    FRONT  the place, the street, the facts, the whole house edge to edge, three rooms named under them, the write-up. No agent, no brokerage.
    LEFT   the living level: the centered heading and intro, the widest room edge to edge, two captioned rooms, the white box list.
    RIGHT  bedrooms and baths: the centered heading and intro, four captioned rooms.
    BACK   the plan (clear, light lines) or the outdoor photo, the floors, a photo with the other floor and Nearby, the white box lists,
           B01's footer card (the one logo of the outside spread) and the fine print.
  Modes: proof = four panel pages 8.75 x 11.25 in; print = two spreads 17.25 x 11.25 in, each half clipped at the fold.
-->
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const mode = D.mode || 'proof', K = D.sw || {}, issues = [];
  await SW.setup(D);
  const photoIds = html => [...String(html).matchAll(/data-photo="([^"]+)"/g)].map(m => m[1]);
  // owner 11/17 (book 4): the fold-over back is approved as it stands; the cover and inside pages change. Pass 1 fills the whole sheet with
  // the cover and inside pages the back was approved beside (FO.front0/left0/right0) and keeps that back; pass 2 fills the new cover and
  // inside pages beside the kept back (its words fixed, so they never repeat it), then the kept back goes back in place, untouched.
  const panel = (h, id) => `<div class="panel" data-panel="${id}"><div class="bg-paper"></div>${h}</div>`;
  const lay = panels => { let html = '';
    if(mode === 'print'){
      html += `<div class="page" data-page="outside" style="width:1242pt;height:810pt"><div class="half l">${panel(panels.back, 'back')}</div><div class="half r">${panel(panels.front, 'front')}</div></div>`;
      html += `<div class="page" data-page="inside" style="width:1242pt;height:810pt"><div class="half l">${panel(panels.left, 'left')}</div><div class="half r">${panel(panels.right, 'right')}</div></div>`;
    } else for(const id of ['front','back','left','right']) html += `<div class="page" data-page="${id}" style="width:630pt;height:810pt">${panel(panels[id], id)}</div>`;
    document.getElementById('pages').innerHTML = html; };
  const run = async (snug, keep) => {
    if(keep){ const cur = document.querySelector('[data-panel="back"]'), cl = keep.cloneNode(true);
      cl.querySelectorAll('[data-s]').forEach(e => { e.dataset.sKept = e.dataset.s; ['s', 'justify', 'span', 'try', 'j3', 'h0'].forEach(k => delete e.dataset[k]); });
      cur.replaceWith(cl); }
    await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
    FO.prep3();
    SW.fill();
    FO.refit();
    FO.grow();
    FO.just3();
    FO.capSnug(); snug();
    FO.leftHead();
    FO.gaps();
    if(keep && FO.bloom) FO.bloom();
    FO.sideCenter();
    if(FO.span && !document.querySelector('[data-span][data-spanned]')) FO.span();
    FO.tallStack();
    SW.fitLogos();
    if(window.ContactCard) ContactCard.fit(document);
    if(D.plan) PlanInk.applyAll(D, MQ.k.light); };
  const reset = () => { if(SW.resetFill) SW.resetFill(); delete FXS.__sizes; };
  let kept = null;
  if(FO.front0){ reset(); const b0 = FO.back(D, {});
    lay({front: FO.front0(D, {intro: (K.front || {}).summary, lines: 4}), back: b0.html, left: FO.left0(D), right: FO.right0(D)});
    await run(FO.frontSnug0, null); kept = document.querySelector('[data-panel="back"]'); kept.remove(); }
  reset();
  const pF = FO.front(D, {intro: (K.front || {}).summary, lines: 4}), pL = FO.left(D), pR = FO.right(D), bk = FO.back(D, {}); issues.push(...bk.issues);
  const panels = {front: pF, back: bk.html, left: pL, right: pR};
  lay(panels);
  await run(FO.frontSnug, kept);
  if(kept) document.querySelector('[data-panel="back"]').replaceWith(kept);
  { const rep = SW.spaceRepeats(D, ['front', 'back', 'left', 'right'].flatMap(k => photoIds(panels[k]))); rep.forEach(([sp, ps]) => issues.push({slot: 'foldover.' + sp, kind: 'space-twice-in-foldover', detail: `${sp}: ${ps.join(' and ')} show one physical space twice`})); }
  { const seenP = new Map(); for(const k of ['front', 'back', 'left', 'right']) photoIds(panels[k]).forEach(id => { if(seenP.has(id) && seenP.get(id) !== k) issues.push({slot: k + '.' + id, kind: 'photo-twice-in-foldover', detail: `${id} is on the ${seenP.get(id)} and on the ${k}`}); else seenP.set(id, k); }); }
  issues.push(...SW.focus(D)); issues.push(...MQ.veeFix(D)); MQ.foldTrim();
  // a tile cropped tighter than its photo: data-zoom="z,fx,fy" (the crop shows 1/z of the photo, anchored at the focus fractions)
  document.querySelectorAll('.ph[data-zoom]').forEach(el => { const [z, fx, fy] = el.dataset.zoom.split(',').map(Number), im = el.querySelector('img'); if(!im) return;
    im.style.cssText = `position:absolute;max-width:none;width:${z*100}%;height:${z*100}%;left:${-(z - 1)*fx*100}%;top:${-(z - 1)*fy*100}%;object-fit:cover`; });
  window.brochureCheck = () => SW.check(D, (window.planIssues || []).concat(issues, FXS.backTextBox(), FO.overlapCheck(), FO.factsCheck(), FO.fill3Check(), FXS.leftBoxCheck()));
  window.photoPlacements = SW.placements;
})();
</script>
</body>
</html>
