<!--
  BrochureDesk · Marquee · Just Listed and Just Sold postcards, in the hand of the approved Open House library flyer B46B Marquee
  (templates/oh-library/b46b-marquee*.html) and its sign-in sheet: the brand's dark field, the house cut by B46B's wide V with the accent
  echo, centered WorkSans type, the rule-diamond-rule divider, outlined diamonds for numbers and B46B's white box with the accent edge.
  data.piece.card = "listed" | "sold", data.piece.size = "6x11" (trim 792 x 432 pt) | "6x9" (648 x 432 pt), data.piece.side = "front" | "back".
  FRONTS. Just Listed: the house on the right, its foot cut into the V pointing down at the agent; beside it JUST / LISTED stacked large
  and centered on the left column's own axis, the divider, the street, the facts, the house's real story. A wide house runs across the top
  with the words under it. Just Sold, its own card: JUST SOLD across the top, the street under it; under them three columns on one axis:
  the seller question and the note in B46B's white box, the house with its roof-line cut (the marquee pointing up at the words), who to call.
  BACKS (the owner 11/16: the design runs through the whole card, mail side included): the dark field and the marquee line run edge to
  edge; the postage box, the address block and the barcode strip are small white markups set into it; the status and the street at the
  top left; two rooms under the V (Just Listed) or the six steps on B46B's numbered diamonds (Just Sold); the contact card half its old
  height in one row across the card; the fine print. No price, no QR, no brokerage address under the logo.
-->
<style>

  .pc-disc{position:absolute;font-size:7.5pt;line-height:10pt;font-weight:500;color:var(--fx-soft);overflow:hidden;white-space:nowrap}
  .pc-ret{position:absolute;font-family:var(--mq-font);font-weight:400;font-size:8.6pt;line-height:11pt;color:var(--fx-on);overflow:hidden;height:36pt}
  .pc-ret b{font-weight:700;letter-spacing:1.4pt;text-transform:uppercase}
  .mailp{position:absolute;background:#fff}
  .cap .a{font-weight:400}
</style>

<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const esc = SW.esc, b = D.brand || {}, A = D.agent || {}, L = D.listing, P = D.piece || {};
  document.body.dataset.mode = D.mode || 'email';
  await SW.setup(D);
  const sold = P.card === 'sold', big = P.size === '6x11', front = P.side === 'front';
  const W = big ? 792 : 648, H = 432, k = big ? 1.12 : 1;
  const K = ((D.sw || {}).pc || {})[sold ? 'js' : 'jl'] || {};
  const hsSrc = A.headshot && ((D.photos||{})[A.headshot] ? D.photos[A.headshot].src : A.headshot) || '';
  const word = sold ? 'Just Sold' : 'Just Listed';
  const issues = [];
  const place = [FXS.hood(L), FXS.placeLine(L)].filter(Boolean).join('  ·  ').toUpperCase(), ad = String(L.address || '');
  // reversed caps never under 8.6 pt: a line that does not fit gives up tracking before it gives up size
  const capsFit = (t, w, max, wt, tracks) => { for(const ls of tracks){ const fs = FXS.fitSize(t, `font-family:WorkSans;font-weight:${wt};letter-spacing:${ls}pt`, w, max, 8.6); if(FXS.width(t, `font-family:WorkSans;font-weight:${wt};letter-spacing:${ls}pt;font-size:${fs}pt`) <= w - 12) return {fs: Math.max(8.6, fs), ls}; } return {fs: 8.6, ls: tracks[tracks.length - 1]}; };
  const placeLine = (x, y, w, al, slot, max) => { const c = capsFit(place, w, max || 9.5*k, 600, [3, 2.2, 1.4, 0.8]); return `<div class="mq-place" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${13*k}pt;font-size:${c.fs}pt;line-height:${13*k}pt;letter-spacing:${c.ls}pt;text-align:${al || 'center'}" data-slot="${slot || 'front.place'}" data-lines="1">${esc(place)}</div>`; };
  const disp = (t, x, y, w, fs, slot, al) => `<div class="mq-disp" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${fs*1.08}pt;font-size:${fs}pt;line-height:${fs*1.08}pt;letter-spacing:${Math.min(3, fs*0.05)}pt;text-align:${al || 'center'}" data-slot="${slot}" data-lines="1">${esc(t)}</div>`;
  const street = (x, y, w, max, min, slot, al) => { const fs = FXS.fitSize(ad, 'font-family:WorkSans;font-weight:600', w - 4, max, min); return {fs, html: `<div class="mq-street" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${fs*1.2}pt;font-size:${fs}pt;line-height:${fs*1.2}pt;text-align:${al || 'center'}" data-slot="${slot || 'front.address'}" data-lines="1">${esc(ad)}</div>`}; };
  const dispFit = (t, w, max, min) => { let f = max; while(f > min && FXS.width(t.toUpperCase(), `font-family:WorkSans;font-weight:700;letter-spacing:${Math.min(3, f*0.05)}pt;font-size:${f}pt`) > w - 4) f -= 0.5; return f; };
  // the ink of one line of type (pt from its line box's top): where the letters start and end, for centering a heading block on its ink
  const inkV = (t, fam, wt, f, lhK) => { const cv = SW._inkCv || (SW._inkCv = document.createElement('canvas').getContext('2d')); cv.font = `${wt} ${f*96/72}px ${fam}`; const m = cv.measureText(String(t)), g = cv.measureText('Hg'), lh = f*lhK*96/72, base = (lh - (g.fontBoundingBoxAscent + g.fontBoundingBoxDescent))/2 + g.fontBoundingBoxAscent;
    return {top: (base - m.actualBoundingBoxAscent)*72/96, bot: (base + m.actualBoundingBoxDescent)*72/96}; };
  const desT = A.designation ? (A.nar || /realtor/i.test(A.designation) ? 'REALTOR®' : A.designation) : '';
  let h = '';

  // ---- Marquee postcards (11/16): the main color is the field, the dark leaf holds the numbers or the agent, the accent seam where a block
  // meets the photo, Anton capitals at poster scale (P51's PUBLIC / OPEN HOUSE), tracked Work Sans caps, the sign-in sheet's numbered squares.
  const AFp = 'font-family:Anton;letter-spacing:.5pt', af = (t, w, max, min) => FO.afit(t, w, max, min);
  const anton = (t, x, y, w, fs, slot, o) => { o = o || {}; return `<div class="mq-hl${o.ac ? ' ac' : ''}" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${fs*(o.k || 1)}pt;font-size:${fs}pt;line-height:${fs*(o.k || 1)}pt;text-align:${o.al || 'left'}${o.color ? ';color:' + o.color : ''}" data-slot="${slot}" data-lines="1">${esc(String(t).toUpperCase())}</div>`; };
  const hoodL = [FXS.hood(L), 'Houston, TX'].filter(Boolean).join('  ·  ');
  // the agent on a front: name in Anton, the designation and cell under it, the one logo beside
  const agentRow = (x, y, w, ns, logoW, logoH, onDark) => { const col = onDark ? 'var(--mq-on-dark)' : 'var(--mq-on)', acc = onDark ? 'var(--mq-acc-dark)' : 'var(--mq-accent)';
    return `<div class="abs" style="left:${x}pt;top:${y}pt;width:${w - logoW - 12}pt;white-space:nowrap">`
      + `<div style="font-family:Anton;font-size:${ns}pt;line-height:${ns*1.12}pt;letter-spacing:.4pt;text-transform:uppercase;color:${col}" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</div>`
      + `<div style="line-height:${11*k + 4}pt">${desT ? `<span style="font-family:var(--mq-font);font-weight:700;font-size:${8.6*k}pt;letter-spacing:1.6pt;color:${acc};margin-right:10pt" data-slot="agent.desig" data-lines="1">${esc(desT)}</span>` : ''}<span style="font-family:var(--mq-font);font-weight:600;font-size:${11*k}pt;color:${col}" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</span></div></div>`
      + FXS.logo(D, x + w - logoW, y + 2, logoW, logoH, 'flex-end'); };

  if(front){
    const F = K.front || {}, pid = FO.heroId(D, (F.cap || {}).photo || 'front');
    if(!sold){
      // ---------- JUST LISTED: the words stacked at poster scale on the main color at the left; the house runs from the seam to the
      // right, top and bottom edges; a dark leaf under the street carries the house's numbers as Anton numerals (P51's day) ----------
      let PW = Math.round(big ? W - 40 - 262 : W*0.56); while(PW < W*0.74 && !SW.fits(D, pid, PW, H + 18)) PW += 6;   // 6x11: the photo takes the room the words never used (owner 11/17 p8)
      if(!SW.fits(D, pid, PW, H + 18)){
        // a wide house: across the top, edge to edge, the seam under it; JUST LISTED on one line and the street on the main color at the
        // left; the numbers in the dark leaf at the right; the agent at the foot
        let HP = 230; while(HP < 300 && !SW.fits(D, pid, W + 18, HP + 9)) HP += 4; HP = Math.min(300, HP + 12);
        h += FXS.box(D, pid, -9, -9, W + 18, HP + 9, 'front.hero') + FO.seam(HP, -9, W + 9, 4);
        const LX = Math.round(W*0.62), TW = LX - 22 - 18; h += `<div class="mq-leaf" style="left:${LX}pt;top:${HP + 2}pt;width:${W - LX + 9}pt;height:${H - HP + 7}pt"></div>`;
        const AH = 34*k, rT = H - 20 - AH - 6, sf = af(ad, TW*0.55, 20*k, 12), js = Math.min(af('JUST LISTED', TW*0.55, 58*k, 30), (rT - 10 - HP - 12 - 4 - sf*1.1)/.96);
        let y = HP + 12 + Math.max(0, (rT - 6 - HP - 12 - (js*.96 + 4 + sf*1.1))/2);
        h += anton('Just Listed', 17, y, TW, js, 'front.status', {k: .96}) + anton(ad, 18, y + js*.96 + 4, TW, sf, 'front.address', {k: 1.1});
        // owner 11/17 (book 4 p6, p8: more bullets): the house's highlights run beside the words, centered between the seam and the rule
        { const nB = big ? 3 : 4, bx = 18 + Math.max(FO.aw('JUST LISTED', js), FO.aw(ad, sf)) + 26, bwd = TW + 18 - bx, bwf = (t, f) => FXS.width(t, `font-family:WorkSans;font-weight:600;font-size:${f}pt`);
          const pool = (F.highlights || []).concat(FXS.tagFacts(D).tags || []).filter((t, i, a) => a.indexOf(t) === i); let hs = 11.5*k, rh, n, hl;
          for(; hs >= 9; hs -= 0.25){ rh = hs*1.5; hl = pool.filter(t => bwf(t, hs) <= bwd - 16); n = Math.min(nB, hl.length, Math.floor((rT - 8 - HP - 8)/rh)); if(n >= Math.min(nB, 3)) break; }
          const yb = HP + 2 + (rT - HP - 2 - n*rh)/2;
          hl.slice(0, n).forEach((t, i) => { h += FO.sq('', bx, yb + i*rh + rh/2 - 3, 6, 'ac') + `<div class="abs" style="left:${bx + 14}pt;top:${yb + i*rh}pt;width:${bwd - 14}pt;height:${rh}pt;font-family:var(--mq-font);font-weight:600;font-size:${hs}pt;line-height:${rh}pt;color:var(--mq-on);white-space:nowrap" data-slot="front.hl.${i}" data-lines="1">${esc(t)}</div>`; }); }
        h += `<div class="abs" style="left:18pt;top:${H - 20 - AH - 6}pt;width:${TW}pt;height:1pt;background:var(--mq-rule)"></div>` + agentRow(18, H - 20 - AH, TW, 14*k, Math.min(92*k, TW*0.4), 24*k);
        const parts = FXS.statItems(L).filter(t => !/^Built/.test(t)).map(FXS.statParts).slice(0, 3).map(p => Object.assign(p, {l: /^bed/i.test(p.l) ? 'Beds' : p.l})), lw = W - LX - 18, ch = (H - HP - 24)/parts.length;
        parts.forEach((p, i) => { const yy = HP + 12 + i*ch, f = af(p.n, lw - 16, Math.min(30*k, ch - 18), 14), t0 = yy + (ch - f - 14)/2;
          if(i) h += `<div class="abs" style="left:${LX + 24}pt;top:${yy - .5}pt;width:${lw - 30}pt;height:1pt;background:color-mix(in srgb, var(--mq-on-dark) 40%, transparent)"></div>`;
          h += `<div class="mq-num" style="left:${LX}pt;top:${t0}pt;width:${lw + 9}pt;height:${f}pt;font-size:${f}pt;line-height:${f}pt" data-slot="front.fact${i}" data-lines="1">${esc(p.n)}</div>` + FO.kk(p.l, LX + 4, t0 + f + 2, lw, `front.fact${i}.l`, {al: 'center', fs: 9, ls: 2, color: 'var(--mq-on-dark)'}); });
      } else {
      // owner 11/17 (book 4 p6: two more bullets; p8: three bullets, everything above them tighter; no empty space): the column is as wide
      // as its widest line (the agent's row, the bullets); JUST LISTED runs across it on one line; the place, the status, the street, the
      // leaf of numbers and the bullets share the height with even gaps; the photo takes the rest of the card
      const nB = big ? 3 : 4, TX = 22, uniq = (t, i, a) => a.indexOf(t) === i, bw = (t, f) => FXS.width(t, `font-family:WorkSans;font-weight:600;font-size:${f}pt`);
      const agW = Math.max(FO.aw(A.name || '', 15*k), (desT ? FXS.width(desT, `font-family:WorkSans;font-weight:700;letter-spacing:1.6pt;font-size:${8.6*k}pt`) + 10 : 0) + FXS.width(A.phone || '', `font-family:WorkSans;font-weight:600;font-size:${11*k}pt`)) + 96*k + 24;
      const pool = (F.highlights || []).concat(FXS.tagFacts(D).tags || []).filter(uniq).filter(t => bw(t, 10.5*k) <= 300*k).slice(0, nB);
      let PX = W - PW; { const cw = Math.max(agW, ...pool.map(t => bw(t, 11*k) + 34), W*0.3), PXn = Math.round(TX + cw + 22); if(PXn < PX){ let pw = W - PXn; while(pw > PW && !SW.fits(D, pid, pw, H + 18)) pw -= 6; PX = W - pw; } }
      h += FXS.box(D, pid, PX, -9, W - PX + 9, H + 18, 'front.hero') + `<div class="mq-seam" style="left:${PX - 2}pt;top:-9pt;width:4pt;height:${H + 18}pt"></div>`;
      const TW = PX - 18 - TX, agY = H - 20 - 34*k, js = af('JUST LISTED', TW - 2, 96*k, 30), sf = af(ad, TW - 2, 30*k, 13);
      let hs = 13*k; while(hs > 10.5*k && pool.some(t => bw(t, hs) > TW - 18)) hs -= 0.25; const hls = pool.filter(t => bw(t, hs) <= TW - 18), rh = hs*1.6;
      const lh0 = 54*k, parts = FXS.statItems(L).filter(t => !/^Built/.test(t)).map(FXS.statParts).slice(0, 3).map(p => Object.assign(p, {l: /^bed/i.test(p.l) ? 'Beds' : p.l})), cw = (PX - 2)/Math.max(1, parts.length);
      const blocks = [{h: 12*k, f: y => FO.kk(hoodL, TX, y, TW, 'front.place', {fs: 9*k, ls: 2.6})},
        {h: js*.96, f: y => anton('Just Listed', TX - 1, y, TW, js, 'front.status', {k: .96})},
        {h: sf*1.1, f: y => anton(ad, TX, y, TW, sf, 'front.address', {k: 1.1})},
        {h: lh0, f: y => `<div class="mq-leaf" style="left:-9pt;top:${y}pt;width:${PX - 2 + 9}pt;height:${lh0}pt"></div>` + parts.map((p, i) => { const x = i*cw, f = af(p.n, cw - 12, 28*k, 14), t0 = y + (lh0 - f - 13)/2;
          return (i ? `<div class="abs" style="left:${x - .5}pt;top:${y + 9}pt;width:1pt;height:${lh0 - 18}pt;background:color-mix(in srgb, var(--mq-on-dark) 40%, transparent)"></div>` : '')
            + `<div class="mq-num" style="left:${x}pt;top:${t0}pt;width:${cw}pt;height:${f}pt;font-size:${f}pt;line-height:${f}pt" data-slot="front.fact${i}" data-lines="1">${esc(p.n)}</div>` + FO.kk(p.l, x + 3, t0 + f + 2, cw - 6, `front.fact${i}.l`, {al: 'center', fs: 8.6, ls: 1.4, color: 'var(--mq-on-dark)'}); }).join('')},
        {h: hls.length*rh, f: y => hls.map((t, i) => FO.sq('', TX, y + i*rh + rh/2 - 3, 6, 'ac') + `<div class="abs" style="left:${TX + 14}pt;top:${y + i*rh}pt;width:${TW - 14}pt;height:${rh}pt;font-family:var(--mq-font);font-weight:600;font-size:${hs}pt;line-height:${rh}pt;color:var(--mq-on);white-space:nowrap" data-slot="front.hl.${i}" data-lines="1">${esc(t)}</div>`).join('')}];
      const top = 16, bot = agY - 8, tot = blocks.reduce((s, b) => s + b.h, 0), gap = Math.max(6, (bot - top - tot)/(blocks.length));
      let y = top + gap*0.25; blocks.forEach((b, i) => { h += b.f(y); y += b.h + (i === 1 ? gap*0.45 : i === 0 ? gap*0.6 : gap*1.2); });
      h += `<div class="abs" style="left:${TX}pt;top:${agY - 8}pt;width:${TW}pt;height:1pt;background:var(--mq-rule)"></div>` + agentRow(TX, agY, TW, 15*k, Math.min(96*k, TW*0.42), 26*k);
      }
    } else {

      // the dark leaf at the right names where it sold (the neighborhood) over a short accent rule; the seam; under it the house at the left
      // and, at the right, the seller question and the note in P51's white box, then who to call. No house features (owner 11/7). ----------
      const BH = 156*k > 168 ? 168 : 156*k, TW0 = Math.round(W*0.66) - 22 - 18; let stf = af(ad, TW0, 26*k, 14);
      // owner 11/17 (book 4: every heading centered in its space): JUST SOLD and the street are one block whose ink sits centered between
      // the card's top and the seam, never under 0.2 in from the trim; the leaf then takes the room the words leave
      let js = Math.min(af('JUST SOLD', TW0, 120*k, 50), (BH - 15 - 6 - stf*1.1 - 8)/1.26), y0;
      stf = Math.max(stf, Math.min(36*k, af(ad, FO.aw('JUST SOLD', js) - 6, 36*k, 14))); js = Math.min(js, (BH - 15 - 6 - stf*1.1 - 8)/1.26);   // the street as wide as JUST SOLD above it (no empty corner beside it)
      for(;; js -= 0.5){ const a1 = inkV('JUST SOLD', 'Anton', 400, js, .96), a2 = inkV(ad.toUpperCase(), 'Anton', 400, stf, 1.1), top = a1.top, bot = js*.96 + 6 + a2.bot, ink = bot - top; y0 = (BH - ink)/2 - top; if(y0 + top >= 16 || js <= 40) break; }
      const LX = Math.round(Math.min(W*0.72, Math.max(W*0.4, 18 + Math.max(FO.aw('JUST SOLD', js), FO.aw(ad, stf)) + 30))), TW = LX - 22 - 18;
      h += `<div class="mq-leaf" style="left:${LX}pt;top:-9pt;width:${W - LX + 9}pt;height:${BH + 9}pt"></div>`;
      h += anton('Just Sold', 18, y0, TW, js, 'front.status', {k: .96}) + anton(ad, 20, y0 + js*.96 + 6, TW, stf, 'front.address', {k: 1.1, ac: 1});
      const hood = FXS.hood(L) || L.city || 'Houston', lw = W - LX - 18, hf = FO.poster(hood, lw - 20, BH - 70, 72*k, 18, 2, 1);
      h += FO.vstack([{h: 20, html: yy => FO.kk('Sold in', LX + 9, yy, lw, 'front.leaf.k', {al: 'center', fs: 9.5*k, ls: 3.6, color: 'var(--mq-acc-dark)'})},
        {h: hf.lines.length*hf.lh + 6, html: yy => FO.posterHtml(hf, LX + 9, yy, lw, 'front.leaf.n', {al: 'center'}).replace(/class="mq-hl"/g, 'class="mq-hl" data-leaf="1"').replace(/color:var\(--mq-on\)/g, '')},
        {h: 12, html: yy => `<div class="mq-rl" style="left:${LX + 9 + lw/2 - 22}pt;top:${yy + 4}pt;width:44pt"></div>`},
        {h: 16, html: yy => FO.kk('Houston, TX', LX + 9, yy, lw, 'front.leaf.s', {al: 'center', fs: 9*k, ls: 2.4, color: 'var(--mq-on-dark)'})}], 16, BH);
      h += `<style>.mq-hl[data-leaf]{color:var(--mq-on-dark)}</style>`;
      // the house under the seam
      let PW = Math.round(W*0.5); while(PW < W*0.62 && !SW.fits(D, pid, PW + 9, H - BH + 9)) PW += 6;
      h += FXS.box(D, pid, -9, BH, PW + 9, H - BH + 9, 'front.hero') + FO.seam(BH, -9, W + 9, 4);
      // owner 11/17 (p10, p12): a bigger "Thinking about selling" box with more to say: the box runs from under the seam to the agent's row,
      // the question at its head, then the fullest set of the note's true sentences that fills the box (every line 80%+, the last 90%+, justified)
      const RX = PW + 18, RW = W - 22 - RX, nb = 13*k, AH = 40*k, by = BH + 14, bh = H - 18 - AH - 10 - by, qs = af('Thinking about selling?', RW - 2*nb, 24*k, 14), tw = RW - 2*nb;
      const S = (((F.note || {}).s) || []).map(x => [].concat(x)), avail = bh - 2*nb - qs*1.1 - 10; let nt = null;
