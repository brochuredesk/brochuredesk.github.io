<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · fxs-40 fold-over</title>
<link rel="stylesheet" href="fxs40.css">
<script src="fxs40.js"></script>
<script>window.Ivory = {esc: s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))};</script>
<script src="plan.js"></script>
<script src="../engine/baths.js"></script>
<script src="../engine/agentcard.js"></script>
<!--
  BrochureDesk · fxs-40 (FX40 look) · 11 x 17 fold-over: one sheet folded once down the middle into four upright 8.5 x 11 panels,
  0.125 in (9 pt) bleed, 0.25 in safe zone. Outside spread: back (left) + cover (right). Inside spread: left + right.
  Every panel keeps the FX40 hand (tokens: fxs40-tokens.css): the address set vertically up the left edge with the gold rule and the vertical
  place line, square photos with gold hairline-underlined labels, Cormorant italic write-ups, the round seal, white notes cards.
    COVER   the FX40 front: whole house, two rooms with the neighborhood seal, write-up, four-stat row, agent and the one logo.
    BACK    the FX40 back: four outdoor / community photos (or the plan and two), About the house, the two notes cards, the standard agent card.
    LEFT    kicker, title, intro; three captioned rooms; the feature card (heading and six labeled notes in two columns).
    RIGHT   kicker, title, intro; three rows of captioned photos on one two-column split; the one logo at the foot.
  Copy comes as a lead plus whole sentences (data.sw.*); fxs40.js picks the sentences that fill each box (last line at least 3/4 full).
  Modes: proof = four panel pages 8.75 x 11.25 in; print = two spreads 17.25 x 11.25 in, each half clipped at the fold.
-->
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const mode = D.mode || 'proof';
  const esc = SW.esc, L = D.listing, K = D.sw || {};
  const issues = [];
  await SW.setup(D);
  const X0 = 36, CW = 540, gap = 9;
  const usedCover = [(K.front || {}).hero || 'front'].concat(FXS.coverRooms(D));

  // ================= COVER =================
  const photoIds = html => [...String(html).matchAll(/data-photo="([^"]+)"/g)].map(m => m[1]);
  const rightIds = [].concat(...(((K.right || {}).rows) || [])).map(c => c.photo);
  const cover = () => FXS.cover(D, {});
  // ================= BACK (outside) =================
  const back = (avoid) => { const r = FXS.back(D, {outdoor: true, avoid, coverText: [(K.front || {}).summary, ((D.companion || {}).flyer || {}).front && D.companion.flyer.front.intro]}); issues.push(...r.issues); return r.html; };
  // ================= INSIDE LEFT: a full-bleed room, a gold rule, the script title and intro, three captioned rooms, the framed feature box =================
  // both inside pages end on one bottom margin: the framed box ends where the last caption on the right ends
  const RPH = 92, RGAP = 12, RLINES = 3, PB = 756;
  const allS = rows => [].concat(...rows.map(c => [].concat(...(c.s || []).map(x => [].concat(x))))), rightOthers = allS([].concat(...(((K.right || {}).rows) || []))), leftOthers = allS((K.left || {}).photos || []).concat([].concat(...((((K.left || {}).box || {}).items) || []).map(it => allS([it]))));
  const headR = () => { const R = K.right || {}; return FXS.pageHead(R.kicker || '', R.title || '', R.intro, 'right', 4, 30); };
  const rowsTop = headR().bottom + 34, RPH2 = Math.min(132, Math.floor((PB - 52 - rowsTop - 3*(25 + RLINES*13.5) - 2*RGAP)/3)), rightBottom = rowsTop + 3*(RPH2 + 25 + RLINES*13.5) + 2*RGAP;
  const left = (avoid) => {
    const I = K.left || {}, box = I.box || {};
    const hs = FXS.fitSize(box.heading || '', "font-family:'Cormorant Garamond';font-weight:500", CW - 44, 26, 19), pitch = 3*13 + 8.64;
    // owner 11/7 (fold-over review p18): every bullet in the box is a three-line write-up: three columns of two rows, so each item's two real facts run three full lines
    const BCOLS = 3, BROWS = 2, cardH = 14 + 12 + 8 + hs*1.2 + 10 + BROWS*pitch + 6, cy = PB - cardH;
    // never a room that is on the inside right (or the cover): the same room under another number counts ("game" and "game3", "pbath" and "pbath2")
    const rkey = id => String(id).replace(/\d+[a-z]?$/, ''), avoidIds = usedCover.concat(rightIds, avoid || []), rightKeys = new Set(rightIds.map(rkey));
    const pool = FXS.cards(D, I.photos || []).filter(c => !rightKeys.has(rkey(c.photo)));
    let cards0 = FXS.pick(D, pool, 4, {avoid: avoidIds, exactAvoid: true, noHouse: true, indoor: true});
    // too few rooms that are not on the inside right: a deck or patio photo fills the slot (never a room the inside right shows)
    if(cards0.length < 4) cards0 = cards0.concat(FXS.pick(D, pool, 4 - cards0.length, {avoid: avoidIds.concat(cards0.map(c => c.photo)), exactAvoid: true, noHouse: true, outdoor: true}).filter(c => !cards0.some(x => x.photo === c.photo)));
    const heroC = cards0.slice().sort((p, q) => FXS.archScore(D, q.photo) - FXS.archScore(D, p.photo))[0], cards = cards0.filter(c => c !== heroC).slice(0, 3);
    // header sits between the hero's gold rule and the captioned rooms; the row photos grow to meet the header (owner 11/7: no empty band)
    const heroH = 226, hd = FXS.pageHead('', I.title || '', I.intro, 'left', 3, heroH + 16, {w: 410});
    const nC = Math.max(2, cards.length), pw = (CW - (nC - 1)*gap)/nC, capBlock = 7 + 12 + 6 + 3*13, ph = Math.max(nC < 3 ? 90 : 86, Math.min(170, Math.floor(cy - 14 - capBlock - (hd.bottom + 18)))), py = cy - 14 - capBlock - ph;
    let h = FXS.box(D, heroC.photo, -9, -9, 630, heroH + 9, 'left.hero') + FXS.titleBadge(I.kicker || '', 512, heroH, 124, 'left.badge') + hd.html;
    const slack = py - hd.bottom - 10;
    cards.forEach((c, i) => { h += FXS.captioned(D, c, X0 + i*(pw + gap), py, pw, ph, 3, 'left.photo' + i, {narrow: 14, fs: 9.5, lh: 13}); });
    h += `<div class="card" style="left:${X0}pt;top:${cy}pt;width:${CW}pt;height:${cardH}pt"></div>`;
    h += `<div class="abs" style="left:${X0 + 22}pt;top:${cy + 14}pt">${FXS.label(box.kicker || '', 'left.box.kicker')}</div>`;
    h += `<div class="abs" style="left:${X0 + 22}pt;top:${cy + 14 + 12 + 8}pt;width:${CW - 44}pt;height:${hs*1.2}pt;font:500 ${hs}pt/${hs*1.2}pt var(--fx-serif);color:var(--fx-ink);white-space:nowrap;overflow:hidden" data-slot="left.box.heading" data-lines="1">${esc(box.heading || '')}</div>`;
    const items = (box.items || []).slice(0, 6), gy = cy + 14 + 12 + 8 + hs*1.2 + 10, colw = (CW - 44 - 2*20)/BCOLS;
    items.forEach((it, i) => { const r = Math.floor(i/BCOLS), c = i%BCOLS, x = X0 + 22 + c*(colw + 20), y = gy + r*pitch;
      h += `<div class="abs" style="left:${x}pt;top:${y + 2}pt;font-size:6pt;line-height:9pt;color:var(--fx-accent)">●</div>`;
      h += `<div class="abs" style="left:${x + 14}pt;top:${y}pt;width:${colw - 14}pt;height:${3*13}pt;font:300 10pt/13pt var(--fx-font);color:var(--fx-text);overflow:hidden" data-slot="left.box.t${i}" data-lines="3" data-try="3" data-narrow="8" data-lh="13" ${FXS.sd(it.s)}></div>`; });
    return h;
  };
  // ================= INSIDE RIGHT: script title and intro, three rows of captioned photos on one two-column split =================
  const right = () => {
    const R = K.right || {}, rows = R.rows || [];
    const hd = headR();
    let h = `<div class="bluebar" style="left:-9pt;top:-9pt;width:630pt;height:${hd.bottom + 9 + 12}pt"></div>` + hd.html;
    const rw = (CW - gap)/2, lines = RLINES, ph = RPH2, rowGap = RGAP, y0 = rowsTop;
    h += `<div class="vr" style="left:${X0 + rw + gap/2}pt;top:${y0}pt;height:${3*(ph + 25 + lines*13.5) + 2*rowGap}pt"></div>`;
    let k = 0;
    const nk = x => String(x).toLowerCase().replace(/[^a-z0-9 ]/g, '').slice(0, 40), seenS = new Set();
    rows.slice(0, 3).forEach(r => r.slice(0, 2).forEach((c, i) => { const kept = (c.s || []).filter(x => ![].concat(x).some(a => seenS.has(nk(a)))); if(kept.length >= 2) r[i] = Object.assign({}, c, {s: kept}); (r[i].s || []).forEach(x => [].concat(x).forEach(a => seenS.add(nk(a)))); }));
    rows.slice(0, 3).forEach((r, ri) => { r.slice(0, 2).forEach((c, i) => { h += FXS.captioned(D, c, X0 + i*(rw + gap), y0 + ri*(ph + 25 + lines*13.5 + rowGap), rw, ph, lines, 'right.photo' + (k++), {narrow: 12}); }); });
    h += `<div class="hr" style="left:${X0}pt;top:${PB - 40}pt;width:${CW}pt"></div>`;
    h += FXS.logo(D, X0 + CW - 190, PB - 34, 190, 34, 'flex-end');
    return h;
  };

  // ---------- assemble ----------
  const pF = cover(), pR = right(), pB = back(photoIds(pF).concat(photoIds(pR))), pL = left(photoIds(pF).concat(photoIds(pR), photoIds(pB)));   // the back picks its outdoor photos first: the inside pages use rooms
  const panels = {front: pF, back: pB, left: pL, right: pR};
  const panel = h => `<div class="panel"><div class="bg-paper"></div>${h}</div>`;
  let html = '';
  if(mode === 'print'){
    html += `<div class="page" data-page="outside" style="width:1242pt;height:810pt"><div class="half l">${panel(panels.back)}</div><div class="half r">${panel(panels.front)}</div></div>`;
    html += `<div class="page" data-page="inside" style="width:1242pt;height:810pt"><div class="half l">${panel(panels.left)}</div><div class="half r">${panel(panels.right)}</div></div>`;
  } else {
    for(const id of ['front','back','left','right']) html += `<div class="page" data-page="${id}" style="width:630pt;height:810pt">${panel(panels[id])}</div>`;
  }
  document.getElementById('pages').innerHTML = html;
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  SW.fill();
  SW.fitLogos();
  if(window.ContactCard) ContactCard.fit(document);
  issues.push(...SW.focus(D));
  // the whole spread (read from the page, so it is live): no photo twice on the sheet, and no room on both inside pages (the same room under another number counts)
  const spreadCheck = () => { const out = [], rk = id => String(id).replace(/\d+[a-z]?$/, ''), pages = [...document.querySelectorAll('.page[data-page]')], seen = new Map(), ids = pn => [...pn.querySelectorAll('.ph[data-photo]')].map(e => e.dataset.photo).filter(Boolean);
    pages.forEach(pn => ids(pn).forEach(id => { if(seen.has(id) && seen.get(id) !== pn.dataset.page) out.push({slot: 'spread.' + pn.dataset.page, kind: 'duplicate-photo-spread', detail: `${id} is on the ${seen.get(id)} and the ${pn.dataset.page} page`}); else seen.set(id, pn.dataset.page); }));
    const L1 = pages.find(p => p.dataset.page === 'left' || p.dataset.page === 'inside'), R1 = pages.find(p => p.dataset.page === 'right');
    if(L1 && R1){ const lk = new Set(ids(L1).map(rk)); ids(R1).forEach(id => { if(lk.has(rk(id))) out.push({slot: 'spread.right', kind: 'same-room-on-inside-spread', detail: `${id} (the same room as one on the inside left)`}); }); }
    return out; };
  window.brochureCheck = () => SW.check(D, (window.planIssues || []).concat(issues)).concat(spreadCheck());
  window.photoPlacements = SW.placements;
})();
</script>
</body>
</html>
