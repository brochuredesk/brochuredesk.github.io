<!--
  fxs-40 socials: Open House, Just Listed and Just Sold in every size, plus the carousel slides. One page; it draws by FXP.kind(D) and D.piece.shape.
  The flyer's pieces carry through, doing the same job: the address set vertically up the left edge (Bodoni) with a short gold rule; the whole house
  in one large hero with the round neighborhood seal in its corner; the event (or the status) between two hairlines in Oswald over caps; the
  REALTOR(R) perks on a white notes card; the agent in Oswald with the one logo; square corners everywhere. No new copy.
  Too much for a size: the notes go first, then what's served (the caption carries them).
-->
<style>
  .abs{position:absolute}
  .wu{font:300 var(--sw,13pt)/1.4 'Montserrat'}
</style>
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
FXS.hookCheck();
FXP.start(['400 20pt "Great Vibes"', '500 20pt Oswald', '600 20pt Oswald', '700 20pt Oswald', '800 20pt "Montserrat"', '700 20pt "Montserrat"', '600 20pt "Montserrat"', '500 20pt "Montserrat"', '400 20pt "Montserrat"', '300 20pt "Montserrat"'], D => {
  const esc = Ivory.esc, L = D.listing, C = D.companion || {}, A = D.agent || {};
  const kind = FXP.kind(D), shape = D.piece.shape, {W, H} = FXP.size(D), F = FXP.floor(shape); F.ev = F.event;
  const E = OHL.event(D), hero = OHL.hero(D, 'straight'), BRK = (D.piece || {}).__break || '';   // __break: used only by out/fxsets/fxs-40/proof.py to prove each check fails when its rule is broken
  if(E.time) E.time = E.time.replace(/(\d)\s+(am|pm)\b/gi, '$1 $2');
  const INK = TK.ink, SOFT = TK.text, MONT = "font-family:'Montserrat'";
  const back = [], mid = [], front = [], tiny = [];
  const rect = (x, y, w, h, css) => `<div class="abs" aria-hidden="true" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${h}pt;${css || ''}"></div>`;
  const pic = (id, x, y, w, h, css) => OHL.photo(D, id, `left:${x}pt;top:${y}pt;width:${w}pt;height:${h}pt;${css || ''}`);
  const archCss = () => '';
  const wdt = (t, css, rich) => { const m = document.createElement('span'); m.style.cssText = `position:absolute;left:-9999pt;visibility:hidden;white-space:nowrap;${css}`; if(rich) m.innerHTML = t; else m.textContent = t; document.body.appendChild(m); const w = m.getBoundingClientRect().width*.75; m.remove(); return w; };
  // text that fits: the biggest size from max to min at which it runs in <= lines lines in width w. o.rich: html for the body
  const T = o => { const r = T0(o); return o.parts && r.n >= 99 ? T0(Object.assign({}, o, {parts: null, lines: Math.max(o.lines || 1, 3)})) : r; };
  const T0 = o => {
    if(o.slot === 'place') return {html: '', h: 0, s: 0, n: 0, w: 0, ok: true};
    const lines = o.lines || 1, lhk = o.lh || 1.15, txt = o.parts ? o.parts.join(' ') : o.text;
    const css = s => `${MONT};${o.css};font-size:${s}pt;line-height:${(s*lhk).toFixed(2)}pt`;
    const cnt = s => o.rich ? (wdt(o.rich, css(s), true) <= o.w + .3 ? 1 : 99) : o.parts ? (o.parts.every(p => FXP.width(p, css(s)) <= o.w + .3) ? o.parts.length : 99) : FXP.lines(txt, css(s), o.w);
    let s = o.max, n = cnt(s);
    while(n > lines && s > o.min){ s -= .5; n = cnt(s); }
    if(s < o.min) s = o.min;
    n = cnt(s);
    const nn = Math.min(n, 99), h = Math.ceil(nn*s*lhk*100)/100 + 1.4 + (nn > 1 ? 2.5 : 0);
    const wid = nn === 1 ? (o.rich ? wdt(o.rich, css(s), true) : FXP.width(txt, css(s))) : o.w;
    const body = o.rich || (o.parts ? o.parts.map(esc).join('<br>') : esc(txt));
    const html = `<div class="abs" style="left:${o.x}pt;top:${o.y}pt;width:${o.w}pt;height:${h}pt;${css(s)};text-align:${o.align || 'left'};white-space:${nn === 1 ? 'nowrap' : 'normal'};overflow:${/Great Vibes/.test(o.css || '') ? 'visible' : 'hidden'}"${o.small ? ' data-small="1"' : ''} data-slot="${o.slot}" data-lines="${nn}">${body}</div>`;
    return {html, h, s, n: nn, w: wid, ok: n <= lines};
  };
  const caps = (wt, tr, col) => `font-weight:${wt};letter-spacing:${tr}pt;text-transform:uppercase;color:${col}`;

  // ---------- px helpers: the page is drawn in pt at K = 0.375 pt per image pixel; sizes below are image pixels ----------
  const K = FXP.K, p = v => v*K, WP = D.piece.px[0], HP = D.piece.px[1], SC = WP/1080;
  const MG = Math.round(54*SC);
  const tp = o => T(Object.assign({}, o, {x: p(o.x), y: p(o.y), w: p(o.w), max: p(o.max), min: o.minPx != null ? p(o.minPx) : (o.min == null ? F.body : o.min)}));
  const LN = 'font-variant-numeric:lining-nums;';
  const GOLD = 'var(--fx-accent)';
  const goldRule = () => '';
  const hair = (x, y, w) => rect(p(x), p(y), p(w), .75, 'background:var(--fx-rule)');
  const RAW = (SW.data().listing || {});
  const addrT = String(RAW.address || L.address);
  const placeT = `${FXS.hood(L) ? FXS.hood(L) + ' · ' : ''}${RAW.city || L.city}, ${/^texas$/i.test(RAW.state || L.state) ? 'TX' : (RAW.state || L.state)} ${RAW.zip || L.zip || ''}`.trim().toUpperCase();
  const hsOn = OHL.cardMode(D) === 'headshot' && !!A.headshot;
  // a tracked caps line that is plain text (small print for the floor checks)
  const capsLn = (slot, text, x, y, w, px, tr, col, align) => { const pt = Math.max(p(px), F.small), h = pt*1.35;
    return {h: h/K, html: `<div class="abs" style="left:${p(x)}pt;top:${p(y)}pt;width:${p(w)}pt;height:${h}pt;font:500 ${pt}pt/${h}pt Montserrat;letter-spacing:${tr}pt;text-transform:uppercase;color:${col};white-space:nowrap;overflow:hidden;text-align:${align || 'left'}" data-small="1" data-slot="${slot}" data-lines="1">${esc(text)}</div>`}; };

  // ---------- the hero: one box per shape, the same on every piece of that shape ----------
  // the whole house inside the centered crop, with a margin (the print check cuts at the box's own edge)
  const heroFit = (w, h) => { const ph0 = (D.photos || {})[hero] || {}; if(!ph0.box || !ph0.w || !ph0.h) return true; const ia = ph0.w/ph0.h, ta = w/h, [x0, y0, x1, y1] = ph0.box, mg = .02;
    if(ta >= ia){ const v = ia/ta, lo = (1 - v)/2; return y0 >= lo + mg*0 && y1 <= 1 - lo && v >= (y1 - y0) + .03; }
    const v = ta/ia, lo = (1 - v)/2; return x0 >= lo && x1 <= 1 - lo && v >= (x1 - x0) + .03; };
  const heroFit2 = (w, h) => { const ph0 = (D.photos || {})[hero] || {}; if(!heroFit(w, h)) return false; if(!ph0.box || !ph0.w || !ph0.h) return true; const ia = ph0.w/ph0.h, ta = w/h, [x0, y0, x1, y1] = ph0.box; return ta >= ia ? true : ta/ia >= (x1 - x0) + .07; };   // growth keeps a margin around the house
  let HERO_H;   // full-width pieces: the shortest frame that holds the whole house, never under 54% of the width
  const W1 = Math.round(WP*.76);
  { let h0 = Math.round(W1*(shape === 'square' ? .7 : .76)); const lim = Math.round(W1*1.1); let h = h0; while(h < lim && !heroFit(W1, h)) h += 4; HERO_H = h; }
  const heroBlock = (x, y, w, h) => pic(hero, p(x), p(y), p(w), p(h));
  let HERO_W = 0;   // side pieces: the narrowest column that holds the whole house
  if(shape === 'wide' || shape === 'gbp'){ let w0 = Math.round(WP*.5); const lim = Math.round(WP*.7); while(w0 < lim && !heroFit(w0, HP)) w0 += 8; HERO_W = w0; }

  // ---------- the blocks: each returns {h, html} at (x, y, w) in px ----------
  // the Just Listed / Just Sold lockup: one size on every format (124 px at 1080, scaled with the width), never shrunk; the photo or the facts give way instead
  const LOCK_PX = 124*Math.min(SC, HP/1350), LOCK_WORD = kind === 'js' ? 'Just Sold' : 'Just Listed', LOCK_W = FXP.width(LOCK_WORD, `font-family:'Pinyon Script';font-size:${p(LOCK_PX)}pt`)/K + 12*SC;
  let lockPt = 0;
  const bStatus = (x, y, w, k) => { if(BRK === 'no-lockup') return {h: 10, html: ''}; const pt = p(LOCK_PX)*(BRK === 'shrink-lockup' ? .8 : 1); lockPt = pt; const lcss = `font-family:Oswald;font-weight:600;letter-spacing:${(pt*.04).toFixed(2)}pt;text-transform:uppercase;font-size:${pt}pt`;
    const one = FXP.width(LOCK_WORD, lcss) <= p(w), words = LOCK_WORD.toUpperCase().split(' '), nl = one ? 1 : 2, lh = pt*1.02;
    return {h: nl*lh/K + 6*SC, html: `<div class="abs" style="left:${p(x)}pt;top:${p(y)}pt;width:${p(Math.max(w, 0))}pt;height:${nl*lh}pt;font:600 ${pt}pt/${lh}pt Oswald;letter-spacing:${(pt*.04).toFixed(2)}pt;text-transform:uppercase;color:var(--fx-ink);white-space:nowrap;overflow:visible" data-slot="moment" data-lines="${nl}">${one ? LOCK_WORD : words.join('<br>')}</div>`}; };
  const bAddr = (x, y, w, k, maxPx, noPlace) => { const r = tp({slot: 'address', text: addrT, css: "font-family:Oswald;font-weight:600;letter-spacing:0;color:var(--fx-ink)", x, y, w, max: (maxPx || 100)*SC*k, min: F.ev, lh: 1.1}); const pl = capsLn('place', placeT, x + 2, y + r.h/K + 4, w, 30*SC*Math.max(k, .9), 1.6, GOLD); if(noPlace) return {h: r.h/K, html: r.html};
    return {h: r.h/K + 4 + pl.h, html: r.html + pl.html}; };
  const bStats = (x, y, w, k) => { const h = Math.round(110*SC*k), items = FXS.statItems(L).slice(0, 3);
    return {h, html: FXS.statsRow(items, p(x), p(y), p(w), p(h), 'fact', {np: Math.max(16, p(60*SC*k)), lp: Math.max(F.body, p(26*SC*k)), track: 1})}; };
  const bAgent = (x, y, w, k, o) => { o = o || {};
    const ps = (o.phone || 40)*SC*k, ns0 = Math.min((o.name || 58)*SC*k, Math.max(ps, 52*SC)*1.1), hsz = hsOn ? Math.round(Math.min(ns0*2.4, 180*SC)) : 0, logoW = Math.min(w*.34, 330*SC), lx = x + w - logoW;
    const tx = x + (hsz ? hsz + 16 : 0), tw = lx - 28 - tx;
    const phCss = "font-family:Montserrat;font-weight:700;letter-spacing:.3pt;color:var(--fx-ink)", phOpt = {slot: 'agent.phone', text: A.phone || '', css: phCss, x: tx, w: tw, max: Math.max(ps, 52*SC), minPx: 52*SC, lh: 1.15};
    const ph0 = tp(Object.assign({}, phOpt, {y: 0})), ns = Math.min(ns0, ph0.s/K*.92);   // the name is never bigger than the phone as it actually sets
    const nm = tp({slot: 'agent.name', text: A.name || '', css: "font-family:Montserrat;font-weight:600;letter-spacing:0;color:var(--fx-ink)", x: tx, y, w: tw, max: ns, min: F.body, lh: 1.08});
    let yy = y + nm.h/K; const out = [nm.html];
    if(A.nar || /realtor/i.test(A.designation || '')){ const d = capsLn('agent.desig', 'REALTOR®', tx + 1, yy + 2, tw, 24*SC, 3.2, GOLD); out.push(d.html); yy += d.h + 4; }
    const ph = tp(Object.assign({}, phOpt, {y: yy + 2})); out.push(ph.html); yy += 2 + ph.h/K;
    const h = Math.max(yy - y, hsz);
    if(hsz) out.unshift(`<div class="abs" style="left:${p(x)}pt;top:${p(y)}pt;width:${p(hsz)}pt;height:${p(h)}pt;overflow:hidden"><img src="${esc(A.headshot)}" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></div>`);
    out.push(rect(p(lx - 14), p(y + 4), .75, p(h - 8), 'background:var(--fx-rule)'));
    out.push(OHL.logo(D, 'light', `left:${p(lx)}pt;top:${p(y + (h - Math.min(h, 110*SC))/2)}pt;width:${p(logoW)}pt;height:${p(Math.min(h, 110*SC))}pt;justify-content:center`));
    return {h, html: out.join('')}; };
  // the event: the gold label on one line, the day over the date's left edge, the date large, the time at 60% of it (beside it when both fit, else under)
  const bEvent = (x, y, w, k, o) => { o = o || {}; const out = []; let yy = y;
    if(!o.perksOnly){
    const lab = tp({slot: 'oh.label', text: E.label.toUpperCase(), css: caps(600, 1.6*Math.max(k, .8), TK.accent) + ';font-family:Oswald' + '', x, y: yy, w, max: 50*SC*k, min: F.ev, lh: 1.15});
    out.push(lab.html); yy += lab.h/K + 12*SC;
    const wk = capsLn('oh.weekday', E.weekday, x + 1, yy, w, 36*SC*k, 4.2, GOLD); out.push(wk.html); yy += wk.h + 2;
    const md = String(E.monthDay || E.long), dmax = (o.dmax || 128)*SC*k;
    let dt = tp({slot: 'oh.date', text: md, css: `font-family:Oswald;font-weight:700;letter-spacing:0;color:var(--fx-ink);${LN}`, x: x - 2, y: yy, w: w + 2, max: dmax, min: p(60*SC), lh: 1.02});
    const tcss = s => `font-family:Oswald;font-weight:700;color:var(--fx-ink);${LN}`;
    let tm = null, inline = false;
    if(E.time){ const ts = dt.s*.6; const tw0 = FXP.width(E.time, `${tcss()};font-size:${ts}pt`);
      if(dt.w + tw0 + p(34*SC) <= p(w)){ inline = true; dt = tp({slot: 'oh.date', text: md, css: `font-family:Oswald;font-weight:700;letter-spacing:0;color:var(--fx-ink);${LN}`, x: x - 2, y: yy, w: (dt.w + 6)/K, max: dmax, min: p(60*SC), lh: 1.02}); dt.s = Math.min(dt.s, dmax*K);
        tm = T({slot: 'oh.time', text: E.time, css: tcss() + ';letter-spacing:0;text-align:right', x: p(x + w) - tw0 - 6, y: p(yy) + (dt.h - ts*1.05)*.62, w: tw0 + 6, max: ts, min: ts, lh: 1.05}); }
      else tm = null; }
    out.push(dt.html); yy += dt.h/K;
    if(E.time){ if(inline) out.push(tm.html); else { const t2 = tp({slot: 'oh.time', text: E.time, css: tcss() + ';letter-spacing:0', x, y: yy + 4, w, max: dt.s/K*.6, minPx: dt.s/K*.6, lh: 1.05}); out.push(t2.html); yy += 4 + t2.h/K; } }
    }
    const items = (o.noPerks || BRK === 'drop-perk') ? [] : [[E.refreshments, 'oh.refreshments', 700], [E.note, 'oh.note', 600]].filter(i => i[0]);
    if(items.length){ yy += o.perksOnly ? 0 : 20*SC;
      const bf = Math.max(F.body*1.1, 34*SC*k*K), py = 14*SC, rows = []; let by = yy + py;
      items.forEach(([tx, slot, wt]) => { const r = tp({slot, text: tx, css: `font-family:Oswald;font-weight:${wt};color:var(--fx-ink)`, x: x + 24*SC, y: by, w: w - 48*SC, max: bf/K, min: F.body, lines: 2, lh: 1.12}); rows.push(r.html); by += r.h/K + 6*SC; });
      by -= 6*SC; out.push(`<div class="card" data-box="oh.box" style="left:${p(x)}pt;top:${p(yy)}pt;width:${p(w)}pt;height:${p(by - yy + py)}pt"></div>`, ...rows); yy = by + py; }
    return {h: yy - y, html: out.join('')}; };
  const bJsLine = (x, y, w, k, headOnly) => { const sl = FXP.soldLine(D); if(headOnly) sl.line = '';
    const l1 = tp({slot: 'sold.head', text: sl.head, css: "font-family:Oswald;font-weight:700;color:var(--fx-ink);text-wrap:balance", x, y, w, max: 54*SC*k, min: F.body, lines: 2, lh: 1.1});
    let yy = y + l1.h/K, o = l1.html; if(sl.line){ const l2 = tp({slot: 'sold.line', text: sl.line, css: `font-family:Oswald;font-weight:600;color:${SOFT}`, x, y: yy + 4, w, max: 40*SC*k, min: F.body, lines: 2, lh: 1.15}); o += l2.html; yy += 4 + l2.h/K; }
    return {h: yy - y, html: o}; };
  // three different rooms side by side (story bottom strip, square)
  const roomsAll = () => OHL.photos(D).filter(id => id !== hero && !Ivory.fullHouse(D, id)).sort((a, b) => FXS.archScore(D, b) - FXS.archScore(D, a)).filter((id, i, arr) => arr.findIndex(o => FXP.fam(o) === FXP.fam(id) || o.replace(/\d+[a-z]?$/, '') === id.replace(/\d+[a-z]?$/, '')) === i);
  const bStrip = (x, y, w, h) => { const rs = roomsAll().slice(0, 3), g = 10*SC, pw = (w - g*(rs.length - 1))/rs.length; return {h, html: rs.map((id, i) => pic(id, p(x + i*(pw + g)), p(y), p(pw), p(h))).join('')}; };

  // ---------- the stack: blocks in order, spaced evenly in what the hero leaves; the content shrinks (k) until it fits ----------
  const stack = (x, y0, w, avail, make, ks, strict) => {
    for(const k of ks){ const bl = make(k); const sum = bl.reduce((t, b) => t + b.h, 0), n = bl.length - 1, gap = n ? (avail - sum)/n : 0;
      if(gap >= 14*SC*Math.min(k, 1) || (!strict && k === ks[ks.length - 1])){ const g = Math.min(gap, 36*SC); let y = y0 + Math.max(0, (avail - sum - g*n)/2); const out = [];
        bl.forEach(b => { out.push(b.mk ? b.mk(y).html : b.html.replace(/%Y%/g, y)); y += b.h + g; }); return out.join(''); } } return null; };
  const KS = [1.32, 1.24, 1.16, 1.1, 1.05, 1, .94, .88, .82, .76, .7];

  // the badge as a block (side pieces): the same dark circle as the post's
  const bBadge = (x, y, w, k) => { if(BRK === 'no-header') return {h: 10, html: ''}; const AP = FXS.addrParts(D), wN = Math.max(...[AP.num, AP.name.toUpperCase()].filter(Boolean).map(t => FXS.width(t, `font-family:Oswald;font-weight:500;letter-spacing:.7pt;font-size:${F.ev}pt`))), need = Math.ceil(wN/.8/K), d = Math.min(w, Math.max(need, 200*SC, Math.min(w, 280*SC*k)));
    const r = FXS.badge(D, p(x + w/2), p(y + d/2), p(d), {dark: true, minSmall: F.small}); let html = r.html, h = d;
    if(r.noHood && !(kind === 'oh' && shape === 'wide')){ const hood = String(FXS.hood(L) || RAW.city || L.city).toUpperCase(), ln = capsLn('hood.line', hood, x, y + d + 6*SC, w, 30*SC, 3.4, 'var(--fx-ink)', 'center'); html += ln.html; h += 6*SC + ln.h; }
    return {h, html}; };
  // the top block of every full-width piece: the whole house at 81% width, the pale blue column with the icon facts, the dark badge over the photo's lower edge
  const topBlock = (id, o) => { o = o || {};
    // owner 11/7: a Just Sold piece never lists the house's features: the house takes the whole width instead of the fact column
    const jsWide = kind === 'js' && !o.noFacts && heroFit(WP, HERO_H); if(kind === 'js') o.noFacts = true;   // full width only when the whole house still fits; else the column carries the words
    front.push(pic(id, 0, 0, p(jsWide ? WP : W1), p(HERO_H)));
    if(!jsWide) front.push(rect(p(W1), 0, p(WP - W1), p(HERO_H), 'background:var(--fx-blue)'));
    if(!jsWide && kind === 'js'){ const cw = WP - W1, fs = Math.min(cw*.5, HERO_H*.16); mid.push(`<div class="abs" style="left:${p(W1)}pt;top:${p(18*SC)}pt;width:${p(cw)}pt;height:${p(HERO_H - 36*SC)}pt;display:flex;align-items:center;justify-content:center"><div style="transform:rotate(-90deg);white-space:nowrap;font:600 ${p(fs)}pt/1 'Oswald';letter-spacing:${p(fs*.12)}pt;color:var(--fx-ink);text-transform:uppercase" data-slot="js.word" data-lines="1">Sold</div></div>`); }
    const d = Math.round((o.d || 400)*SC), hb = FXS.houseBottom(D, id, 0, 0, W1, HERO_H), bt = Math.max(HERO_H - 110*SC, hb + 10*SC), cx = WP - d/2 - 34*SC;
    const items = FXS.statItems(L).slice(0, 3), colH = (o.noBadge ? HERO_H : bt) - 26*SC, pitch = colH/items.length, ipx = pitch*.3, np = Math.max(16, p(pitch*.27)), lp = Math.min(Math.max(F.small, p(pitch*.13)), Math.max(F.small, p(24*SC)));
    if(!o.noFacts) mid.push(FXS.iconCol(items, p(W1 + 10*SC), p(18*SC), p(WP - W1 - 20*SC), p(pitch), 'fact', {icon: p(ipx), np, lp}));
    if(!o.noBadge && BRK !== 'no-header') mid.push(FXS.badge(D, p(cx), p(bt + d/2), p(d), {dark: true, minSmall: F.small}).html);
    return {bottom: o.noBadge ? HERO_H : bt + d, left: cx - d/2}; };
  const bandH = () => Math.round(84*SC);
  const footBand = () => { const h = bandH(); front.push(rect(0, p(HP - h), p(WP), p(h), 'background:var(--fx-blue)'));
    const t = capsLn('place', FXS.placeText(L), MG, HP - h + (h - p(34*SC)*1.35/K)/2*1, WP - 2*MG, 34*SC, 6, 'var(--fx-ink)', 'center'); mid.push(t.html.replace('font:500 ', 'font:500 ').replace('Montserrat', 'Oswald')); };
  const vertical = () => {

    mid.push(FXS.titleBadge(FXS.roomLabel(roomName), p(WP - bd/2 - 34*SC), fr.h + p(bd*.0), p(bd), 'room.badge', true));
    { const al = tp({slot: 'addr.line', text: addrLn, css: "font-family:Oswald;font-weight:500;letter-spacing:1.2pt;color:var(--fx-ink)", x: MG, y: phPx + 28*SC, w: WP - bd - 34*SC - MG*2, max: 56*SC, min: F.ev, lh: 1.1}); mid.push(al.html);
      mid.push(capsLn('place', FXS.hood(L) || RAW.city || L.city, MG + 2, phPx + 28*SC + al.h/K + 4*SC, WP - bd - MG*2, 28*SC, 3.4, 'var(--fx-ink)').html); }
    let y = phPx + under + g2;
    front.push(T({slot: 'caption', text: pick.txt, css: CAPCSS, x: p(MG), y: p(y), w: p(pick.w2), max: pick.cs, min: pick.cs, lines: 3, lh: 1.22}).html); y += capH + g2;
    if(band){ mid.push(band.mk(y)); y += band.h + g2; }
    mid.push(bAgent(MG, HP - MG*.9 - ag.h, w, 1, {name: 60, phone: 52}).html);
  };
  // the closing slide: the same hero box as the post (house, icon facts, badge), a call to action, the agent big (name 60 px and up, phone 54 px bold at 1080, left aligned), the logo
  let closeBad = false;
  const closeSlide = () => {
    const w = WP - 2*MG, first = String(A.name || 'me').split(' ')[0], tb = topBlock(hero);
    const ctaText = kind === 'oh' ? `See you ${E.weekday}${E.time ? ', ' + E.time : ''}.` : `Call or text ${first} for a private showing.`;
    const ctaCss = "font-family:Oswald;font-weight:600;color:var(--fx-ink)";
    const lw = tb.left - MG - 28*SC;
    const cta = (() => { for(let sz = 84*SC; sz >= 54*SC; sz -= 2){ for(let w2 = lw; w2 >= lw*.6; w2 -= 6){ const c = T({slot: 'cta', text: ctaText, css: ctaCss, x: 0, y: 0, w: p(w2), max: p(sz), min: p(sz), lines: 4, lh: 1.18}); if(c.ok && (c.n === 1 || lastFill(ctaText, `${MONT};${ctaCss};font-size:${p(sz)}pt;line-height:${(p(sz)*1.1).toFixed(2)}pt`, p(w2)) >= .78)) return {sz, w2}; } } return {sz: 54*SC, w2: lw}; })();
    let ctaBottom = 0; { const r = tp({slot: 'cta', text: ctaText, css: ctaCss, x: MG, y: HERO_H + 22*SC, w: cta.w2, max: cta.sz, minPx: cta.sz, lines: 4, lh: 1.18}); mid.push(r.html); ctaBottom = HERO_H + 22*SC + r.h/K; }
    const y1 = Math.max(tb.bottom + 8*SC, ctaBottom + 36*SC), bh = bandH(), avail = HP - bh - y1 - 18*SC;
    const facs = k => { const f = [], wrap = fn => ({h: fn(0).h, mk: y => fn(y)});
      f.push(wrap(y => { const nm = tp({slot: 'agent.name', text: A.name || '', css: "font-family:Montserrat;font-weight:600;color:var(--fx-ink)", x: MG, y, w: w*.62, max: (BRK === 'small-agent' ? 40 : 60)*SC, minPx: (BRK === 'small-agent' ? 40 : 60)*SC, lh: 1.14}); closeBad = nm.s < p(60*SC) - .2; let yy = y + nm.h/K, o = nm.html;
        const d = capsLn('agent.desig', 'REALTOR®', MG + 1, yy + 2, w, 26*SC, 3.4, 'var(--fx-mute)'); o += d.html; yy += d.h + 22*SC;
        const ph = tp({slot: 'agent.phone', text: A.phone || '', css: "font-family:Montserrat;font-weight:700;color:var(--fx-ink)", x: MG, y: yy, w: w*.6, max: 54*SC, minPx: 54*SC, lh: 1.1}); o += ph.html; yy += ph.h/K;
        o += OHL.logo(D, 'light', `left:${p(WP - MG - 330*SC)}pt;top:${p(y + 10)}pt;width:${p(330*SC)}pt;height:${p(110*SC)}pt;justify-content:flex-end`);
        return {h: yy - y, html: o}; }));
      return f; };
    mid.push(stack(MG, y1, w, avail, facs, [1, .92, .84, .76, .68, .6]));
    if(closeBad) tiny.push({slot: 'agent.name', kind: 'closing-agent-small', detail: 'the agent name on the closing slide is under 60 px at 1080'});
    footBand();
  };
  // Just Sold slides: slide 1 is the post's house; slide 2: the exterior or the deck, "I just helped sell this ..." and the horizontal address under it
  const jsSlide = () => {
    const id = D.piece.photo, w = WP - 2*MG;
    const note = ((((D.sw || {}).pc || {}).js || {}).front || {}).note, sents = [].concat(...(((note || {}).s) || []).map(x => [].concat(x))), m = sents.map(s => /I just helped sell this ([^,.]+)/i.exec(s)).filter(Boolean)[0];
    const sold = m ? `I just helped sell this ${m[1]}.` : 'I just helped sell this home.';
    const line = `${sold} Your home could be next. Call or text me.`;
    const tb = topBlock(id, {noBadge: true, noFacts: false});
    const y1 = HERO_H + 24*SC, bh = bandH(), avail = HP - bh - y1 - 18*SC;
    const facs = k => { const f = [], wrap = fn => ({h: fn(0).h, mk: y => fn(y)});
      f.push(wrap(y => bStatus(MG, y, w, k)));
      f.push(wrap(y => { const lcss = "font-family:Oswald;font-weight:600;color:var(--fx-ink);text-wrap:balance"; let best = null;
        for(let sz = 66*SC*k; sz >= 40*SC && !best; sz -= 2) for(let w2 = w; w2 >= w*.6; w2 -= 6){ const c = T({slot: 'sold.line', text: line, css: lcss, x: 0, y: 0, w: p(w2), max: p(sz), min: p(sz), lines: 3, lh: 1.14}); if(c.ok && lastFill(line, `${MONT};${lcss};font-size:${p(sz)}pt;line-height:${(p(sz)*1.14).toFixed(2)}pt`, p(w2)) >= .8){ best = {sz, w2}; break; } }
        best = best || {sz: 40*SC, w2: w}; const r = tp({slot: 'sold.line', text: line, css: lcss, x: MG, y, w: best.w2, max: best.sz, minPx: best.sz, lines: 3, lh: 1.14}); return {h: r.h/K, html: r.html}; }));
      f.push(wrap(y => bAddr(MG, y, w, k, 64, true)));
      f.push(wrap(y => bAgent(MG, y, w, k, {name: 62, phone: 54})));
      return f; };
    mid.push(stack(MG, y1, w, avail, facs, KS));
    footBand();
  };

  // ---------- which layout ----------
  if(shape === 'slide' && D.piece.photo === '@close') closeSlide();
  else if(shape === 'slide' && kind === 'js') (FXP.slides(D, 'js').indexOf(D.piece.photo) > 0 ? jsSlide() : vertical());
  else if(shape === 'slide') captionSlide();
  else if(shape === 'wide' || shape === 'gbp' || shape === 'square') sideways();
  else vertical();
  { const all0 = back.concat(front, mid).join('');
    if(shape !== 'slide' && !all0.includes('data-badge="1"')) tiny.push({slot: 'header', kind: 'header-missing', detail: `the set's header (the badge with the address, the icon facts) is missing on the ${kind} ${shape}`});
    if(['post', 'story', 'pin'].includes(shape) && kind !== 'js' && !all0.includes('data-slot="fact.'))   // a Just Sold piece lists no features (owner 11/7)
      tiny.push({slot: 'header', kind: 'header-missing', detail: `the icon facts are missing on the ${kind} ${shape}`}); }
  { const needs = (kind === 'jl' || kind === 'js') && (shape !== 'slide' || kind === 'js');
    if(needs){ const all = back.concat(front, mid).join('');
      if(!all.includes('data-slot="moment"')) tiny.push({slot: 'moment', kind: 'lockup-missing', detail: `the ${LOCK_WORD} label is missing on the ${shape} format`});
      else if(lockPt < p(LOCK_PX) - .5) tiny.push({slot: 'moment', kind: 'lockup-shrunk', detail: `the ${LOCK_WORD} label is ${lockPt.toFixed(1)} pt, under its full size`}); } }
  return {W, H, issues: tiny, html: `<div class="page" data-page="${esc(D.piece.id)}" style="position:relative;overflow:hidden;width:${W}pt;height:${H}pt;background:var(--fx-paper)">${back.join('')}${front.join('')}${mid.join('')}</div>`};
});
</script>
