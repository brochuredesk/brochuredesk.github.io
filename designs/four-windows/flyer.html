<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · The Four Windows two-sided flyer</title>
<link rel="stylesheet" href="four-windows.css">
<script src="../engine/planink.js"></script>
<script src="four-windows.js"></script>
<script src="../engine/setpieces.js"></script>
<script src="../engine/baths.js"></script>
<!--
  The Four Windows · two-sided 8.5 x 11 listing flyer (trim 612 x 792 pt; print: 0.25 in white margin around the green field).
  data.piece.side = "front" | "back". Same family as the fold-over: dark green field, mint kickers and rules, Archivo and
  Albert Sans, captions with a bold room name and a mint size tag, the white plan window (or the mint-framed room sizes
  window), the "around the house" list with mint squares.

  Rules (product.md, two-sided 8.5x11 flyer rules 10/28/2026 and the owner's Round 4 review 11/1/2026): one brokerage logo
  per side (front: top of the details column; back: top right of the header; the card at the foot is the agent only and
  the office lines sit on its name and phone lines); the front shows the whole house; the back carries as much real detail
  as fits; no price, no QR, no photo numbers, no "virtually staged"; room sizes in feet only (18' x 12'); the half bath's
  1/2 at full size (BD.bathNum); text fills its box and runs edge to edge with the photos and rules around it; the details
  grid shows a fifth line (lot size) when the listing has one, otherwise its four lines grow to fill the space.

  FRONT   the whole house across the top; under it the place line (and the "never flooded" tag when the listing says so),
          the address, a mint rule and the write-up on the left; the brokerage logo and the details grid on the right;
          three captioned photos; the agent card at the foot.
  BACK    With a plan (data.plan): header (kicker, title, logo), a column of one large and two smaller captioned photos and
          the "around the house" list beside the agent's plan in its white window (the plan is placed as given, one scale
          for every floor, never redrawn), the window's note under it. Without a plan: the same column beside a photo and
          the room sizes by floor in the mint-framed window, with a note under the sizes.

  Copy: data.companion.flyer = {
    front: {kicker, photo, tag, intro: [sentence | [short, long], ...], caps: [{photo, name, tag, text: [..]} x3]},
    back:  {kicker, title, feature: {photo, name, tag, text}, pair: [{photo, name, tag, text} x2], nearHead, nearby: [{d, u, p}],
            plan: {head, note: [..]},
            noplan: {kicker, photo: id, head, note: [..], floors: [{label, rooms: [name | [name, size]]}]}}}
  The first sentence of a pool is kept; the rest are optional and the fit picks the combination that sets in the box's line
  count with the last line at least 3/4 full. Anything missing falls back to the fold-over's copy (data.copy).
-->
<style>
  .cc{--cc-paper:#182d2d;--cc-ink:#ffffff;--cc-muted:#cfe3da;--cc-accent:#8fd3b8;--cc-line:rgba(255,255,255,.34)}
  .fx-addr{font:800 32pt/36pt var(--font-display);letter-spacing:-.022em;color:#fff;white-space:nowrap;overflow:hidden}
  .fx-addr.wrap{white-space:normal}
  .fx-wr{font-size:10.5pt;line-height:14.5pt;color:var(--text);overflow:hidden}
  .fx-gr .r{position:absolute;left:0;right:0;display:flex;justify-content:space-between;align-items:center;border-top:.7pt solid var(--line)}
  .fx-gr .r:first-child{border-top:1.2pt solid var(--accent)}
  .fx-gr .l{font:700 8.5pt/12pt var(--font-display);letter-spacing:1pt;text-transform:uppercase;color:var(--accent);white-space:nowrap}
  .fx-gr .v{font:800 14pt/16pt var(--font-display);color:#fff;white-space:nowrap}
  .fx-gr .end{position:absolute;left:0;right:0;height:.7pt;background:var(--line)}
  .fx-wl{font:700 8pt/12pt var(--font-display);letter-spacing:1.2pt;text-transform:uppercase;color:#8fd3b8;white-space:nowrap;overflow:hidden}
  .fx-wn{font-size:9pt;line-height:12pt;color:#dbe9e3;overflow:hidden}   /* light: the plan window is clear on the green field (owner 11/10, p2) */
  .fx-szn{font-size:9pt;line-height:12pt;color:var(--text);overflow:hidden;border-top:.5pt solid var(--line);padding-top:7pt}
  .fx-sz{position:absolute;border:.8pt solid var(--accent)}
  .fx-sz .hd{position:absolute;left:12pt;right:12pt;font:700 8.5pt/10pt var(--font-display);letter-spacing:1.6pt;text-transform:uppercase;color:var(--accent);white-space:nowrap;overflow:hidden}
  .fx-sz .fh{position:absolute;left:12pt;right:12pt;font:700 8pt/12pt var(--font-display);letter-spacing:1.3pt;text-transform:uppercase;color:#fff;white-space:nowrap;overflow:hidden;border-bottom:.5pt solid var(--line)}
  .fx-sz .row{position:absolute;left:12pt;right:12pt;display:flex;justify-content:space-between;align-items:center;border-top:.5pt solid var(--line)}
  .fx-sz .row .n{font:700 9.5pt/12pt var(--font-body);color:#fff;white-space:nowrap;overflow:hidden}
  .fx-sz .row .s{font:600 9.5pt/12pt var(--font-body);color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
  .fx-sz .sn{position:absolute;left:12pt;right:12pt}
  .fx-near .r{display:flex;align-items:baseline;border-top:.6pt solid var(--line);padding-top:2pt}
  .fx-near .sq{flex:none;width:5pt;height:5pt;background:var(--accent);margin-right:8pt;align-self:center}
  .fx-near .d{font:800 15pt/17pt var(--font-display);color:var(--accent);white-space:nowrap;overflow:hidden;letter-spacing:-.2pt;width:64pt;flex:none}
  .fx-near .d small{font:700 8pt/10pt var(--font-display);letter-spacing:1.2pt;text-transform:uppercase;margin-left:3pt}
  .fx-near .p{font:600 9.5pt/12pt var(--font-body);color:var(--ink);white-space:nowrap;overflow:hidden}
  .fx-title{font:800 26pt/32pt var(--font-display);letter-spacing:-.4pt;color:var(--ink);white-space:nowrap;overflow:hidden}
  .fx-ol{white-space:nowrap;color:#fff}
  .cc .cc-lab-over{margin-top:8pt}
</style>
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SP.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="color:#fff;padding:20pt">No data injected.</p>'; return; }
  const esc = SP.esc, L = D.listing, b = D.brand || {}, FL = (D.companion || {}).flyer || {}, C = D.copy || {}, P = D.photos || {};
  const issues = await SP.ready(D);
  document.body.dataset.mode = D.mode || 'email';
  const side = (D.piece || {}).side === 'back' ? 'back' : 'front';
  const hasPlan = !!(D.plan && D.plan.levels && D.plan.levels.length);
  const X0 = 36, CW = 540, TOP = 36, BOT = 648, CARD_Y = 672, CARD_H = 84, OW = 160;
  FW.fitMode = false;

  // ---------- copy helpers ----------
  // room sizes in feet only, inches dropped and never rounded up (owner Round 4, 11/1/2026): 18' x 12'
  const feet = t => String(t == null ? '' : t).replace(/(\d+)(?:\.\d+)?(?:'\s?\d+(?:\.\d+)?"?)?'?\s*x\s*(\d+)(?:\.\d+)?(?:'\s?\d+(?:\.\d+)?"?)?'?/g, "$1' x $2'");
  const splitS = s => (feet(s).match(/[^.!?]+[.!?]+["”’)]*|[^.!?]+$/g) || []).map(x => x.trim()).filter(Boolean);
  const beats = x => x == null ? [] : Array.isArray(x) ? x.map(q => Array.isArray(q) ? q.map(feet) : feet(q)) : splitS(x);

  // ---------- the copy fit: the combination of sentences that sets in exactly n lines, the last at least 3/4 full ----------
  const meas = document.createElement('div');
  meas.style.cssText = 'position:absolute;left:-9999pt;top:0;visibility:hidden;height:auto;white-space:normal;overflow:visible';
  document.body.appendChild(meas);
  const memo = new Map();
  const info = (text, w, font) => { const k = w + '|' + font + '|' + text; if(memo.has(k)) return memo.get(k);
    meas.style.width = w + 'pt'; meas.style.font = font; meas.textContent = text;
    const ls = SP.lineBoxes(meas), bw = meas.getBoundingClientRect().width, last = ls[ls.length - 1];
    const r = {k: ls.length, fill: last ? (last.r - last.l)/bw : 0}; memo.set(k, r); return r; };
  const fitText = (bts, w, font, n, lo) => {
    lo = lo || 0.82; bts = bts.filter(x => x != null && (!Array.isArray(x) || x.length));
    if(!bts.length) return null;
    let list = [''];
    bts.forEach((bt, i) => { const v = [].concat(bt).filter(Boolean), opts = i === 0 ? v : [null, ...v], nxt = [];
      for(const pre of list) for(const o of opts) nxt.push(o ? (pre ? pre + ' ' : '') + o : pre);
      list = nxt; });
    list = [...new Set(list)].filter(Boolean);
    const longest = list.reduce((a, t) => t.length > a.length ? t : a, ''), inf = info(longest, w, font);
    const cpl = longest.length/Math.max(0.5, inf.k - 1 + inf.fill), tgt = cpl*(n - 1 + 0.9);
    list.sort((a, c) => Math.abs(a.length - tgt) - Math.abs(c.length - tgt));
    let best = null, tried = 0;
    for(const t of list){
      if(++tried > 220) break;
      if(t.length < cpl*(n - 1 + 0.55) || t.length > cpl*(n + 0.1)) continue;
      const r = info(t, w, font);
      if(r.k === n && r.fill >= lo && r.fill <= 1){ const sc = r.fill - 0.3*Math.abs(r.fill - 0.9) + 0.0005*t.length; if(!best || sc > best.sc) best = {t, sc, fill: r.fill}; }
    }
    // the rough draft (D.preview): its preview lines can't hit an exact fit, and the order page refits them to each box after
    // layout (PreviewTools.fitPreview), so take the combination nearest the target length instead of failing the layout.
    // Never on a paid piece: print files carry no preview text. (lineup ecd08a80, carried)
    if(!best && D.preview && list.length) return {t: list[0], sc: 0, fill: 0, near: true};
    return best;
  };
  const diag = (bts, w, font, n) => { const out = []; for(let k = Math.max(1, n - 1); k <= n + 1; k++){ const r = fitText(bts, w, font, k); out.push(k + ':' + (r ? 'ok' : 'no')); }
    const all = bts.map(x => [].concat(x).slice(-1)[0]).join(' '), r = info(all, w, font); return `all-long ${all.length} chars sets ${r.k} lines, last ${Math.round(r.fill*100)}%; ` + out.join(' '); };
  const text = (bts, w, font, n, slot) => { const r = fitText(bts, w, font, n); if(r) return r.t;
    issues.push({slot, kind: 'copy-does-not-fit', n, detail: diag(bts, w, font, n)});
    return bts.map(x => [].concat(x)[0]).join(' '); };
  const FONT = {wr: '400 10.5pt/14.5pt var(--font-body)', cap: '400 9pt/12pt var(--font-body)', lg: '400 9.5pt/13pt var(--font-body)', wn: '400 9pt/12pt var(--font-body)'};
  const can = (bts, w, font, n) => !!fitText(bts, w, font, n);

  // ---------- pieces ----------
  const capH = (n, lg) => lg ? 20 + n*13 : 17 + n*12;
  const capHTML = (c, slot, x, y, w, n, lg, row) => {
    const bt = beats(c.text), t = text(bt, w, lg ? FONT.lg : FONT.cap, n, slot + '.text');
    return `<div class="cap abs${lg ? ' lg' : ''}" style="left:${x.toFixed(2)}pt;top:${y.toFixed(2)}pt;width:${w.toFixed(2)}pt;height:${capH(n, lg)}pt">
      <div class="nm" data-slot="${slot}.name" data-lines="1"><b style="font-weight:inherit">${esc(c.name)}</b>${c.tag ? `<span>${esc(feet(c.tag))}</span>` : ''}</div>
      <div class="tx" data-slot="${slot}.text" data-lines="${n}" data-cap="1" data-row="${row}" style="height:${n*(lg ? 13 : 12)}pt">${esc(t)}</div></div>`;
  };
  const phHTML = (id, x, y, w, h, slot) => SP.photo(D, id, x, y, w, h, slot || id);
  const logoHTML = (x, y, w, h, align) => `<div class="logo" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${h}pt;justify-content:${align}">${b.logo
    ? `<img src="${esc(b.logo)}" alt="">` : `<span class="text" data-slot="broker.name" data-lines="1" style="font:700 ${h*0.6}pt/1 var(--font-display);white-space:nowrap;color:#fff">${esc(b.brokerage || '')}</span>`}</div>`;
  const hair = (x, y, w) => `<div class="rule" style="left:${x}pt;top:${y}pt;width:${w}pt"></div>`;
  const nearHTML = (list, x, y, w, pitch, head) => {
    const rows = (list || []).slice(0, 5);
    return FW.kick(head, 'back.nearhead', x, y, w) + `<div class="abs fx-near" style="left:${x}pt;top:${y + 15}pt;width:${w}pt">${rows.map((q, i) =>
      `<div class="r" style="height:${pitch}pt">${q.d ? `<div class="d" data-slot="back.near${i}.d" data-lines="1">${esc(q.d)}${q.u ? `<small>${esc(q.u)}</small>` : ''}</div>` : '<div class="sq"></div>'}<div class="p" data-slot="back.near${i}.p" data-lines="1">${esc(q.p)}</div></div>`).join('')}</div>`;
  };
  const nearH = n => 15 + n*18 + 2;

  // the foot: the agent card (agent only) at the left, the brokerage's office lines on the card's name and phone lines
  const foot = fine => {
    const offL = [].concat(b.address || []).flatMap(a => String(a).split('\n')).map(x => x.trim()).filter(Boolean).slice(0, 2);
    return hair(X0, BOT + 12, CW) +
      SP.card(D, [X0, CARD_Y, CW - OW, CARD_H], {layout: 'panel', size: 'mid', brokerage: false, grow: 0, fieldAccent: true}) +
      `<div class="abs" style="left:${X0 + CW - OW}pt;top:${CARD_Y}pt;width:1pt;height:${CARD_H}pt;background:rgba(255,255,255,.34)"></div>` +
      `<div id="offblk" class="abs" style="left:${X0 + CW - OW + 16}pt;top:${CARD_Y}pt;width:${OW - 16}pt;height:${CARD_H}pt">` +
        (b.phone ? `<div class="fx-ol" data-at=".cc-name" data-slot="broker.phone" data-lines="1" style="font:400 13pt/16pt var(--font-body)">${esc(b.officeLabel || 'Office')} <b style="font-weight:700">${esc(b.phone)}</b></div>` : '') +
        offL.map(t => `<div class="fx-ol" data-at=".cc-desig" data-slot="broker.address" data-lines="1" style="font:400 9pt/11pt var(--font-body)">${esc(t)}</div>`).join('') +
        (b.web ? `<div class="fx-ol" data-at=".cc-phone" data-slot="broker.web" data-lines="1" style="font:400 13pt/16pt var(--font-body)">${esc(b.web)}</div>` : '') + `</div>` +
      `<div class="abs" style="left:${X0}pt;top:762pt;width:${CW}pt;height:8pt;font-size:6pt;line-height:8pt;color:var(--muted);white-space:nowrap;overflow:hidden" data-slot="fineprint" data-lines="1" data-fine="1">${esc(fine || 'Information deemed reliable but not guaranteed.')}</div>`;
  };

  const num = v => Number(v).toLocaleString('en-US');
  let h = '', after = () => {};

  // ======================================= FRONT =======================================
  if(side === 'front'){
    const FBOT = 752;   // no contact card or brokerage logo on a flyer front (owner 11/10/2026): the page runs down to the fine print
    const K = FL.front || {}, CF = C.front || {};
    const heroId = (K.photo && P[K.photo]) ? K.photo : (CF.photo || Object.keys(P)[0]);
    const capsSrc = (K.caps && K.caps.length ? K.caps : []).slice(0, 3);
    const introB = beats(K.intro || CF.intro);
    // the details grid rows
    const rows = (() => { const r = [], bn = BD.bathNum(L);
      if(L.beds) r.push(['Bedrooms', String(L.beds)]);
      if(L.baths || L.halfBaths) r.push([bn.label, bn.num]);
      if(bn.half) r.push(['Half baths', bn.half.replace(/\D+/g, '')]);
      if(L.sqft) r.push(['Living area', `${num(L.sqft)} sq ft`]);
      const yb = L.yearBuilt || L.year; if(yb) r.push(['Year built', String(yb)]);
      let lot = String(L.lotSize || L.lot_size || '').trim().replace(/\s*lot$/i, '').replace(/sq\.?\s*ft\.?/i, 'sq ft');
      if(lot && /^[\d,.]+$/.test(lot)) lot += ' sq ft';
      if(lot) r.push(['Lot size', lot]);
      return r.slice(0, 6); })();
    const LW = 336, RX = X0 + LW + 22, RW = X0 + CW - RX, LH = 14.5;
    // the whole-house hero: it takes the height the rest leaves it, never less than the house needs
    const hp = P[heroId] || {}, ap = (hp.w && hp.h) ? hp.w/hp.h : 1.5, heroMin = Math.ceil(CW/ap*0.76) + 1, heroMax = Math.floor(CW/ap) + 10;
    // the address: one line at 32 pt; steps down to 24 pt; then it wraps onto two lines (never drops a word)
    const aw = sz => { meas.style.width = 'auto'; meas.style.font = `800 ${sz}pt/1 var(--font-display)`; meas.style.letterSpacing = '-.022em'; meas.style.whiteSpace = 'nowrap'; meas.textContent = L.address;
      const w = meas.getBoundingClientRect().width*0.75; meas.style.whiteSpace = 'normal'; meas.style.letterSpacing = ''; return w; };
    let asz = 32, alines = 1; { const w0 = aw(32); if(w0 > LW){ const s = Math.floor(32*LW/w0*2 - 0.5)/2; if(s >= 24) asz = s; else { asz = 26; alines = 2; } } }
    const ah = alines === 1 ? Math.round(asz*1.125) : Math.round(asz*1.1)*2, hasTag = !!(K.tag && SP.floodStated(L.description));
    // pick the photo row's height, the captions' line count and the write-up's line count from the room the hero needs
    let pick = null;
    outer: for(const ph of [104, 100, 96, 92, 88, 84]){
      for(const capN of [4, 3]){
        const cw = (CW - 28)/3, ok = capsSrc.length && capsSrc.every(c => can(beats(c.text), cw, FONT.cap, capN)); if(!ok) continue;
        const rowH = ph + 6 + capH(capN, false), rowTop = FBOT - rowH, blockBottom = rowTop - 14;
        for(const n of [7, 6, 5, 8]){
          const blockH = 14 + ah + 5 + 10 + n*LH, by = blockBottom - blockH, hh = by - 14 - TOP;
          if(hh >= heroMin && can(introB, LW, FONT.wr, n)){ pick = {ph, capN, rowTop, n, blockH, by, hh, blockBottom}; break outer; }
        }
      }
    }
    if(!pick){ const ph = 84, capN = 3, rowTop = FBOT - (ph + 6 + capH(capN)), n = 5, blockH = 14 + ah + 5 + 10 + n*LH, blockBottom = rowTop - 14, by = blockBottom - blockH;
      pick = {ph, capN, rowTop, n, blockH, by, hh: by - 14 - TOP, blockBottom}; issues.push({slot: 'front', kind: 'no-layout', detail: 'the write-up or captions do not fit with a whole-house hero'}); }
    if(pick.hh > heroMax){ const extra = pick.hh - heroMax; pick.hh = heroMax; pick.ph += Math.floor(extra/2); pick.rowTop -= Math.floor(extra/2); pick.blockBottom = pick.rowTop - 14; pick.by = pick.blockBottom - pick.blockH; pick.hh = pick.by - 14 - TOP; }
    const {by, hh, n} = pick;
    h += phHTML(heroId, X0, TOP, CW, hh, 'hero');
    h += `<div class="abs city" style="left:${X0}pt;top:${by}pt;width:${hasTag ? LW - 120 : LW}pt;height:12pt" data-slot="front.kicker" data-lines="1">${esc(K.kicker || SP.placeZip(L))}</div>`;
    if(hasTag) h += `<div class="abs" style="left:${X0 + LW - 120}pt;top:${by - 3}pt;width:120pt;height:17pt;text-align:right"><span class="tag" data-slot="front.tag" data-lines="1">${esc(K.tag)}</span></div>`;
    h += `<div class="abs fx-addr${alines > 1 ? ' wrap' : ''}" style="left:${X0 - 1}pt;top:${by + 14}pt;width:${LW}pt;height:${ah}pt;font-size:${asz}pt;line-height:${alines === 1 ? Math.round(asz*1.125) : Math.round(asz*1.1)}pt" data-slot="address" data-lines="${alines}">${esc(L.address)}</div>`;
    const ruleY = by + 14 + ah + 5;
    h += hair(X0, ruleY, LW);
    h += `<div class="abs fx-wr" style="left:${X0}pt;top:${ruleY + 10}pt;width:${LW}pt;height:${n*LH}pt" data-slot="front.about" data-para="1" data-min="${n}" data-nobal="1" data-fillbox="1" data-lines="${n}">${esc(text(introB, LW, FONT.wr, n, 'front.about'))}</div>`;
    // the details grid, from the kicker line down to the write-up's last line (no logo on the front; owner 11/13, Four Windows flyer front book)
    const gTop = by, gh = pick.blockBottom - gTop, rh = gh/rows.length, vsz = Math.max(11, Math.min(15, rh*0.6));
    h += `<div class="abs fx-gr" style="left:${RX}pt;top:${gTop}pt;width:${RW}pt;height:${gh}pt">` +
      rows.map((r, i) => `<div class="r" style="top:${(i*rh).toFixed(2)}pt;height:${rh.toFixed(2)}pt"><span class="l" data-slot="front.grid${i}.l" data-lines="1">${esc(r[0])}</span><span class="v" style="font-size:${vsz.toFixed(1)}pt" data-slot="front.grid${i}.v" data-lines="1">${r[1]}</span></div>`).join('') +
      `<div class="end" style="top:${gh}pt"></div></div>`;
    // three captioned photos
    const cw = (CW - 28)/3;
    capsSrc.forEach((c, i) => { const x = X0 + i*(cw + 14);
      h += phHTML(c.photo || c.id, x, pick.rowTop, cw, pick.ph, `front.photo${i}`) + capHTML(c, `front.cap${i}`, x, pick.rowTop + pick.ph + 6, cw, pick.capN, false, 'front.caps'); });
    h += `<div class="abs" style="left:${X0}pt;top:762pt;width:${CW}pt;height:8pt;font-size:6pt;line-height:8pt;color:var(--muted);white-space:nowrap;overflow:hidden" data-slot="fineprint" data-lines="1" data-fine="1">${esc((FL.fineprint) || 'Information deemed reliable but not guaranteed.')}</div>`;
  }

  // ======================================= BACK =======================================
  else {
    const B = FL.back || {}, CB = C.back || {}, NP = B.noplan || {}, PLN = B.plan || {};
    const kicker = (hasPlan ? (PLN.kicker || B.kicker) : (NP.kicker || B.kicker)) || CB.kicker || '', title = B.title || CB.title || '';
    const CT = 94, HH = BOT - CT;
    h += FW.kick(kicker, 'back.kicker', X0, 34, 360);
    h += `<div class="abs fx-title" style="left:${X0}pt;top:44pt;width:${CW - 170}pt;height:32pt;font-size:25pt" data-slot="back.title" data-lines="1" data-fit="18">${esc(title)}</div>`;
    h += logoHTML(X0 + CW - 150, 34, 150, 34, 'flex-end');
    h += hair(X0, 82, CW);
    const A = B.feature || {}, pair = (B.pair || []).slice(0, 2);
    const nearby = (B.nearby || CB.nearby || []).slice(0, 5), nearHead = B.nearHead || CB.nearHead || 'Around the house';

    // ---- the right column: the plan window (plan) or a photo and the room sizes (no plan) ----
    let PW = 214, plHTML = '', rightTop = '';
    if(hasPlan){
      const note = beats(PLN.note), lv = D.plan.levels;
      if(lv.length === 1){ const a = lv[0].w/lv[0].h; PW = Math.round(Math.min(250, Math.max(196, (HH - 16 - 80)*a + 20))); } else PW = 196;
      let noteN = [5, 4, 6, 3].find(k => can(note, PW - 20, FONT.wn, k)); if(!noteN){ noteN = 4; issues.push({slot: 'back.plannote', kind: 'copy-does-not-fit', detail: diag(note, PW - 20, FONT.wn, 4)}); }
      const noteH = 12 + 4 + noteN*12, boxH = HH - 16 - noteH - 6, RXB = X0 + CW - PW;
      const pl = FW.plan(D, {x: RXB + 8, y: CT + 8, w: PW - 16, h: boxH}); issues.push(...pl.issues);
      plHTML = `<div class="win" style="left:${RXB}pt;top:${CT}pt;width:${PW}pt;height:${HH}pt"></div>` + pl.html +
        `<div class="abs fx-wl" style="left:${RXB + 10}pt;top:${CT + HH - 8 - noteH}pt;width:${PW - 20}pt;height:12pt" data-slot="back.planhead" data-lines="1">${esc(PLN.head || 'Floor by floor')}</div>` +
        `<div class="abs fx-wn" style="left:${RXB + 10}pt;top:${CT + HH - 8 - noteH + 16}pt;width:${PW - 20}pt;height:${noteN*12}pt" data-slot="back.plannote" data-para="1" data-min="${noteN}" data-nobal="1" data-fillbox="1" data-lines="${noteN}">${esc(text(note, PW - 20, FONT.wn, noteN, 'back.plannote'))}</div>`;
    } else {
      const RXB = X0 + CW - PW, floors = (NP.floors || []).filter(f => (f.rooms || []).length);
      // sizes: from the listing's fold-over table (data.copy.top.sizes.rows) and the cover's specs, feet only
      const sizeOf = {}; ((C.top || {}).sizes || {rows: []}).rows.forEach(r => { sizeOf[String(r[0]).toLowerCase()] = feet(r[1]); });
      ((C.front || {}).specs || []).forEach(s => { sizeOf[String(s.l).toLowerCase()] = feet(s.v); });
      const resolved = floors.map(f => ({label: f.label, rooms: f.rooms.map(r => Array.isArray(r) ? [r[0], feet(r[1])] : [r, sizeOf[String(r).toLowerCase()] || ''])}));
      const nRows = resolved.reduce((a, f) => a + f.rooms.length, 0), nHeads = resolved.length > 1 ? resolved.length : 0;
      const note = beats(NP.note), nw = PW - 24;
      let noteN = [5, 4, 6, 3].find(k => can(note, nw, FONT.wn, k)); if(!noteN){ noteN = 4; issues.push({slot: 'back.sizenote', kind: 'copy-does-not-fit', detail: diag(note, nw, FONT.wn, 4)}); }
      // the window takes the height its rows need at a 21 to 25 pt pitch; the photo above takes the rest
      const fixed = 14 + 10 + 8 + 10 + 7 + noteN*12 + 12, units = nRows + nHeads*0.8;
      let pitch = 22, hD = HH - 10 - (fixed + units*pitch);
      if(hD > 200){ pitch = Math.min(25, (HH - 10 - 200 - fixed)/units); hD = HH - 10 - (fixed + units*pitch); }
      if(hD < 150){ pitch = Math.max(18, (HH - 10 - 150 - fixed)/units); hD = HH - 10 - (fixed + units*pitch); }
      hD = Math.round(hD);
      const boxTop = CT + hD + 10, boxH = HH - hD - 10;
      let g = phHTML(NP.photo, RXB, CT, PW, hD, 'back.window');
      g += `<div class="fx-sz" style="left:${RXB}pt;top:${boxTop}pt;width:${PW}pt;height:${boxH}pt"><div class="hd" style="top:14pt" data-slot="back.sizes.head" data-lines="1">${esc(NP.head || 'Room sizes')}</div>`;
      let y = 14 + 10 + 8, k = 0;
      resolved.forEach((f, fi) => {
        if(nHeads){ g += `<div class="fh" style="top:${(y + 2).toFixed(1)}pt;height:${(pitch*0.8).toFixed(1)}pt;line-height:${(pitch*0.8 - 2).toFixed(1)}pt" data-slot="back.sizes.floor${fi}" data-lines="1">${esc(f.label)}</div>`; y += pitch*0.8; }
        f.rooms.forEach((r, ri) => { g += `<div class="row" style="top:${y.toFixed(1)}pt;height:${pitch.toFixed(1)}pt${nHeads && ri === 0 ? ';border-top:0' : ''}"><span class="n" data-slot="back.sizes.r${k}" data-lines="1">${esc(r[0])}</span><span class="s" data-slot="back.sizes.s${k}" data-lines="1">${esc(r[1])}</span></div>`; y += pitch; k++; });
      });
      g += `<div class="sn fx-szn" style="top:${(y + 4).toFixed(1)}pt;height:${noteN*12 + 7}pt;width:${nw}pt;left:12pt;right:auto" data-slot="back.sizenote" data-para="1" data-min="${noteN}" data-nobal="1" data-lines="${noteN}">${esc(text(note, nw, FONT.wn, noteN, 'back.sizenote'))}</div></div>`;
      plHTML = g;
    }
    const LCW = CW - PW - 14;

    // ---- the left column: one large and two smaller captioned photos, then the around-the-house list ----
    const pw2 = (LCW - 10)/2, nh = nearH(nearby.length);
    let pick = null;
    outer2: for(const nB of [5, 6, 4, 7]){ for(const nA of [4, 5, 3]){
      if(!can(beats(A.text), LCW, FONT.lg, nA) || !pair.every(c => can(beats(c.text), pw2, FONT.cap, nB))) continue;
      const fixedL = 6 + capH(nA, true) + 12 + 6 + capH(nB, false) + 12 + nh, ph = HH - fixedL, hB = Math.round(ph*0.42), hA = ph - hB;
      if(hA >= 120 && hB >= 92 && hA <= 220 && hB <= 150){ pick = {nA, nB, hA, hB}; break outer2; } } }
    if(!pick){ const nA = 4, nB = 5, ph = HH - (6 + capH(nA, true) + 12 + 6 + capH(nB, false) + 12 + nh); pick = {nA, nB, hA: Math.round(ph*0.58), hB: ph - Math.round(ph*0.58)}; issues.push({slot: 'back', kind: 'no-layout', detail: 'the captions do not fit'}); }
    let y = CT;
    h += phHTML(A.photo || A.id, X0, y, LCW, pick.hA, 'back.feature') + capHTML(A, 'back.feature', X0, y + pick.hA + 6, LCW, pick.nA, true, 'back.feature');
    y += pick.hA + 6 + capH(pick.nA, true) + 12;
    pair.forEach((c, i) => { const x = X0 + i*(pw2 + 10);
      h += phHTML(c.photo || c.id, x, y, pw2, pick.hB, `back.pair${i}`) + capHTML(c, `back.pair${i}`, x, y + pick.hB + 6, pw2, pick.nB, false, 'back.pair'); });
    y += pick.hB + 6 + capH(pick.nB, false) + 12;
    h += hair(X0, y - 6, LCW);   // a hairline closes the photo rows over the nearby list (owner 11/10/2026: no blank band under a caption)
    h += nearHTML(nearby, X0, y, LCW, 18, nearHead);
    h += plHTML;
    h += foot(B.fine);
  }
  const base = () => {};
  after = async () => {
    FW.fitLogos();
    // the office lines sit on the agent card's own lines: the office phone on the name's line, the web line on the phone's
    const blk = document.getElementById('offblk'), cc = document.querySelector('.cc[data-contactcard]');
    if(blk && cc){ const bb = blk.getBoundingClientRect(), sc = bb.height/blk.offsetHeight || 1;
      blk.querySelectorAll('.fx-ol').forEach(el => { const t = cc.querySelector(el.dataset.at); if(!t) return; const r = t.getBoundingClientRect(), mid = (r.top + r.bottom)/2 - bb.top;
        el.style.position = 'absolute'; el.style.left = '0'; el.style.top = ((mid - el.getBoundingClientRect().height/2)/sc*0.75) + 'pt'; }); }
    document.querySelectorAll('.fx-addr:not(.wrap)').forEach(el => SP.fitLine(el, 24));
  };
  await SP.finish(D, 612, 792, h, issues, after);
  const prev = window.brochureCheck;
  if(window.PlanInk) PlanInk.applyAll(D, true);   // owner 11/10/2026 (p2): the listing plan's background is clear
  window.brochureCheck = () => prev().concat(window.AgentCard ? AgentCard.trec(document, [...document.querySelectorAll('.logo img')]) : []);
})();
</script>
