<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · The Four Windows postcard</title>
<link rel="stylesheet" href="four-windows.css">
<script src="four-windows.js"></script>
<script src="../engine/setpieces.js"></script>
<!--
  The Four Windows · Just Listed and Just Sold postcards. data.piece: card "listed" | "sold", size "6x9" (trim 648 x 432 pt) |
  "6x11" (trim 792 x 432 pt), side "front" | "back". Print adds 0.125 in (9 pt) bleed (TrimBox set by the renderer).

  Front: the cover's four-window grid at the top: the whole house as the big window (bleeds off the top and left) and two
  room views stacked beside it (bleed off the top and right). Under it the facts row between thin rules (Just Listed) or the
  agent's name and number (Just Sold); then, left, the status in heavy sans, the address and city, state and ZIP (with the
  mint tag when the listing says it has never flooded); right, a write-up (Just Listed) or what the agent did for this sale and
  the invitation (Just Sold).
  Back (10/29 postcard rules, docs/context/product.md): a mint band along the top edge carries the design across the mail
  side, with a mint block under the postage box. The return address over a window beside the address block; the status pill
  and address across the top; captioned room windows in one row (same line count), then a write-up (Just Listed), or two
  uncaptioned windows, "How I'd start" and what the first meeting is like (Just Sold). Then the postcard contact card
  (templates/_shared/agentcard.js, postcard true) full width under the address block and above the barcode strip, carrying the
  back's one logo, and the two-line disclaimer beside the barcode strip. Mail zones: SP.mail (the Just Listed library's).
  No price, no QR, no photo numbers, no "virtually staged". Copy: data.copy.pc.jl / data.copy.pc.js.
-->
<style>
  .cc{--cc-paper:#182d2d;--cc-ink:#ffffff;--cc-muted:#cfe3da;--cc-accent:#8fd3b8;--cc-line:rgba(255,255,255,.34)}
  .st{font:800 38pt/40pt var(--font-display);letter-spacing:-.9pt;color:#fff;white-space:nowrap;overflow:hidden}
  .ad{font:700 18pt/22pt var(--font-display);letter-spacing:-.3pt;color:#fff;overflow:hidden}
  .ab{font-size:12pt;line-height:19pt;color:var(--text)}
  .abk{font-size:10.5pt;line-height:15pt;color:var(--text)}
  .agentrow{display:flex;justify-content:space-between;align-items:center;border-top:.7pt solid var(--line);border-bottom:.7pt solid var(--line);height:26pt}
  .agentrow .n{font:800 14pt/26pt var(--font-display);color:#fff;white-space:nowrap}
  .agentrow .p{font:800 14pt/26pt var(--font-display);letter-spacing:.3pt;color:var(--accent);white-space:nowrap}
  .bst{display:flex;align-items:center;gap:10pt;white-space:nowrap;overflow:hidden}
  .bst .pillb{display:inline-block;background:var(--accent);color:#13302b;font:800 10pt/20pt var(--font-display);letter-spacing:1.4pt;text-transform:uppercase;padding:0 9pt;height:20pt;white-space:nowrap}
  .bst .a{font:800 16pt/20pt var(--font-display);letter-spacing:-.2pt;color:#fff;white-space:nowrap;overflow:hidden}
  .ret{font:400 8pt/10pt var(--font-body);color:var(--text);white-space:nowrap;overflow:hidden}
  .ret b{font-weight:700;letter-spacing:.8pt;text-transform:uppercase;color:#fff}
  .ctx{font-size:9pt;line-height:11.5pt;color:var(--text)}
  .bcap .nm{font:700 11pt/14pt var(--font-display);letter-spacing:-.1pt;color:#fff;white-space:nowrap;overflow:hidden;height:14pt}
  .svc{display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
  .svc .it{display:flex;gap:7pt;align-items:flex-start;font:500 9.5pt/12pt var(--font-body);color:#fff}
  .svc .it i{font:800 8pt/12pt var(--font-display);font-style:normal;width:12pt;height:12pt;background:var(--accent);color:#13302b;flex:none;text-align:center}
  .slabm{background:var(--accent);display:flex;align-items:center;overflow:hidden}
  .slabm .bigb{font:800 14pt/16pt var(--font-display);letter-spacing:-.2pt;color:#10261f;overflow:hidden}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SP.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="color:#fff;padding:20pt">No data injected.</p>'; return; }
  const esc = SP.esc, L = D.listing, A = D.agent || {};
  const issues = await SP.ready(D);
  const sold = D.piece.card === 'sold', big = D.piece.size === '6x11', front = D.piece.side === 'front';
  const PCall = ((D.copy || {}).pc || {}), C = (sold ? PCall.js : PCall.jl) || {};
  document.body.dataset.mode = D.mode || 'email';
  const W = big ? 792 : 648, H = 432, M = 24, status = sold ? 'Just Sold' : 'Just Listed';
  const flood = SP.floodStated(L.description);
  let h = '';

  if(front){
    // ---------- front ----------
    const pw = big ? 450 : 396, ph = 266, sx = pw + 10, sw = W + 9 - sx, sh = (ph + 9 - 10)/2;
    const sd = C.side || [];
    h += `<div class="abs" data-gapcheck="front.windows" style="left:0;top:0">${SP.photo(D, C.hero || 'front', -9, -9, pw + 9, ph + 9, 'front.hero')}${SP.photo(D, sd[0], sx, -9, sw, sh, 'front.side0')}${SP.photo(D, sd[1], sx, -9 + sh + 10, sw, sh, 'front.side1')}</div>`;
    const ry = ph + 14;
    if(!sold) h += `<div class="abs facts" style="left:${M}pt;top:${ry}pt;width:${W - 2*M}pt">${SP.stats(L).map((t, i) => `<span data-slot="front.fact${i}" data-lines="1">${esc(t)}</span>`).join('')}</div>`;
    else h += `<div class="abs agentrow" style="left:${M}pt;top:${ry}pt;width:${W - 2*M}pt"><span class="n" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</span><span class="p" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</span></div>`;
    const by = ry + 36, bh = 414 - by, lw = 272, tx = M + lw + 22, tw = W - M - tx;
    h += `<div class="abs" style="left:${M}pt;top:${by}pt;width:${lw}pt;height:${bh}pt;display:flex;flex-direction:column;justify-content:space-between">
      <div class="st" data-slot="status" data-lines="1" data-fit="28" style="margin-left:-1pt${sold ? ';font-size:48pt;line-height:50pt;letter-spacing:-1.2pt' : ''}">${esc(status)}</div>
      <div><div class="ad" data-slot="address" data-lines="1" data-fit="14" style="white-space:nowrap">${esc(L.address)}</div><div class="city" style="margin-top:4pt;height:12pt" data-slot="place" data-lines="1">${esc(SP.placeZip(L).toUpperCase())}</div></div>
      ${flood && !sold ? `<div><span class="tag" data-slot="front.tag" data-lines="1">Never flooded</span></div>` : ''}</div>`;
    if(!sold){
      h += `<div class="abs ab" style="left:${tx}pt;top:${by}pt;width:${tw}pt;height:${bh}pt;font-size:${big ? 13 : 12}pt" data-slot="front.about" data-para="1" data-min="4" data-fillbox="1">${esc(big ? C.front11 : C.front9)}</div>`;
    } else {
      h += `<div class="abs ab" style="left:${tx}pt;top:${by}pt;width:${tw}pt;height:${bh - 30}pt;font-size:${big ? 13 : 12}pt" data-slot="front.sold" data-para="1" data-min="3" data-fillbox="1">${esc(big ? C.front11 : C.front9)}</div>`;
      h += `<div class="abs" style="left:${tx}pt;top:${by + bh - 24}pt;width:${tw}pt;height:24pt;font:800 15pt/24pt var(--font-display);letter-spacing:-.2pt;color:var(--accent);white-space:nowrap;overflow:hidden" data-slot="sold.cta" data-lines="1" data-fit="10">${esc(C.cta || '')}</div>`;
    }
  } else {
    // ---------- back ----------
    const Z = SP.mail(W), X = M, LZ = Z.zA[0] - 12, rW = Z.zP[0] - 12 - Z.zA[0], pTop = 56;
    h += `<div class="abs" data-blk="1" style="left:-9pt;top:-9pt;width:${W + 18}pt;height:15pt;background:var(--accent)"></div>`;
    const ret = SP.returnLines(D);
    h += `<div class="abs ret" style="left:${Z.zA[0]}pt;top:16pt;width:${rW}pt;height:32pt${sold ? ';text-align:right' : ''}" data-slot="return" data-lines="3"><b>${esc(ret[0] || '')}</b>${ret.slice(1).map(r => '<br>' + esc(r)).join('')}</div>`;
    h += `<div class="abs bst" style="left:${X}pt;top:18pt;width:${LZ - X}pt;height:22pt"><span class="pillb" data-slot="back.status" data-lines="1">${esc(status)}</span><span class="a" data-slot="back.addr" data-lines="1" data-fit="11">${esc(L.address)}</span></div>`;
    const cap = (c, x, y, w, slot, row) => `<div class="abs cap bcap" style="left:${x}pt;top:${y + 4}pt;width:${w}pt"><div class="nm" data-slot="${slot}.t" data-lines="1">${esc(c.t)}</div></div>
      <div class="abs ctx" style="left:${x}pt;top:${y + 21}pt;width:${w}pt" data-slot="${slot}" data-cap="1" data-row="${row}" data-para="1" data-min="3">${esc(c.a)}</div>`;
    let g = '';
    if(!sold){
      // one row of captioned windows: the left zone, and one beside the address block under the return address
      const bk = C.back || [], n = big ? 4 : 3, items = bk.slice(0, n), rItem = bk[4], gap = 10, ph = 74;
      const pw = (LZ - X - (n - 1)*gap)/n;
      items.forEach((c, i) => { const x = X + i*(pw + gap); g += SP.photo(D, c.id, x, pTop, pw, ph, 'back.photo' + i); h += cap(c, x, pTop + ph, pw, 'back.cap' + i, 'back'); });
      if(rItem){ g += SP.photo(D, rItem.id, Z.zA[0], pTop, rW, ph, 'back.photoR'); h += cap(rItem, Z.zA[0], pTop + ph, rW, 'back.capR', 'back'); }
      const ty = pTop + ph + 21 + 3*11.5 + 11;
      h += `<div class="abs abk" style="left:${X}pt;top:${ty}pt;width:${LZ - X}pt;height:${Math.floor((Z.cardY - 8 - ty)/15)*15}pt" data-slot="back.about" data-para="1" data-min="3" data-fillbox="1">${esc(big ? C.about11 : C.about9)}</div>`;
    } else {
      // two room windows, no captions; "How I'd start" beside them; what the first meeting is like under them
      const ids = C.photos || [], gap = 10, pw = (LZ - X - gap)/2, ph = 112;
      ids.slice(0, 2).forEach((id, i) => { g += SP.photo(D, id, X + i*(pw + gap), pTop, pw, ph, 'back.photo' + i); });
      h += `<div class="abs kick" style="left:${Z.zA[0]}pt;top:${pTop}pt;width:${rW}pt;height:10pt" data-slot="sold.servicesLabel" data-lines="1">How I’d start</div>`;
      h += `<div class="abs svc" style="left:${Z.zA[0]}pt;top:${pTop + 16}pt;width:${rW}pt;height:${Z.zA[1] - 10 - pTop - 16}pt" data-fitlist="8">${(C.steps || []).map((s, i) => `<div class="it"><i>${i + 1}</i><span data-slot="sold.step${i}" data-lines="3">${esc(s)}</span></div>`).join('')}</div>`;
      const my = pTop + ph + 12;
      h += `<div class="abs kick" style="left:${X}pt;top:${my}pt;width:${LZ - X}pt;height:10pt" data-slot="sold.meetLabel" data-lines="1">When we meet</div>`;
      h += `<div class="abs abk" style="left:${X}pt;top:${my + 15}pt;width:${LZ - X}pt;height:60pt" data-slot="sold.meet" data-para="1" data-min="3" data-fillbox="1">${esc(big ? C.meet11 : C.meet9)}</div>`;
      h += `<div class="abs" style="left:${X}pt;top:${my + 80}pt;width:${LZ - X}pt;height:${Z.cardY - 8 - my - 80}pt;display:flex;align-items:center;font:800 12.5pt/15pt var(--font-display);letter-spacing:-.1pt;color:var(--accent);overflow:hidden" data-slot="sold.call" data-lines="2">${esc(C.call || '')}</div>`;
    }
    h += `<div class="abs" data-gapcheck="back.photos" style="left:0;top:0">${g}</div>`;
    // the mint block under the postage box, bleeding off the right edge
    const sl = C.slab || {};
    h += `<div class="abs slabm" data-blk="1" style="left:${Z.zP[0]}pt;top:${Z.zP[1] + Z.zP[3] + 8}pt;width:${W - Z.zP[0] + 9}pt;height:${Z.zA[1] - Z.zP[1] - Z.zP[3] - 16}pt;padding:6pt 14pt 6pt 9pt"><div class="bigb" data-slot="slab.big" data-lines="3">${esc(sl.big || '')}</div></div>`;
    h += SP.postCard(D, Z, W);
    h += SP.fine(D, X, 396, Z.zB[0] - 12 - X, 'var(--text)');
    h += SP.mailGuides(D, Z);
  }

  await SP.finish(D, W, H, h, issues);
})();
</script>
</body>
</html>
