<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rounded-frame social set</title>
<link rel="stylesheet" href="rf-tokens.css">
<script src="../engine/baths.js"></script>
<script src="../engine/ivory.js"></script>
<script src="../engine/ohlib.js"></script>
<script src="../engine/ohemail.js"></script>
<script src="../engine/carousel.js"></script>
<script src="../engine/factrepeat.js"></script>
<script src="../engine/socialset.js"></script>
<script src="rf-social.js"></script>
<!-- Rounded Frame's Just Listed and Just Sold social sets (owner 11/18/2026). The shared engine (templates/_shared/socialset.js) loads
     the fonts and the data and runs the checks; the layouts are Rounded Frame's own (rf-social.js): the solid main-color card with
     JUST / LISTED, the pill for JUST SOLD, the fact pills, the house in its rounded outline frame, ring bullets, the note in the
     rounded tinted box. The colors come from the agent's brand kit exactly as the set's print pieces read them (RF.brand in rf.js). -->
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
SocialSet.portrait = RFSocial.portrait; SocialSet.landscape = RFSocial.landscape; SocialSet.slide = RFSocial.slide;
SocialSet.start(D => {
  const b = D.brand || {}, c = b.colors || {}, r = document.documentElement.style;
  const rgb = h => { h = String(h||'').replace('#',''); if(h.length===3) h = h.split('').map(x=>x+x).join(''); const n = parseInt(h,16); return [n>>16&255, n>>8&255, n&255]; };
  const lum = h => { const v = rgb(h).map(q => { q/=255; return q <= .03928 ? q/12.92 : Math.pow((q+.055)/1.055, 2.4); }); return .2126*v[0] + .7152*v[1] + .0722*v[2]; };
  const con = (a, z) => { const x = lum(a), y = lum(z); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); };
  const on = bg => con(bg, '#ffffff') >= con(bg, '#161616') ? '#ffffff' : '#161616';
  const mix = (a, z, t) => { const p = rgb(a), q = rgb(z); return '#' + p.map((v, i) => Math.round(v + (q[i] - v)*t).toString(16).padStart(2, '0')).join(''); };
  // as RF.colors / RF.brand: the kit's paper is the ground, the main color (kept only where it reads on the paper) is the one color
  const main0 = c.main || b.accent || '#2f4a3a', paper = b.paper || mix(main0, '#ffffff', .93), main = con(main0, paper) >= 3 ? main0 : on(paper);
  r.setProperty('--rf-paper', paper); r.setProperty('--rf-main', main); r.setProperty('--rf-on-main', on(main)); r.setProperty('--rf-tint', mix(main, paper, .9));
  r.setProperty('--ss-page', paper); r.setProperty('--ss-ink', '#161616'); r.setProperty('--ss-acc', main);
  r.setProperty('--ss-band', main); r.setProperty('--ss-bandink', on(main)); r.setProperty('--ss-bandacc', on(main));
});
</script>
</body>
</html>
