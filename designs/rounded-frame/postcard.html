<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · Rounded Frame postcards</title>
<link rel="stylesheet" href="rf.css">
<link rel="stylesheet" href="rf-fo.css">
<script src="rf.js"></script>
<script src="../engine/baths.js"></script>
<script src="../engine/agentcard.js"></script>
<script src="../engine/factrepeat.js"></script>
<script>window.Ivory = window.Ivory || {esc: s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))};</script>
<script src="rf-fo.js"></script>
<!--
  BrochureDesk · Rounded Frame · Just Listed and Just Sold postcards (the hand of the approved Open House library flyer B01).
  data.piece.card = "listed" | "sold", data.piece.size = "6x11" (trim 792 x 432 pt) | "6x9" (648 x 432 pt), data.piece.side = "front" | "back".
  Print adds 0.125 in (9 pt) bleed. The agent's brand color (brand.accent) is the field on both sides; boxes are white.
  Front: the whole house (roof to steps) on the right with a one-line-or-two caption and a white box under it, the status stacked large on the left over the address,
  the fact rows and the brokerage logo (Just Listed) or the agent's name and number and the logo (Just Sold). No price, no QR.
  Back: status line, interior photos with captions, a white box (the write-up, or the steps), the standard contact card (templates/_shared/agentcard.js,
  band preset, which carries the back's one logo), the fine print. The right 289.5 pt (4.02 in) is the mail vendor's: return address, postage and address
  zones; drawn as guides on proofs and left clear in print.
  Copy comes from data.sw.pc.{jl|js}.{front|back} as a lead plus whole sentences; rf.js picks the sentences that fill each box.
-->
<style>
  /* Rounded Frame postcards: the paper cells, pills and numbered circles of P05; font properties written one by one */
  .pc-wbox{background:var(--rf-paper);color:var(--rf-ink);border-radius:18pt;display:flex;flex-direction:column;overflow:hidden}
  .pc-wbox .k{font-family:var(--rf-font);font-weight:600;font-size:9pt;line-height:12pt;letter-spacing:1.6pt;text-transform:uppercase;color:var(--rf-main);white-space:nowrap;overflow:hidden;margin-bottom:3pt;align-self:flex-start}
  .pc-bstatus{position:absolute;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
  .pc-steps .it{display:flex;gap:9pt;align-items:baseline;white-space:nowrap;overflow:hidden}
  .pc-steps .bx{flex:none;width:15pt;height:15pt;border:1.3pt solid var(--rf-main);border-radius:50%;text-align:center;font-family:var(--rf-font);font-weight:600;font-size:8.6pt;line-height:12.6pt;color:var(--rf-main)}
  .pc-call{font-family:var(--rf-font);font-weight:600;font-size:13pt;line-height:16pt;color:var(--rf-main);white-space:nowrap;overflow:hidden}
  .pc-disc{position:absolute;font-family:var(--rf-font);font-size:6pt;line-height:10pt;color:var(--rf-on-main);overflow:hidden;white-space:nowrap}
  .pc-ret{position:absolute;font-family:var(--rf-font);font-weight:500;font-size:9pt;line-height:11pt;letter-spacing:.2pt;overflow:hidden;height:34pt}
  .pc-ret b{font-weight:700;letter-spacing:1.2pt;text-transform:uppercase}
  .cap .a{font-weight:400}
  .pc-back .cap .a{hyphens:auto;-webkit-hyphens:auto}   /* the 6x9's narrow caption columns: hyphenation keeps justified word gaps even (no rivers, captions reach the photo edge) */
  /* the back's compact contact row (owner 11/16): on the field, email and web side by side */
  .pc-back .cc{background:transparent}
  .pc-back .cc .cc-lines{display:flex;column-gap:12pt}
  .pc-back .cc .cc-panel{flex-direction:row;align-items:center;column-gap:10pt}
  .pc-back .cc .cc-panel > div:last-child{text-align:left}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const esc = SW.esc, b = D.brand || {}, A = D.agent || {}, L = D.listing, P = D.piece || {};
  document.body.dataset.mode = D.mode || 'email';
  await SW.setup(D);
  const sold = P.card === 'sold', big = P.size === '6x11', front = P.side === 'front';
  const W = big ? 792 : 648, H = 432;
  const K = ((D.sw || {}).pc || {})[sold ? 'js' : 'jl'] || {};
  const hsSrc = A.headshot && ((D.photos||{})[A.headshot] ? D.photos[A.headshot].src : A.headshot) || '';
  const statusWord = sold ? 'Just Sold' : 'Just Listed';
  const issues = [];
  const logo = (cls, src, area, maxh, style) => `<div class="logo ${cls}" data-area="${area}" data-maxh="${maxh}" style="${style||''}">${src ? `<img src="${esc(src)}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage||'')}</span>`}</div>`;
  const CL = big ? 13.5 : 12.5, CF = big ? 'font-size:10.9pt;line-height:13.5pt;' : '';   // the 6x11 sets its type up from the 6x9 (11 pt against 9.5), not the same size with more room
  const cap = (c, slot, lines, extra, min) => (c = (c.photo ? FXS.augment(D, c) : c), `<div class="cap" style="height:${5 + lines*CL}pt;${extra||''}"><div class="a" data-min="${min || 2}" data-nopair="1" data-slot="${slot}" data-narrow="0" data-nstep="6" data-lh="${CL}" data-lines="${lines}" data-lead="${esc(c.lead||'')}" data-s='${esc(JSON.stringify([].concat(c.s||[]))).replace(/'/g,'&#39;')}' style="height:${lines*CL}pt;${CF}"></div></div>`);
  let h = '';

  if(front){
    // The FX14 hand on a postcard front. A white frame top and side, the whole house in it, a taupe block around it with the status in Pinyon Script.
    // JL: "Just Listed" in script beside the house, the horizontal address, three facts; under the house the caption ("Front.", the draws) and the agent and logo along the foot.
    // JS: sells the agent: "Just Sold" in the same script lockup, the name and phone big on the left, the house on the right with the agent's own note, the logo.
    const F = K.front || {};
    const draws = list => { const w = x => /gated|roof|pergola|deck|park|garage|island|stone|corner|pool/i.test([].concat(x)[0]) ? 0 : 1; return (list || []).map((x, i) => [w(x), i, x]).sort((p, q) => p[0] - q[0] || p[1] - q[1]).map(t => t[2]); };
    const capC = sold ? {lead: '', s: (F.note || {}).s || (F.cap || {}).s} : (F.caption ? {lead: F.caption.lead, s: F.caption.s.concat(draws((F.about || {}).s || []))} : {lead: 'Front.', s: draws((F.about || {}).s || (F.cap || {}).s)});
    const norm = x => String(x).toLowerCase().replace(/[^a-z0-9 ]/g, '').slice(0, 40), allAlts = list => [].concat(...(list || []).map(x => [].concat(x)));
    const backSet = new Set([].concat(allAlts(((K.back || {}).about || {}).s), ...((K.back || {}).photos || []).map(c => allAlts(c.s)), allAlts((K.back || {}).steps6), allAlts((K.back || {}).steps)).map(norm));
    const backAll = allAlts(((K.back || {}).about || {}).s).map(String);   // the back's About box
    if(capC.s){ const kept = capC.s.filter(x => ![].concat(x).some(a => backSet.has(norm(a)))); if(kept.length >= 2) capC.s = kept; }
    // the caption's own first sentence stays; a later one that says a fact the back's About box says (the deck and pergola, in other words) drops out
    if(capC.s && capC.s.length > 2){ const tail = capC.s.slice(1).filter(x => ![].concat(x).some(a => backAll.some(b => SW.sameFact(String(a), b)))); if(tail.length >= 1) capC.s = [capC.s[0]].concat(tail); }
    const roomIds = [...new Set([].concat(((D.sw||{}).back||{}).photos||[], ((D.sw||{}).left||{}).photos||[]).map(c => c.photo))].filter(id => (D.photos||{})[id] && !(D.photos[id]||{}).fullHouse && id !== F.cap.photo).slice(0, 2);
    // ---- Rounded Frame fronts, design pass 11/15 (the mailbox test). Two different cards. Just Listed: the house bleeds off three edges
    // and is the hero; JUST / LISTED stacked as large as the column allows, flush left with the street, the facts and three specific highlights
    // on small accent marks (no box); the agent and the one logo along the foot; the closed frame holds the words and never crosses the photo.
    // Just Sold: the house is a picture inside the closed frame; the words centered. A dusk glow runs where the field meets the photo. ----
    // ---- Rounded Frame fronts. Two different cards in P05's hand. Just Listed: the solid main cell holds JUST / LISTED stacked as large as
    // its column allows (white), the street and the facts under it; the house sits in its rounded frame beside it; the real story as
    // ring-bulleted highlights; the agent and the one logo on the paper at the foot. Just Sold: JUST SOLD in a full-width solid pill across the
    // top (about twice the agent's name), the house framed under it, and beside it the street, the question, the note in the flyer's tint
    // cell sized to its text, then who to call. No house features on Just Sold. ----
    const k = big ? 1.12 : 1, E = 16, pid = FO.heroId(D, F.cap.photo);
    const word = sold ? 'Just Sold' : 'Just Listed', hood = FXS.hood(L), ad = String(L.address || '');
    const facts = FXS.statItems(L).filter(t => !/^Built/.test(t)).join('  ·  ');
    const disp = (t, x, y, w, fs, slot, extra) => `<div class="rf-disp" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${fs*1.08}pt;font-size:${fs}pt;line-height:${fs*1.08}pt;letter-spacing:${(-fs*0.035).toFixed(2)}pt;${extra || ''}" data-slot="${slot}" data-lines="1">${esc(t)}</div>`;
    const dfit = (t, w, max, min) => { let f = max; while(f > min && FXS.width(t, `font-family:Lexend;font-weight:600;letter-spacing:${(-f*0.035).toFixed(2)}pt;font-size:${f}pt`) > w - 4) f -= 0.5; return f; };
    const line = (t, x, y, w, fs, wt, slot, extra) => `<div class="abs" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${fs*1.3}pt;font-family:Lexend;font-weight:${wt};font-size:${fs}pt;line-height:${fs*1.3}pt;white-space:nowrap;overflow:hidden;${extra || ''}" data-slot="${slot}" data-lines="1">${esc(t)}</div>`;
    const lfit = (t, w, max, min, wt) => FXS.fitSize(t, `font-family:Lexend;font-weight:${wt || 600}`, w - 4, max, min);
    const desT = A.designation ? (A.nar || /realtor/i.test(A.designation) ? 'REALTOR®' : A.designation) : '';
    // the agent's name and number with the one logo beside them (or under them in a narrow column), on the paper
    const agentFoot = (x, y, w, hh, ns, al) => { const nw = FXS.width(A.name || '', `font-family:Lexend;font-weight:600;font-size:${ns}pt`), pw = FXS.width(A.phone || '', `font-family:Lexend;font-weight:500;font-size:${ns*0.8}pt`), bw = Math.max(nw, pw) + 6, lw = w - bw - 18*k;
      const txt = `<div class="abs" style="left:${al === 'center' ? x : x}pt;top:${y + (hh - ns*2.3)/2}pt;width:${bw}pt;white-space:nowrap"><div style="font-family:Lexend;font-weight:600;font-size:${ns}pt;line-height:${ns*1.2}pt;color:var(--rf-ink)" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</div><div style="font-family:Lexend;font-weight:500;font-size:${ns*0.8}pt;line-height:${ns*1.1}pt;color:var(--rf-main)" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</div></div>`;
      return txt + FXS.logo(D, x + bw + 18*k, y + 3, lw, hh - 6, 'flex-end'); };
    const photoCell = (x, y, w, hh) => RF.cell(x, y, w, hh) + `<div class="abs" style="left:${x + 9}pt;top:${y + 9}pt;width:${w - 18}pt;height:${hh - 18}pt">${SW.photo(D, pid, 'position:absolute;inset:0', 'front.hero')}</div>`;
    const cq = 'Thinking about selling?';

    if(!sold){
      // ---------- JUST LISTED ----------
      let PWc = big ? 470 : 382; const PH = H - 2*E; while(PWc < W*0.66 && !SW.fits(D, pid, PWc - 18, PH - 18)) PWc += 6;
      const stacked = !SW.fits(D, pid, PWc - 18, PH - 18);
      const hls = [].concat(F.highlights || []).map(x => String([].concat(x)[0])).filter(Boolean);
      if(!stacked){
        const PX = W - E - PWc, CX = E, CW2 = PX - 12 - E, TX = CX + 16, TW = CW2 - 32;
        h += photoCell(PX, E, PWc, PH);
        // the foot: agent and logo; above it the highlights on ring bullets; the main cell takes the rest of the column
        const fh = 40*k, fy = H - E - fh, hfs = 10.4*k, hrh = 19*k, hl = hls.filter(t => FXS.width(t, `font-family:Lexend;font-weight:500;font-size:${hfs}pt`) <= CW2 - 22).slice(0, 3);
        const hy0 = fy - 10 - hl.length*hrh, MY1 = hy0 - 10;
        h += RF.cell(CX, E, CW2, MY1 - E, {fill: 'main'});
        const ls = dfit('LISTED', TW, 76*k, 30), as = lfit(ad, TW, 21*k, 12), ffs = lfit(facts, TW, 10*k, 8.6, 500), pl = (hood || L.city || '').toUpperCase();
        const blk = 12*k + 6 + 2*ls*0.98 + 10 + as*1.3 + 2 + ffs*1.3, by = E + (MY1 - E - blk)/2;
        let y = by; h += `<div class="rf-eyebrow" style="left:${TX}pt;top:${y}pt;width:${TW}pt;font-size:${8.8*k}pt;line-height:${12*k}pt;letter-spacing:2pt;color:var(--rf-on-main)" data-slot="front.place" data-lines="1">${esc(pl)}</div>`; y += 12*k + 6;
        h += disp('JUST', TX - 2, y, TW + 4, ls, 'front.status', 'color:var(--rf-on-main)') + disp('LISTED', TX - 2, y + ls*0.98, TW + 4, ls, 'front.status2', 'color:var(--rf-on-main)'); y += 2*ls*0.98 + 10;
        h += line(ad, TX, y, TW, as, 600, 'front.address', 'color:var(--rf-on-main)'); y += as*1.3 + 2;
        h += line(facts, TX, y, TW, ffs, 500, 'front.facts', 'color:var(--rf-on-main)');
        hl.forEach((t, i) => { const yy = hy0 + i*hrh; h += `<div class="abs" style="left:${CX + 4}pt;top:${yy + (hrh - 8)/2}pt;width:8pt;height:8pt;border:1.4pt solid var(--rf-main);border-radius:50%"></div>` + line(t, CX + 18, yy + (hrh - hfs*1.3)/2, CW2 - 18, hfs, 500, 'front.hl.' + i, 'color:var(--rf-ink)'); });
        h += agentFoot(CX + 4, fy, CW2 - 4, fh, 14*k);
      } else {
        // a wide house: the frame across the top, the main cell and the words under it
        let SH = big ? 236 : 226; while(SH < H*0.7 && !SW.fits(D, pid, W - 2*E - 18, SH - 18)) SH += 4;
        h += photoCell(E, E, W - 2*E, SH);
        const y0 = E + SH + 12, bh = H - E - y0, cW = Math.round((W - 2*E)*0.5), rx = E + cW + 18, rw = W - E - rx;
        h += RF.cell(E, y0, cW, bh, {fill: 'main'});
        const ls = Math.min(dfit('JUST LISTED', cW - 32, 54*k, 22), (bh - 20)/1.1); h += disp('JUST LISTED', E + 14, y0 + (bh - ls*1.08)/2, cW - 28, ls, 'front.status', 'color:var(--rf-on-main)');
        const as = lfit(ad, rw, 20*k, 12); let y = y0 + 2; h += line(ad, rx, y, rw, as, 600, 'front.address', 'color:var(--rf-main)'); y += as*1.3;
        const ffs = lfit(facts, rw, 10*k, 8.6, 500); h += line(facts, rx, y, rw, ffs, 500, 'front.facts', 'color:var(--rf-ink)'); y += ffs*1.3 + 4;
        const fh = 34*k; h += agentFoot(rx, H - E - fh, rw, fh, 12.5*k);
        const hl = hls.filter(t => FXS.width(t, `font-family:Lexend;font-weight:500;font-size:${9.6*k}pt`) <= rw - 18).slice(0, Math.max(1, Math.floor((H - E - fh - 4 - y)/(16*k)))), hrh = (H - E - fh - 4 - y)/Math.max(1, hl.length);
        hl.forEach((t, i) => { const yy = y + i*hrh; h += `<div class="abs" style="left:${rx}pt;top:${yy + (hrh - 8)/2}pt;width:8pt;height:8pt;border:1.4pt solid var(--rf-main);border-radius:50%"></div>` + line(t, rx + 14, yy + (hrh - 9.6*k*1.3)/2, rw - 14, 9.6*k, 500, 'front.hl.' + i, 'color:var(--rf-ink)'); });
      }
    } else {
      // ---------- JUST SOLD ----------
      const BH = 78*k > 86 ? 86 : 78*k, js = dfit('JUST SOLD', W - 2*E - 60, 62*k, 30);
      h += RF.cell(E, E, W - 2*E, BH, {fill: 'main', radius: (BH/2) + 'pt'}) + disp('JUST SOLD', E + 30, E + (BH - js*1.08)/2, W - 2*E - 60, js, 'front.status', 'color:var(--rf-on-main);text-align:center');
      const y0 = E + BH + 12, PH = H - E - y0; let PWc = big ? 400 : 322; while(PWc < W*0.62 && !SW.fits(D, pid, PWc - 18, PH - 18)) PWc += 6;
      h += photoCell(E, y0, PWc, PH);
      const TX = E + PWc + 18, TW = W - E - TX, ns = Math.min(js/2, 22*k), fh = ns*2.3 + 6, fy = H - E - fh;
      let y = y0 + 2; const as = lfit(ad, TW, 24*k, 13); h += line(ad, TX, y, TW, as, 600, 'front.address', 'color:var(--rf-main);letter-spacing:-.4pt'); y += as*1.3 + 4;
      const qs = lfit(cq, TW, 17*k, 11); h += line(cq, TX, y, TW, qs, 600, 'front.cta', 'color:var(--rf-ink)'); y += qs*1.3 + 8;
      const ny = y, lh = 14.5*k, room = fy - 12 - ny, n = Math.max(3, Math.min(6, Math.floor((room - 22)/lh)));
      h += `<div class="rf-wbox" id="notebox" data-pad="11" style="left:${TX}pt;top:${ny}pt;width:${TW}pt;height:${n*lh + 22}pt"></div><div class="abs cap"><div class="a" style="position:absolute;left:${TX + 14}pt;top:${ny + 11}pt;width:${TW - 28}pt;height:${n*lh}pt;font-size:${10.6*k}pt;line-height:${lh}pt;color:var(--rf-ink)" data-slot="front.note" data-lh="${lh}" data-lines="${n}" data-min="3" data-narrow="0" data-flexh="1" ${FXS.sd(capC.s || [])}></div></div>`;
      h += `<div class="abs" id="jsfoot" style="left:${TX}pt;top:${fy}pt;width:${TW}pt;height:${fh}pt">` + `</div>` + agentFoot(TX, fy, TW, fh, ns);
    }
  } else {
    // ---------------- BACK (owner 11/16/2026: the design runs the full width; the contact block is one compact row) ----------------
    // The whole back is the set's solid main cell, edge to edge, the mail side included; on it the set's paper cells: the status pill with the
    // full street, the rooms each in their rounded frame (Just Listed) or the six steps on numbered circles (Just Sold); the facts as reversed
    // pills (Just Listed) or the seller question (Just Sold) between the postage box and the address block. The postage box, the address block
    // and the barcode strip keep their mail-rule sizes and places and are light tint markups set into the field.
    const dx = W - 648, X = 18, B = K.back || {}, cq = 'Thinking about selling?';
    const Z = {postage: [552 + dx, 12, 84, 98.25], address: [405 + dx, 187.5, 240, 112.5], barcode: [306 + dx, 387, 342, 45]};
    window.__zones = Z; window.__cardX = X;
    const rx = Z.address[0], MP = 5, E = 16, XR = rx - MP - 12, LW = XR - E;
    const FT = Z.address[1] + Z.address[3] + MP + 7, cardH = 48, cardY = (Z.address[1] + Z.address[3] + MP + Z.barcode[1] - MP - cardH)/2;   // the contact row centered between the address block and the barcode strip (no wide empty band above or below it)
    h += `<div class="taupe" style="left:-9pt;top:-9pt;width:${W + 18}pt;height:${H + 18}pt"></div>`;
    const pnl = (x, y, w, hh) => `<div class="abs mailp" data-mail-panel="1" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${hh}pt;background:var(--fx-mail);z-index:4;border-radius:6pt"></div>`;
    // the status pill: JUST LISTED / JUST SOLD in the main color with the full street beside it, on the paper
    const PY = E, PHt = 44*(big ? 1.08 : 1), st = String(L.address || ''), stWf = f => FXS.width(statusWord.toUpperCase(), `font-family:Lexend;font-weight:600;letter-spacing:1pt;font-size:${f}pt`), stS = f => FXS.width(st, `font-family:Lexend;font-weight:600;font-size:${f*0.85}pt`); let sfs = PHt*0.5; while(sfs > 14 && stWf(sfs) + stS(sfs) + 31 > LW - 48) sfs -= 0.5; const stW = stWf(sfs), ss = FXS.fitSize(st, 'font-family:Lexend;font-weight:600', LW - 48 - stW - 31, sfs*0.85, 11);
    h += RF.cell(E, PY, LW, PHt, {fill: 'paper', radius: (PHt/2) + 'pt', nofoot: 1});
    h += `<div class="pc-bstatus" style="left:${E + 22}pt;top:${PY}pt;width:${LW - 44}pt;height:${PHt}pt;align-items:center" data-slot="back.status" data-lines="1" data-small="1"><span style="font-family:Lexend;font-weight:600;font-size:${sfs}pt;line-height:${PHt}pt;letter-spacing:1pt;text-transform:uppercase;color:var(--rf-main)">${esc(statusWord)}</span><span style="flex:none;width:7pt;height:7pt;border-radius:50%;background:var(--rf-main);margin:0 12pt"></span><span style="font-family:Lexend;font-weight:600;font-size:${ss}pt;line-height:${PHt}pt;color:var(--rf-ink)">${esc(st)}</span></div>`;
    const BY = PY + PHt + 10, BB = FT - 9;
    // return address beside the postage box: brokerage / street / city, state ZIP, stacked and right-aligned, white on the field
    const rw = Z.postage[0] - 12 - rx;
    const ret = [b.brokerage || ''].concat([].concat(b.returnAddress || b.address || []).flatMap(a => String(a).split('\n'))).filter(Boolean).slice(0, 3);
    h += `<div class="pc-ret" data-small="1" data-fine="1" data-slot="back.return" style="left:${rx}pt;top:17pt;width:${rw}pt;text-align:right;color:var(--rf-on-main);z-index:3"><b style="color:var(--rf-on-main)">${esc(ret[0] || '')}</b>${ret.slice(1).map(t => '<br>' + esc(t)).join('')}</div>`;
    // between the postage box and the address block

      if(l > X0 + 1 || rr < Wt - X0 - 1) out.push({slot: 'back.card', kind: 'card-not-full-width', detail: `card spans ${l.toFixed(0)}-${rr.toFixed(0)} pt of ${Wt.toFixed(0)}`}); }
    let area = 0; document.querySelectorAll('.sheet [data-mail-panel]').forEach(el => { const r = el.getBoundingClientRect(); const w = Math.min(pt(r.right - sh.left) - 9, pt(sh.width) - 18) - Math.max(pt(r.left - sh.left) - 9, 0), h = Math.min(pt(r.bottom - sh.top) - 9, 432) - Math.max(pt(r.top - sh.top) - 9, 0); area += Math.max(0, w)*Math.max(0, h); });
    if(area > .25*(pt(sh.width) - 18)*432) out.push({slot: 'back.panels', kind: 'light-block-too-big', detail: `mail panels cover ${(100*area/((pt(sh.width) - 18)*432)).toFixed(0)}% of the card`});
    if(sold) out.push(...jsCheck());
    return out; }
  // nothing but the proof guides may sit in the mail vendor's zones (postage, address block, barcode strip)
  function lum(c){ const m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(c); return m ? .2126*m[1] + .7152*m[2] + .0722*m[3] : 0; }
  function panelCheck(){ const out = [], Z = window.__zones, sh = document.querySelector('.sheet').getBoundingClientRect(), pt = v => v*72/96;
    const panels = [...document.querySelectorAll('.mailp')].map(p => { const r = p.getBoundingClientRect(); return {l: pt(r.left - sh.left), t: pt(r.top - sh.top), r: pt(r.right - sh.left), b: pt(r.bottom - sh.top), lum: lum(getComputedStyle(p).backgroundColor)}; });
    if(!panels.length) out.push({slot: 'back.panel', kind: 'mail-panel-missing', detail: 'no light panel under the mail zones'});
    ['postage', 'address', 'barcode'].forEach(k => { const z = Z[k], p = panels.find(q => q.l <= z[0] + .5 && q.t <= z[1] + .5 && q.r >= z[0] + z[2] - .5 && q.b >= z[1] + z[3] - .5);
      if(!p) out.push({slot: 'back.' + k, kind: 'mail-zone-not-light', detail: `the ${k} zone is not fully on a light panel`});
      else if(p.lum < 200) out.push({slot: 'back.' + k, kind: 'mail-zone-not-light', detail: `the ${k} panel's luminance is ${Math.round(p.lum)} (200 minimum): vendors print black ink and USPS needs a light field`}); });
    // the taupe runs to every edge: nothing outside the three panels is light
    return out; }
  // the Just Sold bullets: each takes the longest wording that sets in 3 lines (2 on the 6x9) so the six read as full sentences
  function fitHelp(){
    const hbs = [...document.querySelectorAll('.hb')], grid = document.querySelector('.pc-help'), call = grid.parentElement.querySelector('.pc-call');
    const pick = maxL => hbs.forEach(el => { const tx = el.querySelector('.tx'), alts = JSON.parse(el.dataset.alts).slice().sort((p, q) => q.length - p.length); let best = null, bf = -1;
      for(const a of alts){ tx.textContent = a; const L = SW.lines(tx); if(L.n > maxL) continue; if(L.n === 1 || L.fill >= .76){ best = a; bf = 9; break; } if(L.fill > bf){ best = a; bf = L.fill; } }
      tx.textContent = best || alts[alts.length - 1]; });
    const over = () => Math.max(...hbs.map(e => e.getBoundingClientRect().bottom)) > call.getBoundingClientRect().top - 5 || grid.parentElement.scrollHeight > grid.parentElement.clientHeight + .5;
    const bad = () => hbs.filter(el => { const L = SW.lines(el.querySelector('.tx')); return L.n > 1 && L.fill < .75; });
    // the bullets take the largest size at which all six set in full lines (last line 3/4 full) inside the box: no empty band under the heading
    const base = big ? 8.5 : 8, top = big ? 15 : 12; let bestCfg = null;
    const apply = fs => hbs.forEach(el => { el.style.fontSize = fs + 'pt'; el.style.lineHeight = (fs*1.32) + 'pt'; el.querySelector('.bx').style.marginTop = (fs*1.32/2 - 2) + 'pt'; });
    // every size is tried; the one whose bullets keep the fullest wording (then the larger type) wins, all six on full last lines inside the box
    for(let fs = top; fs >= base; fs -= .25) for(const maxL of (big ? [3, 2] : [3, 2])){
      apply(fs); pick(maxL); if(over() || bad().length) continue;
      const len = hbs.reduce((n, el) => n + el.querySelector('.tx').textContent.length, 0), sc = fs*1000 + len;
      if(!bestCfg || sc > bestCfg.sc) bestCfg = {fs, maxL, sc}; }
    if(bestCfg){ apply(bestCfg.fs); pick(bestCfg.maxL); } else { apply(base); pick(3); }
    { const bxel = grid.parentElement; if(over() || bxel.scrollHeight > bxel.clientHeight + .5) issues.push({slot: 'back.steps', kind: 'steps-overflow', detail: 'the six bullets and the call line do not fit their box'}); }
    hbs.forEach(el => { const tx = el.querySelector('.tx'), L = SW.lines(tx); delete el.dataset.slot;
      if(L.n > 1 && L.fill < .75) issues.push({slot: 'back.step' + el.dataset.help, kind: 'last-line-short', detail: `last line is ${Math.round(L.fill*100)}% full (75% minimum): "${tx.textContent.slice(-24)}"`}); });
  }
  function mailCheck(){ const out = [], Z = window.__zones, pt = v => v*72/96, sh = document.querySelector('.sheet').getBoundingClientRect();
    const hit = (r, z) => pt(r.left - sh.left) < z[0] + z[2] - .5 && pt(r.right - sh.left) > z[0] + .5 && pt(r.top - sh.top) < z[1] + z[3] - .5 && pt(r.bottom - sh.top) > z[1] + .5;
    // owner 11/16: the photo band runs under the postage box; the light markup laid over it (z-index above the photo) covers the whole zone, so only
    // type, boxes and cards count as in the zone, and a photo counts only where no light markup covers that zone
    const covered = k => [...document.querySelectorAll('.sheet .mailp')].some(p => { const r = p.getBoundingClientRect(), z = Z[k]; return pt(r.left - sh.left) <= z[0] + .5 && pt(r.top - sh.top) <= z[1] + .5 && pt(r.right - sh.left) >= z[0] + z[2] - .5 && pt(r.bottom - sh.top) >= z[1] + z[3] - .5 && +getComputedStyle(p).zIndex >= 4; });
    document.querySelectorAll('.sheet .ph, .sheet .pc-wbox, .sheet .cap, .sheet .cc, .sheet .pc-ret, .sheet .pc-bstatus, .sheet .pc-disc').forEach(el => {
      const r = el.getBoundingClientRect(); for(const k in Z) if(hit(r, Z[k]) && !(el.classList.contains('ph') && covered(k))) out.push({slot: el.dataset.slot || el.className, kind: 'in-mail-zone', zone: k}); });
    return out; }
})();
