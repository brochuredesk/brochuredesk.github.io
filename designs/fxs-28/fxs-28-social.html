<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · FX extras · FX28 socials</title>
<link rel="stylesheet" href="fx.css">
<link rel="stylesheet" href="fxs28-tokens.css">
<link rel="stylesheet" href="fxs28-marks.css">
<script src="fxs28-tk.js"></script>
<script src="fxs28.js"></script>
<script src="../engine/ivory.js"></script>
<script src="../engine/ohlib.js"></script>
<script src="../engine/factrepeat.js"></script>

<!--
  fxs-28 socials: Open House, Just Listed and Just Sold in every size, plus the carousel slides. One page; it draws by FXP.kind(D) and D.piece.shape.
  The flyer's pieces carry through, doing the same job: the address set vertically up the left edge (Bodoni) with a short gold rule; the whole house
  in one large hero with the round neighborhood seal in its corner; the event (or the status) between two hairlines in Cormorant over caps; the
  REALTOR(R) perks on a white notes card; the agent in Cormorant with the one logo; square corners everywhere. No new copy.
  Too much for a size: the notes go first, then what's served (the caption carries them).
-->
<style>
  .abs{position:absolute}
  .wu{font:300 var(--sw,13pt)/1.4 'Montserrat'}
</style>
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
FXS.hookCheck();
FXP.start(['300 20pt "Montserrat"', '400 20pt "Montserrat"', '500 20pt "Montserrat"', '600 20pt "Montserrat"', '700 20pt "Montserrat"', '500 20pt "Oswald"', '600 20pt "Oswald"', '700 20pt "Oswald"'], D => {
  const esc = Ivory.esc, L = D.listing, C = D.companion || {}, A = D.agent || {};
  const kind = FXP.kind(D), shape = D.piece.shape, {W, H} = FXP.size(D), F = FXP.floor(shape); F.ev = F.event;
  const E = OHL.event(D), hero = OHL.hero(D, 'straight');
  if(E.time) E.time = E.time.replace(/(\d)\s+(am|pm)\b/gi, '$1 $2');
  const INK = TK.ink, SOFT = TK.text, MONT = "font-family:'Montserrat'";
  const back = [], mid = [], front = [], tiny = [];
  const rect = (x, y, w, h, css) => `<div class="abs" aria-hidden="true" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${h}pt;${css || ''}"></div>`;
  const pic = (id, x, y, w, h, css) => OHL.photo(D, id, `left:${x}pt;top:${y}pt;width:${w}pt;height:${h}pt;${css || ''}`);
  const archCss = () => '';
  const wdt = (t, css, rich) => { const m = document.createElement('span'); m.style.cssText = `position:absolute;left:-9999pt;visibility:hidden;white-space:nowrap;${css}`; if(rich) m.innerHTML = t; else m.textContent = t; document.body.appendChild(m); const w = m.getBoundingClientRect().width*.75; m.remove(); return w; };
  // text that fits: the biggest size from max to min at which it runs in <= lines lines in width w. o.rich: html for the body
  const T = o => { const r = T0(o); return o.parts && r.n >= 99 ? T0(Object.assign({}, o, {parts: null, lines: Math.max(o.lines || 1, 3)})) : r; };
  const T0 = o => {
    if(o.slot === 'place') return {html: '', h: 0, s: 0, n: 0, w: 0, ok: true};
    const lines = o.lines || 1, lhk = o.lh || 1.15, txt = o.parts ? o.parts.join(' ') : o.text;
    const css = s => `${MONT};${o.css};font-size:${s}pt;line-height:${(s*lhk).toFixed(2)}pt`;
    const cnt = s => o.rich ? (wdt(o.rich, css(s), true) <= o.w + .3 ? 1 : 99) : o.parts ? (o.parts.every(p => FXP.width(p, css(s)) <= o.w + .3) ? o.parts.length : 99) : FXP.lines(txt, css(s), o.w);
    let s = o.max, n = cnt(s);
    while(n > lines && s > o.min){ s -= .5; n = cnt(s); }
    if(s < o.min) s = o.min;
    n = cnt(s);
    const nn = Math.min(n, 99), h = Math.ceil(nn*s*lhk*100)/100 + 1.4 + (nn > 1 ? 2.5 : 0) + (/Oswald/.test(o.css) ? s*.1 : 0);
    const wid = nn === 1 ? (o.rich ? wdt(o.rich, css(s), true) : FXP.width(txt, css(s))) : o.w;
    const body = o.rich || (o.parts ? o.parts.map(esc).join('<br>') : esc(txt));
    const html = `<div class="abs" style="left:${o.x}pt;top:${o.y}pt;width:${o.w}pt;height:${h}pt;${css(s)};text-align:${o.align || 'left'};white-space:${nn === 1 ? 'nowrap' : 'normal'};overflow:hidden"${o.small ? ' data-small="1"' : ''} data-slot="${o.slot}" data-lines="${nn}">${body}</div>`;
    return {html, h, s, n: nn, w: wid, ok: n <= lines};
  };
  const capsO = (tr) => `font-family:Oswald;font-weight:600;letter-spacing:${tr}pt;text-transform:uppercase;color:${TK.accent}`;
  const caps = (wt, tr, col) => `font-weight:${wt};letter-spacing:${tr}pt;text-transform:uppercase;color:${col}`;

  // ---------- px helpers: the page is drawn in pt at K = 0.375 pt per image pixel; sizes below are image pixels ----------
  const K = FXP.K, p = v => v*K, WP = D.piece.px[0], HP = D.piece.px[1], SC = WP/1080;
  const MG = Math.round(54*SC);
  const SPX = Math.round((shape === 'wide' || shape === 'gbp' ? HP : WP)*(shape === 'wide' || shape === 'gbp' ? .17 : .166)), LX = SPX + Math.round(36*SC), RX = Math.round(48*SC), CWD = WP - LX - RX, TOPY = Math.round(40*SC);
  const tp = o => T(Object.assign({}, o, {x: p(o.x), y: p(o.y), w: p(o.w), max: p(o.max), min: o.minPx != null ? p(o.minPx) : (o.min == null ? F.body : o.min)}));
  const LN = 'font-variant-numeric:lining-nums;';
  const GOLD = 'var(--fx-accent)';
  const goldRule = (x, y, w, h) => rect(p(x), p(y), p(w), p(h || 4), 'background:var(--fx-rule-hard)');
  const hair = (x, y, w) => rect(p(x), p(y), p(w), .75, 'background:var(--fx-rule)');
  const RAW = (SW.data().listing || {});
  const addrT = String(RAW.address || L.address);
  const placeT = `${FXS.hood(L) ? FXS.hood(L) + ' · ' : ''}${RAW.city || L.city}, ${/^texas$/i.test(RAW.state || L.state) ? 'TX' : (RAW.state || L.state)} ${RAW.zip || L.zip || ''}`.trim().toUpperCase();
  const hsOn = OHL.cardMode(D) === 'headshot' && !!A.headshot;
  // a tracked caps line that is plain text (small print for the floor checks)
  const capsLn = (slot, text, x, y, w, px, tr, col, align) => { const pt = Math.max(p(px), F.small*1.1), h = pt*1.35;
    return {h: h/K, html: `<div class="abs" style="left:${p(x)}pt;top:${p(y)}pt;width:${p(w)}pt;height:${h}pt;font:500 ${pt}pt/${h}pt Montserrat;letter-spacing:${tr}pt;text-transform:uppercase;color:${col};white-space:nowrap;overflow:hidden;text-align:${align || 'left'}" data-small="1" data-slot="${slot}" data-lines="1">${esc(text)}</div>`}; };

  // ---------- the hero: one box per shape, the same on every piece of that shape ----------
  // the whole house inside the centered crop, with a margin (the print check cuts at the box's own edge)
  // the print check's own reading of the frame (OHL.houseInFrame: cover, focusX, pinned to the top) must hold the house too
  const heroFit = (w, h) => { const hb = OHL.houseInFrame(D, hero, w, h); if(hb && (hb.left < .008 || hb.right > .992 || hb.top < 0 || hb.bottom > .992)) return false; return heroFit0(w, h); };
  const heroFit0 = (w, h) => { const ph0 = (D.photos || {})[hero] || {}; if(!ph0.box || !ph0.w || !ph0.h) return true; const ia = ph0.w/ph0.h, ta = w/h, [x0, y0, x1, y1] = ph0.box, mg = .02;
    // the square Just Sold post keeps a small margin under the house (the house-cut check cuts at the box edge; 2-story was cut at the bottom)
    const bm = ((shape === 'square' && kind === 'js') || shape === 'post') ? .02 : 0;   /* the post's shorter hero (room strip, 11/8) keeps the same margin */
    if(ta >= ia){ const v = ia/ta, lo = (1 - v)/2; if(bm) return y0 >= lo && y1 <= v - .01 && v >= (y1 - y0) + .03;   // square JS: the house fits both a centered crop and the check's top-pinned one
      return y0 >= lo + mg*0 && y1 <= 1 - lo && v >= (y1 - y0) + .03; }
    const v = ta/ia, lo = (1 - v)/2, sm = shape === 'post' || shape === 'story' || shape === 'pin' || shape === 'slide' ? 0 : .015; return x0 >= lo + sm && x1 <= 1 - lo - sm && v >= (x1 - x0) + .03; };   /* side pieces: a small margin at the sides too (1-story ranch was cut at the right) */
  let HERO_H;   // full-width pieces: the shortest frame that holds the whole house, never under 54% of the width
  { let h0 = Math.round(CWD*(shape === 'square' ? (kind === 'js' ? .52 : .6) : shape === 'post' ? .5 : .66));   /* the post keeps room for its room strip (owner review 11/8) */ const lim = Math.round(CWD*.85); let h = h0; while(h < lim && !heroFit(CWD, h)) h += 4; HERO_H = h; }
  const heroBlock = (x, y, w, h) => pic(hero, p(x), p(y), p(w), p(h));
  let HERO_W = 0;   // side pieces: the narrowest column that holds the whole house
  

  // ---------- the blocks: each returns {h, html} at (x, y, w) in px ----------
  // the Just Listed / Just Sold lockup: one size on every format (124 px at 1080, scaled with the width), never shrunk; the photo or the facts give way instead
  const LOCK_PX = (shape === 'wide' || shape === 'gbp') ? Math.min(124*SC, Math.floor(WP*.36/5.4)) : 124*SC, LOCK_WORD = kind === 'js' ? 'Just Sold' : 'Just Listed', LOCK_W = FXP.width(LOCK_WORD, `font-family:Oswald;font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:${p(LOCK_PX)}pt`)/K + 12*SC;
  let lockPt = 0;
  const bStatus = (x, y, w, k) => { const pt = p(LOCK_PX); lockPt = pt;
    return {h: LOCK_PX*1.18, html: `<div class="abs script" style="left:${p(x)}pt;top:${p(y)}pt;width:${p(Math.max(w, LOCK_W))}pt;height:${pt*1.18}pt;font-size:${pt}pt;line-height:${pt*1.18}pt;letter-spacing:.04em;overflow:visible" data-slot="moment" data-lines="1">${LOCK_WORD}</div>`}; };
  const bAddr = (x, y, w, k, maxPx, noPlace) => { const r = tp({slot: 'address', text: addrT, css: "font-family:Oswald;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--fx-ink)", x, y, w, max: (maxPx || 100)*SC*k, min: F.ev, lh: 1.1});
    if(noPlace) return {h: r.h/K, html: r.html};   // posts and stories: the spine and the headline already carry the address; no place line under it (owner review 11/8)
    const pl = capsLn('place', placeT, x + 2, y + r.h/K + 4, w, 30*SC*Math.max(k, .9), 1.6, GOLD);
    return {h: r.h/K + 4 + pl.h, html: r.html + pl.html}; };
  const bStats = (x, y, w, k, n) => { const h = Math.round(150*SC*k), lw0 = l => FXP.width(FXS.statParts(l).l.toUpperCase(), 'font:500 10pt Montserrat;letter-spacing:.2pt')/10;
    // four tiles (with the year built) only when every label clears its tile at the phone floor; else three
    const fits = m => { const it = FXS.statItems(L).slice(0, m), tl = (p(w) - p(16*SC)*(m - 1))/m; return it.every(t => tl*.8/lw0(t) >= F.small); };
    const items = FXS.statItems(L).slice(0, (n || 3) > 3 && !fits(n) ? 3 : (n || 3)).map(t => t.replace(/Square Feet/, 'Sq Ft'));
    // each label clears its tile's sides (owner rule: text never touches a shape): at most 80% of the tile's width
    const tr = items.length > 3 ? .2 : .4, tile = (p(w) - p(16*SC)*(items.length - 1))/items.length, lw = l => FXP.width(FXS.statParts(l).l.toUpperCase(), `font:500 10pt Montserrat;letter-spacing:${tr}pt`)/10;
    const lp = Math.max(F.small, Math.min(p(24*SC*k), ...items.map(t => tile*.8/lw(t))));
    return {h, html: FXS.statsRow(items, p(x), p(y), p(w), p(h), 'fact', {np: Math.max(16, p(70*SC*k)), lp, track: tr, gap: p(16*SC)})}; };
  const bAgent = (x, y, w, k, o) => { o = o || {};
    const ns = (o.name || 58)*SC*k, ps = (o.phone || 40)*SC*k, hsz = hsOn && !o.nohs ? Math.min(Math.round(ns*2.7), Math.round(w*.26)) : 0, logoW = o.logoW || Math.min(w*.34, 330*SC), lx = x + w - logoW;
    const tx = x + (hsz ? hsz + 16 : 0), tw = lx - 28 - tx;
    const nm = tp({slot: 'agent.name', text: A.name || '', css: "font-family:Montserrat;font-weight:700;letter-spacing:0;color:var(--fx-ink)", x: tx, y, w: tw, max: ns, min: F.body, lh: 1.08});
    let yy = y + nm.h/K; const out = [nm.html];
    if(!o.nodesig && (A.nar || /realtor/i.test(A.designation || ''))){ const d = capsLn('agent.desig', 'REALTOR®', tx + 1, yy + 2, tw, 24*SC, 3.2, GOLD); out.push(d.html); yy += d.h + 4; }
    const ph = tp({slot: 'agent.phone', text: A.phone || '', css: "font-family:Montserrat;font-weight:600;letter-spacing:.5pt;color:var(--fx-ink)", x: tx, y: yy + 2, w: tw, max: ps, min: F.body, lh: 1.15}); out.push(ph.html); yy += 2 + ph.h/K;
    const h = Math.max(yy - y, hsz);
    if(hsz) out.unshift(`<div class="abs" style="left:${p(x)}pt;top:${p(y)}pt;width:${p(hsz)}pt;height:${p(h)}pt;overflow:hidden"><img src="${esc(A.headshot)}" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></div>`);
    out.push(rect(p(lx - 14), p(y + 4), .75, p(h - 8), 'background:var(--fx-rule)'));
    const lgH = Math.min(h, o.logoH || 110*SC);
    out.push(OHL.logo(D, 'light', `left:${p(lx)}pt;top:${p(y + (h - lgH)/2)}pt;width:${p(logoW)}pt;height:${p(lgH)}pt;justify-content:${o.logoW ? 'flex-end' : 'center'}`));
    return {h, html: out.join('')}; };
  // the event: the gold label on one line, the day over the date's left edge, the date large, the time at 60% of it (beside it when both fit, else under)
  const bEvent = (x, y, w, k, o) => { o = o || {}; const out = []; let yy = y;
    const lab = tp({slot: 'oh.label', text: E.label.toUpperCase(), css: capsO(3.2*Math.max(k, .8)) + ';text-decoration:underline;text-decoration-thickness:.75pt;text-underline-offset:6pt', x, y: yy, w, max: 50*SC*k, min: F.ev, lh: 1.15});
    out.push(lab.html); yy += lab.h/K + 12*SC;
    const wk = capsLn('oh.weekday', E.weekday, x + 1, yy, w, 36*SC*k, 4.2, GOLD); out.push(wk.html); yy += wk.h + 2;
    const md = String(E.monthDay || E.long), dmax = 128*SC*k;
    let dt = tp({slot: 'oh.date', text: md, css: `font-family:Oswald;font-weight:700;letter-spacing:0;color:var(--fx-ink);${LN}`, x: x - 2, y: yy, w: w + 2, max: dmax, min: p(60*SC), lh: 1.02});
    const tcss = s => `font-family:Oswald;font-weight:700;color:var(--fx-ink);${LN}`;
    let tm = null, inline = false;
    if(E.time){ const ts = Math.max(dt.s*.6, F.ev); const tw0 = FXP.width(E.time, `${tcss()};font-size:${ts}pt`);
      if(dt.w + tw0 + p(34*SC) <= p(w)){ inline = true; dt = tp({slot: 'oh.date', text: md, css: `font-family:Oswald;font-weight:700;letter-spacing:0;color:var(--fx-ink);${LN}`, x: x - 2, y: yy, w: (dt.w + 6)/K, max: dmax, min: p(60*SC), lh: 1.02}); dt.s = Math.min(dt.s, dmax*K);
        tm = T({slot: 'oh.time', text: E.time, css: tcss() + ';letter-spacing:0;text-align:right', x: p(x + w) - tw0 - 6, y: p(yy) + (dt.h - ts*1.05)*.62, w: tw0 + 6, max: ts, min: ts, lh: 1.05}); }
      else tm = null; }
    out.push(dt.html); yy += dt.h/K;
    if(E.time){ if(inline) out.push(tm.html); else { const t2 = tp({slot: 'oh.time', text: E.time, css: tcss() + ';letter-spacing:0', x, y: yy + 4, w, max: Math.max(dt.s*.6, F.ev)/K, minPx: Math.max(dt.s*.6, F.ev)/K, lh: 1.05}); out.push(t2.html); yy += 4 + t2.h/K; } }
    const items = [[E.refreshments, 'oh.refreshments', 700], [E.note, 'oh.note', 600]].filter(i => i[0]);
    if(items.length){ yy += 20*SC;
      const bf = Math.max(F.body*1.1, 44*SC*k*K), py = 16*SC, rows = []; let by = yy + py;
      items.forEach(([tx, slot, wt]) => { const r = tp({slot, text: tx, css: `font-family:Montserrat;font-weight:${wt};color:var(--fx-on-spine)`, x: x + 24*SC, y: by, w: w - 48*SC, max: bf/K, min: F.body, lines: 1, lh: 1.12}); rows.push(r.html); by += r.h/K + 6*SC; });
      by -= 6*SC; out.push(`<div class="card" data-box="oh.box" style="left:${p(x)}pt;top:${p(yy)}pt;width:${p(w)}pt;height:${p(by - yy + py)}pt"></div>`, ...rows); yy = by + py; }
    return {h: yy - y, html: out.join('')}; };
  const bJsLine = (x, y, w, k, hm) => { const sl = FXP.soldLine(D); hm = hm || 1;
    const l1 = tp({slot: 'sold.head', text: sl.head, css: "font-family:Oswald;font-weight:700;color:var(--fx-ink)", x, y, w, max: 54*SC*k*hm, min: F.body, lines: 1, lh: 1.1});
    let yy = y + l1.h/K, o = l1.html; if(sl.line){ const l2 = tp({slot: 'sold.line', text: sl.line, css: `font-family:Montserrat;font-weight:500;color:${SOFT}`, x, y: yy + 4, w, max: 40*SC*k, min: F.body, lines: 2, lh: 1.15}); o += l2.html; yy += 4 + l2.h/K; }
    return {h: yy - y + (hm > 1 ? 28*SC : 0), html: o}; };
  // three different rooms side by side (story bottom strip, square)
  const roomsAll = () => OHL.photos(D).filter(id => id !== hero && !Ivory.fullHouse(D, id)).sort((a, b) => FXS.archScore(D, b) - FXS.archScore(D, a)).filter((id, i, arr) => arr.findIndex(o => FXP.fam(o) === FXP.fam(id) || o.replace(/\d+[a-z]?$/, '') === id.replace(/\d+[a-z]?$/, '')) === i);
  const bStrip = (x, y, w, h) => { const rs = roomsAll().slice(0, 3), g = 10*SC, pw = (w - g*(rs.length - 1))/rs.length; return {h, html: rs.map((id, i) => pic(id, p(x + i*(pw + g)), p(y), p(pw), p(h))).join('')}; };

  // ---------- the stack: blocks in order, spaced evenly in what the hero leaves; the content shrinks (k) until it fits ----------
  const SQJS = shape === 'square' && kind === 'js';
  const stack = (x, y0, w, avail, make, ks, strict, bias, gfn) => {
    for(const k of ks){ const bl = make(k); const sum = bl.reduce((t, b) => t + b.h, 0), n = bl.length - 1, gap = n ? (avail - sum)/n : 0;
      if(gap >= (SQJS ? 34 : 26)*SC || (!strict && k === ks[ks.length - 1])){ const g = gfn ? Math.max(0, Math.min(gap, gfn(avail, sum, n))) : Math.min(gap, 80*SC); let y = y0 + Math.max(0, (avail - sum - g*n)*(bias == null ? .5 : bias)); const out = [];
        bl.forEach(b => { out.push(b.mk ? b.mk(y).html : b.html.replace(/%Y%/g, y)); y += b.h + g; }); return out.join(''); } } return null; };
  const KS = [1, .94, .88, .82, .76, .7, .64, .58, .52, .46];

  // =========================== full-width pieces (post, story, pin, square): hero on top ===========================
  // the story footer (owner review 11/8): the agent on its own row under a rule, the name and phone about twice the post's size;
  // the headshot at the left, the name across the row, REALTOR(R) and the phone under it with the logo at the right
  const bFootStory = (x, y, w) => { const out = [];
    const hsz0 = hsOn ? Math.round(190*SC) : 0, tx = x + (hsz0 ? hsz0 + 22*SC : 0), tw = x + w - tx;
    const nm = tp({slot: 'agent.name', text: A.name || '', css: "font-family:Montserrat;font-weight:700;letter-spacing:0;color:var(--fx-ink)", x: tx, y, w: tw, max: (kind === 'js' ? 76 : 92)*SC, min: F.body, lines: 1, lh: 1.05}); out.push(nm.html);   /* Just Sold stays bigger than the agent */
    let yy = y + nm.h/K + 4*SC; const y2 = yy, logoW = Math.round(Math.min(tw*.36, 230*SC));
    if(A.nar || /realtor/i.test(A.designation || '')){ const d = capsLn('agent.desig', 'REALTOR®', tx + 1, yy, tw - logoW - 20*SC, 26*SC, 3.2, GOLD); out.push(d.html); yy += d.h + 2*SC; }
    const ph = tp({slot: 'agent.phone', text: A.phone || '', css: "font-family:Montserrat;font-weight:600;letter-spacing:.5pt;color:var(--fx-ink)", x: tx, y: yy, w: tw - logoW - 24*SC, max: 62*SC, min: F.body, lines: 1, lh: 1.1}); out.push(ph.html); yy += ph.h/K;
    const h = Math.max(yy - y, hsz0), lgH = Math.min(yy - y2, 130*SC);
    if(hsz0) out.unshift(`<div class="abs" style="left:${p(x)}pt;top:${p(y)}pt;width:${p(hsz0)}pt;height:${p(h)}pt;overflow:hidden"><img src="${esc(A.headshot)}" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></div>`);
    out.push(OHL.logo(D, 'light', `left:${p(x + w - logoW)}pt;top:${p(y2 + (yy - y2 - lgH)/2)}pt;width:${p(logoW)}pt;height:${p(lgH)}pt;justify-content:flex-end`));
    return {h, html: out.join('')}; };

    const cp = q('[data-slot="caption"]'); if(cp){ const want = p(50*SC), got = parseFloat(getComputedStyle(cp).fontSize)*.75; if(Math.abs(got - want) > .3) tiny.push({slot: 'caption', kind: 'caption-size', detail: `${got.toFixed(1)} pt is not the carousel's one caption size (${want.toFixed(1)} pt)`}); }
    // the two small photos on a wide or GBP post show two different rooms
    const wr = [...document.querySelectorAll('[data-wide-room]')].map(e => e.dataset.wideRoom); if(wr.length === 2 && FXP.roomGroup(wr[0]) === FXP.roomGroup(wr[1])) tiny.push({slot: 'wide.rooms', kind: 'wide-same-room', detail: `${wr[0]} and ${wr[1]} are the same room`});
  };
  return {W, H, issues: tiny, after, html: `<div class="page" data-page="${esc(D.piece.id)}" style="position:relative;overflow:hidden;width:${W}pt;height:${H}pt;background:var(--fx-paper)">${back.join('')}${front.join('')}${mid.join('')}</div>`};
});
</script>
</body>
</html>
