<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>evening-panel social set</title>
<link rel="stylesheet" href="ep-tokens.css">
<script src="../engine/baths.js"></script>
<script src="../engine/ivory.js"></script>
<script src="../engine/ohlib.js"></script>
<script src="../engine/ohemail.js"></script>
<script src="../engine/carousel.js"></script>
<script src="../engine/factrepeat.js"></script>
<script src="../engine/socialset.js"></script>
<script src="ep-social.js"></script>
<!-- Evening Panel's Just Listed and Just Sold social sets (owner 11/18/2026: follow-on pieces match the set's main pieces). The shared
     engine (templates/_shared/socialset.js) loads the fonts and the data and runs the checks; the layouts are Evening Panel's own
     (ep-social.js): the brand's dark panel beside edge-to-edge photos, the two-tone DM Serif status over the short accent rule, the pin
     and street, the dash highlights, the paper strip with the icon facts, the note in the accent outlined box. The colors come from
     the agent's brand kit exactly as the set's print pieces read them (EP.colors / EP.brand in ep.js). -->
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
SocialSet.portrait = EPSocial.portrait; SocialSet.landscape = EPSocial.landscape; SocialSet.slide = EPSocial.slide;
SocialSet.start(D => {
  const b = D.brand || {}, c = b.colors || {}, r = document.documentElement.style;
  const rgb = h => { h = String(h||'').replace('#',''); if(h.length===3) h = h.split('').map(x=>x+x).join(''); const n = parseInt(h,16); return [n>>16&255, n>>8&255, n&255]; };
  const lum = h => { const v = rgb(h).map(q => { q/=255; return q <= .03928 ? q/12.92 : Math.pow((q+.055)/1.055, 2.4); }); return .2126*v[0] + .7152*v[1] + .0722*v[2]; };
  const con = (a, x) => { const p = lum(a), q = lum(x); return (Math.max(p,q)+.05)/(Math.min(p,q)+.05); };
  const on = bg => con(bg, '#ffffff') >= con(bg, '#161616') ? '#ffffff' : '#161616';
  const readable = (fg, bg, min) => con(fg, bg) >= (min || 3) ? fg : on(bg);
  const mix = (a, x, t) => { const p = rgb(a), q = rgb(x); return '#' + p.map((v, i) => Math.round(v + (q[i] - v)*t).toString(16).padStart(2, '0')).join(''); };
  // as EP.colors / EP.brand: the kit's dark is the panel, the accent the second word, the rule, the pin and the box; the kit's paper the strip
  const main = c.main || b.accent || '#2f4a3a', dark = c.dark || b.ink || '#1c1c1c', accent = c.accent || b.accent2 || main, o = on(dark);
  const paper = b.paper || mix(main, '#ffffff', .93), pon = on(paper);
  r.setProperty('--ep-dark', dark); r.setProperty('--ep-main', main); r.setProperty('--ep-on', o); r.setProperty('--ep-accent', readable(accent, dark));
  r.setProperty('--ep-soft', mix(o, dark, .16)); r.setProperty('--ep-lift', mix(dark, o, .07)); r.setProperty('--ep-rule', o === '#ffffff' ? 'rgba(255,255,255,.42)' : 'rgba(0,0,0,.4)');
  r.setProperty('--ep-paper', paper); r.setProperty('--ep-paper-ink', pon === '#ffffff' ? '#ffffff' : '#1b1d22'); r.setProperty('--ep-paper-text', pon === '#ffffff' ? '#eeeeee' : '#3b3f47');
  r.setProperty('--ep-paper-main', readable(main, paper));
});
</script>
</body>
</html>
