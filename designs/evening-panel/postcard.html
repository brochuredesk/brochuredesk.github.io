<html lang="en">

<meta charset="utf-8">

<link rel="stylesheet" href="ep.css">
<link rel="stylesheet" href="ep-fo.css">
<script src="ep.js"></script>
<script src="../engine/baths.js"></script>
<script src="../engine/baths-text.js"></script>

<script src="../engine/factrepeat.js"></script>
<script>window.Ivory = window.Ivory || {esc: s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))};</script>
<script src="ep-fo.js"></script>
<!--
  BrochureDesk · Evening Panel · Just Listed and Just Sold postcards (the hand of the approved Open House library flyer B01).
  data.piece.card = "listed" | "sold", data.piece.size = "6x11" (trim 792 x 432 pt) | "6x9" (648 x 432 pt), data.piece.side = "front" | "back".
  Print adds 0.125 in (9 pt) bleed. The agent's brand color (brand.accent) is the field on both sides; boxes are white.
  Front: the whole house (roof to steps) on the right with a one-line-or-two caption and a white box under it, the status stacked large on the left over the address,
  the fact rows and the brokerage logo (Just Listed) or the agent's name and number and the logo (Just Sold). No price, no QR.
  Back: status line, interior photos with captions, a white box (the write-up, or the steps), the standard contact card (templates/_shared/agentcard.js,
  band preset, which carries the back's one logo), the fine print. The right 289.5 pt (4.02 in) is the mail vendor's: return address, postage and address
  zones; drawn as guides on proofs and left clear in print.
  Copy comes from data.sw.pc.{jl|js}.{front|back} as a lead plus whole sentences; tf.js picks the sentences that fill each box.
-->
<style>
  /* the FX14 hand on a postcard: white frame, a taupe block, Pinyon Script status, white underlined labels, hairline white boxes; tokens in ep-tokens.css */
  .pc-col{position:absolute;display:flex;flex-direction:column}
  .pc-wbox{background:transparent;border:.9pt solid var(--ep-accent);color:var(--ep-soft);padding:10pt 16pt 9pt;display:flex;flex-direction:column;overflow:hidden}
  
  .pc-wbox .k{font:700 8.6pt/11pt var(--ep-font);letter-spacing:2.6pt;text-transform:uppercase;color:var(--ep-accent);white-space:nowrap;overflow:hidden;margin-bottom:3pt;align-self:flex-start}
  .pc-wbox .p{font-family:var(--ep-font);font-weight:400;overflow:hidden;color:var(--ep-soft)}
  .pc-wbox .p b{font-weight:700;color:var(--fx-on)}
  .pc-bstatus{position:absolute;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
  .pc-bstatus .st{font:700 10.5pt/1 var(--fx-font);letter-spacing:2.4pt;color:var(--fx-on);text-transform:uppercase}
  .pc-bstatus .ln{flex:1;height:1.2pt;background:var(--ep-accent);margin:0 12pt;min-width:16pt}
  .pc-bstatus .ad{font:500 16pt/1 var(--ep-serif);color:var(--fx-on);padding-bottom:3pt}
  .pc-steps .it{display:flex;gap:8pt;align-items:baseline;white-space:nowrap;overflow:hidden}
  .pc-steps .bx{flex:none;min-width:16pt;font-family:var(--ep-serif);font-size:1.25em;line-height:inherit;color:var(--ep-accent);margin-top:0!important;border-right:1.4pt solid var(--ep-accent);padding-right:8pt;text-align:right}
  .pc-call{font:400 13pt/16pt var(--ep-serif);color:var(--ep-accent);white-space:nowrap;overflow:hidden}
  .pc-disc{position:absolute;font-size:6pt;line-height:10pt;color:var(--fx-soft);overflow:hidden;white-space:nowrap}
  .pc-ret{position:absolute;font:500 9pt/11pt var(--fx-font);letter-spacing:.2pt;color:var(--fx-on);overflow:hidden;height:34pt}
  .pc-ret b{font-weight:700;letter-spacing:1.4pt;text-transform:uppercase;color:var(--fx-ink)}
  .cap .a{font-weight:400}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const esc = SW.esc, b = D.brand || {}, A = D.agent || {}, L = D.listing, P = D.piece || {};
  document.body.dataset.mode = D.mode || 'email';
  await SW.setup(D);
  const sold = P.card === 'sold', big = P.size === '6x11', front = P.side === 'front';
  const W = big ? 792 : 648, H = 432;
  const K = ((D.sw || {}).pc || {})[sold ? 'js' : 'jl'] || {};
  const hsSrc = A.headshot && ((D.photos||{})[A.headshot] ? D.photos[A.headshot].src : A.headshot) || '';
  const statusWord = sold ? 'Just Sold' : 'Just Listed';
  const issues = [];
  const logo = (cls, src, area, maxh, style) => `<div class="logo ${cls}" data-area="${area}" data-maxh="${maxh}" style="${style||''}">${src ? `<img src="${esc(src)}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage||'')}</span>`}</div>`;
  const CL = big ? 13.5 : 12.5, CF = big ? 'font-size:10.9pt;line-height:13.5pt;' : '';   // the 6x11 sets its type up from the 6x9 (11 pt against 9.5), not the same size with more room
  const cap = (c, slot, lines, extra, min) => (c = (c.photo ? FXS.augment(D, c) : c), `<div class="cap" style="height:${5 + lines*CL}pt;${extra||''}"><div class="a" data-min="${min || 2}" data-slot="${slot}" data-narrow="0" data-nstep="6" data-lh="${CL}" data-lines="${lines}" data-lead="${esc(c.lead||'')}" data-s='${esc(JSON.stringify([].concat(c.s||[]))).replace(/'/g,'&#39;')}' style="height:${lines*CL}pt;${CF}"></div></div>`);
  let h = '';

  if(front){
    // The FX14 hand on a postcard front. A white frame top and side, the whole house in it, a taupe block around it with the status in Pinyon Script.
    // JL: "Just Listed" in script beside the house, the horizontal address, three facts; under the house the caption ("Front.", the draws) and the agent and logo along the foot.
    // JS: sells the agent: "Just Sold" in the same script lockup, the name and phone big on the left, the house on the right with the agent's own note, the logo.
    const F = K.front || {};
    const draws = list => { const w = x => /gated|roof|pergola|deck|park|garage|island|stone|corner|pool/i.test([].concat(x)[0]) ? 0 : 1; return (list || []).map((x, i) => [w(x), i, x]).sort((p, q) => p[0] - q[0] || p[1] - q[1]).map(t => t[2]); };
    const capC = sold ? {lead: '', s: (F.note || {}).s || (F.cap || {}).s} : (F.caption ? {lead: F.caption.lead, s: F.caption.s.concat(draws((F.about || {}).s || []))} : {lead: 'Front.', s: draws((F.about || {}).s || (F.cap || {}).s)});
    const norm = x => String(x).toLowerCase().replace(/[^a-z0-9 ]/g, '').slice(0, 40), allAlts = list => [].concat(...(list || []).map(x => [].concat(x)));
    const backSet = new Set([].concat(allAlts(((K.back || {}).about || {}).s), ...((K.back || {}).photos || []).map(c => allAlts(c.s)), allAlts((K.back || {}).steps6), allAlts((K.back || {}).steps)).map(norm));
    const backAll = allAlts(((K.back || {}).about || {}).s).map(String);   // the back's About box
    if(capC.s){ const kept = capC.s.filter(x => ![].concat(x).some(a => backSet.has(norm(a)))); if(kept.length >= 2) capC.s = kept; }
    // the caption's own first sentence stays; a later one that says a fact the back's About box says (the deck and pergola, in other words) drops out
    if(capC.s && capC.s.length > 2){ const tail = capC.s.slice(1).filter(x => ![].concat(x).some(a => backAll.some(b => SW.sameFact(String(a), b)))); if(tail.length >= 1) capC.s = [capC.s[0]].concat(tail); }
    const roomIds = [...new Set([].concat(((D.sw||{}).back||{}).photos||[], ((D.sw||{}).left||{}).photos||[]).map(c => c.photo))].filter(id => (D.photos||{})[id] && !(D.photos[id]||{}).fullHouse && id !== F.cap.photo).slice(0, 2);
    // ---- Evening Panel front: B16 on a card. The brand's dark panel carries the status as the two-tone DM Serif headline ("Just" white,
    // "Listed"/"Sold" in the accent) over the short accent rule; the whole house runs edge to edge beside it; B16's light paper band closes
    // the card with the agent, the facts (Just Listed only) and the one logo. Just Sold: the house on the left, the panel on the right with the
    // street right under the status, the seller question, the agent's own note in the accent outlined box. No price, no QR. ----
    const k = big ? 1.12 : 1, pid = F.cap.photo, M = 30, BH = Math.round(78*k);
    const SER = "font-family:'DM Serif Display'";
    if(sold){
      // ---- Just Sold front (design pass 11/15, its own composition): B16's dark field as one L. Across the top, "Just Sold" as one oversized two-tone
      // line with the street and the city right under it; down the left, the seller question, the agent's two-line note in the accent outlined box and
      // the agent, quiet, with the one logo; the whole house fills the rest edge to edge to the bleed. No features. ----
      let CWd = big ? 250 : 232; const TXs = M, hood = FXS.hood(L);
      let y = 0;
      const ss = FXS.fitSize('Just Sold', SER, W - 2*M - 8, 92, 48);   // the card's one oversized move: the status across the full width
      y = 24 - ss*0.3 + 0.27*ss;   // the letters' box clears the trim by 0.2 in (live type rule)
      h += `<div class="ep-hl" style="left:${TXs - 2}pt;top:${y}pt;width:${W - 2*M + 4}pt;height:${ss*1.3}pt;font-size:${ss}pt;line-height:${ss*1.3}pt" data-slot="front.status" data-lines="1">Just <span style="color:var(--ep-accent)">Sold</span></div>`;
      y += ss*1.1;
      const ad = String(L.address || ''), as = FXS.fitSize(ad, SER, 330*k, 22*k, 15), pl = FXS.placeLine(L).toUpperCase();
      h += EP.pin(TXs - 1, y + (as*1.15 - 15*k)/2, 15*k) + `<div class="abs" style="left:${TXs + 22*k}pt;top:${y}pt;width:${W - 2*M - 22*k}pt;height:${as*1.3}pt;white-space:nowrap;overflow:hidden" data-slot="front.address" data-lines="1"><span style="font-family:var(--ep-serif);font-weight:400;font-size:${as}pt;line-height:${as*1.15}pt;color:var(--ep-on)">${esc(ad)}</span><span class="fo-place" style="position:static;display:inline;margin-left:12pt;font-size:${8.6*k}pt" data-slot="front.city">${esc(pl)}</span></div>`;
      y += as*1.15 + 7*k;
      const TB = y; while(CWd < W*0.5 && !SW.fits(D, pid, W + 9 - CWd, H + 9 - TB)) CWd += 6;
      // the house: from the column's edge to the bleed, from the band to the bleed (the whole house always fits this frame: checked)
      h += `<div class="abs" style="left:${CWd}pt;top:${TB}pt;width:${W + 9 - CWd}pt;height:${H + 9 - TB}pt">${SW.photo(D, pid, 'position:absolute;inset:0', 'front.hero')}</div>`;
      // the column: the question, the note box, the agent and the logo at its foot
      const cw = CWd - TXs - 16; let cy = TB + 14*k;
      const cq = 'Thinking about selling?', cqs = FXS.fitSize(cq, SER, cw, 19*k, 12), cql = FO.wrapText(cq, `${SER};font-size:${cqs}pt`, cw);
      cql.forEach((ln, i) => { h += `<div class="ep-serif" style="left:${TXs}pt;top:${cy + i*cqs*1.12}pt;width:${cw}pt;height:${cqs*1.3}pt;font-size:${cqs}pt;line-height:${cqs*1.3}pt;color:var(--ep-accent)" data-slot="front.cta${i ? '.' + i : ''}" data-lines="1">${esc(ln)}</div>`; });
      cy += cql.length*cqs*1.12 + 12*k;
      const lh = 14*k, n = 3;
      h += `<div class="ep-obox" id="jsnote" style="left:${TXs}pt;top:${cy}pt;width:${cw}pt;height:${n*lh + 18}pt"></div>`;
      h += `<div class="abs cap"><div class="a" style="position:absolute;left:${TXs + 11}pt;top:${cy + 9}pt;width:${cw - 22}pt;height:${n*lh}pt;font-size:${10.4*k}pt;line-height:${lh}pt;color:var(--ep-on)" data-slot="front.note" data-lh="${lh}" data-lines="${n}" data-try="4,3" data-min="2" data-narrow="0" data-flexh="1" ${FXS.sd(capC.s || [])}></div></div>`;
      // the agent, quiet: name, phone, email and site; the logo under them
      const ns = Math.min(FXS.fitSize(A.name || '', SER, cw, 19*k, 13), ss/2.4), lgW = Math.min(cw, 128*k), lgH = 30*k, noteB = cy + 4*lh + 18 + 12, mailOk = A.email && H - 18 - lgH - 10 - 15*k - ns*1.25 - 16*k >= noteB, ay = H - 18 - lgH - 10 - (mailOk ? 15*k : 0) - ns*1.25 - 16*k;
      if(ay < noteB) issues.push({slot: 'agent.name', kind: 'overlap', detail: 'the agent block runs into the note box'});
      h += `<div class="abs" id="jsagent" style="left:${TXs}pt;top:${ay}pt;width:${cw}pt"><div style="font-family:var(--ep-serif);font-weight:400;font-size:${ns}pt;line-height:${ns*1.25}pt;color:var(--ep-on);white-space:nowrap" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</div><div style="font-family:var(--ep-font);font-weight:700;font-size:${11*k}pt;line-height:${16*k}pt;color:var(--ep-accent);white-space:nowrap;letter-spacing:.3pt" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</div>${[mailOk ? A.email : ''].filter(Boolean).map((m, i) => `<div style="font-family:var(--ep-font);font-weight:500;font-size:${9*k}pt;line-height:${15*k}pt;color:var(--ep-soft);white-space:nowrap;overflow:hidden" data-slot="agent.contact${i}" data-lines="1" data-fine="1">${esc(m)}</div>`).join('')}</div>`;
      h += `<div class="abs logo${(b.logoKnockout || b.logoOnDark) ? '' : ' w'}" data-area="${lgW*lgH}" data-maxh="${lgH}" style="left:${TXs}pt;top:${H - 18 - lgH}pt;width:${lgW}pt;height:${lgH}pt">${EP.logoSrc(D) ? `<img src="${esc(EP.logoSrc(D))}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage || '')}</span>`}</div>`;
      if(!SW.fits(D, pid, W + 9 - CWd, H + 9 - TB)) issues.push({slot: 'front.hero', kind: 'house-cropped', detail: 'the whole house does not fit the Just Sold frame'});
    } else {
    // the panel: as narrow as the status needs, wider only when the whole house needs a narrower photo
    const w1 = sold ? 'Sold' : 'Listed';
    let PW = big ? 300 : 248; while(PW < W*0.52 && !SW.fits(D, pid, W + 9 - PW, H - BH + 9)) PW += 6;
    const fitsSide = SW.fits(D, pid, W + 9 - PW, H - BH + 9);
    if(!fitsSide){ PW = big ? 300 : 248; }
    const PX = sold ? -9 : PW, PWd = W + 9 - PW;   // photo box x and width
    let PH = H - BH + 9, PY = -9; if(!fitsSide){ while(PH > 200 && !SW.fits(D, pid, PWd, PH)) PH -= 4; PY = -9 + (H - BH + 9 - PH)/2; }
    if(!fitsSide) h += `<div class="abs" style="left:${PX}pt;top:-9pt;width:${PWd}pt;height:${H - BH + 9}pt;background:var(--ep-lift)"></div>`;
    h += `<div class="abs" style="left:${PX}pt;top:${PY}pt;width:${PWd}pt;height:${PH}pt">${SW.photo(D, pid, 'position:absolute;inset:0', 'front.hero')}</div>`;
    const TX0 = sold ? W - PW + 22 : M, TW = PW - 22 - M;
    let y = M - 2; const hood = FXS.hood(L);
    if(hood) h += `<div class="ep-eyebrow" style="left:${TX0}pt;top:${y}pt;width:${TW}pt;font-size:${8.6*k}pt" data-slot="front.place" data-lines="1">${esc(hood.toUpperCase())}</div>`;
    y += 14*k;
    // the status as big as the column allows, leaving room under it for the street, the city and (Just Listed) two highlights or
    // (Just Sold) the seller question and three lines of the agent's note
    const adPre = String(L.address || ''), asPre = FXS.fitSize(adPre, SER, TW - 22*k, 22*k, 15), alPre = FO.wrapText(adPre, `${SER};font-size:${asPre}pt`, TW - 22*k + 2).length;
    const needBelow = 16*k + alPre*asPre*1.15 + 3 + 24*k + (sold ? FXS.fitSize('Thinking about selling?', SER, TW, 18*k, 12)*1.3 + 4 + 3*13*k + 18 + 6 : 2*19*k + 4), room = (H - BH - 14) - y;
    const ss = Math.max(34, Math.min(FXS.fitSize('Listed', SER, TW + 2, 64, 34), FXS.fitSize(w1, SER, TW + 2, 64, 34), (room - needBelow)/2.32)), slh = ss*1.0;
    h += `<div class="ep-hl" style="left:${TX0 - 2}pt;top:${y}pt;width:${TW + 4}pt;height:${ss*1.3}pt;font-size:${ss}pt;line-height:${ss*1.3}pt" data-slot="front.status" data-lines="1">Just</div>`;
    h += `<div class="ep-hl ac" style="left:${TX0 - 2}pt;top:${y + slh}pt;width:${TW + 4}pt;height:${ss*1.3}pt;font-size:${ss}pt;line-height:${ss*1.3}pt" data-slot="front.status.1" data-lines="1">${w1}</div>`;
    y += 2*slh + ss*0.32;
    h += `<div class="ep-rule" style="left:${TX0}pt;top:${y}pt;width:${56*k}pt"></div>`; y += 16*k;
    // the street with B16's pin, then the city line
    const ad = String(L.address || ''), as = FXS.fitSize(ad, SER, TW - 22*k, 22*k, 15), al = FO.wrapText(ad, `${SER};font-size:${as}pt`, TW - 22*k + 2).length;
    h += EP.pin(TX0 - 1, y + (as*1.15 - 15*k)/2, 15*k) + `<div class="abs" style="left:${TX0 + 22*k}pt;top:${y}pt;width:${TW - 22*k + 2}pt;height:${al*as*1.15 + 4}pt;font:400 ${as}pt/${as*1.15}pt var(--ep-serif);color:var(--ep-on)" data-slot="front.address" data-lines="${al}">${esc(ad)}</div>`;
    y += al*as*1.15 + 3;
    h += `<div class="abs fo-place" style="left:${TX0 + 22*k}pt;top:${y}pt;width:${TW - 22*k}pt;font-size:${8.6*k}pt" data-slot="front.city" data-lines="1">${esc(FXS.placeLine(L).toUpperCase())}</div>`; y += 24*k;
    const footY = H - BH - 14;
    if(!sold){
      // two or three highlights, the dated improvements first, left aligned with B16's accent dash
      const tg0 = (F.highlights || []).concat(FXS.tagFacts(D).tags).filter(t => FXS.width(t, `font-family:Manrope;font-weight:600;font-size:${10.5*k}pt`) < TW - 18).filter((t, i, arr) => !arr.slice(0, i).some(u => SW.sameFact(t, u)));
      const rank = t => (F.highlights || []).includes(t) ? -1 : /\b(19|20)\d\d\b/.test(t) ? 0 : /^new\b|replaced|updated|remodel|renovat|added\b/i.test(t) ? 1 : 2, tg = tg0.map((t, i) => [rank(t), i, t]).sort((p, q) => p[0] - q[0] || p[1] - q[1]).map(x => x[2]), rh = 19*k, nT = Math.max(0, Math.min(3, tg.length, Math.floor((footY - y)/rh)));
      const ty = y + Math.max(0, (footY - y - nT*rh)/2);
      tg.slice(0, nT).forEach((t, i) => { h += `<div class="abs" style="left:${TX0}pt;top:${ty + i*rh}pt;width:${TW}pt;height:${rh}pt;display:flex;align-items:center;gap:${8*k}pt;white-space:nowrap;overflow:hidden"><span style="width:${9*k}pt;height:1.4pt;background:var(--ep-accent);flex:none"></span><span style="font:600 ${10.5*k}pt/${rh}pt var(--ep-font);color:var(--ep-on)" data-slot="front.hl.${i}" data-lines="1">${esc(t)}</span></div>`; });
    } else {
      // the seller question, then the agent's own note in B16's accent outlined box, sized to its text
      const cq = 'Thinking about selling?', cs2 = FXS.fitSize(cq, SER, TW, 18*k, 12);
      h += `<div class="ep-serif" style="left:${TX0}pt;top:${y - 4}pt;width:${TW}pt;height:${cs2*1.3}pt;font-size:${cs2}pt;line-height:${cs2*1.3}pt;color:var(--ep-accent)" data-slot="front.cta" data-lines="1">${cq}</div>`; y += cs2*1.3 + 4;
      const bh = footY - y, lh = 13*k, n = Math.max(3, Math.min(5, Math.floor((bh - 18)/lh)));
      if(y + n*lh + 18 > H - BH - 4) issues.push({slot: 'front.note', kind: 'overflow', detail: 'the note box runs into the band'});
      h += `<div class="ep-obox" id="jsnote" style="left:${TX0}pt;top:${y}pt;width:${TW}pt;height:${n*lh + 18}pt"></div>`;
      h += `<div class="abs cap"><div class="a" style="position:absolute;left:${TX0 + 11}pt;top:${y + 9}pt;width:${TW - 22}pt;height:${n*lh}pt;font-size:${9.6*k}pt;line-height:${lh}pt;color:var(--ep-on)" data-slot="front.note" data-lh="${lh}" data-lines="${n}" data-min="3" data-narrow="0" data-flexh="1" ${FXS.sd(capC.s || [])}></div></div>`;
    }
    // B16's light band across the foot: the agent (name and phone), the facts with line icons (Just Listed), the one logo in color
    h += `<div class="ep-band" data-cbox="agent.name,agent.phone" style="left:-9pt;top:${H - BH}pt;width:${W + 18}pt;height:${BH + 9}pt"></div>`;
    const by = H - BH, cy = by + (BH - 9)/2, ns = FXS.fitSize(A.name || '', SER, 190*k, (sold ? 19 : 21)*k, 14), lgW = 128*k, lgH = 40*k;
    let bnd = `<div class="abs" style="left:${M}pt;top:${cy - (ns*1.15 + 15*k)/2}pt;width:${200*k}pt"><div style="font:400 ${ns}pt/${ns*1.15}pt var(--ep-serif);color:var(--ep-paper-ink);white-space:nowrap" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</div><div style="font:700 ${11*k}pt/${15*k}pt var(--ep-font);color:var(--ep-paper-main);white-space:nowrap;letter-spacing:.3pt" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</div></div>`;
