<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · Clear Collage postcards</title>
<link rel="stylesheet" href="cc.css">
<link rel="stylesheet" href="cc-fo.css">
<script src="cc.js"></script>
<script src="../engine/baths.js"></script>
<script src="../engine/agentcard.js"></script>
<script src="../engine/factrepeat.js"></script>
<script>window.Ivory = window.Ivory || {esc: s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))};</script>
<script src="cc-fo.js"></script>
<script src="cc-pages.js"></script>
<!--
  BrochureDesk · Clear Collage · Just Listed and Just Sold postcards, in the hand of the approved Open House library flyer P13 Clear Collage
  (templates/oh-library/p13-clear-collage.html) and its sign-in sheet: the kit's paper, photos as prints in white mats, the main-color band
  with the one giant word, Outfit throughout, facts centered with short rules, the brokerage logo where the flyer puts it.
  data.piece.card = "listed" | "sold", data.piece.size = "6x11" (trim 792 x 432 pt) | "6x9" (648 x 432 pt), data.piece.side = "front" | "back".
  FRONTS. Just Listed: the house print, the logo top right over the house's real story (short rules between), the agent; the band across
  the foot with JUST LISTED in giant caps | the street and the place. Just Sold, its own card: the band across the head with JUST SOLD and
  the street; the house print laid over the band's edge; the seller question, the note on the white mat, who to call and the logo.
  BACKS (the owner 11/16: the design runs through the whole card): the band runs across the head, down the mail side and across the foot;
  the postage box, the address block and the barcode strip are small white markups set into it; the paper shows in the window it frames
  (two captioned prints, or the six steps on the white mat); the contact card half its old height in one row. No price, no QR.
-->
<style>
  .pc-wbox{position:absolute;background:var(--cc-tint);box-sizing:border-box}
  .pc-steps .it{position:absolute;display:flex;align-items:flex-start}
  .pc-steps .num{position:absolute;display:flex;align-items:center;justify-content:center;font-family:Fraunces,Georgia,serif;font-weight:600;color:var(--cc-main-ink);border:1pt solid var(--cc-main-ink);border-radius:50%;box-sizing:border-box}
  .pc-steps .stp{font-family:var(--cc-font);font-weight:400;color:#1b1b1b;overflow:hidden;text-wrap:balance}
  .pc-disc{position:absolute;font-size:7.5pt;line-height:10pt;font-weight:500;color:var(--fx-soft);overflow:hidden;white-space:nowrap}
  .pc-ret{position:absolute;font-family:var(--cc-font);font-weight:400;font-size:8.6pt;line-height:11pt;color:var(--fx-on);overflow:hidden;height:36pt}
  .pc-ret b{font-weight:700;letter-spacing:1.4pt;text-transform:uppercase}
  .mailp{position:absolute;background:#fff}
  .cap .a{font-weight:400}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const esc = SW.esc, b = D.brand || {}, A = D.agent || {}, L = D.listing, P = D.piece || {};
  document.body.dataset.mode = D.mode || 'email';
  await SW.setup(D);
  const sold = P.card === 'sold', big = P.size === '6x11', front = P.side === 'front';
  const W = big ? 792 : 648, H = 432, k = big ? 1.12 : 1;
  const K = ((D.sw || {}).pc || {})[sold ? 'js' : 'jl'] || {};
  const hsSrc = A.headshot && ((D.photos||{})[A.headshot] ? D.photos[A.headshot].src : A.headshot) || '';
  const word = sold ? 'Just Sold' : 'Just Listed';
  const issues = [];
  const place = [FXS.hood(L), FXS.placeLine(L)].filter(Boolean).join('  ·  ').toUpperCase(), ad = String(L.address || '');
  // reversed caps never under 8.6 pt: a line that does not fit gives up tracking before it gives up size
  const capsFit = (t, w, max, wt, tracks) => { for(const ls of tracks){ const fs = FXS.fitSize(t, `font-family:Outfit;font-weight:${wt};letter-spacing:${ls}pt`, w, max, 8.6); if(FXS.width(t, `font-family:Outfit;font-weight:${wt};letter-spacing:${ls}pt;font-size:${fs}pt`) <= w - 12) return {fs: Math.max(8.6, fs), ls}; } return {fs: 8.6, ls: tracks[tracks.length - 1]}; };
  const placeLine = (x, y, w, al, slot, max) => { const c = capsFit(place, w, max || 9.5*k, 600, [3, 2.2, 1.4, 0.8]); return `<div class="cc-place" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${13*k}pt;font-size:${c.fs}pt;line-height:${13*k}pt;letter-spacing:${c.ls}pt;text-align:${al || 'center'}" data-slot="${slot || 'front.place'}" data-lines="1">${esc(place)}</div>`; };
  const disp = (t, x, y, w, fs, slot, al) => `<div class="cc-disp" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${fs*1.08}pt;font-size:${fs}pt;line-height:${fs*1.08}pt;letter-spacing:${Math.min(3, fs*0.05)}pt;text-align:${al || 'center'}" data-slot="${slot}" data-lines="1">${esc(t)}</div>`;
  const street = (x, y, w, max, min, slot, al) => { const fs = FXS.fitSize(ad, 'font-family:Outfit;font-weight:600', w - 4, max, min); return {fs, html: `<div class="cc-street" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${fs*1.2}pt;font-size:${fs}pt;line-height:${fs*1.2}pt;text-align:${al || 'center'}" data-slot="${slot || 'front.address'}" data-lines="1">${esc(ad)}</div>`}; };
  const dispFit = (t, w, max, min) => { let f = max; while(f > min && FXS.width(t.toUpperCase(), `font-family:Outfit;font-weight:700;letter-spacing:${Math.min(3, f*0.05)}pt;font-size:${f}pt`) > w - 4) f -= 0.5; return f; };
  const G2 = 8;
  const desT = A.designation ? (A.nar || /realtor/i.test(A.designation) ? 'REALTOR®' : A.designation) : '';
  let h = '';

  if(front){
    const F = K.front || {}, pid = FO.heroId(D, (F.cap || {}).photo || 'front'), M = FXS.MAT;
    const hls = (F.highlights || FXS.tagFacts(D).tags || []).slice(0, big ? 4 : 5);   // owner 11/17: five on the 6x9, four on the 6x11
    const RH = 'font-family:Outfit';
    // P13's facts column: centered lines with a short rule between them
    const stack = (items, x, y, w, h, slot, fs0) => { const fs = Math.min(...items.map(t => FXS.fitSize(t, `${RH};font-weight:600`, w - 8, fs0, 9))), n = items.length, sp = Math.min(h/n, fs*2.9), y0 = y + (h - n*sp)/2; let t = '';
      items.forEach((s, i) => { t += `<div class="abs" style="left:${x}pt;top:${y0 + i*sp + (sp - fs*1.3)/2}pt;width:${w}pt;height:${fs*1.3}pt;${RH};font-weight:600;font-size:${fs}pt;line-height:${fs*1.3}pt;color:var(--cc-on);text-align:center;white-space:nowrap" data-slot="${slot}.${i}" data-lines="1">${esc(s)}</div>`;
        if(i) t += `<div class="cc-dv" style="left:${x + w/2 - 18*k}pt;top:${y0 + i*sp}pt;width:${36*k}pt"></div>`; });
      return t; };
    const agentLine = (x, y, w, al) => { const ns = Math.min(15*k, FXS.fitSize(A.name || '', `${RH};font-weight:700`, w, 15*k, 11));
      return `<div class="abs" style="left:${x}pt;top:${y}pt;width:${w}pt;text-align:${al || 'center'};white-space:nowrap">`
        + `<div style="${RH};font-weight:700;font-size:${ns}pt;line-height:${ns*1.2}pt;color:var(--cc-on)" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</div>`
        + `<div style="line-height:${13*k}pt">${desT ? `<span style="${RH};font-weight:700;font-size:${8.6*k}pt;letter-spacing:1.6pt;color:var(--cc-accent);margin-right:10pt" data-slot="agent.desig" data-lines="1">${esc(desT)}</span>` : ''}<span style="${RH};font-weight:600;font-size:${12*k}pt;color:var(--cc-on)" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</span></div></div>`; };
    const paperLogo = (x, y, w, hh, just) => { const src = CC.logoPaper(D); return `<div class="abs logo" data-area="${w*hh}" data-maxh="${hh}" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${hh}pt;justify-content:${just || 'center'}">${src ? `<img src="${esc(src)}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage || '')}</span>`}</div>`; };

    // Clear Collage fronts: the window. The main-color frame round the card (bleed to 10 pt in), one bar frame to frame, the house as a
    // pane that runs to the frame, the words on the white in Fraunces.
    const FRc = 10, FRA = 'font-family:Fraunces;font-weight:600', fraFit = (t, w, max, min) => FXS.fitSize(t, `${FRA};letter-spacing:-.6pt`, w - 4, max, min);
    h += CCT.frame(W, H, FRc);
    const barAgent = (x, y, w, hh, al, n0) => { const ns = Math.min(n0 || 15*k, FXS.fitSize(A.name || '', `${FRA}`, w, n0 || 15*k, 11)), ph = 11.5*k;
      return `<div class="abs cc-on" style="left:${x}pt;top:${y + (hh - ns*1.2 - ph*1.3 - 2)/2}pt;width:${w}pt;text-align:${al || 'right'};white-space:nowrap">`
        + `<div style="${FRA};font-size:${ns}pt;line-height:${ns*1.2}pt;color:#fff" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</div>`
        + `<div style="margin-top:2pt;line-height:${ph*1.3}pt"><span style="${RH};font-weight:600;font-size:${8.6*k}pt;letter-spacing:1.6pt;color:var(--cc-gold);margin-right:8pt">CALL / TEXT</span><span style="${RH};font-weight:500;font-size:${ph}pt;color:#fff" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</span></div></div>`; };
    const koLogo = (x, y, w, hh) => { const src = CC.logoSrc(D); return `<div class="abs logo" data-area="${w*hh}" data-maxh="${hh}" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${hh}pt;justify-content:center">${src ? `<img src="${esc(src)}" alt="">` : `<span class="word" style="color:#fff" data-slot="broker.name" data-lines="1">${esc(b.brokerage || '')}</span>`}</div>`; };
    if(!sold){
      // ---------- JUST LISTED: the house fills the left pane to the frame; JUST / LISTED in big Fraunces on the white beside it with the
      // house's real story numbered under it (the sign-in sheet's circles); the bar across the foot: the street left, who to call right.
      const BH = Math.round(70*k), by = H - FRc - BH; let xa = Math.round(W*0.6); while(xa < W*0.7 && !SW.fits(D, pid, xa - FRc, by - FRc)) xa += 6;
      h += FXS.box(D, pid, FRc, FRc, xa - FRc, by - FRc, 'front.hero');
      const cx = xa + 22, cw = W - FRc - 20 - cx, vis = by - FRc;
      const ws = Math.min(fraFit('Listed', cw, 70*k, 30), fraFit('Just', cw, 70*k, 30)), lh = ws*1.0;
      const hl = hls, hf = Math.min(...hl.map(t => FXS.fitSize(t, `${RH};font-weight:500`, cw - 26, 12.5*k, 9.5)).concat(12.5*k)), hlh = Math.max(hf*1.35, 17*k, Math.min(26*k, (vis - 2*14*k - 2*lh - 4 - (hl.length + 1)*9*k)/Math.max(1, hl.length)));   // owner 11/17: the list spreads to fill the white panel (no empty top)
      h += CCT.vstack(FRc, vis, [{h: 2*lh, html: yy => `<div class="cc-fra" style="left:${cx}pt;top:${yy}pt;width:${cw}pt;height:${2*lh}pt;font-size:${ws}pt;line-height:${lh}pt;letter-spacing:-.6pt;white-space:normal" data-slot="front.status" data-lines="2">Just<br>Listed</div>`},
        {h: 4, html: yy => `<div class="abs" style="left:${cx}pt;top:${yy}pt;width:${36*k}pt;height:2pt;background:var(--cc-main)"></div>`}].concat(hl.map((t, i) => ({h: hlh, html: yy => CCT.circ(i + 1, cx, yy + (hlh - 15*k)/2, 15*k) + `<div class="abs" style="left:${cx + 22*k}pt;top:${yy}pt;width:${cw - 22*k}pt;height:${hlh}pt;${RH};font-weight:500;font-size:${hf}pt;line-height:${hlh}pt;color:#1e1e1e;white-space:nowrap;overflow:hidden" data-slot="front.hl${i}" data-lines="1">${esc(t)}</div>`}))), 9*k);
      // owner 11/17 (fill): a short street sets larger (up to 40 pt) and the agent grows (name up to 18 pt) so the bar carries no empty middle;
      // what room is left is split evenly either side of the agent and the logo
      const lgW = Math.round(96*k), aw0 = Math.round(150*k), sw0 = W - 2*24 - aw0 - lgW - 30, st = FXS.fitSize(ad, `${FRA};letter-spacing:-.4pt`, sw0, 40*k, 15);
      const sW = Math.max(FXS.width(ad, `${FRA};letter-spacing:-.4pt;font-size:${st}pt`), FXS.width(place, `${RH};font-weight:600;letter-spacing:2.2pt;font-size:${9*k}pt`));
      let bns = 15*k; const aWid = n => Math.max(FXS.width(A.name || '', `${FRA};font-size:${n}pt`), FXS.width('CALL / TEXT', `${RH};font-weight:600;font-size:${8.6*k}pt;letter-spacing:1.6pt`) + 8 + FXS.width(A.phone || '', `${RH};font-weight:500;font-size:${11.5*k}pt`));
      while(bns < 18*k && W - 24 - lgW - 16 - aWid(bns + 0.5) - (24 + sW) > 50) bns += 0.5;
      const aw = Math.ceil(aWid(bns)) + 2, free = Math.max(0, W - 24 - lgW - 16 - aw - (24 + sW) - 24), sh = free > 40 ? free/2 : 0;
      h += CCT.bar(by, BH + 9 + FRc, -9, W + 9) + `<div class="cc-on">` + CCT.vstack(by, BH, [{h: st*1.15, html: yy => `<div class="cc-fra on" style="left:24pt;top:${yy}pt;width:${sw0}pt;height:${st*1.15}pt;font-size:${st}pt;line-height:${st*1.15}pt" data-slot="front.address" data-lines="1">${esc(ad)}</div>`}, CCT.caps(place, 24, sw0, 'front.place', {on: true, gold: true, max: 9*k, ls: 2.2, wt: 600})], 3)
        + barAgent(W - 24 - lgW - 16 - aw - sh, by, aw, BH, 'right', bns) + koLogo(W - 24 - lgW - sh, by + (BH - 30*k)/2, lgW, 30*k) + `</div>`;
    } else {
      // ---------- JUST SOLD, its own card: the bar across the HEAD carries JUST SOLD in white Fraunces with the street right under it; the
      // house is the lower-left pane, to the frame; beside it on the white the seller question, the note on the pale panel, who to call.
      const ls = fraFit('Just Sold', W - 2*28, 150*k, 40), sts = capsFit(ad.toUpperCase(), W - 56, 15*k, 500, [3, 2.2, 1.4]), TP = Math.max(26, ls*0.27); let BB;
      // owner 11/17: JUST SOLD sits centered top to bottom between the top of the card and the top of the street (centerSold() sets it by
      // the letters' real ink once the fonts are in); the street keeps its place at the foot of the band
      // the band is cut to fit: the same gap (about 17 pt, under the blank-band limit) above the word's capitals and between its baseline and
      // the street's capitals, so the photo and the panel below take the room
      const cvx = document.createElement('canvas').getContext('2d'); cvx.font = `600 100px Fraunces`; const aR = cvx.measureText('Just Sold').actualBoundingBoxAscent/100;
      const g = 17, sty = Math.round(2*g + aR*ls - sts.fs*0.3); BB = Math.round(sty + sts.fs*1.3 + 12*k);
      h += CCT.bar(-9, BB + 9, -9, W + 9) + `<div class="cc-on"><div class="cc-fra on" id="soldword" data-addr="${sty}" style="left:28pt;top:${TP}pt;width:${W - 56}pt;height:${ls*1.02}pt;font-size:${ls}pt;line-height:${ls*1.02}pt;letter-spacing:-.6pt" data-slot="front.status" data-lines="1">Just Sold</div>`
        + `<div class="cc-caps2 on" id="soldaddr" style="left:28pt;top:${sty}pt;width:${W - 56}pt;height:${sts.fs*1.3}pt;font-size:${sts.fs}pt;line-height:${sts.fs*1.3}pt;letter-spacing:${sts.ls}pt" data-slot="front.address" data-lines="1">${esc(ad.toUpperCase())}</div></div>`;
      const y2 = BB, vis = H - FRc - y2; let PW = Math.round(W*(((D.photos || {})[pid] || {}).lean ? 0.36 : 0.46)); while(PW < W*0.6 && !SW.fits(D, pid, PW - FRc, vis)) PW += 6;
      h += FXS.box(D, pid, FRc, y2, PW - FRc, vis, 'front.hero');
      // owner 11/17: the seller question up top and a little larger; the pale note box wider and taller, with the same white margin on the
      // right as the photo gap on the left; who to call and the logo down near the foot, the agent a little larger
      const mg = 22, lx = PW + mg, CWc = W - FRc - mg - lx;
      const qs = fraFit('Thinking about selling?', CWc, 26*k, 12), q2 = FXS.width('Thinking about selling?', `${FRA};letter-spacing:-.6pt;font-size:${qs}pt`) > CWc - 2, ql = q2 ? ['Thinking about', 'selling?'] : ['Thinking about selling?'];
      const ns = Math.min(15*k, FXS.fitSize(A.name || '', `${FRA}`, CWc - 120*k, 15*k, 11)), ph = 12.5*k, ah = ns*1.2 + ph*1.3 + 2, lgH = 28*k, lgW = 104*k, rowH = Math.max(ah, lgH);
      const qTop = y2 + 14*k, bTop = qTop + ql.length*qs*1.15 + 10*k, rowTop = H - FRc - 12*k - rowH, bBot = rowTop - 12*k, nbh = bBot - bTop, nb = 12*k;
      const N2 = (F.note2 || []).slice(), more = ((F.note || {}).s || []).map(x => [].concat(x)).filter(x => !/^(I just helped|If you have|Call or text)/.test(x[0]));
      const combos = [[]], add = (i0, acc) => { for(let i = i0; i < more.length; i++) more[i].forEach(v => { const nx = acc.concat(v); combos.push(nx); if(nx.length < 3) add(i + 1, nx); }); }; add(0, []);
      const cands = []; N2.forEach(t => combos.forEach(c => cands.push([t].concat(c).join(' '))));
      h += ql.map((q, i) => `<div class="cc-fra" style="left:${lx}pt;top:${qTop + i*qs*1.15}pt;width:${CWc}pt;height:${qs*1.15}pt;font-size:${qs}pt;line-height:${qs*1.15}pt;letter-spacing:-.6pt" data-slot="front.cta${i ? 2 : ''}" data-lines="1" data-band="${y2}">${esc(q)}</div>`).join('');
      h += `<div class="pc-wbox" id="notebox" style="left:${lx}pt;top:${bTop}pt;width:${CWc}pt;height:${nbh}pt"></div><div class="abs" style="left:${lx + nb}pt;top:${bTop + nb}pt;width:${CWc - 2*nb}pt;height:${nbh - 2*nb}pt;${RH};font-weight:400;font-size:${12*k}pt;line-height:${12*k*1.42}pt;color:#1b1b1b;text-align:justify;text-align-last:left" data-slot="front.note" data-lines="4" data-top="${bTop + nb}" data-ih="${nbh - 2*nb}" data-cands="${esc(JSON.stringify(cands))}">${esc(N2[0] || '')}</div>`;
      h += `<div class="abs" style="left:${lx}pt;top:${rowTop + (rowH - ah)/2}pt;width:${CWc - lgW - 10}pt;white-space:nowrap"><div style="${FRA};font-size:${ns}pt;line-height:${ns*1.2}pt;color:var(--cc-main-ink)" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</div><div style="margin-top:2pt;line-height:${ph*1.3}pt"><span style="${RH};font-weight:600;font-size:${9.2*k}pt;letter-spacing:1.6pt;color:var(--cc-main-ink);margin-right:8pt">CALL / TEXT</span><span style="${RH};font-weight:500;font-size:${ph}pt;color:#1e1e1e" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</span></div></div>`
        + paperLogo(lx + CWc - lgW, rowTop + (rowH - lgH)/2, lgW, lgH, 'flex-end');
    }
  } else {
    // ---------------- BACK (the owner 11/16: the design runs through the whole card; the mail zones are small white markups) ----------------
    // Clear Collage: the main-color band runs edge to edge across the head (the status and the full street in it, the return address and the
    // postage markup set into it), down the mail side (the address block's markup set into it) and edge to edge across the foot (the contact
    // row and the barcode markup). The paper shows only in the window it frames: prints in their mats (Just Listed) or the six steps on the
    // sign-in sheet's white mat (Just Sold).
    const dx = W - 648, X = 28, B = K.back || {}, RHb = 'font-family:Outfit', FRA = 'font-family:Fraunces;font-weight:600', FRc = 10;
    const Z = {postage: [552 + dx, 12, 84, 98.25], address: [405 + dx, 187.5, 240, 112.5], barcode: [306 + dx, 387, 342, 45]};
    window.__zones = Z; window.__cardX = X;
    const mk = (z, m, ext) => `<div class="mailp" data-mail-panel="1" style="left:${z[0] - m}pt;top:${z[1] - m}pt;width:${z[2] + 2*m + (ext || 0)}pt;height:${z[3] + 2*m + (ext || 0)}pt"></div>`;
    // the window on the back: the frame round the card, the bar across the head (the status, the full street, the place; the return
    // address and the postage markup set into it), the pale mail column down the right (the address markup set into it, the facts or the
    // seller question above it), the bar across the foot (the contact row; the barcode markup set into it). The white pane holds the
    // collage (Just Listed) or the six numbered steps (Just Sold).
    const RX = Z.address[0] - 14, TB = 110, FB = 330, rw = Z.postage[0] - 14 - Z.address[0];
    let band = '';
    const ret = [b.brokerage || ''].concat([].concat(b.returnAddress || b.address || []).flatMap(a => String(a).split('\n'))).filter(Boolean).slice(0, 3);
    band += `<div class="pc-ret" data-small="1" data-fine="1" data-slot="back.return" style="left:${Z.address[0]}pt;top:${Z.postage[1] + 8}pt;width:${rw}pt;text-align:right;color:#fff"><b>${esc(ret[0] || '')}</b>${ret.slice(1).map(t => '<br>' + esc(t)).join('')}</div>`;
    const hw = RX - 26 - 20, sts = FXS.fitSize(ad, `${FRA};letter-spacing:-.4pt`, hw, 30*k, 15), hbh = 13 + 4 + sts*1.12 + 3 + 13, hy = (TB - hbh)/2 + 2;
