<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>warm-collage social set</title>
<link rel="stylesheet" href="wc-tokens.css">
<script src="../engine/baths.js"></script>
<script src="../engine/ivory.js"></script>
<script src="../engine/ohlib.js"></script>
<script src="../engine/ohemail.js"></script>
<script src="../engine/carousel.js"></script>
<script src="../engine/factrepeat.js"></script>
<script src="../engine/socialset.js"></script>
<script src="wc-social.js"></script>
<!-- Warm Collage's Just Listed and Just Sold social sets (owner 11/18/2026). The shared engine (templates/_shared/socialset.js) loads
     the fonts and the data and runs the checks; the layouts are Warm Collage's own (wc-social.js): the collage of tiles on the mat,
     the main-color block with the word in Bitter caps, the accent anchor bar with the street, the dark block with the highlights and
     the agent. The colors come from the agent's brand kit as the set's print pieces read them (WC.brand in wc.js). -->
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
SocialSet.portrait = WCSocial.portrait; SocialSet.landscape = WCSocial.landscape; SocialSet.slide = WCSocial.slide;
// the layouts also set Schibsted Grotesk 500 and 700: loaded before anything is measured
OHL.cardReady = Promise.all([OHL.cardReady, document.fonts.load("500 12px 'Schibsted Grotesk'").catch(() => 0), document.fonts.load("700 12px 'Schibsted Grotesk'").catch(() => 0)]);
SocialSet.start(D => {
  const b = D.brand || {}, c = b.colors || {}, r = document.documentElement.style;
  const rgb = h => { h = String(h||'').replace('#',''); if(h.length===3) h = h.split('').map(x=>x+x).join(''); const n = parseInt(h,16); return [n>>16&255, n>>8&255, n&255]; };
  const hex = a => '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
  const mix = (a, z, k) => { const p = rgb(a), q = rgb(z); return hex(p.map((v, i) => v*k + q[i]*(1 - k))); };
  const lum = h => { const v = rgb(h).map(q => { q/=255; return q <= .03928 ? q/12.92 : Math.pow((q+.055)/1.055, 2.4); }); return .2126*v[0] + .7152*v[1] + .0722*v[2]; };
  const con = (a, z) => { const x = lum(a), y = lum(z); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); };
  const on = bg => con(bg, '#ffffff') >= con(bg, '#161616') ? '#ffffff' : '#161616';
  const read = (fg, bg, k) => con(fg, bg) >= k ? fg : on(bg);
  const soft = o => o === '#ffffff' ? 'rgba(255,255,255,.88)' : 'rgba(22,22,22,.86)';
  // as WC.brand: the mat is 18% of the main color in the kit's paper; the main and dark colors are the blocks; the accent is the anchor
  const main = c.main || b.accent || '#8c4a2a', dark = c.dark || '#3b2316', accent = c.accent || b.accent2 || '#e09a3e', paper = b.paper || '#f6efe6';
  r.setProperty('--wcs-mat', mix(main, paper, .18)); r.setProperty('--wcs-main', main); r.setProperty('--wcs-dark', dark); r.setProperty('--wcs-accent', accent);
  r.setProperty('--wcs-on-main', on(main)); r.setProperty('--wcs-on-dark', on(dark)); r.setProperty('--wcs-on-accent', on(accent));
  r.setProperty('--wcs-acc-on-dark', read(accent, dark, 3)); r.setProperty('--wcs-soft-dark', soft(on(dark))); r.setProperty('--wcs-soft-main', soft(on(main)));
  r.setProperty('--wcs-hair-dark', on(dark) === '#ffffff' ? 'rgba(255,255,255,.55)' : 'rgba(22,22,22,.4)');
});
</script>
</body>
</html>
