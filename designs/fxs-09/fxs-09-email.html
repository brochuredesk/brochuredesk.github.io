<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · FX extras · FX09 Open House email</title>
<link rel="stylesheet" href="fx.css">
<link rel="stylesheet" href="fxs09-tokens.css">
<script src="fxs09-tk.js"></script>
<script src="../engine/ivory.js"></script>
<script src="../engine/ohlib.js"></script>
<script src="../engine/ohemail.js"></script>
<script src="../engine/factrepeat.js"></script>
<script src="fxpage.js"></script>
<script src="../engine/baths.js"></script>
<script src="fxs09-head.js"></script>
<script src="fxs09-patch.js"></script>
<!--
  FX09 Open House email (600 px, drawn at 450 pt). The flyer's pieces carry through on navy: the cream event card at the top (label and weekday, the date in
  the serif, the time in bold sans at 60% of the date), the perks bar across it, the white serif address and the italic copper place, the whole house, the
  four big numerals, the write-up beside its copper bar, two more rooms, the shared agent card with the one logo. No photo appears twice. No new copy.
-->
<style>
  .abs{position:absolute}
  .lab{font:700 20pt/24pt 'DM Sans';letter-spacing:2.2pt;text-transform:uppercase;color:var(--fx-ink2);white-space:nowrap}
  .wk{font:700 15pt/20pt 'DM Sans';letter-spacing:5pt;text-transform:uppercase;color:var(--fx-ink2);white-space:nowrap}
  .dt{font:400 64pt/68pt 'DM Serif Display';letter-spacing:-1.5pt;color:var(--fx-ink);white-space:nowrap;overflow:hidden}
  .tm{font:700 38pt/44pt 'DM Sans';letter-spacing:-.4pt;color:var(--fx-ink);white-space:nowrap;overflow:hidden}
  .evb{font:500 15.5pt/21pt 'DM Sans';text-align:center;color:var(--fx-on-ink)}
  .evb.b{font-weight:700}
  .place{font:italic 400 19pt/24pt 'DM Serif Display';color:var(--fx-ink2);white-space:nowrap}
  .str{font:400 40pt/44pt 'DM Serif Display';letter-spacing:-.5pt;color:var(--fx-ink);white-space:nowrap;overflow:hidden}
  .sv{font:400 30pt/34pt 'DM Serif Display';color:var(--fx-ink);white-space:nowrap;text-align:center}
  .sl{font:500 12.5pt/16pt 'DM Sans';letter-spacing:.4pt;color:var(--fx-text);white-space:nowrap;text-align:center}
  .kk{font:700 15pt/18pt 'DM Sans';letter-spacing:3.5pt;text-transform:uppercase;white-space:nowrap}
  .wu{font:400 15pt/22pt 'DM Sans';color:var(--fx-ink)}
  .fine{font:400 10pt/14pt 'DM Sans';color:var(--fx-mute);white-space:normal}
  .oh-agent-name{font-family:'DM Serif Display';font-weight:400}
  .oh-agent{font-family:'DM Sans'}
</style>
<style>/* round 3 (owner 11/7): the brokerage logo centered across the card, the office line centered under it */
.em .cc-panel.cc-band{flex-direction:column !important;justify-content:center !important;align-items:center !important;height:auto !important;gap:6pt !important}
.em .cc-panel.cc-band > div:last-child{text-align:center !important;display:flex;gap:14pt;justify-content:center}
.em .cc-panel.cc-band .cc-office{white-space:nowrap}</style>
<style>.photo::after{content:'';position:absolute;inset:4pt;border:1pt solid #d98f52;pointer-events:none}</style>
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
FXP.start(['700 20pt "DM Sans"', '500 20pt "DM Sans"', '400 20pt "DM Sans"', '400 20pt "DM Serif Display"', 'italic 400 20pt "DM Serif Display"'], D => {
  const esc = Ivory.esc, L = D.listing, C = D.companion || {};
  const E = OHL.event(D), hero = OHL.hero(D, 'straight');
  if(E.time) E.time = E.time.replace(/(\d)\s+(am|pm)\b/gi, '$1 $2');
  const W = 450, AX = 24, RR = W - 24, CWd = RR - AX;
  const rect = (x, y, w, h, css) => `<div class="abs" aria-hidden="true" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${h}pt;${css || ''}"></div>`;
  const pic = (id, x, y, w, h, r) => OHL.photo(D, id, `left:${x}pt;top:${y}pt;width:${w}pt;height:${h}pt;${r || ''}`);
  const D2 = Object.assign({}, D, {companion: Object.assign({}, C, {postcard: Object.assign({}, C.postcard || {}, {master: ((C.postcard || {}).master || []).filter(t => !FXP.CONDITION.test(t))})})});
  const h = [];
  const HEAD = FX09HEAD(D);
  // ---- kicker row
  h.push(`<div class="abs kk" style="left:${AX}pt;top:22pt;width:${CWd}pt;height:18pt;color:var(--fx-ink2);letter-spacing:2pt" data-slot="kicker.left" data-lines="1">${esc(HEAD.left)}</div>`);
  if(HEAD.right && HEAD.right.length > 24) HEAD.right = HEAD.right.split(' · ')[0];   // the 450 pt email header carries the stories alone when the pair is long
  let rks = 15, rkt = 2;
  if(HEAD.right) h.push(`<div class="abs kk" style="left:${AX}pt;top:22pt;width:${CWd}pt;height:18pt;color:var(--fx-text);font:500 ${rks}pt/18pt 'DM Sans';letter-spacing:${rkt}pt;text-align:right" data-slot="kicker.right" data-lines="1">${esc(HEAD.right)}</div>`);
  h.push(rect(AX, 46, CWd, .75, 'background:var(--fx-rule)'));
  // ---- the event, straight on the navy: label, weekday, the date in huge serif numerals, the time in bold sans at 60% of it, the perks on a cream bar
  const IX = AX, IW = CWd, CY = 62;
  const lines = [[E.refreshments, 'oh.refreshments', 'evb b'], [E.note, 'oh.note', 'evb']];
  const probe = Ivory.eventBox(lines, IX, 0, IW, 21, 4, {padY: 11, padX: 14});
  const hasBox = !!probe.h;
  const two = FXP.width(E.label.toUpperCase(), "font:700 20pt 'DM Sans';letter-spacing:2pt") > IW;
  const LH = two ? 46 : 24, DS = 64, TS = DS*.6;
  let ey = CY;
  h.push(`<div class="abs lab" style="left:${IX}pt;top:${ey}pt;width:${IW}pt;height:${LH}pt" data-slot="oh.label" data-lines="${two ? 2 : 1}">${two ? OHL.labelLines(E.label, 2).map(esc).join('<br>') : esc(E.label)}</div>`); ey += LH + 4;
  h.push(`<div class="abs wk" style="left:${IX}pt;top:${ey}pt;width:${IW}pt;height:20pt" data-slot="oh.weekday" data-lines="1">${esc(E.weekday)}</div>`); ey += 24;
  const md = String(E.monthDay || E.long);
  h.push(`<div class="abs dt" style="left:${IX - 1}pt;top:${ey}pt;width:${IW + 1}pt;height:${DS*1.12}pt;font-size:${DS}pt;line-height:${DS*1.05}pt" data-fit="${DS},34" data-slot="oh.date" data-lines="1">${esc(md)}</div>`); ey += DS*1.05 + 2;
  if(E.time){ h.push(`<div class="abs tm" style="left:${IX}pt;top:${ey}pt;width:${IW}pt;height:${TS*1.2}pt;font-size:${TS}pt;line-height:${TS*1.12}pt" data-fit="${TS},19" data-slot="oh.time" data-lines="1">${esc(E.time)}</div>`); ey += TS*1.12; }
  if(hasBox){ ey += 14; h.push(Ivory.eventBox(lines, IX, ey, IW, 21, 4, {bg: 'var(--fx-box-bg)', padY: 11, padX: 14}).html); ey += probe.h; }
  h.push(rect(AX, ey + 16, CWd, .75, 'background:var(--fx-rule)'));
  let y = ey + 32;
  // ---- address and the whole house
  const NAME = L.address, css = "font-family:'DM Serif Display';font-weight:400;letter-spacing:-.5pt";
  const sf = FXP.fitSize(NAME, css, CWd, 40, 26);
  h.push(`<div class="abs str" style="left:${AX}pt;top:${y}pt;width:${CWd}pt;height:${sf*1.12}pt;font-size:${sf}pt;line-height:${sf*1.1}pt" data-slot="address" data-lines="1">${esc(NAME)}</div>`); y += sf*1.1 + 1;
  h.push(`<div class="abs place" data-small="1" style="left:${AX}pt;top:${y}pt;width:${CWd}pt;height:25pt" data-slot="place" data-lines="1">${esc([L.city, L.state || 'Texas'].join(', '))}</div>`); y += 36;
  const fr = OHL.fitHero(D, hero, CWd, 240);
  h.push(pic(hero, AX + (CWd - fr.w)/2, y, fr.w, fr.h)); y += fr.h + 18;
  // ---- the four numerals
  const st = [];
  if(L.beds) st.push([String(L.beds), 'Bedrooms']);
  if(L.baths){ const bn = BD.bathNum(L); st.push([String(bn.num).replace(/<[^>]*>/g, ''), bn.label]); }
  if(L.sqft) st.push([Number(L.sqft).toLocaleString('en-US'), 'Square feet']);
  const yr = L.yearBuilt || L.year; if(yr) st.push([String(yr), 'Year built']);
  const cw = CWd/st.length;
  h.push(rect(AX, y, CWd, .75, 'background:var(--fx-rule)')); y += 12;
  st.forEach(([v, l], i) => { h.push(`<div class="abs sv" data-small="1" style="left:${AX + i*cw}pt;top:${y}pt;width:${cw}pt;height:34pt" data-slot="stat.${i}" data-lines="1">${esc(v)}</div><div class="abs sl" data-small="1" style="left:${AX + i*cw}pt;top:${y + 36}pt;width:${cw}pt;height:17pt" data-slot="stat.${i}.label" data-lines="1">${esc(l)}</div>`); if(i) h.push(rect(AX + i*cw, y + 4, .75, 46, 'background:var(--fx-rule)')); });
  y += 62;
  // ---- the write-up beside its copper bar
  const wu = OHL.writeup(D2, 'wu', CWd - 18, 22, 9, [], {narrow: true});
  if(wu.text){ const ww = wu.w || (CWd - 18); h.push(rect(AX, y + 3, 3, wu.n*22 - 6, 'background:var(--fx-bar)'), `<div class="abs wu" style="left:${AX + 18}pt;top:${y}pt;width:${ww}pt;height:${wu.n*22 + 2}pt" data-slot="listing.body" data-lines="${wu.n}">${esc(wu.text)}</div>`); y += wu.n*22 + 2 + 26; }
  // ---- two more rooms (neither repeats another photo in the email)
  const archScore = id => { const p = D.photos[id] || {}; const k = /^(family|living|great|open)/.test(id) ? 3 : /^(dining|primary)(?!.*bath)/.test(id) ? 2 : /kitchen|bar|bath|stair|foyer|entry/.test(id) ? 0 : 1; return k*10 + (p.w && p.h ? Math.min(p.w/p.h, 1.6) : 1); };
  const rooms = OHEmail.support(D, hero, 8).filter(id => !Ivory.fullHouse(D, id)).sort((a, b) => archScore(b) - archScore(a)).filter((id, i, arr) => arr.findIndex(o => FXP.fam(o) === FXP.fam(id)) === i);
  const grp = id => { id = String(id).replace(/\d+[a-z]?$/, ''); return /^(family|living|great|open|wine)/.test(id) ? 'living' : /^(kitchen|bar)/.test(id) ? 'kitchen' : /^(primary)/.test(id) ? 'primary' : /bath/.test(id) ? 'bath' : id; };
  const gs = id => ({kitchen: 3, primary: 2, dining: 1, living: 1})[grp(id)] || 0;
  const pair = rooms.slice().sort((a, b) => gs(b) - gs(a)).filter((id, i, arr) => arr.findIndex(o => grp(o) === grp(id)) === i).slice(0, 2);
  if(pair.length === 2){ const g = 12, pw = (CWd - g)/2, ph = Math.round(pw*.8); h.push(pic(pair[0], AX, y, pw, ph), pic(pair[1], AX + pw + g, y, pw, ph)); y += ph + 26; }
  else if(pair.length === 1){ h.push(pic(pair[0], AX, y, CWd, 190)); y += 216; }
  // ---- the agent card and the one logo
  h.push(rect(AX, y, CWd, .75, 'background:var(--fx-rule)'));
  // owner 11/7: no broker mailing address on socials or the email (standing rule); the office phone stays
  h.push(OHL.contact(Object.assign({}, D, {brand: Object.assign({}, D.brand, {address: []})}), {x: AX - 6, y: y + 14, w: CWd + 12, h: 236, tone: 'dark', field: 'dark', color: TK.ink, accent: TK.ink2, size: 'email', nameFont: "'DM Serif Display'", nameWeight: 400, bodyFont: "'DM Sans'"}));
  y += 14 + 236 + 4;
  const fine = C.fineprint || 'Information deemed reliable but not guaranteed.';
  const fn = FXP.lines(fine, "font:400 10pt/14pt 'DM Sans'", CWd);
  h.push(`<div class="abs fine" style="left:${AX}pt;top:${y}pt;width:${CWd}pt;height:${fn*14}pt" data-slot="fineprint" data-lines="${fn}" data-fine="1">${esc(fine)}</div>`);
  y += fn*14 + 26;
  return {W, H: y, html: `<div class="page em" data-page="${esc(D.piece.id)}" style="position:relative;overflow:hidden;width:${W}pt;height:${y}pt;background:var(--fx-paper)">${h.join('')}</div>`};
});
</script>
</body>
</html>
