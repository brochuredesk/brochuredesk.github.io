<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · FX extras · FX09 socials</title>
<link rel="stylesheet" href="fx.css">
<link rel="stylesheet" href="fxs09-tokens.css">
<script src="fxs09-tk.js"></script>
<script src="../engine/ivory.js"></script>
<script src="../engine/ohlib.js"></script>
<script src="../engine/factrepeat.js"></script>
<script src="fxpage.js"></script>
<script src="../engine/baths.js"></script>
<script src="fxs09-head.js"></script>
<script src="fxs09-patch.js"></script>
<!--
  FX09 socials: Open House, Just Listed and Just Sold in every size, plus the carousel slides.
  One page; it draws by FXP.kind(D) and D.piece.shape. The flyer's pieces carry through on the navy page: the white serif address, the italic copper
  place, one large square hero (the exterior), the cream box holding the words in navy (the event is the loudest thing; the perks sit in a navy bar
  inside it), tracked caps labels, hairlines, the agent in the serif with REALTOR(R) in copper, the one logo in white. Square photos throughout. No new copy.
  Too much for a size: the notes go first, then what's served (the caption carries them), as the pilot pages.
-->
<style>
  .abs{position:absolute}
  .wu{font:400 var(--sw,13pt)/1.4 'DM Sans'}
</style>
<style>.photo::after{content:'';position:absolute;inset:4pt;border:1pt solid #d98f52;pointer-events:none}</style>
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
FXP.start(['700 20pt "DM Sans"', '600 20pt "DM Sans"', '500 20pt "DM Sans"', '400 20pt "DM Sans"', '400 20pt "DM Serif Display"', 'italic 400 20pt "DM Serif Display"'], D => {
  const esc = Ivory.esc, L = D.listing, C = D.companion || {}, A = D.agent || {};
  const kind = FXP.kind(D), shape = D.piece.shape, {W, H} = FXP.size(D), F = FXP.floor(shape); F.ev = F.event;
  const E = OHL.event(D), hero = OHL.hero(D, 'straight');
  if(E.time) E.time = E.time.replace(/(\d)\s+(am|pm)\b/gi, '$1 $2');
  const INK = TK.ink, BANDC = TK.band, SOFT = TK.onInkSoft, MONT = "font-family:'DM Sans'", SERIF = "font-family:'DM Serif Display'", COPPER_DK = '#9a561f';
  const back = [], mid = [], front = [], tiny = [];
  const D2 = Object.assign({}, D, {companion: Object.assign({}, C, {postcard: Object.assign({}, C.postcard || {}, {master: ((C.postcard || {}).master || []).filter(t => !FXP.CONDITION.test(t))})})});
  const side = shape === 'wide' || shape === 'gbp';
  const AX = Math.round(W*.04), BW = AX - 12;   // the page margin; text starts a hair left of the photos' edge (BW + 12)

  const rect = (x, y, w, h, css) => `<div class="abs" aria-hidden="true" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${h}pt;${css || ''}"></div>`;
  const pic = (id, x, y, w, h, css) => OHL.photo(D, id, `left:${x}pt;top:${y}pt;width:${w}pt;height:${h}pt;${css || ''}`);
  const archCss = () => '';   // FX09 photos are square
  const wdt = (t, css, rich) => { const m = document.createElement('span'); m.style.cssText = `position:absolute;left:-9999pt;visibility:hidden;white-space:nowrap;${css}`; if(rich) m.innerHTML = t; else m.textContent = t; document.body.appendChild(m); const w = m.getBoundingClientRect().width*.75; m.remove(); return w; };
  // text that fits: the biggest size from max to min at which it runs in <= lines lines in width w. o.rich: html for the body
  const T = o => { const r = T0(o); return o.parts && r.n >= 99 ? T0(Object.assign({}, o, {parts: null, lines: Math.max(o.lines || 1, 3)})) : r; };
  const T0 = o => {
    const lines = o.lines || 1, lhk = o.lh || 1.15, txt = o.parts ? o.parts.join(' ') : o.text;
    const css = s => `${MONT};${o.css};font-size:${s}pt;line-height:${(s*lhk).toFixed(2)}pt`;
    const cnt = s => o.rich ? (wdt(o.rich, css(s), true) <= o.w + .3 ? 1 : 99) : o.parts ? (o.parts.every(p => FXP.width(p, css(s)) <= o.w + .3) ? o.parts.length : 99) : FXP.lines(txt, css(s), o.w);
    let s = o.max, n = cnt(s);
    while(n > lines && s > o.min){ s -= .5; n = cnt(s); }
    if(s < o.min) s = o.min;
    n = cnt(s);
    const nn = Math.min(n, 99), h = Math.ceil(nn*s*lhk*100)/100 + 1.4 + (nn > 1 ? 2.5 : 0);
    const wid = nn === 1 ? (o.rich ? wdt(o.rich, css(s), true) : FXP.width(txt, css(s))) : o.w;
    const body = o.rich || (o.parts ? o.parts.map(esc).join('<br>') : esc(txt));
    const html = `<div class="abs" style="left:${o.x}pt;top:${o.y}pt;width:${o.w}pt;height:${h}pt;${css(s)};text-align:${o.align || 'left'};white-space:${nn === 1 ? 'nowrap' : 'normal'};overflow:hidden"${o.small ? ' data-small="1"' : ''} data-slot="${o.slot}" data-lines="${nn}">${body}</div>`;
    return {html, h, s, n: nn, w: wid, ok: n <= lines};
  };
  const caps = (wt, tr, col) => `font-weight:${wt};letter-spacing:${tr}pt;text-transform:uppercase;color:${col}`;

  // ---------- the contact: the one logo floats at the left across the band's edge, name, REALTOR(R) and phone beside it ----------
  const hsOn = OHL.cardMode(D) === 'headshot' && !!A.headshot;
  const contact = (x, y, w, o) => {
    const col = INK, html = [], lh = o.lh, lw = Math.min(lh*4.3, w*.42);   // owner rule 11/3: the agent and contact on the left, the brokerage logo on the right
    const logo = (lx, ly, jf) => OHL.logo(D, 'dark', `left:${lx}pt;top:${ly}pt;width:${lw}pt;height:${lh}pt;justify-content:${jf || 'flex-start'}`);
    if(o.mode === 'logo'){ html.push(logo(x, y)); return {h: lh, html: html.join(''), w: lw}; }
    const hs = hsOn && !o.noHs ? Math.round(o.ns*2.7) : 0, gap = 9;
    const lx0 = x, tx = lx0 + (hs ? hs + gap : 0);
    let beside = true, tw = x + w - lw - 16 - tx;
    if(o.stack){ const t1 = T({slot: 'x', text: A.name || '', css: `${SERIF};font-weight:400;letter-spacing:-.1pt`, x: tx, y, w: tw, max: o.ns*1.12, min: F.body, lh: 1.12}), t2 = T({slot: 'x', text: A.phone || '', css: 'font-weight:700', x: tx, y, w: tw, max: o.ps, min: F.body, lh: 1.15}); if(!t1.ok || !t2.ok || t1.s < o.ns*1.12*.8 || t2.s < o.ps*.8){ beside = false; tw = x + w - tx; } }   // a narrow column: the logo drops under the agent, still at the right
    const nm = T({slot: 'agent.name', text: A.name || '', css: `${SERIF};font-weight:400;letter-spacing:-.1pt;color:${col}`, x: tx, y, w: tw, max: o.ns*1.12, min: F.body, lh: 1.12});
    let yy = y + nm.h;
    const ds = T({slot: 'agent.desig', text: 'REALTOR®', css: caps(500, 3, TK.ink2), x: tx, y: yy + 1, w: tw, max: F.small, min: F.small, lh: 1.2, small: 1});
    const showD = !!(A.nar || /realtor/i.test(A.designation || ''));
    if(showD) yy += 1 + ds.h;
    const ph = T({slot: 'agent.phone', text: A.phone || '', css: `font-weight:700;color:var(--fx-text-dark)`, x: tx, y: yy + 2, w: tw, max: o.ps, min: F.body, lh: 1.15});
    yy += 2 + ph.h;
    html.push(nm.html, showD ? ds.html : '', ph.html);
    const th = yy - y;
    if(hs) html.unshift(`<div class="abs" style="left:${lx0}pt;top:${y}pt;width:${hs}pt;height:${Math.max(hs, th)}pt;overflow:hidden"><img src="${esc(A.headshot)}" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></div>`);
    const h = Math.max(th, hs, lh);
    // owner 11/8 (FXS-09 socials p6/p7): a logo under the agent is centered under the agent's info and grows to fill the space below it
    if(!beside && o.logoZone){ const Z = o.logoZone, LH = Math.max(lh, Math.min(Z*.62, w*.78/4.3)), LW = Math.min(w, LH*4.3);
      const aw = Math.max(nm.w || 0, ph.w || 0, showD ? (ds.w || 0) : 0), acx = Math.min(x + w - LW/2, Math.max(x + LW/2, tx + aw/2));   // centered under the agent's lines, inside the column
      html.push(OHL.logo(D, 'dark', `left:${acx - LW/2}pt;top:${y + Math.max(th, hs) + (Z - LH)/2}pt;width:${LW}pt;height:${LH}pt;justify-content:center`));
      return {h: Math.max(th, hs) + Z, th: Math.max(th, hs), beside, html: html.join('')}; }
    html.push(logo(x + w - lw, beside ? y + (h - lh)/2 : y + h + 6, 'flex-end'));
    return {h: beside ? h : h + 6 + lh, th: Math.max(th, hs), beside, html: html.join('')};
  };

  // ---------- the street: light number, heavy caps name; the suffix drops first, then a long street runs two lines ----------
  // a suffix drops first, also in front of a unit ("Boulevard Unit 4")
  const SUF = /\s+(Street|St|Drive|Dr|Lane|Ln|Road|Rd|Avenue|Ave|Boulevard|Blvd|Court|Ct|Circle|Cir|Place|Pl|Way|Trail|Trl|Parkway|Pkwy|Terrace|Ter|Highway|Hwy)\.?(?=\s+(Unit|Apt|Suite|Ste|#)\b|\s*$)/i;
  const pa = (OHL.printStreet(L.address).match(/^\s*(\d+[A-Za-z-]*)\s+(.+)$/) || [null, '', L.address]);
  const NUM = pa[1], NAME = pa[2], ADDR = OHL.printStreet(L.address).toUpperCase();
  const lineHtml = (tk) => tk.map(k => `<span>${esc(k.t)}</span>`).join(' ');
  // the address in light number + heavy caps: one line at a good size, else the suffix drops, else it word-wraps onto 2, 3 or 4
  // lines at the phone floor or above (never smaller than min): number first, a unit stays with the street
  const addr = (x, y, w, max, min, color, slot, align) => {
    max = Math.max(max, min);
    const base = `${SERIF};font-weight:400;letter-spacing:-.5pt;color:${color || INK}`;
    const cands = [NAME]; const ns = NAME.replace(SUF, ''); if(ns && ns !== NAME) cands.push(ns);
    const toks = c => (NUM ? [{t: NUM, num: 1}] : []).concat(c.split(/\s+/).map(t => ({t})));
    const wr = (c, s) => { const lines = []; let cur = [], ok = true;
      toks(c).forEach(k => { const t2 = cur.concat([k]); if(cur.length && wdt(lineHtml(t2), `${base};font-size:${s}pt`, true) > w){ lines.push(cur); cur = [k]; } else cur = t2; });
      if(cur.length) lines.push(cur);
      lines.forEach(l => { if(wdt(lineHtml(l), `${base};font-size:${s}pt`, true) > w + .2) ok = false; });
      return {lines, ok}; };
    const out = (lines, s) => { const n = lines.length, h = n*s*1.1 + 1.4 + (n > 1 ? 2.5 : 0);
      return {h, s, html: `<div class="abs" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${h}pt;${base};font-size:${s}pt;line-height:${s*1.1}pt;white-space:nowrap;overflow:hidden;text-align:${align || 'left'}" data-slot="${slot || 'address'}" data-lines="${n}">${lines.map(lineHtml).join('<br>')}</div>`}; };
    for(const c of cands) for(let s = max; s >= Math.max(min, max*.62); s -= .5){ const r = wr(c, s); if(r.ok && r.lines.length === 1) return out(r.lines, s); }
    const c = cands[cands.length - 1];
    for(const nl of [2, 3, 4]) for(let s = max; s >= min; s -= .5){ const r = wr(c, s); if(r.ok && r.lines.length <= nl) return out(r.lines, s); }
    return out(wr(c, min).lines, min);
  };

  // ---------- the event on the black box (white type) ----------
  const evBlock = (x, y, w, k, lvl, o) => {
    o = o || {};
    const out = []; let yy = y, right = 0;
    const lab1 = FXP.fitSize(E.label.toUpperCase(), `${MONT};${caps(700, 2.4*k, COPPER_DK)}`, w, F.ev*1.3*k, F.ev);
    const parts = lab1 >= F.ev*1.02 || o.noSplit ? null : OHL.labelLines(E.label.toUpperCase(), 2);
    const lab = T({slot: 'oh.label', text: E.label.toUpperCase(), parts, css: caps(700, 2.4*k, COPPER_DK), x, y: yy, w, max: F.ev*1.3*k, min: F.ev, lines: parts ? 2 : 1, lh: o.tight ? 1.1 : 1.15});
    out.push(lab.html); yy += lab.h + 5*k; right = Math.max(right, lab.w); const labelLines = lab.n;
    const md = String(E.monthDay || E.long), sp = md.lastIndexOf(' ');
    if(!o.merged){
      const wk = T({slot: 'oh.weekday', text: E.weekday.toUpperCase(), css: caps(600, o.smallWk ? 3 : 4.5, SOFT), x, y: yy, w, max: Math.max(o.smallWk ? F.small : F.body, 13)*Math.min(k, 1.25), min: o.smallWk ? F.small : F.body, lh: 1.15, small: o.smallWk ? 1 : 0});
      out.push(wk.html); yy += wk.h + 2*k; right = Math.max(right, wk.w);
    }
    const dtext = o.merged ? E.long : md;
    const rich = !o.merged && sp > 0 ? `${esc(md.slice(0, sp))} ${esc(md.slice(sp + 1))}` : esc(dtext);
    const dt = T({slot: 'oh.date', text: dtext, rich: o.merged ? null : rich, css: `${SERIF};font-weight:400;letter-spacing:-.6pt;color:var(--fx-on-ink)`, x: x - 1, y: yy, w: w + 1, max: F.ev*2.25*k, min: F.ev, lines: o.merged && !o.one ? 2 : 1, lh: 1.0});
    out.push(dt.html); yy += dt.h + 4*k; right = Math.max(right, dt.w);
    if(E.time){
      const tcss = `font-weight:700;color:var(--fx-on-ink)`, tparts = /\sto\s/.test(E.time) && FXP.width(E.time, `${MONT};${tcss};font-size:${F.ev}pt`) > w ? E.time.replace(/\s+to\s+/, ' to|').split('|') : null;
      const tm = T({slot: 'oh.time', text: E.time, parts: tparts, css: tcss, x, y: yy, w, max: F.ev*1.3*k, min: F.ev, lines: tparts ? 2 : 1, lh: o.tight ? 1.05 : 1.12});
      out.push(tm.html); yy += tm.h; right = Math.max(right, tm.w);
    }
    const items = lvl >= 2 ? [] : [[E.refreshments, 'oh.refreshments', 700], lvl >= 1 ? [] : [E.note, 'oh.note', 500]].filter(i => i[0]);
    if(items.length){
      yy += 9*k;
      const bf = Math.max(F.body, 13)*Math.min(k, 1.25), px = 12, py = o.tight ? 6 : 9;
      const rows = []; let by = yy + py;
      items.forEach(([t, slot, wt]) => { const r = T({slot, text: t, css: `font-weight:${wt};color:${INK}`, x: x + px, y: by, w: w - 2*px, max: bf, min: F.body, lines: 3, lh: o.tight ? 1.1 : 1.22, align: 'center'}); rows.push(r.html); by += r.h + 3; });
      by -= 3;
      out.push(`<div class="abs" data-box="oh.box" style="left:${x}pt;top:${yy}pt;width:${w}pt;height:${by - yy + py}pt;background:var(--fx-paper)"></div>`, ...rows);
      yy = by + py; right = w;
    }
    return {h: yy - y, html: out.join(''), right, hasBox: items.length > 0, labelLines};
  };

  const six = OHL.factSix(L).filter(([ic]) => ic !== 'stories' || OHL.factSix(L).length < 4)
    .map(([ic, t]) => ic === 'bed' ? t.replace('bedroom', 'bed') : ic === 'bath' ? t.replace(' full bath', ' bath') : ic === 'area' ? t.replace(' square feet', ' sq ft') : ic === 'cal' ? t.replace('Built in ', 'Built ') : t);
  // a fact never splits (non-breaking spaces inside it, the separator stays with the fact before it); facts drop from the end until the line fits one line
  const NB = t => t.replace(/ /g, '\u00a0');
  const factsLine = (w, size) => { const lo = Math.max(F.body, size*.85); for(let n = six.length; n >= 1; n--){ const t = six.slice(0, n).map(NB).join('\u00a0· '); if(FXP.width(t, `${MONT};font-weight:600;font-size:${lo}pt`) <= w) return t; } return NB(six[0] || ''); };

  // ---------- Just Listed / Just Sold words on the box ----------
  const info = (x, y, w, k, o) => {
    o = o || {};
    if(kind === 'oh') return evBlock(x, y, w, k, o.lvl || 0, o);
    const out = []; let yy = y;
    if(kind === 'js'){
      const sl = FXP.soldLine(D);
      const hs = Math.max(F.body*1.6, 18)*Math.min(k, 1.3);
      const h1 = T({slot: 'sold.head', text: sl.head, css: `font-weight:700;color:var(--fx-on-ink)`, x, y: yy, w, max: hs, min: F.body*.8, lines: 1, lh: 1.12});
      out.push(h1.html); yy += h1.h + 3;
      if(sl.line && !o.noLine){ const l2 = T({slot: 'sold.line', text: sl.line, css: `font-weight:500;color:${SOFT}`, x, y: yy, w, max: Math.max(F.body*1.15, 14)*Math.min(k, 1.2), min: F.body, lines: 2, lh: 1.2}); out.push(l2.html); yy += l2.h; }
      yy += 9*Math.min(k, 1.3);
      const ad = addr(x, yy, w, F.ev*1.05*Math.min(k, 1.2), F.ev, TK.onInk); out.push(ad.html); yy += ad.h + 1;
      const pl = T({slot: 'place', text: OHL.place(L).toUpperCase(), css: caps(500, w < 190 ? 1.2 : 2, SOFT), x: x + 1, y: yy, w, max: Math.max(F.small, 11), min: F.small, lh: 1.2, small: 1});
      out.push(pl.html); yy += pl.h;
      return {h: yy - y, html: out.join(''), right: w};
    }
    const ad = addr(x, yy, w, F.ev*1.9*k, F.ev, TK.onInk); out.push(ad.html); yy += ad.h + 1;
    const pl = T({slot: 'place', text: OHL.place(L).toUpperCase(), css: caps(500, w < 190 ? 1.2 : 3, SOFT), x: x + 1, y: yy, w, max: Math.max(F.small*1.15, 11)*Math.min(k, 1.3), min: F.small, lh: 1.2, small: 1});
    out.push(pl.html); yy += pl.h + 8*k;
    const fs = Math.max(F.body*1.1, 14)*Math.min(k, 1.3);
    const fl = T({slot: 'facts', text: factsLine(w, fs), css: `font-weight:600;color:var(--fx-on-ink)`, x, y: yy, w, max: fs, min: F.body, lh: 1.2});
    out.push(fl.html); yy += fl.h;
    if(o.wl > 0){
      const ws = Math.max(F.body, 12.5*Math.min(k, 1.15)), wcls = 'wuF' + String(ws).replace('.', '_') + '_' + Math.round(w);
      if(!document.querySelector('style[data-c="' + wcls + '"]')){ const st = document.createElement('style'); st.dataset.c = wcls; st.textContent = `.${wcls}{font-family:'DM Sans';font-weight:400;font-size:${ws}pt;line-height:${ws*1.4}pt}`; document.head.appendChild(st); }
      let wu = {text: ''};
      for(let n = o.wl; n >= 1; n--){ const r = OHL.writeup(D2, wcls, w, ws*1.4, n, [factsLine(w, fs).replace(/\u00a0/g, ' ')], {narrow: true}); if(r.text && (r.fill >= .75 || r.n === 1)){ wu = r; break; } }
      if(wu.text){ yy += 7*k; out.push(`<div class="abs ${wcls}" style="left:${x}pt;top:${yy}pt;width:${wu.w || w}pt;height:${wu.n*ws*1.4 + 1}pt;color:var(--fx-on-ink-soft)" data-slot="listing.body" data-lines="${wu.n}">${esc(wu.text)}</div>`); yy += wu.n*ws*1.4 + 1; }
    }
    return {h: yy - y, html: out.join(''), right: w};
  };

  // the moment word: light over heavy
  const moment = (x, y, w, o) => {
    const words = (kind === 'js' ? 'Just Sold' : 'Just Listed').split(' '), cc = o.color === TK.onInk ? COPPER_DK : TK.ink2;
    const rich = (a, b) => `<span>${a}</span>${o.stack ? '<br>' : ' '}<span style="font-style:italic;color:${cc}">${b}</span>`;
    if(o.stack){
      const s = Math.min(o.max, FXP.fitSize(words[1], `${SERIF};font-weight:400;letter-spacing:-1pt`, w, o.max, F.ev)), lh = s*1.0;
      return {h: lh*2 + 4, s, html: `<div class="abs" style="left:${x - 1}pt;top:${y}pt;width:${w + 1}pt;height:${lh*2 + 4}pt;${SERIF};font-weight:400;font-size:${s}pt;line-height:${lh}pt;letter-spacing:-1pt;color:${o.color || INK};white-space:nowrap;overflow:hidden" data-slot="moment" data-lines="2">${rich(words[0], words[1])}</div>`};
    }
    const t = T({slot: 'moment', text: words.join(' '), rich: rich(words[0], words[1]), css: `${SERIF};font-weight:400;letter-spacing:-.8pt;color:${o.color || INK}`, x: x - 1, y, w: w + 1, max: o.max, min: F.ev, lh: 1.05});
    return {h: t.h, s: t.s, html: t.html};
  };

  // ---------- the top photo strip: room (arch) + whole house + more rooms, filling the width and never one small photo ----------
  const roomsAll = () => OHL.photos(D).filter(id => id !== hero && !Ivory.fullHouse(D, id)).filter((id, i, arr) => arr.findIndex(o => FXP.fam(o) === FXP.fam(id)) === i);   // never the same room or view twice in a piece
  const minH = (id, fw) => { const p = D.photos[id] || {}; return p.w && p.h && p.house ? OHL.minFrameH(D, id, fw, 99999) : Math.round(fw*.62); };
  const houseAspect = (id) => { const p = D.photos[id] || {}; const lo = (p.w && p.h) ? p.w/p.h : 1.5; const hi = p.w && p.h && p.house ? 1000/minH(id, 1000) : lo; return [lo, Math.max(lo, hi)*.995]; };
  // returns {h, items:[{id,x,w,arch}]}; sw: width, hmax: tallest allowed, ids: room ids to draw from
  const stripPlan = (sw, hmax, hmin, skip) => {
    return null;   // review r1 item 26: one large hero (the exterior, left end rounded), never a room butted against it
    const rooms = roomsAll().filter(id => !(skip || []).includes(id)), g = Math.max(4, Math.round(W*.012)), [alo, ahi] = houseAspect(hero);
    for(const RB of [1.25, 2.4]) for(let h = hmax; h >= hmin; h -= 2){
      for(const a of [1.75, 1.6, 1.9, 1.5, 1.99]){ const aa = Math.min(ahi, Math.max(alo, a));
        for(const n of [1, 2, 3, 4]){

    const sbase = `${SERIF};font-weight:400;color:${TK.ink}`, sizes = [0, 1, 2, 3, 4, 5, 6].map(i => Math.max(F.body*1.55, 17) - i*.9).filter(s => s >= F.body*1.15);
    const sbl = bal([line], sbase, 'sold.line', m + 12, w - 12, sizes, 1.2, .8, false, 3) || {txt: line, w: w - 12, sz: Math.max(F.body*1.2, 15)};
    const body = yy => T({slot: 'sold.line', text: sbl.txt, css: sbase, x: m + 12, y: yy, w: sbl.w, max: sbl.sz, min: sbl.sz, lines: 4, lh: 1.2});
    const b0 = body(0), ad0 = addr(m + 12, 0, w - 12, F.ev*1.35, F.ev, TK.ink, 'address');
    const avail = limit - y - lab.h - 2 - b0.h - 4 - ad0.h - cH - 3*gap, ph = Math.floor(Math.min(avail, w*1.1));   // three gaps are drawn, so the photo takes the rest of the height
    front.push(pic(id, m, y, w, ph)); y += ph + gap + Math.max(0, (avail - ph)/4);
    front.push(rect(m, y + 2, 2.5, lab.h + 2 + b0.h - 4, 'background:var(--fx-bar)'));
    front.push(T({slot: 'sold.label', text: 'JUST SOLD', css: caps(700, 5, TK.ink2), x: m + 12, y, w: w - 12, max: JSS, min: F.ev, lh: 1.05}).html); y += lab.h + 2;
    front.push(body(y).html); y += b0.h + 4;
    front.push(addr(m + 12, y, w - 12, F.ev*1.35, F.ev, TK.ink, 'address').html); y += ad0.h + gap;
    mid.push(contact(m, Math.max(y, limit - cH), w, cOpt).html);
  };

  // ---------- which layout ----------
  if(shape === 'slide' && kind !== 'js' && D.piece.photo === '@close') fxClose();
  else if(shape === 'slide' && kind !== 'js') fxCaption();
  else if(shape === 'slide' && D.piece.photo === hero) fx09();   // Just Sold slide 1: the house, the numerals, "Thinking about selling?"
  else if(shape === 'slide') fxSold2();   // slide 2: a room, SOLD, one line from the agent
  else if(shape === 'wide' || shape === 'gbp') fxSide();
  else if(shape === 'square') fxSquare();
  else fx09();
  bandAll();
  if((kind === 'jl' || kind === 'js') && (shape !== 'slide' || D.piece.photo === hero) && !(front.join('') + mid.join('')).includes('data-slot="moment"')) tiny.push({slot: 'moment', kind: 'label-missing', detail: `the ${kind === 'js' ? 'Just Sold' : 'Just Listed'} lockup is missing on the ${shape}`});
  { const all = front.join('') + mid.join(''); if(!all.includes('data-slot="kicker.left"')) tiny.push({slot: 'kicker.left', kind: 'header-missing', detail: `the shared header (neighborhood, stories, a selling fact) is missing on the ${shape}`}); else if(HEAD.right && !all.includes('data-slot="kicker.right"')) tiny.push({slot: 'kicker.right', kind: 'header-missing', detail: `the fact pair of the shared header is missing on the ${shape}`}); }
  if(kind === 'oh' && shape !== 'slide'){ const all = front.join('') + mid.join(''); [[E.refreshments, 'oh.refreshments'], [E.note, 'oh.note']].forEach(([v, s]) => { if(v && !all.includes('data-slot="' + s + '"')) tiny.push({slot: s, kind: 'perk-dropped', detail: `the REALTOR\u00ae perk "${String(v).slice(0, 40)}" is not on the ${shape}`}); }); }
  return {W, H, issues: tiny, html: `<div class="page" data-page="${esc(D.piece.id)}" style="position:relative;overflow:hidden;width:${W}pt;height:${H}pt;background:var(--fx-paper)">${back.join('')}${front.join('')}${mid.join('')}</div>`};
});
</script>
</body>
