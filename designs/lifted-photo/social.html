<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>lifted-photo social set</title>
<link rel="stylesheet" href="lp-tokens.css">
<script src="../engine/baths.js"></script>
<script src="../engine/ivory.js"></script>
<script src="../engine/ohlib.js"></script>
<script src="../engine/ohemail.js"></script>
<script src="../engine/carousel.js"></script>
<script src="../engine/factrepeat.js"></script>
<script src="../engine/socialset.js"></script>
<script src="lp.js"></script>
<script src="lp-social.js"></script>
<!-- Lifted Photo's Just Listed and Just Sold social sets (owner 11/18/2026). The shared engine (templates/_shared/socialset.js) loads
     the fonts and the data and runs the checks; the layouts are Lifted Photo's own (lp-social.js): the house as a print lifting off
     the kit's paper over a soft shadow, "Just" in ink over "Listed" / "Sold" in the main color in Fraunces, the eyebrow in tracked
     accent caps, round accent marks, the block of the main color along the foot. lp.js is loaded for the set's own highlight list
     (FXS.tagFacts) only. The colors come from the agent's brand kit exactly as the set's print pieces read them (LP.brand in lp.js). -->
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
SocialSet.portrait = LPSocial.portrait; SocialSet.landscape = LPSocial.landscape; SocialSet.slide = LPSocial.slide;
SocialSet.start(D => {
  const b = D.brand || {}, c = b.colors || {}, r = document.documentElement.style;
  const rgb = h => { h = String(h||'').replace('#',''); if(h.length===3) h = h.split('').map(x=>x+x).join(''); const n = parseInt(h,16); return [n>>16&255, n>>8&255, n&255]; };
  const lum = h => { const v = rgb(h).map(q => { q/=255; return q <= .03928 ? q/12.92 : Math.pow((q+.055)/1.055, 2.4); }); return .2126*v[0] + .7152*v[1] + .0722*v[2]; };
  const con = (a, x) => { const p = lum(a), q = lum(x); return (Math.max(p,q)+.05)/(Math.min(p,q)+.05); };
  const on = bg => con(bg, '#ffffff') >= con(bg, '#161616') ? '#ffffff' : '#161616';
  const readable = (fg, bg, min) => con(fg, bg) >= (min || 3) ? fg : on(bg);
  const mix = (a, x, t) => { const p = rgb(a), q = rgb(x); return '#' + p.map((v, i) => Math.round(v + (q[i] - v)*t).toString(16).padStart(2, '0')).join(''); };
  // as LP.colors / LP.brand: the kit's paper is the field, near-black ink, the main color (where it reads on the paper) for the second
  // display line, the labels and the number, the accent (where it reads) for the eyebrow and the round marks; the foot block is the main color itself
  const main = c.main || b.accent || '#2f4a3a', accent = c.accent || b.accent2 || main, paper = b.paper || mix(main, '#ffffff', .93), ink = '#161616';
  r.setProperty('--lp-paper', paper); r.setProperty('--lp-ink', on(paper) === '#ffffff' ? '#ffffff' : ink); r.setProperty('--lp-text', mix(on(paper) === '#ffffff' ? '#ffffff' : ink, paper, .12));
  r.setProperty('--lp-main', readable(main, paper)); r.setProperty('--lp-accent', readable(accent, paper)); r.setProperty('--lp-rule', on(paper) === '#ffffff' ? 'rgba(255,255,255,.35)' : 'rgba(22,22,22,.25)');
  r.setProperty('--lp-band', main); r.setProperty('--lp-on-band', on(main));
});
</script>
</body>
</html>
