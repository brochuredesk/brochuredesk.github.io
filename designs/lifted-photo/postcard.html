<link rel="stylesheet" href="lp.css">
<link rel="stylesheet" href="lp-fo.css">
<script src="lp.js"></script>
<script src="../engine/baths.js"></script>
<script src="../engine/baths-text.js"></script>

<script>window.Ivory = window.Ivory || {esc: s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))};</script>
<script src="lp-fo.js"></script>
<!--
  BrochureDesk · Lifted Photo · Just Listed and Just Sold postcards (the hand of the approved Open House library flyer B01).
  data.piece.card = "listed" | "sold", data.piece.size = "6x11" (trim 792 x 432 pt) | "6x9" (648 x 432 pt), data.piece.side = "front" | "back".
  Print adds 0.125 in (9 pt) bleed. The agent's brand color (brand.accent) is the field on both sides; boxes are white.
  Front: the whole house (roof to steps) on the right with a one-line-or-two caption and a white box under it, the status stacked large on the left over the address,
  the fact rows and the brokerage logo (Just Listed) or the agent's name and number and the logo (Just Sold). No price, no QR.
  Back: status line, interior photos with captions, a white box (the write-up, or the steps), the standard contact card (templates/_shared/agentcard.js,
  band preset, which carries the back's one logo), the fine print. The right 289.5 pt (4.02 in) is the mail vendor's: return address, postage and address
  zones; drawn as guides on proofs and left clear in print.
  Copy comes from data.sw.pc.{jl|js}.{front|back} as a lead plus whole sentences; tf.js picks the sentences that fill each box.
-->
<style>
  /* the FX14 hand on a postcard: white frame, a taupe block, Pinyon Script status, white underlined labels, hairline white boxes; tokens in lp-tokens.css */
  /* B11's hand on a postcard; tokens in lp-tokens.css */
  .pc-col{position:absolute;display:flex;flex-direction:column}
  .pc-wbox{background:var(--lp-tint);border-radius:14pt;color:var(--lp-text);padding:10pt 16pt 9pt;display:flex;flex-direction:column;overflow:hidden}
  .pc-wbox .k{font-family:var(--lp-font);font-weight:600;font-size:8.8pt;line-height:11pt;letter-spacing:2.4pt;text-transform:uppercase;color:var(--lp-main);white-space:nowrap;overflow:hidden;margin-bottom:4pt;align-self:flex-start}
  .pc-wbox .p{font-family:var(--lp-font);font-weight:400;overflow:hidden;color:var(--lp-text)}
  .pc-wbox .p b{font-weight:600;color:var(--lp-ink)}
  .pc-bstatus{position:absolute;white-space:nowrap;overflow:hidden}
  .pc-steps .it{display:flex;gap:9pt;align-items:baseline;white-space:nowrap;overflow:hidden}
  .pc-steps .bx{width:17pt;height:17pt;border-radius:50%;background:var(--lp-accent);color:var(--lp-on-accent,#fff);font-family:var(--lp-disp);font-weight:600;font-size:9.5pt;line-height:17pt;text-align:center;flex:none}
  .pc-call{font-family:var(--lp-disp);font-weight:600;font-size:13pt;line-height:16pt;color:var(--lp-main);white-space:nowrap;overflow:hidden}
  .pc-disc{position:absolute;font-size:6pt;line-height:10pt;color:var(--lp-text);overflow:hidden;white-space:nowrap}
  .pc-ret{position:absolute;font-family:var(--lp-font);font-weight:500;font-size:9pt;line-height:11pt;letter-spacing:.2pt;color:var(--lp-ink);overflow:hidden;height:34pt}
  .pc-ret b{font-weight:600;letter-spacing:1.4pt;text-transform:uppercase;color:var(--lp-main)}
  .cap .a{font-weight:400}
  .cap .a b{font-weight:600;color:var(--lp-ink)}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const esc = SW.esc, b = D.brand || {}, A = D.agent || {}, L = D.listing, P = D.piece || {};
  document.body.dataset.mode = D.mode || 'email';
  await SW.setup(D);
  const sold = P.card === 'sold', big = P.size === '6x11', front = P.side === 'front';
  const W = big ? 792 : 648, H = 432;
  const K = ((D.sw || {}).pc || {})[sold ? 'js' : 'jl'] || {};
  const hsSrc = A.headshot && ((D.photos||{})[A.headshot] ? D.photos[A.headshot].src : A.headshot) || '';
  const statusWord = sold ? 'Just Sold' : 'Just Listed';
  const issues = [];
  const logo = (cls, src, area, maxh, style) => `<div class="logo ${cls}" data-area="${area}" data-maxh="${maxh}" style="${style||''}">${src ? `<img src="${esc(src)}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage||'')}</span>`}</div>`;
  const CL = big ? 13.5 : 12.5, CF = big ? 'font-size:10.9pt;line-height:13.5pt;' : '';   // the 6x11 sets its type up from the 6x9 (11 pt against 9.5), not the same size with more room
  const cap = (c, slot, lines, extra, min) => (c = (c.photo ? FXS.augment(D, c) : c), `<div class="cap" style="height:${5 + lines*CL}pt;${extra||''}"><div class="a" data-min="${min || 2}" data-slot="${slot}" data-narrow="0" data-nstep="6" data-lh="${CL}" data-lines="${lines}" data-lead="${esc(c.lead||'')}" data-s='${esc(JSON.stringify([].concat(c.s||[]))).replace(/'/g,'&#39;')}' style="height:${lines*CL}pt;${CF}"></div></div>`);
  let h = '';

  if(front){
    // The FX14 hand on a postcard front. A white frame top and side, the whole house in it, a taupe block around it with the status in Pinyon Script.
    // JL: "Just Listed" in script beside the house, the horizontal address, three facts; under the house the caption ("Front.", the draws) and the agent and logo along the foot.
    // JS: sells the agent: "Just Sold" in the same script lockup, the name and phone big on the left, the house on the right with the agent's own note, the logo.
    const F = K.front || {};
    const draws = list => { const w = x => /gated|roof|pergola|deck|park|garage|island|stone|corner|pool/i.test([].concat(x)[0]) ? 0 : 1; return (list || []).map((x, i) => [w(x), i, x]).sort((p, q) => p[0] - q[0] || p[1] - q[1]).map(t => t[2]); };
    const capC = sold ? {lead: '', s: (F.note || {}).s || (F.cap || {}).s} : (F.caption ? {lead: F.caption.lead, s: F.caption.s.concat(draws((F.about || {}).s || []))} : {lead: 'Front.', s: draws((F.about || {}).s || (F.cap || {}).s)});
    const norm = x => String(x).toLowerCase().replace(/[^a-z0-9 ]/g, '').slice(0, 40), allAlts = list => [].concat(...(list || []).map(x => [].concat(x)));
    const backSet = new Set([].concat(allAlts(((K.back || {}).about || {}).s), ...((K.back || {}).photos || []).map(c => allAlts(c.s)), allAlts((K.back || {}).steps6), allAlts((K.back || {}).steps)).map(norm));
    const backAll = allAlts(((K.back || {}).about || {}).s).map(String);   // the back's About box
    if(capC.s){ const kept = capC.s.filter(x => ![].concat(x).some(a => backSet.has(norm(a)))); if(kept.length >= 2) capC.s = kept; }
    // the caption's own first sentence stays; a later one that says a fact the back's About box says (the deck and pergola, in other words) drops out
    if(capC.s && capC.s.length > 2){ const tail = capC.s.slice(1).filter(x => ![].concat(x).some(a => backAll.some(b => SW.sameFact(String(a), b)))); if(tail.length >= 1) capC.s = [capC.s[0]].concat(tail); }
    const roomIds = [...new Set([].concat(((D.sw||{}).back||{}).photos||[], ((D.sw||{}).left||{}).photos||[]).map(c => c.photo))].filter(id => (D.photos||{})[id] && !(D.photos[id]||{}).fullHouse && id !== F.cap.photo).slice(0, 2);
    // ---- Lifted Photo fronts (B11 on a card): the paper, the house as a print curling off it, two-tone Fraunces, tracked caps labels. ----
    const k = big ? 1.12 : 1, pid = F.cap.photo, M = 30, DISP = "font-family:Fraunces;font-weight:600;letter-spacing:-.4pt", lsrc = LP.logoSrc(D);
    const rise = (u, lift) => lift*Math.pow(Math.max(0, Math.min(1, u)), 1.7);
    const two = (a, b, x, y, w, ss, slot, align) => `<div class="lp-title" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${ss*1.3}pt;font-size:${ss}pt;line-height:${ss*1.3}pt;text-align:${align || 'left'}" data-slot="${slot}" data-lines="1">${esc(a)}</div><div class="lp-title b" style="left:${x}pt;top:${y + ss*0.96}pt;width:${w}pt;height:${ss*1.3}pt;font-size:${ss}pt;line-height:${ss*1.3}pt;text-align:${align || 'left'}" data-slot="${slot}.1" data-lines="1">${esc(b)}</div>`;
    const street = (x, y, w, max, min, slot) => { const ad = String(L.address || ''); let s = FXS.fitSize(ad, DISP, w - 6, max, min), ls = [ad];
      if(FXS.width(ad, `${DISP};font-size:${s}pt`) > w - 6){ s = Math.max(min, Math.min(max, FXS.fitSize(FXS.street(ad).length > ad.length/2 ? ad.replace(/^(\S+)\s/, '') : ad, DISP, w - 2, max, min))); ls = FO.wrapText(ad, `${DISP};font-size:${s}pt`, w - 2); }
      return {html: `<div class="abs" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${ls.length*s*1.2 + 2}pt;font-family:var(--lp-disp);font-weight:600;font-size:${s}pt;line-height:${s*1.2}pt;letter-spacing:-.4pt;color:var(--lp-ink)" data-slot="${slot}" data-lines="${ls.length}">${ls.map(esc).join('<br>')}</div>`, y: y + ls.length*s*1.2}; };
    const agentBlock = (x, y, w, ns) => { const s = FXS.fitSize(A.name || '', DISP, w, ns, 13);
      return {h: s*1.2 + 15*k, html: `<div class="abs" style="left:${x}pt;top:${y}pt;width:${w}pt"><div style="font-family:var(--lp-disp);font-weight:600;font-size:${s}pt;line-height:${s*1.2}pt;color:var(--lp-ink);white-space:nowrap" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</div><div style="font-family:var(--lp-font);font-weight:600;font-size:${11*k}pt;line-height:${15*k}pt;letter-spacing:.6pt;color:var(--lp-main);white-space:nowrap" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</div></div>`, s}; };
    const logoAt = (x, y, lw2, lh2, just) => `<div class="abs logo" data-area="${lw2*lh2}" data-maxh="${lh2}" style="left:${x}pt;top:${y}pt;width:${lw2}pt;height:${lh2}pt;justify-content:${just || 'flex-end'}">${lsrc ? `<img src="${esc(lsrc)}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage || '')}</span>`}</div>`;
    const hood = FXS.hood(L), eb = (t, x, y, w) => { const fs = Math.max(8.6, FXS.fitSize(t.toUpperCase(), 'font-family:Outfit;font-weight:600;letter-spacing:2.6pt', w, 9.5*k, 8.6)); return `<div class="lp-eyebrow" style="left:${x}pt;top:${y}pt;width:${w}pt;font-size:${fs}pt;letter-spacing:2.6pt" data-slot="front.place" data-lines="1">${esc(t.toUpperCase())}</div>`; };
    if(!sold){
      // JUST LISTED: the house as a print on the right, bleeding off the top, the right edge and the foot, its left edge sweeping out toward the
      // top over a soft shadow (the print lifting at its corner); on the paper beside it JUST / LISTED in two tones as large as the column
      // allows, a hairline, the street, the facts in tracked caps, up to three highlights on round accent marks; at the foot the agent and the logo.
      const PHh = H + 18; let PX = big ? 330 : 282; const minX = big ? 250 : 214;
      while(PX > minX && !SW.fits(D, pid, W + 9 - PX, PHh)) PX -= 6;
      // a wide house that cannot stand whole in a full-height frame: the print stops short of the foot (as tall as its whole house allows),
      // and the agent and the logo move under it on the paper
      let PHf = PHh; const wide = !SW.fits(D, pid, W + 9 - PX, PHh); if(wide){ PX = big ? 330 : 282; while(PHf > 250 && !SW.fits(D, pid, W + 9 - PX, PHf)) PHf -= 6; }
      const fw = W + 9 - PX, hb = FO.houseIn(D, pid, fw, PHf); let lift = 0.15;
      if(hb){ const kk = Math.pow(Math.max(.05, 1 - hb[1]), 1.7); lift = Math.min(lift, (hb[0] - .02)/kk); if(lift < .04) lift = 0; }
      const n = 20, poly = [[1, 0], [1, 1]].concat([...Array(n + 1)].map((_, i) => { const yy = 1 - i/n; return [rise(1 - yy, lift), yy]; }));
      h += `<div class="lp-print" style="left:${PX}pt;top:-9pt;width:${fw}pt;height:${PHf}pt;filter:drop-shadow(-6pt 3pt 8pt rgba(0,0,0,.3))">${SW.photo(D, pid, 'position:absolute;inset:0;' + FO.clip(poly), 'front.hero')}</div>`;
      const TX0 = M, TW = PX - M - 20; let y = M - 6;
      h += eb([hood, L.city].filter(Boolean).join('  ·  '), TX0, y, TW); y += 18*k;
      let ss = Math.min(FXS.fitSize('Listed', DISP, TW - 4, 88*k, 40), 88*k);
      // owner 11/16 (p45 carried to the 6x11): the 6x11 carries the same five or six highlights at 16.5 pt (1.08x+ the 6x9's); the
      // status gives up only the height those rows need (it stays the largest thing on the card)
      if(big){ const tgN = FXS.tagFacts(D).tags.filter((t, i, arr) => !arr.slice(0, i).some(u => SW.sameFact(t, u))).filter(t => FXS.width(t, 'font-family:Outfit;font-weight:400;font-size:16.5pt') < TW - 26).length,
          nW = Math.min(6, tgN), stH = street(TX0, 0, TW, 23*k, 14, 'x').y, footY0 = wide ? H - M + 6 : H - Math.round(62*k),
          room0 = footY0 - 8 - (y + ss*1.96 + 6*k + 10*k + stH + 4*k + 22*k), need = nW*16.5*1.24;
        if(room0 < need) ss = Math.max(64, ss - (need - room0)/1.96); }
      h += two('Just', 'Listed', TX0 - 2, y - ss*0.12, TW + 4, ss, 'front.status'); y += ss*1.96 + 6*k;
      h += FO.hair(TX0, y, TW); y += 10*k;
      const ST = street(TX0, y, TW, 23*k, 14, 'front.address'); h += ST.html; y = ST.y + 4*k;
      { const fcss = 'font-family:Outfit;font-weight:600;letter-spacing:1.6pt', cells = FO.factParts(L, true).map(p => (p.n + ' ' + p.l).toUpperCase()); let cs = cells.slice(0, 3); while(cs.length > 1 && FXS.width(cs.join(' · '), fcss + ';font-size:8.6pt') > TW) cs.pop();
        const ft = cs.join('  ·  '), fs = FXS.fitSize(ft, fcss, TW, 10*k, 8.6);
        h += `<div class="abs" style="left:${TX0}pt;top:${y}pt;width:${TW}pt;height:${14*k}pt;font-family:var(--lp-font);font-weight:600;font-size:${fs}pt;line-height:${14*k}pt;letter-spacing:1.6pt;color:var(--lp-main);white-space:nowrap" data-slot="front.fact" data-lines="1">${esc(ft)}</div>`; y += 14*k + 8*k; }
      const FH = Math.round(62*k), footY = wide ? H - M + 6 : H - FH;
      const tg0 = FXS.tagFacts(D).tags.filter(t => FXS.width(t, `font-family:Outfit;font-weight:400;font-size:${10.5*k}pt`) < TW - 16).filter((t, i, arr) => !arr.slice(0, i).some(u => SW.sameFact(t, u)));
      const rank = t => /\b(19|20)\d\d\b/.test(t) ? 0 : /^new\b|replaced|updated|remodel|renovat|added\b/i.test(t) ? 1 : 2, tg = tg0.map((t, i) => [rank(t), i, t]).sort((p, q) => p[0] - q[0] || p[1] - q[1]).map(x => x[2]);
      // owner 11/16 (Book 3 p45): the 6x9 front carries five or six highlights in larger type that fill the space down to the foot rule;
      // the 6x11 front carries the same (owner's changes-carry rule), at 1.08x+ the 6x9's type
      const room = footY - 8 - y; let rh = 19*k, hfs = 10.5*k, nT = Math.max(0, Math.min(big ? 6 : 3, tg.length, Math.floor(room/(big ? 16.5*1.2 : rh)))); if(big && nT) rh = Math.min(30*k, room/nT);
      if(!big){ nT = Math.max(0, Math.min(6, tg.length, Math.floor(room/18))); rh = nT ? Math.min(30, room/nT) : rh;
        // owner 11/16 (p45, second pass): the longest bullet runs about 90% of the column; never larger than the street line, never so big the rows crowd
        const stS = +((/font-size:([\d.]+)pt/.exec(ST.html) || [])[1] || 23), lw = f => Math.max(...tg.slice(0, nT).map(t => FXS.width(t, `font-family:Outfit;font-weight:400;font-size:${f}pt`))) + 8 + Math.max(6, f*0.5);
        hfs = Math.min(stS, rh*0.78, 15); while(hfs > 10.5 && lw(hfs) > TW*0.9) hfs -= 0.25; }
      else { hfs = Math.min(16.5, rh*0.82); while(hfs > 10.5*k && tg.slice(0, nT).some(t => FXS.width(t, `font-family:Outfit;font-weight:400;font-size:${hfs}pt`) > TW - 16 - 8*k)) hfs -= 0.25; }   // the 6x11's type stays 1.08x the 6x9's
      const ty = y + Math.max(0, (room - nT*rh)/2), dot = Math.max(6, hfs*0.5);
      tg.slice(0, nT).forEach((t, i) => { h += `<div class="abs" style="left:${TX0}pt;top:${ty + i*rh}pt;width:${TW}pt;height:${rh}pt;display:flex;align-items:center;gap:${8*k}pt;white-space:nowrap;overflow:hidden"><span style="width:${dot}pt;height:${dot}pt;border-radius:50%;background:var(--lp-accent);flex:none"></span><span style="font-family:var(--lp-font);font-weight:400;font-size:${hfs}pt;line-height:${rh}pt;color:var(--lp-ink)" data-slot="front.hl.${i}" data-lines="1">${esc(t)}</span></div>`; });
      if(!wide){ h += FO.hair(TX0, footY, TW);
        const lgW = Math.min(110*k, TW*0.42), lgH = 34*k, AB = agentBlock(TX0, 0, TW - lgW - 10, 19*k), ay = footY + (FH - AB.h)/2 - 2;
        h += AB.html.replace('top:0pt', `top:${ay}pt`) + logoAt(TX0 + TW - lgW, footY + (FH - lgH)/2 - 2, lgW, lgH); }
      else { const fx = PX + 22, fwd = W - M - fx, lgW = Math.min(124*k, fwd*0.4), lgH = 38*k, AB = agentBlock(fx, 0, fwd - lgW - 16, 22*k), ay = H - M + 11 - AB.h;
        h += FO.hair(fx, ay - 10, fwd) + AB.html.replace('top:0pt', `top:${ay}pt`) + logoAt(W - M - lgW, ay + (AB.h - lgH)/2, lgW, lgH); }
    } else {
      // JUST SOLD (not the Just Listed card mirrored): the house is a snapshot set down on the paper, a print tilted a little with the sign-in
      // sheet's one soft corner and a soft shadow; beside it JUST / SOLD in two tones (about twice the agent's name), the street right under
      // it, the seller question in accent caps, the agent's note, a hairline, who to call and the one logo. No house features.
      let PW = Math.round(W*0.5), PHh = H - 2*40;
      while(PHh > 230 && !SW.fits(D, pid, PW, PHh)) PHh -= 6;
      while(PW < W*0.58 && !SW.fits(D, pid, PW, PHh)) PW += 6;
      const PX = M + 2, PY = H - M - 6 - PHh, hb = FO.houseIn(D, pid, PW, PHh), soft = !hb || hb[0] > 0.12 || hb[3] < 0.86;
      h += `<div class="lp-print" style="left:${PX}pt;top:${PY}pt;width:${PW}pt;height:${PHh}pt;transform:rotate(-1.6deg);filter:drop-shadow(0 6pt 9pt rgba(0,0,0,.3))">${SW.photo(D, pid, 'position:absolute;inset:0;' + (soft ? 'border-radius:0 0 0 58pt / 0 0 0 40pt' : ''), 'front.hero')}</div>`;
      const CX = PX + PW + 30*k, CWd = W - M - CX; let y = M - 2;
      const ss = Math.min(FXS.fitSize('Just', DISP, CWd - 4, 76*k, 40), FXS.fitSize('Sold', DISP, CWd - 4, 76*k, 40));
      h += two('Just', 'Sold', CX - 2, y - ss*0.12, CWd + 4, ss, 'front.status'); y += ss*1.96 + 4*k;
      const ST = street(CX, y, CWd, 22*k, 13, 'front.address'); h += ST.html; y = ST.y + 8*k;
      h += `<div class="lp-eyebrow" style="left:${CX}pt;top:${y}pt;width:${CWd}pt;font-size:${Math.max(8.6, FXS.fitSize('THINKING ABOUT SELLING?', 'font-family:Outfit;font-weight:600;letter-spacing:2.4pt', CWd, 10*k, 8.6))}pt;letter-spacing:2.4pt" data-slot="front.cta" data-lines="1">Thinking about selling?</div>`; y += 13*k + 7*k;
      const AB = agentBlock(CX, 0, CWd - 96*k - 8, 22*k), agY = H - M - AB.h + 2, lh = 13.6*k, nmax = Math.max(3, Math.min(6, Math.floor((agY - 14*k - y)/lh)));
      if(y + 3*lh > agY - 10) issues.push({slot: 'front.note', kind: 'overflow', detail: 'the note runs into the agent'});
      h += `<div class="abs cap side" data-ph-top="${y - 22}" data-ph-h="${agY - 14*k - y + 22}"><div class="a" id="jsnote-a" style="position:absolute;left:${CX}pt;top:${y}pt;width:${CWd}pt;height:${nmax*lh}pt;font-size:${10*k}pt;line-height:${lh}pt;color:var(--lp-text)" data-slot="front.note" data-lh="${lh}" data-lines="${nmax}" data-min="3" data-narrow="0" data-flexh="1" data-maxfs="${big ? 15 : 13.5}" data-agy="${agY}" ${FXS.sd(capC.s || [])}></div></div>`;
      h += `<div class="lp-hair" id="jshair" style="left:${CX}pt;top:${agY - 8*k}pt;width:${CWd}pt"></div>`;
      h += AB.html.replace('top:0pt', `top:${agY}pt`) + logoAt(W - M - 96*k, agY + (AB.h - 32*k)/2, 96*k, 32*k);
    }
  } else {
    // ---------------- BACK (owner 11/16/2026: the design runs the full width; the contact block is much shorter). The set's own moves run
    // edge to edge across the whole card, the mail side included: on the Just Listed back a strip of room prints across the top whose feet
    // follow ONE sweep (lowest at the left, lifting toward the right, the inside spread's curve), on the Just Sold back a band in the main
