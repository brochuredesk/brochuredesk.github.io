<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · Black Rules postcards</title>
<link rel="stylesheet" href="br.css">
<link rel="stylesheet" href="br-fo.css">
<script src="br.js"></script>
<script src="../engine/baths.js"></script>
<script src="../engine/agentcard.js"></script>
<script src="../engine/factrepeat.js"></script>
<script>window.Ivory = window.Ivory || {esc: s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))};</script>
<script src="br-fo.js"></script>
<!--
  BrochureDesk · Black Rules · Just Listed and Just Sold postcards, in the hand of the approved Open House library flyer P39 Black Rules
  (templates/oh-library/p39-black-rules*.html) and its sign-in sheet: white paper, heavy rules in the kit's dark, Red Hat Display caps
  tracked wide as the one display line, the split line, P39's grid on 8 pt gutters, the sign-in sheet's dark squares, Libre Franklin.
  data.piece.card = "listed" | "sold", data.piece.size = "6x11" (trim 792 x 432 pt) | "6x9" (648 x 432 pt), data.piece.side = "front" | "back".
  FRONTS. Just Listed: P39's head across the card (5 pt bar, JUST LISTED, 2 pt rules, street | place), the whole house two thirds wide and
  a ruled column with the highlights, the agent and the logo; the 4 pt bar. Just Sold, its own card: the bar grown into a slab across the
  head with JUST SOLD and the street in white; the seller question, the note in P39's framed box, who to call and the logo; the house whole.
  BACKS (the owner 11/16: the design runs through the whole card): P39's head runs in from the left bleed; the rooms (Just Listed) or the
  six steps on the sign-in sheet's numbered rows (Just Sold); the mail column is a photo off the head with the postage markup set in it,
  then the kit's dark down to the foot slab that runs across the card with the contact row (one line) and the barcode markup. No price, no QR.
-->
<style>
  .pc-steps .it{position:absolute}
  .pc-steps .num{position:absolute;display:flex;align-items:center;justify-content:center;font-family:'Red Hat Display';font-weight:700;color:#fff;background:var(--br-ink)}
  .br-ccd{--cc-ink:#ffffff;--cc-muted:var(--br-soft-main);--cc-accent:#ffffff;--cc-line:rgba(255,255,255,.7);--cc-paper:transparent}
  .pc-steps .stp{position:absolute;font-family:var(--br-font);font-weight:400;color:#1b1b1b;overflow:hidden}
  .pc-disc{position:absolute;font-family:var(--br-font);font-size:8.6pt;line-height:11pt;font-weight:400;color:var(--br-soft-main);overflow:hidden;white-space:nowrap}
  .pc-ret{position:absolute;font-family:var(--br-font);font-weight:400;font-size:8.6pt;line-height:11pt;color:#fff;overflow:hidden;height:36pt}
  .pc-ret b{font-weight:700;letter-spacing:1.4pt;text-transform:uppercase}
  .mailp{position:absolute;background:#fff;z-index:4}
  .cap .a{font-weight:400}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const esc = SW.esc, b = D.brand || {}, A = D.agent || {}, L = D.listing, P = D.piece || {};
  document.body.dataset.mode = D.mode || 'email';
  await SW.setup(D);
  const sold = P.card === 'sold', big = P.size === '6x11', front = P.side === 'front';
  const W = big ? 792 : 648, H = 432, k = big ? 1.12 : 1;
  const K = ((D.sw || {}).pc || {})[sold ? 'js' : 'jl'] || {};
  const hsSrc = A.headshot && ((D.photos||{})[A.headshot] ? D.photos[A.headshot].src : A.headshot) || '';
  const word = sold ? 'Just Sold' : 'Just Listed';
  const issues = [];
  const ad = String(L.address || ''), hood = FXS.hood(L), city = FO.city(L);
  const RH = "font-family:'Red Hat Display';font-weight:700", LFm = "font-family:'Libre Franklin'";
  const desT = A.designation ? (A.nar || /realtor/i.test(A.designation) ? 'REALTOR®' : A.designation) : '';
  const logoAt = (x, y, w, hh, src, just) => `<div class="abs logo" data-area="${w*hh}" data-maxh="${hh}" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${hh}pt;justify-content:${just || 'center'}">${src ? `<img src="${esc(src)}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage || '')}</span>`}</div>`;
  // the agent: name in Red Hat Display 700, REALTOR(R) in the label, the phone in Libre Franklin 700
  const agentLine = (x, y, w, al, ns, white, nl) => { nl = nl || 1.15; const c = white ? '#fff' : 'var(--br-on)', cl = white ? '#fff' : 'var(--br-accent)';
    return `<div class="abs" style="left:${x}pt;top:${y}pt;width:${w}pt;text-align:${al || 'left'};white-space:nowrap">`
      + `<div style="${RH};font-size:${ns}pt;line-height:${ns*nl}pt;color:${c}" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</div>`
      + `<div style="line-height:${13*k}pt">${desT ? `<span style="${LFm};font-weight:700;font-size:${8.6*k}pt;letter-spacing:1.6pt;color:${cl};margin-right:10pt" data-slot="agent.desig" data-lines="1">${esc(desT)}</span>` : ''}<span style="${LFm};font-weight:700;font-size:${12*k}pt;color:${c}" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</span></div></div>`; };
  let h = '';
  // the Just Sold note (owner 11/17, p49/p51): the note's own sentences in order (the first two always: the sale and what their home could
  // bring; each later one in or out, any of its wordings), set at the size and length that fill the box best: three lines or more, every line
  // full (86%+ before justifying, so the word gaps stay even; the last 90%+)
  // returns every candidate, best first (the strictest pass first); the first is placed, and after layout fixNote() keeps the first one
  // the browser really sets in its counted lines with the last line 91%+ full
  function noteFill(S, w, room, css, fmax, fmin, lhK){ const all = []; let pass = 0; for(const [lf, of, f0] of [[0.93, 0.86, fmin], [0.92, 0.8, fmin], [0.92, 0.8, fmin - 0.75], [0.85, 0.7, fmin - 0.75]]) all.push(...noteFill1(S, w, room, css, fmax, f0, lhK, lf, of).map(c => Object.assign(c, {sc: c.sc - 6*pass})).filter(c => !all.some(a => a.t === c.t && a.fs === c.fs))), pass++; all.sort((a, b) => b.sc - a.sc); return all.length ? all : null; }
  function noteFill1(S, w, room, css, fmax, fmin, lhK, lf, of){ const sets = (S || []).map(x => [].concat(x)), cands = [];
    const walk = (i, acc) => { if(i === sets.length){ if(acc.length) cands.push(acc.join(' ')); return; } if(i > 1) walk(i + 1, acc); sets[i].forEach(a => walk(i + 1, acc.concat(a))); };
    if(sets.length) walk(0, []);
    const ok = cands.filter(t => (t.match(/\btoo\b/gi) || []).length < 2 && (t.match(/\bready\b/gi) || []).length < 2 && !SW.sameFactIn(t) && !SW.rep5(t)); const best = [];
    for(let fs = fmax; fs >= fmin - 1e-6; fs -= 0.25){ const lh = fs*lhK, nmax = Math.floor((room + 0.5)/lh); if(nmax < 3) continue;
      ok.forEach(t => { const Lw = FO.wrapLines(t, `${css};font-size:${fs}pt`, w - 1), n = Lw.length;   // the note box is set 2 pt narrower (w - 2) and wrapLines breaks past w - 2: the same breaks as the browser
        if(n < 3 || n > nmax || Lw[n - 1] < lf*w || Lw.slice(0, -1).some(x => x < of*w)) return;
        best.push({sc: Math.min(1, n*lh/room)*100 + fs*5, t, n, fs, lh}); }); }
    return best.sort((a, b) => b.sc - a.sc).slice(0, 80); }

  if(front){
    const F = K.front || {}, pid = FO.heroId(D, (F.cap || {}).photo || 'front');
    const hls = (F.highlights || FXS.tagFacts(D).tags || []).slice(0, 3);
    const m = 24, CWc = W - 2*m;
    if(!sold){
      // ---------- JUST LISTED: P39's head across the card (the 5 pt bar, JUST LISTED as the display line, a 2 pt rule, the split line with the
      // street | the place, a 2 pt rule), then P39's grid: the whole house two thirds wide and a ruled column beside it with the highlights,
      // the agent and the logo; the 4 pt bar closes the card. ----------
      let y = 20; h += FO.bar(m, y, CWc, 5); y += 5 + 7;
      const d = FO.disp('Just Listed', m, y, CWc, 74*k, 40, 'front.status', {lh: 1.04}); h += d.html; y += d.h + 4;
      h += FO.r2(m, y, CWc); y += 2;
      const sh = 30*k; h += FO.split(ad, [hood, city].filter(Boolean).join('  ·  '), m, y, CWc, sh, 'front.split', {caps: false, fs: 16*k, lfont: "'Red Hat Display'"}); y += sh;
      h += FO.r2(m, y, CWc); y += 2 + 8;
      const PB = H - 30, ph = PB - y, pw = FO.fitW(D, pid, Math.round((CWc - 14)*0.62), ph, CWc*0.46, CWc*0.76);
      h += FXS.box(D, pid, m, y, pw, ph, 'front.hero', '', 0);
      const cx = m + pw + 16, cw = W - m - cx, hf = Math.min(13*k, ...hls.map(t => FXS.fitSize(t, `${LFm};font-weight:600`, cw - 16, 13*k, 9.5)));
      const ns = Math.min(18*k, FXS.fitSize(A.name || '', RH, cw, 18*k, 11)), ah = ns*1.15 + 13*k, lgH = 34*k, foot = 2 + 12 + ah + 8 + lgH;
      const rh = Math.min(44*k, (ph - 17 - foot - 10)/Math.max(1, hls.length));
      let t = FO.k('Highlights', cx, y, cw, 'front.hlk');
      hls.forEach((x, i) => { const ry = y + 17 + i*rh; t += FO.r1(cx, ry, cw) + `<div class="abs" style="left:${cx}pt;top:${ry + (rh - hf*1.4)/2}pt;width:${cw}pt;height:${hf*1.4}pt;${LFm};font-weight:600;font-size:${hf}pt;line-height:${hf*1.4}pt;color:var(--br-on);white-space:nowrap" data-slot="front.hl.${i}" data-lines="1"><span style="display:inline-block;width:5pt;height:5pt;background:var(--br-ink);margin-right:9pt;vertical-align:1.5pt"></span>${esc(x)}</div>`; });
      const fy = PB - foot; t += FO.r2(cx, fy, cw);
      t += agentLine(cx, fy + 14, cw, 'left', ns) + logoAt(cx, PB - lgH, cw, lgH, BR.logoPaper(D), 'flex-start');
      h += t + FO.bar(m, H - 22, CWc, 4);
    } else {
      // ---------- JUST SOLD, its own card: the bar grown into the slab across the head, JUST SOLD in white as the display line and the street
      // right under it; below, the seller question between 2 pt rules, the note in P39's framed box, who to call and the logo on the left;
      // the house whole on the right. ----------
      const d = FO.disp('Just Sold', m, 12, CWc, 96*k, 40, 'front.status', {lh: 0.98, css: 'color:#fff'}), stl = hood ? `${ad}  ·  ${hood}` : ad, sts = Math.min(34*k, FXS.fitSize(stl, RH, CWc*0.92, 34*k, 12))   /* a short street sets larger across the slab, the slab snug around both lines (owner 11/17 fill rule) */, sty = 22 + d.h - 4 /* the street stays put; JUST SOLD rides 10 pt higher, centered between the card top and the street (owner book 3 p10, carried) */, SH = Math.round(sty + sts*1.2 + 22);   /* JUST SOLD and the street centered top to bottom in the slab (owner 11/17, heading-uncentered) */
      h += `<div class="br-slab" style="left:-9pt;top:-9pt;width:${W + 18}pt;height:${SH + 9}pt"></div>` + d.html;
      h += `<div class="br-street" style="left:${m}pt;top:${sty}pt;width:${CWc}pt;height:${sts*1.2}pt;font-size:${sts}pt;line-height:${sts*1.2}pt;color:#fff;text-align:center" data-slot="front.address" data-lines="1">${esc(ad)}${hood ? `<span style="opacity:.72">&nbsp;&nbsp;·&nbsp;&nbsp;</span><span data-slot="front.hood">${esc(hood)}</span>` : ''}</div>`;   /* the street runs the slab's width with its neighborhood (owner 11/17 fill rule) */
      const top = SH + 10, PB = H - 22, ph = PB - top; const pw = FO.fitW(D, pid, Math.round(CWc*(big ? 0.55 : 0.54)), ph, CWc*0.42, CWc*0.68);   // the 6x11 photo a little wider: its photo area scales with the card
      const px = W - m - pw; h += FXS.box(D, pid, px, top, pw, ph, 'front.hero', '', 0);
      const cx = m, cw = px - 18 - cx, q = 'Thinking about selling?', qs = FXS.fitSize(q.toUpperCase(), `${RH};letter-spacing:1pt`, cw, 17*k, 10);
      const ns = Math.min(18*k, d.fs*0.45, FXS.fitSize(A.name || '', RH, cw, 18*k, 11)), ah = ns*1.25 + 13*k, lgH = 34*k;   // the agent's name and the logo under it a size up: the column's foot full
      // owner 11/17 (p49/p51): the framed box grows to fill the room between the rule and the agent, with a longer write-up centered in it
      // the logo beside the agent where the column has room for it (the foot of the column full, the box taller), else under it as before
      const aw = Math.max(FXS.width(A.name || '', `${RH};font-size:${ns}pt`), (desT ? FXS.width(desT, `${LFm};font-weight:700;font-size:${8.6*k}pt;letter-spacing:1.6pt`) + 10 + desT.length*1.6 : 0) + FXS.width(A.phone || '', `${LFm};font-weight:700;font-size:${12*k}pt`));
      const side = cw - aw - 18 >= 70*k, lgS = Math.min(ah + 4, 40*k);
      const nb = 12*k, iw = cw - 2*nb, foot = side ? ah : ah + 8 + lgH, bY = top + qs*1.3 + 8 + 2 + 14, boxH = PB - foot - 16 - bY;
      // the note's type: 11 to 12.25 pt on the 6x9 and 13.5 to 15 pt on the 6x11, so the larger card always sets it at least 10% larger
      await document.fonts.load(`400 12pt 'Libre Franklin'`);   // the note is measured in its own face, never a fallback
      const ntL = noteFill((F.note || {}).s, iw, boxH - 2*nb, `${LFm};font-weight:400`, big ? 17.5 : 12.5, big ? 14 : 10.75, 1.4); let nt = ntL && ntL[0];
      if(!nt){ const t = (F.note2 || [])[0] || '', fs = 11*k; nt = {t, n: FO.wrapLines(t, `${LFm};font-weight:400;font-size:${fs}pt`, iw).length, fs, lh: fs*1.4}; }
      let y = top;
      h += `<div class="br-disp" style="left:${cx}pt;top:${y}pt;width:${cw}pt;height:${qs*1.3}pt;font-size:${qs}pt;line-height:${qs*1.3}pt;letter-spacing:1pt;text-align:left" data-slot="front.cta" data-lines="1">${esc(q)}</div>`; y += qs*1.3 + 8;
      h += FO.r2(cx, y, cw);
      const nty = bY + nb + Math.max(0, (boxH - 2*nb - nt.n*nt.lh)/2);
      window.__noteC = {args: [(F.note || {}).s, iw, boxH - 2*nb, `${LFm};font-weight:400`, big ? 17.5 : 12.5, big ? 14 : 10.75, 1.4], list: ntL || [], top: bY + nb, room: boxH - 2*nb};
      h += `<div class="br-box" id="notebox" style="left:${cx}pt;top:${bY}pt;width:${cw}pt;height:${boxH}pt"></div><div class="abs" style="left:${cx + nb}pt;top:${nty}pt;width:${iw - 2}pt;height:${nt.n*nt.lh}pt;${LFm};font-weight:400;font-size:${nt.fs}pt;line-height:${nt.lh}pt;color:#1b1b1b;text-align:justify;text-align-last:left" data-slot="front.note" data-lines="${nt.n}">${esc(nt.t)}</div>`;
      h += agentLine(cx, PB - foot, cw, 'left', ns, false, 1.25) + (side ? logoAt(cx + aw + 18, PB - foot + (ah - lgS)/2, cw - aw - 18, lgS, BR.logoPaper(D), 'center') : logoAt(cx, PB - lgH, cw, lgH, BR.logoPaper(D), 'flex-start'));
    }
  } else {
    // ---------------- BACK (the owner 11/16: the design runs through the whole card; the mail zones are small white markups) ----------------
    // Black Rules: P39's head runs across the white side from the left bleed (5 pt bar, the display line, 2 pt rules, the split line), the
    // rooms (Just Listed) or the six steps on the sign-in sheet's numbered rows (Just Sold) under it. The mail column is the set's photo and
    // slab: a photo bleeding off the head and the right side with the postage markup set into it and the return address on a dark tag, then
    // the kit's dark running down to the foot, where it turns and runs across the whole card as the foot slab with the contact row (half
    // height, one line) and the barcode markup.
    const dx = W - 648, B = K.back || {}, X = 30;
    const Z = {postage: [552 + dx, 12, 84, 98.25], address: [405 + dx, 187.5, 240, 112.5], barcode: [306 + dx, 387, 342, 45]};
    window.__zones = Z; window.__cardX = X;
    const mk = (z, mm, ext) => `<div class="mailp" data-mail-panel="1" style="left:${z[0] - mm}pt;top:${z[1] - mm}pt;width:${z[2] + 2*mm + (ext || 0)}pt;height:${z[3] + 2*mm + (ext || 0)}pt"></div>`;
    const FB = 330, PB = 172, rid0 = sold ? FO.heroId(D, ((K.front || {}).cap || {}).photo || 'front') : null;
    let ext = 0; if(sold && big) for(const e of [52, 40, 28, 16, 0]){ if(SW.fits(D, rid0, 318 + 9 + e, PB + 9)){ ext = e; break; } }   // the 6x11 Just Sold back: the sold house wider (the 6x11 scale rule) when the whole house still shows
    const RX = W - 318 - ext;
    // the mail column: the photo, the slab under it, the foot slab
    const rid = sold ? FO.heroId(D, ((K.front || {}).cap || {}).photo || 'front') : (B.top || (((D.sw || {}).plan || {}).br || {}).backTop || ((B.photos || [])[2] || {}).photo);
    if(rid) h += FXS.box(D, rid, RX, -9, W - RX + 9, PB + 9, 'back.mailphoto', '', 0);
    h += `<div class="br-slab" style="left:${RX}pt;top:${PB}pt;width:${W - RX + 9}pt;height:${FB - PB}pt"></div><div class="br-slab" style="left:-9pt;top:${FB}pt;width:${W + 18}pt;height:${H + 9 - FB}pt"></div>`;
    const ret = [b.brokerage || ''].concat([].concat(b.returnAddress || b.address || []).flatMap(a => String(a).split('\n'))).filter(Boolean).slice(0, 3);
    { const rw = Math.max(...ret.map((t, i) => FXS.width(i ? t : t.toUpperCase(), `${LFm};font-weight:${i ? 400 : 700};font-size:8.6pt;letter-spacing:${i ? 0 : 1.4}pt`))) + 4, rx = Z.postage[0] - 14 - rw - 10;
      h += `<div class="br-slab" style="left:${rx}pt;top:${Z.postage[1] - 4}pt;width:${rw + 20}pt;height:${ret.length*11 + 12}pt"></div>`;
      h += `<div class="pc-ret" data-small="1" data-fine="1" data-slot="back.return" style="left:${rx + 10}pt;top:${Z.postage[1] + 2}pt;width:${rw}pt;text-align:right;height:${ret.length*11}pt"><b>${esc(ret[0] || '')}</b>${ret.slice(1).map(t => '<br>' + esc(t)).join('')}</div>`; }
    // the white side: P39's head, the bars running in from the left bleed to the mail column
    const wx = 24, ww = RX - 14 - wx; let y = 18;
    h += FO.bar(-9, y, RX + 9, 5); y += 5 + 6;
    const d = FO.disp(word, wx, y, ww, sold ? 36*k : 40*k, 22, 'back.status', {lh: 1.04}); h += d.html; y += d.h + 3;
    h += FO.r2(-9, y, RX + 9); y += 2;
    const sh = 24*k, st = FXS.width(ad, `${LFm};font-weight:700;font-size:${12.5*k}pt`) + FXS.width(city.toUpperCase(), `${LFm};font-weight:700;font-size:${12.5*k}pt;letter-spacing:1.6pt`) + 24 <= ww ? city : '';
    h += FO.split(ad, st, wx, y, ww, sh, 'back.split', {caps: false, fs: 12.5*k, lfont: "'Red Hat Display'"}); y += sh;
    h += FO.r2(-9, y, RX + 9); y += 2 + 10;
    const CL = big ? 13.5 : 12.5, fsC = big ? 10 : 9.25;
    if(!sold){
      const ps = (B.photos || []).filter(c => c.photo !== rid).slice(0, 2), gp = 16, Lc = 3, capTop = FB - 10 - Lc*CL, PBb = capTop - 18 - 7, PT = y, pw = (ww - gp)/2;
      ps.forEach((c, i) => { const x = wx + i*(pw + gp);
        h += FXS.box(D, c.photo, x, PT, pw, PBb - PT, 'back.photo' + i, '', 0);
        const cc = FXS.augment(D, c), L0 = FXS.leadLabel(cc.lead);
        h += `<div class="abs" style="left:${x}pt;top:${PBb + 7}pt;width:${pw}pt;white-space:nowrap"><div class="lbl" data-slot="back.photo${i}.label" data-lines="1" style="max-width:${pw}pt">${esc(L0.name.toUpperCase())}</div></div>`;
        h += `<div class="abs cap"><div class="a" style="position:absolute;left:${x}pt;top:${capTop}pt;width:${pw}pt;height:${Lc*CL}pt;font-size:${fsC}pt;line-height:${CL}pt" data-slot="back.photo${i}" data-room="${esc(L0.name)}" data-lh="${CL}" data-hbox="${Lc*CL}" data-lines="${Lc}" data-min="3" data-narrow="0" data-nopair="1" ${FXS.sd(cc.s)}></div></div>`; });
      h += FO.v1(wx + pw + gp/2, capTop - 20, FB - 8 - (capTop - 20));
    } else {
      // the six steps as the sign-in sheet's rows: a dark square with the white number, the step, a hairline under every row; then the question
      const steps = (B.stepsLong || B.help || B.steps6 || []).slice(0, 6);
      if(steps.length < 6) issues.push({slot: 'back.steps', kind: 'fewer-than-six-bullets', detail: `${steps.length} bullets; the Just Sold back carries six`});
      const by = y - 2, bh = FB - 12 - by;
      h += `<div class="abs" id="stepsbox" data-bh="${bh}" style="left:${wx}pt;top:${by}pt;width:${ww}pt;height:${bh}pt"></div>`;
      h += `<div class="pc-steps" id="stepslist" data-x="${wx}" data-y="${by}" data-w="${ww}" data-b="${by + bh}">${steps.map((e, i) => `<div class="it" data-i="${i}"><div class="num">${i + 1}</div><div class="stp" data-slot="back.step${i}" data-lines="2" data-fine="1">${esc([].concat(e)[0])}</div><div class="br-r1" style="left:0;bottom:0;width:100%"></div></div>`).join('')}</div>`;
      h += `<div id="jsq"><div class="br-disp" data-slot="back.cta" data-lines="1">Thinking about selling?</div><div data-slot="back.sold" data-lines="1">Ask me what your home would bring today.</div></div>`;
    }
    const cardY = FB + 10, cardH = 44;
