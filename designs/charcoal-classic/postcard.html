<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · Charcoal Classic postcards</title>
<link rel="stylesheet" href="ch.css">
<link rel="stylesheet" href="ch-fo.css">
<script src="ch.js"></script>
<script src="../engine/baths.js"></script>
<script src="../engine/agentcard.js"></script>
<script src="../engine/factrepeat.js"></script>
<script>window.Ivory = window.Ivory || {esc: s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))};</script>
<script src="ch-fo.js"></script>
<!--
  BrochureDesk · Charcoal Classic · Just Listed and Just Sold postcards (the hand of the approved Open House library flyer P10).
  data.piece.card = "listed" | "sold", data.piece.size = "6x11" (792 x 432 pt) | "6x9" (648 x 432 pt), data.piece.side = "front" | "back". Print adds 9 pt bleed.
  Fronts: Just Listed, the house to a seam with the charcoal an L around it (status column, agent strip); Just Sold, the house full height
  beside the ruled lockup, the question and the note on the pale card. Backs: the charcoal and its slate foot band run the full width; the
  mail zones are small light markups. Copy comes from data.sw.pc.{jl|js}.{front|back}; ch.js picks the sentences that fill each box.
-->
<style>
  /* Charcoal Classic postcards; tokens in ch-tokens.css. Font properties one by one. */
  .pc-col{position:absolute;display:flex;flex-direction:column}
  .pc-wbox{background:var(--ch-lift);color:var(--fx-soft);padding:10pt 16pt 9pt;display:flex;flex-direction:column;overflow:hidden}
  .pc-wbox.ruled{background:transparent;border-top:1.5pt solid var(--ch-accent);border-bottom:1.5pt solid var(--ch-accent)}
  .pc-wbox .k{font-family:var(--ch-font);font-weight:500;font-size:8.8pt;line-height:12pt;letter-spacing:3.4pt;text-transform:uppercase;color:var(--ch-accent);white-space:nowrap;overflow:hidden;margin-bottom:3pt;align-self:flex-start}
  .pc-wbox .p{font-family:var(--ch-serif);font-weight:500;overflow:hidden;color:var(--fx-on)}
  .pc-bstatus{position:absolute;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
  .pc-bstatus .st{font-family:var(--ch-label);font-weight:600;font-size:24pt;line-height:1;letter-spacing:3pt;color:var(--fx-on);text-transform:uppercase;overflow:visible}
  .pc-bstatus .ln{flex:1;height:1.2pt;background:var(--ch-accent);margin:0 12pt;min-width:16pt}
  .pc-bstatus .ad{font-family:var(--ch-serif);font-weight:500;font-size:16pt;line-height:1;color:var(--fx-on)}
  .pc-steps .it{display:flex;gap:12pt;align-items:flex-start;white-space:normal;overflow:hidden;border-top:1.5pt solid var(--ch-rule);padding:1.5pt 0}
  .pc-steps .it:first-child{border-top:0}
  .pc-steps .stp{min-width:0}
  .pc-steps .bx{flex:none;line-height:1.1;width:14pt;text-align:center;font-family:var(--ch-serif);font-weight:600;font-size:1.3em;color:var(--ch-accent)}
  .pc-call{font-family:var(--ch-serif);font-weight:600;font-size:13pt;line-height:16pt;color:var(--ch-accent);white-space:nowrap;overflow:hidden}
  .pc-disc{position:absolute;font-size:6pt;line-height:10pt;color:var(--fx-soft);overflow:hidden;white-space:nowrap}
  .pc-ret{position:absolute;font-family:var(--fx-font);font-weight:500;font-size:9pt;line-height:11pt;letter-spacing:.2pt;color:var(--fx-on);overflow:hidden;height:34pt}
  .pc-ret b{font-weight:700;letter-spacing:1.4pt;text-transform:uppercase;color:var(--fx-ink)}
  .ch-jcaps{position:absolute;font-family:var(--ch-font);font-weight:600;font-size:10pt;line-height:14pt;letter-spacing:1.8pt;text-transform:uppercase;color:var(--ch-accent);white-space:nowrap;overflow:hidden}
  .cap .a{font-weight:400}
  /* the back's compact contact row (owner 11/16): on the slate foot band, email and web side by side */
  .pc-back .cc{background:transparent}
  .pc-back .cc .cc-lines{display:flex;column-gap:12pt}
  .pc-back .cc .cc-panel{flex-direction:row;align-items:center;column-gap:10pt}
  .pc-back .cc .cc-panel > div:last-child{text-align:left}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const esc = SW.esc, b = D.brand || {}, A = D.agent || {}, L = D.listing, P = D.piece || {};
  document.body.dataset.mode = D.mode || 'email';
  await SW.setup(D);
  const sold = P.card === 'sold', big = P.size === '6x11', front = P.side === 'front';
  const W = big ? 792 : 648, H = 432;
  const K = ((D.sw || {}).pc || {})[sold ? 'js' : 'jl'] || {};
  const hsSrc = A.headshot && ((D.photos||{})[A.headshot] ? D.photos[A.headshot].src : A.headshot) || '';
  const statusWord = sold ? 'Just Sold' : 'Just Listed';
  const issues = [];
  const logo = (cls, src, area, maxh, style) => `<div class="logo ${cls}" data-area="${area}" data-maxh="${maxh}" style="${style||''}">${src ? `<img src="${esc(src)}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage||'')}</span>`}</div>`;
  const CL = big ? 13.5 : 12.5, CF = big ? 'font-size:10.9pt;line-height:13.5pt;' : '';   // the 6x11 sets its type up from the 6x9 (11 pt against 9.5), not the same size with more room
  const cap = (c, slot, lines, extra, min) => (c = (c.photo ? FXS.augment(D, c) : c), `<div class="cap" style="height:${5 + lines*CL}pt;${extra||''}"><div class="a" data-min="${min || 2}" data-nopair="1" data-slot="${slot}" data-narrow="0" data-nstep="6" data-lh="${CL}" data-lines="${lines}" data-lead="${esc(c.lead||'')}" data-s='${esc(JSON.stringify([].concat(c.s||[]))).replace(/'/g,'&#39;')}' style="height:${lines*CL}pt;${CF}"></div></div>`);
  let h = '';

  if(front){
    // The FX14 hand on a postcard front. A white frame top and side, the whole house in it, a taupe block around it with the status in Pinyon Script.
    // JL: "Just Listed" in script beside the house, the horizontal address, three facts; under the house the caption ("Front.", the draws) and the agent and logo along the foot.
    // JS: sells the agent: "Just Sold" in the same script lockup, the name and phone big on the left, the house on the right with the agent's own note, the logo.
    const F = K.front || {};
    const draws = list => { const w = x => /gated|roof|pergola|deck|park|garage|island|stone|corner|pool/i.test([].concat(x)[0]) ? 0 : 1; return (list || []).map((x, i) => [w(x), i, x]).sort((p, q) => p[0] - q[0] || p[1] - q[1]).map(t => t[2]); };
    const capC = sold ? {lead: '', s: (F.note || {}).s || (F.cap || {}).s} : (F.caption ? {lead: F.caption.lead, s: F.caption.s.concat(draws((F.about || {}).s || []))} : {lead: 'Front.', s: draws((F.about || {}).s || (F.cap || {}).s)});
    const norm = x => String(x).toLowerCase().replace(/[^a-z0-9 ]/g, '').slice(0, 40), allAlts = list => [].concat(...(list || []).map(x => [].concat(x)));
    const backSet = new Set([].concat(allAlts(((K.back || {}).about || {}).s), ...((K.back || {}).photos || []).map(c => allAlts(c.s)), allAlts((K.back || {}).steps6), allAlts((K.back || {}).steps)).map(norm));
    const backAll = allAlts(((K.back || {}).about || {}).s).map(String);   // the back's About box
    if(capC.s){ const kept = capC.s.filter(x => ![].concat(x).some(a => backSet.has(norm(a)))); if(kept.length >= 2) capC.s = kept; }
    // the caption's own first sentence stays; a later one that says a fact the back's About box says (the deck and pergola, in other words) drops out
    if(capC.s && capC.s.length > 2){ const tail = capC.s.slice(1).filter(x => ![].concat(x).some(a => backAll.some(b => SW.sameFact(String(a), b)))); if(tail.length >= 1) capC.s = [capC.s[0]].concat(tail); }
    const roomIds = [...new Set([].concat(((D.sw||{}).back||{}).photos||[], ((D.sw||{}).left||{}).photos||[]).map(c => c.photo))].filter(id => (D.photos||{})[id] && !(D.photos[id]||{}).fullHouse && id !== F.cap.photo).slice(0, 2);
    // ---- Charcoal Classic fronts. Two different cards in one hand.
    // Just Listed: the house across the top right from the bleed down to one straight seam, the charcoal an L around it (the column of words
    // and the agent's strip under the seam); the neighborhood in the seam tab; JUST / LISTED in the flyer's tracked Crimson capitals,
    // the thin accent rule, the street, the facts, the highlights on ruled lines. A wide house runs across the whole top instead.
    // Just Sold: the house full height on the left, its edge a gold rule; on the right, centered, JUST SOLD and the street between two
    // accent rules (the sign-in sheet's ruled lockup), the question, the note on the pale card, the agent over the logo. No house features.
    const k = big ? 1.12 : 1, pid = FO.heroId(D, F.cap.photo);
    const word = sold ? 'Just Sold' : 'Just Listed', hood = FXS.hood(L), city = FXS.placeLine(L), ad = String(L.address || '');
    const crimC = "font-family:'Crimson Pro';font-weight:600;letter-spacing:3pt", facts = FXS.statItems(L).filter(t => !/^Built/.test(t)).join('  ·  ').toUpperCase();
    const capsFit = (t, w, max, wt, tracks) => { for(const ls of tracks){ const fs = FXS.fitSize(t, `font-family:Jost;font-weight:${wt};letter-spacing:${ls}pt`, w, max, 8.5); if(FXS.width(t, `font-family:Jost;font-weight:${wt};letter-spacing:${ls}pt;font-size:${fs}pt`) <= w - 12) return {fs: Math.max(8.5, fs), ls}; } return {fs: 8.5, ls: tracks[tracks.length - 1]}; };
    const factsLine = (x, y, w, al) => { let ft = facts, c = capsFit(ft, w, 10.5*k, 600, [1.8, 1.2, 0.7, 0.3]); if(FXS.width(ft, `font-family:Jost;font-weight:600;letter-spacing:${c.ls}pt;font-size:${c.fs}pt`) > w - 12){ ft = facts.replace(/\s+·\s+/g, ' · '); c = capsFit(ft, w, 10*k, 600, [1.2, 0.7, 0.3, 0, -0.2]); } return `<div class="abs ch-jcaps" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${14*k}pt;font-size:${c.fs}pt;line-height:${14*k}pt;letter-spacing:${c.ls}pt${al ? ';text-align:' + al + ';text-indent:' + c.ls + 'pt' : ''}" data-slot="front.facts" data-lines="1">${esc(ft)}</div>`; };
    const status = (t, x, y, w, fs, slot, al) => `<div class="abs ch-caps" style="left:${x}pt;top:${y}pt;width:${w + 4}pt;height:${fs*1.06}pt;font-size:${fs}pt;line-height:${fs*1.06}pt;overflow:visible${al ? ';text-align:' + al + ';text-indent:3pt' : ''}" data-slot="${slot}" data-lines="1">${esc(t)}</div>`;
    const serif = (t, x, y, w, fs, slot, extra) => `<div class="abs ch-serif" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${fs*1.25}pt;font-size:${fs}pt;line-height:${fs*1.25}pt;${extra || ''}" data-slot="${slot}" data-lines="1">${esc(t)}</div>`;
    const tags = w => { const tg = [].concat(((K.front || {}).highlights || []), FXS.tagFacts(D).tags).filter(t => FXS.width(t, `font-family:Jost;font-weight:500;font-size:${11*k}pt`) < w - 18).filter((t, i, arr) => !arr.slice(0, i).some(u => SW.sameFact(t, u))); const sc = t => (/\b(19|20)\d\d\b/.test(t) ? 4 : 0) + (/\d/.test(t) ? 1 : 0) + Math.min(t.length, 30)/30; return tg.map((t, i) => [sc(t), i, t]).sort((a, b) => b[0] - a[0] || a[1] - b[1]).map(x => x[2]); };
    // a highlight on the sign-in sheet's ruled line: a short accent dash, the fact, a hairline under it
    const hl = (t, i, x, y, w, rh) => `<div class="abs" style="left:${x}pt;top:${y + rh/2 - 0.6}pt;width:${8*k}pt;height:1.2pt;background:var(--ch-accent)"></div><div class="abs" style="left:${x + 16*k}pt;top:${y}pt;width:${w - 16*k}pt;height:${rh}pt;font-weight:500;font-size:${11*k}pt;line-height:${rh}pt;font-family:var(--ch-font);color:var(--ch-on);white-space:nowrap;overflow:hidden" data-slot="front.hl.${i}" data-lines="1">${esc(t)}</div><div class="ch-hair" style="left:${x}pt;top:${y + rh - 1}pt;width:${w}pt"></div>`;
    const note = (x, y, w, n, lh, fs, pad) => { fs = fs || 10*k; pad = pad || 13; return `<div class="ch-lt"><div class="ch-card" id="notebox" data-pad="${pad}" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${n*lh + 2*pad}pt"></div><div class="abs cap"><div class="a" style="position:absolute;left:${x + 16}pt;top:${y + pad}pt;width:${w - 32}pt;height:${n*lh}pt;font-size:${fs}pt;line-height:${lh}pt;color:var(--fx-soft)" data-slot="front.note" data-h0="${n*lh}" data-lh="${lh}" data-lines="${n}" data-min="3" data-narrow="0" data-flexh="1" ${FXS.sd(capC.s || [])}></div></div></div>`; };
    const nameW = ns => FXS.width(A.name || '', `font-family:'Crimson Pro';font-weight:600;letter-spacing:.4pt;font-size:${ns}pt`), phoneW = ns => FXS.width(A.phone || '', `font-family:Jost;font-weight:600;font-size:${ns*0.74}pt`);
    const desT = A.designation ? (A.nar || /realtor/i.test(A.designation) ? 'REALTOR®' : A.designation) : '', DS = 8.6*k, desW = desT ? FXS.width(desT, `font-family:Jost;font-weight:500;letter-spacing:2pt;font-size:${DS}pt`) + 9*k : 0;
    const nameSpan = ns => `<span style="font-weight:600;font-size:${ns}pt;line-height:${ns*1.25}pt;font-family:var(--ch-label);letter-spacing:.4pt;color:var(--ch-on)" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</span>`;
    const desSpan = ns => `<span style="font-weight:500;font-size:${DS}pt;line-height:${ns*1.25}pt;font-family:var(--ch-font);letter-spacing:2pt;color:var(--ch-accent);margin-left:${9*k}pt" data-slot="agent.desig" data-lines="1">${esc(desT)}</span>`;
    const phoneSpan = (ns, ml) => `<span style="font-weight:600;font-size:${ns*0.74}pt;line-height:${ns*1.1}pt;font-family:var(--ch-font);color:var(--ch-on)${ml ? `;margin-left:${ml}pt` : ''}" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</span>`;
    // the agent's one line (name, REALTOR(R), phone) and the one logo at the far end, centered top to bottom in a strip of height hh
    const agentStrip = (x, y, w, ns, hh) => { const bw = nameW(ns) + desW + 18*k + phoneW(ns), lw = Math.min(150*k, w - bw - 24);
      return `<div class="abs" style="left:${x}pt;top:${y + (hh - ns*1.25)/2}pt;width:${bw + 6}pt;white-space:nowrap;line-height:${ns*1.25}pt">${nameSpan(ns)}${desT ? desSpan(ns) : ''}${phoneSpan(ns, 18*k)}</div>` + FXS.logo(D, x + w - lw, y + 2, lw, hh - 4, 'flex-end'); };
    const photoAt = (x, y, w, hh) => `<div class="abs" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${hh}pt">${SW.photo(D, pid, 'position:absolute;inset:0', 'front.hero')}</div>`;
    const cq = 'Thinking about selling?';

    if(!sold){
      const SEAM = H - 52, nsS = 15*k;
      let PW = big ? 452 : 360; while(PW < W*0.68 && !SW.fits(D, pid, PW + 9, SEAM + 9)) PW += 6;
      const stacked = !SW.fits(D, pid, PW + 9, SEAM + 9);
      if(!stacked){
        const PX = W - PW, TX0 = 26, TW = PX - 24 - TX0, parts = []; let y = 26;
        h += photoAt(PX, -9, PW + 9, SEAM + 9) + CH.tab(PX + PW/2, SEAM, hood || city, 'front.place', {fs: 8.8*k, h: 24*k, ls: 3.6});
        // owner 11/17 (p6/p8): more highlights under the address (five on the 6x9, at least four on the 6x11); JUST / LISTED gives up the height they need
        const as0 = FXS.fitSize(ad, "font-family:'Crimson Pro';font-weight:500", TW, 26*k, 15), tg0 = tags(TW), nW = Math.min(big ? 4 : 5, tg0.length), rh0 = 21*k;
        const ls = Math.max(40, Math.min(FXS.fitSize('LISTED', crimC, TW - 4, 74*k, 30), 84, (SEAM - 24 - 26 - 10 - 12*k - as0*1.25 - 2 - 26*k - nW*rh0)/2));   // 24 pt clear above the agent's rule
        parts.push(status('Just', TX0, y, TW, ls, 'front.status') + status('Listed', TX0, y + ls*1.0, TW, ls, 'front.status2')); y += 2*ls*1.0 + 10;
        parts.push(`<div class="ch-rule" style="left:${TX0}pt;top:${y}pt;width:${Math.min(TW, 120*k)}pt;height:1.2pt"></div>`); y += 12*k;
        const as = FXS.fitSize(ad, "font-family:'Crimson Pro';font-weight:500", TW, 26*k, 15); parts.push(serif(ad, TX0, y, TW, as, 'front.address')); y += as*1.25 + 2;
        parts.push(factsLine(TX0, y, TW)); y += 14*k + 12*k;
        const rh = 21*k, nT = Math.max(2, Math.min(nW, Math.floor((SEAM - 24 - y)/rh)));
        tg0.slice(0, nT).forEach((t, i) => { parts.push(hl(t, i, TX0, y, TW, rh)); y += rh; });
        h += `<div class="abs" id="lock" data-bottom="${y}" data-foot="${SEAM - 4}" style="left:0;top:0;width:0;height:0">${parts.join('')}</div>`;
        h += `<div class="ch-hair" style="left:${TX0}pt;top:${SEAM}pt;width:${PX - TX0 - 14}pt"></div>` + agentStrip(TX0, SEAM + 6, W - 2*TX0, nsS, H - SEAM - 6 - 18);
      } else {
        // a wide house runs across the whole top; under its seam the status and the agent on the left, the place and highlights on the right
        let SH = big ? 222 : 214; while(SH < H*0.73 && !SW.fits(D, pid, W + 18, SH + 9)) SH += 4;
        h += photoAt(-9, -9, W + 18, SH + 9) + CH.tab(W/2, SH, hood || city, 'front.place', {fs: 8.8*k, h: 24*k, ls: 3.6});
        const TX0 = 26, TX1 = W - 26, TW = TX1 - TX0, y0 = SH + 14, yB = H - 20, cW = Math.round(TW*0.52), cR = TX0 + cW + 26, rW = TX1 - cR, ah = 24*k, ay = yB - ah;
        const room = ay - 10 - y0, ls = Math.max(22, Math.min(FXS.fitSize(word.toUpperCase(), crimC, cW - 4, 52*k, 22), room/1.06 - 8)), sy = y0 + Math.max(0, (room - ls*1.06 - 8)/2);
        h += status(word, TX0, sy, cW, ls, 'front.status') + `<div class="ch-rule" style="left:${TX0}pt;top:${sy + ls*1.06 + 4}pt;width:${Math.min(cW, 120*k)}pt;height:1.2pt"></div>`;
        const bw = nameW(13*k) + desW + 14*k + phoneW(13*k);
        h += `<div class="abs" style="left:${TX0}pt;top:${ay + (ah - 13*k*1.25)/2}pt;width:${cW}pt;white-space:nowrap;line-height:${13*k*1.25}pt">${nameSpan(13*k)}${desT && bw < cW ? desSpan(13*k) : ''}${phoneSpan(13*k, 14*k)}</div>`;
        h += `<div class="ch-vhair" style="left:${cR - 13}pt;top:${y0 + 2}pt;height:${yB - y0 - 2}pt"></div>`;
        let y = y0; const as = FXS.fitSize(ad, "font-family:'Crimson Pro';font-weight:500", rW, 22*k, 13); h += serif(ad, cR, y, rW, as, 'front.address'); y += as*1.25 + 1;
        h += factsLine(cR, y, rW); y += 14*k + 4*k;
        const lyB = yB - 30*k, rh = 18*k, nT = Math.max(0, Math.min(2, Math.floor((lyB - y)/rh))); tags(rW).slice(0, nT).forEach((t, i) => { h += hl(t, i, cR, y, rW, rh); y += rh; });
        h += FXS.logo(D, cR, yB - 26*k, rW, 26*k, 'flex-start');
      }
    } else {
      let PWi = big ? 400 : 322; while(PWi < W*(big ? 0.67 : 0.6) && !SW.fits(D, pid, PWi + 9, H + 18)) PWi += 6;
      const side = SW.fits(D, pid, PWi + 9, H + 18);
      if(side){
        h += photoAt(-9, -9, PWi + 9, H + 18) + `<div class="abs" style="left:${PWi}pt;top:-9pt;width:1.2pt;height:${H + 18}pt;background:var(--ch-accent);z-index:3"></div>`;
        const TX0 = PWi + 24, TX1 = W - 24, TW = TX1 - TX0, C = 'center', parts = []; let y = 24;
        const ls = FXS.fitSize(word.toUpperCase(), crimC, TW - 6, 50*k, 26), ns = Math.min(ls*0.5, 20*k), fh = ns*1.25 + ns*1.0 + 8*k + 28*k, fy = H - 20 - fh;
        parts.push(`<div class="ch-rule" style="left:${TX0}pt;top:${y}pt;width:${TW}pt;height:1.2pt"></div>`); y += 12;
        parts.push(status(word, TX0, y, TW - 4, ls, 'front.status', C)); y += ls*1.06 + 2;
        const as = FXS.fitSize(ad, "font-family:'Crimson Pro';font-weight:500", TW - 8, 23*k, 14); parts.push(serif(ad, TX0, y, TW, as, 'front.address', 'text-align:center')); y += as*1.25 + 9;
        parts.push(`<div class="ch-rule" style="left:${TX0}pt;top:${y}pt;width:${TW}pt;height:1.2pt"></div>`); y += 14*k;
        const cs2 = FXS.fitSize(cq, "font-family:'Crimson Pro';font-weight:500", TW, 20*k, 13); parts.push(serif(cq, TX0, y, TW, cs2, 'front.cta', 'text-align:center;color:var(--ch-accent)')); y += cs2*1.25 + 8;
        // owner 11/17 (p10/p12): the white box bigger and its type bigger, filling the column so the space above the lockup matches the space under the agent
