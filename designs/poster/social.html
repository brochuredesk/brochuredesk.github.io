<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>poster social set</title>
<link rel="stylesheet" href="po-tokens.css">
<script src="../engine/baths.js"></script>
<script src="../engine/ivory.js"></script>
<script src="../engine/ohlib.js"></script>
<script src="../engine/ohemail.js"></script>
<script src="../engine/carousel.js"></script>
<script src="../engine/factrepeat.js"></script>
<script src="../engine/socialset.js"></script>
<script src="po-social.js"></script>
<!-- Poster's Just Listed and Just Sold social sets (owner 11/18/2026). The shared engine (templates/_shared/socialset.js) loads the
     fonts and the data and runs the checks; the layouts are Poster's own (po-social.js): the dark field, JUST over LISTED / SOLD
     stacked huge in two colors, the giant house number with the street in accent caps, the house in the offset accent keyline, the
     heavy rule. The colors come from the agent's brand kit as the set's print pieces read them (PO.brand in po.js). -->
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
SocialSet.portrait = POSocial.portrait; SocialSet.landscape = POSocial.landscape; SocialSet.slide = POSocial.slide;
SocialSet.start(D => {
  const b = D.brand || {}, c = b.colors || {}, r = document.documentElement.style;
  const rgb = h => { h = String(h||'').replace('#',''); if(h.length===3) h = h.split('').map(x=>x+x).join(''); const n = parseInt(h,16); return [n>>16&255, n>>8&255, n&255]; };
  const lum = h => { const v = rgb(h).map(q => { q/=255; return q <= .03928 ? q/12.92 : Math.pow((q+.055)/1.055, 2.4); }); return .2126*v[0] + .7152*v[1] + .0722*v[2]; };
  const con = (a, x) => { const p = lum(a), q = lum(x); return (Math.max(p,q)+.05)/(Math.min(p,q)+.05); };
  const on = bg => con(bg, '#ffffff') >= con(bg, '#161616') ? '#ffffff' : '#161616';
  const mix = (a, x, t) => { const p = rgb(a), q = rgb(x); return '#' + p.map((v, i) => Math.round(v + (q[i] - v)*t).toString(16).padStart(2, '0')).join(''); };
  // as PO.brand: the kit's dark is the field, its paper the headline color where it reads, its accent the second word, the keyline and the labels
  const dark = c.dark || '#15181d', acc0 = c.accent || '#f0b43c', paper0 = /^#[0-9a-f]{3,6}$/i.test(b.paper || '') ? b.paper : '#f4f1ea', o = on(dark), light = o === '#ffffff';
  const paper = con(paper0, dark) >= 4.5 ? paper0 : o, acc = con(acc0, dark) >= 3 ? acc0 : o;
  r.setProperty('--po-dark', dark); r.setProperty('--po-head', paper); r.setProperty('--po-on', o); r.setProperty('--po-accent', acc); r.setProperty('--po-frame', acc);
  r.setProperty('--po-paper', paper); r.setProperty('--po-paper-ink', on(paper)); r.setProperty('--po-soft', mix(o, dark, .14)); r.setProperty('--po-rule', light ? 'rgba(255,255,255,.3)' : 'rgba(0,0,0,.3)');
});
</script>
</body>
</html>
