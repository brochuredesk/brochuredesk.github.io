<!doctype html>
<html lang="en">

<meta charset="utf-8">

<link rel="stylesheet" href="po.css">
<link rel="stylesheet" href="po-fo.css">
<script src="po.js"></script>
<script src="../engine/baths.js"></script>
<script src="../engine/agentcard.js"></script>
<script src="../engine/factrepeat.js"></script>
<script>window.Ivory = window.Ivory || {esc: s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))};</script>
<script src="po-fo.js"></script>
<!--
  BrochureDesk · Twilight Frame · Just Listed and Just Sold postcards (the hand of the approved Open House library flyer B01).
  data.piece.card = "listed" | "sold", data.piece.size = "6x11" (trim 792 x 432 pt) | "6x9" (648 x 432 pt), data.piece.side = "front" | "back".
  Print adds 0.125 in (9 pt) bleed. The agent's brand color (brand.accent) is the field on both sides; boxes are white.
  Front: the whole house (roof to steps) on the right with a one-line-or-two caption and a white box under it, the status stacked large on the left over the address,
  the fact rows and the brokerage logo (Just Listed) or the agent's name and number and the logo (Just Sold). No price, no QR.
  Back: status line, interior photos with captions, a white box (the write-up, or the steps), the standard contact card (templates/_shared/agentcard.js,
  band preset, which carries the back's one logo), the fine print. The right 289.5 pt (4.02 in) is the mail vendor's: return address, postage and address
  zones; drawn as guides on proofs and left clear in print.
  Copy comes from data.sw.pc.{jl|js}.{front|back} as a lead plus whole sentences; po.js picks the sentences that fill each box.
-->
<style>
  /* P02 on a postcard: the dark field, Archivo caps, the paper box with ink and main-color labels; tokens in po-tokens.css */
  .pc-col{position:absolute;display:flex;flex-direction:column}
  .pc-wbox{background:var(--po-paper);color:#2b2b2b;padding:10pt 16pt 9pt;display:flex;flex-direction:column;overflow:hidden;--fx-on:#161616;--fx-soft:#2b2b2b;--fx-rule:rgba(0,0,0,.16)}
  .pc-wbox .k{font-family:var(--po-font);font-weight:700;font-size:8.4pt;line-height:11pt;letter-spacing:2.6pt;text-transform:uppercase;color:var(--po-paper-ink);white-space:nowrap;overflow:hidden;margin-bottom:3pt;align-self:flex-start}
  .pc-wbox .p{font-family:var(--po-font);font-weight:500;overflow:hidden;color:#222}
  .pc-wbox .p b{font-weight:700;color:var(--fx-on)}
  .pc-bstatus{position:absolute;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
  .pc-bstatus .ln{flex:1;height:2.5pt;background:var(--po-head);margin:0 0 0 14pt;min-width:16pt}
  .pc-steps .it{display:flex;gap:8pt;align-items:baseline;white-space:nowrap;overflow:hidden}
  .pc-steps .bx{flex:none;margin-top:0!important;min-width:1.55em;font-weight:800;letter-spacing:-.2pt;color:var(--po-main-ink)}
  .pc-pq .p{font-family:var(--po-font);font-weight:600;color:var(--po-head);overflow:hidden}
  .pc-call{font-family:var(--po-font);font-weight:700;font-size:13pt;line-height:16pt;color:var(--po-paper-ink);white-space:nowrap;overflow:hidden}
  .pc-disc{position:absolute;font-size:6pt;line-height:10pt;color:#fff;overflow:hidden;white-space:nowrap}
  .pc-ret{position:absolute;font-family:var(--fx-font);font-weight:500;font-size:9pt;line-height:11pt;letter-spacing:.2pt;color:var(--fx-on);overflow:hidden;height:34pt}
  .pc-ret b{font-weight:700;letter-spacing:1.4pt;text-transform:uppercase;color:var(--fx-ink)}
  .cap .a{font-weight:400}
  /* the back's compact contact row (owner 11/16): email and web side by side, the knockout logo beside the office lines */
  .pc-back .cc{background:transparent}
  .pc-back .cc .cc-lines{display:flex;column-gap:12pt}
  .pc-back .cc .cc-panel{flex-direction:row;align-items:center;column-gap:10pt}
  .pc-back .cc .cc-panel > div:last-child{text-align:left}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const esc = SW.esc, b = D.brand || {}, A = D.agent || {}, L = D.listing, P = D.piece || {};
  document.body.dataset.mode = D.mode || 'email';
  await SW.setup(D);
  const sold = P.card === 'sold', big = P.size === '6x11', front = P.side === 'front';
  const W = big ? 792 : 648, H = 432;
  const K = ((D.sw || {}).pc || {})[sold ? 'js' : 'jl'] || {};
  const hsSrc = A.headshot && ((D.photos||{})[A.headshot] ? D.photos[A.headshot].src : A.headshot) || '';
  const statusWord = sold ? 'Just Sold' : 'Just Listed';
  const issues = [];
  const fitHLpc = (t, w) => { for(let q = 60; q >= 14; q -= 0.5) if(FO.hlW(t, q) <= w) return q; return 14; };
  const logo = (cls, src, area, maxh, style) => `<div class="logo ${cls}" data-area="${area}" data-maxh="${maxh}" style="${style||''}">${src ? `<img src="${esc(src)}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage||'')}</span>`}</div>`;
  const CL = big ? 13.5 : 12.5, CF = big ? 'font-size:10.4pt;line-height:13.5pt;' : '';   // the 6x11 sets its type up from the 6x9 (11 pt against 9.5), not the same size with more room
  const cap = (c, slot, lines, extra, min) => (c = (c.photo ? FXS.augment(D, c) : c), `<div class="cap" style="height:${5 + lines*CL}pt;${extra||''}"><div class="a" data-min="${min || 2}" data-slot="${slot}" data-narrow="0" data-nstep="6" data-lh="${CL}" data-lines="${lines}" data-lead="${esc(c.lead||'')}" data-s='${esc(JSON.stringify([].concat(c.s||[]))).replace(/'/g,'&#39;')}' style="height:${lines*CL}pt;${CF}"></div></div>`);
  let h = '';

  if(front){
    // The FX14 hand on a postcard front. A white frame top and side, the whole house in it, a taupe block around it with the status in Pinyon Script.
    // JL: "Just Listed" in script beside the house, the horizontal address, three facts; under the house the caption ("Front.", the draws) and the agent and logo along the foot.
    // JS: sells the agent: "Just Sold" in the same script lockup, the name and phone big on the left, the house on the right with the agent's own note, the logo.
    const F = K.front || {};
    const draws = list => { const w = x => /gated|roof|pergola|deck|park|garage|island|stone|corner|pool/i.test([].concat(x)[0]) ? 0 : 1; return (list || []).map((x, i) => [w(x), i, x]).sort((p, q) => p[0] - q[0] || p[1] - q[1]).map(t => t[2]); };
    const capC = sold ? {lead: '', s: (F.note || {}).s || (F.cap || {}).s} : (F.caption ? {lead: F.caption.lead, s: F.caption.s.concat(draws((F.about || {}).s || []))} : {lead: 'Front.', s: draws((F.about || {}).s || (F.cap || {}).s)});
    const norm = x => String(x).toLowerCase().replace(/[^a-z0-9 ]/g, '').slice(0, 40), allAlts = list => [].concat(...(list || []).map(x => [].concat(x)));
    const backSet = new Set([].concat(allAlts(((K.back || {}).about || {}).s), ...((K.back || {}).photos || []).map(c => allAlts(c.s)), allAlts((K.back || {}).steps6), allAlts((K.back || {}).steps)).map(norm));
    const backAll = allAlts(((K.back || {}).about || {}).s).map(String);   // the back's About box
    if(capC.s){ const kept = capC.s.filter(x => ![].concat(x).some(a => backSet.has(norm(a)))); if(kept.length >= 2) capC.s = kept; }
    // the caption's own first sentence stays; a later one that says a fact the back's About box says (the deck and pergola, in other words) drops out
    if(capC.s && capC.s.length > 2){ const tail = capC.s.slice(1).filter(x => ![].concat(x).some(a => backAll.some(b => SW.sameFact(String(a), b)))); if(tail.length >= 1) capC.s = [capC.s[0]].concat(tail); }
    const roomIds = [...new Set([].concat(((D.sw||{}).back||{}).photos||[], ((D.sw||{}).left||{}).photos||[]).map(c => c.photo))].filter(id => (D.photos||{})[id] && !(D.photos[id]||{}).fullHouse && id !== F.cap.photo).slice(0, 2);
    // ---- Poster front: P02's poster on a card. The brand's dark field; the status stacked huge in Archivo caps, its second word in the
    // accent (as the sign-in sheet's "PLEASE / SIGN IN"); the whole house inside P02's thin offset accent frame, set in from the edges;
    // Just Listed: the street, the facts in the tracked caps line, two or three specific highlights set left, the agent and logo along the foot.
    // Just Sold: JUST SOLD about twice the agent's name, the street right under it, the seller question, a short note in the paper box
    // sized to its text, then who to call and the logo. No house features on Just Sold. ----
    const k = big ? 1.12 : 1, pid = F.cap.photo, PAD = 26, word = sold ? ['Just', 'Sold'] : ['Just', 'Listed'];
    const place = [FXS.hood(L), FXS.placeLine(L)].filter(Boolean).join('  ·  ').toUpperCase();
    const status = (x, y, w, max, min) => { let s = min; for(let q = max; q >= min; q -= 0.5) if(word.every(t => FO.hlW(t, q) <= w)){ s = q; break; }
      const y0 = y - s*FO.CAPT; return {s, html: word.map((t, i) => FO.hlLine(t, x - s*0.02, y0 + i*s*FO.PITCH, s, i ? 'front.status.l1' : 'front.status', i === 1, w + s*0.04)).join(''), bottom: y0 + s*FO.PITCH + s*FO.CAPB}; };
    const eyebrow = (x, y, w) => { const cands = [place, [FXS.hood(L), L.city].filter(Boolean).join('  ·  ').toUpperCase(), String(FXS.hood(L) || L.city || '').toUpperCase()], fitE = t => FXS.fitSize(t, 'font-family:Archivo;font-weight:700;letter-spacing:2.6pt', w, 9*k, 7.5), pl = cands.find(t => fitE(t) >= 8.5) || cands[2], ef = Math.max(8.5, fitE(pl)); return `<div class="po-wd" style="left:${x}pt;top:${y}pt;width:${w}pt;font-size:${ef}pt;letter-spacing:2.6pt" data-slot="front.place" data-lines="1">${esc(pl)}</div>`; };
    const street = (x, y, w, max) => { const ad = String(L.address || ''), as = FXS.fitSize(ad, 'font-family:Archivo;font-weight:700;letter-spacing:-.2pt', w, max, 14); return {h: as*1.2, html: `<div class="abs" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${as*1.2}pt;font-family:var(--po-font);font-weight:700;font-size:${as}pt;line-height:${as*1.2}pt;letter-spacing:-.2pt;color:var(--po-head);white-space:nowrap;overflow:hidden" data-slot="front.address" data-lines="1">${esc(ad)}</div>`}; };
    // the highlights: few and specific, a dated improvement first, set left with the accent square
    const tg = FXS.tagFacts(D).tags.filter((t, i, arr) => !arr.slice(0, i).some(u => SW.sameFact(t, u))).sort((a, b) => (/\b(19|20)\d\d\b/.test(b) ? 1 : 0) - (/\b(19|20)\d\d\b/.test(a) ? 1 : 0));
    const hl = (x, y, w, n, fs) => tg.filter(t => FXS.width(t, `font-family:Archivo;font-weight:500;font-size:${fs}pt`) < w - 16).slice(0, n).map((t, i) => `<div class="abs" style="left:${x}pt;top:${y + i*fs*1.7}pt;width:${w}pt;height:${fs*1.7}pt;display:flex;align-items:center;gap:9pt;white-space:nowrap;overflow:hidden;font-family:var(--po-font);font-weight:500;font-size:${fs}pt;line-height:${fs*1.7}pt;color:var(--po-on)" data-slot="front.hl.${i}" data-lines="1"><span style="width:5pt;height:5pt;background:var(--po-accent);flex:none"></span>${esc(t)}</div>`).join('');
    const facts = FXS.statItems(L).filter(t => !/^Built/.test(t)).join('  ·  ').toUpperCase();
    const factsLine = (x, y, w) => { const fcss = 'font-family:Archivo;font-weight:500;letter-spacing:1.4pt', items = FXS.statItems(L).filter(t => !/^Built/.test(t)).map(t => t.toUpperCase()), one = FXS.fitSize(facts, fcss, w - 4, 9.5*k, 8) >= 8.5, rows = one ? [facts] : [items.slice(0, 2).join('  ·  '), items.slice(2).join('  ·  ')].filter(Boolean), fs = Math.max(8.5, Math.min(...rows.map(r => FXS.fitSize(r, fcss, w - 4, 9.5*k, 8))));
      return {h: rows.length*14, html: rows.map((r, i) => `<div class="abs fo-facts" style="left:${x}pt;top:${y + i*14}pt;width:${w}pt;height:14pt;font-size:${fs}pt;line-height:14pt;letter-spacing:1.4pt;font-weight:500" data-slot="front.facts${i ? '.l' + i : ''}" data-lines="1">${esc(r)}</div>`).join('')}; };
    const agentFoot = (x, y, w, logoW) => `<div class="po-rule" style="left:${x}pt;top:${y - 9}pt;width:${w}pt"></div><div class="abs" style="left:${x}pt;top:${y}pt;width:${w - logoW}pt"><div style="font-family:var(--po-font);font-weight:700;font-size:${15*k}pt;line-height:${19*k}pt;color:var(--po-head);white-space:nowrap" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</div><div style="font-family:var(--po-font);font-weight:700;font-size:${12*k}pt;line-height:${16*k}pt;color:var(--po-accent);white-space:nowrap" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</div></div>` + FXS.logo(D, x + w - logoW, y + 1, logoW, 34, 'flex-end');
    // the Just Sold note: the paper box sized to its text (noteSnug after the fill)
    const note = (x, y, w, n) => { const lh = 13.5*k; return `<div class="po-pbox" id="notebox" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${n*lh + 20}pt"></div><div class="po-ink"><div class="abs cap"><div class="a" style="position:absolute;left:${x + 12}pt;top:${y + 10}pt;width:${w - 24}pt;height:${n*lh}pt;font-size:${10*k}pt;line-height:${lh}pt;color:#222" data-slot="front.note" data-lh="${lh}" data-lines="${n}" data-min="3" data-narrow="0" data-flexh="1" ${FXS.sd(capC.s || [])}></div></div></div>`; };
    const cta = (x, y, w, fs) => `<div class="abs" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${fs*1.25}pt;font-family:var(--po-font);font-weight:700;font-size:${fs}pt;line-height:${fs*1.25}pt;color:var(--po-accent);white-space:nowrap" data-slot="front.cta" data-lines="1">Thinking about selling?</div>`;
    // DESIGN PASS 11/15. The type column is 41% of the card on every front and the status is always stacked (JUST over LISTED / SOLD).
    // JUST LISTED: type left, the whole house right inside the poster's shadow line (the accent frame dropped down and right of the photo);
    //   three highlights or none; a wide house takes a shorter photo and the agent and logo sit under it.
    // JUST SOLD is its own card, not the mirror: the house bleeds off the top and left edges, the type column is on the right, the seller
    //   question and the short seller note (paper box sized to its text) lead straight into who to call.
    const TC = Math.round(W*0.41);
    const spread = (els, slack, max) => { const d = Math.min(max, slack/Math.max(1, els.length)); return i => (i + 1)*d; };
    if(!sold){
      const OFF = 7, TX0 = 30, TW = TC - TX0 - 16, PX = TC + 7, PW = W - PAD - OFF - PX, PHmax = H - 2*PAD - 2*OFF + 0, PAD0 = PAD;
      let PH = PHmax; const wide = !SW.fits(D, pid, PW, PHmax); if(wide){ PH = PHmax - 70; while(PH > 180 && !SW.fits(D, pid, PW, PH)) PH -= 4; }
      h += FO.ofr(PX, PAD + OFF, PW, PH) + FO.zoomed(`<div class="abs" style="left:${PX}pt;top:${PAD + OFF}pt;width:${PW}pt;height:${PH}pt">${SW.photo(D, pid, 'position:absolute;inset:0', 'front.hero')}</div>`, D, pid, PW, PH, 1.5);
      h += eyebrow(TX0, 30, TW);
      const st = status(TX0, 50, TW, 92*k, 30); h += st.html; let y = st.bottom + 13;
      const sa = street(TX0, y, TW, 23*k); h += sa.html; y += sa.h + 3;
      { const fl = factsLine(TX0, y, TW); h += fl.html; y += fl.h + 10; }
      h += `<div class="po-heavy" style="left:${TX0}pt;top:${y}pt;width:${TW}pt"></div>`; y += 13;
      const fy = wide ? H - 19 - 34*k : H - 30 - 34*k, colB = wide ? H - 20 : fy - 20;
      let hf = 0, picked = []; for(let f = 14*k; f >= 9.5 && !hf; f -= 0.5){ const fit = tg.filter(t => FXS.width(t, `font-family:Archivo;font-weight:500;font-size:${f}pt`) < TW - 16); if(fit.length >= 3 && 3*f*1.5 <= colB - y){ hf = f; picked = fit.slice(0, 3); } }
      if(hf){ const pitch = Math.min(46*k, (colB - y)/3); picked.forEach((t, i) => { if(i && pitch > hf*1.9) h += `<div class="po-rule" style="left:${TX0}pt;top:${y + i*pitch}pt;width:${TW}pt"></div>`; h += `<div class="abs" style="left:${TX0}pt;top:${y + i*pitch + (pitch - hf*1.5)/2}pt;width:${TW}pt;height:${hf*1.5}pt;display:flex;align-items:center;gap:9pt;white-space:nowrap;overflow:hidden;font-family:var(--po-font);font-weight:500;font-size:${hf}pt;line-height:${hf*1.5}pt;color:var(--po-on)" data-slot="front.hl.${i}" data-lines="1"><span style="width:5pt;height:5pt;background:var(--po-accent);flex:none"></span>${esc(t)}</div>`; }); }
      if(wide) h += agentFoot(PX - OFF, fy, PW + 2*OFF, (PW + 2*OFF)*0.34); else h += agentFoot(TX0, fy, TW, TW*0.42);
    } else {
      // the house in P02's frame, upper left; the seller note in its paper box right under it; the type column on the right
      const TXr = W - TC + 22, TW = TC - 22 - 30, full = false, FX = PAD + 7, FYt = PAD + 7, PWs = W - TC - FX - 7 - 6, noteH0 = 3*13.5*k + 20;
      let PH = H - PAD - FYt - 7 - 12 - noteH0; while(PH > 170 && !SW.fits(D, pid, PWs, PH)) PH -= 4;
      h += FO.ofr(FX, FYt, PWs, PH) + FO.zoomed(`<div class="abs" style="left:${FX}pt;top:${FYt}pt;width:${PWs}pt;height:${PH}pt">${SW.photo(D, pid, 'position:absolute;inset:0', 'front.hero')}</div>`, D, pid, PWs, PH, 1.5);
      h += eyebrow(TXr, 30, TW);
      const ns = Math.min(34*k, FXS.fitSize(A.name || '', 'font-family:Archivo;font-weight:700;letter-spacing:-.3pt', TW, 34*k, 14)), fy2 = H - 30 - 30, ny = fy2 - ns*1.12 - 2;
      const cs = FXS.fitSize('Thinking about selling?', 'font-family:Archivo;font-weight:700', TW, 18*k, 12), noteH = full ? 3*13.5*k + 20 + 10 : 0, sah = 21*k*1.2;
      const fixed = 13 + sah + 12 + 2.5 + 14 + cs*1.25 + 8 + noteH + 12, smax = (ny - 9 - 50 - fixed)/(FO.PITCH + FO.CAPB - FO.CAPT);
      const st = status(TXr, 50, TW, Math.min(104*k, smax), 30); h += st.html; let y = st.bottom + 13;
      const slack = Math.max(0, (ny - 9) - (st.bottom + fixed)), g = Math.min(full ? 14 : 30, slack/3);
      const sa = street(TXr, y, TW, 21*k); h += sa.html; y += sa.h + 12 + g;
      h += `<div class="po-heavy" style="left:${TXr}pt;top:${y}pt;width:${TW}pt"></div>`; y += 2.5 + 14 + g;
      h += cta(TXr, y, TW, cs); y += cs*1.25 + 8;
      if(full) h += note(TXr, y, TW, 3).replace('id="notebox"', `id="notebox" data-bottom="${ny - 9 - 12}"`);
      else { const nx = PAD, nw = PWs + 14, nyy = FYt + PH + 7 + 12; h += note(nx, nyy, nw, 3).replace('id="notebox"', `id="notebox" data-bottom="${H - PAD}"`); }
      h += `<div class="po-rule" style="left:${TXr}pt;top:${ny - 9}pt;width:${TW}pt"></div><div class="abs" style="left:${TXr}pt;top:${ny}pt;width:${TW}pt;height:${ns*1.12}pt;font-family:var(--po-font);font-weight:700;font-size:${ns}pt;line-height:${ns*1.12}pt;letter-spacing:-.3pt;color:var(--po-head);white-space:nowrap" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</div><div class="abs" style="left:${TXr}pt;top:${fy2 + 6}pt;width:${TW*0.5}pt;font-family:var(--po-font);font-weight:700;font-size:${14*k}pt;line-height:${18*k}pt;color:var(--po-accent);white-space:nowrap" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</div>` + FXS.logo(D, TXr + TW*0.5, fy2 + 2, TW*0.5, 28, 'flex-end');
    }
  } else {
    // ---------------- BACK (owner 11/16/2026: the design runs the full width; the contact block is much shorter) ----------------
    // P02 across the whole card, the mail side included: the dark field to every edge; the rooms bleed across the top edge to edge (Just
    // Listed); the street headline's heavy rule runs in from the left bleed; the faint foot rule runs edge to edge over the compact contact
    // row. The postage box, the address block and the barcode strip keep their mail-rule sizes and places and are only small light markups
    // set into the design (luminance 243: vendors print black ink and USPS needs a light field there).
    // zones (pt, trim coordinates): postage 84 x 98.25 top right, address block 240 x 112.5, barcode strip 342 x 45 bottom right
    const dx = W - 648, X = 18, G = 6, B = K.back || {};   // X: live type 0.25 in inside trim
    const Z = {postage: [552 + dx, 12, 84, 98.25], address: [405 + dx, 187.5, 240, 112.5], barcode: [306 + dx, 387, 342, 45]};
    window.__zones = Z; window.__cardX = X;
    const rx = Z.address[0], MP = 5, FT = Z.address[1] + Z.address[3] + MP + 8, cardH = 44, cardY = FT + (Z.barcode[1] - MP - FT - cardH)/2;
    const MR = rx - MP - 16, lw = MR - X, FB = FT - 9;   // the content block left of the address block: X .. MR, down to FB
    h += `<div class="taupe" style="left:-9pt;top:-9pt;width:${W + 18}pt;height:${H + 18}pt"></div>`;

    el.style.fontSize = Math.max(6, fs) + 'pt'; el.dataset.fs = el.style.fontSize; }
  // owner 11/7 back rule: the standard contact card runs full width, and the light mail panels stay around the three postal zones (they never grow into a plain light block)
  // owner 11/7: the Just Sold back's six bullets are long (8 words or more) and the box is at least 85% filled with text (heading, bullet lines, call line against the box's inner height)
  function jsCheck(){ const out = [], box = document.querySelector('.sheet .pc-wbox'); if(!box) return out;
    const items = [...box.querySelectorAll('.stp, .hb .tx')], hOf = el => { const r = document.createRange(); r.selectNodeContents(el); return [...r.getClientRects()].reduce((m, q) => Math.max(m, q.bottom), 0) - [...r.getClientRects()].reduce((m, q) => Math.min(m, q.top), 1e9); };
    items.forEach((el, i) => { const w = el.textContent.trim().split(/\s+/).filter(Boolean).length; if(w < 8) out.push({slot: 'back.step' + i, kind: 'js-bullet-too-short', detail: `${w} words: "${el.textContent.trim()}"`}); });
    if(items.length < 6) out.push({slot: 'back.steps', kind: 'fewer-than-six-bullets', detail: items.length + ' bullets'});
    const cs = getComputedStyle(box), inner = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom), line = el => { const r = document.createRange(); r.selectNodeContents(el); const rs = [...r.getClientRects()].filter(q => q.width > 1); const lh = parseFloat(getComputedStyle(el).lineHeight) || 0; const rows = new Set(rs.map(q => Math.round(q.top))).size; return rows*lh; };
    let used = items.reduce((n, el) => n + line(el), 0); const k = box.querySelector('.k'), call = box.querySelector('.pc-call'); if(k) used += parseFloat(getComputedStyle(k).lineHeight) || 11; if(call) used += parseFloat(getComputedStyle(call).lineHeight) || 16;
    const fill = used/inner; window.__jsFill = +fill.toFixed(2);
    if(fill < .85) out.push({slot: 'back.steps', kind: 'js-box-under-85', detail: `the Just Sold box is ${Math.round(fill*100)}% full (85% minimum)`});
    return out; }
  // the Just Sold bullets take the largest size at which every one sets in full lines inside the box, then the leading opens until the box is at least 85% filled
  function fitSteps(){ const box = document.getElementById('stepsbox'), list = document.getElementById('stepslist'); if(!box || !list) return;
    if(big){   // 6x11: one column, every step one full line, the largest size from 15.5 pt down to the 6x9's x1.08; the box is sized to its content, set on the card's top, the call to action centered above it
      const stp = [...list.querySelectorAll('.stp')], its = [...list.querySelectorAll('.it')];
      let best = null;
      for(let fs = 15.5; fs >= 14.1 - 1e-6; fs -= 0.1){ list.style.fontSize = fs + 'pt'; const lh = fs*1.62; list.style.lineHeight = lh + 'pt'; stp.forEach(e => { e.dataset.lh = lh; }); its.forEach(it => { it.querySelector('.bx').style.marginTop = (lh*.42) + 'pt'; }); SW.fill();
        if(stp.every(e => SW.lines(e).n === 1)){ const fill = Math.min(...stp.map(e => (e.getBoundingClientRect().width ? (() => { const r = document.createRange(); r.selectNodeContents(e); const q = [...r.getClientRects()]; return q.length ? (Math.max(...q.map(x => x.right)) - Math.min(...q.map(x => x.left)))/list.getBoundingClientRect().width : 0; })() : 0))); best = {fs, lh, fill}; break; } }
      if(!best) return;
      box.style.justifyContent = 'flex-start'; box.style.gap = '8pt'; box.style.height = 'auto';
      const hpt = box.getBoundingClientRect().height*0.75, bottom = parseFloat(box.style.top) + (+box.dataset.bh0 || 0), top0 = parseFloat(box.style.top), end = top0 + parseFloat(box.dataset.bh0 || 0);
      const boxBottom = +box.dataset.bottom || 296, newTop = top0 + Math.max(0, (boxBottom - top0 - hpt)/2);   // owner 11/16: centered in its block (the question now stands beside the mail zones) box.style.top = newTop + 'pt'; box.style.height = hpt + 'pt';
      const cta = document.getElementById('jscta'), sb = window.__hdrB, room = newTop - sb;
      if(cta && room >= 30){ const cs = Math.min(21, room - 12); cta.style.display = ''; cta.style.fontSize = cs + 'pt'; cta.style.lineHeight = (cs*1.3) + 'pt'; cta.style.height = (cs*1.3) + 'pt'; cta.style.top = (sb + (room - cs*1.3)/2) + 'pt'; }
      return; }
    const stp = [...list.querySelectorAll('.stp')], its = [...list.querySelectorAll('.it')], fits = () => box.scrollHeight <= box.clientHeight + .5;
    const okLines = () => stp.every(e => { const L = SW.lines(e); return L.n === 1 || (L.fill >= .9 && L.min >= .8); });
    const apply = (fs, m) => { list.style.fontSize = fs + 'pt'; list.style.lineHeight = (fs*m) + 'pt'; stp.forEach(e => { e.dataset.lh = fs*m; }); its.forEach(it => { it.querySelector('.bx').style.marginTop = (fs*m*.42) + 'pt'; }); SW.fill(); };
    const sizes = []; for(let f = big ? 13.5 : 13; f >= 9.5 - 1e-6; f -= 0.1) sizes.push(+f.toFixed(2));
    for(const fs of sizes){ apply(fs, 1.25); if(!(okLines() && fits())) continue;
      for(let m = 1.25; m <= 1.7; m += .03){ apply(fs, m); if(!fits() || !okLines()){ apply(fs, m - .03); break; } jsCheck(); if(window.__jsFill >= .87) break; }
      return; }
    apply(sizes[sizes.length - 1], 1.25); }
  function backCheck(){ const out = [], pt = v => v*72/96, sh = document.querySelector('.sheet').getBoundingClientRect(), X0 = window.__cardX || 30;
    const cc = document.querySelector('.sheet .cc');
    if(!cc) out.push({slot: 'back.card', kind: 'no-contact-card', detail: 'the back has no standard contact card'});
    else { const r = cc.getBoundingClientRect(), l = pt(r.left - sh.left), rr = pt(r.right - sh.left), Wt = pt(sh.width) - 18;
      if(l > X0 + 1 || rr < Wt - X0 - 1) out.push({slot: 'back.card', kind: 'card-not-full-width', detail: `card spans ${l.toFixed(0)}-${rr.toFixed(0)} pt of ${Wt.toFixed(0)}`}); }
    let area = 0; document.querySelectorAll('.sheet [data-mail-panel]').forEach(el => { const r = el.getBoundingClientRect(); const w = Math.min(pt(r.right - sh.left) - 9, pt(sh.width) - 18) - Math.max(pt(r.left - sh.left) - 9, 0), h = Math.min(pt(r.bottom - sh.top) - 9, 432) - Math.max(pt(r.top - sh.top) - 9, 0); area += Math.max(0, w)*Math.max(0, h); });
    if(area > .25*(pt(sh.width) - 18)*432) out.push({slot: 'back.panels', kind: 'light-block-too-big', detail: `mail panels cover ${(100*area/((pt(sh.width) - 18)*432)).toFixed(0)}% of the card`});
    if(sold) out.push(...jsCheck());
    return out; }
  // nothing but the proof guides may sit in the mail vendor's zones (postage, address block, barcode strip)
  function lum(c){ const m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(c); return m ? .2126*m[1] + .7152*m[2] + .0722*m[3] : 0; }
  function panelCheck(){ const out = [], Z = window.__zones, sh = document.querySelector('.sheet').getBoundingClientRect(), pt = v => v*72/96;
    const panels = [...document.querySelectorAll('.mailp')].map(p => { const r = p.getBoundingClientRect(); return {l: pt(r.left - sh.left), t: pt(r.top - sh.top), r: pt(r.right - sh.left), b: pt(r.bottom - sh.top), lum: lum(getComputedStyle(p).backgroundColor)}; });
    if(!panels.length) out.push({slot: 'back.panel', kind: 'mail-panel-missing', detail: 'no light panel under the mail zones'});
    ['postage', 'address', 'barcode'].forEach(k => { const z = Z[k], p = panels.find(q => q.l <= z[0] + .5 && q.t <= z[1] + .5 && q.r >= z[0] + z[2] - .5 && q.b >= z[1] + z[3] - .5);
      if(!p) out.push({slot: 'back.' + k, kind: 'mail-zone-not-light', detail: `the ${k} zone is not fully on a light panel`});
      else if(p.lum < 200) out.push({slot: 'back.' + k, kind: 'mail-zone-not-light', detail: `the ${k} panel's luminance is ${Math.round(p.lum)} (200 minimum): vendors print black ink and USPS needs a light field`}); });
    // the taupe runs to every edge: nothing outside the three panels is light
    return out; }
  // the Just Sold bullets: each takes the longest wording that sets in 3 lines (2 on the 6x9) so the six read as full sentences
  function fitHelp(){
    const hbs = [...document.querySelectorAll('.hb')], grid = document.querySelector('.pc-help'), call = grid.parentElement.querySelector('.pc-call');
    const pick = maxL => hbs.forEach(el => { const tx = el.querySelector('.tx'), alts = JSON.parse(el.dataset.alts).slice().sort((p, q) => q.length - p.length); let best = null, bf = -1;
      for(const a of alts){ tx.textContent = a; const L = SW.lines(tx); if(L.n > maxL) continue; if(L.n === 1 || L.fill >= .76){ best = a; bf = 9; break; } if(L.fill > bf){ best = a; bf = L.fill; } }
      tx.textContent = best || alts[alts.length - 1]; });
    const over = () => Math.max(...hbs.map(e => e.getBoundingClientRect().bottom)) > call.getBoundingClientRect().top - 5 || grid.parentElement.scrollHeight > grid.parentElement.clientHeight + .5;
    const bad = () => hbs.filter(el => { const L = SW.lines(el.querySelector('.tx')); return L.n > 1 && L.fill < .75; });
    // the bullets take the largest size at which all six set in full lines (last line 3/4 full) inside the box: no empty band under the heading
    const base = big ? 8.5 : 8, top = big ? 15 : 12; let bestCfg = null;
    const apply = fs => hbs.forEach(el => { el.style.fontSize = fs + 'pt'; el.style.lineHeight = (fs*1.32) + 'pt'; el.querySelector('.bx').style.marginTop = (fs*1.32/2 - 2) + 'pt'; });
    // every size is tried; the one whose bullets keep the fullest wording (then the larger type) wins, all six on full last lines inside the box
    for(let fs = top; fs >= base; fs -= .25) for(const maxL of (big ? [3, 2] : [3, 2])){
      apply(fs); pick(maxL); if(over() || bad().length) continue;
      const len = hbs.reduce((n, el) => n + el.querySelector('.tx').textContent.length, 0), sc = fs*1000 + len;
      if(!bestCfg || sc > bestCfg.sc) bestCfg = {fs, maxL, sc}; }
    if(bestCfg){ apply(bestCfg.fs); pick(bestCfg.maxL); } else { apply(base); pick(3); }
    { const bxel = grid.parentElement; if(over() || bxel.scrollHeight > bxel.clientHeight + .5) issues.push({slot: 'back.steps', kind: 'steps-overflow', detail: 'the six bullets and the call line do not fit their box'}); }
    hbs.forEach(el => { const tx = el.querySelector('.tx'), L = SW.lines(tx); delete el.dataset.slot;
      if(L.n > 1 && L.fill < .75) issues.push({slot: 'back.step' + el.dataset.help, kind: 'last-line-short', detail: `last line is ${Math.round(L.fill*100)}% full (75% minimum): "${tx.textContent.slice(-24)}"`}); });
  }
  function mailCheck(){ const out = [], Z = window.__zones, pt = v => v*72/96, sh = document.querySelector('.sheet').getBoundingClientRect();
    const hit = (r, z) => pt(r.left - sh.left) < z[0] + z[2] - .5 && pt(r.right - sh.left) > z[0] + .5 && pt(r.top - sh.top) < z[1] + z[3] - .5 && pt(r.bottom - sh.top) > z[1] + .5;
    // owner 11/16: the photo band runs under the postage box; the light markup laid over it (z-index above the photo) covers the whole zone, so a
    // photo counts as in the zone only where no light markup covers it; type, boxes and cards always count
    const covered = k => [...document.querySelectorAll('.sheet .mailp')].some(p => { const r = p.getBoundingClientRect(), z = Z[k]; return pt(r.left - sh.left) <= z[0] + .5 && pt(r.top - sh.top) <= z[1] + .5 && pt(r.right - sh.left) >= z[0] + z[2] - .5 && pt(r.bottom - sh.top) >= z[1] + z[3] - .5 && +getComputedStyle(p).zIndex >= 4; });
    document.querySelectorAll('.sheet .ph, .sheet .pc-wbox, .sheet .cap, .sheet .cc, .sheet .pc-ret, .sheet .pc-bstatus, .sheet .pc-disc').forEach(el => {
      const r = el.getBoundingClientRect(); for(const k in Z) if(hit(r, Z[k]) && !(el.classList.contains('ph') && covered(k))) out.push({slot: el.dataset.slot || el.className, kind: 'in-mail-zone', zone: k}); });
    return out; }
})();
