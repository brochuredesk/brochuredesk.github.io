<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>negative socials</title>
<link rel="stylesheet" href="../engine/ohlib.css">
<script src="../engine/ivory.js"></script>
<script src="../engine/ohlib.js"></script>
<script src="../engine/factrepeat.js"></script>
<script src="../engine/baths.js"></script>
<script src="../engine/setpage.js"></script>
<!--
Architectural Negative's own socials (owner 11/2/2026, Full Lineup review Q2). Black on white and nothing else. The flyer's
  solid black block carries the event (Open House: label in tracked caps, the date in heavy uppercase, the time) or, on Just
  Listed and Just Sold, the moment word over the address in heavy uppercase with the one logo knocked out at its right.
  Under it the photo group as the flyer front sets it: the whole house at left with two rooms stacked at its right (Open House,
  the Black Block flyer's second page: the house with the facts stacked beside it between heavy rules); the facts as number over
  caps label between thin black rules; then rooms under black caption plates (the room name in white), and the card with its
  black edge. The story puts the photo group on the top edge and a strip of rooms on the bottom edge. The wide shapes split into
  a black panel at left (event, address) and a white panel with the house, the facts and the card. Black and white only: no
  accent color. Every word is listing data, the package's copy or a fixed label. No price.
-->
<style>
  @font-face{font-family:'Archivo';font-weight:700;src:url(../../fonts/pool/archivo-latin-700-normal.woff2) format('woff2')}
  @font-face{font-family:'Archivo';font-weight:800;src:url(../../fonts/pool/archivo-latin-800-normal.woff2) format('woff2')}
  @font-face{font-family:'Archivo';font-weight:900;src:url(../../fonts/pool/archivo-latin-900-normal.woff2) format('woff2')}
  @font-face{font-family:'Inter';font-weight:400;src:url(../../fonts/pool/inter-latin-400-normal.woff2) format('woff2')}
  @font-face{font-family:'Inter';font-weight:500;src:url(../../fonts/pool/inter-latin-500-normal.woff2) format('woff2')}
  @font-face{font-family:'Inter';font-weight:600;src:url(../../fonts/pool/inter-latin-600-normal.woff2) format('woff2')}
  @font-face{font-family:'Inter';font-weight:700;src:url(../../fonts/pool/inter-latin-700-normal.woff2) format('woff2')}
  :root{--field:#ffffff;--acc:#000000;--txt:#1c1c1c;--dk:#000000;--line:rgba(0,0,0,.55)}
  *{box-sizing:border-box;margin:0;padding:0}
  .page{font-family:'Inter'}
  .t{position:absolute;white-space:nowrap;overflow:hidden}
  .w{white-space:normal}
</style>
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
SP.start(['700 10pt "Archivo"', '800 10pt "Archivo"', '900 10pt "Archivo"', '400 10pt "Inter"', '500 10pt "Inter"', '600 10pt "Inter"', '700 10pt "Inter"'], D => {
  const esc = Ivory.esc, K = SP.K, L = D.listing, A = D.agent || {};
  const kind = SP.kind(D), shape = D.piece.shape, E = OHL.event(D);
  if(E.time) E.time = E.time.replace(/(\d)\s+(am|pm)\b/gi, '$1 $2');   // a number never splits from am/pm
  const [W, H] = [D.piece.px[0]*K, D.piece.px[1]*K];
  const FL = SP.floor(shape), FE = FL.event, FB = FL.body, FS = FL.small;
  const hero = OHL.hero(D, 'straight');
  const rooms = OHL.photos(D).filter(id => id !== hero && !Ivory.fullHouse(D, id));
  const isOH = kind === 'oh', isJS = kind === 'js';
  const r1 = SP.r1, T = SP.T, rect = SP.rect, wd = SP.width, fit = SP.fitSize;
  const hs = OHL.cardMode(D) === 'headshot' && !!A.headshot;
  const AR = "font-family:'Archivo'", AS = "font-family:'Inter'", TONE = 'light';
  const ADDR = true ? L.address.toUpperCase() : L.address;
  let TIGHT = false;   // the heavy case on a short shape: leading and padding close up (never the type: that stays at its floor)

  const noteBox = (w, k, P) => {
    const items = [E.refreshments && [E.refreshments, true, 'oh.refreshments'], E.note && [E.note, false, 'oh.note']].filter(Boolean); if(!items.length) return null;
    const s = r1(Math.max(FB, FB*1.15*k)), lh = r1(s*(TIGHT ? 1.15 : 1.3)), pad = TIGHT ? 4 : r1(Math.max(8, s*.7)), ps = items.map(([text, bold, slot]) => {
      const css = `font:${bold ? 700 : 500} ${s}pt/${lh}pt 'Inter'`; return {text, bold, slot, n: SP.linesNW(text, css, w - 2*pad - 2)}; });
    const h = ps.reduce((a, q) => a + q.n*lh, 0) + 2*pad + (ps.length - 1)*(2*pad);
    return {h, draw: (x, y) => { let yy = y + pad, o = rect(x, y, w, h, `border:1pt solid ${P.line}`).replace('<div class="abs"', '<div class="abs" data-box="oh.box"');
      ps.forEach((q, i) => { if(i){ o += rect(x, yy + pad - .4, w, .75, `background:${P.line}`); yy += 2*pad; }
        o += `<div class="abs w" style="left:${x + pad + 1}pt;top:${yy}pt;width:${w - 2*pad - 2}pt;height:${q.n*lh + 3}pt;text-wrap:balance;font:${q.bold ? 700 : 500} ${s}pt/${lh}pt 'Inter';color:${P.body}" data-slot="${q.slot}" data-lines="${q.n}">${esc(q.text)}</div>`; yy += q.n*lh; });
      return o; }};
  };
  const addrNum = (ADDR.match(/^\s*(\d+[A-Za-z-]*)\s+(.*)$/) || [null, '', ADDR]);
  // the address: big Archivo; one line when it fits at its size, else the number over the street
  const address = (w, k, max, P) => {
    const css = `font-weight:900;${AR};letter-spacing:-.5pt`, s = fit(ADDR, css, w, r1(Math.max(FE*1.1, max*k)), FE);
    if(wd(ADDR, `${css};font-size:${s}pt`) <= w){ const h = r1(s*1.18); return {h, draw: (x, y) => T(`${css};font-size:${s}pt;color:${P.ink};text-align:left`, esc(ADDR), x, y, w, h, 'data-slot="address" data-lines="1"')}; }
    const st = addrNum[2], s2 = fit(st, css, w, r1(Math.max(FE*1.1, max*k*.85)), FE), h = r1(s2*1.18);
    return {h: h*2, bad: wd(st, `${css};font-size:${s2}pt`) > w, draw: (x, y) => T(`${css};font-size:${s2}pt;color:${P.ink};text-align:left`, esc(addrNum[1]), x, y, w, h, 'data-slot="address" data-lines="1"') +
      T(`${css};font-size:${s2}pt;color:${P.ink};text-align:left`, esc(st), x, y + h, w, h, 'data-slot="address" data-lines="1"')};
  };
  const city = (w, k, P) => { const t = OHL.place(L).toUpperCase(), css = `font-weight:800;${AR};letter-spacing:.2em`, s = fit(t, css, w, r1(Math.max(FS*1.1, 13*k)), FS), h = r1(s*1.5);
    if(wd(t, `${css};font-size:${s}pt`) > w) return null;
    return {h, draw: (x, y) => T(`${css};font-size:${s}pt;color:${P.sub};text-align:left`, esc(t), x, y, w, h, 'data-slot="place" data-lines="1"')}; };
  // the facts as a stack of window cells: a mint edge, the caps label over the bold number (the flyer's table, set as lights)
  const cells = (w, k, P, o) => {
    o = o || {}; const f = SP.facts(D); if(!f.length) return null;
    const lcss = `font-weight:800;${AR};letter-spacing:.1em;text-transform:uppercase`, l2 = Math.max(FS, r1(11*k)), vs = Math.max(FB*1.2, r1(22*k)), lh = r1(l2*1.4), vh = r1(vs*1.2), ch = lh + vh + 8, n = f.length, per = o.cols || 1;
    const cw = (w - (per - 1)*10)/per; if(f.some(([lb]) => wd(lb.toUpperCase(), `${lcss};font-size:${l2}pt`) > cw - 12)) return null;
    const rws = Math.ceil(n/per);
    return {h: rws*ch - 8, draw: (x, y) => f.map(([lb, v, key], i) => { const cx = x + (i % per)*(cw + 10), cy = y + Math.floor(i/per)*ch;
      return rect(cx, cy, 3, lh + vh, `background:${P.bar}`) + T(`${lcss};font-size:${l2}pt;color:${P.sub};text-align:left`, esc(lb), cx + 10, cy, cw - 10, lh, 'data-small="1"') +
        T(`font-weight:900;${AR};font-size:${vs}pt;color:${P.ink};text-align:left`, v, cx + 10, cy + lh, cw - 10, vh, `data-slot="fact.${key}" data-lines="1"`); }).join('')};
  };
  // the agent card: a bar, round headshot when the card has one, name, REALTOR(R), Call / Text and the phone
  const agent = (w, k, P, o) => {
    o = o || {};
    const hsd = hs && !o.nohs ? r1(Math.min(w*.26, 54)) : 0, tx = 10 + (hsd ? hsd + 8 : 0), tw = w - tx;
    const ncss = `font-weight:800;${AR}`, nS = fit(A.name || '', ncss, tw, r1(Math.max(FB*1.45, 24*k)), FB);
    const nH = r1(nS*(TIGHT ? 1.1 : 1.2)), nar = A.nar || /realtor/i.test(A.designation || ''), dS = Math.max(FS, r1(10.5*k)), dH = r1(dS*(TIGHT ? 1.2 : 1.5));
    const lab = A.phoneLabel || 'Call / Text'; let pS = r1(Math.max(FB*1.1, 17*k));
    const lcss = `font-weight:800;${AR};letter-spacing:.12em;text-transform:uppercase`, lS = Math.max(FS, r1(10.5*k));
    const oneLine = () => wd(lab.toUpperCase(), `${lcss};font-size:${lS}pt`) + 8 + wd(A.phone || '', `font-weight:700;${AS};font-size:${pS}pt`) <= tw;
    while(!oneLine() && pS > FB) pS = r1(pS - .5);
    const stack = !oneLine(), pH = r1(pS*(TIGHT ? 1.15 : 1.3)), lH = r1(lS*(TIGHT ? 1.2 : 1.5)), ch = nH + (nar ? dH : 0) + (stack ? lH : 0) + pH, h = Math.max(ch, hsd) + 6;
    return {h, bad: wd(A.name || '', `${ncss};font-size:${nS}pt`) > tw, draw: (x, y) => {
      let s = rect(x, y, 3, h, `background:${P.bar}`);
      if(hsd) s += `<div class="abs" style="left:${x + 10}pt;top:${y + (h - hsd)/2}pt;width:${hsd}pt;height:${hsd}pt;border-radius:50%;overflow:hidden;border:1.5pt solid ${P.bar}"><img src="${esc(A.headshot)}" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></div>`;
      let yy = y + (h - ch)/2;
      s += T(`${ncss};font-size:${nS}pt;color:${P.ink};text-align:left`, esc(A.name || ''), x + tx, yy, tw, nH, 'data-slot="agent.name" data-lines="1"'); yy += nH;
      if(nar){ s += T(`${lcss};font-size:${dS}pt;color:${P.sub};text-align:left;letter-spacing:.2em`, 'REALTOR®', x + tx, yy, tw, dH, 'data-slot="agent.desig" data-small="1" data-lines="1"'); yy += dH; }
      if(stack){ s += T(`${lcss};font-size:${lS}pt;color:${P.sub};text-align:left`, esc(lab), x + tx, yy, tw, lH, 'data-small="1"'); yy += lH; }
      s += T(`font-weight:700;${AS};font-size:${pS}pt;color:${P.ink};text-align:left`, `${stack ? '' : `<span data-small="1" style="${lcss};font-size:${lS}pt;color:${P.sub};margin-right:8pt">${esc(lab)}</span>`}${esc(A.phone || '')}`, x + tx, yy, tw, pH, 'data-slot="agent.phone" data-lines="1"');
      return s; }};
  };
  const writeup = (w, k, maxN, P) => { const s = r1(Math.max(FB, FB*1.15*k)), lh = r1(s*1.38), css = `font:500 ${s}pt/${lh}pt 'Inter';text-align:left`;
    const r = SP.fillText(SP.pool(D), css, w, maxN, true); if(!r) return null;
    return {h: r.n*lh + 2, draw: (x, y) => `<div class="abs w" style="left:${x}pt;top:${y}pt;width:${r.w}pt;height:${r.n*lh}pt;font:500 ${s}pt/${lh}pt 'Inter';color:${P.body};text-align:left" data-slot="listing.body" data-lines="${r.n}">${esc(r.text)}</div>`}; };
  // Just Sold: the short "thinking about selling" line from the Just Sold copy; each part's size steps down until it is one line or its last line is 3/4 full
  const soldBlock = (w, k, P) => { const S = SP.soldLine(D), sb0 = r1(Math.max(FB, FB*1.15*k)), hs0 = r1(Math.max(FB*1.3, 22*k));
    const sized = (text, start, min, mk) => { if(!text) return {n: 0, s: start, l: 0, w}; let best = null; for(let f = 1; f >= .66; f -= .04){ const ww = r1(w*f*2)/2; for(let s = start; s >= min; s -= .5){ const m = SP.para(text, mk(s, r1(s*1.25)), ww); if(m.n === 1 || m.fill >= .75){ best = {n: m.n, s, l: r1(s*1.25), w: ww}; break; } } if(best) break; } if(!best){ const m = SP.para(text, mk(min, r1(min*1.25)), w); best = {n: m.n, s: min, l: r1(min*1.25), w}; } return best; };
    const hd = sized(S.head, hs0, FB*1.1, (s, l) => `font:900 ${s}pt/${l}pt 'Archivo'`), ln = sized(S.line, sb0, FB, (s, l) => `font:500 ${s}pt/${l}pt 'Inter'`);
    const h = hd.n*hd.l + ln.n*ln.l + (hd.n && ln.n ? 3 : 0); if(!h) return null;
    return {h, draw: (x, y) => (hd.n ? `<div class="abs w" style="left:${x}pt;top:${y}pt;width:${hd.w}pt;height:${hd.n*hd.l + 3}pt;font:900 ${hd.s}pt/${hd.l}pt 'Archivo';color:${P.sub}" data-slot="sold.head" data-lines="${hd.n}">${esc(S.head)}</div>` : '') +
      (ln.n ? `<div class="abs w" style="left:${x}pt;top:${y + hd.n*hd.l + (hd.n ? 3 : 0)}pt;width:${ln.w}pt;height:${ln.n*ln.l + 3}pt;font:500 ${ln.s}pt/${ln.l}pt 'Inter';color:${P.body}" data-slot="sold.line" data-lines="${ln.n}">${esc(S.line)}</div>` : '')}; };
  const logoBlk = (w, maxH) => { const lgH = r1(Math.min(maxH, w*.34)), lgW = r1(Math.min(w, lgH/.36)); return {h: lgH, w: lgW, draw: (x, y) => OHL.logo(D, TONE, `left:${x}pt;top:${y}pt;width:${lgW}pt;height:${lgH}pt;justify-content:flex-start`)}; };

  const place = (html, x, y) => `<div class="abs" style="left:${x}pt;top:${y}pt;width:0;height:0;overflow:visible">${html}</div>`;

  const BLK = {ink: '#fff', sub: '#fff', body: '#fff', line: 'rgba(255,255,255,.7)', bar: '#fff'};
  const WHT = {ink: '#000', sub: '#000', body: '#1c1c1c', line: 'rgba(0,0,0,.6)', bar: '#000'};
  const BS = "'Inter'", plain = v => String(v).replace(/<[^>]*>/g, ''), G = 4;
  const logoK = (w, maxH) => { const lgH = r1(Math.min(maxH, w*.34)), lgW = r1(Math.min(w, lgH/.36)); return {h: lgH, w: lgW, draw: (x, y) => OHL.logo(D, 'dark', `left:${x}pt;top:${y}pt;width:${lgW}pt;height:${lgH}pt;justify-content:flex-start`)}; };
  // the head, white on black: tracked caps label, the date in heavy uppercase, the time; Just Listed / Just Sold: the moment word, heavy
  const head = (w, k) => {
    const parts = [], UP = t => t.toUpperCase(); let bad = false;
    if(isOH){
      const lab = UP(E.label), lcss = `font-weight:${800};${AR};letter-spacing:${TIGHT ? '.08em' : '.2em'}`;
      let s = fit(lab, lcss, w, r1(Math.max(FE, 17*k)), FE), lines = [lab];
      if(wd(lab, `${lcss};font-size:${s}pt`) > w){ lines = OHL.labelLines(E.label, 2).map(UP); s = Math.min(...lines.map(t => fit(t, lcss, w, r1(Math.max(FE, 17*k)), FE))); }
      const lh = r1(s*(TIGHT ? 1.08 : 1.4)); bad = bad || lines.some(t => wd(t, `${lcss};font-size:${s}pt`) > w);
      parts.push({h: lines.length*lh, f: (x, y) => lines.map((t, i) => T(`${lcss};font-size:${s}pt;color:#fff;text-align:left`, esc(t), x, y + i*lh, w, lh, 'data-slot="oh.label" data-lines="1"')).join('')});
      const dcss = `font-weight:${TIGHT ? 800 : 900};${AR};letter-spacing:${TIGHT ? '-1.2pt' : '-.4pt'}`, dl = UP(E.long), big = r1(Math.max(FE*1.6, 40*k)), s1 = fit(dl, dcss, w, big, FE*(TIGHT ? 1 : 1.6));
      if(wd(dl, `${dcss};font-size:${s1}pt`) <= w){ const h = r1(s1*(TIGHT ? 1.06 : 1.15)); parts.push({h, f: (x, y) => T(`${dcss};font-size:${s1}pt;color:#fff;text-align:left`, esc(dl), x, y, w, h, 'data-slot="oh.date" data-lines="1"')}); }
      else {
        const md = UP(E.monthDay || E.long), sd = fit(md, dcss, w, big, FE), hd = r1(sd*(TIGHT ? 1.06 : 1.15)); if(wd(md, `${dcss};font-size:${sd}pt`) > w) bad = true;
        if(E.weekday){ const sw = Math.max(FE, r1(sd*.5)), hw = r1(sw*(TIGHT ? 1.1 : 1.3)); parts.push({h: hw, f: (x, y) => T(`font-weight:700;${AS};font-size:${sw}pt;letter-spacing:.16em;text-transform:uppercase;color:#fff;text-align:left`, esc(E.weekday), x, y, w, hw, 'data-slot="oh.day" data-lines="1"')}); }
        parts.push({h: hd, f: (x, y) => T(`${dcss};font-size:${sd}pt;color:#fff;text-align:left`, esc(md), x, y, w, hd, 'data-slot="oh.date" data-lines="1"')});
      }
      if(E.time){ const tcss = `font-weight:600;${AS}`, st = fit(E.time, tcss, w, r1(Math.max(FE*1.2, 26*k)), FE), ht = r1(st*(TIGHT ? 1.1 : 1.3)); if(wd(E.time, `${tcss};font-size:${st}pt`) > w) bad = true;
        parts.push({h: ht, f: (x, y) => T(`${tcss};font-size:${st}pt;color:#fff;text-align:left`, esc(E.time), x, y, w, ht, 'data-slot="oh.time" data-lines="1"')}); }
    } else {
      const word = UP(kind === 'jl' ? 'Just Listed' : 'Just Sold'), css = `font-weight:900;${AR};letter-spacing:.06em`, s = fit(word, css, w, r1(Math.max(FE*1.3, 30*k)), FE), h = r1(s*1.2); if(wd(word, `${css};font-size:${s}pt`) > w) bad = true;
      parts.push({h, f: (x, y) => T(`${css};font-size:${s}pt;color:#fff;text-align:left`, esc(word), x, y, w, h, 'data-slot="moment" data-lines="1"')});
    }
    const gap = TIGHT ? 0 : 3, h = parts.reduce((a, p) => a + p.h, 0) + gap*(parts.length - 1);
    return {h, bad, draw: (x, y) => { let yy = y; return parts.map(p => { const o = p.f(x, yy); yy += p.h + gap; return o; }).join(''); }};
  };
  // the facts: number over a caps label, a thin black rule between cells and a heavy one above (one row, or two)
  const factCells = (w, k) => {
    const f = SP.facts(D); if(!f.length) return null;
    const ns = Math.max(FB*1.4, r1(24*k)), ls = Math.max(FS, r1(11*k)), lcss = `font-weight:700;${AS};letter-spacing:.12em;text-transform:uppercase;font-size:${ls}pt`;
    const items = f.map(([lb, v, key]) => ({lb, v, key, w: Math.max(wd(plain(v), `font-weight:900;${AR};font-size:${ns}pt`), wd(lb.toUpperCase(), lcss)) + 14}));
    for(const nr of [1, 2]){
      const per = Math.ceil(items.length/nr), rws = []; for(let i = 0; i < items.length; i += per) rws.push(items.slice(i, i + per));
      if(rws.some(r => r.reduce((a, q) => a + q.w, 0) > w)) continue;
      const vh = r1(ns*1.15), lh = r1(ls*1.5), rh = vh + lh + 6, h = 4 + rws.length*rh + (rws.length - 1)*4;
      return {h, draw: (x, y) => { let s = rect(x, y, w, 3, 'background:#000'), yy = y + 6;
        rws.forEach(r => { const sum = r.reduce((a, q) => a + q.w, 0), ex = (w - sum)/r.length; let xx = x;
          r.forEach((q, i) => { const cw = q.w + ex; if(i) s += rect(xx, yy + 2, 1, rh - 6, 'background:rgba(0,0,0,.5)');
            s += T(`font-weight:900;${AR};font-size:${ns}pt;color:#000;text-align:left`, q.v, xx + (i ? 9 : 0), yy, cw - 6, vh, `data-slot="fact.${q.key}" data-lines="1"`) +
              T(`${lcss};color:#000;text-align:left`, esc(q.lb), xx + (i ? 9 : 0), yy + vh, cw - 6, lh, 'data-small="1"'); xx += cw; });
          yy += rh + 4; });
        return s; }};
    }
    return null;
  };
  // the facts as a column beside the house (Open House): heavy rule over each, number over label; one line each when the cell is short
  const factColumn = (w, h) => {
    const f = SP.facts(D); if(!f.length) return null; const n = f.length, ch = h/n, ls = Math.max(FS, 11), lcss = `font-weight:700;${AS};letter-spacing:.12em;text-transform:uppercase;font-size:${ls}pt`;
    for(let ns = Math.max(FB*1.4, 26); ns >= FB*1.2; ns -= 1){
      const two = ch >= ns*1.15 + ls*1.5 + 10; let ok = true, out = [];
      f.forEach(([lb, v, key]) => { const vw = wd(plain(v), `font-weight:900;${AR};font-size:${ns}pt`), lw = wd(lb.toUpperCase(), lcss); if(two ? Math.max(vw, lw) > w - 4 : vw + 6 + lw > w - 4) ok = false; });
      if(ok && (two || ch >= ns*1.25 + 4)) return {draw: (x, y) => f.map(([lb, v, key], i) => { const cy = y + i*ch, vh = r1(ns*1.15);
        return rect(x, cy, w, i ? 1 : 3, 'background:#000') + (two ?
          T(`font-weight:900;${AR};font-size:${ns}pt;color:#000;text-align:left`, v, x, cy + (ch - vh - ls*1.5)/2 + 2, w, vh, `data-slot="fact.${key}" data-lines="1"`) + T(`${lcss};color:#000;text-align:left`, esc(lb), x, cy + (ch - vh - ls*1.5)/2 + 2 + vh, w, r1(ls*1.5), 'data-small="1"') :
          T(`font-weight:900;${AR};font-size:${ns}pt;color:#000;text-align:left`, `${v}<span data-small="1" style="${lcss};margin-left:6pt">${esc(lb)}</span>`, x, cy + (ch - ns*1.25)/2 + 1, w, r1(ns*1.25), `data-slot="fact.${key}" data-lines="1"`)); }).join('')};
    }
    return null;
  };
  // rooms under black caption plates: the room's name in white (two lines when a name does not fit one); the house group above holds the first two rooms
  const plates = (w, ph, o) => {
    o = o || {}; const pool = rooms.slice(2), ns = Math.max(FB, 14), lh = r1(ns*1.25); let n = Math.min(o.n || 3, pool.length); if(!n) return null;
    const fits = (m, pw) => pool.slice(0, m).every(id => wd(SP.roomName(D, id), `font-weight:700;${AS};font-size:${ns}pt`) <= pw - 12);
    if(!fits(n, (w - G*(n - 1))/n) && n > 2) n = 2;
    const pw = (w - G*(n - 1))/n, two = !fits(n, pw), nh = (two ? 2 : 1)*lh + 8;
    return {h: ph + nh, draw: (x, y) => pool.slice(0, n).map((id, i) => { const xx = x + i*(pw + G);
      return OHL.photo(D, id, `left:${xx}pt;top:${y}pt;width:${pw}pt;height:${ph}pt`) + rect(xx, y + ph, pw, nh, 'background:#000') +
        `<div class="abs w" style="left:${xx + 6}pt;top:${y + ph + 4}pt;width:${pw - 10}pt;height:${(two ? 2 : 1)*lh + 2}pt;font:700 ${ns}pt/${lh}pt ${BS};color:#fff;text-align:left" data-slot="room.name" data-lines="${two ? 2 : 1}">${esc(SP.roomName(D, id))}</div>`; }).join('')};
  };
  // the photo group: the house at left; at right two rooms stacked (mode 'rooms') or the facts column (mode 'facts')
  const group = (w, ph, mode) => {
    if(mode === 'hero'){ const fr = SP.heroFrame(D, hero, w, ph, true); if(fr.w < w*.4) return null; return {h: fr.h, fw: fr.w, draw: (x, y) => OHL.photo(D, hero, `left:${x + (w - fr.w)/2}pt;top:${y}pt;width:${fr.w}pt;height:${fr.h}pt`)}; }
    const fw = r1(w*(mode === 'facts' ? .6 : .62)), fr = SP.heroFrame(D, hero, fw, ph, true); if(fr.w < fw*.88) return null;
    const rw = w - fr.w - G; let right = null;
    if(mode === 'rooms'){ const n = Math.min(2, rooms.length); if(n < 2) return null; right = (x, y) => rooms.slice(0, 2).map((id, i) => OHL.photo(D, id, `left:${x}pt;top:${y + i*((fr.h - G)/2 + G)}pt;width:${rw}pt;height:${(fr.h - G)/2}pt`)).join(''); }
    else { const fc = factColumn(rw, fr.h); if(!fc) return null; right = (x, y) => fc.draw(x, y); }
    return {h: fr.h, fw: fr.w, draw: (x, y) => OHL.photo(D, hero, `left:${x}pt;top:${y}pt;width:${fr.w}pt;height:${fr.h}pt`) + right(x + fr.w + G, y)};
  };
  const blockRect = (x, y, w, h) => rect(x, y, w, h, 'background:#000');

  // ---- carousel slide: the photo on the top edge, a black plate with the room's name, the caption, the card ----------------------------------------
  const slide = () => {
    const id = D.piece.photo, MG = Math.max(14, W*.045), CW = W - 2*MG;
    TIGHT = true; const hd = head(CW - 2*10, .7);
    const ag = agent(CW*.64, .85, WHT, {nohs: true}), ft = ag.h + 16, lg = logoBlk(CW*.32, ag.h);
    let nm = '', cap = null, capH = 0, nh = 0, cs = 0, lh = 0, ncs = 0;
    if(!isJS){ nm = SP.roomName(D, id); const pool = SP.caption(D, id).filter(t => t !== nm);
      if(pool.length){ for(cs = 22; cs >= FB; cs -= .5){ lh = r1(cs*1.3); const r = SP.fillText(pool, `font:500 ${cs}pt/${lh}pt ${BS};text-align:left`, CW, cs > 16 ? 2 : 4, false); if(r && r.fill >= .8){ cap = r; break; } } if(!cap){ cs = FB; lh = r1(cs*1.3); cap = SP.fillText(pool.slice(0, 1), `font:500 ${cs}pt/${lh}pt ${BS};text-align:left`, CW, 6, false, .6); }
        if(cap && cap.fill < .8){ for(let c2 = FB + .5; c2 <= 30; c2 += .5){ const l2 = r1(c2*1.3), r = SP.fillText(pool, `font:500 ${c2}pt/${l2}pt ${BS};text-align:left`, CW, 3, false, .6); if(r && r.fill >= .8){ cap = r; cs = c2; lh = l2; break; } } } }
      if(cap) capH = cap.n*lh; ncs = nm ? Math.max(FE, 26) : 0; nh = ncs ? r1(ncs*1.2) : 0; }
    const sold = isJS ? soldBlock(CW, 1.05, WHT) : null, plateH = 10 + hd.h + 10;
    const fixed = plateH + 12 + (nh ? nh + 4 : 0) + capH + (sold ? sold.h + 8 : 0) + 12 + ft + 6, ph = H - fixed;
    const isHouse = Ivory.fullHouse(D, id), fr = isHouse ? SP.heroFrame(D, id, W, ph, true) : {w: W, h: ph};
    let h = OHL.photo(D, id, `left:${(W - fr.w)/2}pt;top:0pt;width:${fr.w}pt;height:${fr.h}pt`), y = fr.h;
    h += blockRect(0, y, W, plateH) + hd.draw(MG + 10, y + 10); y += plateH + 12 + Math.max(0, ph - fr.h)/2;
    if(nh){ h += T(`font-weight:900;${AR};font-size:${ncs}pt;color:#000;text-align:left`, esc(nm), MG, y, CW, nh, 'data-slot="slide.room" data-lines="1"'); y += nh + 4; }
    if(cap) h += `<div class="abs w" style="left:${MG}pt;top:${y}pt;width:${cap.w}pt;height:${capH + 3}pt;font:500 ${cs}pt/${lh}pt ${BS};color:#1c1c1c;text-align:left" data-slot="slide.caption" data-lines="${cap.n}">${esc(cap.text)}</div>`;
    if(sold) h += sold.draw(MG, y);
    h += rect(MG, H - ft - 4, CW, 3, 'background:#000') + ag.draw(MG, H - ft + 6) + lg.draw(W - MG - lg.w, H - ft + 6 + (ag.h - lg.h)/2);
    return h;
  };

  // ---- portrait shapes -----------------------------------------------------------------------------------------------------------------------
  const rows = () => {
    const story = shape === 'story', safe = story ? 93.75 : 0, MG = Math.max(14, W*.045), CW = W - 2*MG, bot = H - (story ? 0 : MG*.8);
    for(let lvl = 0; lvl <= 5; lvl++) for(let k = story ? 1.6 : 1.1; k >= .7; k = Math.round((k - .05)*100)/100){
      TIGHT = lvl >= 3;
      const g = r1(Math.max(TIGHT ? 3 : 7, FE*.42*k)), pad = TIGHT ? 7 : r1(Math.max(11, W*.035)), bw = CW - 2*pad;
      const lg = logoK(bw*.28, 40), cw = bw - lg.w - 12;
      const hd = head(cw, k), bx = isOH ? noteBox(bw, k, BLK) : null;
      const ad = address(isOH ? CW : cw, k, 34, isOH ? WHT : BLK), ct = lvl >= 4 ? null : city(isOH ? CW : cw, k, isOH ? WHT : BLK);
      const ag = agent(CW, k, WHT, {nohs: lvl >= 2});
      if(!ad || ad.bad || ag.bad || hd.bad) continue;
      // the black block: the event (Open House), or the moment word over the address and city (Just Listed / Just Sold)
      const inBlock = isOH ? [hd, bx] : [hd, ad, ct], bi = inBlock.filter(Boolean), bgap = TIGHT ? 2 : 5;
      const blockH = Math.max(bi.reduce((a, p) => a + p.h, 0) + bgap*(bi.length - 1) + 2*pad, isOH ? 0 : lg.h + 2*pad);
      const tbar = isOH ? (() => { const hh = ad.h + (ct ? ct.h : 0) + 8; return {h: hh, bar: 1}; })() : null;
      const fcl = lvl >= 4 ? null : factCells(CW, k), wu = (kind === 'jl' && story && lvl <= 2) ? writeup(CW, k*1.35, 6, WHT) : (isJS && lvl <= 2) ? soldBlock(CW, k, WHT) : null;
      const rph = story ? safe : r1(Math.max(52, CW*.19*(lvl >= 2 ? .8 : 1))), tr = (lvl >= 1 && !story) ? null : plates(story ? W : CW, rph, {});
      const GROUP = {h: 0, group: 1}, BLOCK = {h: blockH, block: 1}, CARD = {h: ag.h + 8, card: 1};
      const stack = story ? [GROUP, BLOCK, tbar, fcl, wu, CARD] : [BLOCK, GROUP, tbar, fcl, wu, tr, CARD];
      const st = stack.filter(Boolean);
      const fixed = st.reduce((a, p) => a + p.h, 0) + g*(st.length - 1) + (story ? safe + g : 0) + (story ? 0 : MG*.2);
      const gh = bot - fixed, gmin = story ? 170 : Math.max(CW*.36 - lvl*6, 60);
      if(gh < gmin) continue;
      const gp = group(story ? W : CW, Math.min(gh, W*(story ? 1.05 : .8)), lvl >= 4 ? 'hero' : 'rooms'); if(!gp) continue;
      let y = story ? 0 : MG*.2, h = ''; const extra = Math.max(0, gh - gp.h), ex = extra/Math.max(1, st.length - 1 - (story ? 0 : 0));
      st.forEach(p => {
        if(p.group){ h += gp.draw(story ? 0 : MG, y); y += gp.h + g + ex; }
        else if(p.block){ h += blockRect(story ? 0 : 0, y, W, p.h);
          let yy = y + (p.h - bi.reduce((a, q) => a + q.h, 0) - bgap*(bi.length - 1))/2; bi.forEach(q => { h += q.draw(MG + (story ? 0 : 0), yy); yy += q.h + bgap; });
          if(!isOH) h += lg.draw(W - MG - lg.w, y + (p.h - lg.h)/2); else h += lg.draw(W - MG - lg.w, y + pad);
          y += p.h + g + ex; }
        else if(p.bar){ h += ad.draw(MG, y + 2) + (ct ? ct.draw(MG, y + 2 + ad.h) : ''); y += p.h + g; }
        else if(p.card){ h += rect(MG, y - g*.5, CW, 3, 'background:#000') + ag.draw(MG, y + g*.5); y += p.h + g; }
        else { h += p.draw(MG, y); y += p.h + g; }
      });
      if(story) h += plates(W, safe, {}) ? rooms.slice(2, 5).map((id, i, a) => OHL.photo(D, id, `left:${i*(W + G)/a.length}pt;top:${H - safe}pt;width:${(W - G*(a.length - 1))/a.length}pt;height:${safe}pt`)).join('') : '';
      return h;
    }
    return null;
  };

  // ---- the wide and short shapes: a black panel at left, a white panel at right -------------------------------------------------------------------
  const cols = () => {
    for(const tight of [false, true]) for(const lwf of [.42, .46, .5, .38, .34]) for(let lvl = 0; lvl <= 4; lvl++) for(let k = 1.05; k >= .7; k = Math.round((k - .05)*100)/100){
      TIGHT = tight;
      const M = tight ? Math.max(9.5, W*.016) : Math.max(11, W*.03), LW = r1(W*lwf), IW = LW - 2*M, RX = LW + M, RW = W - RX - M, g = r1(Math.max(tight ? 1.5 : 5, FE*.3*k));
      const hd = head(IW, k), bx = isOH ? noteBox(IW, k, BLK) : null, ad = address(IW, k, 28, BLK), ct = lvl >= 2 ? null : city(IW, k, BLK), lg = logoK(IW*.7, H*.13);
      const wu = isJS && lvl < 1 ? soldBlock(RW, k, WHT) : null, ag = agent(RW, k, WHT, {nohs: true}), fc = lvl >= 1 ? null : factCells(RW, k);
      if(!ad || ad.bad || ag.bad || hd.bad) continue;
      const left = [hd, bx, ad, ct].filter(Boolean), lfix = left.reduce((a, p) => a + p.h, 0) + g*(left.length - 1) + lg.h + g;
      if(lfix > H - 2*M + .01) continue;
      const right = [fc, wu, ag].filter(Boolean), rfix = right.reduce((a, p) => a + p.h, 0) + g*right.length, hh = H - 2*M - rfix;
      if(hh < Math.max(70, H*.22)) continue;
      const hf = SP.heroFrame(D, hero, RW, hh, true); if(hf.w < RW*.5) continue;
      let h = blockRect(0, 0, LW, H), y = M + (H - 2*M - lfix)/Math.max(1, left.length - 1)*0; const gx = Math.min((H - 2*M - lfix)/Math.max(1, left.length), g*1.5); y = M + (H - 2*M - lfix - gx*(left.length - 1))/2 - 0;
      left.forEach(p => { h += p.draw(M, y); y += p.h + g + gx; });
      h += lg.draw(M, H - M - lg.h);
      h += OHL.photo(D, hero, `left:${RX + (RW - hf.w)/2}pt;top:${M}pt;width:${hf.w}pt;height:${hf.h}pt`);
      const remH = hh - hf.h - g, fillRoom = remH >= 40 && rooms.length, sp = fillRoom ? 0 : Math.max(0, hh - hf.h)/Math.max(1, right.length);
      if(fillRoom) h += OHL.photo(D, rooms[Math.min(2, rooms.length - 1)], `left:${RX}pt;top:${M + hf.h + g}pt;width:${RW}pt;height:${remH}pt`);
      y = M + hf.h + g + (fillRoom ? remH + g : sp);
      right.forEach(p => { h += p === ag ? rect(RX, y - g*.5, RW, 3, 'background:#000') + p.draw(RX, y + g*.4) : p.draw(RX, y); y += p.h + g + sp; });
      return h;
    }
    return null;
  };

  // the heavy cases on the short shapes: the event and its notes on a black panel at left, the house, the address and the card at right
  // the address wrapped word by word when the heavy uppercase will not fit a narrow column (never a word dropped)
  const addrWrap = (w, k, max, P) => {
    const css = `font-weight:800;${AR};letter-spacing:-.5pt`, words = ADDR.split(/\s+/), widest = Math.max(...words.map(t => wd(t, `${css};font-size:${FE}pt`)));
    if(widest > w) return {h: 0, bad: true, draw: () => ''};
    const s = fit(words.reduce((a, t) => a.length > t.length ? a : t, ''), css, w, r1(Math.max(FE*1.1, max*k)), FE), lines = []; let cur = '';
    words.forEach(t => { const tr = cur ? cur + ' ' + t : t; if(cur && wd(tr, `${css};font-size:${s}pt`) > w){ lines.push(cur); cur = t; } else cur = tr; }); lines.push(cur);
    const lh = r1(s*1.15);
    return {h: lines.length*lh, draw: (x, y) => lines.map((t, i) => T(`${css};font-size:${s}pt;color:${P.ink};text-align:left`, esc(t), x, y + i*lh, w, lh, 'data-slot="address" data-lines="1"')).join('')};
  };

  const sideCols = () => {
    for(const tight of [false, true]) for(const lgL of [true, false]) for(const nc of [false, true]) for(const lwf of [.76, .74, .72, .7, .68, .66, .64, .62, .6, .58, .56, .54, .52]) for(let k = 1.05; k >= .7; k = Math.round((k - .05)*100)/100){
      TIGHT = tight;
      const M = tight ? Math.max(9.5, W*.016) : Math.max(11, W*.03), LW = r1(W*lwf), IW = LW - 1.5*M, RX = LW + M*.5, RW = W - RX - M, g = r1(Math.max(tight ? 1.5 : 4, FE*.25*k)), Mv = tight ? M*.8 : M;
      const hd = head(IW, k), bx = isOH ? noteBox(IW, k, BLK) : null, lg = logoK(lgL ? IW*.5 : RW*.5, H*.12), ad = addrWrap(RW, k, 26, WHT), ct = nc ? null : city(RW, k, WHT), ag = agent(RW, k, WHT, {nohs: true});
      if(!ad || ad.bad || ag.bad || hd.bad) continue;
      const lt = [hd, bx].filter(Boolean), lfix = lt.reduce((a, p) => a + p.h, 0) + g*lt.length + (lgL ? lg.h : 0); if(lfix > H - 2*Mv) continue;
      const rfix = ad.h + (ct ? ct.h : 0) + ag.h + 4*g + (lgL ? 0 : lg.h + g), hh = H - 2*Mv - rfix; if(hh < 36) continue;
      const hf = SP.heroFrame(D, hero, RW, hh, true); if(hf.w < RW*.3) continue;
      let h = blockRect(0, 0, LW, H), y = Mv; lt.forEach(p => { h += p.draw(M, y); y += p.h + g; });
      if(lgL) h += lg.draw(M, H - Mv - lg.h);
      h += OHL.photo(D, hero, `left:${RX + (RW - hf.w)/2}pt;top:${Mv}pt;width:${hf.w}pt;height:${hf.h}pt`);
      const remH = hh - hf.h - g, fillRoom = remH >= 40 && rooms.length; if(fillRoom) h += OHL.photo(D, rooms[0], `left:${RX}pt;top:${Mv + hf.h + g}pt;width:${RW}pt;height:${remH}pt`);
      const free = fillRoom ? 0 : Math.max(0, hh - hf.h)/3; y = Mv + hf.h + g + (fillRoom ? remH + g : free); h += ad.draw(RX, y) + (ct ? ct.draw(RX, y + ad.h) : ''); y += ad.h + (ct ? ct.h : 0) + g + free;
      h += rect(RX, y - g*.4, RW, 3, 'background:#000') + ag.draw(RX, y + g*.3);
      if(!lgL) h += lg.draw(RX, H - Mv - lg.h);
      return h;
    }
    return null;
  };

  const inner = shape === 'slide' ? slide() : /^(square|gbp|wide)$/.test(shape) ? (shape === 'square' ? (rows() || cols() || sideCols()) : (cols() || sideCols())) : rows();
  return {W, H, html: `<div class="page" data-page="${esc(D.piece.id)}" style="position:relative;overflow:hidden;width:${W}pt;height:${H}pt;background:var(--field)">${inner || T('', 'layout failed', 0, 0, 100, 12, 'data-slot="layout-failed"')}</div>`};

});
</script>
