<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Stepped Gallery open house flyer</title>
<link rel="stylesheet" href="stepped-gallery.css">
<link rel="stylesheet" href="stepped-gallery-cards.css">
<script src="stepped-gallery.js"></script>
<script src="stepped-gallery-cards.js"></script>
<!--
  The Stepped Gallery · Open House flyer "Frames Down the Page" (trim 612 x 792 pt; print: 0.25 in white margin around the ink-navy field).
  The event leads, in the fold-over's navy and pale sky: the label in tracked sky caps, the date in white Lora as the largest type on the
  page, the time in sky Lora, and the broker / REALTOR(R) lines (only on those opens, only when filled; refreshments in a white box) beside
  it. Then the book's stepped frames: row one, the whole house in the big frame (left) with the street, city, state, ZIP and the facts
  under it, and a narrower frame that starts a step lower; row two, the big frame swaps to the right, the narrow one steps down on the
  left. Each caption sits under its own photo (serif name, size in sky). The standard contact card closes the page.
  Rules: no RSVP, no QR, no price. Copy: data.copy.pc.oh = {photos: [house, room, room, room], rooms: [{t, dims, a, n}, ...]} in frame
  order: row one's narrow frame, row two's narrow frame, row two's big frame (n = lines the caption runs, the same across a row).
-->
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = AT.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="color:#fff;padding:20pt">No data injected.</p>'; return; }
  const esc = AT.esc, L = D.listing, PC = ((D.copy || {}).pc || {}), OHC = PC.oh || {};
  const issues = await AT.fontsReady(D);
  document.body.dataset.mode = D.mode || 'email';
  const O = AT.openHouse(D), X = 36, W = 540, BW = 330, SW = 200, GP = 10, ST = 18;
  const hero = (OHC.photos || [])[0] || 'front', rooms = OHC.rooms || [], ids = (OHC.photos || []).slice(1, 4);
  let h = '';

  // the event
  h += `<div class="abs oh-lbl" style="left:${X}pt;top:26pt;width:${W}pt;height:26pt" data-slot="oh.label" data-lines="1">${esc(O.label)}</div>`;
  if(O.weekday) h += `<div class="abs oh-date" id="date" style="left:${X-1}pt;top:54pt;width:${W}pt;height:66pt;font-size:56pt;line-height:66pt" data-slot="oh.date" data-lines="1">${esc(O.long)}</div>`;
  else h += `<div class="abs oh-date" style="left:${X}pt;top:58pt;width:${W}pt;height:64pt;font-size:34pt;line-height:32pt;white-space:normal" data-slot="oh.date" data-lines="2">${esc(O.long)}</div>`;
  h += `<div class="abs oh-time" style="left:${X}pt;top:124pt;width:300pt;height:32pt" data-slot="oh.time" data-lines="1">${esc(O.time)}</div>`;
  let dy = 0;   // the optional broker / REALTOR(R) lines sit right of the time; more than two lines and the header grows, the second row of frames gives up the difference
  { const ls = [[O.note, 'oh.note', 'oh-strong'], [O.refreshments, 'oh.refreshments', 'oh-note box']].filter(l => l[0]);
    if(ls.length){ const pre = AT.eventLines(ls, 308, 0, 268, 16, 8); dy = Math.max(0, pre.h - 32); h += AT.eventLines(ls, 308, 154 - pre.h + dy, 268, 16, 8, 'text-align:right').html; } }
  h += `<div class="hrule" style="top:${162 + dy}pt;left:${X}pt;width:${W}pt"></div>`;

  // row one: the whole house (big, left), its address and facts beneath; a narrow frame a step lower on the right
  const Y0 = 172 + dy, HH = 190, rA = HH + 72, capH = (n) => 15 + 2 + n*13;
  h += AT.photo(D, hero, `position:absolute;left:${X}pt;top:${Y0}pt;width:${BW}pt;height:${HH}pt`, 'oh.hero', 'hero');
  h += `<div class="abs kicker" style="left:${X}pt;top:${Y0 + HH + 8}pt;width:${BW}pt;height:10pt" data-slot="place" data-lines="1">${esc([L.neighborhood, AT.placeZip(L)].filter(Boolean).join(' · ').toUpperCase())}</div>`;
  h += `<div class="abs dsp" id="addr" style="left:${X-1}pt;top:${Y0 + HH + 20}pt;width:${BW}pt;height:40pt;font-size:34pt;line-height:40pt" data-slot="address" data-lines="1">${esc(L.address)}</div>`;
  h += `<div class="abs facts1" id="facts" style="left:${X}pt;top:${Y0 + HH + 62}pt;width:${BW}pt;height:10pt" data-slot="oh.facts" data-lines="1">${esc([L.beds && `${L.beds} Bedroom${L.beds == 1 ? '' : 's'}`, L.baths && BD.bathsText(L).main,  L.baths && BD.bathsText(L).half, L.sqft && `${Number(L.sqft).toLocaleString('en-US')} Sq Ft`, (L.yearBuilt || L.year) && `Built ${L.yearBuilt || L.year}`].filter(Boolean).join('  ·  '))}</div>`;
  const cap = (c, x, y, w, slot, cls) => `<div class="abs cap2 ${cls||''}" style="left:${x}pt;top:${y}pt;width:${w}pt"><div class="h" data-slot="${slot}.title" data-lines="1">${esc(c.t)}${c.dims ? `<i>${esc(c.dims)}</i>` : ''}</div><div class="a" data-slot="${slot}.body" data-para="1" data-min="2" data-lines="${c.n}" style="height:${c.n*13}pt">${esc(c.a)}</div></div>`;
  { const c = rooms[0] || {n: 3}, x = X + BW + GP, y = Y0 + ST, ph = rA - ST - 6 - capH(c.n);
    h += AT.photo(D, ids[0], `position:absolute;left:${x}pt;top:${y}pt;width:${SW}pt;height:${ph}pt`, 'oh.room0', 'room') + cap(c, x, y + ph + 6, SW, 'oh.room0'); }
  // row two: the big frame swaps to the right; the narrow one steps down on the left
  { const yB = Y0 + rA + 16, bot = 650, c1 = rooms[1] || {n: 2}, c2 = rooms[2] || {n: 2}, n = Math.max(c1.n, c2.n);
    const ph = bot - yB - 6 - capH(n), xB = X + SW + GP;
    h += AT.photo(D, ids[2], `position:absolute;left:${xB}pt;top:${yB}pt;width:${BW}pt;height:${ph}pt`, 'oh.room2', 'room') + cap(c2, xB, yB + ph + 6, BW, 'oh.room2');
    h += AT.photo(D, ids[1], `position:absolute;left:${X}pt;top:${yB + ST}pt;width:${SW}pt;height:${ph - ST}pt`, 'oh.room1', 'room') + cap(c1, X, yB + ph + 6, SW, 'oh.room1'); }

  h += AT.cardBox(D, [X, 662, W, 94], {layout: 'panel'});
  h += `<div class="abs fine" style="left:${X}pt;top:764pt;width:${W}pt;height:8pt;white-space:nowrap" data-slot="fineprint" data-lines="1" data-fine="1">${esc(PC.fineprint || 'Information deemed reliable but not guaranteed.')}</div>`;

  const f = AT.frame(D, 612, 792, h);
  document.getElementById('pages').innerHTML = f.html;
  window.pieceSize = {W: f.W, H: f.H, bleed: f.bleed};
  await AT.settle();
  document.querySelectorAll('#date').forEach(el => AT.fitLine(el, 36));
  AT.fitLine(document.getElementById('addr'), 24);
  AT.fitLine(document.getElementById('facts'), 8.5);
  issues.push(...AT.fitHouse(D));
  // captions in a row run the same number of lines (row two: narrow and big); row one's single caption stands alone
  AT.fitRow([...document.querySelectorAll('.cap2 .a')].filter(e => /room[12]/.test(e.dataset.slot)));
  ContactCard.fit(document);
  window.photoPlacements = AT.placements;
  window.brochureCheck = () => AT.checkSingle(D, issues);
})();
</script>
</body>
</html>
