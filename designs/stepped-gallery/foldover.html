<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Stepped Gallery fold-over</title>
<link rel="stylesheet" href="stepped-gallery.css">
<script src="stepped-gallery.js"></script>
<!--
  The Stepped Gallery · 11 x 17 portrait book-fold
  11 x 17 sheet laid 17 wide, folded once down the middle: four upright 8.5 x 11 pages (612 x 792 pt), 0.125 in (9 pt) bleed.
    outside spread: back (left) + cover (right)        inside spread: left page + right page
  Ink-navy field on every page, serif titles over a pale-sky rule, small-caps sky kickers. Unequal frames that step down:
  on each inside page three rows, a wide frame and a narrower one that starts a step lower, the wide one alternating sides
  row to row, each caption under its own photo. The back holds two outdoor photos beside the agent's own plan (placed as
  given, no redraw); with no plan the plan's column holds the rooms floor by floor and a photo. A narrow contact card (owner
  11/10) closes the photo column, or sits under the plan when the plan runs out of width first; it carries the spread's one logo.

  Modes (data.mode):  proof  four panel pages, 630 x 810 pt each (trim + bleed)
                      print  two spreads, 1242 x 810 pt, each half clipped at the fold
-->
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = PG.data(), esc = PG.esc; PG.fitMode = !!D.fit;
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  await PG.cardReady;
  const mode = D.mode || 'proof', L = D.listing, A = D.agent || {}, C = D.copy || {}, issues = [];
  const b = Object.assign({}, D.brand || {}); if(b.logoOnDark) b.logo = b.logoOnDark; D.brand = b;
  await Promise.all(['400 10pt','500 10pt','600 10pt','700 10pt'].map(w => document.fonts.load(`${w} 'Lora'`)).concat(['400 10pt','600 10pt','700 10pt'].map(w => document.fonts.load(`${w} 'Nunito Sans'`))));
  document.body.dataset.mode = mode;
  const hasPlan = !!(D.plan && D.plan.levels && D.plan.levels.length);
  const hs = (D.photos||{})[A.headshot] ? D.photos[A.headshot].src : (A.headshot || '');
  const G = 8, M = 29, W = 554, BOT = 763;
  const ln = (slot, d) => PG.lines(D, slot, d);
  const cp = (c, slot, x, y, w, n) => PG.cap(c, slot, x, y, w, {lines: n});

  const head = (T, slot) => PG.kick(T.kicker, `${slot}.kicker`, M, 30) + `<div class="abs title" style="left:${M}pt;top:42pt;width:${W}pt;height:32pt" data-slot="${slot}.title" data-lines="1">${esc(T.title)}</div>` + PG.rule(M, 80, W);

  // ================= COVER =================
  function cover(){
    const K = C.front || {};
    let h = PG.kick((K.kicker || '').toUpperCase(), 'front.kicker', M, 30);
    h += `<div class="abs addr" id="addr" style="left:${M}pt;top:42pt;width:${W}pt;height:48pt" data-slot="front.address" data-lines="1">${esc(L.address)}</div>`;
    const f = PG.facts(L);
    h += `<div class="abs facts" style="left:${M}pt;top:98pt;width:${W}pt;height:46pt" data-slot="front.facts">${f.map((x, i) => `<div class="f"><b data-slot="front.fact${i}" data-lines="1">${esc(x[0])}</b><span data-slot="front.fact${i}.l" data-lines="1">${esc(x[1])}</span></div>`).join('')}</div>`;
    // owner 11/10 (rule 9): a nearby place prints only with a real distance or drive time; with fewer than two the write-up takes
    // the list's room. (p62) The write-up runs its lines out to the right edge: set from its own sentences plus true lines about
    // the house (companion.flyer.descMore), every line full, justified.
    const around = (K.around || []).filter(p => /\d/.test(String(p.d || ''))), showA = around.length >= 2;
    const pn0 = ln('front.intro', 7), pl0 = 14.5, rows = (K.around || []).length || 1, rowH = 22, cn = ln('front.cap', 4);
    const y1 = 158, lowH = 16 + pn0*pl0 + 14 + 16 + rows*rowH, hh = BOT - lowH - 14 - y1;
    const pl = showA ? pl0 : 16.5, pn = showA ? pn0 : Math.floor((lowH - 16)/pl), ifs = '', icl = showA ? '' : ' ibig';
    h += PG.photo(D, K.photo, M, y1, W, hh);
    const y2 = y1 + hh + 14, w1 = 338, x2 = M + w1 + 16, w2 = W - w1 - 16;
    h += PG.kick(K.introHead, 'front.introhead', M, y2, w1);
    const c = K.cap || {};
    const SPL = t => (Array.isArray(t) ? t : String(t || '').match(/[^.!?]+[.!?]+["”’)]*|[^.!?]+$/g) || []).map(x => x.trim()).filter(Boolean);
    const W3 = t => { const w = String(t).toLowerCase().match(/[a-z0-9']+/g) || [], g = []; for(let i = 0; i + 2 < w.length; i++) g.push(w.slice(i, i + 3).join(' ')); return g; };
    const capG = new Set([...SPL(c.text), ...SPL(PG.pool(c.id) || [])].flatMap(W3)), capN = new Set([...SPL(c.text), ...SPL(PG.pool(c.id) || [])].flatMap(x => x.match(/\d{2,}/g) || []));
    const own = SPL(PG.txt(K.intro)), ownG = new Set(own.flatMap(W3));
    // never a line the inside captions already say (the phrase check: owner 11/10)
    const insideG = new Set([].concat(...((C.left || {}).rows || []), ...((C.right || {}).rows || []), (C.back || {}).photos || []).flatMap(it => SPL(it && it.text).concat(SPL((PG.pool((it || {}).id) || [])))).flatMap(W3));
    const more = (((D.companion || {}).flyer || {}).descMore || []).filter(x => !W3(x).some(g => capG.has(g) || ownG.has(g) || insideG.has(g)) && !(x.match(/\d{2,}/g) || []).some(n => capN.has(n)));
    const ipool = own.concat(PG.noRepeat(more, own.concat(SPL(c.text)))).slice(0, 10);
    h += `<div class="abs body tx${icl}" style="left:${M}pt;top:${y2 + 16}pt;width:${w1}pt;height:${pn*pl}pt;line-height:${pl}pt;${ifs}" data-slot="front.intro" data-lines="${pn}" data-nmin="${pn}" data-nmax="${pn}" data-cap="1" data-w="${w1}"${ipool.length > own.length ? ` data-pool='${esc(JSON.stringify(ipool)).replace(/'/g, '&#39;')}'` : ''}>${esc(own.join(' '))}</div>`;
    if(showA){ const ya = y2 + 16 + pn*pl + 14;
      h += PG.kick(K.aroundHead, 'front.aroundhead', M, ya, w1) + PG.places(around, 'front.around', M, ya + 16, w1, rowH); }
    h += PG.photo(D, c.id, x2, y2, w2, lowH - 6 - PG.capH(cn)) + PG.cap(c, 'front.cap', x2, y2 + lowH - PG.capH(cn), w2, {lines: cn});
    return h;
  }

  // ================= INSIDE: three rows of stepped frames =================
  function inside(T, which){
    const rows = T.rows || [], Y0 = 92, GAP = 16, STEP = 18, BW = 330, SW = W - BW - G;
    const N = rows.map((r, i) => r.map((c, k) => ln(`${which}.row${i}.${k}`, 4)));
    const hb = Math.floor((BOT - Y0 - GAP*(rows.length - 1) - N.reduce((a, ns) => a + 6 + PG.capH(Math.max(...ns)), 0)) / rows.length);
    let h = head(T, which), y = Y0;
    rows.forEach((r, i) => {
      const bigLeft = i % 2 === 0, xs = bigLeft ? [M, M + BW + G] : [M, M + SW + G], ws = bigLeft ? [BW, SW] : [SW, BW], mx = Math.max(...N[i]);
      const rowH = hb + 6 + PG.capH(mx);
      r.forEach((c, k) => {
        const big = bigLeft ? k === 0 : k === 1, py = big ? y : y + STEP, ph = rowH - 6 - PG.capH(N[i][k]) - (big ? 0 : STEP);
        h += PG.photo(D, c.id, xs[k], py, ws[k], ph) + PG.cap(c, `${which}.row${i}.${k}`, xs[k], py + ph + 6, ws[k], {lines: N[i][k]});
      });
      y += rowH + GAP;
    });
    return h;
  }

  // ================= BACK =================
  function back(){
    // owner 11/10: a narrow contact card (about half the old width; it carries the outside spread's one logo) closes the photo
    // column; the plan board (or the room list) runs the full height beside it, and the photos above the card grow
    const bp = hasPlan ? 'back.photo' : 'back.nphoto';
    // owner 11/10 (p63, standing rule 1): the contact block is shorter top to bottom and full width again (round 2's narrow card
    // undone); the photos and the plan board above grow into the freed height
    const B = C.back || {}, Y0 = 92, CH = 72, CG = 12, H = BOT - Y0 - CH - CG, y1 = BOT, ph0 = (B.photos || []).slice(0, 2);
    let h = head(B, 'back'), BW = 270, cardRight = false;
    if(hasPlan){ const pr = PG.plan(D, {x: 0, y: 0, w: 330, h: H - 26}); BW = Math.max(250, Math.min(W - G - 250, Math.ceil(pr.used.w) + 16));   // the card column keeps 250 pt
      // a plan that runs out of width before height (wide levels): the board shortens to the plan and the card sits under it,
      // the board as wide as lets the plan fill its height (the photo column keeps 210 pt); the photos then run the full height
    }
    const LW = W - BW - G, bx = M + LW + G, HL = H, HB = H;
    const lnW = (c, slot, d, w) => Math.max(PG.need(c.text, w), c.id && PG.pool(c.id) ? ln(slot, d) : 0);   // the column's width changed: the caption's own lines, never fewer than the copy fit
    const ns = ph0.map((c, i) => lnW(c, `${bp}${i}`, 4, LW));
    const ph = ph0.length === 1 ? HL - 6 - PG.capH(ns[0]) : Math.floor((HL - G - ns.reduce((a, n) => a + 6 + PG.capH(n), 0))/2); let y = Y0;
    ph0.forEach((c, i) => { h += PG.photo(D, c.id, M, y, LW, ph) + cp(c, `${bp}${i}`, M, y + ph + 6, LW, ns[i]); y += ph + 6 + PG.capH(ns[i]) + G; });
    if(hasPlan){
      h += `<div class="board" style="left:${bx}pt;top:${Y0}pt;width:${BW}pt;height:${HB}pt"></div>`;
      const pl = PG.plan(D, {x: bx + 6, y: Y0 + 6, w: BW - 12, h: HB - 24});
      issues.push(...pl.issues); h += pl.html;
      h += `<div class="abs" style="left:${bx}pt;top:${Y0 + HB - 14}pt;width:${BW}pt;height:10pt"><div class="pnote" data-slot="back.plannote" data-fine="1" data-lines="1">${esc(B.planNote || 'Approximate; not to scale.')}</div></div>`;
    } else {
      const ex = B.extra, nb = (B.rooms || []).length, nat = Y0 + PG.roomList(D, B.rooms, 'back.floor', bx, Y0, BW, 0).used + 8*Math.max(0, nb - 1);
      const en = ex ? lnW(ex, 'back.extra', 3, BW) : 0, ey = nat + 14, eh = ex ? Y0 + HB - ey - 6 - PG.capH(en) : 0;
      const rl = PG.roomList(D, B.rooms, 'back.floor', bx, Y0, BW, ex && eh >= 90 ? nat - Y0 : HB); h += rl.html;
      if(ex && eh >= 90) h += PG.photo(D, ex.id, bx, ey, BW, eh) + cp(ex, 'back.extra', bx, ey + eh + 6, BW, en);
      if(rl.over) issues.push({slot: 'back.rooms', kind: 'room-list-overflow'});
    }
    h += ContactCard.html([M, BOT - CH, W, CH], Object.assign({}, A, {headshot: hs}), b, {layout: 'panel', size: 'short', fine: ''});
    if(B.footnote) h += `<div class="abs" style="left:${M}pt;top:${BOT + 5}pt;width:${W}pt;height:8pt;white-space:nowrap;overflow:hidden;font:400 6pt/8pt var(--font-body);color:#aab6c8" data-slot="back.footnote" data-fine="1" data-lines="1">${esc(B.footnote)}</div>`;
    return h;
  }

  const panels = {front: cover(), back: back(), left: inside(C.left || {}, 'left'), right: inside(C.right || {}, 'right')};
  const panel = h => `<div class="panel">${h}</div>`;
  let html = '';
  if(mode === 'print'){
    html += `<div class="page" data-page="outside" style="width:1242pt;height:810pt"><div class="half l">${panel(panels.back)}</div><div class="half r">${panel(panels.front)}</div></div>`;
    html += `<div class="page" data-page="inside" style="width:1242pt;height:810pt"><div class="half l">${panel(panels.left)}</div><div class="half r">${panel(panels.right)}</div></div>`;
  } else {
    for(const id of ['front','back','left','right']) html += `<div class="page" data-page="${id}" style="width:630pt;height:810pt">${panel(panels[id])}</div>`;
  }
  document.getElementById('pages').innerHTML = html;
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  PG.fitLogos(); PG.fitTags();
  // the street address: as big as fits the width
  document.querySelectorAll('#addr').forEach(el => { for(let fs = 40; fs >= 28; fs -= 1){ el.style.fontSize = fs + 'pt'; if(PG.textWidth(el) <= W - 2) break; } });
  if(!D.fit){ document.querySelectorAll('.tx[data-pool][data-slot^="back."]').forEach(el => { el.dataset.floor = el.textContent.trim().length; });   // a back caption never comes out shorter than its copy
    CapFit(document.querySelectorAll('.tx[data-pool]'));   // text under a photo fills the photo's width (owner 11/8); only a caption that cannot is balanced
    // a back caption set in its measured lines that its pool cannot fill tries one or two more lines; its photo gives up the height
    document.querySelectorAll('.tx[data-pool][data-slot^="back."]:not([data-capfit="ok"]), .tx[data-pool][data-slot="front.cap.text"]:not([data-capfit="ok"])').forEach(el => {
      const cap = el.closest('.cap'), ph = cap && cap.previousElementSibling, n0 = +el.dataset.lines, lh = PG.cfg.lh, t0 = el.textContent;
      if(!ph || !ph.classList.contains('ph')) return;
      const set = k => { const d = (k - +el.dataset.lines)*lh; el.dataset.lines = el.dataset.nmin = el.dataset.nmax = k; el.style.height = k*lh + 'pt';
        cap.style.height = (parseFloat(cap.style.height) + d) + 'pt'; cap.style.top = (parseFloat(cap.style.top) - d) + 'pt'; ph.style.height = (parseFloat(ph.style.height) - d) + 'pt'; };
      for(const k of [n0 + 1, n0 + 2]){ set(k); CapFit([el]); if(el.dataset.capfit === 'ok') return; }
      set(n0); el.textContent = t0; });
    document.querySelectorAll('[data-cap]:not([data-capfit="ok"])').forEach(PG.balance); }
  issues.push(...PG.fitPhotos(D));
  ContactCard.fit(document);
  document.body.dataset.version = D.version || `${Math.max(1, Math.min(4, Math.round(+L.stories || 1)))}-story-${hasPlan ? 'plan' : 'noplan'}`;
  window.brochureCheck = () => PG.check(D, issues);
})();
</script>
</body>
</html>
