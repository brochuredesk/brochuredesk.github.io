<script>window.Ivory = window.Ivory || {esc: s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))};</script>
<script src="lb-fo.js"></script>
<!--
  BrochureDesk · Luncheon Band · Just Listed and Just Sold postcards, in the hand of the approved Open House library flyer B10.
  data.piece.card = "listed" | "sold", data.piece.size = "6x11" (792 x 432 pt) | "6x9" (648 x 432 pt), data.piece.side = "front" | "back".
  Print adds 0.125 in (9 pt) bleed. The kit's paper is the field; B10's dark band is the signature on every face.
  Front: Just Listed, the house on top inside the margin and the band across the foot (JUST LISTED, the facts in reversed icon cells);
  Just Sold, the band across the head (JUST SOLD, the street), the house, the seller question, the note in B10's white box, the agent.
  Back: the band in from the left edge with the status and the full street; Just Listed, a captioned room, the hairline and the About
  box, "At a glance" between the postage box and the address block; Just Sold, the six steps as the sign-in sheet's numbered rows and the
  seller question in that space. The standard contact card (templates/_shared/agentcard.js) and the disclaimer; the mail zones are the
  vendor's, drawn as guides on proofs and left clear in print. No price, no QR.
-->
<style>
  /* postcard marks in the Luncheon Band hand; tokens in lb-tokens.css */
  .pc-col{position:absolute;display:flex;flex-direction:column}
  .pc-wbox{background:var(--lb-lift);color:var(--fx-soft);padding:10pt 16pt 9pt;display:flex;flex-direction:column;overflow:hidden}
  .pc-wbox:after{content:"";position:absolute;inset:4.5pt;border:1pt solid color-mix(in srgb, var(--lb-accent) 78%, transparent);pointer-events:none}
  .pc-wbox.lt{background:#fff;color:#2c2c2c}
  .pc-wbox.lt:after{border-color:var(--lb-box-line)}
  .pc-wbox.lt .k{color:var(--lb-ink-accent)}
  .pc-wbox.lt .p{color:#161616}
  .pc-wbox .k{font:500 8.6pt/11pt var(--lb-font);letter-spacing:3.4pt;text-transform:uppercase;color:var(--lb-accent);white-space:nowrap;overflow:hidden;margin-bottom:3pt;align-self:flex-start}
  .pc-wbox .p{font-family:var(--lb-serif);font-weight:500;overflow:hidden;color:var(--fx-on)}
  .pc-wbox .p b{font-weight:700;color:var(--fx-on)}
  .pc-bstatus{position:absolute;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
  .pc-bstatus .st{font:700 10.5pt/1 var(--fx-font);letter-spacing:2.4pt;color:var(--fx-on);text-transform:uppercase}
  .pc-bstatus .ln{flex:1;height:1.2pt;background:var(--lb-accent);margin:0 12pt;min-width:16pt}
  .pc-bstatus .ad{font:500 16pt/1 var(--lb-serif);color:var(--fx-on);padding-bottom:3pt}
  .pc-steps .it{display:flex;gap:8pt;align-items:baseline;white-space:nowrap;overflow:hidden}
  .pc-steps .bx{width:4pt;height:4pt;transform:translateY(-1pt) rotate(45deg);background:var(--lb-accent);flex:none}
  .pc-call{font:500 13pt/16pt var(--lb-serif);color:var(--lb-accent);white-space:nowrap;overflow:hidden}
  .pc-disc{position:absolute;font-size:6pt;line-height:10pt;color:var(--fx-soft);overflow:hidden;white-space:nowrap}
  .pc-ret{position:absolute;font:500 9pt/11pt var(--fx-font);letter-spacing:.2pt;color:var(--fx-on);overflow:hidden;height:34pt}
  .pc-ret b{font-weight:700;letter-spacing:1.4pt;text-transform:uppercase;color:var(--lb-ink)}
  .pc-ret{color:var(--lb-ink)}
  .cap .a{font-weight:400}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const esc = SW.esc, b = D.brand || {}, A = D.agent || {}, L = D.listing, P = D.piece || {};
  document.body.dataset.mode = D.mode || 'email';
  await SW.setup(D);
  const sold = P.card === 'sold', big = P.size === '6x11', front = P.side === 'front';
  const W = big ? 792 : 648, H = 432;
  const K = ((D.sw || {}).pc || {})[sold ? 'js' : 'jl'] || {};
  const hsSrc = A.headshot && ((D.photos||{})[A.headshot] ? D.photos[A.headshot].src : A.headshot) || '';
  const statusWord = sold ? 'Just Sold' : 'Just Listed';
  const issues = [];
  const logo = (cls, src, area, maxh, style) => `<div class="logo ${cls}" data-area="${area}" data-maxh="${maxh}" style="${style||''}">${src ? `<img src="${esc(src)}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage||'')}</span>`}</div>`;
  const CL = big ? 13.5 : 12.5, CF = big ? 'font-size:10.9pt;line-height:13.5pt;' : '';   // the 6x11 sets its type up from the 6x9 (11 pt against 9.5), not the same size with more room
  const cap = (c, slot, lines, extra, min) => (c = (c.photo ? FXS.augment(D, c) : c), `<div class="cap" style="height:${5 + lines*CL}pt;${extra||''}"><div class="a" data-min="${min || 2}" data-nopair="1" data-slot="${slot}" data-narrow="0" data-nstep="6" data-lh="${CL}" data-lines="${lines}" data-lead="${esc(c.lead||'')}" data-s='${esc(JSON.stringify([].concat(c.s||[]))).replace(/'/g,'&#39;')}' style="height:${lines*CL}pt;${CF}"></div></div>`);
  let h = '';

  if(front){
    const F = K.front || {};
    const draws = list => { const w = x => /gated|roof|pergola|deck|park|garage|island|stone|corner|pool/i.test([].concat(x)[0]) ? 0 : 1; return (list || []).map((x, i) => [w(x), i, x]).sort((p, q) => p[0] - q[0] || p[1] - q[1]).map(t => t[2]); };
    const capC = sold ? {lead: '', s: (F.note || {}).s || (F.cap || {}).s} : (F.caption ? {lead: F.caption.lead, s: F.caption.s.concat(draws((F.about || {}).s || []))} : {lead: 'Front.', s: draws((F.about || {}).s || (F.cap || {}).s)});
    const norm = x => String(x).toLowerCase().replace(/[^a-z0-9 ]/g, '').slice(0, 40), allAlts = list => [].concat(...(list || []).map(x => [].concat(x)));
    const backSet = new Set([].concat(allAlts(((K.back || {}).about || {}).s), ...((K.back || {}).photos || []).map(c => allAlts(c.s)), allAlts((K.back || {}).steps6), allAlts((K.back || {}).steps)).map(norm));
    const backAll = allAlts(((K.back || {}).about || {}).s).map(String);   // the back's About box
    if(capC.s){ const kept = capC.s.filter(x => ![].concat(x).some(a => backSet.has(norm(a)))); if(kept.length >= 2) capC.s = kept; }
    // the caption's own first sentence stays; a later one that says a fact the back's About box says (the deck and pergola, in other words) drops out
    if(capC.s && capC.s.length > 2){ const tail = capC.s.slice(1).filter(x => ![].concat(x).some(a => backAll.some(b => SW.sameFact(String(a), b)))); if(tail.length >= 1) capC.s = [capC.s[0]].concat(tail); }
    const roomIds = [...new Set([].concat(((D.sw||{}).back||{}).photos||[], ((D.sw||{}).left||{}).photos||[]).map(c => c.photo))].filter(id => (D.photos||{})[id] && !(D.photos[id]||{}).fullHouse && id !== F.cap.photo).slice(0, 2);
    // ---- Luncheon Band fronts, design pass 11/15 (the mailbox test). Two different cards. Just Listed: the house bleeds off three edges
    // and is the hero; JUST / LISTED stacked as large as the column allows, flush left with the street, the facts and three specific highlights
    // on small accent marks (no box); the agent and the one logo along the foot; the closed frame holds the words and never crosses the photo.
    // Just Sold: the house is a picture inside the closed frame; the words centered. A dusk glow runs where the field meets the photo. ----
    // ---- Luncheon Band fronts (the mailbox test). Two cards, one hand. B10's band is the signature on both: it bleeds off three edges
    // and carries the status word in Plex Condensed bold caps with the street (Just Sold) or the facts (Just Listed) in the accent.
    // Just Listed: the house on top, inside the margin; the band across the foot with JUST LISTED as large as it goes and the facts
    // in B10's icon cells; the street, the place, the highlights and the agent beside the house.
    // Just Sold: the band across the head (JUST SOLD, the street right under it); the house; beside it the seller question, the note in
    // B10's white box sized to its text, the agent and the logo. No house features. ----
    const k = big ? 1.12 : 1, m = 24, pid = FO.heroId(D, F.cap.photo), ad = String(L.address || ''), hood = FXS.hood(L), place = [hood, FO.place(L)].filter(Boolean).join('  ·  ');
    const BOLD = 'font-family:PlexCond;font-weight:700;letter-spacing:.3pt', REG = 'font-family:PlexCond;font-weight:400;letter-spacing:.3pt';
    const photoAt = (x, y, w, hh) => `<div class="abs" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${hh}pt">${SW.photo(D, pid, 'position:absolute;inset:0', 'front.hero')}</div>`;
    const desT = A.designation ? (A.nar || /realtor/i.test(A.designation) ? 'REALTOR®' : A.designation) : '';
    // the agent (name in Plex Condensed bold, the designation in the label caps, the phone) and the logo to the right on one row
    const agentRow = (x, y, w, ns, hh) => { const lw = Math.min(150*k, w*0.42), tw = w - lw - 14, dz = desT && FXS.width(desT, `font-family:Franklin;font-weight:700;font-size:${8.6*k}pt;letter-spacing:1.8pt`) + 9*k + FXS.width(A.phone || '', `font-family:Franklin;font-weight:600;font-size:${10.5*k}pt`) + 4 <= tw;
      let s = `<div class="abs" style="left:${x}pt;top:${y + (hh - ns*1.15 - 15*k)/2}pt;width:${tw}pt;white-space:nowrap">`;
      s += `<div style="font-family:PlexCond;font-weight:700;font-size:${ns}pt;line-height:${ns*1.15}pt;color:var(--lb-ink)" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</div>`;
      s += `<div style="font-family:Franklin;font-weight:600;font-size:${10.5*k}pt;line-height:${15*k}pt;color:var(--lb-ink)" data-slot="agent.phone" data-lines="1">${dz ? `<span style="font-weight:700;font-size:${8.6*k}pt;letter-spacing:1.8pt;color:var(--lb-main-paper);margin-right:${9*k}pt">${esc(desT)}</span>` : ''}${esc(A.phone || '')}</div></div>`;
      s += `<div class="lb-vr" style="left:${x + tw + 6}pt;top:${y + 4}pt;height:${hh - 8}pt"></div>`;
      s += FXS.logo(D, x + tw + 14, y + 2, lw, hh - 4, 'center');
      return s; };
    const tags = w => { const tg = FXS.tagFacts(D).tags.filter(t => FXS.width(t, `font-family:Franklin;font-weight:500;font-size:${11*k}pt`) < w - 16).filter((t, i, arr) => !arr.slice(0, i).some(u => SW.sameFact(t, u))); const sc = t => (/\b(19|20)\d\d\b/.test(t) ? 0 : /new|replaced|updated|gated|pergola|deck/i.test(t) ? 1 : 2); return tg.map((t, i) => [sc(t), i, t]).sort((p, q) => p[0] - q[0] || p[1] - q[1]).map(x => x[2]); };
    const hl = (t, i, x, y, w, rh) => `<div class="abs" style="left:${x}pt;top:${y + rh/2 - 3*k}pt;width:${6*k}pt;height:${6*k}pt;background:var(--lb-main-paper)"></div><div class="abs" style="left:${x + 15*k}pt;top:${y}pt;width:${w - 15*k}pt;height:${rh}pt;line-height:${rh}pt;font-family:Franklin;font-weight:500;font-size:${11*k}pt;color:var(--lb-ink);white-space:nowrap;overflow:hidden" data-slot="front.tag${i}" data-lines="1">${esc(t)}</div>`;
    const cq = 'Thinking about selling?';

    if(!sold){
      const BH = Math.round(118*k), BY = H - BH, PB = BY - 16, PH = PB - m;
      let PW = Math.round(W*(big ? 0.6 : 0.56)); while(PW > 240 && !SW.fits(D, pid, PW, PH)) PW -= 6;
      h += photoAt(m, m, PW, PH);
      // the band: JUST LISTED flush left at poster size; the facts in reversed icon cells to its right
      const fl = LB.facts(L, {}), cellW = 66*k, fw = fl.length*cellW, tw = W - 2*m - fw - 22, fs = Math.min(FXS.fitSize('JUST LISTED', BOLD, tw, 76*k, 40), (BH - 30)/1.297);
      h += `<div class="lb-band" style="left:-9pt;top:${BY}pt;width:${W + 18}pt;height:${BH + 9}pt"></div>`;
      h += `<div class="lb-bt" style="left:${m}pt;top:${BY + (BH - 1.297*fs)/2 + 0.1235*fs}pt;width:${tw + 4}pt;height:${fs*1.05}pt;font-size:${fs}pt;line-height:${fs*1.05}pt;overflow:visible" data-slot="front.status" data-lines="1">Just Listed</div>`;
      h += `<div class="lb-on-band">`; fl.forEach(([ic, v, lb], i) => { const x = W - m - fw + i*cellW;
        h += `<div class="lb-fact" style="left:${x}pt;top:${BY + (BH - 64*k)/2}pt;width:${cellW}pt;height:${64*k}pt"><div style="transform:scale(${k});transform-origin:top center">${LB.ICON[ic]}</div><div class="v" style="font-size:${19*k}pt;line-height:${23*k}pt" data-slot="front.f${i}" data-lines="1">${esc(String(v))}</div><div class="l" style="font-size:${8.6*k}pt;letter-spacing:.4pt" data-slot="front.f${i}.k" data-lines="1">${esc(lb.replace(/^Square feet$/, 'Sq ft'))}</div></div>`;
        h += `<div class="lb-vr" style="left:${x}pt;top:${BY + 18}pt;height:${BH - 36}pt"></div>`; }); h += `</div>`;
      // beside the house: the place label, the street, the highlights, the agent
      const cx = m + PW + 18, cw = W - m - cx; let y = m - 2;
      h += `<div class="lb-k" style="left:${cx}pt;top:${y}pt;width:${cw}pt;font-size:${8.6*k}pt" data-slot="front.place" data-lines="1">${esc(hood || FXS.placeLine(L))}</div>`; y += 15*k;
      const as = FXS.fitSize(ad.toUpperCase(), BOLD, cw, 30*k, 16), al = as*1.08;
      h += `<div class="lb-st u" style="left:${cx}pt;top:${y}pt;width:${cw}pt;height:${al}pt;font-size:${as}pt;line-height:${al}pt" data-slot="front.address" data-lines="1">${esc(ad)}</div>`; y += al + 1;
      const pl2 = FO.place(L), pls = FXS.fitSize(pl2, 'font-family:Franklin;font-weight:400', cw, 11*k, 8.6);
      h += `<div class="lb-pl" style="left:${cx}pt;top:${y}pt;width:${cw}pt;height:${pls*1.3}pt;font-size:${pls}pt;line-height:${pls*1.3}pt" data-slot="front.city" data-lines="1">${esc(pl2)}</div>`; y += pls*1.3 + 10;
      h += `<div class="lb-hr ink" style="left:${cx}pt;top:${y}pt;width:${cw}pt"></div>`; y += 10;
      const AH = 50*k, ay = PB - AH, rh = 21*k, nT = Math.max(2, Math.min(4, Math.floor((ay - 12 - y)/rh))), tg = tags(cw).slice(0, nT), rr = tg.length ? (ay - 12 - y)/tg.length : rh;
      tg.forEach((t, i) => { h += hl(t, i, cx, y + i*rr + (rr - rh)/2, cw, rh); });
      h += `<div class="lb-hr" style="left:${cx}pt;top:${ay - 6}pt;width:${cw}pt"></div>` + agentRow(cx, ay, cw, Math.min(19*k, FXS.fitSize(A.name || '', BOLD, cw*0.55, 19*k, 13)), AH);
    } else {
      let BH = Math.round(132*k); const cx0 = m;
      const ns = 20*k, ss = FXS.fitSize(ad.toUpperCase(), REG, W - 2*m, 26*k, 16), fs = Math.min(FXS.fitSize('JUST SOLD', BOLD, W - 2*m, 76*k, 40), 76*k, (BH - 34 - ss*1.3)/1.15), bh = fs*1.02 + 4 + ss*1.15, ty = Math.max((BH - bh)/2, 15 + 0.1235*fs);
      BH = Math.round(ty + bh + 12);   // the band closes up under the street: no empty dark strip across its foot
      h += `<div class="lb-band" style="left:-9pt;top:-9pt;width:${W + 18}pt;height:${BH + 9}pt"></div>`;
      h += `<div class="lb-bt c" style="left:${m}pt;top:${ty}pt;width:${W - 2*m}pt;height:${fs*1.05}pt;font-size:${fs}pt;line-height:${fs*1.05}pt;overflow:visible" data-slot="front.status" data-lines="1">Just Sold</div>`;
      h += `<div class="lb-bt c" style="left:${m}pt;top:${ty + fs*1.02 + 4}pt;width:${W - 2*m}pt;height:${ss*1.15}pt;font-size:${ss}pt;line-height:${ss*1.15}pt" data-slot="front.address" data-lines="1"><span class="ac">${esc(ad)}</span></div>`;
      const PY = BH + 16, PH = H - m - PY; let PW = Math.round(W*(big ? 0.5 : 0.46)); while(PW > 200 && !SW.fits(D, pid, PW, PH)) PW -= 6;
      h += photoAt(m, PY, PW, PH);
      const cx = m + PW + 18, cw = W - m - cx, AH = 46*k, ay = H - m - AH; let y = PY - 2;
      // owner rule: the Just Sold note is two lines that name the sale; the seller question takes the room above it, large
      const lh = big ? 19 : 17, pad = 11, n = 2, noteH = n*lh + 2*pad, room = ay - 14 - y - noteH - 12;
      const qL = [['THINKING', 'ABOUT', 'SELLING?'], ['THINKING ABOUT', 'SELLING?']].map(ls => { const s = Math.min(48*k, ...ls.map(t => FXS.fitSize(t, BOLD, cw, 48*k, 15)), room/ls.length/1.04); return {ls, s}; }).sort((p, q) => q.s*q.ls.length - p.s*p.ls.length)[0];
      h += `<div class="lb-st u" data-mov="1" style="left:${cx}pt;top:${y}pt;width:${cw}pt;height:${qL.s*1.04*qL.ls.length}pt;font-size:${qL.s}pt;line-height:${qL.s*1.04}pt;white-space:normal" data-slot="front.cta" data-lines="${qL.ls.length}">${qL.ls.map((t, i) => i === qL.ls.length - 1 ? `<span style="color:var(--lb-main-paper)">${esc(t)}</span>` : esc(t)).join('<br>')}</div>`; y += qL.s*1.04*qL.ls.length + 12;
      capC.s = [].concat(capC.s || []).slice(0, 1);
      h += `<div class="lb-box" data-mov="1" id="notebox" data-pad="${pad}" style="left:${cx}pt;top:${y}pt;width:${cw}pt;height:${n*lh + 2*pad}pt"></div>`;
      h += `<div class="abs" data-mov="1" style="left:${cx + 13}pt;top:${y + pad}pt;width:${cw - 26}pt">${SW.para(capC, 'front.note', n, 'p', `font-family:Franklin;font-weight:500;font-size:${big ? 13.5 : 12}pt;color:var(--lb-ink)`, lh).replace('data-slot=', `data-try="2" data-slot=`)}</div>`;
      h += `<div id="lock" data-y="${y}" data-ay="${ay}" style="display:none"></div>`;
      h += `<div class="lb-hr" style="left:${cx}pt;top:${ay - 6}pt;width:${cw}pt"></div>` + agentRow(cx, ay, cw, Math.min(ns, FXS.fitSize(A.name || '', BOLD, cw*0.55, ns, 13)), AH);
    }
  } else {
    // ---------------- BACK (owner 11/16/2026: the design runs the full width; the contact block is much shorter). B10's band runs edge to
    // edge across the whole top, the mail side included, naming the piece (the status bold, the full street in the accent); the return
    // address rides on it reversed and the postage box is a small paper tab hanging from it. A second band in the same dark runs edge to
    // edge along the foot and carries the agent in one compact row, the office line and the disclaimer; the barcode strip is a paper tab
    // set into it. Between the bands, on the paper: B10's boxes on the message side, "At a glance" (Just Listed) or the seller question
    // (Just Sold) between the postage tab and the address block, and the address block as a paper markup with B10's hairline edge. ----
    const dx = W - 648, X = 30, XC = 24, G = 12, B = K.back || {}, k = big ? 1.12 : 1;
    const Z = {postage: [552 + dx, 12, 84, 98.25], address: [405 + dx, 187.5, 240, 112.5], barcode: [306 + dx, 387, 342, 45]};
    window.__zones = Z; window.__cardX = 30;
    const BOLD = 'font-family:PlexCond;font-weight:700;letter-spacing:.3pt', REG = 'font-family:PlexCond;font-weight:400;letter-spacing:.3pt';
    const mk = (x, y, w, hh, extra) => `<div class="abs mailp" data-mail-panel="1" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${hh}pt;background:var(--fx-mail);z-index:5;${extra || ''}"></div>`;
    const rx = Z.address[0], cr = rx - 28, cw0 = cr - XC, BT = 330, BB = BT - 10, rw = Z.postage[0] - 12 - rx;
    const ret = [b.brokerage || ''].concat([].concat(b.returnAddress || b.address || []).flatMap(a => String(a).split('\n'))).filter(Boolean).slice(0, 3);
    const retW = Math.max(...ret.map((t, i) => FXS.width(i ? t : t.toUpperCase(), i ? 'font-family:Franklin;font-weight:500;font-size:9pt;letter-spacing:.2pt' : 'font-family:Franklin;font-weight:700;font-size:9pt;letter-spacing:1.4pt')));
    // the head band, edge to edge
    const BH = 62, st = String(L.address || ''), word = statusWord.toUpperCase(), tEnd = rx + rw - retW - 18;
    let fs = 29; while(fs > 16 && FXS.width(word, `${BOLD};font-size:${fs}pt`) + 12 + FXS.width(st.toUpperCase(), `${REG};font-size:${fs}pt`) > tEnd - XC) fs -= 0.5;
    h += `<div class="lb-band" style="left:-9pt;top:-9pt;width:${W + 18}pt;height:${BH + 9}pt"></div>`;

  // owner 11/7: the Just Sold back's six bullets are long (8 words or more) and the box is at least 85% filled with text (heading, bullet lines, call line against the box's inner height)
  function jsCheck(){ const out = [], box = document.querySelector('.sheet .pc-wbox'); if(!box) return out;
    const items = [...box.querySelectorAll('.stp, .hb .tx')], hOf = el => { const r = document.createRange(); r.selectNodeContents(el); return [...r.getClientRects()].reduce((m, q) => Math.max(m, q.bottom), 0) - [...r.getClientRects()].reduce((m, q) => Math.min(m, q.top), 1e9); };

  // the Just Sold bullets take the largest size at which every one sets in full lines inside the box, then the leading opens until the box is at least 85% filled
  function fitSteps(){ const box = document.getElementById('stepsbox'), list = document.getElementById('stepslist'); if(!box || !list) return;
    if(big){   // 6x11: one column, every step one full line, the largest size from 15.5 pt down to the 6x9's x1.08; the box is sized to its content, set on the card's top, the call to action centered above it
      const stp = [...list.querySelectorAll('.stp')], its = [...list.querySelectorAll('.it')];
      let best = null;
      for(let fs = 15.5; fs >= 14.1 - 1e-6; fs -= 0.1){ list.style.fontSize = fs + 'pt'; const lh = fs*1.62; list.style.lineHeight = lh + 'pt'; stp.forEach(e => { e.dataset.lh = lh; }); its.forEach(it => { it.querySelector('.bx').style.marginTop = (lh*.42) + 'pt'; }); SW.fill();
        if(stp.every(e => SW.lines(e).n === 1)){ const fill = Math.min(...stp.map(e => (e.getBoundingClientRect().width ? (() => { const r = document.createRange(); r.selectNodeContents(e); const q = [...r.getClientRects()]; return q.length ? (Math.max(...q.map(x => x.right)) - Math.min(...q.map(x => x.left)))/list.getBoundingClientRect().width : 0; })() : 0))); best = {fs, lh, fill}; break; } }

  function backCheck(){ const out = [], pt = v => v*72/96, sh = document.querySelector('.sheet').getBoundingClientRect();

    const cc = document.querySelector('.sheet [data-contactrow]');

  function panelCheck(){ const out = [], Z = window.__zones, sh = document.querySelector('.sheet').getBoundingClientRect(), pt = v => v*72/96;
    const panels = [...document.querySelectorAll('.mailp')].map(p => { const r = p.getBoundingClientRect(); return {l: pt(r.left - sh.left), t: pt(r.top - sh.top), r: pt(r.right - sh.left), b: pt(r.bottom - sh.top), lum: lum(getComputedStyle(p).backgroundColor)}; });
