<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>luncheon-band social set</title>
<link rel="stylesheet" href="lb-tokens.css">
<script src="../engine/baths.js"></script>
<script src="../engine/ivory.js"></script>
<script src="../engine/ohlib.js"></script>
<script src="../engine/ohemail.js"></script>
<script src="../engine/carousel.js"></script>
<script src="../engine/factrepeat.js"></script>
<script src="../engine/socialset.js"></script>
<script src="lb-social.js"></script>
<!-- Luncheon Band's Just Listed and Just Sold social sets (owner 11/18/2026). The shared engine (templates/_shared/socialset.js) loads
     the fonts and the data and runs the checks; the layouts are Luncheon Band's own (lb-social.js): the house inset on the kit's
     paper, ONE tall dark band edge to edge with the status word in very large Plex Condensed caps, the icon facts in the band
     (Just Listed), the stacked seller question and the note in the white box (Just Sold). The colors come from the agent's brand
     kit exactly as the set's print pieces read them (LB.colors / LB.brand in lb.js). -->
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
SocialSet.portrait = LBSocial.portrait; SocialSet.landscape = LBSocial.landscape; SocialSet.slide = LBSocial.slide;
// the faces the layouts set beyond the three the engine loads (Plex Condensed regular for the street on the band, Franklin 500 and 700)
OHL.cardReady = Promise.all([OHL.cardReady].concat(["400 20px 'PlexCond'", "700 20px 'PlexCond'", "400 12px 'Franklin'", "500 12px 'Franklin'", "600 12px 'Franklin'", "700 12px 'Franklin'"].map(f => document.fonts.load(f).catch(() => 0))));
SocialSet.start(D => {
  const b = D.brand || {}, c = b.colors || {}, r = document.documentElement.style;
  const rgb = h => { h = String(h||'').replace('#',''); if(h.length===3) h = h.split('').map(x=>x+x).join(''); const n = parseInt(h,16); return [n>>16&255, n>>8&255, n&255]; };
  const lum = h => { const v = rgb(h).map(q => { q/=255; return q <= .03928 ? q/12.92 : Math.pow((q+.055)/1.055, 2.4); }); return .2126*v[0] + .7152*v[1] + .0722*v[2]; };
  const con = (a, x) => { const p = lum(a), q = lum(x); return (Math.max(p,q)+.05)/(Math.min(p,q)+.05); };
  const on = bg => con(bg, '#ffffff') >= con(bg, '#161616') ? '#ffffff' : '#161616';
  const readable = (fg, bg, min) => con(fg, bg) >= (min || 3) ? fg : on(bg);
  const mix = (a, x, t) => { const p = rgb(a), q = rgb(x); return '#' + p.map((v, i) => Math.round(v + (q[i] - v)*t).toString(16).padStart(2, '0')).join(''); };
  // as LB.colors / LB.brand: the kit's paper is the field, its dark the band, the accent the band's light words and icons where it
  // reads there, the main color the rule, the squares, the box line and the small caps on the paper
  const main = c.main || b.accent || '#2f4a3a', dark = c.dark || b.ink || '#1c1c1c', accent = c.accent || b.accent2 || main, paper = b.paper || mix(main, '#ffffff', .93), ink = '#161616';
  r.setProperty('--lb-paper', paper); r.setProperty('--lb-dark', dark); r.setProperty('--lb-main', main); r.setProperty('--lb-on-dark', on(dark));
  r.setProperty('--lb-acc-dark', readable(accent, dark)); r.setProperty('--lb-main-paper', readable(main, paper)); r.setProperty('--lb-ink', ink);
  r.setProperty('--lb-text', mix(ink, paper, .2)); r.setProperty('--lb-rule', 'rgba(22,22,22,.25)');
});
</script>
</body>
</html>
