<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · fxs-36 postcards</title>
<link rel="stylesheet" href="fxs36.css">
<script src="fxs36.js"></script>
<script src="../engine/baths.js"></script>
<script src="../engine/agentcard.js"></script>
<!--
  BrochureDesk · fxs-36 · Just Listed and Just Sold postcards.
  data.piece.card = "listed" | "sold", data.piece.size = "6x11" (trim 792 x 432 pt) | "6x9" (648 x 432 pt), data.piece.side = "front" | "back".
  Print adds 0.125 in (9 pt) bleed. The agent's brand color (brand.accent) is the field on both sides; boxes are white.
  Front: the whole house (roof to steps) on the right with a one-line-or-two caption and a white box under it, the status stacked large on the left over the address,
  the fact rows and the brokerage logo (Just Listed) or the agent's name and number and the logo (Just Sold). No price, no QR.
  Back: status line, interior photos with captions, a white box (the write-up, or the steps), the standard contact card (templates/_shared/agentcard.js,
  band preset, which carries the back's one logo), the fine print. The right 289.5 pt (4.02 in) is the mail vendor's: return address, postage and address
  zones; drawn as guides on proofs and left clear in print.
  Copy comes from data.sw.pc.{jl|js}.{front|back} as a lead plus whole sentences; fxs36.js picks the sentences that fill each box.
-->
<style>
  /* the FX36 hand on a postcard: warm white card, vertical address, gold underlined labels, Cormorant italic, hairlines; tokens in fxs36-tokens.css */
  .pc-col{position:absolute;display:flex;flex-direction:column}
  .pc-wbox{background:transparent;border:var(--fx-rule-w) solid var(--fx-rule-hard);color:var(--fx-ink);padding:10pt 14pt 9pt;display:flex;flex-direction:column;overflow:hidden}
  .pc-wbox .k{font:var(--fx-label-w) 8.5pt/11pt var(--fx-font);letter-spacing:var(--fx-label-track);text-transform:uppercase;color:#fff;white-space:nowrap;overflow:hidden;margin-bottom:3pt;text-decoration:underline;text-decoration-color:var(--fx-accent);text-decoration-thickness:.75pt;text-underline-offset:3pt;align-self:flex-start}
  .pc-wbox .p{font-family:var(--fx-font);font-weight:400;font-style:normal;overflow:hidden;color:var(--fx-text)}
  .cap.ser .a{font:italic 400 13pt/15.5pt var(--fx-serif);color:var(--fx-ink)}
  .pc-wbox .p b{font-weight:700;color:var(--fx-ink)}
  .pc-bstatus{position:absolute;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
  .pc-bstatus .st{font:500 24pt/1 var(--fx-script);letter-spacing:.7pt;text-transform:uppercase;color:var(--fx-accent)}
  .pc-bstatus .ln{flex:1;height:var(--fx-rule-w);background:var(--fx-rule);margin:0 10pt;min-width:16pt}
  .pc-bstatus .ad{font:500 12pt/1 var(--fx-display);text-transform:uppercase;letter-spacing:1.6pt;color:var(--fx-ink)}
  .pc-steps .it{display:flex;gap:8pt;align-items:baseline;white-space:nowrap;overflow:hidden}
  .pc-steps .bx{width:4pt;height:4pt;background:var(--fx-accent);flex:none;transform:translateY(-1pt)}
  .pc-call{font:500 11pt/15pt var(--fx-font);color:#fff;   /* owner 11/7 (FXS-36 red rule): small type white on black, never small red */
 white-space:nowrap;overflow:hidden}
  .pc-disc{position:absolute;font-size:6pt;line-height:10pt;color:var(--fx-mute);overflow:hidden;white-space:nowrap}
  .pc-ret{position:absolute;font:500 9pt/11pt var(--fx-font);letter-spacing:.2pt;color:var(--fx-text);overflow:hidden;height:34pt}
  .pc-ret b{font-weight:700;letter-spacing:1.4pt;text-transform:uppercase;color:var(--fx-ink)}
  .pc-help{list-style:none;overflow:hidden;display:grid;grid-auto-flow:column;column-gap:18pt;color:var(--fx-ink)} .pc-help li{display:flex;gap:7pt;align-items:baseline;align-self:center} .pc-help i{width:4pt;height:4pt;background:var(--fx-accent);flex:none;border-radius:0;transform:translateY(-1pt)}
  /* owner 11/7 (FXS-36 red rule): CALL / TEXT and every small label white on black; red stays on big blocks and headlines */
  body .cc .cc-acc, body .cc .cc-lab, .agentline .lab, .agentline .d{color:#fff!important}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const esc = SW.esc, b = D.brand || {}, A = D.agent || {}, L = D.listing, P = D.piece || {};
  document.body.dataset.mode = D.mode || 'email';
  await SW.setup(D);
  const sold = P.card === 'sold', big = P.size === '6x11', front = P.side === 'front';
  const W = big ? 792 : 648, H = 432;
  const K = ((D.sw || {}).pc || {})[sold ? 'js' : 'jl'] || {};
  const hsSrc = A.headshot && ((D.photos||{})[A.headshot] ? D.photos[A.headshot].src : A.headshot) || '';
  const statusWord = sold ? 'Just Sold' : 'Just Listed';
  const issues = [];
  const logo = (cls, src, area, maxh, style) => `<div class="logo ${cls}" data-area="${area}" data-maxh="${maxh}" style="${style||''}">${src ? `<img src="${esc(src)}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage||'')}</span>`}</div>`;
  const CL = big ? 13.5 : 12.5, CF = big ? 'font-size:10.9pt;line-height:13.5pt;' : '';   // the 6x11 sets its type up from the 6x9 (11 pt against 9.5), not the same size with more room
  const cap = (c, slot, lines, extra) => `<div class="cap" style="height:${5 + lines*CL}pt;${extra||''}"><div class="a" data-slot="${slot}" data-narrow="30" data-nstep="3" data-lh="${CL}" data-lines="${lines}" data-lead="${esc(c.lead||'')}" data-s='${esc(JSON.stringify([].concat(c.s||[]))).replace(/'/g,'&#39;')}' style="height:${lines*CL}pt;${CF}"></div></div>`;
  let h = '';

  if(front){
    // The FX36 hand on a postcard front. JL: the whole house runs off the top, left and bottom of the card with its caption under it (opens "Front."), "Just Listed" in
    // gold script and the horizontal address beside it, three facts, the agent and logo along the foot. JS sells the agent: the house sits in the right column with the
    // agent's note under it, "Just Sold" in the same script, the agent's name and phone big on the left, the logo at the foot.
    // owner 11/7 (JS front): the front photo takes the room the write-up had under it: as tall as the whole house allows, up to the full card
    const M = 24, F = K.front || {}; let hh = sold ? H : (big ? 282 : 272); const hw = sold ? (big ? 430 : 360) : (big ? 480 : 380);
    while(hh > 220 && !SW.fits(D, F.cap.photo, hw + 9, hh + 9)) hh -= 6;
    // owner 11/7 (no blank space): on the Just Listed front the house grows until the foot holds just the agent row
    if(!sold){ const capH0 = 5 + 3*(big ? 16.5 : 15), agRow = (big ? 32 : 29) + 20, hT = H - 9 - (agRow + 24) - 8 - capH0 - 14 + 6; while(hh + 4 <= hT && SW.fits(D, F.cap.photo, hw + 9, hh + 4 + 9)) hh += 4; }
    const statusMax = big ? 60 : 54, sstat = Math.min(FXS.fitSize('Just Listed', "font-family:'Oswald'", (big ? 250 : 226), statusMax, 36), FXS.fitSize('Just Sold', "font-family:'Oswald'", (big ? 250 : 226), statusMax, 36));
    const draws = list => { const w = x => /gated|roof|pergola|deck|park|garage|island|stone|corner|pool/i.test([].concat(x)[0]) ? 0 : 1; return (list || []).map((x, i) => [w(x), i, x]).sort((p, q) => p[0] - q[0] || p[1] - q[1]).map(t => t[2]); };
    const capC = sold ? {lead: '', s: (F.note || {}).s || (F.cap || {}).s} : (F.caption ? {lead: F.caption.lead, s: [].concat(F.caption.s, ((F.cap || {}).s || []).filter(x => !F.caption.s.some(c => [].concat(c).some(a => SW.sameFact(a, [].concat(x)[0]) || (/stone/i.test(a) && /stone/i.test([].concat(x)[0]))))))} : {lead: 'Front.', s: draws((F.about || {}).s || (F.cap || {}).s)});
    const norm = x => String(x).toLowerCase().replace(/[^a-z0-9 ]/g, '').slice(0, 40), allAlts = list => [].concat(...(list || []).map(x => [].concat(x)));
    const backSet = new Set([].concat(allAlts(((K.back || {}).about || {}).s), ...((K.back || {}).photos || []).map(c => allAlts(c.s)), allAlts((K.back || {}).steps6), allAlts((K.back || {}).steps)).map(norm));
    if(capC.s){ const kept = capC.s.filter(x => ![].concat(x).some(a => backSet.has(norm(a)))); if(kept.length >= 2) capC.s = kept; }
    const roomIds = [...new Set([].concat(((D.sw||{}).back||{}).photos||[], ((D.sw||{}).left||{}).photos||[]).map(c => c.photo))].filter(id => (D.photos||{})[id] && !(D.photos[id]||{}).fullHouse && id !== F.cap.photo).slice(0, 2);
    const capLines = 3, capLH = big ? 16.5 : 15, capHt = 5 + capLines*capLH, capFS = big ? 12.5 : 11.5;   // owner 11/7 (p18): a longer, bigger write-up, the photo's full width
    const capSty = (c, slot, lines, extra) => `<div class="cap" style="height:${5 + lines*capLH}pt;${extra||''}"><div class="a" data-slot="${slot}" data-narrow="1" data-minfill="0.9" data-lh="${capLH}" data-lines="${lines}" data-lead="${esc(c.lead||'')}" data-s='${esc(JSON.stringify([].concat(c.s||[]))).replace(/'/g,'&#39;')}' style="height:${lines*capLH}pt;font-size:${capFS}pt;line-height:${capLH}pt;text-align:justify"></div></div>`;
    const heroX = sold ? W - hw : -9, boxW = hw + 9, heroFits = SW.fits(D, F.cap.photo, boxW, hh + 9);
    h += heroFits ? FXS.box(D, F.cap.photo, heroX, -9, boxW, hh + 9, 'front.hero') : SW.heroHtml(D, F.cap.photo, heroX, -9, boxW, hh + 9, 'front.hero', F.side || roomIds);
    h += `<div class="gold" style="left:${heroX}pt;top:${hh}pt;width:${boxW}pt"></div>`;
    const capX = sold ? heroX + 14 : M, capW = sold ? hw - 14 - M : hw + 9 - M;
    if(!sold) h += capSty(capC, 'front.hero', capLines, `position:absolute;left:${capX}pt;top:${hh + 8}pt;width:${capW}pt;padding-top:0`);
    if(!sold){
      const cx0 = hw + 22, cw = W - M - cx0, colTop = 18;
      h += `<div class="abs script" style="left:${cx0}pt;top:${colTop}pt;width:${cw}pt;height:${sstat*1.2}pt;font-size:${sstat}pt;line-height:${sstat*1.2}pt" data-slot="front.status" data-lines="1">Just Listed</div>`;
      const addrT = ((SW.data().listing || {}).address) || L.address, aMax = big ? 38 : 34, aCss = `font-family:'Oswald';font-weight:500;letter-spacing:.7pt`;
      const oneL = FXS.width(addrT.toUpperCase(), `${aCss};font-size:${aMax - 6}pt`) <= cw, mm = addrT.match(/^(\S+)\s+(.+)$/), parts = oneL || !mm ? [addrT] : [mm[1], mm[2]], aS = Math.min(aMax, ...parts.map(p => FXS.fitSize(p.toUpperCase(), aCss, cw, aMax, 18)));
      const aTop = colTop + sstat*1.2 + 4;
      h += `<div class="abs ttl" style="left:${cx0}pt;top:${aTop}pt;width:${cw}pt;height:${parts.length*aS*1.15}pt;white-space:normal;text-transform:uppercase;letter-spacing:.7pt;font:500 ${aS}pt/${aS*1.15}pt var(--fx-display)" data-slot="front.address" data-lines="${parts.length}">${parts.map(esc).join('<br>')}</div>`;
      const py = aTop + parts.length*aS*1.15 + 3;
      h += FXS.capsLine(`${FXS.hood(L) ? FXS.hood(L) + ' · ' : ''}${L.city}, ${L.state}`, cx0, py, cw, 8.6, 1.2, '#fff', 'front.place');
      const facts = FXS.statItems(L).slice(0, 3), fy = py + 22, fb = hh + 8 + capHt, fth = fb - fy;   // owner 11/7 (p18): the tiles run down beside the write-up (no empty band)
      h += `<div class="stats" style="left:${cx0}pt;top:${fy}pt;width:${cw}pt;height:${fth}pt;gap:5pt">${facts.map((t, i) => `<div class="s" data-slot="front.fact.${i}" data-lines="1">${FXS.statHtml(t, big ? 30 : 26, 9, 1.5)}</div>`).join('')}</div>`;
      const foot = capTopOf(); 
      function capTopOf(){ return hh + 8 + capHt + 14; }
      const agHJ = (big ? 32 : 29) + 20, agTopJ = foot - 6 + (H - 14 - (foot - 6) - agHJ)/2;   // owner 11/7 (p18): the agent sits lower, centered under the rule
      h += `<div class="abs hr" style="left:${M}pt;top:${foot - 6}pt;width:${W - 2*M}pt"></div>`;
      h += `<div class="abs agentline" style="left:${M}pt;top:${agTopJ}pt;width:320pt"><div class="n" style="font:600 ${big ? 28 : 25}pt/${big ? 32 : 29}pt var(--fx-font)" data-slot="agent.name" data-lines="1">${esc(A.name||'')}</div><div class="p" style="font-size:${big ? 15 : 14}pt;line-height:20pt" data-slot="agent.phone" data-lines="1">${esc(A.phone||'')}</div></div>`;
      h += FXS.logo(D, W - M - 190, agTopJ + (agHJ - Math.min(54, agHJ))/2, 190, Math.min(54, agHJ), 'flex-end');
    } else {
      const cx0 = M, cw = heroX - 22 - cx0, colTop = 20;
      // owner 11/7: "Just Sold" always outsizes the agent info
      const sstJ = FXS.fitSize('JUST SOLD', "font-family:'Oswald';font-weight:500;letter-spacing:.7pt", cw, big ? 68 : 60, 30);
      h += `<div class="abs script" style="left:${cx0}pt;top:${colTop}pt;width:${cw}pt;height:${sstJ*1.2}pt;font-size:${sstJ}pt;line-height:${sstJ*1.2}pt" data-slot="front.status" data-lines="1">Just Sold</div>`;
      const ns = FXS.fitSize(A.name || '', "font-family:'Montserrat';font-weight:500", cw, Math.min(big ? 38 : 32, sstJ*.62), 20), ps = FXS.fitSize(A.phone || '', "font-family:Montserrat;font-weight:500;letter-spacing:.7pt", cw, big ? 26 : 23, 16);
      const logoInCol = !(hh < H - 60), colFree = logoInCol ? 0 : Math.max(0, (H - 22) - (colTop + sstJ*1.2 + 8 + ns*1.12 + 13 + 8 + ps*1.2 + 16 + 12 + 30*1.2 + 26 + 46)), nTop = colTop + sstJ*1.2 + 8 + colFree/2;   // the column spreads to fill when the logo sits under the photo
      h += `<div class="abs agentline" style="left:${cx0}pt;top:${nTop}pt;width:${cw}pt"><div class="n" style="font:600 ${ns}pt/${ns*1.12}pt var(--fx-font)" data-slot="agent.name" data-lines="1">${esc(A.name||'')}</div><div class="d" style="margin-top:2pt" data-slot="agent.desig" data-lines="1" data-fine="1">REALTOR®</div><div class="p" style="font:500 ${ps}pt/${ps*1.2}pt var(--fx-font);letter-spacing:.7pt;margin-top:8pt" data-slot="agent.phone" data-lines="1">${esc(A.phone||'')}</div></div>`;
      const sy = nTop + ns*1.12 + 13 + 8 + ps*1.2 + 16;
      h += `<div class="abs hr" style="left:${cx0}pt;top:${sy}pt;width:${cw}pt"></div>`;
      const addrT = ((SW.data().listing || {}).address) || L.address, st = FXS.fitSize(addrT.toUpperCase(), "font-family:'Oswald';font-weight:500;letter-spacing:.7pt", cw, big ? 34 : 28, 16);
      h += `<div class="abs ttl" style="left:${cx0}pt;top:${sy + 12}pt;width:${cw}pt;height:${st*1.2}pt;text-transform:uppercase;letter-spacing:.7pt;font:500 ${st}pt/${st*1.2}pt var(--fx-display)" data-slot="front.address" data-lines="1">${esc(addrT)}</div>`;
      h += FXS.capsLine(`${FXS.hood(L) ? FXS.hood(L) + ' · ' : ''}${L.city}, ${L.state}`, cx0, sy + 12 + st*1.2 + 2, cw, 8.6, 1.2, '#fff', 'front.place');
      // owner 11/7: a Just Sold card never lists the house's features: a seller call to action instead; the logo closes the column
      const fyy = sy + 12 + st*1.2 + 26, cta = (SW.data().companion || {}).justSold || {}, ch = cta.ctaHead || 'Thinking about selling?', cl = cta.ctaNext || cta.ctaShort || 'Call or text me anytime.';
      const chs = FXS.fitSize(ch, "font-family:'Oswald';font-weight:500", cw, big ? 26 : 22, 14);
      h += `<div class="abs" style="left:${cx0}pt;top:${fyy}pt;width:${cw}pt;height:${chs*1.2 + 18}pt" data-slot="front.cta" data-lines="2"><div style="font:500 ${chs}pt/${chs*1.2}pt var(--fx-display);color:var(--fx-accent);white-space:nowrap">${esc(ch)}</div><div style="font:500 11pt/16pt var(--fx-font);color:#fff;white-space:nowrap">${esc(cl)}</div></div>`;
      const lgY = fyy + chs*1.2 + 18 + 14, lgH = Math.min(54, H - 18 - lgY);
      if(hh < H - 60){ h += `<div class="abs hr" style="left:${heroX + 14}pt;top:${hh + 12}pt;width:${W - heroX - 14 - M}pt"></div>`; const lgH2 = Math.min(90, H - hh - 20 - 14); h += FXS.logo(D, heroX + 14, hh + 20 + Math.max(0, (H - hh - 20 - 14 - lgH2)/2), Math.min(300, W - heroX - 14 - M), lgH2, 'center'); }   // the logo fills the room under the photo
      else { const top0 = fyy + chs*1.2 + 18, room = H - top0, lh = Math.min(big ? 66 : 60, room - 24), lw = Math.min(240, heroX - 2*M);   /* owner 11/8 (FXS36-JS-front): the logo sits lower, centered in the black block (both ways) */
        if(lh >= 28) h += FXS.logo(D, (heroX - lw)/2, top0 + (room - lh)/2, lw, lh, 'center'); }
    }
  } else {
    // ---------------- BACK (round 2d, the owner 10/29: the navy runs across the whole back; mail zones as in the Just Listed library, scaled to pt) ----------------
    // zones (pt, trim coordinates): postage 84 x 98.25 top right, address block 240 x 112.5, barcode strip 342 x 45 bottom right, all clear of art and type
    const dx = W - 648, X = 30, G = 10, B = K.back || {};
    const Z = {postage: [552 + dx, 12, 84, 98.25], address: [405 + dx, 187.5, 240, 112.5], barcode: [306 + dx, 387, 342, 45]};
    window.__zones = Z;
    // ---- BACK (owner 11/7): the set's field runs to every edge of the card, mail side included; only the postage box, the address block and the barcode strip
    // sit on light panels (luminance 200 or more). The rest of the right side carries the set's own marks.
    const FIELD = '#141414', PBG = '#f4f1ea';
    h += `<div class="abs" data-field="1" style="left:-9pt;top:-9pt;width:${W + 18}pt;height:${H + 18}pt;background:${FIELD}"></div>`;
    const pnl = (x, y, w, hh) => `<div class="abs mail-panel" data-mail-panel="1" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${hh}pt;background:${PBG}"></div>`;
    h += pnl(Z.postage[0] - 6, -9, W + 9 - (Z.postage[0] - 6), Z.postage[1] + Z.postage[3] + 6 + 9);
    h += pnl(Z.address[0] - 6, Z.address[1] - 6, W + 9 - (Z.address[0] - 6), 301 - (Z.address[1] - 6));
    h += pnl(Z.barcode[0] - 8, 386.5, W + 9 - (Z.barcode[0] - 8), H - 386.5 + 9);
    const rx = Z.address[0], lw = rx - G - X, rw = Z.postage[0] - 12 - rx;
    // between the postage panel and the address panel: the house's numbers in the set's own tiles (the same facts on Just Listed and Just Sold)
    { const gx = rx, gw = W - 22 - rx, gy0 = Z.postage[1] + Z.postage[3] + 6 + 6, gy1 = Z.address[1] - 6 - 6, gh = 50, gyy = gy0 + (gy1 - gy0 - gh)/2;
      const its = FXS.statItems(L).slice(0, 3).map(t => { const p = FXS.statParts(t); return {n: p.n, l: p.l.replace(/^Bedrooms?$/i, m => /s$/i.test(m) ? 'Beds' : 'Bed').replace(/^Square Feet$/i, 'Sq Ft').replace(/^Sq Ft$/i, 'Sq Ft')}; });
      h += `<div class="abs" style="left:${gx}pt;top:${gyy}pt;width:${gw}pt;height:${gh}pt;display:flex;gap:6pt">${its.map((p, i) => `<div style="flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4pt;background:#d9302a;color:#fff;border-radius:0;height:50pt;padding:0 6pt"><span data-slot="back.stat.${i}.n" data-lines="1" style="white-space:nowrap;font:500 22pt/1 var(--fx-display)">${esc(p.n)}</span><span data-slot="back.stat.${i}.l" data-small="1" data-lines="1" style="font:600 8pt/1 var(--fx-font);letter-spacing:.8pt;text-transform:uppercase;white-space:nowrap">${esc(p.l)}</span></div>`).join('')}</div>`;
      h += `<div class="abs" style="left:${rx}pt;top:${Z.postage[1] + 56}pt;width:${rw}pt;height:var(--fx-rule-w);background:var(--fx-rule-hard)"></div>`; }
    const short = String(L.address||'').replace(/\s+(street|st\.?|avenue|ave\.?|drive|dr\.?|road|rd\.?|lane|ln\.?|boulevard|blvd\.?|court|ct\.?|way|place|pl\.?)$/i, '');
    h += `<div class="pc-bstatus" style="left:${X}pt;top:14pt;width:${lw}pt;height:30pt"><span class="st" data-slot="back.status" data-lines="1">${esc(statusWord)}</span><span class="ln"></span><span class="ad" data-slot="back.status.addr" data-lines="1">${esc(sold && big ? L.address : short)}</span></div>`;
    const n = big ? 3 : 2, phH = sold ? 86 : big ? 85.5 : 86, capLines = sold ? 4 : 5, py = 54;   // equal photo columns, all ending at the gray box's right edge
    // the photos with the most to say take the narrow columns (a short caption cannot fill five lines), kept in the writer's order
    const txtLen = c => [].concat(...(c.s || []).map(x => [].concat(x))).join(' ').length + String(c.lead || '').length;
    const ps0 = (B.photos || []), keep = ps0.map((c, i) => [txtLen(c), i]).sort((a, b) => b[0] - a[0]).slice(0, n).map(x => x[1]).sort((a, b) => a - b), ps = ps0.length > n ? keep.map(i => ps0[i]) : ps0;

  // ---- the Just Sold front: the facts sit centered between the address and the agent's name, measured on the letters (ink, from the font's own metrics) ----
  function ink(el, noPunct){ const c = (ink.c || (ink.c = document.createElement('canvas').getContext('2d'))); let top = Infinity, bot = -Infinity;

  }
  function bulCols(){ return big ? 2 : 1; }
  function fillOf(ul){ const cols = bulCols(), used = [...ul.querySelectorAll('li span')].reduce((a, sp) => a + SW.lines(sp).n*parseFloat(getComputedStyle(sp).lineHeight), 0); return used/cols/ul.clientHeight; }
  // Just Sold "Here's how I'd start" (owner 11/7): six real bullets at body size, two columns on the 6x11, each one line of 8+ words or two lines ending at least 3/4 full;
  // the type steps down (never under 8.5 pt) and the leading opens (up to 1.65) until the bullets fill 85% or more of the box to its bottom edge
