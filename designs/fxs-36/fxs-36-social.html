<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · FX extras · FX36 socials</title>
<link rel="stylesheet" href="fx.css">
<link rel="stylesheet" href="fxs36-tokens.css">
<link rel="stylesheet" href="fxs36-marks.css">
<script src="fxs36-tk.js"></script>
<script src="fxs36.js"></script>
<script src="../engine/ivory.js"></script>
<script src="../engine/ohlib.js"></script>
<script src="../engine/factrepeat.js"></script>
<script src="fxpage.js"></script>
<script src="fxs36-patch.js"></script>
<!--
  fxs-36 socials: Open House, Just Listed and Just Sold in every size, plus the carousel slides. One page; it draws by FXP.kind(D) and D.piece.shape.
  The flyer's pieces carry through, doing the same job: the address set vertically up the left edge (Bodoni) with a short gold rule; the whole house
  in one large hero with the round neighborhood seal in its corner; the event (or the status) between two hairlines in Cormorant over caps; the
  REALTOR(R) perks on a white notes card; the agent in Cormorant with the one logo; square corners everywhere. No new copy.
  Too much for a size: the notes go first, then what's served (the caption carries them).
-->
<style>
  .abs{position:absolute}
  .wu{font:400 var(--sw,13pt)/1.4 'Montserrat'}
</style>
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
FXS.hookCheck();
FXP.start(['400 20pt "Oswald"', '400 20pt "Oswald"', '500 20pt "Oswald"', '600 20pt "Oswald"', '700 20pt "Oswald"', 'italic 400 20pt "Oswald"', '800 20pt "Montserrat"', '700 20pt "Montserrat"', '600 20pt "Montserrat"', '500 20pt "Montserrat"', '400 20pt "Montserrat"', '300 20pt "Montserrat"'], D => {
  const esc = Ivory.esc, L = D.listing, C = D.companion || {}, A = D.agent || {};
  const kind = FXP.kind(D), shape = D.piece.shape, {W, H} = FXP.size(D), F = FXP.floor(shape); F.ev = F.event;
  const E = OHL.event(D), hero = OHL.hero(D, 'straight');
  if(E.time) E.time = E.time.replace(/(\d)\s+(am|pm)\b/gi, '$1 $2');
  const INK = TK.ink, SOFT = TK.text, MONT = "font-family:'Montserrat'";
  const back = [], mid = [], front = [], tiny = [];
  const rect = (x, y, w, h, css) => `<div class="abs" aria-hidden="true" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${h}pt;${css || ''}"></div>`;
  const pic = (id, x, y, w, h, css) => OHL.photo(D, id, `left:${x}pt;top:${y}pt;width:${w}pt;height:${h}pt;${css || ''}`);
  const archCss = () => '';
  const wdt = (t, css, rich) => { const m = document.createElement('span'); m.style.cssText = `position:absolute;left:-9999pt;visibility:hidden;white-space:nowrap;${css}`; if(rich) m.innerHTML = t; else m.textContent = t; document.body.appendChild(m); const w = m.getBoundingClientRect().width*.75; m.remove(); return w; };
  // text that fits: the biggest size from max to min at which it runs in <= lines lines in width w. o.rich: html for the body
  const T = o => { const r = T0(o); return o.parts && r.n >= 99 ? T0(Object.assign({}, o, {parts: null, lines: Math.max(o.lines || 1, 3)})) : r; };
  const T0 = o => {
    if(o.slot === 'place') return {html: '', h: 0, s: 0, n: 0, w: 0, ok: true};
    const lines = o.lines || 1, lhk = o.lh || 1.15, txt = o.parts ? o.parts.join(' ') : o.text;
    const css = s => `${MONT};${o.css};font-size:${s}pt;line-height:${(s*lhk).toFixed(2)}pt`;
    const cnt = s => o.rich ? (wdt(o.rich, css(s), true) <= o.w + .3 ? 1 : 99) : o.parts ? (o.parts.every(p => FXP.width(p, css(s)) <= o.w + .3) ? o.parts.length : 99) : FXP.lines(txt, css(s), o.w);
    let s = o.max, n = cnt(s);
    while(n > lines && s > o.min){ s -= .5; n = cnt(s); }
    if(s < o.min) s = o.min;
    n = cnt(s);
    const nn = Math.min(n, 99), h = Math.ceil(nn*s*lhk*100)/100 + 1.4 + (nn > 1 ? 2.5 : 0);
    const wid = nn === 1 ? (o.rich ? wdt(o.rich, css(s), true) : FXP.width(txt, css(s))) : o.w;
    const body = o.rich || (o.parts ? o.parts.map(esc).join('<br>') : esc(txt));
    const html = `<div class="abs" style="left:${o.x}pt;top:${o.y}pt;width:${o.w}pt;height:${h}pt;${css(s)};text-align:${o.align || 'left'};white-space:${nn === 1 ? 'nowrap' : 'normal'};overflow:hidden"${o.small ? ' data-small="1"' : ''} data-slot="${o.slot}" data-lines="${nn}">${body}</div>`;
    return {html, h, s, n: nn, w: wid, ok: n <= lines};
  };
  const caps = (wt, tr, col) => `font-weight:${wt};letter-spacing:${tr}pt;text-transform:uppercase;color:${col}`;

  // ---------- px helpers: the page is drawn in pt at K = 0.375 pt per image pixel; sizes below are image pixels ----------
  const K = FXP.K, p = v => v*K, WP = D.piece.px[0], HP = D.piece.px[1], SC = WP/1080;
  const MG = Math.round(54*SC);
  const tp = o => T(Object.assign({}, o, {x: p(o.x), y: p(o.y), w: p(o.w), max: p(o.max), min: o.minPx != null ? p(o.minPx) : (o.min == null ? F.body : o.min)}));
  const LN = 'font-variant-numeric:lining-nums;';
  const GOLD = 'var(--fx-accent)';
  const goldRule = (x, y, w, h) => rect(p(x), p(y), p(w), p(h || 4), 'background:var(--fx-rule-hard)');
  const hair = (x, y, w) => rect(p(x), p(y), p(w), .75, 'background:var(--fx-rule)');
  const RAW = (SW.data().listing || {});
  const addrT = String(RAW.address || L.address);
  const placeT = `${FXS.hood(L) ? FXS.hood(L) + ' · ' : ''}${RAW.city || L.city}, ${/^texas$/i.test(RAW.state || L.state) ? 'TX' : (RAW.state || L.state)} ${RAW.zip || L.zip || ''}`.trim().toUpperCase();
  const hsOn = OHL.cardMode(D) === 'headshot' && !!A.headshot;
  // a tracked caps line that is plain text (small print for the floor checks)
  const capsLn = (slot, text, x, y, w, px, tr, col, align) => { const pt = Math.max(p(px), F.small), h = pt*1.35;
    return {h: h/K, html: `<div class="abs" style="left:${p(x)}pt;top:${p(y)}pt;width:${p(w)}pt;height:${h}pt;font:600 ${pt}pt/${h}pt Montserrat;letter-spacing:${tr}pt;text-transform:uppercase;color:${col};white-space:nowrap;overflow:hidden;text-align:${align || 'left'}" data-small="1" data-slot="${slot}" data-lines="1">${esc(text)}</div>`}; };

  // ---------- the hero: one box per shape, the same on every piece of that shape ----------
  // the whole house inside the centered crop, with a margin (the print check cuts at the box's own edge)
  const heroFit = (w, h) => { const ph0 = (D.photos || {})[hero] || {}; if(!ph0.box || !ph0.w || !ph0.h) return true; const ia = ph0.w/ph0.h, ta = w/h, [x0, y0, x1, y1] = ph0.box, mg = .02;
    if(ta >= ia){ const v = ia/ta, lo = (1 - v)/2; return y0 >= lo + mg*0 && y1 <= 1 - lo && v >= (y1 - y0) + .03; }
    const v = ta/ia, lo = (1 - v)/2; return x0 >= lo && x1 <= 1 - lo && v >= (x1 - x0) + .03; };
  let HERO_H;   // full-width pieces: the shortest frame that holds the whole house, never under 54% of the width
  { let h0 = Math.round(WP*(shape === 'square' ? .55 : .58)); const lim = Math.round(WP*.8); let h = h0; while(h < lim && !heroFit(WP, h)) h += 4; HERO_H = h; }
  const heroBlock = (x, y, w, h) => pic(hero, p(x), p(y), p(w), p(h));
  let HERO_W = 0;   // side pieces: the narrowest column that holds the whole house
  if(shape === 'wide' || shape === 'gbp'){ let w0 = Math.round(WP*.5); const lim = Math.round(WP*.7); while(w0 < lim && !heroFit(w0, HP)) w0 += 8; HERO_W = w0; }

  // ---------- the blocks: each returns {h, html} at (x, y, w) in px ----------
  // the Just Listed / Just Sold lockup: one size on every format (124 px at 1080, scaled with the width), never shrunk; the photo or the facts give way instead
  const LOCK_PX = 124*SC, LOCK_WORD = kind === 'js' ? 'Just Sold' : 'Just Listed', LOCK_W = FXP.width(LOCK_WORD, `font-family:'Oswald';font-size:${p(LOCK_PX)}pt`)/K + 12*SC;
  let lockPt = 0;
  const bStatus = (x, y, w, k) => { const pt = p(LOCK_PX); lockPt = pt;
    return {h: LOCK_PX*1.18, html: `<div class="abs script" style="left:${p(x)}pt;top:${p(y)}pt;width:${p(Math.max(w, LOCK_W))}pt;height:${pt*1.18}pt;font-size:${pt}pt;line-height:${pt*1.18}pt;overflow:visible" data-slot="moment" data-lines="1">${LOCK_WORD}</div>`}; };
  const bAddr = (x, y, w, k, maxPx) => { const r = tp({slot: 'address', text: addrT, css: "font-family:'Oswald';font-weight:500;letter-spacing:.7pt;text-transform:uppercase;color:var(--fx-ink)", x, y, w, max: (maxPx || 100)*SC*k, min: F.ev, lh: 1.1}); const pl = capsLn('place', placeT, x + 2, y + r.h/K + 4, w, 30*SC*Math.max(k, .9), 1.6, '#fff');
    return {h: r.h/K + 4 + pl.h, html: r.html + pl.html}; };
  const bStats = (x, y, w, k) => { const h = Math.round(136*SC*k), items = FXS.statItems(L).slice(0, 3);
    return {h, html: FXS.statsRow(items, p(x), p(y), p(w), p(h), 'fact', {np: Math.max(16, p(60*SC*k)), lp: Math.max(F.body, p(26*SC*k)), track: 1, one: true})}; };
  const bAgent = (x, y, w, k, o) => { o = o || {};
    const ns = (o.name || 58)*SC*k, ps = (o.phone || 40)*SC*k, hsz = hsOn ? Math.round(ns*2.7) : 0, logoW = Math.min(w*.34, 330*SC), lx = x + w - logoW;
    const tx = x + (hsz ? hsz + 16 : 0), tw = lx - 28 - tx;
    const nm = tp({slot: 'agent.name', text: A.name || '', css: "font-family:'Montserrat';font-weight:600;letter-spacing:0;color:var(--fx-ink)", x: tx, y, w: tw, max: ns, min: F.body, lh: 1.08});
    let yy = y + nm.h/K; const out = [nm.html];
    if(A.nar || /realtor/i.test(A.designation || '')){ const d = capsLn('agent.desig', 'REALTOR®', tx + 1, yy + 2, tw, 24*SC, 3.2, '#fff'); out.push(d.html); yy += d.h + 4; }
    const ph = tp({slot: 'agent.phone', text: A.phone || '', css: "font-family:Montserrat;font-weight:600;letter-spacing:.5pt;color:var(--fx-ink)", x: tx, y: yy + 2, w: tw, max: ps, min: F.body, lh: 1.15}); out.push(ph.html); yy += 2 + ph.h/K;
    const h = Math.max(yy - y, hsz);
    if(hsz) out.unshift(`<div class="abs" style="left:${p(x)}pt;top:${p(y)}pt;width:${p(hsz)}pt;height:${p(h)}pt;overflow:hidden"><img src="${esc(A.headshot)}" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></div>`);
    out.push(rect(p(lx - 14), p(y + 4), .75, p(h - 8), 'background:var(--fx-rule)'));
    out.push(OHL.logo(D, 'dark', `left:${p(lx)}pt;top:${p(y + (h - Math.min(h, 110*SC))/2)}pt;width:${p(logoW)}pt;height:${p(Math.min(h, 110*SC))}pt;justify-content:center`));
    return {h, html: out.join('')}; };
  // the event: the gold label on one line, the day over the date's left edge, the date large, the time at 60% of it (beside it when both fit, else under)
  const bEvent = (x, y, w, k, o) => { o = o || {}; const out = []; let yy = y;
    const lab = tp({slot: 'oh.label', text: E.label.toUpperCase(), css: caps(500, 3.2*Math.max(k, .8), TK.accent) + ';text-decoration:underline;text-decoration-thickness:.75pt;text-underline-offset:6pt', x, y: yy, w, max: 50*SC*k, min: F.ev, lh: 1.15});
    out.push(lab.html); yy += lab.h/K + 12*SC;
    const wk = capsLn('oh.weekday', E.weekday, x + 1, yy, w, 36*SC*k, 4.2, '#fff'); out.push(wk.html); yy += wk.h + 2;
    const md = String(E.monthDay || E.long), dmax = 128*SC*k;
    let dt = tp({slot: 'oh.date', text: md, css: `font-family:'Oswald';font-weight:500;letter-spacing:0;color:var(--fx-ink);${LN}`, x: x - 2, y: yy, w: w + 2, max: dmax, min: p(60*SC), lh: 1.02});
    const tcss = s => `font-family:'Oswald';font-weight:500;color:var(--fx-ink);${LN}`;
    let tm = null, inline = false;
    if(E.time){ const ts = dt.s*.6; const tw0 = FXP.width(E.time, `${tcss()};font-size:${ts}pt`);
      if(dt.w + tw0 + p(34*SC) <= p(w)){ inline = true; dt = tp({slot: 'oh.date', text: md, css: `font-family:'Oswald';font-weight:500;letter-spacing:0;color:var(--fx-ink);${LN}`, x: x - 2, y: yy, w: (dt.w + 6)/K, max: dmax, min: p(60*SC), lh: 1.02}); dt.s = Math.min(dt.s, dmax*K);
        tm = T({slot: 'oh.time', text: E.time, css: tcss() + ';letter-spacing:0;text-align:right', x: p(x + w) - tw0 - 6, y: p(yy) + (dt.h - ts*1.05)*.62, w: tw0 + 6, max: ts, min: ts, lh: 1.05}); }
      else tm = null; }
    out.push(dt.html); yy += dt.h/K;
    if(E.time){ if(inline) out.push(tm.html); else { const t2 = tp({slot: 'oh.time', text: E.time, css: tcss() + ';letter-spacing:0', x, y: yy + 4, w, max: dt.s/K*.6, min: dt.s/K*.6, lh: 1.05}); out.push(t2.html); yy += 4 + t2.h/K; } }
    const items = [[E.refreshments, 'oh.refreshments', 700], [E.note, 'oh.note', 600]].filter(i => i[0]);
    if(items.length){ yy += 20*SC;
      const bf = Math.max(F.body*1.1, 44*SC*k*K), py = 16*SC, rows = []; let by = yy + py;
      items.forEach(([tx, slot, wt]) => { const r = tp({slot, text: tx, css: `font-family:'Oswald';font-weight:${wt};color:var(--fx-ink)`, x: x + 24*SC, y: by, w: w - 48*SC, max: bf/K, min: F.body, lines: 2, lh: 1.12}); rows.push(r.html); by += r.h/K + 6*SC; });
      by -= 6*SC; out.push(`<div class="card" data-box="oh.box" style="left:${p(x)}pt;top:${p(yy)}pt;width:${p(w)}pt;height:${p(by - yy + py)}pt"></div>`, ...rows); yy = by + py; }
    return {h: yy - y, html: out.join('')}; };
  const bJsLine = (x, y, w, k) => { const sl = FXP.soldLine(D);
    const l1 = tp({slot: 'sold.head', text: sl.head, css: "font-family:'Oswald';font-weight:700;color:var(--fx-ink)", x, y, w, max: 54*SC*k, min: F.body, lines: 1, lh: 1.1});
    let yy = y + l1.h/K, o = l1.html; if(sl.line){ const l2 = tp({slot: 'sold.line', text: sl.line, css: `font-family:'Oswald';font-weight:600;color:${SOFT}`, x, y: yy + 4, w, max: 40*SC*k, min: F.body, lines: 2, lh: 1.15}); o += l2.html; yy += 4 + l2.h/K; }
    return {h: yy - y, html: o}; };
  // three different rooms side by side (story bottom strip, square)
  const roomsAll = () => OHL.photos(D).filter(id => id !== hero && !Ivory.fullHouse(D, id)).sort((a, b) => FXS.archScore(D, b) - FXS.archScore(D, a)).filter((id, i, arr) => arr.findIndex(o => FXP.fam(o) === FXP.fam(id) || o.replace(/\d+[a-z]?$/, '') === id.replace(/\d+[a-z]?$/, '')) === i);
  const bStrip = (x, y, w, h) => { const rs = roomsAll().slice(0, 3), g = 10*SC, pw = (w - g*(rs.length - 1))/rs.length; return {h, html: rs.map((id, i) => pic(id, p(x + i*(pw + g)), p(y), p(pw), p(h))).join('')}; };

  // ---------- the stack: blocks in order, spaced evenly in what the hero leaves; the content shrinks (k) until it fits ----------
  const stack = (x, y0, w, avail, make, ks, strict) => {
    for(const k of ks){ const bl = make(k); const sum = bl.reduce((t, b) => t + b.h, 0), n = bl.length - 1, gap = n ? (avail - sum)/n : 0;
      if(gap >= 14*SC*Math.min(k, 1) || (!strict && k === ks[ks.length - 1])){ const g = Math.min(gap, 80*SC); let y = y0 + Math.max(0, (avail - sum - g*n)/2); const out = [];
        bl.forEach(b => { out.push(b.mk ? b.mk(y).html : b.html.replace(/%Y%/g, y)); y += b.h + g; }); return out.join(''); } } return null; };
  const KS = [1, .94, .88, .82, .76, .7];

  // =========================== full-width pieces (post, story, pin, square): hero on top ===========================
  const vertical = () => {
    const heroH = HERO_H, top = heroH + 4, w = WP - 2*MG, storyPad = shape === 'story' ? Math.round(HP*.04) : 0;
    front.push(heroBlock(0, 0, WP, heroH)); front.push(goldRule(0, heroH, WP, 4*SC));
    const base = HP - top - MG*.9 - (shape === 'story' ? Math.round(300*SC) : 0), y00 = top + MG*.55;
    const facs = k => { const f = []; const wrap = (fn) => { const m = fn(0); return {h: m.h, mk: y => fn(y)}; };
      if(kind === 'oh'){ f.push(wrap(y => bAddr(MG, y, w, k, 104))); f.push(wrap(y => bEvent(MG, y, w, k))); }
      else if(kind === 'js'){ f.push(wrap(y => bStatus(MG, y, w, k))); f.push(wrap(y => bAddr(MG, y, w, k, 92))); f.push(wrap(y => bJsLine(MG, y, w, k))); }
      else { f.push(wrap(y => bStatus(MG, y, w, k))); f.push(wrap(y => bAddr(MG, y, w, k, 112))); f.push(wrap(y => bStats(MG, y, w, k))); }
      f.push(wrap(y => bAgent(MG, y, w, k, kind === 'js' ? {name: 104, phone: 68} : {name: 76, phone: 50})));
      return f; };
    let placed = null;
    if(shape === 'story'){ for(const sh0 of [300, 250, 210, 170, 140]){ const sh = Math.round(sh0*SC), avail = base - sh - 24*SC; const res = stack(MG, y00 + sh + 24*SC, w, avail, facs, KS, true);
        if(res){ placed = res; front.push(bStrip(MG, y00, w, sh).html); break; } }
      if(!placed){ const sh = Math.round(140*SC); placed = stack(MG, y00 + sh + 24*SC, w, base - sh - 24*SC, facs, KS); front.push(bStrip(MG, y00, w, sh).html); } }
    else placed = stack(MG, y00, w, base, facs, KS);
    mid.push(placed);
  };

  // =========================== side pieces (wide, gbp): house and text on top, the perks and the agent in a band across the foot ===========================
  const sideways = () => {
    const gp = 14*SC, m = Math.round(34*SC), w = WP - 2*m, sq = shape === 'square';
    // the foot: the perks (both lines, REALTOR(R) pieces) in a double frame across the page
    const items = kind === 'oh' ? [[E.refreshments, 'oh.refreshments', 700], [E.note, 'oh.note', 600]].filter(i => i[0]) : [];
    const perkF = Math.max(F.body*1.05, (sq ? 46 : 40)*SC*K), perkRows = items.map(([tx, slot, wt]) => tp({slot, text: tx, css: `font-family:'Oswald';font-weight:${wt};color:var(--fx-ink)`, x: m + 22*SC, y: 0, w: w - 44*SC, max: perkF/K, min: F.body, lines: 2, lh: 1.1}));
    const perkH = items.length ? perkRows.reduce((s, r) => s + r.h/K + 4*SC, 0) + 24*SC : 0;
    const footH = perkH ? perkH + gp : 0;
    const zm = HP - footH - m*.7;                         // the main zone's height
    // the left column: the whole house (frame between 1.2 : 1 and 1.5 : 1), the agent under it
    const lim = Math.round(WP*(shape === 'gbp' ? .5 : sq ? .56 : .5));
    const agMin = Math.round((sq ? 200 : 190)*SC); const needPh = FXP.width(A.phone || '', `font:600 ${F.body}pt Montserrat;letter-spacing:.4pt`)/K + 12*SC; let hw = Math.min(lim, Math.round((zm - agMin - 4*SC - gp)*1.3)); hw = Math.max(hw, Math.min(Math.round(needPh + 1.5*m + 8*SC), Math.round(WP*.6))); if(kind !== 'oh') hw = Math.min(hw, Math.round(WP - 2*m - LOCK_W));
    let hh = Math.round(hw/1.3); for(const r of [1.3, 1.2, 1.4, 1.5, 1.6, 1.8]){ hh = Math.round(hw/r); if(heroFit(hw, hh)) break; }
    let agTop = hh + 4*SC + gp, agH = zm - agTop;
    if(sq){ const sh = Math.min(330*SC, agH - 300*SC - gp), rs = roomsAll().slice(0, 2); if(sh >= 130*SC && rs.length === 2){ const g2 = 10*SC, rw2 = (hw - g2)/2; rs.forEach((id, i) => front.push(pic(id, p(i*(rw2 + g2)), p(agTop), p(rw2), p(sh)))); agTop += sh + gp; agH = zm - agTop; } }
    front.push(heroBlock(0, 0, hw, hh)); front.push(goldRule(0, hh, hw, 4*SC)); front.push(rect(p(hw), 0, p(4*SC), p(zm + 6*SC), 'background:var(--fx-rule-hard)'));
    // the agent: name, REALTOR(R), phone and the logo, in the left column under the house
    { const lw = hw - 2*m + m*.5, lx = m*.8, need = FXP.width(A.phone || '', `font:600 ${F.body}pt Montserrat;letter-spacing:.4pt`)/K + 12*SC;
      const stackLogo = lw*.7 < need, logoW = stackLogo ? Math.min(lw*.6, 300*SC) : lw*.3, nW = stackLogo ? lw : lw - logoW - 16*SC;
      let s = 1, nm, ph, hgt, lgH = 0;
      for(; s >= .45; s -= .05){ const nsz = Math.min(sq ? 76 : 60, agH*(stackLogo ? .26 : .36))*SC*s, psz = Math.min(sq ? 52 : 42, agH*(stackLogo ? .2 : .25))*SC*s;
        nm = tp({slot: 'agent.name', text: A.name || '', css: "font-family:'Montserrat';font-weight:600;letter-spacing:0;color:var(--fx-ink)", x: lx, y: agTop, w: nW, max: nsz, min: F.body, lines: 1, lh: 1.05});

    // the foot: the perks

      let yy = y + 12*SC; items.forEach(([tx, slot, wt], i) => { const r = tp({slot, text: tx, css: `font-family:'Oswald';font-weight:${wt};color:var(--fx-ink)`, x: m + 22*SC, y: yy, w: w - 44*SC, max: perkF/K, min: F.body, lines: 2, lh: 1.1}); mid.push(r.html); yy += r.h/K + 4*SC; }); }
  };

  // =========================== carousel slides ===========================
  const lastFill = (t, css, w) => { const q = document.createElement('div'); q.style.cssText = `position:absolute;left:-9999pt;visibility:hidden;width:${w}pt;${css}`; q.textContent = t; document.body.appendChild(q);
    const r = document.createRange(); r.selectNodeContents(q); const rs = [...r.getClientRects()].filter(z => z.width > .5), tp0 = Math.max(...rs.map(z => z.top));
    const last = rs.filter(z => Math.abs(z.top - tp0) < 2), wd = (Math.max(...last.map(z => z.right)) - Math.min(...last.map(z => z.left)))*.75; q.remove(); return wd/w; };

    const CSP = p(62*SC); let pick = null;
    outer: for(const txt of cands){ if(SW.sameFactIn(txt)) continue;
