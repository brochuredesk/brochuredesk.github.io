<!doctype html>
<html lang="en">
<head>
<meta charset="uar-8">
<title>BrochureDesk · Arrow postcards</title>
<link rel="stylesheet" href="ar.css">
<link rel="stylesheet" href="ar-fo.css">
<script src="ar.js"></script>
<script src="../engine/baths.js"></script>
<script src="../engine/agentcard.js"></script>
<script src="../engine/factrepeat.js"></script>
<script>window.Ivory = window.Ivory || {esc: s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))};</script>
<script src="ar-fo.js"></script>
<!--
  BrochureDesk · Arrow · Just Listed and Just Sold postcards (the hand of the approved Open House library flyer B01).
  data.piece.card = "listed" | "sold", data.piece.size = "6x11" (trim 792 x 432 pt) | "6x9" (648 x 432 pt), data.piece.side = "front" | "back".
  Print adds 0.125 in (9 pt) bleed. The agent's brand color (brand.accent) is the field on both sides; boxes are white.
  Front: the whole house (roof to steps) on the right with a one-line-or-two caption and a white box under it, the status stacked large on the left over the address,
  the fact rows and the brokerage logo (Just Listed) or the agent's name and number and the logo (Just Sold). No price, no QR.
  Back: status line, interior photos with captions, a white box (the write-up, or the steps), the standard contact card (templates/_shared/agentcard.js,
  band preset, which carries the back's one logo), the fine print. The right 289.5 pt (4.02 in) is the mail vendor's: return address, postage and address
  zones; drawn as guides on proofs and left clear in print.
  Copy comes from data.sw.pc.{jl|js}.{front|back} as a lead plus whole sentences; ar.js picks the sentences that fill each box.
-->
<style>
  /* the FX14 hand on a postcard: white frame, a taupe block, Pinyon Script status, white underlined labels, hairline white boxes; tokens in ar-tokens.css */
  .pc-col{position:absolute;display:flex;flex-direction:column}
  .pc-wbox{background:var(--ar-lift);color:var(--fx-soft);padding:10pt 16pt 9pt;display:flex;flex-direction:column;overflow:hidden}
  .pc-wbox:after{content:"";position:absolute;inset:4.5pt;border:1pt solid color-mix(in srgb, var(--ar-accent) 78%, transparent);pointer-events:none}
  .pc-wbox.lt{background:#fff;color:#2c2c2c}
  .pc-wbox.lt:after{border-color:var(--ar-box-line)}
  .pc-wbox.lt .k{color:var(--ar-ink-accent)}
  .pc-wbox.lt .p{color:#161616}
  .pc-wbox .k{font:500 8.6pt/11pt var(--ar-font);letter-spacing:3.4pt;text-transform:uppercase;color:var(--ar-accent);white-space:nowrap;overflow:hidden;margin-bottom:3pt;align-self:flex-start}
  .pc-wbox .p{font-family:var(--ar-serif);font-weight:500;overflow:hidden;color:var(--fx-on)}
  .pc-wbox .p b{font-weight:700;color:var(--fx-on)}
  .pc-bstatus{position:absolute;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
  .pc-bstatus .st{font:700 10.5pt/1 var(--fx-font);letter-spacing:2.4pt;color:var(--fx-on);text-transform:uppercase}
  .pc-bstatus .ln{flex:1;height:1.2pt;background:var(--ar-accent);margin:0 12pt;min-width:16pt}
  .pc-bstatus .ad{font:500 16pt/1 var(--ar-serif);color:var(--fx-on);padding-bottom:3pt}
  .pc-steps .it{display:flex;gap:8pt;align-items:baseline;white-space:nowrap;overflow:hidden}
  .pc-steps .bx{width:4pt;height:4pt;transform:translateY(-1pt) rotate(45deg);background:var(--ar-accent);flex:none}
  .pc-call{font:500 13pt/16pt var(--ar-serif);color:var(--ar-accent);white-space:nowrap;overflow:hidden}
  .pc-disc{position:absolute;font-size:6pt;line-height:10pt;color:var(--fx-soft);overflow:hidden;white-space:nowrap}
  .pc-ret{position:absolute;font:500 9pt/11pt var(--fx-font);letter-spacing:.2pt;color:var(--fx-on);overflow:hidden;height:34pt}
  .pc-ret b{font-weight:700;letter-spacing:1.4pt;text-transform:uppercase;color:var(--fx-ink)}
  .cap .a{font-weight:400}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const esc = SW.esc, b = D.brand || {}, A = D.agent || {}, L = D.listing, P = D.piece || {};
  document.body.dataset.mode = D.mode || 'email';
  await SW.setup(D);
  const sold = P.card === 'sold', big = P.size === '6x11', front = P.side === 'front';
  const W = big ? 792 : 648, H = 432;
  const K = ((D.sw || {}).pc || {})[sold ? 'js' : 'jl'] || {};
  const hsSrc = A.headshot && ((D.photos||{})[A.headshot] ? D.photos[A.headshot].src : A.headshot) || '';
  const statusWord = sold ? 'Just Sold' : 'Just Listed';
  const issues = [];
  const logo = (cls, src, area, maxh, style) => `<div class="logo ${cls}" data-area="${area}" data-maxh="${maxh}" style="${style||''}">${src ? `<img src="${esc(src)}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage||'')}</span>`}</div>`;
  const CL = big ? 13.5 : 12.5, CF = big ? 'font-size:10.9pt;line-height:13.5pt;' : '';   // the 6x11 sets its type up from the 6x9 (11 pt against 9.5), not the same size with more room
  const cap = (c, slot, lines, extra, min) => (c = (c.photo ? FXS.augment(D, c) : c), `<div class="cap" style="height:${5 + lines*CL}pt;${extra||''}"><div class="a" data-min="${min || 2}" data-nopair="1" data-slot="${slot}" data-narrow="0" data-nstep="6" data-lh="${CL}" data-lines="${lines}" data-lead="${esc(c.lead||'')}" data-s='${esc(JSON.stringify([].concat(c.s||[]))).replace(/'/g,'&#39;')}' style="height:${lines*CL}pt;${CF}"></div></div>`);
  let h = '';

  if(front){
    // The FX14 hand on a postcard front. A white frame top and side, the whole house in it, a taupe block around it with the status in Pinyon Script.
    // JL: "Just Listed" in script beside the house, the horizontal address, three facts; under the house the caption ("Front.", the draws) and the agent and logo along the foot.
    // JS: sells the agent: "Just Sold" in the same script lockup, the name and phone big on the left, the house on the right with the agent's own note, the logo.
    const F = K.front || {};
    const draws = list => { const w = x => /gated|roof|pergola|deck|park|garage|island|stone|corner|pool/i.test([].concat(x)[0]) ? 0 : 1; return (list || []).map((x, i) => [w(x), i, x]).sort((p, q) => p[0] - q[0] || p[1] - q[1]).map(t => t[2]); };
    const capC = sold ? {lead: '', s: (F.note || {}).s || (F.cap || {}).s} : (F.caption ? {lead: F.caption.lead, s: F.caption.s.concat(draws((F.about || {}).s || []))} : {lead: 'Front.', s: draws((F.about || {}).s || (F.cap || {}).s)});
    const norm = x => String(x).toLowerCase().replace(/[^a-z0-9 ]/g, '').slice(0, 40), allAlts = list => [].concat(...(list || []).map(x => [].concat(x)));
    const backSet = new Set([].concat(allAlts(((K.back || {}).about || {}).s), ...((K.back || {}).photos || []).map(c => allAlts(c.s)), allAlts((K.back || {}).steps6), allAlts((K.back || {}).steps)).map(norm));
    const backAll = allAlts(((K.back || {}).about || {}).s).map(String);   // the back's About box
    if(capC.s){ const kept = capC.s.filter(x => ![].concat(x).some(a => backSet.has(norm(a)))); if(kept.length >= 2) capC.s = kept; }
    // the caption's own first sentence stays; a later one that says a fact the back's About box says (the deck and pergola, in other words) drops out
    if(capC.s && capC.s.length > 2){ const tail = capC.s.slice(1).filter(x => ![].concat(x).some(a => backAll.some(b => SW.sameFact(String(a), b)))); if(tail.length >= 1) capC.s = [capC.s[0]].concat(tail); }
    const roomIds = [...new Set([].concat(((D.sw||{}).back||{}).photos||[], ((D.sw||{}).left||{}).photos||[]).map(c => c.photo))].filter(id => (D.photos||{})[id] && !(D.photos[id]||{}).fullHouse && id !== F.cap.photo).slice(0, 2);
    // ---- Arrow fronts, design pass 11/15 (the mailbox test). Two different cards. Just Listed: the house bleeds off three edges
    // and is the hero; JUST / LISTED stacked as large as the column allows, flush left with the street, the facts and three specific highlights
    // on small accent marks (no box); the agent and the one logo along the foot; the closed frame holds the words and never crosses the photo.
    // Just Sold: the house is a picture inside the closed frame; the words centered. A dusk glow runs where the field meets the photo. ----
    const k = big ? 1.12 : 1, FRI = 22, pid = FO.heroId(D, F.cap.photo);
    const word = sold ? 'Just Sold' : 'Just Listed', place = [FXS.hood(L), FXS.placeLine(L)].filter(Boolean).join('  ·  ').toUpperCase(), ad = String(L.address || '');
    const tenor = "font-family:Jost;letter-spacing:3pt", facts = FXS.statItems(L).filter(t => !/^Built/.test(t)).join('  ·  ').toUpperCase();
    // reversed caps never under 8.5 pt: a line that does not fit at its size gives up tracking before it gives up size
    const capsFit = (t, w, max, wt, tracks) => { for(const ls of tracks){ const fs = FXS.fitSize(t, `font-family:Jost;font-weight:${wt};letter-spacing:${ls}pt`, w, max, 8.5); if(FXS.width(t, `font-family:Jost;font-weight:${wt};letter-spacing:${ls}pt;font-size:${fs}pt`) <= w - 12) return {fs: Math.max(8.5, fs), ls}; } return {fs: 8.5, ls: tracks[tracks.length - 1]}; };
    const eyebrow = (x, y, w, al) => { const c = capsFit(place, w, 8.8*k, 500, [3, 2.2, 1.4, 0.8]); return `<div class="abs ar-eyebrow" style="left:${x}pt;top:${y}pt;width:${w}pt;font-size:${c.fs}pt;line-height:${12*k}pt;letter-spacing:${c.ls}pt${al ? ';text-align:' + al : ''}" data-slot="front.place" data-lines="1">${esc(place)}</div>`; };
    const factsLine = (x, y, w, al) => { let ft = facts, c = capsFit(ft, w, 10*k, 600, [1.8, 1.2, 0.7, 0.3]); if(FXS.width(ft, `font-family:Jost;font-weight:600;letter-spacing:${c.ls}pt;font-size:${c.fs}pt`) > w - 12){ ft = facts.replace(/\s+·\s+/g, ' · '); c = capsFit(ft, w, 10*k, 600, [1.2, 0.7, 0.3, 0, -0.2]); }   /* a narrow column: the facts close up before they shrink under 8.5 pt */ return `<div class="abs ar-caps" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${14*k}pt;font-size:${c.fs}pt;line-height:${14*k}pt;letter-spacing:${c.ls}pt${al ? ';text-align:' + al : ''}" data-slot="front.facts" data-lines="1">${esc(ft)}</div>`; };
    const status = (t, x, y, w, fs, slot, al) => `<div class="abs ar-label" style="left:${x}pt;top:${y}pt;width:${w + 4}pt;height:${fs*1.04}pt;font-size:${fs}pt;line-height:${fs*1.04}pt;letter-spacing:3pt;overflow:visible${al ? ';text-align:' + al : ''}" data-slot="${slot}" data-lines="1">${esc(t)}</div>`;
    const serif = (t, x, y, w, fs, slot, extra) => `<div class="abs ar-serif" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${fs*1.25}pt;font-size:${fs}pt;line-height:${fs*1.25}pt;${extra || ''}" data-slot="${slot}" data-lines="1">${esc(t)}</div>`;
    // the highlights: real selling facts, the specific ones first (a dated improvement beats a plain feature), one per line on a small accent mark
    const tags = w => { const tg = FXS.tagFacts(D).tags.filter(t => FXS.width(t, `font-family:Jost;font-weight:500;font-size:${11.5*k}pt`) < w - 16).filter((t, i, arr) => !arr.slice(0, i).some(u => SW.sameFact(t, u))); const sc = t => (/\b(19|20)\d\d\b/.test(t) ? 4 : 0) + (/\d/.test(t) ? 1 : 0) + Math.min(t.length, 30)/30; return tg.map((t, i) => [sc(t), i, t]).sort((a, b) => b[0] - a[0] || a[1] - b[1]).map(x => x[2]); };
    const hl = (t, i, x, y, w, rh) => `<div class="abs" style="left:${x}pt;top:${y + rh/2 - 2.5*k}pt;width:${5*k}pt;height:${5*k}pt;transform:rotate(45deg);background:var(--ar-accent)"></div><div class="abs" style="left:${x + 15*k}pt;top:${y}pt;width:${w - 15*k}pt;height:${rh}pt;font-weight:500;font-size:${11.5*k}pt;line-height:${rh}pt;font-family:var(--ar-font);color:var(--ar-on);white-space:nowrap;overflow:hidden" data-slot="front.hl.${i}" data-lines="1">${esc(t)}</div>`;
    const note = (x, y, w, n, lh, fs, pad) => { fs = fs || 10*k; pad = pad || 13; return `<div class="ar-lt"><div class="ar-wbox lt" id="notebox" data-pad="${pad}" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${n*lh + 2*pad}pt"></div><div class="abs cap"><div class="a" style="position:absolute;left:${x + 15}pt;top:${y + pad}pt;width:${w - 30}pt;height:${n*lh}pt;font-size:${fs}pt;line-height:${lh}pt;color:var(--fx-soft)" data-slot="front.note" data-lh="${lh}" data-lines="${n}" data-min="3" data-narrow="0" data-flexh="1" ${FXS.sd(capC.s || [])}></div></div></div>`; };   // the Just Sold note is the card's one light moment: B01's white card
    const nameW = ns => FXS.width(A.name || '', `font-family:Jost;letter-spacing:.8pt;font-size:${ns}pt`), phoneW = ns => FXS.width(A.phone || '', `font-family:Jost;font-weight:600;font-size:${ns*0.74}pt`);
    const desT = A.designation ? (A.nar || /realtor/i.test(A.designation) ? 'REALTOR®' : A.designation) : '', DS = 8.5*k, desW = desT ? FXS.width(desT, `font-family:Jost;font-weight:500;letter-spacing:2pt;font-size:${DS}pt`) + 9*k : 0, LOGO_MIN = 104*k;
    const nameSpan = ns => `<span style="font-weight:400;font-size:${ns}pt;line-height:${ns*1.25}pt;font-family:var(--ar-label);letter-spacing:.8pt;color:var(--ar-on)" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</span>`;
    const desSpan = ns => `<span style="font-weight:500;font-size:${DS}pt;line-height:${ns*1.25}pt;font-family:var(--ar-font);letter-spacing:2pt;color:var(--ar-accent);margin-left:${9*k}pt" data-slot="agent.desig" data-lines="1">${esc(desT)}</span>`;
    const phoneSpan = (ns, ml) => `<span style="font-weight:600;font-size:${ns*0.74}pt;line-height:${ns*1.1}pt;font-family:var(--ar-font);color:var(--ar-on)${ml ? `;margin-left:${ml}pt` : ''}" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</span>`;
    // the agent and the one logo, tied together: beside each other on one row, or (a narrow column) the logo under the agent's line
    const footStacks = (w, ns) => w - Math.max(nameW(ns), phoneW(ns)) - 20*k < LOGO_MIN;
    const agentRow = (x, y, w, ns, hh, oneLine, under) => { const nw = nameW(ns), pw = phoneW(ns);
      let des = !!desT, bw = oneLine ? nw + desW + 16*k + pw : Math.max(nw + desW, pw); if(des && (under ? nw + desW + 14*k + pw > w : w - bw - 20*k < LOGO_MIN)){ des = false; bw = oneLine ? nw + 16*k + pw : Math.max(nw, pw); }
      if(under){ const th = ns*1.25, lh2 = hh - th - 7*k, lw2 = Math.min(w, nw + (des ? desW : 0) + 14*k + pw); return `<div class="abs" style="left:${x}pt;top:${y}pt;width:${w}pt;white-space:nowrap;line-height:${th}pt">${nameSpan(ns)}${des ? desSpan(ns) : ''}${phoneSpan(ns, 14*k)}</div>` + FXS.logo(D, x, y + th + 7*k, lw2, lh2, 'center'); }   // the logo sits centered under the agent's line: one block
      const th = oneLine ? ns*1.25 : ns*2.35, lx = x + bw + 20*k;
      return `<div class="abs" style="left:${x}pt;top:${y + (hh - th)/2}pt;width:${bw + 4}pt;white-space:nowrap">${oneLine ? `<div style="line-height:${ns*1.25}pt">${nameSpan(ns)}${des ? desSpan(ns) : ''}${phoneSpan(ns, 16*k)}</div>` : `<div style="line-height:${ns*1.25}pt">${nameSpan(ns)}${des ? desSpan(ns) : ''}</div><div style="line-height:${ns*1.1}pt">${phoneSpan(ns)}</div>`}</div>` + FXS.logo(D, lx, y, x + w - lx, hh, 'flex-end'); };
    const photoAt = (x, y, w, hh) => `<div class="abs" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${hh}pt">${SW.photo(D, pid, 'position:absolute;inset:0', 'front.hero')}</div>`;
    const cq = 'Thinking about selling?';

    // ---- Arrow fronts. Both carry the tab down the left edge with the place set upright, and the house in the arrow with its echo.
    // Just Listed: the words stacked huge in the column (JUST in white, LISTED in the accent: the sign-in sheet's PLEASE / SIGN IN),
    // the street, the facts, the house's real story on small pointers, the agent and the logo; the house in a full-height arrow pointing
    // off the card. Just Sold: a different composition: JUST SOLD set in a main-color pointer banner across the top (the sign-in
    // sheet's row tag grown into a banner), the street under it, then the house in a smaller arrow pointing at the agent's words. ----
    const TB = 38, tabT = AR.tab(-9, TB + 9, FXS.placeLine(L), 'front.tab', {cx: 22, cy: H/2, len: 400});   // the place sits 0.2 in or more inside trim
    h += tabT;
    const headCss = 'font-family:Jost;font-weight:600;letter-spacing:1.5pt';
    const big2 = (t, x, y, fs, slot, cls) => `<div class="abs ar-head" style="left:${x}pt;top:${y}pt;height:${fs*1.02}pt;font-size:${fs}pt;line-height:${fs*1.02}pt;overflow:visible${cls ? ';color:var(--ar-accent)' : ''}" data-slot="${slot}" data-lines="1">${esc(t.toUpperCase())}</div>`;
    const addrL = (x, y, w, max, slot) => { const as = FXS.fitSize(ad, 'font-family:Jost;font-weight:600', w, max, 13); return {h: as*1.2, html: `<div class="abs ar-addr" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${as*1.2}pt;font-size:${as}pt;line-height:${as*1.2}pt" data-slot="${slot}" data-lines="1">${esc(ad)}</div>`}; };
    const capsL = (t, x, y, w, max, slot, color) => { const c = capsFit(t, w, max, 600, [1.8, 1.2, 0.7, 0.3]); return `<div class="abs ar-caps" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${c.fs*1.4}pt;font-size:${c.fs}pt;line-height:${c.fs*1.4}pt;letter-spacing:${c.ls}pt${color ? ';color:' + color : ''}" data-slot="${slot}" data-lines="1">${esc(t)}</div>`; };
    const ptr = (x, y, s) => `<div class="abs" style="left:${x}pt;top:${y}pt;width:${s*0.9}pt;height:${s}pt;background:var(--ar-accent);clip-path:polygon(0 0,45% 0,100% 50%,45% 100%,0 100%)"></div>`;
    const hl2 = (t, i, x, y, w, rh, fs) => ptr(x, y + rh/2 - 4.5*k, 9*k) + `<div class="abs" style="left:${x + 16*k}pt;top:${y}pt;width:${w - 16*k}pt;height:${rh}pt;font-weight:500;font-size:${fs}pt;line-height:${rh}pt;font-family:var(--ar-font);color:var(--ar-on);white-space:nowrap;overflow:hidden" data-slot="front.hl.${i}" data-lines="1">${esc(t)}</div>`;
    const story = w => { const own = ((F.highlights || [])).filter(t => FXS.width(t, `font-family:Jost;font-weight:500;font-size:${11*k}pt`) < w - 18*k); return own.length >= 2 ? own : tags(w); };
    if(!sold){
      // ---------- JUST LISTED ----------
      const AY = 18*k, AB = H - 30*k, WY = 30*k;   // the arrow's top and foot (its echo runs 12 pt lower); the words start 0.2 in+ inside trim
      let PW = Math.round(W*0.5); while(PW < W*0.64 && !SW.fits(D, pid, PW, AB - AY)) PW += 6;
      const side = SW.fits(D, pid, PW, AB - AY);
      if(side){
        const AX = W - PW - 22*k; h += AR.arrow(D, pid, AX, AY, PW, AB - AY, 'front.hero', {d: Math.round(36*k)});
        const TX0 = TB + 16*k, TX1 = AX - 18*k, TW = TX1 - TX0; let y = WY;
        const ls = Math.min(FXS.fitSize('LISTED', headCss, TW, 80*k, 34), 96);
        h += big2('Just', TX0, y, ls, 'front.status') + big2('Listed', TX0, y + ls*1.0, ls, 'front.status2', 1); y += 2*ls*1.0 + 12*k;
        const a = addrL(TX0, y, TW, 21*k, 'front.address'); h += a.html; y += a.h + 2;
        h += capsL(facts, TX0, y, TW, 9.5*k, 'front.facts'); y += 18*k;
        const fy = H - 20*k - 34*k, rh = 21*k, nT = Math.max(2, Math.min(3, Math.floor((fy - 12*k - y)/rh))), st = story(TW).slice(0, nT), gapT = Math.max(0, (fy - 12*k - y - st.length*rh)/2);
        st.forEach((t, i) => { h += hl2(t, i, TX0, y + gapT + i*rh, TW, rh, 11*k); });
        h += `<div class="ar-hair" style="left:${TX0}pt;top:${fy - 6*k}pt;width:${TW}pt"></div>` + agentRow(TX0, fy, TW, 15*k, 34*k, false, footStacks(TW, 15*k));
      } else {
        // a wide house: the arrow runs across the top; JUST / LISTED stacked on the left under it, the street, facts and story on the right
        const AX = TB + 16*k, AW = W - AX - 22*k; let SH = Math.round(H*0.5); while(SH < H*0.66 && !SW.fits(D, pid, AW, SH)) SH += 4; h += AR.arrow(D, pid, AX, 16*k, AW, SH, 'front.hero', {d: Math.round(40*k)});
        const y0 = 16*k + SH + 26*k, yB = H - 16*k, cW = Math.round((W - AX - 22*k)*0.46), cR = AX + cW + 26*k, rW = W - 22*k - cR;
        const ls = Math.min(FXS.fitSize('LISTED', headCss, cW, 60*k, 26), (yB - y0 - 36*k)/2.05);

  function jsCheck(){ const out = [], box = document.querySelector('.sheet .pc-wbox'); if(!box) return out;

    const apply = (fs, m) => { list.style.fontSize = fs + 'pt'; list.style.lineHeight = (fs*m) + 'pt'; stp.forEach(e => { e.dataset.lh = fs*m; }); its.forEach(it => { it.querySelector('.bx').style.marginTop = (fs*m*.42) + 'pt'; }); SW.fill(); };

  // the Just Sold steps: the largest size (6x11 13.5 pt, 6x9 11.5 pt, down to 9.5) at which every step sets in one or two lines inside its

  // the Just Sold steps (shared wording, picked from its own alternates, never rewritten): at the largest size (6x11 14 pt, 6x9 12 pt, down to
  // 9.5) every step takes its fullest wording that sets on one full line (85%+), else on two balanced lines; the box closes to its longest line
  function arSteps(){ const els = [...document.querySelectorAll('.ar-stx')]; if(!els.length) return; const rows = els.map(e => e.parentElement);
    const lines = e => { const r = document.createRange(); r.selectNodeContents(e); const L = []; [...r.getClientRects()].forEach(q => { if(q.width < .5) return; const l = L.find(x => Math.abs(x.t - q.top) < 4); if(l){ l.l = Math.min(l.l, q.left); l.r = Math.max(l.r, q.right); } else L.push({t: q.top, l: q.left, r: q.right}); }); return L; };

  function backCheck(){ const out = [], pt = v => v*72/96, sh = document.querySelector('.sheet').getBoundingClientRect(), X0 = window.__cardX || 30;
