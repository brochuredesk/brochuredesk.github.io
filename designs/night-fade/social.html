<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>night-fade social set</title>
<link rel="stylesheet" href="nf-tokens.css">
<script src="../engine/baths.js"></script>
<script src="../engine/ivory.js"></script>
<script src="../engine/ohlib.js"></script>
<script src="../engine/ohemail.js"></script>
<script src="../engine/carousel.js"></script>
<script src="../engine/factrepeat.js"></script>
<script src="../engine/socialset.js"></script>
<script src="nf-social.js"></script>
<!-- Night Fade's Just Listed and Just Sold social sets (owner 11/18/2026). The shared engine (templates/_shared/socialset.js) loads the
     fonts and the data and runs the checks; the layouts are Night Fade's own (nf-social.js): the brand dark as the field, the house
     dissolving into it, JUST / LISTED stacked in Archivo 800 caps, the street on the solid accent bar, the accent title band for
     Just Sold. The colors come from the agent's brand kit exactly as the set's print pieces read them (NF.colors / NF.brand in nf.js). -->
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
SocialSet.portrait = NFSocial.portrait; SocialSet.landscape = NFSocial.landscape; SocialSet.slide = NFSocial.slide;
const NFStart = () => SocialSet.start(D => {
  const b = D.brand || {}, c = b.colors || {}, r = document.documentElement.style, set = (n, v) => r.setProperty(n, v);
  const rgb = h => { h = String(h||'').replace('#',''); if(h.length===3) h = h.split('').map(x=>x+x).join(''); const n = parseInt(h,16); return [n>>16&255, n>>8&255, n&255]; };
  const lum = h => { const v = rgb(h).map(q => { q/=255; return q <= .03928 ? q/12.92 : Math.pow((q+.055)/1.055, 2.4); }); return .2126*v[0] + .7152*v[1] + .0722*v[2]; };
  const con = (a, x) => { const p = lum(a), q = lum(x); return (Math.max(p,q)+.05)/(Math.min(p,q)+.05); };
  const on = bg => con(bg, '#ffffff') >= con(bg, '#161616') ? '#ffffff' : '#161616';
  const readable = (fg, bg, min) => con(fg, bg) >= (min || 3) ? fg : on(bg);
  const mix = (a, x, t) => { const p = rgb(a), q = rgb(x); return '#' + p.map((v, i) => Math.round(v + (q[i] - v)*t).toString(16).padStart(2, '0')).join(''); };
  // as NF.colors / NF.brand: the kit's dark is the field, its accent the bar, the eyebrow and the marks (kept only where it reads on the dark)
  const main = c.main || b.accent || '#2f4a3a', dark = c.dark || b.ink || '#1c1c1c', accent = c.accent || b.accent2 || main, o = on(dark), light = o === '#ffffff';
  set('--nf-dark', dark); set('--nf-main', main); set('--nf-night-rgb', rgb(light ? mix(dark, '#1d3a6e', .38) : dark).join(','));
  set('--nf-on', o); set('--nf-accent', readable(accent, dark)); set('--nf-soft', mix(o, dark, .16)); set('--nf-lift', mix(dark, o, .085));
  set('--nf-rule', light ? 'rgba(255,255,255,.42)' : 'rgba(0,0,0,.4)'); set('--nf-bar', accent); set('--nf-on-bar', on(accent));
  window.NFTone = light ? 'dark' : 'light';
});
// the note's and the bar's weights (500, 700) are loaded before the layouts measure with them; the engine loads the rest
Promise.all(['500', '700'].map(wt => document.fonts.load(wt + " 12px 'Archivo'").catch(() => 0))).then(NFStart);
</script>
</body>
</html>
