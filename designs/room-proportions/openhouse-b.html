<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · Room Proportions open house flyer · Calendar Block</title>
<link rel="stylesheet" href="rp.css">
<script src="rp.js"></script>
<script src="plan.js"></script>
<script src="../engine/ivory.js"></script>
<!--
  Room Proportions · Open House flyer b "Calendar Block" (trim 612 x 792 pt). Event-led: a solid calendar block (the big day number) beside the whole-house photo, with the event box under the address (what's served and the notes, 12 pt, white with a thin accent border (refreshments and notes stand out, owner 10/30); owner 10/30, Ivory.eventBox, openHouse.box.w resizes it), then three large room photos cut to their rooms' shapes.
  Open House rules: the label 20 pt or larger, the date the largest type, the time 18 pt or larger, city, state and ZIP under the
  street, no RSVP, no QR, no price, one brokerage logo (the contact card's). Photos that show a room carry its real size, and
  their frames follow the room's shape. Copy fills from the writer's master sentences (data.companion.oh).
-->
<style>
  .oh-label{font:700 22pt/26pt var(--font-body);letter-spacing:3pt;text-transform:uppercase;white-space:nowrap;overflow:hidden}
  .oh-date{font-family:var(--font-display);font-weight:500;white-space:nowrap;overflow:hidden}
  .oh-time{font:700 24pt/30pt var(--font-body);white-space:nowrap;overflow:hidden}
  .addr{font-family:var(--font-display);font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;letter-spacing:-.5pt}
  .oh-time2{font:700 19pt/24pt var(--font-body)}
  .evb{font:600 12pt/16pt var(--font-body);color:var(--ink);text-align:left}
  .evb.b{font-weight:700}
  .factline{font:600 12pt/16pt var(--font-body);color:var(--ink);white-space:nowrap;overflow:hidden}

</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
RP.whenFonts(function(){
  const PS = a => String(a || '').replace(/\s+Street(?=\s*(,|$|\s+(Unit|Apt|#|Suite)\b))/i, '').trim();   // print address rule (The owner 10/30): no "Street"
  const D = RP.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="color:#fff;padding:20pt">No data injected.</p>'; return; }
  const esc = RP.esc, b = D.brand || {}, L = D.listing, C = D.companion || {}, R = (D.copy || {}).rp || {};
  document.body.dataset.mode = D.mode || 'email';
  RP.applyBrand(b);
  const O = RP.openHouse(D), byId = RP.byId(D), planIssues = [];
  const inset = ((D.mode || 'email') === 'print' && D.piece.print === 'margin') ? (D.piece.margin || 18) : 0;
  const ids = ((C.oh || {}).photos || []).filter(id => RP.src(D, id)), hero = ids[0];
  const ph = (id, x, y, w, h) => RP.pframe(D, id, `left:${x}pt;top:${y}pt;width:${w}pt;height:${h}pt`);
  const ratio = id => RP.frameRatio(byId[id] || {});
  const blurb = ((C.oh || {}).master || []);
  let h = '';

  const PX = 36, PY = 36, PW = 200;
  // the right column: the whole-house photo, address, facts, then the event box; the calendar block runs down to the box's bottom
  const HH = 176, EY = 290;
  const evb = Ivory.eventBox([[O.note, 'oh.note', 'evb b'], [O.refreshments, 'oh.refreshments', 'evb']], 252, EY, 324, 16, 3,
    {bg: '#fff', line: 'var(--accent)', lineW: 1, padX: 12, padY: 9, scale: ((D.openHouse || {}).box || {}).w});
  const PHH = Math.max(296, EY - PY + evb.h);
  const tN = RP.linesNeeded('oh-time2', O.time, PW - 36, 24);
  const tParts = tN > 1 && / to /.test(O.time) ? O.time.split(' to ') : [O.time];   // a long time breaks at "to": two even lines
  // the calendar block's text sits vertically centered in the block (The owner 10/30): the content runs label top to time bottom
  const OY = PY + (PHH - (246 + tParts.length*24 - 22))/2 - 22;
  h += `<div class="abs" style="left:${PX}pt;top:${PY}pt;width:${PW}pt;height:${PHH}pt;background:var(--accent)"></div>`;
  h += `<div class="abs oh-label" style="left:${PX + 18}pt;top:${OY + 18}pt;width:${PW - 24}pt;height:52pt;font-size:20pt;line-height:24pt;letter-spacing:.6pt;white-space:normal;color:var(--paper)" data-slot="oh.label" data-lines="2">${esc(O.label)}</div>`;
  h += `<div class="abs oh-time" style="left:${PX + 18}pt;top:${OY + 74}pt;width:${PW - 30}pt;height:22pt;font-size:15pt;line-height:22pt;letter-spacing:2pt;text-transform:uppercase;color:var(--gold)" data-slot="oh.weekday" data-lines="1">${esc(O.weekday)}</div>`;
  h += `<div class="abs oh-date" style="left:${PX + 14}pt;top:${OY + 90}pt;width:${PW - 24}pt;height:100pt;font-size:92pt;line-height:100pt;color:var(--paper)" data-slot="oh.day" data-lines="1">${esc(O.day)}</div>`;
  h += `<div class="abs oh-date" style="left:${PX + 18}pt;top:${OY + 196}pt;width:${PW - 30}pt;height:32pt;font-size:26pt;line-height:32pt;color:var(--paper)" data-slot="oh.month" data-lines="1">${esc(O.month)}</div>`;
  h += `<div class="abs" style="left:${PX + 18}pt;top:${OY + 238}pt;width:${PW - 36}pt;height:.8pt;background:var(--paper);opacity:.5"></div>`;
  h += `<div class="abs oh-time2" style="left:${PX + 18}pt;top:${OY + 250}pt;width:${PW - 36}pt;height:${tParts.length*24 + 2}pt;white-space:nowrap;color:var(--paper)" data-slot="oh.time" data-lines="${tParts.length}">${tParts.map(esc).join(' to<br>')}</div>`;
  h += ph(hero, 252, 36, 324, HH);
  h += `<div class="abs addr" style="left:251pt;top:${36 + HH + 8}pt;width:325pt;height:30pt;font-size:25pt;line-height:30pt" data-slot="address" data-lines="1">${esc(PS(L.address))}</div>`;
  h += `<div class="abs place" style="left:252pt;top:${36 + HH + 42}pt;width:325pt;height:9pt" data-slot="place" data-lines="1" data-fine="1">${esc(RP.placeZip(L))}</div>`;
  h += `<div class="abs factline" style="left:252pt;top:${36 + HH + 56}pt;width:325pt;height:16pt;font-size:11pt" data-slot="oh.facts" data-lines="1">${esc(RP.factsShort(L))}</div>`;
  h += evb.html;
  const RY = EY + evb.h + 10, rowY = Math.max(PY + PHH, RY) + 14;
  h += `<div class="rule" style="left:36pt;width:540pt;top:${rowY - 12}pt;background:var(--accent);opacity:.6"></div>`;
  // the photo row fills its space (owner 10/30): wide room shots, up to four, each a little skinnier; tighter shots, fewer, stretched
  // wider and taller to take the room
  const gap = 14, HM = rowY > 370 ? 138 : 150, cand = ids.slice(1, 5);
  let rooms3 = cand.slice(0, Math.min(3, cand.length)), RH = HM, stretch = 1;
  for(let n = Math.min(4, cand.length); n >= 2; n--){
    const sub = cand.slice(0, n), sr = sub.reduce((a, id) => a + ratio(id), 0), full = (540 - gap*(n - 1)) / sr, rh = Math.min(HM, full), st = Math.max(1, full / rh);
    if(rh >= 0.78*HM && st <= 1.3){ rooms3 = sub; RH = rh; stretch = st; break; }
  }
  if(stretch === 1 && RH === HM){ const sr = rooms3.reduce((a, id) => a + ratio(id), 0), full = (540 - gap*(rooms3.length - 1)) / sr; if(full > RH) stretch = Math.min(1.3, full / RH); else RH = full; }
  const rw = rooms3.map(id => ratio(id)*RH*stretch), extra = (540 - rw.reduce((a, c) => a + c, 0)) / Math.max(1, rooms3.length - 1);
  const N = RP.bestN(rooms3.map((id, i) => ({s: RP.T(D, id).s, w: rw[i]})), 4);
  let x = 36;
  const rowP = rowY + (HM - RH)/2;   // a shorter row sits centered in its band
  rooms3.forEach((id, i) => { h += ph(id, x, rowP, rw[i], RH) + RP.capAbs(D, id, x, rowP + RH + 6, rw[i], N, {byId}); x += rw[i] + extra; });
  const by = rowY + HM + 6 + RP.capH(N) + 14;   // the write-up keeps its place when the row runs a little shorter
  h += RP.sentBox('oh.blurb', 36, by, 540, 4, 14.4, 10.5, blurb);
  h += RP.card(D, {x: 36, y: 664, w: 540, h: 92});

  h += `<div class="abs" style="left:36pt;top:764pt;width:540pt;font-size:6pt;line-height:8pt;height:8pt;white-space:nowrap;color:var(--muted)" data-slot="fineprint" data-lines="1" data-fine="1">${esc(C.fineprint || '')}</div>`;
  const f = RP.frame(D, 612, 792, h);
  document.getElementById('pages').innerHTML = f.html;
  RP.shapeLogos();
  window.pieceSize = {W: f.W, H: f.H, bleed: f.bleed};
  ContactCard.fit(document);
  RP.fillAll();
  window.brochureCheck = () => RP.check(planIssues.concat(RP.emptyChecks(), window.RPPlan ? RPPlan.check() : []));
  // frames settle once the photos have loaded (the renderer waits for this promise)
  return Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; }))).then(() => { RP.fitFrames(); ContactCard.fit(document); });
});
</script>
</body>
</html>
