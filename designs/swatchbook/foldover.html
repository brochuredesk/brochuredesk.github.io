<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · Swatchbook fold-over</title>
<link rel="stylesheet" href="swatchbook.css">
<script src="swatchbook.js"></script>
<script>window.Ivory = {esc: s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))};</script>
<script src="plan.js"></script>
<script src="../engine/agentcard.js"></script>
<!--
  BrochureDesk · Swatchbook · 11 x 17 fold-over
  11 x 17 sheet folded once down the middle: four upright 8.5 x 11 panels, 0.125 in (9 pt) bleed, 0.25 in safe zone.
    outside spread: back (left) + cover (right)        inside spread: front rooms (left) + bedrooms and baths (right)
  The agent's brand color (brand.accent) fills every page solid: the cover, the back and the inside spread (owner, 10/29/2026).
  The back's contact card sits straight on the navy in light type (CSS variables set in swatchbook.css under .panel.backside).
  Floor plan: the agent's plan placed as given (IvoryPlan, templates/swatchbook/plan.js), turned on its side when that prints larger.
  Copy comes as a lead plus whole sentences (data.sw.*); swatchbook.js picks the sentences that fill each box.

  Modes (data.mode):
    proof  four panel pages, 8.75 x 11.25 in each (trim + bleed)
    print  two spreads, 17.25 x 11.25 in, each half clipped at the fold
-->
<style>
  .cover .ph.hero{flex:1 1 0}
</style>
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>

<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML='<p style="color:#fff;padding:20pt">No data injected.</p>'; return; }
  const mode = D.mode || 'proof';
  const esc = SW.esc, L = D.listing, A = D.agent || {}, b = D.brand || {}, K = D.sw || {};
  const issues = [];
  if(b.accent) document.documentElement.style.setProperty('--navy', b.accent);
  const nav = getComputedStyle(document.documentElement).getPropertyValue('--navy').trim();
  document.documentElement.style.setProperty('--cc-accent', nav);
  document.documentElement.style.setProperty('--cc-ink', nav);
  await Promise.all(['400 10pt Manrope','500 10pt Manrope','600 10pt Manrope','700 10pt Manrope','400 10pt "Source Sans 3"','600 10pt "Source Sans 3"','700 10pt "Source Sans 3"'].map(f => document.fonts.load(f)));

  const hsSrc = A.headshot && ((D.photos||{})[A.headshot] ? D.photos[A.headshot].src : A.headshot) || '';
  const LH = 12.5, CAPPAD = 5;
  const capH = lines => CAPPAD + lines*LH;
  // caption: bold lead + whole sentences (the fill pass picks which)
  const cap = (c, slot, lines, cls) => {
    c = c || {};
    const s = [].concat(c.s || c.a || []);
    const lh = /\bbig\b/.test(cls||'') ? 13.5 : LH;
    return `<div class="cap ${cls||''}" style="height:${CAPPAD + lines*lh}pt"><div class="a" data-slot="${slot}" data-lh="${lh}" data-lines="${lines}" data-s='${esc(JSON.stringify(s)).replace(/'/g,'&#39;')}' data-lead="${esc(c.lead||'')}" style="height:${lines*lh}pt"></div></div>`;
  };
  const item = (c, slot, lines, grow, cls) => `<div class="item" style="flex:${grow||1} 1 0">${SW.photo(D, c.photo, '', slot)}${cap(c, slot, lines, cls)}</div>`;
  const para = (c, slot, lines, cls, style) => `<div class="${cls}" style="height:${lines*parseFloat(cls==='intro'?14.5:LH)}pt;${style||''}" data-slot="${slot}" data-lines="${lines}" data-s='${esc(JSON.stringify([].concat(c))).replace(/'/g,'&#39;')}'></div>`;
  const logo = (cls, src, area, maxh) => `<div class="logo ${cls}" data-area="${area}" data-maxh="${maxh}">${src ? `<img src="${esc(src)}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage||'')}</span>`}</div>`;

  // ================= COVER =================
  function cover(){
    const F = K.front || {}, cc = '';   // solid navy is the only cover (owner 10/29)
    const stats = SW.stats(L);
    let h = `<div class="cover-frame"></div>
      <div class="cover">
        <div class="kicker loc" data-slot="front.location" data-lines="1">${esc(F.location)}</div>
        <div class="street" data-slot="front.address" data-lines="1">${esc(L.address)}</div>
        <div class="sum" data-slot="front.summary" data-lines="2" data-s='${esc(JSON.stringify([].concat(F.summary))).replace(/'/g,'&#39;')}'></div>
        <div class="stats" data-slot="front.stats" data-lines="1">${stats.map(s=>`<div>${esc(s)}</div>`).join('')}</div>
      </div>`;
    if(F.layout === 'tall'){
      h += `<div class="flow" style="left:18pt;right:18pt;top:176pt;bottom:24pt;gap:0"><div class="row" style="flex:1 1 0;gap:18pt">
          <div class="item" style="flex:352 1 0">${SW.photo(D, F.hero, '', 'front.hero')}${cap(F.heroCap, 'front.hero', 2, cc)}</div>
          <div class="col" style="flex:206 1 0;gap:18pt">${F.side.map((c,i)=>item(c, 'front.side'+i, 5, 1, cc)).join('')}</div>
        </div></div>`;
    } else {
      h += `<div class="flow" style="left:18pt;right:18pt;top:176pt;bottom:24pt;gap:18pt">
          <div class="item" style="flex:380 1 0">${SW.photo(D, F.hero, '', 'front.hero')}</div>
          <div class="row" style="flex:200 1 0;gap:18pt">${F.row.map((c,i)=>item(c, 'front.photo'+i, 5, 1, cc)).join('')}</div>
        </div>`;
    }
    return h;
  }

  // ================= BACK: OUTSIDE (paper) =================
  function back(){
    const B = K.back || {}, hasPlan = !!D.plan;
    const T = hasPlan ? B.plan : B.noplan;
    let h = `<div class="bg-navy"></div>
      <div class="kicker abs" style="left:var(--m);top:34pt;width:420pt" data-slot="back.kicker" data-lines="1">${esc(T.kicker)}</div>
      <div class="title abs" style="left:var(--m);top:50pt;width:554pt" data-slot="back.title" data-lines="1">${esc(T.title)}</div>`;
    let flowTop;
    if(hasPlan){
      const planTop = B.planTop || 92, Hp = B.planH || 232;
      const r = IvoryPlan.draw(D.plan, {x:41, y:planTop + 8, w:530, h:Hp - 4}, {allowRotate:true});
      window.planIssues = r.issues;
      const ly0 = planTop + Hp + 4;
      h += `<div class="abs planbg" style="left:29pt;top:${planTop}pt;width:554pt;height:${ly0 + 11 + 9 - planTop}pt;background:#fff"></div><div class="abs planwrap" style="left:0;top:0;width:612pt;height:792pt;--paper:#fff">${r.html}</div>`;
      const zs = IvoryPlan.zonesOf(D.plan);
      const leg = Object.entries(IvoryPlan.ZONES).filter(([k])=>zs.includes(k))
        .map(([k,z])=>`<span><i style="background:color-mix(in srgb, ${z.fill} ${Math.round(z.op*100)}%, var(--paper))"></i>${z.label}</span>`);
      if(zs.includes('outdoor')) leg.push(`<span><i style="background:repeating-linear-gradient(45deg, color-mix(in srgb, var(--accent) 35%, var(--paper)) 0 .6pt, var(--paper) .6pt 2.8pt)"></i>Outdoor</span>`);
      const note = (D.plan.source || 'The listing floor plan, placed as given.') + ' Sizes are approximate.' + ((r.angle === 90 || r.angle === 270) ? ' Turned on its side.' : '');
      const ly = ly0;
      h += `<div class="abs planwrap" style="left:0;top:0;width:612pt;height:792pt;--paper:#fff"><div class="plan-legend" style="left:41pt;top:${ly}pt">${leg.join('')}</div>
            <div class="plan-disclosure" style="left:290pt;width:281pt;top:${ly+1}pt" data-slot="back.plannote" data-lines="1" data-fine="1">${esc(note)}</div></div>`;
      flowTop = ly + 11 + 9 + 12;
    } else flowTop = 90;
    const near = (B.nearby || []).slice(0, 3);
    const compact = hasPlan && (B.planH || 0) >= 260;   // tall plans leave less room: the nearby row shrinks so the photos keep their height
    const nearHTML = `<div class="near${compact ? ' compact' : ''}" style="margin-top:${compact ? 4 : 14}pt">${near.map((x,i)=>`<div class="c"><div class="d" data-slot="back.near${i}.dist" data-lines="1">${esc(x.dist)}</div><div class="p" data-slot="back.near${i}.place" data-lines="1">${esc(x.place)}</div></div>`).join('')}</div>`;
    let body;
    const P = (hasPlan ? B.photos : (B.photosNoplan || B.photos)) || [];
    if(hasPlan){
      body = `<div class="row" style="flex:1 1 0;gap:14pt">${P.slice(0,2).map((c,i)=>item(c, 'back.photo'+i, B.planLines || 3, 1, 'big')).join('')}</div>`;
    } else if(B.floors){
      body = `<div class="floors" style="flex:none;height:${34 + B.floors.length*44}pt"><div class="fk">Floor by floor</div>${B.floors.map((f,i)=>`<div class="fr"><div class="fn" data-slot="back.floor${i}.name" data-lines="1">${esc(f.n)}</div><div class="ft" data-slot="back.floor${i}" data-lines="${f.lines||2}" data-s='${esc(JSON.stringify(f.s)).replace(/'/g,'&#39;')}' style="height:${(f.lines||2)*13.5}pt"></div></div>`).join('')}</div>
        <div class="row" style="flex:1 1 0;gap:14pt">${P.slice(0,2).map((c,i)=>item(c, 'back.photo'+i, 3, 1, 'big')).join('')}</div>`;
    } else {
      body = `<div class="item" style="flex:1.25 1 0">${SW.photo(D, P[0].photo, '', 'back.photo0')}${cap(P[0], 'back.photo0', 2, 'big')}</div>
        <div class="row" style="flex:1 1 0;gap:14pt">${P.slice(1,3).map((c,i)=>item(c, 'back.photo'+(i+1), 3, 1, 'big')).join('')}</div>`;
    }
    h += `<div class="flow onnavy" style="top:${flowTop}pt;bottom:${792-626}pt;gap:12pt">${body}${nearHTML}</div>`;
    const fine = 'Information deemed reliable but not guaranteed; buyer to verify.';
    h += ContactCard.html([29, 642, 554, 132], Object.assign({}, A, {headshot: hsSrc}), Object.assign({}, b, {logo: b.logoOnDark || b.logo}), {layout:'panel', fine, bottomGap: 0.5, fieldAccent: true});
    return h;
  }

  // ================= INSIDE LEFT =================
  function left(){
    const I = K.left || {};
    const box = I.box;
    const rows = I.photos;   // [big, a, b]
    return `<div class="bg-navy"></div>
      <div class="kicker hd-kick" data-slot="left.kicker" data-lines="1">${esc(I.kicker)}</div>
      <div class="title hd-title" data-slot="left.title" data-lines="1">${esc(I.title)}</div>
      ${para(I.intro, 'left.intro', 2, 'intro', 'position:absolute;left:var(--m);top:98pt;width:554pt')}
      <div class="flow" style="top:144pt;bottom:26pt;gap:14pt">
        <div class="item" style="flex:${205+capH(2)} 1 0">${SW.photo(D, rows[0].photo, '', 'left.photo0')}${cap(rows[0], 'left.photo0', 2)}</div>
        <div class="row" style="flex:${134+capH(3)} 1 0">${rows.slice(1,3).map((c,i)=>item(c, 'left.photo'+(i+1), 3, 1)).join('')}</div>
        <div class="wbox" style="flex:none;height:150pt">
          <div class="wh"><div class="k" data-slot="left.box.kicker" data-lines="1">${esc(box.kicker)}</div><div class="h" data-slot="left.box.heading" data-lines="3">${esc(box.heading)}</div></div>
          <div class="wi">${box.items.map((it,i)=>`<div><div class="l" data-slot="left.box.l${i}" data-lines="1">${esc(it.l)}</div><div class="t" data-slot="left.box.t${i}" data-lines="2" style="height:26.4pt" data-s='${esc(JSON.stringify(it.s)).replace(/'/g,'&#39;')}'></div></div>`).join('')}</div>
        </div>
      </div>`;
  }

  // ================= INSIDE RIGHT =================
  function right(){
    const R = K.right || {};
    const rows = R.rows, lines = [5, 4, 5], hts = [150, 120, 123];
    let k = 0;
    const body = rows.map((r, ri) => {
      const ln = (R.lines && R.lines[ri]) || (ri === 0 ? 4 : r.length >= 3 ? 4 : 3);
      const w = r.length === 2 && ri === 0 ? [5.3, 3.2] : r.map(() => 1);
      return `<div class="row" style="flex:${(hts[ri]||130)+capH(ln)} 1 0">${r.map((c,i)=>item(c, 'right.photo'+(k++), ln, w[i])).join('')}</div>`;
    }).join('');
    return `<div class="bg-navy"></div>
      ${logo('hd-logo', b.logoOnDark || b.logoKnockout || b.logo, 3400, 34)}
      <div class="kicker hd-kick" data-slot="right.kicker" data-lines="1">${esc(R.kicker)}</div>
      <div class="title hd-title" data-slot="right.title" data-lines="1">${esc(R.title)}</div>
      ${para(R.intro, 'right.intro', 2, 'intro', 'position:absolute;left:var(--m);top:98pt;width:554pt')}
      <div class="flow" style="top:144pt;bottom:26pt;gap:14pt">${body}</div>`;
  }

  // ---------- assemble ----------
  const panels = {front: cover(), back: back(), left: left(), right: right()};
  const panel = (cls, h) => `<div class="panel ${cls}">${h}</div>`;
  let html = '';
  if(mode === 'print'){
    html += `<div class="page" data-page="outside" style="width:1242pt;height:810pt"><div class="half l">${panel('backside', panels.back)}</div><div class="half r">${panel('cover', panels.front)}</div></div>`;
    html += `<div class="page" data-page="inside" style="width:1242pt;height:810pt"><div class="half l">${panel('', panels.left)}</div><div class="half r">${panel('', panels.right)}</div></div>`;
  } else {
    for(const id of ['front','back','left','right']) html += `<div class="page" data-page="${id}" style="width:630pt;height:810pt">${panel(id==='front'?'cover':id==='back'?'backside':'', panels[id])}</div>`;
  }
  document.getElementById('pages').innerHTML = html;
  document.querySelectorAll('.panel.cover').forEach(p => p.classList.add('cover'));
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));

  // the street fits its line: down from 40 pt only as far as it has to
  document.querySelectorAll('.cover .street').forEach(st => {
    let fs = 40; while(st.scrollWidth > st.clientWidth + 1 && fs > 30){ fs -= 1; st.style.fontSize = fs + 'pt'; }
  });
  SW.fill();
  SW.fitLogos();
  ContactCard.fit(document);
  issues.push(...SW.focus(D));
  window.brochureCheck = () => SW.check(D, (window.planIssues||[]).concat(issues));
  window.photoPlacements = SW.placements;
})();
</script>
</body>
</html>
