<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · Serif Headline postcards</title>
<link rel="stylesheet" href="sh.css">
<link rel="stylesheet" href="sh-fo.css">
<script src="sh.js"></script>
<script src="../engine/baths.js"></script>
<script src="../engine/agentcard.js"></script>
<script src="../engine/factrepeat.js"></script>
<script>window.Ivory = window.Ivory || {esc: s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))};</script>
<script src="sh-fo.js"></script>
<!--
  BrochureDesk · Serif Headline · Just Listed and Just Sold postcards (the hand of the approved Open House library flyer P38).
  data.piece.card = "listed" | "sold", data.piece.size = "6x11" (792 x 432 pt) | "6x9" (648 x 432 pt), data.piece.side = "front" | "back". Print adds 9 pt bleed.
  Fronts: Just Listed, the two-tone status stacked on the paper, the house inside the white margin standing across the floor; Just Sold,
  the floor turned to the right side of the card, the house standing across that seam, the words centered on the floor. Backs: the paper
  design side and the floor mail side, the floor running back across the whole foot under the one-row contact; mail zones are white markups.
-->
<style>
  /* Serif Headline postcards; tokens in sh-tokens.css. Font properties one by one. */
  .pc-wbox{display:flex;flex-direction:column;overflow:hidden}
  .pc-wbox.ruled{background:transparent;border-top:2pt solid var(--sh-main);border-bottom:2pt solid var(--sh-main)}
  .pc-wbox .k{font-family:var(--sh-font);font-weight:700;font-size:8.8pt;line-height:12pt;letter-spacing:3pt;text-transform:uppercase;color:var(--sh-main);white-space:nowrap;overflow:hidden;margin-bottom:3pt;align-self:flex-start}
  .pc-steps .it{display:flex;gap:10pt;align-items:flex-start;white-space:normal;overflow:hidden;border-top:.9pt solid rgba(22,22,22,.28);padding:2pt 0}
  .pc-steps .it:first-child{border-top:0}
  .pc-steps .stp{min-width:0}
  /* the step number in the sign-in sheet's ring */
  .pc-steps .bx{flex:none;width:17pt;height:17pt;border-radius:50%;border:1pt solid var(--sh-main);display:flex;align-items:center;justify-content:center;font-family:var(--sh-serif);font-weight:500;font-size:11pt;line-height:1;color:var(--sh-main)}
  .pc-call{font-family:var(--sh-serif);font-weight:500;font-size:13pt;line-height:16pt;color:var(--sh-main);white-space:nowrap;overflow:hidden}
  .pc-disc{position:absolute;font-family:var(--sh-font);font-size:6pt;line-height:10pt;color:var(--fx-soft);overflow:hidden;white-space:nowrap}
  .pc-ret{position:absolute;font-family:var(--sh-font);font-weight:500;font-size:9pt;line-height:11pt;letter-spacing:.2pt;color:var(--sh-on);overflow:hidden;height:34pt}
  .pc-ret b{font-weight:700;letter-spacing:1.4pt;text-transform:uppercase}
  .cap .a{font-weight:400}
  /* the back's compact contact row (owner 11/16): on the floor's foot band, email and web side by side */
  .pc-back .cc{background:transparent}
  .pc-back .cc .cc-lines{display:flex;column-gap:12pt}
  .pc-back .cc .cc-panel{flex-direction:row;align-items:center;column-gap:10pt}
  .pc-back .cc .cc-panel > div:last-child{text-align:left}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const esc = SW.esc, b = D.brand || {}, A = D.agent || {}, L = D.listing, P = D.piece || {};
  document.body.dataset.mode = D.mode || 'email';
  await SW.setup(D);
  const sold = P.card === 'sold', big = P.size === '6x11', front = P.side === 'front';
  const W = big ? 792 : 648, H = 432;
  const K = ((D.sw || {}).pc || {})[sold ? 'js' : 'jl'] || {};
  const hsSrc = A.headshot && ((D.photos||{})[A.headshot] ? D.photos[A.headshot].src : A.headshot) || '';
  const statusWord = sold ? 'Just Sold' : 'Just Listed';
  const issues = [];
  const logo = (cls, src, area, maxh, style) => `<div class="logo ${cls}" data-area="${area}" data-maxh="${maxh}" style="${style||''}">${src ? `<img src="${esc(src)}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage||'')}</span>`}</div>`;
  const CL = big ? 13.5 : 12.5, CF = big ? 'font-size:10.9pt;line-height:13.5pt;' : '';   // the 6x11 sets its type up from the 6x9 (11 pt against 9.5), not the same size with more room
  const cap = (c, slot, lines, extra, min) => (c = (c.photo ? FXS.augment(D, c) : c), `<div class="cap" style="height:${5 + lines*CL}pt;${extra||''}"><div class="a" data-min="${min || 2}" data-nopair="1" data-slot="${slot}" data-narrow="0" data-nstep="6" data-lh="${CL}" data-lines="${lines}" data-lead="${esc(c.lead||'')}" data-s='${esc(JSON.stringify([].concat(c.s||[]))).replace(/'/g,'&#39;')}' style="height:${lines*CL}pt;${CF}"></div></div>`);
  let h = '';

  if(front){
    const F = K.front || {};
    const draws = list => { const w = x => /gated|roof|pergola|deck|park|garage|island|stone|corner|pool/i.test([].concat(x)[0]) ? 0 : 1; return (list || []).map((x, i) => [w(x), i, x]).sort((p, q) => p[0] - q[0] || p[1] - q[1]).map(t => t[2]); };
    const capC = sold ? {lead: '', s: (F.note || {}).s || (F.cap || {}).s} : (F.caption ? {lead: F.caption.lead, s: F.caption.s.concat(draws((F.about || {}).s || []))} : {lead: 'Front.', s: draws((F.about || {}).s || (F.cap || {}).s)});
    const norm = x => String(x).toLowerCase().replace(/[^a-z0-9 ]/g, '').slice(0, 40), allAlts = list => [].concat(...(list || []).map(x => [].concat(x)));
    const backSet = new Set([].concat(allAlts(((K.back || {}).about || {}).s), ...((K.back || {}).photos || []).map(c => allAlts(c.s)), allAlts((K.back || {}).steps6), allAlts((K.back || {}).steps)).map(norm));
    const backAll = allAlts(((K.back || {}).about || {}).s).map(String);
    if(capC.s){ const kept = capC.s.filter(x => ![].concat(x).some(a => backSet.has(norm(a)))); if(kept.length >= 2) capC.s = kept; }
    if(capC.s && capC.s.length > 2){ const tail = capC.s.slice(1).filter(x => ![].concat(x).some(a => backAll.some(b => SW.sameFact(String(a), b)))); if(tail.length >= 1) capC.s = [capC.s[0]].concat(tail); }
    // ---- Serif Headline fronts: two cards in one hand.
    // Just Listed: the two-tone JUST / LISTED stacked on the paper as large as the column allows, the street in the ruled register, the
    // facts on rings; the house inside the white margin standing across the floor's top edge; on the floor, the highlights on white rings,
    // the agent's line and the logo. A wide house runs across the top instead, the words under it.
    // Just Sold: turned the other way: the floor is the right side of the card (a vertical seam), the house inside the white margin on the
    // left standing across it; on the floor, centered, JUST SOLD in white and gold (about twice the agent's name), the street, a gold rule,
    // the question, the note in the deepened ruled card sized to its text, the agent and the logo. No house features.
    const k = big ? 1.12 : 1, pid = FO.heroId(D, F.cap.photo), M = 18;
    const hood = FXS.hood(L), ad = String(L.address || ''), GARc = FO.GAR(500, '0');
    const tags = w => { const tg = [].concat(((K.front || {}).highlights || []), FXS.tagFacts(D).tags).filter(t => FXS.width(t, `font-family:Manrope;font-weight:500;font-size:${11*k}pt`) < w - 22*k).filter((t, i, arr) => !arr.slice(0, i).some(u => SW.sameFact(t, u))); const sc = t => (/\b(19|20)\d\d\b/.test(t) ? 4 : 0) + (/\d/.test(t) ? 1 : 0) + Math.min(t.length, 30)/30; return tg.map((t, i) => [sc(t), i, t]).sort((a, b) => b[0] - a[0] || a[1] - b[1]).map(x => x[2]); };
    // a highlight: a small white ring, the fact, a white hairline under it (on the floor)
    const hl = (t, i, x, y, w, rh) => `<div class="abs" style="left:${x}pt;top:${y + rh/2 - 3.5*k}pt;width:${7*k}pt;height:${7*k}pt;border-radius:50%;border:1.5pt solid var(--sh-gold)"></div><div class="abs" style="left:${x + 16*k}pt;top:${y}pt;width:${w - 16*k}pt;height:${rh}pt;font-weight:500;font-size:${11*k}pt;line-height:${rh}pt;font-family:var(--sh-font);color:var(--sh-on);white-space:nowrap;overflow:hidden" data-slot="front.hl.${i}" data-lines="1">${esc(t)}</div><div class="sh-hair" style="left:${x}pt;top:${y + rh - 1}pt;width:${w}pt"></div>`;
    const desT = A.designation ? (A.nar || /realtor/i.test(A.designation) ? 'REALTOR®' : A.designation) : '', DS = 8.6*k;
    const nameW = ns => FXS.width(A.name || '', `${GARc};font-size:${ns}pt`), phoneW = ns => FXS.width(A.phone || '', `font-family:Manrope;font-weight:600;font-size:${ns*0.7}pt`), desW = desT ? FXS.width(desT, `font-family:Manrope;font-weight:700;letter-spacing:2pt;font-size:${DS}pt`) + 9*k : 0;
    const nameSpan = ns => `<span style="font-weight:500;font-size:${ns}pt;line-height:${ns*1.2}pt;font-family:var(--sh-serif);color:var(--sh-on)" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</span>`;
    const desSpan = ns => `<span style="font-weight:700;font-size:${DS}pt;line-height:${ns*1.2}pt;font-family:var(--sh-font);letter-spacing:2pt;color:var(--sh-gold);margin-left:${9*k}pt" data-slot="agent.desig" data-lines="1">${esc(desT)}</span>`;
    const phoneSpan = (ns, ml) => `<span style="font-weight:600;font-size:${ns*0.7}pt;line-height:${ns*1.1}pt;font-family:var(--sh-font);color:var(--sh-on)${ml ? `;margin-left:${ml}pt` : ''}" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</span>`;
    // the agent on the floor: the name in EB Garamond over the phone and REALTOR(R), the one logo (white) at the far end, centered top to bottom
    const agentFoot = (x, y, w, hh) => { let ns = 17*k; const rowW = () => Math.max(nameW(ns), desW + phoneW(ns) + 4); while(ns > 12 && rowW() > w*0.6) ns -= 0.5; const bw = rowW(), lw = Math.min(124*k, w - bw - 18);
      return `<div class="abs" style="left:${x}pt;top:${y + (hh - ns*1.2 - ns*1.0)/2}pt;width:${bw + 6}pt;white-space:nowrap"><div style="line-height:${ns*1.2}pt">${nameSpan(ns)}</div><div style="line-height:${ns*1.0}pt">${phoneSpan(ns)}${desT ? desSpan(ns) : ''}</div></div>` + FXS.logo(D, x + w - lw, y + 2, lw, hh - 4, 'flex-end', true); };
    const photoAt = (x, y, w, hh) => `<div class="abs" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${hh}pt">${SW.photo(D, pid, 'position:absolute;inset:0', 'front.hero')}</div>`;
    const rings3 = (x, y, w, d, fs, cls) => { const fsx = HL.facts(L).filter(f => /bed|bath|area/.test(f[0])).slice(0, 3), cw = fsx.map(f => d + 6 + FXS.width(f[1], `font-family:Manrope;font-weight:600;font-size:${fs}pt`)), tot = cw.reduce((a, b) => a + b, 0), g = Math.max(10*k, Math.min(26*k, (w - tot)/Math.max(1, fsx.length - 1))); let xx = x + (w - tot - g*(fsx.length - 1))/2, out = '';
      fsx.forEach((f, i) => { out += HL.ring(f[0], xx + d/2, y + d/2, d) + `<div class="sh-fact" style="left:${xx + d + 6}pt;top:${y}pt;width:${cw[i] - d - 4}pt;height:${d}pt;font-size:${fs}pt;line-height:${d}pt" data-slot="front.facts${i}" data-lines="1">${esc(f[1])}</div>`; xx += cw[i] + g; });
      return out; };
    const cq = 'Thinking about selling?';
    const note = (x, y, w, n, lh, fs, pad) => `<div class="sh-card" id="notebox" data-pad="${pad}" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${n*lh + 2*pad}pt"></div><div class="abs cap"><div class="a" style="position:absolute;left:${x + 14*k}pt;top:${y + pad}pt;width:${w - 28*k}pt;height:${n*lh}pt;font-size:${fs}pt;line-height:${lh}pt;color:var(--sh-on-soft)" data-slot="front.note" data-lh="${lh}" data-lines="${n}" data-min="3" data-narrow="0" data-flexh="1" ${FXS.sd(capC.s || [])}></div></div>`;
    if(!sold){
      let PW = Math.round(W*0.5); while(PW < W*0.6 && !SW.fits(D, pid, PW, H - 2*M)) PW += 6;
      const side = SW.fits(D, pid, PW, H - 2*M);
      if(side){
        const PX = W - M - PW, TX = 26*k, TW = PX - 22*k - TX, parts = [];
        const S = HL.fit(statusWord, TW, 84*k, 40, 2, {pen: 0, lh: 0.98}); let y = 16 + (1.32 - 0.98)*S.f/2; parts.push(HL.hl(S, TX, y, TW, 'front.status')); y += S.h + 8*k;
        parts.push(HL.reg(ad, TX, y, TW, 'front.address', {serif: true, h: 30*k, fs: 18*k, min: 13})); y += 30*k + 12*k;
        parts.push(rings3(TX, y, TW, 22*k, 9.4*k)); y += 22*k;
        const FS = Math.round(Math.max(H*0.56, y + 18*k)); h += HL.floor(FS, {x1: W + 9, y1: H + 9}) + photoAt(PX, M, PW, H - 2*M);
        h += `<div class="abs" id="lock" data-bottom="${y}" data-foot="${FS - 6}" style="left:0;top:0;width:0;height:0">${parts.join('')}</div>`;
        // on the floor: the highlights, then the agent
        const ah = 34*k, fy0 = FS + 14*k, fy1 = H - M - ah - 10*k, rh = 21*k, nT = Math.max(2, Math.min(3, Math.floor((fy1 - fy0)/rh))), tg = tags(TW).slice(0, nT);
        let f = '', yy = fy0 + (fy1 - fy0 - tg.length*rh)/2; tg.forEach((t, i) => { f += hl(t, i, TX, yy, TW, rh); yy += rh; });
        f += agentFoot(TX, H - M - ah, TW, ah);
        h += `<div class="sh-fl">${f}</div>`;
      } else {
        // a wide house: across the top inside the margin; the floor from its lower part; the words under it in two columns on the floor
        const PH = Math.round(H*0.54); let PWw = W - 2*M; while(PWw > 300 && !SW.fits(D, pid, PWw, PH)) PWw -= 6;
        const FS = M + Math.round(PH*0.62), y0 = M + PH + 12*k, cW = Math.round((W - 2*M - 28*k)*0.5), cR = M + cW + 28*k, rW = W - M - cR;
        h += HL.floor(FS, {x1: W + 9, y1: H + 9}) + photoAt((W - PWw)/2, M, PWw, PH);
        let f = '';
        const S = HL.fit(statusWord, cW, 66*k, 28, 1, {lh: 1.0}), bh = S.h + 4 + 26*k, by = y0 + Math.max(0, (H - 26 - 32*k - 10 - y0 - bh)/2); f += HL.hl(S, M, by, cW, 'front.status', {align: 'left'});
        f += HL.reg(ad, M, by + S.h + 4, cW, 'front.address', {serif: true, h: 26*k, fs: 16*k, min: 12});
        f += agentFoot(M, H - 26 - 32*k, cW, 30*k);
        f += `<div class="sh-vhair" style="left:${cR - 14*k}pt;top:${y0 + 2}pt;height:${H - M - y0 - 2}pt"></div>`;
        let y = y0; f += rings3(cR, y, rW, 20*k, 9*k); y += 20*k + 8*k;
        const nT = Math.max(1, Math.min(3, Math.floor((H - M - y)/(19*k)))), tg = tags(rW).slice(0, nT), rh = Math.min(30*k, (H - M - y)/Math.max(1, tg.length)); tg.forEach((t, i) => { f += hl(t, i, cR, y, rW, rh); y += rh; });
        h += `<div class="sh-fl">${f}</div>`;
      }
    } else {
      let PW = Math.round(W*(big ? 0.5 : 0.46)); while(PW < W*0.56 && !SW.fits(D, pid, PW, H - 2*M)) PW += 6;   // the 6x11: the house wider, no empty floor beside it
      const side = SW.fits(D, pid, PW, H - 2*M);
      if(side){
        const SX = M + Math.round(PW*0.7), TX0 = M + PW + 22*k, TX1 = W - 24*k, TW = TX1 - TX0, parts = [];
        h += HL.floor(-9, {x0: SX, x1: W + 9, y1: H + 9}) + photoAt(M, M, PW, H - 2*M);
        // owner 11/17 (book 4 p49/p51): JUST SOLD and the street sit centered (on their letters) between the card's top and the question under them;
        // the note under the question is a bigger box: what the agent will do for a seller, as many full lines as the room to the agent allows
        const S = HL.fit(statusWord, TW, 62*k, 30, 1, {lh: 1.04}), ns = Math.min(S.f*0.5, 18*k), G = 12*k + 6 + (window.__jsFd || 0); let y = G;
        parts.push(HL.hl(S, TX0, y, TW, 'front.status')); y += S.h + 2 + (window.__jsFa || 0);
        const as = FXS.fitSize(ad, GARc, TW - 8, 21*k, 13); parts.push(`<div class="sh-ser" style="left:${TX0}pt;top:${y}pt;width:${TW}pt;height:${as*1.2}pt;font-size:${as}pt;line-height:${as*1.2}pt;text-align:center" data-slot="front.address" data-lines="1">${esc(ad)}</div>`); y += as*1.2 + 9*k - 3;
        parts.push(`<div class="sh-rule" style="left:${TX0 + TW/2 - 28}pt;top:${y}pt;width:56pt;height:1pt"></div>`); y += 9*k - 3;
        const cs2 = FXS.fitSize(cq, GARc, TW, 20*k, 13); parts.push(`<div class="sh-ser" style="left:${TX0}pt;top:${y}pt;width:${TW}pt;height:${cs2*1.2}pt;font-size:${cs2}pt;line-height:${cs2*1.2}pt;text-align:center;color:var(--sh-gold)" data-slot="front.cta" data-lines="1">${cq}</div>`); y += cs2*1.2 + 8*k;
        const fh = big ? 42*k : ns*1.2 + ns*1.0 + 6*k + 26*k, fy = big ? H - M - fh : H - 18*k - fh, lh = 14.2*k, n = Math.max(3, Math.min(11, Math.floor((fy - 12*k - y - 26)/lh)));
        parts.push(note(TX0, y, TW, n, lh, 10.5*k, 13).replace('id="notebox"', `id="notebox" data-center="${fy - 12*k}"`)); y += n*lh + 26;
        h += `<div class="sh-fl"><div class="abs" id="lock0" style="left:0;top:0;width:0;height:0">${parts.join('')}</div>`;
        if(big) h += agentFoot(TX0, fy, TW, fh) + `</div>`;   // the 6x11: the agent's lines and the logo share one row across the column
        else {
        h += `<div class="abs" style="left:${TX0}pt;top:${fy}pt;width:${TW}pt;text-align:center;white-space:nowrap"><div style="line-height:${ns*1.2}pt">${nameSpan(ns)}</div><div style="line-height:${ns*1.0}pt">${phoneSpan(ns)}${desT ? desSpan(ns) : ''}</div></div>`;
        h += FXS.logo(D, TX0, fy + ns*2.2 + 6*k, TW, 26*k, 'center', true) + `</div>`; }
      } else {
        const PH = Math.round(H*0.5); let PWw = W - 2*M; while(PWw > 300 && !SW.fits(D, pid, PWw, PH)) PWw -= 6;
        const FS = M + Math.round(PH*0.6), y0 = M + PH + 12*k, yB = H - M, cW = Math.round((W - 2*M - 28*k)*0.48), cR = M + cW + 28*k, rW = W - M - cR;
        h += HL.floor(FS, {x1: W + 9, y1: H + 9}) + photoAt((W - PWw)/2, M, PWw, PH);
        let f = '';
        // owner 11/17 (book 4 p49): under the house, JUST SOLD and the street centered (on their letters) between the house and the question,
        // the agent's row at the foot of that half; beside it the note in a bigger box running the full height of the floor under the house
        const as = FXS.fitSize(ad, GARc, cW, 18*k, 12), S = HL.fit(statusWord, cW, 52*k, 26, 1, {lh: 1.04}), cs2 = FXS.fitSize(cq, GARc, cW, 18*k, 12), PB = M + PH;
        let y = PB + 22*k + (window.__jsWd || 0); f += HL.hl(S, M, y, cW, 'front.status'); y += S.h + 2;
        f += `<div class="sh-ser" style="left:${M}pt;top:${y}pt;width:${cW}pt;height:${as*1.2}pt;font-size:${as}pt;line-height:${as*1.2}pt;text-align:center" data-slot="front.address" data-lines="1">${esc(ad)}</div>`; y += as*1.2 + 9*k - 3;
        f += `<div class="sh-rule" style="left:${M + cW/2 - 28}pt;top:${y}pt;width:56pt;height:1pt"></div>`; y += 9*k - 3;
        f += `<div class="sh-ser" style="left:${M}pt;top:${y}pt;width:${cW}pt;height:${cs2*1.2}pt;font-size:${cs2}pt;line-height:${cs2*1.2}pt;text-align:center;color:var(--sh-gold)" data-slot="front.cta" data-lines="1">${cq}</div>`; y += cs2*1.2;
        const ah = 28*k; f += agentFoot(M, Math.max(y + 8, yB - ah), cW, ah);
        f += `<div class="sh-vhair" style="left:${cR - 14*k}pt;top:${y0 + 2}pt;height:${yB - y0 - 2}pt"></div>`;
        const ny = y0, lh = 13*k, n = Math.max(3, Math.floor((yB - ny - 22)/lh));
        f += `<div class="abs" id="lock" data-bottom="${ny + n*lh + 22}" data-foot="${yB + 14}" data-flush="1" style="left:0;top:0;width:0;height:0">${note(cR, ny, rW, n, lh, 10*k, 11)}</div>`;
        h += `<div class="sh-fl">${f}</div>`;
      }
    }
  } else {
    // ---------------- BACK (owner 11/16/2026: the design runs the full width; the contact block is much shorter) ----------------
    // Serif Headline's own back. The card is split on its center line: the design side is the paper (the two-tone status, the street in the
