<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · Tasting Table postcards</title>
<link rel="stylesheet" href="tt.css">
<link rel="stylesheet" href="tt-fo.css">
<script src="tt.js"></script>
<script src="../engine/baths.js"></script>
<script src="../engine/agentcard.js"></script>
<script src="../engine/factrepeat.js"></script>
<script>window.Ivory = window.Ivory || {esc: s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))};</script>
<script src="tt-fo.js"></script>
<!--
  BrochureDesk · Tasting Table · Just Listed and Just Sold postcards (the hand of the approved Open House library flyer B01).
  data.piece.card = "listed" | "sold", data.piece.size = "6x11" (trim 792 x 432 pt) | "6x9" (648 x 432 pt), data.piece.side = "front" | "back".
  Print adds 0.125 in (9 pt) bleed. The agent's brand color (brand.accent) is the field on both sides; boxes are white.
  Front: the whole house (roof to steps) on the right with a one-line-or-two caption and a white box under it, the status stacked large on the left over the address,
  the fact rows and the brokerage logo (Just Listed) or the agent's name and number and the logo (Just Sold). No price, no QR.
  Back: status line, interior photos with captions, a white box (the write-up, or the steps), the standard contact card (templates/_shared/agentcard.js,
  band preset, which carries the back's one logo), the fine print. The right 289.5 pt (4.02 in) is the mail vendor's: return address, postage and address
  zones; drawn as guides on proofs and left clear in print.
  Copy comes from data.sw.pc.{jl|js}.{front|back} as a lead plus whole sentences; tt.js picks the sentences that fill each box.
-->
<style>
  /* the FX14 hand on a postcard: white frame, a taupe block, Pinyon Script status, white underlined labels, hairline white boxes; tokens in tt-tokens.css */
  .pc-col{position:absolute;display:flex;flex-direction:column}
  .pc-bstatus{position:absolute;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
  .pc-bstatus .st{font:700 10.5pt/1 var(--fx-font);letter-spacing:2.4pt;color:var(--fx-on);text-transform:uppercase}
  .pc-bstatus .ln{flex:1;height:1.2pt;background:var(--tt-accent);margin:0 12pt;min-width:16pt}
  .pc-bstatus .ad{font:500 16pt/1 var(--tt-serif);color:var(--fx-on);padding-bottom:3pt}
  .pc-steps .it{display:flex;gap:8pt;align-items:baseline;white-space:nowrap;overflow:hidden}
  .pc-steps .bx{width:4pt;height:4pt;transform:translateY(-1pt) rotate(45deg);background:var(--tt-accent);flex:none}
  .pc-call{font:500 13pt/16pt var(--tt-serif);color:var(--tt-accent);white-space:nowrap;overflow:hidden}
  .pc-disc{position:absolute;font-size:6pt;line-height:10pt;color:var(--fx-soft);overflow:hidden;white-space:nowrap}
  .pc-ret{position:absolute;font:500 9pt/11pt var(--fx-font);letter-spacing:.2pt;color:var(--fx-on);overflow:hidden;height:34pt}
  .pc-ret b{font-weight:700;letter-spacing:1.4pt;text-transform:uppercase;color:var(--fx-ink)}
  .cap .a{font-weight:400}
  /* Tasting Table: the Just Sold steps as the sign-in sheet's rows */
  .tt-steps{background:none!important;border:0!important}
  .tt-steps:after{display:none}
  .tt-steps .k{color:var(--tt-label)}
  .pc-steps .it{align-items:baseline!important;border-top:1.2pt dotted var(--tt-copper)}
  .pc-steps .it:first-child{border-top:0}
  .pc-steps .bx{width:16pt!important;height:auto!important;transform:none!important;background:none!important;margin-top:0!important;font-family:var(--tt-serif);font-weight:500;font-size:1.15em;line-height:1;text-align:center;color:var(--tt-on);border-bottom:1.3pt solid var(--tt-copper);padding-bottom:1.5pt}
  .pc-call{color:var(--tt-label)!important;font-family:var(--tt-serif)!important;font-weight:500}
  .tt-caps{position:absolute;font-family:var(--tt-font);font-weight:600;font-size:10pt;line-height:14pt;letter-spacing:1.8pt;text-transform:uppercase;color:var(--tt-label);white-space:nowrap;overflow:hidden}
  .pc-wbox{background:#fff;border:1.2pt solid var(--tt-edge);color:var(--fx-soft);padding:10pt 16pt 9pt;display:flex;flex-direction:column;overflow:hidden}
  .pc-wbox .k{font-family:var(--tt-font);font-weight:600;font-size:8.6pt;line-height:11pt;letter-spacing:3pt;text-transform:uppercase;color:var(--tt-label);white-space:nowrap;overflow:hidden;margin-bottom:3pt;align-self:flex-start}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const esc = SW.esc, b = D.brand || {}, A = D.agent || {}, L = D.listing, P = D.piece || {};
  document.body.dataset.mode = D.mode || 'email';
  await SW.setup(D);
  const sold = P.card === 'sold', big = P.size === '6x11', front = P.side === 'front';
  const W = big ? 792 : 648, H = 432;
  const K = ((D.sw || {}).pc || {})[sold ? 'js' : 'jl'] || {};
  const hsSrc = A.headshot && ((D.photos||{})[A.headshot] ? D.photos[A.headshot].src : A.headshot) || '';
  const statusWord = sold ? 'Just Sold' : 'Just Listed';
  const issues = [];
  const logo = (cls, src, area, maxh, style) => `<div class="logo ${cls}" data-area="${area}" data-maxh="${maxh}" style="${style||''}">${src ? `<img src="${esc(src)}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage||'')}</span>`}</div>`;
  const CL = big ? 13.5 : 12.5, CF = big ? 'font-size:10.9pt;line-height:13.5pt;' : '';   // the 6x11 sets its type up from the 6x9 (11 pt against 9.5), not the same size with more room
  const cap = (c, slot, lines, extra, min) => (c = (c.photo ? FXS.augment(D, c) : c), `<div class="cap" style="height:${5 + lines*CL}pt;${extra||''}"><div class="a" data-min="${min || 2}" data-nopair="1" data-slot="${slot}" data-narrow="0" data-nstep="6" data-lh="${CL}" data-lines="${lines}" data-lead="${esc(c.lead||'')}" data-s='${esc(JSON.stringify([].concat(c.s||[]))).replace(/'/g,'&#39;')}' style="height:${lines*CL}pt;${CF}"></div></div>`);
  let h = '';

  if(front){
    // The FX14 hand on a postcard front. A white frame top and side, the whole house in it, a taupe block around it with the status in Pinyon Script.
    // JL: "Just Listed" in script beside the house, the horizontal address, three facts; under the house the caption ("Front.", the draws) and the agent and logo along the foot.
    // JS: sells the agent: "Just Sold" in the same script lockup, the name and phone big on the left, the house on the right with the agent's own note, the logo.
    const F = K.front || {};
    const draws = list => { const w = x => /gated|roof|pergola|deck|park|garage|island|stone|corner|pool/i.test([].concat(x)[0]) ? 0 : 1; return (list || []).map((x, i) => [w(x), i, x]).sort((p, q) => p[0] - q[0] || p[1] - q[1]).map(t => t[2]); };
    const capC = sold ? {lead: '', s: (F.note || {}).s || (F.cap || {}).s} : (F.caption ? {lead: F.caption.lead, s: F.caption.s.concat(draws((F.about || {}).s || []))} : {lead: 'Front.', s: draws((F.about || {}).s || (F.cap || {}).s)});
    const norm = x => String(x).toLowerCase().replace(/[^a-z0-9 ]/g, '').slice(0, 40), allAlts = list => [].concat(...(list || []).map(x => [].concat(x)));
    const backSet = new Set([].concat(allAlts(((K.back || {}).about || {}).s), ...((K.back || {}).photos || []).map(c => allAlts(c.s)), allAlts((K.back || {}).steps6), allAlts((K.back || {}).steps)).map(norm));
    const backAll = allAlts(((K.back || {}).about || {}).s).map(String);   // the back's About box
    if(capC.s){ const kept = capC.s.filter(x => ![].concat(x).some(a => backSet.has(norm(a)))); if(kept.length >= 2) capC.s = kept; }
    // the caption's own first sentence stays; a later one that says a fact the back's About box says (the deck and pergola, in other words) drops out
    if(capC.s && capC.s.length > 2){ const tail = capC.s.slice(1).filter(x => ![].concat(x).some(a => backAll.some(b => SW.sameFact(String(a), b)))); if(tail.length >= 1) capC.s = [capC.s[0]].concat(tail); }
    const roomIds = [...new Set([].concat(((D.sw||{}).back||{}).photos||[], ((D.sw||{}).left||{}).photos||[]).map(c => c.photo))].filter(id => (D.photos||{})[id] && !(D.photos[id]||{}).fullHouse && id !== F.cap.photo).slice(0, 2);
    // ---- Tasting Table fronts, design pass 11/15 (the mailbox test). Two different cards. Just Listed: the house bleeds off three edges
    // and is the hero; JUST / LISTED stacked as large as the column allows, flush left with the street, the facts and three specific highlights
    // on small accent marks (no box); the agent and the one logo along the foot; the closed frame holds the words and never crosses the photo.
    // Just Sold: the house is a picture inside the closed frame; the words centered. A dusk glow runs where the field meets the photo. ----
    const k = big ? 1.12 : 1, FRI = 22, pid = FO.heroId(D, F.cap.photo);
    const word = sold ? 'Just Sold' : 'Just Listed', place = [FXS.hood(L), FXS.placeLine(L)].filter(Boolean).join('  ·  ').toUpperCase(), ad = String(L.address || '');
    const tenor = "font-family:Newsreader;letter-spacing:3pt", facts = FXS.statItems(L).filter(t => !/^Built/.test(t)).join('  ·  ').toUpperCase();
    // reversed caps never under 8.5 pt: a line that does not fit at its size gives up tracking before it gives up size
    const capsFit = (t, w, max, wt, tracks) => { for(const ls of tracks){ const fs = FXS.fitSize(t, `font-family:Instrument Sans;font-weight:${wt};letter-spacing:${ls}pt`, w, max, 8.5); if(FXS.width(t, `font-family:Instrument Sans;font-weight:${wt};letter-spacing:${ls}pt;font-size:${fs}pt`) <= w - 12) return {fs: Math.max(8.5, fs), ls}; } return {fs: 8.5, ls: tracks[tracks.length - 1]}; };
    const eyebrow = (x, y, w, al) => { const c = capsFit(place, w, 8.8*k, 600, [3, 2.2, 1.4, 0.8]); return `<div class="abs tt-eyebrow" style="left:${x}pt;top:${y}pt;width:${w}pt;font-size:${c.fs}pt;line-height:${12*k}pt;letter-spacing:${c.ls}pt${al ? ';text-align:' + al : ''}" data-slot="front.place" data-lines="1">${esc(place)}</div>`; };
    const factsLine = (x, y, w, al) => { let ft = facts, c = capsFit(ft, w, 11.5*k, 600, [1.6, 1.2, 0.7, 0.3]); if(FXS.width(ft, `font-family:Instrument Sans;font-weight:600;letter-spacing:${c.ls}pt;font-size:${c.fs}pt`) > w - 12){ ft = facts.replace(/\s+·\s+/g, ' · '); c = capsFit(ft, w, 10*k, 600, [1.2, 0.7, 0.3, 0, -0.2]); }   /* a narrow column: the facts close up before they shrink under 8.5 pt */ return `<div class="abs tt-caps" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${16*k}pt;font-size:${c.fs}pt;line-height:${16*k}pt;letter-spacing:${c.ls}pt${al ? ';text-align:' + al : ''}" data-slot="front.facts" data-lines="1">${esc(ft)}</div>`; };
    const status = (t, x, y, w, fs, slot, al) => `<div class="abs tt-label" style="left:${x}pt;top:${y}pt;width:${w + 4}pt;height:${fs*1.04}pt;font-size:${fs}pt;line-height:${fs*1.04}pt;letter-spacing:3pt;overflow:visible${al ? ';text-align:' + al : ''}" data-slot="${slot}" data-lines="1">${esc(t)}</div>`;
    const serif = (t, x, y, w, fs, slot, extra) => `<div class="abs tt-serif" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${fs*1.25}pt;font-size:${fs}pt;line-height:${fs*1.25}pt;${extra || ''}" data-slot="${slot}" data-lines="1">${esc(t)}</div>`;
    // the highlights: real selling facts, the specific ones first (a dated improvement beats a plain feature), one per line on a small accent mark
    const tags = w => { const tg = FXS.tagFacts(D).tags.filter(t => FXS.width(t, `font-family:Instrument Sans;font-weight:500;font-size:${11.5*k}pt`) < w - 16).filter((t, i, arr) => !arr.slice(0, i).some(u => SW.sameFact(t, u))); const sc = t => (/\b(19|20)\d\d\b/.test(t) ? 4 : 0) + (/\d/.test(t) ? 1 : 0) + Math.min(t.length, 30)/30; return tg.map((t, i) => [sc(t), i, t]).sort((a, b) => b[0] - a[0] || a[1] - b[1]).map(x => x[2]); };
    const hl = (t, i, x, y, w, rh) => `<div class="abs" style="left:${x}pt;top:${y + rh/2 - 2.5*k}pt;width:${5*k}pt;height:${5*k}pt;transform:rotate(45deg);background:var(--tt-accent)"></div><div class="abs" style="left:${x + 15*k}pt;top:${y}pt;width:${w - 15*k}pt;height:${rh}pt;font-weight:500;font-size:${11.5*k}pt;line-height:${rh}pt;font-family:var(--tt-font);color:var(--tt-on);white-space:nowrap;overflow:hidden" data-slot="front.hl.${i}" data-lines="1">${esc(t)}</div>`;
    const note = (x, y, w, n, lh, fs, pad) => { fs = fs || 10*k; pad = pad || 13; return `<div class="tt-lt"><div class="tt-wbox lt" id="notebox" data-pad="${pad}" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${n*lh + 2*pad}pt"></div><div class="abs cap"><div class="a" style="position:absolute;left:${x + 15}pt;top:${y + pad}pt;width:${w - 30}pt;height:${n*lh}pt;font-size:${fs}pt;line-height:${lh}pt;color:var(--fx-soft)" data-slot="front.note" data-lh="${lh}" data-lines="${n}" data-min="3" data-narrow="0" data-flexh="1" ${FXS.sd(capC.s || [])}></div></div></div>`; };   // the Just Sold note is the card's one light moment: B01's white card
    const nameW = ns => FXS.width(A.name || '', `font-family:Newsreader;letter-spacing:.8pt;font-size:${ns}pt`), phoneW = ns => FXS.width(A.phone || '', `font-family:Instrument Sans;font-weight:600;font-size:${ns*0.74}pt`);
    const desT = A.designation ? (A.nar || /realtor/i.test(A.designation) ? 'REALTOR®' : A.designation) : '', DS = 8.5*k, desW = desT ? FXS.width(desT, `font-family:Instrument Sans;font-weight:500;letter-spacing:2pt;font-size:${DS}pt`) + 9*k : 0, LOGO_MIN = 104*k;
    const nameSpan = ns => `<span style="font-weight:400;font-size:${ns}pt;line-height:${ns*1.25}pt;font-family:var(--tt-serif);letter-spacing:.8pt;color:var(--tt-on)" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</span>`;
    const desSpan = ns => `<span style="font-weight:500;font-size:${DS}pt;line-height:${ns*1.25}pt;font-family:var(--tt-font);letter-spacing:2pt;color:var(--tt-accent);margin-left:${9*k}pt" data-slot="agent.desig" data-lines="1">${esc(desT)}</span>`;
    const phoneSpan = (ns, ml) => `<span style="font-weight:600;font-size:${ns*0.74}pt;line-height:${ns*1.1}pt;font-family:var(--tt-font);color:var(--tt-on)${ml ? `;margin-left:${ml}pt` : ''}" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</span>`;
    // the agent and the one logo, tied together: beside each other on one row, or (a narrow column) the logo under the agent's line
    const footStacks = (w, ns) => w - Math.max(nameW(ns), phoneW(ns)) - 20*k < LOGO_MIN;
    const agentRow = (x, y, w, ns, hh, oneLine, under) => { const nw = nameW(ns), pw = phoneW(ns);
      let des = !!desT, bw = oneLine ? nw + desW + 16*k + pw : Math.max(nw + desW, pw); if(des && (under ? nw + desW + 14*k + pw > w : w - bw - 20*k < LOGO_MIN)){ des = false; bw = oneLine ? nw + 16*k + pw : Math.max(nw, pw); }
      if(under){ const th = ns*1.25, lh2 = hh - th - 7*k, lw2 = Math.min(w, nw + (des ? desW : 0) + 14*k + pw); return `<div class="abs" style="left:${x}pt;top:${y}pt;width:${w}pt;white-space:nowrap;line-height:${th}pt">${nameSpan(ns)}${des ? desSpan(ns) : ''}${phoneSpan(ns, 14*k)}</div>` + FXS.logo(D, x, y + th + 7*k, lw2, lh2, 'center'); }   // the logo sits centered under the agent's line: one block
      const th = oneLine ? ns*1.25 : ns*2.35, lx = x + bw + 20*k;
      return `<div class="abs" style="left:${x}pt;top:${y + (hh - th)/2}pt;width:${bw + 4}pt;white-space:nowrap">${oneLine ? `<div style="line-height:${ns*1.25}pt">${nameSpan(ns)}${des ? desSpan(ns) : ''}${phoneSpan(ns, 16*k)}</div>` : `<div style="line-height:${ns*1.25}pt">${nameSpan(ns)}${des ? desSpan(ns) : ''}</div><div style="line-height:${ns*1.1}pt">${phoneSpan(ns)}</div>`}</div>` + FXS.logo(D, lx, y, x + w - lx, hh, 'flex-end'); };
    const photoAt = (x, y, w, hh) => `<div class="abs" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${hh}pt">${SW.photo(D, pid, 'position:absolute;inset:0', 'front.hero')}</div>`;
    const cq = 'Thinking about selling?';
    // ---- Tasting Table fronts: two compositions in one hand (B13's band, the plated photo, Newsreader display, copper on the dark).
    // Just Listed: a paper card. The band across the top carries JUST / LISTED in white Newsreader as large as its column allows; the
    // whole house is plated on the right, crossing the band's foot; under the band on the paper the street, the facts as one copper-
    // ruled line, two or three dated or specific highlights on copper squares, the agent and the one logo along the foot.
    // Just Sold: the house bleeds off the left edge, full height; the band holds the right column's head: JUST SOLD (about twice the
    // agent's name) with the street right under it; on the paper the seller question in Newsreader italic, the agent's note on B13's
    // white card with the thin main-color edge (sized to its text), the agent and the logo. No house features. ----
    const M = 24, PB = 6;
    const plateAt = (x, y, w, hh) => `<div class="tt-plate" style="left:${x - PB}pt;top:${y - PB}pt;width:${w + 2*PB}pt;height:${hh + 2*PB}pt"></div>` + photoAt(x, y, w, hh);
    const dk = s => `<div class="tt-dk">${s}</div>`;
    const display = (t, x, y, w, fs, slot, extra) => `<div class="abs tt-label" style="left:${x - fs*0.04}pt;top:${y}pt;width:${w + 6}pt;height:${fs*1.02}pt;font-size:${fs}pt;line-height:${fs*1.02}pt;letter-spacing:-.4pt;overflow:visible;${extra || ''}" data-slot="${slot}" data-lines="1">${esc(t)}</div>`;
    const NEWS = 'font-family:Newsreader;font-weight:500;letter-spacing:-.4pt';
    const hlT = (t, i, x, y, w, rh) => `<div class="abs" style="left:${x}pt;top:${y + rh/2 - 2.5*k}pt;width:${5*k}pt;height:${5*k}pt;border-radius:1pt;background:var(--tt-copper)"></div><div class="abs" style="left:${x + 14*k}pt;top:${y}pt;width:${w - 14*k}pt;height:${rh}pt;font-weight:500;font-size:${11.5*k}pt;line-height:${rh}pt;font-family:var(--tt-font);color:var(--tt-on);white-space:nowrap;overflow:hidden" data-slot="front.hl.${i}" data-lines="1">${esc(t)}</div>` + (i ? `<div class="tt-dots" style="left:${x}pt;top:${y}pt;width:${w}pt"></div>` : '');
    if(!sold){
      let PW = Math.round(W*0.47); const PH0 = H - 2*28; while(PW < W*0.6 && !SW.fits(D, pid, PW, PH0)) PW += 6;
      if(SW.fits(D, pid, PW, PH0)){
        const PX = W - M - PW, TX0 = 30, TW = PX - 26 - TX0, ls = Math.min(FXS.fitSize('Listed', NEWS, TW - 4, 80, 40), 80), BH = 46*k + 2*ls*0.98 + 16;
        let t = eyebrow(TX0, 28*k, TW) + display('Just', TX0, 44*k, TW, ls, 'front.status') + display('Listed', TX0, 44*k + ls*0.98, TW, ls, 'front.status2');
        h += `<div class="tt-band" style="left:-9pt;top:-9pt;width:${W + 18}pt;height:${BH + 9}pt"></div>` + dk(t) + plateAt(PX, 28, PW, PH0);
        const nsF = 17*k, under = footStacks(TW, nsF), fy = H - 22 - (under ? 60 : 38)*k, as = FXS.fitSize(ad, NEWS, TW, 27*k, 15), rh = 19.5*k, y00 = BH + 16*k + as*1.22 + 2 + 24*k, nT = Math.max(1, Math.min(3, Math.floor((fy - 12 - y00)/rh))), nTg = Math.min(nT, tags(TW).length);
        let y = BH + 16*k + Math.max(0, (fy - 9 - 14*k - BH - 16*k - (as*1.22 + 2 + 24*k + nTg*rh))/2); h += serif(ad, TX0, y, TW, as, 'front.address', 'letter-spacing:-.3pt'); y += as*1.22 + 2;
        h += factsLine(TX0, y, TW); y += 14*k + 10*k;
        tags(TW).slice(0, nT).forEach((t2, i) => { h += hlT(t2, i, TX0, y, TW, rh); y += rh; });
        h += `<div class="tt-ink" style="left:${TX0}pt;top:${fy - 9}pt;width:${TW}pt"></div>` + agentRow(TX0, fy, TW, under ? Math.min(nsF, 16*k) : nsF, H - 20 - fy, false, under);
      } else {
        // a wide house: JUST LISTED on one line across the band; the house plated on the left across the band's foot; the words beside it
        const ls = Math.min(FXS.fitSize('Just Listed', NEWS, W - 60, 82*k, 40), 90), BH = 40*k + ls*1.02 + 16;
        let PWs = Math.round(W*0.55); const PY = BH - 10, PHs = H - M - PY; while(PWs < W*0.66 && !SW.fits(D, pid, PWs, PHs)) PWs += 6;
