<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tasting-table social set</title>
<link rel="stylesheet" href="tt-tokens.css">
<script src="../engine/baths.js"></script>
<script src="../engine/ivory.js"></script>
<script src="../engine/ohlib.js"></script>
<script src="../engine/ohemail.js"></script>
<script src="../engine/carousel.js"></script>
<script src="../engine/factrepeat.js"></script>
<script src="../engine/socialset.js"></script>
<script src="tt-social.js"></script>
<!-- Tasting Table's Just Listed and Just Sold social sets (owner 11/18/2026). The shared engine (templates/_shared/socialset.js) loads
     the fonts and the data and runs the checks; the layouts are Tasting Table's own (tt-social.js): the kit's dark block against the
     kit's paper, the word in Newsreader with the street in copper italic, the house plated across the block's edge, the menu's leader
     rows, numbered rooms, the note on the white card. The colors come from the agent's brand kit as the set's print pieces read
     them (TT.brand in tt.js). -->
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
// the logo's own shape, read before the layout so its box fits it (the engine waits on OHL.cardReady)
{ const b0 = (Ivory.data() || {}).brand || {};
  if(b0.logo) OHL.cardReady = Promise.all([OHL.cardReady, new Promise(res => { const im = new Image(); im.onload = () => { if(im.naturalHeight) TTSocial.logoAR = im.naturalWidth/im.naturalHeight; res(); }; im.onerror = res; im.src = b0.logo; setTimeout(res, 4000); })]); }
TTSocial.base = {portrait: SocialSet.portrait, landscape: SocialSet.landscape};   // the engine's own, kept as the last resort
SocialSet.portrait = TTSocial.portrait; SocialSet.landscape = TTSocial.landscape; SocialSet.slide = TTSocial.slide;
SocialSet.start(D => {
  const b = D.brand || {}, c = b.colors || {}, r = document.documentElement.style;
  const rgb = h => { h = String(h||'').replace('#',''); if(h.length===3) h = h.split('').map(x=>x+x).join(''); const n = parseInt(h,16); return [n>>16&255, n>>8&255, n&255]; };
  const lum = h => { const v = rgb(h).map(q => { q/=255; return q <= .03928 ? q/12.92 : Math.pow((q+.055)/1.055, 2.4); }); return .2126*v[0] + .7152*v[1] + .0722*v[2]; };
  const con = (a, x) => { const p = lum(a), q = lum(x); return (Math.max(p,q)+.05)/(Math.min(p,q)+.05); };
  const on = bg => con(bg, '#ffffff') >= con(bg, '#161616') ? '#ffffff' : '#161616';
  const readable = (fg, bg, min) => con(fg, bg) >= (min || 3) ? fg : on(bg);
  const mix = (a, x, t) => { const p = rgb(a), q = rgb(x); return '#' + p.map((v, i) => Math.round(v + (q[i] - v)*t).toString(16).padStart(2, '0')).join(''); };
  // as TT.colors / TT.brand: the kit's paper is the field, the kit's dark the block, the accent (copper) the caps and the street on the
  // block and the dotted rules and underlines on the paper, the main color the small labels on the paper
  const main = c.main || b.accent || '#3d3228', dark = c.dark || '#1d1f22', accent = c.accent || b.accent2 || '#b8895a', paper = b.paper || mix(main, '#ffffff', .93);
  const label = readable(main, paper, 4.5), onD = on(dark);
  r.setProperty('--tt-paper', paper); r.setProperty('--tt-dark', dark); r.setProperty('--tt-main', main); r.setProperty('--tt-on', '#1b1a19'); r.setProperty('--tt-soft', '#34302c');
  r.setProperty('--tt-label', label); r.setProperty('--tt-edge', label); r.setProperty('--tt-on-d', onD); r.setProperty('--tt-copper-d', readable(accent, dark));
  r.setProperty('--tt-copper', con(accent, paper) >= 1.6 ? accent : label);
});
</script>
</body>
</html>
