<html lang="en">

<link rel="stylesheet" href="ar-fo.css">
<script src="ar.js"></script>
<script src="../engine/baths.js"></script>
<script src="../engine/baths-text.js"></script>

<script src="../engine/factrepeat.js"></script>
<script>window.Ivory = window.Ivory || {esc: s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))};</script>
<script src="ar-fo.js"></script>
<!--
  BrochureDesk · Architect · Just Listed and Just Sold postcards (the hand of the approved Open House library flyer B01).
  data.piece.card = "listed" | "sold", data.piece.size = "6x11" (trim 792 x 432 pt) | "6x9" (648 x 432 pt), data.piece.side = "front" | "back".
  Print adds 0.125 in (9 pt) bleed. The agent's brand color (brand.accent) is the field on both sides; boxes are white.
  Front: the whole house (roof to steps) on the right with a one-line-or-two caption and a white box under it, the status stacked large on the left over the address,
  the fact rows and the brokerage logo (Just Listed) or the agent's name and number and the logo (Just Sold). No price, no QR.
  Back: status line, interior photos with captions, a white box (the write-up, or the steps), the standard contact card (templates/_shared/agentcard.js,
  band preset, which carries the back's one logo), the fine print. The right 289.5 pt (4.02 in) is the mail vendor's: return address, postage and address
  zones; drawn as guides on proofs and left clear in print.
  Copy comes from data.sw.pc.{jl|js}.{front|back} as a lead plus whole sentences; tf.js picks the sentences that fill each box.
-->
<style>
  /* the FX14 hand on a postcard: white frame, a taupe block, Pinyon Script status, white underlined labels, hairline white boxes; tokens in ar-tokens.css */
  .pc-col{position:absolute;display:flex;flex-direction:column}
  /* the drafting sheet: the light moment on the card (ink type, ink hairlines) */
  .pc-wbox{background:var(--ar-paper);color:var(--ar-paper-text);padding:10pt 16pt 9pt;display:flex;flex-direction:column;overflow:hidden;--fx-on:var(--ar-paper-ink);--ar-on:var(--ar-paper-ink);--ar-accent:var(--ar-paper-main)}
  .pc-wbox .k{font-family:var(--ar-label);font-weight:600;font-size:8.8pt;line-height:11pt;letter-spacing:2.6pt;text-transform:uppercase;color:var(--ar-paper-main);white-space:nowrap;overflow:hidden;margin-bottom:3pt;align-self:flex-start}
  .pc-wbox .p{font-family:var(--ar-font);font-weight:400;overflow:hidden;color:var(--ar-paper-text)}
  .pc-wbox .p b{font-weight:700;color:var(--ar-paper-ink)}
  .pc-bstatus{position:absolute;white-space:nowrap;overflow:hidden}
  .pc-steps .it{display:flex;gap:9pt;align-items:baseline;white-space:nowrap;overflow:hidden}
  .pc-steps .bx{width:15pt;height:15pt;border:1.5pt solid var(--ar-paper-ink);border-radius:50%;box-sizing:border-box;color:var(--ar-paper-ink);font-family:var(--ar-serif);font-weight:700;font-size:8.5pt;line-height:13pt;text-align:center;flex:none}
  .pc-call{font-family:var(--ar-serif);font-weight:400;font-size:13pt;line-height:16pt;color:var(--ar-paper-ink);white-space:nowrap;overflow:hidden}
  .pc-disc{position:absolute;font-size:7.5pt;font-weight:500;line-height:10pt;color:var(--fx-soft);overflow:hidden;white-space:nowrap}
  .pc-ret{position:absolute;font-family:var(--fx-font);font-weight:500;font-size:9pt;line-height:11pt;letter-spacing:.2pt;color:var(--fx-on);overflow:hidden;height:34pt}
  .pc-ret b{font-weight:600;letter-spacing:1.4pt;text-transform:uppercase;color:var(--fx-on)}
  .cap .a{font-weight:400}
  .cap .a b{font-weight:700;color:var(--ar-on)}
  /* owner 11/16: the postcard contact block in two tight rows: name | cell, email and web on one line; the logo beside the office lines */
  .cc-post{background:transparent!important}
  .cc-post .cc-lines{display:flex;column-gap:12pt;align-items:baseline}
  .cc-post .cc-contact{align-items:baseline!important}
  .cc-post .cc-panel{flex-direction:row!important;align-items:center!important;justify-content:flex-end!important;text-align:left!important}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const esc = SW.esc, b = D.brand || {}, A = D.agent || {}, L = D.listing, P = D.piece || {};
  document.body.dataset.mode = D.mode || 'email';
  await SW.setup(D);
  const sold = P.card === 'sold', big = P.size === '6x11', front = P.side === 'front';
  const W = big ? 792 : 648, H = 432;
  const K = ((D.sw || {}).pc || {})[sold ? 'js' : 'jl'] || {};
  const hsSrc = A.headshot && ((D.photos||{})[A.headshot] ? D.photos[A.headshot].src : A.headshot) || '';
  const statusWord = sold ? 'Just Sold' : 'Just Listed';
  const issues = [];
  const logo = (cls, src, area, maxh, style) => `<div class="logo ${cls}" data-area="${area}" data-maxh="${maxh}" style="${style||''}">${src ? `<img src="${esc(src)}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage||'')}</span>`}</div>`;
  const CL = big ? 13.5 : 12.5, CF = big ? 'font-size:10.9pt;line-height:13.5pt;' : '';   // the 6x11 sets its type up from the 6x9 (11 pt against 9.5), not the same size with more room
  const cap = (c, slot, lines, extra, min) => (c = (c.photo ? FXS.augment(D, c) : c), `<div class="cap" style="height:${5 + lines*CL}pt;${extra||''}"><div class="a" data-min="${min || 2}" data-slot="${slot}" data-narrow="0" data-nstep="6" data-lh="${CL}" data-lines="${lines}" data-lead="${esc(c.lead||'')}" data-s='${esc(JSON.stringify([].concat(c.s||[]))).replace(/'/g,'&#39;')}' style="height:${lines*CL}pt;${CF}"></div></div>`);
  let h = '';

  if(front){
    // The FX14 hand on a postcard front. A white frame top and side, the whole house in it, a taupe block around it with the status in Pinyon Script.
    // JL: "Just Listed" in script beside the house, the horizontal address, three facts; under the house the caption ("Front.", the draws) and the agent and logo along the foot.
    // JS: sells the agent: "Just Sold" in the same script lockup, the name and phone big on the left, the house on the right with the agent's own note, the logo.
    const F = K.front || {};
    const draws = list => { const w = x => /gated|roof|pergola|deck|park|garage|island|stone|corner|pool/i.test([].concat(x)[0]) ? 0 : 1; return (list || []).map((x, i) => [w(x), i, x]).sort((p, q) => p[0] - q[0] || p[1] - q[1]).map(t => t[2]); };
    const capC = sold ? {lead: '', s: (F.note || {}).s || (F.cap || {}).s} : (F.caption ? {lead: F.caption.lead, s: F.caption.s.concat(draws((F.about || {}).s || []))} : {lead: 'Front.', s: draws((F.about || {}).s || (F.cap || {}).s)});
    const norm = x => String(x).toLowerCase().replace(/[^a-z0-9 ]/g, '').slice(0, 40), allAlts = list => [].concat(...(list || []).map(x => [].concat(x)));
    const backSet = new Set([].concat(allAlts(((K.back || {}).about || {}).s), ...((K.back || {}).photos || []).map(c => allAlts(c.s)), allAlts((K.back || {}).steps6), allAlts((K.back || {}).steps)).map(norm));
    const backAll = allAlts(((K.back || {}).about || {}).s).map(String);   // the back's About box
    if(capC.s){ const kept = capC.s.filter(x => ![].concat(x).some(a => backSet.has(norm(a)))); if(kept.length >= 2) capC.s = kept; }
    // the caption's own first sentence stays; a later one that says a fact the back's About box says (the deck and pergola, in other words) drops out
    if(capC.s && capC.s.length > 2){ const tail = capC.s.slice(1).filter(x => ![].concat(x).some(a => backAll.some(b => SW.sameFact(String(a), b)))); if(tail.length >= 1) capC.s = [capC.s[0]].concat(tail); }
    const roomIds = [...new Set([].concat(((D.sw||{}).back||{}).photos||[], ((D.sw||{}).left||{}).photos||[]).map(c => c.photo))].filter(id => (D.photos||{})[id] && !(D.photos[id]||{}).fullHouse && id !== F.cap.photo).slice(0, 2);
    // ---- Architect fronts (P08 on a card): the stone field, the house inset inside its four corner ticks, Baskerville bold capitals for the
    // status, the street in Baskerville regular on a drafting rule, the facts on a dimension line. ----
    const k = big ? 1.12 : 1, pid = F.cap.photo, M = 30, DISP = "font-family:Libre Baskerville;font-weight:700;letter-spacing:-1pt", lsrc = AR.logoSrc(D);
    const scss = 'font-family:Libre Baskerville;font-weight:400';
    const agentBlock = (x, y, w, ns, al) => { const s = FXS.fitSize(A.name || '', scss, w, ns, 13);
      return `<div class="abs" style="left:${x}pt;top:${y}pt;width:${w}pt;text-align:${al || 'left'}"><div style="font-family:var(--ar-serif);font-weight:400;font-size:${s}pt;line-height:${s*1.25}pt;color:var(--ar-on);white-space:nowrap" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</div><div style="font-family:var(--ar-label);font-weight:600;font-size:${11*k}pt;line-height:${15*k}pt;letter-spacing:1.4pt;color:var(--ar-accent);white-space:nowrap" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</div></div>`; };
    const logoAt = (x, y, lw2, lh2, just) => `<div class="abs logo" data-area="${lw2*lh2}" data-maxh="${lh2}" style="left:${x}pt;top:${y}pt;width:${lw2}pt;height:${lh2}pt;justify-content:${just || 'flex-end'}">${lsrc ? `<img src="${esc(lsrc)}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage || '')}</span>`}</div>`;
    const hood = FXS.hood(L), city = FXS.placeLine(L).replace(/\s+\d{5}(-\d{4})?$/, '');
    if(!sold){
      // JUST LISTED: the words stacked as large as the left column allows, the drafting rule, the street in Baskerville, the highlights on
      // open squares over hairlines; on the right the whole house, tall, inside its ticks, the facts on a dimension line under it; the agent
      // and the one logo at the foot of the column.
      const PY = M, DIMY = H - 22, PH = DIMY - 22 - PY; let PW = Math.round((big ? 430 : 336));
      while(PW < W*0.64 && !SW.fits(D, pid, PW, PH)) PW += 6;
      const PX = W - M - PW;
      h += FO.inset(D, pid, PX, PY, PW, PH, 'front.hero', {n: 12, off: 8});
      h += FO.dim(PX, DIMY, PW, FO.factLine(L, PW, 9.5*k), 'front.fact', {fs: Math.min(10.5, 9.5*k), tr: 2, fill: 0.84});
      const TX0 = M, TW = PX - 30 - M; let y = M - 2;
      h += `<div class="ar-eyebrow" style="left:${TX0}pt;top:${y}pt;width:${TW}pt;text-align:left;font-size:${8.8*k}pt;letter-spacing:${(big ? 2.8 : 1.9)}pt" data-slot="front.place" data-lines="1">${esc((hood ? hood + '  ·  ' : '') + city)}</div>`;
      y += 20*k;
      const ss = Math.min(FXS.fitSize('LISTED', DISP, TW + 2, 80*k, 36), 80*k), slh = ss*0.98;
      ['JUST', 'LISTED'].forEach((t, i) => { h += `<div class="ar-title" style="left:${TX0 - 3}pt;top:${y + i*slh}pt;width:${TW + 6}pt;height:${ss*1.22}pt;font-size:${ss}pt;line-height:${ss*1.22}pt;text-align:left" data-slot="front.status${i ? '.1' : ''}" data-lines="1">${t}</div>`; });
      y += 2*slh + ss*0.24 + 4;
      h += `<div class="ar-rule" style="left:${TX0}pt;top:${y}pt;width:${TW}pt"></div>`; y += 10*k;
      { const ad = String(L.address || ''), s0 = FXS.fitSize(ad, scss, TW, 24*k, 13);
        h += `<div class="ar-street" style="left:${TX0}pt;top:${y}pt;width:${TW + 2}pt;height:${s0*1.32}pt;font-size:${s0}pt;line-height:${s0*1.32}pt" data-slot="front.address" data-lines="1">${esc(ad)}</div>`; y += s0*1.32 + 10*k; }
      const footY = H - M - 34*k - 10;
      const tg0 = (F.highlights || FXS.tagFacts(D).tags).filter(t => FXS.width(t, `font-family:Instrument Sans;font-weight:500;font-size:${10.5*k}pt`) < TW - 18).filter((t, i, arr) => !arr.slice(0, i).some(u => SW.sameFact(t, u)));
      const rank = t => /\b(19|20)\d\d\b/.test(t) ? 0 : /^new\b|replaced|updated|remodel|renovat|added\b/i.test(t) ? 1 : 2, tg = F.highlights ? tg0 : tg0.map((t, i) => [rank(t), i, t]).sort((p, q) => p[0] - q[0] || p[1] - q[1]).map(x => x[2]), nT = Math.max(0, Math.min(3, tg.length));
      const room = footY - y, hcss = 'font-family:Instrument Sans;font-weight:500', hs = Math.min(...tg.slice(0, nT).map(t => FXS.fitSize(t, hcss, TW - 18*k, 14.5*k, 9.5))), rh = room/Math.max(1, nT);
      tg.slice(0, nT).forEach((t, i) => { if(i) h += `<div class="ar-hair" style="left:${TX0}pt;top:${y + i*rh - 0.5}pt;width:${TW}pt"></div>`; h += `<div class="abs" style="left:${TX0}pt;top:${y + i*rh}pt;width:${TW}pt;height:${rh}pt;display:flex;align-items:center;gap:${9*k}pt;white-space:nowrap;overflow:hidden"><span style="width:${7*k}pt;height:${7*k}pt;border:1.5pt solid var(--ar-on);box-sizing:border-box;flex:none"></span><span style="font-family:var(--ar-font);font-weight:500;font-size:${hs}pt;line-height:${hs*1.3}pt;color:var(--ar-on)" data-slot="front.hl.${i}" data-lines="1">${esc(t)}</span></div>`; });
      // the foot of the column: the agent, the one logo
      const fy = H - 22 - 30*k, lgW = Math.min(118*k, TW*0.42), lgH = 32*k;
      h += `<div class="ar-rule" style="left:${TX0}pt;top:${fy - 8}pt;width:${TW}pt;background:var(--ar-hair)"></div>`;
      h += agentBlock(TX0, fy, TW - lgW - 10, 17*k) + logoAt(TX0 + TW - lgW, fy + 2, lgW, lgH);
    } else {
      // JUST SOLD (not the Just Listed card mirrored): JUST SOLD across the whole card in Baskerville bold capitals; the street and the place
      // stand on one drafting rule under it (the flyer's date-and-address line); under that the house inside its ticks on the left and, on
      // the right, the seller question, the note sized to its text, who to call and the one logo. No house features.
      const ss = Math.min(FXS.fitSize('JUST SOLD', DISP, W - 2*M + 4, 92*k, 50), 92*k);
      h += `<div class="ar-title" style="left:${M - 4}pt;top:${M - 8}pt;width:${W - 2*M + 8}pt;height:${ss*1.2}pt;font-size:${ss}pt;line-height:${ss*1.2}pt;text-align:center" data-slot="front.status" data-lines="1">JUST SOLD</div>`;
      let y = M - 8 + ss*1.2 + 2;
      const pl = (hood ? hood + '  ·  ' : '') + city, pcss = `font-family:Instrument Sans;font-weight:500;letter-spacing:${2.6*k}pt;font-size:${8.8*k}pt`, pw = FXS.width(pl.toUpperCase(), pcss) + 4;
      const ad = String(L.address || ''), s0 = FXS.fitSize(ad, scss, W - 2*M - pw - 20, 22*k, 13);
      h += `<div class="ar-street" style="left:${M}pt;top:${y}pt;width:${W - 2*M - pw - 16}pt;height:${s0*1.3}pt;font-size:${s0}pt;line-height:${s0*1.3}pt" data-slot="front.address" data-lines="1">${esc(ad)}</div>`;
      h += `<div class="ar-eyebrow" style="left:${W - M - pw}pt;top:${y + s0*1.3 - 15}pt;width:${pw}pt;text-align:right;font-size:${8.8*k}pt;letter-spacing:${2.6*k}pt" data-slot="front.place" data-lines="1">${esc(pl)}</div>`;
      y += s0*1.3 + 4; h += `<div class="ar-rule" style="left:${M}pt;top:${y}pt;width:${W - 2*M}pt"></div>`; y += 1 + 22;
      const PY = y, PH = H - M - PY; let PW = Math.round(W*(big ? 0.56 : 0.5)); while(PW < W*0.6 && !SW.fits(D, pid, PW, PH)) PW += 6; while(PW > W*0.4 && !SW.fits(D, pid, PW, PH)) PW -= 6; PW = FO.tightW(D, pid, PW, PH, W*0.36);
      h += FO.inset(D, pid, M, PY, PW, PH, 'front.hero', {n: 12, off: 8});
      const CX = M + PW + 30, CWd = W - M - CX;
      const cq = 'Thinking about selling?', cs2 = FXS.fitSize(cq, scss, CWd, 19*k, 12);
      h += `<div class="abs" style="left:${CX}pt;top:${PY - 3}pt;width:${CWd + 2}pt;height:${cs2*1.32}pt;font-family:var(--ar-serif);font-weight:400;font-size:${cs2}pt;line-height:${cs2*1.32}pt;color:var(--ar-on);white-space:nowrap" data-slot="front.cta" data-lines="1">${cq}</div>`;
      const agY = H - M - (16*k*1.25 + 15*k), ny0 = PY - 3 + cs2*1.32 + 6;
      if(F.note2) h += `<div class="abs" id="jsnote2" style="left:${CX}pt;top:${ny0}pt;width:${CWd}pt;height:${agY - 14*k - ny0}pt;font-size:${12*k}pt;line-height:1.32;color:var(--ar-soft);font-family:var(--ar-font);font-weight:400" data-slot="front.note" data-lines="3" data-y0="${ny0}" data-y1="${agY - 14*k}" data-alts='${esc(JSON.stringify(F.note2)).replace(/'/g, '&#39;')}'>${esc(F.note2[0])}</div>`;
      else { const lh = 13.6*k, n = Math.max(3, Math.min(6, Math.floor((agY - 16*k - ny0)/lh))); h += `<div class="abs cap side" data-ph-top="${ny0 - 22}" data-ph-h="${agY - 14*k - ny0 + 22}"><div class="a" id="jsnote-a" style="position:absolute;left:${CX}pt;top:${ny0}pt;width:${CWd}pt;height:${n*lh}pt;font-size:${10*k}pt;line-height:${lh}pt;color:var(--ar-soft)" data-slot="front.note" data-lh="${lh}" data-lines="${n}" data-min="3" data-narrow="0" data-flexh="1" data-maxfs="${big ? 17 : 14.5}" data-agy="${agY}" ${FXS.sd(capC.s || [])}></div></div>`; }
      h += `<div class="ar-hair" id="jshair" style="left:${CX}pt;top:${agY - 9*k}pt;width:${CWd}pt"></div>`;
      const lgW = 96*k, nw = CWd - lgW - 10; h += agentBlock(CX, agY, nw, 16*k) + logoAt(W - M - lgW, agY + 2, lgW, 30*k);
    }
  } else {
    // ---------------- BACK (round 5, the owner's edge-to-edge rule): the taupe field runs to every edge; only the postage box, the address block and the barcode strip sit on light panels (luminance 243; vendors print black ink and USPS needs a light field there) ----------------
    // zones (pt, trim coordinates): postage 84 x 98.25 top right, address block 240 x 112.5, barcode strip 342 x 45 bottom right, all clear of art and type
    const dx = W - 648, X = 30, G = 10, B = K.back || {};
    const Z = {postage: [552 + dx, 12, 84, 98.25], address: [405 + dx, 187.5, 240, 112.5], barcode: [306 + dx, 387, 342, 45]};
    window.__zones = Z; window.__cardX = 30;
    const PL = Z.barcode[0] - 8, cardH = 40, cardY = 339, FOOT = 326, BT = 54;   // owner 11/16: contact block about half its old height (85.5 -> 40 pt); the content runs down to FOOT; the gold banner runs the full width to BT
    window.__foot = FOOT;
    h += `<div class="taupe" style="left:-9pt;top:-9pt;width:${W + 18}pt;height:${H + 18}pt"></div>`;
    const pnl = (x, y, w, hh) => `<div class="abs mailp" data-mail-panel="1" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${hh}pt;background:var(--fx-mail)"></div>`;
    // owner 11/16: the design runs across the whole back, mail side included; the three mail zones are small light markups (zone + 5 pt) laid
    // on top of the banner, the photo and the lifted foot band at the very end (mailPanels), never a blank half
    const mailPanels = () => pnl(Z.postage[0] - 5, Z.postage[1] - 5, Z.postage[2] + 10, Z.postage[3] + 10) + pnl(Z.address[0] - 5, Z.address[1] - 5, W + 9 - (Z.address[0] - 5), Z.address[3] + 10) + pnl(Z.barcode[0] - 5, Z.barcode[1] - 4, W + 9 - (Z.barcode[0] - 5), H + 9 - (Z.barcode[1] - 4));
    // the foot: the lifted panel with its accent edge (the sign-in sheet's panel, thread 5) runs edge to edge under the contact card and the barcode strip
    h += `<div class="abs ar-rule" data-under-mail="1" style="left:${X}pt;top:${FOOT + 5}pt;width:${W - X + 9}pt"></div>`;
    const rx = Z.address[0], lw = rx - 14 - X;          // right column starts at the address block's left edge; the left zone is everything left of it
    const rw = Z.postage[0] - 12 - rx;                 // the return address: left of the postage box
    { const sfs = big ? (sold ? 34 : 28) : 23, bw = FXS.width(sold ? 'JUST SOLD' : 'JUST LISTED', `font-family:Libre Baskerville;font-weight:700;letter-spacing:-.6pt;font-size:${sfs}pt`) + 18, bhh = big ? 42 : 36, aw = lw - bw - 12, ad = String(L.address || ''), css = 'font-family:Libre Baskerville;font-weight:400;letter-spacing:0pt';
      let as = FXS.fitSize(ad, css, aw, big ? 17 : 14, 9.5), al = [ad]; if(FXS.width(ad, `${css};font-size:${as}pt`) > aw){ as = 10.5; al = FO.wrapText(ad, `${css};font-size:${as}pt`, aw); }
      if(sold){   // the Just Sold back: JUST SOLD in Baskerville bold capitals and the full street standing on one drafting rule

      list.style.lineHeight = lh2 + 'pt'; stp.forEach(e => { e.dataset.lh = lh2; e.style.lineHeight = lh2 + 'pt'; }); its.forEach(it => { it.querySelector('.bx').style.marginTop = ((lh2 - 15)/2) + 'pt'; });
      return; }
    const stp = [...list.querySelectorAll('.stp')], its = [...list.querySelectorAll('.it')], fits = () => box.scrollHeight <= box.clientHeight + .5;
    const okLines = () => stp.every(e => { const L = SW.lines(e); return L.n === 1 || (L.fill >= .9 && L.min >= .8); });
    const apply = (fs, m) => { list.style.fontSize = fs + 'pt'; list.style.lineHeight = (fs*m) + 'pt'; stp.forEach(e => { e.dataset.lh = fs*m; }); its.forEach(it => { it.querySelector('.bx').style.marginTop = ((fs*m - 13)/2) + 'pt'; }); SW.fill(); };
    const sizes = []; for(let f = big ? 13.5 : 13; f >= 9.5 - 1e-6; f -= 0.1) sizes.push(+f.toFixed(2));
    for(const fs of sizes){ apply(fs, 1.25); if(!(okLines() && fits())) continue;
      for(let m = 1.25; m <= 1.7; m += .03){ apply(fs, m); if(!fits() || !okLines()){ apply(fs, m - .03); break; } jsCheck(); if(window.__jsFill >= .87) break; }
      return; }
    apply(sizes[sizes.length - 1], 1.25); }
  function backCheck(){ const out = [], pt = v => v*72/96, sh = document.querySelector('.sheet').getBoundingClientRect(), X0 = window.__cardX || 30;
    const cc = document.querySelector('.sheet .cc');
    if(!cc) out.push({slot: 'back.card', kind: 'no-contact-card', detail: 'the back has no standard contact card'});
    else { const r = cc.getBoundingClientRect(), l = pt(r.left - sh.left), rr = pt(r.right - sh.left), Wt = pt(sh.width) - 18;
      if(l > X0 + 1 || rr < Wt - X0 - 1) out.push({slot: 'back.card', kind: 'card-not-full-width', detail: `card spans ${l.toFixed(0)}-${rr.toFixed(0)} pt of ${Wt.toFixed(0)}`}); }
    let area = 0; document.querySelectorAll('.sheet [data-mail-panel]').forEach(el => { const r = el.getBoundingClientRect(); const w = Math.min(pt(r.right - sh.left) - 9, pt(sh.width) - 18) - Math.max(pt(r.left - sh.left) - 9, 0), h = Math.min(pt(r.bottom - sh.top) - 9, 432) - Math.max(pt(r.top - sh.top) - 9, 0); area += Math.max(0, w)*Math.max(0, h); });
    if(area > .25*(pt(sh.width) - 18)*432) out.push({slot: 'back.panels', kind: 'light-block-too-big', detail: `mail panels cover ${(100*area/((pt(sh.width) - 18)*432)).toFixed(0)}% of the card`});
    if(sold) out.push(...jsCheck());
    return out; }
  // nothing but the proof guides may sit in the mail vendor's zones (postage, address block, barcode strip)
  function lum(c){ const m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(c); return m ? .2126*m[1] + .7152*m[2] + .0722*m[3] : 0; }
  function panelCheck(){ const out = [], Z = window.__zones, sh = document.querySelector('.sheet').getBoundingClientRect(), pt = v => v*72/96;
    const panels = [...document.querySelectorAll('.mailp')].map(p => { const r = p.getBoundingClientRect(); return {l: pt(r.left - sh.left), t: pt(r.top - sh.top), r: pt(r.right - sh.left), b: pt(r.bottom - sh.top), lum: lum(getComputedStyle(p).backgroundColor)}; });
    if(!panels.length) out.push({slot: 'back.panel', kind: 'mail-panel-missing', detail: 'no light panel under the mail zones'});
    ['postage', 'address', 'barcode'].forEach(k => { const z = Z[k], p = panels.find(q => q.l <= z[0] + .5 && q.t <= z[1] + .5 && q.r >= z[0] + z[2] - .5 && q.b >= z[1] + z[3] - .5);
      if(!p) out.push({slot: 'back.' + k, kind: 'mail-zone-not-light', detail: `the ${k} zone is not fully on a light panel`});
      else if(p.lum < 200) out.push({slot: 'back.' + k, kind: 'mail-zone-not-light', detail: `the ${k} panel's luminance is ${Math.round(p.lum)} (200 minimum): vendors print black ink and USPS needs a light field`}); });
    // the taupe runs to every edge: nothing outside the three panels is light
    return out; }
  // the Just Sold bullets: each takes the longest wording that sets in 3 lines (2 on the 6x9) so the six read as full sentences
  function fitHelp(){
    const hbs = [...document.querySelectorAll('.hb')], grid = document.querySelector('.pc-help'), call = grid.parentElement.querySelector('.pc-call');
    const pick = maxL => hbs.forEach(el => { const tx = el.querySelector('.tx'), alts = JSON.parse(el.dataset.alts).slice().sort((p, q) => q.length - p.length); let best = null, bf = -1;
      for(const a of alts){ tx.textContent = a; const L = SW.lines(tx); if(L.n > maxL) continue; if(L.n === 1 || L.fill >= .76){ best = a; bf = 9; break; } if(L.fill > bf){ best = a; bf = L.fill; } }
      tx.textContent = best || alts[alts.length - 1]; });
    const over = () => Math.max(...hbs.map(e => e.getBoundingClientRect().bottom)) > call.getBoundingClientRect().top - 5 || grid.parentElement.scrollHeight > grid.parentElement.clientHeight + .5;
    const bad = () => hbs.filter(el => { const L = SW.lines(el.querySelector('.tx')); return L.n > 1 && L.fill < .75; });
    // the bullets take the largest size at which all six set in full lines (last line 3/4 full) inside the box: no empty band under the heading
    const base = big ? 8.5 : 8, top = big ? 15 : 12; let bestCfg = null;
    const apply = fs => hbs.forEach(el => { el.style.fontSize = fs + 'pt'; el.style.lineHeight = (fs*1.32) + 'pt'; el.querySelector('.bx').style.marginTop = (fs*1.32/2 - 2) + 'pt'; });
    // every size is tried; the one whose bullets keep the fullest wording (then the larger type) wins, all six on full last lines inside the box
    for(let fs = top; fs >= base; fs -= .25) for(const maxL of (big ? [3, 2] : [3, 2])){
      apply(fs); pick(maxL); if(over() || bad().length) continue;
      const len = hbs.reduce((n, el) => n + el.querySelector('.tx').textContent.length, 0), sc = fs*1000 + len;
      if(!bestCfg || sc > bestCfg.sc) bestCfg = {fs, maxL, sc}; }
    if(bestCfg){ apply(bestCfg.fs); pick(bestCfg.maxL); } else { apply(base); pick(3); }
    { const bxel = grid.parentElement; if(over() || bxel.scrollHeight > bxel.clientHeight + .5) issues.push({slot: 'back.steps', kind: 'steps-overflow', detail: 'the six bullets and the call line do not fit their box'}); }
    hbs.forEach(el => { const tx = el.querySelector('.tx'), L = SW.lines(tx); delete el.dataset.slot;
      if(L.n > 1 && L.fill < .75) issues.push({slot: 'back.step' + el.dataset.help, kind: 'last-line-short', detail: `last line is ${Math.round(L.fill*100)}% full (75% minimum): "${tx.textContent.slice(-24)}"`}); });
  }
  function mailCheck(){ const out = [], Z = window.__zones, pt = v => v*72/96, sh = document.querySelector('.sheet').getBoundingClientRect();
    const hit = (r, z) => pt(r.left - sh.left) < z[0] + z[2] - .5 && pt(r.right - sh.left) > z[0] + .5 && pt(r.top - sh.top) < z[1] + z[3] - .5 && pt(r.bottom - sh.top) > z[1] + .5;
    document.querySelectorAll('.sheet .ph, .sheet .pc-wbox, .sheet .cap, .sheet .cc, .sheet .pc-ret, .sheet .pc-bstatus, .sheet .pc-disc').forEach(el => {
      // owner 11/16: a photo, banner or band may run under a mail markup (the opaque light panel is drawn over it, so the zone prints light); type never may
      if(el.closest('[data-under-mail]') || el.matches('[data-under-mail]')) return;
      const r = el.getBoundingClientRect(); for(const k in Z) if(hit(r, Z[k])) out.push({slot: el.dataset.slot || el.className, kind: 'in-mail-zone', zone: k}); });
    return out; }
})();
