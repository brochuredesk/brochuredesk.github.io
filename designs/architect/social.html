<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>architect social set</title>
<link rel="stylesheet" href="ar-tokens.css">
<script src="../engine/baths.js"></script>
<script src="../engine/ivory.js"></script>
<script src="../engine/ohlib.js"></script>
<script src="../engine/ohemail.js"></script>
<script src="../engine/carousel.js"></script>
<script src="../engine/factrepeat.js"></script>
<script src="../engine/socialset.js"></script>
<script src="ar-social.js"></script>
<!-- Architect's Just Listed and Just Sold social sets (owner 11/18/2026). The shared engine (templates/_shared/socialset.js) loads the
     data and runs the checks; the layouts are Architect's own (ar-social.js): the stone drafting sheet, the very large Baskerville
     capitals, every photo inside its four corner ticks, the facts on a dimension line, the highlights on hollow squares.
     The brand kit's colors (data.brand.colors) set the field and the accent, as the set's print pieces read them. -->
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
SocialSet.portrait = ARSocial.portrait; SocialSet.landscape = ARSocial.landscape; SocialSet.slide = ARSocial.slide;
const boot = () => SocialSet.start(D => {
  const b = D.brand || {}, c = b.colors || {}, r = document.documentElement.style;
  const rgb = h => { h = String(h||'').replace('#',''); if(h.length===3) h = h.split('').map(x=>x+x).join(''); const n = parseInt(h,16); return [n>>16&255, n>>8&255, n&255]; };
  const hex = a => '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
  const mix = (a, z, k) => { const p = rgb(a), q = rgb(z); return hex(p.map((v, i) => v*k + q[i]*(1 - k))); };
  const lum = h => { const v = rgb(h).map(q => { q/=255; return q <= .03928 ? q/12.92 : Math.pow((q+.055)/1.055, 2.4); }); return .2126*v[0] + .7152*v[1] + .0722*v[2]; };
  const con = (a, z) => { const x = lum(a), y = lum(z); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); };
  const on = bg => con(bg, '#ffffff') >= con(bg, '#161616') ? '#ffffff' : '#161616';
  const read = (fg, bg, k) => con(fg, bg) >= k ? fg : on(bg);
  // as the print pieces (AR.brand in ar.js): the kit's dark lifted 6% toward stone is the field; type in white (or ink on a light kit);
  // the kit's accent only for the facts and the phone, where it reads on the field
  const dark = c.dark || '#2e3236', accent = c.accent || '#b8935a', page = mix(dark, '#8c8a84', .94), ink = on(page);
  r.setProperty('--ss-page', page);
  r.setProperty('--ars-on', ink); r.setProperty('--ars-acc', read(accent, page, 3)); r.setProperty('--ars-soft', mix(ink, page, .86));
  r.setProperty('--ars-rule', mix(ink, page, .58)); r.setProperty('--ars-hair', mix(ink, page, .4));
});
// every face and weight the layouts measure is loaded before the engine lays the image out
Promise.all(["700 20px 'Libre Baskerville'", "400 20px 'Libre Baskerville'", "400 12px 'Instrument Sans'", "500 12px 'Instrument Sans'", "600 12px 'Instrument Sans'"].map(f => document.fonts.load(f).catch(() => 0))).then(boot, boot);
</script>
</body>
</html>
