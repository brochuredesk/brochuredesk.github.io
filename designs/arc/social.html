<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>arc social set</title>
<link rel="stylesheet" href="ar-tokens.css">
<script src="../engine/baths.js"></script>
<script src="../engine/ivory.js"></script>
<script src="../engine/ohlib.js"></script>
<script src="../engine/ohemail.js"></script>
<script src="../engine/carousel.js"></script>
<script src="../engine/factrepeat.js"></script>
<script src="../engine/socialset.js"></script>
<script src="ar-social.js"></script>
<!-- Arc's Just Listed and Just Sold social sets (owner 11/18/2026: every follow-on piece matches its set's main pieces). The shared
     engine (templates/_shared/socialset.js) loads the fonts and the data and runs the checks; the layouts are Arc's own (ar-social.js):
     the photo whose foot is the long swept arc with the accent hairline echoing it, JUST / LISTED and JUST / SOLD stacked very large
     in light Spectral caps, the round-cornered main-color block at the foot with the agent, accent dashes, the note in the white box.
     The colors come from the agent's brand kit exactly as the set's print pieces read them (AR.colors / AR.brand in ar.js). -->
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
SocialSet.portrait = ARSocial.portrait; SocialSet.landscape = ARSocial.landscape; SocialSet.slide = ARSocial.slide;
// every face and weight the layouts measure is loaded before they run (the engine waits on OHL.cardReady)
OHL.cardReady = Promise.all([OHL.cardReady].concat(["400 20px 'Spectral'", "500 20px 'Spectral'", "400 12px 'Jost'", "500 12px 'Jost'", "600 12px 'Jost'", "700 12px 'Jost'"].map(f => document.fonts.load(f).catch(() => 0))));
SocialSet.start(D => {
  const b = D.brand || {}, c = b.colors || {}, r = document.documentElement.style;
  const rgb = h => { h = String(h||'').replace('#',''); if(h.length===3) h = h.split('').map(x=>x+x).join(''); const n = parseInt(h,16); return [n>>16&255, n>>8&255, n&255]; };
  const lum = h => { const v = rgb(h).map(q => { q/=255; return q <= .03928 ? q/12.92 : Math.pow((q+.055)/1.055, 2.4); }); return .2126*v[0] + .7152*v[1] + .0722*v[2]; };
  const con = (a, x) => { const p = lum(a), q = lum(x); return (Math.max(p,q)+.05)/(Math.min(p,q)+.05); };
  const on = bg => con(bg, '#ffffff') >= con(bg, '#161616') ? '#ffffff' : '#161616';
  const readable = (fg, bg, min) => con(fg, bg) >= (min || 3) ? fg : on(bg);
  const mix = (a, x, t) => { const p = rgb(a), q = rgb(x); return '#' + p.map((v, i) => Math.round(v + (q[i] - v)*t).toString(16).padStart(2, '0')).join(''); };
  // as AR.colors / AR.brand: the kit's paper is the page, the main color the word, the street's name and the block (the whole field on
  // Just Sold), the accent the hairline echo and the dashes (on the main color: where it reads, else the type color)
  const main = c.main || b.accent || '#2f4a3a', accent = c.accent || b.accent2 || main, paper = b.paper || mix(main, '#ffffff', .93);
  r.setProperty('--ars-paper', paper); r.setProperty('--ars-main', main); r.setProperty('--ars-on-main', on(main));
  r.setProperty('--ars-main-ink', readable(main, paper, 4.5)); r.setProperty('--ars-stripe', readable(accent, paper, 1.8)); r.setProperty('--ars-gold', readable(accent, main, 3));
});
</script>
</body>
</html>
