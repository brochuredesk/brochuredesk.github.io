<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · Logo Grid postcards</title>
<link rel="stylesheet" href="lg.css">
<link rel="stylesheet" href="lg-fo.css">
<script src="lg.js"></script>
<script src="../engine/baths.js"></script>
<script src="../engine/agentcard.js"></script>
<script src="../engine/factrepeat.js"></script>
<script>window.Ivory = window.Ivory || {esc: s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))};</script>
<script src="lg-fo.js"></script>
<!--
  BrochureDesk · Logo Grid · Just Listed and Just Sold postcards, in the hand of the approved Open House library flyer P13 Logo Grid
  (templates/oh-library/p13-logo-grid.html) and its sign-in sheet: the kit's paper, photos as prints in white mats, the main-color band
  with the one giant word, Red Hat Display throughout, facts centered with short rules, the brokerage logo where the flyer puts it.
  data.piece.card = "listed" | "sold", data.piece.size = "6x11" (trim 792 x 432 pt) | "6x9" (648 x 432 pt), data.piece.side = "front" | "back".
  FRONTS. Just Listed: the house print, the logo top right over the house's real story (short rules between), the agent; the band across
  the foot with JUST LISTED in giant caps | the street and the place. Just Sold, its own card: the band across the head with JUST SOLD and
  the street; the house print laid over the band's edge; the seller question, the note on the white mat, who to call and the logo.
  BACKS (the owner 11/16: the design runs through the whole card): the band runs across the head, down the mail side and across the foot;
  the postage box, the address block and the barcode strip are small white markups set into it; the paper shows in the window it frames
  (two captioned prints, or the six steps on the white mat); the contact card half its old height in one row. No price, no QR.
-->
<style>
  .pc-wbox{position:absolute;background:#fff;box-shadow:0 2pt 8pt rgba(0,0,0,.16);box-sizing:border-box}
  .pc-steps .it{position:absolute;display:flex;align-items:flex-start}
  .pc-steps .num{position:absolute;display:flex;align-items:center;justify-content:center;font-family:var(--lg-font);font-weight:700;color:var(--lg-main-ink)}
  .pc-steps .stp{font-family:var(--lg-font);font-weight:400;color:#1b1b1b;overflow:hidden}
  .pc-disc{position:absolute;font-size:7.5pt;line-height:10pt;font-weight:500;color:var(--fx-soft);overflow:hidden;white-space:nowrap}
  .pc-ret{position:absolute;font-family:var(--lg-font);font-weight:400;font-size:8.6pt;line-height:11pt;color:var(--fx-on);overflow:hidden;height:36pt}
  .pc-ret b{font-weight:700;letter-spacing:1.4pt;text-transform:uppercase}
  .mailp{position:absolute;background:#fff}
  .cap .a{font-weight:400}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const esc = SW.esc, b = D.brand || {}, A = D.agent || {}, L = D.listing, P = D.piece || {};
  document.body.dataset.mode = D.mode || 'email';
  await SW.setup(D);
  const sold = P.card === 'sold', big = P.size === '6x11', front = P.side === 'front';
  const W = big ? 792 : 648, H = 432, k = big ? 1.12 : 1;
  const K = ((D.sw || {}).pc || {})[sold ? 'js' : 'jl'] || {};
  const hsSrc = A.headshot && ((D.photos||{})[A.headshot] ? D.photos[A.headshot].src : A.headshot) || '';
  const word = sold ? 'Just Sold' : 'Just Listed';
  const issues = [];
  const place = [FXS.hood(L), FXS.placeLine(L)].filter(Boolean).join('  ·  ').toUpperCase(), ad = String(L.address || '');
  // reversed caps never under 8.6 pt: a line that does not fit gives up tracking before it gives up size
  const capsFit = (t, w, max, wt, tracks) => { for(const ls of tracks){ const fs = FXS.fitSize(t, `font-family:Red Hat Display;font-weight:${wt};letter-spacing:${ls}pt`, w, max, 8.6); if(FXS.width(t, `font-family:Red Hat Display;font-weight:${wt};letter-spacing:${ls}pt;font-size:${fs}pt`) <= w - 12) return {fs: Math.max(8.6, fs), ls}; } return {fs: 8.6, ls: tracks[tracks.length - 1]}; };
  const placeLine = (x, y, w, al, slot, max) => { const c = capsFit(place, w, max || 9.5*k, 600, [3, 2.2, 1.4, 0.8]); return `<div class="lg-place" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${13*k}pt;font-size:${c.fs}pt;line-height:${13*k}pt;letter-spacing:${c.ls}pt;text-align:${al || 'center'}" data-slot="${slot || 'front.place'}" data-lines="1">${esc(place)}</div>`; };
  const disp = (t, x, y, w, fs, slot, al) => `<div class="lg-disp" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${fs*1.08}pt;font-size:${fs}pt;line-height:${fs*1.08}pt;letter-spacing:${Math.min(3, fs*0.05)}pt;text-align:${al || 'center'}" data-slot="${slot}" data-lines="1">${esc(t)}</div>`;
  const street = (x, y, w, max, min, slot, al) => { const fs = FXS.fitSize(ad, 'font-family:Red Hat Display;font-weight:600', w - 4, max, min); return {fs, html: `<div class="lg-street" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${fs*1.2}pt;font-size:${fs}pt;line-height:${fs*1.2}pt;text-align:${al || 'center'}" data-slot="${slot || 'front.address'}" data-lines="1">${esc(ad)}</div>`}; };
  const dispFit = (t, w, max, min) => { let f = max; while(f > min && FXS.width(t.toUpperCase(), `font-family:Red Hat Display;font-weight:700;letter-spacing:${Math.min(3, f*0.05)}pt;font-size:${f}pt`) > w - 4) f -= 0.5; return f; };
  const desT = A.designation ? (A.nar || /realtor/i.test(A.designation) ? 'REALTOR®' : A.designation) : '';
  let h = '';

  if(front){
    const F = K.front || {}, pid = FO.heroId(D, (F.cap || {}).photo || 'front'), M = FXS.MAT;
    const hls = (F.highlights || FXS.tagFacts(D).tags || []).slice(0, 3);
    // owner 11/16 (p19/p21): four highlights on the Just Listed front; the fourth is the first tagged fact that shares no word with the three
    const stopw = /^(a|an|the|and|with|of|in|on|to|for|no|new)$/i, wds = t => String(t).toLowerCase().split(/[^a-z0-9]+/).filter(w => w && !stopw.test(w));
    const hl4 = hls.slice(); for(const t of (FXS.tagFacts(D).tags || [])){ if(hl4.length >= 4) break; const used = new Set(hl4.flatMap(wds)); if(!wds(t).some(w => used.has(w) || used.has(w.replace(/s$/, '')) || used.has(w + 's'))) hl4.push(t); }
    const RH = 'font-family:Red Hat Display';
    // P13's facts column: centered lines with a short rule between them
    const stack = (items, x, y, w, h, slot, fs0) => { const fs = Math.min(...items.map(t => FXS.fitSize(t, `${RH};font-weight:600`, w - 8, fs0, 9))), n = items.length, sp = Math.min(h/n, fs*2.9), y0 = y + (h - n*sp)/2; let t = '';
      items.forEach((s, i) => { t += `<div class="abs" style="left:${x}pt;top:${y0 + i*sp + (sp - fs*1.3)/2}pt;width:${w}pt;height:${fs*1.3}pt;${RH};font-weight:600;font-size:${fs}pt;line-height:${fs*1.3}pt;color:var(--lg-on);text-align:center;white-space:nowrap" data-slot="${slot}.${i}" data-lines="1">${esc(s)}</div>`;
        if(i) t += `<div class="lg-dv" style="left:${x + w/2 - 18*k}pt;top:${y0 + i*sp}pt;width:${36*k}pt"></div>`; });
      return t; };
    const agentLine = (x, y, w, al, nsMax, phs) => { nsMax = nsMax || 15*k; phs = phs || 12*k; const ns = Math.min(nsMax, FXS.fitSize(A.name || '', `${RH};font-weight:700`, w, nsMax, 11));
      return `<div class="abs" style="left:${x}pt;top:${y}pt;width:${w}pt;text-align:${al || 'center'};white-space:nowrap">`
        + `<div style="${RH};font-weight:700;font-size:${ns}pt;line-height:${ns*1.2}pt;color:var(--lg-on)" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</div>`
        + `<div style="line-height:${phs*1.08}pt">${desT ? `<span style="${RH};font-weight:700;font-size:${Math.max(8.6*k, phs*0.66)}pt;letter-spacing:1.6pt;color:var(--lg-accent);margin-right:10pt" data-slot="agent.desig" data-lines="1">${esc(desT)}</span>` : ''}<span style="${RH};font-weight:600;font-size:${phs}pt;color:var(--lg-on)" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</span></div></div>`; };
    const paperLogo = (x, y, w, hh, just) => { const src = LG.logoPaper(D); return `<div class="abs logo" data-area="${w*hh}" data-maxh="${hh}" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${hh}pt;justify-content:${just || 'center'}">${src ? `<img src="${esc(src)}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage || '')}</span>`}</div>`; };

    if(!sold){
      // ---------- JUST LISTED: the P13 flyer as a card. The house as a print, the brokerage logo where the price was (top right) over the
      // house's real story stacked with short rules, the agent under it; the main-color band across the foot with JUST LISTED in giant 700
      // caps (the flyer's SATURDAY), a vertical hairline, the street and the place beside it. ----------
      // owner 11/16 (p19/p21): the four highlights larger and moved up, the agent larger, the brokerage logo smaller and under the agent; the
      // band's hairline sits on the photo's right edge; the street larger, the place line stays small
      const m = 22, wfs = dispFit('JUST LISTED', m + Math.round(W*0.57) + FXS.MAT - 18 - 26, 66*k, 30), BT = H - Math.round(wfs*1.08 + 2*(big ? 21 : 26)*k); let PW = Math.round(W*0.57); while(PW < W*0.68 && !SW.fits(D, pid, PW, BT - 2*m)) PW += 6;
      h += FXS.box(D, pid, m, m, PW, BT - 2*m, 'front.hero');
      const cx0 = m + PW + M + 18, cw = W - m - cx0;
      const lgH = 30*k, ns = Math.min(19*k, FXS.fitSize(A.name || '', `${RH};font-weight:700`, cw, 19*k, 12)), ph = 15*k, ah = ns*1.2 + ph*1.25, ay = BT - m - lgH - 8 - ah;
      h += stack(hl4, cx0, m - 4, cw, ay - 10 - (m - 4), 'front.hl', 15*k);
      h += `<div class="abs" style="left:${cx0}pt;top:${ay}pt;width:${cw}pt;text-align:center;white-space:nowrap">`
        + `<div style="${RH};font-weight:700;font-size:${ns}pt;line-height:${ns*1.2}pt;color:var(--lg-on)" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</div>`
        + `<div style="line-height:${ph*1.25}pt">${desT ? `<span style="${RH};font-weight:700;font-size:${9.5*k}pt;letter-spacing:1.6pt;color:var(--lg-accent);margin-right:12pt" data-slot="agent.desig" data-lines="1">${esc(desT)}</span>` : ''}<span style="${RH};font-weight:600;font-size:${ph}pt;color:var(--lg-on)" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</span></div></div>`;
      h += paperLogo(cx0, BT - m - lgH, cw, lgH, 'center');
      const word = 'JUST LISTED', rx = m + PW + M, fs = Math.min(wfs, dispFit(word, rx - 18 - 26, 66*k, 30)), y = BT + (H - BT - fs*1.08)/2;
      const used = FXS.width(word, `${RH};font-weight:700;letter-spacing:${Math.min(3, fs*0.05)}pt;font-size:${fs}pt`) + 6;
      const sx = rx + 16, sw = W - 26 - sx, st = FXS.fitSize(ad, `${RH};font-weight:700`, sw, 34*k, 12), pl = capsFit(place, sw, 9.5*k, 700, [2.4, 1.6, 1, .5]);
      const bh2 = st*1.2 + 4 + 13*k, by2 = BT + (H - BT - bh2)/2;
      h += FO.band(-9, BT, W + 18, H + 9 - BT, disp(word, 26, y, used + 4, fs, 'front.status', 'left')
        + `<div class="lg-vr" style="left:${rx}pt;top:${BT + 14*k}pt;height:${H - BT - 28*k}pt;color:var(--lg-on)"></div>`
        + `<div class="lg-street" style="left:${sx}pt;top:${by2}pt;width:${sw}pt;height:${st*1.2}pt;font-size:${st}pt;line-height:${st*1.2}pt" data-slot="front.address" data-lines="1">${esc(ad)}</div>`
        + `<div class="lg-place" style="left:${sx}pt;top:${by2 + st*1.2 + 4}pt;width:${sw}pt;height:${13*k}pt;font-size:${pl.fs}pt;line-height:${13*k}pt;letter-spacing:${pl.ls}pt" data-slot="front.place" data-lines="1">${esc(place)}</div>`);
    } else {
      // ---------- JUST SOLD, its own card: the band across the HEAD with JUST SOLD in giant caps and the street right under it; under the band
      // the house as a print on the right, laid a little over the band's edge (P13's overlap); on the left the seller question, the note on the
      // sign-in sheet's white mat (sized to its text), then who to call and the logo. ----------
      // owner 11/16 (p23/p25): JUST SOLD bigger, the street smaller (the sale is the message); the note's white box, the question and the agent larger
      const ls = dispFit('JUST SOLD', W - 52, (big ? 66 : 90)*k, 34), sts = FXS.fitSize(ad, `${RH};font-weight:700`, W - 52, 15*k, 11), bh = ls*1.08 + 4 + sts*1.2, by = Math.max((big ? 17 : 22)*k + 2, 16 + 0.14*ls), BB = Math.round(Math.max(bh + (big ? 34 : 44)*k, by + bh + 14*k));   // the caps' ink stays 0.2 in+ inside the trim
      h += FO.band(-9, -9, W + 18, BB + 9, disp('Just Sold', 26, by, W - 52, ls, 'front.status', 'left')
        + `<div class="lg-street" style="left:26pt;top:${by + ls*1.02 + 4}pt;width:${W - 52}pt;height:${sts*1.2}pt;font-size:${sts}pt;line-height:${sts*1.2}pt" data-slot="front.address" data-lines="1">${esc(ad)}</div>`);
      const m = 22, py = BB - 14; let PW = Math.round(W*0.5); while(PW < W*0.62 && !SW.fits(D, pid, PW, H - m - py)) PW += 6;
      h += `<div class="abs" style="left:0;top:0;width:0;height:0;z-index:4">${FXS.box(D, pid, W - m - PW, py, PW, H - m - py, 'front.hero', '', 8)}</div>`;
      const lx = 26, CWc = W - m - PW - 24 - lx;
      const qs = FXS.fitSize('Thinking about selling?', `${RH};font-weight:700`, CWc, 21*k, 11), q2 = FXS.width('Thinking about selling?', `${RH};font-weight:700;font-size:${qs}pt`) > CWc - 2;
      let ly = BB + 18; const ql = q2 ? ['Thinking about', 'selling?'] : ['Thinking about selling?'];
      const ns = Math.min(19*k, FXS.fitSize(A.name || '', `${RH};font-weight:700`, CWc, 19*k, 11)), ah = ns*1.2 + 15*k*1.08, lgH = 32*k, ay = H - m - lgH - 10 - ah;
      // the note: the alternate and size whose every line is full (the last 80%+), as many lines as the room holds; the mat narrows to its text
      const N2 = (F.note2 || []).slice(), nb = 13*k, iw = CWc - 2*nb, room = ay - 14 - (ly + ql.length*qs*1.2 + 8) - 2*nb;
      let nt = null; for(const lf of [.9]) for(const mm of [1, .97, .94, .91, .88, .85, .82, .79, .76]) for(let fs = big ? 16.5 : 13.5; fs >= (big ? 14.9 : 10) - 1e-6 && !nt; fs -= 0.25) N2.forEach(t => { if(nt) return; const w = iw*mm, Lw = FO.wrapLines(t, `${RH};font-weight:400;font-size:${fs}pt`, w), n = Lw.length; if(n >= 3 && Lw[n - 1] >= lf*w && Lw.slice(0, -1).every(x => x >= 0.75*w) && n*fs*1.42 <= room) nt = {t, n, fs, w}; });
      if(!nt) nt = {t: N2[0] || '', n: 5, fs: 9.5*k, w: iw};
      const nlh = nt.fs*1.42, bxw = nt.w + 2*nb, blockH = ql.length*qs*1.2 + 8 + nt.n*nlh + 2*nb; ly = BB + 10 + Math.max(0, (ay - 14 - (BB + 10) - blockH)/2);
      ql.forEach((q, i) => { h += `<div class="lg-h" style="left:${lx}pt;top:${ly}pt;width:${CWc}pt;height:${qs*1.2}pt;font-size:${qs}pt;line-height:${qs*1.2}pt;color:var(--lg-accent);white-space:nowrap" data-slot="front.cta${i ? 2 : ''}" data-lines="1">${esc(q)}</div>`; ly += qs*1.2; }); ly += 8;
      h += `<div class="pc-wbox" id="notebox" style="left:${lx}pt;top:${ly}pt;width:${bxw}pt;height:${nt.n*nlh + 2*nb}pt"></div><div class="abs" style="left:${lx + nb}pt;top:${ly + nb}pt;width:${nt.w}pt;height:${nt.n*nlh}pt;${RH};font-weight:400;font-size:${nt.fs}pt;line-height:${nlh}pt;color:#1b1b1b;text-align:justify;text-align-last:left" data-slot="front.note" data-lines="${nt.n}">${esc(nt.t)}</div>`;
      h += `<div class="lg-hair" style="left:${lx}pt;top:${ay - 8}pt;width:${CWc}pt"></div>` + agentLine(lx, ay, CWc, 'left', 19*k, 15*k) + paperLogo(lx, H - m - lgH, CWc, lgH, 'flex-start');
    }
  } else {
    // ---------------- BACK (the owner 11/16: the design runs through the whole card; the mail zones are small white markups) ----------------
    // Logo Grid: the main-color band runs edge to edge across the head (the status and the full street in it, the return address and the
    // postage markup set into it), down the mail side (the address block's markup set into it) and edge to edge across the foot (the contact
    // row and the barcode markup). The paper shows only in the window it frames: prints in their mats (Just Listed) or the six steps on the
    // sign-in sheet's white mat (Just Sold).
    const dx = W - 648, X = 30, B = K.back || {}, RHb = 'font-family:Red Hat Display';
    const Z = {postage: [552 + dx, 12, 84, 98.25], address: [405 + dx, 187.5, 240, 112.5], barcode: [306 + dx, 387, 342, 45]};
    window.__zones = Z; window.__cardX = X;
    const mk = (z, m, ext) => `<div class="mailp" data-mail-panel="1" style="left:${z[0] - m}pt;top:${z[1] - m}pt;width:${z[2] + 2*m + (ext || 0)}pt;height:${z[3] + 2*m + (ext || 0)}pt"></div>`;
    const RX = Z.address[0] - 14, TB = 126, FB = 330, rw = Z.postage[0] - 14 - Z.address[0];
    let band = '';
    // the head: the status in gold caps, the full street in white 700, the place; the return address beside the postage markup
    const ret = [b.brokerage || ''].concat([].concat(b.returnAddress || b.address || []).flatMap(a => String(a).split('\n'))).filter(Boolean).slice(0, 3);
    band += `<div class="pc-ret" data-small="1" data-fine="1" data-slot="back.return" style="left:${Z.address[0]}pt;top:${Z.postage[1] + 6}pt;width:${rw}pt;text-align:right"><b>${esc(ret[0] || '')}</b>${ret.slice(1).map(t => '<br>' + esc(t)).join('')}</div>`;
    const hw = Z.address[0] - 26 - 20;
    if(!sold && !big){
      const sts = FXS.fitSize(ad, `${RHb};font-weight:700`, hw, 30*k, 15), hbh = 13 + 6 + sts*1.15 + 4 + 13, hy = (TB - hbh)/2;
      band += `<div class="lg-place" style="left:26pt;top:${hy}pt;width:${hw}pt;height:13pt;font-size:${10*k}pt;line-height:13pt;letter-spacing:3.4pt" data-slot="back.status" data-lines="1">${esc(word.toUpperCase())}</div>`;
      band += `<div class="lg-street" style="left:26pt;top:${hy + 19}pt;width:${hw}pt;height:${sts*1.15}pt;font-size:${sts}pt;line-height:${sts*1.15}pt" data-slot="back.street" data-lines="1">${esc(ad)}</div>`;
      { const c = capsFit(place, hw, 9*k, 700, [2.4, 1.6, 1, .5]); band += `<div class="lg-place" style="left:26pt;top:${hy + 19 + sts*1.15 + 4}pt;width:${hw}pt;height:13pt;font-size:${c.fs}pt;line-height:13pt;letter-spacing:${c.ls}pt;color:var(--lg-soft)" data-slot="back.place" data-lines="1">${esc(place)}</div>`; }
    } else {
      // owner 11/16: the 6x11 Just Listed back (p22) takes a bigger status and a bigger street to use the wider card; the Just Sold backs
      // (p24/p26) a bigger JUST SOLD over a smaller street (the sale is the message)
      const top = 24, bot = TB - 12, sts = FXS.fitSize(ad, `${RHb};font-weight:700`, Math.min(hw, Z.postage[0] - 160 - 26), (sold ? 18 : 36)*k, 13);
      const S = Math.min(dispFit(word.toUpperCase(), hw, (sold ? 52 : 40)*k, 18), (bot - top - sts*1.15 - 4 - 13 - 6)/1.04);
      const used = S*1.04 + 4 + sts*1.15 + 4 + 13; let y = Math.max(16 + 0.14*S, top - 7 + Math.max(0, (bot - top + 7 - used)/2));
      band += disp(word, 26, y, hw, S, 'back.status', 'left').replace('class="lg-disp" style="', 'class="lg-disp" style="color:var(--lg-gold);'); y += S*1.04 + 4;
      band += `<div class="lg-street" style="left:26pt;top:${y}pt;width:${hw}pt;height:${sts*1.15}pt;font-size:${sts}pt;line-height:${sts*1.15}pt" data-slot="back.street" data-lines="1">${esc(ad)}</div>`; y += sts*1.15 + 4;
      { const c = capsFit(place, hw, 9*k, 700, [2.4, 1.6, 1, .5]); band += `<div class="lg-place" style="left:26pt;top:${y}pt;width:${hw}pt;height:13pt;font-size:${c.fs}pt;line-height:13pt;letter-spacing:${c.ls}pt;color:var(--lg-soft)" data-slot="back.place" data-lines="1">${esc(place)}</div>`; }
    }
    // the mail side, between the postage box and the address block, on the band: the facts (Just Listed) or the seller question (Just Sold)
    // owner 11/16 (p20/p22/p24/p26): the paper window runs on to the right edge, so the mail side sits on the paper too; the facts move onto
    // it in the main color; the seller question is set apart on a main-color tab (white question, gold line)
    let paper = '';
    { const sx = Z.address[0] - 6, sw = W - 16 - sx, y1 = TB - 1, room = Z.address[1] - 6 - 10 - y1;   // the tabs hang flush from the head band
      if(!sold){ const it = FXS.statItems(L).map(FO.factText), l1 = it.slice(0, 2).join('  ·  '), l2 = it.slice(2).join('  ·  '), px = 12;
        // the facts on the same main-color tab as the Just Sold seller question: white first line, gold second (the paper stays a frame, never a blank half)
        const tw = W - sx - 2*px, fz = Math.min((room - 16)/2.7, ...[l1, l2].filter(Boolean).map(t => FXS.fitSize(t, `${RHb};font-weight:600`, tw, 13*k, 8.6))), th = room, ty = y1, pad = (room - 2*fz*1.35)/2;
        paper += `<div class="lg-bandbg" id="factstab" style="left:${sx}pt;top:${ty}pt;width:${W + 9 - sx}pt;height:${th}pt"></div><div class="lg-band">`;
        [l1, l2].forEach((t, i) => { if(!t) return; paper += `<div class="abs" style="left:${sx + px}pt;top:${ty + pad + i*fz*1.35}pt;width:${tw}pt;height:${fz*1.35}pt;${RHb};font-weight:600;font-size:${fz}pt;line-height:${fz*1.35}pt;color:${i ? 'var(--lg-gold)' : 'var(--lg-on-main)'};text-align:center;white-space:nowrap" data-slot="back.facts${i}" data-lines="1">${esc(t)}</div>`; });

    band += ContactCard.html([X, cardY, W - 2*X, cardH], Object.assign({}, A, {headshot: hsSrc}), Object.assign({}, b, {logo: LG.logoSrc(D)}), {postcard: true, fine: '', bottomGap: 0.5, grow: 0, fieldAccent: true, s: {inlineLabel: true, desigInline: true, pad: [3, 12, 3], hsGap: 10, hsW: 34, name: 15, nameFloor: 12, phone: 12, label: 8.6, line: 8.6, rowGap: 10, panelW: 150, panelPad: [2, 6], panelGap: 2, office: 8.6, officeLH: 1.05, logo: {wide: [118, 24], square: [24, 24], tall: [26, 26]}}});
    band += `<div class="pc-disc" id="pcdisc" style="left:${X}pt;top:394pt;width:${Z.barcode[0] - 16 - X}pt;height:20pt" data-slot="back.fine" data-lines="2" data-fine="1"><div>Information deemed reliable but not guaranteed.</div><div>Not intended to solicit property listed with a broker.</div></div>`;
    h += `<div class="lg-bandbg" style="left:-9pt;top:-9pt;width:${W + 18}pt;height:${TB + 9}pt"></div><div class="abs" data-fade="1" style="left:${W/2 - 40}pt;top:${TB}pt;width:${W + 9 - (W/2 - 40)}pt;height:${FB - TB}pt;background:linear-gradient(to right, var(--lg-paper), var(--fx-taupe-d) 55%, var(--fx-taupe-d))"></div><div class="lg-bandbg" id="footband" style="left:-9pt;top:${FB}pt;width:${W + 18}pt;height:${H + 9 - FB}pt"></div>`;
    h += mk(Z.postage, 4) + mk(Z.address, 6) + `<div class="mailp" data-mail-panel="1" style="left:${Z.barcode[0] - 4}pt;top:${Z.barcode[1] - 4}pt;width:${Z.barcode[2] + 13}pt;height:${Z.barcode[3] + 13}pt"></div>`;
    h += `<div class="lg-band">${band}</div>` + paper;
    const CL = big ? 14 : 12.5, fsC = big ? 10.75 : 9.5, M = FXS.MAT;
    if(!sold){
      // two prints in their mats in the paper window, each named and captioned
      const ps = (B.photos || []).slice(0, 2), g = 26, Lc = 3, x0 = 24, x1 = RX - 18, capTop = FB - 10 - Lc*CL, PB = capTop - 18 - 7 - M, PT = TB + 20, pw = (x1 - x0 - g)/2;

        h += `<div class="abs cap"><div class="a" style="position:absolute;left:${x}pt;top:${capTop}pt;width:${pw}pt;height:${Lc*CL}pt;font-size:${fsC}pt;line-height:${CL}pt" data-slot="back.photo${i}" data-room="${esc(L0.name)}" data-lh="${CL}" data-hbox="${Lc*CL}" data-lines="${Lc}" data-min="3" data-narrow="0" data-nopair="1" ${FXS.sd(cc.s)}></div></div>`; });

      h += `<div class="pc-steps" id="stepslist" data-x="${bx + 16}" data-y="${by + 28}" data-w="${bw - 32}" data-b="${by + bh - 24}">${steps.map((e, i) => `<div class="it" data-i="${i}"><div class="lg-dmo" style="left:0;top:0;width:12pt;height:12pt;border:0"></div><div class="num" style="left:-4pt;top:-4pt;width:20pt;height:20pt;font-size:${10*k}pt">${i + 1}</div><div class="stp" data-slot="back.step${i}" data-lines="2" data-fine="1">${esc([].concat(e)[0])}</div></div>`).join('')}</div>`;

    if((D.mode || 'email') !== 'print'){
      const gb = (z, extra) => `left:${z[0]}pt;top:${z[1]}pt;width:${z[2]}pt;height:${z[3]}pt;${extra||''}`;

        <div class="mg mg-addr" style="${gb(Z.address)}">${[0,1,2,3].map(i => `<div class="aline" style="left:12pt;right:12pt;top:${28 + i*17.25}pt"></div>`).join('')}<div class="gl" style="left:12pt;bottom:9pt">Address block · filled by the mail vendor</div></div>
        <div class="mg mg-bar" style="${gb(Z.barcode)}"><div class="gl" style="left:0;right:0;top:50%;text-align:center;transform:translateY(-50%)">Barcode strip · keep clear</div></div>`;
    }
  }

  const f = SW.frame(D, W, H, h);
  document.getElementById('pages').innerHTML = f.html;
  window.pieceSize = {W: f.W, H: f.H, bleed: f.bleed};
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  document.querySelectorAll('.cap .a[data-s]').forEach(el => { el.dataset.fill = 0.9; el.dataset.lfill = 0.82; el.dataset.min = Math.max(3, +el.dataset.min || 0); el.dataset.j3 = '1'; });
  SW.fill();
  FO.refit();
  FO.just3();
  FO.gaps();
  if(!front && sold) fitSteps();
  if(front){ const lock = document.getElementById('lock'); if(lock){ const t0 = +lock.dataset.top, room = +lock.dataset.foot - t0, used = +lock.dataset.bottom; lock.style.top = (t0 + Math.max(0, (room - used)/2)) + 'pt'; }
    const lk = document.getElementById('lockL'); if(lk){ /* the left column of the Just Sold front sits centered between the photo's shoulder and the foot */ } }
  SW.fitLogos();
  ContactCard.fit(document);
  if(!front) fitDisc();
  if(!front) LG.brkCenter('#footband');
  issues.push(...SW.focus(D));
  if(!front){ issues.push(...mailCheck(), ...panelCheck(), ...backCheck()); }
  window.brochureCheck = () => SW.check(D, issues);
  window.photoPlacements = SW.placements;

  function fitDisc(){ const el = document.getElementById('pcdisc'); if(!el) return; let fs = 8;
    const ok = () => [...el.children].every(c => { const r = document.createRange(); r.selectNodeContents(c); return r.getBoundingClientRect().width <= el.clientWidth; });
    for(; fs > 7.5; fs -= .25){ el.style.fontSize = fs + 'pt'; if(ok()) break; }
    el.style.fontSize = Math.max(7.5, fs) + 'pt'; }
  // the six steps: the largest size (12 pt down to 8.6) at which each sets in two lines or fewer inside the box, then the rows spread to fill it
  function fitSteps(){ const L = document.getElementById('stepslist'); if(!L) return; const x = +L.dataset.x, y0 = +L.dataset.y, w = +L.dataset.w, yB = +L.dataset.b, its = [...L.querySelectorAll('.it')], tx = 22;
    let best = null;
    for(let fs = 12*k + (big ? 1 : 0); fs >= 8.6 - 1e-6; fs -= 0.2){ const lh = fs*1.3; let tot = 0; const ns = its.map(it => { const s = it.querySelector('.stp'); s.style.cssText = `position:absolute;left:${tx}pt;top:0;width:${w - tx}pt;font-size:${fs}pt;line-height:${lh}pt`; const n = SW.lines(s).n; tot += n*lh; return n; });
      if(ns.every(n => n <= 2) && tot + (its.length - 1)*3 <= yB - y0){ best = {fs, lh, ns, tot}; break; } }
    if(!best) best = {fs: 8.6, lh: 11.2, ns: its.map(() => 2), tot: its.length*22.4};
    const gap = Math.min(14, (yB - y0 - best.tot)/(its.length - 1)); let y = y0;
    its.forEach((it, i) => { const s = it.querySelector('.stp'), n = best.ns[i]; s.style.fontSize = best.fs + 'pt'; s.style.lineHeight = best.lh + 'pt'; s.style.height = (n*best.lh) + 'pt'; s.dataset.lines = n;
      it.style.left = x + 'pt'; it.style.top = y + 'pt'; it.style.width = w + 'pt'; it.style.height = (n*best.lh) + 'pt';
      const dm = it.querySelector('.lg-dmo'), nm = it.querySelector('.num'), cy = best.lh/2; dm.style.top = (cy - 6) + 'pt'; dm.style.left = '1pt'; nm.style.top = (cy - 10) + 'pt'; nm.style.left = '-3pt';
      y += n*best.lh + gap; });
    const box = document.getElementById('stepsbox'), call = document.getElementById('jscall'); const used = y - gap - (y0 - 28) + 12 + 22;
    if(box && used < +box.dataset.bh - 2){ const bh = used; box.style.height = bh + 'pt'; if(call) call.style.top = (parseFloat(box.style.top) + bh - 20) + 'pt'; } }
  function backCheck(){ const out = [], pt = v => v*72/96, sh = document.querySelector('.sheet').getBoundingClientRect(), X0 = window.__cardX || 30;
    const cc = document.querySelector('.sheet .cc');

    else { const r = cc.getBoundingClientRect(), l = pt(r.left - sh.left), rr = pt(r.right - sh.left), Wt = pt(sh.width) - 18;
      if(l > X0 + 1 || rr < Wt - X0 - 1) out.push({slot: 'back.card', kind: 'card-not-full-width', detail: `card spans ${l.toFixed(0)}-${rr.toFixed(0)} pt of ${Wt.toFixed(0)}`}); }
    let area = 0; document.querySelectorAll('.sheet [data-mail-panel]').forEach(el => { const r = el.getBoundingClientRect(); const w = Math.min(pt(r.right - sh.left) - 9, pt(sh.width) - 18) - Math.max(pt(r.left - sh.left) - 9, 0), hh = Math.min(pt(r.bottom - sh.top) - 9, 432) - Math.max(pt(r.top - sh.top) - 9, 0); area += Math.max(0, w)*Math.max(0, hh); });

})();
