<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · fxs-23 postcards</title>
<link rel="stylesheet" href="fxs23.css">
<script src="fxs23.js"></script>
<script src="../engine/baths.js"></script>
<script src="../engine/agentcard.js"></script>
<!--
  BrochureDesk · fxs-23 · Just Listed and Just Sold postcards.
  data.piece.card = "listed" | "sold", data.piece.size = "6x11" (trim 792 x 432 pt) | "6x9" (648 x 432 pt), data.piece.side = "front" | "back".
  Print adds 0.125 in (9 pt) bleed. The agent's brand color (brand.accent) is the field on both sides; boxes are white.
  Front: the whole house (roof to steps) on the right with a one-line-or-two caption and a white box under it, the status stacked large on the left over the address,
  the fact rows and the brokerage logo (Just Listed) or the agent's name and number and the logo (Just Sold). No price, no QR.
  Back: status line, interior photos with captions, a white box (the write-up, or the steps), the standard contact card (templates/_shared/agentcard.js,
  band preset, which carries the back's one logo), the fine print. The right 289.5 pt (4.02 in) is the mail vendor's: return address, postage and address
  zones; drawn as guides on proofs and left clear in print.
  Copy comes from data.sw.pc.{jl|js}.{front|back} as a lead plus whole sentences; fxs23.js picks the sentences that fill each box.
-->
<style>
  /* the FX23 hand on a postcard: warm white card, vertical address, gold underlined labels, Cormorant italic, hairlines; tokens in fxs23-tokens.css */
  .bk-frame{position:absolute;border:.75pt solid var(--fx-accent);pointer-events:none}
  .bk-frame2{position:absolute;border:.5pt solid var(--fx-rule);pointer-events:none}
  .pc-col{position:absolute;display:flex;flex-direction:column}
  .pc-wbox{background:transparent;border:var(--fx-rule-w) solid var(--fx-rule-hard);color:var(--fx-ink);padding:10pt 14pt 9pt;display:flex;flex-direction:column;overflow:hidden}
  .pc-wbox .k{font:var(--fx-label-w) 8.5pt/11pt var(--fx-font);letter-spacing:var(--fx-label-track);text-transform:uppercase;color:var(--fx-accent);white-space:nowrap;overflow:hidden;margin-bottom:3pt;text-decoration:underline;text-decoration-thickness:.75pt;text-underline-offset:3pt;align-self:flex-start}
  .pc-wbox .p{font-family:var(--fx-font);font-weight:300;font-style:normal;overflow:hidden;color:var(--fx-text)}
  .cap.ser .a{font:italic 400 13pt/15.5pt var(--fx-serif);color:var(--fx-ink)}
  .pc-wbox .p b{font-weight:700;color:var(--fx-ink)}
  .pc-bstatus{position:absolute;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
  .pc-bstatus .st{font:400 24pt/1 var(--fx-script);color:var(--fx-accent)}
  .pc-bstatus .ln{flex:1;height:var(--fx-rule-w);background:var(--fx-rule);margin:0 10pt;min-width:16pt}
  .pc-bstatus .ad{font:600 12pt/1 var(--fx-display);letter-spacing:.8pt;color:var(--fx-ink)}
  .pc-steps .it{display:flex;gap:8pt;align-items:baseline;white-space:nowrap;overflow:hidden}
  .pc-steps .bx{width:4pt;height:4pt;border-radius:50%;background:var(--fx-accent);flex:none;transform:translateY(-1pt)}
  .pc-call{font:500 11pt/15pt var(--fx-font);color:var(--fx-accent);white-space:nowrap;overflow:hidden}
  .pc-disc{position:absolute;font-size:6pt;line-height:10pt;color:var(--fx-mute);overflow:hidden;white-space:nowrap}
  .pc-ret{position:absolute;font:500 9pt/11pt var(--fx-font);letter-spacing:.2pt;color:var(--fx-text);overflow:hidden;height:34pt}
  .pc-ret b{font-weight:700;letter-spacing:1.4pt;text-transform:uppercase;color:var(--fx-ink)}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const esc = SW.esc, b = D.brand || {}, A = D.agent || {}, L = D.listing, P = D.piece || {};
  document.body.dataset.mode = D.mode || 'email';
  await SW.setup(D);
  const sold = P.card === 'sold', big = P.size === '6x11', front = P.side === 'front';
  const W = big ? 792 : 648, H = 432;
  const K = ((D.sw || {}).pc || {})[sold ? 'js' : 'jl'] || {};
  const hsSrc = A.headshot && ((D.photos||{})[A.headshot] ? D.photos[A.headshot].src : A.headshot) || '';
  const statusWord = sold ? 'Just Sold' : 'Just Listed';
  const issues = [];
  const logo = (cls, src, area, maxh, style) => `<div class="logo ${cls}" data-area="${area}" data-maxh="${maxh}" style="${style||''}">${src ? `<img src="${esc(src)}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage||'')}</span>`}</div>`;
  const CL = big ? 13.5 : 12.5, CF = big ? 'font-size:10.9pt;line-height:13.5pt;' : '';   // the 6x11 sets its type up from the 6x9 (11 pt against 9.5), not the same size with more room
  const cap = (c, slot, lines, extra) => `<div class="cap" style="height:${5 + lines*CL}pt;${extra||''}"><div class="a" data-slot="${slot}" data-narrow="30" data-nstep="3" data-lh="${CL}" data-lines="${lines}" data-lead="${esc(c.lead||'')}" data-s='${esc(JSON.stringify([].concat(c.s||[]))).replace(/'/g,'&#39;')}' style="height:${lines*CL}pt;${CF}"></div></div>`;
  let h = '';
  // owner 11/8: the J of a script "Just" headline shows in full. The swash runs left of the type's origin and below its line: measure the ink, pad the left, fit the
  // size to the width that is left and make the box tall enough for the descender.
  const sInk = (t, s) => { const c = (sInk.c || (sInk.c = document.createElement('canvas').getContext('2d'))); c.font = `400 ${s}pt 'Pinyon Script'`; const m = c.measureText(t);
    return {left: Math.max(0, m.actualBoundingBoxLeft*.75), inkW: (m.actualBoundingBoxLeft + m.actualBoundingBoxRight)*.75, asc: m.actualBoundingBoxAscent*.75, desc: m.actualBoundingBoxDescent*.75, fa: m.fontBoundingBoxAscent*.75, fd: m.fontBoundingBoxDescent*.75}; };
  const scriptFit = (t, w, max, min, lhR) => { let s = max; for(; s > min; s -= .5){ const k = sInk(t, s); if(k.inkW + 6 <= w) break; }   // the whole ink, swashes and all, inside the column
    const k = sInk(t, s), lh = s*(lhR || 1.2), base = (lh - (k.fa + k.fd))/2 + k.fa, h = Math.max(lh, base + k.desc + 2);
    return {s, pad: k.left + 2, lh, h, inkTop: base - k.asc, inkBot: base + k.desc}; };

  if(front){
    // The FX23 hand on a postcard front. JL: the whole house runs off the top, left and bottom of the card with its caption under it (opens "Front."), "Just Listed" in
    // gold script and the horizontal address beside it, three facts, the agent and logo along the foot. JS sells the agent: the house sits in the right column with the
    // agent's note under it, "Just Sold" in the same script, the agent's name and phone big on the left, the logo at the foot.
    // owner 11/8: the Just Listed front gives the photo's room to a bigger write-up
    const M = 24, F = K.front || {}; let hh = sold ? (big ? 298 : 296) : (big ? 266 : 258); const hw = sold ? (big ? 400 : 330) : (big ? 480 : 380);
    while(hh > 220 && !SW.fits(D, F.cap.photo, hw + 9, hh + 9)) hh -= 6;
    const statusMax = big ? 60 : 54;
    const draws = list => { const w = x => /gated|roof|pergola|deck|park|garage|island|stone|corner|pool/i.test([].concat(x)[0]) ? 0 : 1; return (list || []).map((x, i) => [w(x), i, x]).sort((p, q) => p[0] - q[0] || p[1] - q[1]).map(t => t[2]); };
    const capC = sold ? {lead: '', s: (F.note || {}).s || (F.cap || {}).s} : (F.caption ? {lead: F.caption.lead, s: F.caption.s.concat(draws((F.about || {}).s))} : {lead: 'Front.', s: draws((F.about || {}).s || (F.cap || {}).s)});   // owner 11/8: the house's own sentences after the caption, so the write-up fills its bigger box
    const norm = x => String(x).toLowerCase().replace(/[^a-z0-9 ]/g, '').slice(0, 40), allAlts = list => [].concat(...(list || []).map(x => [].concat(x)));
    const backSet = new Set([].concat(allAlts(((K.back || {}).about || {}).s), ...((K.back || {}).photos || []).map(c => allAlts(c.s)), allAlts((K.back || {}).steps6), allAlts((K.back || {}).steps)).map(norm));
    if(capC.s){ const kept = capC.s.filter(x => ![].concat(x).some(a => backSet.has(norm(a)))); if(kept.length >= 2) capC.s = kept; }
    const roomIds = [...new Set([].concat(((D.sw||{}).back||{}).photos||[], ((D.sw||{}).left||{}).photos||[]).map(c => c.photo))].filter(id => (D.photos||{})[id] && !(D.photos[id]||{}).fullHouse && id !== F.cap.photo).slice(0, 2);
    const capLines = sold ? 3 : (big ? 4 : 5), capLH = sold ? (big ? 13.5 : 12.5) : (big ? 15 : 14), capFs = sold ? (big ? 10.5 : 9.5) : (big ? 11.5 : 10.5), capHt = 5 + capLines*capLH;
    const capSty = (c, slot, lines, extra) => `<div class="cap" style="height:${5 + lines*capLH}pt;${extra||''}"><div class="a" data-slot="${slot}" data-narrow="30" data-nstep="3" data-lh="${capLH}" data-lines="${lines}" data-lead="${esc(c.lead||'')}" data-s='${esc(JSON.stringify([].concat(c.s||[]))).replace(/'/g,'&#39;')}' style="height:${lines*capLH}pt;font-size:${capFs}pt;line-height:${capLH}pt"></div></div>`;
    const heroX = sold ? W - hw : -9, boxW = hw + 9, heroFits = SW.fits(D, F.cap.photo, boxW, hh + 9);
    h += heroFits ? FXS.box(D, F.cap.photo, heroX, -9, boxW, hh + 9, 'front.hero') : SW.heroHtml(D, F.cap.photo, heroX, -9, boxW, hh + 9, 'front.hero', F.side || roomIds);
    h += `<div class="gold" style="left:${heroX}pt;top:${hh}pt;width:${boxW}pt"></div>`;
    const capX = sold ? heroX + 14 : M, capW = sold ? hw - 14 - M : hw - M - 14;
    h += capSty(capC, 'front.hero', capLines, `position:absolute;left:${capX}pt;top:${hh + 8}pt;width:${capW}pt;padding-top:0`);
    if(!sold){
      const cx0 = hw + 22, cw = W - M - cx0, colTop = 18;
      const sf = scriptFit('Just Listed', cw, statusMax, 36), sstat = sf.s;
      h += `<div class="abs script" style="left:${cx0}pt;top:${colTop}pt;width:${cw}pt;height:${sf.h}pt;font-size:${sstat}pt;line-height:${sf.lh}pt;padding-left:${sf.pad}pt;overflow:visible;box-sizing:border-box" data-slot="front.status" data-lines="1">Just Listed</div>`;
      const addrT = (((SW.data().listing || {}).address) || L.address).toUpperCase(), aMax = big ? 30 : 27, aCss = `font-family:'Cormorant Garamond';font-weight:600;letter-spacing:.8pt`;
      const oneL = FXS.width(addrT, `${aCss};font-size:${aMax - 6}pt`) <= cw, mm = addrT.match(/^(\S+)\s+(.+)$/), parts = oneL || !mm ? [addrT] : [mm[1], mm[2]], aS = Math.min(aMax, ...parts.map(p => FXS.fitSize(p, aCss, cw, aMax, 18)));
      const aTop = colTop + Math.max(sf.lh, sf.inkBot + 6) + 4;
      h += `<div class="abs ttl" style="left:${cx0}pt;top:${aTop}pt;width:${cw}pt;height:${parts.length*aS*1.15}pt;white-space:normal;letter-spacing:.8pt;font:600 ${aS}pt/${aS*1.15}pt var(--fx-display);letter-spacing:.8pt" data-slot="front.address" data-lines="${parts.length}">${parts.map(esc).join('<br>')}</div>`;
      const py = aTop + parts.length*aS*1.15 + 3;
      h += FXS.capsLine(`${FXS.hood(L) ? FXS.hood(L) + ' · ' : ''}${L.city}, ${L.state}`, cx0, py, cw, 8.6, 1.2, 'var(--fx-accent)', 'front.place');
      const lotT = L.lotSize ? String(L.lotSize).replace(/ (?=[A-Za-z])/g, '\u00a0') : (L.stories ? `${L.stories} Stories` : ''), facts = FXS.statItems(L).slice(0, 4).concat(lotT ? [lotT] : []), fy = py + 22, fb = hh + 8 + capHt + 2, fh = Math.min(44, (fb - fy)/facts.length);   // beds, baths, sq ft, built and lot (or stories): the column runs down to the photo's foot
      facts.forEach((t, i) => { h += `<div class="abs hr" style="left:${cx0}pt;top:${fy + i*fh}pt;width:${cw}pt"></div><div class="abs" style="left:${cx0}pt;top:${fy + i*fh + (fh - 22)/2}pt;width:${cw}pt;height:24pt;line-height:30pt;display:flex;align-items:baseline;white-space:nowrap" data-slot="fact.${i}" data-lines="1">${FXS.statHtml(t, big ? 21 : 19, 8, 1.4)}</div>`; });
      h += `<div class="abs hr" style="left:${cx0}pt;top:${fy + facts.length*fh}pt;width:${cw}pt"></div>`;
      const foot = capTopOf(); 
      function capTopOf(){ return hh + 8 + capHt + 14; }
      h += `<div class="abs hr" style="left:${M}pt;top:${foot - 6}pt;width:${W - 2*M}pt"></div>`;
      // owner 11/8: the agent and the brokerage are smaller on the Just Listed front; the house gets the room
      const fh0 = (big ? 21 : 19)*1.25 + 15, fTop = foot + Math.max(2, (H - 22 - foot - fh0)/2);
      h += `<div class="abs agentline" style="left:${M}pt;top:${fTop}pt;width:320pt"><div class="n" style="font:500 ${big ? 21 : 19}pt/${(big ? 21 : 19)*1.25}pt var(--fx-display)" data-slot="agent.name" data-lines="1">${esc(A.name||'')}</div><div class="p" style="font-size:${big ? 12 : 11}pt;line-height:15pt" data-slot="agent.phone" data-lines="1">${esc(A.phone||'')}</div></div>`;
      h += FXS.logo(D, W - M - 150, fTop + (fh0 - 38)/2, 150, 38, 'flex-end');
    } else {
      const cx0 = M, cw = heroX - 22 - cx0, colTop = 20;
      const sfj = scriptFit('Just Sold', cw, big ? 92 : 80, 40), sJS = sfj.s;   // owner 11/7: Just Sold is always bigger than the agent info; owner 11/8: the J shows in full
      h += `<div class="abs script" style="left:${cx0}pt;top:${colTop}pt;width:${cw}pt;height:${sfj.h}pt;font-size:${sJS}pt;line-height:${sfj.lh}pt;padding-left:${sfj.pad}pt;overflow:visible;box-sizing:border-box" data-slot="front.status" data-lines="1">Just Sold</div>`;
      const ns = FXS.fitSize(A.name || '', "font-family:'Cormorant Garamond';font-weight:500", cw, big ? 32 : 28, 20), ps = FXS.fitSize(A.phone || '', "font-family:Montserrat;font-weight:500;letter-spacing:.7pt", cw, big ? 18 : 16, 12);
      const nTop = colTop + Math.max(sfj.lh, sfj.inkBot + 8) + 4;
      h += `<div class="abs agentline" style="left:${cx0}pt;top:${nTop}pt;width:${cw}pt"><div class="n" style="font:500 ${ns}pt/${ns*1.12}pt var(--fx-display)" data-slot="agent.name" data-lines="1">${esc(A.name||'')}</div><div class="d" style="margin-top:2pt" data-slot="agent.desig" data-lines="1" data-fine="1">REALTOR®</div><div class="p" style="font:500 ${ps}pt/${ps*1.2}pt var(--fx-font);letter-spacing:.7pt;margin-top:8pt" data-slot="agent.phone" data-lines="1">${esc(A.phone||'')}</div></div>`;
      const sy0 = nTop + ns*1.12 + 13 + 8 + ps*1.2 + 16, ruleY0 = hh + 8 + capHt + 4, ex = Math.max(0, ruleY0 - 12 - (sy0 + 12 + 24 + 24 + 52)), sy = sy0 + ex*0.35;   // the column's slack is spread between the blocks, so the left column fills down to the rule
      h += `<div class="abs hr" style="left:${cx0}pt;top:${sy}pt;width:${cw}pt"></div>`;
      const addrT = (((SW.data().listing || {}).address) || L.address).toUpperCase(), st = FXS.fitSize(addrT, "font-family:'Cormorant Garamond';font-weight:600;letter-spacing:.8pt", cw, big ? 28 : 24, 16);
      h += `<div class="abs ttl" style="left:${cx0}pt;top:${sy + 12}pt;width:${cw}pt;height:${st*1.2}pt;font:600 ${st}pt/${st*1.2}pt var(--fx-display);letter-spacing:.8pt" data-slot="front.address" data-lines="1">${esc(addrT)}</div>`;
      h += FXS.capsLine(`${FXS.hood(L) ? FXS.hood(L) + ' · ' : ''}${L.city}, ${L.state}`, cx0, sy + 12 + st*1.2 + 2, cw, 8.6, 1.2, 'var(--fx-accent)', 'front.place');
      // no house features on a Just Sold card (owner 11/7): the seller's call to action stands where the facts row was
      const ctaH = (D.companion || {}).justSold ? (D.companion.justSold.ctaHead || 'Thinking about selling?') : 'Thinking about selling?', ctaL = (K.back || {}).call || 'Call or text me anytime.', cS = FXS.fitSize(ctaH, "font-family:'Cormorant Garamond';font-weight:600", cw, big ? 30 : 25, 18), cy = sy + 12 + st*1.2 + 26 + ex*0.45;
      h += `<div class="abs" style="left:${cx0}pt;top:${cy}pt;width:${cw}pt;height:${cS*1.2}pt;font:600 ${cS}pt/${cS*1.2}pt var(--fx-display);color:#fff;white-space:nowrap" data-slot="front.cta" data-lines="1">${esc(ctaH)}</div><div class="abs" style="left:${cx0}pt;top:${cy + cS*1.2 + 2}pt;width:${cw}pt;height:16pt;font:500 ${big ? 12 : 11}pt/16pt var(--fx-font);color:var(--fx-accent);white-space:nowrap" data-slot="front.call" data-lines="1">${esc(ctaL)}</div>`;
      const capBottom = hh + 8 + capHt;
      h += `<div class="abs hr" style="left:${M}pt;top:${capBottom + 4}pt;width:${W - 2*M}pt"></div>`;
      h += FXS.logo(D, M, capBottom + 12, 190, Math.min(54, H - capBottom - 12 - 18), 'flex-start');
    }
    // the set's gold frame, out near the edge (12 pt from the trim), drawn over the full-bleed photo
    h += `<div class="bk-frame" style="left:12pt;top:12pt;width:${W - 24}pt;height:${H - 24}pt"></div><div class="bk-frame2" style="left:15.5pt;top:15.5pt;width:${W - 31}pt;height:${H - 31}pt"></div>`;
  } else {
    // ---------------- BACK (round 2d, the owner 10/29: the navy runs across the whole back; mail zones as in the Just Listed library, scaled to pt) ----------------
    // zones (pt, trim coordinates): postage 84 x 98.25 top right, address block 240 x 112.5, barcode strip 342 x 45 bottom right, all clear of art and type
    const dx = W - 648, X = 30, G = 10, B = K.back || {};
    const Z = {postage: [552 + dx, 12, 84, 98.25], address: [405 + dx, 187.5, 240, 112.5], barcode: [306 + dx, 387, 342, 45]};
    window.__zones = Z; window.__cardX = 40;
    // owner 11/7: the black field and the gold run to every edge of the card; only the postage box, the address block and the barcode strip sit on light panels (luminance 244)
    const PBG = '#f4f1ea', pnl = (x, y, w, hh) => `<div class="abs mailp" data-mail-panel="1" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${hh}pt;background:${PBG}"></div>`;
    h += pnl(Z.postage[0] - 6, -9, W + 9 - (Z.postage[0] - 6), Z.postage[1] + Z.postage[3] + 6 + 9);
    h += pnl(Z.address[0] - 6, Z.address[1] - 6, W + 9 - (Z.address[0] - 6), 301 - (Z.address[1] - 6));
    h += pnl(Z.barcode[0] - 8, 386.5, W + 9 - (Z.barcode[0] - 8), H - 386.5 + 9);
    const rx = Z.address[0], lw = rx - G - X;          // right column starts at the address block's left edge; the left zone is everything left of it
    const rw = Z.postage[0] - 12 - rx;                 // the photo under the return address: left of the postage box
    const short = String(L.address||'').replace(/\s+(street|st\.?|avenue|ave\.?|drive|dr\.?|road|rd\.?|lane|ln\.?|boulevard|blvd\.?|court|ct\.?|way|place|pl\.?)$/i, '');
    const bsf = sInk(statusWord, 24), bsW = lw;   // owner 11/8 r2 (p12): the gold line and the address stop at the right edge of the photo row below
    h += `<div class="pc-bstatus" data-fine="1" style="left:${X}pt;top:14pt;width:${bsW}pt;height:30pt;overflow:visible" data-slot="back.status" data-lines="1"><span class="st" style="padding-left:${bsf.left + 2}pt">${esc(statusWord)}</span><span class="ln"></span><span class="ad">${esc(big ? L.address : short)}</span></div>`;
    const n = 3, phH = big ? 85.5 : 86, capLines = sold ? 4 : (big ? 4 : 5), py = 54;   // equal photo columns, all ending at the gray box's right edge
    // the photos with the most to say take the narrow columns (a short caption cannot fill five lines), kept in the writer's order
    const txtLen = c => [].concat(...(c.s || []).map(x => [].concat(x))).join(' ').length + String(c.lead || '').length;
    const ps0 = (B.photos || []), keep = ps0.map((c, i) => [txtLen(c), i]).sort((a, b) => b[0] - a[0]).slice(0, n).map(x => x[1]).sort((a, b) => a - b), ps = ps0.length > n ? keep.map(i => ps0[i]) : ps0;
    const lp = ps.slice(0, n), rp = null, pw = (lw - G*(n - 1))/n;
    let rowH = '';
    (sold ? [] : lp).forEach((c, i) => { const x = X + i*(pw + G);
      rowH += `<div class="abs pcph" style="left:${x}pt;top:${py}pt;width:${pw}pt;height:${phH}pt">${SW.photo(D, c.photo, 'position:absolute;inset:0', 'back.photo'+i)}</div>`;
      rowH += cap(c, 'back.photo'+i, capLines, `position:absolute;left:${x}pt;top:${py + phH}pt;width:${pw}pt;padding-top:5pt`); });
    if(rp){ rowH += `<div class="abs" style="left:${rx}pt;top:${py}pt;width:${rw}pt;height:${phH}pt">${SW.photo(D, rp.photo, 'position:absolute;inset:0', 'back.photo'+n)}</div>`;
      rowH += cap(rp, 'back.photo'+n, capLines, `position:absolute;left:${rx}pt;top:${py + phH}pt;width:${rw}pt;padding-top:5pt`); }
    h += `<div class="row" data-grow="1" style="position:absolute;left:0;top:0;width:${W}pt;height:${H}pt;display:block;pointer-events:none">${rowH}</div>`;
    // the set's signature on the black between the postage box and the address block: the three facts in Cormorant with gold hairlines (Just Listed), the neighborhood in gold script (Just Sold)
    { const gy0 = Z.postage[1] + Z.postage[3] + 6 + 5, gy1 = Z.address[1] - 6 - 5, gx = rx, gw = W - 22 - gx;
      if(!sold) h += FXS.statsRow(FXS.statItems(L).slice(0, 3), gx, gy0 + 8, gw, gy1 - gy0 - 16, 'back.stat', {np: big ? 21 : 19, lp: 7, track: 1});

  // ---- the Just Sold front: the facts sit centered between the address and the agent's name, measured on the letters (ink, from the font's own metrics) ----
