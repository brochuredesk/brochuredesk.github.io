<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · Open house library · Twilight Frame (refreshments)</title>
<link rel="stylesheet" href="ohlib.css">
<script src="../ivory/ivory.js"></script>
<script src="ohlib.js"></script>
<!--
  Twilight Frame, refreshments version (10/31/2026; from reference B01). Trim 612 x 792 pt. REALTOR(R) / broker opens with refreshments.
  Same dark page, closed hairline frame and centered header as the base. The refreshments sit in a white box under the time
  (a thin accent line round it): the food photo runs flush down its left edge, a real-size tile, and the Refreshments tag,
  the type or the agent's words and the special note fill the rest. Nothing entered: the base's own layout (note box, bigger house).
  The page is the brand's dark color with one closed hairline frame drawn on top of everything, so it never depends
  on where trees or rooflines fall in the photo. The brokerage logo is in the standard footer card, in white (owner
  10/27/2026; it used to sit in a gap in the frame's top line). Event at the top in wide-tracked caps, the whole house below at its own 3:2 shape
  (nothing cropped off the sides), address and agent on the dark band under it. 10/30: the door prize and lunch lines sit in a highlight box (a lifted tint of the dark with a thin accent line) between the time and the photo.
  Type: Tenor Sans (label, agent), Spectral (date, address), Jost (time, details).
-->
<style>
  .sheet{background:var(--dark);color:var(--on-dark)}
  .fr{position:absolute;background:var(--on-dark);opacity:.92}
  .eyebrow{font:500 10pt/12pt Jost;letter-spacing:4.5pt;text-transform:uppercase;color:var(--accent-on-dark);text-align:center}
  .label{font:400 30pt/40pt 'Tenor Sans';letter-spacing:5pt;text-transform:uppercase;text-align:center;white-space:nowrap;overflow:hidden}
  .date{font:500 34pt/44pt Spectral;text-align:center;white-space:nowrap;overflow:hidden}
  .time{font:600 19pt/24pt Jost;letter-spacing:2pt;text-transform:uppercase;color:var(--accent-on-dark);text-align:center;white-space:nowrap;overflow:hidden}
  .ev{font:500 12pt/16pt Jost;letter-spacing:.3pt;text-align:center}
  .ev.b{font-weight:600}
  .address{font:500 35pt/40pt Spectral;text-align:center;white-space:nowrap;overflow:hidden}
  .details{font:600 16pt/20pt Jost;letter-spacing:3.4pt;text-transform:uppercase;text-align:center;white-space:nowrap;overflow:hidden;color:var(--accent-on-dark)}
  .fine{font:400 6.6pt/8pt Jost;text-align:center;white-space:nowrap;opacity:.6}
  .rtag{font:600 8.8pt/12pt Jost;letter-spacing:2.4pt;text-transform:uppercase;color:var(--main-on-paper)}
  .rtt{font:400 22pt/28pt 'Tenor Sans';letter-spacing:3pt;text-transform:uppercase;color:#161616}
  .rtx{font:600 15.5pt/20pt Jost;color:#161616}
  .rnote{font:500 11.5pt/15pt Jost;color:#161616}
</style>
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
OHL.start(['400 10pt "Tenor Sans"', '500 10pt Spectral', '500 10pt Jost', '600 10pt Jost', '400 10pt Jost'], D => {
  const esc = Ivory.esc, L = D.listing, A = D.agent || {}, b = D.brand || {}, C = D.companion || {};
  const E = OHL.event(D), hero = OHL.hero(D, 'straight');
  const X = 46, W = 520;
  // refreshments block (10/31/2026): the tag, then the type (when the agent typed no text) or the agent's text (13 pt or
  // more), then the special note under a hairline. o: center, lhx (text line), lhn (note line), lht (type line), note:false
  const refStack = (E, x, y, w, o) => {
    o = o || {};
    const al = o.center ? 'text-align:center;' : '', lhx = o.lhx || 19, lhn = o.lhn || 15, lht = o.lht || 26;
    let h = '', at = y, n;
    const tag = 'Refreshments' + (E.refreshText && E.refreshTitle ? ' · ' + E.refreshTitle : '');
    n = Ivory.linesNeeded('rtag', tag, w, 12);
    h += `<div class="abs rtag" style="left:${x}pt;top:${at}pt;width:${w}pt;height:${n*12}pt;white-space:normal;${al}" data-slot="oh.refreshType" data-lines="${n}">${esc(tag)}</div>`; at += n*12 + 5;
    if(E.refreshText){
      n = Ivory.linesNeeded('rtx', E.refreshText, w, lhx);
      h += `<div class="abs rtx" style="left:${x}pt;top:${at}pt;width:${w}pt;height:${n*lhx+4}pt;white-space:normal;${al}" data-slot="oh.refreshments" data-lines="${n}">${esc(E.refreshText)}</div>`; at += n*lhx;
    } else if(E.refreshTitle){
      n = Ivory.linesNeeded('rtt', E.refreshTitle, w, lht);
      h += `<div class="abs rtt" style="left:${x}pt;top:${at}pt;width:${w}pt;height:${n*lht+4}pt;white-space:normal;${al}" data-slot="oh.refreshTitle" data-lines="${n}">${esc(E.refreshTitle)}</div>`; at += n*lht;
    }
    if(E.note && o.note !== false){
      at += 7;
      h += `<div class="abs" style="left:${o.center ? x + (w-70)/2 : x}pt;top:${at}pt;width:${o.center ? 70 : w}pt;height:.8pt;background:var(--main-on-paper);opacity:.4"></div>`; at += 8;
      n = Ivory.linesNeeded('rnote', E.note, w, lhn);
      h += `<div class="abs rnote" style="left:${x}pt;top:${at}pt;width:${w}pt;height:${n*lhn+3}pt;white-space:normal;${al}" data-slot="oh.note" data-lines="${n}">${esc(E.note)}</div>`; at += n*lhn;
    }
    return {html: h, h: at - y};
  };
  const food = Object.keys(D.photos||{}).find(id => /^food\b/i.test(D.photos[id].tags||''));
  const R = E.hasRefresh && !!food, PWF = 190;
  const rb = R ? refStack(E, X + PWF + 20, 0, W - PWF - 40, {lhx:20, lhn:15, lht:28}) : null, bh = R ? Math.max(120, rb.h + 30) : 0;
  let h = '';
  // the house: full width at 3:2, nothing off the sides
  // (it gives up ground at the foot for the agent card; never past the house box, then it narrows at its own shape)
  // no refreshments or notes: no box, so the header settles lower and the house takes the room (no hole under the time)
  const noEv = !R && !(E.note || E.refreshments), dy = noEv ? 10 : R ? -18 : 0, py = R ? 210 + dy + bh + 16 : noEv ? 252 : 278;
  // the house sits inside the frame with a thin accent border all round on every version (owner 11/1/2026), never full bleed;
  // when the room allows more than its own 3:2 shape it centers between the event box and the address
  const slotB = 622, fh = OHL.fitHero(D, hero, 540, slotB - py - 6, true), ph = fh.h, pt = py + Math.round((slotB - py - ph)/2);
  h += OHL.photo(D, hero, `left:${(612 - fh.w)/2}pt;top:${pt}pt;width:${fh.w}pt;height:${ph}pt`);
  h += `<div class="abs" style="left:${(612 - fh.w)/2 - 5}pt;top:${pt - 5}pt;width:${fh.w + 10}pt;height:${ph + 10}pt;border:1.4pt solid var(--accent-on-dark);box-sizing:border-box"></div>`;

  // event
  h += `<div class="abs eyebrow" style="left:${X}pt;top:${60+dy}pt;width:${W}pt;height:12pt">You're invited</div>`;
  h += `<div class="abs label" style="left:${X}pt;top:${75+dy}pt;width:${W}pt;height:40pt" data-fit="30,20" data-slot="oh.label" data-lines="1">${esc(E.label)}</div>`;
  h += `<div class="abs" style="left:266pt;top:${122+dy}pt;width:80pt;height:1pt;background:var(--accent-on-dark)"></div>`;
  h += `<div class="abs date" style="left:${X}pt;top:${132+dy}pt;width:${W}pt;height:44pt" data-slot="oh.date" data-lines="1">${esc(E.long)}</div>`;
  h += E.time ? `<div class="abs time" style="left:${X}pt;top:${178+dy}pt;width:${W}pt;height:24pt" data-slot="oh.time" data-lines="1">${esc(E.time)}</div>` : '';
  let ev = {h: 0};
  if(R){
    const by = 210 + dy;
    h += `<div class="abs" style="left:${X}pt;top:${by}pt;width:${W}pt;height:${bh}pt;background:#fff"></div>`;
    h += OHL.photo(D, food, `left:${X}pt;top:${by}pt;width:${PWF}pt;height:${bh}pt`);
    h += `<div class="abs" data-box="oh.box" style="left:${X}pt;top:${by}pt;width:${W}pt;height:${bh}pt;border:.9pt solid var(--accent-on-dark);box-sizing:border-box"></div>`;
    h += refStack(E, X + PWF + 20, by + (bh - rb.h)/2, W - PWF - 40, {lhx:20, lhn:15, lht:28}).html;
    ev.h = bh;
  } else {
    ev = Ivory.eventBox([[E.note,'oh.note','ev'],[E.refreshments,'oh.refreshments','ev b']], X, 210, W, 16, 2,
      {bg:'#fff', line:'var(--accent-on-dark)', lineW:.9, padY:8, padX:14, extraStyle:'color:#161616', scale:((D.openHouse||{}).box||{}).w});
    h += ev.html;
  }
  const issues = 210 + dy + ev.h > pt - 12 ? [{slot:'oh.note', kind:'overflow', detail:'event box runs into the photo'}] : [];

  // address, details, agent
  h += `<div class="abs address" style="left:${X}pt;top:630pt;width:${W}pt;height:40pt" data-fit="35,22" data-slot="address" data-lines="1">${esc(L.address)}</div>`;
  const det = OHL.place(L);
  h += `<div class="abs details" style="left:${X}pt;top:670pt;width:${W}pt;height:20pt" data-slot="place" data-lines="1">${esc(det)}</div>`;
  // the standard footer: agent, then the brokerage panel on the right with the flyer's one logo, white on the dark field (owner 10/27/2026)
  h += OHL.contact(D, {x:X, y:694, w:W, h:62, tone:'knockout', field:'dark', logoW:180, logoH:46, nameSize:18, nameFont:"'Tenor Sans'", nameWeight:400, bodyFont:'Jost'});
  h += `<div class="abs fine" style="left:${X}pt;top:762pt;width:${W}pt;height:8pt" data-slot="fineprint" data-lines="1" data-fine="1">${esc([[A.designation, b.brokerage].filter(Boolean).join(', '), C.fineprint || 'Information deemed reliable but not guaranteed.'].filter(Boolean).join('  ·  '))}</div>`;

  // the closed frame, drawn last so it sits on top of the photo (the logo moved from a gap in its top line to the footer)
  const fx = 20, fy = 30, fr = 592, fb = 776, t = 1.2;
  h += `<div class="fr" style="left:${fx}pt;top:${fy}pt;width:${fr-fx}pt;height:${t}pt"></div>`;
  h += `<div class="fr" style="left:${fx}pt;top:${fy}pt;width:${t}pt;height:${fb-fy}pt"></div>`;
  h += `<div class="fr" style="left:${fr-t}pt;top:${fy}pt;width:${t}pt;height:${fb-fy}pt"></div>`;
  h += `<div class="fr" style="left:${fx}pt;top:${fb-t}pt;width:${fr-fx}pt;height:${t}pt"></div>`;

  const f = OHL.frame(D, h.replace(/([^\s<>"]+) · /g, '<span style="white-space:nowrap">$1 ·</span> '));   // a "·" never starts a line
  f.issues = issues;
  return f;
});
</script>
</body>
</html>
