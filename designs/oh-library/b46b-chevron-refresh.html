<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · Open house library · Chevron (refreshments)</title>
<link rel="stylesheet" href="ohlib.css">
<script src="../ivory/ivory.js"></script>
<script src="ohlib.js"></script>
<!--
  Chevron, refreshments version (11/01/2026; from reference B46, version B). Trim 612 x 792 pt. REALTOR(R) / broker opens.
  Same house cut into a wide V with the accent chevron line, same centered wording on the brand's dark color, Sora
  throughout. The refreshments get a full-width white box (thin accent edge) under the date and time: the matching food
  photo at left at a real size, the refreshment type, the agent's words (14 pt) and "Good to know" at right. The type
  heads the box in large type (the event line stays one big line so the house keeps its V).
  The owner on Chevron public: a bigger "Houston, TX" (the city line, 14 pt in the accent color) and no beds/baths line.
  Nothing entered: no empty box. The same place holds a row of three rooms (and the note box when there is a note).
  Type: Sora throughout.
-->
<style>
  .sheet{background:var(--dark);color:var(--on-dark)}
  .hl{font:700 34pt/40pt Sora;letter-spacing:2pt;text-transform:uppercase;text-align:center;white-space:nowrap;overflow:hidden}
  .rtl{font:600 15pt/20pt Sora;letter-spacing:7pt;text-transform:uppercase;text-align:center;white-space:nowrap;overflow:hidden;color:var(--accent-on-dark);padding-left:7pt}
  .date{font:600 28pt/34pt Sora;text-align:center;white-space:nowrap;overflow:hidden}
  .time{font:400 20pt/26pt Sora;text-align:center;white-space:nowrap;overflow:hidden;color:var(--accent-on-dark)}
  .evb{font:500 13.5pt/18pt Sora;text-align:center;color:#1b1b1b}
  .evb.b{font-weight:700}
  .rk{font:700 9pt/12pt Sora;letter-spacing:3pt;text-transform:uppercase;color:var(--main-on-paper);white-space:nowrap}
  .rt{font:600 21pt/25pt Sora;color:#1b1b1b;white-space:nowrap;overflow:hidden}
  .rx{font:500 13.5pt/18pt Sora;color:#1b1b1b}
  .gk{font:700 9pt/12pt Sora;letter-spacing:2.6pt;text-transform:uppercase;color:var(--main-on-paper);white-space:nowrap}
  .gn{font:400 13pt/16pt Sora;color:#1b1b1b}
  .addr{font:600 26pt/32pt Sora;text-align:center;white-space:nowrap;overflow:hidden}
  .place{font:600 14pt/18pt Sora;letter-spacing:3pt;text-transform:uppercase;text-align:center;white-space:nowrap;overflow:hidden;color:var(--accent-on-dark);padding-left:3pt}
  .hr{position:absolute;left:36pt;width:540pt;height:.8pt;background:var(--on-dark);opacity:.3}
  .oh-agent-name{font-family:Sora;font-weight:600}
  .oh-agent{font-family:Sora}
  .fine{font:400 6.6pt/8pt Sora;white-space:nowrap;opacity:.6}
</style>
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
OHL.start(['700 10pt Sora', '600 10pt Sora', '500 10pt Sora', '400 10pt Sora'], D => {
  const esc = Ivory.esc, L = D.listing, C = D.companion || {};
  const E = OHL.event(D), hero = OHL.hero(D, 'straight');
  const R = E.hasRefresh;
  const rooms = OHL.photos(D).filter(id => id !== hero && !Ivory.fullHouse(D, id)).slice(0, 3);
  const food = R ? Object.keys(D.photos||{}).find(id => /^food\b/i.test(D.photos[id].tags||'')) : '';
  const X = 36, W = 540;
  let h = '';
  const lines = [E.label];   // one line, fitted: the house keeps the room (full width, V cut)
  // the white refreshments box: food photo at left, then the type, the agent's words and the note
  const fp = food ? (D.photos[food] || {}) : null, tall = fp && fp.h > fp.w;
  const sparse = !(E.refreshText || E.note), fw = food ? (tall ? (sparse ? 118 : 118) : (sparse ? 268 : 214)) : 0, tx0 = X + 8 + (fw ? fw + 18 : 10), tw = X + W - 14 - tx0;
  let rbH = 0, nT = 0, nN = 0, content = 0;
  if(R){
    nT = E.refreshText ? Ivory.linesNeeded('rx', E.refreshText, tw, 18) : 0;
    nN = E.note ? Ivory.linesNeeded('gn', E.note, tw, 16) : 0;
    content = 14 + (E.refreshTitle ? (sparse ? 36 : 28) : 0) + (nT ? nT*18 + 3 : 0) + (E.note ? 10 + 14 + nN*16 : 0);
    rbH = Math.max(fw ? (sparse && tall ? 160 : 136) : 0, content + 24);
  }
  // nothing entered: the note box when there is a note, and a row of three rooms in the same place
  const boxOpts = {bg:'#fff', line:'var(--accent)', lineW:1.2, padX:14, padY:10, scale:((D.openHouse||{}).box||{}).w};
  const evBox = yy => Ivory.eventBox([[E.note,'oh.note','evb']], X, yy, W, 18, 4, boxOpts);
  const noteN = R ? {h:0} : evBox(0);
  const rowH = R ? rbH : 122;
  const mid = (R ? rbH : rowH + (noteN.h ? noteN.h + 10 : 0));
  const titleH = 0;   // the refreshment type heads the white box (the label stays one big line, so the house keeps the room for its V)
  const need = 28 + lines.length*36 + titleH + 6 + 36 + (E.time ? 28 : 0) + 8 + mid + 12 + 32 + 18 + 4;
  const fr = OHL.fitHero(D, hero, 612, Math.min(408, 704 - 16 - need)), ph = fr.h; let side = 0.82;
  let vee = null, shaped = false;
  for(const sd of [.8, .86, .9, .93, .95]){   // the deepest V the house allows; with no proof, a straight edge
    const v = [[0,0],[1,0],[1,sd],[.5,1],[0,sd]];
    if(fr.w === 612 && OHL.polyFits(D, hero, 612, ph, v)){ vee = v; side = sd; shaped = true; break; }
  }
  if(shaped){
    h += OHL.maskedPhoto(D, hero, `left:0;top:0;width:612pt;height:${ph}pt`, vee);
    const o = 16, P = 4/3;
    h += `<svg class="abs" style="left:0;top:0;width:612pt;height:${ph+o+4}pt" viewBox="0 0 816 ${(ph+o+4)*P}"><polyline points="0,${(ph*side+o)*P} 408,${(ph+o)*P} 816,${(ph*side+o)*P}" fill="none" stroke="var(--accent)" stroke-width="2.4"/></svg>`;
  } else h += OHL.photo(D, hero, `left:${(612-fr.w)/2}pt;top:0;width:${fr.w}pt;height:${ph}pt`);
  let y = ph + (shaped ? 32 : 24);
  const mid0 = h.length, y0 = y;
  lines.forEach((t, i) => h += `<div class="abs hl" style="left:${X}pt;top:${y + i*36}pt;width:${W}pt;height:38pt" data-slot="oh.label" data-lines="1">${esc(t)}</div>`);
  y += lines.length*36;
  if(titleH){ h += `<div class="abs rtl" style="left:${X}pt;top:${y}pt;width:${W}pt;height:22pt" data-slot="oh.refreshTitle" data-lines="1">${esc(E.refreshTitle)}</div>`; y += 24; }
  y += 6;
  h += `<div class="abs date" style="left:${X}pt;top:${y}pt;width:${W}pt;height:34pt" data-fit="28,22" data-slot="oh.date" data-lines="1">${esc(E.long)}</div>`;
  y += 36;
  if(E.time){ h += `<div class="abs time" style="left:${X}pt;top:${y}pt;width:${W}pt;height:24pt" data-slot="oh.time" data-lines="1">${esc(E.time)}</div>`; y += 28; }
  y += 8;
  if(R){
    const by = y;
    h += `<div class="abs" data-box="oh.box" style="left:${X}pt;top:${by}pt;width:${W}pt;height:${rbH}pt;background:#fff;border:1.2pt solid var(--accent);box-sizing:border-box"></div>`;
    if(food) h += OHL.photo(D, food, `left:${X+7}pt;top:${by+7}pt;width:${fw}pt;height:${rbH-14}pt`);
    let ty = by + (rbH - content)/2;
    h += `<div class="abs rk" style="${sparse ? 'text-align:center;' : ''}left:${tx0}pt;top:${ty}pt;width:${tw}pt;height:12pt">Refreshments</div>`; ty += 14;
    if(E.refreshTitle){ h += `<div class="abs rt" style="${sparse ? 'text-align:center;' : ''}left:${tx0}pt;top:${ty+2}pt;width:${tw}pt;height:${sparse ? 34 : 25}pt;${sparse ? 'font-size:27pt;line-height:34pt' : ''}" ${sparse ? 'data-fit="27,18" ' : ''}data-slot="oh.refreshTitle" data-lines="1">${esc(E.refreshTitle)}</div>`; ty += sparse ? 36 : 28; }
    if(nT){ h += `<div class="abs rx" style="left:${tx0}pt;top:${ty}pt;width:${tw}pt;height:${nT*18+2}pt" data-slot="oh.refreshments" data-lines="${nT}">${esc(E.refreshText)}</div>`; ty += nT*18 + 3; }
    if(E.note){ ty += 10;
      h += `<div class="abs gk" style="left:${tx0}pt;top:${ty}pt;width:${tw}pt;height:12pt">Good to know</div>`; ty += 14;
      h += `<div class="abs gn" style="left:${tx0}pt;top:${ty}pt;width:${tw}pt;height:${nN*16}pt" data-slot="oh.note" data-lines="${nN}">${esc(E.note)}</div>`; }
    y += rbH;
  } else {
    if(noteN.h){ const nb = evBox(y); h += nb.html; y += nb.h + 10; }
    const gw = (W - 2*8)/3;
    rooms.forEach((id, i) => h += OHL.photo(D, id, `left:${X + i*(gw+8)}pt;top:${y}pt;width:${gw}pt;height:${rowH}pt`));
    y += rowH;
  }
  y += 12;
  h += `<div class="abs addr" style="left:${X}pt;top:${y}pt;width:${W}pt;height:32pt" data-fit="26,16" data-slot="address" data-lines="1">${esc(L.address)}</div>`;
  y += 32;
  h += `<div class="abs place" style="left:${X}pt;top:${y}pt;width:${W}pt;height:18pt" data-slot="place" data-lines="1">${esc(OHL.place(L))}</div>`;
  y += 18;
  const cy = 704;
  const issues = y > cy - 12 ? [{slot:'oh.note', kind:'overflow', detail:'the event runs into the agent card'}] : [];
  const shift = Math.max(0, (cy - 12 - y)/2);
  h = h.slice(0, mid0) + `<div class="abs" style="left:0;top:${shift}pt;width:612pt;height:0">` + h.slice(mid0) + `</div>`;
  h += `<div class="hr" style="top:${cy - 12}pt"></div>`;
  h += OHL.contact(D, {x:X, y:cy, w:W, h:62, tone:'dark', nameSize:17, phoneSize:13, lineSize:9, logoW:180, logoH:50});
  h += `<div class="abs fine" style="left:${X}pt;top:778pt;width:${W}pt;height:8pt" data-slot="fineprint" data-lines="1" data-fine="1">${esc(C.fineprint || 'Information deemed reliable but not guaranteed.')}</div>`;
  const f = OHL.frame(D, h);
  f.issues = issues;
  f.after = () => OHL.stack([...document.querySelectorAll('.hl')], 32, 24, y0, 1.15);
  return f;
});
</script>
</body>
</html>
