<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · Open house library · Poster with Refreshments</title>
<link rel="stylesheet" href="ohlib.css">
<script src="../ivory/ivory.js"></script>
<script src="ohlib.js"></script>
<!--
  Poster, refreshments version (10/31/2026; base p02-poster.html). Trim 612 x 792 pt. REALTOR(R) / broker opens with refreshments
  (the P flyers were drawn as public flyers; this edition is the agent's REALTOR(R)/broker wording). With none entered (or on a
  public open) it falls back to the base layout (the paper-colored note box, or the pull quote).
  Refreshments version: the paper box across the page becomes a white box; the agent's words sit left under a "Refreshments"
  tag, and the food photo fills its right end edge to edge, full box height, behind a heavy accent bar (the poster's loud
  edge, like the offset frame on the house). The house frame gives up lawn at the foot (never more than the house allows).
  Base notes follow.
  Poster (from reference P02). Trim 612 x 792 pt. Public or REALTOR(R).
  A bold poster on the brand's dark color: the agent's event wording stacked huge at top left, the date stacked big
  at top right, the house at 3:2 inside a thin offset frame, then address on the left and the full date and time on
  the right, both large, and (10/30) a paper-colored highlight box across the page for what's served and the notes. Agent and logo along the foot. No QR, no RSVP pill.
  Type: Archivo 700 (headline, date, address), Archivo 400 (details).
-->
<style>
  .sheet{background:var(--dark);color:var(--on-dark)}
  .hl{font:700 92pt/80pt Archivo;text-transform:uppercase;letter-spacing:-1.5pt;white-space:nowrap;overflow:hidden;color:var(--paper)}
  .wd{font:700 12pt/15pt Archivo;letter-spacing:3pt;text-transform:uppercase;color:var(--accent-on-dark);text-align:right;white-space:nowrap;overflow:hidden}
  .dd{font:700 50pt/54pt Archivo;text-transform:uppercase;letter-spacing:-.5pt;text-align:right;white-space:nowrap;overflow:hidden;color:var(--paper)}
  .addr{font:700 24pt/30pt Archivo;letter-spacing:-.2pt}
  .place{font:700 14pt/18pt Archivo;letter-spacing:2pt;text-transform:uppercase;color:var(--accent-on-dark);white-space:nowrap;overflow:hidden}
  .facts{font:400 10.5pt/14pt Archivo;opacity:.9;white-space:nowrap;overflow:hidden}
  .long{font:700 20pt/24pt Archivo;text-align:right;white-space:nowrap;overflow:hidden}
  .time{font:700 22pt/27pt Archivo;color:var(--accent-on-dark);text-align:right;white-space:nowrap;overflow:hidden}
  .pq{font:600 16pt/22pt Archivo;color:var(--paper);white-space:normal}
  .ev{font:500 12pt/16pt Archivo;text-align:left;color:var(--ink)}
  .ev.b{font-weight:700}
  .rk{font:700 9.5pt/12pt Archivo;letter-spacing:2.6pt;text-transform:uppercase;white-space:nowrap;overflow:hidden}
  .rt{font:700 30pt/34pt Archivo;text-transform:uppercase;letter-spacing:-.3pt;white-space:nowrap;overflow:hidden;color:#161616}
  .rx{font:700 15pt/20pt Archivo;color:#161616;letter-spacing:-.1pt}
  .rx.a{font-size:18pt;line-height:23pt}
  .nx{font:400 13pt/18pt Archivo;color:#161616}
  .oh-agent-name{font-family:Archivo;font-weight:700}
  .oh-agent{font-family:Archivo}
  .fine{font:400 6.6pt/8pt Archivo;white-space:nowrap;opacity:.55}
</style>
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
OHL.start(['700 10pt Archivo', '400 10pt Archivo'], D => {
  const esc = Ivory.esc, L = D.listing, C = D.companion || {};
  L.address = OHL.printStreet(L.address);
  const E = OHL.event(D), hero = OHL.hero(D, 'straight');
  const food = Object.keys(D.photos||{}).find(id => /^food\b/i.test(D.photos[id].tags||''));
  const RF = E.hasRefresh && !!food;   // refreshments version: white box with the food photo at its right end
  const kk = OHL.colors(D), tagC = OHL.contrast(kk.accent, '#ffffff') >= 3 ? kk.accent : (OHL.contrast(kk.main, '#ffffff') >= 3 ? kk.main : kk.dark);
  let h = '';
  // headline stacked, the short date stacked at right
  const lines = OHL.labelLines(E.label);
  lines.forEach((t, i) => h += `<div class="abs hl" id="hl${i}" style="left:34pt;top:${34 + i*80}pt;width:390pt;height:84pt" data-slot="oh.label" data-lines="1">${esc(t)}</div>`);
  if(E.weekday){
    h += `<div class="abs wd" style="left:426pt;top:${34+80+10}pt;width:150pt;height:15pt" data-slot="oh.weekday" data-lines="1">${esc(E.weekday)}</div>`;
    h += `<div class="abs dd" style="left:406pt;top:${34+80+26}pt;width:170pt;height:54pt" data-fit="50,30" data-slot="oh.date" data-lines="1">${esc(E.monthShort + ' ' + E.day)}</div>`;
  }
  // the house, framed
  // long special notes / refreshments: the photo gives up lawn at the bottom (the house-cut check guards it)
  const RS = Math.max(.8, Math.min(1, +((D.openHouse||{}).box||{}).w || 1)), rbw = Math.round(540*RS), rbx = 36 + (540 - rbw)/2;
  const FW = Math.round(rbw*.36), RTW = rbw - FW - 26 - 16;
  let blk = [];
  if(RF) for(const [cls, lh] of [['rx a', 23], ['rx', 20]]){
    blk = [['rk', 'Refreshments' + (E.refreshTitle && E.refreshText ? '  ·  ' + E.refreshTitle : ''), 14, 1, null]];
    if(E.refreshText){ const n = Ivory.linesNeeded(cls, E.refreshText, RTW, lh); blk.push([cls, E.refreshText, n*lh, n, 'oh.refreshments']); }
    else if(E.refreshTitle) blk.push(['rt', E.refreshTitle, 40, 1, 'oh.refreshTitle', 4]);
    if(E.note){ blk.push(['rk', 'Good to know', 18, 1, null, 6]); const n = Ivory.linesNeeded('nx', E.note, RTW, 18); blk.push(['nx', E.note, n*18, n, 'oh.note']); }
    if(blk.reduce((a, b) => a + b[2] + (b[5] || 0), 0) <= 92) break;
  }
  const blkH = blk.reduce((a, b) => a + b[2] + (b[5] || 0), 0), BH = RF ? Math.max(122, blkH + 30) : 0;
  const evNeed = RF ? BH - 14 : [[E.note,'ev'],[E.refreshments,'ev b']].filter(l=>l[0]).reduce((a,l)=>a + Ivory.linesNeeded(l[1], l[0], 508, 16)*16 + 2, 0) + (E.note || E.refreshments ? 18 : 0);
  // when the house leaves no ground to give, the whole photo gets smaller at 3:2 instead (nothing more is cropped)
  const anN = Ivory.linesNeeded('addr', L.address, 300, 30);
  // second version (nothing in the refreshments box): the freed room carries a pull quote in the writer's own sentences,
  // set large across the page under the address and date; the house frame gives up a little height for it
  const second = !E.hasRefresh;
  let boxDy = anN > 1 ? anN*30 + 22 : 74;   // the box clears the address column (facts line only when the address is one line)
  const PQW = 540 - 16;
  let pq = second ? OHL.writeup(D, 'pq', PQW, 22, 2, [Ivory.factsShort(L)], {narrow:true}) : {text:'', n:0};
  if(second && pq.fill < .75) pq = OHL.writeup(D, 'pq', PQW, 22, 3, [Ivory.factsShort(L)], {narrow:true});
  if(second && pq.text && pq.fill < .75) pq = {text:'', n:0};   // no write-up whose last line is 3/4 full: no pull quote (10/31)
  if(second){ boxDy = anN > 1 ? anN*30 + 22 : 78; }
  const pqH = pq.text ? pq.n*22 + 12 : 0;
  const noteH = second && E.note ? Ivory.linesNeeded('ev', E.note, 508, 16)*16 + 18 + 8 : 0;
  if(RF) boxDy = anN > 1 ? anN*30 + 22 : 62;   // the facts line goes (it is extra); the box sits right under the time
  const py0 = RF ? 174 : second ? 206 : 220;
  const want = RF ? Math.min(360, 688 - py0 - (26 + boxDy + BH)) : second ? Math.min(360, 688 - py0 - (26 + boxDy + pqH + noteH)) : 360 - Math.min(64, Math.max(0, boxDy + evNeed + 6 - (688 - (220 + 360 + 26))));
  const minH = OHL.minFrameH(D, hero, 540, 360);
  // second version with nothing under the address (no pull quote, no note): the page's leftover room is shared between the gap
  // above the photo frame and the gap above the address, so nothing is left blank at the foot
  const slack = second && !pq.text && !noteH ? Math.max(0, 688 - (py0 + want + 26 + (anN > 1 ? anN*30 + 24 : 72))) : 0;
  const py = py0 + Math.round(slack*.5), yAdd = Math.round(slack*.5);
  const ph = want, pw = want >= minH ? 540 : Math.round(want*1.5), px = 36 + (540 - pw)/2;
  h += `<div class="abs" style="left:${px-7}pt;top:${py-7}pt;width:${pw+14}pt;height:${ph+14}pt;border:.9pt solid var(--accent-on-dark);opacity:.8"></div>`;
  h += OHL.photo(D, hero, `left:${px}pt;top:${py}pt;width:${pw}pt;height:${ph}pt`);

  // address left, full date and time right
  const y = py + ph + 26 + yAdd;
  const an = anN;
  h += `<div class="abs addr" style="left:36pt;top:${y}pt;width:300pt;height:${an*30+5}pt" data-slot="address" data-lines="${an}">${esc(L.address)}</div>`;
  h += `<div class="abs place" style="left:36pt;top:${y+an*30+4}pt;width:300pt;height:19pt" data-slot="place" data-lines="1">${esc(OHL.place(L))}</div>`;
  if(an === 1 && !RF) h += `<div class="abs facts" style="left:36pt;top:${y+an*30+30}pt;width:300pt;height:14pt" data-slot="oh.facts" data-lines="1">${esc(Ivory.factsShort(L).replace(/  \/  /g, '   ·   '))}</div>`;
  h += `<div class="abs long" style="left:346pt;top:${y}pt;width:230pt;height:24pt" data-fit="20,15" data-slot="oh.long" data-lines="1">${esc(E.long)}</div>`;
  if(E.time) h += `<div class="abs time" style="left:346pt;top:${y+28}pt;width:230pt;height:27pt" data-slot="oh.time" data-lines="1">${esc(E.time)}</div>`;
  let evY = y + boxDy;
  if(pq.text){
    h += `<div class="abs" style="left:36pt;top:${evY+2}pt;width:3pt;height:${pq.n*22-4}pt;background:var(--accent-on-dark)"></div>`;
    h += `<div class="abs pq" style="left:50pt;top:${evY}pt;width:${pq.w || PQW}pt;height:${pq.n*22}pt" data-slot="writeup" data-lines="${pq.n}">${esc(pq.text)}</div>`;
    evY += pqH;
  }
  let ev;
  if(RF){
    ev = {h: BH};
    let hh = `<div class="abs" data-box="oh.box" style="left:${rbx}pt;top:${evY}pt;width:${rbw}pt;height:${BH}pt;background:#fff"></div>`;
    hh += OHL.photo(D, food, `left:${rbx + rbw - FW}pt;top:${evY}pt;width:${FW}pt;height:${BH}pt`);
    hh += `<div class="abs" style="left:${rbx + rbw - FW - 6}pt;top:${evY}pt;width:6pt;height:${BH}pt;background:var(--accent)"></div>`;
    let ty = evY + (BH - blkH)/2; const tx = rbx + 20;
    blk.forEach(([c, t, hgt, n, slot, gap]) => { ty += gap || 0;
      hh += `<div class="abs ${c}" style="left:${tx}pt;top:${ty}pt;width:${RTW}pt;height:${hgt + (/^rx|^nx/.test(c) ? 3 : 0)}pt;${c === 'rk' ? 'color:' + tagC + ';' : ''}${/^rx|^nx/.test(c) ? 'white-space:normal;' : ''}"${slot ? ` data-slot="${slot}" data-lines="${n}"` : ''}${c === 'rt' ? ' data-fit="30,18"' : ''}>${esc(t)}</div>`; ty += hgt; });
    ev.html = hh;
  } else ev = Ivory.eventBox([[E.refreshments,'oh.refreshments','ev b'],[E.note,'oh.note','ev']], 36, evY, 540, 16, 2,
    {bg:'var(--paper)', padX:16, padY:9, scale:((D.openHouse||{}).box||{}).w});
  h += ev.html;
  const issues = (ev.h && evY + ev.h > 688) ? [{slot:'oh.note', kind:'overflow', detail:'event lines run into the contact row'}] : [];

  h += `<div class="abs" style="left:36pt;top:694pt;width:540pt;height:.8pt;background:var(--on-dark);opacity:.3"></div>`;
  h += OHL.contact(D, {x:36, y:706, w:540, h:60, tone:'dark', nameSize:17, phoneSize:13, lineSize:9.5, logoW:176, logoH:50});
  h += `<div class="abs fine" style="left:36pt;top:776pt;width:540pt;height:8pt" data-slot="fineprint" data-lines="1" data-fine="1">${esc(C.fineprint || 'Information deemed reliable but not guaranteed.')}</div>`;
  const f = OHL.frame(D, h.replace(/([^\s<>"]+) · /g, '<span style="white-space:nowrap">$1 ·</span> '));   // a "·" never starts a line
  f.issues = issues;
  f.after = () => {   // the headline takes the width the date leaves it, every line at one size
    const dd = document.querySelector('.dd'), wd = document.querySelector('.wd');
    let dw = 0;
    if(dd){ const m = document.createElement('span'); m.className = 'dd'; m.style.cssText = `position:absolute;visibility:hidden;font-size:${dd.style.fontSize}`; m.textContent = dd.textContent; document.body.appendChild(m); dw = m.offsetWidth*72/96; m.remove(); }
    const els = [...document.querySelectorAll('.hl')];
    els.forEach(el => el.style.width = (576 - 34 - (dw ? dw + 26 : 0))+'pt');
    let st = OHL.stack(els, 92, 40, 0, 0.88);
    // the block sits centered above the photo frame; the date sits on the headline's last line
    const top = Math.max(22, (py - 14 - st.bottom)/2);
    st = OHL.stack(els, 92, 40, top, 0.88);
    if(dd){ dd.style.top = (st.bottom - 58)+'pt'; wd.style.top = (st.bottom - 74)+'pt'; }
  };
  return f;
});
</script>
</body>
</html>
