<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · Open house library · Angle with Refreshments</title>
<link rel="stylesheet" href="ohlib.css">
<script src="../ivory/ivory.js"></script>
<script src="ohlib.js"></script>
<!--
  Angle, refreshments version (10/31/2026; base p17-angle.html). Trim 612 x 792 pt. REALTOR(R) / broker opens with refreshments
  (the P flyers were drawn as public flyers; this edition is the agent's REALTOR(R)/broker wording). With none entered (or on a
  public open) it falls back to the base layout (facts column, full-width white note box, or the second version's big numerals).
  Refreshments version: the white box sits under the date and time at the left (about 3/4 of the width) with its right edge cut on
  the diagonal's lean; the food photo stands beside it on the right, cut on the same lean, from the date's top down to the box's
  foot and off the page's right edge, so box and photo read as one leaning pair. The facts column gives its room to the photo
  (the ribbon still carries the writer's kicker or the facts). The house frame is a little shorter (the diagonal's proof decides).
  Base notes follow.
  Angle (from reference P17). Trim 612 x 792 pt. Public or REALTOR(R).
  The owner loves the angle and shoots his listings at angles. A corner view of the house fills the top; its bottom edge
  is cut on a diagonal that only ever crosses lawn (the mask check proves the house stays whole). The brand's main
  color takes the rest: a tall condensed headline, an accent ribbon set on the same angle carrying the writer's
  kicker (or the facts), the date and time big, then (10/30) the event lines in a large white box under them (from the left edge of the time to the right end of the facts column), and a light band with the address and the agent.
  Type: Asap Condensed (headline, date, address), Outfit (details).
-->
<style>
  .sheet{background:var(--main);color:var(--on-main)}
  .hl{font:700 86pt/74pt 'Asap Condensed';text-transform:uppercase;white-space:nowrap;overflow:hidden;letter-spacing:.5pt}
  .rib{position:absolute;background:var(--accent);color:var(--on-accent);transform-origin:0 0;display:flex;align-items:center;padding-left:22pt}
  .rib span{display:block;font:600 13pt/16pt Outfit;letter-spacing:2.2pt;text-transform:uppercase;white-space:nowrap;overflow:hidden}
  .date{font:700 36pt/42pt 'Asap Condensed';text-transform:uppercase;white-space:nowrap;overflow:hidden;letter-spacing:.4pt}
  .time{font:500 24pt/29pt 'Asap Condensed';text-transform:uppercase;color:var(--accent-on-main);white-space:nowrap;overflow:hidden;letter-spacing:1pt}
  .fn{font:700 25pt/24pt 'Asap Condensed';color:var(--on-main);white-space:nowrap;overflow:hidden;text-align:right}
  .fl{font:600 10.5pt/24pt Outfit;letter-spacing:1.8pt;text-transform:uppercase;color:var(--accent-on-main);white-space:nowrap;overflow:hidden}
  .ev{font:400 15pt/20pt Outfit;color:var(--ink);text-align:center}
  .ev.b{font-weight:600}
  .band{position:absolute;left:0;width:612pt;background:var(--paper);color:var(--ink)}
  .addr{font:700 24pt/28pt 'Asap Condensed';color:var(--on-main);white-space:nowrap;overflow:hidden}
  .place,.fine{color:var(--on-main)}
  .facts{font:600 10.5pt/15pt Outfit;letter-spacing:1.8pt;text-transform:uppercase;text-align:right;white-space:nowrap;overflow:hidden}
  .place{font:400 9.5pt/12pt Outfit;letter-spacing:1.4pt;text-transform:uppercase;white-space:nowrap;overflow:hidden}
  .crow{font:400 10pt/14pt Outfit;white-space:nowrap;overflow:hidden}
  .crow b{font:600 13pt/14pt Outfit;margin-right:10pt}
  .crow i{font-style:normal;display:inline-block;width:1pt;height:10pt;background:currentColor;opacity:.35;margin:0 9pt;vertical-align:-1pt}
  .rk{font:600 9pt/12pt Outfit;letter-spacing:2.6pt;text-transform:uppercase;white-space:nowrap;overflow:hidden}
  .rt{font:700 32pt/36pt 'Asap Condensed';text-transform:uppercase;letter-spacing:1pt;white-space:nowrap;overflow:hidden;color:var(--ink)}
  .rx{font:600 15pt/20pt Outfit;color:var(--ink)}
  .rx.a{font-size:18pt;line-height:23pt}
  .rx.b2{font-size:14pt;line-height:18.5pt}
  .rx.b3{font-size:13pt;line-height:17pt}
  .nx{font:400 13pt/17pt Outfit;color:var(--ink)}
  .wu{font:400 14.5pt/21pt Outfit;color:var(--on-main)}
  .fine{font:400 6.6pt/8pt Outfit;white-space:nowrap;opacity:.6}
</style>
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
OHL.start(['700 10pt "Asap Condensed"', '500 10pt "Asap Condensed"', '400 10pt Outfit', '600 10pt Outfit'], D => {
  const esc = Ivory.esc, L = D.listing, A = D.agent || {}, b = D.brand || {}, C = D.companion || {};
  L.address = OHL.printStreet(L.address);
  const E = OHL.event(D), hero = OHL.hero(D, 'angled');
  const food = Object.keys(D.photos||{}).find(id => /^food\b/i.test(D.photos[id].tags||''));
  const RF = E.hasRefresh && !!food;   // refreshments version: white box + a leaning food photo beside it
  const kk = OHL.colors(D), tagC = OHL.contrast(kk.accent, '#ffffff') >= 3 ? kk.accent : (OHL.contrast(kk.main, '#ffffff') >= 3 ? kk.main : kk.dark);
  let h = '';
  // the house; the diagonal runs from 100% height at left to 78% at right, so 78% down is always clear
  // refreshments version: a bigger white box for the agent's words (15 pt on 20 pt lines, roomier padding; was 13 / 17).
  // Second version (nothing in the refreshments box): the freed room goes to a bigger date and big stacked numerals
  // for the facts, set on the same lean as the diagonal
  const second = !E.hasRefresh;
  const cut = 0.78, minPh = OHL.minFrameH(D, hero, 612, 420);
  // refreshments version: the frame may be a little shorter (down to 318 pt) when the diagonal still clears the house there
  let base = 350;
  if(RF) for(const t of [318, 330, 342]) if(t >= minPh && OHL.maskFits(D, hero, 612, t, cut)){ base = t; break; }
  const ph = Math.max(minPh, base);
  const angled = OHL.maskFits(D, hero, 612, ph, cut);   // no proof the diagonal misses the house: a straight edge
  const ang = (angled ? 1 : 0.5) * Math.atan2(ph*(1-cut), 612) * 180/Math.PI;   // the diagonal's angle, reused by the ribbon
  const SL = Math.tan(ang*Math.PI/180);   // the lean: pt of sideways run per pt of height
  const lines = OHL.labelLines(E.label);
  // refreshments version: the words in the box (the box's right edge leans, so the text column gives that up)
  const BX = 36, BW = 376;
  let blk = [], BH = 0, blkH = 0;
  if(RF) for(const [cls, lh] of [['rx a', 23], ['rx', 20], ['rx b2', 18.5], ['rx b3', 17]]){
    const tw = BW - 38 - 30 - Math.round(150*SL);
    blk = [['rk', 'Refreshments' + (E.refreshTitle && E.refreshText ? '  ·  ' + E.refreshTitle : ''), 14, 1, null]];
    if(E.refreshText){ const n = Ivory.linesNeeded(cls, E.refreshText, tw, lh); blk.push([cls, E.refreshText, n*lh, n, 'oh.refreshments', 2]); }
    else if(E.refreshTitle) blk.push(['rt', E.refreshTitle, 40, 1, 'oh.refreshTitle', 2]);
    if(E.note){ blk.push(['rk', 'Good to know', 18, 1, null, 5]); const n = Ivory.linesNeeded('nx', E.note, tw, lh - 1.5); blk.push(['nx', E.note, n*(lh - 1.5), n, 'oh.note']); }
    blkH = blk.reduce((a, b) => a + b[2] + (b[5] || 0), 0); BH = Math.max(116, blkH + 28);
    if((654 - BH - 90 - (ph + 14))/lines.length >= 40) break;
  }
  // the box text steps down (15, 14, 13 pt) only when long lines would squeeze the headline below ~44 pt leading
  let ELH = 20, EPX = 22, EPY = 14, EFS = 15, evBoxH = 0;
  for(const [fs, lh, px, py] of [[15, 20, 22, 14], [14, 18.5, 20, 12], [13, 17, 16, 10]]){
    ELH = lh; EPX = px; EPY = py; EFS = fs;
    evBoxH = [[E.refreshments,'ev b'],[E.note,'ev']].filter(l => l[0]).reduce((a,l) => a + Ivory.linesNeeded(l[1], l[0], 540 - 2*px, lh)*lh + 3, 0) + (E.note || E.refreshments ? 2*py : 0);
    if((654 - (evBoxH + 10) - 119 - ph - 14)/lines.length >= 44) break;
  }
  { const st = document.createElement('style'); st.textContent = `.ev{font-size:${EFS}pt;line-height:${ELH}pt}`; document.head.appendChild(st); }
  // the white event box takes room from the photo's foot and the headline's leading; a house that sits low in its photo keeps its room
  h += angled ? OHL.photo(D, hero, `left:0;top:0;width:612pt;height:${ph}pt;clip-path:polygon(0 0,100% 0,100% ${cut*100}%,0 100%)`).replace('class="photo ', `data-clear="0,0,1,${cut}" class="photo `)
              : OHL.photo(D, hero, `left:0;top:0;width:612pt;height:${ph}pt`);

  // headline
  const evRoom = evBoxH ? evBoxH + 10 : (second ? 62 : 0);
  const LH = RF ? Math.min(74, Math.max(38, (654 - BH - 90 - (ph + 14))/lines.length)) : Math.min(74, Math.max(38, (654 - evRoom - 71 - 16 - 16 - (ph + 14))/lines.length)), ht = ph + 14 + (2 - lines.length)*(74 - LH)/2;
  lines.forEach((t, i) => h += `<div class="abs hl" style="left:32pt;top:${ht + i*LH}pt;width:330pt;height:${LH+4}pt;line-height:${LH}pt" data-slot="oh.label" data-lines="1">${esc(t)}</div>`);
  // ribbon on the diagonal's angle, running off the right edge
  const rib = String((C.listing||{}).kicker || '').trim() || Ivory.factsShort(L).replace(/  \/  /g, '  ·  ');
  h += `<div class="rib" style="left:330pt;top:${ph - 2}pt;width:320pt;height:34pt;transform:rotate(${-ang}deg)"><span data-slot="kicker" data-lines="1" style="width:270pt;height:16pt">${esc(rib)}</span></div>`;

  // date and time
  let y = ht + lines.length*LH + 8;
  h += `<div class="abs" style="left:36pt;top:${y}pt;width:540pt;height:1pt;background:var(--on-main);opacity:.35"></div>`;
  y += 8;
  const DH = second ? 48 : 42;
  h += `<div class="abs date" style="left:36pt;top:${y}pt;width:380pt;height:${DH}pt;${second ? 'line-height:48pt' : ''}" data-fit="${second ? 44 : 36},26" data-slot="oh.date" data-lines="1">${esc(E.long)}</div>`;
  if(E.time) h += `<div class="abs time" style="left:36pt;top:${y+DH}pt;width:380pt;height:29pt" data-slot="oh.time" data-lines="1">${esc(E.time)}</div>`;
  // facts stacked at right, the event lines under them
  // the facts column is extra: it goes when the event lines need its room
  let fl = RF ? [] : Ivory.facts(L).map(t => t.replace(' square feet', ' sq ft'));
  if(second){
    const cells = [];
    if(L.beds) cells.push([L.beds, L.beds == 1 ? 'Bed' : 'Beds']);
    if(L.baths) cells.push([L.baths + (L.halfBaths ? '.5' : ''), 'Baths']);
    if(L.sqft) cells.push([Number(L.sqft).toLocaleString('en-US'), 'Sq ft']);
    h += `<div class="abs" style="left:${432}pt;top:${y+2}pt;width:1.4pt;height:${cells.length*24+6}pt;background:var(--accent-on-main);transform:rotate(${-ang*.8}deg);transform-origin:50% 50%"></div>`;
    cells.forEach(([v, k], i) => {
      h += `<div class="abs fn" style="left:442pt;top:${y+4+i*24}pt;width:68pt;height:24pt" data-slot="fact.${i}" data-lines="1">${esc(v)}</div>`;
      h += `<div class="abs fl" style="left:518pt;top:${y+4+i*24}pt;width:60pt;height:24pt" data-slot="fact.${i}.k" data-lines="1">${esc(k)}</div>`;
    });
    fl = [];
  } else {
  if(fl.length) h += `<div class="abs" style="left:424pt;top:${y+4}pt;width:.9pt;height:${fl.length*14+2}pt;background:var(--accent-on-main)"></div>`;
  fl.forEach((t, i) => h += `<div class="abs facts" style="left:432pt;top:${y+4+i*14}pt;width:144pt;height:15pt" data-slot="fact.${i}" data-lines="1">${esc(t)}</div>`);
  }
  let ev;
  if(RF){
    // the white box (right edge on the lean) and the food photo beside it on the same lean, off the page's right edge
    const by0 = y + 74, PHt = 74 + BH, edge = BX + BW;   // photo from the date's top to the box's foot
    const bs = BH*SL, pl = edge - bs + 8, pw = 612 - pl, d = PHt*SL;
    ev = {h: BH + 74 - 76 + 0};
    let hh = `<div class="abs" data-box="oh.box" style="left:${BX}pt;top:${by0}pt;width:${BW}pt;height:${BH}pt;background:#fff;clip-path:polygon(0 0,100% 0,${((BW - bs)/BW*100).toFixed(2)}% 100%,0 100%)"></div>`;
    hh += OHL.photo(D, food, `left:${pl}pt;top:${y}pt;width:${pw}pt;height:${PHt}pt;clip-path:polygon(${(d/pw*100).toFixed(2)}% 0,100% 0,100% 100%,0 100%)`);
    let ty = by0 + (BH - blkH)/2; const tx = BX + 20, tw = BW - 38 - 30 - Math.round(BH*SL);
    blk.forEach(([c, t, hgt, n, slot, gap]) => { ty += gap || 0;
      hh += `<div class="abs ${c}" style="left:${tx}pt;top:${ty}pt;width:${tw}pt;height:${hgt + (/^rx|^nx/.test(c) ? 3 : 0)}pt;${c === 'rk' ? 'color:' + tagC + ';' : ''}${/^rx|^nx/.test(c) ? 'white-space:normal;' : ''}"${slot ? ` data-slot="${slot}" data-lines="${n}"` : ''}${c === 'rt' ? ' data-fit="32,20"' : ''}>${esc(t)}</div>`; ty += hgt; });
    ev.html = hh;
  } else ev = Ivory.eventBox([[E.refreshments,'oh.refreshments','ev b'],[E.note,'oh.note','ev']], 36, y + 76 + (second ? 12 : 0), 540, ELH, 3,
    {bg:'#fff', padX:EPX, padY:EPY, scale:((D.openHouse||{}).box||{}).w});
  h += ev.html;
  // nothing in the box and no note: an interior photo cuts across the freed room on the diagonal's lean
  const free = 654 - (y + 92);
  // (11/01, owner) the nothing-entered version carries a short write-up about the house here instead; the photo strip is the fallback
  const wu = second && !ev.h && free >= 40 ? OHL.writeup(D, 'wu', 504, 21, Math.min(6, Math.floor((free - 6)/21)), Ivory.factsShort(L), {narrow: true}) : {text: '', n: 0};
  if(wu.text){
    const ww = wu.w || 504, wh = wu.n*21, wy = y + 92 + (free - wh)/2 - 2;
    h += `<div class="abs" style="left:36pt;top:${wy + 3}pt;width:3pt;height:${wh - 6}pt;background:var(--accent-on-main)"></div>`;
    h += `<div class="abs wu" style="left:52pt;top:${wy}pt;width:${ww}pt;height:${wh + 3}pt" data-slot="writeup" data-lines="${wu.n}">${esc(wu.text)}</div>`;
  } else if(second && !ev.h && free >= 40){
    const inner = OHL.photos(D).filter(id => id !== hero && !Ivory.fullHouse(D, id) && !/exterior|yard|lawn|aerial|street/i.test((D.photos[id]||{}).tags||''))[0];
    if(inner){ const sh = Math.min(128, free);
      h += OHL.photo(D, inner, `left:36pt;top:${y+92}pt;width:540pt;height:${sh}pt;clip-path:polygon(${Math.min(8, sh*.07)/5.4}% 0,100% 0,${100 - Math.min(8, sh*.07)/5.4}% 100%,0 100%)`);
      h += `<div class="abs" style="left:36pt;top:${y+92+sh+3}pt;width:540pt;height:1.4pt;background:var(--accent-on-main);opacity:.0"></div>`; }
  }
  const issues = (y + (RF ? 74 + BH : 76 + (second ? 12 : 0) + ev.h) > 658) ? [{slot:'oh.note', kind:'overflow', detail:'event lines run into the address band'}] : [];

  // address and agent band (the one logo)
  const by = 664;
  // the blue runs the whole page: the address and agent sit right on it, no separate band (the owner 10/30 evening)
  h += `<div class="abs" style="left:36pt;top:${by-4}pt;width:540pt;height:1pt;background:var(--on-main);opacity:.35"></div>`;
  h += `<div class="abs addr" style="left:36pt;top:${by+10}pt;width:330pt;height:28pt" data-slot="address" data-lines="1">${esc(L.address)}</div>`;
  h += `<div class="abs place" style="left:36pt;top:${by+38}pt;width:330pt;height:12pt" data-slot="place" data-lines="1">${esc(OHL.place(L))}</div>`;
  h += OHL.contact(D, {x:36, y:by+54, w:540, h:60, tone:'dark', nameSize:18, logoW:176, logoH:46, nameFont:"'Asap Condensed'", nameWeight:700, bodyFont:'Outfit'});
  h += `<div class="abs fine" style="left:36pt;top:${by+118}pt;width:540pt;height:8pt" data-slot="fineprint" data-lines="1" data-fine="1">${esc(C.fineprint || 'Information deemed reliable but not guaranteed.')}</div>`;
  const f = OHL.frame(D, h.replace(/([^\s<>"]+) · /g, '<span style="white-space:nowrap">$1 ·</span> '));   // a "·" never starts a line
  f.issues = issues;
  f.after = () => {
    const els = [...document.querySelectorAll('.hl')];
    const s = Math.min(...els.map(el => OHL.fit(el, Math.min(86, Math.max(36, 86*LH/74)), 36)));
    els.forEach(el => el.style.fontSize = s+'pt');
  };
  return f;
});
</script>
</body>
</html>
