<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · Open house library · Ruled Editorial</title>
<link rel="stylesheet" href="ohlib.css">
<script src="../ivory/ivory.js"></script>
<script src="ohlib.js"></script>
<!--
  Ruled Editorial (from reference P01). Trim 612 x 792 pt. Public or REALTOR(R).
  The owner: striking, but set the address more cleanly (the city in a different type), show the broker logo, the agent's
  name and both times. Full-width rules divide the page like a magazine: the event wording huge on two lines, the street
  in large type with the neighborhood and city below it in small spaced capitals, the house and a room, the writer's
  short line, then the full date and the time from start to end, the event box (white, thin ink line, the owner 10/30) and the agent with the logo.
  Type: Epilogue (headline, street, date), Hanken Grotesk (details).
-->
<style>
  .sheet{background:var(--paper);color:var(--ink)}
  .rule{position:absolute;left:30pt;width:552pt;height:1.2pt;background:var(--ink)}
  .hl{font:600 104pt/96pt Epilogue;text-transform:uppercase;letter-spacing:-3pt;white-space:nowrap;overflow:hidden}
  .join{font:500 15pt/18pt 'Hanken Grotesk';color:var(--main-on-paper)}
  .street{font:600 23pt/26pt Epilogue;letter-spacing:-.3pt}
  .city{font:600 11pt/14pt 'Hanken Grotesk';letter-spacing:2pt;text-transform:uppercase;color:var(--main-on-paper);white-space:nowrap;overflow:hidden}
  .tag{font:400 12pt/16pt 'Hanken Grotesk'}
  .facts{font:700 10pt/13pt 'Hanken Grotesk';text-transform:uppercase;white-space:nowrap;overflow:hidden;text-align:justify;text-align-last:justify;letter-spacing:.6pt}
  .date{font:600 34pt/38pt Epilogue;letter-spacing:-.8pt;white-space:nowrap;overflow:hidden}
  .time{font:600 20pt/24pt 'Hanken Grotesk';white-space:nowrap;overflow:hidden;color:var(--main-on-paper)}
  .evb{font:500 12pt/16pt 'Hanken Grotesk';color:var(--ink)}
  .evb.b{font-weight:700}
  .oh-agent-name{font-family:Epilogue;font-weight:600}
  .oh-agent{font-family:'Hanken Grotesk'}
  .fine{font:400 6.6pt/8pt 'Hanken Grotesk';white-space:nowrap;opacity:.6}
</style>
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
OHL.start(['600 10pt Epilogue', '400 10pt "Hanken Grotesk"', '500 10pt "Hanken Grotesk"', '600 10pt "Hanken Grotesk"'], D => {
  const esc = Ivory.esc, L = D.listing, C = D.companion || {};
  const E = OHL.event(D), hero = OHL.hero(D, 'straight');
  const room = OHL.photos(D).find(id => id !== hero && /living|kitchen/i.test(D.photos[id].tags||'')) || OHL.photos(D).find(id => id !== hero && !Ivory.fullHouse(D, id));
  let h = '';
  // the headline, two rules, a short "you're invited" beside the second line
  const lines = OHL.labelLines(E.label, 2);
  h += `<div class="rule" style="top:26pt"></div>`;
  h += `<div class="abs hl" id="h0" style="left:26pt;top:30pt;width:556pt;height:100pt" data-slot="oh.label" data-lines="1">${esc(lines[0])}</div>`;
  h += `<div class="rule" style="top:130pt"></div>`;
  h += `<div class="abs join" style="left:30pt;top:156pt;width:70pt;height:40pt">You're<br>invited</div>`;
  h += `<div class="abs hl" id="h1" style="left:104pt;top:134pt;width:478pt;height:100pt;text-align:right" data-slot="oh.label" data-lines="1">${esc(lines[1] || '')}</div>`;
  h += `<div class="rule" style="top:236pt"></div>`;
  // the house left, street and city right
  // the photo row takes what the date row and agent row leave
  const BX = ((D.openHouse||{}).box||{}).w, BS = Math.max(.8, Math.min(1.25, +BX || 1));
  const evH0 = [E.refreshments, E.note].filter(Boolean).reduce((a, t) => a + Ivory.linesNeeded('evb', t, 236*BS - 24, 16)*16 + 3, 0) + ([E.note, E.refreshments].some(Boolean) ? 18 : 0);
  const y = 250, pw = 300, ph = 200;
  const fr = OHL.fitHero(D, hero, pw, ph);
  h += OHL.photo(D, hero, `left:${30 + (pw - fr.w)/2}pt;top:${y}pt;width:${fr.w}pt;height:${ph}pt`);
  const rx = 350, rw = 232;
  const sn = Ivory.linesNeeded('street', L.address, rw, 26);
  h += `<div class="abs street" style="left:${rx}pt;top:${y}pt;width:${rw}pt;height:${sn*26+5}pt" data-slot="address" data-lines="${sn}">${esc(L.address)}</div>`;
  h += `<div class="abs city" style="left:${rx}pt;top:${y + sn*26 + 1}pt;width:${rw}pt;height:14pt" data-slot="place" data-lines="1">${esc(OHL.place(L))}</div>`;
  // the facts on one line; two or more half baths can make it too long at 10 pt, then it breaks between facts onto
  // two lines set flush left and the room photo under it gives up the 13 pt (one line: exactly as approved)
  const fts = Ivory.factsShort(L).split('  /  '), f1 = fts.join('  ·  ');
  let fl = [f1];
  if((+L.halfBaths || 0) >= 2 && Ivory.linesNeeded('facts', f1, rw, 13) > 1){ const m = Math.ceil(fts.length/2); fl = [fts.slice(0, m).join('  ·  '), fts.slice(m).join('  ·  ')]; }
  fl.forEach((t, i) => h += `<div class="abs facts" style="left:${rx}pt;top:${y + sn*26 + 24 + i*13}pt;width:${rw}pt;height:13pt${fl.length > 1 ? ';text-align:left;text-align-last:left' : ''}" data-slot="oh.facts${i ? '.2' : ''}" data-lines="1">${esc(t)}</div>`);
  // the room under the address, as tall as the space left beside the house allows (at least 70 pt)
  const rt = y + sn*26 + 46 + (fl.length - 1)*13, rhh = Math.min(120, y + ph - rt);
  if(rhh >= 70) h += OHL.photo(D, room, `left:${rx}pt;top:${y + ph - rhh}pt;width:${rw}pt;height:${rhh}pt`);
  // the date row sits just above the agent row; any room between gets a strip of three rooms
  let dy = 690 - 18 - evH0 - 104;
  const gap = dy - 16 - (y + ph + 14);
  if(gap >= 76){
    const others = OHL.photos(D).filter(id => id !== hero && id !== room && !Ivory.fullHouse(D, id)).slice(0, 3), sw = (552 - 20)/3, sh = Math.min(gap - 28, 150);
    others.forEach((id, i) => h += OHL.photo(D, id, `left:${30 + i*(sw+10)}pt;top:${y + ph + 14 + 14}pt;width:${sw}pt;height:${sh}pt`));
    dy = y + ph + 14 + 14 + sh + 30;
  }
  h += `<div class="rule" style="top:${dy - 16}pt"></div>`;
  const dl = String(E.long).split(/,\s*/), dtxt = dl.length === 2 ? dl[0] + ',<br>' + esc(dl[1]) : esc(E.long);
  h += `<div class="abs date" style="left:346pt;top:${dy}pt;width:236pt;height:${dl.length === 2 ? 76 : 38}pt;text-align:right" data-fit="34,24" data-slot="oh.date" data-lines="${dl.length === 2 ? 2 : 1}">${dl.length === 2 ? esc(dl[0]) + ',<br>' + esc(dl[1]) : esc(E.long)}</div>`;
  const dh = dl.length === 2 ? 76 : 38;
  if(E.time) h += `<div class="abs time" style="left:346pt;top:${dy+dh+2}pt;width:236pt;height:24pt;text-align:right" data-slot="oh.time" data-lines="1">${esc(E.time)}</div>`;
  const ey0 = dy + dh + (E.time ? 28 : 2);
  const ev = Ivory.eventBox([[E.refreshments,'oh.refreshments','evb b'],[E.note,'oh.note','evb']], 346, ey0 + 2, 236, 16, 3, {bg:'#fff', line:'var(--ink)', lineW:1, scale:BX, anchor:1, padX:12, padY:9});
  h += ev.html; ev.h += 2;
  // the write-up: only as wide as the photo above, between the rules, apart from the date block
  const wy = dy - 16 + 12, wmax = Math.floor((680 - wy)/16);
  const wu = OHL.writeup(D, 'tag', 300, 16, wmax);
  const tag = wu.text || String((C.listing||{}).kicker || '').trim();
  if(tag) h += `<div class="abs tag" style="left:30pt;top:${wy}pt;width:300pt;height:${(wu.n || 1)*16 + 2}pt" data-slot="${wu.text ? 'oh.writeup' : 'kicker'}" data-lines="${wu.n || 1}">${esc(tag)}</div>`;
  dy = ey0 + ev.h;
  const cy = 700;
  // room under the write-up (the left column): another room fills it when the event box leaves the space
  const wuEnd = wy + (wu.n || 1)*16 + 14, rest = cy - 20 - wuEnd;
  if(rest >= 70 && gap < 76){
    const more = OHL.photos(D).filter(id => id !== hero && id !== room && !Ivory.fullHouse(D, id))[0];
    if(more) h += OHL.photo(D, more, `left:30pt;top:${wuEnd}pt;width:300pt;height:${Math.min(rest, 150)}pt`);
  }
  const issues = dy > cy - 18 ? [{slot:'oh.note', kind:'overflow', detail:'the event lines run into the agent row'}] : [];
  h += `<div class="rule" style="top:${cy - 10}pt"></div>`;
  h += OHL.contact(D, {x:30, y:cy, w:552, h:62, tone:'light', nameSize:18, phoneSize:13, lineSize:9.5, logoW:180, logoH:50});
  h += `<div class="rule" style="top:770pt;height:.6pt;opacity:.4"></div>`;
  h += `<div class="abs fine" style="left:30pt;top:776pt;width:552pt;height:8pt" data-slot="fineprint" data-lines="1" data-fine="1">${esc(C.fineprint || 'Information deemed reliable but not guaranteed.')}</div>`;
  const f = OHL.frame(D, h);
  f.issues = issues;
  f.after = () => { const a = document.getElementById('h0'), b = document.getElementById('h1'); const s = Math.min(OHL.fit(a, 104, 40), b.textContent ? OHL.fit(b, 104, 40) : 999); [a, b].forEach(el => el.style.fontSize = s + 'pt'); };
  return f;
});
</script>
</body>
</html>
