<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · Open house library · Color Grid (refreshments)</title>
<link rel="stylesheet" href="ohlib.css">
<script src="../ivory/ivory.js"></script>
<script src="ohlib.js"></script>
<!--
  Color Grid, refreshments version (10/31/2026; from reference P19). Trim 612 x 792 pt. REALTOR(R) / broker opens.
  Same blocks, grid and type as Color Grid. The refreshments get their own full-width white box (main-color border) under
  the grid: the matching food photo at left, real size, the refreshment type, the agent's words (15 pt) and the special
  note ("Good to know") at right. To make room the grid is the house, one room beside the facts block. Nothing entered:
  the base design's own grid (house, three rooms and the facts block) with the note box under it.
  The owner: clean, neat and straightforward. Blocks of the agent's main color give a plain photo grid one structure: the
  event wording and the date and time in two header blocks, the house and four rooms in a grid, and a features block
  with the listing facts. No price. Agent and logo along the foot.
  Event box (10/30): what's served and the notes in a white box with a main-color border, 12 pt, under the grid.
  Type: Schibsted Grotesk.
-->
<style>
  .sheet{background:var(--paper);color:var(--ink)}
  .blk{position:absolute;background:var(--main)}
  .on{color:var(--on-main)}
  .hl{font:700 30pt/33pt 'Schibsted Grotesk';white-space:nowrap;overflow:hidden}
  .date{font:700 20pt/25pt 'Schibsted Grotesk';text-align:right;white-space:nowrap;overflow:hidden}
  .plc{font:500 10.5pt/14pt 'Schibsted Grotesk';text-align:right;white-space:nowrap;overflow:hidden}
  .time{font:500 18pt/23pt 'Schibsted Grotesk';text-align:right;white-space:nowrap;overflow:hidden}
  .addr{font:600 15pt/18pt 'Schibsted Grotesk';text-align:right;white-space:nowrap;overflow:hidden}
  .k{font:700 14pt/17pt 'Schibsted Grotesk';letter-spacing:3pt;text-transform:uppercase;text-align:center;white-space:nowrap}
  .f{font:500 14pt/22pt 'Schibsted Grotesk';text-align:center;white-space:nowrap;overflow:hidden}
  .evb{font:500 12pt/16pt 'Schibsted Grotesk';text-align:center;color:var(--ink)}
  .evb.b{font-weight:700}
  .rk{font:700 9pt/12pt 'Schibsted Grotesk';letter-spacing:3pt;text-transform:uppercase;color:var(--main-on-paper);white-space:nowrap}
  .rt{font:700 20pt/24pt 'Schibsted Grotesk';color:var(--main-on-paper);white-space:nowrap;overflow:hidden}
  .rx{font:600 16pt/20pt 'Schibsted Grotesk';color:var(--ink)}
  .gk{font:700 9pt/12pt 'Schibsted Grotesk';letter-spacing:2.4pt;text-transform:uppercase;color:var(--main-on-paper);white-space:nowrap}
  .gn{font:500 12pt/16pt 'Schibsted Grotesk';color:var(--ink)}
  .oh-agent-name{font-family:'Schibsted Grotesk';font-weight:700}
  .oh-agent{font-family:'Schibsted Grotesk'}
  .fine{font:400 6.6pt/8pt 'Schibsted Grotesk';white-space:nowrap;opacity:.6}
</style>
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
OHL.start(['700 10pt "Schibsted Grotesk"', '500 10pt "Schibsted Grotesk"'], D => {
  const esc = Ivory.esc, L = D.listing, C = D.companion || {};
  const E = OHL.event(D), hero = OHL.hero(D, 'straight');
  const rooms = OHL.photos(D).filter(id => id !== hero && !Ivory.fullHouse(D, id)).slice(0, 4);
  const X = 24, G = 8, W = 612 - 2*X, HW = (W - G)/2;
  let h = '';
  // two header blocks
  const hh = 104;
  h += `<div class="blk" style="left:${X}pt;top:${X}pt;width:${HW}pt;height:${hh}pt"></div><div class="blk" style="left:${X+HW+G}pt;top:${X}pt;width:${HW}pt;height:${hh}pt"></div>`;
  const lines = OHL.labelLines(E.label);
  lines.forEach((t, i) => h += `<div class="abs on hl" style="left:${X+16}pt;top:${X + 16 + i*34}pt;width:${HW-28}pt;height:36pt" data-slot="oh.label" data-lines="1">${esc(t)}</div>`);
  const rx = X + HW + G + 12, rw = HW - 26;
  h += `<div class="abs on date" style="left:${rx}pt;top:${X+12}pt;width:${rw}pt;height:25pt" data-fit="20,18" data-slot="oh.date" data-lines="1">${esc(E.long)}</div>`;
  if(E.time) h += `<div class="abs on time" style="left:${rx}pt;top:${X+38}pt;width:${rw}pt;height:23pt" data-slot="oh.time" data-lines="1">${esc(E.time)}</div>`;
  h += `<div class="abs on addr" style="left:${rx}pt;top:${X+62}pt;width:${rw}pt;height:18pt" data-fit="15,12" data-slot="address" data-lines="1">${esc(L.address)}</div>`;
  h += `<div class="abs on plc" style="left:${rx}pt;top:${X+82}pt;width:${rw}pt;height:14pt;opacity:.9" data-slot="place" data-lines="1">${esc(OHL.place(L))}</div>`;
  // grid: house full width, then rooms 2 x 2 with the features block in the last cell
  const food = Object.keys(D.photos||{}).find(id => /^food\b/i.test(D.photos[id].tags||''));
  const mkEv = yy => Ivory.eventBox([[E.note,'oh.note','evb']], X, yy, W, 16, 3,
    {bg:'#fff', line:'var(--main)', lineW:1.5, padY:9, padX:16, scale:((D.openHouse||{}).box||{}).w});
  const R = E.hasRefresh;
  const ev = R ? {h: 0} : mkEv(0);
  // the white refreshments box: food photo at left, then the type, the agent's words and the note
  const fp = food ? (D.photos[food] || {}) : null, tall = fp && fp.h > fp.w;
  const fw = food ? (tall ? 140 : 226) : 0, tx0 = X + 14 + (fw ? fw + 16 : 0), tw = X + W - 14 - tx0;
  let rbH = 0;
  if(R){
    const nT = E.refreshText ? Ivory.linesNeeded('rx', E.refreshText, tw, 20) : 0, nN = E.note ? Ivory.linesNeeded('gn', E.note, tw, 16) : 0;
    const content = 14 + (E.refreshTitle ? 26 : 0) + (nT ? nT*20 + 2 : 0) + (E.note ? 10 + 13 + nN*16 : 0);
    rbH = Math.max(fw ? 158 : 0, content + 26);
  }
  const rowH = R ? 112 : 118;
  const gy = X + hh + G, bottom = 692 - (R ? rbH + G : (ev.h ? ev.h + 8 : 0));
  const houseH = R ? bottom - gy - G - rowH : bottom - gy - 2*(rowH + G);
  const fr = OHL.fitHero(D, hero, W, houseH);
  if(fr.w < W) h += `<div class="blk" style="left:${X}pt;top:${gy}pt;width:${W}pt;height:${houseH}pt;opacity:.12"></div>`;
  h += OHL.photo(D, hero, `left:${X + (W - fr.w)/2}pt;top:${gy}pt;width:${fr.w}pt;height:${houseH}pt`);
  const r1 = gy + houseH + G, r2 = r1 + rowH + G;
  if(R){
    if(rooms[0]) h += OHL.photo(D, rooms[0], `left:${X}pt;top:${r1}pt;width:${HW}pt;height:${rowH}pt`);
  } else [[X, r1], [X+HW+G, r1], [X, r2]].forEach(([x, y], i) => { if(rooms[i]) h += OHL.photo(D, rooms[i], `left:${x}pt;top:${y}pt;width:${HW}pt;height:${rowH}pt`); });
  const fy = R ? r1 : r2;
  h += `<div class="blk" style="left:${X+HW+G}pt;top:${fy}pt;width:${HW}pt;height:${rowH}pt"></div>`;
  // no heading; four facts centered top to bottom and side to side in the block (owner 10/28/2026)
  const fs = OHL.factSix(L).map(f => f[1]), fl = R ? 22 : 24;
  const facts = [...Ivory.facts(L).filter(t => !/half bath/.test(t)).slice(0, 3), ...fs.filter(t => /^Built in/.test(t))].slice(0, 4);
  for(const t of fs){ if(facts.length >= 4) break; if(!facts.includes(t) && !/bedroom|full bath|square feet/.test(t)) facts.push(t); }
  const fy0 = fy + (rowH - facts.length*fl)/2;
  facts.forEach((t, i) => h += `<div class="abs on f" style="left:${X+HW+G+10}pt;top:${fy0 + i*fl}pt;width:${HW-20}pt;height:${fl}pt;line-height:${fl}pt" data-slot="fact.${i}" data-lines="1">${esc(t)}</div>`);
  if(R){
    const by = r1 + rowH + G;
    h += `<div class="abs" data-box="oh.box" style="left:${X}pt;top:${by}pt;width:${W}pt;height:${rbH}pt;background:#fff;border:1.5pt solid var(--main);box-sizing:border-box"></div>`;
    if(food) h += OHL.photo(D, food, `left:${X+8}pt;top:${by+8}pt;width:${fw}pt;height:${rbH-16}pt`);
    const nT = E.refreshText ? Ivory.linesNeeded('rx', E.refreshText, tw, 20) : 0, nN = E.note ? Ivory.linesNeeded('gn', E.note, tw, 16) : 0;
    const content = 12 + (E.refreshTitle ? 26 : 0) + (nT ? nT*20 + 2 : 0) + (E.note ? 10 + 13 + nN*16 : 0);
    let ty = by + (rbH - content)/2;
    h += `<div class="abs rk" style="left:${tx0}pt;top:${ty}pt;width:${tw}pt;height:12pt">Refreshments</div>`; ty += 14;
    if(E.refreshTitle){ h += `<div class="abs rt" style="left:${tx0}pt;top:${ty}pt;width:${tw}pt;height:24pt" data-slot="oh.refreshTitle" data-lines="1">${esc(E.refreshTitle)}</div>`; ty += 26; }
    if(nT){ h += `<div class="abs rx" style="left:${tx0}pt;top:${ty}pt;width:${tw}pt;height:${nT*20+2}pt" data-slot="oh.refreshments" data-lines="${nT}">${esc(E.refreshText)}</div>`; ty += nT*20 + 2; }
    if(E.note){ ty += 10;
      h += `<div class="abs gk" style="left:${tx0}pt;top:${ty}pt;width:${tw}pt;height:12pt">Good to know</div>`; ty += 13;
      h += `<div class="abs gn" style="left:${tx0}pt;top:${ty}pt;width:${tw}pt;height:${nN*16}pt" data-slot="oh.note" data-lines="${nN}">${esc(E.note)}</div>`; }
  } else if(ev.h) h += mkEv(r2 + rowH + 8).html;
  const issues = houseH < 150 ? [{slot:'oh.note', kind:'overflow', detail:'the house photo is squeezed too small'}] : [];
  h += OHL.contact(D, {x:X, y:702, w:W, h:62, tone:'light', nameSize:18, phoneSize:13, lineSize:9.5, logoW:180, logoH:50});
  h += `<div class="abs fine" style="left:${X}pt;top:778pt;width:${W}pt;height:8pt" data-slot="fineprint" data-lines="1" data-fine="1">${esc(C.fineprint || 'Information deemed reliable but not guaranteed.')}</div>`;
  const f = OHL.frame(D, h.replace(/([^\s<>"]+) · /g, '<span style="white-space:nowrap">$1 ·</span> '));   // a "·" never starts a line
  f.issues = issues;
  f.after = () => OHL.stack([...document.querySelectorAll('.hl')], 30, 18, X + (lines.length > 1 ? 16 : 32), 1.08);
  return f;
});
</script>
</body>
</html>
