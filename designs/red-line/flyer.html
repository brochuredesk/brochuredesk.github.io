<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · The Red Line two-sided flyer</title>
<link rel="stylesheet" href="red-line.css">
<script src="red-line.js"></script>
<script src="../engine/setpieces.js"></script>
<script src="../engine/baths.js"></script>
<script src="../engine/planrooms.js"></script>
<!--
  The Red Line · optional two-sided 8.5 x 11 listing flyer (trim 612 x 792 pt; print: 0.25 in white margin around the field).
  data.piece.side = "front" | "back".
  Same family as the fold-over: white paper, one strong red; the red rail down the left edge with the whole address turned
  on its side in white condensed caps (as on the cover); red condensed kickers; the four-fact rows with their red rule over
  a number and its label; heavy red rules between rows of photos; captions with the condensed caps name and a red tag;
  red-square bullets; the plan placed as given; the standard contact card.

  FRONT  The whole house against the rail, then the place line, the writer's headline and a thin red rule, the whole write-up
         (justified) beside the fact rows (five when the listing has a lot size, otherwise four that grow to fill the same
         height), both ending on the line the write-up ends on. A heavy red rule, then three captioned rooms down to the fine
         print. No agent card and no logo on the front (owner 11/10/2026).
  BACK   The rail again, a kicker and the title over a heavy red rule. Down the left: the listing's own floor plan placed as
         given (plan version), or the rooms floor by floor with their sizes (no-plan version), over the narrow contact card
         (the back's one logo is on its band). Down the right, to the fine print: four captioned rooms in two rows split by a
         heavy rule, a paragraph, and a red-square list.

  Rules (product.md "Two-sided 8.5x11 flyer rules" 10/28 and the owner's Round 4 standing rules 11/1/2026): no logo on the
  front, one on the back; no listing price, no QR, no "virtually staged"; room sizes in feet only (18' x 12'), the plan image as
  given; the half bath's ½ at full size (BD.baths); text fills its space and lines up with the photo and rule edges; a row
  of captions runs the same number of lines; photos soak up the slack.

  Data:  companion.flyer = {
    headline,
    desc: {text: [sentence, ...]},                       the write-up (the template keeps the sentences that fill the box)
    front: {hero: id, photos: [id x3]},
    photos: {id: {title, tag?, sentences: [..]}},        caption pools; the template picks the sentences that fill each box
    plan:   {kicker, title, grid: [id x4], para: {label, text: [..]}, list: {head, items: [..]}, planNote?},
    noplan: {kicker, title, grid: [id x4], para, list, floors: [{n, tag?, text: [..], rooms: [[name, size]]}]}}
  Anything missing is built from the fold-over's copy in data.copy.
-->
<style>
  .cc{--cc-paper:#ffffff;--cc-ink:#1b1b1d;--cc-muted:#5d6266;--cc-accent:#d7262b;--cc-line:rgba(215,38,43,.40);--cc-display:'Oswald',Impact,sans-serif}
  .rail .st{position:absolute;writing-mode:vertical-rl;transform:rotate(180deg);font:700 40pt/46pt var(--font-display);color:#fff;text-transform:uppercase;white-space:nowrap;letter-spacing:1.5pt}
  .fl-place{font:600 9.5pt/11pt var(--font-display);letter-spacing:1.7pt;text-transform:uppercase;color:var(--accent);white-space:nowrap;overflow:hidden}
  .fl-hl{font:700 28pt/34pt var(--font-display);letter-spacing:.1pt;color:var(--ink);white-space:nowrap;overflow:hidden}
  .fl-title{font:700 28pt/32pt var(--font-display);letter-spacing:.1pt;color:var(--ink);white-space:nowrap;overflow:hidden}
  .fl-body{font-size:10pt;line-height:14pt;color:var(--text);overflow:hidden}
  .fstack{position:absolute;display:flex;flex-direction:column}
  .fstack > div{flex:1 1 0;display:flex;align-items:center;gap:8pt;border-top:1.4pt solid var(--accent);white-space:nowrap;overflow:hidden}
  .fstack .v{font:700 19pt/22pt var(--font-display);color:var(--ink)}
  .fstack.four .v{font-size:22pt;line-height:26pt}
  .fstack.tight .v{font-size:16pt;line-height:18pt}
  .fstack .l{font:600 8pt/10pt var(--font-display);letter-spacing:1.3pt;text-transform:uppercase;color:var(--muted)}
  .cap.fl .nm{font:600 12pt/16pt var(--font-display);height:17pt;letter-spacing:.4pt}
  .cap.fl .nm span{font-size:10pt;text-transform:none;letter-spacing:.3pt}
  .cap.fl .tx{margin-top:0}
  .fl-fine{font:400 6pt/8pt var(--font-body);color:var(--muted);white-space:nowrap;overflow:hidden}
  .fl-note{position:absolute;font:400 8pt/10pt var(--font-body);color:var(--muted);overflow:hidden}
  .fl-sub{font:600 9.5pt/11pt var(--font-display);letter-spacing:1.6pt;text-transform:uppercase;color:var(--accent);white-space:nowrap;overflow:hidden}
  .fl-list{display:grid;grid-template-columns:1fr 1fr;column-gap:12pt;list-style:none}
  .fl-list li{font:600 9pt/15pt var(--font-body);color:var(--ink);white-space:nowrap;overflow:hidden;padding-left:11pt;position:relative}
  .fl-list li:before{content:"";position:absolute;left:0;top:5.5pt;width:5pt;height:5pt;background:var(--accent)}
  .floorlist{position:absolute}
  .floorlist .f{border-top:1.4pt solid var(--accent);padding-top:5pt}
  .floorlist .fn{font:600 14pt/16pt var(--font-display);letter-spacing:.5pt;text-transform:uppercase;color:var(--ink);white-space:nowrap;overflow:hidden;height:16pt}
  .floorlist .fn span{font:600 8.5pt/16pt var(--font-display);letter-spacing:1.3pt;color:var(--accent);margin-left:8pt}
  .floorlist .sm{font-size:9pt;line-height:12pt;color:var(--text);margin-top:3pt;overflow:hidden}
  .floorlist table{width:100%;border-collapse:collapse;margin-top:3pt}
  .floorlist td{font-size:11pt;line-height:14pt;padding:1.5pt 0;border-top:.5pt solid var(--line);color:var(--text);white-space:nowrap}
  .floorlist td:first-child{font-weight:600;color:var(--ink);overflow:hidden}
  .floorlist td:last-child{text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SP.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  RL.fitMode = false;
  const esc = SP.esc, L = D.listing, A = D.agent || {}, b = D.brand || {}, C = D.copy || {}, CP = D.companion || {}, FL = CP.flyer || {};
  const issues = await SP.ready(D);
  await RL.cardReady;
  document.body.dataset.mode = D.mode || 'email';
  const front = (D.piece || {}).side !== 'back';
  const hasPlan = !!(D.plan && D.plan.levels && D.plan.levels.length);
  // owner 11/10/2026: the front carries no contact block and no logo (its content runs down to the fine print); the back's
  // contact block is a narrow card at the foot of the left column, and the right column runs down to the fine print
  const X = 98, W = 496, HX = 78, FBOT = 752, G = 12, CARD_H = 74;
  const BOT = FBOT;
  const P = D.photos || {};
  const has = id => id && SP.src(D, id);

  // ---------- measuring (the page's own fonts) ----------
  const ms = document.createElement('div');
  ms.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;white-space:normal;overflow:visible;font-family:var(--font-body)';
  document.body.appendChild(ms);
  const mcache = {};
  const measure = (text, w, fs, lh, wt) => {
    const key = [text, w, fs, lh, wt].join('|'); if(mcache[key]) return mcache[key];
    ms.style.width = w + 'pt'; ms.style.fontSize = fs + 'pt'; ms.style.lineHeight = lh + 'pt'; ms.style.fontWeight = wt || 400; ms.textContent = text;
    const rg = document.createRange(); rg.selectNodeContents(ms);
    const rows = []; [...rg.getClientRects()].filter(r => r.width > .5).forEach(r => { const row = rows.find(x => Math.abs(x.top - r.top) < lh*.5); if(row) row.right = Math.max(row.right, r.right); else rows.push({top: r.top, right: r.right}); });
    const box = ms.getBoundingClientRect(), last = rows.length ? rows[rows.length-1] : null;
    return mcache[key] = {lines: rows.length, last: last && box.width ? Math.min(1, (Math.min(...rows.map(q => q.right)) - box.left)/box.width) : 0};   // every line counts, set ragged (owner 11/8: text under a photo runs the photo's width)
  };
  // room sizes in feet only, inches dropped and never rounded: 18' x 12' (the owner, Round 4, 11/1/2026)
  const feetOnly = t => String(t).replace(/(\d+)(?:\.\d+)?(?:'\s?\d+(?:\.\d+)?"?)?'?\s*x\s*(\d+)(?:\.\d+)?(?:'\s?\d+(?:\.\d+)?"?)?'?/g, "$1' x $2'");
  const sentences = s => (Array.isArray(s) ? s : String(s || '').match(/(?:[^.!?]|\.(?=\d))+[.!?]+["”’)]*|(?:[^.!?]|\.(?=\d))+$/g) || []).map(x => feetOnly(x).trim()).filter(Boolean);
  const subsets = arr => { const n = Math.min(arr.length, 9), out = [];
    for(let m = 1; m < (1 << n); m++){ const pick = []; for(let i = 0; i < n; i++) if(m & (1 << i)) pick.push(arr[i]); out.push({m, pick}); }
    return out.sort((a, c) => (a.m & -a.m) - (c.m & -c.m) || c.pick.length - a.pick.length || a.m - c.m); };
  const FILLS = [.9, .8];   // every line at least 90% of the width, else 80% (owner 11/8)
  const fitOne = (sents, f, n, fill) => { let best = null;
    for(const {pick} of subsets(sents)){ const t = pick.join(' '), r = measure(t, f.w, f.fs, f.lh, f.wt);
      if(r.lines === n && r.last >= fill) return {text: t, lines: n, last: r.last};
      if(r.lines === n && (!best || r.last > best.last)) best = {text: t, lines: n, last: r.last}; }
    return best; };
  const fillBox = (src, f, ns) => { const sents = sentences(src); if(!sents.length) return {text: '', lines: 0, last: 0, ok: false};
    let fall = null;
    for(const fill of FILLS) for(const n of ns){ const r = fitOne(sents, f, n, fill); if(r && r.last >= fill) return Object.assign(r, {ok: true}); if(r && (!fall || r.last > fall.last)) fall = r; }
    if(fall) return Object.assign(fall, {ok: false});
    const t = sents.join(' '), r = measure(t, f.w, f.fs, f.lh, f.wt); return {text: t, lines: r.lines, last: r.last, ok: false}; };
  // a write-up keeps every sentence (owner 11/10/2026: never shorter than before); it sets justified, at its natural line count, the type
  // raised up to 12% when that brings the last line to 80%+ of the width
  const lastOf = (text, w, fs, lh) => { ms.style.width = w + 'pt'; ms.style.fontSize = fs + 'pt'; ms.style.lineHeight = lh + 'pt'; ms.style.fontWeight = 400; ms.textContent = text;
    const rg = document.createRange(); rg.selectNodeContents(ms); const rows = [];
    [...rg.getClientRects()].filter(r => r.width > .5).forEach(r => { const row = rows.find(x => Math.abs(x.top - r.top) < lh*.5); if(row){ row.l = Math.min(row.l, r.left); row.right = Math.max(row.right, r.right); } else rows.push({top: r.top, l: r.left, right: r.right}); });
    const bx = ms.getBoundingClientRect(), last = rows[rows.length - 1]; return {lines: rows.length, last: last ? (last.right - bx.left)/bx.width : 0}; };
  const fullPara = (src, f, dws) => { const t = sentences(src).join(' '); if(!t) return {text: '', lines: 0, last: 0, ok: false, fs: f.fs, w: f.w};
    let best = null;
    for(const dw of (dws || [0])) for(const z of [1, 1.03, 1.06, 1.09, 1.12]){ const fs = +(f.fs*z).toFixed(2), w = f.w - dw, r = lastOf(t, w, fs, f.lh);
      if(fs*1.2 > f.lh + .01) break;
      const c = {text: t, lines: r.lines, last: r.last, ok: r.lines < 2 || r.last >= .8, fs, w};
      if(c.ok) return c; if(!best || c.last > best.last) best = c; }
    return best; };
  const fillRow = (items, f, ns) => {
    const fw = Array.isArray(f) ? f : items.map(() => f), sn = items.map(sentences);
    for(const fill of FILLS) for(const n of ns){
      const rs = sn.map((s, i) => s.length ? fitOne(s, fw[i], n, fill) : null);
      if(rs.every(r => r && r.last >= fill)) return {rs, n, ok: true}; }
    let best = null;
    for(const n of ns){ const rs = sn.map((s, i) => s.length ? (fitOne(s, fw[i], n, 0) || fillBox(s, fw[i], [n])) : {text: '', lines: 0, last: 0});
      const bad = rs.filter(r => r.lines !== n || r.last < FILLS[1]).length; if(!best || bad < best.bad) best = {rs, n, bad}; }
    return {rs: best.rs, n: best.n, ok: false}; };

  // ---------- the fold-over's copy, by photo (the fallback) ----------
  const ALL = {};
  { const add = arr => (arr || []).forEach(it => { if(it && it.id && !ALL[it.id]) ALL[it.id] = it; });
    const T = C.top || {}, Bo = C.bottom || {}, Bk = C.back || {};
    add(T.lead); add(T.items); add([Bo.lead]); add(Bo.baths); add(Bo.row); add(Bk.mid); add(Bk.xtra); }
  const FP = FL.photos || {};
  const titleOf = id => (FP[id] && FP[id].title) || (ALL[id] && ALL[id].name) || '';
  // the tag (a room size) sits beside the name when both fit on the line; the no-plan back lists the sizes in its floor list instead
  const nmBox = document.createElement('div'); nmBox.className = 'cap fl'; nmBox.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;white-space:nowrap;height:auto';
  nmBox.innerHTML = '<div class="nm" style="overflow:visible;height:auto;display:inline-block"></div>'; document.body.appendChild(nmBox);
  const nameFits = (t, tag, w) => { const el = nmBox.firstChild; el.innerHTML = `<b>${esc(t)}</b>${tag ? `<span>${esc(tag)}</span>` : ''}`; return el.getBoundingClientRect().width*72/96 <= w - 1; };
  const tagOf = (id, w) => { let t = feetOnly((FP[id] && FP[id].tag) || '');
    if(t && !front && !hasPlan && /\d'/.test(t)) t = '';
    if(t && !nameFits(titleOf(id), t, w)) t = ''; return t; };
  const poolOf = id => (CP.capPool && CP.capPool[id]) || (FP[id] && (FP[id].sentences || FP[id].body)) || (ALL[id] && ALL[id].text) || '';   // CP.capPool: the true lines about the photo (owner 11/8: text under a photo fills its width)
  // the caption fitter itself (CapFit), run on a hidden copy: does this photo's pool set in exactly n lines at width w, every line 80%+?
  const cfCache = {};
  const capProbe = (id, w, n) => { const key = [id, w, n].join('|'); if(cfCache[key]) return cfCache[key];
    const pool = CP.capPool && CP.capPool[id]; if(!pool) return cfCache[key] = {ok: false, len: 0};
    const box = document.createElement('div'); box.className = 'cap fl'; box.style.cssText = `position:absolute;left:-9999pt;top:0;visibility:hidden;width:${w}pt`;
    const tx = document.createElement('div'); tx.className = 'tx'; tx.dataset.lines = n; tx.dataset.pool = JSON.stringify(pool); tx.style.height = n*11 + 'pt';
    tx.textContent = sentences(pool)[0] || ''; box.appendChild(tx); document.body.appendChild(box);
    CapFit([tx]); const r = {ok: tx.dataset.capfit === 'ok', len: tx.textContent.length}; box.remove(); return cfCache[key] = r; };
  const fallbackIds = [...((C.top || {}).lead || []), ...((C.top || {}).items || []), ...[(C.bottom || {}).lead || {}], ...((C.bottom || {}).baths || []), ...((C.bottom || {}).row || []), ...((C.back || {}).mid || []), ...((C.back || {}).xtra || [])].map(i => i.id).filter(has);
  const used = new Set();
  const hero = (FL.front && FL.front.hero && has(FL.front.hero)) ? FL.front.hero : ((C.front || {}).photo || Object.keys(P)[0]);
  used.add(hero);
  const pick = (writer, n) => { const out = []; (writer || []).filter(has).forEach(i => { if(out.length < n && !used.has(i)){ used.add(i); out.push(i); } });
    for(const i of fallbackIds){ if(out.length >= n) break; if(!used.has(i)){ used.add(i); out.push(i); } } return out; };

  // ---------- small builders ----------
  const capHTML = (id, slot, x, y, w, r) =>
    `<div class="cap fl abs" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${17 + r.lines*11}pt">
      <div class="nm" data-slot="${slot}.name" data-lines="1" data-fit="10"><b>${esc(titleOf(id))}</b>${tagOf(id, w) ? `<span>${esc(tagOf(id, w))}</span>` : ''}</div>
      <div class="tx" data-slot="${slot}.text" data-pid="${id}" data-para="1" data-min="2" data-lines="${r.lines}"${CP.capPool && CP.capPool[id] ? ` data-pool='${esc(JSON.stringify(CP.capPool[id])).replace(/'/g, '&#39;')}'` : ''} style="height:${r.lines*11}pt">${esc(r.text)}</div></div>`;
  const capTotal = n => 6 + 17 + n*11;
  const kick = (t, x, y, w, slot, cls) => `<div class="abs ${cls || 'fl-sub'}" style="left:${x}pt;top:${y}pt;width:${w}pt;height:11pt" data-slot="${slot}" data-lines="1">${esc(t)}</div>`;
  const thin = (x, y, w) => `<div class="rule" style="left:${x}pt;top:${y}pt;width:${w}pt"></div>`;
  const heavy = (x, y, w) => `<div class="band-rule" style="left:${x}pt;top:${y}pt;width:${w}pt"></div>`;
  const placeLine = ((C.front || {}).kicker) || [L.city, L.state, L.zip].filter(Boolean).join(', ');
  const fine = ((D.copy || {}).pc || {}).fineprint || FL.fineprint || 'Information deemed reliable but not guaranteed.';
  // the rail: red, full height, the whole address turned on its side
  const rail = slot => `<div class="rail" style="left:18pt;top:18pt;width:60pt;height:756pt"><div class="st" data-slot="${slot}" data-lines="1" data-fitstreet="1" style="left:0;bottom:30pt;height:702pt;width:60pt;line-height:60pt">${esc(L.address)}</div></div>`;
  let h = '';
  const fitlog = [];

  // the narrow contact card (owner 11/10/2026, rule 3): about half the old card's width, sized to its content: the headshot (or the
  // accent stripe) beside the name, REALTOR(R), the cell, email and website stacked, the brokerage's logo and office line on a band along
  // its foot. It carries the back's one logo.
  const narrowCard = (x, y, w, hgt) => ContactCard.html([x, y, w, hgt], Object.assign({}, A, {headshot: SP.headshot(D)}), b,
    {layout: 'band', size: 'band', bottomGap: .5, grow: 0, fieldAccent: true, s: {name: 19, nameFloor: 15, phone: 15, line: 9, hsW: 60, bandH: 36, inlineLabel: false, office: 8.5, panelGap: 8, panelPad: [4, 8], logo: {wide: [88, 22], square: [28, 28], tall: [30, 30]}}});

  // the MLS room list floor by floor (true names and sizes)
  const ORD = ['', 'First floor', 'Second floor', 'Third floor', 'Fourth floor'];
  const mlsFloors = () => { const lv = [...new Set((L.rooms || []).map(r => +r.level || 1))].sort();
    return lv.map(v => ({n: lv.length === 1 ? 'Main floor' : (ORD[v] || `Level ${v}`), text: [], rooms: L.rooms.filter(r => (+r.level || 1) === v).map(r => [r.name, String(r.size || '').replace(/(\d+)\s*x\s*(\d+)/, "$1' x $2'")])})); };
  // beside the plan, the room table takes the plan's own room names and sizes (owner 11/13/2026, captions round 3 Q2)
  const planFloors = () => { const lv = [...new Set((L.rooms || []).map(r => +r.level || 1))].sort();
    return mlsFloors().map((f, i) => window.PlanRooms ? Object.assign({}, f, {rooms: PlanRooms.match(D, f.rooms.map(r => ({name: r[0], size: r[1], level: lv[i] - 1}))).map(q => [q.name, q.size])}) : f); };
  // a compact room table: floor names over their rooms, the rows spaced to fill height H (null when it can't fit)
  const roomTable = (fl, x, y, w, H) => { const nr = fl.reduce((a, f) => a + f.rooms.length, 0), base = fl.length*(1.4 + 4 + 16 + 2) + (fl.length - 1)*6;
    const pad = (H - base - nr*14)/(2*nr); if(!nr || pad < 1) return null;
    return `<div class="floorlist" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${H}pt;display:flex;flex-direction:column;justify-content:space-between">${fl.map((f, i) =>
      `<div class="f" style="padding-top:4pt"><div class="fn" data-slot="back.rooms${i}.name" data-lines="1">${esc(f.n)}</div><table style="margin-top:2pt">${f.rooms.map(rm =>
        `<tr><td data-slot="back.rooms${i}.room" style="padding:${Math.min(pad, 9)}pt 0">${esc(rm[0])}</td><td data-slot="back.rooms${i}.size" style="padding:${Math.min(pad, 9)}pt 0">${esc(feetOnly(rm[1]))}</td></tr>`).join('')}</table></div>`).join('')}</div>`; };

  if(front){
    // ================= FRONT =================
    const trio = pick(FL.front && FL.front.photos, 3);
    // the fact rows: beds, baths (the ½ at full size), square feet, year built, then the lot size when there is one
    const bn = BD.bathNum(L), rows = [];
    if(L.beds) rows.push([Number(L.beds).toLocaleString('en-US'), L.beds == 1 ? 'Bedroom' : 'Bedrooms']);
    if(L.baths || L.halfBaths){ rows.push([bn.num, bn.label]); if(bn.half) rows.push([String(L.halfBaths), 'Half Baths']); }
    if(L.sqft) rows.push([Number(L.sqft).toLocaleString('en-US'), 'Square Feet']);
    const yb = L.yearBuilt || L.year;
    if(yb) rows.push([String(yb), 'Year Built']); else if(L.stories) rows.push([String(L.stories), +L.stories == 1 ? 'Story' : 'Stories']);
    { const lot = String(SP.lotText(L) || '').match(/^([\d,.]+)\s*(.*)$/); if(lot) rows.push([lot[1], (lot[2] || 'Sq Ft Lot').replace(/\s*Lot$/i, '') + ' Lot']); }
    // hero: as tall as the whole house needs, soaking up what is left
    const hp = P[hero] || {w: 3, h: 2}, asp = hp.w / hp.h, bx = hp.box;
    const need = bx ? Math.min(1, (bx[3] - bx[1]) + 0.012) : (SP.fullHouse(D, hero) ? 0.8 : 0.6);
    const heroW = W + (X - HX), rw = 172, tW = W - rw - G, rx = X + W - rw;
    const Hneed = Math.round(Math.max(190, heroW*need/asp + 2));
    const descSrc = (FL.desc && FL.desc.text) || FL.desc || ((C.front || {}).intro || '');
    const cw = (W - 2*G)/3;
    const DF = {w: tW, fs: 10, lh: 14, wt: 400};
    // the three rooms share the row's width equally, or in proportion to how much there is to say about each (within 25%), whichever
    // sets the most true text with every caption running the row's same line count (owner 11/10: never shorter than before)
    const plen = trio.map(id => sentences(poolOf(id)).join(' ').length || 1), tot = W - 2*G;
    const weighted = ex => { const q = plen.map(l => Math.pow(l, ex)); let ws = q.map(l => l/q.reduce((a, b) => a + b, 0)*tot);
      for(let k = 0; k < 4; k++){ ws = ws.map(w => Math.min(cw*1.35, Math.max(cw*.65, w))); const s0 = ws.reduce((a, b) => a + b, 0); ws = ws.map(w => w*tot/s0); }
      return ws.map(w => Math.round(w*10)/10); };
    const WSETS = [trio.map(() => cw), weighted(.5), weighted(1), weighted(1.5)];
    const TH0 = 62;       // place line, headline and rule above the write-up
    let layout = null, bestL = null, bestScore = -1; const cands = [];
    { const d1 = fullPara(descSrc, DF, [0, 6, 12, 18]), th = Math.max(d1.lines*14, 19*rows.length - TH0);   // the fact rows stay at least 19 pt tall
      for(const n of [9, 8, 7, 6, 5, 4, 3, 2]) for(const ws of WSETS){
        const fr = fillRow(trio.map(poolOf), ws.map(w => ({w, fs: 8.5, lh: 11, wt: 400})), [n]), ch = capTotal(n);
        const free = BOT - 18 - 14 - TH0 - th - 18 - ch;
        let Hp = Math.min(196, Math.max(116, Math.round(free*0.4)));
        if(free - Hp < Hneed) Hp = free - Hneed;            // a tall house gets the height it needs; the photo row gives it up
        const Hh = free - Hp;
        if(Hh < Hneed || Hp < 116) continue;
        const pr = trio.map((id, i) => capProbe(id, ws[i], n)), pok = pr.every(q => q.ok);
        const lens = pok ? pr.map(q => q.len) : fr.rs.map(r => r.text.length);
        const L1 = {n, cr: fr.rs, Hp, Hh, d1, th, ws, lens, eq: ws === WSETS[0]};
        if(pok || fr.ok) cands.push(L1); else if(!bestL) bestL = L1;
      }
    }
    // the most text wins; uneven widths only when no caption ends up shorter than in the best even row
    { const eqBest = cands.filter(c => c.eq).sort((a, c) => c.lens.reduce((x, y) => x + y, 0) - a.lens.reduce((x, y) => x + y, 0))[0];
      for(const c of cands){ if(!c.eq && eqBest && c.lens.some((l, i) => l < eqBest.lens[i])) continue;
        const score = c.lens.reduce((x, y) => x + y, 0) + (c.eq ? 10 : 0); if(score > bestScore){ bestScore = score; layout = c; } } }
    if(!layout) layout = bestL || (() => { const d1 = fullPara(descSrc, DF), n = 2; return {n, cr: fillRow(trio.map(poolOf), {w: cw, fs: 8.5, lh: 11, wt: 400}, [n]).rs, Hp: 64, Hh: Hneed, d1, th: d1.lines*14, ws: WSETS[0]}; })();
    fitlog.push(['front', layout === bestL ? 'best' : 'ok', layout.n, layout.d1.lines]);
    const {cr, Hp, Hh, d1, th, ws} = layout, xs = ws.map((w, i) => X + ws.slice(0, i).reduce((a, b) => a + b, 0) + i*G);
    const y1 = 18 + Hh + 14, S = y1 + TH0 + th, py = S + 18;
    h += rail('front.street');
    h += SP.photo(D, hero, HX, 18, heroW, Hh, 'front.hero');
    h += kick(placeLine.toUpperCase(), X, y1, tW, 'front.place', 'fl-place');
    h += `<div class="abs fl-hl" style="left:${X - 1}pt;top:${y1 + 14}pt;width:${tW}pt;height:34pt" data-slot="front.headline" data-lines="1" data-fit="18">${esc(FL.headline || (C.front || {}).headline || '')}</div>`;
    h += thin(X, y1 + 51, tW).replace('class="rule"', 'class="rule" data-red="1"');
    h += `<div class="abs fl-body sp-just" style="left:${X}pt;top:${y1 + TH0}pt;width:${d1.w}pt;height:${th}pt;font-size:${d1.fs}pt;text-align:justify" data-slot="front.about" data-para="1" data-min="4" data-fillbox="1" data-lines="${d1.lines}">${esc(d1.text)}</div>`;
    h += `<div class="fstack${(S - y1)/rows.length >= 27 ? ' four' : (S - y1)/rows.length < 22 ? ' tight' : ''}" style="left:${rx}pt;top:${y1}pt;width:${rw}pt;height:${S - y1}pt">${rows.map((r, i) => `<div data-slot="front.facts${i}" data-lines="1"><span class="v">${r[0]}</span><span class="l">${esc(r[1])}</span></div>`).join('')}</div>`;
    h += heavy(X, S + 8, W);
    h += `<div data-gapcheck="front.photos" style="position:absolute;left:0;top:0">${trio.map((id, i) => { const x = xs[i];
      return SP.photo(D, id, x, py, ws[i], Hp, `front.photo${i}`) + capHTML(id, `front.cap${i}`, x, py + Hp + 6, ws[i], cr[i]); }).join('')}</div>`;
    h += `<div class="abs fl-fine" style="left:${X}pt;top:764pt;width:${W}pt;height:8pt" data-slot="fineprint" data-fine="1" data-lines="1">${esc(fine)}</div>`;
    document.body.dataset.layout = 'front';
    document.body.dataset.geom = JSON.stringify({Hh, Hp, th, rows: rows.length, capLines: layout.n, descLines: d1.lines});
  } else {
    // ================= BACK =================
    const BK = FL[hasPlan ? 'plan' : 'noplan'] || {};
    h += rail('back.street');
    h += kick((BK.kicker || (hasPlan ? 'The plan, floor by floor' : 'Room by room')), X, 24, 380, 'back.kicker', 'fl-place');
    h += `<div class="abs fl-title" style="left:${X - 1}pt;top:38pt;width:${W}pt;height:34pt" data-slot="back.title" data-lines="1" data-fit="18">${esc(BK.title || (C.back || {}).title || '')}</div>`;
    h += heavy(X, 78, W);
    // left column: the plan (or the floor list) over the narrow card; right column: photos, paragraph and list down to the fine print
    // owner 11/10/2026 (p55): the contact block is shorter top to bottom, not narrower: the standard card runs the page's full
    // width along the foot (74 pt tall, its logo inside it) and both columns grow down to it
    const CY = BOT - CARD_H, CB = CY - 12, TOP = 92, avail = CB - TOP, lavail = CB - TOP;
    const bw = 200;
    const rx = X + bw + G, rw = W - bw - G, gw = (rw - G)/2;
    const grid = pick(BK.grid, 4);
    const RC = (C.back || {}).rcol || {};   // the fold-over back's right column, when the flyer has no copy of its own
    const para = BK.para || FL.para || {label: 'Around the house', text: RC.text || ''};
    const list = ((BK.list && BK.list.items) || RC.items || []).slice(0, 8), listRows = Math.ceil(list.length/2);
    // a plan that fills the column's width before its height: the panel hugs the plan and the red-square list moves under it,
    // one item a line, so no grey band sits above or below the plan and the photo column gets the list's room (owner 11/10/2026)
    let listLeft = null;
    if(hasPlan && list.length){ const u = RL.plan(D, {x: X + 10, y: TOP + 12, w: bw - 20, h: lavail - 42}).used;
      const spare = u ? (lavail - 42) - u.h : 0, rowH = (spare - 12 - 17)/list.length;
      if(u && rowH >= 13) listLeft = {uh: u.h, rowH: Math.min(20, rowH)}; }
    const listH = list.length && !listLeft ? 15 + 4 + listRows*15 : 0;
    const PF = {w: rw, fs: 10, lh: 14, wt: 400};
    const f142 = {w: gw, fs: 8.5, lh: 11, wt: 400};
    let best = null;
    // the paragraph keeps every sentence; the caption rows take the most lines that leave the photos at least 120 pt tall
    // the paragraph (new on this page, 11/10) takes the sentences that fill up to five lines; the captions keep their lines first
    // five full lines first at a small size or width step (11/12: the whole distance sentence, decimals kept, must not push the garage out), then five or four
    const prFlex = text => {
      // nothing lost first: every sentence in five lines at a type step down (to 8 pt, its leading 1.4x) or a small width step
      const all = sentences(text).join(' ');
      for(const z of [1, .98, .96, .94, .92, .9, .88, .86, .84, .82, .8]) for(const dw of [0, 6, 12]){ const fs = +(PF.fs*z).toFixed(2), w = PF.w - dw, lh = Math.min(PF.lh, +(fs*1.4).toFixed(2)), r = lastOf(all, w, fs, lh);
        if(r.lines <= 5 && (r.lines < 2 || r.last >= .8)) return {text: all, lines: r.lines, last: r.last, ok: true, fs, w, lh}; }
      for(const dw of [0, 6, 12]) for(const z of [1, 1.015, 1.03, .985, .97]){ const f2 = Object.assign({}, PF, {w: PF.w - dw, fs: +(PF.fs*z).toFixed(2)});
      const r = fillBox(text, f2, [5]); if(r.ok && r.lines === 5) return Object.assign(r, {fs: f2.fs, w: f2.w}); }
      return Object.assign(fillBox(text, PF, [5, 4]), {fs: PF.fs, w: PF.w}); };
    const prF = fullPara(para.text, PF, [0, 6, 12]), prS = prF.lines > 5 ? prFlex(para.text) : null;
    const pr0 = prS && prS.ok ? prS : prF, pl = pr0.lines;
    for(const nA of [9, 8, 7, 6, 5, 4]) for(const nB of [nA, nA - 1, nA + 1]){
      const rA = fillRow(grid.slice(0, 2).map(poolOf), f142, [nA]), rB = fillRow(grid.slice(2, 4).map(poolOf), f142, [nB]), pr = pr0;
      const textH = 11 + 5 + pl*(pr0.lh || 14) + (listH ? 12 + listH : 0), Hs = (avail - capTotal(nA) - capTotal(nB) - 14 - 14 - textH)/2;
      if(Hs < 100 || Hs > 230) continue;
      const probes = [...grid.slice(0, 2).map(id => capProbe(id, gw, nA)), ...grid.slice(2, 4).map(id => capProbe(id, gw, nB))];
      const bad = probes.filter(q => !q.ok).length;
      const cand = {nA, nB, pl, rA, rB, pr, Hs, textH, ok: !bad, sc: (bad ? -1000*bad : 0) + probes.reduce((a, q) => a + q.len, 0)};
      if(!best || cand.sc > best.sc) best = cand;
    }
    if(!best){ const rA = fillRow(grid.slice(0, 2).map(poolOf), f142, [5]), rB = fillRow(grid.slice(2, 4).map(poolOf), f142, [5]), pr = pr0;
      const textH = 11 + 5 + pr.lines*(pr.lh || 14) + (listH ? 12 + listH : 0);
      best = {nA: 5, nB: 5, pl: pr.lines, rA, rB, pr, Hs: Math.max(90, (avail - 2*capTotal(5) - 28 - textH)/2), textH, ok: false}; }
    fitlog.push(['right', best.nA, best.nB, best.pl, best.ok]);
    const Hs = best.Hs;
    let y = TOP;
    h += `<div data-gapcheck="back.photos" style="position:absolute;left:0;top:0">`;
    [[0, best.rA, best.nA], [2, best.rB, best.nB]].forEach(([o, r, n], ri) => {
      grid.slice(o, o + 2).forEach((id, i) => { const x = rx + i*(gw + G);
        h += SP.photo(D, id, x, y, gw, Hs, `back.photo${o + i}`) + capHTML(id, `back.cap${o + i}`, x, y + Hs + 6, gw, r.rs[i]); });
      y += Hs + capTotal(n);
      if(ri === 0){ h += heavy(rx, y + 5.9, rw); y += 14; }
    });
    h += `</div>`;
    // the paragraph and the list end on the plan column's bottom line
    const ty = CB - best.textH;
    h += heavy(rx, ty - 8, rw);
    h += kick((para.label || 'Around the house'), rx, ty, rw, 'back.paraHead');
    h += `<div class="abs fl-body sp-just" style="left:${rx}pt;top:${ty + 16}pt;width:${best.pr.w || rw}pt;height:${best.pr.lines*(best.pr.lh || 14)}pt;font-size:${best.pr.fs}pt;line-height:${best.pr.lh || 14}pt;text-align:justify" data-slot="back.para" data-para="1" data-min="2" data-fillbox="1" data-lines="${best.pr.lines}">${esc(best.pr.text)}</div>`;
    if(list.length && !listLeft){
      const ly = ty + 16 + best.pr.lines*(best.pr.lh || 14) + 12;
      h += thin(rx, ly - 6, rw);   // a hairline closes the write-up before the list (the write-up's space ends there)
      h += kick((BK.list && BK.list.head) || RC.listHead || 'What comes with it', rx, ly, rw, 'back.listHead');
      h += `<ul class="abs fl-list" style="left:${rx}pt;top:${ly + 17}pt;width:${rw}pt;height:${listRows*15}pt;grid-template-rows:repeat(${listRows},15pt);grid-auto-flow:column">${list.map((t, i) => `<li data-slot="back.item${i}" data-lines="1">${esc(t)}</li>`).join('')}</ul>`;
    }

    // the plan column
    if(hasPlan){
      // a plan that fills the column's width before its height gives the room under it to one of the fold-over's extra photos
      // with its caption (owner 11/10/2026: the plan as large as fits, no blank band above or below it)
      let pl = RL.plan(D, {x: X + 10, y: TOP + 12, w: bw - 20, h: lavail - 12 - 30}), pbH = lavail;
      const xc = ((C.back || {}).xtra || []).map(c => c && c.id).find(id => has(id) && !used.has(id) && CP.capPool && CP.capPool[id]);
      const spare = pl.used ? (lavail - 12 - 30) - pl.used.h : 0;
      let tbl = null;
      if(listLeft){
        const rh = listLeft.rowH; pbH = lavail - 12 - 17 - list.length*rh;   // a panel with any room left over keeps the plan centered in it
        pl = RL.plan(D, {x: X + 10, y: TOP + 12, w: bw - 20, h: pbH - 42});
        const ly = TOP + pbH + 12;
        h += kick((BK.list && BK.list.head) || RC.listHead || 'What comes with it', X, ly, bw, 'back.listHead');
        h += `<ul class="abs fl-list" style="left:${X}pt;top:${ly + 17}pt;width:${bw}pt;height:${list.length*rh}pt;grid-template-columns:1fr;grid-template-rows:repeat(${list.length},${rh}pt);align-content:space-between">${list.map((t, i) => `<li data-slot="back.item${i}" data-lines="1">${esc(t)}</li>`).join('')}</ul>`;
        tbl = true;
      }
      if(!tbl && spare >= 70 && (L.rooms || []).length){   // the panel hugs the plan; the MLS room sizes, floor by floor, take the room under it
        const pl2 = RL.plan(D, {x: X + 10, y: TOP + 12, w: bw - 20, h: pl.used.h}), pb2 = pl2.used.h + 12 + 30;
        tbl = roomTable(planFloors(), X, TOP + pb2 + 10, bw, lavail - pb2 - 10);
        if(tbl){ pl = pl2; pbH = pb2; h += tbl; }
      }
      if(!tbl && xc && spare >= 170){
        pl = RL.plan(D, {x: X + 10, y: TOP + 12, w: bw - 20, h: pl.used.h}); pbH = pl.used.h + 12 + 30;
        const left = lavail - pbH - 14, n = [7, 6, 5, 4, 3].find(k => capProbe(xc, bw, k).ok && left - capTotal(k) >= 100) || 4;
        const y0 = TOP + pbH + 14, ph = left - capTotal(n), r0 = fillBox(poolOf(xc), {w: bw, fs: 8.5, lh: 11, wt: 400}, [n]);
        used.add(xc);
        h += SP.photo(D, xc, X, y0, bw, ph, 'back.xphoto') + capHTML(xc, 'back.xcap', X, y0 + ph + 6, bw, Object.assign({}, r0, {lines: n}));
      }
      h += `<div class="planbg" style="left:${X}pt;top:${TOP}pt;width:${bw}pt;height:${pbH}pt"></div>`;
      issues.push(...pl.issues); h += pl.html;
      h += `<div class="fl-note" style="left:${X + 10}pt;width:${bw - 20}pt;top:${TOP + pbH - 22}pt;height:12pt" data-slot="back.planNote" data-lines="1">${esc(BK.planNote || (C.back || {}).planNote || 'Approximate; not to scale.')}</div>`;
      document.body.dataset.layout = 'back-plan';
    } else {
      // with no floors from the writer, the MLS room list floor by floor (true sizes); the room it leaves goes to one of the
      // fold-over's extra photos with its caption, so the column never stands empty (owner 11/10/2026: no blank space)
      let fl = (BK.floors || []).slice(0, 5), colH = lavail, xh = '';
      if(!fl.length && (L.rooms || []).length){
        fl = mlsFloors();
        const listH = fl.length*(1.4 + 5 + 16 + 3 + 8) + fl.reduce((a, f) => a + f.rooms.length, 0)*(14 + 2*4);
        const xc = ((C.back || {}).xtra || []).map(c => c && c.id).find(id => has(id) && !used.has(id) && CP.capPool && CP.capPool[id]);
        const left = lavail - listH - 14;
        if(xc && left >= 170){
          let n = [7, 6, 5, 4, 3].find(k => capProbe(xc, bw, k).ok && left - capTotal(k) >= 110) || 4;
          const ph = left - capTotal(n), y0 = TOP + listH + 14, r0 = fillBox(poolOf(xc), {w: bw, fs: 8.5, lh: 11, wt: 400}, [n]);
          used.add(xc);
          xh = heavy(X, y0 - 8, bw) + SP.photo(D, xc, X, y0, bw, ph, 'back.xphoto') + capHTML(xc, 'back.xcap', X, y0 + ph + 6, bw, Object.assign({}, r0, {lines: n}));
          colH = listH;
        }
      }
      const n = fl.length, bwI = bw, TF = {w: bwI, fs: 9, lh: 12, wt: 400};
      const nrows = fl.reduce((a, f) => a + f.rooms.length, 0);
      const fixed = 1.4 + 5 + 16 + 3 + 3;                          // rule, pad, name, gaps above the text and the table
      const pools = fl.map(f => sentences(f.text));
      const rs = fl.map(() => null), ns = pools.map(q => q.length ? 3 : 0);
      const feasible = (i, k) => { const r = fillBox(pools[i], TF, [k]); return r.ok ? r : null; };
      const total = pad => n*fixed + ns.reduce((a, k) => a + k*12, 0) + nrows*(14 + 2*pad);
      const room = colH - (n - 1)*8;
      fl.forEach((f, i) => { if(!pools[i].length) return; const k0 = [3, 2, 4, 5, 6].find(k => feasible(i, k)); if(k0) ns[i] = k0; });
      let grew = true;
      while(grew){ grew = false;
        for(let i = 0; i < n; i++){ if(total(1.5) + 12 > room) break; if(pools[i].length && ns[i] < 9 && feasible(i, ns[i] + 1)){ ns[i]++; grew = true; } } }
      // what is left goes into the rows' spacing (never more than 13 pt a side), the rest between the floors
      const rowPad = Math.max(1.5, Math.min(13, 1.5 + (room - total(1.5))/(2*nrows)));
      fl.forEach((f, i) => { rs[i] = fillBox(pools[i], TF, [ns[i]]); });
      fitlog.push(['floors', ns.join(','), rs.map(r => r.ok).join(','), +rowPad.toFixed(2)]);
      h += xh;
      h += `<div class="floorlist" style="left:${X}pt;top:${TOP}pt;width:${bwI}pt;height:${colH}pt;display:flex;flex-direction:column;justify-content:space-between">${fl.map((f, i) => {
        const r = rs[i];
        return `<div class="f"><div class="fn" data-slot="back.floor${i}.name" data-lines="1">${esc(f.n)}${f.tag ? `<span>${esc(f.tag)}</span>` : ''}</div>
          ${r.text ? `<div class="sm" data-slot="back.floor${i}.text" data-para="1" data-min="2" data-lines="${r.lines}" style="height:${r.lines*12}pt">${esc(r.text)}</div>` : ''}
          <table>${f.rooms.map(rm => `<tr><td data-slot="back.floor${i}.room" style="padding:${rowPad}pt 0">${esc(rm[0])}</td><td data-slot="back.floor${i}.size" style="padding:${rowPad}pt 0">${esc(feetOnly(rm[1]))}</td></tr>`).join('')}</table></div>`; }).join('')}</div>`;
      document.body.dataset.layout = 'back-photos';
    }
    h += SP.card(D, [X, CY, W, CARD_H], {layout: 'panel', size: 'short', fieldAccent: true});   // the short card keeps the brokerage's web line at this height
    h += `<div class="abs fl-fine" style="left:${X}pt;top:764pt;width:${W}pt;height:8pt" data-slot="fineprint" data-fine="1" data-lines="1">${esc(fine)}</div>`;
    document.body.dataset.geom = JSON.stringify({Hs, capLines: [best.nA, best.nB], paraLines: best.pr.lines});
  }

  document.body.dataset.fitlog = JSON.stringify(fitlog);
  await SP.finish(D, 612, 792, h, issues, async () => {
    RL.fitLogos();
    CapFit(document.querySelectorAll('.tx[data-pool]'));   // text under a photo fills the photo's width (owner 11/8)
    NoWideGaps(document.querySelectorAll('.tx, .sp-just'));
    document.querySelectorAll('.logo img').forEach(i => { i.dataset.optional = '1'; });
    // the whole address on the rail: the largest size (up to 40 pt) that fits the rail's height, down to 8 pt
    document.querySelectorAll('[data-fitstreet]').forEach(el => {
      let fs = 40; const room = el.clientHeight*72/96;
      const len = () => { const r = document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect().height*72/96; };
      el.style.fontSize = fs + 'pt';
      while(len() > room && fs > 8){ fs -= 1; el.style.fontSize = fs + 'pt'; }
      if(len() > room) issues.push({slot: el.dataset.slot, kind: 'overflow', text: el.textContent});
    });
  });
  // logos: none on the front, one on the back (the brand's logo, or its name set in type when it has none)
  const prev = window.brochureCheck;
  window.brochureCheck = () => { const out = prev();
    const k = [...document.querySelectorAll('.logo img, .logo [data-slot="broker.name"], .cc-logo img, .cc-brkname')].filter(e => e.offsetParent).length;
    const want = front ? 0 : 1;   // owner 11/10/2026: no logo on the flyer front; one on the back (in the contact card)
    if(k !== want) out.push({slot: 'logo', kind: 'logo-count', found: k, want});
    return out; };
})();
</script>
