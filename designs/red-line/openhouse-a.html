<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · The Red Line open house flyer · Red Rail</title>
<link rel="stylesheet" href="red-line.css">
<script src="../engine/baths.js"></script>
<script src="../engine/setpieces.js"></script>
<!--
  The Red Line · Open House flyer "Red Rail" (trim 612 x 792 pt; print: 0.25 in white margin around the field).
  The fold-over's red rail runs the full height at the left, carrying the open house label in white condensed caps turned on
  its side. Beside it the date is the largest type on the page (Oswald), the time in red under it, and the broker / REALTOR(R)
  lines (only on those opens, only when filled) right of the time. Then a heavy red rule, the whole house, the address with
  city, state and ZIP under it, the fold-over's four-fact row (red rule over a number and its label), a red kicker over a
  write-up beside two interiors, and the standard contact card (templates/_shared/agentcard.js, Right panel).
  Open House rules (templates/_shared/ohstandard.js): city, state and ZIP, no RSVP, no QR, no price. Copy: data.copy.pc.oh.a.
-->
<style>
  .cc{--cc-paper:#ffffff;--cc-ink:#1b1b1d;--cc-muted:#5d6266;--cc-accent:#d7262b;--cc-line:rgba(215,38,43,.40);--cc-display:'Oswald',Impact,sans-serif}
  .rail{position:absolute;background:var(--accent);overflow:hidden}
  .rl-lbl{position:absolute;writing-mode:vertical-rl;transform:rotate(180deg);font:700 25pt/30pt var(--font-display);letter-spacing:2.5pt;text-transform:uppercase;color:#fff;white-space:nowrap;overflow:hidden}
  .oh-date{font:700 54pt/60pt var(--font-display);letter-spacing:-.2pt;color:var(--ink);white-space:nowrap;overflow:hidden}
  .oh-time{font:600 26pt/30pt var(--font-display);letter-spacing:.8pt;color:var(--accent);white-space:nowrap;overflow:hidden}
  .oh-strong{font:600 10.5pt/14pt var(--font-body);color:var(--ink);text-align:right}
  .oh-note{font:400 10.5pt/14pt var(--font-body);color:var(--text);text-align:right}
  .addr{font:700 38pt/44pt var(--font-display);letter-spacing:.1pt;color:var(--ink);white-space:nowrap;overflow:hidden}
  .fact2{position:absolute;border-top:1.4pt solid var(--accent);padding-top:3pt}
  .fact2 .v{display:block;font:700 20pt/24pt var(--font-display);color:var(--ink);white-space:nowrap;overflow:hidden}
  .fact2 .l{display:block;font:600 8pt/11pt var(--font-display);letter-spacing:1.3pt;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden}
  .ab{font-size:10.5pt;line-height:15pt;color:var(--text)}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SP.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const esc = SP.esc, L = D.listing, PC = ((D.copy || {}).pc || {}), C = (PC.oh || {}).a || {};
  const issues = await SP.ready(D);
  document.body.dataset.mode = D.mode || 'email';
  const O = SP.openHouse(D), X = 98, W = 496;
  let h = '';

  // the rail, with the label on its side
  h += `<div class="rail" style="left:18pt;top:18pt;width:60pt;height:756pt"><div class="rl-lbl" style="left:14pt;bottom:30pt;width:36pt;height:600pt" data-slot="oh.label" data-lines="1">${esc(O.label)}</div></div>`;
  // the event
  h += `<div class="abs oh-date" style="left:${X - 2}pt;top:32pt;width:${W + 2}pt;height:60pt" data-slot="oh.date" data-lines="1" data-fit="34">${esc(O.long)}</div>`;
  h += `<div class="abs oh-time" style="left:${X}pt;top:96pt;width:230pt;height:32pt" data-slot="oh.time" data-lines="1">${esc(O.time)}</div>`;
  let dy = 0;
  { const ls = [[O.note, 'oh.note', 'oh-strong'], [O.refreshments, 'oh.refreshments', 'oh-note']].filter(l => l[0]);
    if(ls.length){ const pre = SP.eventLines(ls, 336, 0, 258, 14, 0); dy = Math.max(0, pre.h - 30); h += SP.eventLines(ls, 336, 126 - pre.h + dy, 258, 14, 0).html; } }
  h += `<div class="rule" style="left:${X}pt;top:${136 + dy}pt;width:${W}pt;height:2.2pt"></div>`;

  // the house, the address, the facts
  h += SP.photo(D, C.hero || 'front', X, 148 + dy, W, 284 - dy, 'oh.hero');
  h += `<div class="abs addr" style="left:${X - 1}pt;top:442pt;width:${W}pt;height:44pt" data-slot="address" data-lines="1" data-fit="26">${esc(L.address)}</div>`;
  h += `<div class="abs kick" style="left:${X}pt;top:488pt;width:${W}pt;height:12pt;font-size:10pt;line-height:12pt" data-slot="place" data-lines="1">${esc([L.neighborhood, SP.placeZip(L)].filter(Boolean).join(' / ').toUpperCase())}</div>`;
  const B = BD.bathNum(L);
  const F = [[L.beds, L.beds == 1 ? 'Bedroom' : 'Bedrooms'], [B.num, B.label + (B.half ? ' + ' + B.half : '')], [Number(L.sqft).toLocaleString('en-US'), 'Square Feet'], [L.yearBuilt || L.year, 'Year Built']].filter(f => f[0]);
  { const lot = String(SP.lotText(L) || '').match(/^([\d,.]+)\s*(.*)$/); if(lot) F.push([lot[1], (lot[2] || 'Sq Ft Lot').replace(/\s*Lot$/i, '') + ' Lot']); }
  const fw = (W - 18*(F.length - 1))/F.length;
  F.forEach((f, i) => { h += `<div class="fact2" style="left:${X + i*(fw + 18)}pt;top:510pt;width:${fw}pt;height:40pt"><span class="v" data-slot="oh.fact${i}.v" data-lines="1">${f[0]}</span><span class="l" data-slot="oh.fact${i}.l" data-lines="1">${esc(f[1])}</span></div>`; });

  // a kicker and a write-up beside two interiors
  h += `<div class="rule" style="left:${X}pt;top:558pt;width:${W}pt;height:2.2pt"></div>`;
  const ps = (C.photos || []).slice(0, 2), pw = 128, gx = 10, tx = X + W - 2*pw - gx - 18;
  h += `<div class="abs kick" style="left:${X}pt;top:568pt;width:${tx - X}pt;height:11pt" data-slot="oh.kicker" data-lines="1">On the tour</div>`;
  h += `<div class="abs ab" style="left:${X}pt;top:584pt;width:${tx - X}pt;height:75pt" data-slot="oh.blurb" data-para="1" data-min="4" data-fillbox="1">${esc(C.text || '')}</div>`;
  h += `<div class="abs" data-gapcheck="oh.photos" style="left:0;top:0">${ps.map((id, i) => SP.photo(D, id, X + W - 2*pw - gx + i*(pw + gx), 570, pw, 90, 'oh.photo' + i)).join('')}</div>`;

  h += SP.card(D, [X, 674, W, 86], {layout: 'panel', fieldAccent: true});
  h += `<div class="abs" style="left:${X}pt;top:764pt;width:${W}pt;height:8pt;font-size:6pt;line-height:8pt;color:var(--muted);white-space:nowrap;overflow:hidden" data-slot="fineprint" data-lines="1" data-fine="1">${esc(PC.fineprint || 'Information deemed reliable but not guaranteed.')}</div>`;

  await SP.finish(D, 612, 792, h, issues);
})();
</script>
</body>
</html>
