<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>color-grid social set</title>
<link rel="stylesheet" href="cg-tokens.css">
<script src="../engine/baths.js"></script>
<script src="../engine/ivory.js"></script>
<script src="../engine/ohlib.js"></script>
<script src="../engine/ohemail.js"></script>
<script src="../engine/carousel.js"></script>
<script src="../engine/factrepeat.js"></script>
<script src="../engine/socialset.js"></script>
<script src="cg-social.js"></script>
<!-- Color Grid's Just Listed and Just Sold social sets (owner 11/18/2026). The shared engine (templates/_shared/socialset.js) loads the
     fonts and the data and runs the checks; the layouts are Color Grid's own (cg-social.js): one grid of tiles with paper gutters, the
     word tile in the main color, the house number in its dark tile, the fact tiles, the pale tile with the agent, the white cell.
     The colors come from the agent's brand kit exactly as the set's print pieces read them (CG.colors / CG.brand in cg.js). -->
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
SocialSet.portrait = CGSocial.portrait; SocialSet.landscape = CGSocial.landscape; SocialSet.slide = CGSocial.slide;
// the layouts measure Schibsted Grotesk 500 and 600 too (the highlights, the phone): both are in before the engine starts
window.brochureReady = Promise.all(['500', '600'].map(w => document.fonts.load(w + " 12px 'Schibsted Grotesk'").catch(() => 0))).then(() => {
  SocialSet.start(D => {
    const b = D.brand || {}, c = b.colors || {}, r = document.documentElement.style;
    const rgb = h => { h = String(h||'').replace('#',''); if(h.length===3) h = h.split('').map(x=>x+x).join(''); const n = parseInt(h,16); return [n>>16&255, n>>8&255, n&255]; };
    const lum = h => { const v = rgb(h).map(q => { q/=255; return q <= .03928 ? q/12.92 : Math.pow((q+.055)/1.055, 2.4); }); return .2126*v[0] + .7152*v[1] + .0722*v[2]; };
    const con = (a, x) => { const p = lum(a), q = lum(x); return (Math.max(p,q)+.05)/(Math.min(p,q)+.05); };
    const on = bg => con(bg, '#ffffff') >= con(bg, '#161616') ? '#ffffff' : '#161616';
    const readable = (fg, bg, min) => con(fg, bg) >= (min || 3) ? fg : on(bg);
    const mix = (a, x, t) => { const p = rgb(a), q = rgb(x); return '#' + p.map((v, i) => Math.round(v + (q[i] - v)*t).toString(16).padStart(2, '0')).join(''); };
    // as CG.colors / CG.brand: the kit's paper shows in the gutters; tiles in the main color, the dark and the pale tint of the main;
    // the accent as small caps where it reads on each tile
    const main = c.main || b.accent || '#2f4a3a', dark = c.dark || b.ink || '#1c1c1c', accent = c.accent || b.accent2 || main, paper = b.paper || mix(main, '#ffffff', .93), tint = mix(main, paper, .86);
    r.setProperty('--cgs-paper', paper); r.setProperty('--cgs-main', main); r.setProperty('--cgs-dk', dark); r.setProperty('--cgs-tint', tint);
    r.setProperty('--cgs-on-main', on(main)); r.setProperty('--cgs-on-dk', on(dark));
    r.setProperty('--cgs-gold', readable(accent, main)); r.setProperty('--cgs-gold-dk', readable(accent, dark));
    r.setProperty('--cgs-lab', readable(main, tint, 4.5));
  });
  return window.brochureReady;
});
</script>
</body>
</html>
