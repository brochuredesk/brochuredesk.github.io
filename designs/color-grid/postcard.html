<!doctype html>
<html lang="en">

<script>window.Ivory = window.Ivory || {esc: s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))};</script>

<script src="cg-pages.js"></script>
<!--
  BrochureDesk · Color Grid · Just Listed and Just Sold postcards, in the hand of the approved Open House library flyer P13 Color Grid
  (templates/oh-library/p13-color-grid.html) and its sign-in sheet: the kit's paper, photos as prints in white mats, the main-color band
  with the one giant word, Schibsted Grotesk throughout, facts centered with short rules, the brokerage logo where the flyer puts it.
  data.piece.card = "listed" | "sold", data.piece.size = "6x11" (trim 792 x 432 pt) | "6x9" (648 x 432 pt), data.piece.side = "front" | "back".
  FRONTS. Just Listed: the house print, the logo top right over the house's real story (short rules between), the agent; the band across
  the foot with JUST LISTED in giant caps | the street and the place. Just Sold, its own card: the band across the head with JUST SOLD and
  the street; the house print laid over the band's edge; the seller question, the note on the white mat, who to call and the logo.
  BACKS (the owner 11/16: the design runs through the whole card): the band runs across the head, down the mail side and across the foot;
  the postage box, the address block and the barcode strip are small white markups set into it; the paper shows in the window it frames
  (two captioned prints, or the six steps on the white mat); the contact card half its old height in one row. No price, no QR.
-->
<style>
  .pc-wbox{position:absolute;background:#fff;border:1.5pt solid var(--cg-main);box-sizing:border-box}
  .pc-steps .it{position:absolute;display:flex;align-items:flex-start}
  .pc-steps .num{position:absolute;display:flex;align-items:center;justify-content:center;font-family:var(--cg-font);font-weight:700;color:var(--cg-main-ink)}
  .pc-steps .stp{font-family:var(--cg-font);font-weight:400;color:#1b1b1b;overflow:hidden}
  .pc-disc{position:absolute;font-size:7.5pt;line-height:10pt;font-weight:500;color:var(--fx-soft);overflow:hidden;white-space:nowrap}
  .pc-ret{position:absolute;font-family:var(--cg-font);font-weight:400;font-size:8.6pt;line-height:11pt;color:var(--fx-on);overflow:hidden;height:36pt}
  .pc-ret b{font-weight:700;letter-spacing:1.4pt;text-transform:uppercase}
  .mailp{position:absolute;background:#fff}
  .cap .a{font-weight:400}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const esc = SW.esc, b = D.brand || {}, A = D.agent || {}, L = D.listing, P = D.piece || {};
  document.body.dataset.mode = D.mode || 'email';
  await SW.setup(D);
  const sold = P.card === 'sold', big = P.size === '6x11', front = P.side === 'front';
  const W = big ? 792 : 648, H = 432, k = big ? 1.12 : 1;
  const K = ((D.sw || {}).pc || {})[sold ? 'js' : 'jl'] || {};
  const hsSrc = A.headshot && ((D.photos||{})[A.headshot] ? D.photos[A.headshot].src : A.headshot) || '';
  const word = sold ? 'Just Sold' : 'Just Listed';
  const issues = [];
  const place = [FXS.hood(L), FXS.placeLine(L)].filter(Boolean).join('  ·  ').toUpperCase(), ad = String(L.address || '');
  // reversed caps never under 8.6 pt: a line that does not fit gives up tracking before it gives up size
  const capsFit = (t, w, max, wt, tracks) => { for(const ls of tracks){ const fs = FXS.fitSize(t, `font-family:Schibsted Grotesk;font-weight:${wt};letter-spacing:${ls}pt`, w, max, 8.6); if(FXS.width(t, `font-family:Schibsted Grotesk;font-weight:${wt};letter-spacing:${ls}pt;font-size:${fs}pt`) <= w - 12) return {fs: Math.max(8.6, fs), ls}; } return {fs: 8.6, ls: tracks[tracks.length - 1]}; };
  const placeLine = (x, y, w, al, slot, max) => { const c = capsFit(place, w, max || 9.5*k, 600, [3, 2.2, 1.4, 0.8]); return `<div class="cg-place" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${13*k}pt;font-size:${c.fs}pt;line-height:${13*k}pt;letter-spacing:${c.ls}pt;text-align:${al || 'center'}" data-slot="${slot || 'front.place'}" data-lines="1">${esc(place)}</div>`; };
  const disp = (t, x, y, w, fs, slot, al) => `<div class="cg-disp" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${fs*1.08}pt;font-size:${fs}pt;line-height:${fs*1.08}pt;letter-spacing:${Math.min(3, fs*0.05)}pt;text-align:${al || 'center'}" data-slot="${slot}" data-lines="1">${esc(t)}</div>`;
  const street = (x, y, w, max, min, slot, al) => { const fs = FXS.fitSize(ad, 'font-family:Schibsted Grotesk;font-weight:600', w - 4, max, min); return {fs, html: `<div class="cg-street" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${fs*1.2}pt;font-size:${fs}pt;line-height:${fs*1.2}pt;text-align:${al || 'center'}" data-slot="${slot || 'front.address'}" data-lines="1">${esc(ad)}</div>`}; };
  const dispFit = (t, w, max, min) => { let f = max; while(f > min && FXS.width(t.toUpperCase(), `font-family:Schibsted Grotesk;font-weight:700;letter-spacing:${Math.min(3, f*0.05)}pt;font-size:${f}pt`) > w - 4) f -= 0.5; return f; };
  const G2 = 8;
  const desT = A.designation ? (A.nar || /realtor/i.test(A.designation) ? 'REALTOR®' : A.designation) : '';
  let h = '';

  if(front){
    const F = K.front || {}, pid = FO.heroId(D, (F.cap || {}).photo || 'front'), M = FXS.MAT;
    const hls = (F.highlights || FXS.tagFacts(D).tags || []).slice(0, 3);
    const RH = 'font-family:Schibsted Grotesk';
    // P13's facts column: centered lines with a short rule between them
    const stack = (items, x, y, w, h, slot, fs0) => { const fs = Math.min(...items.map(t => FXS.fitSize(t, `${RH};font-weight:600`, w - 8, fs0, 9))), n = items.length, sp = Math.min(h/n, fs*2.9), y0 = y + (h - n*sp)/2; let t = '';
      items.forEach((s, i) => { t += `<div class="abs" style="left:${x}pt;top:${y0 + i*sp + (sp - fs*1.3)/2}pt;width:${w}pt;height:${fs*1.3}pt;${RH};font-weight:600;font-size:${fs}pt;line-height:${fs*1.3}pt;color:var(--cg-on);text-align:center;white-space:nowrap" data-slot="${slot}.${i}" data-lines="1">${esc(s)}</div>`;
        if(i) t += `<div class="cg-dv" style="left:${x + w/2 - 18*k}pt;top:${y0 + i*sp}pt;width:${36*k}pt"></div>`; });
      return t; };
    const agentLine = (x, y, w, al) => { const ns = Math.min(15*k, FXS.fitSize(A.name || '', `${RH};font-weight:700`, w, 15*k, 11));
      return `<div class="abs" style="left:${x}pt;top:${y}pt;width:${w}pt;text-align:${al || 'center'};white-space:nowrap">`
        + `<div style="${RH};font-weight:700;font-size:${ns}pt;line-height:${ns*1.2}pt;color:var(--cg-on)" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</div>`
        + `<div style="line-height:${13*k}pt">${desT ? `<span style="${RH};font-weight:700;font-size:${8.6*k}pt;letter-spacing:1.6pt;color:var(--cg-accent);margin-right:10pt" data-slot="agent.desig" data-lines="1">${esc(desT)}</span>` : ''}<span style="${RH};font-weight:600;font-size:${12*k}pt;color:var(--cg-on)" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</span></div></div>`; };
    const paperLogo = (x, y, w, hh, just) => { const src = CG.logoPaper(D); return `<div class="abs logo" data-area="${w*hh}" data-maxh="${hh}" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${hh}pt;justify-content:${just || 'center'}">${src ? `<img src="${esc(src)}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage || '')}</span>`}</div>`; };

    // Color Grid fronts: the card is one grid of tiles with 8 pt paper gutters, bleeding off the trim; white Schibsted 700 in the tiles.
    const Tt = CGT.tile, gk = (t, x, y, w, slot, o) => CGT.gk(t, x, w, slot, o).html(y);
    if(!sold){
      // ---------- JUST LISTED: the house fills the big tile; JUST / LISTED stacked as large as the main tile beside it allows; under the
      // house, the full street and the house's real story in the dark tile; under the words, who to call and the logo on the pale tile.
      const xa = Math.round(W*0.645), ya = Math.round(H*0.655);
      h += FXS.box(D, pid, -9, -9, xa + 9, ya + 9, 'front.hero');
      const bx = xa + G2, bw = W + 9 - bx, iw = W - 18 - bx - 4;
      const ws = Math.min(dispFit('LISTED', iw, 64*k, 30), dispFit('JUST', iw, 64*k, 30)), lh = ws*1.0;
      h += Tt(bx, -9, bw, ya + 9) + CGT.on(CGT.vstack(0, ya, [{h: 2*lh, html: yy => `<div class="cg-wt" style="left:${bx + 18}pt;top:${yy}pt;width:${iw}pt;height:${2*lh}pt;font-size:${ws}pt;line-height:${lh}pt;letter-spacing:.5pt;white-space:normal" data-slot="front.status" data-lines="2">JUST<br>LISTED</div>`}, CGT.gk(FXS.hood(L) || CGT.city(L), bx + 18, iw, 'front.place', {max: 10*k})], 12*k));
      const y2 = ya + G2, h2 = H + 9 - y2, vis = H - y2, ax = 22, aw = xa - ax - 14;
      const st = FXS.fitSize(ad, `${RH};font-weight:700;letter-spacing:-.3pt`, aw, 28*k, 15), hl = hls.slice(0, vis > 150 ? 3 : 2), hf = Math.min(...hl.map(t => FXS.fitSize(t, `${RH};font-weight:500`, aw - 16, 12*k, 9.5)).concat(12*k));
      h += Tt(-9, y2, xa + 9, h2, 'dk') + CGT.on(CGT.vstack(y2, vis, [CGT.line(ad, ax, aw, st, 'front.address', {lh: 1.1})].concat(hl.map((t, i) => ({h: hf*1.45, html: yy => `<div class="abs" style="left:${ax}pt;top:${yy}pt;width:${aw}pt;height:${hf*1.45}pt;white-space:nowrap"><span style="display:inline-block;width:${6*k}pt;height:${6*k}pt;background:var(--cg-gold-dk);margin-right:${9*k}pt;vertical-align:${hf*0.18}pt"></span><span class="cg-wm" style="position:static;font-size:${hf}pt;line-height:${hf*1.45}pt" data-slot="front.hl.${i}" data-lines="1">${esc(t)}</span></div>`}))), 4*k));
      const ns = Math.min(15*k, FXS.fitSize(A.name || '', `${RH};font-weight:700`, iw, 15*k, 11)), lgH = 30*k;
      h += Tt(bx, y2, bw, h2, 'tn') + CGT.vstack(y2, vis, [{h: ns*1.2 + 13*k, html: yy => agentLine(bx + 18, yy, iw, 'left')}, {h: lgH, html: yy => paperLogo(bx + 18, yy, iw, lgH, 'flex-start')}], 10*k);
    } else {
      // ---------- JUST SOLD, its own card: JUST SOLD across the whole head in the main tile, the street right under it; below, the seller
      // question, the note in P19's white cell, who to call and the logo on the pale tile; the house in the tile beside them.
      const AN = CGT.addr(L), nw = AN.num ? Math.round(W*0.27) : 0, hx = W + 9 - nw, mw = hx - G2 - 22 - 16;
      const ls = dispFit('JUST SOLD', mw, 84*k, 34), sts = FXS.fitSize(ad, `${RH};font-weight:600`, mw, 22*k, 13), bh = ls*1.0 + 6 + sts*1.2, BB = Math.round(bh + 52*k);
      h += Tt(-9, -9, (nw ? hx - G2 : W + 9) + 9, BB + 9) + CGT.on(CGT.vstack(0, BB, [{h: ls, html: yy => `<div class="cg-wt" style="left:22pt;top:${yy}pt;width:${mw}pt;height:${ls}pt;font-size:${ls}pt;line-height:${ls}pt;letter-spacing:1pt" data-slot="front.status" data-lines="1">JUST SOLD</div>`}, CGT.line(ad, 22, mw, sts, 'front.address', {cls: 'cg-wm', lh: 1.2})], 6));
      if(nw){ const vw = W - 16 - hx, nf = Math.min(BB*0.62, FXS.fitSize(AN.num, `${RH};font-weight:700;letter-spacing:-1pt`, vw - 8, 90*k, 30));
        h += Tt(hx, -9, nw, BB + 9, 'dk') + CGT.on(CGT.vstack(0, BB, [CGT.line(AN.num, hx, vw, nf, 'front.num', {cls: 'cg-num', lh: 0.95, al: 'center'}), CGT.gk(CGT.city(L), hx, vw, 'front.city', {al: 'center', max: 9.5*k, ls: 2})], 8)); }
      const y2 = BB + G2, vis = H - y2; let PW = Math.round(W*(big ? 0.55 : 0.5)); while(PW < W*0.62 && !SW.fits(D, pid, PW + 9, vis + 9)) PW += 6;
      const px = W - PW; h += FXS.box(D, pid, px, y2, PW + 9, vis + 9, 'front.hero');
      const lx = 22, CWc = px - G2 - 14 - lx; h += Tt(-9, y2, px - G2 + 9, vis + 9, 'tn');
      const qs = FXS.fitSize('Thinking about selling?', `${RH};font-weight:700`, CWc, 17*k, 11), q2 = FXS.width('Thinking about selling?', `${RH};font-weight:700;font-size:${qs}pt`) > CWc - 2, ql = q2 ? ['Thinking about', 'selling?'] : ['Thinking about selling?'];
      const ns = Math.min(14*k, FXS.fitSize(A.name || '', `${RH};font-weight:700`, CWc, 14*k, 11)), ah = ns*1.2 + 13*k, lgH = 26*k;
      const N2 = (F.note2 || []).slice(), nb = 10*k, iw = CWc - 2*nb, room = vis - 2*12*k - ql.length*qs*1.2 - 8 - ah - lgH - 3*8*k - 2*nb;
      let nt = null; for(const lf of [.9]) for(const mm of [1, .96, .92, .88, .84, .8, .76, .72, .68, .64, .6, .56, .52]) for(let fs = 12*k; fs >= 9.5 - 1e-6 && !nt; fs -= 0.25) N2.forEach(t => { if(nt) return; const w = iw*mm, Lw = FO.wrapLines(t, `${RH};font-weight:400;font-size:${fs}pt`, w), n = Lw.length; if(n >= 3 && Lw[n - 1] >= lf*w && Lw.slice(0, -1).every(x => x >= 0.75*w) && n*fs*1.42 <= room) nt = {t, n, fs, w}; });
      if(!nt) nt = {t: N2[0] || '', n: 4, fs: 9*k, w: iw};
      const nlh = nt.fs*1.42, bxw = nt.w + 2*nb, nbh = nt.n*nlh + 2*nb;
      h += CGT.vstack(y2, vis, ql.map((q, i) => ({h: qs*1.2, html: yy => `<div class="cg-h" style="left:${lx}pt;top:${yy}pt;width:${CWc}pt;height:${qs*1.2}pt;font-size:${qs}pt;line-height:${qs*1.2}pt;color:var(--cg-main-ink);white-space:nowrap" data-slot="front.cta${i ? 2 : ''}" data-lines="1">${esc(q)}</div>`})).concat([
        {h: nbh, html: yy => `<div class="pc-wbox" id="notebox" style="left:${lx}pt;top:${yy}pt;width:${bxw}pt;height:${nbh}pt"></div><div class="abs" style="left:${lx + nb}pt;top:${yy + nb}pt;width:${nt.w}pt;height:${nt.n*nlh}pt;${RH};font-weight:400;font-size:${nt.fs}pt;line-height:${nlh}pt;color:#1b1b1b;text-align:justify;text-align-last:left" data-slot="front.note" data-lines="${nt.n}">${esc(nt.t)}</div>`},
        {h: ah, html: yy => agentLine(lx, yy, CWc, 'left')}, {h: lgH, html: yy => paperLogo(lx, yy, CWc, lgH, 'flex-start')}]), 8*k);
    }
  } else {
    // ---------------- BACK (the owner 11/16: the design runs through the whole card; the mail zones are small white markups) ----------------
    // Color Grid: the main-color band runs edge to edge across the head (the status and the full street in it, the return address and the
    // postage markup set into it), down the mail side (the address block's markup set into it) and edge to edge across the foot (the contact
    // row and the barcode markup). The paper shows only in the window it frames: prints in their mats (Just Listed) or the six steps on the
    // sign-in sheet's white mat (Just Sold).
    const dx = W - 648, X = 30, B = K.back || {}, RHb = 'font-family:Schibsted Grotesk';
    const Z = {postage: [552 + dx, 12, 84, 98.25], address: [405 + dx, 187.5, 240, 112.5], barcode: [306 + dx, 387, 342, 45]};
    window.__zones = Z; window.__cardX = X;
    const mk = (z, m, ext) => `<div class="mailp" data-mail-panel="1" style="left:${z[0] - m}pt;top:${z[1] - m}pt;width:${z[2] + 2*m + (ext || 0)}pt;height:${z[3] + 2*m + (ext || 0)}pt"></div>`;
    const RX = Z.address[0] - 14, TB = 126, FB = 330, rw = Z.postage[0] - 14 - Z.address[0];
    let band = '', factTiles = '';
    // the head: the status in gold caps, the full street in white 700, the place; the return address beside the postage markup
    const ret = [b.brokerage || ''].concat([].concat(b.returnAddress || b.address || []).flatMap(a => String(a).split('\n'))).filter(Boolean).slice(0, 3);
    band += `<div class="pc-ret" data-small="1" data-fine="1" data-slot="back.return" style="left:${Z.address[0]}pt;top:${Z.postage[1] + 6}pt;width:${rw}pt;text-align:right"><b>${esc(ret[0] || '')}</b>${ret.slice(1).map(t => '<br>' + esc(t)).join('')}</div>`;
    const hw = Z.address[0] - 26 - 20, sts = FXS.fitSize(ad, `${RHb};font-weight:700`, hw, 30*k, 15), hbh = 13 + 6 + sts*1.15 + 4 + 13, hy = (TB - hbh)/2;
    band += `<div class="cg-place" style="left:26pt;top:${hy}pt;width:${hw}pt;height:13pt;font-size:${10*k}pt;line-height:13pt;letter-spacing:3.4pt" data-slot="back.status" data-lines="1">${esc(word.toUpperCase())}</div>`;
    band += `<div class="cg-street" style="left:26pt;top:${hy + 19}pt;width:${hw}pt;height:${sts*1.15}pt;font-size:${sts}pt;line-height:${sts*1.15}pt" data-slot="back.street" data-lines="1">${esc(ad)}</div>`;
    { const c = capsFit(place, hw, 9*k, 700, [2.4, 1.6, 1, .5]); band += `<div class="cg-place" style="left:26pt;top:${hy + 19 + sts*1.15 + 4}pt;width:${hw}pt;height:13pt;font-size:${c.fs}pt;line-height:13pt;letter-spacing:${c.ls}pt;color:var(--cg-soft)" data-slot="back.place" data-lines="1">${esc(place)}</div>`; }
    // the mail side, between the postage box and the address block, on the band: the facts (Just Listed) or the seller question (Just Sold)
    { const sx = Z.address[0], sw = W - 22 - sx, y1 = TB + 4, room = Z.address[1] - 8 - y1;
      if(!sold){ const it = FXS.statItems(L).filter(t => !/^Built/i.test(t)).slice(0, 3).map(FXS.statParts), n = it.length, ty = TB + G2, th = Z.address[1] - 6 - G2 - ty, twv = (W - RX - (n - 1)*G2)/n;
        it.forEach((p, i) => { const tx = RX + i*(twv + G2), tw = i === n - 1 ? W + 9 - tx : twv, vx = tx, vw = twv, nf = Math.min(16*k, FXS.fitSize(p.n, `${RHb};font-weight:700`, vw - 6, 16*k, 10)), lab = ({'bedrooms': 'BEDS', 'square feet': 'SQ FT', 'sq ft': 'SQ FT', 'Built': 'BUILT'})[String(p.l).toLowerCase()] || ({'Built': 'BUILT'})[p.l] || String(p.l).toUpperCase(), lf = FXS.fitSize(lab, `${RHb};font-weight:700;letter-spacing:.6pt`, vw - 6, 8.6, 8.6), y0 = ty + (th - nf*1.1 - 2 - 11)/2;
          factTiles += CGT.tile(tx, ty, tw, th, i % 2 ? '' : 'dk') + `<div class="cg-on"><div class="cg-wt" style="left:${vx}pt;top:${y0}pt;width:${vw}pt;height:${nf*1.1}pt;font-size:${nf}pt;line-height:${nf*1.1}pt;text-align:center" data-slot="back.fact${i}" data-lines="1">${esc(p.n)}</div><div class="cg-gk" style="left:${vx}pt;top:${y0 + nf*1.1 + 2}pt;width:${vw}pt;height:11pt;font-size:${lf}pt;line-height:11pt;letter-spacing:.6pt;text-align:center" data-slot="back.fact${i}.l" data-lines="1">${esc(lab)}</div></div>`; }); }
      else { const q = 'Thinking about selling?', qf = FXS.fitSize(q, `${RHb};font-weight:700`, sw, 16*k, 11), s1 = 'Ask me what your home would bring today.', sf = FXS.fitSize(s1, `${RHb};font-weight:500`, sw, 10*k, 8.6), yy = y1 + (room - qf*1.2 - 2 - sf*1.4)/2;
        band += `<div class="cg-h" style="left:${sx}pt;top:${yy}pt;width:${sw}pt;height:${qf*1.2}pt;font-size:${qf}pt;line-height:${qf*1.2}pt;text-align:right;color:var(--cg-on);white-space:nowrap" data-slot="back.cta" data-lines="1">${esc(q)}</div>`;
        band += `<div class="abs" style="left:${sx}pt;top:${yy + qf*1.2 + 2}pt;width:${sw}pt;height:${sf*1.4}pt;${RHb};font-weight:500;font-size:${sf}pt;line-height:${sf*1.4}pt;color:var(--cg-gold);text-align:right;white-space:nowrap" data-slot="back.sold" data-lines="1" data-fine="1">${esc(s1)}</div>`; } }
    // the contact row (half its old height) and the fine print, on the foot band
    const cardY = FB + 10, cardH = 44;
    band += ContactCard.html([X, cardY, W - 2*X, cardH], Object.assign({}, A, {headshot: hsSrc}), Object.assign({}, b, {logo: CG.logoSrc(D)}), {postcard: true, fine: '', bottomGap: 0.5, grow: 0, fieldAccent: true, s: {inlineLabel: true, desigInline: true, pad: [3, 12, 3], hsGap: 10, hsW: 34, name: 15, nameFloor: 12, phone: 12, label: 8.6, line: 8.6, rowGap: 10, panelW: 150, panelPad: [2, 6], panelGap: 2, office: 8.6, officeLH: 1.05, logo: {wide: [118, 24], square: [24, 24], tall: [26, 26]}}});
    band += `<div class="pc-disc" id="pcdisc" style="left:${X}pt;top:394pt;width:${Z.barcode[0] - 16 - X}pt;height:20pt" data-slot="back.fine" data-lines="2" data-fine="1"><div>Information deemed reliable but not guaranteed.</div><div>Not intended to solicit property listed with a broker.</div></div>`;
    { const T = CGT.tile; h += T(-9, -9, RX - G2 + 9, TB + 9) + T(RX, -9, W + 9 - RX, TB + 9, 'dk') + T(RX, sold ? TB + G2 : Z.address[1] - 6, W + 9 - RX, FB - G2 - (sold ? TB + G2 : Z.address[1] - 6), 'dk') + T(-9, FB, W + 18, H + 9 - FB);
      if(!sold) h += factTiles; }
    h += mk(Z.postage, 4) + mk(Z.address, 6) + `<div class="mailp" data-mail-panel="1" style="left:${Z.barcode[0] - 4}pt;top:${Z.barcode[1] - 4}pt;width:${Z.barcode[2] + 13}pt;height:${Z.barcode[3] + 13}pt"></div>`;
    h += `<div class="cg-on">${band}</div>`;
    const CL = big ? 14 : 12.5, fsC = big ? 10.75 : 9.5, M = FXS.MAT;
    if(!sold){
      // two prints in their mats in the paper window, each named and captioned
      const ps = (B.photos || []).slice(0, 2), g = 26, Lc = 3, x0 = 24, x1 = RX - 18, capTop = FB - 10 - Lc*CL, PB = capTop - 18 - 7 - M, PT = TB + 20, pw = (x1 - x0 - g)/2;
      ps.forEach((c, i) => { const x = x0 + i*(pw + g);
        h += FXS.box(D, c.photo, x, PT, pw, PB - PT, 'back.photo' + i);
        const cc = FXS.augment(D, c), L0 = FXS.leadLabel(cc.lead);
        h += `<div class="abs" style="left:${x}pt;top:${PB + 7 + M}pt;width:${pw}pt;white-space:nowrap"><div class="lbl" data-slot="back.photo${i}.label" data-lines="1" style="max-width:${pw}pt">${esc(L0.name.toUpperCase())}</div></div>`;
        h += `<div class="abs cap"><div class="a" style="position:absolute;left:${x}pt;top:${capTop}pt;width:${pw}pt;height:${Lc*CL}pt;font-size:${fsC}pt;line-height:${CL}pt" data-slot="back.photo${i}" data-room="${esc(L0.name)}" data-lh="${CL}" data-hbox="${Lc*CL}" data-lines="${Lc}" data-min="3" data-narrow="0" data-nopair="1" ${FXS.sd(cc.s)}></div></div>`; });
    } else {
      // the six steps on the sign-in sheet's white writing mat, numbered as its rows are; the steps' wording is the product's own, unchanged
      const steps = (B.stepsLong || B.help || B.steps6 || []).slice(0, 6);
      if(steps.length < 6) issues.push({slot: 'back.steps', kind: 'fewer-than-six-bullets', detail: `${steps.length} bullets; the Just Sold back carries six`});
      const bx = 22, by = TB + 14, bw = RX - 16 - bx, bh = FB - 14 - by;
      h += `<div class="pc-wbox" id="stepsbox" data-bh="${bh}" style="left:${bx}pt;top:${by}pt;width:${bw}pt;height:${bh}pt"></div>`;
      h += `<div class="cg-wl" style="left:${bx + 16}pt;top:${by + 10}pt;width:${bw - 32}pt;color:var(--cg-main-ink);letter-spacing:2.4pt" data-slot="back.box.k" data-lines="1">HERE’S HOW I’D START</div>`;
      h += `<div class="pc-steps" id="stepslist" data-x="${bx + 16}" data-y="${by + 28}" data-w="${bw - 32}" data-b="${by + bh - 24}">${steps.map((e, i) => `<div class="it" data-i="${i}"><div class="cg-dmo" style="left:0;top:0;width:12pt;height:12pt;border:0"></div><div class="num" style="left:-4pt;top:-4pt;width:20pt;height:20pt;font-size:${10*k}pt">${i + 1}</div><div class="stp" data-slot="back.step${i}" data-lines="2" data-fine="1">${esc([].concat(e)[0])}</div></div>`).join('')}</div>`;
      h += `<div class="cg-h" id="jscall" style="left:${bx + 16}pt;top:${by + bh - 20}pt;width:${bw - 32}pt;height:14pt;font-size:10.5pt;line-height:14pt;text-align:left;color:var(--cg-main-ink)" data-slot="back.call" data-lines="1">${esc(B.call || 'Call or text me anytime.')}</div>`;
    }
    if((D.mode || 'email') !== 'print'){
      const gb = (z, extra) => `left:${z[0]}pt;top:${z[1]}pt;width:${z[2]}pt;height:${z[3]}pt;${extra||''}`;
      h += `<div class="mg mg-stamp" style="${gb(Z.postage)}">Postage<br><span style="text-transform:none">mail vendor</span></div>
        <div class="mg mg-addr" style="${gb(Z.address)}">${[0,1,2,3].map(i => `<div class="aline" style="left:12pt;right:12pt;top:${28 + i*17.25}pt"></div>`).join('')}<div class="gl" style="left:12pt;bottom:9pt">Address block · filled by the mail vendor</div></div>
        <div class="mg mg-bar" style="${gb(Z.barcode)}"><div class="gl" style="left:0;right:0;top:50%;text-align:center;transform:translateY(-50%)">Barcode strip · keep clear</div></div>`;
    }
  }

  const f = SW.frame(D, W, H, h);
  document.getElementById('pages').innerHTML = f.html;
  window.pieceSize = {W: f.W, H: f.H, bleed: f.bleed};
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  document.querySelectorAll('.cap .a[data-s]').forEach(el => { el.dataset.fill = 0.9; el.dataset.lfill = 0.82; el.dataset.min = Math.max(3, +el.dataset.min || 0); el.dataset.j3 = '1'; });
  SW.fill();
  FO.refit();
  FO.just3();
  FO.gaps();
  if(!front && sold) fitSteps();
  if(front){ const lock = document.getElementById('lock'); if(lock){ const t0 = +lock.dataset.top, room = +lock.dataset.foot - t0, used = +lock.dataset.bottom; lock.style.top = (t0 + Math.max(0, (room - used)/2)) + 'pt'; }
    const lk = document.getElementById('lockL'); if(lk){ /* the left column of the Just Sold front sits centered between the photo's shoulder and the foot */ } }
  SW.fitLogos();
  ContactCard.fit(document);
  if(!front) fitDisc();
  issues.push(...SW.focus(D));
  if(!front){ issues.push(...mailCheck(), ...panelCheck(), ...backCheck()); }
  window.brochureCheck = () => SW.check(D, issues);
  window.photoPlacements = SW.placements;

  function fitDisc(){ const el = document.getElementById('pcdisc'); if(!el) return; let fs = 8;
    const ok = () => [...el.children].every(c => { const r = document.createRange(); r.selectNodeContents(c); return r.getBoundingClientRect().width <= el.clientWidth; });
    for(; fs > 7.5; fs -= .25){ el.style.fontSize = fs + 'pt'; if(ok()) break; }
    el.style.fontSize = Math.max(7.5, fs) + 'pt'; }
  // the six steps: the largest size (12 pt down to 8.6) at which each sets in two lines or fewer inside the box, then the rows spread to fill it
  function fitSteps(){ const L = document.getElementById('stepslist'); if(!L) return; const x = +L.dataset.x, y0 = +L.dataset.y, w = +L.dataset.w, yB = +L.dataset.b, its = [...L.querySelectorAll('.it')], tx = 22;
    let best = null;
    for(let fs = 12*k + (big ? 1 : 0); fs >= 8.6 - 1e-6; fs -= 0.2){ const lh = fs*1.3; let tot = 0; const ns = its.map(it => { const s = it.querySelector('.stp'); s.style.cssText = `position:absolute;left:${tx}pt;top:0;width:${w - tx}pt;font-size:${fs}pt;line-height:${lh}pt`; const n = SW.lines(s).n; tot += n*lh; return n; });
      if(ns.every(n => n <= 2) && tot + (its.length - 1)*3 <= yB - y0){ best = {fs, lh, ns, tot}; break; } }
    if(!best) best = {fs: 8.6, lh: 11.2, ns: its.map(() => 2), tot: its.length*22.4};
    const gap = Math.min(14, (yB - y0 - best.tot)/(its.length - 1)); let y = y0;
    its.forEach((it, i) => { const s = it.querySelector('.stp'), n = best.ns[i]; s.style.fontSize = best.fs + 'pt'; s.style.lineHeight = best.lh + 'pt'; s.style.height = (n*best.lh) + 'pt'; s.dataset.lines = n;
      it.style.left = x + 'pt'; it.style.top = y + 'pt'; it.style.width = w + 'pt'; it.style.height = (n*best.lh) + 'pt';
      const dm = it.querySelector('.cg-dmo'), nm = it.querySelector('.num'), cy = best.lh/2; dm.style.top = (cy - 6) + 'pt'; dm.style.left = '1pt'; nm.style.top = (cy - 10) + 'pt'; nm.style.left = '-3pt';
      y += n*best.lh + gap; });
    const box = document.getElementById('stepsbox'), call = document.getElementById('jscall'); const used = y - gap - (y0 - 28) + 12 + 22;
    if(box && used < +box.dataset.bh - 2){ const bh = used; box.style.height = bh + 'pt'; if(call) call.style.top = (parseFloat(box.style.top) + bh - 20) + 'pt'; } }
  function backCheck(){ const out = [], pt = v => v*72/96, sh = document.querySelector('.sheet').getBoundingClientRect(), X0 = window.__cardX || 30;
    const cc = document.querySelector('.sheet .cc');
    if(!cc) out.push({slot: 'back.card', kind: 'no-contact-card', detail: 'the back has no standard contact card'});
    else { const r = cc.getBoundingClientRect(), l = pt(r.left - sh.left), rr = pt(r.right - sh.left), Wt = pt(sh.width) - 18;
      if(l > X0 + 1 || rr < Wt - X0 - 1) out.push({slot: 'back.card', kind: 'card-not-full-width', detail: `card spans ${l.toFixed(0)}-${rr.toFixed(0)} pt of ${Wt.toFixed(0)}`}); }
    let area = 0; document.querySelectorAll('.sheet [data-mail-panel]').forEach(el => { const r = el.getBoundingClientRect(); const w = Math.min(pt(r.right - sh.left) - 9, pt(sh.width) - 18) - Math.max(pt(r.left - sh.left) - 9, 0), hh = Math.min(pt(r.bottom - sh.top) - 9, 432) - Math.max(pt(r.top - sh.top) - 9, 0); area += Math.max(0, w)*Math.max(0, hh); });
    if(area > .25*(pt(sh.width) - 18)*432) out.push({slot: 'back.panels', kind: 'light-block-too-big', detail: `mail panels cover ${(100*area/((pt(sh.width) - 18)*432)).toFixed(0)}% of the card`});
    if(sold) out.push(...jsCheck());
    return out; }
  // owner 11/7: the Just Sold back's six bullets are long (8 words or more) and the box is at least 85% filled with text
  function jsCheck(){ const out = [], box = document.getElementById('stepsbox'); if(!box) return [{slot: 'back.steps', kind: 'steps-missing'}];
    const items = [...document.querySelectorAll('.stp')];
    items.forEach((el, i) => { const w = el.textContent.trim().split(/\s+/).filter(Boolean).length; if(w < 8) out.push({slot: 'back.step' + i, kind: 'js-bullet-too-short', detail: `${w} words: "${el.textContent.trim()}"`}); });
    if(items.length < 6) out.push({slot: 'back.steps', kind: 'fewer-than-six-bullets', detail: items.length + ' bullets'});
    const bh = box.getBoundingClientRect().height*0.75, used = items.reduce((n, el) => n + SW.lines(el).n*parseFloat(el.style.lineHeight), 0) + 11 + 14 + 18;
    window.__jsFill = +(used/(bh - 20)).toFixed(2);
    if(used/(bh - 20) < .85) out.push({slot: 'back.steps', kind: 'js-box-under-85', detail: `the Just Sold box is ${Math.round(100*used/(bh - 20))}% full (85% minimum)`});
    return out; }
  function lum(c){ const m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(c); return m ? .2126*m[1] + .7152*m[2] + .0722*m[3] : 0; }
  function panelCheck(){ const out = [], Z = window.__zones, sh = document.querySelector('.sheet').getBoundingClientRect(), pt = v => v*72/96;
    const panels = [...document.querySelectorAll('.mailp')].map(p => { const r = p.getBoundingClientRect(); return {l: pt(r.left - sh.left), t: pt(r.top - sh.top), r: pt(r.right - sh.left), b: pt(r.bottom - sh.top), lum: lum(getComputedStyle(p).backgroundColor)}; });
    if(!panels.length) out.push({slot: 'back.panel', kind: 'mail-panel-missing', detail: 'no light panel under the mail zones'});
    ['postage', 'address', 'barcode'].forEach(k => { const z = Z[k], p = panels.find(q => q.l <= z[0] + .5 && q.t <= z[1] + .5 && q.r >= z[0] + z[2] - .5 && q.b >= z[1] + z[3] - .5);
      if(!p) out.push({slot: 'back.' + k, kind: 'mail-zone-not-light', detail: `the ${k} zone is not fully on a light panel`});
      else if(p.lum < 200) out.push({slot: 'back.' + k, kind: 'mail-zone-not-light', detail: `the ${k} panel's luminance is ${Math.round(p.lum)} (200 minimum)`}); });
    return out; }
  // nothing but the proof guides may sit in the mail vendor's zones (postage, address block, barcode strip)
  function mailCheck(){ const out = [], Z = window.__zones, pt = v => v*72/96, sh = document.querySelector('.sheet').getBoundingClientRect();
    const hit = (r, z) => pt(r.left - sh.left) < z[0] + z[2] - .5 && pt(r.right - sh.left) > z[0] + .5 && pt(r.top - sh.top) < z[1] + z[3] - .5 && pt(r.bottom - sh.top) > z[1] + .5;
    document.querySelectorAll('.sheet .ph, .sheet .pc-wbox, .sheet .cap, .sheet .cc, .sheet .pc-ret, .sheet .pc-disc, .sheet [data-slot^="back."]').forEach(el => {
      const r = el.getBoundingClientRect(); for(const k in Z) if(hit(r, Z[k])) out.push({slot: el.dataset.slot || el.className, kind: 'in-mail-zone', zone: k}); });
    return out; }
})();
</script>
