<script>window.Ivory = window.Ivory || {esc: s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))};</script>
<script src="mf-fo.js"></script>
<!--
  BrochureDesk · Modern Frame · Just Listed and Just Sold postcards, in the hand of the approved Open House library flyer P13 Modern Frame
  (templates/oh-library/p13-modern-frame.html) and its sign-in sheet: the kit's paper, photos as prints in white mats, the main-color band
  with the one giant word, Hanken Grotesk throughout, facts centered with short rules, the brokerage logo where the flyer puts it.
  data.piece.card = "listed" | "sold", data.piece.size = "6x11" (trim 792 x 432 pt) | "6x9" (648 x 432 pt), data.piece.side = "front" | "back".
  FRONTS. Just Listed: the house print, the logo top right over the house's real story (short rules between), the agent; the band across
  the foot with JUST LISTED in giant caps | the street and the place. Just Sold, its own card: the band across the head with JUST SOLD and
  the street; the house print laid over the band's edge; the seller question, the note on the white mat, who to call and the logo.
  BACKS (the owner 11/16: the design runs through the whole card): the band runs across the head, down the mail side and across the foot;
  the postage box, the address block and the barcode strip are small white markups set into it; the paper shows in the window it frames
  (two captioned prints, or the six steps on the white mat); the contact card half its old height in one row. No price, no QR.
-->
<style>
  .pc-wbox{position:absolute;background:#fff;box-shadow:0 2pt 8pt rgba(0,0,0,.16);box-sizing:border-box}
  .pc-steps .it{position:absolute;display:flex;align-items:flex-start}
  .pc-steps .num{position:absolute;display:flex;align-items:center;justify-content:center;font-family:var(--mf-font);font-weight:700;color:var(--mf-on-main);background:var(--mf-main);border-radius:50%}
  .pc-steps .mf-row{position:absolute}
  .mf-ccd{--cc-ink:#ffffff;--cc-muted:var(--mf-soft-main);--cc-accent:var(--mf-gold);--cc-line:rgba(255,255,255,.6);--cc-paper:transparent}
  .pc-steps .stp{font-family:var(--mf-font);font-weight:400;color:#1b1b1b;overflow:hidden}
  .pc-disc{position:absolute;font-size:7.5pt;line-height:10pt;font-weight:500;color:var(--mf-soft-main);overflow:hidden;white-space:nowrap}
  .pc-ret{position:absolute;font-family:var(--mf-font);font-weight:400;font-size:8.6pt;line-height:11pt;color:var(--mf-on-main);overflow:hidden;height:36pt}
  .pc-ret b{font-weight:700;letter-spacing:1.4pt;text-transform:uppercase}
  .mailp{position:absolute;background:#fff}
  .pc-tab{background:var(--fx-paper);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .pc-tab > div{font-family:var(--mf-font);font-weight:700;letter-spacing:1.6pt;line-height:17pt;color:var(--mf-main-ink);white-space:nowrap}
  .cap .a{font-weight:400}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const esc = SW.esc, b = D.brand || {}, A = D.agent || {}, L = D.listing, P = D.piece || {};
  document.body.dataset.mode = D.mode || 'email';
  await SW.setup(D);
  const sold = P.card === 'sold', big = P.size === '6x11', front = P.side === 'front';
  const W = big ? 792 : 648, H = 432, k = big ? 1.12 : 1;
  const K = ((D.sw || {}).pc || {})[sold ? 'js' : 'jl'] || {};
  const hsSrc = A.headshot && ((D.photos||{})[A.headshot] ? D.photos[A.headshot].src : A.headshot) || '';
  const word = sold ? 'Just Sold' : 'Just Listed';
  const issues = [];
  const place = FO.placeTxt(L).toUpperCase(), ad = String(L.address || '');
  // reversed caps never under 8.6 pt: a line that does not fit gives up tracking before it gives up size
  const capsFit = (t, w, max, wt, tracks) => { for(const ls of tracks){ const fs = FXS.fitSize(t, `font-family:Hanken Grotesk;font-weight:${wt};letter-spacing:${ls}pt`, w, max, 8.6); if(FXS.width(t, `font-family:Hanken Grotesk;font-weight:${wt};letter-spacing:${ls}pt;font-size:${fs}pt`) <= w - 12) return {fs: Math.max(8.6, fs), ls}; } return {fs: 8.6, ls: tracks[tracks.length - 1]}; };
  const placeLine = (x, y, w, al, slot, max) => { const c = capsFit(place, w, max || 9.5*k, 600, [3, 2.2, 1.4, 0.8]); return `<div class="mf-place" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${13*k}pt;font-size:${c.fs}pt;line-height:${13*k}pt;letter-spacing:${c.ls}pt;text-align:${al || 'center'}" data-slot="${slot || 'front.place'}" data-lines="1">${esc(place)}</div>`; };
  const disp = (t, x, y, w, fs, slot, al) => `<div class="mf-disp" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${fs*1.08}pt;font-size:${fs}pt;line-height:${fs*1.08}pt;letter-spacing:${Math.min(3, fs*0.05)}pt;text-align:${al || 'center'}" data-slot="${slot}" data-lines="1">${esc(t)}</div>`;
  const street = (x, y, w, max, min, slot, al) => { const fs = FXS.fitSize(ad, 'font-family:Hanken Grotesk;font-weight:600', w - 4, max, min); return {fs, html: `<div class="mf-street" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${fs*1.2}pt;font-size:${fs}pt;line-height:${fs*1.2}pt;text-align:${al || 'center'}" data-slot="${slot || 'front.address'}" data-lines="1">${esc(ad)}</div>`}; };
  const dispFit = (t, w, max, min) => { let f = max; while(f > min && FXS.width(t.toUpperCase(), `font-family:Hanken Grotesk;font-weight:700;letter-spacing:${Math.min(3, f*0.05)}pt;font-size:${f}pt`) > w - 4) f -= 0.5; return f; };
  const desT = A.designation ? (A.nar || /realtor/i.test(A.designation) ? 'REALTOR®' : A.designation) : '';
  let h = '';
  // the rooms each card shows, one photo per physical space and never the hero's: Just Listed back; Just Sold front row; Just Sold back
  const PCP = (() => { const pc = (D.sw || {}).pc || {}, jl = ((pc.jl || {}).back || {}).photos || [], js = ((pc.js || {}).back || {}).photos || [];
    const uniq = list => { const out = [], seen = new Set(['s:' + SW.space(D, 'front')]); list.forEach(c => { const id = c && c.photo; if(!id || !(D.photos || {})[id]) return; const sp = 's:' + SW.space(D, id); if(seen.has(id) || seen.has(sp)) return; seen.add(id); seen.add(sp); out.push(c); }); return out; };
    const minor = c => /closet|laundry|utility|garage|hall|stair|foyer|entry/i.test(c.photo) ? 1 : 0, ord = l => l.slice().sort((p, q) => minor(p) - minor(q));
    const S = ord(uniq(js.concat(jl))), rest = S.slice(3);
    return {listed: ord(uniq(jl.concat(js))), sold: S, soldBack: rest.length >= 3 ? rest : ord(uniq(jl.concat(js)))}; })();

  if(front){
    const F = K.front || {}, pid = FO.heroId(D, (F.cap || {}).photo || 'front');
    // owner 11/17: more bullets to fill the space: the card's own highlights first, then the listing's other real selling facts (none said twice)
    const hlPool = []; [].concat(F.highlights || [], FXS.tagFacts(D).tags || []).forEach(t => { if(t && !hlPool.some(u => u === t || SW.sameFact(u, t))) hlPool.push(t); });
    let hls = hlPool.slice(0, 8);
    const RH = 'font-family:Hanken Grotesk', R = 18, g = R + 6;
    const agentLine = (x, y, w, al, onDark) => { const ns = Math.min(15*k, FXS.fitSize(A.name || '', `${RH};font-weight:700`, w, 15*k, 11));
      return `<div class="abs" style="left:${x}pt;top:${y}pt;width:${w}pt;text-align:${al || 'center'};white-space:nowrap">`
        + `<div style="${RH};font-weight:700;font-size:${ns}pt;line-height:${ns*1.2}pt;color:${onDark ? 'var(--mf-on-main)' : 'var(--mf-on)'}" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</div>`
        + `<div style="line-height:${13*k}pt">${desT ? `<span style="${RH};font-weight:700;font-size:${8.6*k}pt;letter-spacing:1.6pt;color:${onDark ? 'var(--mf-gold)' : 'var(--mf-accent)'};margin-right:10pt" data-slot="agent.desig" data-lines="1">${esc(desT)}</span>` : ''}<span style="${RH};font-weight:600;font-size:${12*k}pt;color:${onDark ? 'var(--mf-on-main)' : 'var(--mf-on)'}" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</span></div></div>`; };
    const logoAt = (x, y, w, hh, src, just) => `<div class="abs logo" data-area="${w*hh}" data-maxh="${hh}" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${hh}pt;justify-content:${just || 'center'}">${src ? `<img src="${esc(src)}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage || '')}</span>`}</div>`;
    if(!sold){
      // ---------- JUST LISTED: the house breaks out of the frame. The frame closes round the left of the card (rails top, left and foot,
      // the gold hairline inside); the house runs off the right, the head and the foot. In the window, on its center axis as P16 sets it:
      // the place in tracked caps, JUST LISTED as the flyer's headline (700, tight, the main color, the card's one big word), the full
      // street, a gold rule, three real highlights set left, then the agent and the logo. ----------
      let PX = Math.round(W*0.45); const tall = SW.fits(D, pid, W - PX + 9, H + 18);
      if(tall){
        h += FO.rail(-9, -9, PX + 9, R + 9) + FO.rail(-9, -9, R + 9, H + 18) + FO.rail(-9, H - R, PX + 9, R + 9);
        h += FO.hl(g, g, PX - g, 1) + FO.hl(g, g, 1, H - 2*g) + FO.hl(g, H - g - 1, PX - g, 1);
        h += FXS.box(D, pid, PX, -9, W - PX + 9, H + 18, 'front.hero', '', 0);
      } else {
        // a wide house: it breaks out of the head and the right side only, at the shape it needs; the frame runs on under it and closes
        // an L-shaped window, the highlights set in a row in the part under the house
        PX = Math.round(W*0.4); let PH = Math.round((W - PX + 9)/1.22); while(PH < H*0.8 && !SW.fits(D, pid, W - PX + 9, PH)) PH += 4; PH = Math.min(PH, Math.round(H*0.8));
        h += FO.frameAll(R, W, H) + FXS.box(D, pid, PX, -9, W - PX + 9, PH, 'front.hero', '', 0);
        // owner 11/17 (more bullets): the highlights stand in the window's column under the street; the agent and the logo take the strip under the house
        const hy = PH - 9, rx = PX + 14, rw = W - g - 14 - rx, room = H - g - hy, aw = Math.min(190*k, rw*0.5), lw = Math.min(150*k, rw - aw - 24), lh2 = Math.min(40*k, room - 16), ah2 = 15*k*1.2 + 13*k, sx = rx + (rw - aw - 24 - lw)/2;
        h += agentLine(sx, hy + (room - ah2)/2 + 5, aw, 'center') + logoAt(sx + aw + 24, hy + (room - lh2)/2 + 3, lw, lh2, MF.logoPaper(D));
      }
      const cx = g + 14, cw = PX - cx - 14, wf = FXS.fitSize('Just Listed', `${RH};font-weight:700;letter-spacing:-1pt`, cw, 58*k, 30), two = wf < 40*k || !tall;
      const wl = two ? ['Just', 'Listed'] : ['Just Listed'], wfs = two ? Math.min(...wl.map(t => FXS.fitSize(t, `${RH};font-weight:700;letter-spacing:-1pt`, cw, 62*k, 30))) : wf;
      const st = FXS.fitSize(ad, `${RH};font-weight:600`, cw, 17*k, 11), pc = capsFit(place, cw, 9*k, 600, [3, 2.2, 1.4, .8]);
      const ns = 15*k*1.2 + 13*k, lgH = 30*k, foot = tall ? ns + 8 + lgH : -20;   // a wide house: the column runs to the window's foot (the agent is under the house)
      const fixedH = 13*k + 6 + wl.length*wfs*1.02 + 8 + st*1.25, avail = H - 2*g - 28 - foot - 14;
      let hlfs = 11, lead = 17;
      if(hls.length){ const bulRoom = avail - fixedH - (14 + 1.2 + 12) - 6; hls = hls.filter(t => FXS.width(t, `${RH};font-weight:500;font-size:${10*k}pt`) <= cw - 18);
        hls = hls.slice(0, Math.max(3, Math.min(6, Math.floor(bulRoom/(10*k*1.5))))); hlfs = Math.min(12.5*k, ...hls.map(t => FXS.fitSize(t, `${RH};font-weight:500`, cw - 18, 12.5*k, 9)));
        lead = Math.max(hlfs*1.45, Math.min(hlfs*(tall ? 1.9 : 2.3), bulRoom/hls.length)); }
      const blockH = fixedH + (hls.length ? 14 + 1.2 + 12 + hls.length*lead : 0);
      let y = g + 14 + Math.max(0, (H - 2*g - 28 - foot - 14 - blockH)/2);
      h += `<div class="mf-eye" style="left:${cx}pt;top:${y}pt;width:${cw}pt;height:${13*k}pt;font-size:${pc.fs}pt;line-height:${13*k}pt;letter-spacing:${pc.ls}pt" data-slot="front.place" data-lines="1">${esc(place)}</div>`; y += 13*k + 6;
      wl.forEach((t, i) => { h += `<div class="mf-big" style="left:${cx - 4}pt;top:${y}pt;width:${cw + 8}pt;height:${wfs*1.02}pt;font-size:${wfs}pt;line-height:${wfs*1.02}pt" data-slot="front.status${i ? '2' : ''}" data-lines="1">${esc(t)}</div>`; y += wfs*1.02; }); y += 8;
      h += `<div class="mf-line" style="left:${cx}pt;top:${y}pt;width:${cw}pt;height:${st*1.25}pt;font-size:${st}pt;line-height:${st*1.25}pt;font-weight:600" data-slot="front.address" data-lines="1">${esc(ad)}</div>`; y += st*1.25 + 14;
      if(hls.length){ h += `<div class="mf-rule" style="left:${cx + cw/2 - 30}pt;top:${y}pt;width:60pt"></div>`; y += 12; }
      if(!hls.length) y -= 12;
      const hw = hls.length ? Math.max(...hls.map(t => FXS.width(t, `${RH};font-weight:500;font-size:${hlfs}pt`))) + 16 : 0, hx = cx + (cw - hw)/2;
      hls.forEach((t, i) => { h += `<div class="abs" style="left:${hx}pt;top:${y + i*lead}pt;width:${hw + 4}pt;height:${lead}pt;${RH};font-weight:500;font-size:${hlfs}pt;line-height:${lead}pt;color:var(--mf-on);white-space:nowrap" data-slot="front.hl.${i}" data-lines="1"><span style="display:inline-block;width:8pt;height:8pt;border:1.2pt solid var(--mf-gold-p);border-radius:50%;margin-right:8pt;vertical-align:-0.5pt;box-sizing:border-box"></span>${esc(t)}</div>`; });
      const fy = H - g - 14 - foot;
      if(tall) h += agentLine(cx, fy, cw, 'center') + logoAt(cx, fy + ns + 8, cw, lgH, MF.logoPaper(D));
    } else {
      // ---------- JUST SOLD front (owner 11/17: full redesign, nothing sparse). The P16 flyer as a sold card: the frame closed all round,
      // the house as the window's big print, three rooms of the sold house in a row (the flyer's photo row), JUST SOLD as the flyer's
      // headline (700, tight, the main color: the card's one big word), the street and place, a gold rule, the seller question and a
      // real note set full and justified. The frame's foot rail runs deep (the flyer front's rail) and carries who to call and the logo.
      // No beds, baths or square feet. ----------
      const FT = Math.round(H - 70), x0 = g + 10, x1 = W - g - 10, y0 = g + 10, y1 = FT - 6 - 10, WH = y1 - y0, gp = 8;
      h += FO.rail(-9, -9, W + 18, R + 9) + FO.rail(-9, -9, R + 9, H + 18) + FO.rail(W - R, -9, R + 9, H + 18) + FO.rail(-9, FT, W + 18, H + 9 - FT);
      h += FO.hl(g, g, W - 2*g, 1) + FO.hl(g, g, 1, FT - 6 - g) + FO.hl(W - g - 1, g, 1, FT - 6 - g) + FO.hl(g, FT - 7, W - 2*g, 1);
      const th = PCP.sold.slice(0, 3), n = th.length, thH = 86;   // a print never under 85 pt tall; both sizes are 6 in tall
      const tallJ = SW.fits(D, pid, Math.round(W*0.36), WH);
      let hw, hh, thX, thW; const thY = y1 - thH;
      if(tallJ){ hw = Math.round(W*0.36); hh = WH; thX = x0 + hw + 18; thW = x1 - thX; }
      else { hw = Math.round(W*0.5); hh = n ? WH - gp - thH : WH; thX = x0; thW = hw; }
      h += FXS.box(D, pid, x0, y0, hw, hh, 'front.hero', '', 0);
      const tw1 = n ? (thW - (n - 1)*gp)/n : 0;
      th.forEach((c, i) => { h += FXS.box(D, c.photo, thX + i*(tw1 + gp), thY, tw1, thH, 'front.room' + i, '', 0); });
      const tx = x0 + hw + 18, tw = x1 - tx, tb = tallJ && n ? thY - 14 : y1;
      const pc = capsFit(place, tw, 9*k, 600, [3, 2.2, 1.4, .8]);
      let ls = FXS.fitSize('Just Sold', `${RH};font-weight:700;letter-spacing:-1pt`, tw, 66*k, 34); const sts = FXS.fitSize(ad, `${RH};font-weight:600`, tw, 17*k, 11);
      const q = 'Thinking about selling?', qs = FXS.fitSize(q, `${RH};font-weight:700`, tw, 15*k, 10);
      const nfs = (tallJ ? 10.5 : 12)*k, nlh = nfs*1.42, hd = () => 13*k + 4 + ls*1.02 + 2 + sts*1.25 + 8 + 1.2 + 8 + qs*1.25 + 4;
      while(ls > 34 && hd() + 3*nlh > tb - y0) ls -= 1;   // the stack always fits its room: the headline gives before the note loses a line
      const headH = hd(), nl = Math.max(3, Math.min(tallJ ? 5 : 9, Math.floor((tb - y0 - headH)/nlh))), tot = headH + nl*nlh;
      let y = y0 + Math.max(0, (tb - y0 - tot)/2);
      h += `<div class="abs" id="jscol" data-room="${tb - y0}" data-y0="${y0}" style="left:0;top:0;width:0;height:0">`;
      h += `<div class="mf-eye" style="left:${tx}pt;top:${y}pt;width:${tw}pt;height:${13*k}pt;font-size:${pc.fs}pt;line-height:${13*k}pt;letter-spacing:${pc.ls}pt" data-slot="front.place" data-lines="1">${esc(place)}</div>`; y += 13*k + 4;
      h += `<div class="mf-big" style="left:${tx - 4}pt;top:${y}pt;width:${tw + 8}pt;height:${ls*1.02}pt;font-size:${ls}pt;line-height:${ls*1.02}pt" data-slot="front.status" data-lines="1">Just Sold</div>`; y += ls*1.02 + 2;
      h += `<div class="mf-line" style="left:${tx}pt;top:${y}pt;width:${tw}pt;height:${sts*1.25}pt;font-size:${sts}pt;line-height:${sts*1.25}pt;font-weight:600" data-slot="front.address" data-lines="1">${esc(ad)}</div>`; y += sts*1.25 + 8;
      h += `<div class="mf-rule" style="left:${tx + tw/2 - 30}pt;top:${y}pt;width:60pt"></div>`; y += 1.2 + 8;
      h += `<div class="mf-line" style="left:${tx}pt;top:${y}pt;width:${tw}pt;height:${qs*1.25}pt;font-size:${qs}pt;line-height:${qs*1.25}pt;font-weight:700;color:var(--mf-accent)" data-slot="front.cta" data-lines="1">${esc(q)}</div>`; y += qs*1.25 + 4;
      const tries = []; for(let t = nl; t >= 3; t--) tries.push(t);
      h += FO.full(FO.wu((F.note || {}).s || F.note2 || [], tx, y, tw, nl*nlh + 0.01, 'front.note', nfs, nlh, 'wu mf-c')).replace(/data-try="[^"]*"/, `data-try="${tries.join(',')}"`).replace('data-slot="front.note"', 'data-slot="front.note" data-planned="' + (nl*nlh) + '"').replace('class="abs wu mf-c"', 'class="abs wu mf-c" id="jsnote"').replace(/ data-h0="[^"]*"/, '');
      h += `</div>`;
      // the deep foot rail: the agent at the left, the invitation in the middle, the logo at the right, each centered top to bottom
      const fh = H - FT, nsz = Math.min(15*k, FXS.fitSize(A.name || '', `${RH};font-weight:700`, 190*k, 15*k, 11)), ah = nsz*1.2 + 13*k, lgH = 34*k, lgW = 150*k;
      const call = String((K.back || {}).call || ((D.companion || {}).justSold || {}).ctaNext || 'Call or text me anytime.');
      const mx0 = x0 + 190*k + 12, mw = x1 - lgW - 12 - mx0, cf = FXS.fitSize(call, `${RH};font-weight:600`, mw - 8, 13*k, 9);
      h += `<div class="mf-band">` + agentLine(x0, FT + (fh - ah)/2 - 2, 190*k, 'left', true)
        + `<div class="abs" style="left:${mx0}pt;top:${FT + (fh - cf*1.3)/2 - 2}pt;width:${mw}pt;height:${cf*1.3}pt;${RH};font-weight:600;font-size:${cf}pt;line-height:${cf*1.3}pt;color:var(--mf-gold);text-align:center;white-space:nowrap" data-slot="front.call" data-lines="1">${esc(call)}</div></div>`
        + logoAt(x1 - lgW, FT + (fh - lgH)/2 - 2, lgW, lgH, MF.logoSrc(D), 'flex-end');
    }
  } else {
    // ---------------- BACK (owner 11/17: redesign, the layout fills everything to the right; nothing empty or sparse) ----------------
    // Modern Frame: the frame closes round the card and the design runs through all of it. The paper window at the left, its gold hairline
    // closed, holds the heading on P16's center axis (status, full street, place) and the card's words: the home's write-up, full and
    // justified (Just Listed), or the six steps as the sign-in sheet's numbered rows (Just Sold). Beside it a column of the house's rooms
    // runs from the head rail to the foot rail, hard against the mail column. The mail column is only as wide as the mail zones: the return
    // address stacked beside the postage markup, the facts (Just Listed) or the seller question (Just Sold) between the postage and the
    // address markups. The foot rail runs deep and carries the contact row (half height, one line) and the barcode markup.
    const dx = W - 648, X = 30, B = K.back || {}, RHb = 'font-family:Hanken Grotesk', R = 18, g = R + 6;
