<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Across the Fold postcard</title>
<link rel="stylesheet" href="across-the-fold.css">
<link rel="stylesheet" href="pieces.css">
<script src="across-the-fold.js"></script>
<script src="../engine/baths.js"></script>
<script src="../engine/setpieces.js"></script>
<!--
  Across the Fold · Just Listed and Just Sold postcards. data.piece: card "listed" | "sold", size "6x9" (trim 648 x 432 pt) |
  "6x11" (trim 792 x 432 pt), side "front" | "back". Print adds 0.125 in (9 pt) bleed (TrimBox set by the renderer).

  Front: the whole house (roof to steps) bleeds off the top and left, as on the fold-over cover, with the fold-over's
  gold-boxed tag on its corner (Just Listed, when the listing says it has never flooded). Beside it, the gold kicker, the status
  in the serif over a gold hairline, the address and city, state and ZIP, and the fold-over's facts table with its gold rules
  (Just Listed) or the agent's name and number and the call to action (Just Sold). Under it, a gold rule and the write-up.
  Back: the navy field with a lifted-navy edge band and a gold line across the top; the return address and the status line
  across the top; captioned photos in one row (serif names with the gold diamond, same line count), one beside the address
  block (Just Listed), or three interiors over the "How I'd start" list in two columns, diamond bullets, four at 6x9 and six
  at 6x11 (Just Sold); the lifted-navy board with its gold top rule under the postage box; the write-up (Just Listed). Then the
  postcard contact card (templates/_shared/agentcard.js, postcard true) full width under the address block and above the
  barcode strip, carrying the back's one logo, and the two-line disclaimer beside the barcode strip. Mail zones:
  templates/_shared/setpieces.js SP.mail. No price, no QR, no photo numbers, no "virtually staged".
  Copy: data.copy.pc.jl / data.copy.pc.js.
-->
<style>
  .st{font:400 46pt/48pt var(--font-display);letter-spacing:-.8pt;color:var(--ink);white-space:nowrap;overflow:hidden}
  .ad{font:400 22pt/25pt var(--font-display);letter-spacing:-.2pt;color:var(--ink);overflow:hidden}
  .bst{display:flex;align-items:baseline;gap:10pt;white-space:nowrap;overflow:hidden}
  .bst .s{font:400 22pt/26pt var(--font-display);color:var(--ink)}
  .bst .a{font:700 8.5pt/10pt var(--font-body);letter-spacing:1.4pt;text-transform:uppercase;color:var(--gold)}
  .ret{font:400 8pt/10pt var(--font-body);color:var(--text);white-space:nowrap;overflow:hidden}
  .ret b{font-weight:700;letter-spacing:.8pt;text-transform:uppercase;color:var(--ink)}
  .ctx{font-size:9pt;line-height:11.5pt;color:var(--text)}
  .stp{display:grid;grid-template-columns:1fr 1fr;column-gap:16pt;overflow:hidden}
  .stp .it{display:flex;gap:7pt;align-items:flex-start;color:var(--ink);font-family:var(--font-body);font-weight:600;border-top:.6pt solid rgba(200,164,106,.4);padding-top:4pt}
  .stp .it i{width:4pt;height:4pt;background:var(--gold);flex:none;transform:rotate(45deg)}
  .bigb{font:400 14pt/16pt var(--font-display);color:var(--ink);overflow:hidden}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = AF.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="color:#fff;padding:20pt">No data injected.</p>'; return; }
  const esc = SP.esc, L = D.listing, A = D.agent || {};
  const b = Object.assign({}, D.brand || {}); b.logo = b.logoOnDark || b.logo; D.brand = b;   // navy field: the light logo
  const issues = await SP.ready(D);
  const sold = D.piece.card === 'sold', big = D.piece.size === '6x11', front = D.piece.side === 'front';
  const PCall = ((D.copy || {}).pc || {}), C = (sold ? PCall.js : PCall.jl) || {};
  document.body.dataset.mode = D.mode || 'email';
  const W = big ? 792 : 648, H = 432, M = 24, status = sold ? 'Just Sold' : 'Just Listed';
  let h = '';

  if(front){
    // ---------- front ----------
    const pw = big ? 500 : 410, ph = sold ? 314 : 326, cx = pw + 20, cw = W - M - cx;
    h += SP.photo(D, C.hero || 'front', -9, -9, pw + 9, ph + 9, 'front.hero');
    if(!sold && SP.floodStated(L.description)) h += `<div class="abs" style="left:${big ? 22 : 18}pt;top:${ph - 30}pt"><span class="ctag" data-slot="front.tag" data-lines="1">Never flooded</span></div>`;
    const sfs = big ? 54 : 48, slh = big ? 52 : 50, rt = big ? 142 : 140, afs = big ? 26 : 22, alh = afs + 3, pfs = big ? 11 : 8.5;
    h += `<div class="abs kick" style="left:${cx}pt;top:22pt;width:${cw}pt;height:10pt" data-slot="front.kick" data-lines="1">${esc(sold ? 'Recently sold' : 'New on the market')}</div>`;
    h += `<div class="abs st" style="left:${cx - 2}pt;top:34pt;width:${cw + 2}pt;height:${2*slh}pt;font-size:${sfs}pt;line-height:${slh}pt;white-space:normal" data-slot="status" data-lines="2">${esc(status.split(' ')[0])}<br>${esc(status.split(' ')[1])}</div>`;
    h += `<div class="rule" style="left:${cx}pt;top:${rt}pt;width:${cw}pt;height:1.4pt;background:var(--gold)"></div>`;
    const bot = ph - 9, ft = rt + 10 + alh + 6 + (big ? 14 : 10) + 9;
    // the facts (Just Listed): the fold-over's table, one column, gold labels, serif values; baths per templates/_shared/baths.js
    const bn = BD.bathNum(L), nf = v => Number(v).toLocaleString('en-US'), rows = [];
    if(L.beds) rows.push([L.beds == 1 ? 'Bedroom' : 'Bedrooms', esc(L.beds)]);
    if(L.baths) rows.push([bn.label, bn.num]);
    if(bn.half) rows.push(['Half baths', esc(bn.half.replace(/\D.*/, ''))]);
    if(L.sqft) rows.push(['Square feet', nf(L.sqft)]);
    if(L.yearBuilt || L.year) rows.push(['Built in', esc(L.yearBuilt || L.year)]);
    if(SP.lotText(L)) rows.push(['Lot', esc(SP.lotText(L).replace(/\s*(sq ft )?lot$/i, '').trim() + ' sq ft')]);
    const rowH = (bot - ft)/rows.length, vfs = Math.min(big ? 15 : 14, rowH*0.6);
    const tail = !sold
      ? `<div class="abs sp1" style="left:0;top:${ft - rt - 10}pt;width:${cw}pt;height:${bot - ft}pt;display:flex;flex-direction:column">${rows.map((r, i) => `<div style="flex:1;align-items:center"><span class="l" style="font-size:${big ? 8.5 : 8}pt" data-slot="front.fact${i}.l" data-lines="1">${esc(r[0])}</span><span class="v" style="font-size:${vfs}pt;line-height:${vfs + 3}pt" data-slot="front.fact${i}.v" data-lines="1">${r[1]}</span></div>`).join('')}</div>`
      : `<div><div style="font:400 ${big ? 28 : 19}pt/${big ? 32 : 22}pt var(--font-display);color:var(--ink);white-space:nowrap;overflow:hidden" data-slot="agent.name" data-lines="1" data-fit="14">${esc(A.name || '')}</div>
         <div style="font:700 ${big ? 20 : 14}pt/${big ? 25 : 18}pt var(--font-body);color:var(--gold);letter-spacing:.4pt;white-space:nowrap;overflow:hidden" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</div>
         <div style="margin-top:${big ? 7 : 6}pt;border-top:.7pt solid var(--line);padding-top:${big ? 5 : 5}pt;font:400 ${big ? 10 : 9}pt/${big ? 14 : 12.5}pt var(--font-body);color:var(--text)"><div style="white-space:nowrap;overflow:hidden" data-slot="agent.email" data-lines="1">${esc(A.email || '')}</div>${big ? '' : `<div style="white-space:nowrap;overflow:hidden" data-slot="agent.web" data-lines="1">${esc(A.web || '')}</div>`}</div></div>`;
    h += `<div class="abs" style="left:${cx}pt;top:${rt + 10}pt;width:${cw}pt;height:${bot - rt - 10}pt;display:flex;flex-direction:column;justify-content:space-between">
      <div><div class="ad" style="font-size:${afs}pt;line-height:${alh}pt" data-slot="address" data-lines="2">${esc(L.address)}</div><div class="kick" style="margin-top:${big ? 6 : 5}pt;height:${big ? 14 : 10}pt;font-size:${pfs}pt;line-height:${big ? 14 : 10}pt" data-slot="place" data-lines="1">${esc(SP.placeZip(L).toUpperCase())}</div></div>${tail}</div>`;
    // long street names: a street on two lines pushes the facts down; they give up rows ("Built in" first)
    if(!sold) SP.afterAddress(() => {
      const pl = document.querySelector('[data-slot="place"]'), fl = document.querySelector('.sp1'); if(!pl || !fl) return;
      const px = 96/72, need = (pl.getBoundingClientRect().bottom + 9*px - fl.getBoundingClientRect().top)/px;
      if(need <= 0.5) return;
      const rh = parseFloat(fl.style.height)/fl.children.length;
      fl.style.top = parseFloat(fl.style.top) + need + 'pt'; fl.style.height = parseFloat(fl.style.height) - need + 'pt';
      SP.trimRows(fl, () => parseFloat(fl.style.height)/[...fl.children].filter(r => r.style.display !== 'none').length >= rh*0.9);
    });
    const nl = sold ? 3 : 4, lh = 18, fs = big ? 13.75 : 12.5;
    h += `<div class="rule" style="left:${M}pt;top:${ph + 6}pt;width:${W - 2*M}pt"></div>`;
    h += `<div class="abs ab" style="left:${M}pt;top:${ph + 14}pt;width:${W - 2*M}pt;height:${nl*lh}pt;font-size:${fs}pt;line-height:${lh}pt" data-slot="${sold ? 'front.sold' : 'front.about'}" data-para="1" data-min="${nl}" data-fillbox="1">${esc(big ? C.front11 : C.front9)}</div>`;
    const cta = C.cta || 'Thinking about selling? Let’s talk.', cfs0 = Math.min(big ? 22 : 20, Math.floor((W - 2*M)/(cta.length*0.47)*4)/4);
    if(sold) h += `<div class="abs" style="left:${M}pt;top:${ph + 14 + nl*lh + 8}pt;width:${W - 2*M}pt;height:${big ? 26 : 24}pt;font:400 ${cfs0}pt/${big ? 26 : 24}pt var(--font-display);color:var(--gold);white-space:nowrap;overflow:hidden" data-slot="sold.cta" data-lines="1">${esc(cta)}</div>`;
  } else {
    // ---------- back ----------
    const Z = SP.mail(W), X = M, LZ = Z.zA[0] - 12, rW = Z.zP[0] - 12 - Z.zA[0], pTop = 56, lw = LZ - X;
    h += `<div class="abs" data-blk="1" style="left:-9pt;top:-9pt;width:${W + 18}pt;height:13pt;background:var(--navy2);border-bottom:1.4pt solid var(--gold)"></div>`;
    const ret = SP.returnLines(D);
    h += `<div class="abs ret" style="left:${Z.zA[0]}pt;top:16pt;width:${rW}pt;height:32pt;text-align:right"><b data-slot="return0" data-lines="1" style="display:block">${esc(ret[0] || '')}</b>${ret.slice(1).map((r, i) => `<span data-slot="return${i + 1}" data-lines="1" style="display:block">${esc(r)}</span>`).join('')}</div>`;
    h += `<div class="abs bst" style="left:${X}pt;top:16pt;width:${LZ - X}pt;height:28pt"><span class="s" data-slot="back.status.s">${esc(status)}</span><span class="a" data-slot="back.status.a">${esc(L.address)}</span></div>`;
    h += `<div class="rule" style="left:${X}pt;top:47pt;width:${LZ - X}pt"></div>`;
    const cfs = big ? 9.5 : 9, clh = big ? 12 : 11.5;
    const cap = (c, x, y, w, slot, row) => `<div class="abs capnm" style="left:${x}pt;top:${y + 4}pt;width:${w}pt;height:16pt"><i class="dia"></i><span data-slot="${slot}.t" data-lines="1" style="white-space:nowrap;overflow:hidden">${esc(c.t)}</span></div>
      <div class="abs ctx" style="left:${x}pt;top:${y + 23}pt;width:${w}pt;font-size:${cfs}pt;line-height:${clh}pt" data-slot="${slot}" data-cap="1" data-row="${row}" data-para="1" data-min="3">${esc(big && c.a11 ? c.a11 : c.a)}</div>`;
    let g = '';
    if(!sold){
      const bk = C.back || [], n = big ? 4 : 3, items = bk.slice(0, n), rItem = bk[4], gap = 10, ph = 60;
      const pw = (lw - (n - 1)*gap)/n;
      items.forEach((c, i) => { const x = X + i*(pw + gap); g += SP.photo(D, c.id, x, pTop, pw, ph, 'back.photo' + i); h += cap(c, x, pTop + ph, pw, 'back.cap' + i, 'back'); });
      if(rItem){ g += SP.photo(D, rItem.id, Z.zA[0], pTop, rW, ph, 'back.photoR'); h += cap(rItem, Z.zA[0], pTop + ph, rW, 'back.capR', 'back'); }
      const ty = pTop + ph + 23 + 4*clh + 10, fs = big ? 11.5 : 10.5, lh = big ? 14 : 15, nl = Math.floor((Z.cardY - 8 - ty)/lh);
      h += `<div class="abs ab" style="left:${X}pt;top:${ty}pt;width:${lw}pt;height:${nl*lh}pt;font-size:${fs}pt;line-height:${lh}pt" data-slot="back.about" data-para="1" data-min="3" data-fillbox="1">${esc(big ? C.about11 : C.about9)}</div>`;
    } else {
      // three interiors, no captions; "How I'd start" under them in two columns, four steps at 6x9 and six at 6x11
      const ids = C.photos || [], gap = 10, pw = (lw - gap)/2, ph = big ? 112 : 108;
      ids.slice(0, 2).forEach((id, i) => { g += SP.photo(D, id, X + i*(pw + gap), pTop, pw, ph, 'back.photo' + i); });
      if(ids[2]) g += SP.photo(D, ids[2], Z.zA[0], pTop, rW, ph, 'back.photoR');
      const ky = pTop + ph + 12;
      h += `<div class="abs kick" style="left:${X}pt;top:${ky}pt;width:${lw}pt;height:10pt" data-slot="sold.stepsLabel" data-lines="1">${esc(C.stepsLabel || 'How I’d start')}</div>`;
      const st = (big ? C.steps11 : C.steps9) || [], rowsN = Math.ceil(st.length/2), sy = ky + 16, sfs = big ? 13.5 : 11;
      const callH = big ? 0 : 26, sh = Z.cardY - 10 - sy - callH;
      h += `<div class="abs stp" style="left:${X}pt;top:${sy}pt;width:${lw}pt;height:${sh}pt;grid-template-rows:repeat(${rowsN},1fr);grid-auto-flow:row">${st.map((s, i) => `<div class="it" style="font-size:${sfs}pt;line-height:${sfs + 4}pt"><i style="margin-top:${(sfs + 4)/2 - 1}pt"></i><span data-slot="sold.step${i}" data-lines="2">${esc(s)}</span></div>`).join('')}</div>`;
      if(!big) h += `<div class="abs" style="left:${X}pt;top:${Z.cardY - 10 - callH + 4}pt;width:${lw}pt;height:22pt;font:400 17pt/22pt var(--font-display);color:var(--gold);white-space:nowrap;overflow:hidden" data-slot="sold.call" data-lines="1">${esc(C.call || 'Call or text me anytime.')}</div>`;
    }
    h += `<div class="abs" data-gapcheck="back.photos" style="left:0;top:0">${g}</div>`;
    const sl = C.slab || {};
    h += `<div class="navybox" data-blk="1" style="left:${Z.zP[0]}pt;top:${Z.zP[1] + Z.zP[3] + 8}pt;width:${W - Z.zP[0] + 9}pt;height:${Z.zA[1] - Z.zP[1] - Z.zP[3] - 16}pt;padding:6pt 18pt 6pt 9pt;display:flex;flex-direction:column;justify-content:center"><div class="bigb" data-slot="slab.big" data-lines="3">${esc(sl.big || '')}</div></div>`;
    h += SP.postCard(D, Z, W);
    h += SP.fine(D, X, 396, Z.zB[0] - 12 - X, 'var(--text)');
    h += SP.mailGuides(D, Z);
  }

  // the step list (two columns): a longer list or a longer step closes its line spacing, then steps its type down, never under 8 pt
  const fitSteps = async () => document.querySelectorAll('.stp').forEach(el => {
    const its = [...el.children]; let f = parseFloat(getComputedStyle(its[0]).fontSize)*72/96;
    const set = () => its.forEach(i => { i.style.fontSize = f + 'pt'; i.style.lineHeight = (f + 3) + 'pt'; });
    while(el.scrollHeight > el.clientHeight + 0.5 && f > 8){ f -= 0.25; set(); }
  });
  await SP.finish(D, W, H, h, issues, fitSteps);
})();
</script>
</body>
</html>
