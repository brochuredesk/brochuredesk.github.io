<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · Across the Fold fold-over</title>
<link rel="stylesheet" href="across-the-fold.css">
<script src="../engine/baths.js"></script>
<script src="../engine/baths-text.js"></script>
<script src="../engine/planink.js"></script>
<script src="across-the-fold.js"></script>
<!--
  BrochureDesk · Across the Fold · 11 x 17 fold-over
  Four landscape 11 x 8.5 panels (792 x 612 pt), 0.125 in (9 pt) bleed.
    outside spread: back (turned 180, on top) over cover      inside spread: inside top over inside bottom
  Midnight navy, gold labels, white serif. The two inside panels mirror each other across the crease: a lead photo with two
  companions beside it, then a row of three. The cover runs a whole-house hero to the bleed with a second exterior inset.
  Modes (data.mode): proof = four 810 x 630 pt pages; print = two spreads 810 x 1242 pt.
  The floor plan is the agent's own drawing, placed as given (data.plan.levels). With no plan the back shows a room-by-room
  list in its place (copy.back.rooms).
-->
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = AF.data(), esc = AF.esc; AF.fitMode = !!D.fit;
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  await AF.cardReady;
  const mode = D.mode || 'proof', L = D.listing, A = D.agent || {}, C = D.copy || {}, issues = [];
  const b = Object.assign({}, D.brand || {}); b.logo = b.logoOnDark || b.logo;   // dark field: the light version of the logo
  D.brand = b;
  await Promise.all(['400 10pt','600 10pt','700 10pt'].flatMap(w => [document.fonts.load(`${w} 'Source Serif 4'`), document.fonts.load(`${w} 'Hanken Grotesk'`)]));
  document.body.dataset.mode = mode;
  const hasPlan = !!(D.plan && D.plan.levels && D.plan.levels.length);
  const hs = (D.photos||{})[A.headshot] ? D.photos[A.headshot].src : (A.headshot || '');
  const flood = AF.floodStated(L.description);

  // ================= COVER =================
  function cover(){
    const K = C.front || {}, ph = (D.photos||{})[K.photo] || {};
    const asp = (ph.w && ph.h) ? ph.w/ph.h : 1.5, bx = ph.box;
    // the hero runs to the bleed; its height shows the whole house (roof to steps) when the photo carries the house's box
    const natH = 810/asp; let hh = 400;
    if(bx){ const need = (bx[3]-bx[1])*natH + 26; hh = Math.max(412, Math.min(430, need));
      const top = Math.max(0, Math.min(natH - hh - 9, (bx[1]*natH - 13))); if(natH > hh+9) ph.focusY = Math.round(100*top/(natH-hh-9)); }
    const bot = hh - 9;                      // visible bottom of the hero inside the panel
    const y0 = bot + 16, hgt = 588 - y0;
    let h = AF.photo(D, K.photo, -9, -9, 810, hh);
    h += AF.photo(D, K.inset, 24, y0, Math.round(hgt*1.34), hgt);
    const ix = 24 + Math.round(hgt*1.34) + 18, iw = 768 - ix;
    h += AF.kick(K.kicker, 'front.kicker', ix, y0 - 1, iw);
    h += `<div class="abs addr" style="left:${ix}pt;top:${y0+12}pt;width:${iw}pt;height:40pt" data-slot="front.address" data-lines="1">${esc(L.address)}</div>`;
    const sp = AF.specs(L), sw = 250, sy = y0 + 58;
    // owner 10/29 voice review (AF-FO): back to the two-by-two table; its top rule lines up with the top of the paragraph
    // beside it (set after layout, see alignSpecs)
    h += `<div class="abs specs" data-align="front.intro" style="left:${ix}pt;top:${sy}pt;width:${sw}pt">${sp.map((r,i)=>`<div><span class="l" data-slot="front.spec${i}.l" data-lines="1">${esc(r.l)}</span><span class="v" data-slot="front.spec${i}.v" data-lines="1">${esc(r.v)}</span></div>`).join('')}</div>`;
    const px = ix + sw + 18, pw = 768 - px, il = 6;
    h += `<div class="abs body" style="left:${px}pt;top:${sy+4}pt;width:${pw}pt;height:${il*13}pt;font-size:9.5pt;line-height:13pt" data-slot="front.intro" data-lines="${il}" data-cap="1">${esc(AF.txt(K.intro))}</div>`;
    if(K.tag) h += `<div class="abs" style="left:${ix}pt;top:${588-17}pt"><span class="tag" data-slot="front.tag" data-lines="1">${esc(K.tag)}</span></div>`;
    return h;
  }

  // ================= INSIDE (both panels, mirrored across the crease) =================
  function inside(T, p, withLogo){
    const LW = 474, RX = 508, PW = 130, TX = RX + PW + 10, TW = 768 - TX, y0 = 84, HA = 302, G = 10, LN = 3, NB = 3;
    let h = AF.kick(T.kicker, p+'.kicker', 24, 26, 560) + AF.title(T.title, p+'.title', 24, 36, withLogo ? 540 : 744) + (withLogo ? AF.logo(D, 588, 26, 180, 26, 'flex-end') : '') + AF.rule(24, 72, 744);
    const PL = HA - AF.capH(LN) - 6;
    h += AF.photo(D, T.lead.id, 24, y0, LW, PL) + AF.cap(T.lead, p+'.lead', 24, y0 + PL + 6, LW, {lines: LN, titleSize: 15});
    const hc = (HA - G)/2, lines = Math.floor((hc - 30)/12);
    T.side.forEach((c, i) => { const y = y0 + i*(hc+G);
      h += AF.photo(D, c.id, RX, y, PW, hc) + AF.cap(c, `${p}.side${i}`, TX, y, TW, {lines, min: lines-1, max: lines}); });
    const yB = y0 + HA + G, pwB = (744 - 2*G)/3, phB = 588 - yB - AF.capH(NB) - 6;
    T.row.forEach((c, i) => { const x = 24 + i*(pwB+G);
      h += AF.photo(D, c.id, x, yB, pwB, phB) + AF.cap(c, `${p}.row${i}`, x, yB + phB + 6, pwB, {lines: NB, titleSize: 12.5}); });
    return h;
  }

  // ================= BACK =================
  function back(){
    const B = C.back || {}, nl = hasPlan ? D.plan.levels.length : 1;
    let h = AF.kick(B.kicker, 'back.kicker', 24, 26, 700) + AF.title(B.title, 'back.title', 24, 36) + AF.rule(24, 72, 744);
    const planW = 290, ph1 = 384, G = 10; let chkLeft = false;   // round 3: the plan grows into the room the tall narrow card used
    if(hasPlan){
      h += `<div class="planbox${window.PlanInk && PlanInk.panel(D.plan, true) ? ' light' : ''}" style="left:24pt;top:84pt;width:${planW}pt;height:${ph1}pt"></div>`;
      // round 3 (book p8, reviewer 11/12): the frame hugs the plans (it had empty bands above and below them) and the reading note takes
      // the height that frees, in full lines at a readable size
      const probe = AF.plan(D, {x:24+8, y:84+8, w:planW-16, h:ph1-16}), fh = Math.min(ph1, Math.ceil((probe.used || {h: ph1-16}).h) + 22);
      const pl = AF.plan(D, {x:24+8, y:84+(fh-(probe.used||{h:fh-22}).h)/2, w:planW-16, h:(probe.used||{h:fh-22}).h});
      h = h.replace(/<div class="planbox[^>]*><\/div>$/, `<div class="planbox${window.PlanInk && PlanInk.panel(D.plan, true) ? ' light' : ''}" style="left:24pt;top:84pt;width:${planW}pt;height:${fh}pt"></div>`);
      issues.push(...pl.issues); h += pl.html;
      const nTop = 84 + fh + 6, P2 = B.photo2;
      h += `<div class="abs body" style="left:24pt;top:${nTop}pt;width:${planW}pt;height:24pt;font-size:8.5pt;line-height:12pt;color:var(--muted)" data-slot="back.plannote" data-lines="2" data-cap="1">${esc(AF.txt(B.planNote))}</div>`;
      // coordinator 11/12 (book p8): the Entry strip under the plans is gone (a 3.9:1 strip and a second use of the entry photo,
      // never in the Before); the "What comes with it" list takes that height under the plan note, its rows filling to the
      // column's foot, and Nearby gets the right column's freed height
      if(P2){   // only where the strip was: a plan that already fills its column (one level) keeps the list on the right
      const Bc = B.claim || {}, its = (Bc.items||[]).slice(0,6), cTop = nTop + 24 + 12, rh = (528 - (cTop + 16)) / Math.max(its.length, 1);
      h += AF.kick(Bc.head, 'back.claim.head', 24, cTop, planW);
      h += `<div class="abs chk chk-left" style="left:24pt;top:${cTop+16}pt;width:${planW}pt">${its.map((t,i)=>`<div data-slot="back.claim.item${i}" data-lines="1" style="height:${rh.toFixed(1)}pt;line-height:${rh.toFixed(1)}pt;font-size:11pt;border-top:.6pt solid rgba(200,164,106,.4)">${esc(t)}</div>`).join('')}</div>`;
      chkLeft = true; }
    } else {
      const R = B.rooms || [], n = R.length, rh = Math.min(30, Math.floor((528 - 84 - 92)/Math.max(n,1)));
      h += `<div class="roombox" style="left:24pt;top:84pt;width:${planW}pt;height:${528 - 84}pt;padding:12pt 14pt 0">
        <div class="kick" style="height:10pt" data-slot="back.roomhead" data-lines="1">${esc(B.roomHead || 'Room by room')}</div>
        <div class="body" style="margin-top:7pt;height:${4*12}pt;font-size:9pt;line-height:12pt" data-slot="back.roomintro" data-lines="4" data-cap="1">${esc(AF.txt(B.roomIntro))}</div>
        <div class="rows" style="margin-top:9pt">${R.map((r,i)=>`<div style="height:${rh}pt"><span class="rn" data-slot="back.room${i}.n" data-lines="1">${esc(r[0])}</span><span class="rs" data-slot="back.room${i}.s" data-lines="1">${esc(r[1])}</span></div>`).join('')}</div></div>`;
    }
    // owner 10/29 (AF-FO): the photo column's right edge runs straight down into the card's divider (left of the brokerage)
    const px = 24 + planW + G, pw = 240, rx = px + pw + G, rw = 768 - rx;
    // round 3 (owner 11/10/2026: "narrower" = SHORTER TOP TO BOTTOM): the card runs the full width at the short size under
    // all three columns; the columns run down to just over it
    const COL = 528 - 84, PH = Math.floor((COL - G)/2) - AF.capH(3) - 6;
    [B.photo0, B.photo1].forEach((c, i) => { const y = 84 + i*(PH + AF.capH(3) + 6 + G);
      h += AF.photo(D, c.id, px, y, pw, PH) + AF.cap(c, `back.photo${i}`, px, y + PH + 6, pw, {lines: 3, titleSize: 12.5}); });
    const Bd = B.claim || {};
    h += `<div class="abs claim" style="left:${rx}pt;top:82pt;width:${rw}pt;height:34pt" data-slot="back.claim.big" data-lines="1">${esc(Bd.big)}</div>`;
    const cl = Bd.lines || 7;
    h += `<div class="abs body" style="left:${rx}pt;top:122pt;width:${rw}pt;height:${cl*13}pt" data-slot="back.claim.text" data-lines="${cl}" data-cap="1">${esc(AF.txt(Bd.text))}</div>`;
    const ly = 122 + cl*13 + 12;
    if(!chkLeft){
      h += AF.kick(Bd.head, 'back.claim.head', rx, ly, rw);
      h += `<div class="abs chk" style="left:${rx}pt;top:${ly+16}pt;width:${rw}pt">${(Bd.items||[]).slice(0,6).map((t,i)=>`<div data-slot="back.claim.item${i}" data-lines="1">${esc(t)}</div>`).join('')}</div>`; }
    const ny = chkLeft ? ly : ly + 16 + 6*14 + 10;
    h += AF.kick(B.nearHead || 'Nearby', 'back.nearhead', rx, ny, rw);
    // owner 10/29 voice review: four Nearby places, the rows sized to fill down to the foot of the photo column
    const NR = Math.min(4, (B.nearby||[]).length) || 1, nrh = (84 + COL - (ny + 14))/NR;
    h += `<div class="abs near" style="left:${rx}pt;top:${ny+14}pt;width:${rw}pt">${(B.nearby||[]).slice(0,4).map((x,i)=>`<div style="height:${nrh}pt"><span class="d" data-slot="back.near${i}.d" data-lines="1">${esc(x.d)}<small>${esc(x.u || 'mi')}</small></span><span class="p" data-slot="back.near${i}.p" data-lines="1">${esc(x.p)}</span></div>`).join('')}</div>`;
    h += AF.rule(24, 532, 744);
    // owner 11/12 (book p8): no empty band right of the email; bigger type, a wider gap and a wider brokerage panel fill the card
    h += ContactCard.html([24, 538, 744, 64], Object.assign({}, A, {headshot: hs}), b, {layout:'panel', size:'short', brokerage: true, fine: '', fieldAccent: true, s:{desigInline:true, rowGap:84, name:20, phone:16, label:9.5, line:11, panelW:236, logo:{wide:[180, 30], square:[30, 30], tall:[32, 32]}}});
    if(B.footnote) h += `<div class="abs fine" style="left:24pt;top:606pt;width:744pt;height:7pt;font-size:6pt;line-height:7pt;white-space:nowrap;overflow:hidden" data-slot="back.footnote" data-fine="1" data-lines="1">${esc(B.footnote)}</div>`;
    return h;
  }

  const panels = {front: cover(), back: back(), top: inside(C.top||{}, 'top', true), bottom: inside(C.bottom||{}, 'bottom', false)};
  const panel = (cls, h) => `<div class="panel ${cls||''}">${h}</div>`;
  let html = '';
  if(mode === 'print'){
    html += `<div class="page" data-page="outside"><div class="half top">${panel('flip', panels.back)}</div><div class="half bottom">${panel('', panels.front)}</div></div>`;
    html += `<div class="page" data-page="inside"><div class="half top">${panel('', panels.top)}</div><div class="half bottom">${panel('', panels.bottom)}</div></div>`;
  } else {
    for(const id of ['front','top','bottom','back']) html += `<div class="page" data-page="${id}">${panel('', panels[id])}</div>`;
  }
  document.getElementById('pages').innerHTML = html;
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  AF.fitLogos();
  // the facts table's top rule sits on the cap height of the paragraph's first line
  document.querySelectorAll('.specs[data-align]').forEach(el => {
    const p = document.querySelector(`[data-slot="${el.dataset.align}"]`); if(!p || !p.firstChild) return;
    const cs = getComputedStyle(p), ctx = document.createElement('canvas').getContext('2d'); ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const m = ctx.measureText('H'), r = document.createRange(); r.setStart(p.firstChild, 0); r.setEnd(p.firstChild, 1);
    const capTop = r.getClientRects()[0].top + m.fontBoundingBoxAscent - m.actualBoundingBoxAscent;
    el.style.top = (parseFloat(el.style.top) + (capTop - el.getBoundingClientRect().top)*72/96) + 'pt';
  });
  ContactCard.fit(document);
  document.body.dataset.version = `${Math.max(1, Math.min(4, Math.round(+L.stories || 1)))}-story-${hasPlan ? 'plan' : 'noplan'}`;
  if(window.PlanInk) PlanInk.install();
  window.brochureCheck = () => AF.check(D, issues);
})();
</script>
</body>
</html>
