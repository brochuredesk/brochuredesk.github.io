<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · Across the Fold two-sided flyer</title>
<link rel="stylesheet" href="across-the-fold.css">
<link rel="stylesheet" href="pieces.css">
<script src="across-the-fold.js"></script>
<script src="../engine/baths.js"></script>
<script src="../engine/setpieces.js"></script>
<!--
  Across the Fold · two-sided 8.5 x 11 listing flyer (trim 612 x 792 pt; print: 0.25 in white margin around the navy field).
  data.piece.side = "front" | "back". Same family as the fold-over and the Open House flyer: midnight navy field, gold tracked
  small caps, white Source Serif headings, the whole-house hero run to the field's edge with the gold-boxed tag on it, the
  fold's gold rule with a diamond on it, the fold-over's two-by-two facts table, serif caption names over a gold detail line,
  diamond bullets, the white plan board, the navy box with the gold top rule (the room-by-room box and the closing box) and the
  Nearby list with its large gold serif numbers.
  Rules (product.md, two-sided flyer rules 10/28 and the owner's Round 4 review 11/1/2026): one brokerage logo per side
  (upper right of the address row / the header); the shared agent card at the bottom with the brokerage's office lines on the
  card's name and phone lines; the whole house shows; no price, no QR code, no "virtually staged"; room sizes in feet only
  (18' x 12'; a listing plan image is placed as given); the half bath's 1/2 at full size (BD.bathNum); text fills its box and
  runs edge to edge with the photos and rules around it; the facts table shows a fifth line (lot size) when the listing has one,
  otherwise its four lines grow to fill the space.

  FRONT   Whole house across the field (gold tag on it), the place and address with the logo, the fold rule, the facts table
          beside the write-up (one height), a row of three captioned rooms and the card. A tall house that needs more height
          than that leaves narrows the photo and sets the facts in a column beside it.
  BACK    With a plan (data.plan): the agent's own plan at one scale (never redrawn) on a white board, a reading note and two
          captioned photos beside it (a third under a short board), then the closing navy box: the big phrase with its
          write-up, the diamond list, and Nearby. Without a plan: the room-by-room box (the rooms floor by floor) and two
          captioned photos, then the same closing box.

  Copy: data.companion.flyer = {
    front: {photo, tag, about: [sentence | [short, long], ...], caps: [{id, name, tag, text: [..]} x3], fine},
    back:  {kicker, title, fine, bigHead, big, para: [..], checks: {head, items: [..]}, around: {head, rows: [{d, u, p}]},
            photos: [{id, name, tag, text: [..]} x2],
            plan: {head, note: [..], photoL: {id, name, tag, text}},
            noplan: {kicker, title, fine, head, intro: [..], floors: [{label, rooms: [[name, size]]}]}}}
  Sentences are beats: the first is kept and the others are optional, so the fit picks the combination that fills the box.
-->
<style>
  .fl-addr{font:400 36pt/40pt var(--font-display);letter-spacing:-.3pt;color:var(--ink);white-space:nowrap;overflow:hidden}
  .fl-p{font-size:10.5pt;line-height:14pt;color:var(--text);overflow:hidden}
  .fl-p.s{font-size:9.5pt;line-height:13pt}
  .fl-cap .nm{font:400 12.5pt/16pt var(--font-display);color:var(--ink);white-space:nowrap;overflow:hidden;height:16pt}
  .fl-cap .sb{font:700 8.5pt/11pt var(--font-body);letter-spacing:.5pt;color:var(--gold);white-space:nowrap;overflow:hidden;height:11pt}
  .fl-cap .tx{font-size:9pt;line-height:12pt;color:var(--text);overflow:hidden;margin-top:3pt}
  .fl-spec{position:absolute;display:grid;grid-template-columns:1fr 1fr;column-gap:14pt;grid-auto-rows:1fr;border-bottom:.7pt solid var(--line)}
  .fl-spec div{border-top:.7pt solid var(--line);display:flex;justify-content:space-between;align-items:center;min-height:0}
  .fl-spec .l{font:700 8pt/12pt var(--font-body);letter-spacing:1.3pt;text-transform:uppercase;color:var(--gold);white-space:nowrap}
  .fl-spec .v{font:400 16pt/20pt var(--font-display);color:var(--ink);white-space:nowrap}
  .fl-spec.col{grid-template-columns:1fr}
  .fl-spec.col .v{font-size:22pt;line-height:26pt}
  .fl-spec.col .l{font-size:8.5pt}
  .fl-rooms{position:absolute;display:flex;flex-direction:column;background:var(--navy2);border-top:1.4pt solid var(--gold);padding:12pt 14pt 10pt}
  .fl-rooms .rh{flex:none;margin-bottom:7pt}
  .fl-rooms .fh{font:700 8.5pt/12pt var(--font-body);letter-spacing:1.6pt;text-transform:uppercase;color:var(--gold);white-space:nowrap;overflow:hidden;flex:none;height:19pt;display:flex;align-items:center;gap:8pt}
  .fl-rooms .fh i{flex:1;height:.6pt;background:rgba(200,164,106,.4)}
  .fl-rooms .r{display:flex;justify-content:space-between;align-items:center;border-top:.6pt solid rgba(200,164,106,.35);flex:1;min-height:0}
  .fl-rooms .fh + .r{border-top:0}
  .fl-rooms .n{font:400 11.5pt/15pt var(--font-display);color:var(--ink);white-space:nowrap;overflow:hidden}
  .fl-rooms .sz{font:700 9pt/12pt var(--font-body);color:var(--gold);white-space:nowrap}
  .fl-rooms .gap{flex:none;height:8pt}
  .fl-close{position:absolute;background:var(--navy2);border-top:1.4pt solid var(--gold)}
  .fl-close .vr{position:absolute;top:12pt;bottom:12pt;width:.6pt;background:rgba(200,164,106,.35)}
  .fl-big{font:400 22pt/26pt var(--font-display);letter-spacing:-.2pt;color:var(--ink);white-space:nowrap;overflow:hidden}
  .fl-chk{position:absolute}
  .fl-chk div{font:600 9.5pt/14pt var(--font-body);color:var(--ink);white-space:nowrap;overflow:hidden;padding-left:11pt;position:relative}
  .fl-chk div:before{content:"";position:absolute;left:0;top:5pt;width:4pt;height:4pt;background:var(--gold);transform:rotate(45deg)}
  .fl-near .nr{position:absolute;left:0;right:0;border-top:.6pt solid rgba(200,164,106,.4);padding-top:3pt}
  .fl-near .nr .d{font:400 17pt/20pt var(--font-display);color:var(--gold);white-space:nowrap;overflow:hidden}
  .fl-near .nr .d small{font:700 7.5pt/10pt var(--font-body);letter-spacing:1pt;text-transform:uppercase;margin-left:3pt}
  .fl-near .nr .p{font:600 9pt/12pt var(--font-body);color:var(--ink);white-space:nowrap;overflow:hidden}
  .fl-office .ol{position:absolute;left:0;white-space:nowrap;color:var(--ink)}
  .fl-fold{position:absolute;height:1.4pt;background:var(--gold)}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SP.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="color:#fff;padding:20pt">No data injected.</p>'; return; }
  const esc = SP.esc, L = D.listing, FL = (D.companion || {}).flyer || {}, P = D.photos || {};
  const issues = await SP.ready(D);
  document.body.dataset.mode = D.mode || 'email';
  const b = Object.assign({}, D.brand || {}); b.logo = b.logoOnDark || b.logo; D.brand = b;     // the gold-on-navy mark
  const piece = D.piece || {}, side = piece.side === 'back' ? 'back' : 'front';
  const hasPlan = !!(D.plan && D.plan.levels && D.plan.levels.length);
  const I = (D.mode === 'print' && piece.print === 'margin') ? (piece.margin || 18) : 0;     // art runs to the field's edge
  const W = 612, H = 792, X0 = 36, CW = 540, XR = X0 + CW;
  const BODYST = 'font-size:10.5pt;line-height:14pt', SBODYST = 'font-size:9.5pt;line-height:13pt', CAPST = 'font-size:9pt;line-height:12pt';

  // ---------- copy ----------
  const feetOnly = t => String(t == null ? '' : t).replace(/(\d+)(?:\.\d+)?(?:'\s?\d+(?:\.\d+)?"?)?'?\s*x\s*(\d+)(?:\.\d+)?(?:'\s?\d+(?:\.\d+)?"?)?'?/g, "$1' x $2'");
  const split = s => (feetOnly(s).match(/[^.!?]+[.!?]+["”’)]*|[^.!?]+$/g) || []).map(x => x.trim()).filter(Boolean);
  const beats = x => x == null ? [] : Array.isArray(x) ? x.map(v => Array.isArray(v) ? v.map(feetOnly) : feetOnly(v)) : split(x);

  // ---------- paragraphs that fill their box: the fit picks the sentences that set in exactly n lines, last line 75% or more ----------
  const pending = [], cache = new Map();
  const fillOf = el => { const ls = SP.lineBoxes(el); if(!ls.length) return [0, 0]; const last = ls[ls.length - 1], w = el.getBoundingClientRect().width; return [ls.length, (last.r - last.l)/w]; };
  const enumerate = (bs, w, style) => {
    const key = `${w}|${style}|${JSON.stringify(bs)}`; if(cache.has(key)) return cache.get(key);
    const m = document.createElement('div');
    m.style.cssText = `position:absolute;left:-9999pt;top:0;visibility:hidden;width:${w}pt;height:auto;${style}`; document.body.appendChild(m);
    const O = [].concat(bs).map((v, i) => { const a = [].concat(v); return i === 0 ? a : [null, ...a]; });
    const idx = O.map(() => 0), res = new Map(), first = O.map(o => o[0]).join(' ');
    for(;;){
      const t = idx.map((k, i) => O[i][k]).filter(Boolean).join(' ');
      m.textContent = t; const [k, fill] = fillOf(m); let r = res.get(k); if(!r){ r = {best: null, near: null}; res.set(k, r); }
      if(fill >= .735 && fill <= 1){ const sc = fill - .3*Math.abs(fill - .9) + .0005*t.length; if(!r.best || sc > r.best.sc) r.best = {t, sc}; }
      if(!r.near || fill > r.near.fill) r.near = {t, fill};
      let j = O.length - 1; while(j >= 0 && ++idx[j] === O[j].length){ idx[j] = 0; j--; } if(j < 0) break;
    }
    m.remove(); res.first = first; cache.set(key, res); return res;
  };
  const pickN = (bs, w, style, ns) => { const r = enumerate(bs, w, style); return ns.find(n => r.has(n) && r.get(n).best) || null; };
  const commonN = (lists, w, style, ns) => ns.find(n => lists.every(l => pickN(l, w, style, [n]))) || null;
  const fillAll = () => { for(const p of pending){
    const el = document.querySelector(`[data-slot="${p.slot}"]`); if(!el) continue;
    const r = enumerate(p.beats, p.w, p.style).get(+el.dataset.lines);
    el.textContent = r && r.best ? r.best.t : r && r.near ? r.near.t : enumerate(p.beats, p.w, p.style).first;
    if(!(r && r.best)){ el.dataset.nofit = '1'; const m = enumerate(p.beats, p.w, p.style), o = {}; for(const [k, v] of m) if(typeof k === 'number') o[k] = [v.best ? v.best.t.length : null, Math.round(v.near.fill*100)];
      el.dataset.diag = `w=${p.w.toFixed(0)} want ${el.dataset.lines} have ${JSON.stringify(o)} chars ${p.beats.map(b => [].concat(b)[0].length).join('+')}`; } } pending.length = 0; };
  const para = (slot, bs, x, y, w, n, o) => { o = o || {}; const lh = o.lh || 14, st = lh === 13 ? SBODYST : BODYST; pending.push({slot, beats: bs, w, style: st});
    return `<div class="abs fl-p${lh === 13 ? ' s' : ''}" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${n*lh}pt" data-slot="${slot}" data-para="1" data-nobal="1" data-min="${n}" data-lines="${n}"></div>`; };
  const kick = (t, slot, x, y, w) => `<div class="abs kick" style="left:${x}pt;top:${y}pt;width:${w}pt;height:10pt" data-slot="${slot}" data-lines="1">${esc(t)}</div>`;
  const logo = (x, y, w, h) => `<div class="logo" data-maxh="${h}" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${h}pt;justify-content:flex-end">${b.logo ? `<img src="${esc(b.logo)}" alt="">` : `<span style="font:700 ${h*0.6}pt/1 var(--font-display);white-space:nowrap" data-slot="broker.name" data-lines="1">${esc(b.brokerage || '')}</span>`}</div>`;
  const rule = (x, y, w) => `<div class="rule" style="left:${x}pt;top:${y}pt;width:${w}pt"></div>`;
  // the fold's rule: gold, with a diamond on it
  const foldRule = (x, y, w) => `<div class="fl-fold" style="left:${x}pt;top:${y}pt;width:${w}pt"></div><i class="dia abs" style="left:${x + w/2 - 2}pt;top:${y - 1.3}pt;outline:3pt solid var(--paper)"></i>`;
  const ph = (id, x, y, w, h) => SP.photo(D, id, x, y, w, h, id);
  // a caption under a photo: serif name, gold detail line, then n lines (captions in a row share n)
  const CAPHEAD = 30;
  const cap = (c, slot, x, y, w, n, row, bs) => { pending.push({slot: `${slot}.text`, beats: bs || beats(c.text), w, style: CAPST});
    return `<div class="abs fl-cap" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${CAPHEAD + n*12}pt"><div class="nm" data-slot="${slot}.name" data-lines="1">${esc(c.name)}</div><div class="sb" data-slot="${slot}.sub" data-lines="1">${esc(feetOnly(c.tag))}</div>` +
      `<div class="tx" data-slot="${slot}.text" data-lines="${n}" data-cap="1" data-row="${row}" style="height:${n*12}pt"></div></div>`; };
  const capRow = (items, slot, x, y, w, n, ph_h, gap) => { const cw = (w - gap*(items.length - 1))/items.length; let h = '';
    items.forEach((c, i) => { const cx = x + i*(cw + gap); h += ph(c.id, cx, y, cw, ph_h) + cap(c, `${slot}${i}`, cx, y + ph_h + 6, cw, n, slot); }); return h; };

  // ---------- facts: [label, value (html)] ----------
  const num = v => Number(v).toLocaleString('en-US');
  const factCells = () => {
    const c = [], bn = BD.bathNum(L);
    if(L.beds) c.push([L.beds == 1 ? 'Bedroom' : 'Bedrooms', String(L.beds)]);
    if(L.baths || L.halfBaths) c.push([bn.label, bn.num]);
    if(bn.half) c.push(['Half baths', bn.half.replace(/\D.*/, '')]);
    if(L.sqft) c.push(['Square feet', num(L.sqft)]);
    const yr = L.yearBuilt || L.year, lot = String(SP.lotText(L) || '').match(/^([\d,.]+)\s*(.*)$/);
    const lotC = lot ? ['Lot size', esc(lot[1] + ' ' + (lot[2] || 'Sq Ft Lot').replace(/\s*Lot$/i, '').toLowerCase())] : null;
    if(yr && c.length < (lotC ? 4 : 5)) c.push(['Built in', String(yr)]);
    else if(L.stories && !yr && c.length < (lotC ? 4 : 5)) c.push([+L.stories === 1 ? 'Story' : 'Stories', String(L.stories)]);
    if(lotC && c.length < 5) c.push(lotC);
    return c.slice(0, 5);
  };
  const specHTML = (cells, x, y, w, h, cls, slot) => {
    const odd = cells.length % 2 && !cls;
    return `<div class="fl-spec${cls ? ' ' + cls : ''}" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${h}pt">${cells.map((c, i) => `<div${odd && i === cells.length - 1 ? ' style="grid-column:1/-1"' : ''}><span class="l" data-slot="${slot}${i}.l" data-lines="1">${esc(c[0])}</span><span class="v" data-slot="${slot}${i}.v" data-lines="1">${c[1]}</span></div>`).join('')}</div>`;
  };

  // ---------- the footer: rule, the shared agent card, the brokerage's office lines on the card's name and phone lines ----------
  const FY = 664, CY = 670, CH = 84, OW = 132;
  const footer = fine => {
    let h = foldRule(X0, FY, CW);
    h += SP.card(D, [X0, CY, CW - OW, CH], {layout: 'panel', size: 'mid', brokerage: false, fieldAccent: true, s: {inlineLabel: true, desigInline: true, pad: [12, 10, 10], rowGap: 14, hsW: 64}});
    h += `<div class="abs" style="left:${XR - OW}pt;top:${CY + 6}pt;width:.7pt;height:${CH - 12}pt;background:var(--line)"></div>`;
    const offL = [].concat(b.address || []).flatMap(a => String(a).split('\n')).map(x => x.trim()).filter(Boolean).slice(0, 2);
    h += `<div id="offblk" class="abs fl-office" style="left:${XR - OW + 12}pt;top:${CY}pt;width:${OW - 12}pt;height:${CH}pt">`
      + (b.phone ? `<div class="ol" data-at="name" data-slot="broker.phone" data-lines="1" style="font:400 12pt/15pt var(--font-body)">${esc(b.officeLabel || 'Office')} <b style="font-weight:700">${esc(b.phone)}</b></div>` : '')
      + offL.map(t => `<div class="ol" data-at="desig" data-slot="broker.address" data-lines="1" style="font:400 9pt/11pt var(--font-body)">${esc(t)}</div>`).join('')
      + (b.web ? `<div class="ol" data-at="phone" data-slot="broker.web" data-lines="1" style="font:400 12pt/15pt var(--font-body)">${esc(b.web)}</div>` : '') + `</div>`;
    h += `<div class="abs" style="left:${X0}pt;top:${CY + CH + 7}pt;width:${CW}pt;height:8pt;font-size:6pt;line-height:8pt;color:var(--muted);white-space:nowrap;overflow:hidden" data-slot="fineprint" data-lines="1" data-fine="1">${esc(fine || 'Information deemed reliable but not guaranteed.')}</div>`;
    return h;
  };

  window.__fit = {enumerate, pickN, beats, commonN};
  let h = '', after = () => {};

  // ======================================= FRONT =======================================
  if(side === 'front'){
    const K = FL.front || {}, cells = factCells();
    const caps = (K.caps || []).slice(0, 3), aboutB = beats(K.about);
    const capW = (CW - 28)/3;
    const nCap = commonN(caps.map(c => beats(c.text)), capW, CAPST, [3, 4, 5]) || 3;
    const capH = CAPHEAD + nCap*12, capTop = 654 - capH;
    const hero = P[K.photo] ? K.photo : Object.keys(P)[0], hp = P[hero] || {}, ap = (hp.w && hp.h) ? hp.w/hp.h : 1.5, bx = hp.box;
    const need = w => bx ? Math.ceil(w*((bx[3] - bx[1]) + 0.03)/ap) : Math.ceil(w/ap*0.77);   // a house box keeps the whole box in frame; no box, at least 75% of the photo's height shows
    const fieldW = W - 2*I, HEAD = 80;      // the place line, the address and the fold rule take 80 pt under the hero
    const PWR = 270;                         // the write-up's width beside the facts table
    let pick = null;
    // A: the house across the field; under it the facts table and the write-up side by side. B (a tall house): the house narrower, the facts a column beside it.
    for(const PH of [112, 104, 96, 90]){ const rowTop = capTop - 6 - PH;
      for(const n of [6, 7, 5, 8, 4]){ if(!pickN(aboutB, PWR, BODYST, [n])) continue;
        const blockH = n*14, heroH = rowTop - 14 - blockH - HEAD - 14 - I;
        if(heroH >= Math.max(256, need(fieldW))){ pick = {mode: 'A', PH, rowTop, n, blockH, heroH}; break; } }
      if(pick) break; }
    const HWB = 352;
    if(!pick){ for(const PH of [104, 96, 90]){ const rowTop = capTop - 6 - PH;
      for(const n of [3, 4, 2]){ if(!pickN(aboutB, CW, BODYST, [n])) continue;
        const blockH = n*14, heroH = rowTop - 14 - blockH - HEAD + 2 - 14 - I;
        if(heroH >= 250){ pick = {mode: 'B', PH, rowTop, n, blockH, heroH}; break; } }
      if(pick) break; } }
    if(!pick){ const PH = 90, rowTop = capTop - 6 - PH, n = 5; pick = {mode: 'A', PH, rowTop, n, blockH: n*14, heroH: rowTop - 14 - n*14 - HEAD - 14 - I}; }
    const y0 = I + pick.heroH + 14, tagTxt = K.tag;
    const header = () => kick(SP.placeZip(L).toUpperCase(), 'front.place', X0, y0, CW - 176)
      + logo(XR - 156, y0 - 6, 156, 30)
      + `<div class="abs fl-addr" style="left:${X0 - 1}pt;top:${y0 + 22}pt;width:${CW + 2}pt;height:40pt" data-slot="address" data-lines="1" data-fit="22">${esc(L.address)}</div>`
      + foldRule(X0, y0 + 70, CW);
    if(pick.mode === 'A'){
      h += ph(hero, I, I, fieldW, pick.heroH);
      if(tagTxt) h += `<div class="abs" style="left:${X0}pt;top:${I + pick.heroH - 29}pt"><span class="ctag" data-slot="front.tag" data-lines="1">${esc(tagTxt)}</span></div>`;
      h += header();
      const by = y0 + HEAD;
      h += specHTML(cells, X0, by + 2, CW - PWR - 22, pick.blockH - 2, '', 'front.spec');
      h += para('front.about', aboutB, X0 + CW - PWR, by, PWR, pick.n);
    } else {
      const GX = X0 + HWB + 18, GW = XR - GX;
      h += ph(hero, I, I, X0 + HWB - I, pick.heroH);
      if(tagTxt) h += `<div class="abs" style="left:${X0}pt;top:${I + pick.heroH - 29}pt"><span class="ctag" data-slot="front.tag" data-lines="1">${esc(tagTxt)}</span></div>`;
      h += specHTML(cells, GX, I + 8, GW, pick.heroH - 8, 'col', 'front.grid');
      h += header();
      h += para('front.about', aboutB, X0, y0 + HEAD, CW, pick.n);
    }
    h += capRow(caps, 'front.cap', X0, pick.rowTop, CW, nCap, pick.PH, 14);
    h += footer(K.fine);
  }

  // ======================================= BACK =======================================
  else {
    const B = FL.back || {}, NP = B.noplan || {}, PL = B.plan || {}, A = B.around || {}, CK = B.checks || {};
    const kicker = (!hasPlan && NP.kicker) || B.kicker || '', title = (!hasPlan && NP.title) || B.title || '';
    h += kick(kicker, 'back.kicker', X0, 34, 370);
    h += `<div class="abs title one" style="left:${X0}pt;top:45pt;width:372pt;height:32pt" data-slot="back.title" data-lines="1" data-fit="19">${esc(title)}</div>`;
    h += logo(XR - 156, 36, 156, 38);
    h += foldRule(X0, 82, CW);
    const TOP = 96, BOT = 654;
    // the closing navy box: the big phrase and its write-up, the diamond list, Nearby
    const Hc = 150, Cy = BOT - Hc, c1 = 206, c2 = 148, gp = 18, cpad = 16, c3 = CW - 2*cpad - c1 - c2 - 2*gp;
    const paraB = beats(B.para), nP = [6, 5, 7, 4].find(n => pickN(paraB, c1, SBODYST, [n])) || 5;
    const Hu = Cy - 14 - TOP;                              // the upper block: left column and right column
    // ----- left column -----
    let PW, boardH, leftHtml = '';
    if(hasPlan){
      const probe = AF.plan(D, {x: X0 + 10, y: TOP + 10, w: 320, h: Hu - 20});
      const u = probe.used || {w: 200, h: Hu - 20};
      PW = Math.max(176, Math.min(340, Math.ceil(u.w) + 26));
      const bh = Math.ceil(u.h) + 22;
      boardH = (Hu - bh >= 150) ? bh : Hu;                 // a short board leaves room for a photo under it; else it runs the full height
      const pr = AF.plan(D, {x: X0 + 10, y: TOP + 10, w: PW - 20, h: boardH - 20});
      issues.push(...pr.issues);
      leftHtml += `<div class="planbox" style="left:${X0}pt;top:${TOP}pt;width:${PW}pt;height:${boardH}pt"></div>` + pr.html;
    } else {
      PW = 250;
    }
    const RX = X0 + PW + 14, RW = XR - RX;
    // ----- right column -----
    // the reading note (plan only) and the captioned photos stack in one column; the lines each box takes are picked together so every
    // photo stays a real frame (never a thin strip): two photos with the note, two without it, or one photo with the note
    const allPics = (B.photos || []).slice(0, 2), noteSrc = hasPlan ? beats(PL.note) : [], kH = 14, GP = 12;
    const lineOpts = (bs, st) => [3, 4, 5, 6].filter(n => pickN(bs, RW, st, [n]));
    const noteOpts = hasPlan ? [3, 4, 5, 2, 6].filter(n => pickN(noteSrc, RW, SBODYST, [n])).concat([0]) : [0];
    let best = null;
    for(const k of [2, 1]){ if(allPics.length < k) continue;
      const capOpt = allPics.slice(0, k).map(c => lineOpts(beats(c.text), CAPST));
      const combos = capOpt.reduce((acc, o) => acc.flatMap(a => o.map(n => a.concat(n))), [[]]);
      for(const nN of noteOpts) for(const cn of combos){
        const avail = Hu - (nN ? kH + nN*13 + GP : 0) - cn.reduce((a, n) => a + CAPHEAD + n*12 + 6, 0) - (k - 1)*GP, phh = avail/k, ratio = RW/phh;
        if(phh < 70 || ratio > 2.6 || ratio < 0.9) continue;
        const sc = Math.abs(ratio - 1.9) + (k === 1 ? 2.5 : 0) + (nN === 0 && hasPlan ? 1.2 : 0) + Math.abs(cn[0] - (cn[1] == null ? cn[0] : cn[1]))*.1;
        if(!best || sc < best.sc) best = {sc, k, nN, cn, phh, mode: 'stack'}; } }
    // two photos side by side under the note (a tall, narrow plan leaves a column too short for two stacked frames)
    if(allPics.length >= 2){ const cw = (RW - 14)/2, so = n => [4, 5, 6, 7, 8].filter(m => pickN(beats(allPics[n].text), cw, CAPST, [m]));
      const o0 = so(0), o1 = so(1);
      for(const nN of noteOpts) for(const n0 of o0) for(const n1 of o1){ if(n0 !== n1) continue;
        const avail = Hu - (nN ? kH + nN*13 + GP : 0) - (CAPHEAD + n0*12 + 6), ratio = cw/avail;
        if(avail < 90 || ratio > 1.7 || ratio < 0.55) continue;
        const sc = Math.abs(ratio - 1.15)*.8 + 0.4 + (nN === 0 && hasPlan ? 1.2 : 0);
        if(!best || sc < best.sc) best = {sc, k: 2, nN, cn: [n0, n1], phh: avail, mode: 'side', cw}; } }
    if(!best){ const cn = allPics.map(c => lineOpts(beats(c.text), CAPST)[0] || 3), nN = hasPlan ? 3 : 0;
      best = {k: allPics.length, nN, cn, mode: 'stack', phh: (Hu - (nN ? kH + nN*13 + GP : 0) - cn.reduce((a, n) => a + CAPHEAD + n*12 + 6, 0) - (allPics.length - 1)*GP)/Math.max(1, allPics.length)}; }
    let ry = TOP;
    if(hasPlan && best.nN){
      h += kick(PL.head || 'Reading the plan', 'back.planhead', RX, ry, RW);
      h += para('back.plannote', noteSrc, RX, ry + kH, RW, best.nN, {lh: 13});
      ry += kH + best.nN*13 + GP;
    }
    if(best.mode === 'side'){ const phR = Math.floor(best.phh);
      allPics.slice(0, 2).forEach((c, i) => { const x = RX + i*(best.cw + 14);
        h += ph(c.id, x, ry, best.cw, phR) + cap(c, `back.photo${i}`, x, ry + phR + 6, best.cw, best.cn[i], 'backR'); });
    } else allPics.slice(0, best.k).forEach((c, i) => { const phR = Math.floor(best.phh), n = best.cn[i];
      h += ph(c.id, RX, ry, RW, phR) + cap(c, `back.photo${i}`, RX, ry + phR + 6, RW, n, `backR${i}`); ry += phR + 6 + CAPHEAD + n*12 + GP; });
    // ----- left column: with a plan, a photo under a short board; without, the room-by-room box -----
    if(hasPlan){
      const L1 = PL.photoL, ly = TOP + boardH + 12, lbH = TOP + Hu - ly;
      if(L1 && lbH >= 140){
        const nL = [3, 4, 5, 2].find(n => pickN(beats(L1.text), PW, CAPST, [n])) || 3, cH = CAPHEAD + nL*12, pH = lbH - cH - 6;
        h += leftHtml + ph(L1.id, X0, ly, PW, pH) + cap(L1, 'back.photoL', X0, ly + pH + 6, PW, nL, 'backL');
      } else h += leftHtml;
    } else {
      const fl = NP.floors || [], nRooms = fl.reduce((a, f) => a + (f.rooms || []).length, 0), introB = beats(NP.intro);
      const inW = PW - 28, nI = [4, 3, 5].find(n => pickN(introB, inW, SBODYST, [n])) || 4;
      h += `<div class="fl-rooms" style="left:${X0}pt;top:${TOP}pt;width:${PW}pt;height:${Hu}pt"><div class="rh"><div class="kick" style="height:10pt;margin-bottom:6pt" data-slot="back.roomhead" data-lines="1">${esc(NP.head || 'Room by room')}</div>` +
        para('back.roomintro', introB, 0, 0, inW, nI, {lh: 13}).replace('class="abs fl-p', 'class="fl-p').replace('style="left:0pt;top:0pt;', 'style="position:relative;') + `</div>` +
        fl.map((f, fi) => `${fi ? '<div class="gap"></div>' : ''}<div class="fh"><span data-slot="back.floor${fi}.label" data-lines="1">${esc(f.label)}</span><i></i></div>` + (f.rooms || []).map((r, ri) =>
          `<div class="r"><span class="n" data-slot="back.floor${fi}.room${ri}" data-lines="1">${esc(r[0])}</span><span class="sz" data-slot="back.floor${fi}.size${ri}" data-lines="1">${esc(feetOnly(r[1]))}</span></div>`).join('')).join('') + `</div>`;
    }
    // ----- closing box -----
    h += `<div class="fl-close" style="left:${X0}pt;top:${Cy}pt;width:${CW}pt;height:${Hc}pt"></div>`;
    const x1 = X0 + cpad, x2 = x1 + c1 + gp, x3 = x2 + c2 + gp;
    h += `<div class="abs fl-vr vr" style="left:${x2 - gp/2}pt;top:${Cy + 14}pt;height:${Hc - 26}pt;width:.6pt;background:rgba(200,164,106,.35)"></div><div class="abs fl-vr" style="left:${x3 - gp/2}pt;top:${Cy + 14}pt;height:${Hc - 26}pt;width:.6pt;background:rgba(200,164,106,.35)"></div>`;
    h += kick(B.bigHead || 'What it comes with', 'back.head', x1, Cy + 14, c1);
    h += `<div class="abs fl-big" style="left:${x1}pt;top:${Cy + 28}pt;width:${c1}pt;height:26pt" data-slot="back.big" data-lines="1" data-fit="16">${esc(B.big)}</div>`;
    h += para('back.para', paraB, x1, Cy + 60, c1, nP, {lh: 13});
    const items = (CK.items || []).slice(0, 6);
    h += kick(CK.head || 'Also included', 'back.checkhead', x2, Cy + 14, c2);
    h += `<div class="fl-chk" style="left:${x2}pt;top:${Cy + 32}pt;width:${c2}pt;height:${Hc - 32 - 12}pt;display:flex;flex-direction:column;justify-content:space-between" data-fitlist="8">${items.map((t, i) => `<div data-slot="back.check${i}" data-lines="1">${esc(feetOnly(t))}</div>`).join('')}</div>`;
    const rows = (A.rows || []).slice(0, 3), rh = (Hc - 32 - 10)/Math.max(1, rows.length);
    h += kick(A.head || 'Nearby', 'back.aroundhead', x3, Cy + 14, c3);
    h += `<div class="fl-near abs" style="left:${x3}pt;top:${Cy + 32}pt;width:${c3}pt;height:${Hc - 32 - 10}pt">${rows.map((q, i) =>
      `<div class="nr" style="top:${(i*rh).toFixed(2)}pt;height:${rh.toFixed(2)}pt"><div class="d" data-slot="back.around${i}.d" data-lines="1">${esc(q.d)}${q.u ? `<small>${esc(q.u)}</small>` : ''}</div><div class="p" data-slot="back.around${i}.p" data-lines="1">${esc(q.p)}</div></div>`).join('')}</div>`;
    h += footer(hasPlan ? B.fine : (NP.fine || B.fine));
  }

  await SP.finish(D, W, H, h, issues, async () => {
    fillAll();
    AF.fitLogos();
    // the office lines sit on the agent card's own lines: the office phone on the name's line, the address on the REALTOR line, the website on the phone line
    const blk = document.getElementById('offblk'), cc = document.querySelector('.cc[data-contactcard]');
    if(blk && cc){ const k = 96/72, bb = blk.getBoundingClientRect(), rows = {name: '.cc-name', desig: '.cc-desig', phone: '.cc-phone'};
      const mid_ = q => { const r = cc.querySelector(rows[q]).getBoundingClientRect(); return (r.top + r.bottom)/2 - bb.top; };
      blk.querySelectorAll('.ol').forEach(el => { const t = cc.querySelector(rows[el.dataset.at]); if(!t) return;
        const mid = el.dataset.at === 'desig' ? (mid_('name') + mid_('phone'))/2 : mid_(el.dataset.at);
        el.style.top = ((mid - el.offsetHeight/2)/k) + 'pt'; }); }
  });
  const sp = window.brochureCheck;
  window.brochureCheck = () => {
    const out = sp();
    const logos = [...document.querySelectorAll('.logo img, .logo [data-slot="broker.name"], .cc-logo img, .cc-brkname')].filter(e => e.offsetParent);
    if(logos.length !== 1) out.push({slot: 'logo', kind: 'logo-count', found: logos.length, want: 1});
    if(window.AgentCard) out.push(...AgentCard.trec(document, [...document.querySelectorAll('.logo img')]));
    document.querySelectorAll('[data-nofit]').forEach(el => out.push({slot: el.dataset.slot, kind: 'box-not-full', lines: +el.dataset.lines, diag: el.dataset.diag}));
    return out;
  };
})();
</script>
</body>
