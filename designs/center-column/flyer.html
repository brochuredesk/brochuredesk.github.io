<!--
  The Center Column · optional two-sided 8.5 x 11 flyer (trim 612 x 792 pt; print: 0.25 in margin of the green-slate field, content on the 36 pt
  column like the Open House flyer). data.piece.side = "front" | "back". Built from out/portrait-flyers/center-column/ (build.py).
  Same family as the fold-over: the dark green-slate field, EB Garamond titles over a brass rule, brass tracked kickers, Mulish text, room sizes in
  brass serif numerals, a column of photos of different widths, and the plan on its white board.
  FRONT  top band (place line, the one logo in white), brass rule, the whole house, the address with the ruled facts beside it, a rule, the
         write-up beside the places list, three captioned photos of different widths, the card with the office lines level with its name and
         phone lines, fine print.
  BACK   With a plan: header, the plan on its white board with the key at the left, four captioned photos, the note. Without: the rooms floor
         by floor, two large captioned photos, a row of three, the note.
  Rules: no price, no QR, no photo numbers, no "virtually staged", room sizes in feet only, the half bath at full size (BD.baths), text fills
  its space, a row of captions runs the same number of lines.
-->
<style>
  .fc{overflow:visible}
  .fc .h{font:500 13pt/15pt var(--font-display);color:var(--ink);white-space:nowrap;overflow:hidden;letter-spacing:-.05pt;padding-top:6pt;padding-bottom:1.5pt;height:22.5pt;box-sizing:border-box}
  .fc .h i{font:500 12pt/15pt var(--font-display);font-style:normal;letter-spacing:.2pt;color:var(--signal);margin-left:8pt}
  .fc .a{font-size:8.5pt;line-height:11.5pt;color:var(--text);overflow:hidden;margin-top:1.5pt}
  .fc.big .h{font-size:11pt}
  .fc.big .a{font-size:9pt;line-height:12.5pt}
  .ptxt{font-size:9.75pt;line-height:14pt}
  .pn{font:600 9pt/12pt var(--font-body);color:var(--ink);overflow:hidden;flex:1;min-width:0}
  .pd{font:500 9pt/12pt var(--font-body);color:var(--signal);flex:none}
  .rr2{display:flex;align-items:center;justify-content:space-between;border-bottom:.6pt dotted var(--line);white-space:nowrap;overflow:hidden}
  .rr2 .n{font:600 10.5pt/13pt var(--font-display);color:var(--ink);overflow:hidden}
  .rr2 .d{font:500 8.5pt/12pt var(--font-body);color:var(--signal);flex:none;margin-left:6pt}
  .pnt{font-size:8pt;line-height:10pt;color:var(--text);margin-top:3pt}
  .hr1{height:.7pt;background:var(--line);left:36pt;right:36pt;width:auto}
  .hr2{height:1.1pt;background:var(--signal);left:36pt;right:36pt}
  .planframe{position:absolute;background:#fff}
  .pb{--paper:#fff;--ink:#1e2e2d;--muted:#566360;--text:#1e2e2d}
  .stk div{overflow:hidden}
  .stk.r{display:flex;flex-direction:column}
  .stk.r div{flex:1 1 0;display:flex;align-items:center;padding:0}
  .stk.r div:last-child{border-bottom:.6pt dotted var(--line)}
  .stk.r div:first-child{border-top:.6pt dotted var(--line)}
  #btitle{height:35pt;line-height:34pt}   /* room for the descenders (printchecks text-clipped) */
  .cc .cc-nameblock .cc-name{padding-bottom:2pt}
</style>

<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
/* Portrait flyer engine (shared by SB-01, SG-01, PR-01 flyers): text fitting, feet-only sizes, footer with office lines level with
   the card's lines, logo, plan key, and small helpers. Built into each set's templates/<set>/flyer.html by build.py. */
const FX = (function(){
  const FX = {X: 36, W: 540, BOT: 654, CARD_Y: 690, CARD_H: 66, INNER: .8, GAP: 2.6};   // printchecks word-gap-wide fails near 2.8x; 2.5x keeps a margin   // owner 11/10: a shorter, full-width card (rule 1)
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  FX.esc = esc;
  const ms = document.createElement('div');
  ms.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;white-space:normal;overflow:visible;font-family:var(--font-body)';
  document.body.appendChild(ms);
  FX.measure = (text, w, fs, lh, wt, noGap) => {
    ms.style.width = w + 'pt'; ms.style.fontSize = fs + 'pt'; ms.style.lineHeight = lh + 'pt'; ms.style.fontWeight = wt || 400; ms.textContent = text;
    const rg = document.createRange(); rg.selectNodeContents(ms);
    const rows = []; [...rg.getClientRects()].filter(r => r.width > .5).forEach(r => { const row = rows.find(x => Math.abs(x.top - r.top) < lh*.5); if(row) row.right = Math.max(row.right, r.right); else rows.push({top: r.top, right: r.right}); });
    const box = ms.getBoundingClientRect(), last = rows.length ? rows[rows.length-1] : null;
    // inner: the shortest line above the last (justified out to the width: a short one opens big word gaps, owner 11/10 rule 8)
    const inner = rows.length > 1 && box.width ? Math.min(...rows.slice(0, -1).map(r => (r.right - box.left)/box.width)) : 1;
    // gap: the widest justified word gap on any line above the last, as a multiple of a normal space (printchecks word-gap-wide fails past 2.6)
    let gap = 1;
    if(!noGap && rows.length > 1 && ms.firstChild){ const tn = ms.firstChild, re = /\S+/g, cnt = rows.map(() => 0), wr = document.createRange(); let m;
      while((m = re.exec(text))){ wr.setStart(tn, m.index); wr.setEnd(tn, m.index + m[0].length); const t = wr.getClientRects()[0]; if(!t) continue;
        const k = rows.findIndex(x => Math.abs(x.top - t.top) < lh*.5); if(k >= 0) cnt[k]++; }
      const sp = fs*.26*96/72;
      rows.slice(0, -1).forEach((r, k) => { const g = cnt[k] > 1 ? 1 + (box.right - r.right)/((cnt[k] - 1)*sp) : 9; if(g > gap) gap = g; }); }
    return {lines: rows.length, last: last && box.width ? Math.min(1, (last.right - box.left)/box.width) : 0, inner, gap};
  };
  // room sizes in feet only, inches dropped and never rounded: 18' x 12'
  const feetOnly = FX.feetOnly = t => String(t).replace(/(\d+)(?:\.\d+)?(?:'\s?\d+(?:\.\d+)?"?)?'?\s*x\s*(\d+)(?:\.\d+)?(?:'\s?\d+(?:\.\d+)?"?)?'?/g, "$1' x $2'");
  FX.BAN = /\b(generous(ly)?|spacious|boasts?|nestled|perfect for|character|enhances?|within easy reach|soaring|glows?|moments away|set the tone|abundant|steps away|brings? in (day)?light|natural light|brighten(s|ed)?|rich|space to entertain|adds? privacy|opens? the entry|daylight|with light|ready for|set up for a crowd|minutes from|year-round comfort|ways to unwind|get ready at once|carry through the space|virtually|staged|ideal for|master|kids?|children)\b/i;
  // a list may carry .need: its first `need` sentences must all stay in any fit (facts the approved version showed; owner 11/13: never lose a fact)
  FX.sentences = s => { const r = (Array.isArray(s) ? s : String(s || '').match(/[^.!?]+[.!?]+["”’)]*|[^.!?]+$/g) || []).map(x => feetOnly(x).trim()).filter(x => x && !FX.BAN.test(x)); if(s && s.need) r.need = Math.min(s.need, r.length); return r; };
  const sentences = FX.sentences;
  const subsets = arr => { const n = Math.min(arr.length, 8), out = [];
    for(let m = 1; m < (1 << n); m++){ const pick = []; for(let i = 0; i < n; i++) if(m & (1 << i)) pick.push(arr[i]); out.push({m, pick}); }
    return out.sort((a, c) => (a.m & -a.m) - (c.m & -c.m) || c.pick.length - a.pick.length || a.m - c.m); };
  const FILLS = [.9, .8];
  const ADJ = [0, .25, -.25, .5, .75, -.5];
  // the caption keeps its first sentence (the room's own lead line) whenever any size or subset with it fills; only then may it drop it
  const FITC = new Map();   // the same caption at the same width and line count is fitted once
  const fitOne = (sents, f, n, fill) => { const key = JSON.stringify([sents, sents.need || 0, f.w, f.fs, f.lh, n, fill]); if(FITC.has(key)) return FITC.get(key); const r = fitOne0(sents, f, n, fill); FITC.set(key, r); return r; };
  const fitOne0 = (sents, f, n, fill) => { let best = null; const req = (1 << (sents.need || 0)) - 1, all = subsets(sents).filter(x => (x.m & req) === req);
    for(const lead of [true, false]) for(const adj of ADJ){ const fs = f.fs + adj; if(fs < 8 || (f.fsMin && fs < f.fsMin)) continue;
      for(const {m, pick} of all){ if(!!(m & 1) !== lead) continue; const t = pick.join(' '); let r = FX.measure(t, f.w, fs, f.lh, f.wt, true);   // the word-gap pass only for a text that already fills
        if(r.lines !== n) continue; if(r.last >= fill && r.inner >= FX.INNER) r = FX.measure(t, f.w, fs, f.lh, f.wt); else r.gap = 9;
        if(r.lines === n && r.last >= fill && r.inner >= FX.INNER && r.gap <= FX.GAP) return {text: t, lines: n, last: r.last, fs, good: 1, lead};
        const sc = r.last + (r.inner >= FX.INNER && r.gap <= FX.GAP ? 1 : -Math.max(0, r.gap - FX.GAP)/4) + (lead ? 1 : 0);
        if(r.lines === n && (!best || sc > best.sc)) best = {text: t, lines: n, last: r.last, fs, sc, gap: r.gap, inner: r.inner, lead}; } }
    return best; };
  FX.fitOne = fitOne;
  FX.fillBox = (src, f, ns) => { const sents = sentences(src); if(!sents.length) return {text: '', lines: 0, last: 0, ok: false};
    let fall = null;
    for(const n of ns) for(const fill of [FILLS[1]]){ const r = fitOne(sents, f, n, fill); if(r && r.good) return Object.assign(r, {ok: true}); if(r && (!fall || r.last > fall.last)) fall = r; }
    if(fall) return Object.assign(fall, {ok: false});
    const t = sents.join(' '), r = FX.measure(t, f.w, f.fs, f.lh, f.wt); return {text: t, lines: r.lines, last: r.last, ok: false}; };
  // a row of captions all run the same number of lines: the first n in `ns` every one can fill
  FX.fillRow = (items, f, ns, leadOnly) => {
    const fw = Array.isArray(f) ? f : items.map(() => f), sn = items.map(sentences);
    for(const n of ns) for(const fill of [FILLS[1]]){
      const rs = sn.map((s, i) => s.length ? fitOne(s, fw[i], n, fill) : null);
      if(rs.every(r => r && r.good && r.lead !== false)) return {rs, n, ok: true, even: true, lead: true}; }
    if(leadOnly) return {rs: [], n: ns[0], ok: false, even: false};
    for(const n of ns){ const rs = sn.map((s, i) => s.length ? fitOne(s, fw[i], n, FILLS[1]) : null);
      if(rs.every(r => r && r.good)) return {rs, n, ok: true, even: true}; }
    let best = null;
    // a caption no set of its sentences fills in n lines takes the most it can in n lines or fewer: it never runs past its box (owner 11/10)
    const atMost = (sents, f, n) => { let b = null;
      const req = (1 << (sents.need || 0)) - 1;
      for(const {m, pick} of subsets(sents)){ if((m & req) !== req) continue; const r = FX.measure(pick.join(' '), f.w, f.fs, f.lh, f.wt);
        if(r.lines <= n && (!b || r.lines > b.lines || (r.lines === b.lines && r.last > b.last))) b = {text: pick.join(' '), lines: r.lines, last: r.last}; }
      if(!b){ const t = sents.slice().sort((x, y) => x.length - y.length)[0], r = FX.measure(t, f.w, f.fs, f.lh, f.wt); b = {text: t, lines: r.lines, last: r.last}; }
      return b; };
    for(const n of ns){ const rs = sn.map((s, i) => s.length ? (fitOne(s, fw[i], n, 0) || atMost(s, fw[i], n)) : {text: '', lines: 0, last: 0});
      const bad = 10*rs.filter(r => r.lines !== n).length + rs.filter(r => r.last < FILLS[1]).length;   /* a row runs one line count first (owner 11/10) */ if(!best || bad < best.bad) best = {rs, n, bad}; }
    return {rs: best.rs, n: best.n, ok: false, even: best.bad < 10}; };

  // a row whose photos may change width a little (the widest first): the first width set where every caption fills n lines (owner 11/10: rows
  // run one line count, every line full, no big word gaps); else the plain row at the first set
  FX.fillRowW = (items, f, n, sets) => { let first = null;
    for(const ws of sets){ const fw = ws.map(w => Object.assign({}, f, {w})), r = FX.fillRow(items, fw, [n], true); r.ws = ws; if(r.ok) return r; }   // every caption keeps its lead line
    for(const ws of sets){ const r = FX.fillRow(items, ws.map(w => Object.assign({}, f, {w})), [n]); r.ws = ws; if(!first) first = r; if(r.ok) return r; }
    return first; };
  // ---------- logo: one per side ----------
  FX.logo = (D, x, y, w, h, dark) => {
    const b = D.brand || {}; let src = b.logo, st = '';
    if(dark){ src = b.logoKnockout || b.logoOnDark || b.logo; if(!(b.logoKnockout || b.logoOnDark)) st = 'filter:brightness(0) invert(1);'; }
    return `<div class="abs logo" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${h}pt;display:flex;align-items:center;justify-content:flex-end">${src ? `<img src="${esc(src)}" alt="" data-slot="broker.logo" data-optional="1" style="max-width:${w}pt;max-height:${h}pt;${st}">` : ''}</div>`;
  };

  // ---------- footer: the standard agent contact block (owner 11/2, Round 2): agent card left, the brokerage's logo and office lines right,
  // the same block on every set (as Ivory's back); only the set's colors and fonts change it. The one logo on the side lives here. ----------
  FX.footer = (D, o) => {
    o = o || {};
    const b = D.brand || {}, A = D.agent || {}, X = FX.X, W = FX.W;
    const hs = (D.photos && D.photos[A.headshot] && D.photos[A.headshot].src) || (/^(file|https?|data):/.test(A.headshot || '') ? A.headshot : '');
    // owner 11/10/2026 (rule 1): full width, shorter top to bottom (two rows), the brokerage logo inside the card
    return ContactCard.html([X, FX.CARD_Y, W, FX.CARD_H], Object.assign({}, A, {headshot: hs}), b, {layout: 'panel', size: 'short', bottomGap: .5, grow: 0,
      s: {name: 20, nameFloor: 15, desigInline: true, wrap: false, phone: 13.5, line: 9.5, office: 9.5, hsW: 50, hsGap: 14, pad: [6, 14, 5], panelW: 160, panelPad: [5, 8], logo: {wide: [140, 30], square: [32, 32], tall: [34, 34]}}});
  };
  FX.alignOffices = () => {};

  // pick `n` photo ids from the writer's list, then a fallback list, never one already used and never one without a source
  FX.picker = (D, used, txt) => (writer, n, fallback, minLen) => { const out = [];
    // photos with enough caption copy first (a row of captions runs one line count and never shorter, owner 11/10), then any with copy
    for(const want of (minLen ? [minLen, 1] : [1])){ const has = id => id && D.photos && D.photos[id] && D.photos[id].src && (!txt || txt(id) >= want);   /* a captioned photo needs its caption text (rows run one line count, owner 11/10) */
    (writer || []).filter(has).forEach(i => { if(out.length < n && !used.has(i)){ used.add(i); out.push(i); } });
    for(const i of (fallback || [])){ if(out.length >= n) break; if(has(i) && !used.has(i)){ used.add(i); out.push(i); } } }
    return out; };
  return FX;
})();

window.brochureReady = (async function(){
  const D = AT.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const esc = AT.esc, pt = AT.pt, L = D.listing, C = D.copy || {}, CP = D.companion || {}, FL = CP.flyer || {};
  const issues = await AT.fontsReady(D);
  await AT.cardReady;
  document.body.dataset.mode = D.mode || 'email';
  const front = D.piece.side !== 'back';
  const planOK = AT.planOK(D), levels = planOK ? AT.levels(D) : [], flabels = planOK ? AT.floorLabels(D) : [];
  const {X, W, BOT} = FX, P = D.photos || {};
  const halfy = t => AT.halfy ? AT.halfy(t) : esc(t);
  const {measure, fillBox, fillRow, sentences, feetOnly} = FX;
  // owner 11/10/2026: no contact block and no brokerage logo on the flyer front: the photo row runs EX pt further down
  const DB = front ? 13 : 11.5, FBOT = 645 + (front ? 107 : 0), EX = front ? 107 : 0;   // caption body line step (pt)
  // owner 11/10/2026 (p102): the front's type grows into the room the card left: captions 9.5 pt, the write-up 10.5 pt; the write-up is
  // justified when every line already runs 90%+ of the column (rule 5), so it lines up with the rule above and the photos below
  const CFS = front ? 9.5 : 8.5, DFS = 10.5, DLH = 15;
  const just = (r, w) => (r && r.lines > 1 && r.last >= .8 && (m => m.inner >= .8 && m.gap <= FX.GAP)(FX.measure(r.text, w, r.fs || DFS, DLH))) ? ';text-align:justify;text-align-last:left' : '';
  const capH = n => 6 + 16.5 + 1.5 + n*DB;

  // ---------- the fold-over's copy, by photo, and the flyer's own ----------
  const ALL = {};
  const CV = C.cover || {}, LF = C.left || {}, RT = C.right || {}, BK0 = C.back || {};
  const items = [...(CV.items || []), ...[].concat(...(LF.rows || []).map(r => [r.main, r.side])), ...[].concat(...(RT.rows || []).map(r => [r.main, r.side])), ...(BK0.photos || [])];
  items.forEach(it => { if(it && it.photo && !ALL[it.photo]) ALL[it.photo] = it; });
  // the back may carry its own caption copy per photo (backPhotos: sentences, x, keep), so the front's captions stay as they are
  const FP = Object.assign({}, FL.photos || {}, front ? {} : (FL.backPhotos || {}));
  const titleOf = id => (FP[id] && FP[id].title) || (ALL[id] && ALL[id].title) || '';
  const dimsOf = id => (FP[id] && FP[id].dims !== undefined ? FP[id].dims : (ALL[id] && ALL[id].dims)) || '';
  // the photo's own true lines: its caption copy, then its extra true sentences (x), so a caption never runs shorter (owner 11/10/2026)
  const poolOf = id => { const b = (FP[id] && FP[id].sentences) || (ALL[id] && ALL[id].body) || '', x = (FP[id] && FP[id].x) || (ALL[id] && ALL[id].x) || [];
    const bs = sentences(b), seen = new Set(bs.join(' ').toLowerCase().match(/[a-z]{4,}/g) || []);
    // an extra line joins only when it says something the caption does not already say (no repeated facts)
    const fresh = t => { const w = (t.toLowerCase().match(/[a-z]{4,}/g) || []).filter(x => !/^(that|this|with|from|room|the|into|over|sits|runs|just)$/.test(x)); return w.length && w.filter(x => seen.has(x) || seen.has(x.replace(/s$/, ''))).length / w.length < 0.5; };
    const pool = [...bs, ...sentences([].concat(x)).filter(t => !bs.includes(t) && fresh(t))];
    // keep: sentences the flyer must always show; they go first and every fit keeps them (owner 11/13: never lose a fact)
    const keep = sentences((FP[id] && FP[id].keep) || []).filter(t => pool.includes(t));
    if(!keep.length) return pool;
    const out = [...keep, ...pool.filter(t => !keep.includes(t))]; out.need = keep.length; return out; };
  const xOf = id => { const x = (FP[id] && FP[id].x) || (ALL[id] && ALL[id].x); return x ? ` data-x="${esc(JSON.stringify(x))}"` : ''; };
  const keepOf = id => { const k = sentences((FP[id] && FP[id].keep) || []); return k.length ? ` data-keep="${esc(JSON.stringify(k))}"` : ''; };   // CapFit keeps these too
  const has = id => id && AT.src(D, id);
  const used = new Set();
  const hero = (FL.front && FL.front.hero && has(FL.front.hero)) ? FL.front.hero : (CV.photo || Object.keys(P)[0]);
  used.add(hero);
  const pick = FX.picker(D, used, id => poolOf(id).join(' ').length);
  const folIds = items.filter(Boolean).map(i => i.photo);
  const PL0 = (FL.places || (BK0.places || []).map(p => ({n: p.n, d: p.d})));
  const PLT = FL.placesTitle || BK0.placesTitle || 'Around the neighborhood';

  // ---------- pieces ----------
  const cap = (id, slot, r, x, y, w) => { const d = dimsOf(id);
    return `<div class="abs fc" style="left:${x}pt;top:${y}pt;width:${w}pt"><div class="h" data-slot="${slot}.h" data-lines="1">${esc(titleOf(id))}${d ? `<i>${esc(feetOnly(d))}</i>` : ''}</div>`
      + `<div class="a"${xOf(id)}${keepOf(id)} data-slot="${slot}.a" data-para="1" data-min="2" data-lines="${r.lines}" style="height:${r.lines*DB}pt;line-height:${DB}pt;font-size:${r.fs || CFS}pt">${esc(r.text)}</div></div>`; };
  const ph = (id, slot, x, y, w, h, cls) => AT.photo(D, id, `position:absolute;left:${x}pt;top:${y}pt;width:${w}pt;height:${h}pt`, slot, cls || 'cm');
  const kick = (t, x, y, w, slot, extra) => `<div class="abs kicker" style="left:${x}pt;top:${y}pt;width:${w}pt;height:10pt;${extra || ''}" data-slot="${slot}" data-lines="1">${esc(t)}</div>`;
  const fine = (t, y, slot) => `<div class="abs fine" style="left:${X}pt;top:${y}pt;width:${W}pt;height:8pt;white-space:nowrap" data-slot="${slot}" data-fine="1" data-lines="1">${esc(t)}</div>`;
  const placeLine = [L.neighborhood, AT.placeZip(L)].filter(Boolean).join(' · ');
  const FINE = FL.fineprint || C.footnote || 'Information deemed reliable but not guaranteed.';
  let h = '';
  const fitlog = [];

  if(front){
    // ================= FRONT =================
    h += kick(placeLine.toUpperCase(), X, 36, W, 'place');
    h += `<div class="hr2 abs" style="top:58pt"></div>`;
    // the photo with the most caption copy takes the widest slot (never shorter, owner 11/10/2026)
    const trio = pick(FL.front && FL.front.photos, 3, folIds, 200).sort((p, q) => poolOf(q).join(' ').length - poolOf(p).join(' ').length);
    // details grid: beds, baths (the ½ at full size), square feet, built-in year (else stories), then the lot size when there is one
    const bt = BD.baths(L), rows = [];
    if(L.beds) rows.push(`${Number(L.beds).toLocaleString('en-US')} ${L.beds == 1 ? 'Bedroom' : 'Bedrooms'}`);

      const rl = (BK0.floors || []).map(f => ({floor: f.name, rows: f.rooms.map(r => [r.n, r.d])})).filter(f => f.rows && f.rows.length);
      let cols = rl.map(f => ({floor: f.floor, rows: f.rows}));
      if(cols.length === 1 && cols[0].rows.length > 6){ const r = cols[0].rows, k = Math.ceil(r.length/2); cols = [{floor: cols[0].floor, rows: r.slice(0, k)}, {floor: cols[0].floor + ' (continued)', rows: r.slice(k)}]; }
      const nr = Math.max(...cols.map(c => c.rows.length)), RH = 17;
      const cgap = 18, cw = (W - (cols.length - 1)*cgap)/cols.length;
      let ys = 96, sec = '';
      cols.forEach((c, ci) => { const x = X + ci*(cw + cgap);
        sec += `<div class="abs sect" style="left:${x}pt;top:${ys}pt;width:${cw}pt;height:12pt;border-bottom:1.1pt solid var(--signal);padding-bottom:3pt" data-slot="back.floor${ci}" data-lines="1">${esc(c.floor)}</div>`;
        c.rows.forEach((r, ri) => { sec += `<div class="abs rr2" style="left:${x}pt;top:${ys + 20 + ri*RH}pt;width:${cw}pt;height:${RH}pt"><span class="n" data-slot="back.floor${ci}.r${ri}.n" data-lines="1">${esc(r[0])}</span>${r[1] ? `<span class="d" data-slot="back.floor${ci}.r${ri}.d" data-lines="1">${esc(feetOnly(r[1]))}</span>` : ''}</div>`; }); });
      h += sec;
      const fy = ys + 20 + nr*RH + 14, gap = 14;
      const ids = pick([...(BK.features || []), ...(BK.row || [])], 5, folIds, 200), cId = ids[0], sId = ids[1], rowIds = ids.slice(2, 5);
      const LW = 136, SW = 150, CWd = W - LW - SW - 2*gap, rowW = (W - 2*gap)/3;
      const cd = feetOnly(dimsOf(cId)), LHd = 22.5 + 1.5;
      // text height: the left column's caption sets the height of the band
      let band = null;
      for(const H1 of [152, 164, 140, 176, 188]){
        const nL = Math.floor((H1 - LHd - (cd ? 30 : 0))/DB);
        const fl = fillBox(poolOf(cId), {w: LW, fs: 8.5, lh: DB, wt: 400}, [nL, nL - 1, nL - 2]);
        const sn = [6, 5, 4, 3].find(n => H1 - capH(n) >= 70 && fillRow([poolOf(sId)], {w: SW, fs: 8.5, lh: DB, wt: 400}, [n]).ok) || [5, 4, 3].find(n => H1 - capH(n) >= 70) || 3, fs = fillRow([poolOf(sId)], {w: SW, fs: 8.5, lh: DB, wt: 400}, [sn]);
        if(!band) band = {H1, nL, fl, sn, fs};
        if(fl.ok && fs.ok){ band = {H1, nL, fl, sn, fs}; break; }
      }
      let {H1, fl, sn, fs} = band;
      // the caption beside the centre photo fills down to the photo's bottom edge (owner 11/2): stretch the line step a little, then shorten the band for the rest
      const availL = H1 - LHd - (cd ? 30 : 0), slackL = availL - fl.lines*DB;
      let lhL = DB;
      if(slackL > 3){ const shrink = Math.max(0, Math.min(slackL - 2.4*fl.lines, H1 - capH(sn) - 52)); lhL = (availL - shrink)/fl.lines; H1 -= shrink; }
      const rr1 = fillRow(rowIds.map(poolOf), {w: rowW, fs: 8.5, lh: DB, wt: 400}, [6, 5, 4, 3]);
      const ry = fy + H1 + gap, Hr = NB - ry - capH(rr1.n); fitlog.push(['col-band', H1, fl.ok, fl.lines, 'side', fs.ok, 'row', rr1.n, rr1.ok, Math.round(Hr)]);
      h += `<div class="abs fc" style="left:${X}pt;top:${fy}pt;width:${LW}pt"><div class="h" data-slot="back.main.h" data-lines="1" style="padding-top:0;font-size:13pt">${esc(titleOf(cId))}</div><div class="a"${xOf(cId)} data-slot="back.main.a" data-para="1" data-min="2" data-lines="${fl.lines}" style="height:${fl.lines*lhL}pt;line-height:${lhL}pt${fl.fs ? `;font-size:${fl.fs}pt` : ''}">${esc(fl.text)}</div></div>`;
      if(cd) h += `<div class="abs" style="left:${X}pt;top:${fy + H1 - 22}pt;width:${LW}pt;height:22pt;font:500 17pt/22pt var(--font-display);color:var(--signal);white-space:nowrap" data-slot="back.main.dims" data-lines="1">${esc(cd)}</div>`;
      h += ph(cId, 'back.center', X + LW + gap, fy, CWd, H1);
      const sx = X + LW + gap + CWd + gap, Hs = H1 - capH(sn);
      h += ph(sId, 'back.side', sx, fy, SW, Hs) + cap(sId, 'back.side', fs.rs[0], sx, fy + Hs, SW);
      rowIds.forEach((id, i) => { const x = X + i*(rowW + gap); h += ph(id, `back.row${i}`, x, ry, rowW, Hr) + cap(id, `back.row${i}`, rr1.rs[i], x, ry + Hr, rowW); });
      h += noteHTML;
      document.body.dataset.layout = 'back-photos';
      document.body.dataset.geom = JSON.stringify({H1, Hr, noteLines: noteR.lines, rooms: nr});
    }
  }
  document.body.dataset.fitlog = JSON.stringify(fitlog);
  const f = AT.frame(D, 612, 792, h);
  document.getElementById('pages').innerHTML = f.html;
  window.pieceSize = {W: f.W, H: f.H, bleed: f.bleed};
  await AT.settle();
  AT.fitLine(document.getElementById('addr') || document.createElement('div'), 28);
  AT.fitLine(document.getElementById('btitle') || document.createElement('div'), 20);
  issues.push(...AT.fitHouse(D));
  ContactCard.fit(document);
  FX.alignOffices();
  document.querySelectorAll('.plan-room span').forEach(e => { e.textContent = feetOnly(e.textContent); });
  if(window.PlanInk) PlanInk.applyAll(D, true);   // the listing's own plan, background clear, light lines on the dark field (owner 11/10)
  window.photoPlacements = AT.placements;
  const guard = () => { const out = [], sh = document.querySelector('.sheet').getBoundingClientRect(), cc = document.querySelector('.cc');
    const top = cc ? pt(cc.getBoundingClientRect().top - sh.top) : 0;
    document.querySelectorAll('.ph,.fc,.ptxt,.planframe').forEach(el => { const b = pt(el.getBoundingClientRect().bottom - sh.top); if(top && b > top - 4) out.push({slot: el.dataset.slotPhoto || el.className, kind: 'runs-into-card', bottomPt: +b.toFixed(1), cardTopPt: +top.toFixed(1)}); });
    return out; };
  await document.fonts.ready; CapFit.run(document.querySelectorAll('.cap .a, .fc .a'));
  window.brochureCheck = () => AT.checkSingle(D, [...issues, ...guard()]);
})();

</script>
