<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Center Column open house flyer</title>
<link rel="stylesheet" href="center-column.css">
<link rel="stylesheet" href="center-column-cards.css">
<script src="../engine/baths.js"></script>
<script src="center-column.js"></script>
<script src="center-column-cards.js"></script>
<!--
  The Center Column · Open House flyer "Photos Down the Middle" (trim 612 x 792 pt; print: 0.25 in white margin around the green-slate field).
  The event leads: the label in tracked brass caps, the date as the largest type on the page (EB Garamond, white), the time in brass,
  and the broker / REALTOR(R) lines (only on those opens, only when filled; refreshments in a white box) beside it. Then the whole
  house, its frame sized from the house box so a tall house never squeezes the rooms; the street address with city, state and ZIP
  under it and the facts row (brass labels between hairlines) beside it; and two rooms zigzagging down the center column of the page,
  a photo on one side and its text beside it, the room's size in brass at the end of the title line. The standard contact card closes
  the page. Rules: no RSVP, no QR, no price. Copy: data.copy.pc.oh = {photos: [front, room, room], rooms: [{t, dims, a}, {t, dims, a}]}.
-->
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = AT.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="color:#fff;padding:20pt">No data injected.</p>'; return; }
  const esc = AT.esc, L = D.listing, PC = ((D.copy || {}).pc || {}), OHC = PC.oh || {};
  const issues = await AT.fontsReady(D);
  document.body.dataset.mode = D.mode || 'email';
  const O = AT.openHouse(D), X = 36, W = 540;
  const hero = (OHC.photos || [])[0] || 'front';
  let h = '';

  // the event
  h += `<div class="abs oh-lbl" style="left:${X}pt;top:26pt;width:${W}pt;height:24pt" data-slot="oh.label" data-lines="1">${esc(O.label)}</div>`;
  if(O.weekday) h += `<div class="abs oh-date" id="date" style="left:${X-1}pt;top:50pt;width:${W}pt;height:60pt;font-size:54pt;line-height:60pt" data-slot="oh.date" data-lines="1">${esc(O.long)}</div>`;
  else h += `<div class="abs oh-date" style="left:${X}pt;top:52pt;width:${W}pt;height:58pt;font-size:34pt;line-height:32pt;white-space:normal" data-slot="oh.date" data-lines="2">${esc(O.long)}</div>`;
  h += `<div class="abs oh-time" style="left:${X}pt;top:110pt;width:300pt;height:34pt" data-slot="oh.time" data-lines="1">${esc(O.time)}</div>`;
  let dy = 0;   // the optional broker / REALTOR(R) lines sit right of the time; more than two lines and the header grows, the rooms and the photo give up the difference
  { const ls = [[O.note, 'oh.note', 'oh-strong'], [O.refreshments, 'oh.refreshments', 'oh-note box']].filter(l => l[0]);
    if(ls.length){ const pre = AT.eventLines(ls, 308, 0, 268, 16, 8); dy = Math.max(0, pre.h - 34); h += AT.eventLines(ls, 308, 144 - pre.h + dy, 268, 16, 8, 'text-align:right').html; } }
  h += `<div class="hrule" style="top:${150 + dy}pt;left:${X}pt;right:${X}pt"></div>`;

  // the whole house: the frame is sized from the house box (roof to steps), no taller than that needs
  const hp = (D.photos || {})[hero] || {}, b = hp.box;
  const need = b && hp.w ? W*(hp.h/hp.w)*(b[3] - b[1]) + 6 : 230;
  const hh = Math.round(Math.max(need, 214)), hy = 158 + dy, hb = hy + hh;
  h += AT.photo(D, hero, `position:absolute;left:${X}pt;top:${hy}pt;width:${W}pt;height:${hh}pt`, 'oh.hero', 'hero');

  // the address (city, state and ZIP under it) and the facts
  h += `<div class="abs dsp" id="addr" style="left:${X-1}pt;top:${hb + 6}pt;width:340pt;height:42pt;font-size:40pt;line-height:42pt" data-slot="address" data-lines="1">${esc(L.address)}</div>`;
  h += `<div class="abs kicker" style="left:${X}pt;top:${hb + 50}pt;width:340pt;height:10pt" data-slot="place" data-lines="1">${esc([L.neighborhood, AT.placeZip(L)].filter(Boolean).join(' · ').toUpperCase())}</div>`;
  { const f = [[L.beds, 'Beds'], [BD.bathNum(L).num, BD.bathNum(L).label], [L.sqft ? Number(L.sqft).toLocaleString('en-US') : '', 'Sq Ft'], [L.yearBuilt || L.year, 'Built']].filter(x => x[0]);
    h += `<div class="abs fx" style="left:${X + W - 232}pt;top:${hb + 10}pt;width:232pt;height:48pt">${f.map((x, i) => `<div class="f"><div class="v" data-slot="oh.fact${i}" data-lines="1">${i === 1 ? x[0] : esc(x[0])}</div><div class="l" data-slot="oh.fact${i}l" data-lines="1">${esc(x[1])}</div>${i === 1 && BD.bathNum(L).half ? `<div class="l" data-slot="oh.fact1x" data-lines="1">${esc(BD.bathNum(L).half)}</div>` : ''}</div>`).join('')}</div>`; }
  h += `<div class="hrule" style="top:${hb + 68}pt;left:${X}pt;right:${X}pt"></div>`;

  // the house in a write-up on the left, two horizontal room photos stacked on the right, each captioned with its room and size
  const rooms = OHC.rooms || [], ids = (OHC.photos || []).slice(1, 3), top = hb + 78, bot = 654, g = 10, cap = 15, rh = (bot - top - g)/2 - cap;
  const pw = Math.min(276, Math.floor(rh * 2.95)), tw = W - pw - 20, px = X + W - pw;
  ids.forEach((id, i) => { const c = rooms[i] || {}, y = top + i*(rh + cap + g);
    h += AT.photo(D, id, `position:absolute;left:${px}pt;top:${y}pt;width:${pw}pt;height:${rh}pt`, 'oh.room' + i, 'room');
    h += `<div class="abs rm cp" style="left:${px}pt;top:${y + rh + 3}pt;width:${pw}pt;height:${cap - 3}pt"><div class="rh"><span class="t" data-slot="oh.room${i}.title" data-lines="1">${esc(c.t)}</span>${c.dims ? `<span class="d" data-slot="oh.room${i}.size" data-lines="1">${esc(c.dims)}</span>` : ''}</div></div>`; });
  h += `<div class="abs rm" style="left:${X}pt;top:${top}pt;width:${tw}pt;height:${bot - top}pt"><div class="a ohw" id="ohw" data-slot="oh.write" data-para="1" data-min="2">${esc(OHC.write || '')}</div></div>`;

  h += AT.cardBox(D, [X, 662, W, 94], {layout: 'panel'});
  h += `<div class="abs fine" style="left:${X}pt;top:764pt;width:${W}pt;height:8pt;white-space:nowrap" data-slot="fineprint" data-lines="1" data-fine="1">${esc(PC.fineprint || 'Information deemed reliable but not guaranteed.')}</div>`;

  const f = AT.frame(D, 612, 792, h);
  document.getElementById('pages').innerHTML = f.html;
  window.pieceSize = {W: f.W, H: f.H, bleed: f.bleed};
  await AT.settle();
  document.querySelectorAll('#date').forEach(el => AT.fitLine(el, 40));
  AT.fitLine(document.getElementById('addr'), 28);
  issues.push(...AT.fitHouse(D));
  { const el = document.getElementById('ohw'), box = el.parentElement, maxH = box.clientHeight; let best = 9.5;   // the write-up takes the biggest size that fits the column, last line well filled
    for(let fs = 12; fs >= 9; fs -= 0.25){ el.style.fontSize = fs + 'pt'; el.style.lineHeight = (fs * 1.5) + 'pt'; if(el.scrollHeight > maxH + 0.5) continue; AT.balance(el);
      const ls = AT.lineBoxes(el), last = ls[ls.length - 1]; if(ls.length > 1 && (last.r - last.l)/el.getBoundingClientRect().width < .78) continue; best = fs; break; }
    el.style.fontSize = best + 'pt'; el.style.lineHeight = (best * 1.5) + 'pt'; AT.balance(el);
    for(let lh = 1.5; lh <= 1.78; lh += 0.01){ el.style.lineHeight = (best * lh) + 'pt'; if(el.scrollHeight > maxH - 2){ el.style.lineHeight = (best * (lh - 0.01)) + 'pt'; break; } } }
  ContactCard.fit(document);
  window.photoPlacements = AT.placements;
  window.brochureCheck = () => AT.checkSingle(D, issues);
})();
</script>
</body>
</html>
