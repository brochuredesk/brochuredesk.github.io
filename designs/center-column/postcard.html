<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Center Column postcard</title>
<link rel="stylesheet" href="center-column.css">
<link rel="stylesheet" href="center-column-cards.css">
<script src="../engine/baths.js"></script>
<script src="center-column.js"></script>
<script src="center-column-cards.js"></script>
<script src="capfit.js"></script>
<!--
  The Center Column · Just Listed and Just Sold postcards. data.piece: card "listed" | "sold", size "6x9" (trim 648 x 432 pt) | "6x11"
  (792 x 432 pt), side "front" | "back". Print adds 0.125 in (9 pt) bleed on every edge (TrimBox set by the renderer).
  The book's green-slate field, EB Garamond titles and brass rules run across the whole card.
  Front: the whole house (roof to steps, house box kept in frame) bleeds off the top and left. "Just" in white and "Listed" / "Sold" in
  brass italic run beside it over a brass rule, the address, city, state and ZIP, and the facts between hairlines (Just Listed) or the
  invitation and the agent's name and number (Just Sold). A short write-up runs under the photo and a row of interiors, the column of
  photos turned on its side, closes the card.
  Back: a brass edge strip across the top, a light mail panel carrying the return address, the status, the street and a brass callout
  around the postage box and the address block; Just Listed: captioned rooms (size in brass at the end of the title line) from the first
  floor to the yard; Just Sold: two interiors, what the agent does for a seller and what the first meeting is like. The postcard contact
  card runs full width (one brokerage logo) over the barcode strip's panel. Mail zones are the Just Listed library's (jllib.js zones(),
  px x 0.75): postage, address block, barcode strip; guides on proofs, clear in print.
  No price, no QR, no photo numbers, no "virtually staged". Copy: data.copy.pc.jl / data.copy.pc.js.
-->
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = AT.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="color:#fff;padding:20pt">No data injected.</p>'; return; }
  const esc = AT.esc, L = D.listing, A = D.agent || {}, b = D.brand || {};
  const issues = await AT.fontsReady(D);
  const sold = D.piece.card === 'sold', big = D.piece.size === '6x11', front = D.piece.side === 'front';
  const PCall = AT.pcCopy(D), PC = (sold ? PCall.js : PCall.jl) || {};
  document.body.dataset.mode = D.mode || 'email';
  const PT = 96/72, W = big ? 792 : 648, H = 432, M = 27, status = sold ? ['Just', 'Sold'] : ['Just', 'Listed'];
  const hero = PC.hero || 'front';
  let h = '';

  if(front){
    // ---------- front ----------
    // the frame never cuts the roof or the sides (owner 11/7): a tall house narrows the photo to its own shape and the right column takes the room
    const hp0 = (D.photos || {})[PC.hero || 'front'] || {}, bx0 = hp0.box, xFit = bx0 && hp0.w ? Math.floor(261 * (hp0.w / hp0.h) / ((bx0[3] - bx0[1]) + .03)) - 9 : 9999;
    const xR = Math.max(big ? 430 : 370, Math.min(big ? 497 : 420, xFit)), ph = 261, cx = xR + 18, cw = W - M - cx, S = big ? 70 : 64, LH = big ? 58 : 54;
    h += AT.photo(D, hero, `position:absolute;left:-9pt;top:-9pt;width:${xR + 9}pt;height:${ph}pt`, 'front.hero', 'hero');
    let bottom;
    if(!sold){
      const st = AT.stats(L);
      bottom = `<div class="stk">${st.slice(0, 4).map((t, i) => `<div data-slot="stat${i}" data-lines="1">${esc(t).replace(/½/g, '<span class="bd-half">½</span>')}</div>`).join('')}</div>`;
    } else {
      bottom = `<div><div class="dsp" id="cta" style="font-size:22pt;line-height:24pt;color:var(--signal);white-space:nowrap" data-slot="sold.cta" data-lines="2">${esc(PC.cta1 || 'Thinking of selling?')}<br>${esc(PC.cta2 || 'Let’s talk it over.')}</div>
        <div class="dsp" id="agname" style="margin-top:8pt;font-size:21pt;line-height:24pt;padding-bottom:3pt" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</div>
        <div style="font:700 13pt/16pt var(--font-body);color:var(--ink);letter-spacing:.3pt;white-space:nowrap;overflow:hidden;margin-top:1pt" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</div></div>`;
    }
    const nrc = sold ? 294 : 243;
    h += `<div class="abs rc" style="left:${cx}pt;top:10pt;width:${cw}pt;height:${nrc}pt">
      <div><div class="head" id="head" style="margin-left:-2pt;height:${2*LH}pt;font-size:${S}pt;line-height:${LH}pt" data-slot="status" data-lines="2">${status[0]}<br><b>${status[1]}</b></div>
        <div style="height:1pt;background:var(--signal);opacity:.7;margin-top:${sold ? 8 : 6}pt"></div></div>
      <div><div class="dsp" id="addr" style="margin-left:-1pt;font-size:${big ? 31 : 27}pt;line-height:${big ? 32 : 28}pt;white-space:normal;height:auto" data-slot="address" data-lines="2">${esc(L.address)}</div>
        <div class="kicker" style="margin-top:7pt;height:10pt" data-slot="place" data-lines="1">${esc(AT.placeZip(L).toUpperCase())}</div></div>
      ${bottom}</div>`;
    const tw = sold ? xR - M : W - 2*M, tt = ph - 9 + 9, flh = sold ? (big ? 16.2 : 15) : 15.5, nlf = sold && big ? 4 : 3;
    h += `<div class="abs ptxt2 jt" style="left:${M}pt;top:${tt}pt;width:${tw}pt;height:${nlf*flh + 1}pt;line-height:${flh}pt${sold ? (big ? ';font-size:11.6pt' : '') : ';font-size:11pt'}" data-slot="front.about" data-para="1" data-min="3" data-fillbox="1" data-nobal="1">${esc(big ? PC.front11 : PC.front9)}</div>`;
    // the interiors across the bottom
    const ids = (PC.strip || []).slice(0, big ? 4 : 3), g = 8, sw = (W - 2*M - g*(ids.length - 1))/ids.length;
    ids.forEach((id, i) => { h += AT.photo(D, id, `position:absolute;left:${(M + i*(sw + g)).toFixed(2)}pt;top:${sold && big ? 334 : 318}pt;width:${sw.toFixed(2)}pt;height:${sold && big ? 84 : 86}pt`, 'front.strip' + i, 'strip'); });
  } else {
    // ---------- back ----------
    const X = 24, zP = [W - 96, 12, 84, 98.25], zA = [W - 243, 187.5, 240, 112.5], zB = [W - 342, 387, 342, 45];
    const LZ = W - 252 - 14, avail = LZ - X, top0 = 24, bot0 = 296;
    const ret = [].concat(b.returnAddress || b.address || []).flatMap(a => String(a).split('\n')).map(s => s.trim()).filter(Boolean).slice(0, 2);
    // the light mail panel (postage, return address, address block) and the barcode strip's panel; the amber edge strip runs across the top
    h += `<div class="mailp" style="left:${W - 252}pt;top:-9pt;width:${261}pt;height:${309}pt"></div><div class="mailp" style="left:${zB[0] - 4}pt;top:386pt;width:${W - zB[0] + 4 + 9}pt;height:55pt"></div>`;
    h += `<div class="bnd" style="left:-9pt;top:-9pt;width:${W + 18}pt;height:15pt"></div>`;
    h += `<div class="abs mret" style="left:${zA[0]}pt;top:20pt;width:${zP[0] - 8 - zA[0]}pt;height:34pt;overflow:hidden" data-slot="return" data-small="1" data-lines="3">${b.brokerage ? '<b>' + esc(b.brokerage) + '</b>' : ''}${ret.map(r => '<br>' + esc(r)).join('')}</div>`;
    h += `<div class="abs dsp" style="left:${zA[0]}pt;top:70pt;width:${zP[0] - 10 - zA[0]}pt;height:70pt;font-size:38pt;line-height:34pt;color:#1e2e2d;letter-spacing:-.5pt" data-slot="status" data-lines="2">${status[0]}<br><span style="color:#7a5f22;font-style:italic">${status[1]}</span></div>`;
    h += `<div class="abs dsp" id="st" style="left:${zA[0]}pt;top:146pt;width:${zP[0] - 10 - zA[0]}pt;height:14pt;font-size:13pt;line-height:14pt;color:#1e2e2d;letter-spacing:0" data-slot="back.street" data-lines="1">${esc(L.address)}</div>`;
    h += `<div class="abs kicker" style="left:${zA[0]}pt;top:163pt;width:${zP[0] - 10 - zA[0]}pt;height:10pt;color:#7a5f22" data-slot="back.place" data-lines="1">${esc(AT.placeZip(L).toUpperCase())}</div>`;
    const slab = PC.slab || {};
    h += `<div class="slab" data-blk="1" style="left:${zP[0]}pt;top:116pt;width:${W - zP[0] + 9}pt;height:68pt;padding:5pt 18pt 5pt 9pt"><div class="big" data-slot="slab.big" data-lines="2">${esc(slab.big || '')}</div><div class="sub" data-slot="slab.sub" data-lines="4">${esc(slab.sub || '')}</div></div>`;
    const cap = (c, x, y, w, slot, lines) => `<div class="abs cap2 bk" style="left:${x}pt;top:${y}pt;width:${w}pt"><div class="h"><span data-slot="${slot}.title" data-lines="1">${esc(c.t)}</span>${c.dims ? `<i data-slot="${slot}.size" data-lines="1">${esc(c.dims)}</i>` : ''}</div><div class="a"${c.x ? ` data-x="${esc(JSON.stringify(c.x))}"` : ''} data-slot="${slot}" data-para="1" data-min="2" data-lines="${lines}">${esc(big && c.a11 ? c.a11 : c.a)}</div></div>`;
    if(!sold){
      const bk = (PC.back || []).slice(0, big ? 3 : 2), g = 10, pw = (avail - g*(bk.length - 1))/bk.length, capH = 5 + 15 + 3*12, phh = bot0 - top0 - capH;
      bk.forEach((c, i) => { const x = X + i*(pw + g);
        h += AT.photo(D, c.id, `position:absolute;left:${x.toFixed(2)}pt;top:${top0}pt;width:${pw.toFixed(2)}pt;height:${phh.toFixed(2)}pt`, 'back.photo' + i, 'bp');
        h += cap(c, x.toFixed(2), top0 + phh, pw.toFixed(2), "back.cap" + i, 3); });
    } else {
      const ids = PC.photos || [], g = 10, pw = (avail - g)/2;
      const items = (big && PC.services11) || PC.services || [], svcH = big ? 50 : 52, lh = big ? 15 : 14.5, nl = 3, ty = bot0 - nl*lh, sy = ty - 14 - (big ? 4 : 10) - svcH - 15, ph1 = sy - 12 - top0;
      ids.slice(0, 2).forEach((id, i) => { h += AT.photo(D, id, `position:absolute;left:${(X + i*(pw + g)).toFixed(2)}pt;top:${top0}pt;width:${pw.toFixed(2)}pt;height:${ph1}pt`, 'back.photo' + i, 'bp'); });
      h += `<div class="abs kicker" style="left:${X}pt;top:${sy}pt;width:${avail}pt;height:10pt" data-slot="sold.servicesLabel" data-lines="1">${esc(PC.servicesLabel || 'What I do for sellers')}</div>`;
      h += `<div class="abs svc${big ? ' b11' : ''}" style="left:${X}pt;top:${sy + 15}pt;width:${avail}pt;height:${svcH}pt;display:grid;grid-template-columns:1fr 1fr;column-gap:14pt;row-gap:4pt;align-content:space-between">${items.map((s, i) => `<div class="it"><span class="bx"></span><span data-slot="sold.svc${i}" data-lines="2">${esc(s)}</span></div>`).join('')}</div>`;
      const my = sy + 15 + svcH + (big ? 4 : 10);
      h += `<div class="abs kicker" style="left:${X}pt;top:${my}pt;width:${avail}pt;height:10pt" data-slot="sold.meetLabel" data-lines="1">${esc(PC.meetLabel || 'When we meet')}</div>`;
            h += `<div class="abs ptxt jt" style="left:${X}pt;top:${ty}pt;width:${avail}pt;height:${nl*lh}pt;font-size:${big ? 10.5 : 10}pt;line-height:${lh}pt" data-slot="sold.meet" data-para="1" data-min="2" data-fillbox="1" data-nobal="1">${esc(big ? PC.meet11 : PC.meet9)}</div>`;
    }
    // the card: full width, under the address block and above the barcode strip
    const cardH = 80, cardY = zA[1] + zA[3] + 5, cw = W - 2*X;
    { const hs = AT.src(D, A.headshot) || (/^(file|https?|data):/.test(A.headshot || '') ? A.headshot : '');
      h += ContactCard.html([X, cardY, cw, cardH], Object.assign({}, A, {headshot: hs}), b, {postcard: true, fine: '', s: {inlineLabel: !hs || big, logo: {wide: [156, 36], square: [44, 44], tall: [46, 46]}}}); }
    const fine = [PCall.fineprint || 'Information deemed reliable but not guaranteed.', 'If your property is currently listed with a broker, please disregard this notice. It is not intended to solicit listed property.'].join(' ');
    h += `<div class="abs" style="left:${X}pt;top:${420 - 22.5}pt;width:${zB[0] - 10 - X}pt;height:22.5pt;font-size:6pt;line-height:7.5pt;color:var(--text);overflow:hidden;display:flex;align-items:flex-end" data-slot="fineprint" data-lines="3" data-fine="1"><span>${esc(fine)}</span></div>`;
    const V = D.mailVendor || {}, guide = (D.mode || 'email') !== 'print';
    if(guide) h += `<div class="mailg stamp" data-z="1" style="left:${zP[0]}pt;top:${zP[1]}pt;width:${zP[2]}pt;height:${zP[3]}pt">Postage<br><span style="text-transform:none">mail vendor</span></div>
      <div class="mailg" data-z="1" style="left:${zA[0]}pt;top:${zA[1]}pt;width:${zA[2]}pt;height:${zA[3]}pt">${[0,1,2,3].map(i => `<div class="aline" style="left:22pt;right:22pt;top:${24 + i*17.25}pt"></div>`).join('')}<div class="guide" style="left:22pt;top:97pt">${esc(V.name ? 'Address block · ' + V.name : 'Address block · mail vendor')}</div></div>
      <div class="mailg" data-z="1" style="left:${zB[0]}pt;top:${zB[1]}pt;width:${zB[2]}pt;height:${zB[3]}pt;border:.75pt dashed #aaa59a"><div class="guide" style="left:10pt;top:17pt">Barcode strip · keep clear</div></div>`;
    window.mailZones = {postage: zP, address: zA, barcode: zB};
  }

  const f = AT.frame(D, W, H, h);
  document.getElementById('pages').innerHTML = f.html;
  window.pieceSize = {W: f.W, H: f.H, bleed: f.bleed};
  await AT.settle();
  const fitLines = (el, lo) => { let s = parseFloat(getComputedStyle(el).fontSize)*72/96; while((AT.lines(el) > 2 || el.scrollWidth > el.clientWidth + .5) && s > lo){ s -= .5; el.style.fontSize = s + 'pt'; } };
  const ad = document.getElementById('addr'); if(ad) fitLines(ad, 20);
  const hd = document.getElementById('head'); if(hd) AT.fitLine(hd, 40);
  const an = document.getElementById('agname'); if(an) AT.fitLine(an, 16);
  const sk = document.getElementById('st'); if(sk) AT.fitLine(sk, 9);
  issues.push(...AT.fitHouse(D));
  AT.fitRow([...document.querySelectorAll('.cap2 .a')]);
  document.querySelectorAll('[data-para]:not([data-nobal])').forEach(el => AT.balance(el));
  // owner 11/10/2026 (rules 5, 8): every line of a write-up, caption or bullet fills its width (last line 80%+), with only small word gaps:
  // the type size moves a little (never past 12% up) until the last line fills, then the text is justified; captions may also swap in
  // their own extra true lines (CapFit)
  { const cta = document.getElementById('cta'); if(cta){ const w = cta.clientWidth, rg = document.createRange(); rg.selectNodeContents(cta);
      const wid = () => Math.max(...[...rg.getClientRects()].map(r => r.width)); let fs = 22; cta.style.fontSize = fs + 'pt';
      while(wid() < w * .97 && fs < 32){ fs += .25; cta.style.fontSize = fs + 'pt'; cta.style.lineHeight = (fs * 1.09) + 'pt'; }
      while(wid() > w && fs > 16){ fs -= .25; cta.style.fontSize = fs + 'pt'; cta.style.lineHeight = (fs * 1.09) + 'pt'; } } }
  const stats = el => { const rows = [], rg = document.createRange(), tw = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); let n;
    while((n = tw.nextNode())){ const re = /\S+/g; let m; while((m = re.exec(n.textContent))){ rg.setStart(n, m.index); rg.setEnd(n, m.index + m[0].length); const r = rg.getClientRects()[0]; if(!r) continue;
      const row = rows.find(x => Math.abs(x.t - r.top) < r.height * .5); if(row){ row.r = Math.max(row.r, r.right); row.n++; } else rows.push({t: r.top, r: r.right, n: 1}); } }
    rows.sort((p, q) => p.t - q.t); const b = el.getBoundingClientRect(), sp = parseFloat(getComputedStyle(el).fontSize) * .26;
    return {n: rows.length, last: rows.length ? (rows[rows.length - 1].r - b.left) / b.width : 0, gap: Math.max(1, ...rows.slice(0, -1).map(x => x.n > 1 ? 1 + (b.right - x.r) / ((x.n - 1) * sp) : 9)), over: el.scrollHeight > el.clientHeight + 1}; };
  const fillPara = (el, maxN) => { const fs0 = parseFloat(getComputedStyle(el).fontSize) * 72 / 96, lh0 = parseFloat(getComputedStyle(el).lineHeight) * 72 / 96, r0 = lh0 / fs0;
    el.style.textAlign = 'left';
    for(const k of [0, .01, -.01, .02, -.02, .03, -.03, .04, -.04, .05, -.05, .06, .07, .08, .09, .1, .11, .12]) for(const ls of [0, .006, -.006, .012, -.012]){ const fs = fs0 * (1 + k); if(fs < 8 && k < 0) continue;
      el.style.fontSize = fs.toFixed(2) + 'pt'; el.style.letterSpacing = ls ? ls + 'em' : ''; if(!maxN) el.style.lineHeight = (fs * r0).toFixed(2) + 'pt';
      const q = stats(el); if(q.n >= 2 && (!maxN || q.n <= maxN) && !q.over && q.last >= .8 && q.gap <= 2.5){ el.style.textAlign = 'justify'; el.style.textAlignLast = 'left'; return true; } }
    el.style.fontSize = fs0 + 'pt'; el.style.lineHeight = lh0 + 'pt'; el.style.letterSpacing = ''; return false; };
  // a write-up built from the fold-over's house copy (no postcard copy given) keeps the most of its sentences, in order, that fill the box
  const fitSents = el => { const all = (el.textContent.match(/[^.!?]+[.!?]+["”’)]*|[^.!?]+$/g) || []).map(x => x.trim()).filter(Boolean), n = Math.min(all.length, 10), cands = [];
    for(let m = 1; m < (1 << n); m += 2){ const pick = all.filter((_, i) => i < n && (m >> i & 1)); cands.push(pick.join(' ')); }
    cands.sort((p, q) => q.length - p.length);
    const fs0 = el.style.fontSize, lh0 = el.style.lineHeight;
    const T0 = performance.now();
    for(const t of cands.slice(0, 40)){ if(performance.now() - T0 > 4000) break; el.textContent = t; el.style.fontSize = fs0; el.style.lineHeight = lh0; if(el.scrollHeight > el.clientHeight + 1 && t.length > 60) continue; if(fillPara(el, 0)) return; }
    el.textContent = all.join(' '); };
  document.querySelectorAll('[data-slot="front.about"], [data-slot="sold.meet"]').forEach(el => { if(!fillPara(el, 0) && PCall.fromFoldover) fitSents(el); });
  document.querySelectorAll('.svc .it > span[data-slot]').forEach(el => fillPara(el, 2));
  { const sub = document.querySelector('[data-slot="slab.sub"]'); if(sub){ sub.style.lineHeight = '9.5pt'; if(!fillPara(sub, 4)) AT.balance(sub); } }
  document.querySelectorAll('.cap2 .a[data-x]').forEach(el => { const want = +el.dataset.lines || 3, NL = () => AT.lineBoxes(el).length, lastF = () => { const ls = AT.lineBoxes(el), l = ls[ls.length - 1]; return l ? (l.r - l.l) / el.getBoundingClientRect().width : 0; };
    if(NL() >= want && lastF() >= .8) return;
    let x = []; try { x = JSON.parse(el.dataset.x); } catch(e) {}
    const base = el.textContent.trim(), keep = base; let best = null;
    const fs0 = parseFloat(getComputedStyle(el).fontSize) * 72 / 96;
    // the caption's own true lines (its lead first): the set that fills the box's lines with a full last line (80%+), else the fullest
    const pool = [base, ...x].slice(0, 8);
    for(let m = 1; m < (1 << pool.length); m++){ const t = pool.filter((_, i) => m >> i & 1).join(' '); el.textContent = t;
      for(const k of [1, 1.03, .97, 1.06, .94, 1.09, .91]){ if(fs0 * k < 8) continue; el.style.fontSize = (fs0 * k).toFixed(2) + 'pt';   // never under 8 pt
        if(el.scrollHeight > el.clientHeight + 1) continue; const n = NL(); if(n !== want && n !== want - 1) continue;
        const ls = AT.lineBoxes(el), last = ls[ls.length - 1], f = (last.r - last.l) / el.getBoundingClientRect().width;
        const sc = (f >= .82 ? 10 : 0) + (n === want ? 4 : 0) + (m & 1 ? 2 : 0) + f - Math.abs(1 - k); if(!best || sc > best.sc) best = {t, f, k, sc}; } }
    el.style.fontSize = best ? (fs0 * best.k).toFixed(2) + 'pt' : ''; el.textContent = best ? best.t : keep; });
  await document.fonts.ready; CapFit.run(document.querySelectorAll('.cap2 .a'));
  if(window.mailZones){
    const sh = document.querySelector('.sheet').getBoundingClientRect(), P = r => ({l:(r.left - sh.left)/PT, r:(r.right - sh.left)/PT, t:(r.top - sh.top)/PT, b:(r.bottom - sh.top)/PT});
    const hit = (q, z) => q.l < z[0] + z[2] - .5 && q.r > z[0] + .5 && q.t < z[1] + z[3] - .5 && q.b > z[1] + .5;
    const els = [...document.querySelectorAll('.sheet *')].filter(e => !e.closest('[data-z]') && !e.closest('[data-contactcard]'));
    els.forEach(e => { const own = [...e.childNodes].some(n => n.nodeType === 3 && n.textContent.trim()), blk = e.matches('.ph,[data-blk],img');
      if(!own && !blk) return;
      let rects = [];
      if(own){ const rg = document.createRange(); rg.selectNodeContents(e); rects = [...rg.getClientRects()].filter(q => q.width > .5 && q.height > .5); } else rects = [e.getBoundingClientRect()];
      rects.forEach(q => { for(const k in window.mailZones) if(hit(P(q), window.mailZones[k])) issues.push({kind: own ? 'text-in-mail-zone' : 'image-in-mail-zone', slot:k, text:(e.textContent||'').trim().slice(0, 24)}); }); });
    { const cc = document.querySelector('[data-contactcard]'); if(cc){ const r = P(cc.getBoundingClientRect()); for(const k in window.mailZones) if(hit(r, window.mailZones[k])) issues.push({kind:'card-in-mail-zone', slot:k}); } }
  }
  { const caps = [...document.querySelectorAll('.cap2 .a')].map(c => AT.lines(c));
    if(caps.length > 1 && Math.max(...caps) !== Math.min(...caps)) issues.push({slot:'captions', kind:'captions-uneven', lines:caps}); }
  ContactCard.fit(document);
  window.proofNotes = [{paragraphs: [...document.querySelectorAll('[data-para]')].map(el => { const ls = AT.lineBoxes(el), w = el.getBoundingClientRect().width, last = ls[ls.length-1];
    return {slot: el.dataset.slot, lines: ls.length, last: last ? Math.round((last.r - last.l)/w*100) : 0, chars: el.textContent.trim().length, wPt: Math.round(AT.pt(w))}; })}];
  window.photoPlacements = AT.placements;
  if(!front && ![].concat((D.brand || {}).returnAddress || (D.brand || {}).address || []).filter(Boolean).length) issues.push({slot: 'return', kind: 'return-address-missing'});   /* every mailer back carries the brokerage's full return address (owner 11/10) */
  window.brochureCheck = () => AT.checkSingle(D, issues);
})();
</script>
