<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · The Long View open house flyer · Photo Rows</title>
<link rel="stylesheet" href="long-view.css">
<script src="long-view.js"></script>
<script src="../engine/setpieces.js"></script>
<!--
  The Long View · Open House flyer b "Photo Rows" (trim 612 x 792 pt; print: 0.25 in white margin around the teal field).
  A panoramic photo opens the page and the event sits under it on a solid cyan band: the label in tracked teal caps, the
  date in the serif as the largest type on the page, the time, and the broker / REALTOR(R) lines (only on those opens, only
  when filled) bottom right of the band. Then the address with city, state and ZIP, and two rows built like the fold-over's
  bands: a pair of photos side by side, and the text column beside them (room name in the serif, the room sizes as label /
  value lines with right-aligned values, a paragraph). The standard contact card (Right panel) carries the one logo.
  Open House rules (templates/_shared/ohstandard.js): city, state and ZIP, no RSVP, no QR, no price. Copy: data.copy.pc.oh.b.
-->
<style>
  .cc{--cc-paper:#113b44;--cc-ink:#ffffff;--cc-muted:#a9c9ce;--cc-accent:#82d4dd;--cc-line:rgba(130,212,221,.5)}
  .band-ev{position:absolute;background:var(--cyan)}
  .oh-lbl{font:700 20pt/22pt var(--font-body);letter-spacing:3pt;text-transform:uppercase;color:#0b3a44;white-space:nowrap;overflow:hidden}
  .oh-date{font:400 52pt/56pt var(--font-display);letter-spacing:-.8pt;color:#08242b;white-space:nowrap;overflow:hidden}
  .oh-time{font:600 22pt/26pt var(--font-body);color:#08242b;white-space:nowrap;overflow:hidden}
  .oh-strong{font:600 10pt/13pt var(--font-body);color:#08242b;text-align:right}
  .oh-note{font:400 10pt/13pt var(--font-body);color:#0b3a44;text-align:right}
  .rowtx{position:absolute;overflow:hidden}
  .rowtx .rl{height:.7pt;background:var(--rule)}
  .rowtx .hd{font:400 14pt/18pt var(--font-display);color:var(--white);white-space:nowrap;overflow:hidden;margin-top:5pt}
  .rowtx .sz{display:flex;justify-content:space-between;align-items:baseline;font:600 8.5pt/12pt var(--font-body);letter-spacing:.8pt;text-transform:uppercase;color:var(--cyan);border-bottom:.5pt solid rgba(130,212,221,.3)}
  .rowtx .sz span{white-space:nowrap}
  .rowtx .sz .v{font:400 10.5pt/12pt var(--font-display);letter-spacing:0;text-transform:none;color:var(--white)}
  .rowtx .pp{font-size:9.5pt;line-height:13pt;color:var(--text);overflow:hidden;margin-top:5pt}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SP.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="color:#fff;padding:20pt">No data injected.</p>'; return; }
  const esc = SP.esc, L = D.listing, PC = ((D.copy || {}).pc || {}), C = (PC.oh || {}).b || {};
  const issues = await SP.ready(D);
  document.body.dataset.mode = D.mode || 'email';
  const O = SP.openHouse(D), X = 36, W = 540, bx = X + 18, bw = W - 36;
  let h = '';

  // the event lines (broker / REALTOR(R) opens): past two lines the band grows and the panorama gives up the difference
  let dy = 0, ev = '';
  const ls = [[O.note, 'oh.note', 'oh-strong'], [O.refreshments, 'oh.refreshments', 'oh-note']].filter(l => l[0]);
  const pano = 214, bt = X + pano + 10;   // the band's top with no extra lines
  if(ls.length){ const pre = SP.eventLines(ls, 0, 0, 260, 13, 0); dy = Math.max(0, pre.h - 28); }
  const ph = pano - dy, top = bt - dy;    // the band starts higher by dy and is dy taller: it always ends at bt + 120
  h += SP.photo(D, C.pano || 'pv0', X, X, W, ph, 'oh.pano');
  h += `<div class="band-ev" data-blk="1" style="left:${X}pt;top:${top}pt;width:${W}pt;height:${120 + dy}pt"></div>`;
  h += `<div class="abs oh-lbl" style="left:${bx}pt;top:${top + 12}pt;width:${bw}pt;height:22pt" data-slot="oh.label" data-lines="1">${esc(O.label)}</div>`;
  h += `<div class="abs oh-date" style="left:${bx - 2}pt;top:${top + 34}pt;width:${bw + 2}pt;height:56pt" data-slot="oh.date" data-lines="1" data-fit="34">${esc(O.long)}</div>`;
  h += `<div class="abs oh-time" style="left:${bx}pt;top:${top + 90 + dy}pt;width:240pt;height:26pt" data-slot="oh.time" data-lines="1">${esc(O.time)}</div>`;
  if(ls.length){ const pre = SP.eventLines(ls, 0, 0, 260, 13, 0); h += SP.eventLines(ls, bx + bw - 260, top + 90 + dy + 26 - pre.h, 260, 13, 0).html; }

  // the address
  const ay = bt + 130;
  h += `<div class="abs addr" style="left:${X - 1}pt;top:${ay}pt;width:${W}pt;height:36pt;font-size:32pt;line-height:36pt" data-slot="address" data-lines="1" data-fit="24">${esc(L.address)}</div>`;
  h += `<div class="abs place" style="left:${X}pt;top:${ay + 38}pt;width:${W}pt;height:12pt" data-slot="place" data-lines="1">${esc(SP.placeZip(L).toUpperCase())}</div>`;

  // two rows: a pair of photos, the text column beside them
  const rows = (C.rows || []).slice(0, 2), rh = 98, g = 10, bw1 = 170, sw = 108, tx = X + bw1 + g + sw + 14, tw = X + W - tx;
  const r0 = ay + 62;
  let pics = '';
  rows.forEach((r, i) => { const y = r0 + i*(rh + 12);
    pics += SP.photo(D, r.big, X, y, bw1, rh, 'oh.row' + i + 'a') + SP.photo(D, r.small, X + bw1 + g, y, sw, rh, 'oh.row' + i + 'b');
    const sz = (r.sizes || []).slice(0, 2), n = Math.floor((rh - 1 - 23 - sz.length*12 - 5)/13);
    h += `<div class="rowtx" style="left:${tx}pt;top:${y}pt;width:${tw}pt;height:${rh}pt"><div class="rl"></div><div class="hd" data-slot="oh.row${i}.head" data-lines="1">${esc(r.head)}</div>`
      + sz.map((s, j) => `<div class="sz"><span data-slot="oh.row${i}.s${j}l" data-lines="1">${esc(s[0])}</span><span class="v" data-slot="oh.row${i}.s${j}v" data-lines="1">${esc(s[1])}</span></div>`).join('')
      + `<div class="pp" style="height:${n*13}pt" data-slot="oh.row${i}.text" data-para="1" data-min="3" data-lines="${n}">${esc(r.text)}</div></div>`; });
  h += `<div class="abs" data-gapcheck="oh.rows" style="left:0;top:0">${pics}</div>`;

  h += SP.card(D, [X, 674, W, 86], {layout: 'panel', fieldAccent: true});
  h += `<div class="abs" style="left:${X}pt;top:766pt;width:${W}pt;height:8pt;font-size:6pt;line-height:8pt;color:var(--muted);white-space:nowrap;overflow:hidden" data-slot="fineprint" data-lines="1" data-fine="1">${esc(PC.fineprint || 'Information deemed reliable but not guaranteed.')}</div>`;

  await SP.finish(D, 612, 792, h, issues);
})();
</script>
</body>
</html>
