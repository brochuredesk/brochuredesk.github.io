<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · Pale Gallery fold-over</title>
<link rel="stylesheet" href="pg.css">
<link rel="stylesheet" href="pg-fo.css">
<script src="pg.js"></script>
<script>window.Ivory = {esc: s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))};</script>
<script src="plan.js"></script>
<script src="planink.js"></script>
<script src="../engine/baths.js"></script>
<script src="../engine/factrepeat.js"></script>
<script src="../engine/agentcard.js"></script>
<script src="pg-fo.js"></script>
<!--
  BrochureDesk · Pale Gallery · 11 x 17 fold-over: one sheet folded once down the middle into four upright 8.5 x 11 panels,
  0.125 in (9 pt) bleed, text 0.5 in clear of the fold. The hand is the approved Open House library flyer B01 Pale Gallery
  (templates/oh-library/b01-pale-gallery*.html): the agent's brand-kit dark color as the field, B01's closed hairline frame drawn
  over everything on every panel, accent eyebrows, Tenor Sans caps headings over a short accent rule, Spectral address and numerals,
  Jost body, photos edge to edge under the frame, and B01's white box with a thin accent line for the lists.
    FRONT  the place, the street, the facts, the whole house edge to edge, three rooms named under them, the write-up. No agent, no brokerage.
    LEFT   the living level: the centered heading and intro, the widest room edge to edge, two captioned rooms, the white box list.
    RIGHT  bedrooms and baths: the centered heading and intro, four captioned rooms.
    BACK   (redesigned 11/17/2026, FO.backFold) the head on the band; the listing's own plan or the outdoor photo with a column beside it
           (the house in labeled write-ups, Nearby as a ruled list); a hang row of up to three captioned photos; the white wall label with
           three lists (the property, features, outside); the half-height card and the fine print.
  Modes: proof = four panel pages 8.75 x 11.25 in; print = two spreads 17.25 x 11.25 in, each half clipped at the fold.
-->
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const mode = D.mode || 'proof', K = D.sw || {}, issues = [];
  await SW.setup(D);
  const photoIds = html => [...String(html).matchAll(/data-photo="([^"]+)"/g)].map(m => m[1]);
  // the piece is built in one pass; when a photo in the back's hang row cannot fill its caption once the whole piece is set, that photo
  // comes out of the row and the piece is built again (FO.backRowBad; at most three times)
  const build = async () => { issues.length = 0; window.planIssues = []; FXS.__sizes = new Set(); document.getElementById('pages').innerHTML = '';
  if(SW.resetFill) SW.resetFill();
  const pF = FO.front(D, {intro: (K.front || {}).summary, lines: 4}), pL = FO.left(D), pR = FO.right(D);
  // The approved cover and inside keep their wording: they are set with the back they were approved beside (FO.back legacy, never printed),
  // then the redesigned back (owner 11/17/2026) takes its place and is set on its own, after them, from what the rest of the piece leaves.
  const sz0 = new Set(FXS.__sizes), bkOld = FO.back(D, {legacy: true}); FXS.__sizes = sz0;
  const bk = FO.back(D, {others: pF + pL + pR}); issues.push(...bk.issues);
  const panels = {front: pF, back: bk.html, left: pL, right: pR}, first = {front: pF, back: bkOld.html, left: pL, right: pR};
  const panel = (h, id) => `<div class="panel" data-panel="${id || ''}"><div class="bg-paper"></div>${h}</div>`;
  let html = '';
  if(mode === 'print'){
    html += `<div class="page" data-page="outside" style="width:1242pt;height:810pt"><div class="half l">${panel(first.back, 'back')}</div><div class="half r">${panel(panels.front)}</div></div>`;
    html += `<div class="page" data-page="inside" style="width:1242pt;height:810pt"><div class="half l">${panel(panels.left)}</div><div class="half r">${panel(panels.right)}</div></div>`;
  } else for(const id of ['front','back','left','right']) html += `<div class="page" data-page="${id}" style="width:630pt;height:810pt">${panel(first[id], id)}</div>`;
  document.getElementById('pages').innerHTML = html;
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  FO.prep3();
  SW.fill();
  FO.refit();
  FO.grow();
  { const oldP = document.querySelector('.panel[data-panel="back"]'), tmp = document.createElement('div'); tmp.innerHTML = panel(panels.back, 'back'); const newP = tmp.firstElementChild; oldP.replaceWith(newP);
    await Promise.all([...newP.querySelectorAll('img')].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
    const held = [...document.querySelectorAll('[data-s]')].filter(e => !newP.contains(e)); held.forEach(e => { e.dataset.shold = e.dataset.s; delete e.dataset.s; });   // the cover and inside are set: only the back is filled now
    FO.prep3(); SW.fill(); FO.refit();
    held.forEach(e => { e.dataset.s = e.dataset.shold; delete e.dataset.shold; }); }
  FO.just3();
  if(FO.backCol) FO.backCol();
  FO.capSnug(); FO.frontSnug();
  FO.leftHead();
  FO.gaps();
  FO.sideCenter();
  if(FO.span && !document.querySelector('[data-span][data-spanned]')) FO.span();
  FO.tallStack();
  SW.fitLogos();
  if(window.ContactCard) ContactCard.fit(document);
  if(D.plan) PlanInk.applyAll(D, PG.k.light);
  { const rep = SW.spaceRepeats(D, ['front', 'back', 'left', 'right'].flatMap(k => photoIds(panels[k]))); rep.forEach(([sp, ps]) => issues.push({slot: 'foldover.' + sp, kind: 'space-twice-in-foldover', detail: `${sp}: ${ps.join(' and ')} show one physical space twice`})); }
  { const seenP = new Map(); for(const k of ['front', 'back', 'left', 'right']) photoIds(panels[k]).forEach(id => { if(seenP.has(id) && seenP.get(id) !== k) issues.push({slot: k + '.' + id, kind: 'photo-twice-in-foldover', detail: `${id} is on the ${seenP.get(id)} and on the ${k}`}); else seenP.set(id, k); }); }
  issues.push(...SW.focus(D));
  FO.tighten(D);
  // a tile cropped tighter than its photo: data-zoom="z,fx,fy" (the crop shows 1/z of the photo, anchored at the focus fractions)
  document.querySelectorAll('.ph[data-zoom]').forEach(el => { const [z, fx, fy] = el.dataset.zoom.split(',').map(Number), im = el.querySelector('img'); if(!im) return;
    im.style.cssText = `position:absolute;max-width:none;width:${z*100}%;height:${z*100}%;left:${-(z - 1)*fx*100}%;top:${-(z - 1)*fy*100}%;object-fit:cover`; });
  PG.breakFrame();
  };
  await build();
  for(let pass = 0; pass < 3; pass++){ const bad = FO.backRowBad ? FO.backRowBad() : []; if(!bad.length) break; FO.backSkip = (FO.backSkip || []).concat(bad[0]); await build(); }
  window.brochureCheck = () => SW.check(D, (window.planIssues || []).concat(issues, FXS.backTextBox(), FO.overlapCheck(), FO.factsCheck(), FO.fill3Check(), FXS.leftBoxCheck()));
  window.photoPlacements = SW.placements;
})();
</script>
</body>
</html>
