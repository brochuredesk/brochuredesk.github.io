<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · Twilight Frame postcards</title>
<link rel="stylesheet" href="tf.css">
<link rel="stylesheet" href="tf-fo.css">
<script src="tf.js"></script>
<script src="../engine/baths.js"></script>
<script src="../engine/agentcard.js"></script>
<script src="../engine/factrepeat.js"></script>
<script>window.Ivory = window.Ivory || {esc: s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))};</script>
<script src="tf-fo.js"></script>
<!--
  BrochureDesk · Twilight Frame · Just Listed and Just Sold postcards (the hand of the approved Open House library flyer B01).
  data.piece.card = "listed" | "sold", data.piece.size = "6x11" (trim 792 x 432 pt) | "6x9" (648 x 432 pt), data.piece.side = "front" | "back".
  Print adds 0.125 in (9 pt) bleed. The agent's brand color (brand.accent) is the field on both sides; boxes are white.
  Front: the whole house (roof to steps) on the right with a one-line-or-two caption and a white box under it, the status stacked large on the left over the address,
  the fact rows and the brokerage logo (Just Listed) or the agent's name and number and the logo (Just Sold). No price, no QR.
  Back: status line, interior photos with captions, a white box (the write-up, or the steps), the standard contact card (templates/_shared/agentcard.js,
  band preset, which carries the back's one logo), the fine print. The right 289.5 pt (4.02 in) is the mail vendor's: return address, postage and address
  zones; drawn as guides on proofs and left clear in print.
  Copy comes from data.sw.pc.{jl|js}.{front|back} as a lead plus whole sentences; tf.js picks the sentences that fill each box.
-->
<style>
  /* the FX14 hand on a postcard: white frame, a taupe block, Pinyon Script status, white underlined labels, hairline white boxes; tokens in tf-tokens.css */
  .pc-col{position:absolute;display:flex;flex-direction:column}
  .pc-wbox{background:var(--tf-lift);color:var(--fx-soft);padding:10pt 16pt 9pt;display:flex;flex-direction:column;overflow:hidden}
  .pc-wbox:after{content:"";position:absolute;inset:4.5pt;border:1pt solid color-mix(in srgb, var(--tf-accent) 78%, transparent);pointer-events:none}
  .pc-wbox.lt{background:#fff;color:#2c2c2c}
  .pc-wbox.lt:after{border-color:var(--tf-box-line)}
  .pc-wbox.lt .k{color:var(--tf-ink-accent)}
  .pc-wbox.lt .p{color:#161616}
  .pc-wbox .k{font:500 8.6pt/11pt var(--tf-font);letter-spacing:3.4pt;text-transform:uppercase;color:var(--tf-accent);white-space:nowrap;overflow:hidden;margin-bottom:3pt;align-self:flex-start}
  .pc-wbox .p{font-family:var(--tf-serif);font-weight:500;overflow:hidden;color:var(--fx-on)}
  .pc-wbox .p b{font-weight:700;color:var(--fx-on)}
  .pc-bstatus{position:absolute;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
  .pc-bstatus .st{font:700 10.5pt/1 var(--fx-font);letter-spacing:2.4pt;color:var(--fx-on);text-transform:uppercase}
  .pc-bstatus .ln{flex:1;height:1.2pt;background:var(--tf-accent);margin:0 12pt;min-width:16pt}
  .pc-bstatus .ad{font:500 16pt/1 var(--tf-serif);color:var(--fx-on);padding-bottom:3pt}
  .pc-steps .it{display:flex;gap:8pt;align-items:baseline;white-space:nowrap;overflow:hidden}
  .pc-steps .bx{width:4pt;height:4pt;transform:translateY(-1pt) rotate(45deg);background:var(--tf-accent);flex:none}
  .pc-call{font:500 13pt/16pt var(--tf-serif);color:var(--tf-accent);white-space:nowrap;overflow:hidden}
  .pc-disc{position:absolute;font-size:6pt;line-height:10pt;color:var(--fx-soft);overflow:hidden;white-space:nowrap}
  .pc-ret{position:absolute;font:500 9pt/11pt var(--fx-font);letter-spacing:.2pt;color:var(--fx-on);overflow:hidden;height:34pt}
  .pc-ret b{font-weight:700;letter-spacing:1.4pt;text-transform:uppercase;color:var(--fx-ink)}
  .cap .a{font-weight:400}
  /* the back's compact contact row (owner 11/16): on the footer band, email and web side by side */
  .pc-back .cc{background:transparent}
  .pc-back .cc .cc-lines{display:flex;column-gap:12pt}
  .pc-back .cc .cc-panel{flex-direction:row;align-items:center;column-gap:10pt}
  .pc-back .cc .cc-panel > div:last-child{text-align:left}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const esc = SW.esc, b = D.brand || {}, A = D.agent || {}, L = D.listing, P = D.piece || {};
  document.body.dataset.mode = D.mode || 'email';
  await SW.setup(D);
  const sold = P.card === 'sold', big = P.size === '6x11', front = P.side === 'front';
  const W = big ? 792 : 648, H = 432;
  const K = ((D.sw || {}).pc || {})[sold ? 'js' : 'jl'] || {};
  const hsSrc = A.headshot && ((D.photos||{})[A.headshot] ? D.photos[A.headshot].src : A.headshot) || '';
  const statusWord = sold ? 'Just Sold' : 'Just Listed';
  const issues = [];
  const logo = (cls, src, area, maxh, style) => `<div class="logo ${cls}" data-area="${area}" data-maxh="${maxh}" style="${style||''}">${src ? `<img src="${esc(src)}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage||'')}</span>`}</div>`;
  const CL = big ? 13.5 : 12.5, CF = big ? 'font-size:10.9pt;line-height:13.5pt;' : '';   // the 6x11 sets its type up from the 6x9 (11 pt against 9.5), not the same size with more room
  const cap = (c, slot, lines, extra, min) => (c = (c.photo ? FXS.augment(D, c) : c), `<div class="cap" style="height:${5 + lines*CL}pt;${extra||''}"><div class="a" data-min="${min || 2}" data-nopair="1" data-slot="${slot}" data-narrow="0" data-nstep="6" data-lh="${CL}" data-lines="${lines}" data-lead="${esc(c.lead||'')}" data-s='${esc(JSON.stringify([].concat(c.s||[]))).replace(/'/g,'&#39;')}' style="height:${lines*CL}pt;${CF}"></div></div>`);
  let h = '';

  if(front){
    // The FX14 hand on a postcard front. A white frame top and side, the whole house in it, a taupe block around it with the status in Pinyon Script.
    // JL: "Just Listed" in script beside the house, the horizontal address, three facts; under the house the caption ("Front.", the draws) and the agent and logo along the foot.
    // JS: sells the agent: "Just Sold" in the same script lockup, the name and phone big on the left, the house on the right with the agent's own note, the logo.
    const F = K.front || {};
    const draws = list => { const w = x => /gated|roof|pergola|deck|park|garage|island|stone|corner|pool/i.test([].concat(x)[0]) ? 0 : 1; return (list || []).map((x, i) => [w(x), i, x]).sort((p, q) => p[0] - q[0] || p[1] - q[1]).map(t => t[2]); };
    const capC = sold ? {lead: '', s: (F.note || {}).s || (F.cap || {}).s} : (F.caption ? {lead: F.caption.lead, s: F.caption.s.concat(draws((F.about || {}).s || []))} : {lead: 'Front.', s: draws((F.about || {}).s || (F.cap || {}).s)});
    const norm = x => String(x).toLowerCase().replace(/[^a-z0-9 ]/g, '').slice(0, 40), allAlts = list => [].concat(...(list || []).map(x => [].concat(x)));
    const backSet = new Set([].concat(allAlts(((K.back || {}).about || {}).s), ...((K.back || {}).photos || []).map(c => allAlts(c.s)), allAlts((K.back || {}).steps6), allAlts((K.back || {}).steps)).map(norm));
    const backAll = allAlts(((K.back || {}).about || {}).s).map(String);   // the back's About box
    if(capC.s){ const kept = capC.s.filter(x => ![].concat(x).some(a => backSet.has(norm(a)))); if(kept.length >= 2) capC.s = kept; }
    // the caption's own first sentence stays; a later one that says a fact the back's About box says (the deck and pergola, in other words) drops out
    if(capC.s && capC.s.length > 2){ const tail = capC.s.slice(1).filter(x => ![].concat(x).some(a => backAll.some(b => SW.sameFact(String(a), b)))); if(tail.length >= 1) capC.s = [capC.s[0]].concat(tail); }
    const roomIds = [...new Set([].concat(((D.sw||{}).back||{}).photos||[], ((D.sw||{}).left||{}).photos||[]).map(c => c.photo))].filter(id => (D.photos||{})[id] && !(D.photos[id]||{}).fullHouse && id !== F.cap.photo).slice(0, 2);
    // ---- Twilight Frame fronts, design pass 11/15 (the mailbox test). Two different cards. Just Listed: the house bleeds off three edges
    // and is the hero; JUST / LISTED stacked as large as the column allows, flush left with the street, the facts and three specific highlights
    // on small accent marks (no box); the agent and the one logo along the foot; the closed frame holds the words and never crosses the photo.
    // Just Sold: the house is a picture inside the closed frame; the words centered. A dusk glow runs where the field meets the photo. ----
    const k = big ? 1.12 : 1, FRI = 22, pid = FO.heroId(D, F.cap.photo);
    const word = sold ? 'Just Sold' : 'Just Listed', place = [FXS.hood(L), FXS.placeLine(L)].filter(Boolean).join('  ·  ').toUpperCase(), ad = String(L.address || '');
    const tenor = "font-family:'Tenor Sans';letter-spacing:3pt", facts = FXS.statItems(L).filter(t => !/^Built/.test(t)).join('  ·  ').toUpperCase();
    // reversed caps never under 8.5 pt: a line that does not fit at its size gives up tracking before it gives up size
    const capsFit = (t, w, max, wt, tracks) => { for(const ls of tracks){ const fs = FXS.fitSize(t, `font-family:Jost;font-weight:${wt};letter-spacing:${ls}pt`, w, max, 8.5); if(FXS.width(t, `font-family:Jost;font-weight:${wt};letter-spacing:${ls}pt;font-size:${fs}pt`) <= w - 12) return {fs: Math.max(8.5, fs), ls}; } return {fs: 8.5, ls: tracks[tracks.length - 1]}; };
    const eyebrow = (x, y, w, al) => { const c = capsFit(place, w, 8.8*k, 500, [3, 2.2, 1.4, 0.8]); return `<div class="abs tf-eyebrow" style="left:${x}pt;top:${y}pt;width:${w}pt;font-size:${c.fs}pt;line-height:${12*k}pt;letter-spacing:${c.ls}pt${al ? ';text-align:' + al : ''}" data-slot="front.place" data-lines="1">${esc(place)}</div>`; };
    const factsLine = (x, y, w, al) => { let ft = facts, c = capsFit(ft, w, 10*k, 600, [1.8, 1.2, 0.7, 0.3]); if(FXS.width(ft, `font-family:Jost;font-weight:600;letter-spacing:${c.ls}pt;font-size:${c.fs}pt`) > w - 12){ ft = facts.replace(/\s+·\s+/g, ' · '); c = capsFit(ft, w, 10*k, 600, [1.2, 0.7, 0.3, 0, -0.2]); }   /* a narrow column: the facts close up before they shrink under 8.5 pt */ return `<div class="abs tf-caps" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${14*k}pt;font-size:${c.fs}pt;line-height:${14*k}pt;letter-spacing:${c.ls}pt${al ? ';text-align:' + al : ''}" data-slot="front.facts" data-lines="1">${esc(ft)}</div>`; };
    const status = (t, x, y, w, fs, slot, al) => `<div class="abs tf-label" style="left:${x}pt;top:${y}pt;width:${w + 4}pt;height:${fs*1.04}pt;font-size:${fs}pt;line-height:${fs*1.04}pt;letter-spacing:3pt;overflow:visible${al ? ';text-align:' + al : ''}" data-slot="${slot}" data-lines="1">${esc(t)}</div>`;
    const serif = (t, x, y, w, fs, slot, extra) => `<div class="abs tf-serif" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${fs*1.25}pt;font-size:${fs}pt;line-height:${fs*1.25}pt;${extra || ''}" data-slot="${slot}" data-lines="1">${esc(t)}</div>`;
    // the highlights: real selling facts, the specific ones first (a dated improvement beats a plain feature), one per line on a small accent mark
    const tags = w => { const tg = FXS.tagFacts(D).tags.filter(t => FXS.width(t, `font-family:Jost;font-weight:500;font-size:${11.5*k}pt`) < w - 16).filter((t, i, arr) => !arr.slice(0, i).some(u => SW.sameFact(t, u))); const sc = t => (/\b(19|20)\d\d\b/.test(t) ? 4 : 0) + (/\d/.test(t) ? 1 : 0) + Math.min(t.length, 30)/30; return tg.map((t, i) => [sc(t), i, t]).sort((a, b) => b[0] - a[0] || a[1] - b[1]).map(x => x[2]); };
    const hl = (t, i, x, y, w, rh) => `<div class="abs" style="left:${x}pt;top:${y + rh/2 - 2.5*k}pt;width:${5*k}pt;height:${5*k}pt;transform:rotate(45deg);background:var(--tf-accent)"></div><div class="abs" style="left:${x + 15*k}pt;top:${y}pt;width:${w - 15*k}pt;height:${rh}pt;font-weight:500;font-size:${11.5*k}pt;line-height:${rh}pt;font-family:var(--tf-font);color:var(--tf-on);white-space:nowrap;overflow:hidden" data-slot="front.hl.${i}" data-lines="1">${esc(t)}</div>`;
    const note = (x, y, w, n, lh, fs, pad) => { fs = fs || 10*k; pad = pad || 13; return `<div class="tf-lt"><div class="tf-wbox lt" id="notebox" data-pad="${pad}" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${n*lh + 2*pad}pt"></div><div class="abs cap"><div class="a" style="position:absolute;left:${x + 15}pt;top:${y + pad}pt;width:${w - 30}pt;height:${n*lh}pt;font-size:${fs}pt;line-height:${lh}pt;color:var(--fx-soft)" data-slot="front.note" data-lh="${lh}" data-lines="${n}" data-min="3" data-narrow="0" data-flexh="1" ${FXS.sd(capC.s || [])}></div></div></div>`; };   // the Just Sold note is the card's one light moment: B01's white card
    const nameW = ns => FXS.width(A.name || '', `font-family:'Tenor Sans';letter-spacing:.8pt;font-size:${ns}pt`), phoneW = ns => FXS.width(A.phone || '', `font-family:Jost;font-weight:600;font-size:${ns*0.74}pt`);
    const desT = A.designation ? (A.nar || /realtor/i.test(A.designation) ? 'REALTOR®' : A.designation) : '', DS = 8.5*k, desW = desT ? FXS.width(desT, `font-family:Jost;font-weight:500;letter-spacing:2pt;font-size:${DS}pt`) + 9*k : 0, LOGO_MIN = 104*k;
    const nameSpan = ns => `<span style="font-weight:400;font-size:${ns}pt;line-height:${ns*1.25}pt;font-family:var(--tf-label);letter-spacing:.8pt;color:var(--tf-on)" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</span>`;
    const desSpan = ns => `<span style="font-weight:500;font-size:${DS}pt;line-height:${ns*1.25}pt;font-family:var(--tf-font);letter-spacing:2pt;color:var(--tf-accent);margin-left:${9*k}pt" data-slot="agent.desig" data-lines="1">${esc(desT)}</span>`;
    const phoneSpan = (ns, ml) => `<span style="font-weight:600;font-size:${ns*0.74}pt;line-height:${ns*1.1}pt;font-family:var(--tf-font);color:var(--tf-on)${ml ? `;margin-left:${ml}pt` : ''}" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</span>`;
    // the agent and the one logo, tied together: beside each other on one row, or (a narrow column) the logo under the agent's line
    const footStacks = (w, ns) => w - Math.max(nameW(ns), phoneW(ns)) - 20*k < LOGO_MIN;
    const agentRow = (x, y, w, ns, hh, oneLine, under) => { const nw = nameW(ns), pw = phoneW(ns);
      let des = !!desT, bw = oneLine ? nw + desW + 16*k + pw : Math.max(nw + desW, pw); if(des && (under ? nw + desW + 14*k + pw > w : w - bw - 20*k < LOGO_MIN)){ des = false; bw = oneLine ? nw + 16*k + pw : Math.max(nw, pw); }
      if(under){ const th = ns*1.25, lh2 = hh - th - 7*k, lw2 = Math.min(w, nw + (des ? desW : 0) + 14*k + pw); return `<div class="abs" style="left:${x}pt;top:${y}pt;width:${w}pt;white-space:nowrap;line-height:${th}pt">${nameSpan(ns)}${des ? desSpan(ns) : ''}${phoneSpan(ns, 14*k)}</div>` + FXS.logo(D, x, y + th + 7*k, lw2, lh2, 'center'); }   // the logo sits centered under the agent's line: one block
      const th = oneLine ? ns*1.25 : ns*2.35, lx = x + bw + 20*k;
      return `<div class="abs" style="left:${x}pt;top:${y + (hh - th)/2}pt;width:${bw + 4}pt;white-space:nowrap">${oneLine ? `<div style="line-height:${ns*1.25}pt">${nameSpan(ns)}${des ? desSpan(ns) : ''}${phoneSpan(ns, 16*k)}</div>` : `<div style="line-height:${ns*1.25}pt">${nameSpan(ns)}${des ? desSpan(ns) : ''}</div><div style="line-height:${ns*1.1}pt">${phoneSpan(ns)}</div>`}</div>` + FXS.logo(D, lx, y, x + w - lx, hh, 'flex-end'); };
    const photoAt = (x, y, w, hh) => `<div class="abs" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${hh}pt">${SW.photo(D, pid, 'position:absolute;inset:0', 'front.hero')}</div>`;
    const cq = 'Thinking about selling?';

    if(!sold){
      // ---------- JUST LISTED: the house bleeds off three edges; the closed frame holds the words beside it (or under it) ----------
      // final pass: the photo breaks OUT of the frame. It bleeds off the top and the outer edge and stops short of the frame's foot (side
      // layout) or its right edge (stacked layout), so the frame shows a whole corner past the photo and plainly runs behind it.
      const PB = H - FRI - 26, SR = W - FRI - 30;   // photo foot (side) / photo right edge (stacked)
      let PW = big ? 440 : 344; while(PW < W*(big ? 0.66 : 0.62) && !SW.fits(D, pid, PW + 9, PB + 9)) PW += 6;
      const stacked = !SW.fits(D, pid, PW + 9, PB + 9); let SH = big ? 236 : 226; while(stacked && SH < H*0.7 && !SW.fits(D, pid, SR + 9, SH + 9)) SH += 4;
      if(stacked){
        // a wide house runs across the top; the framed band under it has two columns: the status as large as its column allows over the agent
        // and the logo, and the place, the street, the facts and the highlights beside them
        const TX0 = FRI + 18, TX1 = W - FRI - 18, TW = TX1 - TX0;
        h += photoAt(-9, -9, SR + 9, SH + 9) + TF.glow('bottom', -9, SH, SR + 9);
        const y0 = SH + 20, yB = H - FRI - 11, bh = yB - y0, cW = Math.round(TW*0.55), cR = TX0 + cW + 28, rW = TX1 - cR, ah = Math.min(30*k, bh*0.3), ay = yB - ah;
        const room = ay - 12 - y0, ls = Math.max(22, Math.min(FXS.fitSize(word.toUpperCase(), tenor, cW - 2, 56*k, 22), room/1.04)), sy = y0 + Math.max(0, (room - ls*1.04)/2) - 2;
        h += status(word, TX0, sy, cW, ls, 'front.status') + `<div class="tf-hair" style="left:${TX0}pt;top:${ay - 7}pt;width:${cW}pt"></div>` + agentRow(TX0, ay, cW, 14.5*k, ah, true);
        h += `<div class="tf-vhair" style="left:${cR - 14}pt;top:${y0 + 2}pt;height:${bh - 2}pt"></div>`;
        let y = y0 - 1; h += eyebrow(cR, y, rW); y += 13*k;
        const as = FXS.fitSize(ad, "font-family:Spectral;font-weight:500", rW, 23*k, 13); h += serif(ad, cR, y, rW, as, 'front.address'); y += as*1.25 + 1;
        h += factsLine(cR, y, rW); y += 14*k + 4*k;
        const rh0 = 16*k, nT = Math.max(0, Math.min(3, Math.floor((yB - y)/rh0))), tg = tags(rW).slice(0, nT), rh = tg.length ? Math.min(19*k, (yB - y)/tg.length) : rh0; tg.forEach((t, i) => { h += hl(t, i, cR, y + i*rh, rW, rh); });
        h += TF.frame(FRI, FRI, W - FRI, H - FRI, 1.1);   // the photo crosses the frame: it stops short of the photo and resumes under it
      } else {
        const PX = W - PW, TX0 = FRI + 16, TX1 = PX - 24, TW = TX1 - TX0;
        h += photoAt(PX, -9, PW + 9, PB + 9) + TF.glow('left', PX, -9, PB + 9);
        const nsF = 17*k, under = footStacks(TW, nsF), fy = H - FRI - 9 - (under ? 62 : 38)*k, parts = []; let y = FRI + 16;
        parts.push(eyebrow(TX0, y, TW)); y += 15*k;
        const ls = Math.min(FXS.fitSize('LISTED', tenor, TW - 2, 76*k, 30), 84);
        parts.push(status('Just', TX0, y, TW, ls, 'front.status') + status('Listed', TX0, y + ls*1.04, TW, ls, 'front.status2')); y += 2*ls*1.04 + 9;
        parts.push(`<div class="tf-rule" style="left:${TX0}pt;top:${y}pt;width:${64*k}pt"></div>`); y += 10*k;
        const as = FXS.fitSize(ad, "font-family:Spectral;font-weight:500", TW, 25*k, 15); parts.push(serif(ad, TX0, y, TW, as, 'front.address')); y += as*1.25 + 3;
        parts.push(factsLine(TX0, y, TW)); y += 14*k + 13*k;
        const rh = 19*k, nT = Math.max(2, Math.min(3, Math.floor((fy - 16 - y)/rh)));
        tags(TW).slice(0, nT).forEach((t, i) => { parts.push(hl(t, i, TX0, y, TW, rh)); y += rh; });
        h += `<div class="abs" id="lock" data-bottom="${y}" data-foot="${fy - 8}" style="left:0;top:0;width:0;height:0">${parts.join('')}</div>`;
        h += `<div class="tf-hair" style="left:${TX0}pt;top:${fy - 8}pt;width:${TW}pt"></div>` + agentRow(TX0, fy, TW, under ? Math.min(nsF, 16*k) : nsF, H - FRI - 9 - fy, false, under);
        h += TF.frame(FRI, FRI, W - FRI, H - FRI, 1.1);   // the photo crosses the frame
      }
    } else {
      // ---------- JUST SOLD: its own card, not the Just Listed front mirrored. The house is a picture set wholly inside the closed frame;
      // the words are centered on their own axis: JUST SOLD on one line (about twice the agent's name), the street right under it,
      // the question, the note in the set's panel sized to its text, then the agent over the logo. No house features. ----------
      const PT = big ? 46 : 40; let PWi = big ? 388 : 312; while(PWi < W*0.58 && !SW.fits(D, pid, PWi + 9, H - 2*PT)) PWi += 6;
      const side = SW.fits(D, pid, PWi + 9, H - 2*PT);
      if(side){
