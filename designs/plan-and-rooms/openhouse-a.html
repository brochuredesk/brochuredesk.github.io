<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Plan and the Rooms open house flyer</title>
<link rel="stylesheet" href="plan-and-rooms.css">
<link rel="stylesheet" href="plan-and-rooms-cards.css">
<script src="../engine/baths.js"></script>
<script src="plan-and-rooms.js"></script>
<script src="plan-and-rooms-cards.js"></script>
<script src="../engine/agentcard.js"></script>
<!--
  The Plan and the Rooms · Open House flyer "The Rooms, Sized" (trim 612 x 792 pt; print: 0.25 in white margin around the paper field).
  White paper, crimson small caps, condensed sans titles over a hairline, as the fold-over. The event leads: the label (22 pt crimson small
  caps), the date as the largest type on the page, the time at 22 pt, the broker / REALTOR(R) lines (only on those opens, only when filled)
  beside it, the refreshments line in a white box. Then the whole house, the address with city, state and ZIP and the four facts, and
  the set's signature: one captioned room beside the full room-dimension list (room left, size in crimson right, a hairline between rows),
  every size exactly as the listing gives it, one per room. The standard contact card closes the page and carries its one brokerage logo.
  Open House rules: no RSVP, no QR, no price. Copy: data.copy.pc.oh.
-->
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = CN.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="color:#000;padding:20pt">No data injected.</p>'; return; }
  const esc = CN.esc, L = D.listing, PC = ((D.copy || {}).pc || {}), OHC = PC.oh || {};
  const issues = await CN.fontsReady(D);
  const O = CN.openHouse(D);
  const X = 36, W = 540;
  let h = '';

  // the event
  h += `<div class="abs oh-lbl" style="left:${X}pt;top:24pt;width:${W}pt;height:26pt" data-slot="oh.label" data-lines="1">${esc(O.label)}</div>`;
  if(O.weekday) h += `<div class="abs oh-date" id="date" style="left:${X-1}pt;top:50pt;width:${W}pt;height:52pt;font-size:44pt;line-height:52pt" data-slot="oh.date" data-lines="1">${esc(O.long)}</div>`;
  else h += `<div class="abs oh-date" style="left:${X}pt;top:50pt;width:${W}pt;height:52pt;font-size:30pt;line-height:26pt;white-space:normal" data-slot="oh.date" data-lines="2">${esc(O.long)}</div>`;
  h += `<div class="abs oh-time" style="left:${X}pt;top:100pt;width:300pt;height:30pt" data-slot="oh.time" data-lines="1">${esc(O.time)}</div>`;
  let dy = 0;
  { const ls = [[O.note, 'oh.note', 'oh-strong'], [O.refreshments, 'oh.refreshments', 'oh-note oh-box']].filter(l => l[0]);
    if(ls.length){
      const lh = 14, w = 268, pad = 6;
      const ks = ls.map(l => CN.linesNeeded(l[2].includes('oh-box') ? 'oh-note' : l[2], l[0], l[2].includes('oh-box') ? w - 16 : w, lh));
      const hs = ks.map((k, i) => k*lh + (ls[i][2].includes('oh-box') ? 8 : 0));
      const tot = hs.reduce((a, c) => a + c, 0) + pad*(ls.length - 1);
      dy = Math.max(0, tot - 30);
      let at = 130 + dy - tot;
      ls.forEach((l, i) => { h += `<div class="abs ${l[2]}" style="left:308pt;top:${at}pt;width:${w}pt;height:${hs[i]}pt;white-space:normal;text-align:right" data-slot="${l[1]}" data-lines="${ks[i]}">${esc(l[0])}</div>`; at += hs[i] + pad; });
    } }
  h += `<div class="hrule" style="top:${136 + dy}pt;left:${X}pt;right:${X}pt"></div>`;

  // the house, whole, then the address, the place and the four facts
  const hero = (OHC.photos || [])[0] || 'front';
  h += CN.photo(D, hero, `position:absolute;left:${X}pt;top:${144 + dy}pt;width:${W}pt;height:254pt`, 'oh.hero');
  const T = 404 + dy;
  h += `<div class="abs dsp" id="addr" style="left:${X-1}pt;top:${T}pt;width:340pt;height:40pt;font-size:30pt;line-height:40pt" data-slot="address" data-lines="1">${esc(L.address)}</div>`;
  h += `<div class="abs kicker" style="left:${X}pt;top:${T + 44}pt;width:340pt;height:12pt" data-slot="place" data-lines="1">${esc(CN.placeZip(L).toUpperCase())}</div>`;
  const bn = BD.bathNum(L);
  const n0 = v => v == null ? '' : Number(v).toLocaleString('en-US');
  const cells = [[L.beds, 'Bedrooms'], [bn.num, bn.label, bn.half], [n0(L.sqft), 'Square Feet'], [L.yearBuilt || L.year, 'Year Built']];
  h += `<div class="abs fcol" style="left:396pt;top:${T - 2}pt;width:180pt;height:66pt;display:grid;grid-template-columns:1fr 1fr;column-gap:14pt">${cells.map((c, i) => `<div style="border-top:.7pt solid var(--line);padding-top:3pt"><div class="dsp" style="font-size:15pt;line-height:17pt" data-slot="oh.fact${i}.v" data-lines="1">${i === 1 ? c[0] : esc(c[0])}</div><div style="font:600 8pt/10pt var(--font-body);letter-spacing:1.2pt;text-transform:uppercase;color:var(--crimson);white-space:nowrap;overflow:hidden" data-slot="oh.fact${i}.l" data-lines="1">${esc(c[1])}</div>${c[2] ? `<div style="font:600 8pt/10pt var(--font-body);letter-spacing:1.2pt;text-transform:uppercase;color:var(--crimson);white-space:nowrap;overflow:hidden" data-slot="oh.fact${i}.x" data-lines="1">${esc(c[2])}</div>` : ''}</div>`).join('')}</div>`;
  h += `<div class="hrule" style="top:${T + 66}pt;left:${X}pt;right:${X}pt"></div>`;

  // the house in a write-up (most of the space), the room sizes in a small block beside it, and one room photo above the block when there is height for it
  const rt = T + 72, rh = 656 - rt, list = OHC.list || [], rows = OHC.rows || [], bw = 172, gx = 26, tw = W - bw - gx, bx = X + W - bw;
  const bh = Math.min(rh, 15 + list.length * 28), phH = rh - bh - 12;
  h += `<div class="abs oh-write" style="left:${X}pt;top:${rt}pt;width:${tw}pt;height:${rh}pt"><div class="a" id="ohw" data-slot="oh.write" data-para="1" data-min="2">${esc(OHC.write || '')}</div></div>`;
  if(phH >= 70 && rows[0]) h += CN.photo(D, rows[0].photo, `position:absolute;left:${bx}pt;top:${rt}pt;width:${bw}pt;height:${phH}pt`, 'oh.room0');
  h += CN.roomList(bx, rt + (phH >= 70 ? rh - bh : 0), bw, bh, list, OHC.listLabel || 'Room dimensions', 'oh.list');

  h += CN.cardBox(D, [X, 664, W, 92], {layout: 'panel'});
  h += `<div class="abs fine" style="left:${X}pt;top:764pt;width:${W}pt;height:8pt;white-space:nowrap;font-size:6pt;line-height:8pt;color:var(--muted)" data-slot="fineprint" data-lines="1" data-fine="1">${esc(PC.fineprint || 'Information deemed reliable but not guaranteed.')}</div>`;

  const f = CN.sframe(D, 612, 792, h);
  document.getElementById('pages').innerHTML = f.html;
  window.pieceSize = {W: f.W, H: f.H, bleed: f.bleed};
  await CN.settle();
  CN.fitLine(document.getElementById('date'), 30);
  CN.fitLine(document.getElementById('addr'), 22);
  issues.push(...CN.fitHouse(D));
  { const el = document.getElementById('ohw'), maxH = el.parentElement.clientHeight; let best = 9.5;   // the write-up takes the biggest size that fits and leaves its last line well filled
    for(let fs = 12; fs >= 9; fs -= 0.25){ el.style.fontSize = fs + 'pt'; el.style.lineHeight = (fs * 1.5) + 'pt'; if(el.scrollHeight > maxH + 0.5) continue; CN.balance(el);
      const ls = CN.lineBoxes(el), last = ls[ls.length - 1]; if(ls.length > 1 && (last.r - last.l)/el.getBoundingClientRect().width < .78) continue; best = fs; break; }
    el.style.fontSize = best + 'pt'; el.style.lineHeight = (best * 1.5) + 'pt'; CN.balance(el);
    for(let lh = 1.5; lh <= 1.8; lh += 0.01){ el.style.lineHeight = (best * lh) + 'pt'; if(el.scrollHeight > maxH - 2){ el.style.lineHeight = (best * (lh - 0.01)) + 'pt'; break; } } }
  ContactCard.fit(document);
  window.photoPlacements = CN.placements;
  window.brochureCheck = () => CN.checkSingle(D, issues);
})();
</script>
</body>
</html>
