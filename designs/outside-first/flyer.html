<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · Outside First two-sided flyer</title>
<link rel="stylesheet" href="outside-first.css">
<link rel="stylesheet" href="outside-first-cards.css">
<script src="outside-first.js"></script>
<script src="outside-first-cards.js"></script>
<script src="../engine/baths.js"></script>
<!--
  Outside First · two-sided 8.5 x 11 listing flyer (trim 612 x 792 pt, 18 pt white margin in print). data.piece.side =
  "front" | "back". Same family as the fold-over: warm cream field, Space Grotesk and Source Sans 3, copper kickers and
  rules, the tan band with the red claim, the outdoor spaces first. Rules (product.md, two-sided flyer rules 10/28 and the
  owner's Round 4 review 11/1/2026): one brokerage logo per side (the shared Right panel card carries it); the front
  shows the whole house; backs carry as much real detail as fits, no blank space; no price, no QR code, no photo numbers;
  room sizes in feet only (18' x 12'); the half bath's 1/2 at full size (BD.baths); text fills its box and runs edge to
  edge with the photos and rules around it; the details grid shows a fifth line (lot size) when the listing has one,
  otherwise its four lines grow to fill the space.

  FRONT   Whole-house photo across the top (the house stays in frame; it takes the height the rest leaves it), then
          left: place, address, a copper rule and the write-up; right: the details grid; three captioned outdoor
          photos; the agent card at the bottom.
  BACK    With a plan (data.plan): header, the agent's own plan at one scale (never redrawn) with Nearby and one
          photo beside it, reading note, the tan band, a row of three captioned rooms, the card.
          Without a plan: floor-by-floor room lists in place of the plan, a Nearby strip, the band, the row, the card.

  Copy: data.companion.flyer = {
    front: {kicker, photo: id (whole house), intro: [sentence | [short, long], ...],
            caps: [{id, name, tag, text: [sentence | [short, long], ...]} x3]},
    back:  {kicker, title, plan: {head, note: [..]}, floors: [{text: [..]} per floor, noplan],
            nearby: [{d, u, p}], photo: {id, name, tag, text}, band: {big, small: [..], head, items: [..]},
            row: [{id, name, tag, text} x3], fine}}
  Anything missing falls back to the fold-over's copy (data.copy).
-->
<style>
  .fl-addr2{font:700 28pt/34pt var(--font-display);letter-spacing:-.3pt;color:var(--ink);white-space:nowrap;overflow:hidden}
  .gr{position:absolute}
  .gr .r{position:absolute;left:0;right:0;display:flex;justify-content:space-between;align-items:center;border-top:.7pt solid var(--line)}
  .gr .r:first-child{border-top:1.4pt solid var(--accent)}
  .gr .l{font:600 9pt/12pt var(--font-display);letter-spacing:.9pt;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  .gr .v{font:700 16pt/20pt var(--font-display);color:var(--ink);white-space:nowrap}
  .gr .end{position:absolute;left:0;right:0;height:.7pt;background:var(--line)}
  .nb .d{font:700 17pt/20pt var(--font-display);color:var(--accent);white-space:nowrap;overflow:hidden}
  .nb .d small{font:600 8pt/10pt var(--font-display);letter-spacing:1.1pt;text-transform:uppercase;margin-left:3pt}
  .nb .p{font:600 9pt/11pt var(--font-body);color:var(--ink);white-space:nowrap;overflow:hidden}
  .fb{position:absolute;border-top:1.4pt solid var(--accent);padding-top:5pt}
  .fb .n{font:700 40pt/40pt var(--font-display);color:var(--ink)}
  .fb .fl{font:700 8.5pt/12pt var(--font-display);letter-spacing:1.2pt;text-transform:uppercase;color:var(--accent);white-space:nowrap;overflow:hidden}
  .fb table{width:100%;border-collapse:collapse}
  .fb table{border-bottom:.5pt solid var(--line)}
  .fb td{font-size:9.5pt;line-height:11pt;border-top:.5pt solid var(--line);color:var(--text);white-space:nowrap;vertical-align:middle}
  .fb td:first-child{font-weight:600;color:var(--ink);overflow:hidden}
  .fb td:last-child{text-align:right;font-variant-numeric:tabular-nums}
  .fb-h{font:700 8.5pt/12pt var(--font-display);letter-spacing:1.3pt;text-transform:uppercase;color:var(--accent)}
  .bandx{position:absolute;background:var(--band);display:flex;align-items:stretch}
  .bandx .big{font:700 20pt/24pt var(--font-display);letter-spacing:.2pt;color:var(--hot);text-transform:uppercase;white-space:nowrap;overflow:hidden}
  .bandx .sm{font-size:8.5pt;line-height:11pt;color:var(--text);overflow:hidden}
  .bandx .grid{display:grid;grid-auto-flow:column;gap:3pt 16pt}
  .bandx .grid div{font:600 9pt/12pt var(--font-body);color:var(--ink);white-space:nowrap;overflow:hidden;padding-left:9pt;position:relative}
  .bandx .grid div:before{content:"";position:absolute;left:0;top:4pt;width:4pt;height:4pt;background:var(--accent)}
  .hair2{position:absolute;height:.7pt;background:var(--line)}
</style>
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = OF.data(), esc = OF.esc;
  await OFC.boot(D, () => {
    const L = D.listing || {}, C = D.copy || {}, FL = (D.companion || {}).flyer || {}, P = D.photos || {};
    const side = (D.piece || {}).side === 'back' ? 'back' : 'front';
    const hasPlan = !!(D.plan && D.plan.levels && D.plan.levels.length);
    const m = OFC.metrics(D), W = 612, H = 792, I = m.inset, X0 = 36, CW = 540, issues = [];
    const BODY = 'font-size:10.5pt;line-height:14pt', CAPS = 'font-size:8.5pt;line-height:11pt';

    // ---------- copy helpers ----------
    // room sizes in feet only, inches dropped and never rounded (owner Round 4, 11/1/2026): 18' x 12'
    const feetOnly = t => String(t == null ? '' : t).replace(/(\d+)(?:\.\d+)?(?:'\s?\d+(?:\.\d+)?"?)?'?\s*x\s*(\d+)(?:\.\d+)?(?:'\s?\d+(?:\.\d+)?"?)?'?/g, "$1' x $2'");
    const split = s => (feetOnly(s).match(/[^.!?]+[.!?]+["”’)]*|[^.!?]+$/g) || []).map(x => x.trim()).filter(Boolean);
    const beats = x => x == null ? [] : Array.isArray(x) ? x.map(b => Array.isArray(b) ? b.map(feetOnly) : feetOnly(b)) : split(x);
    const firstOf = b => [].concat(b)[0];
    // the smallest of the candidate line counts that every box in the list can fill (last line 3/4 full)
    const commonN = (lists, w, style, ns) => { for(const n of ns){ if(lists.every(b => OFC.pickN(b, w, style, [n]))) return n; } return null; };
    const grab = (id, i) => (id && P[id]) ? id : null;

    // ---------- the details grid ----------
    const num = v => Number(v).toLocaleString('en-US');
    const gridRows = () => {
      const r = [], bn = BD.bathNum(L);
      if(L.beds) r.push(['Bedrooms', String(L.beds)]);
      if(L.baths || L.halfBaths) r.push([bn.label, bn.num]);
      if(bn.half) r.push(['Half baths', bn.half.replace(/\D+/g, '')]);
      if(L.sqft) r.push(['Living area', `${num(L.sqft)} sq ft`]);
      const lot = String(L.lotSize || L.lot_size || '').replace(/\s*lot$/i, '').replace(/Sq Ft/i, 'sq ft');
      if(L.stories && r.length < (lot ? 4 : 5)) r.push(['Stories', String(L.stories)]);
      if(lot && r.length < 5) r.push(['Lot size', lot]);
      return r.slice(0, 5);
    };

    // ---------- shared pieces ----------
    const fine = (side === 'back' && hasPlan ? 'Information deemed reliable but not guaranteed. Room sizes are approximate, from the listing\'s floor plan.' : 'Information deemed reliable but not guaranteed.');
    const cardAndFine = txt => OFC.card(D, [X0, 652, CW, 104], {layout: 'panel'}) +
      `<div class="copper-rule" style="left:${X0}pt;width:${CW}pt;top:646pt"></div>` +
      `<div class="abs fl-fine" style="left:${X0}pt;top:760pt;width:${CW}pt" data-slot="fineprint" data-lines="1" data-fine="1">${esc(txt || fine)}</div>`;
    // a captioned row: photos of one height, captions of one line count
    const capRow = (items, slot, x, y, w, n, ph, gap) => {
      const cw = (w - gap*(items.length - 1))/items.length; let h = '';
      items.forEach((c, i) => { const cx = x + i*(cw + gap);
        h += OFC.photo(D, c.id, cx, y, cw, ph) + OFC.cap(c, `${slot}${i}`, cx, y + ph + 6, cw, n, beats(c.text)); });
      return h;
    };
    // the tan band with the red claim (same as the fold-over's back)
    const band = (B, y, h) => {
      const items = (B.items || []).slice(0, 6), rows = Math.ceil(items.length/2), lw = 232, sw = lw - 30, sb = beats(B.small);
      const ok = [3, 2, 4].find(n => OFC.pickN(sb, sw, CAPS, [n])) || 3;
      return `<div class="bandx" style="left:${X0}pt;top:${y}pt;width:${CW}pt;height:${h}pt">
        <div class="abs big" style="left:16pt;top:9pt;width:${sw}pt;height:24pt" data-slot="back.band.big" data-lines="1">${esc(B.big)}</div>
        ${OFC.para('back.band.small', sb, 16, 37, sw, ok, 8.5, 11)}
        <div style="margin-left:${lw}pt;width:.7pt;background:rgba(31,43,44,.25);margin-top:10pt;margin-bottom:10pt;flex:none"></div>
        <div style="flex:1;padding:9pt 14pt 0 18pt;min-width:0"><div class="kick" style="height:10pt;margin-bottom:5pt" data-slot="back.band.head" data-lines="1">${esc(B.head)}</div>
          <div class="grid" style="grid-template-rows:repeat(${rows},auto)">${items.map((t, i) => `<div data-slot="back.band.item${i}" data-lines="1">${esc(t)}</div>`).join('')}</div></div></div>`;
    };
    const nearbyHTML = (list, x, y, w, pitch, horizontal) => {
      const a = (list || []).slice(0, 3);
      return a.map((q, i) => { const px = horizontal ? x + i*(w/3) : x, py = horizontal ? y : y + i*pitch;
        return `<div class="abs nb" style="left:${px}pt;top:${py}pt;width:${horizontal ? w/3 - 10 : w}pt;height:${pitch - 2}pt"><div class="d" data-slot="back.near${i}.d" data-lines="1">${esc(q.d)}${q.u === '' ? '' : `<small>${esc(q.u || 'miles')}</small>`}</div><div class="p" data-slot="back.near${i}.p" data-lines="1">${esc(q.p)}</div></div>`; }).join('');
    };

    let h = '', after = () => {};

    // ======================================= FRONT =======================================
    if(side === 'front'){
      const K = FL.front || {}, CF = C.front || {};
      const heroId = grab(K.photo) || grab(CF.photo) || Object.keys(P)[0];
      const capsSrc = (K.caps && K.caps.length ? K.caps : (CF.caps || []).map(c => ({id: c.id, name: c.name, tag: c.tag, text: split(c.text)}))).slice(0, 3);
      const introB = beats(K.intro || CF.intro);
      const rows = gridRows();
      const LW = 330, GX = X0 + LW + 24, GW = X0 + CW - GX;
      // the hero: a whole-house photo across the field; it takes the height the rest leaves it, never less than the house needs
      const hp = P[heroId] || {}, hw = W - 2*I, ap = (hp.w && hp.h) ? hp.w/hp.h : 1.5, bx = hp.box;
      const heroMin = Math.max(258, bx ? Math.ceil(hw*((bx[3] - bx[1]) + 0.035)/ap) : 0);
      // pick the photo row's height and the write-up's line count from the room the hero needs
      let pick = null;
      outer: for(const ph of [104, 98, 92, 86, 80]){
        const capN = commonN(capsSrc.map(c => beats(c.text)), (CW - 28)/3, CAPS, [3, 4, 2]) || 3;
        const capH = 12 + capN*11, rowTop = 640 - capH - 6 - ph, blockBottom = rowTop - 14;
        for(const n of [6, 5, 7, 4, 8]){
          const blockH = 62 + n*14, heroH = blockBottom - blockH - 14 - 14 - I;
          if(heroH >= heroMin && OFC.pickN(introB, LW, BODY, [n])){ pick = {ph, capN, capH, rowTop, n, blockH, blockBottom, heroH}; break outer; }
        }
      }
      if(!pick){ const ph = 80, capN = 3, capH = 45, rowTop = 640 - capH - 6 - ph, n = 4, blockH = 62 + n*14, blockBottom = rowTop - 14; pick = {ph, capN, capH, rowTop, n, blockH, blockBottom, heroH: blockBottom - blockH - 28 - I}; }
      const hh = pick.heroH;
      // keep the house centered in the frame (the roof is never lost)
      if(bx && hp.w){ const af = hw/hh, v = Math.min(1, ap/af); if(v < 1){ const cy = (bx[1] + bx[3])/2, y0 = Math.min(Math.max(cy - v/2, 0), 1 - v); P[heroId].focusY = +(y0/(1 - v)*100).toFixed(1); } }
      h += OFC.photo(D, heroId, I, I, hw, hh);
      const by = I + hh + 14;                                    // the block under the hero
      h += `<div class="abs fl-place" style="left:${X0}pt;top:${by}pt;width:${LW}pt;height:12pt" data-slot="front.kicker" data-lines="1">${esc(K.kicker || OFC.placeZip(L))}</div>`;
      h += `<div class="abs fl-addr2" style="left:${X0}pt;top:${by + 14}pt;width:${LW}pt;height:34pt" data-slot="address" data-lines="1">${esc(L.address)}</div>`;
      h += `<div class="copper-rule" style="left:${X0}pt;width:${LW}pt;top:${by + 54}pt"></div>`;
      h += OFC.para('front.about', introB, X0, by + 62, LW, pick.n, 10.5, 14, 'color:var(--text)');
      // the details grid: rows share the block's height (four lines grow to fill it; a fifth line is lot size)
      const gh = pick.blockH - 4, rh = gh/rows.length;
      h += `<div class="gr" style="left:${GX}pt;top:${by + 4}pt;width:${GW}pt;height:${gh}pt">` +
        rows.map((r, i) => `<div class="r" style="top:${(i*rh).toFixed(2)}pt;height:${rh.toFixed(2)}pt"><span class="l" data-slot="front.grid${i}.l" data-lines="1">${esc(r[0])}</span><span class="v" data-slot="front.grid${i}.v" data-lines="1">${r[1]}</span></div>`).join('') +
        `<div class="end" style="top:${gh}pt"></div></div>`;
      // three captioned outdoor photos
      h += capRow(capsSrc, 'front.cap', X0, pick.rowTop, CW, pick.capN, pick.ph, 14);
      h += cardAndFine();
      after = () => OFC.fitWidth('.fl-addr2', 20);
    }

    // ======================================= BACK =======================================
    else {
      const B = FL.back || {}, CB = C.back || {};
      const kicker = (!hasPlan && (B.noplan || {}).kicker) || B.kicker || CB.kicker || '', title = B.title || CB.title || '';
      h += `<div class="abs kick" style="left:${X0}pt;top:${I + 14}pt;width:${CW}pt;height:10pt" data-slot="back.kicker" data-lines="1">${esc(kicker)}</div>`;
      h += `<div class="abs title one" style="left:${X0}pt;top:${I + 24}pt;width:${CW}pt;height:32pt" data-slot="back.title" data-lines="1">${esc(title)}</div>`;
      h += OF.rule(X0, I + 62, CW);
      const TOP = I + 74;
      // from the bottom: card, row of three captioned rooms, the band, then the plan (or floors) takes what is left
      const rowSrc = (B.row && B.row.length ? B.row : (C.bottom ? [].concat(...(C.bottom.groups || []).map(g => g.items || [])).slice(0, 3).map(it => ({id: it.id, name: it.name, tag: it.tag, text: split(it.text)})) : [])).slice(0, 3);
      const nearby = B.nearby || CB.nearby || [];
      const phSrc = B.photo || (CB.photo ? Object.assign({}, CB.photo, {text: split(CB.photo.text)}) : null);
      const bandSrc = Object.assign({}, CB.band || {}, B.band || {});
      const bandH = 80, rowN = commonN(rowSrc.map(c => beats(c.text)), (CW - 28)/3, CAPS, [3, 4, 2]) || 3;
      let rowPh = 92, rowTop = 640 - (12 + rowN*11) - 6 - rowPh, bandTop = rowTop - 12 - bandH;
      const emitBottom = () => band(bandSrc, bandTop, bandH) + capRow(rowSrc, 'back.row', X0, rowTop, CW, rowN, rowPh, 14);
      if(hasPlan){
        const PL = B.plan || {}, noteSrc = beats(PL.note || CB.planNote);
        const noteN = 2, noteTop = bandTop - 10 - (12 + noteN*11), planBottom = noteTop - 8, AH = bandTop - 10 - TOP;
        const probe = OF.plan(D, {x: X0, y: TOP, w: 384, h: planBottom - TOP});
        const wide = !!(probe.used && probe.used.h < 0.78*(planBottom - TOP));
        if(!wide){
          // the plan at one scale on the left; Nearby and one photo in a column beside it
          const PW = 384, RX = X0 + PW + 18, RW = X0 + CW - RX;
          issues.push(...probe.issues); h += probe.html;
          h += `<div class="abs fb-h" style="left:${X0}pt;top:${noteTop}pt;width:${PW}pt;height:12pt;white-space:nowrap" data-slot="back.planhead" data-lines="1">${esc(PL.head || 'Reading the plan')}</div>`;
          h += OFC.para('back.plannote', noteSrc, X0, noteTop + 12, PW, noteN, 8.5, 11, 'color:var(--text)');
          h += OF.kick('Nearby', 'back.nearhead', RX, TOP, RW);
          h += nearbyHTML(nearby, RX, TOP + 14, RW, 36, false);
          const nbEnd = TOP + 14 + 36*Math.min(3, nearby.length) + 4;
          if(phSrc){
            const cn = [4, 3, 5].find(n => OFC.pickN(beats(phSrc.text), RW, CAPS, [n])) || 4, capH = 12 + cn*11, py = nbEnd, phh = noteTop + 12 + noteN*11 - capH - 6 - py;
            h += OFC.photo(D, phSrc.id, RX, py, RW, phh) + OFC.cap(phSrc, 'back.photo', RX, py + phh + 6, RW, cn, beats(phSrc.text));
          }
        } else {
          // a wide plan (one story): it stands upright at the left, and the column beside it holds Nearby, the photo and the note
          const PW = 170, RX = X0 + PW + 22, RW = X0 + CW - RX, noteN2 = 3, nTop = TOP + AH - (12 + noteN2*11);
          const pl = OF.plan(D, {x: X0, y: TOP, w: PW, h: AH}); issues.push(...pl.issues); h += pl.html;
          h += OF.kick('Nearby', 'back.nearhead', RX, TOP, RW);
          h += nearbyHTML(nearby, RX, TOP + 14, RW, 36, true);
          h += `<div class="abs fb-h" style="left:${RX}pt;top:${nTop}pt;width:${RW}pt;height:12pt;white-space:nowrap" data-slot="back.planhead" data-lines="1">${esc(PL.head || 'Reading the plan')}</div>`;
          h += OFC.para('back.plannote', noteSrc, RX, nTop + 12, RW, noteN2, 8.5, 11, 'color:var(--text)');
          if(phSrc){
            const cn = [2, 3, 1].find(n => OFC.pickN(beats(phSrc.text), RW, CAPS, [n])) || 2, capH = 12 + cn*11, py = TOP + 58, phh = nTop - 8 - capH - 6 - py;
            h += OFC.photo(D, phSrc.id, RX, py, RW, phh) + OFC.cap(phSrc, 'back.photo', RX, py + phh + 6, RW, cn, beats(phSrc.text));
          }
        }
        h += emitBottom();
      } else {
        // no plan: floor-by-floor room lists, then a Nearby strip, the band and the row of rooms
        const FLR = (C.back && C.back.floors) || [], FW = ((B.noplan || {}).floors || B.floors || []);
        const nF = FLR.length || 1, G = 18, cw = (CW - G*(nF - 1))/nF, head = 5 + 40 + 2 + 12 + 8, P0 = 22, st = 'font-size:10pt;line-height:14pt';
        const PAGE_FLOORS = (640 - TOP - (38 + 12 + bandH + 12 + (12 + rowN*11) + 6) - 12) - 80;   // the tallest the floors block may be
        const cols = FLR.map((f, i) => { const rooms = f.rooms || [], twoCol = nF === 1, rn = twoCol ? Math.ceil(rooms.length/2) : rooms.length, lw = twoCol ? 250 : cw;
          const src = beats((FW[i] || {}).text || f.text);
          const cap = Math.floor((twoCol ? PAGE_FLOORS - head : PAGE_FLOORS - head - 6 - rn*P0)/14);
          let nfit = 2; for(let c = Math.min(14, cap); c >= 2; c--){ if(OFC.pickN(src, lw, st, [c])){ nfit = c; break; } }
          return {f, i, rooms, twoCol, rn, lw, src, nfit}; });
        // the block is as tall as the longest column needs; the rest of the page's height goes to the row of photos
        const nat = Math.max(...cols.map(c => c.twoCol ? head + c.nfit*14 : head + 6 + c.nfit*14 + c.rn*P0));
        const total = 640 - TOP - (38 + 12 + bandH + 12 + (12 + rowN*11) + 6) - 12;     // floors + photo row share this
        const Ht = Math.max(nat, total - 140), Hs = Math.min(Ht, total - 80);
        const Hf = Math.max(Hs, nat);
        rowPh = Math.max(80, Math.min(160, total - Hf)); rowTop = 640 - (12 + rowN*11) - 6 - rowPh; bandTop = rowTop - 12 - bandH;
        const nbY = bandTop - 12 - 38;
        h += OF.kick('Nearby', 'back.nearhead', X0, nbY - 2, 90);
        h += nearbyHTML(nearby, X0 + 74, nbY, CW - 74, 38, true);
        cols.forEach(c => {
          const {f, i, rooms, twoCol, rn, lw, src} = c, x = X0 + i*(cw + G);
          let n = 2; const nmax = twoCol ? Math.floor((Hf - head)/14) : Math.floor((Hf - head - 6 - rn*P0)/14);
          for(let k = nmax; k >= 2; k--){ if(OFC.pickN(src, lw, st, [k])){ n = k; break; } }
          const pitch = twoCol ? (Hf - head)/rn : 22;
          const tbl = rr => `<table>${rr.map((r, j) => `<tr style="height:${pitch.toFixed(2)}pt"><td data-slot="back.floor${i}.room${j}" data-lines="1"${r[1] ? '' : ' colspan="2" style="text-align:left"'}>${esc(r[0])}</td>${r[1] ? `<td data-slot="back.floor${i}.size${j}" data-lines="1">${esc(feetOnly(r[1]))}</td>` : ''}</tr>`).join('')}</table>`;
          h += `<div class="fb" style="left:${x}pt;top:${TOP}pt;width:${cw}pt;height:${Hf}pt"><div class="n" data-slot="back.floor${i}.n" data-lines="1">${esc(f.n)}</div><div class="fl" data-slot="back.floor${i}.label" data-lines="1">${esc(f.label)}</div>`;
          const para = OFC.para(`back.floor${i}.text`, src, 0, 0, lw, n, 10, 14, 'position:relative;color:var(--text)').replace('class="abs body"', 'class="body"');
          if(twoCol){
            h += `<div style="position:absolute;left:0;top:${head}pt;width:${lw}pt">${para}</div><div style="position:absolute;left:${lw + 22}pt;top:${head}pt;width:${cw - lw - 22}pt">${tbl(rooms)}</div>`;
          } else {
            h += `<div style="margin-top:8pt">${para}</div><div style="position:absolute;left:0;right:0;bottom:0">${tbl(rooms)}</div>`;
          }
          h += '</div>';
        });
        h += emitBottom();
      }
      h += cardAndFine(B.fine);
    }
    return {html: OFC.frame(D, W, H, h), after, issues};
  });
})();
</script>
</body>
</html>
