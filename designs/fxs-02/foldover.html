<!doctype html>
<html lang="en">

<title>BrochureDesk · fxs-02 fold-over</title>
<link rel="stylesheet" href="fxs02.css">

<script src="fxs02.js"></script>
<script src="fxs02-tk.js"></script>
<script>window.Ivory = {esc: s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))};</script>
<script src="plan.js"></script>
<script src="../engine/baths.js"></script>
<script src="../engine/agentcard.js"></script>
<!--
  BrochureDesk · fxs-02 (FX02 look) · 11 x 17 fold-over: one sheet folded once down the middle into four upright 8.5 x 11 panels,
  0.125 in (9 pt) bleed, 0.25 in safe zone. Outside spread: back (left) + cover (right). Inside spread: left + right.
  Every panel keeps the FX02 hand (tokens: fxs02.css): the warm gray band down the left edge, Montserrat light over heavy, the round-left-end arch photo
  crossing the band, outline icons, hairlines, square photos, the black box with the round left end.
    COVER   the FX02 front grown: the kitchen arch with two more rooms under it, the number light over the heavy caps street, the icon fact grid,
            pin and place, the write-up, the whole house in its own frame, the agent and the one logo.
    BACK    the FX02 back: kicker and light/bold title, the plan (when there is one) or the photos, labeled floor sections, the nearby row, the standard agent card.
    LEFT    the front rooms: arch photo and two rooms with captions, then the black "what's new" box.
    RIGHT   bedrooms and baths: three rows of captioned photos, the one logo at the top.
  Copy comes as a lead plus whole sentences (data.sw.*); fxs02.js picks the sentences that fill each box (last line at least 3/4 full).
  Modes: proof = four panel pages 8.75 x 11.25 in; print = two spreads 17.25 x 11.25 in, each half clipped at the fold.
-->
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = SW.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const mode = D.mode || 'proof';
  const esc = SW.esc, L = D.listing, A = D.agent || {}, b = D.brand || {}, K = D.sw || {};
  // live listings (owner 11/8/2026): the order page and the print server name photos p0, p1... with a role (front, kitchen, yard...),
  // while this fold-over reads photos by room name (front, kitchen, yard: its photo plan, labels, outdoor page, same-room checks).
  // Each p-photo takes the sample name the order page filed it under (same picture), else a name from its role; ids in the copy follow.
  {
    const PH = D.photos || {}, isP = id => /^p\d+$/.test(id), srcOf = id => (PH[id] || {}).src;
    const ROLE_NAME = {front: 'front', street: 'front', side: 'front', aerial: 'front', back: 'yard', yard: 'yard', patio: 'patio', pool: 'patio',
      view: 'skyline', amenity: 'park', living: 'living', family: 'family', kitchen: 'kitchen', dining: 'dining', nook: 'nook', primary: 'primary',
      bedroom: 'bed', bath: 'bath', office: 'study', entry: 'foyer', stairs: 'stair', laundry: 'laundry', garage: 'garage', floorplan: 'plan', other: 'room'};
    const name = {}, taken = new Set(Object.keys(PH).filter(k => !isP(k)));
    Object.keys(PH).filter(isP).forEach(pid => {
      const alias = Object.keys(PH).find(k => !isP(k) && srcOf(k) && srcOf(k) === srcOf(pid) && !Object.values(name).includes(k));
      if(alias){ name[pid] = alias; return; }
      const base = ROLE_NAME[PH[pid].role] || String(PH[pid].role || 'room').replace(/[^a-z]/gi, '').toLowerCase() || 'room';
      let n = base, i = 2; while(taken.has(n)) n = base + i++;
      taken.add(n); name[pid] = n; PH[n] = PH[pid];
    });
    if(Object.keys(name).length){
      const ren = v => typeof v === 'string' ? (isP(v) && name[v] ? name[v] : v) : Array.isArray(v) ? v.map(ren) : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, ren(x)])) : v;
      Object.assign(K, ren(K));
      // per-photo copy written under a p-id (the writer's own copy) is filed under the name too
      const C = D.companion || {};
      [C.roomLines, (C.justListed || {}).captions, C.carousel].forEach(mp => { if(mp) Object.keys(mp).filter(k => isP(k) && name[k] && !(name[k] in mp)).forEach(k => { mp[name[k]] = mp[k]; }); });
    }
  }
  const issues = [];
  await SW.setup(D);
  // owner review r3 fixes (fold-over only, so the approved carousels keep their crops): the second bedroom shows its ceiling fan, the bar photo centers on the wine fridge
  if(D.photos && D.photos.bed2 && D.photos.bar){ D.photos.bed2.focusY = 0; D.photos.bar.crop = [0.06, 0.3, 0.58, 0.84]; }
  const hsSrc = A.headshot && ((D.photos||{})[A.headshot] ? D.photos[A.headshot].src : A.headshot) || '';
  const isHouse = id => !!((D.photos || {})[id] || {}).fullHouse;
  const sd = s => `data-s='${esc(JSON.stringify([].concat(s || []))).replace(/'/g,'&#39;')}'`;
  const LH = 14, CAPPAD = 5, X0 = 45, X1 = 585, CW = 540, C0 = 160.5, CWI = X1 - C0, BANDW = 'var(--fx-band-w)';
  // which photos the spread already uses, so a spare room can fill a gap without repeating
  const USED = new Set(), usedIds = USED;   // every photo placed anywhere on the fold-over so far (owner review r4: one photo, one place, all four panels)
  const LABELS = [[/^front/, 'Front.'], [/^entry/, 'Entry.'], [/^pergola/, 'Pergola.'], [/^deck/, 'Deck.'], [/^patio/, 'Patio.'], [/^evening/, 'Deck at dusk.'], [/^(fence|yard)/, 'Yard.'], [/^terrace/, 'Terrace.'], [/^balcony/, 'Balcony.'], [/^stair/, 'Stair.'], [/^foyer/, 'Foyer.'], [/^hall/, 'Hall.'], [/^bar/, 'Bar.'], [/^wine/, 'Living room.'], [/^kitchen/, 'Kitchen.'], [/^dining/, 'Dining area.'], [/^family/, 'Family room.'], [/^(living|openplan)/, 'Living room.'], [/^primary/, 'Primary suite.'], [/^pbath/, 'Primary bath.'], [/^bath/, 'Bath.'], [/^bed/, 'Bedroom.'], [/^closet/, 'Closet.'], [/^laundry/, 'Laundry.'], [/^game/, 'Game room.'], [/^park/, 'Community park.'], [/^gazebo/, 'Community park.']];
  const labelFor = id => { const m = LABELS.find(([re]) => re.test(id)); return m ? m[1] : (String(id).replace(/\d+[a-z]?$/, '').replace(/^./, c => c.toUpperCase()) + '.'); };
  const carExtra = id => { const C = D.companion || {}, out = []; ((C.carousel || {})[id] || []).forEach(t => { const m = /^[A-Z][A-Za-z' ,\-]+\. (.+)$/.exec(t); if(m) out.push(m[1]); }); return out; };
  const g5 = t => { const w = String(t).toLowerCase().match(/[a-z0-9]+/g) || []; const o = new Set(); for(let i = 0; i + 4 <= w.length; i++) o.add(w.slice(i, i + 4).join(' ')); return o; };   // no phrase of 4 words twice in a caption (the checker splits hyphens)
  const STOPW = new Set('a an the and of to from with in on at its it is are by for this that one two room'.split(' '));
  const sameFact = (a, b) => { const w = t => new Set((String(t).toLowerCase().match(/[a-z0-9']+/g) || []).filter(x => !STOPW.has(x))), wa = w(a), wb = w(b), small = Math.min(wa.size, wb.size); let c = 0; wa.forEach(x => { if(wb.has(x)) c++; }); return small > 0 && c/small >= (small <= 3 ? .5 : .6); };   // scripts/fxsets/carousel_copy.py same_fact
  const clean5 = list => { const out = []; list.forEach(x => { const t = [].concat(x)[0], gs = g5(t); if(!out.some(o => [...g5([].concat(o)[0])].some(g => gs.has(g)) || sameFact([].concat(o)[0], t))) out.push(x); }); return out; };   // no phrase of 5 words twice in one caption
  const spareCap = id => { const J = ((D.companion||{}).justListed||{}).captions||{}, R = ((D.companion||{}).roomLines||{})[id]||{}; const s0 = (R.all && R.all.length > 2) ? R.all : [J[id], R.long || R.short].filter(Boolean), s = s0.concat(carExtra(id).filter(t => !s0.includes(t))); return s.length ? {photo: id, lead: labelFor(id), s: clean5(s)} : null; };
  const OUTSIDE = /^(front|entry|gazebo|park|alley|skyline|walk|yard|terrace|balcony|deck|patio|pergola|fence|evening|garage|street)/;   // the outside page takes only exterior, outdoor or community photos
  const spares = (avoid) => Object.keys(D.photos||{}).filter(id => OUTSIDE.test(id)).sort((a, b) => ((spareCap(b)||{s:[]}).s.join(' ').length) - ((spareCap(a)||{s:[]}).s.join(' ').length)).filter(id => !usedIds.has(id) && !isHouse(id) && !/^pv\d|^plan/.test(id) && spareCap(id) && freeG(id) && !/^(skyline|alley|park)/.test(id) && !(avoid || []).some(a => SW.famOf(a) === SW.famOf(id)));
  // a list of photo cards with no room or view twice (the same deck under two numbers); spare rooms fill what is left
  const dedupe = (list, n) => { const out = []; list.filter(c => OUTSIDE.test(c.photo) && !USED.has(c.photo) && freeG(c.photo)).forEach(c => { if(!out.some(o => SW.famOf(o.photo) === SW.famOf(c.photo))) out.push(c); });
    if(out.length < n) spares(out.map(c => c.photo)).forEach(id => { if(out.length < n && !out.some(o => SW.famOf(o.photo) === SW.famOf(id))) out.push(spareCap(id)); });
    return out.slice(0, n); };
  // the cover's arch: the widest living room, never a corner of a kitchen
  const archScore = id => { const p = (D.photos||{})[id] || {}; if(p.fullHouse) return -9; const k = /^(family|living|great|open)/.test(id) ? 3 : /^(dining|primary)(?!.*bath)/.test(id) ? 2 : /kitchen|bar|bath/.test(id) ? 0 : 1; return k*10 + (p.w && p.h ? Math.min(p.w/p.h, 1.6) : 1); };
  // ---- the photo plan (owner review r8): every photo has one hand-written slot per house (out/fxsets/fxs-02/photo-plan.md, carried in sw.plan); nothing is allocated here ----
  const PL = K.plan || {};
  const heroA = (PL.cover || {}).hero || (K.front||{}).hero || 'front';
  const COV = {hero: heroA, arch: (PL.cover || {}).arch, smalls: ((PL.cover || {}).smalls || []).slice()};
  // a photo's card: the house's own written card for it (with the room's size) when there is one, else its photo notes
  const ownCards = {}; [].concat((K.left||{}).photos || [], ...(((K.right||{}).rows) || []), (K.back||{}).photos || [], (K.back||{}).photosNoplan || []).forEach(c => { if(c && c.photo && !ownCards[c.photo]) ownCards[c.photo] = c; });
  // owner 11/8/2026 (captions under photos fill the photo's width): a hand-written card also gets the listing's other true lines about the same photo (roomLines[photo].all)
  // as extra whole sentences for the fill pass; a line that shares two content words with one already in is the same fact and stays out
  const richer = c => { if(!c) return c; const R = ((((D.companion||{}).roomLines||{})[c.photo]||{}).all) || [], out = (c.s || []).slice();
    R.forEach(t => { if(out.length < 10 && !out.some(o => String([].concat(o)[0]).toLowerCase() === t.toLowerCase() || sameFact([].concat(o)[0], t))) out.push(t); }); return Object.assign({}, c, {s: clean5(out)}); };
  const cardFor = id => { const w = ownCards[id]; return w && (w.s || []).length > 2 ? richer(w) : spareCap(id) || w; };
  const STRIP = (PL.strip || []).slice(0, 4);
  // marketing fix (11/7): the 1-story inside-left nook says the light once (the living-and-dining caption has it)
  const leftCard = id => id === 'nook' && +L.stories === 1 ? Object.assign({}, cardFor(id), {lead: 'Breakfast nook.', s: ['Windows run along two walls, and the nook opens to the deck.'].concat((((D.companion||{}).roomLines||{}).nook||{}).all || []).filter(t => !/^Windows run along two walls\.?$/.test(t) && !/pantry|backyard/.test(t))}) : cardFor(id);
  K.left = Object.assign({}, K.left, {photos: (PL.left || []).map(leftCard).filter(Boolean)});
  K.right = Object.assign({}, K.right, {rows: [(PL.right || []).map(cardFor).filter(Boolean)]});
  const bandBg = `<div class="bg-paper"></div><div class="bg-band"></div>`;
  // caption: bold lead + whole sentences (the fill pass picks which)
  const cap = (c, slot, lines, cls) => {
    c = c || {}; const lh = /\bbig\b/.test(cls||'') ? 15 : LH;
    return `<div class="cap ${cls||''}" style="height:${CAPPAD + lines*lh}pt"><div class="a" data-slot="${slot}" ${/^(back\.strip|left\.photo|right\.photo)/.test(slot) ? 'data-free="1"' : ''} data-lh="${lh}" data-narrow="20" data-nstep="2.5" data-lines="${lines}" ${sd(c.s || c.a)} data-lead="${esc(c.lead||'')}" style="height:${lines*lh}pt"></div></div>`;
  };
  const item = (c, slot, lines, grow, o) => { o = o || {}; c = c || {photo: '', lead: '', s: []}; if(isHouse(c.photo)) o = Object.assign({}, o, {arch: false});
    /* a whole-house photo is never cut by the arch */ return `<div class="item" style="flex:${grow||1} 1 0">${SW.photo(D, c.photo, '', slot).replace('class="ph"', `class="ph${o.arch ? ' arch' : ''}"`)}${cap(c, slot, lines, o.cls)}</div>`; };
  const hd = (kicker, title, slotp, o) => { o = o || {}; const HX = o.x != null ? o.x : X0, HW = o.w || (X1 - HX);
    return `<div class="abs lbl" style="left:${HX}pt;top:22pt;width:${o.kw || 330}pt;height:12pt" data-slot="${slotp}.kicker" data-lines="1">${esc(String(kicker).toUpperCase())}</div>
      <div class="abs ttl fit" style="left:${HX}pt;top:36pt;width:${HW}pt;height:38pt;font-size:28pt;line-height:38pt" data-slot="${slotp}.title" data-lines="1">${FXS.lightBold(title)}</div>`; };
  // owner review r4 (11/7): the agent block (59.5 pt, fine print included) is centered between the rule over it and the foot of the page
  const CARDH = 61.5, BACK_RULE = 692, CARD_Y0 = BACK_RULE + (792 - BACK_RULE - CARDH)/2 + 2;
  // the strip's one-photo write-up: the photo's own lines, then the other views of the same space (real listing lines), so the column is full
  // owner review r5 (11/7): the strip's write-up uses the house's own written card for the photo when it says more than the photo notes alone
  const bestCap = id => { const a = spareCap(id), w = ownCards[id]; return a && w && (w.s || []).length > a.s.length ? Object.assign({}, a, {s: clean5(w.s.slice())}) : a; };
  const famCap = id => { const c0 = bestCap(id); if(!c0) return c0; const RL = (D.companion||{}).roomLines||{}, J = ((D.companion||{}).justListed||{}).captions||{}, fam = SW.famOf(id);
    const more = Object.keys(RL).filter(k => k !== id && SW.famOf(k) === fam).flatMap(k => [].concat(RL[k].all || [RL[k].long || RL[k].short]).concat(J[k] ? [J[k]] : []).filter(Boolean));
    const kw = t => new Set(String([].concat(t)[0]).toLowerCase().match(/[a-z]{4,}/g) || []), out = clean5(c0.s.slice());
    clean5(more.filter(t => !c0.s.includes(t))).forEach(t => { const k = kw(t); if(!out.some(o => { const sh = [...kw(o)].filter(w => k.has(w)); return sh.length >= 2 || sh.some(w => w.length >= 7); })) out.push(t); });   // no line that says what a kept line says (two shared words)
    return Object.assign({}, c0, {s: out.slice(0, 12)}); };
  const INL = 5, INLH = 18.5;   // owner review r1: the intro is larger (12 pt on 18.5)
  const intro = (c, slot, y, lines) => { const tr = []; for(let t = lines; t >= Math.max(2, lines - 2); t--) tr.push(t);
    return `<div class="abs body" data-narrow="0" data-fill="0.9" data-lfill="0.8" data-justify="1" data-slot="${slot}" data-lines="${lines}" data-try="${tr.join(',')}" data-lh="${INLH}" ${sd(c)} style="left:${C0}pt;top:${y}pt;width:${CWI}pt;height:${lines*INLH}pt;font-size:12pt;line-height:${INLH}pt"></div>`; };

  // ================= COVER =================
  let NSM = 9;   // (kept for the cover code: it shows every small room the allocation gave it)   // how many small rooms sit under the cover's arch: fewer only when a house has too few photos for the back's four-photo strip to stay clear of every other photo on the piece
  const covIds = () => ({archId: COV.arch, smalls: COV.smalls});
  function cover(){
    // owner review r2 (11/7): the cover is photos and the address only (no agent contact, no brokerage), everything bigger. A soft arch on the top-left photo (not the half-circle),
    // a slight curve on every other photo, the wide exterior across the foot of the page, the two small rooms (when the plan has them) beside it.
    const F = K.front || {}, archId = COV.arch, smalls = COV.smalls.slice(0, 2), heroId = COV.hero;
    const place = [L.neighborhood, `${L.city}, ${/^texas$/i.test(L.state) ? 'TX' : L.state} ${L.zip || ''}`.trim()].filter(Boolean);
    let h = bandBg;
    const X = 345, RW = 240, BOTM = 752;
    const ph = (id, x, y, w, hh, slot, rad) => `<div class="abs" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${hh}pt">${SW.photo(D, id, `position:absolute;inset:0;border-radius:${rad}pt 0 0 ${rad}pt`, slot)}</div>`;
    // the exterior frame: as wide as the page allows, tall enough that the whole house is inside it
    const heroW = smalls.length ? 352 : 540; let heroH = 286; while(heroH < 340 && !SW.fits(D, heroId, heroW, heroH)) heroH += 4;
    const heroTop = BOTM - heroH, archBot = heroTop - 14, archH = archBot - 36;
    h += `<div class="abs" style="left:40pt;top:36pt;width:290pt;height:${archH}pt">${SW.photo(D, archId, `position:absolute;inset:0;border-radius:${Math.min(88, archH*.2)}pt 0 0 ${Math.min(88, archH*.2)}pt`, 'front.arch')}</div>`;
    h += ph(heroId, 40, heroTop, heroW, heroH, 'front.house', 26);
    if(smalls.length){ const sw_ = 540 - heroW - 12, sh_ = (heroH - 12)/2; smalls.forEach((id, i) => { h += ph(id, 40 + heroW + 12, heroTop + i*(sh_ + 12), sw_, sh_, 'front.room' + i, 22); }); }
    // the street, facts, place, the write-up
    const sb = FXS.streetBlock(L.address, X, 38, RW, 52.5, 'address'); h += sb.html;
    let y = 38 + sb.h + 20;
    let facts = FXS.facts(L, {more: true}); if(facts.length % 2) facts = facts.filter(f => f[0] !== 'stories');
    const fg = FXS.factGrid(facts, X, y, RW, 36, 28.5, 'fact'); h += fg.html; y += fg.h - 4;
    h += `<div class="hr" style="left:${X + 1.5}pt;top:${y}pt;width:${RW - 1.5}pt"></div>`; y += 18;
    h += `<div class="abs" style="left:${X}pt;top:${y}pt">${FXS.icon('pin', 22.5)}</div>`;
    h += `<div class="abs place" data-slot="place" data-lines="${place.length}" style="left:${X + 33}pt;top:${y - 1}pt;width:${RW - 33}pt;height:${place.length*18.9 + 1}pt;line-height:18.9pt;font-size:13.5pt">${place.map(esc).join('<br>')}</div>`;
    y += place.length*18.9 + 10;
    const wuAvail = archBot - y, lh = 19.2, maxL = Math.floor(wuAvail/lh), tries = [];
    for(let t = maxL; t >= Math.max(3, maxL - 3); t--) tries.push(t);
    h += `<div class="abs body" data-narrow="0" data-fill="0.9" data-lfill="0.8" data-justify="1" data-slot="front.summary" data-bottom="${archBot}" data-lines="${maxL}" data-try="${tries.join(',')}" data-lh="${lh}" ${sd(F.summary)} style="left:${X}pt;top:${y}pt;width:${RW}pt;height:${maxL*lh}pt;font-size:12pt;line-height:${lh}pt"></div>`;
    return h;
  }

  // ================= BACK (outside, left in print) =================
  function back(){
    const B = K.back || {}, hasPlan = !!D.plan, T = (hasPlan ? B.plan : B.noplan) || {};
    let h = bandBg + hd(T.kicker || 'The house', T.title || '', 'back');
    // owner review r1 (11/2): four photos with real captions (from the listing's own photo notes) where the stat row was
    const R6 = !hasPlan && !((B.floors || []).length >= 4);   // owner review r5 (11/7): no-plan backs (1 to 3 floors): the nearby row sits lower, close over the rule; the rule moves down 8 pt
    const STRIPH = 100, SL = 3, stripH = STRIPH + CAPPAD + SL*LH, BOT = R6 ? BACK_RULE + 8 : BACK_RULE, NEARH = R6 ? 50 : 56, SB = BOT - NEARH - 10, stripTop = SB - stripH;   // owner review r4: the nearby row is tighter, the rule under it moves up, the strip grows into the room   // the nearby row takes the foot of the page under the strip
    let top = 82, body = '', stripIds = [], stripFrom = null, dynStrip = false;
    const P = ((hasPlan ? B.photos : (B.photosNoplan || B.photos)) || []).filter(c => !isHouse(c.photo) || true);
    const mainIds = [];
    if(hasPlan){
      const planRot = (() => { const r0 = IvoryPlan.draw(D.plan, {x: 66.6, y: 0, w: 496.8, h: 250}, {allowRotate: false}); return (r0.issues || []).some(i => /label-wont-fit/.test(i.kind)); })();   // turned on its side only when a label cannot fit upright
      const fitPlan = maxH => { for(let hh = maxH; hh >= 150; hh -= 6){ const big = IvoryPlan.draw(D.plan, {x: 66.6, y: 0, w: 496.8, h: hh}, {allowRotate: planRot}); if(!(big.issues || []).some(i => i.kind === 'plan-under-300ppi')) return Math.min(hh, Math.ceil(big.usedH || hh) + 6); } return 236; };   // the plan group fills the card's width (about 0.3 in at each side); the box is only as tall as
      const planH = fitPlan(282), py = top;
      const r = IvoryPlan.draw(D.plan, {x: 66.6, y: py + 6, w: 496.8, h: planH - 4}, {allowRotate: planRot});
      window.planIssues = r.issues;
      h += `<div class="abs" style="left:45pt;top:${py}pt;width:540pt;height:${planH + 34}pt;background:var(--fx-paper);border:var(--fx-rule-w) solid var(--fx-rule)"></div><div class="abs planwrap" style="left:0;top:0;width:612pt;height:792pt;--paper:var(--fx-paper)">${r.html}</div>`;
      const zs = IvoryPlan.zonesOf(D.plan);
      const leg = Object.entries(IvoryPlan.ZONES).filter(([k]) => zs.includes(k)).map(([k, z]) => `<span><i style="background:color-mix(in srgb, ${z.fill} ${Math.round(z.op*100)}%, var(--fx-paper))"></i>${z.label}</span>`);
      if(zs.includes('outdoor')) leg.push(`<span><i style="background:repeating-linear-gradient(45deg, color-mix(in srgb, var(--accent) 35%, var(--fx-paper)) 0 .6pt, var(--fx-paper) .6pt 2.8pt)"></i>Outdoor</span>`);

  document.querySelectorAll('[data-slot="right.intro"]').forEach(intro => { const pn = intro.closest('.panel'), pr = pn.getBoundingClientRect(), k = 72/96;
    const lg = [...pn.querySelectorAll('.logo')].pop(); if(!lg) return; const im = lg.querySelector('img') || lg;
    const above = Math.max(...[...pn.querySelectorAll('[data-slot^="right.photo"]')].map(e => (e.getBoundingClientRect().bottom - pr.top)*k));
    const ir = im.getBoundingClientRect(), it = (ir.top - pr.top)*k, ih = ir.height*k, want = (above + 792)/2 - ih/2;
    lg.style.top = (parseFloat(lg.style.top) + (want - it)) + 'pt'; });
  if(window.ContactCard) ContactCard.fit(document);
  issues.push(...SW.focus(D));
  document.querySelectorAll('.ph[data-slot-photo^="back."]:not([data-slot-photo^="back.strip"])').forEach(el => { if(!OUTSIDE.test(el.dataset.photo || '')) issues.push({slot: el.dataset.slotPhoto, kind: 'interior-photo-on-outside-page', detail: `${el.dataset.photo} is not an exterior, outdoor or community photo`}); });
  // HARD CHECK (owner review r4): no photo twice anywhere on the fold-over, all four panels, no exemptions
  // UNDERFILL CHECK (owner review r5): no empty band over 0.3 in, 2 in wide, between the header (100 pt) and the agent rule, on any panel (empty photo slots too)
  const underfill = () => { const out = [], k = 72/96;
    document.querySelectorAll('.panel').forEach(pn => { const pr = pn.getBoundingClientRect(), page = (pn.closest('.page') || {dataset: {}}).dataset.page;
      const rects = [...pn.querySelectorAll('*')].filter(e => { if(e.closest('.bg-band, .bg-paper') || e.classList.contains('bg-band') || e.classList.contains('bg-paper')) return false; const cs = getComputedStyle(e);
        const own = [...e.childNodes].some(n => n.nodeType === 3 && n.textContent.trim());
        return own || e.tagName === 'IMG' || e.tagName === 'svg' || e.classList.contains('ph') || e.classList.contains('inkbox') || e.classList.contains('hsbox') || e.classList.contains('logo') || e.classList.contains('hr') || e.dataset.cover || parseFloat(cs.borderTopWidth) > .5 && e.offsetHeight > 20; })
        .map(e => e.getBoundingClientRect()).filter(r => r.width > 2 && r.height > 2).map(r => ({l: (r.left - pr.left)*k, r: (r.right - pr.left)*k, t: (r.top - pr.top)*k, b: (r.bottom - pr.top)*k}));
      const y0 = 100, y1 = page === 'left' || page === 'right' ? 745 : 650, SW_ = 45, strips = []; for(let x = (page === 'left' || page === 'right' ? 160 : 45); x + SW_ <= 585 + .1; x += SW_) strips.push([x, x + SW_]);   // inside pages: the gray band at the left is the design's own white space
      const empty = (si, y) => !rects.some(r => r.l < strips[si][1] && r.r > strips[si][0] && r.t <= y + 2 && r.b >= y);
      for(let si = 0; si + 3 <= strips.length; si++){ let run = 0, start = 0;
        for(let y = y0; y <= y1; y += 3){ if(empty(si, y) && empty(si + 1, y) && empty(si + 2, y) && empty(si + 3 < strips.length ? si + 3 : si + 2, y)){ if(!run) start = y; run += 3; if(run > 21.6 + 6){ out.push({slot: page + ':band', kind: 'empty-band', detail: `an empty band of ${Math.round(run)} pt at y ${Math.round(start)} on the ${page} panel (x ${strips[si][0]} to ${strips[si + 2][1]})`}); break; } } else run = 0; } }
    });
    const seen = new Set(); return out.filter(o => !seen.has(o.slot) && seen.add(o.slot)); };
  // a page headed OUTSIDE holds mostly outdoor photos (marketing, 11/3)
  const outsideHead = () => { const k = ((K.back || {}).noplan || {}).kicker, p = (K.back || {}).plan || {}; const head = D.plan ? p.kicker : k; if(!/^outside$/i.test(String(head || '').trim())) return [];
    const ids = [...document.querySelectorAll('.page[data-page=back] .ph[data-photo]')].map(e => e.dataset.photo), out = ids.filter(id => OUTSIDE.test(id)).length;
    return out*2 < ids.length ? [{slot: 'back:headline', kind: 'outside-page-indoors', detail: `a page headed OUTSIDE shows ${out} outdoor photos of ${ids.length}`}] : []; };
  const dupAcross = () => { const seen = new Map(), out = [], bySrc = new Map();
    document.querySelectorAll('.ph[data-photo]').forEach(el => { const id = el.dataset.photo; if(!id) return; const src = (el.querySelector('img') || {}).src || id, panel = (el.closest('.page') || {dataset: {}}).dataset.page;
      const key = id, prev = seen.get(key), prevSrc = bySrc.get(src);
      if(prev) out.push({slot: el.dataset.slotPhoto || id, kind: 'photo-twice-on-foldover', detail: `${id} is on the fold-over twice (${prev} and ${panel || 'here'})`});
      else if(prevSrc && prevSrc !== id) out.push({slot: el.dataset.slotPhoto || id, kind: 'photo-twice-on-foldover', detail: `${id} is the same picture as ${prevSrc}`});
      seen.set(key, panel || '1'); bySrc.set(src, id); });
    return out; };
  window.brochureCheck = () => SW.check(D, (window.planIssues || []).concat(issues, dupAcross(), underfill(), outsideHead()));
  window.photoPlacements = SW.placements;
})();
