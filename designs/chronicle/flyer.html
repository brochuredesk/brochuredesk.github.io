<!--
  The Modern Chronicle · optional two-sided 8.5 x 11 flyer (trim 612 x 792 pt; print: 0.25 in margin of warm paper, content on the 36 pt column
  like the Open House flyer). data.piece.side = "front" | "back". Built from out/portrait-flyers/chronicle/ (build.py).
  Same family as the fold-over: warm paper, deep-red tracked kickers and a single red rule, Fraunces headlines (no drop cap: the shared line checks read it as a line) and the
  write-up, Libre Franklin text, UNEQUAL COLUMNS (every row of photos is a wide, a middle and a narrow frame) and real paragraphs.
  FRONT  top band (place line, the one logo), red rule, the whole house, the address with the ruled facts beside it, a rule, the write-up
         beside the places list, three unequal captioned photos, the card with the office lines level with its name
         and phone lines, fine print.
  BACK   With a plan: header, an editorial row (photo with a paragraph beside it), the plan on its board with the key at the left, a second row
         with the sides swapped. Without: the rooms floor by floor, then three editorial rows alternating sides, like the fold-over's spreads.
  Rules: no price, no QR, no photo numbers, no "virtually staged", room sizes in feet only, the half bath at full size (BD.baths), text fills
  its space, a row of captions runs the same number of lines.
-->
<style>
  .fc{overflow:visible}
  .fc .h{font:500 12pt/14pt var(--font-display);color:var(--ink);white-space:nowrap;overflow:hidden;letter-spacing:-.05pt;padding-top:6pt;height:20pt;box-sizing:border-box}
  .fc .h i{font:600 8pt/14pt var(--font-body);font-style:normal;letter-spacing:.9pt;text-transform:uppercase;color:var(--signal);margin-left:7pt}
  .fc .a{font-size:8.5pt;line-height:11.5pt;color:var(--text);overflow:hidden;margin-top:1.5pt}
  .fc.big .h{font-size:11pt}
  .sr .h{font:500 12pt/16pt var(--font-display);color:var(--ink);padding-top:4pt;height:24pt;box-sizing:border-box;white-space:nowrap;overflow:hidden;letter-spacing:-.05pt}
  .sr .h i{font:600 8pt/16pt var(--font-body);font-style:normal;letter-spacing:.9pt;text-transform:uppercase;color:var(--signal);margin-left:7pt}
  .sr .a{color:var(--text);overflow:hidden}
  .fc.big .a{font-size:9pt;line-height:12.5pt}
  .ptxt{font-size:9.75pt;line-height:14pt}
  .pn{font:600 9pt/12pt var(--font-body);color:var(--ink);overflow:hidden;flex:1;min-width:0}
  .pd{font:500 9pt/12pt var(--font-body);color:var(--signal);flex:none}
  .rr2{display:flex;align-items:center;justify-content:space-between;border-bottom:.6pt dotted var(--line);white-space:nowrap;overflow:hidden}
  .rr2 .n{font:600 10.5pt/13pt var(--font-display);color:var(--ink);overflow:hidden}
  .rr2 .d{font:500 8.5pt/12pt var(--font-body);color:var(--signal);flex:none;margin-left:6pt}
  .pnt{font-size:8pt;line-height:10pt;color:var(--text);margin-top:3pt}
  .hr1{height:.7pt;background:var(--line);left:36pt;right:36pt;width:auto}
  .hr2{height:1.1pt;background:var(--signal);left:36pt;right:36pt}
  .planframe{position:absolute;background:transparent;border:.7pt solid rgba(155,44,44,.35)}
  .stk div{overflow:hidden}
  .stk.r{display:flex;flex-direction:column}
  .stk.r div{flex:1 1 0;display:flex;align-items:center;padding:0}
  .stk.r div:last-child{border-bottom:.6pt dotted var(--line)}
  .stk.r div:first-child{border-top:.6pt dotted var(--line)}
</style>

<script>
/* Portrait flyer engine (shared by SB-01, SG-01, PR-01 flyers): text fitting, feet-only sizes, footer with office lines level with
   the card's lines, logo, plan key, and small helpers. Built into each set's templates/<set>/flyer.html by build.py. */
const FX = (function(){
  const FX = {X: 36, W: 540, BOT: 654, CARD_Y: 662, CARD_H: 94};
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  FX.esc = esc;
  const ms = document.createElement('div');
  ms.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;white-space:normal;overflow:visible;font-family:var(--font-body)';
  document.body.appendChild(ms);
  FX.DC = 'float:left;font-family:var(--font-display);font-weight:500;font-size:42pt;line-height:34pt;padding:2pt 5pt 0 0';
  FX.measure = (text, w, fs, lh, wt, dc) => {
    ms.style.width = w + 'pt'; ms.style.fontSize = fs + 'pt'; ms.style.lineHeight = lh + 'pt'; ms.style.fontWeight = wt || 400;
    ms.className = dc ? 'ptxt dc' : ''; ms.textContent = text;
    const rg = document.createRange(); rg.selectNodeContents(ms);
    const rows = []; [...rg.getClientRects()].filter(r => r.width > .5 && (!dc || r.height < lh*1.6)).forEach(r => { const row = rows.find(x => Math.abs(x.top - r.top) < lh*.5); if(row) row.right = Math.max(row.right, r.right); else rows.push({top: r.top, right: r.right}); });
    const box = ms.getBoundingClientRect(), last = rows.length ? rows[rows.length-1] : null;
    const mid = rows.slice(0, -1).map(r => box.width ? (r.right - box.left)/box.width : 1);
    return {lines: rows.length, last: last && box.width ? Math.min(1, (last.right - box.left)/box.width) : 0, min: mid.length ? Math.min(...mid) : 1};
  };
  // room sizes in feet only, inches dropped and never rounded: 18' x 12'
  const feetOnly = FX.feetOnly = t => String(t).replace(/(\d+)(?:\.\d+)?(?:'\s?\d+(?:\.\d+)?"?)?'?\s*x\s*(\d+)(?:\.\d+)?(?:'\s?\d+(?:\.\d+)?"?)?'?/g, "$1' x $2'");
  FX.BAN = /\b(generous(ly)?|spacious|boasts?|nestled|perfect for|character|enhances?|within easy reach|soaring|glows?|moments away|set the tone|abundant|steps away|brings? in (day)?light|natural light|brighten(s|ed)?|rich|space to entertain|adds? privacy|opens? the entry|daylight|with light|ready for|set up for a crowd|minutes from|year-round comfort|ways to unwind|get ready at once|carry through the space|virtually|staged|ideal for|master|kids?|children)\b/i;
  FX.sentences = s => (Array.isArray(s) ? s : String(s || '').match(/[^.!?]+[.!?]+["”’)]*|[^.!?]+$/g) || []).map(x => feetOnly(x).trim()).filter(x => x && !FX.BAN.test(x));
  const sentences = FX.sentences;
  const subsets = arr => { const n = Math.min(arr.length, 9), out = [];
    for(let m = 1; m < (1 << n); m++){ const pick = []; for(let i = 0; i < n; i++) if(m & (1 << i)) pick.push(arr[i]); out.push({m, pick}); }
    return out.sort((a, c) => (a.m & -a.m) - (c.m & -c.m) || c.pick.length - a.pick.length || a.m - c.m); };
  const FILLS = [.8, .765];
  const ADJ = [0, .25, -.25, .5, -.5];
  const fitOne = (sents, f, n, fill) => { let best = null; const all = subsets(sents);
    for(const adj of ADJ){ const fs = f.fs + adj; if(fs < 8 || (f.fsMin && fs < f.fsMin)) continue;
      for(const {pick} of all){ const t = pick.join(' '), r = FX.measure(t, f.w, fs, f.lh, f.wt, f.dc);
        if(r.lines === n && r.last >= fill) return {text: t, lines: n, last: r.last, fs};
        if(r.lines === n && (!best || r.last > best.last)) best = {text: t, lines: n, last: r.last, fs}; } }
    return best; };
  FX.fillBox = (src, f, ns) => { const sents = sentences(src); if(!sents.length) return {text: '', lines: 0, last: 0, ok: false};
    let fall = null;
    for(const fill of FILLS) for(const n of ns){ const r = fitOne(sents, f, n, fill); if(r && r.last >= fill) return Object.assign(r, {ok: true}); if(r && (!fall || r.last > fall.last)) fall = r; }
    if(fall) return Object.assign(fall, {ok: false});
    const t = sents.join(' '), r = FX.measure(t, f.w, f.fs, f.lh, f.wt, f.dc); return {text: t, lines: r.lines, last: r.last, ok: false}; };
  // a row of captions all run the same number of lines: the first n in `ns` every one can fill
  FX.fillRow = (items, f, ns) => {
    const fw = Array.isArray(f) ? f : items.map(() => f), sn = items.map(sentences);
    for(const fill of FILLS) for(const n of ns){
      const rs = sn.map((s, i) => s.length ? fitOne(s, fw[i], n, fill) : null);
      if(rs.every(r => r && r.last >= fill)) return {rs, n, ok: true}; }
    let best = null;
    for(const n of ns){ const rs = sn.map((s, i) => s.length ? (fitOne(s, fw[i], n, 0) || FX.fillBox(s, fw[i], [n])) : {text: '', lines: 0, last: 0});
      const bad = rs.filter(r => r.lines !== n || r.last < FILLS[1]).length; if(!best || bad < best.bad) best = {rs, n, bad}; }
    return {rs: best.rs, n: best.n, ok: false}; };

  // a row of captions with the same line count, each caption a run of its written sentences from the first (never one dropped from the
  // middle, owner 11/10 rule 5): the longest run that sets exactly n lines with a full last line, type 8.25 to 9 pt
  // mins: per caption, the least text it may hold (owner 11/10 rule 5: never shorter than the written caption)
  FX.fillRowPrefix = (items, f, n, mins) => {
    const fw = Array.isArray(f) ? f : items.map(() => f);
    const rs = items.map((src, i) => { const s = sentences(src).slice(0, 7); let best = null;
      // runs that always open with the first sentence, in their written order; the longest that sets n lines with a full last line wins
      const runs = []; for(let m = 1; m < (1 << s.length); m += 2){ const p = s.filter((_, j) => m & (1 << j)); runs.push(p.join(' ')); }
      runs.sort((a, b) => b.length - a.length);
      const mn = Math.min((mins || [])[i] || 0, runs.length ? runs[0].length : 0); runs.splice(0, runs.length, ...runs.filter(r => r.length >= mn));
      for(const t0 of runs) for(const fs of [0, .125, -.125, .25, -.25, .375, -.375, .5, -.5, .625, .75, .875, 1].map(a => fw[i].fs + a).filter(v => v >= 8)){ const t = t0, r = FX.measure(t, fw[i].w, fs, fw[i].lh, fw[i].wt);
        if(r.lines !== n) continue; const c = {text: t, lines: n, last: Math.min(r.last, r.min + .1), fs}; if(r.last >= .76 && r.min >= .8) return c; if(!best || r.last > best.last) best = c; }
      return best; });
    if(rs.some(r => !r)) return {rs: rs.map((r, i) => r || FX.fillBox(items[i], fw[i], [n])), n, ok: false, exact: false};
    return {rs, n, ok: rs.every(r => r.last >= .8), exact: true, min: Math.min(...rs.map(r => r.last))}; };

  // the same, at ONE type size for the whole row (owner 11/10, p50: the captions side by side share their size and line count, so they
  // end level): every shared size from 8 to 9 pt is tried; at each, every caption takes its longest run that sets n lines with full lines
  FX.fillRowShared = (items, f, n, mins) => {
    const fw = Array.isArray(f) ? f : items.map(() => f);
    const runsOf = items.map((src, i) => { const s = sentences(src).slice(0, 7), runs = [];
      for(let m = 1; m < (1 << s.length); m += 2) runs.push(s.filter((_, j) => m & (1 << j)).join(' '));
      runs.sort((a, b) => b.length - a.length); const mn = Math.min((mins || [])[i] || 0, runs.length ? runs[0].length : 0); return runs.filter(r => r.length >= mn); });
    let best = null;
    for(let fs = 8; fs <= 9.51; fs += .125){
      const rs = items.map((_, i) => { let b = null;
        for(const t of runsOf[i]){ const r = FX.measure(t, fw[i].w, fs, fw[i].lh, fw[i].wt); if(r.lines !== n) continue;
          // (full lines set ragged at 87%+ justify without wide word gaps, owner 11/10 rule 8; those win)
          const c = {text: t, lines: n, last: Math.min(r.last, r.min + .1), fs, tight: r.last >= .8 && r.min >= .87}; if(c.tight) return c;
          const k = c2 => (c2.last >= .8 ? 1 : 0) + c2.last; if(!b || k(c) > k(b)) b = c; }
        return b; });
      if(rs.some(r => !r)) continue;
      const mn = Math.min(...rs.map(r => r.last)), len = rs.reduce((a, r) => a + r.text.length, 0), ok = mn >= .8, tight = rs.every(r => r.tight);
      const sc = (ok ? 10 : 0) + (tight ? 5 : 0) + mn + len/20000 - Math.abs(fs - 8.5)/10;
      if(!best || sc > best.sc) best = {rs, n, ok, exact: true, min: mn, sc, tight}; }
    if(best) best.rs = best.rs.map(r => Object.assign({}, r, {shared: best.ok}));
    return best ? best : FX.fillRowPrefix(items, f, n, mins); };

  // ---------- logo: one per side ----------
  FX.logo = (D, x, y, w, h, dark) => {
    const b = D.brand || {}; let src = b.logo, st = '';
    if(dark){ src = b.logoKnockout || b.logoOnDark || b.logo; if(!(b.logoKnockout || b.logoOnDark)) st = 'filter:brightness(0) invert(1);'; }
    return `<div class="abs logo" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${h}pt;display:flex;align-items:center;justify-content:flex-end">${src ? `<img src="${esc(src)}" alt="" data-slot="broker.logo" data-optional="1" style="max-width:${w}pt;max-height:${h}pt;${st}">` : ''}</div>`;
  };

  // ---------- footer: the standard agent contact block (owner 11/2, Round 2): agent card left, the brokerage's logo and office lines right,
  // the same block on every set (as Ivory's back); only the set's colors and fonts change it. The one logo on the side lives here. ----------
  FX.footer = (D, o) => {
    o = o || {};
    const b = D.brand || {}, A = D.agent || {}, X = FX.X, W = FX.W;
    const hs = (D.photos && D.photos[A.headshot] && D.photos[A.headshot].src) || (/^(file|https?|data):/.test(A.headshot || '') ? A.headshot : '');
    return ContactCard.html([X, FX.CARD_Y, W, FX.CARD_H], Object.assign({}, A, {headshot: hs}), b, {layout: 'panel', size: 'mid', bottomGap: .5, grow: 0});
  };
  // the short contact block (owner 11/10, rule 1): full width, about 66 pt tall
  FX.SHORT_H = 66;
  FX.footerShort = (D, y) => {
    const b = D.brand || {}, A = D.agent || {};
    const hs = (D.photos && D.photos[A.headshot] && D.photos[A.headshot].src) || (/^(file|https?|data):/.test(A.headshot || '') ? A.headshot : '');
    return ContactCard.html([FX.X, y, FX.W, FX.SHORT_H], Object.assign({}, A, {headshot: hs}), b, {layout: 'panel', size: 'short', bottomGap: .5, grow: 0, s: {name: 19, nameFloor: 15, phone: 13, line: 9, desigInline: true, hsW: 52, panelW: 160, rowGap: 14, logo: {wide: [132, 30], square: [32, 32], tall: [34, 34]}}});
  };
  FX.alignOffices = () => {};

  // pick `n` photo ids from the writer's list, then a fallback list, never one already used and never one without a source
  FX.picker = (D, used) => (writer, n, fallback) => { const has = id => id && D.photos && D.photos[id] && D.photos[id].src; const out = [];
    (writer || []).filter(has).forEach(i => { if(out.length < n && !used.has(i)){ used.add(i); out.push(i); } });
    for(const i of (fallback || [])){ if(out.length >= n) break; if(has(i) && !used.has(i)){ used.add(i); out.push(i); } } return out; };
  return FX;
})();

window.brochureReady = (async function(){
  const D = AT.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="padding:20pt">No data injected.</p>'; return; }
  const esc = AT.esc, pt = AT.pt, L = D.listing, C = D.copy || {}, CP = D.companion || {}, FL = CP.flyer || {};
  const issues = await AT.fontsReady(D);
  await AT.cardReady;
  document.body.dataset.mode = D.mode || 'email';
  const front = D.piece.side !== 'back';
  const planOK = AT.planOK(D), levels = planOK ? AT.levels(D) : [], flabels = planOK ? AT.floorLabels(D) : [];
  const {X, W, BOT} = FX, P = D.photos || {};
  const halfy = t => AT.halfy ? AT.halfy(t) : esc(t);
  const {measure, fillBox, fillRow, sentences, feetOnly} = FX;
  const DB = 11.5, FBOT = 750;   // caption body line step (pt)
  const capH = n => 6 + 14 + 1.5 + n*DB;

  // ---------- the fold-over's copy, by photo, and the flyer's own ----------
  const ALL = {};
  const CV = C.cover || {}, LF = C.left || {}, RT = C.right || {}, BK0 = C.back || {};
  const items = [Object.assign({photo: CV.living}, CV.livingCap || {}), LF.kitchen, LF.small, ...(LF.pair || []), LF.wide, RT.feature, ...(RT.baths || []), ...(RT.three || []), BK0.big, ...(BK0.small || [])];
  items.forEach(it => { if(it && it.photo && !ALL[it.photo]) ALL[it.photo] = it; });
  const FP = FL.photos || {};
  const titleOf = id => (FP[id] && FP[id].title) || (ALL[id] && ALL[id].title) || '';
  const dimsOf = id => (FP[id] && FP[id].dims !== undefined ? FP[id].dims : (ALL[id] && ALL[id].dims)) || '';
  const poolOf = id => (FP[id] && FP[id].sentences) || (ALL[id] && ALL[id].body) || '';
  // the written lines, then the photo's own true extra lines (copy.extra) that say something new (owner 11/10: fill with real facts,
  // never by dropping a written sentence)
  // the least a flyer caption may hold: the fold-over's written caption for the photo, or 85% of the flyer's own lines when longer
  // (chronicle's flyer front has no Before; its reviewed After held about 0.6 of the fold-over's caption, so that and 85% of the flyer's own lines are the floor)
  const minLenOf = id => Math.round(0.6*sentences(poolOf(id)).join(' ').length);   // (chronicle's front has no Before; its reviewed After held about 0.5-0.65 of the fold-over's caption)
  const kw = s => (String(s).toLowerCase().match(/[a-z]{4,}/g) || []);
  // (others: the photos beside it on the page; a line that repeats their written facts is left out)
  const poolPlus = (id, others) => { const own = sentences(poolOf(id)), out = own.slice(), nearS = (others || []).filter(o => o !== id).map(o => new Set(kw(sentences(poolOf(o)).join(' '))));
    // (then the fold-over's own written lines for the photo, then the listing's extra lines, each only when it says something new)
    for(const x of [...(FP[id] && FP[id].sentences && ALL[id] ? sentences(ALL[id].body || '') : []), ...((((D.copy || {}).extra || {})[id]) || []).map(s => feetOnly(String(s)).trim())].filter(Boolean)){ const w = kw(x), have = new Set(kw(out.join(' ')));
      if(nearS.some(near => new Set(w.filter(q => near.has(q) && !/^(with|that|this|from|room|house|front|into|over|under|along|each|which|there|their|sits?|runs?|kitchen)$/.test(q))).size >= 3)) continue;
      // (a line that shares two or more words with what the caption already says is a repeat: left out, owner 11/10)
      const k3 = s => new Set((String(s).toLowerCase().match(/[a-z]{3,}/g) || []).filter(q => !/^(the|and|with|for|its|are|has|was|from|that|this|into|over|under|along|each|which|there|their|sits?|runs?|room|house|front|one|two|off|out|all|but|not|beside|where|while|both|than|then)$/.test(q)));
      const h3 = k3(out.join(' ')); if(w.length && [...k3(x)].filter(q => h3.has(q)).length < 2 && !(q0 => q0 && h3.has(q0))([...k3(x)].find(q => q.length >= 4 && !/^(large|small|tall|long|wide|white|dark|black|navy|light|lights?|wood|stone|glass|full|high|built|open|new)$/.test(q))) && !FX.BAN.test(x)) out.push(x); }
    return {all: out, own: own.length}; };
  const has = id => id && AT.src(D, id);
  const used = new Set();
  const hero = (FL.front && FL.front.hero && has(FL.front.hero)) ? FL.front.hero : (CV.photo || Object.keys(P)[0]);
  used.add(hero);
  const pick = FX.picker(D, used);
  const folIds = items.filter(Boolean).map(i => i.photo);
  const PL0 = (FL.places || (BK0.places || []).map(p => ({n: p.name, d: p.miles})));
  const PLT = FL.placesTitle || BK0.placesTitle || 'Around the neighborhood';

  // ---------- pieces ----------
  const cap = (id, slot, r, x, y, w) => { const d = dimsOf(id);
    return `<div class="abs fc" style="left:${x}pt;top:${y}pt;width:${w}pt"><div class="h" data-slot="${slot}.h" data-lines="1">${esc(titleOf(id))}${d ? `<i>${esc(feetOnly(d))}</i>` : ''}</div>`
      + `<div class="a" data-slot="${slot}.a" data-para="1" data-min="2" data-lines="${r.lines}"${r.shared ? ' data-capfit-skip="1" data-fixed="1"' : ''} style="height:${r.lines*DB}pt${r.fs ? `;font-size:${r.fs}pt` : ''}">${esc(r.text)}</div></div>`; };
  const ph = (id, slot, x, y, w, h, cls) => AT.photo(D, id, `position:absolute;left:${x}pt;top:${y}pt;width:${w}pt;height:${h}pt`, slot, cls || 'cm');
  const kick = (t, x, y, w, slot, extra) => `<div class="abs kicker" style="left:${x}pt;top:${y}pt;width:${w}pt;height:10pt;${extra || ''}" data-slot="${slot}" data-lines="1">${esc(t)}</div>`;
  const fine = (t, y, slot) => `<div class="abs fine" style="left:${X}pt;top:${y}pt;width:${W}pt;height:8pt;white-space:nowrap" data-slot="${slot}" data-fine="1" data-lines="1">${esc(t)}</div>`;
  const placeLine = [L.neighborhood, AT.placeZip(L)].filter(Boolean).join(' · ');
  const FINE = FL.fineprint || C.footnote || 'Information deemed reliable but not guaranteed.';
  let h = '';
  const fitlog = [];

  if(front){
    // ================= FRONT =================
    h += kick(placeLine.toUpperCase(), X, 36, W, 'place');
    h += `<div class="hr2 abs" style="top:58pt"></div>`;
    const trio = pick(FL.front && FL.front.photos, 3, folIds);
    // details grid: beds, baths (the ½ at full size), square feet, built-in year (else stories), then the lot size when there is one
    const bt = BD.baths(L), rows = [];

        + `<div class="abs" style="left:${X}pt;top:${y0 + fh - 24}pt;width:${W}pt;height:12pt;display:flex;justify-content:center;gap:16pt;font:600 8pt/10pt var(--font-body);color:var(--ink);white-space:nowrap">${legend}</div>`
        + `<div class="abs fine" style="left:${X}pt;top:${y0 + fh + 3}pt;width:${W}pt;height:8pt;text-align:center;white-space:nowrap" data-slot="back.planDisc" data-fine="1" data-lines="1">${esc(FL.planDisc || 'Approximate; not to scale. Buyer to verify.')}</div>`;
      let rem = avail - fh - 14; const nRows = rem >= 2*100 + GAPR ? 2 : 1; let Hrow = Math.floor((rem - (nRows - 1)*GAPR)/nRows), yR = y0 + fh + 14;
      h += storyRow(st[0], 'back.story0', true, yR, Hrow);
      if(nRows === 2) h += storyRow(st[1], 'back.story1', false, yR + Hrow + GAPR, Hrow);
      fitlog.push(['plan', fh, Hrow, nRows]);
      document.body.dataset.layout = 'back-plan';
      document.body.dataset.geom = JSON.stringify({fh, Hrow, nRows});
    } else {
      // ---- no plan: the rooms floor by floor, then three editorial rows ----
      const rl = (FL.rooms || (BK0.rooms || []).map(f => ({floor: f.label, rows: f.rooms}))).filter(f => f.rows && f.rows.length);
      let cols = rl.map(f => ({floor: f.floor, rows: f.rows}));
      if(cols.length === 1 && cols[0].rows.length > 6){ const r = cols[0].rows, k = Math.ceil(r.length/2); cols = [{floor: cols[0].floor, rows: r.slice(0, k)}, {floor: cols[0].floor + ' (continued)', rows: r.slice(k)}]; }
      if(cols.length > 2){ const hh = g => g.reduce((a, f) => a + 20 + f.rows.length*15 + 6, 0); let bm = 1, bv = 1e9; for(let m = 1; m < cols.length; m++){ const v = Math.max(hh(cols.slice(0, m)), hh(cols.slice(m))); if(v < bv){ bv = v; bm = m; } } cols = [{multi: cols.slice(0, bm)}, {multi: cols.slice(bm)}]; } else cols = cols.map(c => ({multi: [c]}));
      const colH = c => c.multi.reduce((a, f) => a + 20 + f.rows.length*15 + 6, 0);
      const listH = Math.max(...cols.map(colH)), cgap = 18, cw = (W - (cols.length - 1)*cgap)/cols.length;
      cols.forEach((c, ci) => { const x = X + ci*(cw + cgap); let cy = y0;
        c.multi.forEach((f, fi) => { h += `<div class="abs sect" style="left:${x}pt;top:${cy}pt;width:${cw}pt;height:12pt;border-bottom:1.1pt solid var(--signal);padding-bottom:3pt" data-slot="back.floor${ci}${fi}" data-lines="1">${esc(f.floor)}</div>`; cy += 20;
          f.rows.forEach((r, ri) => { h += `<div class="abs rr2" style="left:${x}pt;top:${cy}pt;width:${cw}pt;height:15pt"><span class="n" data-slot="back.floor${ci}${fi}.r${ri}.n" data-lines="1" style="font-size:10pt">${esc(r[0])}</span>${r[1] ? `<span class="d" data-slot="back.floor${ci}${fi}.r${ri}.d" data-lines="1">${esc(feetOnly(r[1]))}</span>` : ''}</div>`; cy += 15; }); cy += 6; }); });
      const st = stIds, top3 = y0 + listH + 8, Hrow = Math.floor((NB - top3 - 2*GAPR)/3);
      st.forEach((id, i) => { h += storyRow(id, `back.story${i}`, i % 2 === 0, top3 + i*(Hrow + GAPR), Hrow); });
      document.body.dataset.layout = 'back-photos';
      document.body.dataset.geom = JSON.stringify({listH, Hrow});
    }
  }
  document.body.dataset.fitlog = JSON.stringify(fitlog);
  const f = AT.frame(D, 612, 792, h);
  document.getElementById('pages').innerHTML = f.html;
  window.pieceSize = {W: f.W, H: f.H, bleed: f.bleed};
  await AT.settle();
  if(window.PlanInk) PlanInk.applyAll(D, false);   // owner 11/10/2026: the listing plan's background is clear, its lines in the design's ink
  AT.fitLine(document.getElementById('addr') || document.createElement('div'), 28);
  AT.fitLine(document.getElementById('btitle') || document.createElement('div'), 20);
  issues.push(...AT.fitHouse(D));
  ContactCard.fit(document);
  FX.alignOffices();
  document.querySelectorAll('.plan-room span').forEach(e => { e.textContent = feetOnly(e.textContent); });
  window.photoPlacements = AT.placements;
  // the front write-up keeps its line count and its whole text; its size moves (9.25 to 10.75 pt) until the last line runs 80%+, then
  // it is justified (write-ups fill their width, owner 11/7)
  { const bl = document.getElementById('blurb'); if(bl){ const n = +bl.dataset.lines, fs0 = parseFloat(bl.style.fontSize) || 9.75, keep = bl.style.fontSize;
    const lastOf = () => { const ls = AT.lineBoxes(bl), w = bl.getBoundingClientRect().width; return [ls.length, ls.length ? (ls[ls.length-1].r - ls[ls.length-1].l)/w : 0]; };
    let ok = false; for(const fs of [fs0, fs0 + .125, fs0 - .125, fs0 + .25, fs0 - .25, fs0 + .375, fs0 - .375, fs0 + .5, fs0 - .5, fs0 + .75, fs0 + 1].filter(v => v >= 9 && v <= 11)){
      bl.style.fontSize = fs + 'pt'; const [k, f] = lastOf(); if(k === n && f >= .8){ ok = true; break; } }
    if(!ok) bl.style.fontSize = keep; bl.style.textAlign = 'justify'; bl.style.textAlignLast = 'left'; } }
  const guard = () => { const out = [], sh = document.querySelector('.sheet').getBoundingClientRect(), cc = document.querySelector('.cc');
    const top = cc ? pt(cc.getBoundingClientRect().top - sh.top) : 0;
    const cr = cc && cc.getBoundingClientRect();
    document.querySelectorAll('.ph,.fc,.ptxt,.fnote,.planframe').forEach(el => { const q = el.getBoundingClientRect(), b = pt(q.bottom - sh.top); if(top && b > top - 4 && q.left < cr.right && q.right > cr.left) out.push({slot: el.dataset.slotPhoto || el.className, kind: 'runs-into-card', bottomPt: +b.toFixed(1), cardTopPt: +top.toFixed(1)}); });
    return out; };
  if(window.CapFit) (window.proofNotes = window.proofNotes || []).push({capFit: CapFit.run(((typeof D !== "undefined" && D.copy) || {}).extra)});
  // the front's row of captions ends at one type size (owner 11/10, p50): after the width fitting, the largest size from 9.5 pt down
  // at which every caption in the row sets the row's line count with full lines (each may keep its filled text or its written one,
  // whichever sets full lines at that size; the fuller first), justified
  { const caps = [0, 1, 2].map(i => document.querySelector(`[data-slot="front.photo${i}.a"]`)).filter(Boolean);
    if(caps.length > 1 && caps.every(c => c.dataset.capfitSkip)){ caps.forEach(c => { c.style.textAlign = 'justify'; c.style.textAlignLast = 'left'; }); document.body.dataset.capRow = JSON.stringify({fs: 'shared'}); }
    else if(caps.length > 1){ const n = Math.max(...caps.map(c => AT.lineBoxes(c).length)), keep = caps.map(c => [c.textContent, c.style.fontSize, c.style.letterSpacing]);
      const vars = caps.map(c => [...new Set([c.textContent, c.__orig0].filter(Boolean))].sort((a, b) => b.length - a.length));
      const lastOf = c => { const ls = AT.lineBoxes(c), w = c.getBoundingClientRect().width; return ls.length ? Math.min(...ls.slice(0, -1).map(l => (l.r - l.l)/w), (ls[ls.length-1].r - ls[ls.length-1].l)/w) : 0; };
      let pick = null;
      caps.forEach(c => { c.style.letterSpacing = ''; c.style.textAlign = 'left'; });
      for(let fs = 9.5; fs >= 8 - 1e-6 && !pick; fs -= .0625){ const got = [];
        for(let i = 0; i < caps.length; i++){ const c = caps[i]; c.style.fontSize = fs + 'pt'; let ok = null;
          for(const t of vars[i]){ c.textContent = t; if(AT.lineBoxes(c).length === n && lastOf(c) >= .8){ ok = t; break; } }
          if(!ok) break; got.push(ok); }
        if(got.length === caps.length) pick = {fs, got}; }
      if(pick) caps.forEach((c, i) => { c.textContent = pick.got[i]; c.style.fontSize = pick.fs + 'pt'; c.dataset.fixed = '1'; c.style.textAlign = 'justify'; c.style.textAlignLast = 'left'; });
      else caps.forEach((c, i) => { c.textContent = keep[i][0]; c.style.fontSize = keep[i][1]; c.style.letterSpacing = keep[i][2]; c.style.textAlign = 'justify'; });
      document.body.dataset.capRow = JSON.stringify(pick ? {fs: pick.fs, n} : {fs: 'kept'}); } }
  AT.gapGuard();
  window.brochureCheck = () => AT.checkSingle(D, [...issues, ...guard()]);
})();

// a piece that fails to build reports it (the render then fails its checks) instead of hanging until the renderer times out
if(window.brochureReady && window.brochureReady.catch) window.brochureReady.catch(e => { console.error(e); window.brochureCheck = () => [{slot: 'page', kind: 'render-error', detail: String(e && e.message || e)}]; });

</script>
