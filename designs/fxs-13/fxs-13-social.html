<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · FX extras · FX13 socials</title>
<link rel="stylesheet" href="fx.css">
<link rel="stylesheet" href="fxs13-tokens.css">
<link rel="stylesheet" href="fxs13-marks.css">
<script src="fxs13-tk.js"></script>
<script src="fxs13.js"></script>
<script src="../engine/ivory.js"></script>
<script src="../engine/ohlib.js"></script>
<script src="../engine/factrepeat.js"></script>
<script src="fxpage.js"></script>
<script src="fxs13-patch.js"></script>
<!--
  fxs-13 socials: Open House, Just Listed and Just Sold in every size, plus the carousel slides. One page; it draws by FXP.kind(D) and D.piece.shape.
  The flyer's pieces carry through, doing the same job: the address set vertically up the left edge (Bodoni) with a short gold rule; the whole house
  in one large hero with the round neighborhood seal in its corner; the event (or the status) between two hairlines in Cormorant over caps; the
  REALTOR(R) perks on a white notes card; the agent in Cormorant with the one logo; square corners everywhere. No new copy.
  Too much for a size: the notes go first, then what's served (the caption carries them).
-->
<style>
  .abs{position:absolute}
  .wu{font:500 var(--sw,13pt)/1.4 'Montserrat'}
</style>
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
FXS.hookCheck();
FXP.start(['500 20pt "Bodoni Moda"', '600 20pt "Bodoni Moda"', '400 20pt "Cormorant Garamond"', '500 20pt "Cormorant Garamond"', '600 20pt "Cormorant Garamond"', '700 20pt "Cormorant Garamond"', 'italic 400 20pt "Cormorant Garamond"', '800 20pt "Montserrat"', '700 20pt "Montserrat"', '600 20pt "Montserrat"', '500 20pt "Montserrat"', '400 20pt "Montserrat"', '300 20pt "Montserrat"'], D => {
  const esc = Ivory.esc, L = D.listing, C = D.companion || {}, A = D.agent || {};
  const kind = FXP.kind(D), shape = D.piece.shape, {W, H} = FXP.size(D), F = FXP.floor(shape); F.ev = F.event;
  const E = OHL.event(D), hero = OHL.hero(D, 'straight');
  if(E.time) E.time = E.time.replace(/(\d)\s+(am|pm)\b/gi, '$1 $2');
  const INK = TK.ink, BANDC = TK.paper, SOFT = TK.text, MONT = "font-family:'Montserrat'";
  const back = [], mid = [], front = [], tiny = [];
  const D2 = Object.assign({}, D, {companion: Object.assign({}, C, {postcard: Object.assign({}, C.postcard || {}, {master: ((C.postcard || {}).master || []).filter(t => !FXP.CONDITION.test(t)).filter((t, i, a) => FXS.dedupe5(a).includes(t))})})});
  const side = shape === 'wide' || shape === 'gbp';
  const AX = side ? Math.max(Math.round(H*.1), Math.round(F.ev*2.2)) : Math.max(Math.round(W*.13), Math.round(F.ev*2.2)), BW = AX - 4;   // the gutter that holds the vertical address; photos start at AX   // the band's width; where the arch and box start

  const rect = (x, y, w, h, css) => `<div class="abs" aria-hidden="true" style="left:${x}pt;top:${y}pt;width:${w}pt;height:${h}pt;${css || ''}"></div>`;
  const pic = (id, x, y, w, h, css) => OHL.photo(D, id, `left:${x}pt;top:${y}pt;width:${w}pt;height:${h}pt;${css || ''}`);
  const archCss = () => '';
  const wdt = (t, css, rich) => { const m = document.createElement('span'); m.style.cssText = `position:absolute;left:-9999pt;visibility:hidden;white-space:nowrap;${css}`; if(rich) m.innerHTML = t; else m.textContent = t; document.body.appendChild(m); const w = m.getBoundingClientRect().width*.75; m.remove(); return w; };
  // text that fits: the biggest size from max to min at which it runs in <= lines lines in width w. o.rich: html for the body
  const T = o => { const r = T0(o); return o.parts && r.n >= 99 ? T0(Object.assign({}, o, {parts: null, lines: Math.max(o.lines || 1, 3)})) : r; };
  const T0 = o => {
    if(o.slot === 'place') return {html: '', h: 0, s: 0, n: 0, w: 0, ok: true};
    const lines = o.lines || 1, lhk = o.lh || 1.15, txt = o.parts ? o.parts.join(' ') : o.text;
    const css = s => `${MONT};${o.css};font-size:${s}pt;line-height:${(s*lhk).toFixed(2)}pt`;
    const cnt = s => o.rich ? (wdt(o.rich, css(s), true) <= o.w + .3 ? 1 : 99) : o.parts ? (o.parts.every(p => FXP.width(p, css(s)) <= o.w + .3) ? o.parts.length : 99) : FXP.lines(txt, css(s), o.w);
    let s = o.max, n = cnt(s);
    while(n > lines && s > o.min){ s -= .5; n = cnt(s); }
    if(s < o.min) s = o.min;
    n = cnt(s);
    // the Just Sold lines: two lines whose last line runs short (a lone word) set as one line at the biggest size that holds it (down to 0.8 of the floor), never a stub
    if(/^sold\.(head|line)$/.test(o.slot) && n > 1 && !o.parts && !o.rich && FXP.width(txt, css(s)) < 1.7*o.w){ for(let t = s; t >= o.min*0.8; t -= .5) if(cnt(t) === 1){ s = t; n = 1; break; } }
    const nn = Math.min(n, 99), h = Math.ceil(nn*s*lhk*100)/100 + 1.4 + (nn > 1 ? 2.5 : 0);
    const wid = nn === 1 ? (o.rich ? wdt(o.rich, css(s), true) : FXP.width(txt, css(s))) : o.w;
    const body = o.rich || (o.parts ? o.parts.map(esc).join('<br>') : esc(txt));
    const html = `<div class="abs" style="left:${o.x}pt;top:${o.y}pt;width:${o.w}pt;height:${h}pt;${css(s)};text-align:${o.align || 'left'};white-space:${nn === 1 ? 'nowrap' : 'normal'};overflow:hidden"${o.small ? ' data-small="1"' : ''} data-slot="${o.slot}" data-lines="${nn}">${body}</div>`;
    return {html, h, s, n: nn, w: wid, ok: n <= lines};
  };
  const caps = (wt, tr, col) => `font-weight:${wt};letter-spacing:${tr}pt;text-transform:uppercase;color:${col}`;

  // ---------- the contact: the one logo floats at the left across the band's edge, name, REALTOR(R) and phone beside it ----------
  const hsOn = OHL.cardMode(D) === 'headshot' && !!A.headshot;
  const contact = (x, y, w, o) => {
    const col = INK, html = [], lh = o.lh, lw = Math.min(lh*4.3, o.stack ? w : w*.46);
    const logo = (lx, ly, lw2, lh2, jc) => OHL.logo(D, 'light', `left:${lx}pt;top:${ly}pt;width:${lw2 || lw}pt;height:${lh2 || lh}pt;justify-content:${jc || 'flex-start'}`);
    if(o.mode === 'logo'){ html.push(logo(x, y)); return {h: lh, html: html.join(''), w: lw}; }
    const hs = hsOn && !o.noHs ? Math.round(o.ns*2.7) : 0, gap = 9;
    const lx0 = o.stack ? x : x + lw + 16;
    const tx = lx0 + (hs ? hs + gap : 0), tw = x + w - tx;
    const nm = T({slot: 'agent.name', text: A.name || '', css: `font-family:'Cormorant Garamond';font-weight:600;letter-spacing:0;color:${col}`, x: tx, y, w: tw, max: o.ns, min: F.body, lh: 1.12});
    let yy = y + nm.h;
    const ds = T({slot: 'agent.desig', text: 'REALTOR®', css: caps(500, 3, TK.text), x: tx, y: yy + 1, w: tw, max: F.small, min: F.small, lh: 1.2, small: 1});
    const showD = !!(A.nar || /realtor/i.test(A.designation || ''));
    if(showD) yy += 1 + ds.h;
    const ph = T({slot: 'agent.phone', text: A.phone || '', css: `font-weight:500;color:var(--fx-text-dark)`, x: tx, y: yy + 2, w: tw, max: o.ps, min: F.body, lh: 1.15});
    yy += 2 + ph.h;
    html.push(nm.html, showD ? ds.html : '', ph.html);
    const th = yy - y;
    if(hs) html.unshift(`<div class="abs" style="left:${lx0}pt;top:${y}pt;width:${hs}pt;height:${Math.max(hs, th)}pt;overflow:hidden"><img src="${esc(A.headshot)}" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></div>`);
    const h = Math.max(th, hs, lh);
    if(o.stack){   // owner 11/8 (FXS-09 socials review, carried): the logo under the agent's lines is centered under them and grows to fill its space
      const tbw = Math.max(nm.w || 0, showD ? ds.w || 0 : 0, ph.w || 0), lh2 = o.lgH || lh, lw2 = Math.min(lh2*4.3, Math.max(tbw, lw));
      html.push(logo(tx + Math.max(0, (tbw - lw2)/2), y + h + 6, lw2, lh2, 'center'));
      return {h: h + 6 + lh2, html: html.join('')};
    }
    html.push(logo(x, y + (h - lh)/2));
    return {h, html: html.join('')};
  };

  // ---------- the street: light number, heavy caps name; the suffix drops first, then a long street runs two lines ----------
  // a suffix drops first, also in front of a unit ("Boulevard Unit 4")
  const SUF = /\s+(Street|St|Drive|Dr|Lane|Ln|Road|Rd|Avenue|Ave|Boulevard|Blvd|Court|Ct|Circle|Cir|Place|Pl|Way|Trail|Trl|Parkway|Pkwy|Terrace|Ter|Highway|Hwy)\.?(?=\s+(Unit|Apt|Suite|Ste|#)\b|\s*$)/i;
  const pa = (OHL.printStreet(L.address).match(/^\s*(\d+[A-Za-z-]*)\s+(.+)$/) || [null, '', L.address]);
  const NUM = pa[1], NAME = pa[2].toUpperCase(), ADDR = OHL.printStreet(L.address).toUpperCase();
  const lineHtml = (tk) => tk.map(k => `<span style="font-weight:${k.num ? 300 : 700}">${esc(k.t)}</span>`).join(' ');
  // the address in light number + heavy caps: one line at a good size, else the suffix drops, else it word-wraps onto 2, 3 or 4
  // lines at the phone floor or above (never smaller than min): number first, a unit stays with the street
  const addr = () => ({h: 0, html: ''});   // the address is the vertical one in the gutter (data-slot=address), so no horizontal copy

  // ---------- the event on the black box (white type) ----------
  // the horizontal address line in the set's tracked caps: "2219 ALDER ROW · HOUSTON, TX 77007"
  const RAW = (SW.data().listing || {}), ADDR_LINE = `${String(RAW.address || L.address).toUpperCase()} · ${String(RAW.city || L.city).toUpperCase()}, ${/^texas$/i.test(RAW.state || L.state) ? 'TX' : String(RAW.state || L.state).toUpperCase()} ${RAW.zip || L.zip || ''}`.trim();
  const addrLine = (x, y, w, k) => T({slot: 'addr.line', text: ADDR_LINE, css: caps(600, 1.6, TK.text), x, y, w, max: Math.max(F.small*1.35, 14)*Math.min(k, 1.2), min: F.small, lh: 1.25, small: 1});
  const evBlock = (x, y, w, k, lvl, o) => {
    o = o || {};
    const out = []; let yy = y, right = 0;
    const lab1 = FXP.fitSize(E.label.toUpperCase(), `${MONT};${caps(600, 3.4*k, TK.accent)}`, w, F.ev*1.3*k, F.ev);
    const parts = lab1 >= F.ev*1.02 || o.noSplit ? null : OHL.labelLines(E.label.toUpperCase(), 2);
    const lab = T({slot: 'oh.label', text: E.label.toUpperCase(), parts, css: caps(600, 3.4*k, TK.accent) + ';text-decoration:underline;text-decoration-thickness:.75pt;text-underline-offset:5pt', x, y: yy, w, max: F.ev*1.3*k, min: F.ev, lines: parts ? 2 : 1, lh: o.tight ? 1.1 : 1.15});
    out.push(lab.html); yy += lab.h + 5*k; right = Math.max(right, lab.w); const labelLines = lab.n;
    const md = String(E.monthDay || E.long), sp = md.lastIndexOf(' ');
    if(!o.merged){
      const wk = T({slot: 'oh.weekday', text: E.weekday.toUpperCase(), css: caps(600, o.smallWk ? 3 : 4.5, SOFT), x, y: yy, w, max: Math.max(o.smallWk ? F.small : F.body, 13)*Math.min(k, 1.25), min: o.smallWk ? F.small : F.body, lh: 1.15, small: o.smallWk ? 1 : 0});
      out.push(wk.html); yy += wk.h + 2*k; right = Math.max(right, wk.w);
    }
    const dtext = o.merged ? E.long : md;
    const rich = !o.merged && sp > 0 ? `${esc(md.slice(0, sp))} ${esc(md.slice(sp + 1))}` : esc(dtext);
    const dt = T({slot: 'oh.date', text: dtext, rich: o.merged ? null : rich, css: `font-family:'Cormorant Garamond';font-weight:700;letter-spacing:0;color:var(--fx-ink)`, x: x - 1, y: yy, w: w + 1, max: w >= 250 ? Math.max(F.ev*2.25*k, o.tight ? 36 : 41) : F.ev*2.25*k, min: w >= 250 ? Math.max(F.ev*1.1, 30) : F.ev*1.1, lines: o.merged && !o.one ? 2 : 1, lh: 1.04});
    out.push(dt.html); yy += dt.h + 4*k; right = Math.max(right, dt.w);
    if(E.time){
      const tcss = `font-family:'Bodoni Moda';font-weight:600;color:var(--fx-ink)`, tparts = /\sto\s/.test(E.time) && FXP.width(E.time, `${MONT};${tcss};font-size:${F.ev}pt`) > w ? E.time.replace(/\s+to\s+/, ' to|').split('|') : null;
      const tm = T({slot: 'oh.time', text: E.time, parts: tparts, css: tcss, x, y: yy, w, max: Math.max(dt.s*.6, F.ev), min: F.ev, lines: tparts ? 2 : 1, lh: o.tight ? 1.15 : 1.2});
      out.push(tm.html); yy += tm.h; right = Math.max(right, tm.w);
    }
    { const al = addrLine(x, yy + 6*k, w, k); out.push(al.html); yy += 6*k + al.h; right = Math.max(right, al.w); }
    const items = lvl >= 2 ? [] : [[E.refreshments, 'oh.refreshments', 700], lvl >= 1 ? [] : [E.note, 'oh.note', 500]].filter(i => i[0]);
    if(items.length){
      yy += 9*k;
      const bf = Math.max(F.body, 13)*Math.min(k, 1.25), px = 12, py = o.tight ? 6 : 9;
      const rows = []; let by = yy + py;
      items.forEach(([t, slot, wt]) => { const r = T({slot, text: t, css: `font-family:'Cormorant Garamond';font-weight:${wt === 700 ? 700 : 600};color:${INK}`, x: x + px, y: by, w: w - 2*px, max: bf, min: F.body, lines: 3, lh: o.tight ? 1.1 : 1.22, align: 'center'}); rows.push(r.html); by += r.h + 3; });
      by -= 3;
      out.push(`<div class="abs" data-box="oh.box" style="left:${x}pt;top:${yy}pt;width:${w}pt;height:${by - yy + py}pt;background:var(--fx-card);border:.75pt solid var(--fx-rule)"></div>`, ...rows);
      yy = by + py; right = w;
    }
    return {h: yy - y, html: out.join(''), right, hasBox: items.length > 0, labelLines};
  };

  const six = OHL.factSix(L).filter(([ic]) => ic !== 'stories' || OHL.factSix(L).length < 4)
    .map(([ic, t]) => ic === 'bed' ? t.replace('bedroom', 'bed') : ic === 'bath' ? t.replace(' full bath', ' bath') : ic === 'area' ? t.replace(' square feet', ' sq ft') : ic === 'cal' ? t.replace('Built in ', 'Built ') : t);
  // a fact never splits (non-breaking spaces inside it, the separator stays with the fact before it); facts drop from the end until the line fits one line
  const NB = t => t.replace(/ /g, '\u00a0');
  const factsLine = (w, size) => { const lo = Math.max(F.body, size*.85); for(let n = six.length; n >= 1; n--){ const t = six.slice(0, n).map(NB).join('\u00a0· '); if(FXP.width(t, `${MONT};font-weight:600;font-size:${lo}pt`) <= w) return t; } return NB(six[0] || ''); };

  // ---------- Just Listed / Just Sold words on the box ----------
  const info = (x, y, w, k, o) => {
    o = o || {};
    if(kind === 'oh') return evBlock(x, y, w, k, o.lvl || 0, o);
    const out = []; let yy = y;
    if(kind === 'js'){
      const sl = FXP.soldLine(D);
      const hs = Math.max(F.body*1.6, 18)*Math.min(k, 1.3);
      const h1 = T({slot: 'sold.head', text: sl.head, css: `font-family:'Cormorant Garamond';font-weight:700;color:var(--fx-ink)`, x, y: yy, w, max: hs*1.15, min: F.body, lines: 2, lh: 1.12});
      out.push(h1.html); yy += h1.h + 3;
      if(sl.line && !o.noLine){ const l2 = T({slot: 'sold.line', text: sl.line, css: `font-family:'Cormorant Garamond';font-weight:600;color:${SOFT}`, x, y: yy, w, max: Math.max(F.body*1.25, 15)*Math.min(k, 1.2), min: F.body, lines: 2, lh: 1.2}); out.push(l2.html); yy += l2.h; }
      yy += 9*Math.min(k, 1.3);
      const ad = addr(x, yy, w, F.ev*1.05*Math.min(k, 1.2), F.ev, TK.ink); out.push(ad.html); yy += ad.h + 1;
      const pl = T({slot: 'place', text: OHL.place(L).toUpperCase(), css: caps(500, w < 190 ? 1.2 : 2, SOFT), x: x + 1, y: yy, w, max: Math.max(F.small, 11), min: F.small, lh: 1.2, small: 1});
      out.push(pl.html); yy += pl.h;
      return {h: yy - y, html: out.join(''), right: w};
    }
    const ad = addr(x, yy, w, F.ev*1.9*k, F.ev, TK.ink); out.push(ad.html); yy += ad.h + 1;
    const pl = T({slot: 'place', text: OHL.place(L).toUpperCase(), css: caps(500, w < 190 ? 1.2 : 3, SOFT), x: x + 1, y: yy, w, max: Math.max(F.small*1.15, 11)*Math.min(k, 1.3), min: F.small, lh: 1.2, small: 1});
    out.push(pl.html); yy += pl.h + 8*k;
    const fs = Math.max(F.body*1.1, 14)*Math.min(k, 1.3);
    const sp = FXS.statItems(L).slice(0, 3), parts3 = sp.map(q => FXS.statParts(q));
    let npz = Math.max(16, F.body*1.3), lpz = F.small, trk = 1, gapF = 12;
    const rowW = () => parts3.map(p => FXP.width(p.n, `font-family:'Bodoni Moda';font-weight:500;font-size:${npz}pt`) + FXP.width(p.l, `font-family:Montserrat;font-weight:600;font-size:${lpz}pt;letter-spacing:${trk}pt;text-transform:uppercase`) + lpz*.6).reduce((a, b) => a + b, 0) + (parts3.length - 1)*(gapF*2 + .75);
    const nfloor = Math.max(16, F.small*1.1); while(rowW() > w && npz > nfloor) npz -= .5;
    while(rowW() > w && trk > 0) trk -= .25;
    while(rowW() > w && gapF > 6) gapF -= 1;
if(rowW() <= w){
      out.push(`<div class="abs" style="left:${x}pt;top:${yy}pt;width:${w}pt;height:${npz*1.45}pt;display:flex;align-items:baseline;white-space:nowrap" data-slot="facts" data-small="1" data-lines="1">${sp.map((q, i) => `${i ? `<span style="display:inline-block;width:.75pt;height:${npz*.8}pt;background:var(--fx-rule);margin:0 ${gapF}pt;align-self:center"></span>` : ''}<span>${FXS.statHtml(q, npz, lpz, trk)}</span>`).join('')}</div>`); yy += npz*1.45;
    } else {   // a narrow column (the wide and Google shapes): the facts wrap whole, two rows
      const cw3 = parts3.map(p => FXP.width(p.n, `font-family:'Bodoni Moda';font-weight:500;font-size:${npz}pt`) + FXP.width(p.l, `font-family:Montserrat;font-weight:600;font-size:${lpz}pt;letter-spacing:${trk}pt;text-transform:uppercase`) + lpz*.6 + 14);
      let rowsF = 1, acc = 0; cw3.forEach(c => { if(acc + c > w && acc > 0){ rowsF++; acc = 0; } acc += c; });
      out.push(`<div class="abs" style="left:${x}pt;top:${yy}pt;width:${w}pt;height:${rowsF*npz*1.45}pt;display:flex;flex-wrap:wrap;column-gap:14pt;align-items:baseline;white-space:nowrap" data-slot="facts" data-small="1" data-lines="${rowsF}">${sp.map(q => `<span>${FXS.statHtml(q, npz, lpz, trk)}</span>`).join('')}</div>`); yy += rowsF*npz*1.45;
    }
    { const al = addrLine(x, yy + 4*k, w, k); out.push(al.html); yy += 4*k + al.h; }
    if(o.wl > 0){
      const ws = Math.max(F.body, 12.5*Math.min(k, 1.15)), wcls = 'wuF' + String(ws).replace('.', '_') + '_' + Math.round(w);
      if(!document.querySelector('style[data-c="' + wcls + '"]')){ const st = document.createElement('style'); st.dataset.c = wcls; st.textContent = `.${wcls}{font-family:'Cormorant Garamond';font-style:italic;font-weight:500;font-size:${ws*1.18}pt;line-height:${ws*1.4}pt}`; document.head.appendChild(st); }
      let wu = {text: ''};
      for(let n = o.wl; n >= 1; n--){ const r = OHL.writeup(D2, wcls, w, ws*1.4, n, [factsLine(w, fs).replace(/\u00a0/g, ' ')], {narrow: true}); if(r.text && (r.fill >= .75 || r.n === 1)){ wu = r; break; } }
      if(wu.text){ yy += 7*k; out.push(`<div class="abs ${wcls}" style="left:${x}pt;top:${yy}pt;width:${wu.w || w}pt;height:${wu.n*ws*1.4 + 1}pt;color:var(--fx-text)" data-slot="listing.body" data-lines="${wu.n}">${esc(wu.text)}</div>`); yy += wu.n*ws*1.4 + 1; }
    }
    return {h: yy - y, html: out.join(''), right: w};
  };

  // the moment word: light over heavy
  const moment = (x, y, w, o) => {
    const words = (kind === 'js' ? 'JUST SOLD' : 'JUST LISTED').split(' ');
    const rich = (a, b) => `<span style="font-family:'Cormorant Garamond';font-weight:500">${a}</span>${o.stack ? '<br>' : ' '}<span style="font-family:'Bodoni Moda';font-weight:500">${b}</span>`;
    if(o.stack){
      const s = Math.min(o.max, FXP.fitSize(words[1], `font-family:'Bodoni Moda';font-weight:500;letter-spacing:0`, w, o.max, F.ev)), lh = s*.95;
      return {h: lh*2 + 4, s, html: `<div class="abs" style="left:${x - 1}pt;top:${y}pt;width:${w + 1}pt;height:${lh*2 + 4}pt;${MONT};font-size:${s}pt;line-height:${lh}pt;letter-spacing:0;color:${o.color || INK};white-space:nowrap;overflow:hidden" data-slot="moment" data-lines="2">${rich(words[0], words[1])}</div>`};
    }

  };

  // =========================== side: wide, gbp ===========================
  // left: the strip (arch room + whole house) over the address and agent; right: the black box (round left end) holding the words
  const sideLayout = (lwf, lvlW, retried, base0, vm) => {
    lvlW = lvlW || 0; base0 = base0 || lwf; vm = vm || 0;   // vm 1: the label on one line and the weekday folded into the date, to keep served and notes
    const m = Math.round(H*.045), wide = shape === 'wide';
    const LW = Math.round(W*lwf), blkL = LW, tx = blkL + 22, tw = W - m*.8 - tx;
    const sx = AX, sw = blkL - 8 - sx;
    const cOpt = Object.assign(cOptFor(), {ns: Math.max(F.body*1.1, 15), ps: Math.max(F.body*1.05, 14), lh: Math.max(24, F.body*1.5), stack: true});
    const cw = sw;
    const needW = Math.max(FXP.width(A.name || '', `${MONT};font-weight:600;font-size:${Math.max(F.body, 15)}pt`), FXP.width(A.phone || '', `${MONT};font-weight:500;font-size:${Math.max(F.body, 14)}pt`)) + 10;
    if(hsOn) cOpt.noHs = true;
    let cc = contact(AX, 0, cw, cOpt), mode = null;
    let ad = kind === 'oh' ? addr(AX, 0, cw, F.ev*1.05, F.ev, INK) : {h: 0};
    let plH = kind === 'oh' ? F.small*1.4 : 0;
    let below = cc.h + 10 + (ad.h ? ad.h + plH + 6 : 0);
    if(H - 2*m - below < 100 && plH){ plH = 0; below = cc.h + 10 + ad.h + 6; }
    if(H - 2*m - below < 100){ cOpt.mode = 'logo'; cc = contact(AX, 0, cw, cOpt); below = cc.h + 10 + (ad.h ? ad.h + 6 : 0); }
    const topH = m + (kind === 'oh' ? 0 : 0);
    let hd = {h: 0, html: ''};
    const words = (k) => {
      if(kind !== 'oh'){ const mo = moment(tx, 0, tw, {stack: true, max: F.ev*2.1*k, color: TK.ink}); const nl = k < .95, inf = info(tx, mo.h + 10*k, tw, k, {lvl: 2, wl: 0, noLine: nl}); return {h: mo.h + 10*k + inf.h, mk: yy => moment(tx, yy, tw, {stack: true, max: F.ev*2.1*k, color: TK.ink}).html + info(tx, yy + mo.h + 10*k, tw, k, {lvl: 2, wl: 0, noLine: nl}).html}; }
      const inf = info(tx, 0, tw, k, {lvl: lvlW, smallWk: true, tight: true, merged: !!vm, noSplit: !!vm}); return {h: inf.h, mk: yy => info(tx, yy, tw, k, {lvl: lvlW, smallWk: true, tight: true, merged: !!vm, noSplit: !!vm}).html};
    };
    let best = null;
    for(let k = kind === 'oh' ? 2.4 : 2.2; k >= .4; k -= .05){ const w = words(k); if(w.h <= (kind === 'oh' ? H - 2*9 : H - 2*8 - 36)){ best = {k, w}; break; } }
    if(!best && kind === 'oh'){   // too much for this width: the left column narrows first (what's served and the notes never drop for room), the notes go only when it cannot
      const lmin = (needW + AX + 8 + 6)/W;
      if(lwf - .03 >= lmin) return sideLayout(lwf - .03, lvlW, retried, base0, vm);
      if(!vm) return sideLayout(base0, lvlW, retried, base0, 1);
      if(lvlW < 2) return sideLayout(base0, lvlW + 1, retried, base0, 0);
    }
    if(!best){ if(!retried) return sideLayout(wide ? .5 : .56, 0, true, wide ? .5 : .56); best = {k: 1, w: words(1)}; }
    const ph = H - m*2 - below;
    const [alo] = houseAspect(hero), g6 = 6;
    const fr0 = OHL.fitHero(D, hero, sw, Math.floor(Math.min(ph*.62, sw/alo)), true), restH = ph - fr0.h - g6, rms = roomsAll();
    let sh;
    if(restH >= 44 && rms.length >= 3){
      let hx = sx + (sw - fr0.w)/2, rr = rms;   // the house fills the column from the left margin; a gap beside it takes a room photo
      if(fr0.w < sw - 2){ const gw = sw - fr0.w - g6; if(gw >= 30 && rr.length > 2){ front.push(pic(rr[0], sx, m, gw, fr0.h, archCss(gw, fr0.h))); rr = rr.slice(1); hx = sx + gw + g6; } }
      front.push(pic(hero, hx, m, fr0.w, fr0.h));
      const h2 = Math.min(restH, sw*.5), n = Math.min(3, rr.length, Math.max(2, Math.round(sw/(h2*1.05)))), w2 = (sw - (n - 1)*g6)/n;
      rr.slice(0, n).forEach((id, i) => front.push(pic(id, sx + i*(w2 + g6), m + fr0.h + g6, w2, h2, i === 0 ? archCss(w2, h2) : '')));
      sh = fr0.h + g6 + h2;
    } else {
      const sh0 = Math.floor(Math.min(ph, sw*.75)), pl = stripPlan(sw, sh0, Math.min(sh0, Math.max(48, sh0*.55)), []);
      if(pl){ drawStrip(pl, sx, m); sh = pl.h; } else sh = stripFallback(sw, sh0, sx, m);
    }
    const bh = H, rad = 44;
    back.push(evFrame(blkL, 0, W - blkL, H));
    const by = Math.max(kind === 'oh' ? 8 : 10, (H - best.w.h)/2);
    mid.push(best.w.mk(by));
    let ly = m + sh + 12;
    if(kind === 'oh'){ const a2 = addr(AX, ly, cw, F.ev*1.05, F.ev, INK); mid.push(a2.html); ly += a2.h; if(plH){ const p2 = T({slot: 'place', text: OHL.place(L).toUpperCase(), css: caps(500, 1.2, TK.textDark), x: AX + 1, y: ly, w: cw, max: F.small*1.1, min: F.small, lh: 1.2, small: 1}); mid.push(p2.html); ly += p2.h; } }
    if(!cOpt.mode){ const free = (H - m - cc.h) - (ly + 6) - 6; if(free > 3){ cOpt.lgH = cOpt.lh + Math.min(free, cOpt.lh*1.1); cc = contact(AX, 0, cw, cOpt); } }   // the logo takes the spare height under the agent
    mid.push(contact(AX, Math.max(ly + 6, H - m - cc.h), cw, cOpt).html);
  };

  // =========================== slides with a caption (Just Listed, Open House) ===========================
  const captionSlide = () => {
    const m = margin, id = D.piece.photo, idx = Math.max(0, FXP.slides(D, kind).indexOf(id)), alt = idx % 2 === 1;
    const full = Ivory.fullHouse(D, id), sx = AX, sw = W - m - sx, cx = BW + 14, cw = W - m - cx;
    const cOpt = Object.assign(cOptFor(), {ns: F.body*1.05, ps: F.body, lh: 28});   // the room slides' agent row is small; the closing slide's card is about twice it
    const cH = Math.max(contact(0, 0, W - 2*m, cOpt).h, cOpt.lh);
    const top = m - 2, bottom = H - m + 2, padB = 10;
    let bar = null;
    if(kind === 'oh'){
      const ix = AX + 24, iw = W - m - 12 - ix;
      const mkRow = (slot, text, css, max) => T({slot, text, css, x: ix, y: 0, w: iw, max, min: F.ev, lh: 1.1});
      const rows = [mkRow('oh.label', E.label.toUpperCase(), caps(600, 3, TK.accent) + ';text-decoration:underline;text-decoration-thickness:.75pt;text-underline-offset:4pt', F.ev*1.05), mkRow('oh.date', E.long, `font-family:'Cormorant Garamond';font-weight:700;color:var(--fx-ink)`, F.ev*1.35)];
      if(E.time) rows.push(mkRow('oh.time', E.time, `font-family:'Bodoni Moda';font-weight:600;color:var(--fx-ink)`, F.ev*1.25));
      rows.push(T({slot: 'addr.line', text: ADDR_LINE, css: caps(600, 1.4, TK.text), x: ix, y: 0, w: iw, max: F.small*1.3, min: F.small, lh: 1.1, small: 1}));   // the address on every Open House slide
      bar = {rows, ix, h: rows.reduce((t, r) => t + r.h, 0) + 2*padB + 1};
    }
    const lastFill = (t, css, w) => { const q = document.createElement('div'); q.style.cssText = `position:absolute;left:-9999pt;visibility:hidden;width:${w}pt;${css}`; q.textContent = t; document.body.appendChild(q);
      const r = document.createRange(); r.selectNodeContents(q); const rs = [...r.getClientRects()].filter(z => z.width > .5), tp = Math.max(...rs.map(z => z.top));
      const last = rs.filter(z => Math.abs(z.top - tp) < 2), wd = (Math.max(...last.map(z => z.right)) - Math.min(...last.map(z => z.left)))*.75; q.remove(); return wd/w; };
    const CAPCSS = `font-family:'Cormorant Garamond';font-weight:700;color:${INK};text-wrap:balance`;
    const capAt = (txt, cs, two) => { for(let w2 = cw; w2 >= cw*.45; w2 -= 1){ const c = T({slot: 'caption', text: txt, css: CAPCSS, x: cx, y: 0, w: w2, max: cs, min: cs, lines: 3, lh: 1.25});
      if(c.ok && (two ? c.n === 2 : true) && (c.n === 1 || lastFill(txt, `${MONT};${CAPCSS};font-size:${cs}pt;line-height:${(cs*1.25).toFixed(2)}pt`, w2) >= .78)) return {c, w: w2, txt, cs}; } return null; };
    const cands = FXP.carouselCaps(D, id).concat(FXP.carouselCaps(D, id).map(t => t.split('. ').slice(0, 2).join('. ').replace(/\.?$/, '.'))).filter((t, i, arr) => t && arr.indexOf(t) === i);   // the written captions (room name, then one fact)
    const minPh = full ? minH(id, sw) : sw*.6, gap0 = 10, fixedB = (bar ? bar.h + gap0 : 0) + cH + 3*gap0;
    let pick = null;
    outer: for(const two of [true, false]) for(const cs of [F.body*1.7, F.body*1.6, F.body*1.5, F.body*1.4, F.body*1.3]) for(const txt of cands){ const r = capAt(txt, cs, two); if(!r) continue; const avail = bottom - top - r.c.h - fixedB; if(avail >= minPh){ pick = Object.assign(r, {avail}); break outer; } }
    if(!pick){ const txt = cands[cands.length - 1], cs = F.body*1.5, c = T({slot: 'caption', text: txt, css: CAPCSS, x: cx, y: 0, w: cw, max: cs, min: cs, lines: 3, lh: 1.25}); pick = {c, w: cw, txt, cs, avail: bottom - top - c.h - fixedB}; }
    if(pick.c.n !== 2 || lastFill(pick.txt, `${MONT};${CAPCSS};font-size:${pick.cs}pt;line-height:${(pick.cs*1.25).toFixed(2)}pt`, pick.w) < .78) tiny.push({slot: 'caption', kind: 'caption-not-two-full-lines', detail: `"${pick.txt}" sets in ${pick.c.n} line(s)`});   // two full lines, the last at least 3/4 full
    if(/^[A-Za-z]+\d?\.?$/.test(String(pick.txt).trim())) tiny.push({slot: 'caption', kind: 'raw-tag', detail: `a photo tag printed as copy: "${pick.txt}"`});   // never a tag, one word and a period
    const maxPh = full ? sw*((D.photos[id] || {}).h || 2)/((D.photos[id] || {}).w || 3) : sw*1.1, ph = Math.min(pick.avail, maxPh);
    const fr = full ? OHL.fitHero(D, id, sw, Math.floor(ph), true) : {w: sw, h: Math.floor(ph)};
    const spare = Math.max(0, pick.avail - fr.h), g = gap0 + spare/3;
    const capT = y => T({slot: 'caption', text: pick.txt, css: CAPCSS, x: cx, y, w: pick.w, max: pick.cs, min: pick.cs, lines: 3, lh: 1.25}).html;
    let y = top, py, capY;
    if(!alt){ py = y; y += fr.h + g; capY = y; y += pick.c.h + g; } else { capY = y; y += pick.c.h + g; py = y; y += fr.h + g; }
    front.push(pic(id, sx + sw - fr.w, py, fr.w, fr.h, full ? '' : archCss(fr.w, fr.h)));
    front.push(capT(capY));
    if(bar){
      back.push(evFrame(AX, y, W - AX, bar.h));
      let ry = y + padB; bar.rows.forEach(r => { front.push(r.html.replace(/top:[\d.]+pt/, `top:${ry}pt`)); ry += r.h; });
    }
    mid.push(contact(AX, bottom - cH, W - m - AX, cOpt).html);
  };

  // =========================== the closing slide (Just Listed, Open House): the house, the call to action, the agent big, the address ===========================
  const closeSlide = () => {
    const m = margin, top = m - 2, bottom = H - m + 2, gap = 8, sx = AX, sw = W - m - sx, cx = BW + 14, cw = W - m - cx;
    const first = String(A.name || 'me').split(' ')[0];
    const ctaText = kind === 'oh' ? `See you ${E.weekday}${E.time ? ', ' + E.time : ''}.` : `Call or text ${first} for a private showing.`;
    const ctaCss = `font-family:'Cormorant Garamond';font-weight:700;color:${INK}`;
    const lastFillC = (t, css, w) => { const q = document.createElement('div'); q.style.cssText = `position:absolute;left:-9999pt;visibility:hidden;width:${w}pt;${css}`; q.textContent = t; document.body.appendChild(q);
      const r = document.createRange(); r.selectNodeContents(q); const rs = [...r.getClientRects()].filter(z => z.width > .5), tp = Math.max(...rs.map(z => z.top));
      const last = rs.filter(z => Math.abs(z.top - tp) < 2), wd = (Math.max(...last.map(z => z.right)) - Math.min(...last.map(z => z.left)))*.75; q.remove(); return wd/w; };
    let ctaW = cw, ctaS = F.body*2.3;
    search: for(let sz = F.body*2.3; sz >= F.body*1.5; sz -= .5) for(let w2 = cw; w2 >= cw*.5; w2 -= 2){
      const c = T({slot: 'cta', text: ctaText, css: ctaCss + ';text-wrap:balance', x: cx, y: 0, w: w2, max: sz, min: sz, lines: 3, lh: 1.15});
      if(c.ok && (c.n === 1 || lastFillC(ctaText, `${MONT};${ctaCss};text-wrap:balance;font-size:${sz}pt;line-height:${(sz*1.15).toFixed(2)}pt`, w2) >= .78)){ ctaW = w2; ctaS = sz; break search; } }
    const mk = y => T({slot: 'cta', text: ctaText, css: ctaCss + ';text-wrap:balance', x: cx, y, w: ctaW, max: ctaS, min: ctaS, lines: 3, lh: 1.15});
    // the agent: name 60 px and phone 54 px (bold) at 1080, left on the call to action's edge; the logo on the bottom row
    const NS = 22.5, PS = 20.25;
    const nameT = y => T({slot: 'agent.name', text: A.name || '', css: `font-family:'Cormorant Garamond';font-weight:700;color:${INK}`, x: cx, y, w: cw, max: NS, min: NS, lh: 1.12});
    const desT = y => T({slot: 'agent.desig', text: 'REALTOR®', css: caps(600, 4, TK.text), x: cx, y, w: cw, max: Math.max(F.small*1.25, 11), min: F.small, lh: 1.2, small: 1});
    const phT = y => T({slot: 'agent.phone', text: A.phone || '', css: `font-family:'Bodoni Moda';font-weight:600;color:${TK.textDark}`, x: cx, y, w: cw, max: PS, min: PS, lh: 1.15});
    const n0 = nameT(0), d0 = desT(0), p0 = phT(0), logoH = 34, cardH = n0.h + 3 + d0.h + 6 + p0.h;
    const cta0 = mk(0), ad0 = addrLine(cx, 0, cw, 1);
    const avail = bottom - top - cta0.h - ad0.h - cardH - logoH - 5*gap;
    const ph = Math.floor(Math.min(avail, HERO_H));   // the same hero box as the post, shortened only when the page runs out of height
    heroBox(sx, top, sw, ph);
    let y = top + ph + gap + Math.max(0, (avail - ph)/4);
    front.push(mk(y).html); y += cta0.h + 8;
    front.push(addrLine(cx, y, cw, 1).html); y += ad0.h + gap + 6;
    mid.push(nameT(y).html); y += n0.h + 3;
    mid.push(desT(y).html); y += d0.h + 6;
    mid.push(phT(y).html);
    mid.push(OHL.logo(D, 'light', `left:${cx}pt;top:${bottom - logoH}pt;width:240pt;height:${logoH}pt;justify-content:flex-start`));
  };

  // ---------- which layout ----------
  const stackHead = kind !== 'oh' && ((shape === 'story' || shape === 'pin') ? 'stack' : 'one');
  if(shape === 'slide' && kind !== 'js' && D.piece.photo === '@close') closeSlide();
  else if(shape === 'slide' && kind !== 'js') captionSlide();
  else if(shape === 'slide') column({head: 'one', photo: D.piece.photo});
  else if(kind === 'oh' && (E.refreshments || E.note) && shape === 'post') compactPost();
  else if(kind === 'oh' && (E.refreshments || E.note) && shape === 'square') compact();
  else if(shape === 'post' || shape === 'pin' || shape === 'story') column({head: kind === 'oh' ? null : stackHead});
  else if(shape === 'square') squareLayout();
  else sideLayout(shape === 'wide' ? (kind === 'oh' ? (ADDR.length > 14 ? .52 : .46) : .5) : (kind === 'oh' ? .5 : .56));
  bandAll();
  return {W, H, issues: tiny, html: `<div class="page" data-page="${esc(D.piece.id)}" style="position:relative;overflow:hidden;width:${W}pt;height:${H}pt;background:var(--fx-paper)">${back.join('')}${front.join('')}${mid.join('')}</div>`};
});
</script>
</body>
