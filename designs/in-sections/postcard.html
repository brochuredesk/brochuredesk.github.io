<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The House in Sections postcard</title>
<link rel="stylesheet" href="in-sections.css">
<link rel="stylesheet" href="in-sections-cards.css">
<script src="in-sections.js"></script>
<script src="in-sections-cards.js"></script>
<!--
  The House in Sections · Just Listed and Just Sold postcards. data.piece: card "listed" | "sold", size "6x9" (trim 648 x 432 pt) | "6x11"
  (792 x 432 pt), side "front" | "back". Print adds 0.125 in (9 pt) bleed on every edge (TrimBox set by the renderer).
  Pale gray paper, a tinted section column and red small-caps heads, bold Hanken Grotesk titles.
  Front: the whole house (roof to steps, house box kept in frame) bleeds off the top and left; the tinted column on the right runs the full
  height of the card, edge to edge, and holds the red "Just Listed" / "Just Sold" head, the street, city, state and ZIP and the facts stacked
  (Just Listed) or the invitation and the agent's name and number (Just Sold). A short write-up and a row of interiors fill the left.
  Back: a red edge strip across the top; the tinted column runs full height down the right edge behind the return address, the status,
  the street, the red callout, the postage box, the address block, the contact card and the barcode strip. Just Listed: captioned rooms,
  each under a red section head, size in red caps as the book prints it; Just Sold: two interiors, what the agent does and the first
  meeting. The postcard contact card runs full width (one brokerage logo). Mail zones are the Just Listed library's; guides on proofs.
  No price, no QR, no photo numbers, no "virtually staged". Copy: data.copy.pc.jl / data.copy.pc.js.
-->
</head>
<body data-mode="email">
<script src="capfit.js"></script>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const AT = window.PG, D = AT.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="color:#fff;padding:20pt">No data injected.</p>'; return; }
  const esc = AT.esc, L = D.listing, A = D.agent || {}, b = D.brand || {};
  const issues = await AT.fontsReady(D);
  const sold = D.piece.card === 'sold', big = D.piece.size === '6x11', front = D.piece.side === 'front';
  const PCall = ((D.copy || {}).pc || {}), PC = (sold ? PCall.js : PCall.jl) || {};
  document.body.dataset.mode = D.mode || 'email';
  if(D.piece.size === '6x11') document.body.classList.add('big');
  const PT = 96/72, W = big ? 792 : 648, H = 432, M = 27, status = sold ? ['Just', 'Sold'] : ['Just', 'Listed'];
  const hero = PC.hero || 'front';
  let h = '';

  if(front){
    // ---------- front ----------
    // (owner 11/7: the whole house, roof and sides, always shows: a tall house photo narrows the hero frame to the photo's own shape,
    // and the tinted column beside it takes the width it gives up)
    const hp0 = (D.photos || {})[hero] || {}, bx0 = hp0.box || (AT.fullHouse(D, hero) ? [0, 0, 1, 1] : null), ph = 261, xMax = bx0 && hp0.w ? Math.floor(ph*hp0.w/(hp0.h*((bx0[3] - bx0[1]) + .012))) - 9 : 1e9;
    const xR = Math.max(360, Math.min(big ? 497 : 420, xMax)), cx = xR + 18, cw = W - M - cx, S = big ? 56 : 52, LH = big ? 52 : 48;
    // the tinted column: the full height of the card, edge to edge (bleed included)
    h += `<div class="tcol" style="left:${xR}pt;top:-9pt;width:${W - xR + 9}pt;height:${H + 18}pt"></div>`;
    h += AT.ph(D, hero, `position:absolute;left:-9pt;top:-9pt;width:${xR + 9}pt;height:${ph}pt`, 'front.hero', 'hero');
    let bottom;
    if(!sold){
      const st = AT.stats(L), fi = AT.fifth(L); if(fi) st.push(fi);
      bottom = `<div class="stk" style="flex:1;display:flex;flex-direction:column;margin-top:12pt;border-top:1.5pt solid var(--accent)">${st.slice(0, 5).map((t, i) => `<div style="flex:1;display:flex;align-items:center;font-size:10pt;line-height:12pt" data-slot="stat${i}" data-lines="1">${esc(t)}</div>`).join('')}</div>`;
    } else {
      const rows = [[A.name, 'agent.name', 'font:700 13pt/16pt var(--font-display);color:var(--ink)'], [A.phone, 'agent.phone', 'font:700 12pt/15pt var(--font-body);letter-spacing:.3pt;color:var(--accent)'], [A.email, 'agent.email', 'font:500 9.5pt/12pt var(--font-body);color:var(--text)'], [A.web, 'agent.web', 'font:500 9.5pt/12pt var(--font-body);color:var(--text)']].filter(r => r[0]);
      bottom = `<div style="margin-top:14pt;border-top:1.5pt solid var(--accent);padding-top:10pt"><div class="dsp" style="font-size:21pt;line-height:24pt;color:var(--accent);letter-spacing:-.3pt" data-slot="sold.cta" data-lines="2">${esc(PC.cta1 || 'Thinking of selling?')}<br>${esc(PC.cta2 || 'Let’s talk.')}</div></div>
        <div class="stk" style="flex:1;display:flex;flex-direction:column;margin-top:12pt;border-top:.6pt solid rgba(194,59,50,.45)">${rows.map(r => `<div style="flex:1;display:flex;align-items:center;white-space:nowrap;overflow:hidden;letter-spacing:0;text-transform:none;${r[2]}" data-slot="${r[1]}" data-lines="1">${esc(r[0])}</div>`).join('')}</div>`;
    }
    h += `<div class="abs rc" style="left:${cx}pt;top:14pt;width:${cw}pt;height:${sold ? 396 : 392}pt;justify-content:flex-start">
      <div><div class="sc" style="height:10pt;margin-bottom:8pt" data-slot="front.sechead" data-lines="1">${esc(sold ? PC.sechead || 'New neighbor' : PC.sechead || 'On the market')}</div><div class="head" id="head" style="margin-left:-2pt;height:${2*LH}pt;font-size:${S}pt;line-height:${LH}pt" data-slot="status" data-lines="2">${status[0]}<br><b>${status[1]}</b></div></div>
      <div style="margin-top:14pt"><div class="dsp" id="addr" style="margin-left:-1pt;font-size:${big ? 29 : 25.5}pt;line-height:${big ? 31 : 27}pt;white-space:normal;height:auto" data-slot="address" data-lines="2">${esc(L.address)}</div>
        <div class="kicker" style="margin-top:7pt;height:10pt" data-slot="place" data-lines="1">${esc(AT.placeZip(L).toUpperCase())}</div></div>
      ${bottom}</div>`;
    const tw = xR - M - 18, tt = ph - 9 + 10;
    let flh = sold && big ? 16.5 : 15, ffs = sold && big ? 11.5 : 10.5, ftx = big ? PC.front11 : PC.front9;
    // (a narrowed hero frame, a tall or box-less house photo, gives the write-up less width: it keeps its three lines with the shorter
    // write-up and the type that still fills them)
    if(xR < (big ? 497 : 420) && AT.measure){ let pick = null;
      for(const t of [ftx, PC.front9].filter(Boolean)) for(let fs = ffs; fs >= 9.5 - 1e-6; fs -= 0.25){ const m = AT.measure(t, tw, fs, fs*1.43);
        if(m.lines === 3 && m.last >= .8){ pick = {t, fs}; break; } if(m.lines < 3) break; }
      if(pick){ ftx = pick.t; ffs = pick.fs; flh = Math.round(pick.fs*1.43*4)/4; } }
    h += `<div class="abs ptxt2 jt" style="left:${M}pt;top:${tt}pt;width:${tw}pt;height:${3*flh + 1}pt;line-height:${flh}pt;font-size:${ffs}pt" data-slot="front.about" data-para="1" data-min="3" data-fillbox="1"${sold && big ? ' data-nobal="1"' : ''}>${esc(ftx)}</div>`;
    // the interiors across the bottom of the left side
    const ids = (PC.strip || []).slice(0, big ? 4 : 3), g = 8, sw = (tw - g*(ids.length - 1))/ids.length;
    ids.forEach((id, i) => { h += AT.ph(D, id, `position:absolute;left:${(M + i*(sw + g)).toFixed(2)}pt;top:318pt;width:${sw.toFixed(2)}pt;height:96pt`, 'front.strip' + i, 'strip'); });
  } else {
    // ---------- back ----------
    const X = 24, zP = [W - 96, 12, 84, 98.25], zA = [W - 243, 187.5, 240, 112.5], zB = [W - 342, 387, 342, 45];
    const LZ = W - 252 - 14, avail = LZ - X, top0 = 24, bot0 = 296;
    const ret = [].concat(b.returnAddress || b.address || []).flatMap(a => String(a).split('\n')).map(s => s.trim()).filter(Boolean).slice(0, 2);
    // the light mail panel (postage, return address, address block) and the barcode strip's panel; the amber edge strip runs across the top
    h += `<div class="mailp" style="left:${W - 252}pt;top:-9pt;width:${261}pt;height:${H + 18}pt"></div><div class="mailp" style="left:${zB[0] - 4}pt;top:386pt;width:${W - zB[0] + 4 + 9}pt;height:55pt"></div>`;
    h += `<div class="bnd" style="left:-9pt;top:-9pt;width:${W + 18}pt;height:15pt"></div>`;
    h += `<div class="abs mret" style="left:${zA[0]}pt;top:20pt;width:${zP[0] - 8 - zA[0]}pt;height:34pt;overflow:hidden" data-slot="return" data-lines="3">${b.brokerage ? '<b>' + esc(b.brokerage) + '</b>' : ''}${ret.map(r => '<br>' + esc(r)).join('')}</div>`;
    h += `<div class="abs dsp" style="left:${zA[0]}pt;top:70pt;width:${zP[0] - 10 - zA[0]}pt;height:70pt;font-size:32pt;line-height:34pt;color:var(--ink);letter-spacing:-1pt" data-slot="status" data-lines="2">${status[0]}<br><span style="color:var(--accent)">${status[1]}</span></div>`;
    h += `<div class="abs dsp" id="st" style="left:${zA[0]}pt;top:146pt;width:${zP[0] - 10 - zA[0]}pt;height:14pt;font-size:11pt;line-height:14pt;color:var(--ink);letter-spacing:0" data-slot="back.street" data-lines="1">${esc(L.address)}</div>`;
    h += `<div class="abs kicker" style="left:${zA[0]}pt;top:163pt;width:${zP[0] - 10 - zA[0]}pt;height:10pt;color:var(--accent)" data-slot="back.place" data-lines="1">${esc(AT.placeZip(L).toUpperCase())}</div>`;
    const slab = PC.slab || {};
    h += `<div class="slab" data-blk="1" style="left:${zP[0] - 12}pt;top:113pt;width:${W - zP[0] + 21}pt;padding:7pt 18pt 7pt 9pt"><div class="big" data-slot="slab.big" data-lines="2">${esc(slab.big || '')}</div><div class="sub" data-slot="slab.sub" data-lines="3">${esc(slab.sub || '')}</div></div>`;
    const cap = (c, x, y, w, slot, lines) => `<div class="abs cap2 bk" style="left:${x}pt;top:${y}pt;width:${w}pt"><div class="h" data-slot="${slot}.title" data-lines="1">${esc(c.t)}${c.dims ? `<i>${esc(c.dims)}</i>` : ''}</div><div class="a" data-slot="${slot}" data-para="1" data-min="2" data-lines="${lines}">${esc(big && c.a11 ? c.a11 : c.a)}</div></div>`;
    if(!sold){
      const bk = (PC.back || []).slice(0, big ? 3 : 2), g = 10, pw = (avail - g*(bk.length - 1))/bk.length, capH = 6 + 14 + 1 + 3*12, hd = 16, phh = bot0 - top0 - hd - capH;
      bk.forEach((c, i) => { const x = X + i*(pw + g);
        h += `<div class="abs sc" style="left:${x.toFixed(2)}pt;top:${top0 - 2}pt;width:${pw.toFixed(2)}pt;height:10pt" data-slot="back.head${i}" data-lines="1">${esc(c.head || '')}</div>`;
        h += AT.ph(D, c.id, `position:absolute;left:${x.toFixed(2)}pt;top:${top0 + hd}pt;width:${pw.toFixed(2)}pt;height:${phh.toFixed(2)}pt`, 'back.photo' + i, 'bp');
        h += cap(c, x.toFixed(2), top0 + hd + phh, pw.toFixed(2), 'back.cap' + i, 3); });
    } else {
      const ids = PC.photos || [], g = 10, pw = (avail - g)/2;
      const items = (big ? (PC.services11 || PC.services) : PC.services) || [], lh = big ? 15.5 : 14.5, nl = 3, ty = bot0 - nl*lh, sy = ty - 14 - 10 - 52 - 15, ph1 = sy - 12 - top0;
      ids.slice(0, 2).forEach((id, i) => { h += AT.ph(D, id, `position:absolute;left:${(X + i*(pw + g)).toFixed(2)}pt;top:${top0}pt;width:${pw.toFixed(2)}pt;height:${ph1}pt`, 'back.photo' + i, 'bp'); });
      h += `<div class="abs kicker" style="left:${X}pt;top:${sy}pt;width:${avail}pt;height:10pt" data-slot="sold.servicesLabel" data-lines="1">${esc(PC.servicesLabel || 'What I do for sellers')}</div>`;
      h += `<div class="abs svc" style="left:${X}pt;top:${sy + 15}pt;width:${avail}pt;height:52pt;display:grid;grid-template-columns:1fr 1fr;column-gap:14pt;row-gap:4pt;align-content:space-between">${items.map((s, i) => `<div class="it"><span class="bx"></span><span data-slot="sold.svc${i}" data-lines="${big ? 1 : 2}">${esc(s)}</span></div>`).join('')}</div>`;
      const my = sy + 15 + 52 + 10;
      h += `<div class="abs kicker" style="left:${X}pt;top:${my}pt;width:${avail}pt;height:10pt" data-slot="sold.meetLabel" data-lines="1">${esc(PC.meetLabel || 'When we meet')}</div>`;
            h += `<div class="abs ptxt jt" style="left:${X}pt;top:${ty}pt;width:${avail}pt;height:${nl*lh}pt;font-size:${big ? 11 : 10}pt;line-height:${lh}pt" data-slot="sold.meet" data-para="1" data-min="2" data-fillbox="1" data-nobal="1">${esc(big ? PC.meet11 : PC.meet9)}</div>`;
    }
    // the card: full width, under the address block and above the barcode strip
    const cardH = 80, cardY = zA[1] + zA[3] + 5, cw = W - 2*X;
    h = `<div class="tcol" style="left:-9pt;top:${cardY - 5}pt;width:${W + 18}pt;height:${H + 9 - cardY + 5}pt"></div>` + h;   // the tint runs under the card, edge to edge, to the bottom
    { const hs = AT.src(D, A.headshot) || (/^(file|https?|data):/.test(A.headshot || '') ? A.headshot : '');
      h += ContactCard.html([X, cardY, cw, cardH], Object.assign({}, A, {headshot: hs}), b, {postcard: true, fine: '', s: {inlineLabel: !hs || big, logo: {wide: [156, 36], square: [44, 44], tall: [46, 46]}}}); }
    const fine = [PCall.fineprint || 'Information deemed reliable but not guaranteed.', 'If your property is currently listed with a broker, please disregard this notice. It is not intended to solicit listed property.'].join(' ');
    h += `<div class="abs" style="left:${X}pt;top:${420 - 22.5}pt;width:${zB[0] - 10 - X}pt;height:22.5pt;font-size:6pt;line-height:7.5pt;color:var(--text);overflow:hidden;display:flex;align-items:flex-end" data-slot="fineprint" data-lines="3" data-fine="1"><span>${esc(fine)}</span></div>`;
    const V = D.mailVendor || {}, guide = (D.mode || 'email') !== 'print';
    if(guide) h += `<div class="mailg stamp" data-z="1" style="left:${zP[0]}pt;top:${zP[1]}pt;width:${zP[2]}pt;height:${zP[3]}pt">Postage<br><span style="text-transform:none">mail vendor</span></div>
      <div class="mailg" data-z="1" style="left:${zA[0]}pt;top:${zA[1]}pt;width:${zA[2]}pt;height:${zA[3]}pt">${[0,1,2,3].map(i => `<div class="aline" style="left:22pt;right:22pt;top:${24 + i*17.25}pt"></div>`).join('')}<div class="guide" style="left:22pt;top:97pt">${esc(V.name ? 'Address block · ' + V.name : 'Address block · mail vendor')}</div></div>
      <div class="mailg" data-z="1" style="left:${zB[0]}pt;top:${zB[1]}pt;width:${zB[2]}pt;height:${zB[3]}pt;border:.75pt dashed #aaa59a"><div class="guide" style="left:10pt;top:17pt">Barcode strip · keep clear</div></div>`;
    window.mailZones = {postage: zP, address: zA, barcode: zB};
  }

  const f = AT.frame(D, W, H, h);
  document.getElementById('pages').innerHTML = f.html;
  window.pieceSize = {W: f.W, H: f.H, bleed: f.bleed};
  await AT.settle();
  const fitLines = (el, lo) => { let s = parseFloat(getComputedStyle(el).fontSize)*72/96; while((AT.nLines(el) > 2 || el.scrollWidth > el.clientWidth + .5) && s > lo){ s -= .5; el.style.fontSize = s + 'pt'; } };
  const ad = document.getElementById('addr'); if(ad) fitLines(ad, 20);
  const hd = document.getElementById('head'); if(hd) AT.fitLine(hd, 40);
  const sk = document.getElementById('st'); if(sk) AT.fitLine(sk, 9);
  issues.push(...AT.fitHouse(D));
  AT.fitRow([...document.querySelectorAll('.cap2 .a')]);
  document.querySelectorAll('[data-para]:not([data-nobal])').forEach(el => AT.bal(el));
  if(window.mailZones){
    const sh = document.querySelector('.sheet').getBoundingClientRect(), P = r => ({l:(r.left - sh.left)/PT, r:(r.right - sh.left)/PT, t:(r.top - sh.top)/PT, b:(r.bottom - sh.top)/PT});
    const hit = (q, z) => q.l < z[0] + z[2] - .5 && q.r > z[0] + .5 && q.t < z[1] + z[3] - .5 && q.b > z[1] + .5;
    const els = [...document.querySelectorAll('.sheet *')].filter(e => !e.closest('[data-z]') && !e.closest('[data-contactcard]'));
    els.forEach(e => { const own = [...e.childNodes].some(n => n.nodeType === 3 && n.textContent.trim()), blk = e.matches('.ph,[data-blk],img');
      if(!own && !blk) return;
      let rects = [];
      if(own){ const rg = document.createRange(); rg.selectNodeContents(e); rects = [...rg.getClientRects()].filter(q => q.width > .5 && q.height > .5); } else rects = [e.getBoundingClientRect()];
      rects.forEach(q => { for(const k in window.mailZones) if(hit(P(q), window.mailZones[k])) issues.push({kind: own ? 'text-in-mail-zone' : 'image-in-mail-zone', slot:k, text:(e.textContent||'').trim().slice(0, 24)}); }); });
    { const cc = document.querySelector('[data-contactcard]'); if(cc){ const r = P(cc.getBoundingClientRect()); for(const k in window.mailZones) if(hit(r, window.mailZones[k])) issues.push({kind:'card-in-mail-zone', slot:k}); } }
  }
  { const caps = [...document.querySelectorAll('.cap2 .a')].map(c => AT.nLines(c));
    if(caps.length > 1 && Math.max(...caps) !== Math.min(...caps)) issues.push({slot:'captions', kind:'captions-uneven', lines:caps}); }
  ContactCard.fit(document);
  window.proofNotes = [{paragraphs: [...document.querySelectorAll('[data-para]')].map(el => { const ls = AT.lineBoxes(el), w = el.getBoundingClientRect().width, last = ls[ls.length-1];
    return {slot: el.dataset.slot, lines: ls.length, last: last ? Math.round((last.r - last.l)/w*100) : 0, chars: el.textContent.trim().length, wPt: Math.round(AT.pt(w))}; })}];
  window.photoPlacements = AT.placements;
  if(window.CapFit) (window.proofNotes = window.proofNotes || []).push({capFit: CapFit.run(((typeof D !== "undefined" && D.copy) || {}).extra)});
  window.brochureCheck = () => AT.checkSingle(D, issues);
})();
</script>
</body>
</html>
