<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · The Neighborhood Atlas postcard</title>
<link rel="stylesheet" href="atlas.css">
<script src="atlas.js"></script>
<script src="atlas-map.js"></script>
<!--
  The Neighborhood Atlas · Just Listed and Just Sold postcards. data.piece: card "listed" | "sold", size "6x9" (trim 648 x 432 pt)
  | "6x11" (trim 792 x 432 pt), side "front" | "back". Print adds 0.125 in (9 pt) bleed on every edge (TrimBox set by the renderer).

  Front: the whole house (roof to steps; the house box kept in frame) bleeds off the top and left. The status ("Just Listed" /
  "Just Sold") runs in the condensed headline face beside it, over the address, city, state and ZIP and the facts (Just Listed) or
  the invitation and the agent's name and number (Just Sold). A short write-up runs under the photo, and a strip of the real
  street map (OpenStreetMap data, credited) closes the card with the listing's pin and its neighbors named.
  Back (review of 10/29/2026: every postcard back carries the design across the whole card): a green band across the top (a thin
  edge strip runs on over the postage side) with the status, the address and the return address, and a green callout under the
  postage box. Just Listed: four captioned photos (two vertical, two horizontal; five on the 6 x 11) and a small nearby legend,
  no map. Just Sold: two interior photos with no captions, what the agent does for a seller and what the first meeting is like.
  Then the postcard contact card (templates/_shared/agentcard.js, postcard true), full width under the address block and above the
  barcode strip, which carries the back's one brokerage logo. Mail zones are the Just Listed library's (jllib.js zones(), px x
  0.75): postage, address block, barcode strip; guides on proofs, clear in print.
  No price, no QR, no photo numbers, no "virtually staged". Copy: data.copy.pc.jl / data.copy.pc.js.
-->
<style>
  .rc{display:flex;flex-direction:column;justify-content:space-between}
  .head{font-family:var(--font-display);font-weight:600;color:var(--accent);white-space:nowrap;overflow:hidden;letter-spacing:-.6pt}
  .pcs{display:flex;align-items:center;white-space:nowrap;overflow:hidden}
  .pcs .st{font-family:var(--font-display);font-weight:600;font-size:26pt;line-height:28pt;color:var(--accent);letter-spacing:-.2pt}
  .pcs .ln{flex:1;height:1pt;background:var(--accent);opacity:.35;margin:0 10pt;min-width:20pt}
  .pcs .ad{font:600 8.5pt/10pt var(--font-body);letter-spacing:1.3pt;text-transform:uppercase;color:var(--signal)}
  .pst div{font:600 10pt/13.5pt var(--font-body);color:var(--ink);white-space:nowrap}
  .pst div i{font-style:normal;color:var(--signal)}
  .ptxt2{font-size:10.5pt;line-height:15pt;color:var(--text);overflow:hidden}
  .stp{display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
  .stp .it{display:flex;gap:7pt;align-items:baseline;font:400 9.5pt/13pt var(--font-body);color:var(--ink)}
  .stp .bx{width:4.5pt;height:4.5pt;background:var(--signal);flex:none;transform:translateY(-1.5pt)}
  .stp .call{font-family:var(--font-display);font-weight:600;font-size:15pt;line-height:17pt;color:var(--accent);white-space:nowrap}
  .mini-idx{display:flex;flex-direction:column;overflow:hidden}
  .mini-idx .idx-row{gap:7pt;min-height:0}
  .mini-idx .idx-row .nm{font-size:9.5pt}
  .mini-idx .idx-row .ds{font-size:10pt}
  .mailg{position:absolute}
  .mailg .guide{position:absolute;font:600 6pt/1.4 var(--font-body);letter-spacing:.45pt;color:#9a958b;text-transform:uppercase;white-space:nowrap}
  .mailg.stamp{border:.75pt dashed #b9b4aa;text-align:center;padding-top:36pt;font:600 6pt/1.4 var(--font-body);letter-spacing:.45pt;color:#9a958b;text-transform:uppercase}
  .mailg .aline{position:absolute;height:.75pt;background:#d9d5cc}
  .bnd{position:absolute;background:var(--ink)}
  .bst{display:flex;align-items:center;white-space:nowrap;overflow:hidden;color:#f3f0e8}
  .bst .st{font-family:var(--font-display);font-weight:600;font-size:27pt;line-height:30pt;letter-spacing:-.2pt}
  .bst .ln{flex:1;height:1pt;background:#f3f0e8;opacity:.4;margin:0 10pt;min-width:12pt}
  .bst .ad{font:600 8.5pt/10pt var(--font-body);letter-spacing:1.3pt;text-transform:uppercase;color:#e9c9bd}
  .bst .ret{font:400 8pt/9.5pt var(--font-body);color:#f3f0e8;white-space:nowrap}
  .bst .ret b{font-weight:600;letter-spacing:.5pt;text-transform:uppercase}
  .bcap .h{font:600 8.5pt/11.5pt var(--font-body);color:var(--ink);white-space:nowrap;overflow:hidden;padding-top:6pt}
  .bcap .a{font-size:8.5pt;line-height:11.5pt;color:var(--text);overflow:hidden;text-wrap:balance}
  .slab{position:absolute;background:var(--ink);color:#f3f0e8;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
  .slab .big{font-family:var(--font-display);font-weight:600;font-size:17pt;line-height:18pt;letter-spacing:.6pt;text-transform:uppercase}
  .slab .sub{font:600 8pt/9.5pt var(--font-body);color:#e7e3d6;margin-top:4pt}
  .lgd{display:flex;flex-direction:column;overflow:hidden}
  .lgd .idx-row{gap:7pt;min-height:0}
  .lgd .idx-row .nm{font-size:9pt}
  .lgd .idx-row .ds{font-size:9.5pt}
  .svc{display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
  .svc .it{display:flex;gap:6pt;align-items:baseline;font:400 9pt/11.5pt var(--font-body);color:var(--ink)}
  .svc .bx{width:4pt;height:4pt;background:var(--signal);flex:none;transform:translateY(-1.5pt)}
  .jt{text-align:justify;text-align-last:left;hyphens:none}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const D = AT.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="color:#fff;padding:20pt">No data injected.</p>'; return; }
  const esc = AT.esc, L = D.listing, A = D.agent || {}, b = D.brand || {};
  const issues = await AT.fontsReady(D);
  const sold = D.piece.card === 'sold', big = D.piece.size === '6x11', front = D.piece.side === 'front';
  const PCall = ((D.copy || {}).pc || {}), PC = (sold ? PCall.js : PCall.jl) || {};
  document.body.dataset.mode = D.mode || 'email';
  const PT = 96/72, W = big ? 792 : 648, H = 432, M = 27, status = sold ? 'Just Sold' : 'Just Listed';
  const hero = PC.hero || 'front';
  let h = '';

  if(front){
    // ---------- front ----------
    const xR = big ? 497 : 420, ph = 261, cx = xR + 18, cw = W - M - cx, S = big ? (sold ? 76 : 64) : 62, LH = big ? (sold ? 68 : 57) : 56;
    h += AT.photo(D, hero, `position:absolute;left:-9pt;top:-9pt;width:${xR + 9}pt;height:${ph}pt`, 'front.hero', 'hero');
    const AL = big ? 31 : 27;
    let bottom;
    if(!sold){
      const st = AT.stats(L);
      bottom = `<div class="pst">${st.slice(0, 4).map((t, i) => `<div data-slot="stat${i}" data-lines="1">${esc(t)}</div>`).join('')}</div>`;
    } else {
      bottom = `<div><div class="dsp" style="font-size:19pt;line-height:21pt;color:var(--accent)" data-slot="sold.cta" data-lines="2">${esc(PC.cta1 || 'Thinking of selling?')}<br>${esc(PC.cta2 || 'Let’s talk.')}</div>
        <div class="dsp" id="agname" style="margin-top:8pt;font-size:19pt;line-height:22pt" data-slot="agent.name" data-lines="1">${esc(A.name || '')}</div>
        <div style="font:700 14pt/17pt var(--font-body);color:var(--ink);letter-spacing:.3pt;white-space:nowrap;overflow:hidden;margin-top:1pt" data-slot="agent.phone" data-lines="1">${esc(A.phone || '')}</div></div>`;
    }
    const nrc = sold ? (big ? 292 : 294) : 242;
    h += `<div class="abs rc" style="left:${cx}pt;top:10pt;width:${cw}pt;height:${nrc}pt">
      <div><div class="head" id="head" style="margin-left:-2pt;height:${2*LH}pt;font-size:${S}pt;line-height:${LH}pt" data-slot="status" data-lines="2">${esc(status.split(' ')[0])}<br>${esc(status.split(' ')[1])}</div>
        <div style="height:1pt;background:var(--accent);opacity:.55;margin-top:${sold ? 8 : 6}pt"></div></div>
      <div><div class="dsp" id="addr" style="margin-left:-1pt;font-size:${big ? 29 : 25.5}pt;line-height:${AL}pt;white-space:normal;height:auto" data-slot="address" data-lines="2">${esc(L.address)}</div>
        <div class="kicker" style="margin-top:7pt;height:10pt" data-slot="place" data-lines="1">${esc(AT.placeZip(L).toUpperCase())}</div></div>
      ${bottom}</div>`;
    // the write-up under the photo: Just Listed runs the full width of the map below it, Just Sold lines up with the photo's right
    // edge and the map's left edge, fully justified
    const tw = sold ? xR - M : W - 2*M, tt = ph - 9 + 8;
    const flh = sold ? 15 : 16;
    h += `<div class="abs ptxt2 jt" style="left:${M}pt;top:${tt}pt;width:${tw}pt;height:${3*flh + 1}pt${sold ? '' : ';font-size:11.5pt;line-height:16pt'}" data-slot="front.about" data-para="1" data-min="3" data-fillbox="1" data-nobal="1">${esc(big ? PC.front11 : PC.front9)}</div>`;
    // the map strip: the listing's pin and its closest neighbors named
    h += AT.mapBox('map', M, 316, W - 2*M, 86, PC.stripExtras || PC.extras || [], true, true);
    h += `<div class="abs fine" style="left:${M}pt;top:405pt;width:${W - 2*M}pt;height:8pt;white-space:nowrap" data-slot="credit" data-fine="1" data-lines="1">Street map drawn from OpenStreetMap data. North is up. © OpenStreetMap contributors</div>`;
  } else {
    // ---------- back ----------
    // the design runs across the whole back. Mail zones are the Just Listed library's (jllib.js zones(), px x 0.75)
    const X = 24, zP = [W - 96, 12, 84, 98.25], zA = [W - 243, 187.5, 240, 112.5], zB = [W - 342, 387, 342, 45];
    const LZ = zA[0] - 10, bandR = zP[0] - 12, rW = bandR - zA[0];   // the left zone's right edge; the band's right end; the width beside the address block
    const ret = [].concat(b.returnAddress || b.address || []).flatMap(a => String(a).split('\n')).map(s => s.trim()).filter(Boolean).slice(0, 2);
    const short = String(L.address || '');
    // the band: a green strip along the whole top edge, widening to the band where the postage box is not
    h += `<div class="bnd" data-blk="1" style="left:-9pt;top:-9pt;width:${W + 18}pt;height:15pt"></div><div class="bnd" data-blk="1" style="left:-9pt;top:-9pt;width:${bandR + 9}pt;height:53pt"></div>`;
    h += `<div class="abs bst" style="left:${X}pt;top:7pt;width:${bandR - X - 14}pt;height:32pt" data-slot="status" data-lines="1"><span class="st">${esc(status)}</span><span class="ln"></span><span class="ad">${esc(short)}</span>
      <span class="ln" style="max-width:30pt"></span><span class="ret">${b.brokerage ? '<b>' + esc(b.brokerage) + '</b>' : ''}${ret.map(r => '<br>' + esc(r)).join('')}</span></div>`;
    const cap = (c, x, y, w, slot) => `<div class="abs bcap" style="left:${x}pt;top:${y}pt;width:${w}pt"><div class="h" data-slot="${slot}.title" data-lines="1">${esc(c.t)}</div><div class="a" data-slot="${slot}" data-para="1" data-min="2" data-lines="3" data-nobal="1">${esc(c.a)}</div></div>`;
    const pTop = 54;
    let slab, legendTop = 257;
    if(!sold){
      // four captioned photos in the left zone (vertical, horizontal, vertical, and a fourth horizontal on the 6 x 11) and one beside the address block
      const bk = (PC.back || []), rowItems = bk.filter(c => !c.r).slice(0, big ? 4 : 3), rItem = bk.find(c => c.r);
      const ratio = i => (i % 2 === 0 ? 0.8 : 1.3), gap = 9, avail = LZ - X;
      const RH = (avail - (rowItems.length - 1)*gap) / rowItems.reduce((s, c, i) => s + ratio(i), 0);
      let x = X;
      rowItems.forEach((c, i) => { const w = RH*ratio(i);
        h += AT.photo(D, c.id, `position:absolute;left:${x.toFixed(2)}pt;top:${pTop}pt;width:${w.toFixed(2)}pt;height:${RH.toFixed(2)}pt`, 'back.photo' + i, 'bp');
        h += cap(c, x.toFixed(2), pTop + RH, w, 'back.cap' + i); x += w + gap; });
      if(rItem){ const ph2 = 79;
        h += AT.photo(D, rItem.id, `position:absolute;left:${zA[0]}pt;top:${pTop}pt;width:${rW}pt;height:${ph2}pt`, 'back.photoR', 'bp');
        h += cap(rItem, zA[0], pTop + ph2, rW, 'back.capR'); }
      // the small nearby legend closes the left zone
      h += `<div class="abs kicker" style="left:${X}pt;top:${legendTop - 13}pt;width:${avail}pt;height:10pt" data-slot="legend.label" data-lines="1">Nearby</div>`;
      h += `<div class="abs lgd" style="left:${X}pt;top:${legendTop}pt;width:${avail}pt;height:${300 - legendTop - 1}pt">${AT.indexRowsHTML(D, 'index')}</div>`;
      slab = PC.slab || {};
    } else {
      // two interior photos, no captions; then what the agent does for a seller and what the first meeting is like
      const ids = PC.photos || [], avail = LZ - X, gap = 10, pw = (avail - gap)/2, ph1 = 124;
      ids.slice(0, 2).forEach((id, i) => { h += AT.photo(D, id, `position:absolute;left:${(X + i*(pw + gap)).toFixed(2)}pt;top:${pTop}pt;width:${pw.toFixed(2)}pt;height:${ph1}pt`, 'back.photo' + i, 'bp'); });
      const items = PC.services || [];
      h += `<div class="abs kicker" style="left:${zA[0]}pt;top:${pTop}pt;width:${rW}pt;height:10pt" data-slot="sold.servicesLabel" data-lines="1">${esc(PC.servicesLabel || 'What I do for sellers')}</div>`;
      h += `<div class="abs svc" style="left:${zA[0]}pt;top:${pTop + 16}pt;width:${rW}pt;height:${182 - pTop - 16}pt">${items.map((s, i) => `<div class="it"><span class="bx"></span><span data-slot="sold.svc${i}" data-lines="3">${esc(s)}</span></div>`).join('')}</div>`;
      const my = pTop + ph1 + 10;
      h += `<div class="abs kicker" style="left:${X}pt;top:${my}pt;width:${avail}pt;height:10pt" data-slot="sold.meetLabel" data-lines="1">${esc(PC.meetLabel || 'When we meet')}</div>`;
      const lh = 16, ty = my + 15, nl = 3;
      h += `<div class="abs ptxt jt" style="left:${X}pt;top:${ty}pt;width:${avail}pt;height:${nl*lh}pt;font-size:11pt;line-height:${lh}pt" data-slot="sold.meet" data-para="1" data-min="2" data-fillbox="1" data-nobal="1">${esc(big ? PC.meet11 : PC.meet9)}</div>`;
      h += `<div class="abs dsp" style="left:${X}pt;top:${ty + nl*lh + 12}pt;width:${avail}pt;height:24pt;font-size:19pt;line-height:24pt;color:var(--accent)" data-slot="sold.call" data-lines="1">${esc(PC.call || 'Call or text me anytime.')}</div>`;
      slab = PC.slab || {};
    }
    // the callout under the postage box, bleeding off the right edge
    h += `<div class="slab" data-blk="1" style="left:${zP[0]}pt;top:116pt;width:${W - zP[0] + 9}pt;height:68pt;padding:6pt ${9 + 9}pt 6pt 9pt"><div class="big" data-slot="slab.big" data-lines="2">${esc(slab.big || '')}</div><div class="sub" data-slot="slab.sub" data-lines="3">${esc(slab.sub || '')}</div></div>`;
    // the card: full width, under the address block and above the barcode strip
    const cardH = 80, cardY = zA[1] + zA[3] + 5, cw = W - 2*X;
    { const hs = AT.src(D, A.headshot) || (/^(file|https?|data):/.test(A.headshot || '') ? A.headshot : '');
      h += ContactCard.html([X, cardY, cw, cardH], Object.assign({}, A, {headshot: hs}), b, {postcard: true, fine: '', s: {inlineLabel: !hs || big, logo: {wide: [156, 36], square: [44, 44], tall: [46, 46]}}}); }
    const fine = [PCall.fineprint || 'Information deemed reliable but not guaranteed.', 'If your property is currently listed with a broker, please disregard this notice. It is not intended to solicit listed property.'].join(' ');
    const fineW = zB[0] - 10 - X;
    h += `<div class="abs" style="left:${X}pt;top:${420 - 22.5}pt;width:${fineW}pt;height:22.5pt;font-size:6pt;line-height:7.5pt;color:var(--ink);opacity:.75;overflow:hidden;display:flex;align-items:flex-end" data-slot="fineprint" data-lines="3" data-fine="1"><span>${esc(fine)}</span></div>`;
    // mail zones: drawn as guides on proofs, left clear in print
    const V = D.mailVendor || {}, guide = (D.mode || 'email') !== 'print';
    if(guide) h += `<div class="mailg stamp" data-z="1" style="left:${zP[0]}pt;top:${zP[1]}pt;width:${zP[2]}pt;height:${zP[3]}pt">Postage<br><span style="text-transform:none">mail vendor</span></div>
      <div class="mailg" data-z="1" style="left:${zA[0]}pt;top:${zA[1]}pt;width:${zA[2]}pt;height:${zA[3]}pt">${[0,1,2,3].map(i => `<div class="aline" style="left:22pt;right:22pt;top:${24 + i*17.25}pt"></div>`).join('')}<div class="guide" style="left:22pt;top:97pt">${esc(V.name ? 'Address block · ' + V.name : 'Address block · mail vendor')}</div></div>
      <div class="mailg" data-z="1" style="left:${zB[0]}pt;top:${zB[1]}pt;width:${zB[2]}pt;height:${zB[3]}pt;border:.75pt dashed #c9c5bb"><div class="guide" style="left:10pt;top:17pt">Barcode strip · keep clear</div></div>`;
    window.mailZones = {postage: zP, address: zA, barcode: zB};
  }

  const f = AT.frame(D, W, H, h);
  document.getElementById('pages').innerHTML = f.html;
  window.pieceSize = {W: f.W, H: f.H, bleed: f.bleed};
  await AT.settle();
  const fitLines = (el, lo) => { let s = parseFloat(getComputedStyle(el).fontSize)*72/96; while((AT.lines(el) > 2 || el.scrollWidth > el.clientWidth + .5) && s > lo){ s -= .5; el.style.fontSize = s + 'pt'; } };
  const ad = document.getElementById('addr'); if(ad) fitLines(ad, 20);
  const hd = document.getElementById('head'); if(hd) AT.fitLine(hd, 40);
  const an = document.getElementById('agname'); if(an) AT.fitLine(an, 14);
  issues.push(...AT.drawMaps(D));
  issues.push(...AT.fitHouse(D));
  document.querySelectorAll('[data-para]:not([data-nobal])').forEach(el => AT.balance(el));
  if(window.mailZones){   // nothing prints in the postage box, the address block or the barcode strip; captions in the back's photo rows run the same number of lines
    const sh = document.querySelector('.sheet').getBoundingClientRect(), P = r => ({l:(r.left - sh.left)/PT, r:(r.right - sh.left)/PT, t:(r.top - sh.top)/PT, b:(r.bottom - sh.top)/PT});
    const hit = (q, z) => q.l < z[0] + z[2] - .5 && q.r > z[0] + .5 && q.t < z[1] + z[3] - .5 && q.b > z[1] + .5;
    const els = [...document.querySelectorAll('.sheet *')].filter(e => !e.closest('[data-z]') && !e.closest('[data-contactcard]'));
    els.forEach(e => { const own = [...e.childNodes].some(n => n.nodeType === 3 && n.textContent.trim()), blk = e.matches('.ph,[data-blk],img');
      if(!own && !blk) return;
      let rects = [];
      if(own){ const rg = document.createRange(); rg.selectNodeContents(e); rects = [...rg.getClientRects()].filter(q => q.width > .5 && q.height > .5); } else rects = [e.getBoundingClientRect()];
      rects.forEach(q => { for(const k in window.mailZones) if(hit(P(q), window.mailZones[k])) issues.push({kind: own ? 'text-in-mail-zone' : 'image-in-mail-zone', slot:k, text:(e.textContent||'').trim().slice(0, 24)}); }); });
    { const cc = document.querySelector('[data-contactcard]'); if(cc){ const r = P(cc.getBoundingClientRect()); for(const k in window.mailZones) if(hit(r, window.mailZones[k])) issues.push({kind:'card-in-mail-zone', slot:k}); } }
    const caps = [...document.querySelectorAll('.bcap .a')].map(c => AT.lines(c));
    if(caps.length > 1 && Math.max(...caps) !== Math.min(...caps)) issues.push({slot:'back captions', kind:'captions-uneven', lines:caps});
  }
  ContactCard.fit(document);
  window.proofNotes = [{paragraphs: [...document.querySelectorAll('[data-para]')].map(el => { const ls = AT.lineBoxes(el), w = el.getBoundingClientRect().width, last = ls[ls.length-1];
    return {slot: el.dataset.slot, lines: ls.length, last: last ? Math.round((last.r - last.l)/w*100) : 0, chars: el.textContent.trim().length, wPt: Math.round(AT.pt(w))}; })}];
  window.photoPlacements = AT.placements;
  window.brochureCheck = () => AT.checkSingle(D, issues);
})();
</script>
</body>
</html>
