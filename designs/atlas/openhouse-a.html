<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · The Neighborhood Atlas open house flyer · Map Below</title>
<link rel="stylesheet" href="atlas.css">
<script src="atlas.js"></script>
<script src="atlas-map.js"></script>
<script src="atlas-mapdata.js"></script>
<script src="../engine/ivory.js"></script>
<!--
  The Neighborhood Atlas · Open House flyer a "Map Below" (trim 612 x 792 pt; print: 0.25 in white margin around the paper field).
  The event leads: the label (22 pt tracked caps), the date in the condensed headline face as the largest type on the page, the
  time at 26 pt, and the broker / REALTOR(R) lines (only on those opens, only when filled) beside it in a white event box with a
  thin red border, set at 12 pt (The owner 10/30; Ivory.eventBox, the agent resizes it with openHouse.box.w). Then the whole house, the
  address with the facts stacked beside it, and the Atlas's own street map with a short write-up beside it. The standard contact
  card (templates/_shared/agentcard.js) closes the page and carries its one brokerage logo.
  Open House rules (templates/_shared/ohstandard.js): city, state and ZIP under the street, no RSVP, no QR, no price.
  The street map is drawn from OpenStreetMap data and credited on the piece. Copy: data.copy.pc.oh.a.
-->
<style>
  .oh-date{font-family:var(--font-display);font-weight:600;color:var(--accent);white-space:nowrap;overflow:hidden;letter-spacing:-.4pt}
  .evb{font:600 12pt/16pt var(--font-body);color:var(--ink);text-align:left;letter-spacing:.1pt}
  .evb.b{font-weight:700}
  .stk div{font:600 9.5pt/13pt var(--font-body);color:var(--ink);white-space:nowrap;letter-spacing:.1pt;text-align:right}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
window.brochureReady = (async function(){
  const PS = a => String(a || '').replace(/\s+Street(?=\s*(,|$|\s+(Unit|Apt|#|Suite)\b))/i, '').trim();   // print address rule (The owner 10/30): no "Street"
  const D = AT.data();
  if(!D.listing){ document.getElementById('pages').innerHTML = '<p style="color:#fff;padding:20pt">No data injected.</p>'; return; }
  const esc = AT.esc, L = D.listing, b = D.brand || {}, PC = ((D.copy || {}).pc || {}), OHC = (PC.oh || {}).a || {};
  const issues = await AT.fontsReady(D);
  document.body.dataset.mode = D.mode || 'email';
  const O = AT.openHouse(D);
  const hero = (OHC.photos || [])[0] || 'front';
  const X = 36, W = 540;
  let h = '';

  // the event
  h += `<div class="abs oh-lbl" style="left:${X}pt;top:28pt;width:${W}pt;height:26pt" data-slot="oh.label" data-lines="1">${esc(O.label)}</div>`;
  if(O.weekday) h += `<div class="abs oh-date" id="date" style="left:${X-1}pt;top:54pt;width:${W}pt;height:58pt;font-size:56pt;line-height:58pt" data-slot="oh.date" data-lines="1">${esc(O.long)}</div>`;
  else h += `<div class="abs oh-date" style="left:${X}pt;top:56pt;width:${W}pt;height:64pt;font-size:34pt;line-height:32pt;white-space:normal" data-slot="oh.date" data-lines="2">${esc(O.long)}</div>`;
  let rY = 160, tt = 122;   // the event box (white, thin red border) sits right of the time; the photo gives up the height it needs
  { const ls = [[O.note, 'oh.note', 'evb b'], [O.refreshments, 'oh.refreshments', 'evb']], sc = ((D.openHouse || {}).box || {}).w;
    const o = {bg: '#fff', line: 'var(--signal)', lineW: 1, padX: 12, padY: 8, scale: sc, anchor: 1};
    const pre = Ivory.eventBox(ls, 290, 0, 286, 16, 2, o);
    if(pre.h){ const top = 116; rY = Math.max(rY, top + pre.h + 8); tt = top + Math.max(0, (pre.h - 32)/2) - 2;
      h += Ivory.eventBox(ls, 290, top, 286, 16, 2, o).html; } }
  h += `<div class="abs oh-time" style="left:${X}pt;top:${tt}pt;width:250pt;height:32pt" data-slot="oh.time" data-lines="1">${esc(O.time)}</div>`;
  h += `<div class="hrule" style="top:${rY}pt;left:${X}pt;right:${X}pt"></div>`;

  // the house, address and facts (the whole block rides on where the photo ends, HB)
  const HB = 468, hy = rY + 8;
  h += AT.photo(D, hero, `position:absolute;left:${X}pt;top:${hy}pt;width:${W}pt;height:${HB - hy}pt`, 'oh.hero', 'hero');
  h += `<div class="abs kicker" style="left:${X}pt;top:${HB + 11}pt;width:380pt;height:10pt" data-slot="place" data-lines="1">${esc([L.neighborhood, AT.placeZip(L)].filter(Boolean).join(' · ').toUpperCase())}</div>`;
  h += `<div class="abs dsp" id="addr" style="left:${X-1}pt;top:${HB + 24}pt;width:370pt;height:46pt;font-size:38pt;line-height:46pt" data-slot="address" data-lines="1">${esc(PS(L.address))}</div>`;
  h += `<div class="abs stk" style="left:420pt;top:${HB + 18}pt;width:156pt;height:56pt"><div data-slot="oh.facts0" data-lines="1">${esc(AT.stats(L)[0])}</div><div data-slot="oh.facts1" data-lines="1">${esc(AT.stats(L)[1])}</div><div data-slot="oh.facts2" data-lines="1">${esc(AT.stats(L)[2])}</div><div data-slot="oh.facts3" data-lines="1">${esc(AT.stats(L)[3] || AT.fifth(L))}</div></div>`;
  h += `<div class="hrule" style="top:${HB + 80}pt;left:${X}pt;right:${X}pt"></div>`;

  // the write-up and the street map
  h += `<div class="abs ptxt" id="blurb" style="left:${X}pt;top:${HB + 90}pt;width:262pt;height:${646 - HB - 90}pt;font-size:10pt;line-height:14.4pt" data-slot="oh.blurb" data-para="1" data-min="6" data-fillbox="1">${esc(OHC.text || '')}</div>`;
  h += AT.mapBox('map', 314, HB + 90, 262, 646 - HB - 90, OHC.extras || [], true, true, true).replace('class="mapbox abs"', 'class="mapbox abs" data-wide="1"');   // zoomed out with more places named (owner 11/2)
  h += `<div class="abs fine" style="left:314pt;top:649pt;width:262pt;height:8pt;white-space:nowrap;text-align:right" data-slot="oh.credit" data-fine="1" data-lines="1">Street map drawn from OpenStreetMap data. © OpenStreetMap contributors</div>`;

  h += AT.cardBox(D, [X, 662, W, 94], {layout: 'panel'});
  h += `<div class="abs fine" style="left:${X}pt;top:764pt;width:${W}pt;height:8pt;white-space:nowrap" data-slot="fineprint" data-lines="1" data-fine="1">${esc(PC.fineprint || 'Information deemed reliable but not guaranteed.')}</div>`;

  const f = AT.frame(D, 612, 792, h);
  document.getElementById('pages').innerHTML = f.html;
  window.pieceSize = {W: f.W, H: f.H, bleed: f.bleed};
  await AT.settle();
  document.querySelectorAll('#date').forEach(el => AT.fitLine(el, 40));
  AT.fitLine(document.getElementById('addr'), 28);
  issues.push(...AT.drawMaps(D));
  issues.push(...AT.fitHouse(D));
  document.querySelectorAll('[data-para]').forEach(el => AT.balance(el));
  ContactCard.fit(document);
  window.photoPlacements = AT.placements;
  window.brochureCheck = () => AT.checkSingle(D, issues);
})();
</script>
</body>
</html>
